name: 296 model startup and USB daemon native port preflight
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-family-preflight-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  driver-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
        persist-credentials: false
    - name: Reserve disk and install hosted native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 0ec6cbae2d85fd98f2e0894697de7869f6159f51

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        mkdir "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y g++ capnproto libcapnp-dev pkg-config liblzma-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Compile all native driver targets before execution
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --locked --no-run
        --lib --test driver_daemon_check --test driver_daemon_no_collector --test model_startup_check --test usbgpu_daemon_check
        --bin check-model-startup --bin check-usbgpu-daemon --test driver_daemon_fixture --test driver_daemon_retirement --bin
        check-driver-daemon --bin stage-driver-daemon-fixture > "$proof/compile.stdout" 2> "$proof/compile.stderr" || { tail
        -n 100 "$proof/compile.stderr"; exit 1; }

        '
    - name: Verify changed model family unit regressions without traffic
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-fixture-preflight\"\nfor filter in model_family_process:: model_startup_check::\
        \ usbgpu_daemon_check::; do\n  rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 512\n  label=\"\
        ${filter//:/}\"\n  cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native\
        \ --locked --lib \"$filter\" -- --nocapture > \"$proof/$label.stdout\" 2> \"$proof/$label.stderr\" || { cat \"$proof/$label.stderr\"\
        \ \"$proof/$label.stdout\"; exit 1; }\ndone\n"
    - name: Strict lint all registered driver targets
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --locked --lib
        --test driver_daemon_check --test driver_daemon_no_collector --test model_startup_check --test usbgpu_daemon_check
        --bin check-model-startup --bin check-usbgpu-daemon --test driver_daemon_fixture --test driver_daemon_retirement --bin
        check-driver-daemon --bin stage-driver-daemon-fixture -- -D warnings > "$proof/clippy.stdout" 2> "$proof/clippy.stderr"
        || { tail -n 120 "$proof/clippy.stderr"; exit 1; }

        '
    - name: Verify maintained workflow and disk policy integration
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test ci_disk_bootstrap
        --test ci_workflow_policy --locked -- --nocapture > "$proof/ci-policy.stdout" 2> "$proof/ci-policy.stderr" || { tail
        -n 100 "$proof/ci-policy.stdout" "$proof/ci-policy.stderr"; exit 1; }

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-model-family-preflight-296
        path: ${{ runner.temp }}/driver-fixture-preflight/
        if-no-files-found: error
        retention-days: 5
