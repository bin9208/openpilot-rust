name: 'loggerd diagnostics and pipeline admission #296 (NEXT bin-actions)'
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/loggerd-controllers-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: loggerd-controllers-296-once
  cancel-in-progress: false
jobs:
  controllers:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 75
    env:
      SOURCE_SHA: 77100d33ce4d1202853bd6bf3597a0fc2014c590
      RUSTUP_TOOLCHAIN: 1.94.0
      LOGGERD_CONTROLLERS_JOB: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}
      LOGGERD_GATE_B64: 
      LOGGERD_GATE_SHA256: c797a418a68b1e22f2f936473bdc51720d8c434933af64ae5ccf063fbebf42d0
      LOGGERD_SCRIPT_B64: 
      LOGGERD_SCRIPT_SHA256: a22a8a938e695e22ca044a210c560b7a7da3255bced303383909c60c76bb4154
      LOGGERD_CONFIG_B64: 
      LOGGERD_CONFIG_SHA256: 8d8f7087f5bbf143f08fafa0a5244e0f9be7d8004b2de8e0cb605781ed2144ef
      LOGGERD_CONTROLLERS_SOURCE_ROOT: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt
        }}/work/source
      HOME: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/home
      CARGO_HOME: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/cargo-home
      RUSTUP_HOME: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/rustup-home
      TMPDIR: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/tmp
      XDG_CACHE_HOME: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/xdg-cache
      CCACHE_DIR: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/ccache
      SCCACHE_DIR: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/sccache
      GIT_CONFIG_GLOBAL: ${{ runner.temp }}/loggerd-controllers-296-${{ github.run_id }}-${{ github.run_attempt }}/work/gitconfig
      GIT_CONFIG_NOSYSTEM: '1'
    defaults:
      run:
        shell: bash
    steps:
    - name: Create exclusive per-run job storage and verify frozen payloads
      run: "set -euo pipefail\n[[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_NAME == bin-actions\
        \ && $RUNNER_ARCH == X64 ]]\n[[ ! -e $LOGGERD_CONTROLLERS_JOB && ! -L $LOGGERD_CONTROLLERS_JOB ]]\n/usr/bin/python3\
        \ -I -B - <<'PY'\nimport base64,hashlib,json,os,pathlib,stat\njob=pathlib.Path(os.environ[\"LOGGERD_CONTROLLERS_JOB\"\
        ])\nassert job.parent.resolve()==pathlib.Path(os.environ[\"RUNNER_TEMP\"]).resolve()\njob.mkdir(mode=0o700);work=job/\"\
        work\";work.mkdir(mode=0o700)\nfor leaf in (\"home\",\"cargo-home\",\"rustup-home\",\"tmp\",\"xdg-cache\",\"ccache\"\
        ,\"sccache\"): (work/leaf).mkdir(mode=0o700)\n(job/\"evidence\").mkdir()\nmeta=work.stat()\n(job/\"ownership.json\"\
        ).write_text(json.dumps({\"job\":str(job.resolve()),\"work\":str(work.resolve()),\"device\":meta.st_dev,\"inode\"\
        :meta.st_ino,\"run_id\":os.environ[\"GITHUB_RUN_ID\"],\"attempt\":os.environ[\"GITHUB_RUN_ATTEMPT\"]},indent=2)+\"\
        \\n\")\nfor stem,name in ((\"GATE\",\"hosted_gate.py\"),(\"SCRIPT\",\"loggerd-controllers-hosted.sh\"),(\"CONFIG\"\
        ,\"config.json\")):\n    data=base64.b64decode(os.environ[\"LOGGERD_\"+stem+\"_B64\"],validate=True)\n    assert hashlib.sha256(data).hexdigest()==os.environ[\"\
        LOGGERD_\"+stem+\"_SHA256\"]\n    (job/name).write_bytes(data)\n(job/\"context.json\").write_text(json.dumps({k:os.environ.get(k)\
        \ for k in (\"SOURCE_SHA\",\"GITHUB_SHA\",\"GITHUB_RUN_ID\",\"GITHUB_RUN_ATTEMPT\",\"GITHUB_REPOSITORY\",\"RUNNER_NAME\"\
        ,\"RUNNER_ENVIRONMENT\",\"RUNNER_ARCH\",\"RUNNER_OS\",\"ImageOS\",\"ImageVersion\")},indent=2)+\"\\n\")\nPY\n/usr/bin/python3\
        \ -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources bootstrap 0"
    - name: Fetch exact combined source into owned isolated checkout
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        for tool in git gh g++ clang capnp pkg-config ffmpeg ffprobe strace ldd rustup cargo; do command -v "$tool"; done
        > "$LOGGERD_CONTROLLERS_JOB/tool-paths.txt"

        unset GIT_TRACE GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE_PACKET GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_DIR GIT_WORK_TREE
        GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" resources source-fetch 8192

        [[ ! -e $LOGGERD_CONTROLLERS_SOURCE_ROOT && ! -L $LOGGERD_CONTROLLERS_SOURCE_ROOT ]]

        git init --quiet "$LOGGERD_CONTROLLERS_SOURCE_ROOT"

        auth_header=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)

        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic
        $auth_header" git -C "$LOGGERD_CONTROLLERS_SOURCE_ROOT" fetch --no-tags --depth=1 https://github.com/bin9208/openpilot-rust.git
        "$SOURCE_SHA"

        unset auth_header

        git -C "$LOGGERD_CONTROLLERS_SOURCE_ROOT" checkout --quiet --detach FETCH_HEAD

        [[ $(git -C "$LOGGERD_CONTROLLERS_SOURCE_ROOT" rev-parse HEAD) == "$SOURCE_SHA" ]]

        [[ -z $(git -C "$LOGGERD_CONTROLLERS_SOURCE_ROOT" status --porcelain --untracked-files=normal) ]]

        [[ ! -e $LOGGERD_CONTROLLERS_SOURCE_ROOT/rust/target && ! -L $LOGGERD_CONTROLLERS_SOURCE_ROOT/rust/target ]]'
    - name: Bind actual runner22 and authenticate independent original/source/workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" resources original-copy 1024

        gh api -H "Cache-Control: no-cache" "repos/bin9208/openpilot-rust/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
        > "$LOGGERD_CONTROLLERS_JOB/runner-jobs-api.json"

        gh api -H "Cache-Control: no-cache" repos/bin9208/openpilot-rust/actions/artifacts/12432287942 > "$LOGGERD_CONTROLLERS_JOB/original-metadata.json"

        gh api -H "Cache-Control: no-cache" repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > "$LOGGERD_CONTROLLERS_JOB/original.zip"

        gh api -H "Cache-Control: no-cache" "repos/bin9208/openpilot-rust/commits/$SOURCE_SHA" > "$LOGGERD_CONTROLLERS_JOB/source-api.json"

        gh api -H "Cache-Control: no-cache" "repos/bin9208/openpilot-rust/contents/.github/workflows/loggerd-controllers-296-once.yml?ref=$GITHUB_SHA"
        > "$LOGGERD_CONTROLLERS_JOB/workflow-api.json"

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" authenticate'
    - name: Record existing OS providers and install job-private Rust 1.94
      timeout-minutes: 15
      run: 'set -euo pipefail

        # Persistent host: require installed OS providers; no system package mutation.

        if dpkg-query -W g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev libzstd-dev
        libyuv-dev libzmq5 ffmpeg strace binutils > "$LOGGERD_CONTROLLERS_JOB/packages.tsv" 2> "$LOGGERD_CONTROLLERS_JOB/package-query.stderr";
        then package_status=0; else package_status=$?; fi

        printf "%s\n" "$package_status" > "$LOGGERD_CONTROLLERS_JOB/package-query-exit.txt"

        pkg-config --modversion libavcodec libavformat libavutil capnp libzstd > "$LOGGERD_CONTROLLERS_JOB/provider-versions.txt"

        uname -a > "$LOGGERD_CONTROLLERS_JOB/kernel.txt"

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" resources toolchain-install 2048

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 --version > "$LOGGERD_CONTROLLERS_JOB/rustc-version.txt"

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" resources after-toolchain 0'
    - name: Compile focused candidate, lifecycle, sealed replay and two actual native controllers
      timeout-minutes: 50
      run: 'set -euo pipefail

        bash "$LOGGERD_CONTROLLERS_JOB/loggerd-controllers-hosted.sh" > "$LOGGERD_CONTROLLERS_JOB/recipe.stdout" 2> "$LOGGERD_CONTROLLERS_JOB/recipe.stderr"'
    - name: Always seal bounded complete raw diagnostics
      if: ${{ always() }}
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" resources before-pack 1024

        /usr/bin/python3 -I -B "$LOGGERD_CONTROLLERS_JOB/hosted_gate.py" pack'
    - uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: loggerd-controllers-296-bin-actions-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.LOGGERD_CONTROLLERS_JOB }}/public
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    - name: Remove only authenticated owned source, target and caches
      if: ${{ always() }}
      run: "set -euo pipefail\n/usr/bin/python3 -I -B - <<'PY'\nimport json,os,pathlib,shutil,stat\njob=pathlib.Path(os.environ[\"\
        LOGGERD_CONTROLLERS_JOB\"])\nmarker=job/\"ownership.json\"\nif marker.is_file():\n    receipt=json.loads(marker.read_bytes());work=job/\"\
        work\"\n    assert receipt[\"run_id\"]==os.environ[\"GITHUB_RUN_ID\"] and receipt[\"attempt\"]==os.environ[\"GITHUB_RUN_ATTEMPT\"\
        ]\n    assert job.parent.resolve()==pathlib.Path(os.environ[\"RUNNER_TEMP\"]).resolve() and receipt[\"job\"]==str(job.resolve())\n\
        \    if work.exists():\n        info=work.lstat()\n        assert stat.S_ISDIR(info.st_mode) and not work.is_symlink()\
        \ and receipt[\"work\"]==str(work.resolve())\n        assert (info.st_dev,info.st_ino)==(receipt[\"device\"],receipt[\"\
        inode\"])\n        shutil.rmtree(work)\n    (job/\"owned-cleanup.json\").write_text(json.dumps({\"owned_work_removed\"\
        :not work.exists(),\"evidence_retained\":True})+\"\\n\")\nPY"
