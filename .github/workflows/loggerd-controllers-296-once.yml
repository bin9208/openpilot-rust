{
  "name": "loggerd diagnostics and pipeline admission #296 (NEXT bin-actions)",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/loggerd-controllers-296-once.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "loggerd-controllers-296-once",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "jobs": {
    "controllers": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 75,
      "env": {
        "SOURCE_SHA": "77100d33ce4d1202853bd6bf3597a0fc2014c590",
        "RUSTUP_TOOLCHAIN": "1.94.0",
        "LOGGERD_GATE_B64": "",
        "LOGGERD_GATE_SHA256": "ad87aa4e14bc95257407584350c165449876be1d245a769dd2513dcd66e3e17e",
        "LOGGERD_SCRIPT_B64": "",
        "LOGGERD_SCRIPT_SHA256": "3250f6cf1fcbd35f6ccdd51120bfca99643d5ae510ece8d4adc48fc4012b023a",
        "LOGGERD_CONFIG_B64": "",
        "LOGGERD_CONFIG_SHA256": "5d3d673475175e9a174008b40b3a74272fb42eaf51f18b579bf5a659f8e5db16",
        "GIT_CONFIG_NOSYSTEM": "1",
        "LOGGERD_PREREQ_B64": "",
        "LOGGERD_PREREQ_SHA256": "d71e52a832a652add9d879d01fbcc5ea16c8fcab99336b4569ed995e38ffaa16"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Create exclusive per-run job storage and verify frozen payloads",
          "run": "set -euo pipefail\nexport LOGGERD_PROVIDER_JOB=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\nprintf '%s=%s\\n' LOGGERD_PROVIDER_JOB \"$LOGGERD_PROVIDER_JOB\" >> \"$GITHUB_ENV\"\nset -euo pipefail\nexport LOGGERD_CONTROLLERS_JOB=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\nprintf '%s=%s\\n' LOGGERD_CONTROLLERS_JOB \"$LOGGERD_CONTROLLERS_JOB\" >> \"$GITHUB_ENV\"\nexport LOGGERD_CONTROLLERS_SOURCE_ROOT=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/source\"\nprintf '%s=%s\\n' LOGGERD_CONTROLLERS_SOURCE_ROOT \"$LOGGERD_CONTROLLERS_SOURCE_ROOT\" >> \"$GITHUB_ENV\"\nexport HOME=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/home\"\nprintf '%s=%s\\n' HOME \"$HOME\" >> \"$GITHUB_ENV\"\nexport CARGO_HOME=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/cargo-home\"\nprintf '%s=%s\\n' CARGO_HOME \"$CARGO_HOME\" >> \"$GITHUB_ENV\"\nexport RUSTUP_HOME=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/rustup-home\"\nprintf '%s=%s\\n' RUSTUP_HOME \"$RUSTUP_HOME\" >> \"$GITHUB_ENV\"\nexport TMPDIR=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/tmp\"\nprintf '%s=%s\\n' TMPDIR \"$TMPDIR\" >> \"$GITHUB_ENV\"\nexport XDG_CACHE_HOME=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/xdg-cache\"\nprintf '%s=%s\\n' XDG_CACHE_HOME \"$XDG_CACHE_HOME\" >> \"$GITHUB_ENV\"\nexport CCACHE_DIR=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/ccache\"\nprintf '%s=%s\\n' CCACHE_DIR \"$CCACHE_DIR\" >> \"$GITHUB_ENV\"\nexport SCCACHE_DIR=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/sccache\"\nprintf '%s=%s\\n' SCCACHE_DIR \"$SCCACHE_DIR\" >> \"$GITHUB_ENV\"\nexport GIT_CONFIG_GLOBAL=\"$RUNNER_TEMP/loggerd-controllers-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/work/gitconfig\"\nprintf '%s=%s\\n' GIT_CONFIG_GLOBAL \"$GIT_CONFIG_GLOBAL\" >> \"$GITHUB_ENV\"\nset -euo pipefail\n[[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_NAME == bin-actions && $RUNNER_ARCH == X64 ]]\n[[ ! -e $LOGGERD_CONTROLLERS_JOB && ! -L $LOGGERD_CONTROLLERS_JOB ]]\n/usr/bin/python3 -I -B - <<'PY'\nimport base64,hashlib,json,os,pathlib,stat\njob=pathlib.Path(os.environ[\"LOGGERD_CONTROLLERS_JOB\"])\nassert job.parent.resolve()==pathlib.Path(os.environ[\"RUNNER_TEMP\"]).resolve()\njob.mkdir(mode=0o700);work=job/\"work\";work.mkdir(mode=0o700)\nfor leaf in (\"home\",\"cargo-home\",\"rustup-home\",\"tmp\",\"xdg-cache\",\"ccache\",\"sccache\"): (work/leaf).mkdir(mode=0o700)\n(job/\"evidence\").mkdir()\nmeta=work.stat()\n(job/\"ownership.json\").write_text(json.dumps({\"job\":str(job.resolve()),\"work\":str(work.resolve()),\"device\":meta.st_dev,\"inode\":meta.st_ino,\"run_id\":os.environ[\"GITHUB_RUN_ID\"],\"attempt\":os.environ[\"GITHUB_RUN_ATTEMPT\"]},indent=2)+\"\\n\")\nfor stem,name in ((\"GATE\",\"hosted_gate.py\"),(\"SCRIPT\",\"loggerd-controllers-hosted.sh\"),(\"CONFIG\",\"config.json\"),(\"PREREQ\",\"native-providers.py\")):\n    data=base64.b64decode(os.environ[\"LOGGERD_\"+stem+\"_B64\"],validate=True)\n    assert hashlib.sha256(data).hexdigest()==os.environ[\"LOGGERD_\"+stem+\"_SHA256\"]\n    (job/name).write_bytes(data)\n(job/\"context.json\").write_text(json.dumps({k:os.environ.get(k) for k in (\"SOURCE_SHA\",\"GITHUB_SHA\",\"GITHUB_RUN_ID\",\"GITHUB_RUN_ATTEMPT\",\"GITHUB_REPOSITORY\",\"RUNNER_NAME\",\"RUNNER_ENVIRONMENT\",\"RUNNER_ARCH\",\"RUNNER_OS\",\"ImageOS\",\"ImageVersion\")},indent=2)+\"\\n\")\nPY\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources bootstrap 0"
        },
        {
          "name": "Fetch exact combined source into owned isolated checkout",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nfor tool in git gh g++ clang capnp pkg-config ffmpeg ffprobe strace ldd rustup cargo; do command -v \"$tool\"; done > \"$LOGGERD_CONTROLLERS_JOB/tool-paths.txt\"\nunset GIT_TRACE GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE_PACKET GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources source-fetch 8192\n[[ ! -e $LOGGERD_CONTROLLERS_SOURCE_ROOT && ! -L $LOGGERD_CONTROLLERS_SOURCE_ROOT ]]\ngit init --quiet \"$LOGGERD_CONTROLLERS_SOURCE_ROOT\"\nauth_header=$(printf \"x-access-token:%s\" \"$GH_TOKEN\" | base64 -w0)\nGIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0=\"AUTHORIZATION: basic $auth_header\" git -C \"$LOGGERD_CONTROLLERS_SOURCE_ROOT\" fetch --no-tags --depth=1 https://github.com/bin9208/openpilot-rust.git \"$SOURCE_SHA\"\nunset auth_header\ngit -C \"$LOGGERD_CONTROLLERS_SOURCE_ROOT\" checkout --quiet --detach FETCH_HEAD\n[[ $(git -C \"$LOGGERD_CONTROLLERS_SOURCE_ROOT\" rev-parse HEAD) == \"$SOURCE_SHA\" ]]\n[[ -z $(git -C \"$LOGGERD_CONTROLLERS_SOURCE_ROOT\" status --porcelain --untracked-files=normal) ]]\n[[ ! -e $LOGGERD_CONTROLLERS_SOURCE_ROOT/rust/target && ! -L $LOGGERD_CONTROLLERS_SOURCE_ROOT/rust/target ]]"
        },
        {
          "name": "Bind actual runner22 and authenticate independent original/source/workflow",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources original-copy 1024\ngh api -H \"Cache-Control: no-cache\" \"repos/bin9208/openpilot-rust/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs\" > \"$LOGGERD_CONTROLLERS_JOB/runner-jobs-api.json\"\ngh api -H \"Cache-Control: no-cache\" repos/bin9208/openpilot-rust/actions/artifacts/12432287942 > \"$LOGGERD_CONTROLLERS_JOB/original-metadata.json\"\ngh api -H \"Cache-Control: no-cache\" repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > \"$LOGGERD_CONTROLLERS_JOB/original.zip\"\ngh api -H \"Cache-Control: no-cache\" \"repos/bin9208/openpilot-rust/commits/$SOURCE_SHA\" > \"$LOGGERD_CONTROLLERS_JOB/source-api.json\"\ngh api -H \"Cache-Control: no-cache\" \"repos/bin9208/openpilot-rust/contents/.github/workflows/loggerd-controllers-296-once.yml?ref=$GITHUB_SHA\" > \"$LOGGERD_CONTROLLERS_JOB/workflow-api.json\"\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" authenticate"
        },
        {
          "name": "Collect every prerequisite and stage exact private zstd/yuv packages before Rust",
          "timeout-minutes": 15,
          "run": "set -euo pipefail\n# One shared private package repair; no host installation/cleanup.\nunset PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/native-providers.py\" stage\nuname -a > \"$LOGGERD_CONTROLLERS_JOB/kernel.txt\"\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources toolchain-install 2048\nrustup toolchain install 1.94.0 --profile minimal --component clippy\nrustc +1.94.0 --version > \"$LOGGERD_CONTROLLERS_JOB/rustc-version.txt\"\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources after-toolchain 0"
        },
        {
          "name": "Compile focused candidate, lifecycle, sealed replay and two actual native controllers",
          "timeout-minutes": 50,
          "run": "set -euo pipefail\nbash \"$LOGGERD_CONTROLLERS_JOB/loggerd-controllers-hosted.sh\" > \"$LOGGERD_CONTROLLERS_JOB/recipe.stdout\" 2> \"$LOGGERD_CONTROLLERS_JOB/recipe.stderr\"",
          "id": "logger_validation"
        },
        {
          "name": "Always seal bounded complete raw diagnostics",
          "if": "${{ always() }}",
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" resources before-pack 1024\n/usr/bin/python3 -I -B \"$LOGGERD_CONTROLLERS_JOB/hosted_gate.py\" pack",
          "id": "seal_proof"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "loggerd-controllers-296-bin-actions-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.LOGGERD_CONTROLLERS_JOB }}/public",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 14
          },
          "id": "proof_upload"
        },
        {
          "name": "Remove only authenticated owned source, target and caches",
          "if": "${{ always() && steps.logger_validation.outcome == 'success' && steps.seal_proof.outcome == 'success' && steps.proof_upload.outcome == 'success' && steps.proof_upload.outputs.artifact-id != '' && steps.proof_upload.outputs.artifact-digest != '' }}",
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B - <<'PY'\nimport json,os,pathlib,shutil,stat\njob=pathlib.Path(os.environ[\"LOGGERD_CONTROLLERS_JOB\"])\nmarker=job/\"ownership.json\"\nif marker.is_file():\n    receipt=json.loads(marker.read_bytes());work=job/\"work\"\n    assert receipt[\"run_id\"]==os.environ[\"GITHUB_RUN_ID\"] and receipt[\"attempt\"]==os.environ[\"GITHUB_RUN_ATTEMPT\"]\n    assert job.parent.resolve()==pathlib.Path(os.environ[\"RUNNER_TEMP\"]).resolve() and receipt[\"job\"]==str(job.resolve())\n    if work.exists():\n        info=work.lstat()\n        assert stat.S_ISDIR(info.st_mode) and not work.is_symlink() and receipt[\"work\"]==str(work.resolve())\n        assert (info.st_dev,info.st_ino)==(receipt[\"device\"],receipt[\"inode\"])\n        shutil.rmtree(work)\n    (job/\"owned-cleanup.json\").write_text(json.dumps({\"owned_work_removed\":not work.exists(),\"evidence_retained\":True})+\"\\n\")\nPY"
        }
      ]
    }
  }
}
