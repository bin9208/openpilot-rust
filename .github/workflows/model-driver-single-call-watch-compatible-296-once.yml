name: 296 unchanged binary compatible-host single-call watch diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-single-call-watch-compatible-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  single-call:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sample:
        - 0
        - 1
      max-parallel: 2
    env:
      EXPECTED_SOURCE: 12fab44083b6dbd1f8c69f5f2b18bea8aca99461
      DIAGNOSTIC_ATTEMPT: 20261022-single-call-watch-compatible-06
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 12fab44083b6dbd1f8c69f5f2b18bea8aca99461
        persist-credentials: false
    - name: Record natural CPU and admit x86_64 candidate for strict LLVM feature check
      id: cpu
      shell: bash
      run: "set -euo pipefail\nmkdir \"$RUNNER_TEMP/driver-single-call-preflight\"\nlscpu --json > \"$RUNNER_TEMP/driver-single-call-preflight/lscpu.json\"\
        \ncat /proc/cpuinfo > \"$RUNNER_TEMP/driver-single-call-preflight/proc-cpuinfo.txt\"\nuname -a > \"$RUNNER_TEMP/driver-single-call-preflight/uname.txt\"\
        \ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/driver-single-call-preflight/SOURCE_COMMIT\"\
        \nstatus=SKIPPED_NON_X86_64_HOST\nrun=false\nif test \"$(uname -m)\" = x86_64; then\n  run=true\n  status=X86_64_CANDIDATE_PENDING_STRICT_LLVM_ISA_AND_BASELINE_REPLAY\n\
        fi\nprintf 'run=%s\\n' \"$run\" >> \"$GITHUB_OUTPUT\"\nprintf '{\"status\":\"%s\",\"comparison_executed\":false,\"\
        diagnostic_only\":true,\"retirement_acceptance\":false,\"same_recorded_cpu_claim\":false}\\n' \"$status\" > \"$RUNNER_TEMP/driver-single-call-preflight/result.json\"\
        \nprintf '%s\\n' \"$status\"\n"
    - uses: actions/setup-python@v6
      if: success() && steps.cpu.outputs.run == 'true'
      with:
        python-version: '3.12'
    - name: Install bounded compiler dependencies and download both sealed input artifacts
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 2048\n\
        mkdir \"$RUNNER_TEMP/driver-single-call-downloads\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends\
        \ clang jq gdb binutils\npython -m pip install numpy==2.5.3 zstandard==0.25.0\npython -m pip freeze > \"$RUNNER_TEMP/driver-single-call-preflight/providers.before.txt\"\
        \ncurl --fail --location --retry 3 --max-time 180 -o \"$RUNNER_TEMP/driver-single-call-downloads/llvm18.deb\" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb\n\
        printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/driver-single-call-downloads/llvm18.deb\\\
        n' \"$RUNNER_TEMP\" | sha256sum --check --strict\ndpkg-deb --extract \"$RUNNER_TEMP/driver-single-call-downloads/llvm18.deb\"\
        \ \"$RUNNER_TEMP/driver-single-call-downloads/llvm\"\nprintf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0\
        \  %s/driver-single-call-downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\n' \"$RUNNER_TEMP\" | sha256sum --check\
        \ --strict\nprintf 'LLVM_PATH=%s/driver-single-call-downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\n' \"$RUNNER_TEMP\"\
        \ >> \"$GITHUB_ENV\"\nfor id in 12395927967 12396145796; do\n gh api \"repos/bin9208/openpilot-rust/actions/artifacts/$id\"\
        \ --jq '{id,size_in_bytes,digest,workflow_run}' > \"$RUNNER_TEMP/driver-single-call-preflight/artifact-$id.json\"\n\
        \ gh api \"repos/bin9208/openpilot-rust/actions/artifacts/$id/zip\" > \"$RUNNER_TEMP/driver-single-call-downloads/$id.zip\"\
        \ndone\n"
    - name: Observe unchanged single-call binaries with owned hardware watchpoints
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$PROBE_PREFLIGHT/watch.py"

        printf ''61c9b2eb28422b4ee61b413ad45ebc7e6313aadf3eb4a654ec3a293c1e9532e7  %s/watch.py\n'' "$PROBE_PREFLIGHT" | sha256sum
        --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$PROBE_PREFLIGHT/watch.gdb.py"

        printf ''5fcf4632cf2a23226eed5c586dbce641f9ae249a1fadbe01542b677415d1dadd  %s/watch.gdb.py\n'' "$PROBE_PREFLIGHT"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$PROBE_PREFLIGHT/supervise.py"

        printf ''6e97993cc812a5f49d50fa7971fd68733c21459b3eab57ff60289ea2385aa187  %s/supervise.py\n'' "$PROBE_PREFLIGHT"
        | sha256sum --check --strict

        set +e

        python "$PROBE_PREFLIGHT/supervise.py" > "$PROBE_PREFLIGHT/supervise.stdout" 2> "$PROBE_PREFLIGHT/supervise.stderr"

        rc=$?

        set -e

        printf ''%s\n'' "$rc" > "$PROBE_PREFLIGHT/probe.status"

        python -m pip freeze > "$PROBE_PREFLIGHT/providers.after.txt"

        cmp "$PROBE_PREFLIGHT/providers.before.txt" "$PROBE_PREFLIGHT/providers.after.txt"

        printf ''61c9b2eb28422b4ee61b413ad45ebc7e6313aadf3eb4a654ec3a293c1e9532e7  %s/watch.py\n'' "$PROBE_PREFLIGHT" | sha256sum
        --check --strict

        printf ''5fcf4632cf2a23226eed5c586dbce641f9ae249a1fadbe01542b677415d1dadd  %s/watch.gdb.py\n'' "$PROBE_PREFLIGHT"
        | sha256sum --check --strict

        printf ''6e97993cc812a5f49d50fa7971fd68733c21459b3eab57ff60289ea2385aa187  %s/supervise.py\n'' "$PROBE_PREFLIGHT"
        | sha256sum --check --strict

        test "$rc" -eq 0 || { tail -n 100 "$PROBE_PREFLIGHT/gdb.stderr" "$PROBE_PREFLIGHT/gdb.stdout" "$PROBE_PREFLIGHT/supervise.stderr";
        exit "$rc"; }

        '
      env:
        PROBE_OUTPUT: ${{ runner.temp }}/driver-single-call-output
        PROBE_DOWNLOADS: ${{ runner.temp }}/driver-single-call-downloads
        PROBE_PREFLIGHT: ${{ runner.temp }}/driver-single-call-preflight
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-single-call-watch-${{ env.DIAGNOSTIC_ATTEMPT }}-${{ matrix.sample }}
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
        path: '${{ runner.temp }}/driver-single-call-preflight/

          ${{ runner.temp }}/driver-single-call-output/'
