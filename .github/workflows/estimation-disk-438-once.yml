name: 296 complete estimator disk repair 438
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/estimation-disk-438-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  estimation-runtime:
    name: Exact-source complete repaired estimation runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 20a8f52e83d85c7c5113c5484179b0c016a034eb
    - name: Require exact complete estimator source
      run: 'test "$(git rev-parse HEAD)" = 20a8f52e83d85c7c5113c5484179b0c016a034eb

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 cffi==2.1.1 sympy==1.14.0 pyzmq==27.2.0
        zstandard==0.25.0 requests==2.34.2 pyserial==3.5 pytest==9.0.2
    - name: Prepare native Eigen staging evidence
      run: 'mkdir -p "$RUNNER_TEMP/estimation/eigen"

        '
    - name: Require native Eigen header staging against sealed original install
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/estimation/eigen\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 256\nrustup component add clippy --toolchain 1.94.0\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --locked --features eigen-tools-native --bin stage-eigen-headers\nstager=\"$GITHUB_WORKSPACE/rust/target/debug/stage-eigen-headers\"\
        \nsha256sum \"$stager\" > \"$proof/stager.sha256\"\ngit rev-parse HEAD > \"$proof/source-commit.txt\"\nsha256sum rust/crates/dev-tools/src/eigen_stage.rs\
        \ rust/crates/dev-tools/src/bin/stage_eigen_headers.rs rust/crates/dev-tools/tests/eigen_stage.rs > \"$proof/source.sha256\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 64\nfor item in x86_64:linux_x86_64\
        \ aarch64:linux_aarch64 macos-arm64:macosx_11_0_arm64; do\n  architecture=${item%%:*}\n  platform=${item#*:}\n  wheel=\"\
        $proof/eigen-3.4.0-py3-none-$platform.whl\"\n  curl --fail --location --retry 3 --output \"$wheel\" \"https://github.com/commaai/dependencies/releases/download/eigen/v3.4.0/eigen-3.4.0-py3-none-$platform.whl\"\
        \n  \"$stager\" --wheel \"$wheel\" --output \"$proof/$architecture-native\" --architecture \"$architecture\" > \"\
        $proof/$architecture-stage.json\"\ndone\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features eigen-tools-native\
        \ --lib eigen_stage::tests\nfor item in x86_64:linux_x86_64 aarch64:linux_aarch64 macos-arm64:macosx_11_0_arm64; do\n\
        \  architecture=${item%%:*}\n  platform=${item#*:}\n  EIGEN_WHEEL=\"$proof/eigen-3.4.0-py3-none-$platform.whl\" EIGEN_ARCHITECTURE=\"\
        $architecture\" EIGEN_NATIVE_INCLUDE=\"$proof/$architecture-native/install\" EIGEN_EVIDENCE=\"$proof/$architecture-comparison\"\
        \ cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features eigen-tools-native --test\
        \ eigen_stage\ndone\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\n\
        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features eigen-tools-native --lib --bin\
        \ stage-eigen-headers --test eigen_stage -- -D warnings\nsha256sum --check \"$proof/stager.sha256\"\nsha256sum --check\
        \ \"$proof/source.sha256\"\nprintf 'LOCATIOND_EIGEN_INCLUDE=%s/x86_64-native/install\\nPARAMSD_EIGEN_INCLUDE=%s/x86_64-native/install\\\
        n' \"$proof\" \"$proof\" >> \"$GITHUB_ENV\"\n"
    - name: Check native paramsd atomic gate foundation alongside original cases
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        test ! -e rust/tools/tests/test_paramsd_atomic_gate.py

        test ! -L rust/tools/tests/test_paramsd_atomic_gate.py

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features paramsd-startup-gate-native
        --test paramsd_startup_gate

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features paramsd-startup-gate-native
        --lib --test paramsd_startup_gate -- -D warnings

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build native estimators and unchanged source oracle
      run: 'mkdir -p "$RUNNER_TEMP/estimation/lagd"

        python rust/tools/build_locationd_oracle.py --output "$RUNNER_TEMP/locationd-oracle" --eigen-include "$LOCATIOND_EIGEN_INCLUDE"

        python rust/tools/build_paramsd_oracle.py --output "$RUNNER_TEMP/paramsd-oracle" --eigen-include "$PARAMSD_EIGEN_INCLUDE"
        --reuse-wrapper "$RUNNER_TEMP/locationd-oracle"/ekf_sym_pyx*.so

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/estimation-params-binding"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-locationd -p openpilot-lagd -p openpilot-paramsd --bins --examples
        --locked

        '
    - name: Require native paramsd scoped child-FD handoff
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/estimation/paramsd/native-gate"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        mkdir -p "$proof"

        export PARAMSD_NATIVE_GATE_DAEMON="$GITHUB_WORKSPACE/rust/target/debug/openpilot-paramsd"

        export PARAMSD_NATIVE_GATE_LIBRARY="$proof/startup-phase.so"

        export PARAMSD_NATIVE_GATE_CAR_PARAMS="$proof/CarParams.bin"

        export PARAMSD_NATIVE_GATE_EVIDENCE="$proof/native"

        python -c ''import sys; from paramsd_fixture import car_params; sys.stdout.buffer.write(bytes(car_params()))'' > "$PARAMSD_NATIVE_GATE_CAR_PARAMS"

        clang -std=c11 -O2 -shared -fPIC -Wall -Wextra -Werror rust/tools/paramsd_startup_phase.c -ldl -o "$PARAMSD_NATIVE_GATE_LIBRARY"
        > "$proof/phase-build.log" 2>&1

        sha256sum rust/tools/paramsd_startup_phase.c rust/tools/paramsd_fixture.py "$PARAMSD_NATIVE_GATE_DAEMON" "$PARAMSD_NATIVE_GATE_LIBRARY"
        "$PARAMSD_NATIVE_GATE_CAR_PARAMS" > "$proof/artifacts.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-startup-gate-native --test paramsd_startup_gate
        --locked -- --ignored --exact native_mapped_gate_holds_actual_paramsd_second_poll_and_shutdown --nocapture

        sha256sum -c "$proof/artifacts.sha256"

        '
    - name: Compare location model, complete source loop, timestamps and native IPC
      run: 'python rust/tools/check_locationd.py --oracle "$RUNNER_TEMP/locationd-oracle" --trace "$PWD/rust/target/debug/examples/location_trace"
        --evidence "$RUNNER_TEMP/estimation/locationd/estimator"

        python rust/tools/check_locationd_loop.py --oracle "$RUNNER_TEMP/locationd-oracle" --trace "$PWD/rust/target/debug/examples/location_loop"
        --evidence "$RUNNER_TEMP/estimation/locationd/loop"

        python rust/tools/check_locationd_timestamp.py --oracle "$RUNNER_TEMP/locationd-oracle" --trace "$PWD/rust/target/debug/examples/location_trace"
        --evidence "$RUNNER_TEMP/estimation/locationd/timestamp"

        python rust/tools/check_locationd_daemon.py --oracle "$RUNNER_TEMP/locationd-oracle" --target "$PWD/rust/target" --evidence
        "$RUNNER_TEMP/estimation/locationd/daemon"

        python rust/tools/check_locationd_startup.py --oracle "$RUNNER_TEMP/locationd-oracle" --binding "$RUNNER_TEMP/estimation-params-binding"/params_pyx*.so
        --binary "$PWD/rust/target/debug/openpilot-locationd" --output "$RUNNER_TEMP/estimation/locationd/startup"

        '
    - name: Compare vehicle model, source main loop, cache migration and native IPC
      run: 'python rust/tools/check_paramsd.py --oracle "$RUNNER_TEMP/paramsd-oracle" --trace "$PWD/rust/target/debug/examples/paramsd_trace"
        --evidence "$RUNNER_TEMP/estimation/paramsd/estimator"

        python rust/tools/check_paramsd_loop.py --oracle "$RUNNER_TEMP/paramsd-oracle" --trace "$PWD/rust/target/debug/examples/paramsd_loop"
        --evidence "$RUNNER_TEMP/estimation/paramsd/loop"

        python rust/tools/check_paramsd_daemon.py --oracle "$RUNNER_TEMP/paramsd-oracle" --target "$PWD/rust/target" --evidence
        "$RUNNER_TEMP/estimation/paramsd/daemon"

        python rust/tools/check_paramsd_startup.py --binary "$PWD/rust/target/debug/openpilot-paramsd" --evidence "$RUNNER_TEMP/estimation/paramsd/startup"

        '
    - name: Compare full native paramsd controller against original source packets
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/estimation/paramsd/native-controller-proof"

        export PARAMSD_ORIGINAL_OUTPUT="$RUNNER_TEMP/estimation/paramsd/daemon"

        export PARAMSD_NATIVE_OUTPUT="$proof/native"

        export PARAMSD_NATIVE_DAEMON="$GITHUB_WORKSPACE/rust/target/debug/openpilot-paramsd"

        export PARAMSD_NATIVE_HOOK="$PARAMSD_ORIGINAL_OUTPUT/continuous/startup-phase.so"

        checker="$GITHUB_WORKSPACE/rust/target/debug/check-paramsd-daemon-native"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-daemon-native --bin check-paramsd-daemon-native
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-daemon-native --lib --test paramsd_daemon_check
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        sha256sum "$checker" "$PARAMSD_NATIVE_DAEMON" "$PARAMSD_NATIVE_HOOK" "$PARAMSD_ORIGINAL_OUTPUT/continuous/input.json"
        "$PARAMSD_ORIGINAL_OUTPUT/restart/input.json" "$PARAMSD_ORIGINAL_OUTPUT/continuous/source.json" "$PARAMSD_ORIGINAL_OUTPUT/restart/source.json"
        rust/tools/check_paramsd_daemon.py rust/tools/paramsd_fixture.py rust/tools/paramsd_startup_phase.c > "$proof/inputs.sha256"

        sha256sum "$PARAMSD_ORIGINAL_OUTPUT"/{continuous,restart}/{results.json,saved.bin,gps.json,packets.json} >> "$proof/inputs.sha256"

        /usr/bin/timeout --signal=TERM --kill-after=5s 180s "$checker" --daemon "$PARAMSD_NATIVE_DAEMON" --library "$PARAMSD_NATIVE_HOOK"
        --continuous-input "$PARAMSD_ORIGINAL_OUTPUT/continuous/input.json" --restart-input "$PARAMSD_ORIGINAL_OUTPUT/restart/input.json"
        --evidence "$PARAMSD_NATIVE_OUTPUT" > "$proof/native.stdout" 2> "$proof/native.stderr"

        sha256sum -c "$proof/inputs.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-daemon-native --test paramsd_daemon_reference
        --locked -- --nocapture

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-daemon-native --bin check-paramsd-daemon-native
        --test paramsd_daemon_check --test paramsd_daemon_reference --locked -- -D warnings

        sha256sum -c "$proof/inputs.sha256"

        '
    - name: Compare native paramsd loop checker against complete original observations
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/estimation/paramsd/native-loop-controller"

        export OPENPILOT_RUST_ROOT="$GITHUB_WORKSPACE"

        export PARAMSD_LOOP_NATIVE_RAW="$proof/current/native-raw.json"

        export PARAMSD_LOOP_NATIVE_CHECKER="$GITHUB_WORKSPACE/rust/target/debug/check-paramsd-loop-native"

        export PARAMSD_LOOP_NATIVE_CANDIDATE="$GITHUB_WORKSPACE/rust/target/debug/examples/paramsd_loop"

        export PARAMSD_LOOP_NATIVE_EXEC="$proof/native.exec"

        checker="$GITHUB_WORKSPACE/rust/target/debug/check-paramsd-loop-native"

        candidate="$GITHUB_WORKSPACE/rust/target/debug/examples/paramsd_loop"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --bin check-paramsd-loop-native
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        sha256sum "$checker" "$candidate" rust/tools/check_paramsd_loop.py rust/tools/paramsd_loop_fixture.py rust/tools/paramsd_fixture.py
        > "$proof/inputs.sha256"

        PATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=5s 200s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat
        -o "$proof/native.exec" "$checker" --binary "$candidate" --evidence "$proof/current" > "$proof/native.stdout" 2> "$proof/native.stderr"

        sha256sum -c "$proof/inputs.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --lib --test paramsd_loop_check
        --test paramsd_loop_reference --locked -- --nocapture

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --lib --bin check-paramsd-loop-native
        --test paramsd_loop_check --test paramsd_loop_reference --locked -- -D warnings

        sha256sum -c "$proof/inputs.sha256"

        '
    - name: Compare native paramsd fixture generator against all original wire inputs
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/estimation/paramsd/native-fixture\"\nexport PARAMSD_FIXTURE_ROOT=\"$GITHUB_WORKSPACE\"\
        \nexport PARAMSD_FIXTURE_ORIGINAL_SAVED_PACKET=\"$RUNNER_TEMP/estimation/paramsd/daemon/continuous/saved.bin\"\nexport\
        \ PARAMSD_FIXTURE_ORIGINAL_SCENARIOS=\"$proof/original-scenarios.json\"\nexport PARAMSD_FIXTURE_ORIGINAL_CONTINUOUS=\"\
        $proof/original-continuous.json\"\nexport PARAMSD_FIXTURE_ORIGINAL_RESTART=\"$proof/original-restart.json\"\nexport\
        \ PARAMSD_FIXTURE_NATIVE_OUTPUT=\"$proof/native\"\nexport PARAMSD_FIXTURE_NATIVE_EXEC=\"$proof/native.exec\"\nexport\
        \ PARAMSD_FIXTURE_NATIVE_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/generate-paramsd-fixture\"\nexport PARAMSD_LOOP_ROOT=\"\
        $GITHUB_WORKSPACE\"\nexport PARAMSD_LOOP_ORIGINAL_INPUT=\"$proof/original-loop.json\"\nexport PARAMSD_LOOP_NATIVE_OUTPUT=\"\
        $proof/loop-native\"\nexport PARAMSD_LOOP_NATIVE_EXEC=\"$proof/loop-native.exec\"\nexport PARAMSD_LOOP_NATIVE_BINARY=\"\
        $GITHUB_WORKSPACE/rust/target/debug/generate-paramsd-loop-fixture\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\nmkdir -p \"$proof\"\ngit rev-parse HEAD > \"$proof/SOURCE_COMMIT\"\
        \npython - <<'ORIGINAL'\nimport json, os\nfrom pathlib import Path\nfrom paramsd_fixture import car_params, scenarios\n\
        from check_paramsd_daemon import frames\nfrom paramsd_loop_fixture import cases as loop_cases\nsaved = Path(os.environ['PARAMSD_FIXTURE_ORIGINAL_SAVED_PACKET']).read_bytes()\n\
        Path(os.environ['PARAMSD_LOOP_ORIGINAL_INPUT']).write_text(json.dumps({'cases': loop_cases()}) + '\\n')\nobserved_loop\
        \ = Path(os.environ['RUNNER_TEMP']) / 'estimation/paramsd/loop/input.json'\nassert json.loads(observed_loop.read_text())\
        \ == json.loads(Path(os.environ['PARAMSD_LOOP_ORIGINAL_INPUT']).read_text()), observed_loop\nPath(os.environ['PARAMSD_FIXTURE_ORIGINAL_SCENARIOS']).write_text(json.dumps({'cases':\
        \ scenarios()}) + '\\n')\nfor restart in (False, True):\n  gps = 'gpsLocation' if restart else 'gpsLocationExternal'\n\
        \  seed = {'LiveParametersV2': list(saved), 'CarParamsPrevRoute': car_params()} if restart else {}\n  case = {'name':\
        \ 'restart' if restart else 'continuous', 'car': car_params(), 'seed': seed, 'debug': True,\n          'replay': True,\
        \ 'simulation': True, 'gps': gps, 'frames': frames(gps, 8 if restart else 1202)}\n  case['frames'].insert(0, {'time':\
        \ 99.95, 'messages': []})\n  name = 'PARAMSD_FIXTURE_ORIGINAL_RESTART' if restart else 'PARAMSD_FIXTURE_ORIGINAL_CONTINUOUS'\n\
        \  Path(os.environ[name]).write_text(json.dumps(case) + '\\n')\n  observed = Path(os.environ['RUNNER_TEMP']) / 'estimation/paramsd/daemon'\
        \ / ('restart' if restart else 'continuous') / 'input.json'\n  assert json.loads(observed.read_text()) == case, observed\n\
        ORIGINAL\nsha256sum rust/tools/paramsd_fixture.py rust/tools/paramsd_loop_fixture.py rust/tools/check_paramsd_loop.py\
        \ \"$PARAMSD_LOOP_ORIGINAL_INPUT\" rust/tools/check_paramsd_daemon.py opendbc_repo/opendbc/car/car.capnp openpilot/cereal/log.capnp\
        \ \"$PARAMSD_FIXTURE_ORIGINAL_SAVED_PACKET\" \"$PARAMSD_FIXTURE_ORIGINAL_SCENARIOS\" \"$PARAMSD_FIXTURE_ORIGINAL_CONTINUOUS\"\
        \ \"$PARAMSD_FIXTURE_ORIGINAL_RESTART\" > \"$proof/original.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features paramsd-fixture-native --bin generate-paramsd-fixture --bin generate-paramsd-loop-fixture --locked\n\
        sha256sum \"$PARAMSD_FIXTURE_NATIVE_BINARY\" \"$PARAMSD_LOOP_NATIVE_BINARY\" > \"$proof/generator.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\nPATH=/nonexistent /usr/bin/timeout --kill-after=5s 30s /usr/bin/strace\
        \ -f -qq -s 65535 -e trace=execve,execveat -o \"$PARAMSD_FIXTURE_NATIVE_EXEC\" \"$PARAMSD_FIXTURE_NATIVE_BINARY\"\
        \ --root \"$PARAMSD_FIXTURE_ROOT\" --output \"$PARAMSD_FIXTURE_NATIVE_OUTPUT\" --saved-packet \"$PARAMSD_FIXTURE_ORIGINAL_SAVED_PACKET\"\
        \ > \"$proof/native.stdout\" 2> \"$proof/native.stderr\"\nPATH=/nonexistent /usr/bin/timeout --kill-after=5s 30s /usr/bin/strace\
        \ -f -qq -s 65535 -e trace=execve,execveat -o \"$PARAMSD_LOOP_NATIVE_EXEC\" \"$PARAMSD_LOOP_NATIVE_BINARY\" --root\
        \ \"$PARAMSD_LOOP_ROOT\" --output \"$PARAMSD_LOOP_NATIVE_OUTPUT\" > \"$proof/loop-native.stdout\" 2> \"$proof/loop-native.stderr\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features paramsd-fixture-native --test paramsd_fixture_generate --test\
        \ paramsd_loop_fixture_generate --locked -- --nocapture\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features\
        \ paramsd-fixture-native --lib --bin generate-paramsd-fixture --bin generate-paramsd-loop-fixture --test paramsd_fixture_generate\
        \ --test paramsd_loop_fixture_generate --locked -- -D warnings\nsha256sum -c \"$proof/original.sha256\"\nsha256sum\
        \ -c \"$proof/generator.sha256\"\n"
    - name: Build and test native lagd QA tools
      env:
        CARGO_INCREMENTAL: '0'
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_PROFILE_TEST_DEBUG: '0'
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 256

        rustup component add clippy --toolchain 1.94.0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features lagd-tools-native --bin check-lagd-numeric
        --bin check-lagd-loop --bin check-lagd-cache --bin check-lagd-packet --bin check-lagd-daemon --bin check-lagd-params-io
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features lagd-tools-native --test lagd_reference
        --test lagd_reference_generic --test lagd_frames --test lagd_packet_reference --test lagd_loop_reference --test lagd_random
        --test lagd_numeric_cases --test lagd_check --test lagd_cli --test lagd_live_check --test lagd_live_contracts --test
        lagd_live_native --test lagd_session --test lagd_live_cli --test lagd_retirement --test lagd_ci --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features lagd-tools-native --lib --bin check-lagd-numeric
        --bin check-lagd-loop --bin check-lagd-cache --bin check-lagd-packet --bin check-lagd-daemon --bin check-lagd-params-io
        --test lagd_reference --test lagd_reference_generic --test lagd_frames --test lagd_packet_reference --test lagd_loop_reference
        --test lagd_random --test lagd_numeric_cases --test lagd_check --test lagd_cli --test lagd_live_check --test lagd_live_contracts
        --test lagd_live_native --test lagd_session --test lagd_live_cli --test lagd_retirement --test lagd_ci --locked --
        -D warnings

        '
    - name: Measure masked lagd input allocation against unchanged source
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/estimation/lagd/masked-allocation-429\"\nbaseline=\"$RUNNER_TEMP/lagd429-baseline\"\
        \nmkdir -p \"$proof\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 8192\ngit fetch --no-tags --depth=1 origin edb42bf095d6a3e3b38cc0a4546976dfb710363e\ngit worktree add --detach \"\
        $baseline\" edb42bf095d6a3e3b38cc0a4546976dfb710363e\nCARGO_INCREMENTAL=0 CARGO_TARGET_DIR=\"$RUNNER_TEMP/lagd429-old-target\"\
        \ cargo build --manifest-path \"$baseline/rust/Cargo.toml\" -p openpilot-lagd --lib --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 1024\nCARGO_INCREMENTAL=0 CARGO_TARGET_DIR=\"$GITHUB_WORKSPACE/rust/target\"\
        \ cargo build --manifest-path rust/Cargo.toml -p openpilot-lagd --lib --locked\nfor role in old current; do\n  if\
        \ [ \"$role\" = old ]; then target=\"$RUNNER_TEMP/lagd429-old-target\"; else target=\"$GITHUB_WORKSPACE/rust/target\"\
        ; fi\n  \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 128\n  native_flags=()\n\
        \  for out in \"$target\"/debug/build/*/out; do\n    if [ -d \"$out\" ]; then native_flags+=(-L \"native=$out\");\
        \ fi\n  done\n  rustc --edition=2021 -C debuginfo=0 rust/tools/lagd_masked_allocation_probe.rs \\\n    --extern \"\
        openpilot_lagd=$target/debug/libopenpilot_lagd.rlib\" \\\n    -L \"dependency=$target/debug/deps\" \"${native_flags[@]}\"\
        \ -l stdc++ \\\n    -o \"$proof/$role-probe\"\n  \"$proof/$role-probe\" | tee \"$proof/$role.log\"\ndone\n\"$proof/current-probe\"\
        \ --compare \"$proof/old.log\" \"$proof/current.log\" | tee \"$proof/comparison.log\"\n"
    - name: Compare delay numerical policy, full source loop, cache and native IPC
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rust/target/debug/check-lagd-numeric "$PWD/rust/target/debug/examples/lag_numeric" "$RUNNER_TEMP/estimation/lagd/numeric.json"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rust/target/debug/check-lagd-loop "$PWD/rust/target/debug/examples/lag_loop" "$RUNNER_TEMP/estimation/lagd/loop"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rust/target/debug/check-lagd-cache "$PWD/rust/target/debug/examples/lag_cache" "$RUNNER_TEMP/estimation/lagd/cache.json"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rust/target/debug/check-lagd-packet "$PWD/rust/target/debug/examples/lag_packet" "$RUNNER_TEMP/estimation/lagd/packet.json"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rust/target/debug/check-lagd-daemon "$PWD/rust/target/debug/openpilot-lagd" "$PWD/rust/target/debug/examples/lag_ipc_peer"
        "$RUNNER_TEMP/estimation/lagd/daemon"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rust/target/debug/check-lagd-params-io "$PWD/rust/target/debug/openpilot-lagd" "$RUNNER_TEMP/estimation/lagd/params-io.json"

        '
    - name: Check production numerical ownership and native memory boundaries
      run: 'cargo test --manifest-path rust/Cargo.toml -p openpilot-locationd -p openpilot-lagd -p openpilot-paramsd -p openpilot-pocketfft
        --locked

        python rust/tools/check_locationd_native.py --evidence "$RUNNER_TEMP/estimation/locationd/native"

        python rust/tools/check_paramsd_native.py --evidence "$RUNNER_TEMP/estimation/paramsd/native"

        clang++ -std=c++17 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-omit-frame-pointer rust/crates/pocketfft/native/kernel_test.cc
        -o "$RUNNER_TEMP/estimation/lagd/pocketfft-sanitized"

        ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/estimation/lagd/pocketfft-sanitized" > "$RUNNER_TEMP/estimation/lagd/pocketfft-sanitizer.log"
        2>&1

        '
    - name: Retain estimator source and native evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-estimation-evidence
        path: '${{ runner.temp }}/estimation/

          ${{ runner.temp }}/locationd-oracle/build.log

          ${{ runner.temp }}/paramsd-oracle/build.log

          '
