name: 296 focused driver no-collector, CLI and raw-alias family
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driver-daemon-family-once.yml
permissions:
  contents: read
  actions: read
jobs:
  driver-daemon-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: 939239ec9c26a452a0e401b5d27cac5f09560415
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 939239ec9c26a452a0e401b5d27cac5f09560415
    - name: Require exact source, disk room and native prerequisites
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        mkdir -p "$RUNNER_TEMP/driver-daemon-native-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 git-lfs capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Fail fast on driver leaf unit, integration compile and strict Clippy
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --lib driver_daemon_check::
        --locked -- --nocapture >"$proof/unit.log" 2>&1 || { cat "$proof/unit.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test driver_daemon_check
        --test driver_daemon_no_collector --no-run --locked >"$proof/integration-compile.log" 2>&1 || { cat "$proof/integration-compile.log";
        exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --lib --test driver_daemon_check
        --test driver_daemon_no_collector --bin check-driver-daemon --locked -- -D warnings >"$proof/clippy.log" 2>&1 || {
        cat "$proof/clippy.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --bin check-driver-daemon
        --locked >"$proof/native-cli-build.log" 2>&1 || { cat "$proof/native-cli-build.log"; exit 1; }

        '
    - name: Fail fast on typed native CLI help and parser admissions
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nsha256sum rust/target/debug/check-driver-daemon\
        \ >\"$proof/native-cli-elf-before.sha256\"\npython3 - <<'PY_NATIVE_ADMISSION' >\"$proof/native-cli-admission-summary.json\"\
        \nimport hashlib, json, os, subprocess\nfrom pathlib import Path\nproof = Path(os.environ[\"RUNNER_TEMP\"]) / \"driver-daemon-native-296\"\
        \nbinary = Path(os.environ[\"GITHUB_WORKSPACE\"]) / \"rust/target/debug/check-driver-daemon\"\noutput = proof / \"\
        native-cli-admission\"\noutput.mkdir()\nroster = [\n    (\"short-help\", [\"-h\"], 0),\n    (\"long-help\", [\"--help\"\
        ], 0),\n    (\"missing-all\", [], 2),\n    (\"unique-abbrev-missing-rest\", [\"--bin\", \"/missing-driver\"], 2),\n\
        \    (\"output-abbrev-missing-rest\", [\"--o\", \"/unused-output\"], 2),\n    (\"models-abbrev-missing-rest\", [\"\
        --m\", \"/unused-models\"], 2),\n    (\"ambiguous-abbrev\", [\"--c\", \"value\"], 2),\n    (\"missing-value\", [\"\
        --binary\"], 2),\n    (\"unknown\", [\"--unknown\"], 2),\n    (\"repeated-missing-rest\", [\"--binary\", \"/first\"\
        , \"--binary\", \"/last\"], 2),\n]\nmanifest = {\"binary_sha256\": hashlib.sha256(binary.read_bytes()).hexdigest(),\
        \ \"cases\": []}\nreceipt = proof / \"native-cli-admission-manifest.json\"\nreceipt.write_text(json.dumps(manifest,\
        \ sort_keys=True, indent=2) + \"\\n\")\nfor name, argv, expected_status in roster:\n    result = subprocess.run([os.fspath(binary),\
        \ *argv], capture_output=True, timeout=10, check=False)\n    stdout = output / f\"{name}.stdout\"\n    stderr = output\
        \ / f\"{name}.stderr\"\n    stdout.write_bytes(result.stdout)\n    stderr.write_bytes(result.stderr)\n    manifest[\"\
        cases\"].append({\"name\": name, \"argv\": argv, \"status\": result.returncode,\n                              \"\
        stdout\": {\"path\": stdout.name, \"bytes\": len(result.stdout), \"sha256\": hashlib.sha256(result.stdout).hexdigest()},\n\
        \                              \"stderr\": {\"path\": stderr.name, \"bytes\": len(result.stderr), \"sha256\": hashlib.sha256(result.stderr).hexdigest()}})\n\
        \    receipt.write_text(json.dumps(manifest, sort_keys=True, indent=2) + \"\\n\")\n    assert result.returncode ==\
        \ expected_status, f\"native {name} status {result.returncode} != {expected_status}\"\nprint(json.dumps({\"cases\"\
        : len(manifest[\"cases\"]), \"manifest_sha256\": hashlib.sha256(receipt.read_bytes()).hexdigest()}, sort_keys=True))\n\
        PY_NATIVE_ADMISSION\nsha256sum -c \"$proof/native-cli-elf-before.sha256\" >\"$proof/native-cli-elf-after-admission.log\"\
        \n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned original Python observer dependencies
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2

        '
    - name: Build only driver daemon, model runner, log collector and original IPC bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bin model-run --locked >"$proof/model-run-build.log"
        2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dmonitoringmodeld --locked >"$proof/dmonitoring-build.log"
        2>&1 || { cat "$proof/dmonitoring-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-logmessaged --bin openpilot-logmessaged --locked >"$proof/logmessaged-build.log"
        2>&1 || { cat "$proof/logmessaged-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python" >"$proof/msgq-build.log" 2>&1
        || { cat "$proof/msgq-build.log"; exit 1; }

        '
    - name: Compile only original driver model, metadata and both camera warps
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\nmkdir -p \"$RUNNER_TEMP/original-models\"\npython tinygrad_repo/examples/openpilot/compile3.py\
        \ \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\" \"$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl\"\
        \ >\"$proof/driver-model-compile.log\" 2>&1 || { cat \"$proof/driver-model-compile.log\"; exit 1; }\npython openpilot/selfdrive/modeld/get_model_metadata.py\
        \ openpilot/selfdrive/modeld/models/dmonitoring_model.onnx >\"$proof/metadata-compile.log\" 2>&1 || { cat \"$proof/metadata-compile.log\"\
        ; exit 1; }\ncp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl \"$RUNNER_TEMP/original-models/\"\
        \nfor resolution in 1928x1208 1344x760; do\n  rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 2048\n  python openpilot/selfdrive/modeld/compile_dm_warp.py --camera-resolution \"$resolution\" --warp-to 1440x960\
        \ --output \"$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl\" >\"$proof/warp-${resolution}.log\"\
        \ 2>&1 || { cat \"$proof/warp-${resolution}.log\"; exit 1; }\ndone\n"
    - name: Publish driver-only native catalog from sealed original PKLs
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\npython - <<'PY_CATALOG' >\"$proof/catalog-build.log\" 2>&1\nimport hashlib\nimport os\nfrom pathlib\
        \ import Path\nfrom model_export.original import DriverArtifacts, driver\nfrom model_export.publish import BundleSpec,\
        \ publish\nfrom openpilot.common.file_chunker import open_file_chunked\n\nroot = Path(os.environ[\"RUNNER_TEMP\"])\
        \ / \"original-models\"\noutput = Path(os.environ[\"RUNNER_TEMP\"]) / \"native-catalog\"\ndef source_hash(path):\n\
        \    with open_file_chunked(str(path)) as source:\n        return hashlib.file_digest(source, \"sha256\").hexdigest()\n\
        model = root / \"dmonitoring_model_tinygrad.pkl\"\nmetadata = root / \"dmonitoring_model_metadata.pkl\"\nbase_sources\
        \ = {\"model\": source_hash(model), \"metadata\": source_hash(metadata)}\nspecs = []\nfor resolution in ((1928, 1208),\
        \ (1344, 760)):\n    warp = root / f\"dm_warp_{resolution[0]}x{resolution[1]}_tinygrad.pkl\"\n    specs.append(BundleSpec(\"\
        driver\", resolution, driver(DriverArtifacts(model, warp, metadata)),\n                            base_sources |\
        \ {\"warp\": source_hash(warp)}))\npublish(output, specs, \"cpu\")\nprint(output / \"current.json\")\nPY_CATALOG\n\
        rust/target/debug/model-run --check-catalog \"$RUNNER_TEMP/native-catalog\" >\"$proof/catalog-check.log\" 2>&1 ||\
        \ { cat \"$proof/catalog-build.log\" \"$proof/catalog-check.log\"; exit 1; }\n"
    - name: Materialize SHA-pinned independent original-only capture wrapper
      shell: bash
      run: 'set -euo pipefail

        set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        python3 - <<''PY_CAPTURE''

        import base64

        import hashlib

        import os

        from pathlib import Path

        raw = base64.b64decode("",
        validate=True)

        assert hashlib.sha256(raw).hexdigest() == "95128a39966819e738e76bcd63e16fe5195385b6c3f17ed1424c10200ee65e1e"

        target = Path(os.environ["RUNNER_TEMP"]) / "driver-daemon-native-296" / "capture_original_driver.py"

        target.write_bytes(raw)

        assert hashlib.sha256(target.read_bytes()).hexdigest() == "95128a39966819e738e76bcd63e16fe5195385b6c3f17ed1424c10200ee65e1e"

        cli = base64.b64decode("",
        validate=True)

        assert hashlib.sha256(cli).hexdigest() == "84178a590ff4e72ba80787ee0cad8e07d4721b54d970b20862dd771c8b7c3c89"

        cli_target = target.with_name("capture_original_driver_cli.py")

        cli_target.write_bytes(cli)

        assert hashlib.sha256(cli_target.read_bytes()).hexdigest() == "84178a590ff4e72ba80787ee0cad8e07d4721b54d970b20862dd771c8b7c3c89"

        PY_CAPTURE

        printf ''%s\n'' ''95128a39966819e738e76bcd63e16fe5195385b6c3f17ed1424c10200ee65e1e'' > "$proof/capture-script.sha256"

        printf ''%s\n'' ''84178a590ff4e72ba80787ee0cad8e07d4721b54d970b20862dd771c8b7c3c89'' > "$proof/cli-capture-script.sha256"


        python3 - <<''PY_NO_COLLECTOR_CAPTURE''

        import base64, hashlib, os

        from pathlib import Path

        raw = base64.b64decode("",
        validate=True)

        assert hashlib.sha256(raw).hexdigest() == "e4ab24e57cb31d8728eaa88c6cd32f71bafdb5740078a66da3c96c3e6398d820"

        target = Path(os.environ["RUNNER_TEMP"]) / "driver-daemon-native-296" / "capture_original_driver_no_collector.py"

        target.write_bytes(raw)

        assert hashlib.sha256(target.read_bytes()).hexdigest() == "e4ab24e57cb31d8728eaa88c6cd32f71bafdb5740078a66da3c96c3e6398d820"

        PY_NO_COLLECTOR_CAPTURE

        printf ''%s\n'' ''e4ab24e57cb31d8728eaa88c6cd32f71bafdb5740078a66da3c96c3e6398d820'' > "$proof/no-collector-capture-script.sha256"

        '
    - name: Seal original sources and three held native executables before traffic
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sha256sum rust/tools/check_driver_daemon.py rust/tools/model_export/original.py rust/tools/model_export/publish.py
        rust/crates/dev-tools/src/driver_daemon_check.rs rust/crates/dev-tools/src/bin/check_driver_daemon.rs rust/crates/dev-tools/tests/driver_daemon_check.rs
        rust/crates/dev-tools/tests/driver_daemon_no_collector.rs rust/crates/dev-tools/Cargo.toml rust/crates/dev-tools/src/lib.rs
        "$proof/capture_original_driver.py" "$proof/capture_original_driver_cli.py" "$proof/capture_original_driver_no_collector.py"
        rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/openpilot-logmessaged rust/target/debug/model-run
        >"$proof/inputs-before.sha256"

        find "$RUNNER_TEMP/original-models" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum >"$proof/models-before.sha256"

        find "$RUNNER_TEMP/model-msgq-python/msgq" -type f -print0 | sort -z | xargs -0 sha256sum >"$proof/binding-before.sha256"

        find "$RUNNER_TEMP/model-msgq-python/msgq" -type f -print | sort >"$proof/binding-roster-before.txt"

        '
    - name: Authenticate accepted collector-backed historical original only for mode mismatch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\narchive=\"$RUNNER_TEMP/driver-daemon-34e-artifact.zip\"\
        \nheld=\"$RUNNER_TEMP/driver-daemon-historical-34e\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\" --growth-mib\
        \ 512\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12360417493/zip >\"$archive\"\nprintf '%s  %s\\n' 8b238cb6be3358b77dec01628de34bae492b46b4eea016b40b6ad7794ec08fae\
        \ \"$archive\" | sha256sum -c - >\"$proof/historical-artifact-pin.log\"\nmkdir \"$held\"\nunzip -q \"$archive\" -d\
        \ \"$held\"\npython3 - <<'PY_HISTORICAL' >\"$proof/historical-collector-admission.json\"\nimport hashlib,json,os\n\
        from pathlib import Path\nroot=Path(os.environ[\"RUNNER_TEMP\"])/\"driver-daemon-historical-34e/original\"\nraw=(root/\"\
        reference-manifest.json\").read_bytes()\nexpected=\"57a3a05c0a0fa5b3318fc3fb1e3c07e9a9838b3379c3cb2e50e96974ed7bfd4a\"\
        \nassert hashlib.sha256(raw).hexdigest()==expected\nmanifest=json.loads(raw)\nassert manifest[\"source_commit\"]==\"\
        34e5e052f7c19a2c2f22ef9a0298d228ab5ce949\"\nassert \"collector_mode\" not in manifest[\"policy\"]\nassert len(manifest[\"\
        files\"])==43 and len(manifest[\"cases\"])==4\nfor name,pin in manifest[\"files\"].items():\n    data=(root/name).read_bytes()\n\
        \    assert len(data)==pin[\"bytes\"] and hashlib.sha256(data).hexdigest()==pin[\"sha256\"]\nprint(json.dumps({\"\
        artifact_id\":12360417493,\"manifest_sha256\":expected,\n                  \"historical_source_commit\":manifest[\"\
        source_commit\"],\"members\":len(manifest[\"files\"]),\n                  \"use\":\"collector-mode negative only\"\
        },sort_keys=True))\nPY_HISTORICAL\nprintf 'DRIVER_DAEMON_HISTORICAL_COLLECTOR_CAPTURE=%s\\nDRIVER_DAEMON_HISTORICAL_COLLECTOR_MANIFEST_SHA256=%s\\\
        nDRIVER_DAEMON_HISTORICAL_COLLECTOR_SOURCE_COMMIT=%s\\n' \"$held/original\" 57a3a05c0a0fa5b3318fc3fb1e3c07e9a9838b3379c3cb2e50e96974ed7bfd4a\
        \ 34e5e052f7c19a2c2f22ef9a0298d228ab5ce949 >>\"$GITHUB_ENV\"\n"
    - name: Capture fresh independent no-collector original packets and source pins
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 1024\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\" python -P - <<'PY_BINDING' >\"$proof/binding-imports.json\"\
        \nimport json, os\nfrom pathlib import Path\nimport msgq.ipc_pyx as ipc\nimport msgq.visionipc.visionipc_pyx as vision\n\
        root = (Path(os.environ[\"RUNNER_TEMP\"]) / \"model-msgq-python\").resolve(strict=True)\nlocations = [Path(ipc.__file__).resolve(strict=True),\
        \ Path(vision.__file__).resolve(strict=True)]\nassert all(path.is_relative_to(root) for path in locations), locations\n\
        print(json.dumps({\"binding_root\":str(root),\"extensions\":[str(path) for path in locations]},sort_keys=True))\n\
        PY_BINDING\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\" python -P \"$proof/capture_original_driver_no_collector.py\"\
        \ --root \"$GITHUB_WORKSPACE\" --source-commit \"$EXPECTED_SOURCE\" --expected-checker-sha256 ea1266dc395dab662319bd3637ad90440989db3d2937756dbf07fbb993520f5b\
        \ --binary \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-dmonitoringmodeld\" --catalog \"$RUNNER_TEMP/native-catalog\"\
        \ --models \"$RUNNER_TEMP/original-models\" --binding \"$RUNNER_TEMP/model-msgq-python\" --output \"$proof/original-no-collector\"\
        \ >\"$proof/original-no-collector.stdout\" 2>\"$proof/original-no-collector.stderr\" || { cat \"$proof/original-no-collector.stderr\"\
        ; exit 1; }\npython - <<'PY_NO_COLLECTOR_MANIFEST' >\"$proof/original-no-collector-summary.json\"\nimport json, os\n\
        from pathlib import Path\nproof = Path(os.environ[\"RUNNER_TEMP\"]) / \"driver-daemon-native-296\"\nmanifest = json.loads((proof\
        \ / \"original-no-collector/reference-manifest.json\").read_text())\nassert manifest[\"policy\"][\"collector_mode\"\
        ] == \"absent\"\nassert manifest[\"policy\"][\"requested_output_bytes_hex\"] == os.fsencode(proof / \"original-no-collector\"\
        ).hex()\nassert [(case[\"width\"], case[\"raw\"], case[\"frame_count\"], case[\"reference_count\"]) for case in manifest[\"\
        cases\"]] == [\n    (1344, True, 4, 5), (1344, False, 1, 2), (1928, True, 4, 5), (1928, False, 1, 2)]\nassert len(manifest[\"\
        files\"]) == 43 and len(manifest[\"original_source_inputs\"]) == 15\nreports = json.loads((proof / \"original-no-collector/report.json\"\
        ).read_text())[\"runs\"]\nassert len(reports) == 4 and all(report[\"logging\"] is None for report in reports)\nprint(json.dumps({\"\
        cases\":4,\"expected_packets\":14,\"input_frames\":10,\"logging\":None,\n                  \"imported_python_sources\"\
        :len(manifest[\"loaded_python_sources\"])},sort_keys=True))\nPY_NO_COLLECTOR_MANIFEST\nno_collector_sha=\"$(sha256sum\
        \ \"$proof/original-no-collector/reference-manifest.json\" | cut -d ' ' -f1)\"\nprintf 'DRIVER_DAEMON_NO_COLLECTOR_ORIGINAL_CAPTURE=%s\\\
        nDRIVER_DAEMON_NO_COLLECTOR_MANIFEST_SHA256=%s\\nDRIVER_DAEMON_NO_COLLECTOR_PEER=%s\\nDRIVER_DAEMON_NO_COLLECTOR_NATIVE_OUTPUT=%s\\\
        n' \"$proof/original-no-collector\" \"$no_collector_sha\" \"$proof/original-no-collector/driver-daemon-peer\" \"$proof/native-no-collector\"\
        \ >> \"$GITHUB_ENV\"\nsha256sum \"$proof/original-no-collector/driver-daemon-peer\" rust/target/debug/openpilot-dmonitoringmodeld\
        \ rust/target/debug/openpilot-logmessaged \"$RUNNER_TEMP/native-catalog/current.json\" \"$proof/original-no-collector/reference-manifest.json\"\
        \ >\"$proof/native-inputs-before.sha256\"\nprintf 'DRIVER_DAEMON_ORIGINAL_MANIFEST_SHA256=%s\\n' \"$no_collector_sha\"\
        \ >> \"$GITHUB_ENV\"\nprintf 'DRIVER_DAEMON_BINARY=%s\\nDRIVER_DAEMON_CATALOG=%s\\nDRIVER_DAEMON_COLLECTOR=%s\\nDRIVER_DAEMON_PEER=%s\\\
        nDRIVER_DAEMON_MODELS=%s\\nDRIVER_DAEMON_ROOT=%s\\nDRIVER_DAEMON_SOURCE_COMMIT=%s\\nDRIVER_DAEMON_ORIGINAL_CAPTURE=%s\\\
        nDRIVER_DAEMON_ORIGINAL_MANIFEST_SHA256=%s\\nDRIVER_DAEMON_NATIVE_OUTPUT=%s\\n' \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-dmonitoringmodeld\"\
        \ \"$RUNNER_TEMP/native-catalog\" \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged\" \"$proof/original-no-collector/driver-daemon-peer\"\
        \ \"$RUNNER_TEMP/original-models\" \"$GITHUB_WORKSPACE\" \"$EXPECTED_SOURCE\" \"$proof/original-no-collector\" \"\
        $no_collector_sha\" \"$proof/native-unused\" >>\"$GITHUB_ENV\"\ncat \"$proof/original-no-collector.stdout\"\n"
    - name: Capture unchanged original driver CLI help and admission failures
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH" python "$proof/capture_original_driver_cli.py" --root "$GITHUB_WORKSPACE"
        --checker-sha256 ea1266dc395dab662319bd3637ad90440989db3d2937756dbf07fbb993520f5b --output "$proof/original-cli" >"$proof/original-cli.summary.json"
        2>"$proof/original-cli.capture.stderr" || { cat "$proof/original-cli.capture.stderr"; exit 1; }

        sha256sum "$proof/original-cli/manifest.json" >"$proof/original-cli-manifest.sha256"

        '
    - name: Run source reference, mutation, parser and dual mode negatives without replay duplication
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test driver_daemon_check
        --locked -- --nocapture --skip actual_native_driver_replays_all_four_original_cases >"$proof/native-static-tests.log"
        2>&1 || { cat "$proof/native-static-tests.log"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test driver_daemon_no_collector
        --locked -- --nocapture --skip actual_native_driver_replays_all_four_without_collector >"$proof/native-no-collector-tests.log"
        2>&1 || { cat "$proof/native-no-collector-tests.log"; exit 1; }

        '
    - name: Capture positive original raw-byte alias output with full argv receipt
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\npython3 - <<'PY_RAW_ORIGINAL' >\"$proof/raw-original-summary.json\"\
        \nimport hashlib, json, os, stat, subprocess, sys\nfrom pathlib import Path\nproof = Path(os.environ[\"RUNNER_TEMP\"\
        ]) / \"driver-daemon-native-296\"\nascii_parent = proof / \"raw-ascii-parent\"\nascii_parent.mkdir()\nalias = os.fsencode(proof)\
        \ + b\"/raw-output-\\xff-alias\"\nos.symlink(os.fsencode(ascii_parent), alias)\nrequested = alias + b\"/original\"\
        \nrequested_native = alias + b\"/native\"\nlink = os.lstat(alias)\nassert stat.S_ISLNK(link.st_mode)\nreceipt = {\"\
        alias_bytes_hex\":alias.hex(), \"requested_original_bytes_hex\":requested.hex(),\n           \"requested_native_bytes_hex\"\
        :requested_native.hex(),\n           \"effective_original\":str(ascii_parent / \"original\"),\n           \"effective_native\"\
        :str(ascii_parent / \"native\"),\n           \"alias_target_bytes_hex\":os.fsencode(ascii_parent).hex(),\n       \
        \    \"alias_dev\":link.st_dev,\"alias_ino\":link.st_ino}\n(proof / \"raw-alias-before.json\").write_text(json.dumps(receipt,sort_keys=True,indent=2)+\"\
        \\n\")\ncommand = [sys.executable,\"-P\",os.fspath(proof / \"capture_original_driver_no_collector.py\"),\n       \
        \    \"--root\",os.environ[\"GITHUB_WORKSPACE\"],\"--source-commit\",os.environ[\"EXPECTED_SOURCE\"],\n          \
        \ \"--expected-checker-sha256\",\"ea1266dc395dab662319bd3637ad90440989db3d2937756dbf07fbb993520f5b\",\n          \
        \ \"--binary\",os.fspath(Path(os.environ[\"GITHUB_WORKSPACE\"]) / \"rust/target/debug/openpilot-dmonitoringmodeld\"\
        ),\n           \"--catalog\",os.fspath(Path(os.environ[\"RUNNER_TEMP\"]) / \"native-catalog\"),\n           \"--models\"\
        ,os.fspath(Path(os.environ[\"RUNNER_TEMP\"]) / \"original-models\"),\n           \"--binding\",os.fspath(Path(os.environ[\"\
        RUNNER_TEMP\"]) / \"model-msgq-python\"),\n           \"--output\",os.fsdecode(requested)]\n(proof / \"raw-original-argv.json\"\
        ).write_text(json.dumps({\"argv_hex\":[os.fsencode(arg).hex() for arg in command],\n    \"requested_output_bytes_hex\"\
        :requested.hex()},sort_keys=True,indent=2)+\"\\n\")\nenvironment = os.environ.copy()\nenvironment[\"PYTHONPATH\"]\
        \ = os.fspath(Path(os.environ[\"RUNNER_TEMP\"]) / \"model-msgq-python\") + os.pathsep + environment.get(\"PYTHONPATH\"\
        , \"\")\nresult = subprocess.run(command,capture_output=True,timeout=240,check=False,env=environment)\n(proof / \"\
        raw-original.stdout\").write_bytes(result.stdout)\n(proof / \"raw-original.stderr\").write_bytes(result.stderr)\n\
        status = {\"status\":result.returncode,\"requested_output_bytes_hex\":requested.hex(),\n          \"stdout_sha256\"\
        :hashlib.sha256(result.stdout).hexdigest(),\n          \"stderr_sha256\":hashlib.sha256(result.stderr).hexdigest()}\n\
        (proof / \"raw-original-status.json\").write_text(json.dumps(status,sort_keys=True,indent=2)+\"\\n\")\nassert result.returncode\
        \ == 0, \"original positive raw-output alias invocation failed\"\nmanifest_path = ascii_parent / \"original/reference-manifest.json\"\
        \nmanifest = json.loads(manifest_path.read_text())\nassert manifest[\"policy\"][\"collector_mode\"] == \"absent\"\n\
        assert manifest[\"policy\"][\"requested_output_bytes_hex\"] == requested.hex()\nreports = json.loads((ascii_parent\
        \ / \"original/report.json\").read_text())[\"runs\"]\nassert len(reports) == 4 and all(run[\"logging\"] is None for\
        \ run in reports)\nprint(json.dumps({\"cases\":4,\"source_expected_packets\":14,\n                  \"manifest_sha256\"\
        :hashlib.sha256(manifest_path.read_bytes()).hexdigest(),\n                  \"requested_output_bytes_hex\":requested.hex()},sort_keys=True))\n\
        PY_RAW_ORIGINAL\nsha256sum \"$proof/raw-ascii-parent/original/driver-daemon-peer\" \"$proof/raw-ascii-parent/original/reference-manifest.json\"\
        \ >>\"$proof/native-inputs-before.sha256\"\n"
    - name: Replay native CLI on held raw-byte alias and verify full report
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nsha256sum -c \"$proof/native-cli-elf-before.sha256\"\
        \ >\"$proof/raw-native-cli-elf-preflight.log\"\npython3 - <<'PY_RAW_NATIVE' >\"$proof/raw-native-summary.json\"\n\
        import hashlib, json, os, stat, subprocess\nfrom pathlib import Path\nproof = Path(os.environ[\"RUNNER_TEMP\"]) /\
        \ \"driver-daemon-native-296\"\nreceipt = json.loads((proof / \"raw-alias-before.json\").read_text())\nalias = bytes.fromhex(receipt[\"\
        alias_bytes_hex\"])\nrequested = bytes.fromhex(receipt[\"requested_native_bytes_hex\"])\nlink = os.lstat(alias)\n\
        assert stat.S_ISLNK(link.st_mode)\nassert (link.st_dev,link.st_ino) == (receipt[\"alias_dev\"],receipt[\"alias_ino\"\
        ])\nassert os.readlink(alias) == bytes.fromhex(receipt[\"alias_target_bytes_hex\"])\noriginal = proof / \"raw-ascii-parent/original\"\
        \nmanifest = original / \"reference-manifest.json\"\nbinary = Path(os.environ[\"GITHUB_WORKSPACE\"]) / \"rust/target/debug/check-driver-daemon\"\
        \ncommand = [os.fspath(binary),\n           \"--binary\",os.fspath(Path(os.environ[\"GITHUB_WORKSPACE\"]) / \"rust/target/debug/openpilot-dmonitoringmodeld\"\
        ),\n           \"--catalog\",os.fspath(Path(os.environ[\"RUNNER_TEMP\"]) / \"native-catalog\"),\n           \"--models\"\
        ,os.fspath(Path(os.environ[\"RUNNER_TEMP\"]) / \"original-models\"),\n           \"--output\",os.fsdecode(requested),\n\
        \           \"--native-peer\",os.fspath(original / \"driver-daemon-peer\"),\n           \"--native-original-dir\"\
        ,os.fspath(original),\n           \"--native-original-manifest-sha256\",hashlib.sha256(manifest.read_bytes()).hexdigest(),\n\
        \           \"--native-source-commit\",os.environ[\"EXPECTED_SOURCE\"],\n           \"--native-root\",os.environ[\"\
        GITHUB_WORKSPACE\"]]\n(proof / \"raw-native-argv.json\").write_text(json.dumps({\"argv_hex\":[os.fsencode(arg).hex()\
        \ for arg in command],\n    \"requested_output_bytes_hex\":requested.hex()},sort_keys=True,indent=2)+\"\\n\")\nresult\
        \ = subprocess.run(command,capture_output=True,timeout=240,check=False)\n(proof / \"raw-native.stdout\").write_bytes(result.stdout)\n\
        (proof / \"raw-native.stderr\").write_bytes(result.stderr)\nstatus = {\"status\":result.returncode,\"requested_output_bytes_hex\"\
        :requested.hex(),\n          \"stdout_sha256\":hashlib.sha256(result.stdout).hexdigest(),\n          \"stderr_sha256\"\
        :hashlib.sha256(result.stderr).hexdigest()}\n(proof / \"raw-native-status.json\").write_text(json.dumps(status,sort_keys=True,indent=2)+\"\
        \\n\")\nassert result.returncode == 0, \"native positive raw-output alias invocation failed\"\neffective = proof /\
        \ \"raw-ascii-parent/native\"\nreport = json.loads((effective / \"report.json\").read_text())\nrows = [json.loads(line)\
        \ for line in result.stdout.decode().splitlines() if line.strip()]\nassert len(rows) == len(report[\"runs\"]) == 4\
        \ and rows == report[\"runs\"]\nassert report[\"original_manifest_sha256\"] == hashlib.sha256(manifest.read_bytes()).hexdigest()\n\
        assert report[\"inputs\"][\"collector\"] is None\nassert all(case.get(\"logging\", \"missing\") is None for case in\
        \ rows)\nassert [(case[\"camera\"],case[\"raw_predictions\"],case[\"frames\"],case[\"compared_fields\"]) for case\
        \ in rows] == [\n    ([1344,760],True,4,188),([1344,760],False,1,47),\n    ([1928,1208],True,4,188),([1928,1208],False,1,47)]\n\
        assert report[\"inputs\"][\"imported_python_sources\"]\nfor case in rows:\n    label=f'{case[\"camera\"][0]}-raw-{int(case[\"\
        raw_predictions\"])}'\n    assert not (effective/label/\"logging\").exists()\nassert sum(len(case[\"packets\"]) for\
        \ case in rows) == 10\nlink_after = os.lstat(alias)\nassert (link_after.st_dev,link_after.st_ino) == (link.st_dev,link.st_ino)\n\
        assert os.readlink(alias) == bytes.fromhex(receipt[\"alias_target_bytes_hex\"])\n(proof / \"raw-alias-after.json\"\
        ).write_text(json.dumps(receipt,sort_keys=True,indent=2)+\"\\n\")\nos.unlink(alias)\nassert not os.path.lexists(alias)\n\
        (proof / \"raw-alias-removed.json\").write_text(json.dumps({\"alias_bytes_hex\":alias.hex(),\"removed\":True},sort_keys=True)+\"\
        \\n\")\nprint(json.dumps({\"cases\":4,\"packets\":10,\"requested_output_bytes_hex\":requested.hex(),\n           \
        \       \"report_sha256\":hashlib.sha256((effective / \"report.json\").read_bytes()).hexdigest()},sort_keys=True))\n\
        PY_RAW_NATIVE\nsha256sum -c \"$proof/native-cli-elf-before.sha256\" >\"$proof/raw-native-cli-elf-after.log\"\n"
    - name: Verify post-traffic source, executable and original model identities
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sha256sum -c "$proof/inputs-before.sha256" >"$proof/inputs-after.log"

        sha256sum -c "$proof/models-before.sha256" >"$proof/models-after.log"

        sha256sum -c "$proof/binding-before.sha256" >"$proof/binding-after.log"

        find "$RUNNER_TEMP/model-msgq-python/msgq" -type f -print | sort >"$proof/binding-roster-after.txt"

        diff -u "$proof/binding-roster-before.txt" "$proof/binding-roster-after.txt" >"$proof/binding-roster.diff"

        sha256sum -c "$proof/native-inputs-before.sha256" >"$proof/native-inputs-after.log"

        sha256sum "$proof/original-no-collector/reference-manifest.json" "$proof/raw-ascii-parent/original/reference-manifest.json"
        "$proof/raw-ascii-parent/native/report.json" >"$proof/receipts.sha256"

        '
    - name: Retain identity diagnostics and remove only owned raw alias
      if: always()
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nif test -f \"$proof/inputs-before.sha256\"\
        ; then sha256sum -c \"$proof/inputs-before.sha256\" >\"$proof/inputs-final.log\" 2>&1 || true; fi\nif test -f \"$proof/models-before.sha256\"\
        ; then sha256sum -c \"$proof/models-before.sha256\" >\"$proof/models-final.log\" 2>&1 || true; fi\nif test -f \"$proof/binding-before.sha256\"\
        ; then sha256sum -c \"$proof/binding-before.sha256\" >\"$proof/binding-final.log\" 2>&1 || true; fi\nif test -f \"\
        $proof/native-inputs-before.sha256\"; then sha256sum -c \"$proof/native-inputs-before.sha256\" >\"$proof/native-inputs-final.log\"\
        \ 2>&1 || true; fi\ngit rev-parse HEAD >\"$proof/source-final.txt\"\npython3 - <<'PY_ALIAS_CLEANUP'\nimport json,\
        \ os, stat\nfrom pathlib import Path\nproof = Path(os.environ[\"RUNNER_TEMP\"]) / \"driver-daemon-native-296\"\nalias\
        \ = os.fsencode(proof) + b\"/raw-output-\\xff-alias\"\nif os.path.lexists(alias):\n    actual = os.lstat(alias)\n\
        \    expected = os.fsencode(proof / \"raw-ascii-parent\")\n    if stat.S_ISLNK(actual.st_mode) and os.readlink(alias)\
        \ == expected:\n        os.unlink(alias)\n        (proof / \"raw-alias-cleanup.json\").write_text(json.dumps({\"alias_bytes_hex\"\
        :alias.hex(),\"removed_owned_symlink\":True},sort_keys=True)+\"\\n\")\n    else:\n        (proof / \"raw-alias-cleanup.json\"\
        ).write_text(json.dumps({\"alias_bytes_hex\":alias.hex(),\"removed_owned_symlink\":False,\"foreign_replacement\":True},sort_keys=True)+\"\
        \\n\")\nPY_ALIAS_CLEANUP\n"
