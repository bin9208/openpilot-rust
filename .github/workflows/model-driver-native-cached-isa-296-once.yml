name: 296 native cached-image ISA admission without program execution
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-native-cached-isa-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  native-isa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: bb3b4fdd34498c253d030468832bebe3db09224e
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_RETRY: '2'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bb3b4fdd34498c253d030468832bebe3db09224e
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Stage authenticated complete images and native candidate
      id: stage
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nsudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/.ghcup\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib\
        \ 4096\nproof=\"$RUNNER_TEMP/native-cached-isa-proof\"\nproject=\"$RUNNER_TEMP/native-cached-isa-project\"\nmkdir\
        \ \"$proof\" \"$project\"\nprintf 'CARGO_HOME=%s\\nCARGO_TARGET_DIR=%s\\n' \"$RUNNER_TEMP/native-cached-isa-cargo\"\
        \ \"$RUNNER_TEMP/native-cached-isa-target\" >> \"$GITHUB_ENV\"\nbase64 --decode <<'NATIVE_ISA_0' > \"$project/cached_program_isa.rs\"\
        \\n\
        NATIVE_ISA_0\nprintf '%s  %s\\n' 6a8e7972058d6ba0ff68d640644eb5078c24496744b30ef9c52743ad5e506de2 \"$project/cached_program_isa.rs\"\
        \ | sha256sum --check --strict -\nbase64 --decode <<'NATIVE_ISA_1' > \"$project/cached_program_isa_main.rs\"\\n\
        NATIVE_ISA_1\nprintf '%s  %s\\n' 331be061e93d14138768eda093cb6295d4239e3675febf9f5afcfcbc0d0857b5 \"$project/cached_program_isa_main.rs\"\
        \ | sha256sum --check --strict -\nbase64 --decode <<'NATIVE_ISA_2' > \"$project/cached_program_fixture.rs\"\\n\
        NATIVE_ISA_2\nprintf '%s  %s\\n' 6c4f750cf32d778ea8f353c5893b4d4127d2f31b8e57548ae948fc200296ac26 \"$project/cached_program_fixture.rs\"\
        \ | sha256sum --check --strict -\nbase64 --decode <<'NATIVE_ISA_3' > \"$project/Cargo.toml\"\\n\
        NATIVE_ISA_3\nprintf '%s  %s\\n' 7525db4e95342b0e51191f3cccb8d342b4748cf8d5ffea5aab2d5c003f4a2172 \"$project/Cargo.toml\"\
        \ | sha256sum --check --strict -\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12421643434/zip > \"$proof/input.zip\"\
        \nprintf '%s  %s\\n' 10b556335f30e0f9cf96e2d7679c2f95205d24d1f07239c28f8baa8ecdd50c35 \"$proof/input.zip\" | sha256sum\
        \ --check --strict -\n# Only stdlib data extraction; no project import, unpickle or generated-code load.\npython -\
        \ \"$proof/input.zip\" \"$project\" \"$proof\" <<'EXTRACT'\nimport hashlib,json,re,sys,zipfile\nfrom pathlib import\
        \ Path\narchive,project,proof=map(Path,sys.argv[1:]); raw=archive.read_bytes()\nassert len(raw)==500840 and hashlib.sha256(raw).hexdigest()=='10b556335f30e0f9cf96e2d7679c2f95205d24d1f07239c28f8baa8ecdd50c35'\n\
        with zipfile.ZipFile(archive) as z:\n assert len(z.infolist())==71 and len(set(z.namelist()))==71 and z.testzip()\
        \ is None\n prefix='cached-program-packaging-296/result/'\n metadata=(project/'cached_program_fixture.rs').read_text()\n\
        \ entries=re.findall(r'include_bytes!\\(\"(cached_program_[0-9]+)\\.bin\"\\),\\s*([0-9]+),\\s*\"([0-9a-f]{64})\",\\\
        s*\"([0-9a-f]{64})\"',metadata)\n assert len(entries)==44\n result=json.loads(z.read(prefix+'result.json'))\n assert\
        \ result['status']=='ALL44_CACHED_IMAGES_PACKAGED_BYTE_EXACT' and len(result['programs'])==44\n assert result['source']=='3fd4e7a4f38764e8d56a1696e1d89be8080cdfc4'\
        \ and result['program_code_executed'] is False\n for index,row in enumerate(result['programs']):\n  assert row['symbol']=='cached_program_'+str(index)\n\
        \  body=z.read(prefix+row['symbol']+'.bin')\n  assert len(body)==row['cached_binary_bytes']<=16*1024*1024 and hashlib.sha256(body).hexdigest()==row['cached_binary_sha256']\n\
        \  text=[s for s in row['relocations']['sections'] if s['name']=='.text'];assert len(text)==1 and text[0]['offset']==0\n\
        \  assert entries[index]==(row['symbol'],str(text[0]['bytes']),row['source_sha256'],row['cached_binary_sha256'])\n\
        \  (project/(row['symbol']+'.bin')).write_bytes(body)\n (proof/'authenticated-packaging-receipt.json').write_text(json.dumps(result,indent=2)+'\\\
        n')\nEXTRACT\nfind \"$project\" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/project.before.sha256\"\
        \nfind \"$project\" -maxdepth 1 -type f -print0 | sort -z | xargs -0 stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' > \"\
        $proof/project.before.identities\"\ngit rev-parse HEAD > \"$proof/source.txt\"\nprintf '%s\\n' \"$GITHUB_WORKFLOW_SHA\"\
        \ > \"$proof/workflow.txt\"\nsha256sum \"$proof/input.zip\" > \"$proof/input.before.sha256\"\nlscpu --json > \"$proof/lscpu.json\"\
        \ncat /proc/cpuinfo > \"$proof/cpuinfo.txt\"\nuname -a > \"$proof/uname.txt\"\n"
    - name: Compile only isolated native verifier and negative units
      id: build
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/native-cached-isa-proof"

        project="$RUNNER_TEMP/native-cached-isa-project"

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        rustc -Vv > "$proof/rustc.txt"

        cargo -V > "$proof/cargo.txt"

        cargo clippy -V > "$proof/clippy.txt"

        cargo generate-lockfile --manifest-path "$project/Cargo.toml"

        cargo fetch --locked --manifest-path "$project/Cargo.toml"

        cp "$project/Cargo.lock" "$proof/Cargo.lock"

        # Record complete fetched provider files, registry archives and checksum manifests.

        find "$CARGO_HOME/registry" -type f ! -path ''*/index/*'' -print0 | sort -z | xargs -0 sha256sum > "$proof/providers.before.sha256"

        find "$CARGO_HOME/registry" -name .cargo-checksum.json -type f -print0 | sort -z | tar --create --gzip --null --verbatim-files-from
        --no-recursion --files-from=- --file="$proof/provider-checksum-manifests.tar.gz"

        cargo clippy --offline --locked --manifest-path "$project/Cargo.toml" --all-targets -- -D warnings > "$proof/clippy.log"
        2>&1 || { cat "$proof/clippy.log"; exit 1; }

        cargo build --offline --locked --manifest-path "$project/Cargo.toml" --bin cached-program-isa-296 > "$proof/build.log"
        2>&1 || { cat "$proof/build.log"; exit 1; }

        cargo test --offline --locked --manifest-path "$project/Cargo.toml" --no-run --message-format=json > "$proof/test-artifacts.jsonl"
        2> "$proof/test-compile.log" || { cat "$proof/test-compile.log"; exit 1; }

        test_binary=$(jq -sr ''[.[] | select(.reason == "compiler-artifact" and .target.name == "cached-program-isa-296" and
        .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error("expected
        one test ELF") end'' "$proof/test-artifacts.jsonl")

        verifier=$(readlink -f "$CARGO_TARGET_DIR/debug/cached-program-isa-296")

        test -x "$verifier" && test -x "$test_binary"

        printf ''%s\n'' "$verifier" "$test_binary" "$(readlink -f "$(rustup which rustc)")" "$(readlink -f "$(rustup which
        cargo)")" "$project/Cargo.lock" > "$proof/binding-paths.txt"

        while IFS= read -r file; do sha256sum "$file"; done < "$proof/binding-paths.txt" > "$proof/native.before.sha256"

        while IFS= read -r file; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$file"; done < "$proof/binding-paths.txt" >
        "$proof/native.before.identities"

        test "$(stat -c ''%s'' "$verifier")" -le 67108864 && test "$(stat -c ''%s'' "$test_binary")" -le 67108864

        cp "$verifier" "$proof/native-isa-verifier"

        cp "$test_binary" "$proof/native-isa-negative-units"

        cp "$project"/*.rs "$project/Cargo.toml" "$proof/"

        sha256sum "$proof/native-isa-verifier" "$proof/native-isa-negative-units" > "$proof/retained-ELFs.sha256"

        printf ''NATIVE_ISA_TEST_BINARY=%s\nNATIVE_ISA_BINARY=%s\n'' "$test_binary" "$verifier" >> "$GITHUB_ENV"

        '
    - name: Execute negative units and inert all44 admission
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/native-cached-isa-proof"

        # Only the native decoder/tests execute. The supplied programs remain inert bytes.

        timeout --signal=KILL 120 "$NATIVE_ISA_TEST_BINARY" --nocapture > "$proof/negative-units.log" 2>&1 || { cat "$proof/negative-units.log";
        exit 1; }

        grep -F ''5 passed; 0 failed'' "$proof/negative-units.log"

        timeout --signal=KILL 120 "$NATIVE_ISA_BINARY" > "$proof/native-isa.json" 2> "$proof/native-isa.stderr"

        jq -e ''.status == "ALL44_INERT_ISA_ADMISSION" and (.programs | length) == 44 and .generated_code_executed == false
        and .ABI_or_numeric_acceptance == false and all(.programs[]; .instructions > 0 and .text_bytes > 0)'' "$proof/native-isa.json"
        > /dev/null

        printf ''0\n'' > "$proof/native-run.status"

        '
    - name: Independent always complete input/provider/ELF guards
      if: always() && steps.stage.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/native-cached-isa-proof"

        project="$RUNNER_TEMP/native-cached-isa-project"

        status=0

        sha256sum --check --strict "$proof/input.before.sha256" > "$proof/input.after.log" 2>&1 || status=1

        sha256sum --check --strict "$proof/project.before.sha256" > "$proof/project.after.log" 2>&1 || status=1

        # Cargo.lock is created during fetch; all original source/image identities stay fixed.

        find "$project" -maxdepth 1 -type f ! -name Cargo.lock -print0 | sort -z | xargs -0 stat --printf ''%n:%d:%i:%s:%f:%y:%z\n''
        > "$proof/project.after.identities"

        cmp "$proof/project.before.identities" "$proof/project.after.identities" || status=1

        sha256sum --check --strict "$proof/providers.before.sha256" > "$proof/providers.after.log" 2>&1 || status=1

        sha256sum --check --strict "$proof/native.before.sha256" > "$proof/native.after.log" 2>&1 || status=1

        while IFS= read -r file; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$file" || status=1; done < "$proof/binding-paths.txt"
        > "$proof/native.after.identities"

        cmp "$proof/native.before.identities" "$proof/native.after.identities" || status=1

        test "$(cat "$proof/native-run.status")" = 0 || status=1

        printf ''%s\n'' "$status" > "$proof/independent-final.status"

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-native-cached-isa-296
        retention-days: 7
        include-hidden-files: true
        if-no-files-found: error
        path: ${{ runner.temp }}/native-cached-isa-proof/
