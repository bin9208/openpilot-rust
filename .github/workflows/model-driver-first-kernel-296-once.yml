name: model driver first kernel natural-host preflight diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-first-kernel-296-once.yml
permissions:
  contents: read
jobs:
  driver-first-kernel-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        sample:
        - 0
        - 1
        - 2
        - 3
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_SOURCE: d61079461c0e217056095fcd56d6831230317137
      DIAGNOSTIC_SAMPLE: ${{ matrix.sample }}
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      CPU_COUNT: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DIAGNOSTIC_ATTEMPT: 20261022-natural-avx512-attempt-01
    steps:
    - uses: actions/checkout@v7
      with:
        ref: d61079461c0e217056095fcd56d6831230317137
        persist-credentials: false
    - name: Record natural CPU and skip only already matching non-AVX512 EPYC 7763
      id: cpu_preflight
      shell: bash
      run: "set -euo pipefail\npreflight=\"$RUNNER_TEMP/model-driver-first-kernel-preflight-296\"\nmkdir \"$preflight\"\n\
        test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\ngit rev-parse HEAD > \"$preflight/SOURCE_COMMIT\"\nprintf '%s\\\
        n' \"$DIAGNOSTIC_ATTEMPT\" > \"$preflight/DIAGNOSTIC_ATTEMPT\"\nprintf '%s\\n' \"$DIAGNOSTIC_SAMPLE\" > \"$preflight/DIAGNOSTIC_SAMPLE\"\
        \nlscpu --json > \"$preflight/lscpu.json\"\ncat /proc/cpuinfo > \"$preflight/proc-cpuinfo.txt\"\nuname -a > \"$preflight/uname.txt\"\
        \nrun=true\nstatus=ELIGIBLE_NATURAL_HOST\nif awk 'BEGIN { found=0; bad=0 } /^model name[[:space:]]*:/ { sub(/^[^:]*:[[:space:]]*/,\
        \ \"\"); found++; if ($0 != \"AMD EPYC 7763 64-Core Processor\") bad=1 } END { exit !(found>0 && bad==0) }' \"$preflight/proc-cpuinfo.txt\"\
        \ && ! grep -Eq '(^|[[:space:]])avx512f([[:space:]]|$)' \"$preflight/proc-cpuinfo.txt\"; then\n  run=false\n  status=SKIPPED_ALREADY_MATCHING_HOST\n\
        fi\nprintf 'run_diagnostic=%s\\n' \"$run\" >> \"$GITHUB_OUTPUT\"\nprintf 'status=%s\\n' \"$status\" >> \"$GITHUB_OUTPUT\"\
        \nprintf '%s\\n' \"$status\" > \"$preflight/status.txt\"\nprintf '{\"status\":\"%s\",\"diagnostic_only\":true,\"comparison_executed\"\
        :false,\"retirement_acceptance\":false}\\n' \"$status\" > \"$preflight/preflight.json\"\nsha256sum \"$preflight/lscpu.json\"\
        \ \"$preflight/proc-cpuinfo.txt\" \"$preflight/uname.txt\" > \"$preflight/cpu-evidence.sha256\"\nprintf '%s\\n' \"\
        $status\"\n"
    - name: Reserve hosted capacity and install bounded native prerequisites
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 12288

        mkdir "$RUNNER_TEMP/model-driver-first-kernel-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev
        libzmq3-dev jq

        rustup toolchain install 1.94.0 --profile minimal

        '
      if: success() && steps.cpu_preflight.outputs.run_diagnostic == 'true'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
      if: success() && steps.cpu_preflight.outputs.run_diagnostic == 'true'
    - name: Install original model execution dependencies
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-driver-first-kernel-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        python -m pip freeze > "$proof/providers.before.txt"

        '
      if: success() && steps.cpu_preflight.outputs.run_diagnostic == 'true'
    - name: Build only the native fixture, catalog and CPU model runner
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-driver-first-kernel-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run > "$proof/model-run-build.log"
        2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --bin
        stage-driver-daemon-fixture --bin prepare-model-family-catalog > "$proof/driver-tools-build.log" 2>&1 || { cat "$proof/driver-tools-build.log";
        exit 1; }

        '
      if: success() && steps.cpu_preflight.outputs.run_diagnostic == 'true'
    - name: Record actual hosted CPU and Rust toolchain profile
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-driver-first-kernel-296"

        lscpu --json > "$proof/cpu-profile.json"

        cat /proc/cpuinfo > "$proof/proc-cpuinfo.txt"

        rustc -vV > "$proof/rustc-version.txt"

        uname -a > "$proof/uname.txt"

        '
      if: success() && steps.cpu_preflight.outputs.run_diagnostic == 'true'
    - name: Stage the independent current driver inputs and compile current-host catalog
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-driver-first-kernel-296\"\ngit rev-parse HEAD > \"$proof/SOURCE_COMMIT\"\
        \nprintf '%s\\n' \"$GITHUB_SHA\" > \"$proof/WORKFLOW_COMMIT\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$RUNNER_TEMP\" --growth-mib 6144\nrust/target/debug/stage-driver-daemon-fixture --root \"$GITHUB_WORKSPACE\" --output\
        \ \"$proof/driver-fixture\" > \"$proof/fixture-stage.json\"\nmodels=\"$proof/driver-fixture/no-collector/models\"\n\
        manifest=\"$proof/driver-fixture/no-collector/observations/reference-manifest.json\"\nrust/target/debug/prepare-model-family-catalog\
        \ --root \"$GITHUB_WORKSPACE\" --models \"$models\" --expected-model-manifest \"$manifest\" --expected-model-manifest-sha256\
        \ 1b8e6cea511e9f212cd7737688b3e2ec0a165b9ff985b492f0e98c4639f18380 --kind driver --python \"$(command -v python)\"\
        \ --llvm \"$LLVM_PATH\" --output \"$proof/driver-catalog\" > \"$proof/catalog.stdout\" 2> \"$proof/catalog.stderr\"\
        \ || { cat \"$proof/catalog.stderr\"; exit 1; }\nrust/target/debug/model-run --check-catalog \"$proof/driver-catalog/catalog\"\
        \ > \"$proof/catalog-check.json\"\ngeneration=$(jq -r .generation \"$proof/driver-catalog/catalog/current.json\")\n\
        jq -e '.bundles | any(.kind == \"driver\" and .camera == [1344,760])' \"$proof/driver-catalog/catalog/$generation/index.json\"\
        \ > /dev/null\ndirectory=$(jq -r '.bundles[] | select(.kind == \"driver\" and .camera == [1344,760]) | .directory'\
        \ \"$proof/driver-catalog/catalog/$generation/index.json\")\ntest -n \"$directory\"\nprintf '%s\\n' \"$proof/driver-catalog/catalog/$generation/$directory\"\
        \ > \"$proof/driver-bundle-path.txt\"\nfind \"$models\" -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/model-roster.sha256\"\
        \nfor expected in expected-0.bin expected-1.bin; do\n  cp \"$proof/driver-fixture/collector-current/observations/1344-raw-1/reference/$expected\"\
        \ \"$proof/$expected\"\ndone\nsha256sum \"$proof/expected-0.bin\" \"$proof/expected-1.bin\" > \"$proof/frozen-expected.sha256\"\
        \nfind \"$proof/driver-catalog/catalog\" -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/catalog.before.sha256\"\
        \nsha256sum \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/dmonitoringmodeld.py\" \"$GITHUB_WORKSPACE/openpilot/common/transformations/model.py\"\
        \ \"$GITHUB_WORKSPACE/openpilot/common/transformations/camera.py\" \"$GITHUB_WORKSPACE/openpilot/system/camerad/cameras/nv12_info.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/check_pipeline_reference.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/original.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/pipeline.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/capture.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/engine/realize.py\" > \"$proof/source-closure.before.sha256\"\n"
      if: success() && steps.cpu_preflight.outputs.run_diagnostic == 'true'
    - name: Identify the first differing original retained-binary versus native exported kernel
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-driver-first-kernel-296\"\ncat > \"$proof/fp-observe.c\" <<'C'\n\
        #include <fenv.h>\n#include <stdint.h>\n\n/* Hosted x86-64 observation only. Never changes the floating-point environment.\
        \ */\nuint32_t diagnostic_mxcsr(void) {\n  uint32_t value;\n  __asm__ volatile(\"stmxcsr %0\" : \"=m\"(value));\n\
        \  return value;\n}\n\nint diagnostic_round(void) { return fegetround(); }\nC\ncc -shared -fPIC -O0 -o \"$proof/fp-observe.so\"\
        \ \"$proof/fp-observe.c\" -lm\nsha256sum \"$proof/fp-observe.c\" \"$proof/fp-observe.so\" > \"$proof/fp-observe.sha256\"\
        \ncat > \"$proof/diagnose.py\" <<'PY'\n\"\"\"Hosted diagnostic only: first differing original-binary/native-export\
        \ driver call.\n\nThis file is embedded in the one-off workflow. It is not a model oracle or a\nproduction fallback.\
        \ No checked-in runtime code is modified by this probe.\n\"\"\"\n\nimport ctypes\nimport hashlib\nimport json\nimport\
        \ os\nimport threading\nfrom pathlib import Path\n\nimport numpy as np\nfrom tinygrad.device import Buffer\nfrom tinygrad.dtype\
        \ import _to_np_dtype\nfrom tinygrad.engine.realize import ExecContext, exec_copy, exec_kernel, resolve_params\nfrom\
        \ tinygrad.uop.ops import Ops\nfrom tinygrad.runtime.ops_cpu import CPUComputeQueue\n\nfrom check_pipeline_reference\
        \ import execute, write_tensor\nfrom model_export.original import DriverArtifacts, driver\nfrom openpilot.common.transformations.camera\
        \ import _ar_ox_fisheye, _os_fisheye\nfrom openpilot.common.transformations.model import dmonitoringmodel_intrinsics\n\
        from openpilot.cereal import log\n\n\nROOT = Path(os.environ[\"GITHUB_WORKSPACE\"])\nPROOF = Path(os.environ[\"RUNNER_TEMP\"\
        ]) / \"model-driver-first-kernel-296\"\nOUT = PROOF / \"first-kernel\"\nOUT.mkdir()\nMAX_BASE = 32 * 1024 * 1024\n\
        MAX_CALL_SNAPSHOT = 64 * 1024 * 1024\nMAX_DUMP = 1024 * 1024\nFENV = ctypes.CDLL(str(PROOF / \"fp-observe.so\"))\n\
        FENV.diagnostic_mxcsr.restype = ctypes.c_uint32\nFENV.diagnostic_round.restype = ctypes.c_int\nORIGINAL_EXEC = CPUComputeQueue._exec\n\
        ACTIVE_CALL = None\nWORKER_FP = []\n\n\ndef fp_state():\n    return {\"tid\": threading.get_native_id(), \"mxcsr\"\
        : FENV.diagnostic_mxcsr(), \"fegetround\": FENV.diagnostic_round()}\n\n\ndef observe_original_worker(queue, tid, prg,\
        \ bufs, *args):\n    call = ACTIVE_CALL\n    before = fp_state() if call is not None else None\n    try:\n       \
        \ return ORIGINAL_EXEC(queue, tid, prg, bufs, *args)\n    finally:\n        if call is not None:\n            WORKER_FP.append({\"\
        call\": call, \"worker\": tid, \"before\": before, \"after\": fp_state()})\n\n\nCPUComputeQueue._exec = observe_original_worker\n\
        EXPECTED = {\n    \"warmup\": \"ace8ee6c6ff7cf8aa6f1881dd9eae6dc9cba15bb75bcc7bd70a5af03ddef500e\",\n    \"frame-0\"\
        : \"99b8b2fe7aa17098a366d1bb5e40a2b5a40561f0186ab4dcd33fb29a6dc358fc\",\n}\n\n\ndef sha(data):\n    return hashlib.sha256(data).hexdigest()\n\
        \n\ndef save_json(name, value):\n    (OUT / name).write_text(json.dumps(value, sort_keys=True, indent=2) + \"\\n\"\
        )\n\n\ndef snapshot(buffers):\n    unique = {}\n    for buffer in buffers:\n        # capture_cpu.host_buffer admits\
        \ CPU, NPY and PYTHON. The first\n        # composed call copies the NPY transform into its CPU work buffer.\n   \
        \     if not isinstance(buffer, Buffer) or buffer.device.split(\":\")[0] not in {\"CPU\", \"NPY\", \"PYTHON\"}:\n\
        \            raise RuntimeError(\"original call left exporter host-buffer contract\")\n        base = buffer.base\n\
        \        if base.nbytes > MAX_BASE:\n            raise RuntimeError(\"diagnostic base exceeds 32 MiB\")\n        unique[id(base)]\
        \ = base\n    if sum(base.nbytes for base in unique.values()) > MAX_CALL_SNAPSHOT:\n        raise RuntimeError(\"\
        diagnostic call snapshot exceeds 64 MiB\")\n    return {key: (base, bytes(raw_view(base))) for key, base in unique.items()}\n\
        \n\ndef raw_view(buffer):\n    buffer.ensure_allocated()\n    kind = buffer.device.split(\":\")[0]\n    if kind ==\
        \ \"NPY\":\n        array = buffer._buf\n        if not array.flags.c_contiguous or array.nbytes != buffer.nbytes:\n\
        \            raise RuntimeError(\"original NPY buffer lacks direct contiguous storage\")\n        view = memoryview(array).cast(\"\
        B\")\n    elif kind == \"PYTHON\":\n        view = memoryview(buffer._buf).cast(\"B\")\n    elif kind == \"CPU\":\n\
        \        view = buffer.as_memoryview(force_zero_copy=True)\n    else:\n        raise RuntimeError(\"original host\
        \ buffer kind changed\")\n    if len(view) != buffer.nbytes:\n        raise RuntimeError(\"original direct buffer\
        \ view length changed\")\n    return view\n\n\ndef restore(state):\n    for base, content in state.values():\n   \
        \     view = raw_view(base)\n        if bytes(view) == content:\n            continue  # Includes unchanged read-only\
        \ input buffers.\n        if view.readonly:\n            raise RuntimeError(\"original execution changed a read-only\
        \ host input\")\n        if base.device.split(\":\")[0] == \"CPU\":\n            # HCQAllocator._copyin obtains a\
        \ writable ctypes pointer to its\n            # source, so immutable snapshot bytes need a bounded bytearray.\n  \
        \          base.copyin(memoryview(bytearray(content)))\n        else:\n            # NpyAllocator has no _copyin;\
        \ use its real contiguous ndarray\n            # backing. PythonAllocator likewise owns a direct memoryview.\n   \
        \         view[:] = content\n        if bytes(raw_view(base)) != content:\n            raise RuntimeError(\"host buffer\
        \ prestate restoration failed\")\n\n\ndef after(state):\n    return {key: bytes(raw_view(base)) for key, (base, _)\
        \ in state.items()}\n\n\ndef first_difference(a, b):\n    if len(a) != len(b):\n        return min(len(a), len(b))\n\
        \    return next((index for index, (x, y) in enumerate(zip(a, b)) if x != y), None)\n\n\ndef bounded_bytes(prefix,\
        \ name, data, limit=MAX_DUMP):\n    filename = f\"{prefix}-{name}.bin\"\n    (OUT / filename).write_bytes(data[:limit])\n\
        \    return {\"file\": filename, \"bytes\": len(data), \"sha256\": sha(data), \"dumped_bytes\": min(len(data), limit)}\n\
        \n\ndef difference_window(prefix, name, data, offset):\n    start = max(0, offset - 4096)\n    end = min(len(data),\
        \ offset + 4097)\n    receipt = bounded_bytes(prefix, name, data[start:end])\n    return {**receipt, \"absolute_start\"\
        : start, \"absolute_end\": end}\n\n\ndef live_pointer(buffer):\n    if buffer.device.split(\":\")[0] == \"NPY\":\n\
        \        # NpyAllocator._as_buffer may call np.require, which could create a\n        # copy. Require the actual original\
        \ buffer's contiguous backing here.\n        raw_view(buffer)\n        array = buffer._buf\n        return array.ctypes.data,\
        \ array\n    view = raw_view(buffer)\n    if view.readonly:\n        raise RuntimeError(\"original host view has no\
        \ writable direct pointer\")\n    return ctypes.addressof(ctypes.c_char.from_buffer(view)), view\n\n\ndef verify_view(live,\
        \ view_id, graph, aliases):\n    view = graph[\"views\"][view_id]\n    allocation = view[\"allocation\"]\n    base\
        \ = live.base\n    if base.nbytes != graph[\"allocations\"][allocation][\"bytes\"] or live.offset != view[\"offset\"\
        ] or live.nbytes != view[\"bytes\"]:\n        raise RuntimeError(f\"graph/live view differs: {view_id}\")\n    prior\
        \ = aliases.setdefault(allocation, id(base))\n    if prior != id(base):\n        raise RuntimeError(f\"graph allocation\
        \ aliases two original bases: {allocation}\")\n\n\ndef original_inputs(original, label, raw):\n    frame = original.bindings.inputs[\"\
        frame\"]\n    shape = tuple(frame.shape)\n    if _to_np_dtype(frame.dtype) != np.dtype(\"uint8\") or int(np.prod(shape))\
        \ != len(raw) or frame.uop.base.buffer.nbytes != len(raw):\n        raise RuntimeError(\"source frame buffer does\
        \ not match sealed input\")\n    camera = _os_fisheye if _os_fisheye.width == 1344 else _ar_ox_fisheye\n    transform\
        \ = np.linalg.inv(np.dot(dmonitoringmodel_intrinsics, np.linalg.inv(camera.intrinsics))).astype(np.float32)\n    fixed\
        \ = np.array([[0.75, 0, 132], [0, 0.75, 113], [0, 0, 1]], dtype=np.float32)\n    if transform.tobytes() != fixed.tobytes():\n\
        \        raise RuntimeError(\"original transform differs from current Rust fixed input\")\n    calib = np.zeros(tuple(original.bindings.inputs[\"\
        calib\"].shape), dtype=np.float32)\n    values = {\"frame\": np.frombuffer(raw, dtype=np.uint8).copy().reshape(shape),\
        \ \"transform\": transform, \"calib\": calib}\n    for name, value in values.items():\n        write_tensor(original.bindings.inputs[name],\
        \ value)\n    return {name: {\"sha256\": sha(value.tobytes()), \"bytes\": value.nbytes} for name, value in values.items()}\n\
        \n\ndef run():\n    obs = PROOF / \"driver-fixture/collector-current/observations/1344-raw-1\"\n    models = PROOF\
        \ / \"driver-fixture/no-collector/models\"\n    bundle = Path((PROOF / \"driver-bundle-path.txt\").read_text().strip())\n\
        \    graph = json.loads((bundle / \"graph.json\").read_text())\n    descriptor = json.loads((bundle / \"pipeline.json\"\
        ).read_text())\n    if descriptor[\"kind\"] != \"driver\" or descriptor[\"camera\"] != [1344, 760] or descriptor[\"\
        nv12\"][\"bytes\"] != 2428928:\n        raise RuntimeError(\"driver catalog descriptor changed\")\n    original =\
        \ driver(DriverArtifacts(models / \"dmonitoring_model_tinygrad.pkl\", models / \"dm_warp_1344x760_tinygrad.pkl\",\
        \ models / \"dmonitoring_model_metadata.pkl\"))\n    baseline = driver(DriverArtifacts(models / \"dmonitoring_model_tinygrad.pkl\"\
        , models / \"dm_warp_1344x760_tinygrad.pkl\", models / \"dmonitoring_model_metadata.pkl\"))\n    linear = original.pipeline.jit.captured.linear.src\n\
        \    entries = graph[\"entrypoints\"]\n    if [(e[\"name\"], e[\"start\"], e[\"end\"]) for e in entries] != [(\"prepare\"\
        , 0, 2), (\"model\", 2, len(graph[\"calls\"]))]:\n        raise RuntimeError(\"driver entrypoint or call roster changed\"\
        )\n    library_path = bundle / \"kernels.so\"\n    library = ctypes.CDLL(str(library_path))\n    aliases = {}\n  \
        \  program_mapping = {}\n    native_index = 0\n    resolved_calls = []\n    for source_index, call in enumerate(linear):\n\
        \        if call.op is not Ops.CALL:\n            raise RuntimeError(\"non-call in composed original pipeline\")\n\
        \        operation = call.src[0]\n        buffers = [u.buffer for u in resolve_params(call, ())]\n        if operation.op\
        \ is Ops.SLICE:\n            if len(buffers) != 2 or buffers[0].base is not buffers[1].base:\n                raise\
        \ RuntimeError(\"original SLICE does not share its source base\")\n            resolved_calls.append((source_index,\
        \ None, call, operation, buffers, []))\n            continue\n        if operation.op not in (Ops.PROGRAM, Ops.COPY)\
        \ or native_index >= len(graph[\"calls\"]):\n            raise RuntimeError(\"original/exported call roster differs\"\
        )\n        emitted = graph[\"calls\"][native_index]\n        kernel = emitted[\"kernel\"]\n        signature = graph[\"\
        kernels\"][kernel]\n        live_args = [buffers[i] for i in operation.arg.globals] if operation.op is Ops.PROGRAM\
        \ else buffers\n        if len(live_args) != len(emitted[\"views\"]) or len(live_args) != signature[\"buffers\"]:\n\
        \            raise RuntimeError(\"original/exported kernel buffer arity differs\")\n        for live, view_id in zip(live_args,\
        \ emitted[\"views\"]):\n            verify_view(live, view_id, graph, aliases)\n        source_text = (bundle / f\"\
        kernel-{kernel}.txt\").read_text()\n        if operation.op is Ops.PROGRAM:\n            ir = operation.src[3].arg\n\
        \            retained = operation.src[4].arg\n            if not isinstance(ir, str) or not isinstance(retained, bytes)\
        \ or source_text != ir:\n                raise RuntimeError(\"original PROGRAM IR/retained binary differs from exported\
        \ kernel\")\n            if signature != {\"buffers\": len(operation.arg.globals), \"scalars\": len(operation.arg.vars)}:\n\
        \                raise RuntimeError(\"original/exported kernel ABI differs\")\n            if emitted[\"workers\"\
        ] != operation.arg.global_size[0] or emitted[\"core_id\"] != operation.arg.runtimevars.get(\"core_id\") or emitted[\"\
        scalars\"] != [0] * len(operation.arg.vars):\n                raise RuntimeError(\"original/exported launch arguments\
        \ differ\")\n            mapping = {\"operation\": \"PROGRAM\", \"original_binary_sha256\": sha(retained), \"original_binary_bytes\"\
        : len(retained), \"original_ir_sha256\": sha(ir.encode()), \"exported_ir_sha256\": sha(source_text.encode()), \"native_object_sha256\"\
        : sha((bundle / f\"kernel-{kernel}.o\").read_bytes())}\n        else:\n            if len(buffers) != 2 or buffers[0].nbytes\
        \ != buffers[1].nbytes or source_text != f\"copy:{buffers[0].nbytes}\" or signature != {\"buffers\": 2, \"scalars\"\
        : 0} or emitted[\"workers\"] != 1 or emitted[\"core_id\"] is not None:\n                raise RuntimeError(\"original/exported\
        \ COPY contract differs\")\n            mapping = {\"operation\": \"COPY\", \"copy_bytes\": buffers[0].nbytes}\n \
        \       if kernel in program_mapping and program_mapping[kernel] != mapping:\n            raise RuntimeError(\"one\
        \ exported kernel maps to different original operations\")\n        program_mapping[kernel] = mapping\n        resolved_calls.append((source_index,\
        \ native_index, call, operation, buffers, live_args))\n        native_index += 1\n    if native_index != len(graph[\"\
        calls\"]):\n        raise RuntimeError(\"exported call count differs from original linear pipeline\")\n    save_json(\"\
