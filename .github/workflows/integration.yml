name: Integration
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/tests.yaml
    with:
      run_number: '1'
  navigation:
    if: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/naver-ci.yml
  apk:
    if: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/naver-apk-tools.yml
  jetlink:
    if: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/jetlink.yml
  gate:
    name: ${{ (github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'integration gate' || 'Blocked source - integration gate awaits trusted validation' }}
    if: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()) }}
    needs: [build, navigation, apk, jetlink]
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 2
    steps:
      - name: Require every integration suite to succeed
        env:
          BUILD: ${{ needs.build.result }}
          NAVIGATION: ${{ needs.navigation.result }}
          APK: ${{ needs.apk.result }}
          JETLINK: ${{ needs.jetlink.result }}
        run: |
          test "$BUILD" = success
          test "$NAVIGATION" = success
          test "$APK" = success
          test "$JETLINK" = success
