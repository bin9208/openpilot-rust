name: 296 native beep controller twenty-case original proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/beep-reference-296-once.yml
permissions:
  contents: read
jobs:
  beep-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: 5f6104be47db0b3ae9131241726613788eeac747
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5f6104be47db0b3ae9131241726613788eeac747
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Pin checkout and install source binding prerequisites
      run: 'set -euo pipefail

        ulimit -c 0

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/beep-reference-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/source-commit.txt"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev libzmq3-dev strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5

        '
    - uses: ./.github/actions/native-json11
    - name: Build current example, controller and genuine original binding
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/beep-reference-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-beepd --example beep_trace --locked 2>&1 | tee "$proof/example-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --bin
        check-beep-reference --locked 2>&1 | tee "$proof/checker-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$proof/params-binding" > "$proof/binding.stdout"
        2> "$proof/binding.stderr"

        binding=("$proof"/params-binding/params_pyx*.so)

        test "${#binding[@]}" -eq 1

        printf ''BEEP_REFERENCE_BINARY=%s/rust/target/debug/examples/beep_trace\nBEEP_REFERENCE_BINDING=%s\n'' "$GITHUB_WORKSPACE"
        "${binding[0]}" >> "$GITHUB_ENV"

        printf ''BEEP_REFERENCE_ORIGINAL=%s/rust/crates/dev-tools/tests/fixtures/beep-reference/3835653-original\nBEEP_REFERENCE_ORIGINAL_MANIFEST_SHA256=0a02d6aacb5b930012a47886c389571d9cf3ff404ecd796171045f10734a9188\nBEEP_REFERENCE_EVIDENCE=%s/test-output\n''
        "$GITHUB_WORKSPACE" "$proof" >> "$GITHUB_ENV"

        sha256sum rust/target/debug/check-beep-reference rust/target/debug/examples/beep_trace "${binding[0]}" > "$proof/executables.sha256"

        '
    - name: Run native-only controller and retain every exec attempt
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/beep-reference-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\n/usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o \"$proof/controller.exec\" \"$GITHUB_WORKSPACE/rust/target/debug/check-beep-reference\"\
        \ --binary \"$BEEP_REFERENCE_BINARY\" --binding \"$BEEP_REFERENCE_BINDING\" --original \"$BEEP_REFERENCE_ORIGINAL\"\
        \ --original-manifest-sha256 \"$BEEP_REFERENCE_ORIGINAL_MANIFEST_SHA256\" --output \"$proof/cli-output\" > \"$proof/cli.stdout\"\
        \ 2> \"$proof/cli.stderr\"\npython - <<'PY'\nimport json,os,pathlib,re\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'beep-reference-296'\n\
        trace=(p/'controller.exec').read_text().splitlines();rows=[]\npattern=re.compile(r'\\bexecve\\((\"(?:[^\"\\\\]|\\\\\
        .)*\"), (\\[.*\\]), .*\\) = 0$')\nchecker=str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'rust/target/debug/check-beep-reference');example=os.environ['BEEP_REFERENCE_BINARY']\n\
        for line in trace:\n  if 'execve(' not in line and 'execveat(' not in line:continue\n  m=pattern.search(line);assert\
        \ m,line\n  program=json.loads(m[1]);argv=json.loads(m[2]);rows.append([program,argv])\nexpected=[[checker,[checker,'--binary',example,'--binding',os.environ['BEEP_REFERENCE_BINDING'],'--original',os.environ['BEEP_REFERENCE_ORIGINAL'],'--original-manifest-sha256',os.environ['BEEP_REFERENCE_ORIGINAL_MANIFEST_SHA256'],'--output',str(p/'cli-output')]]]+[[example,[example]]for\
        \ _ in range(20)]\nassert rows==expected\n(p/'exec-audit.json').write_text(json.dumps({'passed':True,'attempts':rows,'only_current_controller_and_example':True},indent=2)+'\\\
        n')\nPY\nsha256sum --check \"$proof/executables.sha256\"\n"
    - name: Require full twenty-case test, corruptions and strict Clippy
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/beep-reference-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --lib --locked
        beep_reference_check::tests -- --nocapture 2>&1 | tee "$proof/unit-tests.log"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --test
        beep_reference_check --locked -- --nocapture 2>&1 | tee "$proof/integration-tests.log"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --lib
        --bin check-beep-reference --test beep_reference_check --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        sha256sum --check "$proof/executables.sha256"

        '
    - name: Retain complete native outputs and raw syscall evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: beep-reference-296-${{ github.sha }}
        path: ${{ runner.temp }}/beep-reference-296/
        if-no-files-found: error
