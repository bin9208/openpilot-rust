{
  "name": "controlsd normal40 and failures27 focused #296",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-native-tools-candidate"
      ],
      "paths": [
        ".github/workflows/controlsd-normal-failures-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "concurrency": {
    "group": "controlsd-normal-failures-296-${{ github.ref }}",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "controlsd-controller": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 75,
      "env": {
        "CONTROLSD_CONTROLLER_SOURCE_SHA": "241c023e537e22c7215c938f4a428e799746d463",
        "CONTROLSD_CONTROLLER_CAPTURE_IF_MISSING": "true",
        "CONTROLSD_CONTROLLER_ACCEPTED_RUN": "",
        "CONTROLSD_CONTROLLER_ACCEPTED_ARTIFACT": "",
        "CONTROLSD_CONTROLLER_ACCEPTED_ARCHIVE_SHA256": "",
        "CONTROLSD_CONTROLLER_ACCEPTED_CAPTURE_SHA256": "",
        "CONTROLSD_CONTROLLER_ACCEPTED_PREFIX": "original/",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "OPENBLAS_NUM_THREADS": "1",
        "RUSTUP_TOOLCHAIN": "1.94.0",
        "CONTROLSD_COMBINED_PAYLOAD_SHA256": "611c7695689fc60a33f3d1effea225cc9edd7db384db72c6b1bca24845d04845",
        "CONTROLSD_COMBINED_RECIPE_SHA256": "87c845d1f256499627184bbb60ca58d9574f4ca7bfed5bf312467ecaa5d99b8a"
      },
      "steps": [
        {
          "name": "Bootstrap uniquely owned paths and admit actual source growth",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_BOOTSTRAP_PY'\n\"\"\"Actions bootstrap only: admit source growth before allocating private roots.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport tempfile\n\nif os.environ['RUNNER_NAME'] != 'bin-actions':\n    raise SystemExit('registered bin-actions runner required')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\nprefix = 'controlsd-controller-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\ngrowth = 2 * 1024 * 1024 * 1024\nfree = shutil.disk_usage(workspace).free\nadmission = {'path': str(workspace), 'operation': 'source-checkout', 'available_bytes': free, 'planned_growth_bytes': growth}\nprint(json.dumps(admission), flush=True)\nif growth > free:\n    raise SystemExit('source operation growth exceeds available space')\nos.umask(0o077)\njob = Path(tempfile.mkdtemp(prefix=prefix, dir=runner_temp))\nsource = Path(tempfile.mkdtemp(prefix=prefix, dir=workspace))\nfor name in ['tmp', 'proof', 'payload']:\n    (job / name).mkdir(mode=0o700)\ndef identity(path):\n    value = path.lstat()\n    return {'dev': value.st_dev, 'ino': value.st_ino, 'uid': value.st_uid}\nowner = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n         'workspace': str(workspace), 'runner_temp': str(runner_temp),\n         'job': str(job), 'source': str(source),\n         'job_identity': identity(job), 'source_identity': identity(source)}\nreceipt = json.dumps(owner, sort_keys=True) + '\\n'\n(job / '.controlsd-owner.json').write_text(receipt)\n(job / 'proof/ownership.json').write_text(receipt)\n(job / 'proof/growth-source.json').write_text(json.dumps(admission) + '\\n')\nvalues = {'CONTROLSD_CONTROLLER_JOB': str(job), 'CONTROLSD_CONTROLLER_PAYLOAD': str(job / 'payload'),\n          'CONTROLSD_CONTROLLER_PROOF': str(job / 'proof'), 'CONTROLSD_CONTROLLER_ROOT': str(source),\n          'CONTROLSD_CONTROLLER_CHECKOUT_REL': str(source.relative_to(workspace)),\n          'CARGO_HOME': str(job / 'cargo'), 'RUSTUP_HOME': str(job / 'rustup'),\n          'CARGO_TARGET_DIR': str(job / 'target'), 'PIP_CACHE_DIR': str(job / 'pip'),\n          'XDG_CACHE_HOME': str(job / 'xdg'), 'TMPDIR': str(job / 'tmp')}\nwith open(os.environ['GITHUB_ENV'], 'a') as output:\n    for key, value in values.items():\n        if '\\n' in value or '\\r' in value:\n            raise SystemExit('invalid private path')\n        output.write(key + '=' + value + '\\n')\nprint(json.dumps({'ownership': owner, 'growth_admitted': True}), flush=True)\nCONTROLSD_BOOTSTRAP_PY\n"
        },
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "${{ env.CONTROLSD_CONTROLLER_SOURCE_SHA }}",
            "path": "${{ env.CONTROLSD_CONTROLLER_CHECKOUT_REL }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          }
        },
        {
          "name": "Decode and verify frozen payloads 1/2",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -m700 \"$CONTROLSD_CONTROLLER_PAYLOAD/failures\"\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/audit.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '8e169e4d95181676f81c07680530f4670ce0fccb58a72e018c16af1373577fff' \"$CONTROLSD_CONTROLLER_PAYLOAD/audit.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/bootstrap.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'f0e9f01826766ce70fed4e9f0c768b9a2685d12d8175ff188af2c4608f04c5d2' \"$CONTROLSD_CONTROLLER_PAYLOAD/bootstrap.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/capture_original.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '731c39ffd0ee46c11a64e98d45f774691b5c127c801861305158270e8250687d' \"$CONTROLSD_CONTROLLER_PAYLOAD/capture_original.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/cleanup.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '9e0176a9a849fba2cbb6778927821a7118093c2ed9a5cb2f35db51f0d086d9a5' \"$CONTROLSD_CONTROLLER_PAYLOAD/cleanup.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/failures/capture_original.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'ce4a9be296e0050293a10edd4eaf20e1088a4614382f722e48f561bb260ddf4d' \"$CONTROLSD_CONTROLLER_PAYLOAD/failures/capture_original.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/failures/source-pins.json\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'e241efb73014eb993c1be220e62fda14e28dda191e759978612083683e32a6d2' \"$CONTROLSD_CONTROLLER_PAYLOAD/failures/source-pins.json\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/failures/verify_gate.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '8a30b6cb82dd52dd95cc4d67490902a4f8beea23dc5fda192f706cfcd2ec1e31' \"$CONTROLSD_CONTROLLER_PAYLOAD/failures/verify_gate.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/growth.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'ff6ce48e19d180d6c76c2a97cf6284ab733ad76ee05c35968686afa3e507ae60' \"$CONTROLSD_CONTROLLER_PAYLOAD/growth.py\" | sha256sum --check --strict\n"
        },
        {
          "name": "Decode and verify frozen payloads 2/2",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/guard.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'ad8376fd19b147857d4b339721643d925727f8a0438080b01d9035f0cedaf311' \"$CONTROLSD_CONTROLLER_PAYLOAD/guard.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/payload-manifest.json\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '611c7695689fc60a33f3d1effea225cc9edd7db384db72c6b1bca24845d04845' \"$CONTROLSD_CONTROLLER_PAYLOAD/payload-manifest.json\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/resources.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '05b74b8086623e98aba7aa47af05c03b91affe953aabbc5e9a05de2d652cd09b' \"$CONTROLSD_CONTROLLER_PAYLOAD/resources.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/reuse_saved.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'bd4b88681eaa5cd14a4106678c4e3478941deb2a82922e8bbf0e11dff7b63c85' \"$CONTROLSD_CONTROLLER_PAYLOAD/reuse_saved.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/run.sh\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '897fdeafe01981518934ee3afd2de32c56dc67e7018a8e4f00af01b748bdcfc9' \"$CONTROLSD_CONTROLLER_PAYLOAD/run.sh\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/self_auth.py\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' 'c4b2f7302968c4e3fadc8b5a774f86ca71b8d2e1a1f16d1e0d3b91f1ae75132e' \"$CONTROLSD_CONTROLLER_PAYLOAD/self_auth.py\" | sha256sum --check --strict\nbase64 --decode <<'CONTROLSD_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/source-contract.json\"\\nCONTROLSD_B64_EOF\nprintf '%s  %s\\n' '6baf42691b1ea536c26bf15b2b4a3678d725898f4cd920ee085d829c18ab3649' \"$CONTROLSD_CONTROLLER_PAYLOAD/source-contract.json\" | sha256sum --check --strict\n"
        },
        {
          "name": "Require original normal40 and native rejection27 health5 with owned failure controls",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\npython3 \"$CONTROLSD_CONTROLLER_PAYLOAD/self_auth.py\"\nbash \"$CONTROLSD_CONTROLLER_PAYLOAD/run.sh\"\n"
        },
        {
          "name": "Always seal all proof bytes and verify archive before upload",
          "id": "seal_proof",
          "if": "${{ always() && env.CONTROLSD_CONTROLLER_PROOF != '' }}",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_SEAL_PY'\n\"\"\"Always seal every private proof byte; no suffix exclusions or foreign reads.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport stat\nimport tarfile\nproof=Path(os.environ['CONTROLSD_CONTROLLER_PROOF']);job=Path(os.environ['CONTROLSD_CONTROLLER_JOB'])\nassert proof==job/'proof' and proof.is_dir()\nout=job/'artifact';out.mkdir(mode=0o700)\nrows={};total=0\nfor p in sorted(proof.rglob('*')):\n    name=str(p.relative_to(proof));m=p.lstat()\n    assert len(rows)<65536 and not Path(name).is_absolute() and '..' not in Path(name).parts\n    if stat.S_ISDIR(m.st_mode): rows[name]={'kind':'directory'};continue\n    assert stat.S_ISREG(m.st_mode),'nonregular evidence; preserve roots for parent recovery'\n    assert m.st_size<=4*1024**3\n    total+=m.st_size;assert total<=8*1024**3\n    h=hashlib.sha256()\n    with p.open('rb') as f:\n        assert f.read(4)!=b'\\x7fELF','executable artifact is not evidence'\n        f.seek(0)\n        for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)\n    rows[name]={'kind':'file','bytes':m.st_size,'sha256':h.hexdigest()}\nreusable=[name for name in ['original/capture.json','original/input.json','original/source.json'] if name in rows]\nreuse_bytes=sum(rows[name]['bytes'] for name in reusable)\nassert shutil.disk_usage(job).free>=total+reuse_bytes+len(rows)*1024+1024**2,'actual packing growth unavailable; preserve raw roots'\narchive=out/'proof.tar.gz'\nwith tarfile.open(archive,'w:gz',dereference=False) as tar:\n    for name in rows:tar.add(proof/name,arcname=name,recursive=False)\nwith tarfile.open(archive,'r:gz') as tar:\n    members=tar.getmembers();assert len(members)==len(rows)==len(set(m.name for m in members))\n    for member in members:\n        row=rows[member.name]\n        if row['kind']=='directory':assert member.isdir();continue\n        assert member.isfile() and member.size==row['bytes']\n        h=hashlib.sha256()\n        with tar.extractfile(member) as data:\n            for chunk in iter(lambda:data.read(1024*1024),b''):h.update(chunk)\n        assert h.hexdigest()==row['sha256']\n(out/'content-seals.json').write_text(json.dumps({'files':rows,'bytes':total,'exclusions':[],'admission':(proof/'complete.json').is_file()},indent=2)+'\\n')\nh=hashlib.sha256()\nwith archive.open('rb') as f:\n    for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)\n(out/'proof.sha256').write_text(h.hexdigest()+'  proof.tar.gz\\n')\n# Preserve the original three-member reuse interface in the outer artifact ZIP.\n# These sidecars duplicate sealed data only; no original/native computation.\nif reusable:\n    (out/'original').mkdir(mode=0o700)\n    for name in reusable:\n        path=out/name\n        with (proof/name).open('rb') as src,path.open('xb') as dest:\n            h=hashlib.sha256()\n            for chunk in iter(lambda:src.read(1024*1024),b''):\n                dest.write(chunk);h.update(chunk)\n        assert h.hexdigest()==rows[name]['sha256']\nCONTROLSD_SEAL_PY\n"
        },
        {
          "name": "Always retain complete sealed focused proof",
          "if": "always()",
          "id": "proof_upload",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "controlsd-normal-failures-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CONTROLSD_CONTROLLER_JOB }}/artifact/",
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        },
        {
          "name": "Remove only owned source and caches after successful upload receipt",
          "if": "${{ always() && steps.seal_proof.outcome == 'success' && steps.proof_upload.outcome == 'success' && steps.proof_upload.outputs.artifact-id != '' && steps.proof_upload.outputs.artifact-digest != '' }}",
          "shell": "bash",
          "env": {
            "CONTROLSD_CONTROLLER_UPLOAD_OUTCOME": "${{ steps.proof_upload.outcome }}",
            "CONTROLSD_CONTROLLER_UPLOAD_ID": "${{ steps.proof_upload.outputs.artifact-id }}",
            "CONTROLSD_CONTROLLER_UPLOAD_DIGEST": "${{ steps.proof_upload.outputs.artifact-digest }}"
          },
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_CLEANUP_PY'\n\"\"\"Actions cleanup only: never remove private roots without upload and ownership proof.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport shutil\nimport stat\n\nupload_id = os.environ.get('CONTROLSD_CONTROLLER_UPLOAD_ID', '')\nupload_digest = os.environ.get('CONTROLSD_CONTROLLER_UPLOAD_DIGEST', '')\nif (os.environ.get('CONTROLSD_CONTROLLER_UPLOAD_OUTCOME') != 'success'\n        or not re.fullmatch(r'[1-9][0-9]*', upload_id)\n        or not re.fullmatch(r'(?:sha256:)?[0-9a-fA-F]{64}', upload_digest)):\n    raise SystemExit('upload receipt missing/invalid; preserve all private data')\nif not shutil.rmtree.avoids_symlink_attacks:\n    raise SystemExit('safe private cleanup unavailable; preserve all private data')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\njob = Path(os.environ['CONTROLSD_CONTROLLER_JOB'])\nsource = Path(os.environ['CONTROLSD_CONTROLLER_ROOT'])\nprefix = 'controlsd-controller-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\n# Validate both roots and the ownership receipt before the first deletion.\nfor path, parent in [(job, runner_temp), (source, workspace)]:\n    if path.parent != parent or not path.name.startswith(prefix) or path.resolve(strict=True) != path:\n        raise SystemExit('private root escaped its owned parent; preserve all private data')\n    info = path.lstat()\n    if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid():\n        raise SystemExit('private root owner/type changed; preserve all private data')\nif source == job or source in job.parents or job in source.parents:\n    raise SystemExit('private roots overlap; preserve all private data')\nreceipt_path = job / '.controlsd-owner.json'\nfd = os.open(receipt_path, os.O_RDONLY | os.O_NOFOLLOW)\nwith os.fdopen(fd, 'r') as receipt:\n    info = os.fstat(receipt.fileno())\n    if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid():\n        raise SystemExit('ownership receipt changed; preserve all private data')\n    owner = json.load(receipt)\nexpected = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n            'workspace': str(workspace), 'runner_temp': str(runner_temp), 'job': str(job), 'source': str(source)}\nfor key, value in expected.items():\n    if owner.get(key) != value:\n        raise SystemExit('ownership receipt binding changed; preserve all private data')\nfor path, key in [(job, 'job_identity'), (source, 'source_identity')]:\n    info = path.lstat()\n    if owner.get(key) != {'dev': info.st_dev, 'ino': info.st_ino, 'uid': info.st_uid}:\n        raise SystemExit('private root identity changed; preserve all private data')\nprint(json.dumps({'artifact_id': upload_id, 'artifact_digest': upload_digest,\n                  'owned_source': str(source), 'owned_job': str(job),\n                  'cleanup_authorized_by_successful_upload': True}), flush=True)\nshutil.rmtree(source)\nshutil.rmtree(job)\nCONTROLSD_CLEANUP_PY\n"
        }
      ]
    }
  }
}
