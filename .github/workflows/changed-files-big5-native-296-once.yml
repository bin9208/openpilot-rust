    steps:
    - uses: actions/checkout@v7
      with:
        ref: e8744f656444f1e8a5c49527ed15fb56e4406673
        persist-credentials: false
    - name: Admit native source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        export BIG5_BASE="$RUNNER_TEMP/changed-files-big5-native-296"

        printf ''BIG5_BASE=%s\n'' "$BIG5_BASE" >> "$GITHUB_ENV"

        printf ''BIG5_ORIGINAL_DIR=%s/original\n'' "$BIG5_BASE" >> "$GITHUB_ENV"

        printf ''BIG5_PRIOR_ORIGINAL_DIR=%s/prior-original\n'' "$BIG5_BASE" >> "$GITHUB_ENV"

        printf ''BIG5_NATIVE_OUTPUT=%s/actual\n'' "$BIG5_BASE" >> "$GITHUB_ENV"

        mkdir "$BIG5_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$BIG5_BASE/source.txt"

        git status --porcelain=v1 > "$BIG5_BASE/source-status.before.txt"

        test ! -s "$BIG5_BASE/source-status.before.txt"

        sha256sum rust/Cargo.lock > "$BIG5_BASE/lock.input.sha256"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$BIG5_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 > "$BIG5_BASE/native-packages.txt"

        '
