name: 296 updater daemon exact original CLI raw path and same ELF absent proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-daemon-retirement-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  updated-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: b91c1bd30b9ee4c15a6b1ad521173412cb6fa63a
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TZ: UTC
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
      UPDATED_FIXTURE_REQUIRE_ABSENT: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: b91c1bd30b9ee4c15a6b1ad521173412cb6fa63a
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Require exact source and original/native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/updated-daemon-296"

        mkdir -p "$proof"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace git-lfs
        gettext

        python -m pip install pyzmq==27.2.0

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        printf ''UPDATED_DAEMON_BINARY=%s/rust/target/debug/openpilot-updated\nUPDATED_DAEMON_LAUNCHER=%s/rust/target/debug/openpilot-process-child\nUPDATED_DAEMON_FIXTURE=%s/rust/target/debug/updated-fixture\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''UPDATED_DAEMON_ORIGINAL_OUTPUT=%s/original\nUPDATED_DAEMON_NATIVE_OUTPUT=%s/native\n'' "$proof" "$proof"
        >> "$GITHUB_ENV"

        '
    - name: Build actual production daemon, native fixture and new owned controller
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-updated --bin openpilot-updated --locked 2>&1 | tee "$proof/daemon-build.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child --locked
        2>&1 | tee "$proof/launcher-build.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --bin check-updated-daemon
        --bin check-updated --bin updated-fixture --locked 2>&1 | tee "$proof/controller-build.log"

        sha256sum rust/tools/check_updated_daemon.py rust/tools/updated_fixtures.py rust/target/debug/openpilot-updated rust/target/debug/openpilot-process-child
        rust/target/debug/updated-fixture rust/target/debug/check-updated-daemon > "$proof/sealed-inputs.sha256"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-updated --example updated_trace --locked 2>&1 | tee "$proof/trace-build.log"

        '
    - name: Execute unchanged original first and capture its actual invocation time window
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        printf ''UPDATED_DAEMON_ORIGINAL_START_NS=%s\n'' "$(date -u +%s%N)" >> "$GITHUB_ENV"

        python rust/tools/check_updated_daemon.py --binary "$UPDATED_DAEMON_BINARY" --launcher "$UPDATED_DAEMON_LAUNCHER"
        --output "$UPDATED_DAEMON_ORIGINAL_OUTPUT" > "$proof/original.stdout" 2> "$proof/original.stderr"

        printf ''UPDATED_DAEMON_ORIGINAL_END_NS=%s\n'' "$(date -u +%s%N)" >> "$GITHUB_ENV"

        sha256sum --check "$proof/sealed-inputs.sha256"

        '
    - name: Capture unchanged original CLI admissions and valid raw output before candidate runs
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        printf ''%s'' ''''
        | base64 -d > "$proof/capture_updated_daemon_cli.py"

        printf ''%s  %s\n'' ''15fdf1ef40a413317894addcdd65ea3a6d88b2a6b1a29744f40d7b3bab1c0e0f'' "$proof/capture_updated_daemon_cli.py"
        | sha256sum -c -

        printf ''%s'' ''''
        | base64 -d > "$proof/capture_updated_daemon_raw_output.py"

        printf ''%s  %s\n'' ''60137e7887479f3518e19fbe2193ec06b65a9de90e26fc4bf91ee706bc8587d2'' "$proof/capture_updated_daemon_raw_output.py"
        | sha256sum -c -

        export UPDATED_DAEMON_CLI_CAPTURE="$proof/cli-original.json"

        python "$proof/capture_updated_daemon_cli.py"

        printf ''UPDATED_DAEMON_CLI_ORIGINAL_RECEIPT=%s/cli-original.json\n'' "$proof" >> "$GITHUB_ENV"

        printf ''UPDATED_DAEMON_CLI_ORIGINAL_SHA256=%s\n'' "$(sha256sum "$proof/cli-original.json" | cut -d '' '' -f1)" >>
        "$GITHUB_ENV"

        mkdir "$proof/raw-original-capture"

        export UPDATED_DAEMON_RAW_CAPTURE_ROOT="$proof/raw-original-capture"

        python "$proof/capture_updated_daemon_raw_output.py"

        printf ''UPDATED_DAEMON_RAW_ORIGINAL_OUTPUT=%s/raw-original-capture/original-raw\nUPDATED_DAEMON_RAW_ORIGINAL_MANIFEST=%s/raw-original-capture/original-raw-manifest.json\n''
        "$proof" "$proof" >> "$GITHUB_ENV"

        printf ''UPDATED_DAEMON_RAW_ORIGINAL_MANIFEST_SHA256=%s\n'' "$(sha256sum "$proof/raw-original-capture/original-raw-manifest.json"
        | cut -d '' '' -f1)" >> "$GITHUB_ENV"

        printf ''UPDATED_DAEMON_SOURCE_COMMIT=%s\nUPDATED_DAEMON_CHECKER=%s/rust/target/debug/check-updated-daemon\nUPDATED_DAEMON_RETIREMENT_EVIDENCE=%s/retirement\nUPDATED_DAEMON_RAW_NATIVE_EVIDENCE=%s/raw-native\nUPDATED_DAEMON_REQUIRE_ABSENT=0\n''
        "$EXPECTED_SOURCE" "$GITHUB_WORKSPACE" "$proof" "$proof" >> "$GITHUB_ENV"

        sha256sum --check "$proof/sealed-inputs.sha256"

        '
    - name: Require all retired updater scenarios and independent native fixture observations with helper absent in private
        root
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        export UPDATED_CHECK_BINARY="$GITHUB_WORKSPACE/rust/target/debug/examples/updated_trace"

        export UPDATED_CHECK_LAUNCHER="$UPDATED_DAEMON_LAUNCHER"

        export UPDATED_CHECK_SHIM="$UPDATED_DAEMON_FIXTURE"

        export UPDATED_CHECK_OUTPUT="$proof/source-native-test"

        export UPDATED_CHECK_CLI_OUTPUT="$proof/source-cli"

        export UPDATED_CHECK_ABSENCE_EVIDENCE="$proof/source-absence"

        export UPDATED_FIXTURE_NATIVE_OUTPUT="$proof/fixture-native"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --test updated_check
        --test updated_fixture_original --locked -- --nocapture 2>&1 | tee "$proof/source-tests.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --lib --bin
        check-updated --bin updated-fixture --test updated_check --test updated_fixture_original --locked -- -D warnings 2>&1
        | tee "$proof/source-clippy.log"

        rust/target/debug/check-updated --binary "$UPDATED_CHECK_BINARY" --launcher "$UPDATED_CHECK_LAUNCHER" --output "$proof/source-default-cli"
        > "$proof/source-default-cli.stdout" 2> "$proof/source-default-cli.stderr"

        '
    - name: Require full daemon regressions, fresh original pair, raw CLI and strict same-ELF trace proof
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --lib updated_daemon_check::
        --locked -- --nocapture 2>&1 | tee "$proof/unit-tests.log"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --test updated_daemon_check
        --test updated_daemon_retirement --test updated_daemon_cli --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --lib --bin check-updated-daemon
        --test updated_daemon_check --test updated_daemon_retirement --test updated_daemon_cli --locked -- -D warnings 2>&1
        | tee "$proof/clippy.log"

        rust/target/debug/check-updated-daemon --binary "$UPDATED_DAEMON_BINARY" --launcher "$UPDATED_DAEMON_LAUNCHER" --output
        "$proof/native-cli" > "$proof/native-cli.stdout" 2> "$proof/native-cli.stderr"

        cmp "$proof/original.stdout" "$proof/native-cli.stdout"

        test ! -s "$proof/native-cli.stderr"

        sha256sum --check "$proof/sealed-inputs.sha256"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: updated-daemon-native-pair-296
        path: ${{ runner.temp }}/updated-daemon-296/
        if-no-files-found: error
