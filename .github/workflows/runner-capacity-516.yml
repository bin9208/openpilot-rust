name: Runner capacity recovery 516
on:
  push:
    branches: [codex/fix-516-runner-capacity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-capacity-516-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    if: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Preserve all Git objects while consolidating duplicate packs
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/job-temp
      - name: Repack with unreachable objects retained and verify preservation
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = bin-actions
          /usr/bin/python3 -I tools/ci/runner_capacity_516.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runner-capacity-516-recovery
          path: |
            ${{ env.CI_JOB_TEMP }}/runner-git-recovery.json
            ${{ env.CI_JOB_TEMP }}/git-recovery-*.log
          if-no-files-found: warn
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
