name: Python Rust 523 model compiler pair
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-model.yml
    - tools/ci/model_compiler_pair_482.sh
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler_pair:
    name: Independent Python and Rust LLVM compiler pair
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private Fast source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        # Source capacity is checked on the actual source filesystem BEFORE checkout.
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Preserve Actions' real workspace separately. Only Bash consumers see the
        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact focused source HEAD and tracked index
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Isolate original Python package installation
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        python -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
    - name: Prepare pinned LLVM provider original venv and fresh native worker
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        # Private Cargo registry/target, original-only numpy, LLVM SDK and 384 MiB diagnostics.
        (( available >= 3 * 1024 * 1024 * 1024 ))
        printf '{"available_bytes":%s,"planned_preparation_and_diagnostic_growth_bytes":3221225472}\n' "$available" > "$CI_JOB_TEMP/proof/build-growth.json"
        sudo -n apt-get -o APT::Architectures=amd64 update
        sudo -n apt-get -o APT::Architectures=amd64 install -y g++ pkg-config gh jq unzip libllvm18:amd64=1:18.1.3-1ubuntu1
        dpkg-query -L libllvm18:amd64 > "$CI_JOB_TEMP/proof/llvm-package-files.txt"
        readlink -e /usr/lib/x86_64-linux-gnu/libLLVM-18.so > "$CI_JOB_TEMP/proof/llvm-provider-realpath.txt"
        export RUSTUP_HOME=/home/actions/.rustup
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        test -x "$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/rustc"
        sha256sum "$(rustup which rustc)" "$(rustup which cargo)" > "$CI_JOB_TEMP/proof/rust-tools.sha256"
        python -m pip install numpy==2.5.3
        python -m pip freeze > "$CI_JOB_TEMP/proof/python-provider-versions.txt"
        sha256sum "$CI_JOB_TEMP/venv/pyvenv.cfg" "$(readlink -e "$CI_JOB_TEMP/venv/bin/python")" > "$CI_JOB_TEMP/proof/oracle-environment.sha256"
        rustc -vV > "$CI_JOB_TEMP/proof/rustc.txt"
        cargo -V > "$CI_JOB_TEMP/proof/cargo.txt"
        unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin offline-llvm-compile 2>&1 | tee "$CI_JOB_TEMP/proof/fresh-worker-build.log"
        worker="$CARGO_TARGET_DIR/debug/offline-llvm-compile"
        test -x "$worker"
        sha256sum "$worker" > "$CI_JOB_TEMP/proof/fresh-worker.sha256"
        jq -n --arg source "$GITHUB_SHA" --arg binary "$worker" --arg sha256 "$(sha256sum "$worker" | cut -d' ' -f1)" '{source_commit:$source,binary:$binary,sha256:$sha256,fresh_private_target:true,package:"openpilot-model-runtime",binary_name:"offline-llvm-compile",default_features:true}' > "$CI_JOB_TEMP/proof/fresh-worker.json"
      id: toolchain
    - name: Compare pinned IR through original Python and fresh Rust compilers
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export EXPECTED_SOURCE="$GITHUB_SHA"
        export ORACLE_PYTHON="$CI_JOB_TEMP/venv/bin/python"
        export CURRENT_LLVM_WORKER="$CARGO_TARGET_DIR/debug/offline-llvm-compile"
        export CURRENT_LLVM_WORKER_SHA256=$(jq -er '.sha256' "$CI_JOB_TEMP/proof/fresh-worker.json")
        export PAIR_OUTPUT="$CI_JOB_TEMP/proof/model-compiler-pair"
        # Preparation completed under the preceding combined 3 GiB admission.
        export PAIR_PREPARATION_GROWTH_MIB=0
        sha256sum --check "$CI_JOB_TEMP/proof/fresh-worker.sha256"
        sha256sum --check "$CI_JOB_TEMP/proof/oracle-environment.sha256"
        bash tools/ci/model_compiler_pair_482.sh
        sha256sum --check "$CI_JOB_TEMP/proof/oracle-environment.sha256"
    - name: Seal Fast source and index after all maintained checks
      if: ${{ always() && env.DIAG_SOURCE != '' }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"

        if test -d "$CARGO_TARGET_DIR"; then
          find "$CARGO_TARGET_DIR" -name "*.d" -type f -exec sha256sum {} + > "$CI_JOB_TEMP/proof/build-dep-info.sha256"
        else
          : > "$CI_JOB_TEMP/proof/build-dep-info.sha256"
        fi

        if test -f "$CI_JOB_TEMP/proof/rust-tools.sha256"; then sha256sum --check "$CI_JOB_TEMP/proof/rust-tools.sha256"; fi

        if test -f "$CI_JOB_TEMP/proof/oracle-environment.sha256"; then sha256sum --check "$CI_JOB_TEMP/proof/oracle-environment.sha256"; fi
      id: source_final
    - name: Retain Fast job ownership evidence
      id: fast_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: diagnostic-fast-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded private Fast source
      id: fast_source_cleanup
      if: ${{ always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id !=
        '' && steps.fast_evidence.outputs.artifact-digest != '' && env.DIAG_SOURCE_OWNER != '' && steps.source_final.outcome
        == 'success' }}
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
        [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        rm -rf --one-file-system -- "$p"
    - name: Clean common owned Fast job temporary paths
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != ''
        && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success')
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
