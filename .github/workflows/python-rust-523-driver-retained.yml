name: Python Rust 523 driver retained prestate failure-only diagnostic
'on':
  push:
    branches: [codex/feat-523-python-rust]
    paths:
    - .github/workflows/python-rust-523-driver-retained.yml
    - tools/ci/driver_retained_program_476.py
    - rust/crates/model-runtime/src/cpu/driver_prestate_476.rs
    - rust/crates/model-runtime/src/bin/model-run.rs
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-driver-retained-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  model-family-retirement:
    name: Driver fresh failure and actual retained prestate (never six-source acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      DRIVER476_HELPER_SHA256: 1d58aa2b2e2eb9b911c61051da116def2b2ac3a7f1b9b134e6fe4525c59f0202
      DRIVER476_SOURCE_ALLOWED: ${{ github.repository == 'bin9208/openpilot-rust' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/feat-523-python-rust' }}
    steps:
    - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        EVENT_NAME: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied for normal40 qualification' >&2; exit 1; }
        set -euo pipefail
        [[ $EVENT_NAME = push || $EVENT_NAME = workflow_dispatch ]]
        test "$SOURCE_REF" = refs/heads/codex/feat-523-python-rust
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
        printf 'DRIVER476_JOB_START=%s\n' "$EPOCHSECONDS" >> "$GITHUB_ENV"
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.ci296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Actions의 workspace와 Bash가 사용하는 private checkout을 구분한다.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "CI296_SOURCE=$source" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - name: Admit operation-specific growth on the actual filesystems before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I -B -S - <<'ADMISSION'
        import json,os
        from pathlib import Path
        job=Path(os.environ['CI_JOB_TEMP']); source=Path(os.environ['DIAG_SOURCE_OWNER'])
        # 같은 device의 예상 동시 증가를 합산한다. peak 실측/하드 quota 주장은 아니다.
        plans=[('source',source,2048),('target',source,6144),('registry',job,2048),
          ('SDK',job,3072),('venv',job,1024),('frozen',job,512),('fresh',job,1024),
          ('proof',job,2048),('cache',job,512),('apt',Path('/'),2048),('reserve',job,512)]
        groups={}
        for name,path,mib in plans:
          group=groups.setdefault(str(path.stat().st_dev),{'path':str(path),'planned_bytes':0,'items':[]})
          group['planned_bytes']+=mib*1024**2; group['items'].append([name,mib*1024**2])
        for group in groups.values():
          s=os.statvfs(group['path']); group['available_bytes']=s.f_bavail*s.f_frsize
        (job/'proof/driver476-initial-admission.json').write_text(json.dumps(groups,sort_keys=True,indent=2))
        assert all(g['available_bytes']>=g['planned_bytes'] for g in groups.values())
        ADMISSION
    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Seal exact source HEAD and tracked index before checks
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      id: source_before
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        allocated=$(du -sx --block-size=1 "$DIAG_SOURCE_OWNER" | cut -f1)
        [[ $allocated =~ ^[0-9]+$ ]]
        printf '{"allocated_private_source_bytes":%s,"planned_source_growth_bytes":2147483648}\n' "$allocated" > "$CI_JOB_TEMP/proof/source-growth-after-checkout.json"
        git ls-tree -r -l HEAD | awk '$4 ~ /^[0-9]+$/ {bytes+=$4; files++} END {printf "{\"tracked_blob_bytes\":%.0f,\"files\":%d}\n",bytes,files}' > "$CI_JOB_TEMP/proof/tracked-source-size.json"
        ((allocated <= 2 * 1024 * 1024 * 1024))
    - name: Prepare official pinned Rust in the owned private rustup root and seal it
      id: prepared_rust
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
        "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before
    - name: Prepare source-pinned LLVM provider with bounded native package growth
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        before=$(df --output=avail -B1 / | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {n++;v=$1} END {if(NR!=2||n!=1)exit 1;print v}')
        ((before >= 2 * 1024 * 1024 * 1024 + 512 * 1024 * 1024))
        (ulimit -f 524288; sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s apt-get -o APT::Architecture=amd64 update) > "$CI_JOB_TEMP/proof/driver476-apt-update.log" 2>&1
        (ulimit -f 524288; sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s apt-get -o APT::Architecture=amd64 install --no-install-recommends -y build-essential clang libllvm18 capnproto pkg-config libzmq3-dev) > "$CI_JOB_TEMP/proof/driver476-apt-install.log" 2>&1
        after=$(df --output=avail -B1 / | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {n++;v=$1} END {if(NR!=2||n!=1)exit 1;print v}')
        ((before - after <= 2 * 1024 * 1024 * 1024 && after >= 512 * 1024 * 1024))
        provider=$(readlink -e /usr/lib/llvm-18/lib/libLLVM.so.1)
        printf '%s  %s\n' 5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0 "$provider" > "$CI_JOB_TEMP/proof/driver476-llvm.before.sha256"
        sha256sum --check "$CI_JOB_TEMP/proof/driver476-llvm.before.sha256"
        test "$(dpkg-query -W -f='${Version}' libllvm18:amd64)" = 1:18.1.3-1ubuntu1
        dpkg-query -W -f='${binary:Package}\t${Version}\n' libllvm18:amd64 capnproto g++ pkg-config > "$CI_JOB_TEMP/proof/driver476-llvm-package.txt"
        printf '%s\n' "LLVM_PATH=$provider" >> "$GITHUB_ENV"
    - name: Select exact Python3.12.15 provider
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
        check-latest: false
    - name: Prepare isolated original venv within its one GiB growth scope
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        base=$(readlink -e "$pythonLocation")
        [[ $base == /opt/hostedtoolcache/Python/3.12.15/x64 ]]
        free=$(df --output=avail -B1 "$CI_JOB_TEMP" | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {n++;v=$1} END {if(NR!=2||n!=1)exit 1;print v}')
        ((free >= 1024 * 1024 * 1024 + 512 * 1024 * 1024))
        export LD_LIBRARY_PATH="$base/lib"
        /usr/bin/timeout --signal=TERM --kill-after=10s 120s "$base/bin/python3.12" -I -B -m venv "$CI_JOB_TEMP/venv"
        PIP_CACHE_DIR="$CI_JOB_TEMP/cache/pip" /usr/bin/timeout --signal=TERM --kill-after=10s 240s "$CI_JOB_TEMP/venv/bin/python" -I -B -m pip install --no-cache-dir --no-compile --only-binary=:all: numpy==2.5.3 zstandard==0.25.0 > "$CI_JOB_TEMP/proof/driver476-pip.log" 2>&1
        allocated=$(du -sx -B1 "$CI_JOB_TEMP/venv" | cut -f1)
        apparent=$(du -sx -B1 --apparent-size "$CI_JOB_TEMP/venv" | cut -f1)
        [[ $allocated =~ ^[0-9]+$ && $apparent =~ ^[0-9]+$ ]]
        ((allocated <= 1024 * 1024 * 1024 && apparent <= 1024 * 1024 * 1024))
        "$CI_JOB_TEMP/venv/bin/python" -I -B -c 'import sys; assert sys.version_info[:3] == (3,12,15); print(sys.version)' > "$CI_JOB_TEMP/proof/driver476-python-version.txt"
        "$CI_JOB_TEMP/venv/bin/python" -I -B -m pip freeze > "$CI_JOB_TEMP/proof/driver476-python-packages.txt"
        printf '%s\n' "ORIGINAL_PYTHON_BASE=$base" "ORIGINAL_PYTHON=$CI_JOB_TEMP/venv/bin/python" >> "$GITHUB_ENV"
    - name: Run four new units then one explicit fresh driver and failure-only retained diagnostic
      id: qualify
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        printf '%s  %s\n' "$DRIVER476_HELPER_SHA256" tools/ci/driver_retained_program_476.py | sha256sum --check --strict -
        # 40분 VM 안에서 command cutoff34분, independent seals/upload/cleanup6분을 남긴다.
        export LD_LIBRARY_PATH="$ORIGINAL_PYTHON_BASE/lib"
        export DRIVER476_COMMAND_DEADLINE=$((DRIVER476_JOB_START + 34 * 60))
        /usr/bin/python3 -I -B -S - <<'DRIVER476'
        import argparse,hashlib,io,json,os,re,signal,stat,struct,sys,time,traceback,types,zipfile
        from pathlib import Path,PurePosixPath
        root=Path(os.environ['CI296_SOURCE']); job=Path(os.environ['CI_JOB_TEMP'])
        raw=(root/'tools/ci/driver_retained_program_476.py').read_bytes()
        assert hashlib.sha256(raw).hexdigest()==os.environ['DRIVER476_HELPER_SHA256']
        h=types.ModuleType('_driver476'); h.__file__=str(root/'tools/ci/driver_retained_program_476.py')
        exec(compile(raw,h.__file__,'exec'),h.__dict__)
        m=h.common(root); need=h.need; sha=h.digest; MIB=h.MIB; GIB=h.GIB
        os.umask(0o077)
        args=argparse.Namespace(request=str(job/'proof/driver476-request.json'),request_sha256='',
          fresh_exit_status=None,deadline_epoch=int(os.environ['DRIVER476_COMMAND_DEADLINE']))
        c=h.Candidate(args,root,job,m); original_budget=c.budget
        sdk=Path(os.environ['CI_PREPARED_RUST_ROOT']); target=root/'rust/target'
        preparation=job/'driver476-fresh'; frozen=job/'driver476-frozen'
        error=None; fresh_status=None
        def used(path):
          if not path.exists(): return 0
          allocated=apparent=0
          for p in m.walk(path,mutable=True):
            info=p.lstat()
            need(stat.S_ISREG(info.st_mode) or stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode),'growth special file')
            allocated+=info.st_blocks*512; apparent+=info.st_size
          return max(allocated,apparent)
        def budget():
          original_budget()
          # 동적 metadata는 원자 rename 중 부분 성공으로 집계하지 않는다.
          # 기존 candidate2GiB live guard는 유지하고 나머지 경로 cap은 command 전후 확정한다.
          process=c.children.process
          if process is not None and process.returncode is None:
            for path in (root,job):
              fs=os.statvfs(path); need(fs.f_bavail*fs.f_frsize>=512*MIB,'active command filesystem reserve')
            return
          caps=[(target,6*GIB),(job/'cargo-home',2*GIB),(job/'rustup-home',3*GIB),
            (job/'venv',GIB),(preparation,GIB),(frozen,256*MIB),(job/'driver476-original-request',256*MIB),(job/'cache',512*MIB)]
          for path,cap in caps: need(used(path)<=cap,'actual growth cap: '+str(path))
          need(used(root.parent)-used(target)<=2*GIB,'source2GiB excluding target')
          need(used(c.out)+used(job/'proof')<=2*GIB,'combined proof/candidate2GiB')
          groups={}
          for path,cap in caps+[(root.parent,2*GIB+6*GIB),(c.out,2*GIB)]:
            ancestor=path
            while not ancestor.exists(): ancestor=ancestor.parent
            dev=ancestor.stat().st_dev
            # source cap includes target; target remaining growth is already charged above.
            remaining=max(0,cap-used(path))
            if path==root.parent: remaining=max(0,2*GIB-(used(root.parent)-used(target)))
            groups[dev]=(ancestor,groups.get(dev,(ancestor,0))[1]+remaining)
          for path,growth in groups.values():
            fs=os.statvfs(path); need(fs.f_bavail*fs.f_frsize>=growth+512*MIB,'same-FS remaining growth/reserve')
        c.budget=budget
        def command(argv,label,seconds=120,allow_failure=False,env=None):
          return c.command(argv,label,seconds,env,allow_failure)
        def select(raw,name,package,source,features,test=False,kind='bin'):
          rows=[m.unique_json(line) for line in raw.splitlines()]
          need(rows and rows[-1]=={'reason':'build-finished','success':True}
            and sum(r['reason']=='build-finished' for r in rows)==1,'Cargo terminal')
          need(all(r['reason'] in {'compiler-artifact','compiler-message','build-script-executed','build-finished'} for r in rows),'Cargo unknown record')
          chosen=[]; seen=set()
          for r in rows:
            if r['reason']!='compiler-artifact': continue
            key=json.dumps(r,sort_keys=True); need(key not in seen,'duplicate Cargo artifact'); seen.add(key)
            t=r['target']
            if t['name']!=name or t['kind']!=[kind] or r['profile']['test'] is not test: continue
            manifest=root/'rust/crates'/package/'Cargo.toml'
            need(r['manifest_path']==str(manifest) and r['package_id']==f'path+file://{manifest.parent}#openpilot-{package}@0.1.0'
              and t['src_path']==str(root/source) and set(r['features'])==set(features),'Cargo package/source/features')
            p=Path(r['executable']); need(p.resolve(strict=True)==p and p.is_relative_to(target),'same-source private ELF')
            c.holds.add(p,elf=True); chosen.append(p)
          need(len(chosen)==1,'unique Cargo target '+name)
          return chosen[0]
        def rlib(raw,name,features=None):
          rows=[m.unique_json(line) for line in raw.splitlines()]
          matches=[r for r in rows if r['reason']=='compiler-artifact' and r['target']['name']==name
            and r['target']['kind']==['lib'] and r['profile']['test'] is False]
          need(len(matches)==1,'unique current Cargo rlib '+name)
          row=matches[0]
          if features is not None:
            need(set(row['features'])==set(features) and row['manifest_path']==str(root/'rust/crates/model-runtime/Cargo.toml')
              and row['target']['src_path']==str(root/'rust/crates/model-runtime/src/lib.rs'),'runtime rlib source/features')
          else:
            manifest=Path(row['manifest_path'])
            need(manifest.is_relative_to(job/'cargo-home/registry/src') and manifest.resolve(strict=True)==manifest
              and row['package_id'].startswith('registry+https://github.com/rust-lang/crates.io-index#'+name+'@'), 'locked dependency rlib source')
          files=[Path(v) for v in row['filenames'] if v.endswith('.rlib')]
          need(len(files)==1 and files[0].parent==target/'debug/deps' and files[0].resolve(strict=True)==files[0],'current rlib path')
          c.holds.add(files[0]); return files[0]
        def pin(path): return {'path':str(path),'sha256':m.regular(path.resolve(strict=True))['sha256']}
        def canon(value): return json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
        def binding(path):
          info=path.stat()
          return {'enabled':True,'path':str(path),'bytes':info.st_size,'sha256':sha(m.read(path,128*MIB)),
            'identity':[info.st_dev,info.st_ino,info.st_size,info.st_mode,info.st_mtime_ns,info.st_ctime_ns]}
        for number in (signal.SIGINT,signal.SIGTERM,signal.SIGALRM): signal.signal(number,h.interrupted)
        signal.setitimer(signal.ITIMER_REAL,max(0.001,c.deadline-time.monotonic()))
        try:
          need(os.environ['DRIVER476_SOURCE_ALLOWED']=='true' and root==Path.cwd()==Path(os.environ['GITHUB_WORKSPACE']), 'source trust/binding')
          need(not os.environ.get('LD_PRELOAD'),'LD_PRELOAD forbidden')
          need(job.resolve(strict=True)==job and root.resolve(strict=True)==root and job.stat().st_mode&0o077==0,'canonical private job/source')
          info=root.parent.stat()
          need(f'{info.st_dev}:{info.st_ino}'==os.environ['CI296_SOURCE_IDENTITY'],'source owner inode')
          need(os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['RUNNER_OS']=='Linux'
            and os.environ['RUNNER_ARCH']=='X64' and os.uname().machine=='x86_64','actual host')
          owner=':'.join(os.environ[k] for k in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB'))
          need((job/'owner').read_text().strip()==owner and (root.parent/'.ci296-owner').read_text().strip()==owner,'owner')
          names=m.read(job/'proof/index-before.bin',4*MIB).split(b'\0')
          c.baseline('source',root,[root]+[root/os.fsdecode(n) for n in names[:-1]])
          c.baseline('sdk',sdk,sdk=True)
          c.baseline('venv',job/'venv'); c.baseline('python-base',Path(os.environ['ORIGINAL_PYTHON_BASE']))
          # 기존 공용 ELF/DSO parser를 재사용한다. static ELF 이외 empty/unresolved ldd는 실패한다.
          tools={n:Path('/usr/bin')/n for n in ('git','gh','g++','gcc','cc','c++','clang','as','ld','ar','ldd','pkg-config','capnp','make','bash')}
          adapter=types.SimpleNamespace(holds=c.holds,out=c.proof,tools={'ldd':tools['ldd']},sdk_root=sdk,
            target=job,numerics=Path(os.environ['ORIGINAL_PYTHON_BASE']),
            command=lambda argv,label,limit=MIB: command(argv,label,60))
          def dso(path,label):
            p=path.resolve(strict=True); c.holds.add(path,elf=True)
            m.Probe.dso(adapter,p,label)
          for i,p in enumerate([*tools.values(),sdk/'bin/rustc',sdk/'bin/cargo',sdk/'bin/rustdoc',
            Path(os.environ['ORIGINAL_PYTHON']),Path(os.environ['LLVM_PATH'])]):
            c.holds.add(p); p=p.resolve(strict=True)
            with p.open('rb') as f: magic=f.read(7)
            if magic.startswith(b'\x7fELF'): dso(p,'provider-'+str(i))
          for name in ('cc1','cc1plus','collect2','lto-wrapper'):
            p=Path(command([tools['g++'],'-print-prog-name='+name],'provider-'+name,30).decode().strip()).resolve(strict=True)
