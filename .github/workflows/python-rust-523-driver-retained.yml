    - name: Seal source and index after all attempted contracts
      id: source_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()
        && env.DIAG_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        du -sx --block-size=1 "$DIAG_SOURCE_OWNER" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/private-output-bytes.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$CI_JOB_TEMP/proof/cgroup-memory-after.txt"; fi
        find "$CARGO_TARGET_DIR" -name '*.d' -type f -exec sha256sum {} + > "$CI_JOB_TEMP/proof/build-dep-info.sha256" || test ! -d "$CARGO_TARGET_DIR"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        proof_bytes=$(du -sx --block-size=1 "$CI_JOB_TEMP/proof" | cut -f1)
        [[ $proof_bytes =~ ^[0-9]+$ ]]
        ((proof_bytes <= 2 * 1024 * 1024 * 1024))
    - name: Verify whole prepared private Rust SDK after all attempted model diagnostic contracts
      id: prepared_rust_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()
        && steps.prepared_rust.outcome == 'success') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" after
        proof_bytes=$(du -sx --block-size=1 "$CI_JOB_TEMP/proof" | cut -f1)
        [[ $proof_bytes =~ ^[0-9]+$ ]]
        ((proof_bytes <= 2 * 1024 * 1024 * 1024))
    - name: Independently require final source provider and owned-child seals even after sticky failure
      id: immutable_seals
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        sha256sum --check "$CI_JOB_TEMP/proof/driver476-llvm.before.sha256"
        /usr/bin/python3 -I -B -S - <<'CHECK'
        import json,os
        from pathlib import Path
        job=Path(os.environ['CI_JOB_TEMP'])
        q=json.loads((job/'driver-retained476/proof/outcome.json').read_bytes())
        assert q['source']==os.environ['GITHUB_SHA'] and q['all_owned_children_reaped'] is True
        assert q['final_seals_passed'] is True and q['finalizer_failures']==[]
        assert q['full_six_source_acceptance'] is False and q['retirement_credit']==0
        assert q['fresh_exit_observed'] is True and q['fresh_failure_sticky'] is True and 1<=q['fresh_gate_exit']<=255
        f=json.loads((job/'proof/fresh-status.json').read_bytes())
        assert f['exit']==q['fresh_gate_exit'] and f['source']==q['source']
        assert q['selector_invocations']<=1
        commands=q['commands']
        assert sum(c['label']=='fresh-driver' for c in commands)==1
        assert sum(c['label']=='original-prestate' for c in commands)<=1
        assert sum(c['label']=='cached-driver' for c in commands)<=1
        assert sum(c['label']=='retained-collection' for c in commands)==1
