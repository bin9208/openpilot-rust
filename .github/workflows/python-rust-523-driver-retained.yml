            return [{'path':n,'sha256':files[n]['sha256']} for n in names]
          guarded=binding(elfs['offline-llvm-guarded-add']); cached=binding(elfs['offline-cached-code'])
          current={'helper_sha256':guarded['sha256'],'helper_binding_sha256':sha(canon(guarded)),
            'cached_helper_sha256':cached['sha256'],'cached_helper_binding_sha256':sha(canon(cached)),
            'guarded_add_sources':source_roster('GUARDED_ADD_SOURCES'),'cached_sources':source_roster('CACHED_SOURCES'),
            'exporter_roster_sha256':sha(canon(files)),'isa_verifier_sha256':pin(bridge)['sha256'],
            'isa_verifier_source_sha256':bridge_sha,'isa_receipt_sha256':pin(inputs/'isa.json')['sha256']}
          q={'source_root':str(root),'original_manifest':collection['manifest']['path'],'original_model':collection['model']['path'],
            'isa_receipt':str(inputs/'isa.json'),'admission':{'original_manifest_sha256':h.MANIFEST_SHA,
              'original_model_sha256':h.RETAINED_MODEL_SHA,'current':current,'programs':originals},
            'programs':[{'original_index':p['index'],'kernel':p['index'],'source':p['source']['path'],
              'image':p['image']['path'],'reconstruction_object':p['object']['path']} for p in collection['programs']],
            'library':None,'graph':None}
          m.save(inputs/'request.json',q)
