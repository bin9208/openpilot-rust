name: 296 final ten current-native route and uploader closure
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/route-final-ten-native-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  final-ten:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: 12af083b2e31bbb73cb8f73a9822e1c92d3ab8ea
      ROUTE_TRANSITION_SHA256: c790ca029932c6c5dd6dae5ff8eb03eb13688bf8d913738426f6121eedc5c63b
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Initialize external recipe, immutable evidence and bounded output paths
      shell: bash
      run: 'set -euo pipefail

        umask 077

        recipe="$RUNNER_TEMP/route-retired-recipe"

        inputs="$RUNNER_TEMP/route-retired-inputs"

        proof="$RUNNER_TEMP/route-final-ten"

        artifacts="$RUNNER_TEMP/route-final-ten-artifacts"

        mkdir -p "$recipe" "$inputs" "$proof" "$artifacts"

        printf ''ROUTE_RETIRED_RECIPE=%s

        ROUTE_RETIRED_INPUTS=%s

        ROUTE_RETIRED_ARTIFACTS=%s

        ROUTE_R9U_ZIP=%s/R9u.zip

        UPLOADER_R3_ZIP=%s/R3.zip

        CARGO_TARGET_DIR=%s/rust/target

        '' "$recipe" "$inputs" "$artifacts" "$inputs" "$inputs" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        '
    - uses: actions/checkout@v7
      with:
        ref: 12af083b2e31bbb73cb8f73a9822e1c92d3ab8ea
        persist-credentials: false
        fetch-depth: 1
        lfs: false
    - name: Bind exact retirement source and reserve disposable hosted capacity
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''source=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$EXPECTED_SOURCE" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/route-final-ten/exact-source.txt"

        git diff --exit-code HEAD -- > "$RUNNER_TEMP/route-final-ten/source-initial.diff"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 12288

        lscpu --json > "$RUNNER_TEMP/route-final-ten/lscpu.json"

        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$RUNNER_TEMP/route-final-ten/disk-before.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Install genuine native prerequisites; use Python stdlib observers only
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev pkg-config capnproto libcapnp-dev libavcodec-dev
        libavformat-dev libavutil-dev libzstd-dev libzmq3-dev strace

        selected_python="$(command -v python3)"

        printf ''ROUTE_UPLOAD_PYTHON=%s

        '' "$selected_python" >> "$GITHUB_ENV"

        "$selected_python" --version > "$RUNNER_TEMP/route-final-ten/python-observer.txt"

        rustc +1.94.0 -Vv > "$RUNNER_TEMP/route-final-ten/rustc.txt"

        '
    - name: Download sealed accepted R9u and sibling R3 observations without executing originals
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12431965287/zip > "$ROUTE_R9U_ZIP"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12427719093/zip > "$UPLOADER_R3_ZIP"

        printf ''c702b36e646431e4a6090ef25de014ef38e64defb801ddab6ea3d12ded0febf1  %s

        ec4a5f238befa9b4ffbd546a887ec503276e3799869a00b5432a4f535ebddb27  %s

        '' "$ROUTE_R9U_ZIP" "$UPLOADER_R3_ZIP" | sha256sum --check --strict

        '
    - name: Stage exact external native-two-root.py (1/2)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/native-two-root.py.b64"

        '
    - name: Stage exact external native-two-root.py (2/2)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        >> "$ROUTE_RETIRED_RECIPE/native-two-root.py.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/native-two-root.py.b64" > "$ROUTE_RETIRED_RECIPE/native-two-root.py"

        rm -- "$ROUTE_RETIRED_RECIPE/native-two-root.py.b64"

        printf ''ef702b5279a0fe83cba202ec1e92388669f433ff308af177826e89e5874dabb5  %s/native-two-root.py\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external hosted-native-retired.sh (1/1)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/hosted-native-retired.sh.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/hosted-native-retired.sh.b64" > "$ROUTE_RETIRED_RECIPE/hosted-native-retired.sh"

        rm -- "$ROUTE_RETIRED_RECIPE/hosted-native-retired.sh.b64"

        printf ''6a65a437c03129d1473ef7fc245156f49b413c3bd449a9e38a24fde894fb1844  %s/hosted-native-retired.sh\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external route-upload-compare.py (1/1)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/route-upload-compare.py.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/route-upload-compare.py.b64" > "$ROUTE_RETIRED_RECIPE/route-upload-compare.py"

        rm -- "$ROUTE_RETIRED_RECIPE/route-upload-compare.py.b64"

        printf ''e52480dcde6cb9d75cfc916d24d8d0d363399b381d7767b8a138ef81f8ca84a8  %s/route-upload-compare.py\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external route-upload-held.py (1/1)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/route-upload-held.py.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/route-upload-held.py.b64" > "$ROUTE_RETIRED_RECIPE/route-upload-held.py"

        rm -- "$ROUTE_RETIRED_RECIPE/route-upload-held.py.b64"

        printf ''eab17f34cde8dd9f2c5dcfa044edd0c480d5883909f18f1008b4fd3f729d468e  %s/route-upload-held.py\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external route-upload-exec-audit-v2.py (1/2)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/route-upload-exec-audit-v2.py.b64"

        '
    - name: Stage exact external route-upload-exec-audit-v2.py (2/2)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        >> "$ROUTE_RETIRED_RECIPE/route-upload-exec-audit-v2.py.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/route-upload-exec-audit-v2.py.b64" > "$ROUTE_RETIRED_RECIPE/route-upload-exec-audit-v2.py"

        rm -- "$ROUTE_RETIRED_RECIPE/route-upload-exec-audit-v2.py.b64"

        printf ''1ef589925ba191ee31ea9774c351789eb26c00081ddd09d4a15aab800c515e60  %s/route-upload-exec-audit-v2.py\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external future-source-absence-r3.py (1/2)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/future-source-absence-r3.py.b64"

        '
    - name: Stage exact external future-source-absence-r3.py (2/2)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        >> "$ROUTE_RETIRED_RECIPE/future-source-absence-r3.py.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/future-source-absence-r3.py.b64" > "$ROUTE_RETIRED_RECIPE/future-source-absence-r3.py"

        rm -- "$ROUTE_RETIRED_RECIPE/future-source-absence-r3.py.b64"

        printf ''1a79ce75e1cf8e72f7af3b01a541a344f2d7b7372cb396b5d76ecdbaa9b8b0db  %s/future-source-absence-r3.py\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external future-retirement-roster.json (1/1)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/future-retirement-roster.json.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/future-retirement-roster.json.b64" > "$ROUTE_RETIRED_RECIPE/future-retirement-roster.json"

        rm -- "$ROUTE_RETIRED_RECIPE/future-retirement-roster.json.b64"

        printf ''119ed7e987dcf394bc68d655ffd93179e866eba2010d4764cabff7d7531a4128  %s/future-retirement-roster.json\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Stage exact external transition-manifest.json (1/1)
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        > "$ROUTE_RETIRED_RECIPE/transition-manifest.json.b64"

        base64 --decode "$ROUTE_RETIRED_RECIPE/transition-manifest.json.b64" > "$ROUTE_RETIRED_RECIPE/transition-manifest.json"

        rm -- "$ROUTE_RETIRED_RECIPE/transition-manifest.json.b64"

        printf ''c790ca029932c6c5dd6dae5ff8eb03eb13688bf8d913738426f6121eedc5c63b  %s/transition-manifest.json\n'' "$ROUTE_RETIRED_RECIPE"
        | sha256sum --check --strict

        '
    - name: Verify complete frozen recipe and reviewed source transition closure
      shell: bash
      run: "set -euo pipefail\nprintf '%s' ''\
        \ | base64 --decode > \"$ROUTE_RETIRED_RECIPE/payload-sha256.json\"\n\"$ROUTE_UPLOAD_PYTHON\" - \"$ROUTE_RETIRED_RECIPE\"\
        \ <<'CHECK'\nimport ast,hashlib,json,sys\nfrom pathlib import Path\nroot=Path(sys.argv[1]);m=json.loads((root/'payload-sha256.json').read_text());assert\
        \ len(m)==8\nfor name,row in m.items():\n data=(root/name).read_bytes();assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'],name\n\
        \ if name.endswith('.py'):ast.parse(data,filename=name)\nassert hashlib.sha256((root/'transition-manifest.json').read_bytes()).hexdigest()=='c790ca029932c6c5dd6dae5ff8eb03eb13688bf8d913738426f6121eedc5c63b'\n\
        CHECK\nbash -n \"$ROUTE_RETIRED_RECIPE/hosted-native-retired.sh\"\n"
    - name: Current affected strict Clippy and mandatory maintained policy targets
      id: policy
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/route-final-ten"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 12288

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features route-upload-native,uploader-siblings-native
        --lib --bin check-manager-log-upload --bin check-runtime-log-upload --bin route-upload-lifecycle-fixture --test route_upload_check
        --test route_upload_lifecycle --test bootlog_artifact_check --test timed_ci --test ci_rust_isolation --test ci_disk_bootstrap
        -- -D warnings > "$proof/strict-clippy.stdout" 2> "$proof/strict-clippy.stderr" || { tail -n 100 "$proof/strict-clippy.stdout"
        "$proof/strict-clippy.stderr"; exit 1; }

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features route-upload-native
        --test timed_ci --test ci_rust_isolation --test ci_disk_bootstrap -- --nocapture --test-threads=1 > "$proof/current-policy.stdout"
        2> "$proof/current-policy.stderr" || { tail -n 100 "$proof/current-policy.stdout" "$proof/current-policy.stderr";
        exit 1; }

        '
    - name: Current native two-root recording upload ownership and critical signals; no original rerun
      id: native
      if: ${{ success() && steps.policy.outcome == 'success' }}
      shell: bash
      run: 'set -euo pipefail

        set +e

        bash "$ROUTE_RETIRED_RECIPE/hosted-native-retired.sh" 2>&1 | tee "$RUNNER_TEMP/route-final-ten/current-native-hosted.log"

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s

        '' "$status" > "$RUNNER_TEMP/route-final-ten/current-native-hosted.status"

        test "$status" -eq 0

        '
    - name: Always record clean exact source and closed-ten filesystem absence
      id: final_source
      if: ${{ always() }}
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/route-final-ten\"\nif test -d \"$GITHUB_WORKSPACE/.git\"; then git diff\
        \ --exit-code HEAD -- > \"$proof/source-final.diff\"; fi\n\"$ROUTE_UPLOAD_PYTHON\" - <<'ABSENT'\nimport json,os,subprocess\n\
        from pathlib import Path\nrecipe=Path(os.environ['ROUTE_RETIRED_RECIPE']);roster=recipe/'future-retirement-roster.json';out=Path(os.environ['RUNNER_TEMP'])/'route-final-ten'\n\
        if roster.exists():\n data=json.loads(roster.read_text());closed=data['uploader_helpers']|data['route_owned_consumers'];rows=[]\n\
        \ for root in [Path(os.environ['GITHUB_WORKSPACE']),Path(os.environ['RUNNER_TEMP'])/'route-final-ten-private']:\n\
        \  if not root.exists():continue\n  tracked=set(subprocess.check_output(['/usr/bin/git','ls-files','-z'],cwd=root).decode().split('\\\
        0'))\n  for name in closed:rows.append({'root':str(root),'path':name,'filesystem_absent':not os.path.lexists(root/name),'Git_absent':name\
        \ not in tracked})\n (out/'always-ten-absence.json').write_text(json.dumps(rows,indent=2)+'\\n')\n assert rows and\
        \ all(r['filesystem_absent'] and r['Git_absent'] for r in rows)\nABSENT\ndf -B1 \"$GITHUB_WORKSPACE\" \"$RUNNER_TEMP\"\
        \ > \"$proof/disk-after.txt\"\n"
    - name: Always stage bounded artifacts excluding private checkouts caches binaries and keys
      env:
        POLICY_OUTCOME: ${{ steps.policy.outcome }}
        NATIVE_OUTCOME: ${{ steps.native.outcome }}
        FINAL_SOURCE_OUTCOME: ${{ steps.final_source.outcome }}
      if: ${{ always() }}
      shell: bash
      run: "set -euo pipefail\nif test -f \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"; then \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 512; fi\n\"${ROUTE_UPLOAD_PYTHON:-/usr/bin/python3}\" - <<'BUNDLE'\nimport\
        \ hashlib,json,os,shutil,stat\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']);destination=Path(os.environ['ROUTE_RETIRED_ARTIFACTS']);roots=[base/'route-final-ten',base/'route-retired-recipe',base/'route-retired-inputs']\n\
        maximum=256<<20;per_file=32<<20;used=0;rows=[];failures=[];excluded={'bin','home','.git','target','__pycache__','.venv'}\n\
        for root in roots:\n if not root.exists():continue\n for directory,children,names in os.walk(root,followlinks=False):\n\
        \  here=Path(directory)\n  for name in list(children):\n   path=here/name\n   if name in excluded or path.is_symlink():children.remove(name);rows.append({'path':str(path.relative_to(base)),'excluded_directory_or_symlink':True})\n\
        \  for name in names:\n   source=here/name;relative=source.relative_to(base);meta=source.lstat()\n   if not stat.S_ISREG(meta.st_mode):rows.append({'path':str(relative),'excluded_nonregular':True});continue\n\
        \   with source.open('rb') as stream:magic=stream.read(4)\n   if magic==b'\\x7fELF' or name.endswith(('.key','.pem'))\
        \ or name in {'id_rsa','id_ecdsa','id_ed25519'}:rows.append({'path':str(relative),'excluded_ELF_or_key':True});continue\n\
        \   if meta.st_size>per_file or used+meta.st_size>maximum:failures.append({'path':str(relative),'bytes':meta.st_size,'reason':'evidence\
        \ budget exceeded'});continue\n   target=destination/relative;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target);after=source.stat()\n\
        \   if (meta.st_dev,meta.st_ino,meta.st_size,meta.st_mtime_ns,meta.st_ctime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns):failures.append({'path':str(relative),'reason':'file\
        \ changed during copy'})\n   with target.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()\n\
        \   used+=target.stat().st_size;rows.append({'path':str(relative),'bytes':target.stat().st_size,'sha256':digest})\n\
        receipt={'source':os.environ['EXPECTED_SOURCE'],'workflow':os.environ.get('GITHUB_WORKFLOW_SHA'),'run':os.environ.get('GITHUB_RUN_ID'),'policy_outcome':os.environ.get('POLICY_OUTCOME'),'native_outcome':os.environ.get('NATIVE_OUTCOME'),'final_source_outcome':os.environ.get('FINAL_SOURCE_OUTCOME'),'copied_bytes':used,'max_bytes':maximum,'per_file_max_bytes':per_file,'files':rows,'failures':failures,'scope':'final-ten\
        \ current native closure; sealed R9u/R3 observations reused; no fresh project Python or device execution'}\n(destination/'bounded-artifact-manifest.json').write_text(json.dumps(receipt,indent=2)+'\\\
        n')\nif failures:raise SystemExit('Bounded evidence packaging incomplete')\nBUNDLE\n"
    - name: Always upload exact-source bounded retirement proof
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: 296-final-ten-native-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.ROUTE_RETIRED_ARTIFACTS }}/
        retention-days: 14
        if-no-files-found: warn
        compression-level: 6
        include-hidden-files: true
