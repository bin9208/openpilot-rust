name: 296 independent original Panda protocol native retirement candidate
permissions:
  contents: read
  actions: read
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-protocol-retirement-once.yml
jobs:
  original-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: e7bd8a2fc9b1e3b9984043214779583bc1237e5e
        persist-credentials: false
    - name: Reserve disk and prepare minimal device compiler inputs
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = e7bd8a2fc9b1e3b9984043214779583bc1237e5e

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ libusb-1.0-0-dev pkg-config

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Borrow and seal unchanged original C++ protocol ELF
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 3072\n\
        mkdir -p \"$RUNNER_TEMP/panda-protocol-borrowed\"\ncd \"$RUNNER_TEMP/panda-protocol-borrowed\"\ncurl -fLsS --retry\
        \ 3 --retry-delay 5 \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H 'Accept: application/vnd.github+json' \\\
        \n  'https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12358686227/zip' \\\n  -o original-private.zip\n\
        printf '%s  %s\\n' 1dffb8ea17d36f68e02b3c59736effbf9667d6225fb13e35eec833f140f321cc original-private.zip | sha256sum\
        \ -c -\nunzip -p original-private.zip retirement/checkout-output/protocol-src/pandad-protocol-source > pandad-protocol-source\n\
        unzip -p original-private.zip retirement/checkout-output/protocol-src/manifest.json > manifest.json\nchmod 755 pandad-protocol-source\n\
        printf '%s  %s\\n' bc4b133fad240a96212144be82f9946ee417390ad1cd4082b0c009ee680cd14d pandad-protocol-source | sha256sum\
        \ -c -\n"
    - name: Build only the current native protocol example
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\ncargo build --manifest-path rust/Cargo.toml -p openpilot-pandad --example panda_protocol --locked \\\n > \"\
        $RUNNER_TEMP/panda-protocol-borrowed/native-build.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-protocol-borrowed/native-build.stderr\"\
        \n"
    - name: Capture original protocol requests responses and admissions
      env:
        PANDAD_PROTOCOL_CAPTURE: ${{ runner.temp }}/panda-protocol-original
        PANDAD_PROTOCOL_SOURCE_BINARY: ${{ runner.temp }}/panda-protocol-borrowed/pandad-protocol-source
        PANDAD_PROTOCOL_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/panda_protocol
        PANDAD_PROTOCOL_SOURCE_MANIFEST: ${{ runner.temp }}/panda-protocol-borrowed/manifest.json
        PANDAD_PROTOCOL_BORROWED_ZIP: ${{ runner.temp }}/panda-protocol-borrowed/original-private.zip
      run: 'set -euo pipefail

        export PANDAD_PROTOCOL_SOURCE_COMMIT="$(git rev-parse HEAD)"

        printf %s ''''
        | base64 -d > "$RUNNER_TEMP/capture-original-protocol.py"

        printf ''%s  %s\n'' 42a80191b40321252e7cb09444bf03f4c2b77ed61d595a9af35411b66f0f8978 "$RUNNER_TEMP/capture-original-protocol.py"
        | sha256sum -c -

        PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/capture-original-protocol.py"

        '
    - name: Bind independent original capture for native protocol comparison
      run: "set -euo pipefail\ncapture=\"$RUNNER_TEMP/panda-protocol-original\"\nmanifest_sha=$(sha256sum \"$capture/capture-manifest.json\"\
        \ | cut -d ' ' -f 1)\nmkdir -p \"$RUNNER_TEMP/panda-protocol-retirement\"\n{\n echo \"PANDAD_PROTOCOL_ORIGINAL_CAPTURE=$capture\"\
        \n echo \"PANDAD_PROTOCOL_CAPTURE_MANIFEST_SHA256=$manifest_sha\"\n echo \"PANDAD_PROTOCOL_CAPTURE_SOURCE_COMMIT=$(git\
        \ rev-parse HEAD)\"\n echo \"PANDAD_PROTOCOL_TEST_OUTPUT=$RUNNER_TEMP/panda-protocol-retirement\"\n} >> \"$GITHUB_ENV\"\
        \n"
    - name: Cloud native protocol controller controls and full independent original parity
      env:
        PANDAD_PROTOCOL_RETIREMENT_MODE: predelete
        PANDAD_PROTOCOL_SOURCE_BINARY: ${{ runner.temp }}/panda-protocol-borrowed/pandad-protocol-source
        PANDAD_PROTOCOL_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/panda_protocol
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 8192\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-protocol-native --test\
        \ pandad_protocol_check --test pandad_protocol_reference --locked \\\n > \"$RUNNER_TEMP/panda-protocol-retirement/native-tests.stdout\"\
        \ \\\n 2> \"$RUNNER_TEMP/panda-protocol-retirement/native-tests.stderr\"\ncargo clippy --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features pandad-protocol-native --lib --bin check-pandad-protocol --test pandad_protocol_check\
        \ --test pandad_protocol_reference --locked -- -D warnings \\\n > \"$RUNNER_TEMP/panda-protocol-retirement/native-clippy.stdout\"\
        \ \\\n 2> \"$RUNNER_TEMP/panda-protocol-retirement/native-clippy.stderr\"\n"
    - name: Preserve independent original and native protocol evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-protocol-original-and-native
        path: '${{ runner.temp }}/panda-protocol-original/

          ${{ runner.temp }}/panda-protocol-retirement/

          ${{ runner.temp }}/panda-protocol-borrowed/manifest.json

          ${{ runner.temp }}/panda-protocol-borrowed/native-build.stdout

          ${{ runner.temp }}/panda-protocol-borrowed/native-build.stderr

          '
        if-no-files-found: warn
        retention-days: 7
