    - name: Measure the same held ELFs without and with ptrace under unchanged bounds
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        "$LOGGING_SELECTED_PYTHON" "$RUNNER_TEMP/r3-dual-measurement.py"

        '
    - name: Assemble bounded always evidence with explicit source/provider exclusions
      if: always()
      shell: bash
      run: "set -euo pipefail\nlogging_evidence_python=${LOGGING_SELECTED_PYTHON:-$(command -v python3)}\n\"$logging_evidence_python\"\
        \ - <<'PY'\nimport hashlib,json,os,shutil\nfrom pathlib import Path\nsource=Path(os.environ.get('LOGGING_PROOF_OUTPUT',str(Path(os.environ['RUNNER_TEMP'])/'native-logging-r1')));\
        \ output=Path(os.environ['RUNNER_TEMP'])/'native-logging-r1-public'\noutput.mkdir(exist_ok=True)\nmanifest={}; size=0;\
        \ excluded=[]\nif source.exists():\n    for path in sorted(source.rglob('*')):\n        if not path.is_file(): continue\n\
        \        relative=path.relative_to(source)\n        if path.suffix not in {'.json','.jsonl','.bin','.txt','.stdout','.stderr','.raw','.log'}\
        \ and '.trace' not in path.name:\n            excluded.append(str(relative)); continue\n        data=path.read_bytes()\n\
        \        assert not data.startswith(b'\\x7fELF'),relative\n        size+=len(data); assert size<=32<<20,'bounded logging\
        \ evidence exceeded32MiB'\n        destination=output/relative; destination.parent.mkdir(parents=True,exist_ok=True);\
        \ destination.write_bytes(data)\n        manifest[str(relative)]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}\n\
        (output/'content-seals.json').write_text(json.dumps(manifest,indent=2)+'\\n')\n(output/'excluded.json').write_text(json.dumps(excluded,indent=2)+'\\\
        n')\nPY\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: native-logging-r3
        if-no-files-found: error
        include-hidden-files: true
        path: ${{ runner.temp }}/native-logging-r1-public/
