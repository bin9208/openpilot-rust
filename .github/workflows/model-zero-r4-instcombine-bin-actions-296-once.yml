name: '296 road #482 InstCombine boundary on bin-actions (new once)'
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-zero-r4-instcombine-bin-actions-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: 296-road-instcombine-bin-actions
  cancel-in-progress: false
jobs:
  boundary:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 25
    env:
      SOURCE_SHA: 1d5570e158bb7a799c4a816f78bc7f63f201d2a4
      PINNED_LLVM: /usr/lib/llvm-18/lib/libLLVM.so.1
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PATH: /usr/bin:/bin
      OBSERVER_SHA256: 32f5f9a6614030797a68d441db16da5e6d3b9981853bb1f41cc8c94c5f4033f0
      OBSERVER_B64: 
    defaults:
      run:
        shell: bash
    steps:
    - name: Create owned fresh namespace and actual runner receipt
      run: "set -euo pipefail\numask 077\nboundary_job=$(mktemp -d \"$RUNNER_TEMP/296-road-boundary.XXXXXXXX\")\nmkdir \"\
        $boundary_job/evidence\" \"$boundary_job/tmp\" \"$boundary_job/target\" \"$boundary_job/cache\" \"$boundary_job/cargo\"\
        \ \"$boundary_job/rustup\" \"$boundary_job/home\"\nprintf '%s/%s\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" >\
        \ \"$boundary_job/owner.txt\"\nprintf 'BOUNDARY_JOB=%s\\nBOUNDARY_PUBLIC=%s/public\\nTMPDIR=%s/tmp\\nCARGO_TARGET_DIR=%s/target\\\
        nCARGO_HOME=%s/cargo\\nRUSTUP_HOME=%s/rustup\\nXDG_CACHE_HOME=%s/cache\\nHOME=%s/home\\n' \"$boundary_job\" \"$boundary_job\"\
        \ \"$boundary_job\" \"$boundary_job\" \"$boundary_job\" \"$boundary_job\" \"$boundary_job\" \"$boundary_job\" >> \"\
        $GITHUB_ENV\"\nprintf 'repository=%s\\nsource=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\nrunner=%s\\nrunner_os=%s\\\
        nrunner_arch=%s\\nenvironment=%s\\n' \"$GITHUB_REPOSITORY\" \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"\
        $GITHUB_RUN_ATTEMPT\" \"$RUNNER_NAME\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" \"$RUNNER_ENVIRONMENT\" > \"$boundary_job/evidence/context.txt\"\
        \ncat /etc/os-release > \"$boundary_job/evidence/os-release.txt\"\nlscpu --json > \"$boundary_job/evidence/cpu.json\"\
        \ncat /proc/meminfo > \"$boundary_job/evidence/meminfo.txt\"\ndf -B1 -T -- \"$boundary_job\" > \"$boundary_job/evidence/disk.txt\"\
        \nfor boundary_file in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpuset.cpus.effective /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current\
        \ /sys/fs/cgroup/memory.events /proc/self/cgroup; do\n if [[ -r $boundary_file ]]; then printf '%s\\n' \"$boundary_file\"\
        ; cat \"$boundary_file\"; fi\ndone > \"$boundary_job/evidence/cgroup.txt\"\nprintf '%s' \"$OBSERVER_B64\" | base64\
        \ --decode > \"$boundary_job/boundary.py\"\nprintf '%s  %s\\n' \"$OBSERVER_SHA256\" \"$boundary_job/boundary.py\"\
        \ | sha256sum --check --strict\ncp \"$boundary_job/boundary.py\" \"$boundary_job/evidence/observer-source.py\"\n[[\
        \ $GITHUB_ACTIONS == true && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_NAME == bin-actions && $RUNNER_OS == Linux\
        \ && $RUNNER_ARCH == X64 ]]\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-native-tools-candidate\
        \ ]]\n[[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]\n[[ $(uname -m) == x86_64 ]]\n[[\
        \ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONHOME:-} && -z ${PYTHONPATH:-} ]]\n/usr/bin/python3 -VV\
        \ > \"$boundary_job/evidence/python-version.txt\"\nfor boundary_tool in /usr/bin/python3 /usr/bin/gh /usr/bin/sha256sum;\
        \ do\n [[ -x $boundary_tool ]]; sha256sum \"$boundary_tool\"\ndone > \"$boundary_job/evidence/host-tools.sha256\"\n\
        /usr/bin/python3 -I -B - <<'RESOURCES' > \"$boundary_job/evidence/operation-budget.json\"\nimport json, os\nfrom pathlib\
        \ import Path\nroot=Path(os.environ['RUNNER_TEMP'])\nv=os.statvfs(root)\nmem={line.split(':')[0]:int(line.split()[1])*1024\
        \ for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')}\navailable=mem['MemAvailable']\n\
        for mount in [line.split()[4] for line in Path('/proc/self/mountinfo').read_text().splitlines() if ' - cgroup2 ' in\
        \ line]:\n group=next((line.split(':',2)[2] for line in Path('/proc/self/cgroup').read_text().splitlines() if line.startswith('0::')),None)\n\
        \ if group is not None:\n  # Use the process's current cgroup and its ancestor limits, not merely the mount root.\n\
        \  point=Path(mount)/group.lstrip('/')\n  while point.is_relative_to(Path(mount)):\n   if (point/'memory.max').exists():\n\
        \    maximum=(point/'memory.max').read_text().strip()\n    if maximum!='max':available=min(available,max(0,int(maximum)-int((point/'memory.current').read_text())))\n\
        \   if point==Path(mount):break\n   point=point.parent\nassert v.f_bavail*v.f_frsize >= 384<<20, 'growth budget:27MB\
        \ ZIP + admitted84MB + source/IR/provider receipts + bounded128MB always-upload'\nassert available >= 768<<20, 'estimated\
        \ audit/LLVM working memory unavailable; no host reserve floor'\nprint(json.dumps({'free_bytes':v.f_bavail*v.f_frsize,'operation_growth_bytes':384<<20,'available_memory_bytes':available,'estimated_working_memory_bytes':768<<20}))\n\
        RESOURCES\n"
    - name: Authenticate exact prior failure and source snapshots; no checkout or archived code
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n# Only job-owned files are written; no persistent package/toolchain changes.\nulimit -f 65536\n\
        /usr/bin/gh api -H 'Cache-Control: no-cache' \"repos/bin9208/openpilot-rust/git/commits/$SOURCE_SHA\" > \"$BOUNDARY_JOB/commit-api.json\"\
        \nboundary_index=0\nfor boundary_path in rust/crates/model-runtime/src/guarded_add.rs rust/crates/model-runtime/src/bin/offline-llvm-compile.rs\
        \ rust/crates/model-runtime/src/compiler_backend_cpu/llvm.rs; do\n /usr/bin/gh api -H 'Cache-Control: no-cache' \"\
        repos/bin9208/openpilot-rust/contents/$boundary_path?ref=$SOURCE_SHA\" > \"$BOUNDARY_JOB/source-api-$boundary_index.json\"\
        \n boundary_index=$((boundary_index+1))\ndone\n/usr/bin/gh api -H 'Cache-Control: no-cache' repos/bin9208/openpilot-rust/actions/artifacts/12449897200\
        \ > \"$BOUNDARY_JOB/artifact-api.json\"\ncp \"$BOUNDARY_JOB/artifact-api.json\" \"$BOUNDARY_JOB/evidence/artifact-api.json\"\
        \n/usr/bin/gh api -H 'Cache-Control: no-cache' repos/bin9208/openpilot-rust/actions/artifacts/12449897200/zip > \"\
        $BOUNDARY_JOB/input.zip\"\n/usr/bin/python3 -I -B \"$BOUNDARY_JOB/boundary.py\" admit > \"$BOUNDARY_JOB/evidence/admission.stdout\"\
        \ 2> \"$BOUNDARY_JOB/evidence/admission.stderr\"\n"
    - name: Require unchanged LLVM provider and observe only unmeasured InstCombine boundary
      timeout-minutes: 7
      run: 'set -euo pipefail

        # Preprovisioned provider is mandatory. No apt/sudo/install or alternate-version fallback.

        # This standalone observer uses LLVM C API; it does not call the old fixed-reserve

        # production compiler worker. Parent owns the separately reviewed core-guard repair.

        status=0

        /usr/bin/python3 -I -B "$BOUNDARY_JOB/boundary.py" observe > "$BOUNDARY_JOB/evidence/observe.stdout" 2> "$BOUNDARY_JOB/evidence/observe.stderr"
        || status=$?

        printf ''%s\n'' "$status" > "$BOUNDARY_JOB/evidence/observe.status"

        tail -n 60 "$BOUNDARY_JOB/evidence/observe.stderr"

        exit "$status"

        '
    - name: Require complete source/provider closure and retain failed historical status
      run: "set -euo pipefail\n/usr/bin/python3 -I -B - <<'REQUIRE'\nimport json,os\nfrom pathlib import Path\nout=Path(os.environ['BOUNDARY_JOB'])/'evidence'\n\
        load=lambda p:json.loads(p.read_bytes())\nreport=load(out/'complete.json')\nassert report['source']==os.environ['SOURCE_SHA']\
        \ and report['diagnostic_completed'] is True\nassert report['workers']==3 and report['kernel_calls']==0 and report['prior_runs_stay_failed']\
        \ is True\nassert not report['numeric_parity_gate'] and not report['whole_model_or_482_acceptance'] and not report['production_fix']\n\
        assert load(out/'source.before.json')['files']==load(out/'source.after.json')['files']\ntrace=load(out/'exec-trace.json')\n\
        assert [r['label'] for r in trace]==['original','old','candidate'] and all(r['exit_status']==0 for r in trace)\nassert\
        \ len({r['pid'] for r in trace})==3\nconfigs=[]\nfor row in trace:\n label=row['label'];root=out/label\n configs.append(load(root/'config.json')['actual'])\n\
        \ assert load(root/'boundary.json')['pid']==row['pid'] and load(root/'boundary.json')['label']==label\n assert load(root/'held.before.json')==load(root/'held.after.json')\n\
        \ closure=load(root/'closure.json');assert closure['before']==closure['after'] and not closure['new_mappings']\n assert\
        \ load(root/'source.after.json')==load(out/'source.before.json')['files']\n assert load(root/'boundary.json')['kernel_calls']==0\n\
        assert configs[0]==configs[1]==configs[2]\nassert (out/'input/strict-frozen.status').read_text().strip()=='1'\nassert\
        \ (out/'input/fresh-context.status').read_text().strip()=='0'\nassert (out/'input/replay.status').read_text().strip()=='1'\n\
        REQUIRE\n"
    - name: Always seal bounded inert diagnostics in owned namespace
      if: always()
      timeout-minutes: 3
      run: "set -euo pipefail\numask 077\nif [[ -n ${BOUNDARY_JOB:-} && -f $BOUNDARY_JOB/boundary.py ]]; then\n /usr/bin/python3\
        \ -I -B \"$BOUNDARY_JOB/boundary.py\" pack\nelse\n # Even bootstrap failure gets an independent owned bounded receipt.\n\
        \ boundary_fallback=$(mktemp -d \"$RUNNER_TEMP/296-road-boundary-fallback.XXXXXXXX\")\n printf 'BOUNDARY_FALLBACK=%s\\\
        nBOUNDARY_PUBLIC=%s\\n' \"$boundary_fallback\" \"$boundary_fallback\" >> \"$GITHUB_ENV\"\n printf '{\"result\":\"\
        fail\",\"reason\":\"bootstrap did not leave the observer\"}\\n' > \"$boundary_fallback/bootstrap-failure.json\"\n\
        fi\n"
    - id: upload
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-zero-r4-instcombine-bin-actions-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.BOUNDARY_PUBLIC }}/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
    - name: Clean only this owned job after successful evidence upload
      if: always() && steps.upload.outcome == 'success'
      timeout-minutes: 2
      run: "set -euo pipefail\n/usr/bin/python3 -I -B - <<'CLEAN'\nimport os,shutil,stat\nfrom pathlib import Path\nparent=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\n\
        for key,prefix in (('BOUNDARY_JOB','296-road-boundary.'),('BOUNDARY_FALLBACK','296-road-boundary-fallback.')):\n if\
        \ key not in os.environ:continue\n path=Path(os.environ[key]);info=path.lstat()\n assert stat.S_ISDIR(info.st_mode)\
        \ and not path.is_symlink() and path.resolve(strict=True).parent==parent\n assert path.name.startswith(prefix) and\
        \ info.st_uid==os.getuid() and stat.S_IMODE(info.st_mode)==0o700\n if key=='BOUNDARY_JOB':assert (path/'owner.txt').read_text()==os.environ['GITHUB_RUN_ID']+'/'+os.environ['GITHUB_RUN_ATTEMPT']+'\\\
        n'\n shutil.rmtree(path)\nCLEAN\n"
