name: 296 native IDNA Unicode32 exact original domains
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-idna-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 995383b2bbdd199fb925184914d8aa4f29837831
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 995383b2bbdd199fb925184914d8aa4f29837831
        persist-credentials: false
    - name: Reserve capacity and install the parent Rust194 native prerequisites
      shell: bash
      run: 'set -euo pipefail

        export IDNA_GATE_BASE="$RUNNER_TEMP/changed-files-idna-native-296"

        printf ''IDNA_GATE_BASE=%s\n'' "$IDNA_GATE_BASE" >> "$GITHUB_ENV"

        mkdir "$IDNA_GATE_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$IDNA_GATE_BASE/source.txt"

        git status --porcelain=v1 > "$IDNA_GATE_BASE/source-status.before.txt"

        test ! -s "$IDNA_GATE_BASE/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$IDNA_GATE_BASE/rustc.txt"

        for tool in rustc cargo clippy-driver; do rustup which --toolchain 1.94.0 "$tool"; done > "$IDNA_GATE_BASE/rust-tools.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 g++ strace > "$IDNA_GATE_BASE/native-packages.txt"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/idna-296-target-$EXPECTED_SOURCE"

        test ! -e "$CARGO_TARGET_DIR"

        printf ''CARGO_TARGET_DIR=%s\n'' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

        '
    - name: Admit exact original artifact and freeze source and issuer guards
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''AUDITOR'' > "$IDNA_GATE_BASE/hosted_idna_gate.py"

        

        AUDITOR

        base64 --decode <<''CONFIG'' > "$IDNA_GATE_BASE/gate-config.json"

        

        CONFIG

        printf ''797cc4626ba0963ac5661cf5db983df19357e734513429dc681ae2fe5d8222d9  %s/hosted_idna_gate.py\n'' "$IDNA_GATE_BASE"
        | sha256sum --check --strict

        printf ''95b4218b38a5c0d1582ac43758f8d72bd3e330375868fa56873a1947d770361a  %s/gate-config.json\n'' "$IDNA_GATE_BASE"
        | sha256sum --check --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12445211799 > "$IDNA_GATE_BASE/original-artifact-api.json"

        gh api repos/bin9208/openpilot-rust/actions/runs/39822127102 > "$IDNA_GATE_BASE/original-run-api.json"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12445211799/zip > "$IDNA_GATE_BASE/original.zip"

        python3 -I -B "$IDNA_GATE_BASE/hosted_idna_gate.py" admit > "$IDNA_GATE_BASE/admit.stdout" 2> "$IDNA_GATE_BASE/admit.stderr"

        '
    - name: Compile affected library and discover one fresh current test ELF
      shell: bash
      run: 'set -euo pipefail

        printf ''797cc4626ba0963ac5661cf5db983df19357e734513429dc681ae2fe5d8222d9  %s/hosted_idna_gate.py\n'' "$IDNA_GATE_BASE"
        | sha256sum --check --strict

        printf ''95b4218b38a5c0d1582ac43758f8d72bd3e330375868fa56873a1947d770361a  %s/gate-config.json\n'' "$IDNA_GATE_BASE"
        | sha256sum --check --strict

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        set +e

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --bin check-changed-files -- -D warnings > "$IDNA_GATE_BASE/clippy.stdout" 2> "$IDNA_GATE_BASE/clippy.stderr"

        IDNA_CLIPPY_STATUS=$?

        printf ''%s\n'' "$IDNA_CLIPPY_STATUS" > "$IDNA_GATE_BASE/clippy.status"

        set -e

        test "$IDNA_CLIPPY_STATUS" -eq 0

        set +e

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --no-run --message-format=json > "$IDNA_GATE_BASE/tests-build.jsonl" 2> "$IDNA_GATE_BASE/tests-build.stderr"

        IDNA_BUILD_STATUS=$?

        printf ''%s\n'' "$IDNA_BUILD_STATUS" > "$IDNA_GATE_BASE/tests-build.status"

        set -e

        test "$IDNA_BUILD_STATUS" -eq 0

        python3 -I -B "$IDNA_GATE_BASE/hosted_idna_gate.py" discover > "$IDNA_GATE_BASE/discover.stdout" 2> "$IDNA_GATE_BASE/discover.stderr"

        '
    - name: Execute each of the two actual tests under a closed native-only exec trace
      shell: bash
      run: "set -euo pipefail\nprintf '797cc4626ba0963ac5661cf5db983df19357e734513429dc681ae2fe5d8222d9  %s/hosted_idna_gate.py\\\
        n' \"$IDNA_GATE_BASE\" | sha256sum --check --strict\nprintf '95b4218b38a5c0d1582ac43758f8d72bd3e330375868fa56873a1947d770361a\
        \  %s/gate-config.json\\n' \"$IDNA_GATE_BASE\" | sha256sum --check --strict\nrust/tools/check-disk-space --path \"\
        $GITHUB_WORKSPACE\" --growth-mib 1024\nmkdir \"$IDNA_GATE_BASE/actual\" \"$IDNA_GATE_BASE/no-executables\"\nfor lane\
        \ in scalars vectors; do\n  mkdir \"$IDNA_GATE_BASE/actual/$lane\"\n  if test \"$lane\" = scalars; then\n    IDNA_TEST_NAME='changed_files_check::idna::tests::all_original_scalar_nameprep_and_ace_decodes_match_strict_utf8'\n\
        \  else\n    IDNA_TEST_NAME='changed_files_check::idna::tests::original_multichar_bidi_normalization_malformed_and_length_controls_match'\n\
        \  fi\n  python3 -I -B \"$IDNA_GATE_BASE/hosted_idna_gate.py\" snapshot \"$lane-before\" > \"$IDNA_GATE_BASE/$lane-before.audit.stdout\"\
        \ 2> \"$IDNA_GATE_BASE/$lane-before.audit.stderr\"\n  set +e\n  /usr/bin/env -i PATH=\"$IDNA_GATE_BASE/no-executables\"\
        \ IDNA_ORIGINAL_DIR=\"$IDNA_ORIGINAL_DIR\" IDNA_ACTUAL_DIR=\"$IDNA_GATE_BASE/actual/$lane\" IDNA_ORIGINAL_MANIFEST_SHA=\"\
        $IDNA_ORIGINAL_MANIFEST_SHA\" RUST_BACKTRACE=1 LD_BIND_NOW=1 /usr/bin/timeout --signal=TERM --kill-after=10s 600s\
        \ /usr/bin/strace -f -qq -v -s 1048576 -e trace=execve,execveat -e signal=none -o \"$IDNA_GATE_BASE/$lane.execve\"\
        \ \"$IDNA_TEST_EXE\" \"$IDNA_TEST_NAME\" --exact --test-threads=1 --nocapture > \"$IDNA_GATE_BASE/$lane.stdout\" 2>\
        \ \"$IDNA_GATE_BASE/$lane.stderr\"\n  IDNA_TEST_STATUS=$?\n  printf '%s\\n' \"$IDNA_TEST_STATUS\" > \"$IDNA_GATE_BASE/$lane.status\"\
        \n  set -e\n  printf '797cc4626ba0963ac5661cf5db983df19357e734513429dc681ae2fe5d8222d9  %s/hosted_idna_gate.py\\n'\
        \ \"$IDNA_GATE_BASE\" | sha256sum --check --strict\n  printf '95b4218b38a5c0d1582ac43758f8d72bd3e330375868fa56873a1947d770361a\
        \  %s/gate-config.json\\n' \"$IDNA_GATE_BASE\" | sha256sum --check --strict\n  python3 -I -B \"$IDNA_GATE_BASE/hosted_idna_gate.py\"\
        \ snapshot \"$lane-after\" > \"$IDNA_GATE_BASE/$lane-after.audit.stdout\" 2> \"$IDNA_GATE_BASE/$lane-after.audit.stderr\"\
        \ndone\n"
    - name: Independently audit all raw scalar and vector results and every guard pair
      if: always()
      shell: bash
      run: 'set -euo pipefail

        printf ''797cc4626ba0963ac5661cf5db983df19357e734513429dc681ae2fe5d8222d9  %s/hosted_idna_gate.py\n'' "$IDNA_GATE_BASE"
        | sha256sum --check --strict

        printf ''95b4218b38a5c0d1582ac43758f8d72bd3e330375868fa56873a1947d770361a  %s/gate-config.json\n'' "$IDNA_GATE_BASE"
        | sha256sum --check --strict

        git status --porcelain=v1 > "$IDNA_GATE_BASE/source-status.after.txt"

        python3 -I -B "$IDNA_GATE_BASE/hosted_idna_gate.py" finish > "$IDNA_GATE_BASE/finish.stdout" 2> "$IDNA_GATE_BASE/finish.stderr"

        '
    - name: Bound retained full evidence including failures
      if: always()
      shell: bash
      run: "set -euo pipefail\nif test -d \"$IDNA_GATE_BASE\"; then\n  du -sm \"$IDNA_GATE_BASE\" > \"$IDNA_GATE_BASE/artifact-size-mib.txt\"\
        \n  test \"$(cut -f1 \"$IDNA_GATE_BASE/artifact-size-mib.txt\")\" -le 192\nfi\n"
    - name: Retain all original inputs raw native outputs and external audit receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-idna-native-296
        path: ${{ runner.temp }}/changed-files-idna-native-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
