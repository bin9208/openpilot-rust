# Diagnostic-only affected checks; this workflow is never merged into dev.
name: Native tools 296 follow-up checks
on:
  push:
    branches: [codex/feat-296-native-tools-candidate]
    paths: [.github/workflows/native-tools-296-once.yml]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
jobs:
  sensor-audio:
    name: rust sensor and audio runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: f60e4ac0a655592aaef659f35cc354b86ffa09a0
    - name: Require exact candidate source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = f60e4ac0a655592aaef659f35cc354b86ffa09a0

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev
        libavutil-dev libzstd-dev libzmq5
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
    - name: Configure original sensor and audio IPC imports
      run: printf 'PYTHONPATH=%s/sensor-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Build native sensor and audio daemons
      run: cargo build --manifest-path rust/Cargo.toml -p openpilot-sensord -p openpilot-micd -p openpilot-soundd -p openpilot-feedbackd
        -p openpilot-process-supervision --bins --examples --locked
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build original IPC and Params bindings
      run: 'python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/sensor-msgq-python"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/sensor-params-binding"

        '
    - name: Compare IMU source policy, Linux ABI and continuous native IPC
      run: 'python rust/tools/check_sensord.py --trace "$PWD/rust/target/debug/examples/sensord_trace" --evidence "$RUNNER_TEMP/sensor-audio/sensord-source"

        python rust/tools/check_sensord_kernel.py --binary "$PWD/rust/target/debug/examples/sensord_linux" --evidence "$RUNNER_TEMP/sensor-audio/sensord-kernel"

        python rust/tools/check_sensord_daemon.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/sensor-audio/sensord-daemon"

        '
    - name: Compare microphone samples, pressure and continuous native capture
      run: 'python rust/tools/check_micd_analysis.py --binary "$PWD/rust/target/debug/examples/micd_trace" --output "$RUNNER_TEMP/sensor-audio/micd-source"

        python rust/tools/check_micd_daemon.py --binary "$PWD/rust/target/debug/openpilot-micd" --output "$RUNNER_TEMP/sensor-audio/micd-daemon"

        '
    - name: Build and validate native sound policy and fixture tools
      run: 'rustup component add clippy --toolchain 1.94.0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --bin check-soundd-policy
        --bin create-soundd-fixture-assets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --test soundd_policy_reference
        --test soundd_policy_check --test soundd_fixture_assets --test soundd_policy_retirement --test soundd_policy_ci --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --lib --test soundd_policy_reference
        --test soundd_policy_check --test soundd_fixture_assets --test soundd_policy_retirement --test soundd_policy_ci --bin
        check-soundd-policy --bin create-soundd-fixture-assets --locked -- -D warnings

        '
    - name: Build and validate native sound daemon controller
      run: "set -euo pipefail\nexport SOUNDD_DAEMON_BINARY=\"$PWD/rust/target/debug/openpilot-soundd\"\nexport SOUNDD_DAEMON_WORKER_BINARY=\"\
        $PWD/rust/target/debug/check-soundd-daemon\"\nexport SOUNDD_FIXTURE_ASSETS_BINARY=\"$PWD/rust/target/debug/create-soundd-fixture-assets\"\
        \nexport SOUNDD_PORTAUDIO_LIBRARY=\"$RUNNER_TEMP/owned-soundd-portaudio.so\"\nexport SOUNDD_DAEMON_TEST_OUTPUT=\"\
        $RUNNER_TEMP/sensor-audio/soundd-native-tests\"\nfor name in SOUNDD_DAEMON_BINARY SOUNDD_DAEMON_WORKER_BINARY SOUNDD_FIXTURE_ASSETS_BINARY\
        \ SOUNDD_PORTAUDIO_LIBRARY SOUNDD_DAEMON_TEST_OUTPUT; do\n  printf '%s=%s\\n' \"$name\" \"${!name}\" >> \"$GITHUB_ENV\"\
        \ndone\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build\
        \ --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3\
        \ --config profile.dev.package.sha2.opt-level=3 --bin check-soundd-daemon --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 64\ncc -std=c11 -shared -fPIC -pthread -Wall -Wextra -Werror rust/tools/fixtures/soundd/portaudio.c\
        \ -o \"$SOUNDD_PORTAUDIO_LIBRARY\"\n"
    - name: Require audio finalization baseline rejection
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/sensor-audio/finalization-433"

        baseline="$RUNNER_TEMP/soundd433-baseline"

        target="$RUNNER_TEMP/soundd433-target"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        mkdir -p "$proof"

        git fetch --no-tags origin 2d8d027932dc880bd0acd00288b256ac8d7f1b89

        GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$baseline" 2d8d027932dc880bd0acd00288b256ac8d7f1b89

        git -C "$baseline" rev-parse HEAD > "$proof/baseline.SOURCE_COMMIT"

        current_worker=rust/crates/dev-tools/src/soundd_daemon_check/worker.rs

        old_worker="$baseline/$current_worker"

        sha256sum "$old_worker" > "$proof/baseline-original-source.sha256"

        printf ''\n#[cfg(test)]\nmod finalization_433_red_tests {\nuse super::*;\n'' >> "$old_worker"

        sed -n ''/^    fn published_private_bounded_case()/,$p'' "$current_worker" | sed ''$d'' >> "$old_worker"

        printf ''\n}\n'' >> "$old_worker"

        git -C "$baseline" diff -- "$current_worker" > "$proof/regression-only.patch"

        sha256sum "$current_worker" "$old_worker" > "$proof/test-inputs.sha256"

        CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_TARGET_DIR="$target" cargo build --manifest-path
        "$baseline/rust/Cargo.toml" -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --bin check-soundd-daemon --locked 2>&1 | tee "$proof/baseline-build.log"

        old_binary="$target/debug/check-soundd-daemon"

        cp "$old_binary" "$proof/baseline-worker"

        sha256sum "$old_binary" "$proof/baseline-worker" > "$proof/baseline-worker.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_TARGET_DIR="$target" cargo test --manifest-path
        "$baseline/rust/Cargo.toml" -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib --no-run --locked

        set +e

        SOUNDD_DAEMON_WORKER_BINARY="$old_binary" CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
        CARGO_TARGET_DIR="$target" /usr/bin/timeout --signal=TERM --kill-after=5s 180s cargo test --manifest-path "$baseline/rust/Cargo.toml"
        -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3 --config profile.dev.package.sha2.opt-level=3
        --lib --locked -- soundd_daemon_check::worker::finalization_433_red_tests::finalization_rechecks_private_source_and_daemon_after_actual_publication
        --exact --nocapture 2>&1 | tee "$proof/baseline.log"

        status=${PIPESTATUS[0]}

        set -e

        test "$status" -eq 101

        grep -Fq ''test result: FAILED'' "$proof/baseline.log"

        grep -Fq ''accepted changed source at finalization'' "$proof/baseline.log"

        sha256sum --check "$proof/test-inputs.sha256"

        git worktree remove --force "$baseline"

        rm -rf "$target"

        '
    - name: Require native sound daemon finalization and process contracts
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib soundd_daemon_check::worker::tests --locked -- --test-threads=1

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --test soundd_daemon_check --test soundd_daemon_runtime --locked --
        --test-threads=1

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib --bin check-soundd-daemon --test soundd_daemon_check --test soundd_daemon_runtime
        --locked -- -D warnings

        '
    - name: Compare alert samples and continuous native playback
      run: '"$PWD/rust/target/debug/check-soundd-policy" --binary "$PWD/rust/target/debug/examples/sound_trace" --binding
        "$RUNNER_TEMP"/sensor-params-binding/params_pyx*.so --output "$RUNNER_TEMP/sensor-audio/soundd-source"

        python rust/tools/check_soundd_daemon.py --binary "$PWD/rust/target/debug/openpilot-soundd" --output "$RUNNER_TEMP/sensor-audio/soundd-daemon"
        --fixture-assets-binary "$PWD/rust/target/debug/create-soundd-fixture-assets" --portaudio-library "$RUNNER_TEMP/owned-soundd-portaudio.so"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        "$PWD/rust/target/debug/check-soundd-daemon" --binary "$PWD/rust/target/debug/openpilot-soundd" --output "$RUNNER_TEMP/sensor-audio/soundd-native-controller"
        --fixture-assets-binary "$PWD/rust/target/debug/create-soundd-fixture-assets" --portaudio-library "$RUNNER_TEMP/owned-soundd-portaudio.so"

        '
    - name: Check PortAudio callback ownership with Miri
      env:
        MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1
      run: cargo +nightly-2026-09-29 miri test --manifest-path rust/Cargo.toml -p openpilot-portaudio --no-default-features
        --lib --locked
    - name: Build and validate native feedback checker
      run: 'rustup component add clippy --toolchain 1.94.0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features feedback-runtime-native --bin
        check-feedbackd --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        FEEDBACKD_NATIVE_BINARY="$PWD/rust/target/debug/openpilot-feedbackd" cargo +1.94.0 test --manifest-path rust/Cargo.toml
        -p openpilot-dev-tools --features feedback-runtime-native --bin check-feedbackd --test feedbackd_check --test feedbackd_runtime_check
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features feedback-runtime-native --bin
        check-feedbackd --test feedbackd_check --test feedbackd_runtime_check --locked -- -D warnings

        '
    - name: Compare original policy and native bookmark IPC
      run: rust/target/debug/check-feedbackd --binary "$PWD/rust/target/debug/openpilot-feedbackd" --output "$RUNNER_TEMP/sensor-audio/feedbackd"
    - name: Retain sensor and audio comparison evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-sensor-audio-evidence
        path: ${{ runner.temp }}/sensor-audio/
  ui-connectivity:
    name: rust UI and connectivity
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: f60e4ac0a655592aaef659f35cc354b86ffa09a0
    - name: Require exact candidate source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = f60e4ac0a655592aaef659f35cc354b86ffa09a0

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal --component clippy
    - run: sudo apt-get update && sudo apt-get install -y g++ clang cmake make jq curl ghostscript libclang-dev capnproto
        libcapnp-dev libzmq3-dev libgl-dev libx11-dev libxrandr2 libxinerama1 libxcursor1 libxi6 libxtst6 xvfb xauth ffmpeg
        dbus-daemon strace
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 cffi==2.1.1 pillow==12.3.0
        python-xlib==0.33 jeepney==0.9.0 comma-deps-raylib==6.0.0.1.post103 setproctitle==1.3.7 psutil==7.2.2 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 pytest==9.0.2 anyio==4.12.1
    - name: Stage source-pinned native renderer
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 run --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" -p openpilot-dev-tools --locked --bin stage-startup-ui-raylib
        -- --arch x86_64 --output "$RUNNER_TEMP/ui-raylib" --shared

        printf ''STARTUP_UI_RAYLIB_ROOT=%s/ui-raylib\nSTARTUP_UI_RAYLIB_LIBRARY=%s/ui-raylib/lib/libopenpilot-raylib.so\n''
        "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Stage native image decoder SDK
      uses: ./.github/actions/native-image-sdk
    - name: Build native UI validation checkers
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --bin check-ui-translations --bin check-ui-fps
        --bin check-ui-stack --bin check-ui-widgets --bin check-ui-navigation --bin check-ui-scroll --bin check-ui-scroller
        --features egl-reference,polygon-reference,ui-application-lifecycle-native --bin check-ui-egl --bin ui-egl-reference
        --bin check-ui-polygon --bin ui-polygon-reference --bin check-ui-diagnostics --bin ui-diagnostic-reference --bin build-ui-diagnostic-reference
        --bin check-ui-emoji --bin check-ui-forms --bin ui-forms-reference --bin check-ui-render --bin ui-render-reference
        --bin check-ui-network --bin ui-network-reference --bin check-ui-framework --bin check-ui-application --bin ui-application-reference
        --bin build-ui-application-reference --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features egl-reference --test ui_egl_reference
        --test ui_egl_check --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features polygon-reference --test image_array
        --test ui_polygon_reference --test ui_polygon_check --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-image-codecs --features native-sdk --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features image-array-native --test ui_diagnostic_reference
        --test ui_diagnostic_check --test ui_emoji_check --test ui_emoji_ci --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 16

        rust/target/debug/build-ui-diagnostic-reference --output "$RUNNER_TEMP/ui-diagnostic-raw" --raylib-root "$STARTUP_UI_RAYLIB_ROOT"

        printf ''UI_DIAGNOSTIC_RAW_HELPER=%s/ui-diagnostic-raw/ui-diagnostic-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build independent application lifecycle and XTest boundary
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 16

        rust/target/debug/build-ui-application-reference --output "$RUNNER_TEMP/ui-application-raw" --raylib-root "$STARTUP_UI_RAYLIB_ROOT"

        printf ''UI_APPLICATION_RAW_HELPER=%s/ui-application-raw/ui-application-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build independent Forms drawing boundary
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 16

        mkdir -p "$RUNNER_TEMP/ui-forms-raw"

        "${CXX:-c++}" -std=c++17 -Wall -Wextra -Werror -O2 -I "$STARTUP_UI_RAYLIB_ROOT/include" rust/crates/dev-tools/tests/fixtures/ui-forms/raw-raylib.cc
        -ldl -o "$RUNNER_TEMP/ui-forms-raw/ui-forms-raw"

        printf ''UI_FORMS_RAW_HELPER=%s/ui-forms-raw/ui-forms-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        "${CXX:-c++}" -std=c++17 -Wall -Wextra -Werror -O2 -I "$STARTUP_UI_RAYLIB_ROOT/include" rust/crates/dev-tools/tests/fixtures/ui-render/raw-raylib.cc
        -ldl -o "$RUNNER_TEMP/ui-forms-raw/ui-render-raw"

        printf ''UI_RENDER_RAW_HELPER=%s/ui-forms-raw/ui-render-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build native UI and connectivity with original Params oracle
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-ui-framework -p openpilot-startup-ui -p openpilot-wifi -p
        openpilot-cweb-push -p openpilot-process-supervision -p openpilot-bluetooth --bins --examples --locked

        export WIFI_PROCESS_CHILD_BINARY="$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-bluetooth -p openpilot-wifi --all-targets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-bluetooth -p openpilot-wifi --all-targets --locked -- -D
        warnings

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/ui-params-binding"

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/connectivity-msgq-python"

        '
    - name: Require Wi-Fi snapshot semantic and allocation regression
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-wifi --lib --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 64

        rustc --edition=2021 rust/tools/wifi_snapshot_allocation_probe.rs --extern "openpilot_wifi=$GITHUB_WORKSPACE/rust/target/debug/libopenpilot_wifi.rlib"
        -L "dependency=$GITHUB_WORKSPACE/rust/target/debug/deps" -o "$RUNNER_TEMP/wifi-snapshot-allocation-probe"

        mkdir -p "$RUNNER_TEMP/ui-connectivity"

        "$RUNNER_TEMP/wifi-snapshot-allocation-probe" --require-improvement | tee "$RUNNER_TEMP/ui-connectivity/wifi-snapshot-allocation.tsv"

        '
    - name: Compare native BlueZ policy controller with unchanged original
      run: "set -euo pipefail\nexport OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/ui-connectivity/bluetooth-bluez-policy\"\
        \ncandidate=\"$GITHUB_WORKSPACE/rust/target/debug/examples/bluez_policy\"\nexport BLUEZ_POLICY_ORIGINAL_OUTPUT=\"\
        $proof/original\"\nexport BLUEZ_POLICY_NATIVE_OUTPUT=\"$proof/native\"\nexport BLUEZ_POLICY_ORIGINAL_STDOUT=\"$proof/original.stdout\"\
        \nexport BLUEZ_POLICY_ORIGINAL_STDERR=\"$proof/original.stderr\"\nexport BLUEZ_POLICY_ORIGINAL_DIGITS=\"$proof/original-digits.stdout\"\
        \nexport BLUEZ_POLICY_ORIGINAL_DIGITS_STDERR=\"$proof/original-digits.stderr\"\nexport BLUEZ_POLICY_NATIVE_STDOUT=\"\
        $proof/native.stdout\"\nexport BLUEZ_POLICY_NATIVE_STDERR=\"$proof/native.stderr\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-bluez-policy-native --bin check-bluetooth-bluez-policy --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
