        python rust/tools/check_cweb_address.py --binary "$PWD/rust/target/debug/examples/cweb_address" --output "$RUNNER_TEMP/ui-connectivity/cweb/address"

        '
    - name: Compare Bluetooth input, continuous IPC and private BlueZ lifecycle
      run: python rust/tools/check_bluetooth_runtime.py --bin-dir "$PWD/rust/target/debug" --msgq-python "$RUNNER_TEMP/connectivity-msgq-python"
        --output "$RUNNER_TEMP/ui-connectivity/bluetooth"
    - name: Retain source/native images and connectivity evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-ui-connectivity-evidence
        path: '${{ runner.temp }}/ui-connectivity/

          ${{ runner.temp }}/ui-params-binding/provenance.json

          ${{ runner.temp }}/ui-raylib/SOURCE_SHA256

          ${{ runner.temp }}/ui-raylib/plugin-build.json

          ${{ runner.temp }}/image-sdk.*/install/openpilot-image-codecs-sdk.txt

          '
