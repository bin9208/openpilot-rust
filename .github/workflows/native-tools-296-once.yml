        python rust/tools/check_bluetooth_runtime.py --bin-dir "$PWD/rust/target/debug" --msgq-python "$RUNNER_TEMP/connectivity-msgq-python"
        --output "$RUNNER_TEMP/ui-connectivity/bluetooth"

        sha256sum -c "$RUNNER_TEMP/ui-connectivity/bluetooth-sudo-fixture/caller-artifacts.sha256"

        '
    - name: Retain source/native images and connectivity evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-ui-connectivity-evidence
        path: '${{ runner.temp }}/ui-connectivity/

          ${{ runner.temp }}/ui-params-binding/provenance.json

          ${{ runner.temp }}/ui-raylib/SOURCE_SHA256

          ${{ runner.temp }}/ui-raylib/plugin-build.json

          ${{ runner.temp }}/image-sdk.*/install/openpilot-image-codecs-sdk.txt

          '
  source-policy:
    name: Affected source and disk contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: f60e4ac0a655592aaef659f35cc354b86ffa09a0
    - run: 'test "$(git rev-parse HEAD)" = f60e4ac0a655592aaef659f35cc354b86ffa09a0

        test -z "$(git status --porcelain)"'
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test ci_rust_isolation --test
        ci_disk_bootstrap --test lagd_ci -- --nocapture'
  prefix93-baseline:
    name: Cold prefix93 actual fence RED baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 7626b358b58146eab2ba4f05eca309c29cb78fb1
    - run: 'test "$(git rev-parse HEAD)" = 7626b358b58146eab2ba4f05eca309c29cb78fb1

        test -z "$(git status --porcelain)"'
    - run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update && sudo apt-get install -y g++ libllvm18 git-lfs

        rustup toolchain install 1.94.0 --profile minimal'
    - run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude='''' '
    - name: Require actual missing closure baseline rejection
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/prefix93-baseline"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        sha256sum rust/crates/model-runtime/tests/compiler_conditional_cpu.rs > "$proof/test.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-model-runtime --locked --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --test compiler_conditional_cpu --no-run

        set +e

        LLVM_PATH=/usr/lib/x86_64-linux-gnu/libLLVM-18.so cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-model-runtime
        --locked --config profile.test.package.sha2.opt-level=3 --config profile.dev.package.sha2.opt-level=3 --test compiler_conditional_cpu
        actual_fused_prefix_matches_independent_original_final_output -- --exact --nocapture 2>&1 | tee "$proof/baseline.log"

        status=${PIPESTATUS[0]}

        set -e

        test "$status" -eq 101

        grep -Fq ''running 1 test'' "$proof/baseline.log"

        grep -Fq ''test result: FAILED'' "$proof/baseline.log"

        grep -Fq ''CPU observable Conv/Gelu/ReduceMean fusion is not implemented'' "$proof/baseline.log"

        sha256sum --check "$proof/test.sha256"

        '
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: prefix93-cold-baseline
        path: ${{ runner.temp }}/prefix93-baseline/
