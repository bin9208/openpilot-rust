        \n  test -x \"$UI_APPLICATION_RAW_HELPER\"\n  test -f \"$STARTUP_UI_RAYLIB_LIBRARY\"\n  \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\n  cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features image-array-native --test ui_forms_check --test ui_forms_reference --test ui_forms_admission --test ui_forms_family_text\
        \ --test ui_forms_snapshot_order --test ui_render_check --test ui_render_reference --test ui_network_check --test\
        \ ui_network_reference --test ui_framework_check --locked\n  \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 512\n  cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features\
        \ ui-application-lifecycle-native --test ui_application_lifecycle_loop --test ui_application_lifecycle_recording --test\
        \ ui_application_lifecycle_reference --test ui_application_lifecycle_raw --test ui_application_lifecycle_check --test\
        \ ui_application_lifecycle_native --locked\n  \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\n  cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features ui-application-lifecycle-native\
        \ --lib --test ui_application_lifecycle_loop --test ui_application_lifecycle_recording --test ui_application_lifecycle_reference\
        \ --test ui_application_lifecycle_raw --test ui_application_lifecycle_check --test ui_application_lifecycle_native\
        \ --bin check-ui-application --bin ui-application-reference --bin build-ui-application-reference --locked -- -D warnings\n\
        \  rust/target/debug/check-ui-framework --python python --target \"$PWD/rust/target/debug\" --output \"$RUNNER_TEMP/ui-connectivity/framework\"\
        \ --display \"$DISPLAY\"\n  python rust/tools/check_startup_ui.py --target \"$PWD/rust/target/debug\" --output \"\
        $RUNNER_TEMP/ui-connectivity/startup\" --display \"$DISPLAY\" --raylib-root \"$STARTUP_UI_RAYLIB_ROOT\" --raylib-library\
        \ \"$STARTUP_UI_RAYLIB_LIBRARY\"\n'\nrust/target/debug/check-ui-emoji --binary \"$PWD/rust/target/debug/examples/emoji_raster\"\
        \ --output \"$RUNNER_TEMP/ui-connectivity/emoji\"\nrust/target/debug/check-ui-translations --binary \"$PWD/rust/target/debug/examples/translation_trace\"\
        \ --output \"$RUNNER_TEMP/ui-connectivity/translations\"\n"
    - name: Diagnose failed Confirm against immutable original on one display
      if: failure()
      env:
        UI_FORMS_FAILURE_OUTPUT: ${{ runner.temp }}/ui-connectivity/forms-failures
      run: "#!/usr/bin/env bash\n# TEMPORARY, failure-only CI investigation. Never a maintained source fallback.\nset -euo\
        \ pipefail\nroot=\"${GITHUB_WORKSPACE:-$PWD}\"\nevidence=\"${UI_FORMS_FAILURE_OUTPUT:?}/irrelevant-input-prop\"\n\
        [ -f \"$evidence/scene.json\" ] || exit 0\noutput=\"${RUNNER_TEMP:?}/ui-connectivity/confirm-original-diagnostic\"\
        \nmkdir -p \"$output\"\nrevision=3669ec8c6f391275316db31bfd715ab23f0da5da\n# Exact parent of f0197806; fetch only\
        \ immutable commit if checkout is shallow.\nif ! git -C \"$root\" cat-file -e \"$revision:rust/tools/ui_forms_source.py\"\
        ; then\n  git -C \"$root\" fetch --no-tags --depth=1 origin \"$revision\"\nfi\ngit -C \"$root\" show \"$revision:rust/tools/ui_forms_source.py\"\
        \ > \"$output/original.py\"\nprintf '%s  %s\\n' 2220f3192136ead8d283cf8276ca2120a85198978bbca79c0f1286b8690dc365 \"\
        $output/original.py\" | sha256sum -c -\ncp \"$evidence/scene.json\" \"$output/scene.json\"\nprintf '%s\\n' \"$revision\"\
        \ > \"$output/original-commit.txt\"\nlscpu > \"$output/lscpu.txt\"\nexport OPENPILOT_RUST_ROOT=\"$root\" PYTHONPATH=\"\
        $root${PYTHONPATH:+:$PYTHONPATH}\" GALLIUM_DUMP_CPU=1\n# One Xvfb server and inherited renderer environment for BOTH\
        \ independent lanes.\n# Capture failures as data; still run the other lane and retain exact files.\ncat > \"$output/run-lanes.sh\"\
        \ <<'LANES'\nset -u\noutput=\"$1\"; reference=\"$2\"; interpreter=\"$3\"\nprintf \"%s\\n\" \"$DISPLAY\" > \"$output/display.txt\"\
        \n\"$interpreter\" \"$output/original.py\" \"$output/scene.json\" \"$output/original.png\" > \"$output/original.stdout.log\"\
        \ 2> \"$output/original.stderr.log\"\nprintf \"%s\\n\" \"$?\" > \"$output/original.exit\"\n\"$reference\" \"$output/scene.json\"\
        \ \"$output/native.png\" > \"$output/native.stdout.log\" 2> \"$output/native.stderr.log\"\nprintf \"%s\\n\" \"$?\"\
        \ > \"$output/native.exit\"\nLANES\nreference=\"${UI_CONFIRM_REFERENCE:-$root/rust/target/debug/ui-forms-reference}\"\
        \ninterpreter=\"${UI_CONFIRM_PYTHON:-python}\"\nif [ -n \"${UI_CONFIRM_DIAGNOSTIC_DISPLAY:-}\" ]; then\n  DISPLAY=\"\
        $UI_CONFIRM_DIAGNOSTIC_DISPLAY\" bash \"$output/run-lanes.sh\" \"$output\" \"$reference\" \"$interpreter\"\nelse\n\
        \  xvfb-run -a -s '-screen 0 2160x1080x24 -nolisten tcp' bash \"$output/run-lanes.sh\" \"$output\" \"$reference\"\
        \ \"$interpreter\"\nfi\n\"$interpreter\" - \"$output\" <<'PY'\nimport hashlib,json,os,sys\nfrom pathlib import Path\n\
        import numpy as np\nfrom PIL import Image\np=Path(sys.argv[1]); result={\"environment\":{key:os.environ.get(key)for\
        \ key in [\"LIBGL_ALWAYS_SOFTWARE\",\"GALLIUM_DRIVER\",\"GALLIUM_OVERRIDE_CPU_CAPS\",\"LP_NATIVE_VECTOR_WIDTH\",\"\
        LP_NUM_THREADS\",\"GALLIUM_DUMP_CPU\",\"LANG\",\"LC_ALL\",\"LC_NUMERIC\"]},\"lanes\":{}}\narrays={}\nfor lane in (\"\
        original\",\"native\"):\n image=p/(lane+\".png\");state=p/(lane+\".json\");row={\"exit\":int((p/(lane+\".exit\")).read_text()),\"\
        png\":image.exists(),\"state\":state.exists()}\n if image.exists():\n  im=Image.open(image);a=np.asarray(im).astype(\"\
        <i8\");arrays[lane]=a;row.update(png_sha256=hashlib.sha256(image.read_bytes()).hexdigest(),mode=im.mode,shape=list(a.shape),i64_sha256=hashlib.sha256(a.tobytes()).hexdigest())\n\
        \ if state.exists():row[\"state_sha256\"]=hashlib.sha256(state.read_bytes()).hexdigest()\n result[\"lanes\"][lane]=row\n\
        if len(arrays)==2:\n a,b=arrays[\"original\"],arrays[\"native\"]; result[\"same_shape\"]=a.shape==b.shape\n if a.shape==b.shape:result.update(different_pixels=int(np.any(a!=b,axis=-1).sum()),max_channel_difference=int(np.abs(a-b).max()))\n\
        \ if all((p/(lane+\".json\")).exists()for lane in (\"original\",\"native\")):result[\"state_equal\"]=json.loads((p/\"\
        original.json\").read_text())==json.loads((p/\"native.json\").read_text())\n(p/\"comparison.json\").write_text(json.dumps(result,indent=2)+\"\
        \\n\");print(json.dumps(result,indent=2))\nPY\n"
    - name: Compare Wi-Fi policy and original/native private NetworkManager protocol
      run: 'python rust/tools/check_wifi_policy.py --binary "$PWD/rust/target/debug/examples/wifi_trace" --output "$RUNNER_TEMP/ui-connectivity/wifi-policy.json"

        python rust/tools/check_wifi_runtime.py --binary "$PWD/rust/target/debug/examples/wifi_native" --launcher "$PWD/rust/target/debug/openpilot-process-child"
        --binding "$RUNNER_TEMP/ui-params-binding"/params_pyx*.so --output "$RUNNER_TEMP/ui-connectivity/wifi"

        python rust/tools/check_wifi_callback_ordering.py --binary "$PWD/rust/target/debug/examples/wifi_native" --launcher
        "$PWD/rust/target/debug/openpilot-process-child" --binding "$RUNNER_TEMP/ui-params-binding"/params_pyx*.so --output
        "$RUNNER_TEMP/ui-connectivity/wifi-callback-ordering"

        '
