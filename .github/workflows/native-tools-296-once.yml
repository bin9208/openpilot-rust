# One-off affected-area validation; not a replacement for PR exact-SHA CI.
name: Native tools 296 candidate checks
on:
  push:
    branches: [codex/feat-296-native-tools-candidate]
    paths: [.github/workflows/native-tools-296-once.yml]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
jobs:
  startup-services:
    name: rust startup services
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 0d1700e5a3ad0181ecfdd7f7f25e4fc9d088e1d2
    - name: Require exact candidate source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 0d1700e5a3ad0181ecfdd7f7f25e4fc9d088e1d2

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev openssl iproute2 strace
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1 pytest==9.0.2
    - name: Configure original startup service IPC imports
      run: printf 'PYTHONPATH=%s/services-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - run: python -m pip install pycryptodome==3.23.0
    - run: python -m pip install comma-deps-raylib==6.0.0.1.post103 Pillow==12.3.0 python-xlib==0.33 setproctitle==1.3.7 psutil==7.2.2
    - name: Stage pinned native startup renderer
      run: 'sudo apt-get install -y libgl-dev libx11-dev libxrandr2 libxinerama1 libxcursor1 libxi6 xvfb xauth

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 run --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" -p openpilot-dev-tools --locked --bin stage-startup-ui-raylib
        -- --arch x86_64 --output "$RUNNER_TEMP/startup-raylib-host" --shared

        printf ''STARTUP_UI_RAYLIB_ROOT=%s/startup-raylib-host\nSTARTUP_UI_RAYLIB_LIBRARY=%s/startup-raylib-host/lib/libopenpilot-raylib.so\n''
        "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build native startup service boundaries
      run: cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools -p openpilot-lpa -p openpilot-bridge -p openpilot-agnos
        -p openpilot-updated -p openpilot-startup-ui -p openpilot-process-supervision --bins --examples --locked
    - name: Verify updater command and checker process ownership
      env:
        UPDATED_OWNER_LAUNCHER: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
      run: 'rustup component add clippy --toolchain 1.94.0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-updated --features command-owner-tests --test command_owner
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --lib updated_process_check::ownership_tests --locked
        -- --test-threads=1

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-updated --features command-owner-tests --lib --test command_owner
        --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --lib --test updated_process_check --bin check-updated-process
        --bin updated-process-fixture --locked -- -D warnings

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build original IPC binding and messaging bridge
      run: 'python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/services-msgq-python"

        rust/target/debug/build-bridge-source --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/services-bridge-source"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/services-params-binding"

        '
    - name: Compare LPA serial, TLS, profile and notification lifecycle
      run: python rust/tools/check_lpa.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/startup-services/lpa"
    - name: Require native bridge controller against sealed original observations
      run: '# The namespace controller runs as root; keep its private 0600 reports

        # readable by the runner for the paired check and failure artifacts.

        set -euo pipefail

        test ! -e rust/tools/check_bridge.py

        test ! -L rust/tools/check_bridge.py

        trap ''for path in "$RUNNER_TEMP/startup-services/bridge-native-controller" "$RUNNER_TEMP/startup-services/bridge-absence-proof";
        do if [ -d "$path" ]; then sudo chown -R "$(id -u):$(id -g)" "$path"; fi; done'' EXIT

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bridge-tools-native --bin check-bridge
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bridge-tools-native --test bridge_check
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bridge-tools-native --lib bridge_check::
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bridge-tools-native --lib --bin check-bridge
        --test bridge_check --test bridge_controller_reference --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        proof="$RUNNER_TEMP/startup-services/bridge-absence-proof"

        checker="$GITHUB_WORKSPACE/rust/target/debug/check-bridge"

        original="$RUNNER_TEMP/services-bridge-source/bridge-original"

        native="$GITHUB_WORKSPACE/rust/target/debug/bridge"

        mkdir -p "$proof/native-root/rust/tools" "$proof/native-path"

        ln -s "$(command -v unshare)" "$proof/native-path/unshare"

        ln -s "$(command -v ip)" "$proof/native-path/ip"

        printf ''%s\n'' "$checker" > "$proof/checker.path"

        printf ''%s\n'' "$original" > "$proof/original.path"

        printf ''%s\n'' "$native" > "$proof/native.path"

        printf ''%s\n'' "$proof/native-path/unshare" > "$proof/unshare.path"

        printf ''%s\n'' "$proof/native-path/ip" > "$proof/ip.path"

        sha256sum "$checker" "$original" "$native" "$proof/native-path/unshare" "$proof/native-path/ip" > "$proof/artifacts.sha256"

        sudo -E "$PWD/rust/target/debug/check-bridge" --original "$RUNNER_TEMP/services-bridge-source/bridge-original" --binary
        "$PWD/rust/target/debug/bridge" --output "$RUNNER_TEMP/startup-services/bridge-native-controller"

        sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/startup-services/bridge-native-controller"

        export BRIDGE_NATIVE_CONTROLLER_REPORT="$RUNNER_TEMP/startup-services/bridge-native-controller/result.json"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        sudo -E env "OPENPILOT_RUST_ROOT=$proof/native-root" "PATH=$proof/native-path" /usr/bin/timeout --signal=TERM --kill-after=5s
        300s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o "$proof/native.exec" "$checker" --original "$original"
        --binary "$native" --output "$proof/absent" > "$proof/native.stdout" 2> "$proof/native.stderr"

        sudo chown -R "$(id -u):$(id -g)" "$proof"

        diff "$RUNNER_TEMP/startup-services/bridge-native-controller/result.json" "$proof/absent/result.json"

        sha256sum -c "$proof/artifacts.sha256"

        export BRIDGE_ABSENCE_PROOF="$proof"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bridge-tools-native --test bridge_controller_reference
        --locked

        '
    - name: Compare AGNOS images, retry policy, casync and actual CLI
      run: python rust/tools/check_agnos.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/startup-services/agnos"
    - name: Compare updater Git lifecycle, native signals and background AGNOS adapter
      run: 'PYTHONPATH="$PWD/rust/tools:$PYTHONPATH" python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=rust/tools/tests
        rust/tools/tests/test_updated_comparison.py -q

        python rust/tools/check_updated.py --binary "$PWD/rust/target/debug/examples/updated_trace" --launcher "$PWD/rust/target/debug/openpilot-process-child"
        --binding "$RUNNER_TEMP"/services-params-binding/params_pyx*.so --output "$RUNNER_TEMP/startup-services/updated-source"

        "$PWD/rust/target/debug/check-updated-process" --binary "$PWD/rust/target/debug/examples/updated_command" --launcher
        "$PWD/rust/target/debug/openpilot-process-child" --fixture "$PWD/rust/target/debug/updated-process-fixture" --baseline
        "$PWD/rust/crates/dev-tools/tests/fixtures/updated-process/original.json" --output "$RUNNER_TEMP/startup-services/updated-process"

        python rust/tools/check_updated_daemon.py --binary "$PWD/rust/target/debug/openpilot-updated" --launcher "$PWD/rust/target/debug/openpilot-process-child"
        --output "$RUNNER_TEMP/startup-services/updated-daemon"

        python rust/tools/check_updated_agnos.py --target "$PWD/rust/target" --output "$RUNNER_TEMP/startup-services/updated-agnos"

        '
    - name: Compare actual startup UI rendering, input and child lifecycle
      run: xvfb-run -a -s '-screen 0 2400x1400x24 -nolisten tcp' python rust/tools/check_startup_ui.py --target "$PWD/rust/target/debug"
        --output "$RUNNER_TEMP/startup-services/ui"
    - name: Retain startup service comparison evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-startup-services-evidence
        path: ${{ runner.temp }}/startup-services/
  sensor-audio:
    name: rust sensor and audio runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 0d1700e5a3ad0181ecfdd7f7f25e4fc9d088e1d2
    - name: Require exact candidate source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 0d1700e5a3ad0181ecfdd7f7f25e4fc9d088e1d2

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev
        libavutil-dev libzstd-dev libzmq5
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
    - name: Configure original sensor and audio IPC imports
      run: printf 'PYTHONPATH=%s/sensor-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Build native sensor and audio daemons
      run: cargo build --manifest-path rust/Cargo.toml -p openpilot-sensord -p openpilot-micd -p openpilot-soundd -p openpilot-feedbackd
        -p openpilot-process-supervision --bins --examples --locked
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build original IPC and Params bindings
      run: 'python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/sensor-msgq-python"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/sensor-params-binding"

        '
    - name: Compare IMU source policy, Linux ABI and continuous native IPC
      run: 'python rust/tools/check_sensord.py --trace "$PWD/rust/target/debug/examples/sensord_trace" --evidence "$RUNNER_TEMP/sensor-audio/sensord-source"

        python rust/tools/check_sensord_kernel.py --binary "$PWD/rust/target/debug/examples/sensord_linux" --evidence "$RUNNER_TEMP/sensor-audio/sensord-kernel"

        python rust/tools/check_sensord_daemon.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/sensor-audio/sensord-daemon"

        '
    - name: Compare microphone samples, pressure and continuous native capture
      run: 'python rust/tools/check_micd_analysis.py --binary "$PWD/rust/target/debug/examples/micd_trace" --output "$RUNNER_TEMP/sensor-audio/micd-source"

        python rust/tools/check_micd_daemon.py --binary "$PWD/rust/target/debug/openpilot-micd" --output "$RUNNER_TEMP/sensor-audio/micd-daemon"

        '
    - name: Build and validate native sound policy and fixture tools
      run: 'rustup component add clippy --toolchain 1.94.0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --bin check-soundd-policy
        --bin create-soundd-fixture-assets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --test soundd_policy_reference
        --test soundd_policy_check --test soundd_fixture_assets --test soundd_policy_retirement --test soundd_policy_ci --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --lib --test soundd_policy_reference
        --test soundd_policy_check --test soundd_fixture_assets --test soundd_policy_retirement --test soundd_policy_ci --bin
        check-soundd-policy --bin create-soundd-fixture-assets --locked -- -D warnings

        '
    - name: Build and validate native sound daemon controller
      run: 'export SOUNDD_DAEMON_BINARY="$PWD/rust/target/debug/openpilot-soundd"

        export SOUNDD_DAEMON_WORKER_BINARY="$PWD/rust/target/debug/check-soundd-daemon"

        export SOUNDD_FIXTURE_ASSETS_BINARY="$PWD/rust/target/debug/create-soundd-fixture-assets"

        export SOUNDD_PORTAUDIO_LIBRARY="$RUNNER_TEMP/owned-soundd-portaudio.so"

        export SOUNDD_DAEMON_TEST_OUTPUT="$RUNNER_TEMP/sensor-audio/soundd-native-tests"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --bin check-soundd-daemon
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 64

        cc -std=c11 -shared -fPIC -pthread -Wall -Wextra -Werror rust/tools/fixtures/soundd/portaudio.c -o "$SOUNDD_PORTAUDIO_LIBRARY"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --test soundd_daemon_check
        --test soundd_daemon_runtime --locked -- --test-threads=1

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --lib soundd_daemon_check::worker::tests
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --lib --bin check-soundd-daemon
        --test soundd_daemon_check --test soundd_daemon_runtime --locked -- -D warnings

        '
    - name: Compare alert samples and continuous native playback
      run: '"$PWD/rust/target/debug/check-soundd-policy" --binary "$PWD/rust/target/debug/examples/sound_trace" --binding
        "$RUNNER_TEMP"/sensor-params-binding/params_pyx*.so --output "$RUNNER_TEMP/sensor-audio/soundd-source"

        python rust/tools/check_soundd_daemon.py --binary "$PWD/rust/target/debug/openpilot-soundd" --output "$RUNNER_TEMP/sensor-audio/soundd-daemon"
        --fixture-assets-binary "$PWD/rust/target/debug/create-soundd-fixture-assets" --portaudio-library "$RUNNER_TEMP/owned-soundd-portaudio.so"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        "$PWD/rust/target/debug/check-soundd-daemon" --binary "$PWD/rust/target/debug/openpilot-soundd" --output "$RUNNER_TEMP/sensor-audio/soundd-native-controller"
        --fixture-assets-binary "$PWD/rust/target/debug/create-soundd-fixture-assets" --portaudio-library "$RUNNER_TEMP/owned-soundd-portaudio.so"

        '
    - name: Check PortAudio callback ownership with Miri
      env:
        MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1
      run: cargo +nightly-2026-09-29 miri test --manifest-path rust/Cargo.toml -p openpilot-portaudio --no-default-features
        --lib --locked
    - name: Build and validate native feedback checker
      run: 'rustup component add clippy --toolchain 1.94.0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features feedback-runtime-native --bin
        check-feedbackd --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        FEEDBACKD_NATIVE_BINARY="$PWD/rust/target/debug/openpilot-feedbackd" cargo +1.94.0 test --manifest-path rust/Cargo.toml
        -p openpilot-dev-tools --features feedback-runtime-native --bin check-feedbackd --test feedbackd_check --test feedbackd_runtime_check
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features feedback-runtime-native --bin
        check-feedbackd --test feedbackd_check --test feedbackd_runtime_check --locked -- -D warnings

        '
    - name: Compare original policy and native bookmark IPC
      run: rust/target/debug/check-feedbackd --binary "$PWD/rust/target/debug/openpilot-feedbackd" --output "$RUNNER_TEMP/sensor-audio/feedbackd"
    - name: Retain sensor and audio comparison evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-sensor-audio-evidence
        path: ${{ runner.temp }}/sensor-audio/
  estimation-runtime:
    name: rust estimation runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 0d1700e5a3ad0181ecfdd7f7f25e4fc9d088e1d2
    - name: Require exact candidate source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 0d1700e5a3ad0181ecfdd7f7f25e4fc9d088e1d2

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 cffi==2.1.1 sympy==1.14.0 pyzmq==27.2.0
        zstandard==0.25.0 requests==2.34.2 pyserial==3.5 pytest==9.0.2
    - name: Check atomic paramsd fixture input boundaries
      run: python -P -m pytest -c /dev/null --noconftest -p no:cacheprovider -q rust/tools/tests/test_paramsd_atomic_gate.py
    - name: Install source-pinned Eigen headers
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/estimation/eigen"

        python -m pip install ''git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen''
        2>&1 | tee "$RUNNER_TEMP/estimation/eigen/original-install.log"

        python -c ''import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE=" +
        eigen.INCLUDE_DIR)'' >> "$GITHUB_ENV"

        '
    - name: Compare native Eigen header staging with unchanged Python shim
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/estimation/eigen\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 256\nrustup component add clippy --toolchain 1.94.0\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --locked --features eigen-tools-native --bin stage-eigen-headers\nstager=\"$GITHUB_WORKSPACE/rust/target/debug/stage-eigen-headers\"\
        \nsha256sum \"$stager\" > \"$proof/stager.sha256\"\ngit rev-parse HEAD > \"$proof/source-commit.txt\"\nsha256sum rust/crates/dev-tools/src/eigen_stage.rs\
        \ rust/crates/dev-tools/src/bin/stage_eigen_headers.rs rust/crates/dev-tools/tests/eigen_stage.rs > \"$proof/source.sha256\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 64\nfor item in x86_64:linux_x86_64\
        \ aarch64:linux_aarch64 macos-arm64:macosx_11_0_arm64; do\n  architecture=${item%%:*}\n  platform=${item#*:}\n  wheel=\"\
        $proof/eigen-3.4.0-py3-none-$platform.whl\"\n  curl --fail --location --retry 3 --output \"$wheel\" \"https://github.com/commaai/dependencies/releases/download/eigen/v3.4.0/eigen-3.4.0-py3-none-$platform.whl\"\
        \n  \"$stager\" --wheel \"$wheel\" --output \"$proof/$architecture-native\" --architecture \"$architecture\" > \"\
