{
  "name": "#296 exact R13-admitted R3 two-cache deletion once",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/peer-cache-delete-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "cache_delete": {
      "if": "${{ github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/codex/feat-296-local-validation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 30,
      "concurrency": {
        "group": "peer-cache-delete-296-${{ github.repository }}-${{ github.ref }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "LC_ALL": "C.UTF-8",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "name": "Require trusted fixed bin-actions context",
          "run": "set -euo pipefail\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONHOME:-} && -z ${PYTHONPATH:-} ]]\n"
        },
        {
          "name": "Common fresh audit output only; no cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "false"
          }
        },
        {
          "name": "Bind separate audit and admit bounded operation growth",
          "run": "set -euo pipefail\numask 077\njob=$CI_JOB_TEMP\n[[ $job == /tmp/openpilot-ci.?????? && ! -L $job && -d $job ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\n[[ $(id -u) == 1000 && $(stat -c %u \"$job\") == 1000 ]]\n[[ $job != /tmp/openpilot-ci.4o8uWv && $job != /tmp/openpilot-ci.1V9i3J ]]\nmkdir \"$job/peer-cache-delete\" \"$job/delete-tools\" \"$job/delete-home\"\nout=\"$job/peer-cache-delete\"\nprintf 'DELETE_OUT=%s\nDELETE_JOB_ID=%s\nHOME=%s/delete-home\n' \"$out\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$job\" >> \"$GITHUB_ENV\"\nprintf 'phase=exact-two-cache-deletion\nworkflow=%s\nrun=%s\nattempt=%s\njob=%s\nrunner=%s\nnew_audit_identity=%s\n' \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$RUNNER_NAME\" \"$(stat -c '%d:%i:%u' \"$job\")\" > \"$out/binding.txt\"\ndf -PB1 \"$job\" > \"$out/disk.before-audit.txt\"\n# Metadata/raw events64MiB + possible upload staging64MiB +8MiB scripts/seals.\n# This is operation growth only. No host free-space floor or bundle estimate change.\navailable=$(df -PB1 \"$job\" | awk 'NR==2{print $4}')\n[[ $available =~ ^[0-9]+$ ]]\ngrowth=$((136*1024*1024))\nprintf '{\"available_bytes\":%s,\"audit_growth_bytes\":%s,\"fixed_reserve_bytes\":0}\n' \"$available\" \"$growth\" > \"$out/growth.json\"\nif ((available < growth)); then printf 'Audit growth admission rejected: available=%s required=%s bytes\n' \"$available\" \"$growth\" >&2; exit 1; fi\n[[ -x /usr/bin/python3 && -x /usr/bin/timeout ]]\n"
        },
        {
          "name": "Materialize sealed own metadata admission.py",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/delete-tools/admission.py\"\\nPAYLOAD\nprintf '%s  %s\\n' '395a45d17af91572677c4ede4ac8a0aed7f8c0c411083f8520cf299e075e771b' \"$CI_JOB_TEMP/delete-tools/admission.py\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Materialize sealed own metadata delete_caches.py",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/delete-tools/delete_caches.py\"\\nPAYLOAD\nprintf '%s  %s\\n' '1369ba6c5c02a97bb369c38216eae86e4074f696f0599024fcfd532e04ee382b' \"$CI_JOB_TEMP/delete-tools/delete_caches.py\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Materialize sealed own metadata inputs.json",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/delete-tools/inputs.json\"\\nPAYLOAD\nprintf '%s  %s\\n' '26f3e5f37078ddc35bf8b00688579fd0d01ad6b85fb395fcc08a0435404367f4' \"$CI_JOB_TEMP/delete-tools/inputs.json\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Freshly admit all gates then delete only exact target and registry",
          "id": "cache_delete",
          "env": {
            "INVENTORY_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nprintf '%s  %s\\n' '395a45d17af91572677c4ede4ac8a0aed7f8c0c411083f8520cf299e075e771b' \"$CI_JOB_TEMP/delete-tools/admission.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '1369ba6c5c02a97bb369c38216eae86e4074f696f0599024fcfd532e04ee382b' \"$CI_JOB_TEMP/delete-tools/delete_caches.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '26f3e5f37078ddc35bf8b00688579fd0d01ad6b85fb395fcc08a0435404367f4' \"$CI_JOB_TEMP/delete-tools/inputs.json\" | sha256sum --check --strict -\n/usr/bin/timeout --signal=TERM --kill-after=10s 1200s /usr/bin/python3 -I -B \"$CI_JOB_TEMP/delete-tools/delete_caches.py\" delete > \"$DELETE_OUT/delete.stdout\" 2> \"$DELETE_OUT/delete.stderr\"\n"
        },
        {
          "name": "Always retain status actual capacity and cleanup member seals",
          "id": "seal",
          "if": "${{ always() && env.DELETE_OUT != '' }}",
          "env": {
            "DELETE_OUTCOME": "${{ steps.cache_delete.outcome }}"
          },
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ ! -L $job && -d $job && $(stat -c '%d:%i:%u' \"$job\") == \"$DELETE_JOB_ID\" ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nprintf 'cache_delete_step=%s\nonly_two_literal_cache_paths=true\nrollback_guaranteed=false\nno_automatic_bundle_retry=true\n' \"$DELETE_OUTCOME\" > \"$DELETE_OUT/RAW-STATUS.txt\"\ndf -PB1 \"$job\" > \"$DELETE_OUT/disk.after-audit.txt\"\nprintf '%s  %s\\n' '395a45d17af91572677c4ede4ac8a0aed7f8c0c411083f8520cf299e075e771b' \"$CI_JOB_TEMP/delete-tools/admission.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '1369ba6c5c02a97bb369c38216eae86e4074f696f0599024fcfd532e04ee382b' \"$CI_JOB_TEMP/delete-tools/delete_caches.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '26f3e5f37078ddc35bf8b00688579fd0d01ad6b85fb395fcc08a0435404367f4' \"$CI_JOB_TEMP/delete-tools/inputs.json\" | sha256sum --check --strict -\n/usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/python3 -I -B \"$CI_JOB_TEMP/delete-tools/delete_caches.py\" seal\n"
        },
        {
          "name": "Always upload raw admission cleanup and failure audit",
          "id": "evidence",
          "if": "${{ always() && env.DELETE_OUT != '' }}",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "peer-cache-delete-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.DELETE_OUT }}",
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "retention-days": 14,
            "overwrite": false,
            "compression-level": 6
          }
        }
      ]
    }
  }
}
