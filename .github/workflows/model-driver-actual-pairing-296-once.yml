name: 296 sealed actual driver pairing rational diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-actual-pairing-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-pairing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
      DIAGNOSTIC_ATTEMPT: 20261022-driver-actual-pairing-01
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
        persist-credentials: false
    - name: Bind exact held lane trees and replay source-order roundings without model/provider execution
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-actual-pairing"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        avail=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1)

        test "$avail" -ge 28991029248

        printf ''%s'' ''''
        | base64 --decode > "$proof/trace.py"

        printf ''1fab70b2a309e6dde9e7a8a8d826fc6f6a7f781bd971a5651da2d24fd547159f  %s/trace.py\n'' "$proof" | sha256sum --check
        --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12406095454/zip > "$proof/input.zip"

        printf ''837f89f4f48e9c4e0325efa79147ea81e6151066b44b2f6d974e37c981361353  %s/input.zip\n'' "$proof" | sha256sum --check
        --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12408700699/zip > "$proof/lanes.zip"

        printf ''e307bd4db2a6d2b364777ceb4315dee7ecf6bcfce997636bc6ef6b8125e7a114  %s/lanes.zip\n'' "$proof" | sha256sum --check
        --strict

        status=0

        TRACE_ARCHIVE="$proof/input.zip" TRACE_LANES="$proof/lanes.zip" TRACE_OUTPUT="$proof/output" timeout --signal=TERM
        --kill-after=5s 150s python3 "$proof/trace.py" > "$proof/stdout" 2> "$proof/stderr" || status=$?

        printf ''%s\n'' "$status" > "$proof/status"

        printf ''1fab70b2a309e6dde9e7a8a8d826fc6f6a7f781bd971a5651da2d24fd547159f  %s/trace.py\n'' "$proof" | sha256sum --check
        --strict

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-actual-pairing-${{ env.DIAGNOSTIC_ATTEMPT }}
        path: '${{ runner.temp }}/driver-actual-pairing/output/

          ${{ runner.temp }}/driver-actual-pairing/stdout

          ${{ runner.temp }}/driver-actual-pairing/stderr

          ${{ runner.temp }}/driver-actual-pairing/status

          ${{ runner.temp }}/driver-actual-pairing/trace.py'
        if-no-files-found: warn
        retention-days: 7
