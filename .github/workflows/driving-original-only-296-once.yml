name: 296 original only complete driving daemon data and state capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driving-original-only-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  driving-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: ec95aec6bd81a5f718fb2cac54a443d9a61e426c
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ec95aec6bd81a5f718fb2cac54a443d9a61e426c
        persist-credentials: false
    - name: Require exact immutable original source and reserve capture capacity
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        test -z "$(git status --porcelain)"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update && sudo apt-get install -y clang libllvm18 git-lfs capnproto libcapnp-dev'
    - run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2'
    - run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python"'
    - run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude='''''
    - name: Compile the original grouped driving and driver artifacts
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\nmkdir -p \"$RUNNER_TEMP/original-models\"\npython openpilot/selfdrive/modeld/compile_modeld.py --model-size\
        \ 512x256 --camera-resolutions 1928x1208 1344x760 --frame-skip 4 --onnx openpilot/selfdrive/modeld/models/driving_supercombo.onnx\
        \ --output \"$RUNNER_TEMP/original-models/driving_tinygrad.pkl\"\npython tinygrad_repo/examples/openpilot/compile3.py\
        \ \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\" \"$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl\"\
        \npython openpilot/selfdrive/modeld/get_model_metadata.py openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\n\
        cp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl \"$RUNNER_TEMP/original-models/\"\nfor resolution\
        \ in 1928x1208 1344x760; do\n  python openpilot/selfdrive/modeld/compile_dm_warp.py --camera-resolution \"$resolution\"\
        \ --warp-to 1440x960 --output \"$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl\"\ndone\n"
    - name: Capture original-only six driving scenarios before any candidate execution
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-original-capture"

        mkdir -p "$proof"

        printf ''%s'' ''''
        | base64 -d > "$proof/original_only.py"

        printf ''%s  %s\n'' ''bfe55536e9bf47cda093d9986247cf338f978c3c82b0cc6e1000731008697206'' "$proof/original_only.py"
        | sha256sum -c -

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 2048

        export PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH"

        printf ''%s\n'' "$EXPECTED_SOURCE" > "$proof/checked-out-source.sha"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/workflow-source.sha"

        set +e

        python "$proof/original_only.py" --repo "$GITHUB_WORKSPACE" --models "$RUNNER_TEMP/original-models" --output "$proof/observations"
        > "$proof/original.stdout" 2> "$proof/original.stderr"

        observed=$?

        set -e

        printf ''%s\n'' "$observed" > "$proof/original.exit"

        cat "$proof/original.stdout"

        cat "$proof/original.stderr"

        test "$observed" -eq 0

        sha256sum "$proof/observations/manifest.json" > "$proof/manifest.sha256"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driving-daemon-independent-original-only
        path: ${{ runner.temp }}/driving-original-capture/
        if-no-files-found: error
        compression-level: 1
