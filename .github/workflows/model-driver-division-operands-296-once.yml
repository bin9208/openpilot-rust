name: 296 unchanged driver division operands split-inferior diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-division-operands-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  single-call:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sample:
        - 0
        - 1
        - 2
        - 3
      max-parallel: 2
    env:
      EXPECTED_SOURCE: defb9011df3fca924dca41a703b48ce5ff0c51e0
      DIAGNOSTIC_ATTEMPT: 20261022-driver-division-operands-01-split
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: defb9011df3fca924dca41a703b48ce5ff0c51e0
        persist-credentials: false
    - name: Record CPU and cheaply admit only the known fully feature-compatible natural EPYC 9V45
      id: cpu
      shell: bash
      run: "set -euo pipefail\nmkdir \"$RUNNER_TEMP/driver-single-call-preflight\"\nlscpu --json > \"$RUNNER_TEMP/driver-single-call-preflight/lscpu.json\"\
        \ncat /proc/cpuinfo > \"$RUNNER_TEMP/driver-single-call-preflight/proc-cpuinfo.txt\"\nuname -a > \"$RUNNER_TEMP/driver-single-call-preflight/uname.txt\"\
        \ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/driver-single-call-preflight/SOURCE_COMMIT\"\
        \nstatus=SKIPPED_NOT_RECORDED_EPYC_9V45_HOST\nrun=false\nif awk 'BEGIN { found=0; bad=0 } /^model name[[:space:]]*:/\
        \ { sub(/^[^:]*:[[:space:]]*/, \"\"); found++; if ($0 != \"AMD EPYC 9V45 96-Core Processor\") bad=1 } END { exit !(found>0\
        \ && bad==0) }' /proc/cpuinfo && awk 'BEGIN { found=0; bad=0 } /^vendor_id[[:space:]]*:/ { sub(/^[^:]*:[[:space:]]*/,\
        \ \"\"); found++; if ($0 != \"AuthenticAMD\") bad=1 } END { exit !(found>0 && bad==0) }' /proc/cpuinfo; then\n run=true\n\
        \ status=ELIGIBLE_RECORDED_EPYC_9V45_HOST\nfi\nprintf 'run=%s\\n' \"$run\" >> \"$GITHUB_OUTPUT\"\nprintf '{\"status\"\
        :\"%s\",\"comparison_executed\":false,\"diagnostic_only\":true,\"retirement_acceptance\":false}\\n' \"$status\" >\
        \ \"$RUNNER_TEMP/driver-single-call-preflight/result.json\"\nprintf '%s\\n' \"$status\"\n"
    - uses: actions/setup-python@v6
      if: success() && steps.cpu.outputs.run == 'true'
      with:
        python-version: '3.12'
    - name: Install bounded compiler dependencies and download both sealed input artifacts
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 2048\n\
        mkdir \"$RUNNER_TEMP/driver-single-call-downloads\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends\
        \ clang jq gdb binutils\npython -m pip install numpy==2.5.3 zstandard==0.25.0\npython -m pip freeze > \"$RUNNER_TEMP/driver-single-call-preflight/providers.before.txt\"\
        \ncurl --fail --location --retry 3 --max-time 180 -o \"$RUNNER_TEMP/driver-single-call-downloads/llvm18.deb\" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb\n\
        printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/driver-single-call-downloads/llvm18.deb\\\
        n' \"$RUNNER_TEMP\" | sha256sum --check --strict\ndpkg-deb --extract \"$RUNNER_TEMP/driver-single-call-downloads/llvm18.deb\"\
        \ \"$RUNNER_TEMP/driver-single-call-downloads/llvm\"\nprintf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0\
        \  %s/driver-single-call-downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\n' \"$RUNNER_TEMP\" | sha256sum --check\
        \ --strict\nprintf 'LLVM_PATH=%s/driver-single-call-downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\n' \"$RUNNER_TEMP\"\
        \ >> \"$GITHUB_ENV\"\nfor id in 12395927967 12396145796; do\n gh api \"repos/bin9208/openpilot-rust/actions/artifacts/$id\"\
        \ --jq '{id,size_in_bytes,digest,workflow_run}' > \"$RUNNER_TEMP/driver-single-call-preflight/artifact-$id.json\"\n\
        \ gh api \"repos/bin9208/openpilot-rust/actions/artifacts/$id/zip\" > \"$RUNNER_TEMP/driver-single-call-downloads/$id.zip\"\
        \ndone\n"
    - name: Observe one unchanged division operand pair per owned inferior
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      run: "set -euo pipefail\nprintf '%s' ''\
        \ | base64 --decode > \"$PROBE_PREFLIGHT/watch.py\"\nprintf '5415746de0131ba5b8211bd9ffbf7e5be0b1142ce042011742e509dcd9952e1b\
        \  %s/watch.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nprintf '%s' ''\
        \ | base64 --decode > \"$PROBE_PREFLIGHT/watch.gdb.py\"\nprintf '26643a004d59962617e8cf083b3410fbc304c812abecc1b0d1581955065b83a4\
        \  %s/watch.gdb.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nprintf '%s' ''\
        \ | base64 --decode > \"$PROBE_PREFLIGHT/supervise.py\"\nprintf '6e97993cc812a5f49d50fa7971fd68733c21459b3eab57ff60289ea2385aa187\
        \  %s/supervise.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nprintf '%s' ''\
        \ | base64 --decode > \"$PROBE_PREFLIGHT/aggregate.py\"\nprintf 'db406e1c38d9e516a9a273b4edc8c859e10bb0f969ead8a1e3d9017dc6b219f2\
        \  %s/aggregate.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nmkdir \"$PROBE_OUTPUT\"\nstatus=0\nfor label\
        \ in debug-original debug-native; do\n  mkdir \"$PROBE_PREFLIGHT/$label\"\n  cp \"$PROBE_PREFLIGHT/watch.py\" \"$PROBE_PREFLIGHT/watch.gdb.py\"\
        \ \"$PROBE_PREFLIGHT/supervise.py\" \"$PROBE_PREFLIGHT/$label/\"\n  lane_status=0\n  PROBE_CAPTURE_LABEL=\"$label\"\
        \ PROBE_PREFLIGHT=\"$PROBE_PREFLIGHT/$label\" PROBE_OUTPUT=\"$PROBE_OUTPUT/$label\" python \"$PROBE_PREFLIGHT/$label/supervise.py\"\
        \ > \"$PROBE_PREFLIGHT/$label/supervise.stdout\" 2> \"$PROBE_PREFLIGHT/$label/supervise.stderr\" || lane_status=$?\n\
        \  printf \"%s\\n\" \"$lane_status\" > \"$PROBE_PREFLIGHT/$label/probe.status\"\n  if test \"$lane_status\" -ne 0;\
        \ then status=1; tail -n 70 \"$PROBE_PREFLIGHT/$label/gdb.stdout\" \"$PROBE_PREFLIGHT/$label/gdb.stderr\" \"$PROBE_PREFLIGHT/$label/supervise.stderr\"\
        ; fi\ndone\npython -m pip freeze > \"$PROBE_PREFLIGHT/providers.after.txt\"\ncmp \"$PROBE_PREFLIGHT/providers.before.txt\"\
        \ \"$PROBE_PREFLIGHT/providers.after.txt\"\nprintf '5415746de0131ba5b8211bd9ffbf7e5be0b1142ce042011742e509dcd9952e1b\
        \  %s/watch.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nprintf '26643a004d59962617e8cf083b3410fbc304c812abecc1b0d1581955065b83a4\
        \  %s/watch.gdb.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nprintf '6e97993cc812a5f49d50fa7971fd68733c21459b3eab57ff60289ea2385aa187\
        \  %s/supervise.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\nprintf 'db406e1c38d9e516a9a273b4edc8c859e10bb0f969ead8a1e3d9017dc6b219f2\
        \  %s/aggregate.py\\n' \"$PROBE_PREFLIGHT\" | sha256sum --check --strict\ntest \"$status\" -eq 0\npython \"$PROBE_PREFLIGHT/aggregate.py\"\
        \n"
      env:
        PROBE_OUTPUT: ${{ runner.temp }}/driver-single-call-output
        PROBE_DOWNLOADS: ${{ runner.temp }}/driver-single-call-downloads
        PROBE_PREFLIGHT: ${{ runner.temp }}/driver-single-call-preflight
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-division-operands-${{ env.DIAGNOSTIC_ATTEMPT }}-${{ matrix.sample }}
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
        path: '${{ runner.temp }}/driver-single-call-preflight/

          ${{ runner.temp }}/driver-single-call-output/'
