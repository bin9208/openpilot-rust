name: 296 single model call pre-half diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-single-call-prehalf-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  single-call:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sample:
        - 0
        - 1
        - 2
        - 3
    env:
      EXPECTED_SOURCE: d61079461c0e217056095fcd56d6831230317137
      DIAGNOSTIC_ATTEMPT: 20261022-single-call-prehalf-01
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: d61079461c0e217056095fcd56d6831230317137
        persist-credentials: false
    - name: Record CPU and skip known non-AVX512 hosts before dependencies
      id: cpu
      shell: bash
      run: "set -euo pipefail\nmkdir \"$RUNNER_TEMP/driver-single-call-preflight\"\nlscpu --json > \"$RUNNER_TEMP/driver-single-call-preflight/lscpu.json\"\
        \ncat /proc/cpuinfo > \"$RUNNER_TEMP/driver-single-call-preflight/proc-cpuinfo.txt\"\nuname -a > \"$RUNNER_TEMP/driver-single-call-preflight/uname.txt\"\
        \ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/driver-single-call-preflight/SOURCE_COMMIT\"\
        \nstatus=ELIGIBLE_AVX512_CANDIDATE\nrun=true\nif ! grep -Eq '(^|[[:space:]])avx512f([[:space:]]|$)' /proc/cpuinfo;\
        \ then\n run=false\n status=SKIPPED_NO_AVX512_CANDIDATE\n if grep -q 'AMD EPYC 7763 64-Core Processor' /proc/cpuinfo;\
        \ then status=SKIPPED_ALREADY_MATCHING_HOST; fi\nfi\nprintf 'run=%s\\n' \"$run\" >> \"$GITHUB_OUTPUT\"\nprintf '{\"\
        status\":\"%s\",\"comparison_executed\":false,\"diagnostic_only\":true,\"retirement_acceptance\":false}\\n' \"$status\"\
        \ > \"$RUNNER_TEMP/driver-single-call-preflight/result.json\"\nprintf '%s\\n' \"$status\"\n"
    - uses: actions/setup-python@v6
      if: success() && steps.cpu.outputs.run == 'true'
      with:
        python-version: '3.12'
    - name: Install bounded compiler dependencies and download both sealed input artifacts
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 2048\n\
        mkdir \"$RUNNER_TEMP/driver-single-call-downloads\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends\
        \ clang jq\npython -m pip install numpy==2.5.3 zstandard==0.25.0\npython -m pip freeze > \"$RUNNER_TEMP/driver-single-call-preflight/providers.before.txt\"\
        \ncurl --fail --location --retry 3 --max-time 180 -o \"$RUNNER_TEMP/driver-single-call-downloads/llvm18.deb\" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb\n\
        printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/driver-single-call-downloads/llvm18.deb\\\
        n' \"$RUNNER_TEMP\" | sha256sum --check --strict\ndpkg-deb --extract \"$RUNNER_TEMP/driver-single-call-downloads/llvm18.deb\"\
        \ \"$RUNNER_TEMP/driver-single-call-downloads/llvm\"\nprintf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0\
        \  %s/driver-single-call-downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\n' \"$RUNNER_TEMP\" | sha256sum --check\
        \ --strict\nprintf 'LLVM_PATH=%s/driver-single-call-downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\n' \"$RUNNER_TEMP\"\
        \ >> \"$GITHUB_ENV\"\nfor id in 12395927967 12396145796; do\n gh api \"repos/bin9208/openpilot-rust/actions/artifacts/$id\"\
        \ --jq '{id,size_in_bytes,digest,workflow_run}' > \"$RUNNER_TEMP/driver-single-call-preflight/artifact-$id.json\"\n\
        \ gh api \"repos/bin9208/openpilot-rust/actions/artifacts/$id/zip\" > \"$RUNNER_TEMP/driver-single-call-downloads/$id.zip\"\
        \ndone\n"
    - name: Replay one held call and validate instrumented pre-half observations
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$RUNNER_TEMP/driver-single-call-preflight/probe.py"

        printf ''96c65b342862054fc67a1fc46960e790944e2f9df6e17009933837dd3cebae97  %s/driver-single-call-preflight/probe.py\n''
        "$RUNNER_TEMP" | sha256sum --check --strict

        set +e

        timeout --signal=TERM --kill-after=5s 300s python "$RUNNER_TEMP/driver-single-call-preflight/probe.py" > "$RUNNER_TEMP/driver-single-call-preflight/probe.stdout"
        2> "$RUNNER_TEMP/driver-single-call-preflight/probe.stderr"

        rc=$?

        set -e

        printf ''%s\n'' "$rc" > "$RUNNER_TEMP/driver-single-call-preflight/probe.status"

        python -m pip freeze > "$RUNNER_TEMP/driver-single-call-preflight/providers.after.txt"

        cmp "$RUNNER_TEMP/driver-single-call-preflight/providers.before.txt" "$RUNNER_TEMP/driver-single-call-preflight/providers.after.txt"

        printf ''96c65b342862054fc67a1fc46960e790944e2f9df6e17009933837dd3cebae97  %s/driver-single-call-preflight/probe.py\n''
        "$RUNNER_TEMP" | sha256sum --check --strict

        test "$rc" -eq 0 || { tail -n 80 "$RUNNER_TEMP/driver-single-call-preflight/probe.stderr"; exit "$rc"; }

        '
      env:
        PROBE_OUTPUT: ${{ runner.temp }}/driver-single-call-output
        PROBE_DOWNLOADS: ${{ runner.temp }}/driver-single-call-downloads
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-single-call-prehalf-${{ env.DIAGNOSTIC_ATTEMPT }}-${{ matrix.sample }}
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
        path: '${{ runner.temp }}/driver-single-call-preflight/

          ${{ runner.temp }}/driver-single-call-output/'
