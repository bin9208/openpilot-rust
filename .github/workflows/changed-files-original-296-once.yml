name: 296 independent original changed-files admission
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-original-296-once.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SOURCE: 12af083b2e31bbb73cb8f73a9822e1c92d3ab8ea
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 12af083b2e31bbb73cb8f73a9822e1c92d3ab8ea
        fetch-depth: 1
        persist-credentials: false
    - name: Reserve capacity before stdlib-only original capture
      shell: bash
      run: 'set -euo pipefail

        export CHANGED_CAPTURE="$RUNNER_TEMP/changed-files-original-296"

        printf ''CHANGED_CAPTURE=%s\n'' "$CHANGED_CAPTURE" >> "$GITHUB_ENV"

        mkdir "$CHANGED_CAPTURE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$CHANGED_CAPTURE/source.txt"

        available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)

        test "$available" -ge 27111981056

        git status --porcelain=v1 > "$CHANGED_CAPTURE/source-status.before.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Capture actual CPython byte syntax and original Git selection
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''ORIGINAL'' > "$CHANGED_CAPTURE/capture_original.py"

        

        ORIGINAL

        base64 --decode <<''PINS'' > "$CHANGED_CAPTURE/source-pins.json"

        ewogICJ0b29scy9jaS9jaGVja19jaGFuZ2VkX2ZpbGVzLnB5IjogIjZiY2IxNGYzYTZkNWQ0ZTg4NWM2NTVlMjJmZWQyM2ExZWNmMjE5OWIwNDhjZDNkYTk1ZWY1OWIyNzk1ZmFkODciLAogICJ0b29scy9jaS90ZXN0cy90ZXN0X2NoYW5nZWRfZmlsZXMucHkiOiAiY2Q5YTIxMWQwNzZkNjkzOWI3NjQ5ODQ5MjEyZWEyMWM1MmU3ZTA4OTdmYTZkMjUxZTgyYjBiMjgwNWUwODI0MiIKfQo=

        PINS

        printf ''ebf2e4b23722aa6a1c4d533c5199fbffcd340f8740c1a140a1089e00128deb8d  %s/capture_original.py\n'' "$CHANGED_CAPTURE"
        | sha256sum --check --strict

        printf ''90cba56fb7dd8c9f158a4d9bbb88e9f2196301f3e7a1514820a42c40aa8544b6  %s/source-pins.json\n'' "$CHANGED_CAPTURE"
        | sha256sum --check --strict

        python -VV > "$CHANGED_CAPTURE/python-provider.txt"

        git --version > "$CHANGED_CAPTURE/git-provider.txt"

        python - <<''PY''

        import hashlib,json,os

        from pathlib import Path

        base=Path(os.environ[''CHANGED_CAPTURE'']);root=Path(os.environ[''GITHUB_WORKSPACE''])

        pins=json.loads((base/''source-pins.json'').read_bytes())

        assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==s for n,s in pins.items())

        PY

        timeout --signal=TERM --kill-after=5s 120s python "$CHANGED_CAPTURE/capture_original.py" --root "$GITHUB_WORKSPACE"
        --output "$CHANGED_CAPTURE/observations" > "$CHANGED_CAPTURE/capture.stdout" 2> "$CHANGED_CAPTURE/capture.stderr"

        python -m unittest discover -s tools/ci/tests -p test_changed_files.py -v > "$CHANGED_CAPTURE/initial-multicommit.stdout"
        2> "$CHANGED_CAPTURE/initial-multicommit.stderr"

        git status --porcelain=v1 > "$CHANGED_CAPTURE/source-status.after.txt"

        cmp "$CHANGED_CAPTURE/source-status.before.txt" "$CHANGED_CAPTURE/source-status.after.txt"

        '
    - name: Retain original changed-files observations
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-original-296
        path: ${{ runner.temp }}/changed-files-original-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
