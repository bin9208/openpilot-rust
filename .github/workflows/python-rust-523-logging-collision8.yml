name: Python Rust 523 logging current collision8 candidate
'on':
  push:
    branches: [codex/feat-523-python-rust]
    paths:
    - .github/workflows/python-rust-523-logging-collision8.yml
    - tools/ci/logging_collision8_549.sh
    - tools/ci/logging_collision8_batches_549.sh
    - rust/crates/dev-tools/src/native_logging_build.rs
    - rust/crates/dev-tools/src/json11_stage.rs
    - rust/crates/dev-tools/src/lib.rs
    - rust/crates/dev-tools/src/qa_process.rs
    - rust/crates/dev-tools/src/argparse_scan.rs
    - rust/crates/dev-tools/src/path_resolve.rs
    - rust/crates/dev-tools/src/python_fs.rs
    - rust/crates/dev-tools/src/seal.rs
    - rust/crates/dev-tools/src/native_logging_check.rs
    - rust/crates/dev-tools/src/native_logging_check/**
    - rust/crates/dev-tools/src/bin/check_native_logging.rs
    - rust/crates/dev-tools/src/bin/build_native_logging_reference.rs
    - rust/crates/dev-tools/tests/native_logging_lifecycle.rs
    - rust/crates/dev-tools/tests/native_logging_lifecycle/**
    - rust/crates/logging/**
    - rust/crates/disk-space/**
    - rust/crates/runtime-core/**
    - rust/crates/messaging/**
    - rust/crates/msgq/**
    - rust/crates/cereal/**
    - openpilot/cereal/**
    - opendbc_repo/opendbc/car/car.capnp
    - msgq_repo/msgq/**
    - rust/tools/native_logging_reference.cc
    - rust/tools/check_native_logging.py
    - rust/tools/native_logging_transport.py
    - openpilot/common/swaglog.cc
    - openpilot/common/swaglog.h
    - openpilot/common/timing.h
    - rust/Cargo.toml
    - rust/Cargo.lock
    - rust/crates/dev-tools/Cargo.toml
    - uv.lock
    - rust/tools/prepare-readonly-ci-rust
permissions:
  contents: read
concurrency:
  group: python-rust-523-logging-collision8-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  logging-collision8:
    name: Current collision8 with fresh build-only C++ reference
    if: ${{ github.repository == 'bin9208/openpilot-rust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
      COLLISION8_HELPER_SHA256: 09a8c5959625d54389d52efa7b58f02c20a1a82103f4e21b20aa88fbf57c9f7c
      COLLISION8_BATCHES_SHA256: 52d4ca212c28cad44579360b8531c915f6fe8e3060c0b480f0f7ec1cdb659a79
    steps:
    - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied for logging retained qualification' >&2; exit 1; }
        set -euo pipefail
        test "$EVENT_NAME" = push
        test "$SOURCE_REF" = refs/heads/codex/feat-523-python-rust
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Admit simultaneous scoped growth and allocate private source before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        umask 077
        workspace=$(realpath -e "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        test -d "$job" && test ! -L "$job"
        test "$(readlink -e "$job")" = "$job"
        test "$(stat -c %u "$job")" = "$(id -u)"
        chmod 700 "$job"
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        mkdir "$job/proof" "$job/home" "$job/cache"
        declare -A need=() roots=()
        # 같은 filesystem이면 source2+SDK3+package2+build8+proof1+reserve0.5 = 16.5GiB다.
        paths=("$workspace" "$job" /)
        growth_gib=(2 12 2)
        for n in "${!paths[@]}"; do
          device=$(stat -c %d "${paths[$n]}")
          need[$device]=$(( ${need[$device]:-0}+growth_gib[$n]*1024*1024*1024 ))
          roots[$device]=${paths[$n]}
        done
        for device in "${!need[@]}"; do
          available=$(df --output=avail -B1 -- "${roots[$device]}" | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {n++;v=$1} END {if(NR!=2 || n!=1) exit 1;print v}')
          required=$((need[$device]+512*1024*1024))
          printf '%s\t%s\t%s\t%s\n' "$device" "${roots[$device]}" "$available" "$required" >> "$job/proof/c8-initial-admission.tsv"
          ((available >= required))
        done
        source_owner=$(mktemp -d "$workspace/.collision549-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" \
          "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' "$source_owner")" "DIAG_SOURCE=$source" \
          "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/build/cargo-home" \
          "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$job/build/target" "XDG_CACHE_HOME=$job/cache" \
          "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nsource=%s\nsource_identity=%s\n' "$owner" "$job" "$source" "$(stat -c '%d:%i' "$source_owner")" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" / > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Seal exact source HEAD and tracked index before checks
      id: source_before
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        printf '%s  %s\n' "$COLLISION8_HELPER_SHA256" tools/ci/logging_collision8_549.sh | sha256sum --check --strict --quiet -
        /usr/bin/bash tools/ci/logging_collision8_549.sh admit
    - name: Prepare official pinned Rust in the owned private rustup root and seal it
      id: prepared_rust
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        /usr/bin/bash tools/ci/logging_collision8_549.sh admit
        CARGO_HOME="$CI_JOB_TEMP/cargo-home" "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before
        /usr/bin/bash tools/ci/logging_collision8_549.sh admit
    - name: Admit bounded native dependency preparation before provider baseline
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      timeout-minutes: 15
      run: |
        set -euo pipefail
        /usr/bin/bash tools/ci/logging_collision8_549.sh admit
        before=$(df --output=avail -B1 / | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {n++;v=$1} END {if(NR!=2 || n!=1) exit 1;print v}')
        # 다운로드는 public apt뿐이며 trace가 없다. 명시 env-i로 인증 상속도 제거한다.
        (ulimit -f 524288; /usr/bin/env -i HOME="$CI_JOB_TEMP/home" PATH=/usr/bin:/bin LC_ALL=C \
          /usr/bin/sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s \
          /usr/bin/apt-get -o APT::Architecture=amd64 update) > "$CI_JOB_TEMP/proof/apt-update.stdout" 2> "$CI_JOB_TEMP/proof/apt-update.stderr"
        (ulimit -f 524288; /usr/bin/env -i HOME="$CI_JOB_TEMP/home" PATH=/usr/bin:/bin LC_ALL=C \
          /usr/bin/sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s \
          /usr/bin/apt-get -o APT::Architecture=amd64 install -y --no-install-recommends \
          build-essential clang pkg-config capnproto libcapnp-dev libzmq3-dev strace curl jq binutils) \
          > "$CI_JOB_TEMP/proof/apt-install.stdout" 2> "$CI_JOB_TEMP/proof/apt-install.stderr"
        after=$(df --output=avail -B1 / | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {n++;v=$1} END {if(NR!=2 || n!=1) exit 1;print v}')
        printf '%s\t%s\n' "$before" "$after" > "$CI_JOB_TEMP/proof/package-growth.tsv"
        ((before-after <= 2*1024*1024*1024))
        (set -o noclobber; printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/c8-packages.done")
        dpkg-query -W build-essential clang pkg-config capnproto libcapnp-dev libzmq3-dev strace curl jq binutils > "$CI_JOB_TEMP/proof/native-packages.txt"
        /usr/bin/bash tools/ci/logging_collision8_549.sh admit
    - name: Build fresh reference only and observe current collision8
      id: qualify
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        # helper의 모든 traced phase는 별도 env-i를 사용한다. 원본/reference 실행은 없다.
        /usr/bin/timeout --signal=TERM --kill-after=180s 60m /usr/bin/bash tools/ci/logging_collision8_549.sh run
    - name: Verify whole prepared SDK after all attempted collision contracts
      id: prepared_rust_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.prepared_rust.outcome == 'success') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        CARGO_HOME="$CI_JOB_TEMP/cargo-home" "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" after
    - name: Seal source and index after all attempted collision contracts
      id: source_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        /usr/bin/bash tools/ci/logging_collision8_549.sh final-source
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" / > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
    - name: Publish only current narrow collision8 receipt after independent final seals
      id: closure
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
        SOURCE_OUTCOME: ${{ steps.source_final.outcome }}
        SDK_OUTCOME: ${{ steps.prepared_rust_final.outcome }}
      run: |
        set -euo pipefail
        test "$QUALIFY_OUTCOME" = success
        test "$SOURCE_OUTCOME" = success
        test "$SDK_OUTCOME" = success
        proof=$CI_JOB_TEMP/proof/c8
        jq -e --arg source "$GITHUB_SHA" '.schema==1 and .source_commit==$source and .collision8_current_pass==true and .immutable_seals==true and .command_exit==0 and .finalizer_exit==0 and .old27_admitted==false and .retirement_credit==0' "$proof/outcome.json"
        jq -e --arg source "$GITHUB_SHA" '.schema==1 and .source_commit==$source and .selector_count==1 and .logical_cases==8 and .checker_execs==8 and .checker_exit1==8 and .checker_spawn_attempts==0 and .original_cpp_executions==0 and .probe_executions==0 and .foreign_before_after_equal==true and .historical_pass_inherited==false and .old27_admitted==false and .runtime2_admitted==false and .caller_admitted==false and .source_absence_admitted==false and .closed_pid==false and .closed_cwd==false and .closed_fd==false and .closed_dso==false and .retirement_credit==0' "$proof/collision8.candidate.json"
        jq -e --arg source "$GITHUB_SHA" --arg worker "$COLLISION8_BATCHES_SHA256" '.schema==1 and .source_commit==$source and .worker_sha256==$worker and .all_batches_pass==true and .coverage_exact_once==true and .counts.root_count==1 and .counts.files>0 and .counts.files<=8192 and .counts.raw_bytes<=1073741824 and .counts.events<=1000000 and .counts.physical_lines<=2000000 and .closed_pid==false and .closed_cwd==false and .closed_fd==false and .closed_dso==false and .retirement_credit==0' "$proof/fixture-batches/complete.json"
        printf '%s  %s\n' "$(jq -er '.fixture_batches_sha256|select(test("^[a-f0-9]{64}$"))' "$proof/collision8.candidate.json")" "$proof/fixture-batches/complete.json" | sha256sum --check --strict --quiet -
        /usr/bin/bash "$DIAG_SOURCE/tools/ci/logging_collision8_549.sh" admit
        ln -- "$proof/collision8.candidate.json" "$proof/collision8.json"
        if ! /usr/bin/bash "$DIAG_SOURCE/tools/ci/logging_collision8_549.sh" admit; then
          rm -- "$proof/collision8.json"
          exit 1
        fi
    - name: Upload collision8 proof before owned cleanup even on failure
      id: fast_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v7
      with:
        name: logging-collision8-549-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Clean only uploaded unchanged owned collision source after all final seals
      id: fast_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && steps.closure.outcome == 'success' && steps.source_final.outcome == 'success' && steps.prepared_rust_final.outcome == 'success' && steps.qualify.outputs.immutable_seals == 'true') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ && $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        case "$p" in "$workspace/.collision549-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e "$p")" = "$p"
        test "$(stat -c %u "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e "$p/source")" = "$p/source"
        rm -rf --one-file-system -- "$p"
    - name: Clean common owned job temporary paths after evidence upload
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success') }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
