        paths={'base_prefix':'','executable':'bin/python3.12','library':'lib/libpython3.12.so.1.0','argparse':'lib/python3.12/argparse.py'}
        translated=dict(historical)
        mapping=[]
        for key,relative in paths.items():
            before=old/relative;after=new/relative
            assert historical[key]==str(before) and current[key]==str(after)
            assert after.resolve(strict=True)==after
            translated[key]=str(after)
            mapping.append({'field':key,'historical_path':str(before),'current_path':str(after)})
