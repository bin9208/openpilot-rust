name: Python Rust 523 focused acceptance
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  focused:
    name: Native conversion focused acceptance
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NO_PROXY: 127.0.0.1,localhost
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private Fast source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        # Source capacity is checked on the actual source filesystem BEFORE checkout.
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Preserve Actions' real workspace separately. Only Bash consumers see the
        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact focused source HEAD and tracked index
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - uses: actions/setup-python@v6
      id: oracle_python
      with:
        python-version: 3.12.15
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Isolate original Python package installation
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        "$pythonLocation/bin/python" -I -B -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
        library=$(readlink -e "$pythonLocation/lib")
        test "$library" = "$pythonLocation/lib"
        test -f "$library/libpython3.12.so.1.0"
        printf '%s\n' "OPENPILOT_ORACLE_PYTHON_LIBRARY_PATH=$library" >> "$GITHUB_ENV"
        sha256sum "$library/libpython3.12.so.1.0" "$library/python3.12/argparse.py" "$(readlink -e "$CI_JOB_TEMP/venv/bin/python")" > "$CI_JOB_TEMP/proof/oracle-runtime.sha256"
        /usr/bin/env -i HOME="$CI_JOB_TEMP/home" LD_LIBRARY_PATH="$library" "$CI_JOB_TEMP/venv/bin/python" -I -B -X "pycache_prefix=$CI_JOB_TEMP/unused-oracle-pycache" - <<'RUNTIME' > "$CI_JOB_TEMP/proof/oracle-runtime.json"
        import argparse, hashlib, json, os, pathlib, sys
        assert sys.version_info[:3] == (3,12,15), sys.version
        base = pathlib.Path(sys.base_prefix).resolve()
        provider = (base/'lib/libpython3.12.so.1.0').resolve(strict=True)
        assert pathlib.Path(argparse.__file__).resolve() == base/'lib/python3.12/argparse.py'
        info = provider.stat()
        mappings = [line.split(maxsplit=5) for line in pathlib.Path('/proc/self/maps').read_text().splitlines() if 'libpython' in line]
        device = f'{os.major(info.st_dev):02x}:{os.minor(info.st_dev):02x}'
        assert mappings and all(len(r)==6 and r[3]==device and int(r[4])==info.st_ino and pathlib.Path(r[5]).resolve()==provider for r in mappings)
        print(json.dumps({'version':sys.version,'executable':str(pathlib.Path(sys.executable).resolve()),'base_prefix':str(base),'library':str(provider),'library_sha256':hashlib.sha256(provider.read_bytes()).hexdigest(),'argparse':str(pathlib.Path(argparse.__file__).resolve()),'argparse_sha256':hashlib.sha256(pathlib.Path(argparse.__file__).read_bytes()).hexdigest(),'cleared_environment':True},indent=2))
        RUNTIME
    - name: Prepare focused toolchain and original-only Python dependencies
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        # This operation reuses the installed pinned toolchain instead of installing a duplicate.
        # Growth covers the private Cargo registry, focused targets and explicit host bootstrap targets and original-only captures.
        (( available >= 4 * 1024 * 1024 * 1024 ))
        printf '{"available_bytes":%s,"planned_focused_growth_bytes":4294967296}\n' "$available" > "$CI_JOB_TEMP/proof/build-growth.json"
        sudo -n apt-get -o APT::Architectures=amd64 update
        sudo -n apt-get -o APT::Architectures=amd64 install -y g++ pkg-config capnproto libcapnp-dev libzmq3-dev gh unzip jq strace
        export RUSTUP_HOME=/home/actions/.rustup
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        test -x "$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/rustc"
        rustup component list --installed > "$CI_JOB_TEMP/proof/rust-components.txt"
        grep -q '^rustfmt-' "$CI_JOB_TEMP/proof/rust-components.txt"
        grep -q '^clippy-' "$CI_JOB_TEMP/proof/rust-components.txt"
        sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" "$(rustup which clippy-driver)" > "$CI_JOB_TEMP/proof/rust-tools.sha256"

        "$CI_JOB_TEMP/venv/bin/python" -m pip install requests==2.34.2
        rustc -vV > "$CI_JOB_TEMP/proof/rustc.txt"
        cargo -V > "$CI_JOB_TEMP/proof/cargo.txt"
        command -v capnp
        command -v strace



        "$CI_JOB_TEMP/venv/bin/python" -m pip freeze > "$CI_JOB_TEMP/proof/python-provider-versions.txt"
        find "$CI_JOB_TEMP/venv" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256"
        find "$CI_JOB_TEMP/venv" -type l -printf '%p\t%l\n' | sort > "$CI_JOB_TEMP/proof/oracle-venv-links.before.txt"
      id: toolchain
    - name: Check complete workspace syntax and formatting
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        cargo fmt --manifest-path rust/Cargo.toml --all --check 2>&1 | tee "$CI_JOB_TEMP/proof/format.log"
    - name: Admit exact unchanged successful source cohorts
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        prior="$CI_JOB_TEMP/proof/prior-40084922332.zip"
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12557545634/zip > "$prior"
        printf '921c8b07db200945ee3c39279c63d4d4159a9ef391a1e3f0c64515d8b9dd2df0  %s\n' "$prior" | sha256sum --check -
        unzip -t "$prior" > "$CI_JOB_TEMP/proof/prior-crc.txt"
        test "$(unzip -p "$prior" SOURCE_COMMIT)" = 97f7ad36dfa0919b4e5c216fb16f44ed29161663
        for name in source-before.sha256 source-after.sha256 index-before.bin index-after.bin rust-tools.sha256; do
          unzip -p "$prior" "$name" > "$CI_JOB_TEMP/proof/prior-$name"
        done
        cmp "$CI_JOB_TEMP/proof/prior-source-before.sha256" "$CI_JOB_TEMP/proof/prior-source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/prior-index-before.bin" "$CI_JOB_TEMP/proof/prior-index-after.bin"
        sha256sum --check "$CI_JOB_TEMP/proof/prior-rust-tools.sha256"
        git fetch --no-tags --depth=1 origin 97f7ad36dfa0919b4e5c216fb16f44ed29161663
        git diff --no-renames --name-only -z 97f7ad36dfa0919b4e5c216fb16f44ed29161663 HEAD > "$CI_JOB_TEMP/proof/changed-paths.bin"
        while IFS= read -r -d '' changed; do
          case "$changed" in
            .github/workflows/carrot-route-vault-publish.yaml) ;;
            .github/workflows/fast-checks.yml) ;;
            .github/workflows/python-rust-523-bundle.yml) ;;
            .github/workflows/python-rust-523-capacity.yml) ;;
            .github/workflows/python-rust-523-model.yml) ;;
            .github/workflows/python-rust-523-reclaim.yml) ;;
            .github/workflows/python-rust-523-sanitizer.yml) ;;
            .github/workflows/python-rust-523.yml) ;;
            docs/naver/python-rust-523-auth-terminal.md) ;;
            docs/naver/python-rust-523-bundle-capture.md) ;;
            docs/naver/python-rust-523-bundle.md) ;;
            docs/naver/python-rust-523-model-482.md) ;;
            docs/naver/python-rust-523-route-sanitizer.md) ;;
            docs/naver/python-rust-523-ssh-unicode.md) ;;
            docs/naver/python-rust-523.md) ;;
            docs/user/en/rust-port.md) ;;
            docs/user/ko/rust-port.md) ;;
            openpilot/tools/lib/sanitizer.py) ;;
            rust/crates/dev-tools/Cargo.toml) ;;
            rust/crates/dev-tools/src/argparse_scan.rs) ;;
            rust/crates/dev-tools/src/ci_policy.rs) ;;
            rust/crates/dev-tools/src/developer_ssh.rs) ;;
            rust/crates/dev-tools/src/developer_ssh/cli.rs) ;;
            rust/crates/dev-tools/src/developer_ssh/login/cli.rs) ;;
            rust/crates/dev-tools/src/developer_ssh/login/cli/tests.rs) ;;
            rust/crates/dev-tools/src/developer_ssh/unicode_lower15.LICENSE-UNICODE-V3.txt) ;;
            rust/crates/dev-tools/src/developer_ssh/unicode_lower15.provenance.json) ;;
            rust/crates/dev-tools/src/developer_ssh/unicode_lower15.rs) ;;
            rust/crates/dev-tools/src/developer_ssh/unicode_lower15_original.rs) ;;
            rust/crates/dev-tools/src/route_sanitizer_tests.rs) ;;
            rust/crates/dev-tools/tests/argparse_scan.rs) ;;
            rust/crates/dev-tools/tests/ci_disk_bootstrap.rs) ;;
            rust/crates/dev-tools/tests/ci_disk_bootstrap/prepared_audit.rs) ;;
            rust/crates/dev-tools/tests/ci_workflow_policy.rs) ;;
            rust/crates/dev-tools/tests/developer_auth.rs) ;;
            rust/crates/dev-tools/tests/developer_cli_original.rs) ;;
            rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/car-copy-float-bits.original.json) ;;
            rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/filter-order-laziness.original.json) ;;
            rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/malformed-boundaries.original.json) ;;
            rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/non-car-identity.original.json) ;;
            rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/vin-codepoints.original.json) ;;
            rust/crates/dev-tools/tests/route_sanitizer_original.rs) ;;
            rust/crates/dev-tools/tests/route_vault_bundle.rs) ;;
            rust/tools/run-developer-tool) ;;
            tools/carrot_route_vault/README.md) ;;
            tools/ci/model-cache-482-natural-config.json) ;;
            tools/ci/model_cache_probe_482.sh) ;;
            *) printf 'Changed dependency invalidates reuse: %s\n' "$changed" >&2; exit 1 ;;
          esac
        done < "$CI_JOB_TEMP/proof/changed-paths.bin"
        printf '%s  %s\n' 68f0f800ef5fbb456a06986a8695a5c3aaa2cbdf86160b47826e913edd792f85 .github/workflows/carrot-route-vault-publish.yaml | sha256sum --check -
        printf '%s  %s\n' 666970494a10d89bafbbc0738fc9d642bb53dc94953d4abfada55fc91ae4ba99 .github/workflows/fast-checks.yml | sha256sum --check -
        printf '%s  %s\n' f3442edf075219bfb2b0c13c9522f4cf4e5928a2ee7547aa11f07d1a73bb5a92 .github/workflows/python-rust-523-bundle.yml | sha256sum --check -
        printf '%s  %s\n' 6cbc112a29fc6e806265d803b07351357ac7e383cc16f0cc30a607e519bb4a69 .github/workflows/python-rust-523-capacity.yml | sha256sum --check -
        printf '%s  %s\n' c5a1e39a6d90d76fac5620f74f9f1505a5379d4dd2a93636ea43c042477c762b .github/workflows/python-rust-523-model.yml | sha256sum --check -
        printf '%s  %s\n' 1d5d90dd2d5498ee4773b6bd26a4276d6e7a242bebe80c0e709e931705827ee4 .github/workflows/python-rust-523-reclaim.yml | sha256sum --check -
        printf '%s  %s\n' 64d8f6b19494b957723ee487512483222cd15b2fa90f9598395e428548b07278 .github/workflows/python-rust-523-sanitizer.yml | sha256sum --check -
        test ! -e openpilot/tools/lib/sanitizer.py && test ! -L openpilot/tools/lib/sanitizer.py
        printf '%s  %s\n' 5423bf5ab464bce3342e6eee6fc07ab64a6ecca4c4756e35a19cc54520ba0af2 rust/crates/dev-tools/Cargo.toml | sha256sum --check -
        printf '%s  %s\n' a2e53b5164624f1946ca40fe188915493329dd25fe7abe37a9f7958dcf56adaa rust/crates/dev-tools/src/argparse_scan.rs | sha256sum --check -
        printf '%s  %s\n' dceaf77a84c9994ffdd2f3bd1da471823059e3b443d508eff8316642046ecb60 rust/crates/dev-tools/src/ci_policy.rs | sha256sum --check -
        printf '%s  %s\n' 45f5c9880964d2ce954f02997cf0b85c8b429051aa6900daaa822258f07546ee rust/crates/dev-tools/src/developer_ssh.rs | sha256sum --check -
        printf '%s  %s\n' 390141ed26fb0afbaffed631bfbc61462044b033e2afea14e0eeecaf86c5aef6 rust/crates/dev-tools/src/developer_ssh/cli.rs | sha256sum --check -
        printf '%s  %s\n' 4ec4ac3923e32ed834dffee608080b31c5806205823ede2221b057020b172496 rust/crates/dev-tools/src/developer_ssh/login/cli.rs | sha256sum --check -
        printf '%s  %s\n' bcf6cd781fd6c2d1e0738c8b96213bca284e935cb68e9219a224e9fb98d2331b rust/crates/dev-tools/src/developer_ssh/login/cli/tests.rs | sha256sum --check -
        printf '%s  %s\n' e7a93b009565cfce55919a381437ac4db883e9da2126fa28b91d12732bc53d96 rust/crates/dev-tools/src/developer_ssh/unicode_lower15.LICENSE-UNICODE-V3.txt | sha256sum --check -
        printf '%s  %s\n' 5ad5796e126319c60785f07707e22902de2e935d1343164d0898bd1f6325b678 rust/crates/dev-tools/src/developer_ssh/unicode_lower15.provenance.json | sha256sum --check -
        printf '%s  %s\n' f0edde8b8443486b6940dc8f22e7cea65675b8230a46baec11c8ce0c2bab6b40 rust/crates/dev-tools/src/developer_ssh/unicode_lower15.rs | sha256sum --check -
        printf '%s  %s\n' bf2758c92e1cfdc9f69249ce1c16b6a96e393ad062adf259e15d6120148e38a0 rust/crates/dev-tools/src/developer_ssh/unicode_lower15_original.rs | sha256sum --check -
        printf '%s  %s\n' 1dd943c418bee41bc2a7d4b850a6d0cf9dfce885fb1182fb437f59a0747ae03f rust/crates/dev-tools/src/route_sanitizer_tests.rs | sha256sum --check -
        printf '%s  %s\n' 1227b87bdfba7e0ea03d2542766133f75925200bfd0fb7f1eea7f121738294f7 rust/crates/dev-tools/tests/argparse_scan.rs | sha256sum --check -
        printf '%s  %s\n' a3c592dc7af2e78964bb4c0475dc201d93171ac2d035bf684db2d2b6f1521fb2 rust/crates/dev-tools/tests/ci_disk_bootstrap.rs | sha256sum --check -
        printf '%s  %s\n' f1fb63059d2fbcdcd039c5c47fe7f784bf17601a4476aef60a4a0053b0f8477c rust/crates/dev-tools/tests/ci_disk_bootstrap/prepared_audit.rs | sha256sum --check -
        printf '%s  %s\n' 67427eb22a426e13403908626d05dbf58c2a489bd552d56413eb478468d957ed rust/crates/dev-tools/tests/ci_workflow_policy.rs | sha256sum --check -
        printf '%s  %s\n' 9e621eff405a28331789a89ef00b6bb66449a6a6a73fe3b0cabce920777d5e6e rust/crates/dev-tools/tests/developer_auth.rs | sha256sum --check -
        printf '%s  %s\n' 69b4ff1a2c560016383d14661ccb0b39d5d59eabda33ce219b138e94f20ee471 rust/crates/dev-tools/tests/developer_cli_original.rs | sha256sum --check -
        printf '%s  %s\n' 7ff3b5e2ca762aa2c10f0fcf6c0e915f286143e51cde7ce2e1898ec1a1cb8958 rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/car-copy-float-bits.original.json | sha256sum --check -
