    - name: Verify exact SSH original deletion against retained source
      id: ssh_original_deletion
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled()
        && steps.toolchain.outcome == 'success' && steps.ssh_absence_admission.outcome == 'success') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      run: |
        set -euo pipefail
        ssh_helper="$DIAG_SOURCE/tools/ci/ssh_source_absence_523.sh"
        [[ -f $ssh_helper && ! -L $ssh_helper ]]
        ssh_helper_id=$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' "$ssh_helper")
        exec {ssh_helper_fd}<"$ssh_helper"
        ssh_helper_pid=$BASHPID
        test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' "/proc/$ssh_helper_pid/fd/$ssh_helper_fd")" = "$ssh_helper_id"
        printf '%s  %s\n' 33c8547d622f61758a364c8969ebcadc85b2c2825e4da00b777dddb9e50359fa "/proc/$ssh_helper_pid/fd/$ssh_helper_fd" | sha256sum --check --strict --quiet -
        . "/proc/$ssh_helper_pid/fd/$ssh_helper_fd"
        test "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' "$ssh_helper")" = "$ssh_helper_id"
        test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' "/proc/$ssh_helper_pid/fd/$ssh_helper_fd")" = "$ssh_helper_id"
        exec {ssh_helper_fd}<&-
        base=97f7ad36dfa0919b4e5c216fb16f44ed29161663
        # 기존 source-reuse 단계가 이미 fetch한 정확한 object만 읽는다. 새 fetch/restore는 없다.
        git --no-optional-locks diff --no-renames --name-status "$base" HEAD -- tools/scripts/ssh.py > "$CI_JOB_TEMP/proof/ssh-original-deletion.diff"
        printf 'D\ttools/scripts/ssh.py\n' | cmp - "$CI_JOB_TEMP/proof/ssh-original-deletion.diff"
        git --no-optional-locks show "$base:tools/scripts/ssh.py" | sha256sum > "$CI_JOB_TEMP/proof/ssh-historical-original.sha256"
        printf 'f4fb8dff60a0bab57643172093a6f437acb0d001929103f081d872280710eeff  -\n' | cmp - "$CI_JOB_TEMP/proof/ssh-historical-original.sha256"
        ssh_absence_verify "$DIAG_SOURCE" "$GITHUB_SHA" historical-deletion
    - name: Admit unchanged a134 runtime-qualified auth and setup cohorts
