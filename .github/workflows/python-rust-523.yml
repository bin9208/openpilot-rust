      run: |
        set -euo pipefail
        find "$DEVELOPER_SSH_FROZEN_DIR" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/ssh-frozen-inputs.after.sha256"
        find -P "$DEVELOPER_SSH_FROZEN_DIR" -printf '%P\t%y\t%D\t%i\t%m\t%U\t%G\t%n\t%s\t%T@\t%C@\n' | sort > "$CI_JOB_TEMP/proof/ssh-frozen-roster.after.tsv"
        cmp "$CI_JOB_TEMP/proof/ssh-frozen-inputs.before.sha256" "$CI_JOB_TEMP/proof/ssh-frozen-inputs.after.sha256"
        cmp "$CI_JOB_TEMP/proof/ssh-frozen-roster.before.tsv" "$CI_JOB_TEMP/proof/ssh-frozen-roster.after.tsv"
    - name: Validate strict auth and SSH Clippy
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && steps.toolchain.outcome == 'success') }}
      run: |
        set -euo pipefail
        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features developer-ssh-native --lib --bin developer-auth --bin developer-auth-json --bin developer-ssh --bin setup-ssh-keys --test developer_auth --test developer_cli_original --test developer_ssh --test argparse_scan --test ci_disk_bootstrap -- -D warnings 2>&1 | tee "$CI_JOB_TEMP/proof/auth-clippy.log"
    - name: Seal Fast source and index after all maintained checks
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"

        if test -d "$CARGO_TARGET_DIR"; then
          find "$CARGO_TARGET_DIR" -name "*.d" -type f -exec sha256sum {} + > "$CI_JOB_TEMP/proof/build-dep-info.sha256"
        else
          : > "$CI_JOB_TEMP/proof/build-dep-info.sha256"
        fi

        if test -f "$CI_JOB_TEMP/proof/rust-tools.sha256"; then sha256sum --check "$CI_JOB_TEMP/proof/rust-tools.sha256"; fi
        if test -f "$CI_JOB_TEMP/proof/oracle-runtime.sha256"; then sha256sum --check "$CI_JOB_TEMP/proof/oracle-runtime.sha256"; fi
        if test -f "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256"; then
          find "$CI_JOB_TEMP/venv" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/oracle-venv-files.after.sha256"
          cmp "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256" "$CI_JOB_TEMP/proof/oracle-venv-files.after.sha256"
          find "$CI_JOB_TEMP/venv" -type l -printf '%p\t%l\n' | sort > "$CI_JOB_TEMP/proof/oracle-venv-links.after.txt"
          cmp "$CI_JOB_TEMP/proof/oracle-venv-links.before.txt" "$CI_JOB_TEMP/proof/oracle-venv-links.after.txt"
        fi
      id: source_final
    - name: Verify prepared Rust SDK after all attempted focused checks
      id: prepared_rust_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_PREPARED_RUST_ROOT != '') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      run: '"$DIAG_SOURCE/rust/tools/prepare-readonly-ci-rust" after'
    - name: Retain Fast job ownership evidence
      id: fast_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: diagnostic-fast-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded private Fast source
      id: fast_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && env.DIAG_SOURCE_OWNER != '' && steps.source_final.outcome == 'success' && steps.prepared_rust_final.outcome == 'success') }}
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
        [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        rm -rf --one-file-system -- "$p"
    - name: Clean common owned Fast job temporary paths
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != ''
        && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success')
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
