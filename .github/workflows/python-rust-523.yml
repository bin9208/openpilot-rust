        printf '%s  %s\n' f4762d30d706a0956ab44b16c6b537cdd50092083ab6a8911e40c88b07ceba67 rust/crates/dev-tools/tests/fixtures/route-sanitizer-original/vin-codepoints.original.json | sha256sum --check -
