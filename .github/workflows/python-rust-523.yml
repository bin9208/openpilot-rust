name: Python Rust 523 focused acceptance
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  focused:
    name: Native conversion focused acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NO_PROXY: 127.0.0.1,localhost
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private Fast source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        # Source capacity is checked on the actual source filesystem BEFORE checkout.
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Preserve Actions' real workspace separately. Only Bash consumers see the
        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact focused source HEAD and tracked index
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - uses: actions/setup-python@v6
      id: oracle_python
      with:
        python-version: 3.12.15
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Isolate original Python package installation
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        "$pythonLocation/bin/python" -I -B -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
        library=$(readlink -e "$pythonLocation/lib")
        test "$library" = "$pythonLocation/lib"
        test -f "$library/libpython3.12.so.1.0"
        printf '%s\n' "OPENPILOT_ORACLE_PYTHON_LIBRARY_PATH=$library" >> "$GITHUB_ENV"
        sha256sum "$library/libpython3.12.so.1.0" "$library/python3.12/argparse.py" "$(readlink -e "$CI_JOB_TEMP/venv/bin/python")" > "$CI_JOB_TEMP/proof/oracle-runtime.sha256"
        /usr/bin/env -i HOME="$CI_JOB_TEMP/home" LD_LIBRARY_PATH="$library" "$CI_JOB_TEMP/venv/bin/python" -I -B -X "pycache_prefix=$CI_JOB_TEMP/unused-oracle-pycache" - <<'RUNTIME' > "$CI_JOB_TEMP/proof/oracle-runtime.json"
        import argparse, hashlib, json, os, pathlib, sys
        assert sys.version_info[:3] == (3,12,15), sys.version
        base = pathlib.Path(sys.base_prefix).resolve()
        provider = (base/'lib/libpython3.12.so.1.0').resolve(strict=True)
        assert pathlib.Path(argparse.__file__).resolve() == base/'lib/python3.12/argparse.py'
        info = provider.stat()
        mappings = [line.split(maxsplit=5) for line in pathlib.Path('/proc/self/maps').read_text().splitlines() if 'libpython' in line]
        device = f'{os.major(info.st_dev):02x}:{os.minor(info.st_dev):02x}'
        assert mappings and all(len(r)==6 and r[3]==device and int(r[4])==info.st_ino and pathlib.Path(r[5]).resolve()==provider for r in mappings)
        print(json.dumps({'version':sys.version,'executable':str(pathlib.Path(sys.executable).resolve()),'base_prefix':str(base),'library':str(provider),'library_sha256':hashlib.sha256(provider.read_bytes()).hexdigest(),'argparse':str(pathlib.Path(argparse.__file__).resolve()),'argparse_sha256':hashlib.sha256(pathlib.Path(argparse.__file__).read_bytes()).hexdigest(),'cleared_environment':True},indent=2))
        RUNTIME
    - name: Prepare focused toolchain and original-only Python dependencies
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        # This operation reuses the installed pinned toolchain instead of installing a duplicate.
        # Growth covers the private Cargo registry, focused targets and explicit host bootstrap targets and original-only captures.
        (( available >= 4 * 1024 * 1024 * 1024 ))
        printf '{"available_bytes":%s,"planned_focused_growth_bytes":4294967296}\n' "$available" > "$CI_JOB_TEMP/proof/build-growth.json"
        sudo -n apt-get -o APT::Architectures=amd64 update
        sudo -n apt-get -o APT::Architectures=amd64 install -y g++ pkg-config capnproto libcapnp-dev libzmq3-dev gh unzip jq strace
        "$DIAG_SOURCE/rust/tools/prepare-readonly-ci-rust" before
        sdk="$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu"
        "$CARGO_HOME/bin/rustup" component list --installed --toolchain 1.94.0 > "$CI_JOB_TEMP/proof/rust-components.txt"
        grep -q '^rustfmt-' "$CI_JOB_TEMP/proof/rust-components.txt"
        grep -q '^clippy-' "$CI_JOB_TEMP/proof/rust-components.txt"
        sha256sum "$sdk/bin/rustc" "$sdk/bin/cargo" "$sdk/bin/rustfmt" "$sdk/bin/clippy-driver" > "$CI_JOB_TEMP/proof/rust-tools.sha256"

        "$CI_JOB_TEMP/venv/bin/python" -m pip install requests==2.34.2
        "$sdk/bin/rustc" -vV > "$CI_JOB_TEMP/proof/rustc.txt"
        "$sdk/bin/cargo" -V > "$CI_JOB_TEMP/proof/cargo.txt"
        command -v capnp
        command -v strace



        "$CI_JOB_TEMP/venv/bin/python" -m pip freeze > "$CI_JOB_TEMP/proof/python-provider-versions.txt"
        find "$CI_JOB_TEMP/venv" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256"
        find "$CI_JOB_TEMP/venv" -type l -printf '%p\t%l\n' | sort > "$CI_JOB_TEMP/proof/oracle-venv-links.before.txt"
      id: toolchain
    - name: Check complete workspace syntax and formatting
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && steps.toolchain.outcome == 'success') }}
      run: |
        set -euo pipefail
        cargo fmt --manifest-path rust/Cargo.toml --all --check 2>&1 | tee "$CI_JOB_TEMP/proof/format.log"
    - name: Admit exact unchanged successful source cohorts
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && steps.toolchain.outcome == 'success') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        prior="$CI_JOB_TEMP/proof/prior-40084922332.zip"
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12557545634/zip > "$prior"
        printf '921c8b07db200945ee3c39279c63d4d4159a9ef391a1e3f0c64515d8b9dd2df0  %s\n' "$prior" | sha256sum --check -
        unzip -t "$prior" > "$CI_JOB_TEMP/proof/prior-crc.txt"
        test "$(unzip -p "$prior" SOURCE_COMMIT)" = 97f7ad36dfa0919b4e5c216fb16f44ed29161663
        for name in source-before.sha256 source-after.sha256 index-before.bin index-after.bin rust-tools.sha256; do
          unzip -p "$prior" "$name" > "$CI_JOB_TEMP/proof/prior-$name"
        done
        cmp "$CI_JOB_TEMP/proof/prior-source-before.sha256" "$CI_JOB_TEMP/proof/prior-source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/prior-index-before.bin" "$CI_JOB_TEMP/proof/prior-index-after.bin"
        python - <<'SDK_ORIGIN'
        import hashlib,json,os,re
        from pathlib import Path
        proof=Path(os.environ['CI_JOB_TEMP'])/'proof'
        sdk=Path(os.environ['CI_PREPARED_RUST_ROOT'])
        old=Path('/home/actions/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin')
        expected={'rustc','cargo','rustfmt','clippy-driver'}
        mapping=[]
        for line in (proof/'prior-rust-tools.sha256').read_text().splitlines():
            match=re.fullmatch(r'([0-9a-f]{64})  (/[^\n]+)',line)
            assert match is not None
            prior=Path(match[2]);assert prior.parent==old and prior.name in expected
            expected.remove(prior.name)
            current=sdk/'bin'/prior.name
            assert hashlib.sha256(current.read_bytes()).hexdigest()==match[1]
            mapping.append({'historical_path':str(prior),'current_path':str(current),'sha256':match[1]})
        assert not expected and len(mapping)==4
        (proof/'historical-current-rust-programs.json').write_text(json.dumps(mapping,indent=2)+'\n')
        SDK_ORIGIN
        git fetch --no-tags --depth=1 origin 97f7ad36dfa0919b4e5c216fb16f44ed29161663
        git diff --no-renames --name-only -z 97f7ad36dfa0919b4e5c216fb16f44ed29161663 HEAD > "$CI_JOB_TEMP/proof/changed-paths.bin"
        while IFS= read -r -d '' changed; do
          case "$changed" in
            .github/workflows/carrot-route-vault-publish.yaml) ;;
