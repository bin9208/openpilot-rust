        RESULT_8: ${{ steps.source_final.outcome }}
        RESULT_9: ${{ steps.prepared_rust_final.outcome }}
      run: |
        set -euo pipefail
        ssh_helper="$DIAG_SOURCE/tools/ci/ssh_source_absence_523.sh"
        [[ -f $ssh_helper && ! -L $ssh_helper ]]
        ssh_helper_id=$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' "$ssh_helper")
        exec {ssh_helper_fd}<"$ssh_helper"
        ssh_helper_pid=$BASHPID
        test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' "/proc/$ssh_helper_pid/fd/$ssh_helper_fd")" = "$ssh_helper_id"
        printf '%s  %s\n' 33c8547d622f61758a364c8969ebcadc85b2c2825e4da00b777dddb9e50359fa "/proc/$ssh_helper_pid/fd/$ssh_helper_fd" | sha256sum --check --strict --quiet -
        . "/proc/$ssh_helper_pid/fd/$ssh_helper_fd"
        test "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' "$ssh_helper")" = "$ssh_helper_id"
        test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' "/proc/$ssh_helper_pid/fd/$ssh_helper_fd")" = "$ssh_helper_id"
        exec {ssh_helper_fd}<&-
        for result in "$RESULT_0" "$RESULT_1" "$RESULT_2" "$RESULT_3" "$RESULT_4" "$RESULT_5" "$RESULT_6" "$RESULT_7" "$RESULT_8" "$RESULT_9"; do test "$result" = success; done
        jq -e --arg source "$GITHUB_SHA" '.schema==1 and .source_sha==$source and .phase=="entry4-checked" and
         .command_exit==0 and .finalizer_exit==0 and .entry4_candidate==true and .source_phase=="absent" and
         .removed_source=="tools/scripts/ssh.py" and .historical_source_sha256=="f4fb8dff60a0bab57643172093a6f437acb0d001929103f081d872280710eeff" and
         .source_absence_admitted==true and .original_deleted==true and .original_executed==false and
         .retirement_credit==0 and .real_ssh==false and .whole_python_absence==false' "$CI_JOB_TEMP/proof/developer-ssh-entry/driver/outcome.json"
        ssh_absence_verify "$DIAG_SOURCE" "$GITHUB_SHA" closure
        ssh_absence_require_stages "$CI_JOB_TEMP/proof"
        (umask 077; set -o noclobber
         jq -n --arg source "$GITHUB_SHA" --arg root "$DIAG_SOURCE" --arg parents "$SSH_ABSENCE_PARENTS" \
         '{schema:1,source_sha:$source,root:$root,parents:$parents,phase:"absent",removed_source:"tools/scripts/ssh.py",
         controls:6,required_stages_verified:true,sampled_absence:true,whole_python_absence:false,retirement_credit:0}' \
         > "$CI_JOB_TEMP/proof/ssh-absence-closure.json")
    - name: Retain Fast job ownership evidence
      id: fast_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: diagnostic-fast-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded private Fast source
      id: fast_source_cleanup
      if: '${{ (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == ''success'' && steps.fast_evidence.outputs.artifact-id != '''' && steps.fast_evidence.outputs.artifact-digest != '''' && env.DIAG_SOURCE_OWNER != '''' && steps.source_final.outcome == ''success'' && steps.prepared_rust_final.outcome == ''success'' && steps.ssh_absence_closure.outcome == ''success'') }}'
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
        [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        ssh_helper="$DIAG_SOURCE/tools/ci/ssh_source_absence_523.sh"
        [[ -f $ssh_helper && ! -L $ssh_helper ]]
        ssh_helper_id=$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' "$ssh_helper")
        exec {ssh_helper_fd}<"$ssh_helper"
        ssh_helper_pid=$BASHPID
        test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' "/proc/$ssh_helper_pid/fd/$ssh_helper_fd")" = "$ssh_helper_id"
        printf '%s  %s\n' 33c8547d622f61758a364c8969ebcadc85b2c2825e4da00b777dddb9e50359fa "/proc/$ssh_helper_pid/fd/$ssh_helper_fd" | sha256sum --check --strict --quiet -
        . "/proc/$ssh_helper_pid/fd/$ssh_helper_fd"
        test "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' "$ssh_helper")" = "$ssh_helper_id"
        test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' "/proc/$ssh_helper_pid/fd/$ssh_helper_fd")" = "$ssh_helper_id"
        exec {ssh_helper_fd}<&-
        ssh_absence_inspect "$DIAG_SOURCE" "$GITHUB_SHA"
        printf 'SSH_ABSENCE_CLEANUP source=%s result=absent sampled=true\n' "$GITHUB_SHA"
        rm -rf --one-file-system -- "$p"
    - name: Clean common owned Fast job temporary paths
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != ''
        && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success')
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
