        assert current==translated, 'Oracle version/provider/stdlib bytes or non-path metadata changed.'
        with Path(sys.argv[2]).open('x') as out:
            json.dump({'historical':historical,'current':current,'path_mapping':mapping},out,indent=2);out.write('\n')
        ORACLE_ORIGIN
        printf '%s\n' 'a134 auth3/login8/setup21/scanner2는 원래 source로 재사용한다. 현재 SSH39/setup21과 importer 음성7은 고정 raw 원문을 같은 verifier로 별도 재생한다. Unicode15 scalar/context와 SSH27, 변경 harness의 strict Clippy는 별도로 실행한다. 원본 부재/실제 SSH entry는 미수용이다.' > "$CI_JOB_TEMP/proof/runtime-qualified-reuse.txt"
