name: Python Rust 523 focused acceptance
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    name: Native conversion focused acceptance
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NO_PROXY: 127.0.0.1,localhost
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private Fast source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        # Source capacity is checked on the actual source filesystem BEFORE checkout.
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Preserve Actions' real workspace separately. Only Bash consumers see the
        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact focused source HEAD and tracked index
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - uses: actions/setup-python@v6
      id: oracle_python
      with:
        python-version: 3.12.15
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Isolate original Python package installation
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        "$pythonLocation/bin/python" -I -B -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
        library=$(readlink -e "$pythonLocation/lib")
        test "$library" = "$pythonLocation/lib"
        test -f "$library/libpython3.12.so.1.0"
        printf '%s\n' "OPENPILOT_ORACLE_PYTHON_LIBRARY_PATH=$library" >> "$GITHUB_ENV"
        sha256sum "$library/libpython3.12.so.1.0" "$library/python3.12/argparse.py" "$(readlink -e "$CI_JOB_TEMP/venv/bin/python")" > "$CI_JOB_TEMP/proof/oracle-runtime.sha256"
        /usr/bin/env -i HOME="$CI_JOB_TEMP/home" LD_LIBRARY_PATH="$library" "$CI_JOB_TEMP/venv/bin/python" -I -B -X "pycache_prefix=$CI_JOB_TEMP/unused-oracle-pycache" - <<'RUNTIME' > "$CI_JOB_TEMP/proof/oracle-runtime.json"
        import argparse, hashlib, json, os, pathlib, sys
        assert sys.version_info[:3] == (3,12,15), sys.version
        base = pathlib.Path(sys.base_prefix).resolve()
        provider = (base/'lib/libpython3.12.so.1.0').resolve(strict=True)
        assert pathlib.Path(argparse.__file__).resolve() == base/'lib/python3.12/argparse.py'
        info = provider.stat()
        mappings = [line.split(maxsplit=5) for line in pathlib.Path('/proc/self/maps').read_text().splitlines() if 'libpython' in line]
        device = f'{os.major(info.st_dev):02x}:{os.minor(info.st_dev):02x}'
        assert mappings and all(len(r)==6 and r[3]==device and int(r[4])==info.st_ino and pathlib.Path(r[5]).resolve()==provider for r in mappings)
        print(json.dumps({'version':sys.version,'executable':str(pathlib.Path(sys.executable).resolve()),'base_prefix':str(base),'library':str(provider),'library_sha256':hashlib.sha256(provider.read_bytes()).hexdigest(),'argparse':str(pathlib.Path(argparse.__file__).resolve()),'argparse_sha256':hashlib.sha256(pathlib.Path(argparse.__file__).read_bytes()).hexdigest(),'cleared_environment':True},indent=2))
        RUNTIME
    - name: Prepare focused toolchain and original-only Python dependencies
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        # This operation reuses the installed pinned toolchain instead of installing a duplicate.
        # Growth covers the private Cargo registry, focused targets and explicit host bootstrap targets and original-only captures.
        (( available >= 4 * 1024 * 1024 * 1024 ))
        printf '{"available_bytes":%s,"planned_focused_growth_bytes":4294967296}\n' "$available" > "$CI_JOB_TEMP/proof/build-growth.json"
        sudo -n apt-get -o APT::Architectures=amd64 update
        sudo -n apt-get -o APT::Architectures=amd64 install -y g++ pkg-config capnproto libcapnp-dev libzmq3-dev gh unzip jq strace
        export RUSTUP_HOME=/home/actions/.rustup
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        test -x "$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/rustc"
        rustup component list --installed > "$CI_JOB_TEMP/proof/rust-components.txt"
        grep -q '^rustfmt-' "$CI_JOB_TEMP/proof/rust-components.txt"
        grep -q '^clippy-' "$CI_JOB_TEMP/proof/rust-components.txt"
        sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" "$(rustup which clippy-driver)" > "$CI_JOB_TEMP/proof/rust-tools.sha256"

        "$CI_JOB_TEMP/venv/bin/python" -m pip install requests==2.34.2
        rustc -vV > "$CI_JOB_TEMP/proof/rustc.txt"
        cargo -V > "$CI_JOB_TEMP/proof/cargo.txt"
        command -v capnp
        command -v strace



        "$CI_JOB_TEMP/venv/bin/python" -m pip freeze > "$CI_JOB_TEMP/proof/python-provider-versions.txt"
        find "$CI_JOB_TEMP/venv" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256"
        find "$CI_JOB_TEMP/venv" -type l -printf '%p\t%l\n' | sort > "$CI_JOB_TEMP/proof/oracle-venv-links.before.txt"
      id: toolchain
    - name: Check complete workspace syntax and formatting
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        cargo fmt --manifest-path rust/Cargo.toml --all --check 2>&1 | tee "$CI_JOB_TEMP/proof/format.log"
    - name: Admit exact unchanged successful source cohorts
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        prior="$CI_JOB_TEMP/proof/prior-40084922332.zip"
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12557545634/zip > "$prior"
        printf '921c8b07db200945ee3c39279c63d4d4159a9ef391a1e3f0c64515d8b9dd2df0  %s\n' "$prior" | sha256sum --check -
        unzip -t "$prior" > "$CI_JOB_TEMP/proof/prior-crc.txt"
        test "$(unzip -p "$prior" SOURCE_COMMIT)" = 97f7ad36dfa0919b4e5c216fb16f44ed29161663
        for name in source-before.sha256 source-after.sha256 index-before.bin index-after.bin rust-tools.sha256; do
          unzip -p "$prior" "$name" > "$CI_JOB_TEMP/proof/prior-$name"
        done
        cmp "$CI_JOB_TEMP/proof/prior-source-before.sha256" "$CI_JOB_TEMP/proof/prior-source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/prior-index-before.bin" "$CI_JOB_TEMP/proof/prior-index-after.bin"
        sha256sum --check "$CI_JOB_TEMP/proof/prior-rust-tools.sha256"
        git fetch --no-tags --depth=1 origin 97f7ad36dfa0919b4e5c216fb16f44ed29161663
        git diff --no-renames --name-only -z 97f7ad36dfa0919b4e5c216fb16f44ed29161663 HEAD > "$CI_JOB_TEMP/proof/changed-paths.bin"
        while IFS= read -r -d '' changed; do
          case "$changed" in
            .github/workflows/python-rust-523*.yml|docs/naver/python-rust-523*.md) ;;
            rust/crates/dev-tools/Cargo.toml|rust/crates/dev-tools/src/developer_ssh/login/cli.rs|rust/crates/dev-tools/src/developer_ssh/login/cli/tests.rs|rust/crates/dev-tools/src/developer_ssh/cli.rs|rust/crates/dev-tools/src/argparse_scan.rs|rust/crates/dev-tools/tests/argparse_scan.rs|rust/crates/dev-tools/tests/developer_cli_original.rs|rust/crates/dev-tools/src/route_sanitizer_tests.rs|rust/crates/dev-tools/tests/ci_disk_bootstrap.rs|rust/crates/dev-tools/tests/ci_disk_bootstrap/prepared_audit.rs|.github/workflows/fast-checks.yml|rust/crates/dev-tools/tests/route_vault_bundle.rs|rust/crates/dev-tools/tests/developer_auth.rs|rust/crates/dev-tools/tests/route_sanitizer_original.rs|tools/ci/model_cache_probe_482.sh|tools/ci/model-cache-482-natural-config.json) ;;
            *) printf 'Changed dependency invalidates reuse: %s\n' "$changed" >&2; exit 1 ;;
          esac
        done < "$CI_JOB_TEMP/proof/changed-paths.bin"
        printf '%s  %s\n' 5477ab6cd7e7b4aa83d55c2b6f047f54dedfe434d23585ccf0ed9d19d9f8f023 .github/workflows/fast-checks.yml | sha256sum --check -
        printf '%s  %s\n' 5423bf5ab464bce3342e6eee6fc07ab64a6ecca4c4756e35a19cc54520ba0af2 rust/crates/dev-tools/Cargo.toml | sha256sum --check -
        printf '%s  %s\n' 4ec4ac3923e32ed834dffee608080b31c5806205823ede2221b057020b172496 rust/crates/dev-tools/src/developer_ssh/login/cli.rs | sha256sum --check -
        printf '%s  %s\n' bcf6cd781fd6c2d1e0738c8b96213bca284e935cb68e9219a224e9fb98d2331b rust/crates/dev-tools/src/developer_ssh/login/cli/tests.rs | sha256sum --check -
        printf '%s  %s\n' 390141ed26fb0afbaffed631bfbc61462044b033e2afea14e0eeecaf86c5aef6 rust/crates/dev-tools/src/developer_ssh/cli.rs | sha256sum --check -
        printf '%s  %s\n' a2e53b5164624f1946ca40fe188915493329dd25fe7abe37a9f7958dcf56adaa rust/crates/dev-tools/src/argparse_scan.rs | sha256sum --check -
        printf '%s  %s\n' 1227b87bdfba7e0ea03d2542766133f75925200bfd0fb7f1eea7f121738294f7 rust/crates/dev-tools/tests/argparse_scan.rs | sha256sum --check -
        printf '%s  %s\n' bc8402cbcfda4a086891e9f52b1209059c8ae9bcf0d865f554b7391354f87fd2 rust/crates/dev-tools/tests/developer_cli_original.rs | sha256sum --check -
        printf '%s  %s\n' 1dd943c418bee41bc2a7d4b850a6d0cf9dfce885fb1182fb437f59a0747ae03f rust/crates/dev-tools/src/route_sanitizer_tests.rs | sha256sum --check -
        printf '%s  %s\n' 06c3b91c2f51a84a9934270260386b5b4f76f798fbebaaaa40f3235c0d93c6ef rust/crates/dev-tools/tests/route_sanitizer_original.rs | sha256sum --check -
        printf '%s  %s\n' 9e621eff405a28331789a89ef00b6bb66449a6a6a73fe3b0cabce920777d5e6e rust/crates/dev-tools/tests/developer_auth.rs | sha256sum --check -
        printf '%s  %s\n' e96c8774ae224da098c2fc96c010d9036ecbd4b2b52a793e4e952c5ed30b6959 rust/crates/dev-tools/tests/route_vault_bundle.rs | sha256sum --check -
        printf '%s  %s\n' a3c592dc7af2e78964bb4c0475dc201d93171ac2d035bf684db2d2b6f1521fb2 rust/crates/dev-tools/tests/ci_disk_bootstrap.rs | sha256sum --check -
        printf '%s  %s\n' f1fb63059d2fbcdcd039c5c47fe7f784bf17601a4476aef60a4a0053b0f8477c rust/crates/dev-tools/tests/ci_disk_bootstrap/prepared_audit.rs | sha256sum --check -
        printf '%s  %s\n' 837946b71e9a99b0bc061a3a7ef5c7cd384a6e6ee11dc3d4c0ea03ea229cdd90 tools/ci/model_cache_probe_482.sh | sha256sum --check -
        printf '%s  %s\n' 2d769aa04fecbf2175532d5ebca995eaaece64adb1200d81bcddebabd1ff7a0d tools/ci/model-cache-482-natural-config.json | sha256sum --check -
        python - <<'MANIFEST'
        import subprocess,tomllib
        from pathlib import Path
        old=tomllib.loads(subprocess.check_output(['git','show','97f7ad36dfa0919b4e5c216fb16f44ed29161663:rust/crates/dev-tools/Cargo.toml'],text=True))
        new=tomllib.loads(Path('rust/crates/dev-tools/Cargo.toml').read_text())
        entry={'name':'route_sanitizer_original','required-features':['route-sanitizer-native']}
        assert new['test'].count(entry)==1
        new['test'].remove(entry)
        assert old==new, 'Only the reviewed test registration may change.'
        MANIFEST
        python - "$prior" <<'COHORTS'
        import hashlib,io,json,sys,zipfile
        with zipfile.ZipFile(sys.argv[1]) as current:
         blob=current.read('prior-40082949276.zip')
         assert hashlib.sha256(blob).hexdigest()=='5ed71546d1a7d50ffc0a94c1b8ba9266267fb2a7772de83d8ebfe4bcc3a2e279'
         with zipfile.ZipFile(io.BytesIO(blob)) as z:
          assert z.testzip() is None
          assert z.read('SOURCE_COMMIT').decode().strip()=='41cfaffd310059f4f999c8d24dd491d9694baa91'
          assert z.read('source-before.sha256')==z.read('source-after.sha256')
          assert z.read('index-before.bin')==z.read('index-after.bin')
          for name in ['executables','source','providers','captured']:
           assert json.loads(z.read(f'paramsd-boundaries/{name}.before.json'))==json.loads(z.read(f'paramsd-boundaries/{name}.after.json'))
          complete=json.loads(z.read('paramsd-boundaries/complete.json'))
          assert complete['car_pairs']==9 and complete['numpy_cases']==9600 and complete['passed_ignored_selectors']==2
          for i in range(3):
           for name in ['default','empty','custom']:
            assert z.read(f'paramsd-boundaries/car-params/original-{i}-{name}.bin')==z.read(f'paramsd-boundaries/car-params/native-{i}-{name}.bin')
          blob=z.read('prior-40081388419.zip')
          assert hashlib.sha256(blob).hexdigest()=='c9de529574ed693dfec4cd438b3da29d87fb26060bbe5b43347844dd579fe74d'
          with zipfile.ZipFile(io.BytesIO(blob)) as before:
           assert before.testzip() is None
           assert before.read('SOURCE_COMMIT').decode().strip()=='40efe7ef964c0b08f9ba867edd9c863fc545bc0a'
           assert before.read('source-before.sha256')==before.read('source-after.sha256')
        COHORTS
        printf '%s\n' 'Reused unchanged 41cf Paramsd boundaries/op help/callback/API units; 40efe and earlier terminal/HTTP/Github/camera/controller/catalog ARM cohorts. Fresh prepared-runtime auth3/login8/SSH CLI54/3, affected SSH27/scanner2 and strict Clippy. Legacy scanner entrypoint policy remains eager.' > "$CI_JOB_TEMP/proof/reused-scopes.txt"
    - name: Validate auth CLI against the exact prepared Python runtime
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        export no_proxy="$NO_PROXY" AUTH_CLI_ORACLE_PYTHON="$CI_JOB_TEMP/venv/bin/python"
        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features developer-ssh-native --lib developer_ssh::login::cli::tests:: -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/proof/auth-cli-exact-runtime.log"
        grep -F 'test result: ok. 3 passed;' "$CI_JOB_TEMP/proof/auth-cli-exact-runtime.log"
    - name: Validate previously unreached original login API cases
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        export no_proxy="$NO_PROXY" AUTH_CLI_ORACLE_PYTHON="$CI_JOB_TEMP/venv/bin/python"
        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features developer-ssh-native --test developer_auth -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/proof/auth-original.log"
        grep -F 'test result: ok. 8 passed;' "$CI_JOB_TEMP/proof/auth-original.log"
    - name: Validate original SSH and setup CLI cases
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        export no_proxy="$NO_PROXY" DEVELOPER_CLI_ORACLE_PYTHON="$CI_JOB_TEMP/venv/bin/python"
        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features developer-ssh-native --test developer_cli_original -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/proof/developer-cli-original.log"
        grep -F 'test result: ok. 3 passed;' "$CI_JOB_TEMP/proof/developer-cli-original.log"
    - name: Validate affected SSH parser and existing scanner policies
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features developer-ssh-native --test developer_ssh -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/proof/ssh-regression.log"
        grep -F 'test result: ok. 27 passed;' "$CI_JOB_TEMP/proof/ssh-regression.log"
        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test argparse_scan -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/proof/scanner-regression.log"
        grep -F 'test result: ok. 2 passed;' "$CI_JOB_TEMP/proof/scanner-regression.log"
    - name: Validate strict auth and SSH Clippy
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features developer-ssh-native --lib --bin developer-auth --bin developer-auth-json --bin developer-ssh --bin setup-ssh-keys --test developer_auth --test developer_cli_original --test developer_ssh --test argparse_scan --test ci_disk_bootstrap -- -D warnings 2>&1 | tee "$CI_JOB_TEMP/proof/auth-clippy.log"
    - name: Seal Fast source and index after all maintained checks
      if: ${{ always() && env.DIAG_SOURCE != '' }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"

        if test -d "$CARGO_TARGET_DIR"; then
          find "$CARGO_TARGET_DIR" -name "*.d" -type f -exec sha256sum {} + > "$CI_JOB_TEMP/proof/build-dep-info.sha256"
        else
          : > "$CI_JOB_TEMP/proof/build-dep-info.sha256"
        fi

        if test -f "$CI_JOB_TEMP/proof/rust-tools.sha256"; then sha256sum --check "$CI_JOB_TEMP/proof/rust-tools.sha256"; fi
        if test -f "$CI_JOB_TEMP/proof/oracle-runtime.sha256"; then sha256sum --check "$CI_JOB_TEMP/proof/oracle-runtime.sha256"; fi
        if test -f "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256"; then
          find "$CI_JOB_TEMP/venv" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/oracle-venv-files.after.sha256"
          cmp "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256" "$CI_JOB_TEMP/proof/oracle-venv-files.after.sha256"
          find "$CI_JOB_TEMP/venv" -type l -printf '%p\t%l\n' | sort > "$CI_JOB_TEMP/proof/oracle-venv-links.after.txt"
          cmp "$CI_JOB_TEMP/proof/oracle-venv-links.before.txt" "$CI_JOB_TEMP/proof/oracle-venv-links.after.txt"
        fi
      id: source_final
    - name: Retain Fast job ownership evidence
      id: fast_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: diagnostic-fast-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded private Fast source
      id: fast_source_cleanup
      if: ${{ always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id !=
        '' && steps.fast_evidence.outputs.artifact-digest != '' && env.DIAG_SOURCE_OWNER != '' && steps.source_final.outcome
        == 'success' }}
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
        [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        rm -rf --one-file-system -- "$p"
    - name: Clean common owned Fast job temporary paths
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != ''
        && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success')
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
