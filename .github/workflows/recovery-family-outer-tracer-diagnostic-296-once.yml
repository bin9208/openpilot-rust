name: 296 recovery nested-tracer control-flow diagnostic
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/recovery-family-outer-tracer-diagnostic-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  recovery-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: defb9011df3fca924dca41a703b48ce5ff0c51e0
        persist-credentials: false
    - name: Bind exact current source and reserve disk
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = defb9011df3fca924dca41a703b48ce5ff0c51e0

        proof="$RUNNER_TEMP/recovery-current-${{ matrix.sample }}"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        '
    - name: Install recovery prerequisites and pinned Rust toolchain
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y tmux util-linux strace binutils capnproto libcapnp-dev g++ pkg-config cmake jq

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        '
    - name: Record hosted tracer, kernel and signal environment
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current-${{ matrix.sample }}\"\n{\n  printf '%s\\n' '--- uname\
        \ -a ---'\n  uname -a\n  printf '%s\\n' '--- /proc/version ---'\n  cat /proc/version\n  printf '%s\\n' '--- /proc/sys/kernel/yama/ptrace_scope\
        \ ---'\n  cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || true\n  printf '%s\\n' '--- strace --version ---'\n\
        \  strace --version\n  printf '%s\\n' '--- strace binary identity ---'\n  command -v strace\n  sha256sum \"$(command\
        \ -v strace)\"\n  printf '%s\\n' '--- supervisor shell signal status (not tracee) ---'\n  grep -E '^(Name|Pid|PPid|TracerPid|SigBlk|SigIgn|SigCgt):'\
        \ /proc/$$/status\n} > \"$proof/host-tracer-metadata.txt\"\n"
    - name: Install bounded provider-identity guard from reviewed source
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current-${{ matrix.sample }}"

        mkdir -p "$proof"

        base64 --decode <<''PAYLOAD'' > "$proof/verify_recovery_provider_identity.py"

        

        PAYLOAD

        printf ''%s  %s\n'' 654c518ba381912ededd96993ffaab3fbb4b8d3946afd994b2f4398a34a54684 "$proof/verify_recovery_provider_identity.py"
        | sha256sum --check --strict

        '
    - name: Compile all recovery components, harness and audit tools
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current-${{ matrix.sample }}"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery -p openpilot-process-supervision --bins --examples
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --bin list-cargo-tests
        --bin audit-recovery-exec --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery --lib --no-run --locked --message-format=json
        > "$proof/cwp-tests.jsonl"

        mapfile -t cwp < <(rust/target/debug/list-cargo-tests "$proof/cwp-tests.jsonl")

        test "${#cwp[@]}" -eq 1 && test -f "${cwp[0]}"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --test recovery_family_frozen
        --no-run --locked --message-format=json > "$proof/harness-tests.jsonl"

        mapfile -t harness < <(rust/target/debug/list-cargo-tests "$proof/harness-tests.jsonl")

        test "${#harness[@]}" -eq 1 && test -f "${harness[0]}"

        printf ''%s\n'' "${cwp[0]}" > "$proof/cwp-test-elf.path"

        printf ''%s\n'' "${harness[0]}" > "$proof/harness-test-elf.path"

        '
    - name: Run recovery units and strict Clippy before controller traffic
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current-${{ matrix.sample }}"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib recovery_
        --locked > "$proof/family-unit.stdout" 2> "$proof/family-unit.stderr"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib --bin
        audit-recovery-exec --test recovery_family_frozen --locked -- -D warnings > "$proof/clippy.stdout" 2> "$proof/clippy.stderr"

        '
    - name: Prepare private retained-source root and source-absence guards
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current-${{ matrix.sample }}\"\nprivate=\"$RUNNER_TEMP/recovery-private-current\"\
        \ntest ! -e \"$private\"\nmkdir -p \"$private/openpilot/selfdrive/carrot/recovery\" \"$private/openpilot/common\"\
        \ \"$private/rust/tools\"\ncp -a openpilot/selfdrive/carrot/recovery/server.py \"$private/openpilot/selfdrive/carrot/recovery/server.py\"\
        \ncp -a openpilot/common/repo_update.py \"$private/openpilot/common/repo_update.py\"\ncp -a openpilot/selfdrive/carrot/web\
        \ \"$private/openpilot/selfdrive/carrot/web\"\ngit rev-parse HEAD > \"$proof/source-before-traffic.txt\"\ntest \"\
        $(cat \"$proof/source-before-traffic.txt\")\" = defb9011df3fca924dca41a703b48ce5ff0c51e0\nfor root in \"$GITHUB_WORKSPACE\"\
        \ \"$private\"; do\n  for relative in \\\n    rust/tools/carrot_recovery_http_control.py \\\n    rust/tools/carrot_recovery_terminal_control.py\
        \ \\\n    rust/tools/carrot_recovery_terminal_lifecycle.py \\\n    rust/tools/carrot_recovery_support_control.py \\\
        \n    rust/tools/carrot_recovery_support_shutdown.py \\\n    rust/tools/carrot_recovery_actions_control.py \\\n  \
        \  rust/tools/check_carrot_recovery_upload.py \\\n    rust/tools/carrot_recovery_cwp_check.py \\\n    rust/tools/carrot_recovery_source.py\
        \ \\\n    rust/tools/carrot_recovery_support_source.py \\\n    rust/tools/carrot_recovery_cwp_source.py \\\n    rust/tools/carrot_recovery_actions_fixtures.py\
        \ \\\n    rust/tools/carrot_recovery_actions_tools.py; do\n    test ! -e \"$root/$relative\" && test ! -L \"$root/$relative\"\
        \n  done\ndone\ntest -d \"$GITHUB_WORKSPACE/rust/tools\" && test -d \"$private/rust/tools\"\nprintf '%s\\n' \"$private\"\
        \ > \"$proof/private-root.path\"\n"
    - name: Seal native providers and snapshot exact identity before traced lane
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current-${{ matrix.sample }}\"\n{\n printf '%s\\n' \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-carrot-recovery\"\
        \ \"$GITHUB_WORKSPACE/rust/target/debug/examples/recovery_actions\" \"$GITHUB_WORKSPACE/rust/target/debug/examples/upload\"\
        \ \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child\" \"$GITHUB_WORKSPACE/rust/target/debug/audit-recovery-exec\"\
        \ /usr/bin/tmux /usr/bin/strace\n cat \"$proof/cwp-test-elf.path\" \"$proof/harness-test-elf.path\"\n} > \"$proof/full-traffic-held-elfs.list\"\
        \nwhile IFS= read -r held; do\n test -f \"$held\" && test ! -L \"$held\"\n stat -c '%d %i %s %f %y %z' \"$held\"\n\
        \ sha256sum \"$held\"\ndone < \"$proof/full-traffic-held-elfs.list\" > \"$proof/full-traffic-elfs.before\"\n\npython3\
        \ \"$proof/verify_recovery_provider_identity.py\" snapshot --list \"$proof/full-traffic-held-elfs.list\" --output\
        \ \"$proof/full-traffic-elfs.before.json\"\nsha256sum \"$proof/verify_recovery_provider_identity.py\" > \"$proof/provider-identity-verifier.before.sha256\"\
        \n"
    - name: Reuse exact-source accepted untraced gate; pin same ELF build
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current-${{ matrix.sample }}\"\ntest \"$(git rev-parse HEAD)\"\
        \ = defb9011df3fca924dca41a703b48ce5ff0c51e0\ntest \"$(git rev-parse HEAD)\" = defb9011df3fca924dca41a703b48ce5ff0c51e0\n\
        verify_sha() { local path=\"$1\" expected=\"$2\"; printf '%s  %s\\n' \"$expected\" \"$path\" | sha256sum --check --strict;\
        \ }\nverify_sha rust/target/debug/openpilot-carrot-recovery 587850b16344dc6a2c14c01212da576ebc98400e68317bda47de24f847b5e2ff\n\
        verify_sha rust/target/debug/examples/recovery_actions de4409aa58f441031659fa545b5e0b3ed0cfa9f8996d7484a9dd8f660d0e8a23\n\
        verify_sha rust/target/debug/examples/upload 61da378ff131802273035dec9caa6649e9d98df53446846404e433612860d5ed\nverify_sha\
        \ rust/target/debug/openpilot-process-child 3c6b6a8f0d5ed838274ea28db84af002ed8e21320382f1838613ac4964f3d527\nverify_sha\
        \ rust/target/debug/audit-recovery-exec 903afa9fb4e67460c9ee75a8ac2ca35fad69e0938ed917de6343f64e0a3454c9\nverify_sha\
        \ \"$(cat \"$proof/cwp-test-elf.path\")\" 91d149e224012365ca8217e15999eb9bbf3d29f21023e189928177bb93876a4f\nverify_sha\
        \ \"$(cat \"$proof/harness-test-elf.path\")\" e0369e4a9ac34f9756cf620dbf2a7a0e749fcab6fdbd120461b7f6d43307cdec\ncat\
        \ > \"$proof/reused-functional-proof.json\" <<'JSON'\n{\n  \"proof_kind\": \"previous exact-source complete untraced\
        \ eight-controller lane\",\n  \"run_id\": \"39729659238\",\n  \"artifact_id\": \"12404562683\",\n  \"artifact_sha256\"\
        : \"66f56a8f1e4967c6daff36a22b0c8a4a89e875efb35794a293ec2be2d73f8fca\",\n  \"source_commit\": \"defb9011df3fca924dca41a703b48ce5ff0c51e0\"\
        ,\n  \"workflow_commit\": \"215ee443849f034947a0299f5029dadcad17b830\",\n  \"functional_lane_passed\": true,\n  \"\
        private_and_checkout_roots\": 2,\n  \"controllers_per_root\": 8,\n  \"same_elf_required_below\": true,\n  \"full_new_untraced_lane_rerun\"\
        : false,\n  \"prior_global_guard_ctime_failure\": \"parent audit isolated only two receipt-proven hardlink source\
        \ ctime changes; all other held identity fields and aliases matched\"\n}\nJSON\n"
    - name: Capture executable preflight for the unchanged full trace
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current-${{ matrix.sample }}"

        harness="$(cat "$proof/harness-test-elf.path")"

        cwp="$(cat "$proof/cwp-test-elf.path")"

        sha=$(rust/target/debug/audit-recovery-exec pre --receipt "$proof/exec-preflight.json" --native-root "$proof/traced-native"
        --server "$RECOVERY_FAMILY_BINARY" --actions "$RECOVERY_FAMILY_ACTIONS_EXAMPLE" --upload "$RECOVERY_FAMILY_UPLOAD_EXAMPLE"
        --child "$RECOVERY_FAMILY_PROCESS_CHILD" --cwp "$cwp" --tmux /usr/bin/tmux --harness "$harness" --host-path "$PATH")

        [[ "$sha" =~ ^[0-9a-f]{64}$ ]]

        printf ''%s\n'' "$sha" > "$proof/exec-preflight.sha256"

        '
    - name: Run unchanged inner full trace under bounded outer ptrace/wait tracer
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current-${{ matrix.sample }}\"\nexport RECOVERY_FAMILY_PRIVATE_ROOT=\"\
        $(cat \"$proof/private-root.path\")\"\nexport RECOVERY_FAMILY_CWP_TEST_BINARY=\"$(cat \"$proof/cwp-test-elf.path\"\
        )\"\nexport RECOVERY_FAMILY_FROZEN_EVIDENCE=\"$proof/traced-native\"\nharness=\"$(cat \"$proof/harness-test-elf.path\"\
        )\"\nsha=\"$(cat \"$proof/exec-preflight.sha256\")\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"\
        $RUNNER_TEMP\" --growth-mib 4096\npython3 - \"$proof/outer-strace-command.json\" <<'PY'\nimport json,os,sys\nproof=os.environ['RUNNER_TEMP']+'/recovery-current-'+os.environ['RECOVERY_DIAGNOSTIC_SAMPLE']\n\
        harness=open(proof+'/harness-test-elf.path').read().strip()\nargv=['/usr/bin/timeout','--signal=TERM','--kill-after=15','1800','strace','-qq','-s','4096','-xx','-e','trace=ptrace,wait4,waitid','-o',proof+'/tracer-control.log','strace','-ff','-qq','-s','32768','-xx','-e','trace=execve,execveat','-o',proof+'/exec',harness,'--exact','eight_native_recovery_controllers_same_elf_present_and_absent','--test-threads=1','--nocapture']\n\
        inner_index=argv.index('strace',7)\nopen(sys.argv[1],'w').write(json.dumps({'outer_no_follow':argv[:inner_index],'inner_unchanged':argv[inner_index:],'whole_command':argv,'deadline_seconds':1800},indent=2)+'\\\
        n')\nPY\nstatus=0\n/usr/bin/timeout --signal=TERM --kill-after=15 1800 strace -qq -s 4096 -xx -e trace=ptrace,wait4,waitid\
        \ -o \"$proof/tracer-control.log\" strace -ff -qq -s 32768 -xx -e trace=execve,execveat -o \"$proof/exec\" \"$harness\"\
        \ --exact eight_native_recovery_controllers_same_elf_present_and_absent --test-threads=1 --nocapture > \"$proof/traced-harness.stdout\"\
        \ 2> \"$proof/traced-harness.stderr\" || status=$?\naudit_status=0\nrust/target/debug/audit-recovery-exec post --receipt\
        \ \"$proof/exec-preflight.json\" --receipt-sha256 \"$sha\" --trace-dir \"$proof\" --output \"$proof/exec-audit.json\"\
        \ --harness-exit \"$status\" > \"$proof/exec-audit.stdout\" 2> \"$proof/exec-audit.stderr\" || audit_status=$?\ntest\
        \ \"$(sha256sum \"$proof/exec-preflight.json\" | cut -d ' ' -f 1)\" = \"$sha\"\ntest \"$status\" -eq 0 || { tail -n\
        \ 100 \"$proof/traced-harness.stdout\" \"$proof/traced-harness.stderr\"; exit \"$status\"; }\ntest \"$audit_status\"\
        \ -eq 0 || { cat \"$proof/exec-audit.stderr\"; exit \"$audit_status\"; }\ngrep -F '1 passed; 0 failed' \"$proof/traced-harness.stdout\"\
        \ntest -f \"$proof/traced-native/admission.json\"\ngit rev-parse HEAD > \"$proof/source-after-traffic.txt\"\ntest\
        \ \"$(cat \"$proof/source-after-traffic.txt\")\" = defb9011df3fca924dca41a703b48ce5ff0c51e0\nprivate=\"$(cat \"$proof/private-root.path\"\
        )\"\nfor relative in rust/tools/carrot_recovery_http_control.py rust/tools/carrot_recovery_terminal_control.py rust/tools/carrot_recovery_terminal_lifecycle.py\
        \ rust/tools/carrot_recovery_support_control.py rust/tools/carrot_recovery_support_shutdown.py rust/tools/carrot_recovery_actions_control.py\
        \ rust/tools/check_carrot_recovery_upload.py rust/tools/carrot_recovery_cwp_check.py rust/tools/carrot_recovery_source.py\
        \ rust/tools/carrot_recovery_support_source.py rust/tools/carrot_recovery_cwp_source.py rust/tools/carrot_recovery_actions_fixtures.py\
        \ rust/tools/carrot_recovery_actions_tools.py; do\n  test ! -e \"$GITHUB_WORKSPACE/$relative\" && test ! -L \"$GITHUB_WORKSPACE/$relative\"\
        \n  test ! -e \"$private/$relative\" && test ! -L \"$private/$relative\"\ndone\ndu -sm \"$proof\" > \"$proof/artifact-size-mib.txt\"\
        \ntest \"$(cut -f1 \"$proof/artifact-size-mib.txt\")\" -le 400\n"
    - name: Verify held provider identities with receipt-proven ctime exceptions only
      if: always()
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current-${{ matrix.sample }}"

        python3 "$proof/verify_recovery_provider_identity.py" snapshot --list "$proof/full-traffic-held-elfs.list" --output
        "$proof/full-traffic-elfs.after.json"

        python3 "$proof/verify_recovery_provider_identity.py" verify --before "$proof/full-traffic-elfs.before.json" --after
        "$proof/full-traffic-elfs.after.json" --audit "$proof/exec-audit.json" --output "$proof/full-traffic-provider-identity-audit.json"

        cmp "$proof/provider-identity-verifier.before.sha256" <(sha256sum "$proof/verify_recovery_provider_identity.py")

        '
    - name: Preserve all recovery diagnostic and controller evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-recovery-outer-tracer-control-${{ matrix.sample }}
        path: ${{ runner.temp }}/recovery-current-${{ matrix.sample }}/
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample:
        - 0
        - 1
    env:
      RECOVERY_DIAGNOSTIC_SAMPLE: ${{ matrix.sample }}
