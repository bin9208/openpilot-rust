          hexargv "$integration" "$selector" --exact --nocapture --test-threads=1 --color=never
          expected_argv=$vector
          run_bounded "negative-$n" 120s "$raw/negative-$n.log" 0 "$integration" "$selector" --exact --nocapture --test-threads=1 --color=never
          test_result "$raw/negative-$n.log" "$selector"
          audit_trace "$raw/negative-$n.log.exec" "negative-$n" "$integration" "$expected_argv"
        done
        negative_pass=true
        phase=public-missing-argument
        hexargv "$entry" setup-ssh-keys; entry_argv=$vector
        hexargv "$cli"; native_argv=$vector
        # install/fallback 대신 Rustup run의 두 exact tail만 허용한다.
        hexargv rustup run 1.94.0 rustc -vV; rustup_version_argv=$vector
        build_tail=(build --manifest-path "$source/rust/Cargo.toml" -p openpilot-dev-tools --features developer-ssh-native --bin setup-ssh-keys --locked --target x86_64-unknown-linux-gnu --target-dir "$CARGO_TARGET_DIR")
        hexargv rustup run 1.94.0 cargo "${build_tail[@]}"; rustup_build_argv=$vector
        hexargv cargo "${build_tail[@]}"; cargo_argv=$vector
        hexargv "$sdk/bin/cargo" "${build_tail[@]}"; cargo_absolute_argv=$vector
        run_bounded public-missing 300s "$raw/public.stdout" 1 "$entry" setup-ssh-keys
        printf '%s <github username>\n' "$cli" > "$proof/public.expected.stdout"
        cmp "$proof/public.expected.stdout" "$raw/public.stdout"
        # stderr의 Cargo 원문도 보존한다. native stdout/expected exit1은 별도 exact 검사다.
        audit_trace "$raw/public.stdout.exec" public "$entry" "$entry_argv"
        entry_pass=true
        phase=complete
    - name: Verify full prepared SDK after all attempted checks
      id: prepared_rust_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.prepared_rust.outcome
        == 'success') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        CARGO_HOME="$CI_JOB_TEMP/cargo-home" "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" after
    - name: Seal source and index after all attempted contracts
      id: source_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        du -sx --block-size=1 "$DIAG_SOURCE_OWNER" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/private-output-bytes.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$CI_JOB_TEMP/proof/cgroup-memory-after.txt"; fi
        find "$CARGO_TARGET_DIR" -name '*.d' -type f -exec sha256sum {} + > "$CI_JOB_TEMP/proof/build-dep-info.sha256" || test ! -d "$CARGO_TARGET_DIR"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        # source/SDK/provider 봉인은 qualify 실패 때도 별도로 수행한다.
        # 최종 metadata/dep-info 추가 뒤에도 동일 proof/raw 상한을 유지한다.
        for directory in "$CI_JOB_TEMP/proof" "$CI_JOB_TEMP/proof/raw"; do
          limit=$((1024 * 1024 * 1024))
          [[ $directory != "$CI_JOB_TEMP/proof/raw" ]] || limit=$((16 * 1024 * 1024))
          usage=$(find -P "$directory" -printf '%b %s\n' | awk '{b+=$1*512;s+=$2} END {printf "%.0f %.0f\n",b,s}')
          read -r allocated apparent <<< "$usage"
          [[ $allocated =~ ^[0-9]+$ && $apparent =~ ^[0-9]+$ ]]
          ((allocated <= limit && apparent <= limit))
        done
    - name: Require fresh scoped setup receipt and preserve pending retirement boundary
      id: closure
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
        SOURCE_OUTCOME: ${{ steps.source_final.outcome }}
        SDK_OUTCOME: ${{ steps.prepared_rust_final.outcome }}
      run: |
        set -euo pipefail
        test "$QUALIFY_OUTCOME" = success
        test "$SOURCE_OUTCOME" = success
        test "$SDK_OUTCOME" = success
        /usr/bin/jq -e --arg source "$GITHUB_SHA" --arg phase "$SETUP_SOURCE_PHASE" '
         .pass == true and .source_commit == $source and .source_phase == $phase and
         .controlled_semantic_cases == 21 and .rejection_tests == 3 and .public_missing_argument_calls == 1 and
         .public_exit_status == 1 and .original_python_executions == 0 and .full_network_cli_cases == 0 and
         .immutable_seals == true and .whole_python_absence_accepted == false and .retirement_credit == false
        ' "$CI_JOB_TEMP/proof/setup-receipt.json"
    - name: Upload setup frozen21 and public entry proof before owned cleanup
      id: fast_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: diagnostic-setup-keys-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded unchanged owned setup source after immutable seals
      id: fast_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome
        == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && env.DIAG_SOURCE_OWNER != '' && steps.source_final.outcome
        == 'success' && steps.prepared_rust_final.outcome == 'success' && steps.qualify.outputs.immutable_seals == 'true') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
        [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        rm -rf --one-file-system -- "$p"
    - name: Clean common owned job temporary paths after evidence upload
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome
        == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome ==
        'success') }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
