name: Python Rust 523 setup keys frozen21 and public missing argument
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-setup-keys.yml
    - rust/crates/dev-tools/tests/developer_cli_original.rs
    - rust/crates/dev-tools/tests/fixtures/setup-ssh-original/setup-effects-original.json
    - rust/crates/dev-tools/tests/fixtures/setup-ssh-original/README.md
    - rust/tools/run-developer-tool
    - rust/tools/prepare-readonly-ci-rust
    - rust/tools/check-disk-space
    - tools/scripts/setup_ssh_keys.py
    - rust/crates/dev-tools/tests/developer_cli_original/setup_frozen.rs
permissions:
  contents: read
concurrency:
  group: python-rust-523-setup-keys-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  setup-keys:
    name: Setup frozen21 semantic replay and one public no-argument entry
    if: ${{ github.repository == 'bin9208/openpilot-rust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
      SETUP_SOURCE_PHASE: pre-delete
    steps:
    - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied for setup qualification' >&2; exit 1; }
        set -euo pipefail
        test "$EVENT_NAME" = push
        test "$SOURCE_REF" = refs/heads/codex/feat-523-python-rust
        test "$GITHUB_ACTIONS" = true
        test -n "$RUNNER_NAME"
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Actions의 workspace와 Bash가 사용하는 private checkout을 구분한다.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/build/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$job/build/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Seal exact source HEAD and tracked index before checks
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      id: source_before
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        allocated=$(du -sx --block-size=1 "$DIAG_SOURCE_OWNER" | cut -f1)
        [[ $allocated =~ ^[0-9]+$ ]]
        printf '{"allocated_private_source_bytes":%s,"planned_source_growth_bytes":2147483648}\n' "$allocated" > "$CI_JOB_TEMP/proof/source-growth-after-checkout.json"
        git ls-tree -r -l HEAD | awk '$4 ~ /^[0-9]+$/ {bytes+=$4; files++} END {printf "{\"tracked_blob_bytes\":%.0f,\"files\":%d}\n",bytes,files}' > "$CI_JOB_TEMP/proof/tracked-source-size.json"
        ((allocated <= 2 * 1024 * 1024 * 1024))
    - name: Admit package growth and install native build and proof prerequisites
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        # Rust 설치는 아래 공통 before 단계가 private RUSTUP_HOME에서 담당한다.
        # 이 단계는 system package filesystem의 별도 1 GiB 설치 성장 추정이다.
        available=$(df -PB1 / | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_package_growth_bytes":%s}\n' "$available" "$required" > "$CI_JOB_TEMP/proof/package-growth-before.json"
        ((available >= required))
        sudo -n apt-get -o APT::Architecture=amd64 update > "$CI_JOB_TEMP/proof/apt-update.log" 2>&1
        sudo -n apt-get -o APT::Architecture=amd64 install -y --no-install-recommends \
          build-essential binutils capnproto libcapnp-dev libzmq3-dev pkg-config \
          jq strace curl ca-certificates xz-utils > "$CI_JOB_TEMP/proof/apt-install.log" 2>&1
        dpkg-query -W build-essential binutils capnproto libcapnp-dev libzmq3-dev pkg-config \
          jq strace curl ca-certificates xz-utils > "$CI_JOB_TEMP/proof/native-packages.txt"
        df -PB1 / "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/package-disk-after.txt"
    - name: Prepare and seal official Rust SDK in the owned private Rustup home
      id: prepared_rust
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        # SDK 설치 home과 qualification의 8 GiB build/cargo-home을 분리한다.
        CARGO_HOME="$CI_JOB_TEMP/cargo-home" "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before
    - name: Replay frozen setup21 and reach exact current public native entry once
      id: qualify
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        set +m
        umask 077
        source=$DIAG_SOURCE
        job=$CI_JOB_TEMP
        proof=$job/proof
        raw=$proof/raw
        build=$job/build
        sdk=$CI_PREPARED_RUST_ROOT
        mib=$((1024 * 1024))
        build_cap=$((8192 * mib))
        mkdir "$raw" "$proof/build" "$build" "$build/cargo-home" "$build/target" "$build/tmp" "$build/programs" "$build/entry-home" "$build/entry-params"
        test "$CARGO_HOME" = "$build/cargo-home"
        test "$CARGO_TARGET_DIR" = "$build/target"
        test "$RUNNER_ENVIRONMENT" = github-hosted
        rustup_root=$CI_PREPARED_RUSTUP_ROOT
        rustup_shim=$CI_PREPARED_RUSTUP_BIN
        test "$rustup_root" = "$job/rustup-home"
        test "$RUSTUP_HOME" = "$rustup_root"
        test "$sdk" = "$rustup_root/toolchains/1.94.0-x86_64-unknown-linux-gnu"
        test "$(readlink -e -- "$sdk")" = "$sdk"
        test "$CI_PREPARED_RUST_MANIFEST" = "$proof/prepared-rust-files.before.sha256"
        # 공통 before가 고정 official Rustup/SDK를 private job에 준비했다.
        # 설치 영역은 아래 8 GiB build cap 밖이며, before/after의 별도 owner/growth/seal 계약을 따른다.
        test "$rustup_shim" = "$job/cargo-home/bin/rustup"
        [[ -f $rustup_shim && ! -L $rustup_shim && -x $rustup_shim && $(readlink -e -- "$rustup_shim") == "$rustup_shim" ]]
        test "$(stat -c %u -- "$rustup_shim")" = "$(id -u)"
        export PATH="$sdk/bin:/usr/bin:/bin" LC_ALL=C
        unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
        unset LD_PRELOAD LD_LIBRARY_PATH BASH_ENV ENV
        entry=$source/rust/tools/run-developer-tool
        original=$source/tools/scripts/setup_ssh_keys.py
        fixture=$source/rust/crates/dev-tools/tests/fixtures/setup-ssh-original/setup-effects-original.json
        fixture_sha=444a47ecba9579d4042f26dd89f8438908b56d244a0f2c98c8b0dd3e1ef3a6ef
        entry_sha=2066721af9f04888d00cc8572c5374ed142bf6d5d658cbf12b97a02c5452ca39
        replay=setup_cli_original_status_default_decode_and_write_failure_order
        negatives=(setup_frozen::setup_frozen_rejects_wrong_pin_last_byte_truncation_and_extra_bytes
                   setup_frozen::setup_frozen_rejects_wrong_scope_metadata_roster_and_types
                   setup_frozen::setup_frozen_rejects_authored_input_and_criteria_drift)
        declare -A held_fd=() held_identity=() held_sha=() alias_target=() alias_identity=()
        declare -a roots=() root_names=()
        active_leader= active_watcher= active_stop=
        phase=preflight
        artifacts_ready=false
        replay_pass=false
        negative_pass=false
        entry_pass=false
        baseline_ready=false
        guard_ready=false

        identity() { stat -Lc '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$1"; }
        bind_file() {
          local path canonical before descriptor digest
          path=$1
          canonical=$(readlink -e -- "$path") || return 1
          [[ $canonical == /* && -f $canonical && ! -L $canonical ]] || return 1
          if [[ -v alias_target["$path"] ]]; then
            [[ ${alias_target[$path]} == "$canonical" && ${alias_identity[$path]} == "$(stat -c '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$path")" ]] || return 1
          else
            alias_target[$path]=$canonical
            alias_identity[$path]=$(stat -c '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$path") || return 1
          fi
          if [[ -v held_fd["$canonical"] ]]; then return 0; fi
          before=$(identity "$canonical") || return 1
          exec {descriptor}<"$canonical" || return 1
          [[ $(identity "/proc/$$/fd/$descriptor") == "$before" ]] || return 1
          digest=$(sha256sum "/proc/$$/fd/$descriptor") || return 1
          digest=${digest%% *}
          [[ $(identity "$canonical") == "$before" && $(identity "/proc/$$/fd/$descriptor") == "$before" ]] || return 1
          held_fd[$canonical]=$descriptor
          held_identity[$canonical]=$before
          held_sha[$canonical]=$digest
          printf '%s\t%s\t%s\n' "$canonical" "$before" "$digest" >> "$proof/held-before.tsv"
        }
        verify_held() {
          local path descriptor digest status=0
          for path in "${!alias_target[@]}"; do
            [[ $(readlink -e -- "$path") == "${alias_target[$path]}" && $(stat -c '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$path") == "${alias_identity[$path]}" ]] || status=1
          done
          for path in "${!held_fd[@]}"; do
            descriptor=${held_fd[$path]}
            if [[ $(identity "$path") != "${held_identity[$path]}" || $(identity "/proc/$$/fd/$descriptor") != "${held_identity[$path]}" ]]; then
              printf 'identity changed: %s\n' "$path" >&2; status=1; continue
            fi
            digest=$(sha256sum "/proc/$$/fd/$descriptor") || { status=1; continue; }
            digest=${digest%% *}
            [[ $digest == "${held_sha[$path]}" ]] || status=1
            [[ $(identity "$path") == "${held_identity[$path]}" && $(identity "/proc/$$/fd/$descriptor") == "${held_identity[$path]}" ]] || status=1
            printf '%s\t%s\t%s\n' "$path" "${held_identity[$path]}" "$digest" >> "$proof/held-after.tsv"
          done
          return "$status"
        }
        tree_seal() {
          local root=$1 out=$2
          # source의 .git 내부 lock/읽기 bookkeeping은 tracked index/tar 봉인과 별도로 취급한다.
          find -P "$root" -path "$source/.git" -prune -o -printf '%D:%i\t%m:%U:%G:%n\t%s\t%T@\t%C@\t%y\t%p\t%l\0' | sort -z > "$out.roster.bin" || return 1
          find -P "$root" -path "$source/.git" -prune -o -type f -print0 | sort -z | xargs -0 -r sha256sum > "$out.files.sha256" || return 1
          find -P "$root" -path "$source/.git" -prune -o -printf '%D:%i\t%m:%U:%G:%n\t%s\t%T@\t%C@\t%y\t%p\t%l\0' | sort -z > "$out.stable.bin" || return 1
          cmp "$out.roster.bin" "$out.stable.bin" || return 1
        }
        add_tree() {
          local name=$1 root=$2
          [[ -d $root && ! -L $root && $(readlink -e "$root") == "$root" ]] || return 1
          roots+=("$root"); root_names+=("$name")
          tree_seal "$root" "$proof/$name-before" || return 1
        }
        bind_dso() {
          local program=$1 line dependency
          bind_file "$program" || return 1
          # ldd의 shell/loader도 보존한다. vDSO와 static 진단은 실제 파일 provider가 아니다.
          if ldd "$program" > "$proof/ldd-current.txt" 2>&1; then
            while IFS= read -r line; do
              if [[ $line =~ ^[[:space:]]*linux-vdso\.so\.[0-9]+[[:space:]]+\(0x[0-9a-f]+\)$ ]]; then continue; fi
              if [[ $line =~ ^[[:space:]]*statically[[:space:]]linked[[:space:]]*$ ]]; then
                readelf -l "$program" > "$proof/static-current.txt" || return 1
                ! grep -q INTERP "$proof/static-current.txt" || return 1
                continue
              fi
              if [[ $line =~ ^[[:space:]]*[^[:space:]]+[[:space:]]+\=\>[[:space:]]+(/[^[:space:]]+)[[:space:]]+\(0x[0-9a-f]+\)$ ]]; then
                dependency=${BASH_REMATCH[1]}
              elif [[ $line =~ ^[[:space:]]*(/[^[:space:]]+)[[:space:]]+\(0x[0-9a-f]+\)$ ]]; then
                dependency=${BASH_REMATCH[1]}
              else printf 'unknown/missing DSO: %s\n' "$line" >&2; return 1; fi
              bind_file "$dependency" || return 1
            done < "$proof/ldd-current.txt"
          else
            grep -Eq '^[[:space:]]*(not a dynamic executable|statically linked)[[:space:]]*$' "$proof/ldd-current.txt" || return 1
            readelf -l "$program" > "$proof/static-current.txt" || return 1
            ! grep -q INTERP "$proof/static-current.txt" || return 1
          fi
          printf '\nPROGRAM %s\n' "$program" >> "$proof/provider-ldd.txt"
          cat "$proof/ldd-current.txt" >> "$proof/provider-ldd.txt" || return 1
        }

        build_usage() {
          local attempt usage code line relative root_identity bytes apparent
          local errors=$proof/build-budget-current.stderr
          local prefix="find: '$CARGO_TARGET_DIR/" suffix="': No such file or directory"
          [[ -d $build && ! -L $build && $(readlink -e "$build") == "$build" ]] || return 1
          root_identity=$(stat -c '%d:%i' -- "$build") || return 1
          for attempt in 1 2 3; do
            [[ $(stat -c '%d:%i' -- "$build") == "$root_identity" ]] || return 1
            code=0
            usage=$(
              set +e
              find -P "$build" -ignore_readdir_race -printf '%b %s\n' 2> "$errors" |
                awk '{b+=$1*512; s+=$2} END {printf "%.0f %.0f\n",b,s}'
              codes=("${PIPESTATUS[@]}")
              # An awk/read/write failure must never be treated as a find race.
              if ((codes[1] != 0)); then
                printf 'build budget awk failed: status=%s\n' "${codes[1]}" >&2
                exit 125
              fi
              exit "${codes[0]}"
            ) || code=$?
            [[ -d $build && ! -L $build && $(readlink -e "$build") == "$build" &&
               $(stat -c '%d:%i' -- "$build") == "$root_identity" ]] || return 1
            if [[ $code != 0 || -s $errors ]]; then
              printf 'attempt=%s find_or_reader_status=%s\n' "$attempt" "$code" >> "$proof/build-budget-errors.log" || return 1
              cat "$errors" >> "$proof/build-budget-errors.log" || return 1
            fi
            if [[ $code == 0 || $code == 1 ]]; then
              read -r bytes apparent <<< "$usage" || return 1
              [[ $bytes =~ ^[0-9]+$ && $apparent =~ ^[0-9]+$ ]] || return 1
              # Even an incomplete scan is sufficient to reject an observed
              # over-cap lower bound. Only a complete scan can admit a build.
              ((bytes <= build_cap && apparent <= build_cap)) || {
                printf 'planned cap exceeded: %s allocated=%s apparent=%s cap=%s\n' "$build" "$bytes" "$apparent" "$build_cap" >&2; return 1;
              }
            fi
            if [[ $code == 0 && ! -s $errors ]]; then printf '%s\n' "$usage"; return 0; fi
            # GNU find may stat a Cargo temp directory, then lose it before
            # descent. -ignore_readdir_race alone does not cover that failure.
            # Admit only the observed C-locale ENOENT under the mutable target;
            # immutable tree_seal, missing roots, permissions and unknowns fail.
            if [[ $code != 1 || ! -s $errors ]]; then
              printf 'build budget reader failed: status=%s\n' "$code" >&2; cat "$errors" >&2; return 1
            fi
            [[ -d $CARGO_TARGET_DIR && ! -L $CARGO_TARGET_DIR &&
               $(readlink -e "$CARGO_TARGET_DIR") == "$CARGO_TARGET_DIR" ]] || return 1
            while IFS= read -r line || [[ -n $line ]]; do
              if [[ $line != "$prefix"*"$suffix" ]]; then
                printf 'unknown build budget diagnostic: %s\n' "$line" >&2; return 1
              fi
              relative=${line#"$prefix"}; relative=${relative%"$suffix"}
              [[ $relative =~ ^[A-Za-z0-9_./+-]+$ ]] || return 1
              case "/$relative/" in *'/../'*|*'/./'*|*'//'*) return 1;; esac
              [[ ! -e $CARGO_TARGET_DIR/$relative && ! -L $CARGO_TARGET_DIR/$relative ]] || return 1
            done < "$errors"
            printf 'mutable-target-ENOENT attempt=%s/3\n' "$attempt" >> "$proof/build-budget-errors.log" || return 1
          done
          printf 'build budget sampling failed: mutable target ENOENT retries exhausted\n' >&2
          return 1
        }

        bind_native() {
          local path=$1
          test "$(head -c 4 "$path" | od -An -tx1 | tr -d ' \n')" = 7f454c46 || return 1
          bind_dso "$path"
        }
        phase_source() {
          case "$SETUP_SOURCE_PHASE" in
            pre-delete)
              [[ -f $original && ! -L $original ]] || return 1
              printf '%s  %s\n' ab157e4943734c969ffc1e8113dc9d09ded355f3463da34c2b9132fc24181f3f "$original" | sha256sum --check --strict --quiet - || return 1 ;;
            absent) [[ ! -e $original && ! -L $original ]] || return 1 ;;
            *) printf 'unknown explicit setup source phase: %s\n' "$SETUP_SOURCE_PHASE" >&2; return 1 ;;
          esac
        }
        growth() {
          local label=$1 mib=$2
          [[ $guard_ready == true && -x $disk_guard && $(identity "$disk_guard") == "${held_identity[$disk_guard]}" &&
             $(identity "/proc/$$/fd/${held_fd[$disk_guard]}") == "${held_identity[$disk_guard]}" ]] || return 1
          # 같은 source-derived cache와 prepared SDK 검사를 재사용한다. run_bounded는 growth를 호출하지 않는다.
          CARGO_TARGET_DIR="$guard_target" run_bounded "growth-$label-build" 60s "$proof/growth-$label-build.json" 0 \
            "${guard_environment[@]}" "$source/rust/tools/check-disk-space" --path "$build" --growth-mib "$mib" || return 1
          if [[ $(stat -c %d "$source") != "$(stat -c %d "$build")" ]]; then
            CARGO_TARGET_DIR="$guard_target" run_bounded "growth-$label-source" 60s "$proof/growth-$label-source.json" 0 \
              "${guard_environment[@]}" "$source/rust/tools/check-disk-space" --path "$source" --growth-mib "$mib" || return 1
          fi
        }
        budgets() {
          local usage bytes apparent path cap
          usage=$(build_usage) || return 1
          read -r bytes apparent <<< "$usage" || return 1
          [[ $bytes =~ ^[0-9]+$ && $apparent =~ ^[0-9]+$ ]] || return 1
          ((bytes <= build_cap && apparent <= build_cap)) || return 1
          for path in "$DIAG_SOURCE_OWNER" "$proof" "$raw"; do
            case "$path" in "$DIAG_SOURCE_OWNER") cap=$((2048 * mib));; "$proof") cap=$((1024 * mib));; *) cap=$((16 * mib));; esac
            usage=$(find -P "$path" -printf '%b %s\n' | awk '{b+=$1*512;s+=$2} END {printf "%.0f %.0f\n",b,s}') || return 1
            read -r bytes apparent <<< "$usage" || return 1
            [[ $bytes =~ ^[0-9]+$ && $apparent =~ ^[0-9]+$ ]] || return 1
            ((bytes <= cap && apparent <= cap)) || { printf 'planned cap exceeded: %s %s %s cap=%s\n' "$path" "$bytes" "$apparent" "$cap" >&2; return 1; }
          done
          find -P "$proof" \( ! -type f ! -type d \) -o \( -type f \( -links +1 -o -size +536870912c \) \) > "$proof/budget-rejected.txt" || return 1
          test ! -s "$proof/budget-rejected.txt"
        }
        run_bounded() {
