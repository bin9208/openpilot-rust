{
  "name": "296 route-vault native bundle focused qualification at ebe561e0",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/route-vault-bundle-296-once.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "296-route-vault-bundle-ebe-${{ github.ref }}",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "env": {
    "CONTROL_SHA": "7c2b88668f37c804b2ded2697d4e22d414a093a68fd771af8f11519d8df88ac2",
    "SOURCE_SHA": "ebe561e0f627c513d524f0fd0acc6c108f570500",
    "RUSTUP_TOOLCHAIN": "1.94.0",
    "CARGO_INCREMENTAL": "0",
    "CARGO_BUILD_JOBS": "1",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "LC_ALL": "C.UTF-8",
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "bundle": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 120,
      "steps": [
        {
          "name": "Require trusted local validation branch",
          "shell": "bash",
          "run": "set -euo pipefail\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n"
        },
        {
          "name": "Common owned job temp",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Admit operation growth and allocate fresh private source",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\n[[ $GITHUB_ACTIONS == true && $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ -z ${GIT_DIR:-} && -z ${GIT_WORK_TREE:-} && -z ${GIT_CONFIG_COUNT:-} ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${GCONV_PATH:-} && -z ${GCONV_MODULES_CACHE:-} ]]\njob=$CI_JOB_TEMP\n[[ $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\nmkdir \"$job/proof\" \"$job/tools\" \"$job/home\" \"$job/cache\" \"$job/tmp\" \"$job/cargo\" \"$job/rustup\" \"$job/toolcache\" \"$job/bin\"\nprintf 'RV_JOB=%s\\nRV_JOB_ID=%s\\nRV_WORKSPACE=%s\\n' \"$job\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$workspace\" >> \"$GITHUB_ENV\"\ndf -PB1 \"$workspace\" \"$job\" > \"$job/proof/disk.before.txt\"\ncat /proc/meminfo > \"$job/proof/memory.before.txt\"\nprintf '%s\\n' \"$RUNNER_NAME\" \"$RUNNER_ENVIRONMENT\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" > \"$job/proof/runner.txt\"\n# Growth estimates, not a machine reserve: source checkout2GiB; fresh toolchain2,\n# registry2, target8, private Python1, proof0.5GiB. Combine only on same filesystem.\navail_job=$(df -PB1 \"$job\" | awk 'NR==2{print $4}')\navail_source=$(df -PB1 \"$workspace\" | awk 'NR==2{print $4}')\nsource_growth=$((2*1024*1024*1024)); job_growth=$((27*1024*1024*1024/2))\nprintf '{\"source_growth_bytes\":%s,\"job_growth_bytes\":%s,\"source_available_bytes\":%s,\"job_available_bytes\":%s,\"fixed_reserve_bytes\":0}\\n' \"$source_growth\" \"$job_growth\" \"$avail_source\" \"$avail_job\" > \"$job/proof/growth.before.json\"\nif [[ $(stat -c %d \"$job\") == \"$(stat -c %d \"$workspace\")\" ]]; then\n ((avail_job >= job_growth + source_growth))\nelse\n ((avail_job >= job_growth && avail_source >= source_growth))\nfi\nowner=$(mktemp -d \"$workspace/.rv296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX\")\nprintf '%s:%s:%s\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" > \"$owner/.rv-owner\"\nmkdir \"$owner/source\"\n{\n printf 'RV_OWNER=%s\\nRV_OWNER_ID=%s\\nRV_SOURCE=%s/source\\nRV_CHECKOUT_PATH=%s/source\\n' \"$owner\" \"$(stat -c '%d:%i:%u' \"$owner\")\" \"$owner\" \"${owner#\"$workspace/\"}\"\n printf 'HOME=%s/home\\nCARGO_HOME=%s/cargo\\nRUSTUP_HOME=%s/rustup\\nCARGO_TARGET_DIR=%s/target\\nRUNNER_TOOL_CACHE=%s/toolcache\\nXDG_CACHE_HOME=%s/cache\\nTMPDIR=%s/tmp\\n' \"$job\" \"$job\" \"$job\" \"$job\" \"$job\" \"$job\" \"$job\"\n printf 'GIT_CONFIG_GLOBAL=%s/gitconfig\\nGIT_CONFIG_NOSYSTEM=1\\nPYTHONPATH=\\nPYTHONHOME=\\nPYTHONDONTWRITEBYTECODE=1\\nRUSTFLAGS=\\nCARGO_ENCODED_RUSTFLAGS=\\nRUSTC_WRAPPER=\\nRUSTC_WORKSPACE_WRAPPER=\\nCARGO_BUILD_TARGET=\\nLD_LIBRARY_PATH=\\n' \"$job\"\n} >> \"$GITHUB_ENV\"\nprintf 'source=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\njob=%s\\nsource_owner=%s\\njob_identity=%s\\nsource_owner_identity=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$owner\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$(stat -c '%d:%i:%u' \"$owner\")\" > \"$job/proof/binding.txt\"\n"
        },
        {
          "name": "Write hash-pinned focused metadata only",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/pins.json\"\\nPAYLOAD\nprintf '%s  %s\\n' ac9ece5c0561f16e50cfb358a3cd3ec94ddef09f38693e5af7246a7a5c76fbce \"$CI_JOB_TEMP/tools/pins.json\" | sha256sum --check --strict -\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/control.py\"\\nPAYLOAD\nprintf '%s  %s\\n' 7c2b88668f37c804b2ded2697d4e22d414a093a68fd771af8f11519d8df88ac2 \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/exec_audit.py\"\\nPAYLOAD\nprintf '%s  %s\\n' ae882a592e17bb42abe66b01b48b53ff40a447aaa8381b1c7103a230e635a8e7 \"$CI_JOB_TEMP/tools/exec_audit.py\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Checkout exact integrated source independently of workflow SHA",
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "ebe561e0f627c513d524f0fd0acc6c108f570500",
            "path": "${{ env.RV_CHECKOUT_PATH }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Expose Rust shims through the accepted common interface",
          "uses": "bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Private Python for unchanged original oracle",
          "id": "python",
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12.14",
            "cache": "",
            "update-environment": false
          }
        },
        {
          "name": "Provision only private toolchain and oracle runtime",
          "shell": "bash",
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ $(git -C \"$RV_SOURCE\" rev-parse HEAD) == \"$SOURCE_SHA\" ]]\nfor tool in git strace readelf ldd cc ar timeout base64 gzip; do command -v \"$tool\"; done > \"$job/proof/available-tools.txt\"\n# Existing helpers expose shims; install only inside the private toolchain home.\nRV_RUSTUP=$(command -v rustup)\ntimeout --signal=TERM --kill-after=10s 900s \"$RV_RUSTUP\" toolchain install 1.94.0 --profile minimal --component clippy > \"$job/proof/toolchain-install.stdout\" 2> \"$job/proof/toolchain-install.stderr\"\nRV_CARGO=$(\"$RV_RUSTUP\" which --toolchain 1.94.0 cargo)\nRV_RUSTC=$(\"$RV_RUSTUP\" which --toolchain 1.94.0 rustc)\nRV_CLIPPY=$(\"$RV_RUSTUP\" which --toolchain 1.94.0 clippy-driver)\n[[ $RV_CARGO == \"$RUSTUP_HOME\"/toolchains/*/bin/cargo && $RV_RUSTC == \"$RUSTUP_HOME\"/toolchains/*/bin/rustc && $RV_CLIPPY == \"$RUSTUP_HOME\"/toolchains/*/bin/clippy-driver ]]\nRV_PY_BASE=$(dirname \"$(dirname \"$(realpath -e -- \"$RV_SETUP_PYTHON\")\")\")\n[[ $RV_PY_BASE == \"$RUNNER_TOOL_CACHE\"/Python/3.12.14/* ]]\nRV_PY_LIB=\"$RV_PY_BASE/lib\"\nLD_LIBRARY_PATH=\"$RV_PY_LIB\" \"$RV_SETUP_PYTHON\" -I -B -m venv --without-pip --copies \"$job/venv\"\nRV_PYTHON=\"$job/venv/bin/python\"\nln -s /usr/bin/git \"$job/bin/git\"\ncat > \"$job/bin/python3\" <<'WRAPPER'\n#!/bin/bash\n# Explicit oracle/metadata loader boundary, never a native ELF loader override.\nunset LD_PRELOAD\nexport LD_LIBRARY_PATH=\"$RV_PY_LIB\"\nexec \"$RV_PYTHON\" \"$@\"\nWRAPPER\nchmod u+x \"$job/bin/python3\"\nRV_BUILD_PATH=\"$(dirname \"$RV_CARGO\"):$(dirname \"$RV_RUSTUP\"):/usr/bin:/bin\"\n{\n printf 'RV_RUSTUP=%s\\nRV_CARGO=%s\\nRV_RUSTC=%s\\nRV_CLIPPY=%s\\nRV_BUILD_PATH=%s\\nRV_PY_BASE=%s\\nRV_PY_LIB=%s\\nRV_PYTHON=%s\\nRUSTC=%s\\nLD_LIBRARY_PATH=\\n' \"$RV_RUSTUP\" \"$RV_CARGO\" \"$RV_RUSTC\" \"$RV_CLIPPY\" \"$RV_BUILD_PATH\" \"$RV_PY_BASE\" \"$RV_PY_LIB\" \"$RV_PYTHON\" \"$RV_RUSTC\"\n} >> \"$GITHUB_ENV\"\nLD_LIBRARY_PATH=\"$RV_PY_LIB\" \"$RV_PYTHON\" -I -B -VV > \"$job/proof/python.txt\"\n\"$RV_RUSTC\" -vV > \"$job/proof/rustc.txt\"\n/usr/bin/git --version > \"$job/proof/git.txt\"\n",
          "env": {
            "RV_SETUP_PYTHON": "${{ steps.python.outputs.python-path }}"
          }
        },
        {
          "name": "Build once lint and qualify exact eighteen tests plus one committed pair",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf \"%s  %s\\n\" \"$CONTROL_SHA\" \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\nLD_LIBRARY_PATH=\"$RV_PY_LIB\" \"$RV_PYTHON\" -I -B \"$CI_JOB_TEMP/tools/control.py\" qualify > \"$CI_JOB_TEMP/proof/qualify.stdout\" 2> \"$CI_JOB_TEMP/proof/qualify.stderr\"\n",
          "id": "qualification"
        },
        {
          "name": "Always require source ownership quiescence and validation seal",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf \"%s  %s\\n\" \"$CONTROL_SHA\" \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\nLD_LIBRARY_PATH=\"$RV_PY_LIB\" \"$RV_PYTHON\" -I -B \"$CI_JOB_TEMP/tools/control.py\" seal > \"$CI_JOB_TEMP/proof/seal.stdout\" 2> \"$CI_JOB_TEMP/proof/seal.stderr\"\n",
          "id": "validation_seal",
          "if": "${{ always() && env.RV_SOURCE != '' && env.RV_PYTHON != '' }}"
        },
        {
          "name": "Always retain bounded raw success or failure evidence",
          "shell": "bash",
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ -d $job && ! -L $job && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\n[[ $(stat -c '%d:%i:%u' \"$job\") == \"$RV_JOB_ID\" ]]\nmkdir -p \"$job/artifact\"\nif [[ -n ${RV_PYTHON:-} && -x $RV_PYTHON && -f $job/tools/control.py ]]; then\n if LD_LIBRARY_PATH=\"$RV_PY_LIB\" \"$RV_PYTHON\" -I -B \"$job/tools/control.py\" package > \"$job/proof/package.stdout\" 2> \"$job/proof/package.stderr\"; then echo 'complete=true' >> \"$GITHUB_OUTPUT\"; exit 0; fi\nfi\nrm -f -- \"$job/artifact/proof.tar.gz\" \"$job/artifact/proof.sha256\" \"$job/artifact/COMPLETE\"\nprintf 'complete=false\\n' >> \"$GITHUB_OUTPUT\"\n# No success seal is inferred. Capture a bounded raw envelope after early failure\n# or unconfirmed quiescence; retain the source/target/job namespace for review.\n{\n printf 'status=unqualified-partial-envelope\\nsource=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\njob=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\"\n for p in binding.txt runner.txt available-tools.txt growth.before.json qualify.stderr seal.stderr package.stderr toolchain-install.stderr build.stderr test-compile.stderr clippy.stderr unit.stderr integration.stderr context-original.stderr context-native.stderr; do\n  if [[ -f $job/proof/$p && ! -L $job/proof/$p ]]; then printf '\\nfile=%s; first131072bytes\\n' \"$p\"; head -c 131072 \"$job/proof/$p\"; fi\n done\n if [[ -f $job/active.json && ! -L $job/active.json ]]; then head -c 131072 \"$job/active.json\"; fi\n} > \"$job/artifact/failure-envelope.txt\"\n",
          "id": "package_evidence",
          "if": "${{ always() && env.RV_JOB_ID != '' }}"
        },
        {
          "name": "Upload bounded raw qualification evidence",
          "uses": "actions/upload-artifact@v6",
          "id": "evidence",
          "if": "${{ always() && steps.package_evidence.outcome == 'success' }}",
          "with": {
            "name": "route-vault-bundle-ebe-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CI_JOB_TEMP }}/artifact",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Clean source only after successful qualification seal and upload",
          "shell": "bash",
          "run": "set -euo pipefail\n[[ $QUALIFICATION == success && $SEAL == success && $PACK == success && $UPLOAD == success ]]\n[[ $UPLOAD_ID =~ ^[0-9]+$ && $UPLOAD_DIGEST =~ ^(sha256:)?[a-fA-F0-9]{64}$ ]]\nLD_LIBRARY_PATH=\"$RV_PY_LIB\" \"$RV_PYTHON\" -I -B \"$CI_JOB_TEMP/tools/control.py\" cleanup-check\n# Metadata rechecks root marker/devinoUID, source/ref, provider/ELF seals and\n# namespace quiescence. Only this exclusive source owner is deleted here.\nrm -rf --one-file-system -- \"$RV_OWNER\"\n",
          "id": "source_cleanup",
          "if": "${{ always() && steps.qualification.outcome == 'success' && steps.validation_seal.outcome == 'success' && steps.package_evidence.outcome == 'success' && steps.package_evidence.outputs.complete == 'true' && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' }}",
          "env": {
            "QUALIFICATION": "${{ steps.qualification.outcome }}",
            "SEAL": "${{ steps.validation_seal.outcome }}",
            "PACK": "${{ steps.package_evidence.outcome }}",
            "UPLOAD": "${{ steps.evidence.outcome }}",
            "UPLOAD_ID": "${{ steps.evidence.outputs.artifact-id }}",
            "UPLOAD_DIGEST": "${{ steps.evidence.outputs.artifact-digest }}"
          }
        },
        {
          "name": "Clean common owned temp only after uploaded qualified source cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "if": "${{ always() && steps.qualification.outcome == 'success' && steps.validation_seal.outcome == 'success' && steps.package_evidence.outcome == 'success' && steps.package_evidence.outputs.complete == 'true' && steps.source_cleanup.outcome == 'success' && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' }}",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  }
}
