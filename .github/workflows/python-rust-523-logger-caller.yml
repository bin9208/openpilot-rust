name: Python Rust 523 exact original logger caller
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-logger-caller.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: python-rust-523-logger-caller-${{ github.ref }}
  cancel-in-progress: false
  queue: max
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  logger-runtime:
    name: rust original route logger
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CI296_ALIAS_BASENAME: .ci296-source-rust--logger-runtime
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
    - name: Deny fork source and require GitHub-hosted Linux X64
      shell: bash
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
        CI296_HOST_CONTROL: '1'
      run: 'test "${SOURCE_ALLOWED:-}" = true || { echo ''Fork PR source denied on persistent bin-actions'' >&2;
        exit 1; }

        set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust

        test "$RUNNER_ENVIRONMENT" = github-hosted

        test "$RUNNER_OS" = Linux

        test "$RUNNER_ARCH" = X64

        test "$(uname -s)" = Linux

        test "$(uname -m)" = x86_64

        '
      working-directory: ${{ github.workspace }}
    - name: Common owned job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env: &id001
        CI296_HOST_CONTROL: '1'
    - name: Allocate private source cache target and local action alias before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env: *id001
      run: 'set -euo pipefail

        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")

        job=$CI_JOB_TEMP

        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"

        test "$(cat "$job/owner")" = "$owner"

        umask 077

        mkdir "$job/proof" "$job/home" "$job/cache"

        # Source capacity is checked on the actual source filesystem BEFORE checkout.

        available=$(df -PB1 "$workspace" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        required=$((2 * 1024 * 1024 * 1024))

        printf ''{"available_bytes":%s,"planned_source_growth_bytes":%s}\n'' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"

        ((available >= required))

        source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")

        printf ''%s\n'' "$owner" > "$source_owner/.ci296-owner"

        mkdir "$source_owner/source"

        source="$source_owner/source"

        # Preserve Actions'' real workspace separately. Only Bash consumers see the

        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.

        printf ''source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n'' "$BASH_ENV"
        "$workspace" "$source" > "$job/ci296-shell-env"

        printf ''%s\n'' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat
        -c ''%d:%i'' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home"
        "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache"
        "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env"
        >> "$GITHUB_ENV"

        printf ''owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n''
        "$owner" "$job" "$workspace" "$source_owner" "$(stat -c ''%d:%i'' -- "$source_owner")" "$source" "$GITHUB_SHA"
        > "$job/proof/ownership.txt"

        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"

        cat /proc/meminfo > "$job/proof/memory-before.txt"

        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt";
        fi

        printf ''%s\n'' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"


        alias_path="$workspace/$CI296_ALIAS_BASENAME"

        case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac

        [[ $CI296_ALIAS_BASENAME != */* ]]

        # -T makes this an exclusive atomic link, never traversal into a stale directory.

        ln -sT -- "$source_owner" "$alias_path"

        printf ''%s\n'' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c ''%d:%i'' -- "$alias_path")"
        "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"

        printf ''source_alias=%s\nalias_identity=%s\n'' "$alias_path" "$(stat -c ''%d:%i'' -- "$alias_path")" >>
        "$job/proof/ownership.txt"

        '
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
        path: ${{ env.CI296_CHECKOUT_PATH }}
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact private source and index
      id: ci296_source_admission
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        test "$PWD" = "$CI296_SOURCE"

        test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git diff --exit-code

        git diff --cached --exit-code

        printf ''%s\n'' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"

        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"

        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
        1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"

        '
    - name: Require reviewed maintained logger source
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: 'set -euo pipefail

        printf ''%s  %s\n'' cdd065918b16a228e711d1c46904fb9563d23fb765d55597f2f25a0a660fb643 .github/workflows/rust.yml
        | sha256sum --check --strict -

        '
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env: *id001
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Keep original Python installations private
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        available=$(df -PB1 "$CI_JOB_TEMP" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        ((available >= 512 * 1024 * 1024))

        python -m venv "$CI_JOB_TEMP/venv"

        printf ''%s\n'' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"

        '
    - run: sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update && sudo apt-get -o "APT::Architectures=$(dpkg
        --print-architecture)" install --no-install-recommends -y g++ clang libclang-dev capnproto libcapnp-dev
        libavcodec-dev libavformat-dev libavutil-dev libzstd-dev libyuv-dev libzmq5 ffmpeg strace
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri,rust-src
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0
        PyJWT==2.15.1 requests==2.34.2 cryptography==50.0.1

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: cargo test -p openpilot-loggerd --locked
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: cargo test -p openpilot-msgq --test queued --locked
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        cargo build -p openpilot-loggerd -p openpilot-logmessaged -p openpilot-uploader --locked

        cargo +1.94.0 build -p openpilot-dev-tools --features route-upload-native --bin check-runtime-log-upload
        --locked

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Check route controller receipts, admission and owned lifecycle cleanup
      run: 'cargo +1.94.0 test -p openpilot-dev-tools --features route-upload-native --lib route_upload_check::
        --locked

        cargo +1.94.0 test -p openpilot-dev-tools --features route-upload-native --test route_upload_check --test
        route_upload_lifecycle --locked -- --test-threads=1

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Verify managed crash recording and existing route upload
      run: "target/debug/check-runtime-log-upload --root \"$GITHUB_WORKSPACE\" \\\n  --binaries target/debug --output\
        \ \"$RUNNER_TEMP/runtime-log-upload\"\n"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: cargo build -p openpilot-logging --example native_logging_probe --locked
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build -p openpilot-dev-tools --bin build-native-logging-reference --bin build-loggerd-source --locked

        cargo build -p openpilot-dev-tools --no-default-features --features native-logging-check-native --bin check-native-logging
        --locked

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Compare shared native logging context, transport and rate-limit boundaries
      run: "\"$CARGO_TARGET_DIR/debug/check-native-logging\" \\\n  --binary \"$CARGO_TARGET_DIR/debug/examples/native_logging_probe\"\
        \ \\\n  --builder \"$CARGO_TARGET_DIR/debug/build-native-logging-reference\" \\\n  --root \"$CI296_SOURCE\"\
        \ \\\n  --source-policy absent \\\n  --output \"$RUNNER_TEMP/native-logging\""
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Build original native logger and encoder producers
      run: 'python tools/build_msgq_python.py --output "$RUNNER_TEMP/logger-msgq"

        target/debug/build-loggerd-source --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/logger-original"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Compare complete native route logs, media, fallback and signal paths
      run: "PYTHONPATH=\"$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\" python tools/check_loggerd_native.py\
        \ \\\n  --binary target/debug/openpilot-loggerd --original \"$RUNNER_TEMP/logger-original/original-loggerd\"\
        \ \\\n  --producer \"$RUNNER_TEMP/logger-original/original-encoder-producer\" --output \"$RUNNER_TEMP/logger-native\"\
        \ --edges --hevc --fallbacks\n"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Check diagnostic accounting, suppression and complete collector path
      run: "PYTHONPATH=\"$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\" python tools/check_loggerd_diagnostics.py\
        \ \\\n  --binary target/debug/openpilot-loggerd --original \"$RUNNER_TEMP/logger-original/original-loggerd\"\
        \ \\\n  --fixtures \"$RUNNER_TEMP/logger-native/fixtures\" --output \"$RUNNER_TEMP/logger-counters\"\nPYTHONPATH=\"\
        $RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\" python tools/check_loggerd_log_pipeline.py\
        \ \\\n  --binary target/debug/openpilot-loggerd --original \"$RUNNER_TEMP/logger-original/original-loggerd\"\
        \ \\\n  --collector target/debug/openpilot-logmessaged --fixture \"$RUNNER_TEMP/logger-native/fixtures/road/0000.capnp\"\
        \ \\\n  --output \"$RUNNER_TEMP/logger-pipeline\"\n"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Compare log-file flush and close syscalls with the original writer
      run: "PYTHONPATH=\"$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\" python tools/check_loggerd_flush.py\
        \ \\\n  --binary target/debug/openpilot-loggerd --original \"$RUNNER_TEMP/logger-original/original-loggerd\"\
        \ --output \"$RUNNER_TEMP/logger-flush\"\nPYTHONPATH=\"$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\"\
        \ python tools/check_loggerd_io.py \\\n  --binary target/debug/openpilot-loggerd --original \"$RUNNER_TEMP/logger-original/original-loggerd\"\
        \ \\\n  --fixtures \"$RUNNER_TEMP/logger-native/fixtures\" --output \"$RUNNER_TEMP/logger-io\"\n"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Check pure Rust rotation boundaries with Miri
      env:
        MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1
      run: cargo +nightly-2026-09-29 miri test -p openpilot-loggerd --lib rotation::tests --locked
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Build Rust and msgq boundary with AddressSanitizer
      env:
        CARGO_TARGET_DIR: ${{ env.CI_JOB_TEMP }}/logger-asan-target
        RUSTFLAGS: -Zsanitizer=address
        CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
      run: cargo +nightly-2026-09-29 build -p openpilot-loggerd --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - name: Exercise native logger and media ownership with AddressSanitizer
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      run: "PYTHONPATH=\"$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\" python tools/check_loggerd_native.py\
        \ \\\n  --binary \"$RUNNER_TEMP/logger-asan-target/x86_64-unknown-linux-gnu/debug/openpilot-loggerd\" \\\
        \n  --original \"$RUNNER_TEMP/logger-original/original-loggerd\" --producer \"$RUNNER_TEMP/logger-original/original-encoder-producer\"\
        \ \\\n  --fixtures \"$RUNNER_TEMP/logger-native/fixtures\" --output \"$RUNNER_TEMP/logger-asan\" --edges\
        \ --hevc\nPYTHONPATH=\"$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools\" python\
        \ tools/check_loggerd_io.py \\\n  --binary \"$RUNNER_TEMP/logger-asan-target/x86_64-unknown-linux-gnu/debug/openpilot-loggerd\"\
        \ \\\n  --original \"$RUNNER_TEMP/logger-original/original-loggerd\" --fixtures \"$RUNNER_TEMP/logger-native/fixtures\"\
        \ \\\n  --remux-only --output \"$RUNNER_TEMP/logger-asan-io\"\n"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}/rust
    - uses: actions/upload-artifact@v6
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always()) }}
      with:
        name: rust-route-logger-evidence
        path: '${{ env.CI_JOB_TEMP }}/logger-native/

          ${{ env.CI_JOB_TEMP }}/logger-asan/

          ${{ env.CI_JOB_TEMP }}/logger-asan-io/

          ${{ env.CI_JOB_TEMP }}/logger-flush/

          ${{ env.CI_JOB_TEMP }}/logger-io/

          ${{ env.CI_JOB_TEMP }}/logger-counters/

          ${{ env.CI_JOB_TEMP }}/logger-pipeline/

          ${{ env.CI_JOB_TEMP }}/runtime-log-upload/

          ${{ env.CI_JOB_TEMP }}/native-logging/

          ${{ env.CI_JOB_TEMP }}/logger-original/*.json

          ${{ env.CI_JOB_TEMP }}/logger-original/*.log

          '
      id: local_evidence_1
    - name: Seal private source and index after maintained checks
      id: ci296_source_seal
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"

        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"

        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
        1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"

        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"

        git diff --exit-code

        git diff --cached --exit-code

        df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"

        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"

        '
    - name: Retain private job ownership and source evidence
      id: ci296_private_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: private-rust-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        retention-days: 14
        if-no-files-found: error
    - name: Clean only uploaded owned source alias and target
      id: ci296_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.local_evidence_1.outcome == 'success' && steps.local_evidence_1.outputs.artifact-id
        != '' && steps.local_evidence_1.outputs.artifact-digest != '' && steps.ci296_private_evidence.outcome ==
        'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest
        != '' && steps.ci296_source_seal.outcome == 'success' && env.CI296_SOURCE_OWNER != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI296_HOST_CONTROL: '1'
        UPLOAD_ID: ${{ steps.ci296_private_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.ci296_private_evidence.outputs.artifact-digest }}
      run: "set -euo pipefail\n[[ $UPLOAD_ID =~ ^[0-9]+$ ]]\n[[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]\nworkspace=$CI296_ACTIONS_WORKSPACE\n\
        p=$CI296_SOURCE_OWNER\ncase \"$p\" in \"$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"\
        ??????) ;; *) exit 1 ;; esac\ntest -d \"$p\" && test ! -L \"$p\"\ntest \"$(realpath -e -- \"$p\")\" = \"\
        $p\"\ntest \"$(stat -c '%u' -- \"$p\")\" = \"$(id -u)\"\ntest \"$(stat -c '%d:%i' -- \"$p\")\" = \"$CI296_SOURCE_IDENTITY\"\
        \ntest -f \"$p/.ci296-owner\" && test ! -L \"$p/.ci296-owner\"\ntest \"$(cat \"$p/.ci296-owner\")\" = \"\
        $GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\ntest \"$CI296_SOURCE\" = \"$p/source\"\ntest -d \"$p/source\"\
        \ && test ! -L \"$p/source\"\ntest \"$(realpath -e -- \"$p/source\")\" = \"$p/source\"\nalias_path=\"$CI296_ACTIONS_WORKSPACE/$CI296_ALIAS_BASENAME\"\
