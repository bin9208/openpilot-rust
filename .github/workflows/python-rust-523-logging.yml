name: Python Rust 523 shared logging retained candidate
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-logging.yml
    - tools/ci/logging_retained_549.sh
    - tools/ci/logging_retained_exec_policy_549.jq
    - docs/naver/python-rust-523-logging-cache-554.md
    - rust/crates/dev-tools/src/native_logging_check.rs
    - rust/crates/dev-tools/src/native_logging_check/**
    - rust/crates/dev-tools/tests/native_logging_lifecycle.rs
    - rust/crates/dev-tools/tests/native_logging_lifecycle/**
    - rust/crates/logging/**
    - rust/crates/dev-tools/Cargo.toml
    - rust/Cargo.toml
    - rust/Cargo.lock
    - rust/tools/prepare-readonly-ci-rust
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-logging-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  logging-retained:
    name: Shared logging retained source and current native candidate
    if: ${{ github.repository == 'bin9208/openpilot-rust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
      NATIVE_LOGGING_SOURCE_POLICY: absent
    steps:
    - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied for logging retained qualification' >&2; exit 1; }
        set -euo pipefail
        test "$EVENT_NAME" = push
        test "$SOURCE_REF" = refs/heads/codex/feat-523-python-rust
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.logging549-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Actions의 workspace와 Bash가 사용하는 private checkout을 구분한다.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
        # job root를 최초 allocation 시점에 bind한다. cleanup 순간의 stat을 baseline으로 쓰지 않는다.
        test -d "$CI_JOB_TEMP" && test ! -L "$CI_JOB_TEMP"
        test "$(realpath -e -- "$CI_JOB_TEMP")" = "$CI_JOB_TEMP"
        test "$(stat -c '%u:%a' -- "$CI_JOB_TEMP")" = "$UID:700"
        printf 'LOGGING_JOB_IDENTITY=%s\n' "$(stat -c '%d:%i:%f:%u:%g' -- "$CI_JOB_TEMP")" >> "$GITHUB_ENV"
        printf 'job_identity=%s\n' "$(stat -c '%d:%i:%f:%u:%g' -- "$CI_JOB_TEMP")" >> "$CI_JOB_TEMP/proof/ownership.txt"
    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Seal exact source HEAD and tracked index before checks
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      id: source_before
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        allocated=$(du -sx --block-size=1 "$DIAG_SOURCE_OWNER" | cut -f1)
        [[ $allocated =~ ^[0-9]+$ ]]
        printf '{"allocated_private_source_bytes":%s,"planned_source_growth_bytes":2147483648}\n' "$allocated" > "$CI_JOB_TEMP/proof/source-growth-after-checkout.json"
        git ls-tree -r -l HEAD | awk '$4 ~ /^[0-9]+$/ {bytes+=$4; files++} END {printf "{\"tracked_blob_bytes\":%.0f,\"files\":%d}\n",bytes,files}' > "$CI_JOB_TEMP/proof/tracked-source-size.json"
        ((allocated <= 2 * 1024 * 1024 * 1024))
    - name: Prepare official pinned Rust in the owned private rustup root and seal it
      id: prepared_rust
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
        "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before
    - name: Admit actual hosted disk space before native dependency preparation
      id: hosted_dependencies
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      timeout-minutes: 15
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        before_source=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        before_job=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        before_system=$(df -PB1 / | awk 'NR == 2 {print $4}')
        [[ $before_source =~ ^[0-9]+$ && $before_job =~ ^[0-9]+$ && $before_system =~ ^[0-9]+$ ]]
        preparation=$((2 * 1024 * 1024 * 1024))
        remaining=$(((8 + 2) * 1024 * 1024 * 1024))
        printf '{"source_available_bytes":%s,"job_available_bytes":%s,"system_available_bytes":%s,"planned_apt_growth_bytes":%s,"reserved_build_and_proof_bytes":%s,"measured_peak_guarantee":false}\n' "$before_source" "$before_job" "$before_system" "$preparation" "$remaining" | tee "$CI_JOB_TEMP/proof/hosted-dependencies-before.json"
        ((before_source >= preparation + remaining && before_job >= preparation + remaining))
        ((before_system >= preparation + 512 * 1024 * 1024))
        # 전역 apt 변경은 provider baseline 전 한 번만 한다. missing provider는 helper가 거부한다.
        (ulimit -f 524288; sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s \
          apt-get -o APT::Architecture=amd64 update) > "$CI_JOB_TEMP/proof/hosted-apt-update.log" 2>&1
        (ulimit -f 524288; sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s \
          apt-get -o APT::Architecture=amd64 install --no-install-recommends -y \
          build-essential clang pkg-config capnproto libcapnp-dev libzmq3-dev strace gh curl) \
          > "$CI_JOB_TEMP/proof/hosted-apt-install.log" 2>&1
        after_source=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        after_job=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        after_system=$(df -PB1 / | awk 'NR == 2 {print $4}')
        [[ $after_source =~ ^[0-9]+$ && $after_job =~ ^[0-9]+$ && $after_system =~ ^[0-9]+$ ]]
        printf '{"source_available_bytes":%s,"job_available_bytes":%s,"system_available_bytes":%s,"planned_apt_growth_bytes":%s,"measured_peak_guarantee":false}\n' "$after_source" "$after_job" "$after_system" "$preparation" | tee "$CI_JOB_TEMP/proof/hosted-dependencies-after.json"
        ((before_source - after_source <= preparation && before_job - after_job <= preparation && before_system - after_system <= preparation))
        ((after_source >= remaining && after_job >= remaining))
        ((after_system >= 512 * 1024 * 1024))
        dpkg-query -W build-essential clang pkg-config capnproto libcapnp-dev libzmq3-dev strace gh curl > "$CI_JOB_TEMP/proof/hosted-native-packages.txt"
        for provider in bash sh ranlib nm git gh curl clang clang++ cc c++ ar as ld pkg-config capnp ldd strace timeout; do
          command -v "$provider" > /dev/null
        done
    - name: Replay pinned historical first_int data with the current exact exec policy
      id: exec_policy_replay
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.hosted_dependencies.outcome == 'success')
        }}
      timeout-minutes: 6
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
        NATIVE_LOGGING_SOURCE_POLICY: present
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
        test -x /usr/bin/gh && test -x /usr/bin/unzip && test -x /usr/bin/timeout
        test "$PWD" = "$DIAG_SOURCE" && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(realpath -e -- "$CI_JOB_TEMP")" = "$CI_JOB_TEMP"
        test -d "$CI_JOB_TEMP" && test ! -L "$CI_JOB_TEMP"
        test "$(stat -c '%u:%a' -- "$CI_JOB_TEMP")" = "$UID:700"
        test -d "$CI_JOB_TEMP/proof" && test ! -L "$CI_JOB_TEMP/proof"
        proof=$CI_JOB_TEMP/proof/logging-exec-replay-788
        mkdir -m 700 -- "$proof"
        set -C
        phase=admission
        finish() {
          status=$?
          trap - EXIT
          /usr/bin/jq -n --arg phase "$phase" --argjson status "$status" \
            '{schema:1,source_policy:"present",policy_scope:"historical-788",historical_data_only:true,phase:$phase,exit_code:$status,historical_data_replay_only:true,current15_accepted:false,
              legacy2_accepted:false,closed_pid:false,closed_cwd:false,closed_fd:false,closed_dso:false,
              R4_acceptance:false,retirement_credit:0}' > "$proof/outcome.json" || status=1
          exit "$status"
        }
        trap finish EXIT
        policy=$DIAG_SOURCE/tools/ci/logging_retained_exec_policy_549.jq
        policy_sha=3b84adc7a2f1bd147841382fc35a9f0e456d357005206966c586308061f492b7
        test -f "$policy" && test ! -L "$policy"
        printf '%s  %s\n' "$policy_sha" "$policy" > "$proof/policy.sha256"
        sha256sum --check --strict "$proof/policy.sha256" > "$proof/policy-check.before.txt"
        stat -c '%d:%i:%f:%u:%g:%s:%y:%z' -- "$policy" > "$proof/policy.before.stat"
        jq_elf=$(realpath -e /usr/bin/jq)
        test -f "$jq_elf" && test ! -L "$jq_elf"
        sha256sum -- "$jq_elf" > "$proof/jq.sha256"
        stat -c '%d:%i:%f:%u:%g:%s:%y:%z' -- "$jq_elf" > "$proof/jq.before.stat"
        /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C "$jq_elf" --version > "$proof/jq-version.txt"
        # 128MiB/file는 고정82.3MB ZIP을 위한 별도 download bound다. 원래 report cap은 아래64MiB다.
        ulimit -f 131072
        phase=artifact-download
        /usr/bin/timeout --signal=TERM --kill-after=5s 90s /usr/bin/env -i \
          PATH=/usr/bin:/bin HOME="$CI_JOB_TEMP/home" GH_HOST=github.com GH_TELEMETRY=false GH_TOKEN="$GH_TOKEN" \
          /usr/bin/gh api repos/bin9208/openpilot-rust/actions/artifacts/12590267474 \
          > "$proof/artifact-api.json" 2> "$proof/artifact-api.stderr"
        /usr/bin/jq -e '.id==12590267474 and .size_in_bytes==82302246 and .expired==false and
          .digest=="sha256:f77efe071f9175d1fc8ed61bf2e6def0624eeff806b454e294e533e6a1af350d" and
          .workflow_run.id==40171227327 and .workflow_run.head_sha=="78896f19db29d5cbe305d6f788bac9d0db4ce552"' \
          "$proof/artifact-api.json" > "$proof/artifact-api.scope.txt"
        /usr/bin/timeout --signal=TERM --kill-after=5s 90s /usr/bin/env -i \
          PATH=/usr/bin:/bin HOME="$CI_JOB_TEMP/home" GH_HOST=github.com GH_TELEMETRY=false GH_TOKEN="$GH_TOKEN" \
          /usr/bin/gh api repos/bin9208/openpilot-rust/actions/artifacts/12590267474/zip \
          > "$proof/archive.zip" 2> "$proof/artifact-download.stderr"
        unset GH_TOKEN GITHUB_TOKEN
        test "$(stat -c %s -- "$proof/archive.zip")" = 82302246
        printf '%s  %s\n' f77efe071f9175d1fc8ed61bf2e6def0624eeff806b454e294e533e6a1af350d "$proof/archive.zip" > "$proof/archive.sha256"
        sha256sum --check --strict "$proof/archive.sha256" > "$proof/archive-check.before.txt"
        phase=archive-crc
        /usr/bin/timeout --signal=TERM --kill-after=5s 90s /usr/bin/unzip -tqq "$proof/archive.zip" \
          > "$proof/archive-crc.stdout" 2> "$proof/archive-crc.stderr"
        /usr/bin/unzip -Z1 "$proof/archive.zip" > "$proof/archive-members.txt"
        test "$(wc -l < "$proof/archive-members.txt")" -eq 5983
        LC_ALL=C sort -u "$proof/archive-members.txt" > "$proof/archive-members.unique.txt"
        test "$(wc -l < "$proof/archive-members.unique.txt")" -eq 5983
        phase=two-json-members
        /usr/bin/unzip -p "$proof/archive.zip" logging/inspect/first_int.json > "$proof/first_int.json"
        /usr/bin/unzip -p "$proof/archive.zip" logging/exec-policy/binding.json > "$proof/binding.json"
        test "$(stat -c %s -- "$proof/first_int.json")" = 494947
        test "$(stat -c %s -- "$proof/binding.json")" = 82900
        printf '%s  %s\n' \
          75e80a5e4a017ef5971ed3306b4ba308198c4b0aa57c201c5a8e523c4c116a0d "$proof/first_int.json" \
          e06a4f5ac76f6f2c356aa01b75ecbecdd03bd7b4d7cfb56134a8c4aeb6060fa0 "$proof/binding.json" > "$proof/members.sha256"
        sha256sum --check --strict "$proof/members.sha256" > "$proof/members-check.before.txt"
        # 다음 policy가 실패해도 검증한 원문 출처를 남긴다. 성공 출력/expected를 만들지 않는다.
        /usr/bin/jq -n --arg current "$GITHUB_SHA" --arg policy "$policy_sha" \
          '{schema:1,source_policy:"present",policy_scope:"historical-788",historical_data_only:true,scope:"historical-first-int-current-policy-replay",policy_source_commit:$current,policy_sha256:$policy,
            fixture_source_commit:"78896f19db29d5cbe305d6f788bac9d0db4ce552",fixture_run:40171227327,
            fixture_artifact:12590267474,zip_bytes:82302246,zip_sha256:"f77efe071f9175d1fc8ed61bf2e6def0624eeff806b454e294e533e6a1af350d",
            whole_zip_crc_checked:true,zip_members:5983,
            members:[{name:"logging/inspect/first_int.json",bytes:494947,sha256:"75e80a5e4a017ef5971ed3306b4ba308198c4b0aa57c201c5a8e523c4c116a0d"},
              {name:"logging/exec-policy/binding.json",bytes:82900,sha256:"e06a4f5ac76f6f2c356aa01b75ecbecdd03bd7b4d7cfb56134a8c4aeb6060fa0"}],
            raw_trace_redecoded:false,archive_code_executions:0,archive_elf_executions:0,original_executions:0,
            current15_accepted:false,legacy2_accepted:false,closed_pid:false,closed_cwd:false,closed_fd:false,closed_dso:false,
            all_adopted_reaped:false,old27_accepted:false,R4_acceptance:false,retirement_credit:0}' > "$proof/inputs.json"
        # literal old paths는 JSON 값이다. 열기/치환/현재 provider 재수용은 하지 않는다.
        phase=historical-first-int-policy
        (ulimit -f 65536
          /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
            "$jq_elf" -e --arg policy_scope historical-788 --arg source_policy present --arg prefix first_int --slurpfile binding "$proof/binding.json" \
            -f "$policy" "$proof/first_int.json") > "$proof/policy.stdout.json" 2> "$proof/policy.stderr"
        phase=replay-output-and-seals
        /usr/bin/jq -se 'length==1 and (.[0] | .source_policy=="present" and .policy_scope=="historical-788" and .historical_data_only==true and .schema==1 and .prefix=="first_int" and
          .source_commit=="78896f19db29d5cbe305d6f788bac9d0db4ce552" and .summary_schema==2 and
          .selected_exec_attempts==7 and .source_expected_exec_attempts==7 and .checker_attempts==1 and
          .case_keys==["retained-first-int"] and .exact_exec_argv_env==true and .structural_detail_counts_equal==true and
          .python_exec_attempts==0 and .cpp_exec_attempts==0 and .full_event_index==false and
          .closed_pid==false and .closed_cwd==false and .closed_fd==false and .closed_dso==false and
          .all_adopted_reaped==false and .old27_accepted==false and .pending_runtime2_accepted==false and
          .R4_acceptance==false and .retirement_credit==0)' "$proof/policy.stdout.json" > "$proof/policy-output.scope.txt"
        sha256sum --check --strict "$proof/archive.sha256" > "$proof/archive-check.after.txt"
        sha256sum --check --strict "$proof/members.sha256" > "$proof/members-check.after.txt"
        sha256sum --check --strict "$proof/policy.sha256" > "$proof/policy-check.after.txt"
        sha256sum --check --strict "$proof/jq.sha256" > "$proof/jq-check.after.txt"
        stat -c '%d:%i:%f:%u:%g:%s:%y:%z' -- "$policy" > "$proof/policy.after.stat"
        stat -c '%d:%i:%f:%u:%g:%s:%y:%z' -- "$jq_elf" > "$proof/jq.after.stat"
        cmp "$proof/policy.before.stat" "$proof/policy.after.stat"
        cmp "$proof/jq.before.stat" "$proof/jq.after.stat"
        sha256sum -- "$proof/policy.stdout.json" > "$proof/policy-output.sha256"
        /usr/bin/jq -n --slurpfile admission "$proof/inputs.json" \
          --arg output_sha "$(cut -d' ' -f1 "$proof/policy-output.sha256")" \
          '$admission[0]+{policy_invocations:1,policy_output_sha256:$output_sha,
            fixture_cpp_exec_attempts:0,fixture_python_exec_attempts:0,cpp_python_zero_scope:"captured788-first_int-exec-only"}' \
          > "$proof/receipt.json"
        phase=historical-data-replay-observed
        # 검증을 마친 과거 ZIP의 binary 사본은 남기지 않고 두 JSON/출처만 보존한다.
        test -f "$proof/archive.zip" && test ! -L "$proof/archive.zip"
        test "$(realpath -e -- "$proof/archive.zip")" = "$proof/archive.zip"
        test "$(stat -c '%u:%h' -- "$proof/archive.zip")" = "$UID:1"
        rm -- "$proof/archive.zip"
        test ! -e "$proof/archive.zip" && test ! -L "$proof/archive.zip"
    - name: Build and observe retained native logging with originals absent
      id: qualify
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        # 첫 candidate의 실제 결과를 수집한다. old27/P2/closed-trace/caller/absence 수용은 별도다.
        printf '%s  %s\n' 3d8e2ecc791a91923352a85642d407c32d5a9d513746ddf5b953112f83d8f627 tools/ci/logging_retained_549.sh | sha256sum --check --strict -
