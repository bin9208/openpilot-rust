name: Python Rust 523 shared logging retained candidate
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-logging.yml
    - tools/ci/logging_retained_549.sh
    - tools/ci/logging_retained_exec_policy_549.jq
    - docs/naver/python-rust-523-logging-cache-554.md
    - rust/crates/dev-tools/src/native_logging_check.rs
    - rust/crates/dev-tools/src/native_logging_check/**
    - rust/crates/dev-tools/tests/native_logging_lifecycle.rs
    - rust/crates/dev-tools/tests/native_logging_lifecycle/**
    - rust/crates/logging/**
    - rust/crates/dev-tools/Cargo.toml
    - rust/Cargo.toml
    - rust/Cargo.lock
    - rust/tools/prepare-readonly-ci-rust
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-logging-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  logging-retained:
    name: Shared logging retained source and current native candidate
    if: ${{ github.repository == 'bin9208/openpilot-rust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
    - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied for logging retained qualification' >&2; exit 1; }
        set -euo pipefail
        test "$EVENT_NAME" = push
        test "$SOURCE_REF" = refs/heads/codex/feat-523-python-rust
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.logging549-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Actions의 workspace와 Bash가 사용하는 private checkout을 구분한다.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
        # job root를 최초 allocation 시점에 bind한다. cleanup 순간의 stat을 baseline으로 쓰지 않는다.
        test -d "$CI_JOB_TEMP" && test ! -L "$CI_JOB_TEMP"
        test "$(realpath -e -- "$CI_JOB_TEMP")" = "$CI_JOB_TEMP"
        test "$(stat -c '%u:%a' -- "$CI_JOB_TEMP")" = "$UID:700"
        printf 'LOGGING_JOB_IDENTITY=%s\n' "$(stat -c '%d:%i:%f:%u:%g' -- "$CI_JOB_TEMP")" >> "$GITHUB_ENV"
        printf 'job_identity=%s\n' "$(stat -c '%d:%i:%f:%u:%g' -- "$CI_JOB_TEMP")" >> "$CI_JOB_TEMP/proof/ownership.txt"
    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Seal exact source HEAD and tracked index before checks
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      id: source_before
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        allocated=$(du -sx --block-size=1 "$DIAG_SOURCE_OWNER" | cut -f1)
        [[ $allocated =~ ^[0-9]+$ ]]
        printf '{"allocated_private_source_bytes":%s,"planned_source_growth_bytes":2147483648}\n' "$allocated" > "$CI_JOB_TEMP/proof/source-growth-after-checkout.json"
        git ls-tree -r -l HEAD | awk '$4 ~ /^[0-9]+$/ {bytes+=$4; files++} END {printf "{\"tracked_blob_bytes\":%.0f,\"files\":%d}\n",bytes,files}' > "$CI_JOB_TEMP/proof/tracked-source-size.json"
        ((allocated <= 2 * 1024 * 1024 * 1024))
    - name: Prepare official pinned Rust in the owned private rustup root and seal it
      id: prepared_rust
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
        "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before
    - name: Admit actual hosted disk space before native dependency preparation
      id: hosted_dependencies
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      timeout-minutes: 15
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        before_source=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        before_job=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        before_system=$(df -PB1 / | awk 'NR == 2 {print $4}')
        [[ $before_source =~ ^[0-9]+$ && $before_job =~ ^[0-9]+$ && $before_system =~ ^[0-9]+$ ]]
        preparation=$((2 * 1024 * 1024 * 1024))
        remaining=$(((8 + 2) * 1024 * 1024 * 1024))
        printf '{"source_available_bytes":%s,"job_available_bytes":%s,"system_available_bytes":%s,"planned_apt_growth_bytes":%s,"reserved_build_and_proof_bytes":%s,"measured_peak_guarantee":false}\n' "$before_source" "$before_job" "$before_system" "$preparation" "$remaining" | tee "$CI_JOB_TEMP/proof/hosted-dependencies-before.json"
        ((before_source >= preparation + remaining && before_job >= preparation + remaining))
        ((before_system >= preparation + 512 * 1024 * 1024))
        # 전역 apt 변경은 provider baseline 전 한 번만 한다. missing provider는 helper가 거부한다.
        (ulimit -f 524288; sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s \
          apt-get -o APT::Architecture=amd64 update) > "$CI_JOB_TEMP/proof/hosted-apt-update.log" 2>&1
        (ulimit -f 524288; sudo -n /usr/bin/timeout --signal=TERM --kill-after=30s 600s \
          apt-get -o APT::Architecture=amd64 install --no-install-recommends -y \
          build-essential clang pkg-config capnproto libcapnp-dev libzmq3-dev strace gh curl) \
          > "$CI_JOB_TEMP/proof/hosted-apt-install.log" 2>&1
        after_source=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        after_job=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        after_system=$(df -PB1 / | awk 'NR == 2 {print $4}')
        [[ $after_source =~ ^[0-9]+$ && $after_job =~ ^[0-9]+$ && $after_system =~ ^[0-9]+$ ]]
        printf '{"source_available_bytes":%s,"job_available_bytes":%s,"system_available_bytes":%s,"planned_apt_growth_bytes":%s,"measured_peak_guarantee":false}\n' "$after_source" "$after_job" "$after_system" "$preparation" | tee "$CI_JOB_TEMP/proof/hosted-dependencies-after.json"
        ((before_source - after_source <= preparation && before_job - after_job <= preparation && before_system - after_system <= preparation))
        ((after_source >= remaining && after_job >= remaining))
        ((after_system >= 512 * 1024 * 1024))
        dpkg-query -W build-essential clang pkg-config capnproto libcapnp-dev libzmq3-dev strace gh curl > "$CI_JOB_TEMP/proof/hosted-native-packages.txt"
        for provider in bash sh ranlib nm git gh curl clang clang++ cc c++ ar as ld pkg-config capnp ldd strace timeout; do
          command -v "$provider" > /dev/null
        done
    - name: Build and observe retained native logging without deleting originals
      id: qualify
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        # 첫 candidate의 실제 결과를 수집한다. old27/P2/closed-trace/caller/absence 수용은 별도다.
        printf '%s  %s\n' 53f8108dfc715ca59fc0ab1dcd2b16ba20994ec3025f119a35f79e0813d78a3b tools/ci/logging_retained_549.sh | sha256sum --check --strict -
        printf '%s  %s\n' deebf1d596d6266c1455869ef124b79bc15a45f23e588be0844c51a0ae10cbfa tools/ci/logging_retained_exec_policy_549.jq | sha256sum --check --strict -
        /usr/bin/timeout --signal=TERM --kill-after=180s 60m /usr/bin/env -u LD_PRELOAD -u LD_LIBRARY_PATH /usr/bin/bash tools/ci/logging_retained_549.sh
        jq -e '.schema==1 and .states==8 and .status_pairs==8 and .authored_status_equal==true and .fs_check_passed==true and .fixture_cap_bytes==16777216 and .source_prime==false and .performance_claim==false and .runtime_acceptance==false and .retirement_credit==0' "$CI_JOB_TEMP/proof/logging/git-cache-554/complete.json"
        jq -e --arg source "$GITHUB_SHA" '.schema==1 and .source_commit==$source and .fs_check_passed==true and .source_prime_statuses==1 and .status_channels_equal==true and .tracked_source_entries_flags_equal==true and .source_config_unchanged==true and .sdk_equal==true and .raw_index_immutable==false and .fixture_child_optional_locks_zero==false and .performance_claim==false and .runtime_acceptance==false and .retirement_credit==0' "$CI_JOB_TEMP/proof/logging/git-source-cache-554/complete.json"
        jq -e --arg source "$GITHUB_SHA" '.schema==1 and .source_commit==$source and .qualification_profile=="fixed-true-554-v1" and .preload_index=="true" and .historical_false_receipts_relabelled==false and .production_preload_changed==false and .R4_acceptance==false and .retirement_credit==0' "$CI_JOB_TEMP/proof/logging/git-preload-profile.json"
        jq -e --arg source "$GITHUB_SHA" '
          .schema==2 and .source_commit==$source and .order==["false-a1","true-b","false-a2"] and
          .preload_order==["false","true","false"] and .status_observations==3 and .status_comparisons==2 and
          .status_channels_equal==true and (.observations|length)==3 and
          all(.observations[]; .source_commit==$source and .command_exit==0 and .diagnostic_only==true and .runtime_acceptance==false and .R4_acceptance==false and .retirement_credit==0) and
          .raw_index_comparison.schema==1 and .raw_index_comparison.index_restored==false and
          (.raw_index_comparison.same_raw_index_bytes|type)=="boolean" and
          (.raw_index_comparison.same_raw_index_identity|type)=="boolean" and
          (if .raw_index_comparison.same_raw_index_bytes and .raw_index_comparison.same_raw_index_identity
           then .raw_index_comparison.performance_comparison=="eligible_observation_only"
           else .raw_index_comparison.performance_comparison=="HOLD" end) and
          .qualification_profile=="fixed-true-554-v1" and .qualification_preload_index=="true" and
          .qualification_profile_changed==true and .historical_false_receipts_relabelled==false and
          .production_preload_changed==false and .full_lifecycle_causality_proven==false and
          .performance_claim==false and .root_cause_fixed==false and .runtime_acceptance==false and .R4_acceptance==false and .retirement_credit==0
        ' "$CI_JOB_TEMP/proof/logging/git-preload-status-554/complete.json"
    - name: Seal source and index after all attempted contracts
      id: source_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.DIAG_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        du -sx --block-size=1 "$DIAG_SOURCE_OWNER" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/private-output-bytes.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$CI_JOB_TEMP/proof/cgroup-memory-after.txt"; fi
        find "$CARGO_TARGET_DIR" -name '*.d' -type f -exec sha256sum {} + > "$CI_JOB_TEMP/proof/build-dep-info.sha256" || test ! -d "$CARGO_TARGET_DIR"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        proof_bytes=$(du -sx --block-size=1 "$CI_JOB_TEMP/proof" | cut -f1)
        [[ $proof_bytes =~ ^[0-9]+$ ]]
        ((proof_bytes <= 2 * 1024 * 1024 * 1024))
    - name: Verify whole prepared private Rust SDK after all attempted logging candidate contracts
      id: prepared_rust_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.prepared_rust.outcome == 'success') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" after
        proof_bytes=$(du -sx --block-size=1 "$CI_JOB_TEMP/proof" | cut -f1)
        [[ $proof_bytes =~ ^[0-9]+$ ]]
        ((proof_bytes <= 2 * 1024 * 1024 * 1024))
    - name: Retain current source and native logging candidate proof even on failure
      id: proof_upload
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v7
      with:
        name: logging-retained-549-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Record candidate scope and outstanding retirement gates
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        printf '%s\n' '이 실행은 원본을 보존한 shared logging 후보 검증이다.' 'old27/P2/전체 trace·FD 폐쇄/caller·absence/퇴역 수용은 별도이며 원본 교체 credit은 0이다.' >> "$GITHUB_STEP_SUMMARY"

    - name: Clean only uploaded unchanged owned logging source and private job
      id: logging_owned_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.source_before.outcome
        == 'success' && steps.prepared_rust.outcome == 'success' && steps.qualify.outcome == 'success' && steps.source_final.outcome == 'success' && steps.prepared_rust_final.outcome
        == 'success' && steps.proof_upload.outcome == 'success' && steps.proof_upload.outputs.artifact-id != '' && steps.proof_upload.outputs.artifact-digest != '' &&
        env.DIAG_SOURCE_OWNER != '' && env.CI_JOB_TEMP != '') }}
      shell: bash
      timeout-minutes: 5
      working-directory: ${{ env.DIAG_ACTIONS_WORKSPACE }}
      env:
        UPLOAD_ID: ${{ steps.proof_upload.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.proof_upload.outputs.artifact-digest }}
        CURRENT_HELPER_SHA256: 53f8108dfc715ca59fc0ab1dcd2b16ba20994ec3025f119a35f79e0813d78a3b
      run: |
        set -euo pipefail
        umask 077
        [[ $UPLOAD_ID =~ ^[0-9]+$ && $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ && $GITHUB_SHA =~ ^[a-f0-9]{40}$ ]]
        test "$GITHUB_ACTIONS:$GITHUB_REPOSITORY:$RUNNER_ENVIRONMENT:$RUNNER_OS:$RUNNER_ARCH" = true:bin9208/openpilot-rust:github-hosted:Linux:X64
        workspace=$DIAG_ACTIONS_WORKSPACE
        p=$DIAG_SOURCE_OWNER
        job=$CI_JOB_TEMP
        proof=$job/proof
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        [[ $workspace == /* && -d $workspace && ! -L $workspace && $(realpath -e -- "$workspace") == "$workspace" ]]
        [[ $p == "$workspace/.logging549-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."?????? ]]
        [[ $job == /tmp/openpilot-ci.?????? && ${job%/*} == /tmp ]]
        [[ $p != "$job" && $p != "$job/"* && $job != "$p/"* ]]
        roots() {
          test -d "$p" && test ! -L "$p" && test "$(realpath -e -- "$p")" = "$p"
          test "$(stat -c '%u:%a' -- "$p")" = "$UID:700"
          test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
          test -d "$job" && test ! -L "$job" && test "$(realpath -e -- "$job")" = "$job"
          test "$(stat -c '%u:%a' -- "$job")" = "$UID:700"
          test "$(stat -c '%d:%i:%f:%u:%g' -- "$job")" = "$LOGGING_JOB_IDENTITY"
          for marker in "$p/.diag296-owner" "$job/owner"; do
            test -f "$marker" && test ! -L "$marker"
            test "$(stat -c '%u:%h' -- "$marker")" = "$UID:1"
            test "$(cat -- "$marker")" = "$owner"
          done
          test "$DIAG_SOURCE" = "$p/source"
          test -d "$DIAG_SOURCE" && test ! -L "$DIAG_SOURCE"
          test "$(realpath -e -- "$DIAG_SOURCE")" = "$DIAG_SOURCE"
          test "$CARGO_TARGET_DIR" = "$DIAG_SOURCE/rust/target"
          test "$RUSTUP_HOME" = "$job/rustup-home"
          test "$CARGO_HOME" = "$job/cargo-home"
        }
        roots
        required_file() {
          test -f "$1" && test ! -L "$1"
          test "$(realpath -e -- "$1")" = "$1"
          test "$(stat -c '%u:%h' -- "$1")" = "$UID:1"
          (($(stat -c %s -- "$1") <= 67108864))
        }
        required_file "$proof/SOURCE_COMMIT"
        test "$(cat -- "$proof/SOURCE_COMMIT")" = "$GITHUB_SHA"
        required_file "$DIAG_SOURCE/tools/ci/logging_retained_549.sh"
        printf '%s  %s\n' "$CURRENT_HELPER_SHA256" "$DIAG_SOURCE/tools/ci/logging_retained_549.sh" | sha256sum --check --strict --quiet -
        required_file "$proof/logging/outcome.json"
        jq -e '.phase=="candidate-observed" and .exit_code==0 and .held_final_exit_code==0 and .untraced_exit_code==0 and .paired_final_exit_code==0 and .retirement_credit==0 and .closed_trace_admitted==false and .old27_admitted==false' "$proof/logging/outcome.json"
        required_file "$proof/logging/held-after.txt"
        grep -Fx 'current held files and bytes unchanged' "$proof/logging/held-after.txt"
        # 이미 업로드한 proof를 수정하지 않는다. 마지막 검증 scratch도 삭제될 private job 안이다.
        scratch=$job/logging-cleanup-check
        mkdir -m 700 -- "$scratch"
        test "$(git --no-optional-locks -C "$DIAG_SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
        git --no-optional-locks -C "$DIAG_SOURCE" diff --exit-code
        git --no-optional-locks -C "$DIAG_SOURCE" diff --cached --exit-code
        git --no-optional-locks -C "$DIAG_SOURCE" ls-files -z > "$scratch/index.bin"
        cmp "$proof/index-before.bin" "$proof/index-after.bin"
        cmp "$proof/index-after.bin" "$scratch/index.bin"
        (cd -- "$DIAG_SOURCE"; tar --null --no-recursion --verbatim-files-from -T "$proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner) | sha256sum > "$scratch/source.sha256"
        cmp "$proof/source-before.sha256" "$proof/source-after.sha256"
        cmp "$proof/source-after.sha256" "$scratch/source.sha256"
        sdk=$job/rustup-home/toolchains/1.94.0-x86_64-unknown-linux-gnu
        test "$CI_PREPARED_RUST_ROOT" = "$sdk"
        test "$CI_PREPARED_RUST_MANIFEST" = "$proof/prepared-rust-files.before.sha256"
        test -d "$sdk" && test ! -L "$sdk" && test "$(realpath -e -- "$sdk")" = "$sdk"
        for leaf in prepared-rust-programs.sha256 prepared-rust-programs.after.sha256 prepared-rust-files.before.sha256 prepared-rust-files.after.sha256 prepared-rust-roster.before.bin prepared-rust-roster.after.bin; do required_file "$proof/$leaf"; done
        cmp "$proof/prepared-rust-programs.sha256" "$proof/prepared-rust-programs.after.sha256"
        cmp "$proof/prepared-rust-files.before.sha256" "$proof/prepared-rust-files.after.sha256"
        cmp "$proof/prepared-rust-roster.before.bin" "$proof/prepared-rust-roster.after.bin"
        sha256sum --check --strict --quiet "$proof/prepared-rust-programs.sha256"
        sha256sum --check --strict --quiet "$CI_PREPARED_RUST_MANIFEST"
        LC_ALL=C find -P "$sdk" -printf '%D:%i\t%m:%U:%G\t%T@\t%C@\t%y\t%p\t%l\0' | LC_ALL=C sort -z > "$scratch/sdk-roster.bin"
        cmp "$proof/prepared-rust-roster.after.bin" "$scratch/sdk-roster.bin"
        # 필수 raw/report는 실제 regular bytes로 있어야 한다. socket은 receipt metadata와 구분한다.
        for leaf in logging/native/report.json logging/context/context.json logging/context.prepare.json logging/raw-comparison.txt; do required_file "$proof/$leaf"; done
        declare -A observed_pids=() observed_groups=()
        for prefix in first_int first_term first_eof runtime_directory_int runtime_directory_term escaped_descendant_int escaped_descendant_term escaped_descendant_eof output_file output_directory output_live_directory output_symlink output_dangling_symlink forbidden_executable_options retained-once; do
          report=$proof/logging/inspect/$prefix.json
          required_file "$report"
          jq -e --arg prefix "$prefix" '.schema==2 and .prefix==$prefix and .raw_immutable==true and .lexically_checked_all_events==true and (.raw_files|length)>0' "$report" > /dev/null
          jq -er '.raw_files[]|[.name,.sha256,(.pid|tostring)]|@tsv' "$report" > "$scratch/raw.tsv"
          while IFS=$'\t' read -r name digest pid; do
            [[ $pid =~ ^[1-9][0-9]*$ && $name == "$prefix.$pid" && $digest =~ ^[a-f0-9]{64}$ ]]
            raw=$proof/logging/trace/$name
            test -f "$raw" && test ! -L "$raw"
            test "$(realpath -e -- "$raw")" = "$raw"
            test "$(stat -c '%u:%h' -- "$raw")" = "$UID:1"
            (($(stat -c %s -- "$raw") <= 536870912))
            printf '%s  %s\n' "$digest" "$raw" | sha256sum --check --strict --quiet -
            observed_pids[$pid]=1
          done < "$scratch/raw.tsv"
          policy=$proof/logging/exec-policy/$prefix.json
          required_file "$policy"
          jq -e --arg prefix "$prefix" --arg source "$GITHUB_SHA" '.schema==1 and .prefix==$prefix and .source_commit==$source and .exact_exec_argv_env==true and .structural_detail_counts_equal==true and .closed_pid==false and .closed_cwd==false and .closed_fd==false and .closed_dso==false and .all_adopted_reaped==false and .R4_acceptance==false and .retirement_credit==0' "$policy" > /dev/null
        done
        required_file "$proof/logging/exec-policy/binding.json"
        jq -er '.cases[].receipt|(.held.checker_observation.live_identity.group?,.held.peer_observation.live_identity.group?,.escaped_descendants[]?.group)|select(.!=null)|if type=="number" and .>1 and floor==. then . else error("group identity invalid") end' "$proof/logging/exec-policy/binding.json" > "$scratch/groups.txt"
        while IFS= read -r group; do [[ $group =~ ^[1-9][0-9]*$ ]]; observed_groups[$group]=1; done < "$scratch/groups.txt"
        ((${#observed_groups[@]} > 0 && ${#observed_pids[@]} > 0))
        # collision8 group_empty와 같은 all-UID /proc/stat 검사. 새 signal/reap 동작은 없다.
        observed_absent() {
          local entry line rest pid
          local -a fields
          for entry in /proc/[0-9]*/stat; do
            if ! IFS= read -r line < "$entry"; then [[ ! -e $entry ]] && continue; return 1; fi
            pid=${entry#/proc/}; pid=${pid%/stat}
            rest=${line##*) }; read -r -a fields <<< "$rest"
            [[ ${#fields[@]} -ge 20 && ${fields[2]} =~ ^[0-9]+$ ]]
            [[ ! -v observed_pids[$pid] && ! -v observed_groups[${fields[2]}] ]] || { printf 'cleanup blocked pid=%s pgid=%s state=%s\n' "$pid" "${fields[2]}" "${fields[0]}" >&2; return 1; }
          done
          printf 'LOGGING_CLEANUP observed_pids=%s observed_groups=%s absent=true all_adopted_reaped=false\n' "${#observed_pids[@]}" "${#observed_groups[@]}"
        }
        observed_absent
        roots
        # 모든 directory만 먼저 검증한다. -P/-xdev, canonical root/UID/dev 확인 뒤에만 u+w.
        for root in "$p" "$job"; do
          device=$(stat -c %d -- "$root")
          find -P "$root" -xdev -type d -print0 > "$scratch/directories.bin"
          while IFS= read -r -d '' directory; do
            [[ $directory == "$root" || $directory == "$root/"* ]]
            (cd -P -- "$directory"; test "$(pwd -P)" = "$directory"; test "$(stat -c '%u:%d' .)" = "$UID:$device")
          done < "$scratch/directories.bin"
        done
        for root in "$p" "$job"; do
          device=$(stat -c %d -- "$root")
          find -P "$root" -xdev -type d -print0 > "$scratch/directories.bin"
          while IFS= read -r -d '' directory; do
            [[ $directory == "$root" || $directory == "$root/"* ]]
            (cd -P -- "$directory"; test "$(pwd -P)" = "$directory"; test "$(stat -c '%u:%d' .)" = "$UID:$device"; chmod u+w -- .)
          done < "$scratch/directories.bin"
        done
        # SDK roster/원본 source의 마지막 비교는 permission 변경 전이다. 이후는 삭제할 root만 다룬다.
        roots
        cd -- "$workspace"
        observed_absent
        rm -rf --one-file-system -- "$p"
        test ! -e "$p" && test ! -L "$p"
        printf 'LOGGING_CLEANUP source=%s root=%s absent=true artifact_id=%s digest=%s\n' "$GITHUB_SHA" "$p" "$UPLOAD_ID" "$UPLOAD_DIGEST"
        observed_absent
        test "$(stat -c '%d:%i:%f:%u:%g' -- "$job")" = "$LOGGING_JOB_IDENTITY"
        test "$(cat -- "$job/owner")" = "$owner"
        rm -rf --one-file-system -- "$job"
        test ! -e "$job" && test ! -L "$job"
        printf 'LOGGING_CLEANUP source=%s root=%s absent=true global_sdk_touched=false\n' "$GITHUB_SHA" "$job"
        printf '%s\n' 'logging owned source/job cleanup verified; all-PID/FD/DSO/R4/retirement acceptance unchanged' >> "$GITHUB_STEP_SUMMARY"
