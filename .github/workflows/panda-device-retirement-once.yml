name: Panda device independent capture and native retirement candidate
permissions:
  contents: read
  actions: read
jobs:
  original-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: e4b30b8d197722eb31ce993c975dd631729aa937
        persist-credentials: false
    - name: Reserve disk and prepare minimal device compiler inputs
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = e4b30b8d197722eb31ce993c975dd631729aa937

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ libusb-1.0-0-dev pkg-config

        rustup toolchain install 1.94.0 --profile minimal

        '
    - name: Borrow and seal unchanged original C++ device ELF
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 3072\n\
        mkdir -p \"$RUNNER_TEMP/panda-device-borrowed\"\ncd \"$RUNNER_TEMP/panda-device-borrowed\"\ncurl -fLsS --retry 3 --retry-delay\
        \ 5 \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H 'Accept: application/vnd.github+json' \\\n  'https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12352894540/zip'\
        \ \\\n  -o original-private.zip\nprintf '%s  %s\\n' e3eb33893aef9aed9d21e0d42e4ddcda3a8fdff02a271bedd02823a6c9d70d87\
        \ original-private.zip | sha256sum -c -\nunzip -p original-private.zip panda-retirement/two-lane/checkout-output/device-src/pandad-protocol-source\
        \ > pandad-protocol-source\nunzip -p original-private.zip panda-retirement/two-lane/checkout-output/device-src/manifest.json\
        \ > manifest.json\nchmod 755 pandad-protocol-source\nprintf '%s  %s\\n' 13b452618b4e467c4475926dce7d37802c7cbad0cfcfc3fb53269936c4496911\
        \ pandad-protocol-source | sha256sum -c -\n"
    - name: Build only the current native device example
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\ncargo build --manifest-path rust/Cargo.toml -p openpilot-pandad --example device --locked \\\n  > \"$RUNNER_TEMP/panda-device-borrowed/native-build.stdout\"\
        \ \\\n  2> \"$RUNNER_TEMP/panda-device-borrowed/native-build.stderr\"\ntest -x rust/target/debug/examples/device\n\
        sha256sum rust/target/debug/examples/device > \"$RUNNER_TEMP/panda-device-borrowed/native-example.sha256\"\n"
    - name: Capture original requests, responses, CLI and raw path
      env:
        PANDAD_DEVICE_CAPTURE: ${{ runner.temp }}/panda-device-original
        PANDAD_DEVICE_BORROWED_ZIP: ${{ runner.temp }}/panda-device-borrowed/original-private.zip
        PANDAD_DEVICE_SOURCE_BINARY: ${{ runner.temp }}/panda-device-borrowed/pandad-protocol-source
        PANDAD_DEVICE_SOURCE_MANIFEST: ${{ runner.temp }}/panda-device-borrowed/manifest.json
        PANDAD_DEVICE_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/device
      run: 'set -euo pipefail

        export PANDAD_DEVICE_SOURCE_COMMIT="$(git rev-parse HEAD)"

        export PANDAD_DEVICE_PYTHON="$(command -v python3)"

        test ! -e "$PANDAD_DEVICE_CAPTURE" && test ! -L "$PANDAD_DEVICE_CAPTURE"

        printf %s ''''
        | base64 -d > "$RUNNER_TEMP/capture-original-device.py"

        printf ''%s  %s\n'' ad39d4735148a58d1f0f0a7a27c6a602c1fc1ef85e5e0b583f85b88b5032c873 "$RUNNER_TEMP/capture-original-device.py"
        | sha256sum -c -

        PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/capture-original-device.py"

        '
    - name: Bind freshly captured original-only evidence for candidate comparison
      run: "set -euo pipefail\ncapture=\"$RUNNER_TEMP/panda-device-original\"\ntest -f \"$capture/capture-manifest.json\"\n\
        mkdir -p \"$RUNNER_TEMP/panda-device-retirement\"\nmanifest_sha=$(sha256sum \"$capture/capture-manifest.json\" | cut\
        \ -d ' ' -f 1)\n{\n  echo \"PANDAD_DEVICE_ORIGINAL_CAPTURE=$capture\"\n  echo \"PANDAD_DEVICE_CAPTURE_MANIFEST_SHA256=$manifest_sha\"\
        \n  echo \"PANDAD_DEVICE_CAPTURE_SOURCE_COMMIT=$(git rev-parse HEAD)\"\n  echo \"PANDAD_DEVICE_TEST_OUTPUT=$RUNNER_TEMP/panda-device-retirement\"\
        \n} >> \"$GITHUB_ENV\"\n"
    - name: Cloud native checker controls and independent retirement candidate gate
      env:
        PANDAD_DEVICE_RETIREMENT_MODE: predelete
        PANDAD_DEVICE_SOURCE_BINARY: ${{ runner.temp }}/panda-device-borrowed/pandad-protocol-source
        PANDAD_DEVICE_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/device
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 8192\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-device-native --test pandad_device_check\
        \ --test pandad_device_retirement --locked \\\n  > \"$RUNNER_TEMP/panda-device-retirement/native-tests.stdout\" \\\
        \n  2> \"$RUNNER_TEMP/panda-device-retirement/native-tests.stderr\"\ncargo clippy --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features pandad-device-native --lib --bin check-pandad-device --test pandad_device_check\
        \ --test pandad_device_retirement --locked -- -D warnings \\\n  > \"$RUNNER_TEMP/panda-device-retirement/native-clippy.stdout\"\
        \ \\\n  2> \"$RUNNER_TEMP/panda-device-retirement/native-clippy.stderr\"\n"
    - name: Preserve native candidate comparisons and control logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-device-retirement-candidate
        path: ${{ runner.temp }}/panda-device-retirement/
        if-no-files-found: warn
        retention-days: 7
    - name: Preserve all original observations and build provenance
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-device-original-only
        path: '${{ runner.temp }}/panda-device-original/

          ${{ runner.temp }}/panda-device-borrowed/manifest.json

          ${{ runner.temp }}/panda-device-borrowed/native-build.stdout

          ${{ runner.temp }}/panda-device-borrowed/native-build.stderr

          ${{ runner.temp }}/panda-device-borrowed/native-example.sha256

          '
        if-no-files-found: warn
        retention-days: 7
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-device-retirement-once.yml
  workflow_dispatch: {}
