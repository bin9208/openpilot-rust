name: Python Rust 523 exact native Planner caller
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-planner-caller.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: python-rust-523-planner-caller-${{ github.ref }}
  cancel-in-progress: false
  queue: max
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  planner-runtime:
    name: rust planner source comparison (${{ matrix.runner }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runner:
        - local-x64
    timeout-minutes: ${{ matrix.runner == 'local-arm64-qemu' && 90 || 45 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENBLAS_NUM_THREADS: '1'
      LOCAL_CI_ARCH: ${{ matrix.runner == 'local-arm64-qemu' && 'aarch64' || 'x86_64' }}
      CI296_ALIAS_BASENAME: .ci296-source-rust--planner-runtime
    steps:
    - name: Deny fork source and require GitHub-hosted Linux X64
      shell: bash
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
        CI296_HOST_CONTROL: '1'
      run: 'test "${SOURCE_ALLOWED:-}" = true || { echo ''Fork PR source denied on persistent bin-actions'' >&2;
        exit 1; }

        set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust

        test "$RUNNER_ENVIRONMENT" = github-hosted

        test "$RUNNER_OS" = Linux

        test "$RUNNER_ARCH" = X64

        test "$(uname -s)" = Linux

        test "$(uname -m)" = x86_64

        '
      working-directory: ${{ github.workspace }}
    - name: Common owned job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env: &id001
        CI296_HOST_CONTROL: '1'
    - name: Allocate private source cache target and local action alias before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env: *id001
      run: 'set -euo pipefail

        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")

        job=$CI_JOB_TEMP

        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"

        test "$(cat "$job/owner")" = "$owner"

        umask 077

        mkdir "$job/proof" "$job/home" "$job/cache"

        # Source capacity is checked on the actual source filesystem BEFORE checkout.

        available=$(df -PB1 "$workspace" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        required=$((2 * 1024 * 1024 * 1024))

        printf ''{"available_bytes":%s,"planned_source_growth_bytes":%s}\n'' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"

        ((available >= required))

        source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")

        printf ''%s\n'' "$owner" > "$source_owner/.ci296-owner"

        mkdir "$source_owner/source"

        source="$source_owner/source"

        # Preserve Actions'' real workspace separately. Only Bash consumers see the

        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.

        printf ''source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n'' "$BASH_ENV"
        "$workspace" "$source" > "$job/ci296-shell-env"

        printf ''%s\n'' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat
        -c ''%d:%i'' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home"
        "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache"
        "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env"
        >> "$GITHUB_ENV"

        printf ''owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n''
        "$owner" "$job" "$workspace" "$source_owner" "$(stat -c ''%d:%i'' -- "$source_owner")" "$source" "$GITHUB_SHA"
        > "$job/proof/ownership.txt"

        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"

        cat /proc/meminfo > "$job/proof/memory-before.txt"

        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt";
        fi

        printf ''%s\n'' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"


        alias_path="$workspace/$CI296_ALIAS_BASENAME"

        case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac

        [[ $CI296_ALIAS_BASENAME != */* ]]

        # -T makes this an exclusive atomic link, never traversal into a stale directory.

        ln -sT -- "$source_owner" "$alias_path"

        printf ''%s\n'' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c ''%d:%i'' -- "$alias_path")"
        "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"

        printf ''source_alias=%s\nalias_identity=%s\n'' "$alias_path" "$(stat -c ''%d:%i'' -- "$alias_path")" >>
        "$job/proof/ownership.txt"

        '
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
        path: ${{ env.CI296_CHECKOUT_PATH }}
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact private source and index
      id: ci296_source_admission
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        test "$PWD" = "$CI296_SOURCE"

        test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git diff --exit-code

        git diff --cached --exit-code

        printf ''%s\n'' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"

        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"

        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
        1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"

        '
    - name: Require reviewed maintained Planner source
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: 'set -euo pipefail

        printf ''%s  %s\n'' cdadd4a902157aa5381fad7eb99e0da910d9b0d207f98934dea35645e631ec07 .github/workflows/rust.yml
        | sha256sum --check --strict -

        '
    - name: Configure source-dependent job environment on private paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_LATE_PYTHONPATH: ${{ env.CI296_SOURCE }}:${{ env.CI296_SOURCE }}/opendbc_repo:${{ env.CI296_SOURCE
          }}/rust/tools
        CI296_HOST_CONTROL: '1'
      run: 'set -euo pipefail

        printf ''%s\n'' "PYTHONPATH=$CI296_LATE_PYTHONPATH" >> "$GITHUB_ENV"

        '
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env: *id001
    - name: Require QEMU host executable before ARM transport
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      run: "set -euo pipefail\nif [[ $LOCAL_CI_ARCH == aarch64 ]]; then\n  if [[ ! -x /usr/bin/qemu-aarch64-static\
        \ ]]; then\n    # QEMU 설치는 transport 준비 전에 별도 1 GiB 증가량을 승인한다.\n    df -PB1 /usr/bin /var/lib/apt/lists\
        \ /var/cache/apt/archives > \"$CI_JOB_TEMP/proof/qemu-host-disk-before.txt\"\n    for path in /usr/bin /var/lib/apt/lists\
        \ /var/cache/apt/archives; do\n      available=$(df -PB1 \"$path\" | awk 'NR == 2 {print $4}')\n      [[\
        \ $available =~ ^[0-9]+$ ]]\n      ((available >= 1024 * 1024 * 1024))\n    done\n    sudo -n timeout --signal=TERM\
        \ --kill-after=10s 180s apt-get -o APT::Architectures=amd64 update\n    sudo -n timeout --signal=TERM --kill-after=10s\
        \ 180s apt-get -o APT::Architectures=amd64 install -y --no-install-recommends qemu-user-static\n    df -PB1\
        \ /usr/bin /var/lib/apt/lists /var/cache/apt/archives > \"$CI_JOB_TEMP/proof/qemu-host-disk-after.txt\"\n\
        \  fi\n  test -x /usr/bin/qemu-aarch64-static\n  /usr/bin/qemu-aarch64-static --version > \"$CI_JOB_TEMP/proof/qemu-host-version.txt\"\
        \nfi\n"
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
    - name: Common explicit x64 or QEMU ARM transport
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: ./.ci296-source-rust--planner-runtime/source/.github/actions/local-arm
      env: *id001
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && ((true) && env.LOCAL_CI_ARCH == 'x86_64') }}
      env: &id002
        CI296_HOST_CONTROL: '1'
        RUSTUP_HOME: ${{ env.CI_JOB_TEMP }}/python-rustup-home
        CARGO_HOME: ${{ env.CI_JOB_TEMP }}/python-cargo-home
        RUSTUP_AUTO_INSTALL: '0'
    - name: Keep original Python installations private
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && ((true) && env.LOCAL_CI_ARCH == 'x86_64') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id002
      run: 'set -euo pipefail

        available=$(df -PB1 "$CI_JOB_TEMP" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        ((available >= 512 * 1024 * 1024))

        python -m venv "$CI_JOB_TEMP/venv"

        printf ''%s\n'' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"

        '
    - name: Reserve capacity and install original planner dependencies
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update && sudo apt-get -o "APT::Architectures=$(dpkg
        --print-architecture)" install -y capnproto libcapnp-dev g++ clang-18 libzmq3-dev

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.3.0 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0
        requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3 pytest==9.0.2

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        python -m pip download --only-binary=:all: --no-deps comma-deps-acados==0.2.2.post103 --dest "$RUNNER_TEMP/planner-wheel"

        python -m pip install --no-deps "$RUNNER_TEMP"/planner-wheel/*.whl

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -P -c ''import acados; from pathlib import Path; print("PLANNER_GENERATOR="+str(Path(acados.__file__).parent))''
        >> "$GITHUB_ENV"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Build current native dependency stager
      uses: ./.ci296-source-rust--planner-runtime/source/.github/actions/native-json11
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      with:
        run-shell: openpilot-local-shell {0}
    - name: Build pinned solvers and unchanged original bindings
      run: 'planner_cc=gcc

        if [ "$(uname -m)" = aarch64 ]; then planner_cc=clang-18; fi

        python rust/tools/build_plannerd_acados.py --architecture "$(uname -m)" --cc "$planner_cc" --python "$(command
        -v python)" --acados "$PLANNER_GENERATOR" --wheel "$RUNNER_TEMP"/planner-wheel/*.whl --output "$RUNNER_TEMP/planner-artifact"

        python rust/tools/build_plannerd_source.py --artifact "$RUNNER_TEMP/planner-artifact" --python "$(command
        -v python)" --acados "$PLANNER_GENERATOR" --generator-wheel "$RUNNER_TEMP"/planner-wheel/*.whl --cc "$planner_cc"
        --output "$RUNNER_TEMP/planner-source"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/planner-original/params"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/planner-original/ipc"

        "$CI_RECEIPT_METADATA" module PLANNER_PARAMS_BINDING "$RUNNER_TEMP/planner-original/params/provenance.json"
        >> "$GITHUB_ENV"

        printf ''PYTHONPATH=%s/planner-original/ipc:%s\n'' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compile and check the complete native planner
      run: 'python -m pytest -c /dev/null --rootdir . --confcutdir=rust/tools/tests -q rust/tools/tests/test_plannerd_ci.py

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --target "$NATIVE_TOOLS_HOST"
        --test native_build_closure

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo test --manifest-path rust/Cargo.toml -p openpilot-plannerd --all-targets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-plannerd --bins --examples --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-plannerd --all-targets --locked -- -D warnings

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compare exact policies, main loops, real IPC and lifecycle
      run: '/usr/bin/bash "$CI296_SOURCE/tools/ci/planner_native_controller_523.sh" runtime

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Check generated C with ASan, UBSan and allocator leak detection
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (matrix.runner == 'local-x64') }}
      run: 'python rust/tools/build_plannerd_acados.py --architecture x86_64 --cc gcc --sanitize --python "$(command
        -v python)" --acados "$PLANNER_GENERATOR" --wheel "$RUNNER_TEMP"/planner-wheel/*.whl --output "$RUNNER_TEMP/planner-sanitized"

        /usr/bin/bash "$CI296_SOURCE/tools/ci/planner_native_controller_523.sh" memory

        '
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - uses: actions/upload-artifact@v6
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always()) }}
      with:
        name: rust-planner-${{ matrix.runner }}-evidence
        path: '${{ env.CI_JOB_TEMP }}/planner-comparison/

          ${{ env.CI_JOB_TEMP }}/planner-native-memory/

          ${{ env.CI_JOB_TEMP }}/planner-artifact/

          ${{ env.CI_JOB_TEMP }}/planner-source/

          ${{ env.CI_JOB_TEMP }}/planner-sanitized/

          ${{ env.CI_JOB_TEMP }}/planner-original/params/*.json

          ${{ env.LOCAL_CI_TARGET_DIR }}/debug/openpilot-plannerd

          ${{ env.LOCAL_CI_TARGET_DIR }}/debug/examples/plannerd_*


          ${{ env.CI_JOB_TEMP }}/local-arm/execution.json

          ${{ env.CI_JOB_TEMP }}/local-arm/qemu-version.txt

          ${{ env.CI_JOB_TEMP }}/local-arm/proot-version.txt

          '
      id: local_evidence_1
    - name: Finish emulated architecture evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.ci296_source_admission.outcome == 'success') }}
      uses: ./.ci296-source-rust--planner-runtime/source/.github/actions/local-arm
      with: &id003
        cleanup: 'true'
      env: *id001
    - name: Seal private source and index after maintained checks
      id: ci296_source_seal
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"

        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"

        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
        1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"

        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"

        git diff --exit-code

        git diff --cached --exit-code

        df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"

        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"

        '
    - name: Retain private job ownership and source evidence
      id: ci296_private_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: private-rust-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        retention-days: 14
        if-no-files-found: error
    - name: Clean only uploaded owned source alias and target
      id: ci296_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.local_evidence_1.outcome == 'success' && steps.local_evidence_1.outputs.artifact-id
        != '' && steps.local_evidence_1.outputs.artifact-digest != '' && steps.ci296_private_evidence.outcome ==
        'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest
        != '' && steps.ci296_source_seal.outcome == 'success' && env.CI296_SOURCE_OWNER != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI296_HOST_CONTROL: '1'
        UPLOAD_ID: ${{ steps.ci296_private_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.ci296_private_evidence.outputs.artifact-digest }}
      run: "set -euo pipefail\n[[ $UPLOAD_ID =~ ^[0-9]+$ ]]\n[[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]\nworkspace=$CI296_ACTIONS_WORKSPACE\n\
        p=$CI296_SOURCE_OWNER\ncase \"$p\" in \"$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"\
        ??????) ;; *) exit 1 ;; esac\ntest -d \"$p\" && test ! -L \"$p\"\ntest \"$(realpath -e -- \"$p\")\" = \"\
        $p\"\ntest \"$(stat -c '%u' -- \"$p\")\" = \"$(id -u)\"\ntest \"$(stat -c '%d:%i' -- \"$p\")\" = \"$CI296_SOURCE_IDENTITY\"\
        \ntest -f \"$p/.ci296-owner\" && test ! -L \"$p/.ci296-owner\"\ntest \"$(cat \"$p/.ci296-owner\")\" = \"\
        $GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\ntest \"$CI296_SOURCE\" = \"$p/source\"\ntest -d \"$p/source\"\
        \ && test ! -L \"$p/source\"\ntest \"$(realpath -e -- \"$p/source\")\" = \"$p/source\"\nalias_path=\"$CI296_ACTIONS_WORKSPACE/$CI296_ALIAS_BASENAME\"\
        \ntest \"$CI296_SOURCE_ALIAS\" = \"$alias_path\"\ntest -L \"$alias_path\"\ntest \"$(readlink -- \"$alias_path\"\
        )\" = \"$p\"\ntest \"$(stat -c '%d:%i' -- \"$alias_path\")\" = \"$CI296_ALIAS_IDENTITY\"\nrm -- \"$alias_path\"\
        \nif ! rm -rf --one-file-system -- \"$p\"; then\n  sudo -n rm -rf --one-file-system -- \"$p\"\nfi\n"
    - name: Clean common owned temporary paths after uploaded source
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
