name: 296 native model preparation bounded execution and archive preflight
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-family-preparation-preflight-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  model-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: aaf5efa0eb2b4a45e7fb444224546fee247a953f
        persist-credentials: false
    - name: Reserve disk and install hosted native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = aaf5efa0eb2b4a45e7fb444224546fee247a953f

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        mkdir "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y g++ capnproto libcapnp-dev pkg-config liblzma-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Compile preparation tools and grouped gate; run changed pure regressions and strict Clippy
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --lib model_family_prepare::
        --locked -- --nocapture > "$proof/prepare-unit.stdout" 2> "$proof/prepare-unit.stderr" || { tail -n 100 "$proof/prepare-unit.stdout"
        "$proof/prepare-unit.stderr"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test model_family_retirement
        --test model_family_prepare --locked -- --nocapture > "$proof/gate-unit.stdout" 2> "$proof/gate-unit.stderr" || {
        tail -n 100 "$proof/gate-unit.stdout" "$proof/gate-unit.stderr"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --lib --bin stage-model-family-usb-assets
        --bin prepare-model-family-catalog --test model_family_retirement --test model_family_prepare --locked -- -D warnings
        > "$proof/clippy.stdout" 2> "$proof/clippy.stderr" || { tail -n 100 "$proof/clippy.stderr"; exit 1; }

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-model-family-preparation-preflight-296
        path: ${{ runner.temp }}/driver-fixture-preflight/
        if-no-files-found: error
        retention-days: 5
