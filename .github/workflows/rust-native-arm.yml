        fi
    - name: Clean common owned temporary paths after uploaded source
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()
        && steps.local_evidence_1.outcome == 'success' && steps.local_evidence_1.outputs.artifact-id != '' && steps.local_evidence_1.outputs.artifact-digest
        != '' && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest
        != '' && steps.arm530_sdk_final.outcome == 'success' && steps.ci296_source_cleanup.outcome == 'success') }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
      env:
        CI296_HOST_CONTROL: '1'
    defaults:
      run:
        shell: openpilot-local-shell {0}
  carrot-man-runtime:
    name: CarrotMan original and native on standard ARM VM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: aarch64
