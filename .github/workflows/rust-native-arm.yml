        done
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Keep original Python installations private
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
