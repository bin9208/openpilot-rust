        test "$CI296_SOURCE_ALIAS" = "$alias_path"
        test -L "$alias_path"
        test "$(readlink -- "$alias_path")" = "$p"
        test "$(stat -c '%d:%i' -- "$alias_path")" = "$CI296_ALIAS_IDENTITY"
