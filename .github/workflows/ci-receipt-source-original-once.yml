name: ci-receipt metadata independent original once
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/ci-receipt-source-original-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 0501612741fe402bedf50ead847f2f85fc9f5587
        persist-credentials: false
    - name: Capture held original snippets only
      run: "set -euo pipefail\n test \"$(git rev-parse HEAD)\" = 0501612741fe402bedf50ead847f2f85fc9f5587\n available=$(df\
        \ -PB1 \"$GITHUB_WORKSPACE\" | awk 'NR==2 {print $4}')\n test \"$available\" -ge 26910654464\n proof=\"$RUNNER_TEMP/ci-receipt-source\"\
        \n mkdir \"$proof\"\n printf '%s' ''\
        \ | base64 -d > \"$proof/capture-original.py\"\n printf '%s  %s\\n' '80fead3541706961de21205d36b620cf25985c5e8269c59c7c51c787f05dce00'\
        \ \"$proof/capture-original.py\" | sha256sum --check --strict\n python -m py_compile \"$proof/capture-original.py\"\
        \n python -P \"$proof/capture-original.py\" \"$GITHUB_WORKSPACE\" \"$proof/original\" > \"$proof/capture.stdout\"\
        \ 2> \"$proof/capture.stderr\"\n git rev-parse HEAD > \"$proof/SOURCE_COMMIT\"\n sha256sum \"$proof/original/manifest.json\"\
        \ > \"$proof/manifest.sha256\"\n test \"$(git rev-parse HEAD)\" = 0501612741fe402bedf50ead847f2f85fc9f5587"
    - name: Retain source-only receipts even on failure
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ci-receipt-metadata-original
        path: ${{ runner.temp }}/ci-receipt-source/
        retention-days: 7
        if-no-files-found: error
