name: 296 beep actual Python deletion complete native proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/beep-retirement-296-once.yml
permissions:
  contents: read
jobs:
  beep-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: ca042774dd376bd43838d28f32ff39a19c9b7bbb
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ca042774dd376bd43838d28f32ff39a19c9b7bbb
        persist-credentials: false
    - name: Admit exact source and native-only prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/beep-retirement-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev libzmq3-dev pkg-config strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        printf ''BEEP_REFERENCE_CHECKER_BINARY=%s/rust/target/debug/check-beep-reference\nBEEP_REFERENCE_BINARY=%s/rust/target/debug/examples/beep_trace\nBEEP_REFERENCE_ORIGINAL=%s/rust/crates/dev-tools/tests/fixtures/beep-reference/3835653-original\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''BEEP_REFERENCE_ORIGINAL_MANIFEST_SHA256=0a02d6aacb5b930012a47886c389571d9cf3ff404ecd796171045f10734a9188\nBEEP_REFERENCE_EVIDENCE=%s/test-output\nBEEP_REFERENCE_RETIREMENT_EVIDENCE=%s/retirement\nBEEP_REFERENCE_EXPECT_ABSENT=1\nBEEP_REFERENCE_CHECKER_ABSENT=1\n''
        "$proof" "$proof" >> "$GITHUB_ENV"

        '
    - name: Build fresh checker and example without Python bindings
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/beep-retirement-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-beepd --example beep_trace --locked 2>&1 | tee "$proof/example-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --bin
        check-beep-reference --locked 2>&1 | tee "$proof/checker-build.log"

        '
    - name: Require full twenty cases in two roots, exact21exec audits and all negative controls
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/beep-retirement-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --lib beep_reference_check::tests
        --locked -- --nocapture 2>&1 | tee "$proof/unit-tests.log"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --test
        beep_reference_check --test beep_reference_retirement --locked -- --nocapture 2>&1 | tee "$proof/retirement-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features beep-reference-native --lib
        --bin check-beep-reference --test beep_reference_check --test beep_reference_retirement --locked -- -D warnings 2>&1
        | tee "$proof/clippy.log"


        test ! -e rust/tools/check_beepd_reference.py

        test ! -L rust/tools/check_beepd_reference.py

        rust/target/debug/check-beep-reference --binary "$BEEP_REFERENCE_BINARY" --original "$BEEP_REFERENCE_ORIGINAL" --original-manifest-sha256
        "$BEEP_REFERENCE_ORIGINAL_MANIFEST_SHA256" --output "$proof/default-cli" > "$proof/default-cli.stdout" 2> "$proof/default-cli.stderr"

        test ! -s "$proof/default-cli.stderr"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: beep-native-retirement-296
        path: ${{ runner.temp }}/beep-retirement-296/
