        >> "$GITHUB_ENV"

        printf ''CACHEDB=%s/xdg-cache/tinygrad/cache.db\nUV_CACHE_DIR=%s/uv-cache\n'' "$job_root" "$job_root" >> "$GITHUB_ENV"

        export PUBLISHER_JOB_ROOT="$job_root"

        base64 --decode <<''RESOURCES'' | gzip --decompress > "$job_root/proof/runner_resources.py"

        

        RESOURCES

        printf ''%s  %s\n'' 94b1546b235131dd396c37ec0cc4c11d625c7abce05490f094f1811955c1b2b6 "$job_root/proof/runner_resources.py"
        | sha256sum --check --strict -

        base64 --decode <<''MEASURED_PROFILE'' | gzip --decompress > "$job_root/proof/resource-evidence.json"

        

