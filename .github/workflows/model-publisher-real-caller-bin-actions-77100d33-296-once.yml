    - name: Always package raw failure or success evidence
      if: always() && env.PUBLISHER_JOB_ROOT != ''
      shell: bash
      run: "set -euo pipefail\nproof=\"$PUBLISHER_CALLER_PROOF\"\nout=\"$PUBLISHER_JOB_ROOT/artifact\"\ntest -d \"$proof\"\
        \ && test -d \"$out\"\npython3 \"$proof/runner_resources.py\" package 4096 unmeasured\n# Pack bounded raw evidence\
        \ even when a functional step fails. Never dereference\n# deliberate helper aliases; record the symlink itself in\
        \ tar.\npython - <<'BOUND_PROOF'\nimport os,stat,json\nfrom pathlib import Path\nroot=Path(os.environ['PUBLISHER_CALLER_PROOF'])\n\
        count=total=0\nfor path in root.rglob('*'):\n m=path.lstat();count+=1\n assert count<=100000\n assert stat.S_ISREG(m.st_mode)\
        \ or stat.S_ISDIR(m.st_mode) or stat.S_ISLNK(m.st_mode),path\n if stat.S_ISREG(m.st_mode):\n  assert m.st_size<=1024**3,path\n\
        \  total+=m.st_size\n assert total<=4*1024**3\n(root/'artifact-counts.json').write_text(json.dumps({'entries':count,'file_bytes':total})+'\\\
        n')\nBOUND_PROOF\nfind \"$proof\" -type f -print0 | sort -z > \"$out/files.nul\"\nxargs -0 -r sha256sum < \"$out/files.nul\"\
