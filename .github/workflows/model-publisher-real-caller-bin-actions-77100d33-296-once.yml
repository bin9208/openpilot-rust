        retention-days: 7
    - name: Clean only the marked job-owned root after artifact upload
      if: always() && steps.package_evidence.outcome == 'success' && steps.artifact_upload.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\nif test -n \"${PUBLISHER_JOB_ROOT:-}\" && test -f \"$PUBLISHER_JOB_ROOT/job-owner.json\"; then\n\
        \ case \"$PUBLISHER_JOB_ROOT\" in \"$RUNNER_TEMP\"/296-model-publisher-\"$GITHUB_RUN_ID\"-\"$GITHUB_RUN_ATTEMPT\"\
