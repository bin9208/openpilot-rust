name: 296 native soundd source staging and retained runtime closure
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/soundd-source-stage-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  soundd-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 7219cf5e794a77a01b66eaf4ce801c056a80b7d7
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Bind exact source and recover hosted disk before prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 7219cf5e794a77a01b66eaf4ce801c056a80b7d7

        proof="$RUNNER_TEMP/soundd-source-stage-296"

        mkdir -p "$proof" "$RUNNER_TEMP/sensor-audio"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev pkg-config libavcodec-dev libavformat-dev
        libavutil-dev libzstd-dev strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Execute exact retained original staging heredoc once without restoring checker
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/soundd-source-stage-296\"\nexport SOUNDD_NATIVE_PRESENT_ROOT=\"$GITHUB_WORKSPACE\"\
        \nexport SOUNDD_NATIVE_ABSENT_ROOT=\"$proof/original-output\"\npython - <<'STAGE'\nimport hashlib, json, os\nfrom\
        \ pathlib import Path\nroot = Path(os.environ['SOUNDD_NATIVE_PRESENT_ROOT'])\nabsent = Path(os.environ['SOUNDD_NATIVE_ABSENT_ROOT'])\n\
        pins = json.loads((root / 'rust/crates/dev-tools/tests/fixtures/soundd-daemon/manifest.json').read_text())['source_sha256']\n\
        assert len(pins) == 21\nfor name, digest in pins.items():\n  if name == 'rust/tools/check_soundd_daemon.py':\n   \
        \ assert not (root / name).exists() and not (root / name).is_symlink()\n    continue\n  data = (root / name).read_bytes()\n\
        \  assert hashlib.sha256(data).hexdigest() == digest, name\n  path = absent / name\n  path.parent.mkdir(parents=True,\
        \ exist_ok=True)\n  path.write_bytes(data)\nassert len([p for p in absent.rglob('*') if p.is_file()]) == 20\nSTAGE\n\
        printf '%s\\n' 56630b535e2da704cf44ce523f9fbcfe662f9e32d2c42821a6938f00a500bf77 > \"$proof/original-staging-script.sha256\"\
        \nprintf '%s\\n' 57594f054a4454d09247f88d0630c39145853dd7 > \"$proof/ORIGINAL_WORKFLOW_SOURCE\"\n"
    - name: Build native audio daemon and actual fixture producer
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-soundd --bin openpilot-soundd --locked

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-policy-native --bin create-soundd-fixture-assets
        --locked

        '
    - name: Build and validate native sound daemon controller
      run: "set -euo pipefail\nexport SOUNDD_DAEMON_BINARY=\"$PWD/rust/target/debug/openpilot-soundd\"\nexport SOUNDD_DAEMON_WORKER_BINARY=\"\
        $PWD/rust/target/debug/check-soundd-daemon\"\nexport SOUNDD_FIXTURE_ASSETS_BINARY=\"$PWD/rust/target/debug/create-soundd-fixture-assets\"\
        \nexport SOUNDD_PORTAUDIO_LIBRARY=\"$RUNNER_TEMP/owned-soundd-portaudio.so\"\nexport SOUNDD_DAEMON_TEST_OUTPUT=\"\
        $RUNNER_TEMP/sensor-audio/soundd-native-tests\"\nfor name in SOUNDD_DAEMON_BINARY SOUNDD_DAEMON_WORKER_BINARY SOUNDD_FIXTURE_ASSETS_BINARY\
        \ SOUNDD_PORTAUDIO_LIBRARY SOUNDD_DAEMON_TEST_OUTPUT; do\n  printf '%s=%s\\n' \"$name\" \"${!name}\" >> \"$GITHUB_ENV\"\
        \ndone\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build\
        \ --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3\
        \ --config profile.dev.package.sha2.opt-level=3 --bin check-soundd-daemon --bin stage-soundd-source --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 64\ncc -std=c11 -shared -fPIC -pthread -Wall -Wextra -Werror rust/tools/fixtures/soundd/portaudio.c\
        \ -o \"$SOUNDD_PORTAUDIO_LIBRARY\"\n"
    - name: Require native sound daemon finalization and process contracts
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib soundd_daemon_check::worker::tests --locked -- --test-threads=1

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --test soundd_source_stage --locked

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib --bin stage-soundd-source --test soundd_source_stage --locked
        -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --test soundd_daemon_check --test soundd_daemon_runtime --locked --
        --test-threads=1

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib --bin check-soundd-daemon --test soundd_daemon_check --test soundd_daemon_runtime
        --test soundd_daemon_retirement --locked -- -D warnings

        '
    - name: Compare actual native staging CLI against independently executed original output
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/soundd-source-stage-296"

        export SOUNDD_STAGE_ROOT="$GITHUB_WORKSPACE"

        export SOUNDD_STAGE_ORIGINAL="$proof/original-output"

        export SOUNDD_STAGE_NATIVE="$proof/native-output"

        export SOUNDD_STAGE_COMPARISON="$proof/native-original-comparison.json"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --test soundd_source_stage --locked actual_cli_matches_independently_staged_twenty_file_output
        -- --ignored --exact --nocapture > "$proof/actual-cli.stdout" 2> "$proof/actual-cli.stderr" || { cat "$proof/actual-cli.stdout"
        "$proof/actual-cli.stderr"; exit 1; }

        '
    - name: Require sound daemon same-ELF present and absent execution proof
      run: "set -euo pipefail\ntest ! -e rust/tools/check_soundd_daemon.py\ntest ! -L rust/tools/check_soundd_daemon.py\n\
        proof=\"$RUNNER_TEMP/sensor-audio/soundd-retirement\"\nexport SOUNDD_NATIVE_PRESENT_OUTPUT=\"$proof/present\"\nexport\
        \ SOUNDD_NATIVE_ABSENT_OUTPUT=\"$proof/absent\"\nexport SOUNDD_NATIVE_PRESENT_ROOT=\"$GITHUB_WORKSPACE\"\nexport SOUNDD_NATIVE_ABSENT_ROOT=\"\
        $proof/absent-root\"\nexport SOUNDD_NATIVE_PRESENT_EXEC=\"$proof/present.exec\"\nexport SOUNDD_NATIVE_ABSENT_EXEC=\"\
        $proof/absent.exec\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 128\nmkdir -p \"$proof\"\ngit rev-parse HEAD > \"$proof/SOURCE_COMMIT\"\nsha256sum \"$SOUNDD_DAEMON_BINARY\" \"\
        $SOUNDD_DAEMON_WORKER_BINARY\" \"$SOUNDD_FIXTURE_ASSETS_BINARY\" \"$SOUNDD_PORTAUDIO_LIBRARY\" \"$PWD/rust/target/debug/stage-soundd-source\"\
        \ > \"$proof/executables.sha256\"\n# Stage only the exact retained source identities; do not copy the retired checker.\n\
        \"$PWD/rust/target/debug/stage-soundd-source\" --root \"$SOUNDD_NATIVE_PRESENT_ROOT\" --output \"$SOUNDD_NATIVE_ABSENT_ROOT\"\
        \ > \"$proof/source-stage.json\"\ntest ! -e \"$SOUNDD_NATIVE_ABSENT_ROOT/rust/tools/check_soundd_daemon.py\"\ntest\
        \ ! -L \"$SOUNDD_NATIVE_ABSENT_ROOT/rust/tools/check_soundd_daemon.py\"\nfor lane in PRESENT ABSENT; do\n  root_var=\"\
        SOUNDD_NATIVE_${lane}_ROOT\"\n  output_var=\"SOUNDD_NATIVE_${lane}_OUTPUT\"\n  exec_var=\"SOUNDD_NATIVE_${lane}_EXEC\"\
        \n  OPENPILOT_RUST_ROOT=\"${!root_var}\" PATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=5s 180s /usr/bin/strace\
        \ -f -qq -s 65535 -e trace=execve,execveat -o \"${!exec_var}\" \"$SOUNDD_DAEMON_WORKER_BINARY\" --binary \"$SOUNDD_DAEMON_BINARY\"\
        \ --output \"${!output_var}\" --fixture-assets-binary \"$SOUNDD_FIXTURE_ASSETS_BINARY\" --portaudio-library \"$SOUNDD_PORTAUDIO_LIBRARY\"\
        \ > \"$proof/$lane.stdout\" 2> \"$proof/$lane.stderr\"\ndone\nsha256sum -c \"$proof/executables.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features soundd-daemon-native --config profile.test.package.sha2.opt-level=3 --config profile.dev.package.sha2.opt-level=3\
        \ --test soundd_daemon_retirement --locked -- --nocapture\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-soundd-source-stage-296
        retention-days: 5
        if-no-files-found: error
        include-hidden-files: true
        path: '${{ runner.temp }}/soundd-source-stage-296/

          ${{ runner.temp }}/sensor-audio/

          !${{ runner.temp }}/soundd-source-stage-296/original-output/**

          !${{ runner.temp }}/soundd-source-stage-296/native-output/**

          !${{ runner.temp }}/sensor-audio/soundd-retirement/absent-root/**

          '
