name: 296 actual fresh road runtime image provenance
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-road-runtime-provenance-r3-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  road-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BRIDGE_CATALOG_ROOTS: native-catalog:road-pipeline-1928:road-pipeline-1344:dm-pipeline-1928:dm-pipeline-1344:model-input-pipelines:driving-four-source
      EXPECTED_SOURCE: 800e2c8f808d0abf347787a01d4c7b9ce1fec942
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 800e2c8f808d0abf347787a01d4c7b9ce1fec942
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Prepare bounded genuine original road provenance
      id: setup
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang libllvm18 liblzma-dev git-lfs capnproto libcapnp-dev jq

        rustup toolchain install 1.94.0 --profile minimal

        proof="$RUNNER_TEMP/road-runtime-provenance-296"

        mkdir "$proof" "$RUNNER_TEMP/road-provenance-artifact"

        printf ''ROAD_PROVENANCE_PROOF=%s\n'' "$proof" >> "$GITHUB_ENV"

        '
    - name: Admit exact read-only observer payload
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''ROAD_RUNTIME_PROVENANCE_PAYLOAD'' > "$ROAD_PROVENANCE_PROOF/trace_road_runtime_images.py"

        

        ROAD_RUNTIME_PROVENANCE_PAYLOAD

        printf ''%s  %s\n'' b820250a50c35c99e45e4808f7d47c48a1024b929c8334912c8608bb5932ee1d "$ROAD_PROVENANCE_PROOF/trace_road_runtime_images.py"
        | sha256sum --check --strict -

        '
    - name: Reject stale seals and verify JSON identity roundtrip before provider work
      shell: bash
      run: "set -euo pipefail\npython - <<'SEAL_PREFLIGHT'\nimport ast,hashlib,json,os,stat,tempfile\nfrom pathlib import\
        \ Path\nproof=Path(os.environ['ROAD_PROVENANCE_PROOF'])\nsource=(proof/'trace_road_runtime_images.py').read_text()\n\
        tree=ast.parse(source)\nnodes=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name in ('identity','held')]\n\
        assert len(nodes)==2\nnamespace={'os':os,'stat':stat,'Path':Path,'sha':lambda raw:hashlib.sha256(raw).hexdigest()}\n\
        exec(compile(ast.Module(body=nodes,type_ignores=[]),'<stdlib-only-identity-preflight>','exec'),namespace)\nwith tempfile.TemporaryDirectory(prefix='seal-preflight-',dir=proof)\
        \ as directory:\n path=Path(directory)/'input';path.write_bytes(b'authentic bounded seal fixture')\n raw,seal=namespace['held'](path,4096)\n\
        \ expected=json.loads(json.dumps(seal));assert seal==expected\n historical=dict(seal,identity=tuple(seal['identity']));assert\
        \ historical!=json.loads(json.dumps(historical))\n rejected=[]\n for field in ('path','bytes','sha256'):\n  stale=json.loads(json.dumps(expected))\n\
        \  stale[field]=stale[field]+1 if field=='bytes' else stale[field]+'-stale'\n  assert seal!=stale;rejected.append(field)\n\
        \ for index in range(6):\n  stale=json.loads(json.dumps(expected));stale['identity'][index]+=1\n  assert seal!=stale;rejected.append('identity['+str(index)+']')\n\
        \ path.write_bytes(b'changed!! bounded seal fixture')\n _,changed=namespace['held'](path,4096);assert changed!=expected\n\
        \ rejected.append('actual-file-bytes')\n(proof/'seal-preflight.json').write_text(json.dumps({'R2_roundtrip_rejected':True,'R3_roundtrip_admitted':True,'stale_seals_rejected':rejected,'identity_fields_preserved':6,'provider_or_generated_code_executed':False},indent=2)+'\\\
        n')\nSEAL_PREFLIGHT\n"
    - name: Build actual native callers and admit original ONNX using maintained providers
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run --bin offline-llvm-guarded-add
        > "$proof/runtime-build.log" 2>&1 || { cat "$proof/runtime-build.log"; exit 1; }

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''''

        '
    - name: Bind same-source helper and entire actual source/provider caller closure
      id: bind
      shell: bash
      run: "set -euo pipefail\nproof=\"$ROAD_PROVENANCE_PROOF\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nhelper=$(readlink\
        \ -f \"$GITHUB_WORKSPACE/rust/target/debug/offline-llvm-guarded-add\")\ntest -x \"$helper\" && test ! -L \"$helper\"\
        \nprintf 'MODEL_LLVM_GUARDED_ADD_BINARY=%s\\nMODEL_LLVM_GUARDED_ADD_SHA256=%s\\n' \"$helper\" \"$(sha256sum \"$helper\"\
        \ | cut -d' ' -f1)\" >> \"$GITHUB_ENV\"\n# This is a separate provenance probe, never a source-absence acceptance\
        \ run.\n# Hold all tracked source users, compiler inputs, provider manifests and actual\n# ONNX bytes after LFS admission.\
        \ No historical/source hash replacements.\ngit ls-files -z -- tinygrad_repo openpilot/selfdrive/modeld openpilot/common\
        \ openpilot/system/camerad rust/tools/model_export rust/tools/check_pipeline_reference.py rust/tools/build_model_pipelines.py\
        \ rust/crates/model-runtime rust/Cargo.toml rust/Cargo.lock rust/rust-toolchain.toml uv.lock > \"$proof/tracked-candidates.nul\"\
        \n: > \"$proof/source-paths.nul\"\nwhile IFS= read -r -d '' path; do\n case \"$path\" in *.py|*.rs|*.toml|*.lock|*.json|*.onnx)\
        \ ;; *) continue ;; esac\n test -f \"$path\" && test ! -L \"$path\"\n printf '%s\\0' \"$path\" >> \"$proof/source-paths.nul\"\
        \ndone < \"$proof/tracked-candidates.nul\"\nprintf '%s\\0' \"$helper\" \"$GITHUB_WORKSPACE/rust/target/debug/model-run\"\
        \ \"$(readlink -f \"$LLVM_PATH\")\" \"$(readlink -f \"$(command -v python)\")\" \"$proof/trace_road_runtime_images.py\"\
        \ >> \"$proof/source-paths.nul\"\nxargs -0 -r sha256sum < \"$proof/source-paths.nul\" > \"$proof/sources.before.sha256\"\
        \nwhile IFS= read -r -d '' path; do stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\"; done < \"$proof/source-paths.nul\"\
        \ > \"$proof/sources.before.identities\"\npython -m pip freeze > \"$proof/providers.before.txt\"\nlscpu --json > \"\
        $proof/lscpu.json\"\ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nrustc -Vv > \"$proof/rustc.txt\"\nprintf '%s\\\
        n' \"$EXPECTED_SOURCE\" \"$GITHUB_WORKFLOW_SHA\" > \"$proof/source-workflow.txt\"\n"
    - name: Observe unchanged fresh original compile and real CPUProgram image construction
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        timeout --signal=KILL 1800 python "$proof/trace_road_runtime_images.py" compile > "$proof/compile.stdout" 2> "$proof/compile.stderr"
        || { tail -n 100 "$proof/compile.stdout" "$proof/compile.stderr"; exit 1; }

        test -s "$proof/fresh-driving.pkl" && test -s "$proof/fresh-driving.seal.json"

        '
    - name: Observe actual loaded road images and strict two-frame native comparison
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        # Two-frame prefix reaches the observed model-1 failure boundary. Actual stock

        # original/native comparison still requires byte equality; never a relaxed gate.

        status=0

        timeout --signal=KILL 600 python "$proof/trace_road_runtime_images.py" compare > "$proof/compare.stdout" 2> "$proof/compare.stderr"
        || status=$?

        printf ''%s\n'' "$status" > "$proof/strict-prefix.status"

        tail -n 100 "$proof/compare.stdout" "$proof/compare.stderr"

        exit "$status"

        '
    - name: Always authenticate held sources/providers and preserve actual failure evidence
      if: always() && steps.bind.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        status=0

        sha256sum --check --strict "$proof/sources.before.sha256" > "$proof/sources.after.log" 2>&1 || status=1

        while IFS= read -r -d '''' path; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$path" || status=1; done < "$proof/source-paths.nul"
        > "$proof/sources.after.identities"

        cmp "$proof/sources.before.identities" "$proof/sources.after.identities" || status=1

        python -m pip freeze > "$proof/providers.after.txt" || status=1

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt" || status=1

        test -s "$proof/compile/status.json" && test -s "$proof/compare/status.json" || status=1

        jq -e ''.exit==0 and .events>0 and .wrappers_delegated_unchanged==true'' "$proof/compile/status.json" > /dev/null
        || status=1

        jq -e ''.events>0 and .wrappers_delegated_unchanged==true'' "$proof/compare/status.json" > /dev/null || status=1

        test -s "$proof/original-output/files.json" && test -s "$proof/strict-prefix.status" || status=1

        # Archive only this bounded owned root, including real raw outputs on failure.

        find "$proof" -type l -print -quit > "$proof/unexpected-symlinks.txt"

        test ! -s "$proof/unexpected-symlinks.txt" || status=1

        size=$(du --bytes --summarize "$proof" | cut -f1)

        test "$size" -le 1073741824 || status=1

        printf ''%s\n'' "$status" > "$proof/final-guards.status"

        test "$status" -eq 0

        '
    - name: Stage only exact bounded provenance and raw failure roster
      if: always() && steps.setup.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\nproof=\"$ROAD_PROVENANCE_PROOF\"\narchive=\"$RUNNER_TEMP/road-provenance-artifact\"\ntest -d\
        \ \"$proof\" && test ! -L \"$proof\"\nfind \"$proof\" -type l -print -quit > \"$archive/unexpected-symlinks.txt\"\n\
        test ! -s \"$archive/unexpected-symlinks.txt\"\nfind \"$proof\" -type f -print0 > \"$archive/absolute-roster.nul\"\
        \n: > \"$archive/relative-roster.nul\"\n: > \"$archive/source-files.sha256\"\nfiles=0; bytes=0\nwhile IFS= read -r\
        \ -d '' file; do\n test -f \"$file\" && test ! -L \"$file\"\n size=$(stat -c '%s' \"$file\");test \"$size\" -le 134217728\n\
        \ files=$((files+1));bytes=$((bytes+size))\n test \"$files\" -le 20000 && test \"$bytes\" -le 1073741824\n case \"\
        $file\" in \"$proof\"/*) ;; *) exit 1 ;; esac\n printf '%s\\0' \"${file#\"$proof\"/}\" >> \"$archive/relative-roster.nul\"\
        \n sha256sum \"$file\" >> \"$archive/source-files.sha256\"\ndone < \"$archive/absolute-roster.nul\"\ntest \"$files\"\
        \ -gt 0\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 1024\ntar --create\
        \ --gzip --null --verbatim-files-from --no-recursion --directory=\"$proof\" --files-from=\"$archive/relative-roster.nul\"\
        \ --file=\"$archive/provenance.tar.gz\"\nsha256sum --check --strict \"$archive/source-files.sha256\" > \"$archive/source-files.after.log\"\
        \nsha256sum \"$archive/provenance.tar.gz\" > \"$archive/provenance.sha256\"\nprintf 'files=%s\\nbytes=%s\\n' \"$files\"\
        \ \"$bytes\" > \"$archive/counts.txt\"\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: road-runtime-provenance-800e2c8f808
        path: ${{ runner.temp }}/road-provenance-artifact/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
