name: 296 original uploader reference and logging group capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/uploader-original-group-296-once.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 06956b79d1d3ebacfa6e8a09616e9cdc1c358ed3
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 06956b79d1d3ebacfa6e8a09616e9cdc1c358ed3
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Reserve hosted capacity and pin original sources
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/uploader-original-group-296"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$proof/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        rustup toolchain install 1.94.0 --profile minimal

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0
        requests==2.34.2 PyJWT==2.15.1 cryptography==50.0.1

        python -m pip freeze > "$proof/providers.before.txt"

        printf ''b90a41b13ed1a9a99e23c771feaea3ad97ff9999c394e309e9d714f69f10a291  %s/rust/tools/check_uploader.py\n'' "$GITHUB_WORKSPACE"
        | sha256sum --check --strict

        printf ''bdac9f00bbb0434a81f535aac7aa1b95007fd80a28aa52b4ede1060bb17ff637  %s/rust/tools/check_uploader_logging.py\n''
        "$GITHUB_WORKSPACE" | sha256sum --check --strict

        printf ''3366e64eb36b0bad9b10023c46217f61c66aae0fe823120ae23d597d2456c872  %s/rust/tools/logmessaged_native.py\n''
        "$GITHUB_WORKSPACE" | sha256sum --check --strict

        printf ''ce6d6764911daaab1e9e5ce70152d9f5efc9b5ea006482064bb8192d36f735e3  %s/rust/tools/logmessaged_reference.py\n''
        "$GITHUB_WORKSPACE" | sha256sum --check --strict

        printf ''8af80c2411a3303d9f3e9e2255dd0732177d9af280abab6e7f568c7576e3a02e  %s/openpilot/system/loggerd/uploader.py\n''
        "$GITHUB_WORKSPACE" | sha256sum --check --strict

        printf ''35b6460ce0d1ea99066d86d6e81ef10edcd989a2f0967f07a8bae3957720e631  %s/openpilot/system/loggerd/xattr_cache.py\n''
        "$GITHUB_WORKSPACE" | sha256sum --check --strict

        printf ''10c6b0673654a798d7d32591dc5b67f39650aed086b812aff8ff62ae64da9177  %s/openpilot/common/api.py\n'' "$GITHUB_WORKSPACE"
        | sha256sum --check --strict

        printf ''b1cc68b63cff1386ba397c0cc527dbb38fb50b154043ffcb066ed7acce65ec83  %s/openpilot/common/utils.py\n'' "$GITHUB_WORKSPACE"
        | sha256sum --check --strict

        printf ''ce9b3b3d8498d76e1c4c0352a3e98e72759bb7f367ff8629c1329c46040595c3  %s/openpilot/common/logging_extra.py\n''
        "$GITHUB_WORKSPACE" | sha256sum --check --strict

        '
    - name: Build actual uploader/collector and original IPC binding for grouped observation
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/uploader-original-group-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-uploader -p openpilot-logmessaged --bins
        --examples > "$proof/build.stdout" 2> "$proof/build.stderr"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/uploader-original-msgq" > "$proof/msgq-build.stdout"
        2> "$proof/msgq-build.stderr"

        printf ''PYTHONPATH=%s/uploader-original-msgq:%s:%s/rust/tools\n'' "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
        >> "$GITHUB_ENV"

        sha256sum rust/target/debug/openpilot-uploader rust/target/debug/openpilot-logmessaged rust/target/debug/examples/uploader_trace
        > "$proof/binaries.before.sha256"

        '
    - name: Run unchanged original assertions with observation-only source hooks
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/uploader-original-group-296"

        base64 --decode <<''CAPTURE'' > "$proof/capture_original_uploader.py"

        

        CAPTURE

        printf ''9555d1e3699a070ddcbdb245c76c00e601602647c8089b4f17755d058b58ddc5  %s/capture_original_uploader.py\n'' "$proof"
        | sha256sum --check --strict

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        timeout --signal=TERM --kill-after=10s 900s python "$proof/capture_original_uploader.py" --root "$GITHUB_WORKSPACE"
        --binary "$GITHUB_WORKSPACE/rust/target/debug/openpilot-uploader" --trace "$GITHUB_WORKSPACE/rust/target/debug/examples/uploader_trace"
        --collector "$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged" --output "$proof/observations" > "$proof/capture.stdout"
        2> "$proof/capture.stderr"

        sha256sum --check --strict "$proof/binaries.before.sha256" > "$proof/binaries.after.txt"

        python -m pip freeze > "$proof/providers.after.txt"

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt"

        '
    - name: Retain original expectations, HTTP/signature evidence and raw collector packets outside Git
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: uploader-original-group-296
        path: ${{ runner.temp }}/uploader-original-group-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
