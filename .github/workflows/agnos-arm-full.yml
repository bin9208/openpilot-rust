name: Full AGNOS build on GitHub ARM
on:
  push:
    branches: ['codex/feat-643-agnos-arm-full']
    paths:
      - '.github/workflows/agnos-arm-full.yml'
      - 'tools/ci/agnos_arm_timing.py'
      - 'tools/ci/probe_native_agnos.py'
      - 'tools/ci/patches/proot-arm64-faccessat2.patch'
      - 'tools/ci/runner_policy.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agnos-full-hosted-arm-643-${{ github.sha }}-parallel-v2
  queue: max
  cancel-in-progress: false
jobs:
  compiler:
    name: Full AGNOS build and validation on GitHub ARM
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    # #608 actual ARM release build alone took 6,386,611 ms. This job now also
    # builds the real encoder; retain every command/pin and allow a bounded 6h.
    timeout-minutes: 360
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      AGNOS_NATIVE_HOSTED_ARM: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - name: Admit this host tool and extract operation
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(uname -m)" == aarch64 ]]
          lscpu
          free -h
          df -h "$CI_JOB_TEMP"
          python3 tools/ci/agnos_arm_timing.py start
          python3 - <<'PY'
          import os, shutil
          growth = 4 * 1024**3
          for path in (os.environ['RUNNER_TEMP'], os.environ['GITHUB_WORKSPACE']):
              free = shutil.disk_usage(path).free
              print(f'path={path} available_bytes={free} expected_host_tool_growth_bytes={growth}')
              if free < growth:
                  raise SystemExit('insufficient capacity for this operation; other data retained')
          PY
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs xz-utils gcc make pkg-config libtalloc-dev
          rustup toolchain install 1.94.0 --profile minimal
          proot_source=$(mktemp -d "$CI_JOB_TEMP/proot-5.5.0.XXXXXX")
          git -C "$proot_source" init
          git -C "$proot_source" remote add origin https://github.com/proot-me/proot.git
          git -C "$proot_source" fetch --depth=1 origin 25dc6a3134891f98a79f57ce1c2c1b23ff15cad1
          git -C "$proot_source" checkout --detach FETCH_HEAD
          [[ $(git -C "$proot_source" rev-parse HEAD) == 25dc6a3134891f98a79f57ce1c2c1b23ff15cad1 ]]
          git -C "$proot_source" apply --check "$GITHUB_WORKSPACE/tools/ci/patches/proot-arm64-faccessat2.patch"
          git -C "$proot_source" apply "$GITHUB_WORKSPACE/tools/ci/patches/proot-arm64-faccessat2.patch"
          make -C "$proot_source/src" -j"$(nproc)" WITHOUT_PYTHON=1 loader.elf build.h
          make -C "$proot_source/src" -j"$(nproc)" WITHOUT_PYTHON=1 proot
          "$proot_source/src/proot" --version
          timeout 30 "$proot_source/src/proot" -r / -w "$CI_JOB_TEMP" /bin/uname -m
          permission_fixture=$(mktemp -d "$CI_JOB_TEMP/proot-permissions.XXXXXX")
          printf readable > "$permission_fixture/readable"
          printf blocked > "$permission_fixture/blocked"
          chmod 000 "$permission_fixture/blocked"
          timeout 30 "$proot_source/src/proot" -r / \
            -b "$permission_fixture/readable:$permission_fixture/guest-readable" \
            -b "$permission_fixture/blocked:$permission_fixture/guest-blocked" \
            /bin/bash -c 'test -r "$1" && ! test -r "$2" && ! test -r "$3"' \
            native-proot-permissions "$permission_fixture/guest-readable" "$permission_fixture/guest-blocked" "$permission_fixture/absent"
          rm -rf -- "$permission_fixture"
          printf 'AGNOS_PROOT_PATH=%s\n' "$proot_source/src/proot" >> "$GITHUB_ENV"
          printf 'AGNOS_PROOT_PATCH_SHA256=%s\n' "$(sha256sum tools/ci/patches/proot-arm64-faccessat2.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Validate the current package growth policy before deep ARM preparation
        run: |
          sudo apt-get install -y g++ liblzma-dev pkg-config
          set -o pipefail
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib package::tests \
            2>&1 | tee "$CI_JOB_TEMP/host-package-space-tests.log"
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --example native_full_generation \
            2>&1 | tee "$CI_JOB_TEMP/host-generation-reuse-tests.log"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Build the pinned original planner ABI before deep ARM preparation
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
        run: |
          sudo apt-get install -y capnproto libcapnp-dev g++ libzmq3-dev gdb cmake make
          python - <<'PY'
          import json, os, platform, shutil
          from pathlib import Path
          base = Path('/proc/sys/fs/binfmt_misc')
          handlers = {}
          try:
              for p in base.iterdir():
                  if p.name not in ('register', 'status'):
                      try:
                          handlers[p.name] = p.read_text()[:8192]
                      except OSError as error:
                          handlers[p.name] = dict(unavailable=type(error).__name__)
          except OSError as error:
              handlers['unavailable'] = type(error).__name__
          record = dict(schema=1, source_commit=os.environ['GITHUB_SHA'],
                        kernel=platform.release(), architecture=platform.machine(),
                        uid=os.getuid(), gid=os.getgid(), binfmt_handlers=handlers,
                        tools={name: shutil.which(name) for name in
                               ('qemu-aarch64-static', 'chroot', 'unshare', 'nsenter', 'qemu-system-aarch64')},
                        shared_configuration_modified=False, source_entry_executed=False)
          (Path(os.environ['CI_JOB_TEMP'])/'host-native-entry-transport.json').write_text(json.dumps(record, indent=2)+'\n')
          PY
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.3.0 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3
          python -m pip download --only-binary=:all: --no-deps comma-deps-acados==0.2.2.post103 --dest "$CI_JOB_TEMP/host-planner-wheel"
          python -m pip install --no-deps "$CI_JOB_TEMP"/host-planner-wheel/*.whl
          planner_generator=$(python -P -c 'import acados; from pathlib import Path; print(Path(acados.__file__).parent)')
          python rust/tools/plannerd_ci_builder.py -- rust/tools/build_plannerd_acados.py --architecture aarch64 --cc gcc --python "$(command -v python)" --acados "$planner_generator" --wheel "$CI_JOB_TEMP"/host-planner-wheel/*.whl --output "$CI_JOB_TEMP/host-planner-artifact"
          python rust/tools/plannerd_ci_builder.py -- rust/tools/build_plannerd_source.py --artifact "$CI_JOB_TEMP/host-planner-artifact" --python "$(command -v python)" --acados "$planner_generator" --generator-wheel "$CI_JOB_TEMP"/host-planner-wheel/*.whl --cc gcc --output "$CI_JOB_TEMP/host-planner-source"
      - name: Exercise the unchanged original planner ABI before the full AGNOS build
        id: planner-host-abi
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set +e
          python -X faulthandler -u -P rust/tools/plannerd_acados_source.py \
            --baseline "$CI_JOB_TEMP/host-planner-source" --evidence "$CI_JOB_TEMP/host-planner-abi" \
            2>&1 | tee "$CI_JOB_TEMP/host-planner-abi.log"
          planner_abi_status=${PIPESTATUS[0]}
          printf '%s\n' "$planner_abi_status" > "$CI_JOB_TEMP/host-planner-abi.status"
          exit "$planner_abi_status"
      - name: Locate a planner ABI SIGILL without waiting for deep ARM execution
        if: failure() && steps.planner-host-abi.outcome == 'failure'
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          if [[ $(cat "$CI_JOB_TEMP/host-planner-abi.status") == 132 ]]; then
            lscpu > "$CI_JOB_TEMP/host-planner-cpu.txt"
            gdb --batch -ex run -ex 'info registers' -ex 'x/16i $pc-16' \
              -ex 'info sharedlibrary' -ex 'thread apply all bt' --args \
              "$(command -v python)" -u -P rust/tools/plannerd_acados_source.py \
              --baseline "$CI_JOB_TEMP/host-planner-source" --evidence "$CI_JOB_TEMP/host-planner-gdb-abi" \
              > "$CI_JOB_TEMP/host-planner-gdb.txt" 2>&1
          fi
      - uses: ./.github/actions/native-cache
        id: image-cache
        with:
          mode: restore
          name: native-agnos-assets
          key: native-agnos-image-077d42186def98025ffad9723774c96f45da10c87cc6fedbc58d0cf4fa65ffd4-v1
      - name: Prepare the exact genuine image through the content cache and prove zero-transfer repeat
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --bin openpilot-runtime-assets
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          "$native_target/debug/openpilot-runtime-assets" --plan tools/ci/fixtures/native-agnos-assets-599.json --cache "$RUNNER_TEMP/native-agnos-assets" > "$RUNNER_TEMP/native-agnos-assets-first.json"
          "$native_target/debug/openpilot-runtime-assets" --plan tools/ci/fixtures/native-agnos-assets-599.json --cache "$RUNNER_TEMP/native-agnos-assets" > "$RUNNER_TEMP/native-agnos-assets-reused.json"
      - uses: ./.github/actions/native-cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        with:
          mode: save
          name: native-agnos-assets
          key: native-agnos-image-077d42186def98025ffad9723774c96f45da10c87cc6fedbc58d0cf4fa65ffd4-v1
      - uses: ./.github/actions/native-cache
        id: rust-components-cache
        with:
          mode: restore
          name: native-rust-assets
          key: native-rust-194-aarch64-aaa177def36e01d539bee6bde95295230b9ce378f81057845db8d0ebe97898ee-v1
      - name: Prepare authenticated native Rust components and verify zero-transfer reuse
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --bin openpilot-runtime-inputs
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          "$native_target/debug/openpilot-runtime-inputs" --prepare-rust --plan rust/native-rust-toolchain.json \
            --cache "$RUNNER_TEMP/native-rust-assets" --store "$RUNNER_TEMP/native-rust-toolchains" > "$RUNNER_TEMP/native-rust-first.json"
          "$native_target/debug/openpilot-runtime-inputs" --prepare-rust --plan rust/native-rust-toolchain.json \
            --cache "$RUNNER_TEMP/native-rust-assets" --store "$RUNNER_TEMP/native-rust-toolchains" > "$RUNNER_TEMP/native-rust-reused.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['CI_JOB_TEMP'])
          first = json.loads((root/'native-rust-first.json').read_text())
          repeated = json.loads((root/'native-rust-reused.json').read_text())
          assert first['copied_bytes'] > 0 and repeated['copied_bytes'] == 0
          assert first['root'] == repeated['root'] and first['tree_sha256'] == repeated['tree_sha256']
          assert not first['compiler_executed'] and not first['runtime_activated']
          assert all(row['transferred_bytes'] in (0,row['bytes']) for row in first['assets'].values())
          assert all(row['transferred_bytes'] == row['stored_bytes'] == 0 for row in repeated['assets'].values())
          print('Authenticated ARM toolchain files prepared; repeated HTTP body and copied bytes both zero; compiler execution remains the following AGNOS step.')
          PY
      - uses: ./.github/actions/native-cache
        if: steps.rust-components-cache.outputs.cache-hit != 'true'
        with:
          mode: save
          name: native-rust-assets
          key: native-rust-194-aarch64-aaa177def36e01d539bee6bde95295230b9ce378f81057845db8d0ebe97898ee-v1
