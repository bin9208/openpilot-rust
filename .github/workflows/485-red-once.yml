name: 296 reproduce LLVM foreign-output rollback bug485
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/485-red-once.yml
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 33c82b5ba91aee198c4c4657850abe2b397e6065
        persist-credentials: false
    - name: Require two real rollback regressions and two passing controls
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/485-red"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = 33c82b5ba91aee198c4c4657850abe2b397e6065

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$proof/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        rustup toolchain install 1.94.0 --profile minimal

        status=0

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin offline-llvm-compile
        --features native-skip-miri output_ownership_tests -- --nocapture --test-threads=1 > "$proof/tests.stdout" 2> "$proof/tests.stderr"
        || status=$?

        printf ''%s\n'' "$status" > "$proof/test-status"

        test "$status" -eq 101

        grep -Fx ''test output_ownership_tests::foreign_replacement_survives_late_failure ... FAILED'' "$proof/tests.stdout"

        grep -Fx ''test output_ownership_tests::foreign_symlink_survives_late_failure ... FAILED'' "$proof/tests.stdout"

        grep -Fx ''test output_ownership_tests::unchanged_owned_output_is_removed_on_failure ... ok'' "$proof/tests.stdout"

        grep -Fx ''test output_ownership_tests::successful_output_is_retained ... ok'' "$proof/tests.stdout"

        grep -E ''^test result: FAILED\. 2 passed; 2 failed; 0 ignored;'' "$proof/tests.stdout"

        printf ''%s\n'' ''{"bug_reproduced":true,"fixed":false,"expected_failing_tests":2,"passing_controls":2,"scope":"real
        old Outputs Drop; no LLVM/model execution"}'' > "$proof/result.json"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: 485-red-evidence
        path: ${{ runner.temp }}/485-red/
        retention-days: 14
        if-no-files-found: warn
