name: 452 JSON11 raw Unix path original failure and actual locked wheel proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/json11-raw-452-once.yml
permissions:
  contents: read
jobs:
  json11:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: a35d166ebd66362effca8c1e832887b6889ec4dd
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
    - uses: actions/checkout@v7
      with:
        ref: a35d166ebd66362effca8c1e832887b6889ec4dd
        persist-credentials: false
    - name: Prepare exact-source hosted prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/json11-452"

        mkdir -p "$proof"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Require raw download regression fails on the original stager
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/json11-452"

        git fetch --no-tags --depth=1 origin cdfdb29137fe1c8df1a9181bbde178418a936f42

        git show cdfdb29137fe1c8df1a9181bbde178418a936f42:rust/crates/dev-tools/src/json11_stage.rs > rust/crates/dev-tools/src/json11_stage.rs

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        set +e

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --test native_build_closure json11_download_keeps_raw_output_path_bytes
        --locked -- --nocapture > "$proof/red.log" 2>&1

        status=$?

        set -e

        test "$status" = 101

        grep -F ''raw output path must stage the pinned wheel'' "$proof/red.log"

        grep -F ''test result: FAILED. 0 passed; 1 failed'' "$proof/red.log"

        git show "$EXPECTED_SOURCE":rust/crates/dev-tools/src/json11_stage.rs > rust/crates/dev-tools/src/json11_stage.rs

        git diff --exit-code -- rust/crates/dev-tools/src/json11_stage.rs

        '
    - name: Require fixed stager unit and complete native build closure regressions
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/json11-452"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --lib json11_stage:: --locked -- --nocapture 2>&1
        | tee "$proof/unit.log"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --test native_build_closure --locked -- --nocapture
        2>&1 | tee "$proof/closure.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --lib --bin stage-json11 --test native_build_closure
        --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --bin stage-json11 --locked 2>&1 | tee "$proof/build.log"

        '
    - name: Require actual locked wheel at raw Unix output path
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/json11-452\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\" --growth-mib\
        \ 512\ncat > \"$proof/raw_actual.py\" <<'PY_RAW'\nimport os,subprocess,json,pathlib,tomllib,hashlib,zipfile,tarfile\n\
        root=pathlib.Path(os.environ['GITHUB_WORKSPACE']); proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'json11-452'; raw=os.fsencode(proof)+b'/raw-\\\
        xff'\nrun=subprocess.run([os.fsencode(root/'rust/target/debug/stage-json11'),b'--root',os.fsencode(root),b'--output',raw,b'--architecture',b'x86_64'],capture_output=True,timeout=360)\n\
        (proof/'raw.stdout').write_bytes(run.stdout);(proof/'raw.stderr').write_bytes(run.stderr);assert run.returncode==0,(run.returncode,run.stderr)\n\
        receipt=json.loads(run.stdout);prefix=os.fsencode(receipt['prefix']);assert prefix.startswith(raw+b'/') and b'\\xff'in\
        \ prefix\nlock=tomllib.loads((root/'uv.lock').read_text());package=next(p for p in lock['package'] if p['name']=='comma-deps-json11');wheel=next(w\
        \ for w in package['wheels'] if 'manylinux_2_28_x86_64'in w['url']);name=wheel['url'].rsplit('/',1)[1];archive=raw+b'/'+name.encode();data=pathlib.Path(os.fsdecode(archive)).read_bytes();digest=hashlib.sha256(data).hexdigest();assert\
        \ 'sha256:'+digest==wheel['hash'];assert receipt['dependency']=={'json11_version':package['version'],'json11_sha256':digest,'json11_architecture':'x86_64'}\n\
        count=0\nwith zipfile.ZipFile(os.fsdecode(archive)) as z:\n assert z.testzip()is None\n for info in z.infolist():\n\
        \  if not info.is_dir():\n   actual=pathlib.Path(os.fsdecode(raw+b'/json11/'+info.filename.encode())).read_bytes();assert\
        \ actual==z.read(info);count+=1\nassert count>0;assert os.path.isdir(prefix);assert not os.path.exists(raw.replace(b'\\\
        xff',b'\\xef\\xbf\\xbd'))\nwith tarfile.open(proof/'raw-output.tar.gz','w:gz')as t:t.add(os.fsdecode(raw),arcname='raw-\\\
        udcff')\n(proof/'raw-comparison.json').write_text(json.dumps({'pass':True,'output_hex':raw.hex(),'prefix_hex':prefix.hex(),'wheel_sha256':digest,'extracted_files':count,'receipt':receipt},ensure_ascii=True,indent=2)+'\\\
        n')\nprint('PASS pinned actual wheel, raw argv/download/extraction/receipt bytes',count,digest)\nPY_RAW\npython3 \"\
        $proof/raw_actual.py\" 2>&1 | tee \"$proof/raw.log\"\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: json11-452-raw-boundary
        path: ${{ runner.temp }}/json11-452/
        if-no-files-found: error
