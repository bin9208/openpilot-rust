name: 296 Rust guarded-add EOF boundary and captured-target emission correspondence
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-road-rust-guarded-lean-r2-296-once.yml
permissions:
  actions: read
  contents: read
jobs:
  correspondence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 06956b79d1d3ebacfa6e8a09616e9cdc1c358ed3
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 06956b79d1d3ebacfa6e8a09616e9cdc1c358ed3
        persist-credentials: false
    - name: Pin source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/guarded-lean-296"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$proof/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal

        rustc +1.94.0 --version --verbose > "$proof/rustc.txt"

        '
    - name: Build only bounded source-only Rust CLI
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/guarded-lean-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072

        cargo +1.94.0 build --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" --locked -p openpilot-model-runtime --features
        native-skip-miri --bin offline-llvm-guarded-add > "$proof/build.stdout" 2> "$proof/build.stderr"

        sha256sum rust/target/debug/offline-llvm-guarded-add > "$proof/worker.sha256"


        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends libllvm18

        curl --fail --location --retry 3 --max-time 180 --output "$proof/llvm18.deb" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb

        printf ''af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n'' "$proof" | sha256sum
        --check --strict

        dpkg-deb --extract "$proof/llvm18.deb" "$proof/llvm18-captured"

        printf ''5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n''
        "$proof" | sha256sum --check --strict

        printf ''LLVM_PATH=%s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n'' "$proof" >> "$GITHUB_ENV"

        '
    - name: Fetch immutable retained IR and numerical evidence without model/provider setup
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/guarded-lean-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 256

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12404776700 --jq ''{id,name,size_in_bytes,digest,workflow_run}''
        > "$proof/accepted-artifact.json"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12410064619 --jq ''{id,name,size_in_bytes,digest,workflow_run}''
        > "$proof/exceptional-artifact.json"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12404776700/zip > "$proof/accepted.zip"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12410064619/zip > "$proof/exceptional.zip"

        test "$(stat -c %s "$proof/accepted.zip")" -eq 4391525

        test "$(stat -c %s "$proof/exceptional.zip")" -eq 30874373

        printf ''ba28ae07b5becc3afe4346db3e86437f9a93aaaf02031c19f83e070ad9c7d93b  %s/accepted.zip\n'' "$proof" | sha256sum
        --check --strict

        printf ''1b63bb25f60b0980aa8ec288cc19bf6eead84c84ceaedec78b0ccc04e93d1892  %s/exceptional.zip\n'' "$proof" | sha256sum
        --check --strict


        gh api repos/bin9208/openpilot-rust/actions/artifacts/12414722136 --jq ''{id,name,size_in_bytes,digest,workflow_run}''
        > "$proof/failed-lean-artifact.json"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12414722136/zip > "$proof/failed-lean.zip"

        test "$(stat -c %s "$proof/failed-lean.zip")" -eq 136597

        printf ''0387b815f1790317abc9c16b174554103122b89f53dd0e1eace4e2bcedf3c168  %s/failed-lean.zip\n'' "$proof" | sha256sum
        --check --strict

        '
    - name: Check explicit EOF rendering boundary and exact recorded-target LLVM object/IR
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/guarded-lean-296"

        base64 --decode <<''HELPER'' > "$proof/lean_correspondence_r2.py"

        

        HELPER

        printf ''de53f3685376cf20bdd474e399455c1a0f2925d9fd82ab259b399c77590287a4  %s/lean_correspondence_r2.py\n'' "$proof"
        | sha256sum --check --strict

        base64 --decode <<''HELPER'' > "$proof/recorded_llvm_compile.py"

        

        HELPER

        printf ''05a97371a45a0c3d97765fb44e7213df6271c8a5c96672a1b2771fc5ef82dcb2  %s/recorded_llvm_compile.py\n'' "$proof"
        | sha256sum --check --strict

        timeout --signal=TERM --kill-after=5s 120s python3 "$proof/lean_correspondence_r2.py" > "$proof/audit.stdout" 2> "$proof/audit.stderr"

        sha256sum --check --strict "$proof/worker.sha256" > "$proof/worker.after.txt"

        '
    - name: Preserve fresh correspondence and explicitly reused numerical evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: model-road-rust-guarded-lean-r2-296
        path: '${{ runner.temp }}/guarded-lean-296/

          !${{ runner.temp }}/guarded-lean-296/accepted.zip

          !${{ runner.temp }}/guarded-lean-296/exceptional.zip

          !${{ runner.temp }}/guarded-lean-296/failed-lean.zip

          !${{ runner.temp }}/guarded-lean-296/llvm18.deb

          !${{ runner.temp }}/guarded-lean-296/llvm18-captured/**'
        retention-days: 14
        if-no-files-found: warn
