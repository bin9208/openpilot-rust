name: 296 actual updater daemon and helper deletion all native regression proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-daemon-postdelete-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  updated-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: 1b1703f65adf810d3da266854a4d40e0621a89a5
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TZ: UTC
      UPDATED_FIXTURE_REQUIRE_ABSENT: '1'
      UPDATED_DAEMON_REQUIRE_ABSENT: '1'
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 1b1703f65adf810d3da266854a4d40e0621a89a5
        persist-credentials: false
    - name: Require exact source and original/native prerequisites
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nproof=\"$RUNNER_TEMP/updated-daemon-296\"\
        \nmkdir -p \"$proof\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\nsudo apt-get update\n\
        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace git-lfs\
        \ gettext\nrustup toolchain install 1.94.0 --profile minimal --component clippy\nprintf 'UPDATED_DAEMON_BINARY=%s/rust/target/debug/openpilot-updated\\\
        nUPDATED_DAEMON_LAUNCHER=%s/rust/target/debug/openpilot-process-child\\nUPDATED_DAEMON_FIXTURE=%s/rust/target/debug/updated-fixture\\\
        n' \"$GITHUB_WORKSPACE\" \"$GITHUB_WORKSPACE\" \"$GITHUB_WORKSPACE\" >> \"$GITHUB_ENV\"\nprintf 'UPDATED_DAEMON_NATIVE_OUTPUT=%s/native\\\
        n' \"$proof\" >> \"$GITHUB_ENV\"\n\nprintf 'UPDATED_DAEMON_SOURCE_COMMIT=%s\\nUPDATED_DAEMON_CHECKER=%s/rust/target/debug/check-updated-daemon\\\
        nUPDATED_DAEMON_RETIREMENT_EVIDENCE=%s/retirement\\nUPDATED_DAEMON_RAW_NATIVE_EVIDENCE=%s/raw-native\\n' \"$EXPECTED_SOURCE\"\
        \ \"$GITHUB_WORKSPACE\" \"$proof\" \"$proof\" >> \"$GITHUB_ENV\"\nfor source in rust/tools/check_updated.py rust/tools/updated_source.py\
        \ rust/tools/tests/test_updated_comparison.py rust/tools/check_updated_daemon.py rust/tools/updated_fixtures.py; do\n\
        \  test ! -e \"$source\"\n  test ! -L \"$source\"\ndone\n"
    - name: Build actual production daemon, native fixture and new owned controller
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-updated --bin openpilot-updated --locked 2>&1 | tee "$proof/daemon-build.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child --locked
        2>&1 | tee "$proof/launcher-build.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --bin check-updated-daemon
        --bin check-updated --bin updated-fixture --locked 2>&1 | tee "$proof/controller-build.log"

        sha256sum rust/target/debug/openpilot-updated rust/target/debug/openpilot-process-child rust/target/debug/updated-fixture
        rust/target/debug/check-updated-daemon > "$proof/sealed-inputs.sha256"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-updated --example updated_trace --locked 2>&1 | tee "$proof/trace-build.log"

        '
    - name: Require all retired updater scenarios and independent native fixture observations with helper absent in private
        root
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        export UPDATED_CHECK_BINARY="$GITHUB_WORKSPACE/rust/target/debug/examples/updated_trace"

        export UPDATED_CHECK_LAUNCHER="$UPDATED_DAEMON_LAUNCHER"

        export UPDATED_CHECK_SHIM="$UPDATED_DAEMON_FIXTURE"

        export UPDATED_CHECK_OUTPUT="$proof/source-native-test"

        export UPDATED_CHECK_CLI_OUTPUT="$proof/source-cli"

        export UPDATED_CHECK_ABSENCE_EVIDENCE="$proof/source-absence"

        export UPDATED_FIXTURE_NATIVE_OUTPUT="$proof/fixture-native"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --test updated_check
        --test updated_fixture_original --locked -- --nocapture 2>&1 | tee "$proof/source-tests.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --lib --bin
        check-updated --bin updated-fixture --test updated_check --test updated_fixture_original --locked -- -D warnings 2>&1
        | tee "$proof/source-clippy.log"

        rust/target/debug/check-updated --binary "$UPDATED_CHECK_BINARY" --launcher "$UPDATED_CHECK_LAUNCHER" --output "$proof/source-default-cli"
        > "$proof/source-default-cli.stdout" 2> "$proof/source-default-cli.stderr"

        '
    - name: Require all original daemon regressions CLI raw path and strict absent same ELF traces
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/updated-daemon-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 1024\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native\
        \ --lib updated_daemon_check:: --locked -- --nocapture 2>&1 | tee \"$proof/unit-tests.log\"\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --test updated_daemon_check --test updated_daemon_retirement\
        \ --test updated_daemon_cli --locked -- --nocapture 2>&1 | tee \"$proof/controller-tests.log\"\ncargo clippy --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --lib --bin check-updated-daemon --test\
        \ updated_daemon_check --test updated_daemon_retirement --test updated_daemon_cli --locked -- -D warnings 2>&1 | tee\
        \ \"$proof/clippy.log\"\nrust/target/debug/check-updated-daemon --binary \"$UPDATED_DAEMON_BINARY\" --launcher \"\
        $UPDATED_DAEMON_LAUNCHER\" --output \"$proof/native-cli\" > \"$proof/native-cli.stdout\" 2> \"$proof/native-cli.stderr\"\
        \ncmp rust/crates/dev-tools/tests/fixtures/updated-daemon-original-19e47ad9/original.stdout \"$proof/native-cli.stdout\"\
        \ntest ! -s \"$proof/native-cli.stderr\"\nsha256sum --check \"$proof/sealed-inputs.sha256\"\n\nfor source in rust/tools/check_updated_daemon.py\
        \ rust/tools/updated_fixtures.py; do\n  test ! -e \"$source\"\n  test ! -L \"$source\"\ndone\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: updated-daemon-native-pair-296
        path: ${{ runner.temp }}/updated-daemon-296/
        if-no-files-found: error
