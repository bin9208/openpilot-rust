name: One-time original prefix93 LLVM target diagnosis
on:
  push:
    branches: [codex/feat-296-node280-original-capture]
    paths: [.github/workflows/prefix93-target-once.yml]
jobs:
  original-prefix93-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve 25 GiB plus 3 GiB
        run: "$GITHUB_WORKSPACE/rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 3072"
      - name: Install pinned LLVM18 provider and numpy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libllvm18
          python -m pip install numpy==2.5.3
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 3072
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/llvm18.deb" 'https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb'
          printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm18.deb" "$RUNNER_TEMP/llvm18-captured"
          printf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
      - name: Fetch accepted original-only diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
          mkdir -p .analysis/scratch/2026-10-21-prefix93-target/accepted
          gh run download 39493781996 --repo bin9208/openpilot-rust --name prefix93-original-kernel-diagnostic-145b6faa4b83361b7ba586c032eefe61263d8b99 --dir .analysis/scratch/2026-10-21-prefix93-target/accepted
      - name: Compile one sealed IR under bounded target candidates
        shell: bash
        env:
          DEV: CPU:LLVM
          CPU_COUNT: '16'
          CACHELEVEL: '0'
          CCACHE: '0'
        run: |
          set -euo pipefail
          export LLVM_PATH="$RUNNER_TEMP/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/llvm18-captured/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tinygrad_repo"
          python - <<'PY'
          import ctypes, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          base = root / ".analysis/scratch/2026-10-21-prefix93-target"
          accepted = base / "accepted/diagnostic"
          def digest(raw): return hashlib.sha256(raw).hexdigest()
          def sealed(path, expected):
              raw = path.read_bytes()
              assert digest(raw) == expected, str(path)
              return raw
          receipt_raw = sealed(accepted / "receipt.json", "2b7268f3707a1876f94557ad0a976ed76033a275ac8b3cf522a865a4257cdb41")
          receipt = json.loads(receipt_raw)
          assert len(receipt["source_sha256"]) == 18
          for name, value in receipt["source_sha256"].items(): sealed(root / name, value)
          provider_hash = "5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0"
          sealed(Path(os.environ["LLVM_PATH"]), provider_hash)
          ir = sealed(accepted / "instrumented.ll", "76ed159de51a25bbce69a76d520a70dd6d31874f74bff4909e07c01c18eb25fd")
          accepted_hash = "56e5834332bff36478d208f56fdb7e470562db24353947487f96a21f4115a46a"
          sealed(accepted / "instrumented.objbin", accepted_hash)
          assert receipt["instrumented_ir_sha256"] == digest(ir)
          assert receipt["instrumented_object_sha256"] == accepted_hash
          assert receipt["instrumented_output_sha256"] == "7307a9b9129f7650c5793a6098dfb30f1830699e24f7a94c3936d6c9b57ee5"
          from tinygrad.runtime.support.compiler_cpu import CPULLVMCompiler, LLVMCompiler, llvm
          host_cpu = ctypes.string_at(llvm.LLVMGetHostCPUName()).decode()
          host_features = ctypes.string_at(llvm.LLVMGetHostCPUFeatures()).decode()
          result = dict(kind="original-only-LLVM18-target-reconstruction", head_sha=os.environ["GITHUB_SHA"],
              accepted_run=39493781996, accepted_artifact=12297535837,
              accepted_receipt_sha256=digest(receipt_raw), accepted_ir_sha256=digest(ir),
              accepted_object_sha256=accepted_hash, provider_sha256=provider_hash,
              original_source_sha256=receipt["source_sha256"], host_cpu=host_cpu,
              host_features=host_features, host_features_sha256=digest(host_features.encode()),
              llvm_ir_target_attributes="none", candidates={})
          for label, processor in (("native_current", None), ("znver2", "znver2"),
                  ("znver3", "znver3"), ("haswell", "haswell"), ("skylake", "skylake"),
                  ("cascadelake", "cascadelake"), ("x86-64-v3", "x86-64-v3")):
              compiler = (CPULLVMCompiler(["x86_64", "native"]) if processor is None else
                          LLVMCompiler("x86_64", processor, ""))
              compiler.cachekey = None
              obj = compiler.compile_to_obj(ir.decode())
              actual = digest(obj)
              result["candidates"][label] = dict(processor=host_cpu if processor is None else processor,
                  object_sha256=actual, object_bytes=len(obj), matches_accepted=actual == accepted_hash)
          (base / "target-receipt.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(dict(host_cpu=host_cpu, matches=[name for name, value in result["candidates"].items()
                                  if value["matches_accepted"]]), indent=2), flush=True)
          PY
      - name: Preserve target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefix93-target-${{ github.sha }}
          path: .analysis/scratch/2026-10-21-prefix93-target/target-receipt.json
          if-no-files-found: warn
