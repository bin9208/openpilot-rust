name: One-off logmessaged startup helper absence proof
permissions:
  contents: read
jobs:
  startup-absence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 13d2065301fea64b1f0af0549ab69480a128234a
        persist-credentials: false
    - name: Require exact registered startup source
      run: 'test "$(git rev-parse HEAD)" = 13d2065301fea64b1f0af0549ab69480a128234a

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install original IPC and tracing prerequisites
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ libzmq5 strace jq

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0
        requests==2.34.2 aiohttp==3.13.3 anyio==4.12.1 PyJWT==2.15.1 cryptography==50.0.1 pyserial==3.5

        printf ''PYTHONPATH=%s/support-msgq-python:%s\n'' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"

        '
    - name: Build one source-matched collector and checker
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-logmessaged --bin openpilot-logmessaged --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features logmessaged-startup-native --bin check-logmessaged-startup
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/support-msgq-python"

        '
    - name: Capture the unchanged original and existing complete native pair
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/logmessaged-startup-absence"

        mkdir -p "$proof/paired"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        checker="$GITHUB_WORKSPACE/rust/target/debug/check-logmessaged-startup"

        collector="$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged"

        export OPENPILOT_RUST_ROOT="$GITHUB_WORKSPACE"

        export LOGMESSAGED_COLLECTOR_BINARY="$collector"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features logmessaged-startup-native --test logmessaged_startup_check
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features logmessaged-startup-native --lib logmessaged_startup_check::worker::tests
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features logmessaged-startup-native --lib --bin
        check-logmessaged-startup --test logmessaged_startup_check --test logmessaged_startup_reference --test logmessaged_startup_retirement
        --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        mapfile -t original_sources < <(jq -r ''keys[]'' rust/crates/dev-tools/tests/fixtures/logmessaged-startup/source-pins.json)

        sha256sum "$checker" "$collector" "${original_sources[@]}" > "$proof/paired/original-inputs.sha256"

        python rust/tools/check_logmessaged_startup.py --collector "$collector" --output "$proof/paired/original"

        sha256sum -c "$proof/paired/original-inputs.sha256"

        mkdir "$proof/native-path"

        ln -s /usr/bin/git "$proof/native-path/git"

        sha256sum "$checker" "$collector" "$proof/native-path/git" > "$proof/paired/artifacts.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        env PATH="$proof/native-path" /usr/bin/timeout --kill-after=5s 180s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat
        -o "$proof/paired/native.exec" "$checker" --collector "$collector" --output "$proof/paired/native" > "$proof/paired/native.stdout"
        2> "$proof/paired/native.stderr"

        sha256sum -c "$proof/paired/artifacts.sha256"

        sha256sum -c "$proof/paired/original-inputs.sha256"

        export LOGMESSAGED_STARTUP_PROOF="$proof/paired"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features logmessaged-startup-native --test logmessaged_startup_reference
        --locked

        sha256sum -c "$proof/paired/original-inputs.sha256"

        '
    - name: Run both private roots under the same checker ELF
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/logmessaged-startup-absence\"\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-logmessaged-startup\"\
        \ncollector=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged\"\nroots=\"$proof/roots\"\nmkdir -p \"$roots/present\"\
        \ \"$roots/absent\"\njq -r 'keys[]' rust/crates/dev-tools/tests/fixtures/logmessaged-startup/source-pins.json > \"\
        $proof/pinned-paths.txt\"\ncat > \"$proof/authored-paths.txt\" <<'PATHS'\nrust/crates/dev-tools/src/logmessaged_startup_check.rs\n\
        rust/crates/dev-tools/src/logmessaged_startup_check/worker.rs\nrust/crates/dev-tools/src/bin/check_logmessaged_startup.rs\n\
        rust/crates/dev-tools/src/managed_entry_collector_source.rs\nrust/crates/dev-tools/src/stats_daemon_check/process.rs\n\
        rust/crates/dev-tools/src/stats_daemon_check/identity.rs\nrust/crates/dev-tools/src/qa_endpoint.rs\nrust/crates/dev-tools/src/qa_process.rs\n\
        rust/crates/dev-tools/src/argparse_scan.rs\nrust/crates/dev-tools/src/python_fs.rs\nrust/crates/dev-tools/src/path_resolve.rs\n\
        rust/crates/dev-tools/tests/fixtures/logmessaged-startup/source-pins.json\nrust/crates/dev-tools/tests/fixtures/logmessaged-startup/original-observation.json\n\
        PATHS\ncat \"$proof/pinned-paths.txt\" \"$proof/authored-paths.txt\" | sort -u > \"$proof/all-root-paths.txt\"\nwhile\
        \ IFS= read -r name; do\n  for lane in present absent; do\n    if [ \"$lane\" = absent ] && [ \"$name\" = rust/tools/check_logmessaged_startup.py\
        \ ]; then continue; fi\n    mkdir -p \"$roots/$lane/$(dirname \"$name\")\"\n    cp -- \"$GITHUB_WORKSPACE/$name\"\
        \ \"$roots/$lane/$name\"\n  done\ndone < \"$proof/all-root-paths.txt\"\ntest -f \"$roots/present/rust/tools/check_logmessaged_startup.py\"\
        \ntest -d \"$roots/absent/rust/tools\"\ntest ! -e \"$roots/absent/rust/tools/check_logmessaged_startup.py\"\nsha256sum\
        \ \"$checker\" \"$collector\" \"$proof/native-path/git\" rust/tools/check_logmessaged_startup.py > \"$proof/inputs.sha256\"\
        \nfind \"$roots\" -type f -print0 | sort -z | xargs -0 sha256sum >> \"$proof/inputs.sha256\"\nfind \"$roots\" -print0\
        \ | sort -z | xargs -0 stat -c '%n %d %i %s %Y %Z %F' > \"$proof/inputs.stat\"\nfor lane in present absent; do\n \
        \ \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 128\n  env OPENPILOT_RUST_ROOT=\"\
        $roots/$lane\" PATH=\"$proof/native-path\" /usr/bin/timeout --kill-after=5s 180s /usr/bin/strace -f -qq -s 65535 -e\
        \ trace=execve,execveat -o \"$proof/$lane.exec\" \"$checker\" --collector \"$collector\" --output \"$proof/$lane\"\
        \ > \"$proof/$lane.stdout\" 2> \"$proof/$lane.stderr\"\n  sha256sum -c \"$proof/inputs.sha256\"\n  find \"$roots\"\
        \ -print0 | sort -z | xargs -0 stat -c '%n %d %i %s %Y %Z %F' > \"$proof/inputs-after.stat\"\n  cmp \"$proof/inputs.stat\"\
        \ \"$proof/inputs-after.stat\"\ndone\nexport LOGMESSAGED_STARTUP_RETIREMENT_PROOF=\"$proof\"\nexport LOGMESSAGED_STARTUP_RETIREMENT_ORIGINAL=\"\
        $proof/paired/original\"\nexport LOGMESSAGED_STARTUP_RETIREMENT_CHECKER=\"$checker\"\nexport LOGMESSAGED_STARTUP_RETIREMENT_COLLECTOR=\"\
        $collector\"\nexport LOGMESSAGED_STARTUP_RETIREMENT_PRESENT_ROOT=\"$roots/present\"\nexport LOGMESSAGED_STARTUP_RETIREMENT_ABSENT_ROOT=\"\
        $roots/absent\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\n\
        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features logmessaged-startup-native --test logmessaged_startup_retirement\
        \ --locked -- --nocapture\nsha256sum -c \"$proof/inputs.sha256\"\nfind \"$roots\" -print0 | sort -z | xargs -0 stat\
        \ -c '%n %d %i %s %Y %Z %F' > \"$proof/inputs-after.stat\"\ncmp \"$proof/inputs.stat\" \"$proof/inputs-after.stat\"\
        \n"
    - name: Preserve full original and both native lanes, including hidden collector records
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: logmessaged-startup-absence-source-evidence
        path: ${{ runner.temp }}/logmessaged-startup-absence/
        include-hidden-files: true
        if-no-files-found: warn
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/logmessaged-startup-absence-296-once.yml
