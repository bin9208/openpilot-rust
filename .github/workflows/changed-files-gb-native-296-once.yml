      shell: bash
      run: 'set -euo pipefail

        export GB_BASE="$RUNNER_TEMP/changed-files-gb-native-296"

        printf ''GB_BASE=%s\n'' "$GB_BASE" >> "$GITHUB_ENV"

        printf ''GB_ORIGINAL_DIR=%s/original\n'' "$GB_BASE" >> "$GITHUB_ENV"

        printf ''GB_NATIVE_OUTPUT=%s/actual\n'' "$GB_BASE" >> "$GITHUB_ENV"

        mkdir "$GB_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$GB_BASE/source.txt"

        git status --porcelain=v1 > "$GB_BASE/source-status.before.txt"

        test ! -s "$GB_BASE/source-status.before.txt"

        sha256sum rust/Cargo.lock > "$GB_BASE/lock.input.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$GB_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 > "$GB_BASE/native-packages.txt"

        '
