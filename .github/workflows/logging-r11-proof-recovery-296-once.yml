{
  "name": "296 R11 retained proof recovery only (no capture or R4 admission)",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/logging-r11-proof-recovery-296-once.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "296-logging-cpp-context-capture",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "jobs": {
    "recover-proof": {
      "name": "recover-proof",
      "if": "${{ github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/codex/feat-296-local-validation' }}",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 15,
      "env": {
        "PACKAGER_B64": "",
        "PACKAGER_SHA256": "c35c0735292eb8258eaf2dccd1f29ba6689a2fc59db7d53ac64b678898b4b3b1",
        "PACKAGER_BYTES": "24657",
        "PINS_B64_1": "",
        "PINS_B64_2": "",
        "PINS_B64_3": "",
        "PINS_SHA256": "d335f72819c4120be9b843b53fb4148c54ac3bd579cca2b7e339822453bca7a0",
        "PINS_BYTES": "134821"
      },
      "steps": [
        {
          "name": "Own a new private recovery sibling; install only reviewed controller data",
          "id": "bootstrap",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\n[[ \"$RUNNER_NAME\" == bin-actions && \"$RUNNER_OS\" == Linux && \"$RUNNER_ARCH\" == X64 ]]\n[[ \"$GITHUB_REPOSITORY\" == bin9208/openpilot-rust && \"$GITHUB_REF\" == refs/heads/codex/feat-296-local-validation ]]\n[[ \"$GITHUB_EVENT_NAME\" == push ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONPATH:-} && -z ${PYTHONHOME:-} && -z ${BASH_ENV:-} ]]\n# Bootstrap source/control/API growth only. Bulk growth follows complete raw inventory.\nread -r recovery_blocks recovery_blocksize < <(stat -f --format='%a %S' /tmp)\nrecovery_bootstrap_growth=$((PACKAGER_BYTES + PINS_BYTES + 8 * 1024 * 1024))\n(( recovery_blocks * recovery_blocksize >= recovery_bootstrap_growth ))\nrecovery_dir=$(mktemp -d \"/tmp/lgr11-pack-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX\")\nprintf 'RECOVERY_DIR=%s\\n' \"$recovery_dir\" >> \"$GITHUB_ENV\"\nprintf '%s' \"$PACKAGER_B64\" | base64 --decode > \"$recovery_dir/recover_proof.py\"\nprintf '%s%s%s' \"$PINS_B64_1\" \"$PINS_B64_2\" \"$PINS_B64_3\" | base64 --decode > \"$recovery_dir/trusted-partial-pins.json\"\nprintf '%s  %s\\n' \"$PACKAGER_SHA256\" \"$recovery_dir/recover_proof.py\" \"$PINS_SHA256\" \"$recovery_dir/trusted-partial-pins.json\" | sha256sum --check --strict\n"
        },
        {
          "name": "Read original attempt and actual recovery-runner provenance only",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\n# Small read-only metadata only. Never download an artifact/ZIP or fetch source.\ngh api -H 'Cache-Control: no-cache' repos/bin9208/openpilot-rust/actions/runs/39888221765/attempts/1 > \"$RECOVERY_DIR/prior-run.json\"\ngh api -H 'Cache-Control: no-cache' 'repos/bin9208/openpilot-rust/actions/runs/39888221765/attempts/1/jobs?per_page=100' > \"$RECOVERY_DIR/prior-jobs.json\"\ngh api -H 'Cache-Control: no-cache' \"repos/bin9208/openpilot-rust/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100\" > \"$RECOVERY_DIR/recovery-jobs.json\"\ngh api -H 'Cache-Control: no-cache' repos/bin9208/openpilot-rust/actions/artifacts/12474585495 > \"$RECOVERY_DIR/artifact-api.json\"\n"
        },
        {
          "name": "Seal retained raw proof without executing captured code",
          "id": "pack",
          "shell": "bash",
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B \"$RECOVERY_DIR/recover_proof.py\"\n"
        },
        {
          "name": "Upload only verified complete recovery",
          "id": "evidence",
          "if": "steps.pack.outcome == 'success'",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "logging-r11-recovered-inert-proof-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.RECOVERY_DIR }}/public/full-proof.tar.gz\n${{ env.RECOVERY_DIR }}/public/recovery-receipt.json",
            "if-no-files-found": "error",
            "retention-days": 14,
            "compression-level": 0
          }
        },
        {
          "name": "Upload a precise hold only; never upload a pending package",
          "if": "failure() && env.RECOVERY_DIR != ''",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "logging-r11-recovery-hold-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.RECOVERY_DIR }}/HOLD.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
