    - name: Export actual current driver catalog through the same-source native cached issuer
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\noriginal=\"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/model-family-original\"\
        \nfor kind in driver; do\n if [ \"$kind\" = driver ]; then\n  models=\"$proof/driver-fixture/no-collector/models\"\
        \n  manifest=\"$proof/driver-fixture/no-collector/observations/reference-manifest.json\"\n  sha=1b8e6cea511e9f212cd7737688b3e2ec0a165b9ff985b492f0e98c4639f18380\n\
        \ else\n  models=\"$proof/driving-fixture/models\"\n  manifest=\"$original/startup/original/manifest.json\"\n  sha=\"\
        $MODEL_FAMILY_STARTUP_MANIFEST_SHA256\"\n fi\n \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\"\
        \ --growth-mib 3072\n rust/target/debug/prepare-model-family-catalog --root \"$GITHUB_WORKSPACE\" --models \"$models\"\
        \ --expected-model-manifest \"$manifest\" --expected-model-manifest-sha256 \"$sha\" --kind \"$kind\" --python \"$(command\
