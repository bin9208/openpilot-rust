        printf ''%s  %s\n'' 908a68acb25afc26450b0549320db51767abfbd082bcdbd154e70ca35b07d02b "$proof/all-cached-program-static-abi.json"
        | sha256sum --check --strict -

        python "$proof/prepare_cached_runtime_inputs.py" "$GITHUB_WORKSPACE" "$proof" "$proof/all-cached-program-static-abi.json"
        > "$proof/cached-authenticated-inputs.json"

