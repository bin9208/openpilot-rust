name: 296 explicit admitted cached driver actual full numerical boundary
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-cached-driver-full-296-once.yml
permissions:
  contents: read
  actions: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  cached-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BRIDGE_CATALOG_ROOTS: model-family-preparation-296
      EXPECTED_SOURCE: 800e2c8f808d0abf347787a01d4c7b9ce1fec942
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_FAMILY_STARTUP_MANIFEST_SHA256: 4c54c0d6fb375cec2d64c6ecfeb5ce709f223bbe0aeb0114b68c5a4e184c7416
      MODEL_FAMILY_USBGPU_MANIFEST_SHA256: 8774d6752cabaeba96bacd4bab009a9432f12e5231e8da608285ff5115b21ad8
      MODEL_FAMILY_CAPTURE_SOURCE: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 800e2c8f808d0abf347787a01d4c7b9ce1fec942
        persist-credentials: false
    - name: Reserve hosted capacity before dependencies
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nsudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/.ghcup\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 12288\nfor name in check_driver_daemon.py model_logging_capture.py model_logging_reference.py check_model_startup.py\
        \ model_startup_reference.py check_usbgpu_daemon.py; do\n test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\
        \ndone\nmkdir \"$RUNNER_TEMP/model-family-preparation-296\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends\
        \ g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev libzmq3-dev jq\nrustup toolchain install 1.94.0\
        \ --profile minimal --component clippy,rustfmt\n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Require accepted component gate at this exact source before any cached image execution
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        run=39788805882

        curl --fail --location --retry 4 --max-time 90 -H "Cache-Control: no-cache" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bin9208/openpilot-rust/actions/runs/$run"
        > "$proof/component-run.json"

        jq -e ''.status == "completed" and .conclusion == "success" and .head_sha == "6a0cb99ea0a258f89f3358b5c68c0e2538ad06cc"''
        "$proof/component-run.json" > /dev/null

        curl --fail --location --retry 4 --max-time 90 -H "Cache-Control: no-cache" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bin9208/openpilot-rust/actions/runs/$run/artifacts"
        > "$proof/component-artifacts.json"

        row=$(jq -cer ''[.artifacts[] | select(.name == "native-cached-component-800e2c8f808" and .expired == false)] | if
        length == 1 then .[0] else error("one exact-source component proof required") end'' "$proof/component-artifacts.json")

        id=$(jq -r ''.id'' <<< "$row"); hash=$(jq -r ''.digest | sub("^sha256:"; "")'' <<< "$row")

        test "${#hash}" -eq 64

        curl --fail --location --retry 4 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/$id/zip"
        > "$proof/component-proof.zip"

        printf ''%s  %s\n'' "$hash" "$proof/component-proof.zip" | sha256sum --check --strict -

        test "$(unzip -p "$proof/component-proof.zip" completion.txt)" = COMPONENT_CHECKS_PASS_NO_PROGRAM_IMAGES_EXECUTED

        test "$(unzip -p "$proof/component-proof.zip" final-guards.status)" = 0

        test "$(unzip -p "$proof/component-proof.zip" source-workflow.txt | head -1)" = "$EXPECTED_SOURCE"

        unzip -t "$proof/component-proof.zip" > "$proof/component-zip-crc.txt"

        '
    - name: Install dependencies of the separately pending model compiler
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2 requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - name: Build actual native catalog/checker groups and held family test ELF once
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 6144\nfeatures=driver-daemon-native,uploader-logging-native\ncargo build\
        \ --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\" --bin stage-driver-daemon-fixture\
        \ --bin prepare-model-family-catalog --bin stage-model-family-usb-assets --bin check-driver-daemon --bin check-model-startup\
        \ --bin check-usbgpu-daemon > \"$proof/grouped-cli-build.log\" 2>&1 || { cat \"$proof/grouped-cli-build.log\"; exit\
        \ 1; }\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\" --test\
        \ model_family_retirement --no-run --message-format=json > \"$proof/family-test-artifacts.jsonl\" 2> \"$proof/family-test-compile.log\"\
        \ || { cat \"$proof/family-test-compile.log\"; exit 1; }\ntest_binary=$(jq -sr '[.[] | select(.reason == \"compiler-artifact\"\
        \ and .target.name == \"model_family_retirement\" and .profile.test == true and .executable != null) | .executable]\
        \ | unique | if length == 1 then .[0] else error(\"one complete family test ELF required\") end' \"$proof/family-test-artifacts.jsonl\"\
        )\nprintf 'MODEL_CACHED_FAMILY_TEST_BINARY=%s\\n' \"$test_binary\" >> \"$GITHUB_ENV\"\ncargo test --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\" --test model_family_prepare --no-run --message-format=json\
        \ > \"$proof/prepare-test-artifacts.jsonl\" 2> \"$proof/prepare-test-compile.log\" || { cat \"$proof/prepare-test-compile.log\"\
        ; exit 1; }\nprepare_binary=$(jq -sr '[.[] | select(.reason == \"compiler-artifact\" and .target.name == \"model_family_prepare\"\
        \ and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error(\"\
        one USB preparation test ELF required\") end' \"$proof/prepare-test-artifacts.jsonl\")\nprintf 'MODEL_CACHED_PREPARE_TEST_BINARY=%s\\\
        n' \"$prepare_binary\" >> \"$GITHUB_ENV\"\n\"$test_binary\" --list > \"$proof/family-test-list.txt\"\n\"$prepare_binary\"\
        \ --list > \"$proof/prepare-test-list.txt\"\nfor name in cached_driver_uses_actual_model_run_and_daemon_before_full_retirement\
        \ same_elf_replays_all_three_native_clis_in_both_absent_roots diagnose_first_driver_frame_on_same_host_and_catalog;\
        \ do\n grep -Fx \"$name: test\" \"$proof/family-test-list.txt\"\ndone\ngrep -Fx 'actual_usb_stage_preserves_full_45_asset_and_three_license_rosters:\
        \ test' \"$proof/prepare-test-list.txt\"\n"
    - name: Build held runtime prerequisites and both C++ peers without original Python bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-driving-modeld --bin openpilot-driving-modeld --example
        usbgpu_daemon_fixture > "$proof/driving-build.log" 2>&1 || { cat "$proof/driving-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dmonitoringmodeld --bin openpilot-dmonitoringmodeld
        > "$proof/driver-build.log" 2>&1 || { cat "$proof/driver-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-usbgpu --example worker_protocol_fixture > "$proof/worker-build.log"
        2>&1 || { cat "$proof/worker-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run --bin offline-llvm-guarded-add
        > "$proof/model-run-build.log" 2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driving-daemon-native --bin
        stage-driving-daemon-fixture --bin generate-services-header > "$proof/stager-build.log" 2>&1 || { cat "$proof/stager-build.log";
        exit 1; }

        mkdir "$proof/peer"

        rust/target/debug/generate-services-header > "$proof/peer/services.h"

        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driving-daemon-peer"
        > "$proof/peer-build.log" 2>&1 || { cat "$proof/peer-build.log"; exit 1; }

        sha256sum rust/target/debug/openpilot-driving-modeld rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/examples/usbgpu_daemon_fixture
        rust/target/debug/examples/worker_protocol_fixture "$proof/peer/driving-daemon-peer" > "$proof/held-elfs.sha256"


        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driver_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driver-daemon-peer"
        > "$proof/driver-peer-build.log" 2>&1 || { cat "$proof/driver-peer-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-logmessaged --bin openpilot-logmessaged > "$proof/collector-build.log"
        2>&1 || { cat "$proof/collector-build.log"; exit 1; }


        # Last feature-unifying build before any helper/policy seal.

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --features cached-program-isa --bin
        offline-cached-code --bin offline-llvm-guarded-add --bin model-run > "$proof/cached-native-final-build.log" 2>&1 ||
        { cat "$proof/cached-native-final-build.log"; exit 1; }

        '
    - name: Bind same-source explicit helper for all affected catalog exports
      id: bridge-bind
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/bridge-proof-296\"\nmkdir \"$proof\"\ntest \"$(git rev-parse HEAD)\" =\
        \ \"$EXPECTED_SOURCE\"\ntest -n \"$LLVM_PATH\" && test -s \"$LLVM_PATH\"\nrustc -Vv > \"$proof/rustc-version.txt\"\
        \ncargo -V > \"$proof/cargo-version.txt\"\ncargo clippy -V > \"$proof/clippy-version.txt\"\nhelper=$(readlink -f \"\
        $GITHUB_WORKSPACE/rust/target/debug/offline-llvm-guarded-add\")\ntest -x \"$helper\"\ndigest=$(sha256sum \"$helper\"\
        \ | cut -d' ' -f1)\nprintf 'MODEL_LLVM_GUARDED_ADD_BINARY=%s\\nMODEL_LLVM_GUARDED_ADD_SHA256=%s\\n' \"$helper\" \"\
        $digest\" >> \"$GITHUB_ENV\"\nprintf '%s\\n' \"$helper\" \"$(readlink -f \"$LLVM_PATH\")\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/guarded_add.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/bin/offline-llvm-guarded-add.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/owned_outputs.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/lib.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/Cargo.toml\"\
        \ \"$GITHUB_WORKSPACE/rust/Cargo.toml\" \"$GITHUB_WORKSPACE/rust/Cargo.lock\" \"$GITHUB_WORKSPACE/rust/rust-toolchain.toml\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/build_model_pipelines.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/native.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/capture.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/compile.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/schema.py\" \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_current_catalog.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_prepare/catalog.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/tests/catalog.rs\"\
        \ > \"$proof/binding-paths.txt\"\nif test -n \"${MODEL_BRIDGE_CATALOG_TEST_BINARY:-}\"; then\n printf '%s\\n' \"$MODEL_BRIDGE_CATALOG_TEST_BINARY\"\
        \ >> \"$proof/binding-paths.txt\"\nfi\nprintf '%s\\n' \"$(readlink -f \"$(command -v python)\")\" \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_check.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/publish.py\" >> \"$proof/binding-paths.txt\"\ncached_source=$(readlink\
        \ -f \"$GITHUB_WORKSPACE/rust/target/debug/offline-cached-code\")\ntest -x \"$cached_source\" && test ! -L \"$cached_source\"\
        \n# Exercise the actual Python/Rust canonical binding with a Unicode native issuer path.\nmkdir \"$proof/\uAC80\uC99D\
        -\U0001F600\"\ncached=\"$proof/\uAC80\uC99D-\U0001F600/offline-cached-code\"\ncp --preserve=mode \"$cached_source\"\
        \ \"$cached\"\ncmp \"$cached_source\" \"$cached\"\nprintf 'MODEL_CACHED_CODE_BINARY=%s\\nMODEL_CACHED_CODE_SHA256=%s\\\
        n' \"$cached\" \"$(sha256sum \"$cached\" | cut -d ' ' -f 1)\" >> \"$GITHUB_ENV\"\nprintf '%s\\n' \"$cached_source\"\
        \ \"$cached\" \"$MODEL_CACHED_FAMILY_TEST_BINARY\" \"$MODEL_CACHED_PREPARE_TEST_BINARY\" >> \"$proof/binding-paths.txt\"\
        \nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/cached_code.rs\" >> \"$proof/binding-paths.txt\"\
        \nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/cached_elf.rs\" >> \"$proof/binding-paths.txt\"\
        \nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/bin/offline-cached-code.rs\" >> \"$proof/binding-paths.txt\"\
        \nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/cpu.rs\" >> \"$proof/binding-paths.txt\"\nprintf\
        \ '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/graph.rs\" >> \"$proof/binding-paths.txt\"\nprintf '%s\\\
        n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/error.rs\" >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"\
        $GITHUB_WORKSPACE/rust/crates/model-runtime/src/entrypoint.rs\" >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"\
        $GITHUB_WORKSPACE/rust/crates/model-runtime/src/assets.rs\" >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/buffer.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/bin/model-run.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dmonitoringmodeld/src/main.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dmonitoringmodeld/src/runtime.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_prepare/catalog.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_current_catalog.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_reference.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_startup_check.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/usbgpu_daemon_check.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/model_family_retirement.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/model_family_prepare.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_retirement_diagnostic.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_retirement_support.rs\"\
        \ >> \"$proof/binding-paths.txt\"\nwhile IFS= read -r path; do sha256sum \"$path\"; done < \"$proof/binding-paths.txt\"\
        \ > \"$proof/bindings.before.sha256\"\nwhile IFS= read -r path; do stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\"\
        ; done < \"$proof/binding-paths.txt\" > \"$proof/identities.before.txt\"\nlscpu --json > \"$proof/lscpu.json\"\ncat\
        \ /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nuname -a > \"$proof/uname.txt\"\ngit rev-parse HEAD > \"$proof/source.txt\"\
        \npython -m pip freeze > \"$proof/providers.before.txt\"\n"
    - name: Stage authentic immutable model datasets without cached program execution
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        original="$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/model-family-original"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 6144

        rust/target/debug/stage-driving-daemon-fixture --archive "$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz"
        --output "$proof/driving-fixture" --blob-sha256 3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe --blob-bytes
        59663776 --compact-images > "$proof/driving-stage.json"

        rust/target/debug/stage-driver-daemon-fixture --root "$GITHUB_WORKSPACE" --output "$proof/driver-fixture" > "$proof/driver-stage.json"

        '
    - name: Bind original manifest/PKL and all44 inert object-image-ABI proofs separately from current issuers
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        curl --fail --location --retry 4 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12398000737/zip
        > "$proof/cached-history.zip"

        printf ''%s  %s\n'' b347a0972c7a34ff1e8c08d287208771f196b1260424a40b946c7100ecb9fd26 "$proof/cached-history.zip" |
        sha256sum --check --strict -

        curl --fail --location --retry 4 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12421643434/zip
        > "$proof/cached-packaging.zip"

        printf ''%s  %s\n'' 10b556335f30e0f9cf96e2d7679c2f95205d24d1f07239c28f8baa8ecdd50c35 "$proof/cached-packaging.zip"
        | sha256sum --check --strict -

        curl --fail --location --retry 4 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12424538606/zip
        > "$proof/cached-isa.zip"

        printf ''%s  %s\n'' 3a3c108be273db979691a02ac4e599c6881b44c7f8d2c3bc556357773c01c12f "$proof/cached-isa.zip" | sha256sum
        --check --strict -

        base64 --decode <<''CACHED_RUNTIME_PAYLOAD_0'' > "$proof/prepare_cached_runtime_inputs.py"

        

        CACHED_RUNTIME_PAYLOAD_0

        printf ''%s  %s\n'' 13c9b782a281c12a95804bd0ab58187e46390ef589f29a0b62ad0af61b2846e4 "$proof/prepare_cached_runtime_inputs.py"
        | sha256sum --check --strict -

        base64 --decode <<''CACHED_RUNTIME_PAYLOAD_1'' > "$proof/all-cached-program-static-abi.json"

        

