      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nexport MODEL_FAMILY_GATE_ROOT=\"$GITHUB_WORKSPACE\"\nexport MODEL_FAMILY_GATE_PREPARATION=\"\
