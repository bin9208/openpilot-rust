        \  tail -n 100 \"$proof/grouped-native.stdout\" \"$proof/grouped-native.stderr\"\n  # Diagnostics retain evidence\
        \ and cannot turn a failed retirement gate green.\n  if ! \"$MODEL_CACHED_FAMILY_TEST_BINARY\" --ignored --exact diagnose_first_driver_frame_on_same_host_and_catalog\
        \ --nocapture > \"$proof/driver-diagnostic.stdout\" 2> \"$proof/driver-diagnostic.stderr\"; then\n    tail -n 100\
        \ \"$proof/driver-diagnostic.stdout\" \"$proof/driver-diagnostic.stderr\"\n  fi\n  exit \"$gate_status\"\nfi\ngrep\
        \ -F '1 passed; 0 failed' \"$proof/grouped-native.stdout\"\nprintf 'FULL_CACHED_DRIVER_FAMILY_GATE_PASS\\n' > \"$proof/cached-full-completion.txt\"\
        \n"
    - name: Retain bounded raw sidecars validated by native catalog gates
      if: always() && steps.bridge-bind.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/bridge-proof-296\"\n: > \"$proof/sidecar-paths.nul\"\nIFS=: read -r -a\
        \ roots <<< \"$BRIDGE_CATALOG_ROOTS\"\nfor name in \"${roots[@]}\"; do\n root=\"$RUNNER_TEMP/$name\"\n if test -d\
        \ \"$root\"; then\n  test ! -L \"$root\"\n  find \"$root\" -type f \\( -name compilation-evidence.json -o -name 'kernel-*.txt'\
        \ -o -name 'kernel-*.compiled.ll' -o -name 'kernel-*.guarded-add.json' -o -name 'kernel-*.o' \\) -print0 >> \"$proof/sidecar-paths.nul\"\
        \n fi\ndone\nfiles=0; bytes=0; evidence=0\n: > \"$proof/sidecar-files.sha256\"\nwhile IFS= read -r -d '' file; do\n\
        \ test -f \"$file\" && test ! -L \"$file\"\n size=$(stat -c '%s' \"$file\")\n test \"$size\" -le 33554432\n files=$((files\
        \ + 1)); bytes=$((bytes + size))\n test \"$files\" -le 10000 && test \"$bytes\" -le 268435456\n if [[ \"$file\" ==\
        \ */compilation-evidence.json ]]; then evidence=$((evidence + 1)); fi\n sha256sum \"$file\" >> \"$proof/sidecar-files.sha256\"\
        \ndone < \"$proof/sidecar-paths.nul\"\n# Receipts and complete kernel bindings are checked by the existing native\
        \ gates.\n# Require actual exports even if an earlier step failed before any catalog existed.\ntest \"$evidence\"\
        \ -gt 0 && test \"$files\" -gt 0\nprintf 'files=%s\\nbytes=%s\\nevidence_directories=%s\\n' \"$files\" \"$bytes\"\
        \ \"$evidence\" > \"$proof/sidecar-counts.txt\"\n# Stage only the exact bounded roster, never every matching file\
        \ in RUNNER_TEMP.\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 512\n: >\
        \ \"$proof/sidecar-relative-paths.nul\"\nwhile IFS= read -r -d '' file; do\n case \"$file\" in \"$RUNNER_TEMP\"/*)\
        \ ;; *) exit 1 ;; esac\n printf '%s\\0' \"${file#\"$RUNNER_TEMP\"/}\" >> \"$proof/sidecar-relative-paths.nul\"\ndone\
        \ < \"$proof/sidecar-paths.nul\"\ntar --create --gzip --null --verbatim-files-from --no-recursion \\\n  --directory=\"\
        $RUNNER_TEMP\" --files-from=\"$proof/sidecar-relative-paths.nul\" \\\n  --file=\"$proof/complete-sidecars.tar.gz\"\
        \nsha256sum --check --strict \"$proof/sidecar-files.sha256\" > \"$proof/sidecar-files.after.log\"\nsha256sum \"$proof/complete-sidecars.tar.gz\"\
        \ > \"$proof/complete-sidecars.sha256\"\n"
    - name: Independent final helper/provider/source/Python guards
      if: always() && steps.bridge-bind.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/bridge-proof-296"

        status=0

        sha256sum --check --strict "$proof/bindings.before.sha256" > "$proof/bindings.after.log" 2>&1 || status=1

        while IFS= read -r path; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$path" || status=1; done < "$proof/binding-paths.txt"
        > "$proof/identities.after.txt"

        cmp "$proof/identities.before.txt" "$proof/identities.after.txt" || status=1

        python -m pip freeze > "$proof/providers.after.txt" || status=1

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt" || status=1

        model_proof="$RUNNER_TEMP/model-family-preparation-296"

        sha256sum --check --strict "$model_proof/cached-native-inputs/inputs.sha256" > "$model_proof/cached-inputs.after.log"
        2>&1 || status=1

        test "$(cat "$model_proof/cached-full-completion.txt")" = FULL_CACHED_DRIVER_FAMILY_GATE_PASS || status=1

        printf ''%s\n'' "$status" > "$proof/final-guards.status"

        test "$status" -eq 0

        '
