name: 296 inert cached PROGRAM construction and native ELF packaging
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-cached-program-packaging-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  inert-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 3fd4e7a4f38764e8d56a1696e1d89be8080cdfc4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 3fd4e7a4f38764e8d56a1696e1d89be8080cdfc4
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Stage exact immutable inputs and held tooling
      id: stage
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nsudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/.ghcup\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib\
        \ 1024\nproof=\"$RUNNER_TEMP/cached-program-packaging-296\"\nrecipe=\"$RUNNER_TEMP/cached-program-packaging-recipe\"\
        \nmkdir \"$proof\" \"$recipe\"\nbase64 --decode <<'CACHED_PAYLOAD_0' > \"$recipe/inert_cached_programs.py\"\\n\
        CACHED_PAYLOAD_0\nprintf '%s  %s\\n' 7f0519e4d22fddfe1a9091e1f57ed931ed7252171b7347368a4511aeaf42196e \"$recipe/inert_cached_programs.py\"\
        \ | sha256sum --check --strict -\nbase64 --decode <<'CACHED_PAYLOAD_1' > \"$recipe/driver_cached_program_packaging.py\"\
        \\n\
        CACHED_PAYLOAD_1\nprintf '%s  %s\\n' a4864668c8492f0fccf5d4bc1dfe178a85707da9a3539e5a77cf38c881243f6e \"$recipe/driver_cached_program_packaging.py\"\
        \ | sha256sum --check --strict -\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12398000737/zip > \"$proof/input.zip\"\
        \nprintf '%s  %s\\n' b347a0972c7a34ff1e8c08d287208771f196b1260424a40b946c7100ecb9fd26 \"$proof/input.zip\" | sha256sum\
        \ --check --strict -\npython_binary=$(readlink -f \"$(command -v python)\")\nassembler=$(readlink -f /usr/bin/as)\n\
        linker=$(readlink -f /usr/bin/ld)\nprintf '%s\\n' \"$python_binary\" \"$assembler\" \"$linker\" \"$recipe/inert_cached_programs.py\"\
        \ \"$recipe/driver_cached_program_packaging.py\" \"$proof/input.zip\" \\\n \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driver-daemon-original/fixture.json\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driver-daemon-original/observations.tar.xz\" \\\n \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/uop/__init__.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/runtime/support/elf.py\" \\\n \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/runtime/support/compiler_cpu.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/device.py\" \\\n \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/codegen/__init__.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/helpers.py\" \\\n \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/uop/ops.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/engine/jit.py\" \\\n \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/engine/realize.py\"\
        \ > \"$proof/binding-paths.txt\"\nwhile IFS= read -r path; do sha256sum \"$path\"; done < \"$proof/binding-paths.txt\"\
        \ > \"$proof/bindings.before.sha256\"\nwhile IFS= read -r path; do stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\"\
        ; done < \"$proof/binding-paths.txt\" > \"$proof/identities.before.txt\"\nprintf 'CACHED_PROGRAM_PYTHON=%s\\nCACHED_PROGRAM_AS=%s\\\
        nCACHED_PROGRAM_LD=%s\\n' \"$python_binary\" \"$assembler\" \"$linker\" >> \"$GITHUB_ENV\"\ngit rev-parse HEAD > \"\
        $proof/source.txt\"\nprintf '%s\\n' \"$GITHUB_WORKFLOW_SHA\" > \"$proof/workflow.txt\"\nlscpu --json > \"$proof/lscpu.json\"\
        \ncat /proc/cpuinfo > \"$proof/cpuinfo.txt\"\nuname -a > \"$proof/uname.txt\"\n"
    - name: Prove all cached images survive ELF packaging without execution
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/cached-program-packaging-296"

        recipe="$RUNNER_TEMP/cached-program-packaging-recipe"

        export PYTHONPATH="$recipe" PYTHONDONTWRITEBYTECODE=1

        export CACHED_PROGRAM_ARCHIVE="$proof/input.zip" CACHED_PROGRAM_OUTPUT="$proof/result"

        # The helper only parses data and runs the held assembler/linker; it never loads

        # a generated object/library or imports tinygrad/LLVM/model providers.

        "$CACHED_PROGRAM_PYTHON" -S -P "$recipe/driver_cached_program_packaging.py" > "$proof/stdout" 2> "$proof/stderr"

        '
    - name: Independent always input and completion guards
      if: always() && steps.stage.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/cached-program-packaging-296"

        status=0

        sha256sum --check --strict "$proof/bindings.before.sha256" > "$proof/bindings.after.log" 2>&1 || status=1

        while IFS= read -r path; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$path" || status=1; done < "$proof/binding-paths.txt"
        > "$proof/identities.after.txt"

        cmp "$proof/identities.before.txt" "$proof/identities.after.txt" || status=1

        sha256sum --check --strict "$proof/result/generated-files.sha256" > "$proof/generated-files.after.log" 2>&1 || status=1

        jq -e ''.errors == []'' "$proof/result/final-guards.json" > /dev/null || status=1

        jq -e ''.status == "ALL44_CACHED_IMAGES_PACKAGED_BYTE_EXACT" and .inert_pickle.programs == 44 and .inert_pickle.global_or_reduce_invocations
        == 0 and (.programs|length) == 44 and .program_code_executed == false and .compiler_provider_imported == false and
        .production_policy_changed == false and .ISA_eligibility_proven == false and .runtime_ABI_or_numerical_acceptance
        == false'' "$proof/result/result.json" > /dev/null || status=1

        printf ''%s\n'' "$status" > "$proof/independent-final.status"

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-cached-program-packaging-296
        retention-days: 7
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ runner.temp }}/cached-program-packaging-296/

          !${{ runner.temp }}/cached-program-packaging-296/input.zip

          ${{ runner.temp }}/cached-program-packaging-recipe/'
