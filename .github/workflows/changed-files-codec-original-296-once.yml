name: 296 original Python312 names and codec domain observations
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-codec-original-296-once.yml
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: cdc7f7c822736e913a672d15227a8e8f0cd0199d
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: cdc7f7c822736e913a672d15227a8e8f0cd0199d
        persist-credentials: false
    - name: Reserve capacity and retain exact source
      shell: bash
      run: 'set -euo pipefail

        export AST_CODEC_BASE="$RUNNER_TEMP/changed-files-codec-original-296"

        printf ''AST_CODEC_BASE=%s\n'' "$AST_CODEC_BASE" >> "$GITHUB_ENV"

        mkdir "$AST_CODEC_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$AST_CODEC_BASE/source.txt"

        git status --porcelain=v1 > "$AST_CODEC_BASE/source-status.before.txt"

        test ! -s "$AST_CODEC_BASE/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Admit original-only domain capture inputs
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''INPUT'' > "$AST_CODEC_BASE/capture_codec_domains.py"

        


        INPUT

        printf ''c8524f5aa1f45cace09e514d7c3665e6a13c5f3d240ee409d36ce56e10306026  %s/capture_codec_domains.py\n'' "$AST_CODEC_BASE"
        | sha256sum --check --strict

        base64 --decode <<''INPUT'' > "$AST_CODEC_BASE/module-inputs.json"

        


        INPUT

        printf ''086ed7e33fa593850809c291bcafdd34c0ce27263c92c7473b83941ad7aa52b9  %s/module-inputs.json\n'' "$AST_CODEC_BASE"
        | sha256sum --check --strict

        base64 --decode <<''INPUT'' > "$AST_CODEC_BASE/unicode16-alias-input.txt"

        

        INPUT

        printf ''9953f0fcebf5ea8091c5c581e4df0e43f20d2533c84ccca7987a9bb819a896a8  %s/unicode16-alias-input.txt\n'' "$AST_CODEC_BASE"
        | sha256sum --check --strict

        '
    - name: Capture new name and codec domains without native execution
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        python -I -B -VV > "$AST_CODEC_BASE/python-provider.txt"

        /usr/bin/timeout --signal=TERM --kill-after=10s 180s python -I -B "$AST_CODEC_BASE/capture_codec_domains.py" --root
        "$GITHUB_WORKSPACE" --output "$AST_CODEC_BASE/observations" --aliases "$AST_CODEC_BASE/unicode16-alias-input.txt"
        --modules "$AST_CODEC_BASE/module-inputs.json" > "$AST_CODEC_BASE/capture.stdout" 2> "$AST_CODEC_BASE/capture.stderr"

        git status --porcelain=v1 > "$AST_CODEC_BASE/source-status.after.txt"

        cmp "$AST_CODEC_BASE/source-status.before.txt" "$AST_CODEC_BASE/source-status.after.txt"

        du -sm "$AST_CODEC_BASE" > "$AST_CODEC_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$AST_CODEC_BASE/artifact-size-mib.txt")" -le 65

        '
    - name: Retain independent original domains and receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-codec-original-296
        path: ${{ runner.temp }}/changed-files-codec-original-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
