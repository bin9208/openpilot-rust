    steps:
    - uses: actions/checkout@v7
      with:
        ref: 0dbc9601c71fd9b31cc7a582a70abe295b1e0d2f
        persist-credentials: false
    - name: Admit native source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        export HZ_BASE="$RUNNER_TEMP/changed-files-hz-native-296"

        printf ''HZ_BASE=%s\n'' "$HZ_BASE" >> "$GITHUB_ENV"

        printf ''HZ_ORIGINAL_DIR=%s/original\n'' "$HZ_BASE" >> "$GITHUB_ENV"

        printf ''HZ_PRIOR_ORIGINAL_DIR=%s/prior-original\n'' "$HZ_BASE" >> "$GITHUB_ENV"

        printf ''HZ_NATIVE_OUTPUT=%s/actual\n'' "$HZ_BASE" >> "$GITHUB_ENV"

        mkdir "$HZ_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$HZ_BASE/source.txt"

        git status --porcelain=v1 > "$HZ_BASE/source-status.before.txt"

        test ! -s "$HZ_BASE/source-status.before.txt"

        sha256sum rust/Cargo.lock > "$HZ_BASE/lock.input.sha256"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$HZ_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 > "$HZ_BASE/native-packages.txt"

        '
