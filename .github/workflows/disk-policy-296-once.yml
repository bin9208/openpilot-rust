          "name": "Allocate private paths in the first run step",
          "run": "set -euo pipefail\npython3 -I -B - <<'PY'\n# Allocation only; all functional work stays inside this hosted Actions job.\nimport base64, hashlib, json, os\nfrom pathlib import Path\nimport stat, subprocess, sys, tempfile\nassert os.environ.get('GITHUB_ACTIONS') == 'true'\nassert os.environ['RUNNER_NAME'] == 'bin-actions'\nassert os.environ['RUNNER_OS'] == 'Linux' and os.environ['RUNNER_ARCH'] == 'X64'\nassert os.geteuid() != 0, 'permission-sensitive checks require a non-root user'\nassert sys.version_info >= (3, 11), 'preprovisioned Python3.11+ required for receipt hashing'\nhost_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\nroot = Path(tempfile.mkdtemp(prefix='296-disk-policy-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-', dir=host_temp))\nroot.chmod(0o700)\nwork = root / 'work'\nwork.mkdir(mode=0o700)\nproof = root / 'proof'\nproof.mkdir(mode=0o700)\nfor leaf in ['home', 'cargo', 'rustup', 'tmp', 'runner-temp', 'cache', 'config', 'cache/pip', 'cache/uv', 'cache/ccache', 'cache/sccache', 'git-hooks', 'git-template']:\n    (work / leaf).mkdir(mode=0o700)\n(work / 'cargo/bin').mkdir(mode=0o700)\n(work / 'gitconfig').write_text('')\nowner = {'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'job': os.environ['GITHUB_JOB'],\n         'root': str(root), 'work': str(work), 'root_identity': [root.stat().st_dev, root.stat().st_ino],\n         'work_identity': [work.stat().st_dev, work.stat().st_ino], 'uid': os.geteuid()}\n(root / 'ownership.json').write_text(json.dumps(owner, indent=2) + '\\n')\n(proof / 'ownership.json').write_text(json.dumps(owner, indent=2) + '\\n')\nprivate = {'POLICY_JOB': str(root), 'POLICY_PROOF': str(proof), 'POLICY_HOST_TEMP': str(host_temp), 'POLICY_SOURCE': str(work / 'source'),\n           'POLICY_DISCOVERY_PATH': os.environ['PATH'], 'HOME': str(work / 'home'),\n           'CARGO_HOME': str(work / 'cargo'), 'RUSTUP_HOME': str(work / 'rustup'), 'CAR