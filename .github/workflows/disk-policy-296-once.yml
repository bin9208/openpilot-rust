l, not automatically current-source policy acceptance. Common-routing changed workflow/source policy gates require their separately focused checks.', 'execution': 'UNRUN; static derivative only; observer untouched', 'source_enabled_features': ['encoder-runtime-native', 'dbc-generator-native', 'panda-ci-native'], 'first_build_growth_mib': 8192, 'script_sha256': '5382c8c6324c61d78d12835fa8c2e823494b78eb34b547484cd405701fad7d21', 'panda_cli_setup': 'Actual current-source --bin check-pandad-ci, private existing debug binaries directory, immutable tracked original CLI fixture; missing-build-message vectors fail before native invocation/daemon stages. No archived ELF or fake binary executes.', 'panda_regular_test': 'No --ignored: the selected function is a regular #[test]. Require all eleven saved code/stdout/stderr outputs to reject a zero-test pass.'},f,indent=2);f.write('\\n')\nPY\npython3 -I -B \"$POLICY_PROOF/runner_receipts.py\" initialize\n"
