name: Paramsd new caller and CarParams 296 once
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/paramsd-caller-car-params-296-once.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  startup-caller:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 30
    env:
      SOURCE_SHA: 6fea07022c77ff8ffedb8fd1efd765f7d1f825fb
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/paramsd-caller-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - name: Isolate this Actions job resources
      run: "set -euo pipefail\njob=$(mktemp -d \"$RUNNER_TEMP/paramsd-caller-${{ github.run_id }}-${{ github.run_attempt }}.XXXXXX\"\
        )\nmkdir \"$job/proof\" \"$job/tmp\" \"$job/cache\"\nprintf '%s\\n' \"PARAMSD_CALLER_JOB=$job\" \"PARAMSD_CALLER_PROOF=$job/proof\"\
        \ \"CARGO_TARGET_DIR=$job/target\" \"CARGO_HOME=$job/cargo-home\" \"RUSTUP_HOME=$job/rustup-home\" \"PIP_CACHE_DIR=$job/cache/pip\"\
        \ \"XDG_CACHE_HOME=$job/cache\" \"TMPDIR=$job/tmp\" >> \"$GITHUB_ENV\"\n\ntest \"$RUNNER_NAME\" = bin-actions\nexport\
        \ PARAMSD_BOOT_JOB=\"$job\"\npython3 - <<'RESOURCE'\nimport os,json,platform,shutil\nfrom pathlib import Path\np=Path(os.environ['PARAMSD_BOOT_JOB']);\
        \ source=Path(os.environ['GITHUB_WORKSPACE'])/('paramsd-caller-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])\n\
        assert not source.exists() and not source.is_symlink()\nowner={'job':str(p.resolve()),'dev':p.stat().st_dev,'ino':p.stat().st_ino,'uid':os.getuid(),'source':str(source),'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']}\n\
        (p/'owner.json').write_text(json.dumps(owner)+'\\n')\nresources={'runner':{k:os.environ.get(k) for k in ['RUNNER_NAME','RUNNER_OS','RUNNER_ARCH','RUNNER_ENVIRONMENT']},'platform':platform.uname()._asdict(),'affinity':sorted(os.sched_getaffinity(0)),'meminfo':Path('/proc/meminfo').read_text(),'os_release':Path('/etc/os-release').read_text(),'cpuinfo':Path('/proc/cpuinfo').read_text(),'process_cgroup':Path('/proc/self/cgroup').read_text(),'disk':{},'planned_source_growth':2*1024**3,'planned_toolchain_target_evidence_growth':8*1024**3,'memory_demand':'unmeasured;\
        \ retain two build workers and actual failures'}\nfor path,growth in [(p,8*1024**3),(source.parent,2*1024**3)]:\n\
        \ st=path.stat(); free=shutil.disk_usage(path).free;resources['disk'][str(path)]={'free':free,'growth':growth,'device':st.st_dev}\n\
        (p/'proof/resources-before.json').write_text(json.dumps(resources,indent=2)+'\\n')\nrows=list(resources['disk'].values())\n\
        if rows[0]['device']==rows[1]['device']:assert rows[0]['free']>=sum(r['growth'] for r in rows)\nelse:assert all(r['free']>=r['growth']\
        \ for r in rows)\nassert resources['runner']['RUNNER_OS']=='Linux' and resources['runner']['RUNNER_ARCH']=='X64'\n\
        RESOURCE\n"
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@v7
      with:
        ref: 6fea07022c77ff8ffedb8fd1efd765f7d1f825fb
        path: paramsd-caller-${{ github.run_id }}-${{ github.run_attempt }}
        persist-credentials: false
        set-safe-directory: false
    - name: New CarParams CLI and caller policies only
      run: "set -euo pipefail\nrequire_growth() {\n  local planned_mib=$1 available required\n  available=$(df -PB1 \"$PARAMSD_CALLER_JOB\"\
        \ | awk 'NR == 2 {print $4}')\n  [[ $available =~ ^[0-9]+$ ]]\n  required=$((planned_mib * 1024 * 1024))\n  printf\
        \ '{\"available_bytes\":%s,\"planned_growth_bytes\":%s}\\n' \"$available\" \"$required\" >> \"$PARAMSD_CALLER_PROOF/growth.jsonl\"\
        \n  ((available >= required))\n}\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\ngit diff --exit-code\nprintf '%s\\\
        n' \"$RUNNER_NAME\" > \"$PARAMSD_CALLER_PROOF/runner-name.txt\"\ntest \"$RUNNER_NAME\" = bin-actions\nprintf '%s\\\
        n' \"$SOURCE_SHA\" > \"$PARAMSD_CALLER_PROOF/SOURCE_COMMIT\"\nfor tool in rustup cargo rustc clang++ capnp strace\
        \ python3; do command -v \"$tool\"; done > \"$PARAMSD_CALLER_PROOF/tools.txt\"\nrequire_growth 8192\nrustup toolchain\
        \ install 1.94.0 --profile minimal --component clippy\nrequire_growth 1024\npython3 -m venv \"$PARAMSD_CALLER_JOB/venv\"\
        \npython=\"$PARAMSD_CALLER_JOB/venv/bin/python\"\n\"$python\" -m pip install pycapnp==2.1.0 > \"$PARAMSD_CALLER_PROOF/pip.log\"\
        \ 2>&1\nexport PYTHONDONTWRITEBYTECODE=1\nexport PYTHONPATH=\"$PWD:$PWD/rust/tools\"\nexport RUSTUP_TOOLCHAIN=1.94.0\n\
        rustc -vV > \"$PARAMSD_CALLER_PROOF/rustc.txt\"\ncapnp --version > \"$PARAMSD_CALLER_PROOF/capnp.txt\"\nrequire_growth\
        \ 8192\ncargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-startup-check-native\
        \ --bin generate-paramsd-car-params > \"$PARAMSD_CALLER_PROOF/build.log\" 2>&1\nrequire_growth 2048\ncargo test --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-startup-check-native --test paramsd_car_params_cli\
        \ > \"$PARAMSD_CALLER_PROOF/cli-controls.log\" 2>&1\n# New static corpus admission and caller policy, never a daemon/startup\
        \ rerun.\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-startup-check-native\
        \ --test paramsd_startup_caller accepted_startup_corpus_binds_original_seven_calls_and_saved_files -- --exact > \"\
        $PARAMSD_CALLER_PROOF/corpus-unit.log\" 2>&1\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools\
        \ --test ci_rust_isolation paramsd_startup_maintained_caller_requires_native_two_root_exec_and_cleanup_audit -- --exact\
        \ > \"$PARAMSD_CALLER_PROOF/startup-caller-policy.log\" 2>&1\ncargo test --manifest-path rust/Cargo.toml --locked\
        \ -p openpilot-dev-tools --test ci_rust_isolation paramsd_atomic_gate_car_params_caller_is_native_and_preserves_shared_original_consumers\
        \ -- --exact > \"$PARAMSD_CALLER_PROOF/car-params-policy.log\" 2>&1\ncargo test --manifest-path rust/Cargo.toml --locked\
        \ -p openpilot-dev-tools --test ci_rust_isolation estimators_require_original_models_loops_and_native_boundaries --\
        \ --exact > \"$PARAMSD_CALLER_PROOF/estimator-policy.log\" 2>&1\ncargo test --manifest-path rust/Cargo.toml --locked\
        \ -p openpilot-dev-tools --test ci_disk_bootstrap workflow_guards_use_absolute_native_bootstrap_and_keep_all_growths\
        \ -- --exact > \"$PARAMSD_CALLER_PROOF/disk-policy.log\" 2>&1\nrequire_growth 2048\ncargo clippy --manifest-path rust/Cargo.toml\
        \ --locked -p openpilot-dev-tools --features paramsd-startup-check-native --bin generate-paramsd-car-params --test\
        \ paramsd_car_params_cli --test paramsd_startup_caller -- -D warnings > \"$PARAMSD_CALLER_PROOF/clippy.log\" 2>&1\n\
        binary=\"$CARGO_TARGET_DIR/debug/generate-paramsd-car-params\"\nsha256sum \"$binary\" rust/Cargo.lock rust/crates/dev-tools/Cargo.toml\
        \ rust/tools/paramsd_fixture.py rust/crates/dev-tools/src/paramsd_fixture_generate.rs rust/crates/dev-tools/src/bin/generate_paramsd_car_params.rs\
        \ rust/crates/dev-tools/tests/fixtures/paramsd-startup-original-r3/observation.json > \"$PARAMSD_CALLER_PROOF/held.sha256\"\
        \nldd \"$binary\" > \"$PARAMSD_CALLER_PROOF/providers.ldd\"\nawk '$2 == \"=>\" && $3 ~ /^\\// {print $3} $1 ~ /^\\\
        // {print $1}' \"$PARAMSD_CALLER_PROOF/providers.ldd\" | sort -u | xargs sha256sum > \"$PARAMSD_CALLER_PROOF/providers.sha256\"\
        \n\"$python\" - <<'ORIGINAL'\nimport os\nfrom pathlib import Path\nfrom paramsd_fixture import car_params\nfrom capnp.lib\
        \ import capnp as capnp_provider\nimport hashlib,json,sys\nproof=Path(os.environ['PARAMSD_CALLER_PROOF'])\nprovider_paths=[Path(sys.executable).resolve(),Path(capnp_provider.__file__).resolve()]\n\
        providers={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in provider_paths}\n(proof/'original-providers.json').write_text(json.dumps(providers,indent=2)+'\\\
        n')\n(proof/'python-version.txt').write_text(sys.version+'\\n')\nfor profile in range(3):\n    for label,fingerprint\
        \ in [('default',None),('empty',''),('custom','PSA_PEUGEOT_208')]:\n        (proof/f'original-{profile}-{label}.bin').write_bytes(bytes(car_params(profile,fingerprint)))\n\
        assert providers=={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in provider_paths}\nORIGINAL\nfor profile\
        \ in 0 1 2; do\n  for label in default empty custom; do\n    arguments=(--root \"$PWD\" --output \"$PARAMSD_CALLER_PROOF/native-$profile-$label.bin\"\
        \ --profile \"$profile\")\n    case \"$label\" in empty) arguments+=(--fingerprint '') ;; custom) arguments+=(--fingerprint\
        \ PSA_PEUGEOT_208) ;; esac\n    PATH=/nonexistent /usr/bin/timeout --kill-after=5s 30s /usr/bin/strace -f -qq -s 65535\
        \ -e trace=execve,execveat -o \"$PARAMSD_CALLER_PROOF/native-$profile-$label.exec\" \"$binary\" \"${arguments[@]}\"\
        \n  done\ndone\nexport PARAMSD_CAR_PARAMS_PROOF=\"$PARAMSD_CALLER_PROOF\"\ncargo test --manifest-path rust/Cargo.toml\
        \ --locked -p openpilot-dev-tools --features paramsd-startup-check-native --test paramsd_car_params_cli -- --ignored\
        \ --exact all_cli_profiles_and_fingerprints_match_fresh_python_fixture_bytes > \"$PARAMSD_CALLER_PROOF/wire-reference.log\"\
        \ 2>&1\n\"$python\" - \"$binary\" <<'AUDIT'\nimport hashlib,json,os,re,sys\nfrom pathlib import Path\nproof=Path(os.environ['PARAMSD_CALLER_PROOF']);\
        \ binary=sys.argv[1]; receipts=[]\nfor profile in range(3):\n    for label in ['default','empty','custom']:\n    \
        \    output=proof/f'native-{profile}-{label}.bin'\n        assert output.read_bytes()==(proof/f'original-{profile}-{label}.bin').read_bytes()\n\
        \        trace=(proof/f'native-{profile}-{label}.exec').read_text()\n        assert len(re.findall(r'\\bexecve(?:at)?\\\
        (',trace))==1\n        match=re.search(r'(?m)\\bexecve\\((\"(?:[^\"\\\\]|\\\\.)*\"), (\\[.*\\]), .*\\) = 0$',trace)\n\
        \        assert match,trace\n        program=json.loads(match[1]); argv=json.loads(match[2])\n        expected=[binary,'--root',os.getcwd(),'--output',str(output),'--profile',str(profile)]\n\
        \        if label=='empty':expected+=['--fingerprint','']\n        if label=='custom':expected+=['--fingerprint','PSA_PEUGEOT_208']\n\
        \        assert program==binary and argv==expected\n        receipts.append({'profile':profile,'fingerprint':label,'sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'execs':1,'python_execs':0})\n\
        (proof/'audit.json').write_text(json.dumps({'pass':True,'new_cli_cases':receipts,'startup_runtime_repeated':False,'reused_startup_run':39834626379},indent=2)+'\\\
        n')\nAUDIT\nsha256sum -c \"$PARAMSD_CALLER_PROOF/held.sha256\" > \"$PARAMSD_CALLER_PROOF/held-after.txt\"\nsha256sum\
        \ -c \"$PARAMSD_CALLER_PROOF/providers.sha256\" > \"$PARAMSD_CALLER_PROOF/providers-after.txt\"\ngit diff --exit-code\n"
    - name: Retain new caller evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: paramsd-new-caller-296-evidence
        path: ${{ env.PARAMSD_CALLER_PROOF }}
        retention-days: 14
      id: upload_evidence
    - name: Remove only owned source and caches after successful evidence upload
      if: always() && steps.upload_evidence.outcome == 'success' && env.PARAMSD_CALLER_JOB != ''
      working-directory: ${{ github.workspace }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'CLEANUP'\nimport os,json,shutil,stat,subprocess\nfrom pathlib import Path\np=Path(os.environ['PARAMSD_CALLER_JOB']);owner=json.loads((p/'owner.json').read_text());st=p.lstat()\n\
        assert p.parent.resolve()==Path(os.environ['RUNNER_TEMP']).resolve() and not p.is_symlink() and stat.S_ISDIR(st.st_mode)\n\
        assert (owner['dev'],owner['ino'],owner['uid'])==(st.st_dev,st.st_ino,os.getuid())\nassert (owner['run_id'],owner['attempt'])==(os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])\n\
        source=Path(owner['source']);assert source.parent.resolve()==Path(os.environ['GITHUB_WORKSPACE']).resolve()\nassert\
        \ source.name=='paramsd-caller-'+owner['run_id']+'-'+owner['attempt'] and not source.is_symlink()\nif source.exists():\n\
        \ assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_SHA']\n\
        \ shutil.rmtree(source)\nshutil.rmtree(p)\nCLEANUP\n"
concurrency:
  group: paramsd-caller-car-params-296
  cancel-in-progress: false
