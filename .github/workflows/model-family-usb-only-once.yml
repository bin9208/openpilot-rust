name: 296 USB-only actual/private independent snapshot proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-family-usb-only-once.yml
permissions:
  contents: read
jobs:
  usb-only-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: 5b5aa357be47596a6927da677db33ae2629f327f
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_FAMILY_STARTUP_MANIFEST_SHA256: 4c54c0d6fb375cec2d64c6ecfeb5ce709f223bbe0aeb0114b68c5a4e184c7416
      MODEL_FAMILY_USBGPU_MANIFEST_SHA256: 8774d6752cabaeba96bacd4bab009a9432f12e5231e8da608285ff5115b21ad8
      MODEL_FAMILY_CAPTURE_SOURCE: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 5b5aa357be47596a6927da677db33ae2629f327f
    - name: Install authenticated diagnostic-only USB harness
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1

        mkdir "$RUNNER_TEMP/usb-only-harness-296"

        test ! -e rust/crates/dev-tools/tests/model_family_usb_only.rs

        printf ''%s'' ''''
        | base64 --decode > rust/crates/dev-tools/tests/model_family_usb_only.rs

        printf ''%s  %s\n'' ''e54b28831b133cfd7dfa6dcdc38a1df74d39d843f61fdf178dcbb55b16472d8f'' rust/crates/dev-tools/tests/model_family_usb_only.rs
        | sha256sum --check --strict

        cat >> rust/crates/dev-tools/Cargo.toml <<''CARGO_TEST''


        [[test]]

        name = "model_family_usb_only"

        required-features = ["driver-daemon-native"]

        CARGO_TEST

        git diff -- rust/crates/dev-tools/Cargo.toml > "$RUNNER_TEMP/usb-only-harness-296/host-test-registration.diff"

        printf ''%s\n'' ''e54b28831b133cfd7dfa6dcdc38a1df74d39d843f61fdf178dcbb55b16472d8f'' > "$RUNNER_TEMP/usb-only-harness-296/harness.sha256"

        '
    - name: Reserve hosted capacity before dependencies
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nsudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/.ghcup\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 12288\nfor name in check_driver_daemon.py model_logging_capture.py model_logging_reference.py check_model_startup.py\
        \ model_startup_reference.py check_usbgpu_daemon.py; do\n test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\
        \ndone\nmkdir \"$RUNNER_TEMP/model-family-preparation-296\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends\
        \ g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev libzmq3-dev jq\nrustup toolchain install 1.94.0\
        \ --profile minimal --component clippy,rustfmt\n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies of the separately pending model compiler
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2 requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - name: Fail fast on grouped native CLI compile, changed regressions and strict Clippy
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --bin
        stage-driver-daemon-fixture --bin prepare-model-family-catalog --bin stage-model-family-usb-assets --bin check-driver-daemon
        --bin check-model-startup --bin check-usbgpu-daemon > "$proof/grouped-cli-build.log" 2>&1 || { cat "$proof/grouped-cli-build.log";
        exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --no-run
        --test model_family_usb_only --test driver_daemon_retirement --test model_family_prepare --test model_family_retirement
        --test model_startup_check --test usbgpu_daemon_check > "$proof/grouped-integration-compile.log" 2>&1 || { cat "$proof/grouped-integration-compile.log";
        exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --test
        model_family_retirement support::tests:: -- --nocapture > "$proof/grouped-support-tests.log" 2>&1 || { cat "$proof/grouped-support-tests.log";
        exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --lib model_
        -- --nocapture > "$proof/model-family-unit.log" 2>&1 || { cat "$proof/model-family-unit.log"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --lib driver_daemon_check::
        -- --nocapture > "$proof/driver-unit.log" 2>&1 || { cat "$proof/driver-unit.log"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --lib usbgpu_daemon_check::
        -- --nocapture > "$proof/usb-unit.log" 2>&1 || { cat "$proof/usb-unit.log"; exit 1; }

        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --lib
        --bin stage-driver-daemon-fixture --bin prepare-model-family-catalog --bin stage-model-family-usb-assets --bin check-driver-daemon
        --bin check-model-startup --bin check-usbgpu-daemon --test driver_daemon_retirement --test model_family_prepare --test
        model_family_retirement --test model_startup_check --test usbgpu_daemon_check -- -D warnings > "$proof/grouped-clippy.log"
        2>&1 || { cat "$proof/grouped-clippy.log"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --test
        ci_disk_bootstrap --test ci_workflow_policy > "$proof/maintained-policy.stdout" 2> "$proof/maintained-policy.stderr"
        || { tail -n 100 "$proof/maintained-policy.stdout" "$proof/maintained-policy.stderr"; exit 1; }

        '
    - name: Build held runtime prerequisites and both C++ peers without original Python bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-driving-modeld --bin openpilot-driving-modeld --example
        usbgpu_daemon_fixture > "$proof/driving-build.log" 2>&1 || { cat "$proof/driving-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dmonitoringmodeld --bin openpilot-dmonitoringmodeld
        > "$proof/driver-build.log" 2>&1 || { cat "$proof/driver-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-usbgpu --example worker_protocol_fixture > "$proof/worker-build.log"
        2>&1 || { cat "$proof/worker-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run > "$proof/model-run-build.log"
        2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driving-daemon-native --bin
        stage-driving-daemon-fixture --bin generate-services-header > "$proof/stager-build.log" 2>&1 || { cat "$proof/stager-build.log";
        exit 1; }

        mkdir "$proof/peer"

        rust/target/debug/generate-services-header > "$proof/peer/services.h"

        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driving-daemon-peer"
        > "$proof/peer-build.log" 2>&1 || { cat "$proof/peer-build.log"; exit 1; }

        sha256sum rust/target/debug/openpilot-driving-modeld rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/examples/usbgpu_daemon_fixture
        rust/target/debug/examples/worker_protocol_fixture "$proof/peer/driving-daemon-peer" > "$proof/held-elfs.sha256"


        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driver_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driver-daemon-peer"
        > "$proof/driver-peer-build.log" 2>&1 || { cat "$proof/driver-peer-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-logmessaged --bin openpilot-logmessaged > "$proof/collector-build.log"
        2>&1 || { cat "$proof/collector-build.log"; exit 1; }

        '
    - name: Stage two independent model datasets and export separate current-host catalogs
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\noriginal=\"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/model-family-original\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 6144\nrust/target/debug/stage-driving-daemon-fixture\
        \ --archive \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz\"\
        \ --output \"$proof/driving-fixture\" --blob-sha256 3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe\
        \ --blob-bytes 59663776 --compact-images > \"$proof/driving-stage.json\"\nrust/target/debug/stage-driver-daemon-fixture\
        \ --root \"$GITHUB_WORKSPACE\" --output \"$proof/driver-fixture\" > \"$proof/driver-stage.json\"\nfor kind in driver\
        \ family; do\n if [ \"$kind\" = driver ]; then\n  models=\"$proof/driver-fixture/no-collector/models\"\n  manifest=\"\
        $proof/driver-fixture/no-collector/observations/reference-manifest.json\"\n  sha=1b8e6cea511e9f212cd7737688b3e2ec0a165b9ff985b492f0e98c4639f18380\n\
        \ else\n  models=\"$proof/driving-fixture/models\"\n  manifest=\"$original/startup/original/manifest.json\"\n  sha=\"\
        $MODEL_FAMILY_STARTUP_MANIFEST_SHA256\"\n fi\n \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\"\
        \ --growth-mib 3072\n rust/target/debug/prepare-model-family-catalog --root \"$GITHUB_WORKSPACE\" --models \"$models\"\
        \ --expected-model-manifest \"$manifest\" --expected-model-manifest-sha256 \"$sha\" --kind \"$kind\" --python \"$(command\
        \ -v python)\" --llvm \"$LLVM_PATH\" --output \"$proof/$kind-catalog\" > \"$proof/$kind-catalog.stdout\" 2> \"$proof/$kind-catalog.stderr\"\
        \ || { cat \"$proof/$kind-catalog.stderr\"; exit 1; }\n rust/target/debug/model-run --check-catalog \"$proof/$kind-catalog/catalog\"\
        \ > \"$proof/$kind-catalog-check.json\"\ndone\n"
    - name: Stage genuine immutable USB data once with native archive controls
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 6144

        release=b55552dbb7bb16cf5dae0cfc0f2571d14ed8643a

        archive="$proof/openpilot-rust-$release-aarch64.tar.gz"

        curl --fail --location --retry 3 --max-time 900 --max-filesize 1155620561 "https://github.com/bin9208/openpilot-rust/releases/download/runtime-$release/openpilot-rust-$release-aarch64.tar.gz"
        -o "$archive"

        base=https://upload.shind0.synology.me/models/comma4-big-cinque-v3

        curl --fail --location --retry 3 --max-time 300 --max-filesize 2731184 "$base/precompiled-runtime.tar.gz" -o "$proof/runtime-input.tar.gz"

        curl --fail --location --retry 3 --max-time 300 --max-filesize 879 "$base/precompiled.json" -o "$proof/installed-input.json"

        export MODEL_FAMILY_USB_RELEASE_ARCHIVE="$archive"

        export MODEL_FAMILY_USB_RUNTIME_ARCHIVE="$proof/runtime-input.tar.gz"

        export MODEL_FAMILY_USB_INSTALLED="$proof/installed-input.json"

        export MODEL_FAMILY_USB_STAGE_OUTPUT="$proof/usb-bundle"

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --test
        model_family_prepare actual_usb_stage_preserves_full_45_asset_and_three_license_rosters -- --ignored --exact --nocapture
        > "$proof/usb-stage.stdout" 2> "$proof/usb-stage.stderr" || { cat "$proof/usb-stage.stdout" "$proof/usb-stage.stderr";
        exit 1; }

        rm "$archive"

        '
    - name: Run USB six-case oracle in actual/private roots plus controls
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        export MODEL_FAMILY_GATE_ROOT="$GITHUB_WORKSPACE"

        export MODEL_FAMILY_GATE_PREPARATION="$proof"

        export MODEL_FAMILY_GATE_ORIGINAL="$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/model-family-original"

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driver-daemon-native --test
        model_family_usb_only usb_only_actual_and_private_snapshot_proof -- --ignored --exact --nocapture > "$proof/grouped-native.stdout"
        2> "$proof/grouped-native.stderr"


        cp -a "$RUNNER_TEMP/usb-only-harness-296" "$proof/usb-only-harness-receipt"

        '
    - name: Preserve native actual CLI, all reports and exact data/provider provenance
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-family-usb-only-snapshot-296
        retention-days: 7
        if-no-files-found: error
        path: '${{ runner.temp }}/model-family-preparation-296/

          !${{ runner.temp }}/model-family-preparation-296/private-root/**

          !${{ runner.temp }}/model-family-preparation-296/grouped-native/**/cache/**/*.pkl

          !${{ runner.temp }}/model-family-preparation-296/**/owned-usb-inputs/model.pkl

          !${{ runner.temp }}/model-family-preparation-296/**/owned-usb-inputs/runtime.tar.gz

          !${{ runner.temp }}/model-family-preparation-296/usb-bundle/usb-assets/models/**/model.pkl

          !${{ runner.temp }}/model-family-preparation-296/openpilot-rust-*.tar.gz

          !${{ runner.temp }}/model-family-preparation-296/driver-fixture/**

          !${{ runner.temp }}/model-family-preparation-296/driving-fixture/**


          ${{ runner.temp }}/usb-only-harness-296/

          '
        include-hidden-files: true
    name: USB-only snapshot follow-up (not full-group acceptance)
