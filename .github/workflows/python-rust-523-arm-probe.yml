name: Python Rust 523 scoped native ARM probe candidate
'on':
  push:
    branches: [codex/feat-523-python-rust]
    paths: [.github/workflows/python-rust-523-arm-probe.yml]
permissions:
  contents: read
concurrency:
  group: python-rust-523-arm-probe-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  arm-probe:
    name: Fresh musl procLog and native host checker only
    if: ${{ github.repository == 'bin9208/openpilot-rust' }}
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
      ARM_RUST_ROOT: /home/actions/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu
      LC_ALL: C
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        set -euo pipefail
        test "$EVENT_NAME" = push
        test "$SOURCE_REF" = refs/heads/codex/feat-523-python-rust
        test "$GITHUB_ACTIONS" = true
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
    - name: Common owned job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Admit source2GiB and allocate private output before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        mkdir "$job/proof" "$job/tools" "$job/build"
        mkdir "$job/build/home" "$job/build/tmp" "$job/build/cache"
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        printf '{"available_bytes":%s,"planned_source_growth_bytes":2147483648}\n' "$available" > "$job/proof/source-growth-before-checkout.json"
        # source와 proof가 같은 physical FS면 아직 쓸 proof512MiB도 합산한다.
        required=$((2 * 1024 * 1024 * 1024))
        proof_free=$(df -PB1 "$job" | awk 'NR == 2 {print $4}')
        [[ $proof_free =~ ^[0-9]+$ ]]
        if [[ $(stat -c %d "$workspace") == "$(stat -c %d "$job")" ]]; then required=$((required + 512 * 1024 * 1024)); fi
        printf '{"available_bytes":%s,"planned_proof_growth_bytes":536870912}\n' "$proof_free" > "$job/proof/proof-growth-before-checkout.json"
        ((available >= required && proof_free >= 512 * 1024 * 1024))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/build/home" "CARGO_HOME=$job/build/cargo-home" "RUSTUP_HOME=$job/build/rustup-home" "CARGO_TARGET_DIR=$job/build/target" "XDG_CACHE_HOME=$job/build/cache" "TMPDIR=$job/build/tmp" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Seal exact source and tracked index
      id: source_before
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        allocated=$(du -sx --block-size=1 "$DIAG_SOURCE_OWNER" | cut -f1)
        printf '{"allocated_source_bytes":%s,"planned_source_cap_bytes":2147483648}\n' "$allocated" > "$CI_JOB_TEMP/proof/source-size.json"
        ((allocated <= 2 * 1024 * 1024 * 1024))
    - name: Build two exact bins and run one bounded native ARM probe
      id: native
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        # 후보 범위: procLog musl bin + host checker. FFmpeg/graphics/model/full workspace 제외.
        # old11unit/성공32cohort/#529는 실행하지 않는다. 모든 growth는 보수 계획치이며 peak 보장이 아니다.
        set -euo pipefail
        umask 077
        source=$DIAG_SOURCE
        job=$CI_JOB_TEMP
        proof=$job/proof
        tools=$job/tools
        build=$job/build
        sdk=$ARM_RUST_ROOT
        mib=$((1024 * 1024))
        tools_cap=$((2048 * mib))
        proof_cap=$((512 * mib))
        build_cap=$((8192 * mib))
        unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
        unset CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
        unset CC_aarch64_unknown_linux_musl CXX_aarch64_unknown_linux_musl AR_aarch64_unknown_linux_musl
        unset CARGO_ZIGBUILD_ZIG_COMMAND_ARGS CARGO_ENCODED_RUSTDOCFLAGS
        unset BASH_ENV ENV
        export PATH=/usr/bin:/bin
        export RUSTC="$sdk/bin/rustc" RUSTDOC="$sdk/bin/rustdoc"
        export CC_x86_64_unknown_linux_gnu=/usr/bin/cc CXX_x86_64_unknown_linux_gnu=/usr/bin/c++ AR_x86_64_unknown_linux_gnu=/usr/bin/ar
        export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/cc
        export ZIG_GLOBAL_CACHE_DIR="$build/zig-global" ZIG_LOCAL_CACHE_DIR="$build/zig-local"
        export CARGO_ZIGBUILD_CACHE_DIR="$build/zigbuild-wrappers"
        export PYTHONDONTWRITEBYTECODE=1
        declare -A held_fd=() held_identity=() held_sha=()
        declare -A alias_target=() alias_identity=()
        declare -a roots=() root_names=()
        phase=preflight
        cross_status=unrun host_status=unrun probe_status=unrun clippy_status=unrun
        sealed=false
        failed=0
        active_leader= active_watcher=

        # 핵심 program/ELF/DSO는 FD를 끝까지 유지한다. 전체 tree는 hash와 identity roster 둘 다 비교한다.
        identity() { stat -Lc '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$1"; }
        bind_file() {
          local path canonical before descriptor digest
          path=$1
          canonical=$(readlink -e -- "$path") || return 1
          [[ $canonical == /* && -f $canonical && ! -L $canonical ]] || return 1
          if [[ -v alias_target["$path"] ]]; then
            [[ ${alias_target[$path]} == "$canonical" && ${alias_identity[$path]} == "$(stat -c '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$path")" ]] || return 1
          else
            alias_target[$path]=$canonical
            alias_identity[$path]=$(stat -c '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$path") || return 1
          fi
          if [[ -v held_fd["$canonical"] ]]; then return 0; fi
          before=$(identity "$canonical") || return 1
          exec {descriptor}<"$canonical" || return 1
          [[ $(identity "/proc/$$/fd/$descriptor") == "$before" ]] || return 1
          digest=$(sha256sum "/proc/$$/fd/$descriptor") || return 1
          digest=${digest%% *}
          [[ $(identity "$canonical") == "$before" && $(identity "/proc/$$/fd/$descriptor") == "$before" ]] || return 1
          held_fd[$canonical]=$descriptor
          held_identity[$canonical]=$before
          held_sha[$canonical]=$digest
          printf '%s\t%s\t%s\n' "$canonical" "$before" "$digest" >> "$proof/held-before.tsv"
        }
        verify_held() {
          local path descriptor digest status=0
          for path in "${!alias_target[@]}"; do
            [[ $(readlink -e -- "$path") == "${alias_target[$path]}" && $(stat -c '%d:%i:%f:%u:%g:%s:%h:%y:%z' -- "$path") == "${alias_identity[$path]}" ]] || status=1
          done
          for path in "${!held_fd[@]}"; do
            descriptor=${held_fd[$path]}
            if [[ $(identity "$path") != "${held_identity[$path]}" || $(identity "/proc/$$/fd/$descriptor") != "${held_identity[$path]}" ]]; then
              printf 'identity changed: %s\n' "$path" >&2; status=1; continue
            fi
            digest=$(sha256sum "/proc/$$/fd/$descriptor") || { status=1; continue; }
            digest=${digest%% *}
            [[ $digest == "${held_sha[$path]}" ]] || status=1
            [[ $(identity "$path") == "${held_identity[$path]}" && $(identity "/proc/$$/fd/$descriptor") == "${held_identity[$path]}" ]] || status=1
            printf '%s\t%s\t%s\n' "$path" "${held_identity[$path]}" "$digest" >> "$proof/held-after.tsv"
          done
          return "$status"
        }
        tree_seal() {
          local root=$1 out=$2
          # source의 .git 내부 lock/읽기 bookkeeping은 tracked index/tar 봉인과 별도로 취급한다.
          find -P "$root" -path "$source/.git" -prune -o -printf '%D:%i\t%m:%U:%G:%n\t%s\t%T@\t%C@\t%y\t%p\t%l\0' | sort -z > "$out.roster.bin" || return 1
          find -P "$root" -path "$source/.git" -prune -o -type f -print0 | sort -z | xargs -0 -r sha256sum > "$out.files.sha256" || return 1
          find -P "$root" -path "$source/.git" -prune -o -printf '%D:%i\t%m:%U:%G:%n\t%s\t%T@\t%C@\t%y\t%p\t%l\0' | sort -z > "$out.stable.bin" || return 1
          cmp "$out.roster.bin" "$out.stable.bin" || return 1
        }
        add_tree() {
          local name=$1 root=$2
          [[ -d $root && ! -L $root && $(readlink -e "$root") == "$root" ]] || return 1
          roots+=("$root"); root_names+=("$name")
          tree_seal "$root" "$proof/$name-before" || return 1
        }
        bind_dso() {
          local program=$1 line dependency
          bind_file "$program" || return 1
          # ldd의 shell/loader도 보존한다. vDSO와 static 진단은 실제 파일 provider가 아니다.
          if ldd "$program" > "$proof/ldd-current.txt" 2>&1; then
            while IFS= read -r line; do
              if [[ $line =~ ^[[:space:]]*linux-vdso\.so\.[0-9]+[[:space:]]+\(0x[0-9a-f]+\)$ ]]; then continue; fi
              if [[ $line =~ ^[[:space:]]*statically[[:space:]]linked[[:space:]]*$ ]]; then
                readelf -l "$program" > "$proof/static-current.txt" || return 1
                ! grep -q INTERP "$proof/static-current.txt" || return 1
                continue
              fi
              if [[ $line =~ ^[[:space:]]*[^[:space:]]+[[:space:]]+\=\>[[:space:]]+(/[^[:space:]]+)[[:space:]]+\(0x[0-9a-f]+\)$ ]]; then
                dependency=${BASH_REMATCH[1]}
              elif [[ $line =~ ^[[:space:]]*(/[^[:space:]]+)[[:space:]]+\(0x[0-9a-f]+\)$ ]]; then
                dependency=${BASH_REMATCH[1]}
              else printf 'unknown/missing DSO: %s\n' "$line" >&2; return 1; fi
              bind_file "$dependency" || return 1
            done < "$proof/ldd-current.txt"
          else
            grep -Eq '^[[:space:]]*(not a dynamic executable|statically linked)[[:space:]]*$' "$proof/ldd-current.txt" || return 1
            readelf -l "$program" > "$proof/static-current.txt" || return 1
            ! grep -q INTERP "$proof/static-current.txt" || return 1
          fi
          printf '\nPROGRAM %s\n' "$program" >> "$proof/provider-ldd.txt"
          cat "$proof/ldd-current.txt" >> "$proof/provider-ldd.txt" || return 1
        }
        capacity() {
          local label=$1 path=$2 required=$3 free
          free=$(df -PB1 "$path" | awk 'NR == 2 {print $4}') || return 1
          [[ $free =~ ^[0-9]+$ ]] || return 1
          printf '%s\t%s\t%s\t%s\n' "$label" "$path" "$free" "$required" >> "$proof/growth-admission.tsv"
          ((free >= required))
        }
        admit_pair() {
          local label=$1 first=$2 first_bytes=$3 second=$4 second_bytes=$5
          if [[ $(stat -c %d "$first") == "$(stat -c %d "$second")" ]]; then
            capacity "$label" "$first" "$((first_bytes + second_bytes))" || return 1
          else
            capacity "$label" "$first" "$first_bytes" || return 1
            capacity "$label" "$second" "$second_bytes" || return 1
          fi
        }
        budgets() {
          local path limit bytes apparent usage
          for path in "$tools" "$proof" "$build" "$DIAG_SOURCE_OWNER"; do
            case "$path" in
              "$tools") limit=$tools_cap;; "$proof") limit=$proof_cap;;
              "$build") limit=$build_cap;; *) limit=$((2048 * mib));;
            esac
            # Cargo가 자기 임시파일을 지운 readdir race만 허용한다. 다른 read/stat 실패는 pipefail이다.
            usage=$(find -P "$path" -ignore_readdir_race -printf '%b %s\n' | awk '{b+=$1*512; s+=$2} END {printf "%.0f %.0f\n",b,s}') || return 1
            read -r bytes apparent <<< "$usage" || return 1
            [[ $bytes =~ ^[0-9]+$ && $apparent =~ ^[0-9]+$ ]] || return 1
            ((bytes <= limit && apparent <= limit)) || { printf 'planned cap exceeded: %s allocated=%s apparent=%s cap=%s\n' "$path" "$bytes" "$apparent" "$limit" >&2; return 1; }
          done
        }
        run_bounded() {
          local label=$1 duration=$2 leader watcher code=0
          shift 2
          if ! budgets || test -e "$proof/resource-stop.txt"; then
            printf '%s\tresource-admission-blocked\n' "$label" >> "$proof/exit-codes.tsv"
            return 125
          fi
          printf '%s\0' "$label" "$@" >> "$proof/commands.nul"
          # 동시에 하나의 owned process group만 사용한다. 2초 주기로 cap 초과를 중단·기록한다.
          setsid timeout --signal=TERM --kill-after=20s "$duration" "$@" > "$proof/$label.stdout" 2> "$proof/$label.stderr" &
          leader=$!
          active_leader=$leader
          (
            while kill -0 "$leader" 2>/dev/null; do
              if ! budgets; then
                printf '%s\n' "$label" > "$proof/resource-stop.txt"
                kill -TERM -- "-$leader" 2>/dev/null || true
                exit 1
              fi
              sleep 2
            done
          ) &
          watcher=$!
          active_watcher=$watcher
          wait "$leader" || code=$?
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          active_leader= active_watcher=
          printf '%s\t%s\n' "$label" "$code" >> "$proof/exit-codes.tsv"
          budgets || return 1
          test ! -e "$proof/resource-stop.txt" || return 1
          return "$code"
        }
        finish() {
          local original=$? status=0 n name killer
          trap - EXIT INT TERM
          set +e
          if [[ -n $active_leader ]]; then
            # 중단된 shell은 자기 자식을 회수한 뒤 봉인한다. 중단 시 cleanup 수용은 하지 않는다.
            status=1
            kill -TERM -- "-$active_leader" 2>/dev/null
            (sleep 20; kill -KILL -- "-$active_leader" 2>/dev/null) &
            killer=$!
            wait "$active_leader"
            kill "$killer" 2>/dev/null; wait "$killer" 2>/dev/null
          fi
          if [[ -n $active_watcher ]]; then kill "$active_watcher" 2>/dev/null; wait "$active_watcher" 2>/dev/null; fi
          verify_held || status=1
          for n in "${!roots[@]}"; do
            name=${root_names[$n]}
            tree_seal "${roots[$n]}" "$proof/$name-after" &&
              cmp "$proof/$name-before.roster.bin" "$proof/$name-after.roster.bin" &&
              cmp "$proof/$name-before.files.sha256" "$proof/$name-after.files.sha256" || status=1
          done
          if test -f "$proof/wrappers-ready.roster.bin"; then
            tree_seal "$CARGO_ZIGBUILD_CACHE_DIR" "$proof/wrappers-after" &&
              cmp "$proof/wrappers-ready.roster.bin" "$proof/wrappers-after.roster.bin" &&
              cmp "$proof/wrappers-ready.files.sha256" "$proof/wrappers-after.files.sha256" || status=1
          fi
          budgets || status=1
          # 준비 중 실패도 성공으로 표시하지 않는다. 완전한 baseline roster가 필수다.
          if [[ $status == 0 && -f $proof/source-tree-before.roster.bin && -f $proof/sdk-before.roster.bin && -f $proof/tools-before.roster.bin && -f $proof/headers-before.roster.bin && -f $proof/gcc-before.roster.bin && -f $proof/system-libraries-before.roster.bin ]]; then sealed=true; fi
          printf 'immutable_seals=%s\ncross_status=%s\nhost_status=%s\nprobe_status=%s\nclippy_status=%s\n' "$sealed" "$cross_status" "$host_status" "$probe_status" "$clippy_status" >> "$GITHUB_OUTPUT"
          printf '{"source_commit":"%s","phase":"%s","cross":"%s","host":"%s","probe":"%s","clippy":"%s","immutable_seals":%s,"physical_arm_cpu":false,"original_recapture":false,"retirement_acceptance":false,"device_validation":"not_run","planned_build_cap_bytes":8589934592,"measured_peak_guarantee":false}\n' "$GITHUB_SHA" "$phase" "$cross_status" "$host_status" "$probe_status" "$clippy_status" "$sealed" > "$proof/outcomes.json"
          df -PB1 "$source" "$job" > "$proof/disk-after.txt"
          du -sx --block-size=1 "$DIAG_SOURCE_OWNER" "$tools" "$build" "$proof" > "$proof/owned-output-bytes.txt"
          [[ $original == 0 && $status == 0 && $sealed == true ]] || exit 1
        }
        trap finish EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM

        # jq 첫 사용 전에 native reader를 FD+SHA에 고정한다. global install/apt는 하지 않는다.
        readers=(bash sh stat sha256sum readlink find sort xargs cmp grep awk cut du df cat tar git jq curl unzip timeout setsid sleep readelf cc c++ ar ranlib nm as ld ldd pkg-config ln mkdir chmod env tail cp)
        for program in "${readers[@]}"; do
          bind_file "$(command -v "$program")"
        done
        for program in "${readers[@]}"; do
          # ldd는 이미 고정한 Bash로 실행하는 system shell script다.
          if [[ $program == ldd ]]; then continue; fi
          bind_dso "$(command -v "$program")"
        done
        jq --version > "$proof/jq-version.txt"
        add_tree source-tree "$source"

        test "$sdk" = /home/actions/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu
        test -d "$sdk" && test ! -L "$sdk"
        test "$(readlink -e "$sdk")" = "$sdk"
        # 보호 SDK에 chmod/install하지 않는다. 실제 musl std/CRT가 없으면 여기서 명시 실패한다.
        test -z "$(find "$sdk" \( -type f -o -type d \) -perm /022 -print -quit)"
        while IFS= read -r -d '' link; do
          case "$(readlink -e "$link")" in "$sdk"/*) ;; *) echo "SDK symlink escapes readonly root: $link" >&2; exit 1;; esac
        done < <(find -P "$sdk" -type l -print0)
        for component in rustc cargo rustfmt clippy-driver; do
          bind_file "$sdk/bin/$component"
        done
        printf '%s  %s\n' \
          103b60e1b1339968c1d74202ea1d45686037e82c4ea3e0569de24b18a1e6836a "$sdk/bin/rustc" \
          77f14b761b02b47e6747473f556b3bc9f98f7e4525b7c3b8d74898ff816e4636 "$sdk/bin/cargo" \
          d1c6d8c0e2fae4fbb686d421415d2f471e409ade6babb3e491d9ac5d9c70c602 "$sdk/bin/rustfmt" \
          2ff45d07196eec4f57a631103a877631d3579e86db2770bcfaa3b9d92a0b9d15 "$sdk/bin/clippy-driver" > "$proof/rust-programs.sha256"
        sha256sum --check --quiet "$proof/rust-programs.sha256"
        musl=$sdk/lib/rustlib/aarch64-unknown-linux-musl
        test -d "$musl" && test ! -L "$musl"
        for pattern in libstd libcore libcompiler_builtins; do
          matches=("$musl/lib/$pattern"-*.rlib)
          ((${#matches[@]} == 1)) && test -f "${matches[0]}" || { echo "Missing actual musl std component: $pattern" >&2; exit 1; }
          bind_file "${matches[0]}"
        done
        for crt in crt1.o crti.o crtn.o libc.a; do
          test -f "$musl/lib/self-contained/$crt" || { echo "Missing actual musl CRT: $crt" >&2; exit 1; }
          bind_file "$musl/lib/self-contained/$crt"
        done
        add_tree sdk "$sdk"
        tree_seal "$musl" "$proof/musl-std-before"
        "$sdk/bin/rustc" -vV > "$proof/rustc.txt"
        grep -Fx 'release: 1.94.0' "$proof/rustc.txt"
        grep -Fx 'host: x86_64-unknown-linux-gnu' "$proof/rustc.txt"
        for program in cargo rustc cargo-clippy clippy-driver; do bind_dso "$sdk/bin/$program"; done
        test -x "$sdk/bin/cargo-clippy" && test ! -L "$sdk/bin/cargo-clippy"
        for program in capnp qemu-aarch64-static; do
          bind_dso "$(command -v "$program")"
        done
        for program in cc c++; do
          for child in cc1 cc1plus collect2; do
            resolved=$("$program" -print-prog-name="$child")
            if [[ $resolved == /* && -f $resolved ]]; then bind_dso "$resolved"; fi
          done
        done
        add_tree headers /usr/include
        add_tree gcc /usr/lib/gcc
        add_tree system-libraries /usr/lib/x86_64-linux-gnu
        add_tree pkgconfig /usr/share/pkgconfig

        phase=owned-tools
        admit_pair tools-and-proof "$tools" "$tools_cap" "$proof" "$proof_cap"
        mkdir "$tools/downloads" "$tools/cargo" "$tools/zig" "$tools/bin"
        # #529와 같은 PyPI wheel을 고정하고 native ELF/sysroot를 직접 사용한다. Python 진단/venv 없음.
        run_bounded cargo-wheel-fetch 120s curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 100 --max-filesize 2000000 \
          https://files.pythonhosted.org/packages/95/2b/3fbef7958e7902b1c0119e1a028528df6a5d28bae11282ee550689cb8b59/cargo_zigbuild-0.23.4-py3-none-manylinux_2_5_x86_64.manylinux1_x86_64.whl --output "$tools/downloads/cargo.whl"
        run_bounded zig-wheel-fetch 180s curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 160 --max-filesize 100000000 \
          https://files.pythonhosted.org/packages/3e/ed/7b79023aa27ceb5d461ecf761181e7c33c57bbc1a6256a39535d1c7083d2/ziglang-0.16.0-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl --output "$tools/downloads/zig.whl"
        printf '%s  %s\n' \
          0a149a2a07b9513d422efa9cc23e1add9741f08abe86845fa418eaeb4cca7931 "$tools/downloads/cargo.whl" \
          9fcda73f62b851dd72a54b710ad40a209896db14cfb13649e62191243556342b "$tools/downloads/zig.whl" > "$proof/tool-wheels.sha256"
        sha256sum --check --quiet "$proof/tool-wheels.sha256"
        run_bounded cargo-wheel-extract 120s unzip -q "$tools/downloads/cargo.whl" -d "$tools/cargo"
        run_bounded zig-wheel-extract 120s unzip -q "$tools/downloads/zig.whl" -d "$tools/zig"
        ln -s "$tools/cargo/cargo_zigbuild-0.23.4.data/scripts/cargo-zigbuild" "$tools/bin/cargo-zigbuild"
        ln -s "$tools/zig/ziglang/zig" "$tools/bin/zig"
        # 기존 checker의 runner 주입점만 사용한다. 정확한 두 QEMU argv를 원문 NUL로 보존한다.
        cat > "$tools/bin/qemu-probe" <<'QEMU'
        #!/bin/bash
        set -euo pipefail
        test "$1" = "$ARM_PROBE_BINARY"
        test "$2" = --proc-root
        case "$3" in "$TMPDIR"/rust-aarch64-proc-*) ;; *) exit 1;; esac
        test -d "$3" && test ! -L "$3"
        case "${4:-}" in
          --self-test) test "$#" = 4; mode=self-test;;
          --publish)
            test "$#" = 8
            test "$5" = --frames && test "$6" = 3
            test "$7" = --interval-ms && test "$8" = 100
            mode=publish;;
          *) exit 1;;
        esac
        set -o noclobber
        printf '%s\0' "$@" > "$ARM_PROBE_PROOF/qemu-$mode.argv.nul"
        exec /usr/bin/qemu-aarch64-static "$@"
        QEMU
        chmod 700 "$tools/bin/qemu-probe"
        export PATH="$sdk/bin:$tools/bin:/usr/bin:/bin"
        export CARGO_ZIGBUILD_ZIG_COMMAND="$tools/zig/ziglang/zig"
        export ZIG_LIB_DIR="$tools/zig/ziglang/lib"
        test -x "$tools/bin/cargo-zigbuild" && test -x "$tools/bin/zig" && test -d "$ZIG_LIB_DIR"
        bind_dso "$(readlink -e "$tools/bin/cargo-zigbuild")"
        bind_dso "$(readlink -e "$tools/bin/zig")"
        bind_file "$tools/bin/qemu-probe"
        cp -- "$tools/bin/qemu-probe" "$proof/qemu-probe.sh"
        cargo-zigbuild --version > "$proof/cargo-zigbuild-version.txt"
        zig version > "$proof/zig-version.txt"
        grep -Fx 'cargo-zigbuild 0.23.4' "$proof/cargo-zigbuild-version.txt"
        grep -Fx '0.16.0' "$proof/zig-version.txt"
        add_tree tools "$tools"
        mkdir "$CARGO_ZIGBUILD_CACHE_DIR"
        tree_seal "$CARGO_ZIGBUILD_CACHE_DIR" "$proof/wrappers-empty"
        printf '%s\n' 'Generated wrappers originate from the pinned native cargo-zigbuild issuer; empty before build, complete hash/identity seal after build, unchanged during probe/Clippy. Zig executable and whole sysroot sealed before build.' > "$proof/wrapper-provenance.txt"

        phase=native-build
        admit_pair native-build-and-proof "$build" "$build_cap" "$proof" "$proof_cap"
        # 8GiB는 scoped build의 보수 planned cap이다. 기존 full ARM의12GiB gate는 수정하지 않는다.
        if run_bounded procLog-musl-build 40m "$sdk/bin/cargo" zigbuild --manifest-path "$source/rust/Cargo.toml" --locked --release \
          -p openpilot-proclogd --bin openpilot-proclogd --target aarch64-unknown-linux-musl --message-format=json-render-diagnostics; then cross_status=pass; else cross_status=fail; failed=1; fi
        test ! -e "$proof/resource-stop.txt"
        if run_bounded host-checker-build 20m "$sdk/bin/cargo" build --manifest-path "$source/rust/Cargo.toml" --locked \
          -p openpilot-dev-tools --no-default-features --features aarch64-check-native --bin check-aarch64 \
          --target x86_64-unknown-linux-gnu --message-format=json-render-diagnostics; then host_status=pass; else host_status=fail; failed=1; fi
        test ! -e "$proof/resource-stop.txt"
        tree_seal "$CARGO_ZIGBUILD_CACHE_DIR" "$proof/wrappers-ready"
        tar -C "$CARGO_ZIGBUILD_CACHE_DIR" -cf "$proof/generated-zigbuild-wrappers.tar" .
        tree_seal "$musl" "$proof/musl-std-after-build"
        cmp "$proof/musl-std-before.roster.bin" "$proof/musl-std-after-build.roster.bin"
        cmp "$proof/musl-std-before.files.sha256" "$proof/musl-std-after-build.files.sha256"

        select_bin() {
          local label=$1 manifest=$2 bin=$3 src=$4 expected=$5 features=$6 selected
          (($(stat -c %s "$proof/$label.stdout") <= 64 * mib)) || return 1
          # JSONL 전체를 slurp하고 manifest/src/kind/name/profile/features와 build-finished 하나를 요구한다.
          selected=$(jq -er -s --arg manifest "$manifest" --arg bin "$bin" --arg src "$src" --arg expected "$expected" --argjson features "$features" '
            if ([.[] | select(.reason == "build-finished")] | length) != 1 or
               ([.[] | select(.reason == "build-finished")][0].success != true) then error("build did not finish once successfully") else . end |
            [.[] | select(.reason == "compiler-artifact" and .manifest_path == $manifest and
              .package_id == ("path+file://" + ($manifest | rtrimstr("/Cargo.toml")) + "#" + (if $bin == "check-aarch64" then "openpilot-dev-tools" else $bin end) + "@0.1.0") and
              .target.name == $bin and .target.kind == ["bin"] and .target.src_path == $src and
              .profile.test == false and (.features | sort) == $features and .executable != null)] |
            if length == 1 and .[0].executable == $expected then .[0].executable else error("exact bin artifact selection failed") end
          ' "$proof/$label.stdout") || return 1
          [[ $selected == "$expected" && -f $selected && -x $selected && ! -L $selected && $(readlink -e "$selected") == "$expected" ]] || return 1
          bind_dso "$selected" || return 1
          cp -- "$selected" "$proof/selected-bins/$bin" || return 1
          [[ $(sha256sum "$proof/selected-bins/$bin" | cut -d ' ' -f1) == "${held_sha[$selected]}" ]] || return 1
          bind_file "$proof/selected-bins/$bin" || return 1
          printf '%s\n' "$selected" > "$proof/$label-selected.txt"
        }
        arm=$CARGO_TARGET_DIR/aarch64-unknown-linux-musl/release/openpilot-proclogd
        checker=$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/check-aarch64
        mkdir "$proof/selected-bins"
        if [[ $cross_status == pass ]]; then
          select_bin procLog-musl-build "$source/rust/crates/proclogd/Cargo.toml" openpilot-proclogd "$source/rust/crates/proclogd/src/main.rs" "$arm" '[]' || { cross_status=fail; failed=1; }
        fi
        if [[ $host_status == pass ]]; then
          select_bin host-checker-build "$source/rust/crates/dev-tools/Cargo.toml" check-aarch64 "$source/rust/crates/dev-tools/src/bin/check_aarch64.rs" "$checker" '["aarch64-check-native","proclog-reference-native"]' || { host_status=fail; failed=1; }
        fi
        if [[ $cross_status == pass && $host_status == pass ]]; then
          phase=actual-probe
          capacity private-shm /dev/shm "$((64 * mib))"
          verify_held
          if run_bounded actual-arm-probe 120s env OPENPILOT_RUST_ROOT="$source" PATH=/nonexistent ARM_PROBE_BINARY="$arm" ARM_PROBE_PROOF="$proof" \
            "$checker" --binary "$arm" --runner "$tools/bin/qemu-probe" --report "$proof/aarch64-probe.json" < /dev/null; then
            arm_sha=${held_sha[$arm]}
            # worker의 원래 stdout 한 줄만 정확히 인정한다. 임의 prefix/행을 버리지 않는다.
            mapfile -d '' -t self_argv < "$proof/qemu-self-test.argv.nul"
            mapfile -d '' -t publish_argv < "$proof/qemu-publish.argv.nul"
            if IFS= read -r self_test_line < "$proof/actual-arm-probe.stdout" &&
              [[ ${#self_argv[@]} == 4 && ${#publish_argv[@]} == 8 && ${self_argv[0]} == "$arm" && ${publish_argv[0]} == "$arm" &&
                 ${self_argv[1]} == --proc-root && ${publish_argv[1]} == --proc-root && ${self_argv[2]} == "${publish_argv[2]}" &&
                 ${self_argv[3]} == --self-test && ${publish_argv[3]} == --publish && ${publish_argv[4]} == --frames &&
                 ${publish_argv[5]} == 3 && ${publish_argv[6]} == --interval-ms && ${publish_argv[7]} == 100 ]] &&
              [[ $self_test_line == 'PASS: temporary Params, isolated msgq, canonical procLog (1 processes)' ]] &&
              tail -n +2 "$proof/actual-arm-probe.stdout" > "$proof/checker-stdout-report.json" &&
              jq -e -s --arg sha "$arm_sha" 'length == 1 and (.[0] |
              keys == ["binary_sha256","device_validation","elf","execution","frames","procfs","result"] and
              .binary_sha256 == $sha and .device_validation == "not_run" and
              .elf == "static AArch64; no interpreter or shared dependencies" and
              .execution == "qemu-aarch64" and .frames == 3 and
              .procfs == "synthetic fixture" and .result == "pass")' "$proof/aarch64-probe.json" > "$proof/report-admission.json" &&
              cmp "$proof/checker-stdout-report.json" "$proof/aarch64-probe.json"; then probe_status=pass; else probe_status=fail; failed=1; fi
            if [[ $probe_status == pass ]]; then
              jq -n --arg source "$GITHUB_SHA" --arg arm "$arm_sha" --arg checker "${held_sha[$checker]}" \
                '{schema:1,source_commit:$source,arm_sha256:$arm,checker_sha256:$checker,qemu_calls:2,frames:3,
                  execution:"qemu-user",physical_arm_cpu:false,original_recapture:false,old_unit_executions:0,
                  full_arm_gate_replaced:false,retirement_acceptance:false,device_validation:"not_run"}' > "$proof/scoped-arm-receipt.json"
            fi
          else probe_status=fail; failed=1; fi
        fi

        # actual probe의 성패와 독립적으로 strict Clippy를 시도한다. old unit은 선택하지 않는다.
        phase=clippy
        admit_pair clippy-and-proof "$build" "$((512 * mib))" "$proof" "$proof_cap"
        if run_bounded host-checker-clippy 15m "$sdk/bin/cargo" clippy --manifest-path "$source/rust/Cargo.toml" --locked \
          -p openpilot-dev-tools --no-default-features --features aarch64-check-native --bin check-aarch64 \
          --target x86_64-unknown-linux-gnu -- -D warnings; then clippy_status=pass; else clippy_status=fail; failed=1; fi
        phase=final-seals
        exit "$failed"
    - name: Seal source and index after every attempted boundary
      id: source_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Require this exact scoped candidate and all final seals
      id: acceptance
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()) }}
      shell: bash
      env:
        NATIVE: ${{ steps.native.outcome }}
        SOURCE_FINAL: ${{ steps.source_final.outcome }}
        SEALED: ${{ steps.native.outputs.immutable_seals }}
        CROSS: ${{ steps.native.outputs.cross_status }}
        HOST: ${{ steps.native.outputs.host_status }}
        PROBE: ${{ steps.native.outputs.probe_status }}
        CLIPPY: ${{ steps.native.outputs.clippy_status }}
      run: |
        set -euo pipefail
        test "$NATIVE" = success
        test "$SOURCE_FINAL" = success
        test "$SEALED" = true
        test "$CROSS" = pass && test "$HOST" = pass && test "$PROBE" = pass && test "$CLIPPY" = pass
    - name: Upload raw proof even after a failed or unreached boundary
      id: evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: python-rust-523-scoped-arm-probe-candidate
        path: ${{ env.CI_JOB_TEMP }}/proof/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded owned source with immutable final seals
      id: source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' && steps.source_final.outcome == 'success' && steps.native.outputs.immutable_seals == 'true' && env.DIAG_SOURCE_OWNER != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(readlink -e -- "$PWD")" = "$DIAG_ACTIONS_WORKSPACE"
        case "$DIAG_SOURCE_OWNER" in "$DIAG_ACTIONS_WORKSPACE/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1;; esac
        test "${DIAG_SOURCE_OWNER%/*}" = "$DIAG_ACTIONS_WORKSPACE"
        test -d "$DIAG_SOURCE_OWNER" && test ! -L "$DIAG_SOURCE_OWNER"
        test "$(stat -c '%d:%i' -- "$DIAG_SOURCE_OWNER")" = "$DIAG_SOURCE_IDENTITY"
        test "$(stat -c '%u' -- "$DIAG_SOURCE_OWNER")" = "$(id -u)"
        test "$(readlink -e -- "$DIAG_SOURCE_OWNER")" = "$DIAG_SOURCE_OWNER"
        test -f "$DIAG_SOURCE_OWNER/.diag296-owner" && test ! -L "$DIAG_SOURCE_OWNER/.diag296-owner"
        test "$(cat "$DIAG_SOURCE_OWNER/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$DIAG_SOURCE_OWNER/source"
        test -d "$DIAG_SOURCE" && test ! -L "$DIAG_SOURCE"
        test "$(readlink -e -- "$DIAG_SOURCE")" = "$DIAG_SOURCE"
        rm -rf --one-file-system -- "$DIAG_SOURCE_OWNER"
    - name: Clean common owned output only after proof and source cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' && steps.source_cleanup.outcome == 'success') }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
