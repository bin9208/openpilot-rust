{
  "name": "296 developer SSH C3f compile and synthetic-only qualification",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/developer-ssh-c3f-296-once.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "296-developer-ssh-c3f-${{ github.ref }}",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "env": {
    "SOURCE_SHA": "c3f97466161dd62b45a2f7f9086bed3ccaaaf695",
    "RUSTUP_TOOLCHAIN": "1.94.0",
    "CARGO_INCREMENTAL": "0",
    "CARGO_BUILD_JOBS": "1",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "LC_ALL": "C.UTF-8",
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "developer-ssh-c3f": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 150,
      "steps": [
        {
          "name": "Require fixed trusted bin-actions branch",
          "shell": "bash",
          "run": "set -euo pipefail\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n"
        },
        {
          "name": "Common owned job temp",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Admit operation growth and allocate exclusive source",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\n[[ $GITHUB_ACTIONS == true && $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ -z ${GIT_DIR:-} && -z ${GIT_WORK_TREE:-} && -z ${GIT_CONFIG_COUNT:-} ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${GCONV_PATH:-} && -z ${GCONV_MODULES_CACHE:-} ]]\njob=$CI_JOB_TEMP\n[[ $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\nmkdir \"$job/proof\" \"$job/tools\" \"$job/home\" \"$job/cache\" \"$job/tmp\" \"$job/cargo\" \"$job/rustup\" \"$job/toolcache\" \"$job/bin\" \"$job/config\" \"$job/private-params\" \"$job/artifact\"\nprintf 'SG_JOB=%s\\nSG_JOB_ID=%s\\nSG_WORKSPACE=%s\\n' \"$job\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$workspace\" >> \"$GITHUB_ENV\"\ndf -PB1 \"$workspace\" \"$job\" > \"$job/proof/disk.before.txt\"\ncat /proc/meminfo > \"$job/proof/memory.before.txt\"\nprintf '%s\\n' \"$RUNNER_NAME\" \"$RUNNER_ENVIRONMENT\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" > \"$job/proof/runner.txt\"\n# Growth estimates, not a machine reserve: source checkout2GiB; fresh toolchain2,\n# registry2, target8, proof0.5GiB (system metadata Python only). Combine only on same filesystem.\navail_job=$(df -PB1 \"$job\" | awk 'NR==2{print $4}')\navail_source=$(df -PB1 \"$workspace\" | awk 'NR==2{print $4}')\nsource_growth=$((2*1024*1024*1024)); job_growth=$((25*1024*1024*1024/2))\nprintf '{\"source_growth_bytes\":%s,\"job_growth_bytes\":%s,\"source_available_bytes\":%s,\"job_available_bytes\":%s,\"fixed_reserve_bytes\":0}\\n' \"$source_growth\" \"$job_growth\" \"$avail_source\" \"$avail_job\" > \"$job/proof/growth.before.json\"\nif [[ $(stat -c %d \"$job\") == \"$(stat -c %d \"$workspace\")\" ]]; then\n ((avail_job >= job_growth + source_growth))\nelse\n ((avail_job >= job_growth && avail_source >= source_growth))\nfi\nowner=$(mktemp -d \"$workspace/.ssh296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX\")\nprintf '%s:%s:%s\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" > \"$owner/.ssh-owner\"\nmkdir \"$owner/source\"\n{\n printf 'SG_OWNER=%s\\nSG_OWNER_ID=%s\\nSG_SOURCE=%s/source\\nSG_CHECKOUT_PATH=%s/source\\n' \"$owner\" \"$(stat -c '%d:%i:%u' \"$owner\")\" \"$owner\" \"${owner#\"$workspace/\"}\"\n printf 'HOME=%s/home\\nCARGO_HOME=%s/cargo\\nRUSTUP_HOME=%s/rustup\\nCARGO_TARGET_DIR=%s/target\\nRUNNER_TOOL_CACHE=%s/toolcache\\nXDG_CACHE_HOME=%s/cache\\nTMPDIR=%s/tmp\\n' \"$job\" \"$job\" \"$job\" \"$job\" \"$job\" \"$job\" \"$job\"\n printf 'XDG_CONFIG_HOME=%s/config\\n' \"$job\"\n printf 'GIT_CONFIG_GLOBAL=%s/gitconfig\\nGIT_CONFIG_NOSYSTEM=1\\nPYTHONPATH=\\nPYTHONHOME=\\nPYTHONDONTWRITEBYTECODE=1\\nRUSTFLAGS=\\nCARGO_ENCODED_RUSTFLAGS=\\nRUSTC_WRAPPER=\\nRUSTC_WORKSPACE_WRAPPER=\\nCARGO_BUILD_TARGET=\\nLD_LIBRARY_PATH=\\nPYTHONINTMAXSTRDIGITS=\\n' \"$job\"\n} >> \"$GITHUB_ENV\"\nprintf 'source=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\njob=%s\\nsource_owner=%s\\njob_identity=%s\\nsource_owner_identity=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$owner\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$(stat -c '%d:%i:%u' \"$owner\")\" > \"$job/proof/binding.txt\"\n"
        },
        {
          "name": "Stage hash-pinned metadata cases.json",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/cases.json\"\\nPAYLOAD\nprintf '%s  %s\\n' 6fb9c0a371728450c861a4e6c7ff66a3a20602baf7f6982a674ea66fcb413082 \"$CI_JOB_TEMP/tools/cases.json\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Stage hash-pinned metadata control.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/control.py\"\\nPAYLOAD\nprintf '%s  %s\\n' 4e9dd1bbd3b92f0d7c5b10b2b5389a23dfcfdde97355bc143dbe61a2484c4d4d \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Stage hash-pinned metadata exec_audit.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/exec_audit.py\"\\nPAYLOAD\nprintf '%s  %s\\n' ae882a592e17bb42abe66b01b48b53ff40a447aaa8381b1c7103a230e635a8e7 \"$CI_JOB_TEMP/tools/exec_audit.py\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Stage hash-pinned metadata pins.json",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/pins.json\"\\nPAYLOAD\nprintf '%s  %s\\n' 321f3d5e0b58792a87f8bee71032b1ba4a3ebb4997b2491ae8705b2907a8b1c2 \"$CI_JOB_TEMP/tools/pins.json\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Stage hash-pinned metadata sandbox.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/tools/sandbox.py\"\\nPAYLOAD\nprintf '%s  %s\\n' 37c7fb1aadd7e7d46d2993143f0f466cd4acbcb88264e1135434ba64ee35aa7d \"$CI_JOB_TEMP/tools/sandbox.py\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Checkout literal reviewed C3f source",
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "c3f97466161dd62b45a2f7f9086bed3ccaaaf695",
            "path": "${{ env.SG_CHECKOUT_PATH }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Expose accepted Rust interface in private homes",
          "uses": "bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Admit preinstalled prerequisites and private toolchain",
          "shell": "bash",
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ $(/usr/bin/git -C \"$SG_SOURCE\" rev-parse HEAD) == \"$SOURCE_SHA\" ]]\n# No APT/provider install or fallback; missing prerequisites retain a genuine failure.\nfor tool in /usr/bin/python3 /usr/bin/git /usr/bin/strace /usr/bin/readelf /usr/bin/ldd /usr/bin/cc /usr/bin/c++ /usr/bin/ar /usr/bin/pkg-config /usr/bin/capnp; do\n [[ -x $tool ]]\n printf '%s\\n' \"$tool\"\ndone > \"$job/proof/available-tools.txt\"\n/usr/bin/pkg-config --modversion libzmq > \"$job/proof/libzmq.txt\"\nSG_RUSTUP=$(command -v rustup)\n[[ -x $SG_RUSTUP ]]\n# Private rustup/Cargo homes were set BEFORE the accepted rust-path helper.\ntimeout --signal=TERM --kill-after=10s 900s \"$SG_RUSTUP\" toolchain install 1.94.0 --profile minimal --component clippy > \"$job/proof/toolchain-install.stdout\" 2> \"$job/proof/toolchain-install.stderr\"\nSG_CARGO=$(\"$SG_RUSTUP\" which --toolchain 1.94.0 cargo)\nSG_RUSTC=$(\"$SG_RUSTUP\" which --toolchain 1.94.0 rustc)\nSG_CLIPPY=$(\"$SG_RUSTUP\" which --toolchain 1.94.0 clippy-driver)\nSG_CARGO_CLIPPY=$(\"$SG_RUSTUP\" which --toolchain 1.94.0 cargo-clippy)\nfor path in \"$SG_CARGO\" \"$SG_RUSTC\" \"$SG_CLIPPY\" \"$SG_CARGO_CLIPPY\"; do\n [[ $path == \"$RUSTUP_HOME\"/toolchains/*/bin/* && -x $path ]]\ndone\nSG_BUILD_PATH=\"$(dirname \"$SG_CARGO\"):$(dirname \"$SG_RUSTUP\"):/usr/bin:/bin\"\n# Metadata-only system Python; no original/project Python, venv, pip or interpreter int oracle.\nSG_PYTHON=/usr/bin/python3\n{\n printf 'SG_RUSTUP=%s\\nSG_CARGO=%s\\nSG_RUSTC=%s\\nSG_CLIPPY=%s\\nSG_CARGO_CLIPPY=%s\\nSG_BUILD_PATH=%s\\nSG_PYTHON=%s\\nRUSTC=%s\\n' \"$SG_RUSTUP\" \"$SG_CARGO\" \"$SG_RUSTC\" \"$SG_CLIPPY\" \"$SG_CARGO_CLIPPY\" \"$SG_BUILD_PATH\" \"$SG_PYTHON\" \"$SG_RUSTC\"\n} >> \"$GITHUB_ENV\"\n\"$SG_RUSTC\" -vV > \"$job/proof/rustc.txt\"\n/usr/bin/git --version > \"$job/proof/git.txt\"\n# Inventory only actual build provider resolutions, no new provider bootstrap.\n/usr/bin/python3 -I -B - <<'PY'\nimport json,os,shutil,subprocess\nfrom pathlib import Path\nnames=['cc','c++','ar','ld','as','pkg-config','capnp','make']\npaths={name:shutil.which(name) for name in names}\nassert all(paths.values()),paths\nfor program in ['cc1','cc1plus','collect2','as','ld']:\n raw=subprocess.check_output([paths['cc'],'-print-prog-name='+program],timeout=30,text=True).strip()\n resolved=raw if Path(raw).is_absolute() else shutil.which(raw)\n assert resolved and Path(resolved).is_file(),(program,raw)\n paths['internal-'+program]=resolved\nPath(os.environ['CI_JOB_TEMP'],'proof/build-provider-paths.json').write_text(json.dumps(paths,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Build two bins strict selected Clippy and synthetic28",
          "id": "qualification",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf '%s  %s\\n' 6fb9c0a371728450c861a4e6c7ff66a3a20602baf7f6982a674ea66fcb413082 \"$CI_JOB_TEMP/tools/cases.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 4e9dd1bbd3b92f0d7c5b10b2b5389a23dfcfdde97355bc143dbe61a2484c4d4d \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' ae882a592e17bb42abe66b01b48b53ff40a447aaa8381b1c7103a230e635a8e7 \"$CI_JOB_TEMP/tools/exec_audit.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 321f3d5e0b58792a87f8bee71032b1ba4a3ebb4997b2491ae8705b2907a8b1c2 \"$CI_JOB_TEMP/tools/pins.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 37c7fb1aadd7e7d46d2993143f0f466cd4acbcb88264e1135434ba64ee35aa7d \"$CI_JOB_TEMP/tools/sandbox.py\" | sha256sum --check --strict -\n\"$SG_PYTHON\" -I -B \"$CI_JOB_TEMP/tools/control.py\" qualify > \"$CI_JOB_TEMP/proof/qualify.stdout\" 2> \"$CI_JOB_TEMP/proof/qualify.stderr\"\n"
        },
        {
          "name": "Always require final source index provider ELF and owner closure",
          "id": "validation_seal",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf '%s  %s\\n' 6fb9c0a371728450c861a4e6c7ff66a3a20602baf7f6982a674ea66fcb413082 \"$CI_JOB_TEMP/tools/cases.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 4e9dd1bbd3b92f0d7c5b10b2b5389a23dfcfdde97355bc143dbe61a2484c4d4d \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' ae882a592e17bb42abe66b01b48b53ff40a447aaa8381b1c7103a230e635a8e7 \"$CI_JOB_TEMP/tools/exec_audit.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 321f3d5e0b58792a87f8bee71032b1ba4a3ebb4997b2491ae8705b2907a8b1c2 \"$CI_JOB_TEMP/tools/pins.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 37c7fb1aadd7e7d46d2993143f0f466cd4acbcb88264e1135434ba64ee35aa7d \"$CI_JOB_TEMP/tools/sandbox.py\" | sha256sum --check --strict -\n\"$SG_PYTHON\" -I -B \"$CI_JOB_TEMP/tools/control.py\" seal > \"$CI_JOB_TEMP/proof/seal.stdout\" 2> \"$CI_JOB_TEMP/proof/seal.stderr\"\n",
          "if": "${{ always() && env.SG_SOURCE != '' && env.SG_PYTHON != '' }}"
        },
        {
          "name": "Always preserve bounded raw failure or full sealed package",
          "id": "package_evidence",
          "if": "${{ always() && env.SG_JOB_ID != '' }}",
          "shell": "bash",
          "run": "set -euo pipefail\nMETADATA_OK=true\nprintf '%s  %s\\n' 6fb9c0a371728450c861a4e6c7ff66a3a20602baf7f6982a674ea66fcb413082 \"$CI_JOB_TEMP/tools/cases.json\" | sha256sum --check --strict - || METADATA_OK=false\nprintf '%s  %s\\n' 4e9dd1bbd3b92f0d7c5b10b2b5389a23dfcfdde97355bc143dbe61a2484c4d4d \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict - || METADATA_OK=false\nprintf '%s  %s\\n' ae882a592e17bb42abe66b01b48b53ff40a447aaa8381b1c7103a230e635a8e7 \"$CI_JOB_TEMP/tools/exec_audit.py\" | sha256sum --check --strict - || METADATA_OK=false\nprintf '%s  %s\\n' 321f3d5e0b58792a87f8bee71032b1ba4a3ebb4997b2491ae8705b2907a8b1c2 \"$CI_JOB_TEMP/tools/pins.json\" | sha256sum --check --strict - || METADATA_OK=false\nprintf '%s  %s\\n' 37c7fb1aadd7e7d46d2993143f0f466cd4acbcb88264e1135434ba64ee35aa7d \"$CI_JOB_TEMP/tools/sandbox.py\" | sha256sum --check --strict - || METADATA_OK=false\nset -euo pipefail\njob=$CI_JOB_TEMP\n[[ -d $job && ! -L $job && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\n[[ $(stat -c '%d:%i:%u' \"$job\") == \"$SG_JOB_ID\" ]]\nmkdir -p \"$job/artifact\"\nif [[ ${METADATA_OK:-false} == true && -n ${SG_PYTHON:-} && -x $SG_PYTHON && -f $job/tools/control.py ]]; then\n if \"$SG_PYTHON\" -I -B \"$job/tools/control.py\" package > \"$job/proof/package.stdout\" 2> \"$job/proof/package.stderr\"; then\n  echo 'complete=true' >> \"$GITHUB_OUTPUT\"; exit 0\n fi\nfi\nrm -f -- \"$job/artifact/proof.tar.gz\" \"$job/artifact/proof.sha256\" \"$job/artifact/COMPLETE\"\nprintf 'complete=false\\n' >> \"$GITHUB_OUTPUT\"\n# Partial upload NEVER qualifies cleanup. Full failed source/target/Cargo/tmp stays owned.\n{\n printf 'status=unqualified-partial-envelope\\nsource=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\njob=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\"\n for file in \"$job\"/proof/*; do\n  [[ -f $file && ! -L $file ]] || continue\n  printf '\\nfile=%s; first131072bytes\\n' \"${file##*/}\"\n  head -c 131072 \"$file\"\n done\n if [[ -f $job/active.json && ! -L $job/active.json ]]; then head -c 131072 \"$job/active.json\"; fi\n} | head -c 8388608 > \"$job/artifact/failure-envelope.txt\" || [[ -s $job/artifact/failure-envelope.txt ]]\n"
        },
        {
          "name": "Upload bounded raw qualification evidence",
          "uses": "actions/upload-artifact@v6",
          "id": "evidence",
          "if": "${{ always() && steps.package_evidence.outcome == 'success' }}",
          "with": {
            "name": "developer-ssh-c3f-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CI_JOB_TEMP }}/artifact",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Clean source only after successful qualification seal and upload",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf '%s  %s\\n' 6fb9c0a371728450c861a4e6c7ff66a3a20602baf7f6982a674ea66fcb413082 \"$CI_JOB_TEMP/tools/cases.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 4e9dd1bbd3b92f0d7c5b10b2b5389a23dfcfdde97355bc143dbe61a2484c4d4d \"$CI_JOB_TEMP/tools/control.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' ae882a592e17bb42abe66b01b48b53ff40a447aaa8381b1c7103a230e635a8e7 \"$CI_JOB_TEMP/tools/exec_audit.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 321f3d5e0b58792a87f8bee71032b1ba4a3ebb4997b2491ae8705b2907a8b1c2 \"$CI_JOB_TEMP/tools/pins.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 37c7fb1aadd7e7d46d2993143f0f466cd4acbcb88264e1135434ba64ee35aa7d \"$CI_JOB_TEMP/tools/sandbox.py\" | sha256sum --check --strict -\nset -euo pipefail\n[[ $QUALIFICATION == success && $SEAL == success && $PACK == success && $UPLOAD == success ]]\n[[ $UPLOAD_ID =~ ^[0-9]+$ && $UPLOAD_DIGEST =~ ^(sha256:)?[a-fA-F0-9]{64}$ ]]\n\"$SG_PYTHON\" -I -B \"$CI_JOB_TEMP/tools/control.py\" cleanup-check\n# Metadata rechecks root marker/devinoUID, source/ref, provider/ELF seals and\n# namespace quiescence. Only this exclusive source owner is deleted here.\nrm -rf --one-file-system -- \"$SG_OWNER\"\n",
          "id": "source_cleanup",
          "if": "${{ always() && steps.qualification.outcome == 'success' && steps.validation_seal.outcome == 'success' && steps.package_evidence.outcome == 'success' && steps.package_evidence.outputs.complete == 'true' && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' }}",
          "env": {
            "QUALIFICATION": "${{ steps.qualification.outcome }}",
            "SEAL": "${{ steps.validation_seal.outcome }}",
            "PACK": "${{ steps.package_evidence.outcome }}",
            "UPLOAD": "${{ steps.evidence.outcome }}",
            "UPLOAD_ID": "${{ steps.evidence.outputs.artifact-id }}",
            "UPLOAD_DIGEST": "${{ steps.evidence.outputs.artifact-digest }}"
          }
        },
        {
          "name": "Clean common owned temp only after uploaded qualified source cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "if": "${{ always() && steps.qualification.outcome == 'success' && steps.validation_seal.outcome == 'success' && steps.package_evidence.outcome == 'success' && steps.package_evidence.outputs.complete == 'true' && steps.source_cleanup.outcome == 'success' && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' }}",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  }
}
