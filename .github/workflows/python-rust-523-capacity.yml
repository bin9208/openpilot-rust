name: Python Rust 523 runner capacity inventory
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-capacity
  cancel-in-progress: false
  queue: max
jobs:
  inventory:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 10
    env:
      CAPACITY_OPERATION: ${{ inputs.operation || 'inventory' }}
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        set -euo pipefail
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_ARCH" = X64
        case "$CAPACITY_OPERATION" in inventory|preserve-driver476-witness) ;; *) exit 64 ;; esac
        if [[ $CAPACITY_OPERATION == preserve-driver476-witness ]]; then
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$GITHUB_REF" = refs/heads/codex/feat-523-python-rust
          test "$GITHUB_WORKFLOW_REF" = "bin9208/openpilot-rust/.github/workflows/python-rust-523-capacity.yml@$GITHUB_REF"
          test "$RUNNER_OS" = Linux
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ && $GITHUB_JOB == inventory ]]
          test ! -L "$RUNNER_TEMP"
          test "$(/usr/bin/realpath -e -- "$RUNNER_TEMP")" = "$RUNNER_TEMP"
          umask 077
          set -C
        fi
        report=$(mktemp -d "$RUNNER_TEMP/python-rust-523-capacity.XXXXXX")
        printf '%s:%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > "$report/owner"
        printf 'CAPACITY_REPORT=%s\n' "$report" >> "$GITHUB_ENV"
        if [[ $CAPACITY_OPERATION == preserve-driver476-witness ]]; then
          printf 'CAPACITY_REPORT_IDENTITY=%s\n' "$(/usr/bin/stat -c '%d:%i:%u:%f' -- "$report")" >> "$GITHUB_ENV"
        fi
    - name: Inspect shared compiler caches and historical policy cache ownership
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (env.CAPACITY_OPERATION == 'inventory') }}
      shell: bash
      run: |
        set -euo pipefail
        report=$CAPACITY_REPORT
        shared=/home/actions/actions-runner/_work/openpilot-rust/openpilot-rust
        df -PB1 "$shared" /tmp > "$report/filesystems.txt"
        du -x -B1 --max-depth=2 -- "$shared/rust" > "$report/shared-rust-usage.txt"
        ps -eo pid,ppid,uid,stat,comm > "$report/processes.txt"
        git -C "$shared" rev-parse HEAD > "$report/shared-source-commit.txt"
        git -C "$shared" status --porcelain=v1 -uno > "$report/shared-source-status.txt"
        for root in "$shared/rust/target" /tmp/openpilot-ci.hRmquO /tmp/openpilot-ci.s9WqUE /tmp/openpilot-ci.Rt5Jlt /tmp/openpilot-ci.eQd1Pi; do
          test -d "$root" && test ! -L "$root" || continue
          stat -c '%d:%i %u %s %n' -- "$root" >> "$report/root-identities.txt"
          if test -f "$root/owner" && test ! -L "$root/owner"; then
            printf '%s ' "$root" >> "$report/owners.txt"
            head -c 160 "$root/owner" >> "$report/owners.txt"
            printf '\n' >> "$report/owners.txt"
          fi
          du -x -B1 --max-depth=3 -- "$root" >> "$report/usage.txt"
        done
        # Cache metadata only, no file contents or arbitrary process arguments.
        if test -d "$shared/rust/target"; then
        find "$shared/rust/target" -xdev -type f -printf '%s %b %T@ %p\n' > "$report/target-file-sizes.txt"
        find "$shared/rust/target" -xdev -maxdepth 3 -type d -printf '%D:%i %u %T@ %p\n' > "$report/target-directories.txt"
        fi
        for root in /tmp/openpilot-ci.hRmquO /tmp/openpilot-ci.s9WqUE /tmp/openpilot-ci.Rt5Jlt /tmp/openpilot-ci.eQd1Pi; do
          test -d "$root" && test ! -L "$root" || continue
          find "$root" -maxdepth 2 -type f \( -name '*owner*' -o -name '*receipt*' -o -name '*manifest*' \) -printf '%p\n' >> "$report/known-marker-paths.txt"
        done
    - name: Inventory exact historical cache identities and all-UID references without deletion
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (env.CAPACITY_OPERATION == 'inventory') }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'INVENTORY'
        import hashlib,json,os,stat,subprocess,sys
        from pathlib import Path
        proof=Path(os.environ['CAPACITY_REPORT'])
        shared=Path('/home/actions/actions-runner/_work/openpilot-rust/openpilot-rust')
        roots=[
         ('shared-build-cache',shared/'rust/target'),
         ('old-policy',Path('/tmp/openpilot-ci.hRmquO/rustup-home')),
         ('old-policy',Path('/tmp/openpilot-ci.s9WqUE/rustup-home')),
         ('old-policy',Path('/tmp/openpilot-ci.Rt5Jlt/rustup-home')),
         ('old-policy',Path('/tmp/openpilot-ci.eQd1Pi/rustup-home')),
         ('protected-current-sdk',Path('/home/actions/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu')),
        ]
        def identity(s):return [s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_size,s.st_blocks,s.st_nlink,s.st_mtime_ns,s.st_ctime_ns]
        def row(path):
         s=path.lstat(); data={'identity':identity(s),'type':stat.S_IFMT(s.st_mode)}
         if stat.S_ISLNK(s.st_mode):data['target']=os.readlink(path)
         elif stat.S_ISREG(s.st_mode):
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
          try:
           a=os.fstat(fd);assert identity(a)==identity(s)
           with os.fdopen(fd,'rb',closefd=False) as stream:
            data['prefix4_hex']=stream.read(4).hex();stream.seek(0)
            data['sha256']=hashlib.file_digest(stream,'sha256').hexdigest()
           assert identity(os.fstat(fd))==identity(s)==identity(path.lstat())
          finally:os.close(fd)
         return data
        # Root reader reports only references to these exact historical caches. No argv/environment dump.
        reader="import json,os,sys\nfrom pathlib import Path\nrequest=json.load(sys.stdin);roots=request['roots'];inodes=request['inodes']\nresult={'references':[],'unknown_processes':[],'active_compilers':[]}\ndef matched(pid,kind,value,device=None,inode=None):\n found={root for root in roots if value==root or value.startswith(root+'/')}\n if device is not None:found.update(inodes.get(f'{device}:{inode}',[]))\n for root in sorted(found):result['references'].append({'pid':pid,'root':root,'kind':kind})\nfor proc in Path('/proc').iterdir():\n if not proc.name.isdigit() or int(proc.name)==os.getpid():continue\n try:\n  comm=(proc/'comm').read_text().strip()\n  if comm in {'cargo','rustc','rustdoc','gcc','g++','cc','cc1','cc1plus','clang','clang++','ld','ld.lld'}:result['active_compilers'].append({'pid':int(proc.name),'comm':comm})\n  for link in [proc/'cwd',proc/'exe']+list((proc/'fd').iterdir()):\n   try:\n    value=os.readlink(link).removesuffix(' (deleted)');info=link.stat()\n   except FileNotFoundError:continue\n   matched(int(proc.name),'fd' if link.parent.name=='fd' else link.name,value,info.st_dev,info.st_ino)\n  for line in (proc/'maps').read_text().splitlines():\n   fields=line.split(None,5)\n   if len(fields)>=5:\n    major,minor=(int(part,16) for part in fields[3].split(':'));device=os.makedev(major,minor)\n    matched(int(proc.name),'map',fields[5].removesuffix(' (deleted)') if len(fields)==6 else '',device,int(fields[4]))\n except (FileNotFoundError,ProcessLookupError):continue\n except (PermissionError,OSError) as error:result['unknown_processes'].append({'pid':int(proc.name),'error_type':type(error).__name__})\nresult['complete_reference_scan']=not result['unknown_processes']\nprint(json.dumps(result,sort_keys=True))\n"
        def processes(label):
         p=subprocess.run(['sudo','-n',sys.executable,'-I','-B','-S','-c',reader],input=json.dumps({'roots':[str(p) for _,p in roots],'inodes':inode_roots}),text=True,capture_output=True,check=True)
         data=json.loads(p.stdout);(proof/f'cache-processes-{label}.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
         return data
        def walk_error(error):raise error
        def metadata_snapshot():
         result={};count=0
         for _,root in roots:
          rows={}
          with (proof/'scan-events.jsonl').open('a') as events:events.write(json.dumps({'phase':'metadata-scan','root':str(root),'entries_before':count})+'\n')
          if not os.path.lexists(root):result[str(root)]=rows;continue
          assert root.resolve(strict=True)==root and root.is_dir() and not root.is_symlink()
          rows['.']=identity(root.lstat())
          for base,dirs,files in os.walk(root,followlinks=False,onerror=walk_error):
           assert len(Path(base).relative_to(root).parts)<=64
           for name in dirs+files:
            path=Path(base)/name;rows[str(path.relative_to(root))]=identity(path.lstat());count+=1;assert count<=65000, f'65000-entry bound exceeded at {root}'
           dirs[:]=[name for name in dirs if not (Path(base)/name).is_symlink()]
          result[str(root)]=rows
         return result
        metadata_before=metadata_snapshot()
        inode_roots={}
        for root,rows in metadata_before.items():
         for item in rows.values():
          values=inode_roots.setdefault(f'{item[0]}:{item[1]}',[])
          if root not in values:values.append(root)
        processes('before')
        result={'schema':'openpilot.runner-cache-readonly.v1','source_commit':os.environ['GITHUB_SHA'],'roots':[],'physical_deletions':0,'uninspected_protected_paths':['/tmp/openpilot-ci.1V9i3J/rustup-home','/tmp/openpilot-ci.4o8uWv/rustup-home','/tmp/openpilot-ci.pMuJhG/rustup-home','/tmp/openpilot-ci.W1gAdy/296-model-publisher-39892674176-1-YoMXP1eG/rustup']}
        count=0
        for role,root in roots:
         entry={'role':role,'path':str(root),'entries':{}}
         if not os.path.lexists(root):entry['absent']=True;result['roots'].append(entry);continue
         s=root.lstat();assert stat.S_ISDIR(s.st_mode) and root.resolve(strict=True)==root,(role,str(root))
         initial=identity(s); entry['root_identity']=initial
         for candidate in [root.parent/'owner',root.parent.parent/'owner',root.parent/'.diag296-owner']:
          if candidate.is_file() and not candidate.is_symlink():
           data=candidate.read_bytes();assert len(data)<=512
           entry.setdefault('owner_markers',{})[str(candidate)]=data.decode('ascii')
         unique={(s.st_dev,s.st_ino):s.st_blocks*512}
         for base,dirs,files in os.walk(root,followlinks=False,onerror=walk_error):
          assert len(Path(base).relative_to(root).parts)<=64
          for name in dirs+files:
           path=Path(base)/name;entry['entries'][str(path.relative_to(root))]=item=row(path);count+=1;assert count<=65000, f'65000-entry bound exceeded at {root}'
           info=item['identity'];unique[(info[0],info[1])]=info[6]*512
          dirs[:]=[name for name in dirs if not (Path(base)/name).is_symlink()]
         assert identity(root.lstat())==initial,('root changed',str(root))
         entry['unique_inode_allocated_bytes']=sum(unique.values())
         result['roots'].append(entry)
        (proof/'cache-inventory.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
        assert (proof/'cache-inventory.json').stat().st_size<=32*1024**2
        processes('after')
        assert metadata_snapshot()==metadata_before, 'Exact cache metadata/roster changed during inventory'
        space=os.statvfs(shared);(proof/'cache-free-after.json').write_text(json.dumps({'available_bytes':space.f_bavail*space.f_frsize,'fragment_bytes':space.f_frsize})+'\n')
        (proof/'cache-inventory.sha256').write_text(hashlib.sha256((proof/'cache-inventory.json').read_bytes()).hexdigest()+'\n')
        print('Readonly exact-root cache inventory',count,'entries; physical deletions=0')
        INVENTORY
    - name: Preserve read-only inventory
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CAPACITY_OPERATION == 'inventory' && env.CAPACITY_REPORT
        != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: python-rust-523-capacity-${{ github.run_id }}
        path: ${{ env.CAPACITY_REPORT }}
        if-no-files-found: error
        retention-days: 14
    - name: Authenticate and hold the fixed driver476 witness
      id: witness_auth
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (env.CAPACITY_OPERATION == 'preserve-driver476-witness') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        set -C
        umask 077
        for tool in curl jq sha256sum unzip timeout stat realpath df date head wc id cmp; do
          test -x "/usr/bin/$tool"
        done
        report=$CAPACITY_REPORT
        [[ $report == "$RUNNER_TEMP"/python-rust-523-capacity.?????? ]]
        test -d "$report" && test ! -L "$report"
        test "$(/usr/bin/realpath -e -- "$report")" = "$report"
        test "$(/usr/bin/stat -c '%d:%i:%u:%f' -- "$report")" = "$CAPACITY_REPORT_IDENTITY"
        test "$(/usr/bin/stat -c '%u:%a' -- "$report")" = "$(/usr/bin/id -u):700"
        test -f "$report/owner" && test ! -L "$report/owner"
        test "$(/usr/bin/stat -c '%u:%a' -- "$report/owner")" = "$(/usr/bin/id -u):600"
        test "$(cat "$report/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        available=$(/usr/bin/df -PB1 -- "$report" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]] && ((available >= 64 * 1024 * 1024))
        mkdir -m 700 "$report/payload" "$report/provenance" "$report/roundtrip"
        api=https://api.github.com/repos/bin9208/openpilot-rust
        digest=a318335767594bfe8bcd08878f15e4f6a03bb0d8d13541d56f3b83243b19f461
        origin_head=0e522bf2a968082195f08ffa4692a3f2ecf6d775
        checkout=a29832fd0d046253465621a05f02a91e9cfdb1d1
        get_json() (
          # Exclusive creation plus a kernel file-size limit also bounds chunked responses.
          ulimit -f 1024
          test ! -e "$2" && test ! -L "$2"
          exec {fd}>"$2"
          status=$(/usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
            --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --output "/dev/fd/$fd" --write-out '%{http_code}' "$api/$1")
          test "$status" = 200
        )
        get_json actions/artifacts/12393290469 "$report/provenance/origin-artifact.json"
        get_json actions/runs/39700512883 "$report/provenance/origin-run.json"
        /usr/bin/jq -e --arg head "$origin_head" --arg digest "sha256:$digest" '
          .id == 12393290469 and .name == "model-driver-cpu-context-296-0" and
          .size_in_bytes == 20550808 and .digest == $digest and .expired == false and
          .workflow_run.id == 39700512883 and .workflow_run.head_sha == $head and
          .workflow_run.repository_id == 1395501963 and .workflow_run.head_repository_id == 1395501963
        ' "$report/provenance/origin-artifact.json" > /dev/null
        /usr/bin/jq -e --arg head "$origin_head" '
          .id == 39700512883 and .run_attempt == 1 and .head_sha == $head and
          .status == "completed" and .conclusion == "success" and .event == "push" and
          .path == ".github/workflows/model-driver-cpu-context-296-once.yml" and
          .repository.full_name == "bin9208/openpilot-rust" and .repository.id == 1395501963 and
          .head_repository.full_name == "bin9208/openpilot-rust" and .head_repository.id == 1395501963
        ' "$report/provenance/origin-run.json" > /dev/null
        get_json "actions/runs/$GITHUB_RUN_ID" "$report/provenance/preservation-run.json"
        /usr/bin/jq -e --arg id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg head "$GITHUB_SHA" '
          (.id | tostring) == $id and (.run_attempt | tostring) == $attempt and .head_sha == $head and
          .event == "workflow_dispatch" and .head_branch == "codex/feat-523-python-rust" and
          .path == ".github/workflows/python-rust-523-capacity.yml" and
          .repository.full_name == "bin9208/openpilot-rust" and .repository.id == 1395501963 and
          .head_repository.full_name == "bin9208/openpilot-rust" and .head_repository.id == 1395501963
        ' "$report/provenance/preservation-run.json" > /dev/null
        # Only the API request carries Authorization; the signed HTTPS GET does not.
        redirect=$(/usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
          --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $GH_TOKEN" \
          --output /dev/null --write-out '%{http_code}\n%{redirect_url}' "$api/actions/artifacts/12393290469/zip")
        [[ $redirect == $'302\nhttps://'* ]]
        url=${redirect#*$'\n'}
        [[ $url != *$'\n'* && $url != *$'\r'* ]]
        payload=$report/payload/driver476-object-witness-12393290469.zip
        (
          test ! -e "$payload" && test ! -L "$payload"
          exec {fd}>"$payload"
          /usr/bin/timeout --signal=TERM --kill-after=5s 120s \
            /usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
            --connect-timeout 10 --max-time 110 --max-filesize 20550808 "$url" |
            /usr/bin/head -c 20550809 >&"$fd"
        )
        test -f "$payload" && test ! -L "$payload"
        test "$(/usr/bin/stat -c '%u:%a:%s' -- "$payload")" = "$(/usr/bin/id -u):600:20550808"
        printf '%s  %s\n' "$digest" "$payload" | /usr/bin/sha256sum --check --strict -
        /usr/bin/timeout --signal=TERM --kill-after=5s 30s /usr/bin/unzip -t "$payload" > "$report/provenance/origin-crc.txt"
        /usr/bin/unzip -Z1 "$payload" > "$report/provenance/origin-members.txt"
        test "$(/usr/bin/wc -l < "$report/provenance/origin-members.txt")" = 258
        /usr/bin/unzip -p "$payload" SOURCE_COMMIT > "$report/provenance/SOURCE_COMMIT"
        /usr/bin/unzip -p "$payload" WORKFLOW_COMMIT > "$report/provenance/WORKFLOW_COMMIT"
        test "$(/usr/bin/wc -c < "$report/provenance/SOURCE_COMMIT")" = 41
        test "$(/usr/bin/wc -c < "$report/provenance/WORKFLOW_COMMIT")" = 41
        test "$(cat "$report/provenance/SOURCE_COMMIT")" = "$checkout"
        test "$(cat "$report/provenance/WORKFLOW_COMMIT")" = "$origin_head"
        /usr/bin/jq -n --arg source "$GITHUB_SHA" --arg owner "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB" \
          --arg identity "$CAPACITY_REPORT_IDENTITY" --argjson available "$available" --arg digest "$digest" \
          --arg head "$origin_head" --arg checkout "$checkout" '{
            schema: "openpilot.driver476-witness-preservation.v1", status: "AUTHENTICATED_ORIGIN_ONLY",
            preservation_source: $source, owner: $owner, report_identity: $identity,
            available_bytes_before: $available, admitted_growth_bytes: 67108864,
            origin: {artifact: 12393290469, run: 39700512883, workflow_source: $head,
              checkout_source: $checkout, bytes: 20550808, sha256: $digest},
            replay_executed: false, consumer_binding_changed: false
          }' > "$report/provenance/origin-binding.json"
        printf 'CAPACITY_PAYLOAD_IDENTITY=%s\n' "$(/usr/bin/stat -c '%d:%i:%u:%f:%s:%Y:%Z' -- "$payload")" >> "$GITHUB_ENV"
    - name: Preserve authenticated driver476 witness bytes as-is
      id: witness_zip
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (env.CAPACITY_OPERATION == 'preserve-driver476-witness' && steps.witness_auth.outcome == 'success') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        path: ${{ env.CAPACITY_REPORT }}/payload/driver476-object-witness-12393290469.zip
        archive: false
        retention-days: 90
        if-no-files-found: error
        overwrite: false
    - name: Verify the new artifact through the unchanged ZIP API
      id: witness_roundtrip
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (env.CAPACITY_OPERATION == 'preserve-driver476-witness' && steps.witness_zip.outcome == 'success') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WITNESS_ARTIFACT_ID: ${{ steps.witness_zip.outputs.artifact-id }}
        WITNESS_ARTIFACT_DIGEST: ${{ steps.witness_zip.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        set -C
        umask 077
        report=$CAPACITY_REPORT
        [[ $report == "$RUNNER_TEMP"/python-rust-523-capacity.?????? ]]
        test -d "$report" && test ! -L "$report"
        test "$(/usr/bin/realpath -e -- "$report")" = "$report"
        test "$(/usr/bin/stat -c '%d:%i:%u:%f' -- "$report")" = "$CAPACITY_REPORT_IDENTITY"
        test "$(/usr/bin/stat -c '%u:%a' -- "$report")" = "$(/usr/bin/id -u):700"
        test -f "$report/owner" && test ! -L "$report/owner"
        test "$(cat "$report/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        for leaf in payload provenance roundtrip; do
          test -d "$report/$leaf" && test ! -L "$report/$leaf"
          test "$(/usr/bin/realpath -e -- "$report/$leaf")" = "$report/$leaf"
          test "$(/usr/bin/stat -c '%u:%a' -- "$report/$leaf")" = "$(/usr/bin/id -u):700"
        done
        available=$(/usr/bin/df -PB1 -- "$report" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]] && ((available >= 20550809 + 4 * 1024 * 1024))
        digest=a318335767594bfe8bcd08878f15e4f6a03bb0d8d13541d56f3b83243b19f461
        [[ $WITNESS_ARTIFACT_ID =~ ^[1-9][0-9]{0,18}$ && $WITNESS_ARTIFACT_ID != 12393290469 ]]
        test "$WITNESS_ARTIFACT_DIGEST" = "$digest"
        payload=$report/payload/driver476-object-witness-12393290469.zip
        test -f "$payload" && test ! -L "$payload"
        test "$(/usr/bin/stat -c '%d:%i:%u:%f:%s:%Y:%Z' -- "$payload")" = "$CAPACITY_PAYLOAD_IDENTITY"
        printf '%s  %s\n' "$digest" "$payload" | /usr/bin/sha256sum --check --strict -
        api=https://api.github.com/repos/bin9208/openpilot-rust
        (
          ulimit -f 1024
          test ! -e "$report/provenance/preserved-artifact.json" && test ! -L "$report/provenance/preserved-artifact.json"
          exec {fd}>"$report/provenance/preserved-artifact.json"
          status=$(/usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
            --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --output "/dev/fd/$fd" --write-out '%{http_code}' "$api/actions/artifacts/$WITNESS_ARTIFACT_ID")
          test "$status" = 200
        )
        /usr/bin/jq -e --arg id "$WITNESS_ARTIFACT_ID" --arg run "$GITHUB_RUN_ID" --arg head "$GITHUB_SHA" --arg digest "sha256:$digest" '
          (.id | tostring) == $id and .name == "driver476-object-witness-12393290469.zip" and
          .size_in_bytes == 20550808 and .digest == $digest and .expired == false and
          (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $head and
          .workflow_run.repository_id == 1395501963 and .workflow_run.head_repository_id == 1395501963
        ' "$report/provenance/preserved-artifact.json" > /dev/null
        run_created=$(/usr/bin/date -u -d "$(/usr/bin/jq -er .created_at "$report/provenance/preservation-run.json")" +%s)
        artifact_created=$(/usr/bin/date -u -d "$(/usr/bin/jq -er .created_at "$report/provenance/preserved-artifact.json")" +%s)
        expires=$(/usr/bin/date -u -d "$(/usr/bin/jq -er .expires_at "$report/provenance/preserved-artifact.json")" +%s)
        ((run_created <= artifact_created && expires >= artifact_created + 90 * 86400 && expires <= artifact_created + 90 * 86400 + 600))
        redirect=$(/usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
          --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $GH_TOKEN" \
          --output /dev/null --write-out '%{http_code}\n%{redirect_url}' "$api/actions/artifacts/$WITNESS_ARTIFACT_ID/zip")
        [[ $redirect == $'302\nhttps://'* ]]
        url=${redirect#*$'\n'}
        [[ $url != *$'\n'* && $url != *$'\r'* ]]
        (
          test ! -e "$report/roundtrip/artifact.zip" && test ! -L "$report/roundtrip/artifact.zip"
          exec {fd}>"$report/roundtrip/artifact.zip"
          /usr/bin/timeout --signal=TERM --kill-after=5s 120s \
            /usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
            --connect-timeout 10 --max-time 110 --max-filesize 20550808 "$url" |
            /usr/bin/head -c 20550809 >&"$fd"
        )
        test -f "$report/roundtrip/artifact.zip" && test ! -L "$report/roundtrip/artifact.zip"
        test "$(/usr/bin/stat -c '%u:%a:%s' -- "$report/roundtrip/artifact.zip")" = "$(/usr/bin/id -u):600:20550808"
        printf '%s  %s\n' "$digest" "$report/roundtrip/artifact.zip" | /usr/bin/sha256sum --check --strict -
        /usr/bin/cmp -- "$payload" "$report/roundtrip/artifact.zip"
        test "$(/usr/bin/stat -c '%d:%i:%u:%f:%s:%Y:%Z' -- "$payload")" = "$CAPACITY_PAYLOAD_IDENTITY"
        /usr/bin/jq -n --arg id "$WITNESS_ARTIFACT_ID" --arg digest "$digest" --arg source "$GITHUB_SHA" \
          --arg run "$GITHUB_RUN_ID" --argjson expires "$expires" '{
            schema: "openpilot.driver476-witness-roundtrip.v1", status: "ROUNDTRIP_VERIFIED",
            artifact_id: $id, run_id: $run, source_commit: $source, bytes: 20550808,
            sha256: $digest, expires_epoch: $expires, requested_retention_days: 90,
            endpoint: "/zip", unwrapped: false, original_bytes_equal: true
          }' > "$report/provenance/roundtrip.json"
        printf 'roundtrip_verified=true\n' >> "$GITHUB_OUTPUT"
    - name: Preserve separate origin and roundtrip provenance
      id: witness_proof
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CAPACITY_OPERATION == 'preserve-driver476-witness' && steps.witness_auth.outcome == 'success') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: driver476-witness-provenance-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CAPACITY_REPORT }}/provenance
        retention-days: 90
        if-no-files-found: error
        overwrite: false
    - name: Authenticate upload receipts and clean only the owned preservation report
      id: witness_complete
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (env.CAPACITY_OPERATION == 'preserve-driver476-witness' && steps.witness_roundtrip.outcome == 'success' && steps.witness_roundtrip.outputs.roundtrip_verified == 'true' && steps.witness_proof.outcome == 'success') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WITNESS_ARTIFACT_ID: ${{ steps.witness_zip.outputs.artifact-id }}
        WITNESS_ARTIFACT_DIGEST: ${{ steps.witness_zip.outputs.artifact-digest }}
        WITNESS_PROOF_ID: ${{ steps.witness_proof.outputs.artifact-id }}
        WITNESS_PROOF_DIGEST: ${{ steps.witness_proof.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        set -C
        umask 077
        report=$CAPACITY_REPORT
        [[ $report == "$RUNNER_TEMP"/python-rust-523-capacity.?????? ]]
        test -d "$report" && test ! -L "$report"
        test "$(/usr/bin/realpath -e -- "$report")" = "$report"
        test "$(/usr/bin/stat -c '%d:%i:%u:%f' -- "$report")" = "$CAPACITY_REPORT_IDENTITY"
        test "$(/usr/bin/stat -c '%u:%a' -- "$report")" = "$(/usr/bin/id -u):700"
        test -f "$report/owner" && test ! -L "$report/owner"
        test "$(/usr/bin/stat -c '%u:%a' -- "$report/owner")" = "$(/usr/bin/id -u):600"
        test "$(cat "$report/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        for leaf in payload provenance roundtrip; do
          test -d "$report/$leaf" && test ! -L "$report/$leaf"
          test "$(/usr/bin/realpath -e -- "$report/$leaf")" = "$report/$leaf"
          test "$(/usr/bin/stat -c '%u:%a' -- "$report/$leaf")" = "$(/usr/bin/id -u):700"
        done
        [[ $WITNESS_ARTIFACT_ID =~ ^[1-9][0-9]{0,18}$ && $WITNESS_PROOF_ID =~ ^[1-9][0-9]{0,18}$ ]]
        [[ $WITNESS_PROOF_ID != "$WITNESS_ARTIFACT_ID" && $WITNESS_PROOF_ID != 12393290469 ]]
        [[ $WITNESS_PROOF_DIGEST =~ ^[0-9a-f]{64}$ ]]
        digest=a318335767594bfe8bcd08878f15e4f6a03bb0d8d13541d56f3b83243b19f461
        test "$WITNESS_ARTIFACT_DIGEST" = "$digest"
        test -f "$report/provenance/roundtrip.json" && test ! -L "$report/provenance/roundtrip.json"
        /usr/bin/jq -e --arg id "$WITNESS_ARTIFACT_ID" --arg run "$GITHUB_RUN_ID" --arg head "$GITHUB_SHA" --arg digest "$digest" '
          .status == "ROUNDTRIP_VERIFIED" and .artifact_id == $id and .run_id == $run and
          .source_commit == $head and .bytes == 20550808 and .sha256 == $digest and
          .original_bytes_equal == true and .unwrapped == false and .requested_retention_days == 90
        ' "$report/provenance/roundtrip.json" > /dev/null
        api=https://api.github.com/repos/bin9208/openpilot-rust
        run_created=$(/usr/bin/date -u -d "$(/usr/bin/jq -er .created_at "$report/provenance/preservation-run.json")" +%s)
        for role in payload proof; do
          if [[ $role == payload ]]; then
            artifact=$WITNESS_ARTIFACT_ID; expected_digest=$digest
            name=driver476-object-witness-12393290469.zip
          else
            artifact=$WITNESS_PROOF_ID; expected_digest=$WITNESS_PROOF_DIGEST
            name=driver476-witness-provenance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          fi
          (
            ulimit -f 1024
            test ! -e "$report/roundtrip/$role-upload.json" && test ! -L "$report/roundtrip/$role-upload.json"
            exec {fd}>"$report/roundtrip/$role-upload.json"
            status=$(/usr/bin/curl --disable --silent --show-error --fail --proto '=https' \
              --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
              --output "/dev/fd/$fd" --write-out '%{http_code}' "$api/actions/artifacts/$artifact")
            test "$status" = 200
          )
          /usr/bin/jq -e --arg id "$artifact" --arg name "$name" --arg digest "sha256:$expected_digest" \
            --arg run "$GITHUB_RUN_ID" --arg head "$GITHUB_SHA" '
            (.id | tostring) == $id and .name == $name and .digest == $digest and .expired == false and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $head and
            .workflow_run.repository_id == 1395501963 and .workflow_run.head_repository_id == 1395501963
          ' "$report/roundtrip/$role-upload.json" > /dev/null
          bytes=$(/usr/bin/jq -er .size_in_bytes "$report/roundtrip/$role-upload.json")
          [[ $bytes =~ ^[0-9]+$ ]]
          if [[ $role == payload ]]; then ((bytes == 20550808)); else ((bytes > 0 && bytes <= 1048576)); fi
          artifact_created=$(/usr/bin/date -u -d "$(/usr/bin/jq -er .created_at "$report/roundtrip/$role-upload.json")" +%s)
          expires=$(/usr/bin/date -u -d "$(/usr/bin/jq -er .expires_at "$report/roundtrip/$role-upload.json")" +%s)
          ((run_created <= artifact_created && expires >= artifact_created + 90 * 86400 && expires <= artifact_created + 90 * 86400 + 600))
        done
        payload=$report/payload/driver476-object-witness-12393290469.zip
        test -f "$payload" && test ! -L "$payload"
        test "$(/usr/bin/stat -c '%d:%i:%u:%f:%s:%Y:%Z' -- "$payload")" = "$CAPACITY_PAYLOAD_IDENTITY"
        printf '%s  %s\n' "$digest" "$payload" | /usr/bin/sha256sum --check --strict -
        test -f "$report/roundtrip/artifact.zip" && test ! -L "$report/roundtrip/artifact.zip"
        test "$(/usr/bin/stat -c '%u:%a:%s' -- "$report/roundtrip/artifact.zip")" = "$(/usr/bin/id -u):600:20550808"
        printf '%s  %s\n' "$digest" "$report/roundtrip/artifact.zip" | /usr/bin/sha256sum --check --strict -
        completion=$(/usr/bin/jq -n --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
          --arg artifact "$WITNESS_ARTIFACT_ID" --arg proof "$WITNESS_PROOF_ID" \
          --arg digest "$digest" --arg proof_digest "$WITNESS_PROOF_DIGEST" '{
            status: "PRESERVATION_VERIFIED", source_commit: $source, run_id: $run,
            artifact_id: $artifact, sha256: $digest, proof_artifact_id: $proof,
            proof_sha256: $proof_digest, requested_retention_days: 90, original_bytes_equal: true
          }')
        test "$(/usr/bin/stat -c '%d:%i:%u:%f' -- "$report")" = "$CAPACITY_REPORT_IDENTITY"
        test "$(cat "$report/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        rm -rf --one-file-system -- "$report"
        printf '%s\n' "$completion"
        printf '```json\n%s\n```\n' "$completion" >> "$GITHUB_STEP_SUMMARY"
        printf 'preservation_verified=true\n' >> "$GITHUB_OUTPUT"
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-capacity.yml
  # 2026-10-25: 복구된80GB 러너의 후속 읽기 전용 용량 확인도 지원한다.
  workflow_dispatch:
    inputs:
      operation:
        description: 기존 용량 조사 또는 인증된 고정 driver476 증거 보존
        type: choice
        required: true
        default: inventory
        options:
        - inventory
        - preserve-driver476-witness
