name: Runner comparison 496
run-name: Same-source runner comparison 496 (3 rounds)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-comparison-496
  cancel-in-progress: false
jobs:
  compare:
    name: compare (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: github-hosted
            labels: [ubuntu-24.04]
          - kind: self-hosted
            labels: [self-hosted, Linux, X64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    env:
      SOURCE_SHA: dc95138076836ea3a5c1b6c27262be3f3b912f71
      GIT_LFS_SKIP_SMUDGE: '1'
      CI: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - name: Inspect host and reserve disk capacity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . /etc/os-release
          {
            echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
            echo "OS: $PRETTY_NAME"
            lscpu | head -25
            free -h
            df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /tmp
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for location in "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /tmp; do
            available=$(df --output=avail -B1 "$location" | tail -1)
            if (( available < 35 * 1024 * 1024 * 1024 )); then
              echo 'Need at least 35 GiB before this bounded 8 GiB experiment.' >&2
              exit 1
            fi
          done
          for tool in git curl tar xz unzip zstd python3 rustup cargo gcc g++ make pkg-config; do
            command -v "$tool"
          done
          sudo -n true
          test -w "$RUNNER_TOOL_CACHE"
          root=$(mktemp -d /tmp/rc496.XXXXXX)
          printf '%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > "$root/owner"
          mkdir -p "$root/results" "$root/tmp"
          {
            echo "BENCH_ROOT=$root"
            echo "CARGO_HOME=$root/cargo"
            echo "CARGO_TARGET_DIR=$root/target"
            echo "PIP_CACHE_DIR=$root/pip-cache"
            echo "GRADLE_USER_HOME=$root/gradle"
            echo "TMPDIR=$root/tmp"
          } >> "$GITHUB_ENV"
          printf 'stage\tseconds\texit_code\n' > "$root/results/timing.tsv"
          cp /etc/os-release "$root/results/os-release"
          lscpu > "$root/results/lscpu.txt"
          free -b > "$root/results/memory.txt"
      - uses: actions/checkout@v7
        with:
          ref: dc95138076836ea3a5c1b6c27262be3f3b912f71
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Bind source and initialize native IPC peer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee "$BENCH_ROOT/results/SOURCE_COMMIT"
          git submodule update --init --depth 1 msgq_repo
          git submodule status msgq_repo > "$BENCH_ROOT/results/submodules.txt"
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v6
        with: {node-version: '24'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare identical tools and run three comparison rounds
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TEMP="$BENCH_ROOT/tmp"
          guard() {
            local available
            available=$(df --output=avail -B1 "$BENCH_ROOT" | tail -1)
            if (( available < (25 + 8) * 1024 * 1024 * 1024 )); then
              echo 'Insufficient reserve: keep 25 GiB plus 8 GiB estimated growth.' >&2
              return 1
            fi
          }
          measure() {
            local label=$1 begin end rc=0
            shift
            begin=$(date +%s%N)
            "$@" > "$BENCH_ROOT/results/$label.log" 2>&1 || rc=$?
            end=$(date +%s%N)
            awk -v label="$label" -v ns="$((end-begin))" -v rc="$rc" 'BEGIN {printf "%s\t%.3f\t%d\n",label,ns/1e9,rc}' | tee -a "$BENCH_ROOT/results/timing.tsv"
            if (( rc != 0 )); then tail -60 "$BENCH_ROOT/results/$label.log"; fi
            return "$rc"
          }
          guard
          measure toolchain rustup toolchain install 1.94.0 --profile minimal
          rustc --version --verbose > "$BENCH_ROOT/results/rustc.txt"
          g++ --version > "$BENCH_ROOT/results/gcc.txt"
          guard
          measure apt-update sudo -n apt-get update
          measure native-package-pins sudo -n apt-get --simulate install g++ clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*' 'libswscale-dev=7:6.1.1-*'
          guard
          measure python-venv python -m venv "$BENCH_ROOT/venv"
          source "$BENCH_ROOT/venv/bin/activate"
          measure python-dependencies python -m pip install pytest==9.0.2 PyYAML==6.0.2 -r tools/jetlink_model/requirements.lock
          python -m pip freeze > "$BENCH_ROOT/results/python-packages.txt"
          guard
          measure cargo-fetch cargo +1.94.0 fetch --manifest-path rust/Cargo.toml --locked
          cat > "$BENCH_ROOT/fast.sh" <<'SH'
          set -euo pipefail
          python -m unittest discover -s tools/ci/tests -v
          python rust/ci/runtime/test_package_policy.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/ci/tests -q tools/ci/tests/test_native_disk_guard.py
          python -m unittest discover -s tools/docs/wiki_settings/tests -p 'test_*.py' -v
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink_model/tests -q tools/jetlink_model/tests
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/modeld/tests -q openpilot/selfdrive/modeld/tests/test_jetlink*.py
          bash -n openpilot/selfdrive/modeld/jetlink/setup_gadget.sh
          SH
          failed=0
          for round in 1 2 3; do
            guard
            measure "fast-$round" bash "$BENCH_ROOT/fast.sh" || failed=1
            guard
            measure "android-$round" bash tools/jetlink_android/gradlew -p tools/jetlink_android :core:test :runtime:test --rerun-tasks --no-daemon || failed=1
            guard
            rm -rf -- "$CARGO_TARGET_DIR"
            if measure "clean-build-$round" cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked --offline -p openpilot-runtime-core -p openpilot-msgq --tests --no-run; then
              measure "native-tests-$round" cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked --offline -p openpilot-runtime-core -p openpilot-msgq --tests || failed=1
              measure "warm-native-tests-$round" cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked --offline -p openpilot-runtime-core -p openpilot-msgq --tests || failed=1
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Publish measured stage times
        if: always() && env.BENCH_ROOT != ''
        shell: bash
        run: |
          {
            echo 'Source: dc95138076836ea3a5c1b6c27262be3f3b912f71; Rust1.94.0; 2 build jobs; incremental disabled.'
            echo 'Fresh Cargo/Python/Gradle caches per runner; clean Rust target each round; warm re-run recorded separately.'
            echo 'FFmpeg pins are APT resolution only. This is not full ARM/AGNOS/release/device validation.'
            echo '```tsv'
            cat "$BENCH_ROOT/results/timing.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.BENCH_ROOT != ''
        with:
          name: runner-comparison-496-${{ matrix.kind }}
          path: ${{ env.BENCH_ROOT }}/results/
          retention-days: 7
      - name: Remove only owned experiment output
        if: always() && env.BENCH_ROOT != ''
        shell: bash
        run: |
          case "$BENCH_ROOT" in /tmp/rc496.*) ;; *) exit 1;; esac
          test "${BENCH_ROOT%/*}" = /tmp
          test ! -L "$BENCH_ROOT"
          test "$(cat "$BENCH_ROOT/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          rm -rf --one-file-system -- "$BENCH_ROOT"
