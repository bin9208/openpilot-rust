name: Self-hosted runner readiness
on:
  push:
    branches: ['codex/feat-404-*']
    paths:
      - '.github/workflows/**'
      - 'docs/naver/self-hosted-runner-404.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Inspect prerequisites without installing anything
        shell: bash
        run: |
          failed=0
          report() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          report "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          . /etc/os-release
          report "OS: $PRETTY_NAME"
          if [ "$ID" != ubuntu ] || [ "$VERSION_ID" != 24.04 ]; then
            report "NOTICE: non-24.04 host; package compatibility must be tested separately."
          fi
          for tool in git curl tar xz unzip zstd python3 rustup cargo gh gcc g++ make pkg-config; do
            if command -v "$tool" >/dev/null 2>&1; then
              report "OK: $tool"
            else
              report "MISSING: $tool"
              failed=1
            fi
          done
          if sudo -n true; then
            report "OK: noninteractive sudo"
          else
            report "MISSING: noninteractive sudo for workflow package installation"
            failed=1
          fi
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          report "Free space in runner temp: $((available / 1024 / 1024)) GiB"
          if [ "$available" -lt $((35 * 1024 * 1024)) ]; then
            report "ERROR: recover at least 35 GiB before starting new builds."
            failed=1
          fi
          if [ -n "${RUNNER_TOOL_CACHE:-}" ] && [ -d "$RUNNER_TOOL_CACHE" ] && [ -w "$RUNNER_TOOL_CACHE" ]; then
            report "OK: writable tool cache"
          else
            report "MISSING: writable RUNNER_TOOL_CACHE (configure AGENT_TOOLSDIRECTORY)"
            failed=1
          fi
          exit "$failed"

  native-packages:
    needs: readiness
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Check current APT repositories against existing build pins
        shell: bash
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge $((35 * 1024 * 1024))
          sudo -n apt-get update
          apt-cache policy clang-18 libclang-18-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          echo 'Checking existing workflow package pins without installing packages.' >> "$GITHUB_STEP_SUMMARY"
          if sudo -n apt-get --simulate install g++ clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*' 'libswscale-dev=7:6.1.1-*'; then
            echo 'PASS: existing native package pins resolve.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FAIL: existing native package pins do not resolve; see APT diagnostics.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  rust-core:
    needs: readiness
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.analysis/scratch/self-hosted-404-core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test existing runtime-core on the actual host
        shell: bash
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge $(((25 + 2) * 1024 * 1024))
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-core --lib
      - name: Remove this probe's compiled output
        if: always()
        shell: bash
        run: rm -rf -- "$CARGO_TARGET_DIR"
