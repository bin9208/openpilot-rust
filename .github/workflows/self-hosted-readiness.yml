name: Complete generic ARM runner comparison498
run-name: Full GNU and musl ARM comparison498 (correct Eigen headers)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: runner-comparison-498-generic-repair
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  CI: '1'
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  OPENPILOT_RUNNER_COMPARISON: '498'
  RUNTIME_SOURCE_SHA: ${{ github.sha }}
  SOURCE_ROOT: ${{ github.workspace }}/runner-comparison-498
jobs:
  generic-arm:
    name: Full generic ARM (${{ matrix.kind }})
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - kind: github-hosted
          labels:
          - ubuntu-24.04
        - kind: self-hosted
          labels:
          - self-hosted
          - Linux
          - X64
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: ${{ github.workspace }}/runner-comparison-498
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: runner-comparison-498
        fetch-depth: 0
        persist-credentials: false
        lfs: false
    - uses: ./runner-comparison-498/.github/actions/job-temp
    - uses: ./runner-comparison-498/.github/actions/rust-path
    - name: Bind source and initialize isolated caches
      run: "set -euo pipefail\nprintf 'BENCH_ROOT=%s\\nCARGO_HOME=%s/cargo\\nCARGO_TARGET_DIR=%s/target\\nPIP_CACHE_DIR=%s/pip-cache\\\
        n' \"$CI_JOB_TEMP\" \"$CI_JOB_TEMP\" \"$CI_JOB_TEMP\" \"$CI_JOB_TEMP\" >> \"$GITHUB_ENV\"\nmkdir -p \"$CI_JOB_TEMP/comparison\"\
        \ngit rev-parse HEAD | tee \"$CI_JOB_TEMP/comparison/SOURCE_COMMIT\"\ntest \"$(git rev-parse HEAD)\" = \"$RUNTIME_SOURCE_SHA\"\
        \nlscpu > \"$CI_JOB_TEMP/comparison/lscpu.txt\"\nfree -b > \"$CI_JOB_TEMP/comparison/memory.txt\"\ndf -h > \"$CI_JOB_TEMP/comparison/disk.txt\"\
        \nprintf '%s\\n' \"$RUNNER_NAME $RUNNER_ENVIRONMENT\" > \"$CI_JOB_TEMP/comparison/runner.txt\"\n\n# Remove only this\
        \ comparison's cancelled prior job output on the persistent host.\nif [ \"$RUNNER_ENVIRONMENT\" = self-hosted ]; then\n\
        \  for prior in /tmp/openpilot-ci.*; do\n    test -d \"$prior\" || continue\n    test ! -L \"$prior\" || continue\n\
        \    test -f \"$prior/owner\" || continue\n    if [ \"$(cat \"$prior/owner\")\" = '39825360851:1:generic-arm' ]; then\n\
        \      rm -rf --one-file-system -- \"$prior\"\n    fi\n  done\nfi\n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install identical cross and host dependencies
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/install-identical-cross-and-host-dependencies.sh" <<''COMPARISON_SHELL''

        sudo -n apt-get -o APT::Architectures::=amd64 update

        sudo -n apt-get install -y g++ g++-aarch64-linux-gnu clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev
        libzmq3-dev qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs nasm make

        sudo -n apt-get install -y ''libavcodec-dev=7:6.1.1-*'' ''libavformat-dev=7:6.1.1-*'' ''libavutil-dev=7:6.1.1-*''

        rustup toolchain install 1.94.0 --profile minimal

        rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu aarch64-unknown-linux-musl

        python -m venv "$BENCH_ROOT/venv"

        printf ''%s\n'' "$BENCH_ROOT/venv/bin" >> "$GITHUB_PATH"

        "$BENCH_ROOT/venv/bin/python" -m pip install ''git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen''

        "$BENCH_ROOT/venv/bin/python" -c ''import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE="
        + eigen.INCLUDE_DIR)'' >> "$GITHUB_ENV"

        # Same compiler executable aliases for the original generic job.

        command -v clang >/dev/null || sudo -n ln -s /usr/bin/clang-18 /usr/local/bin/clang

        command -v clang++ >/dev/null || sudo -n ln -s /usr/bin/clang++-18 /usr/local/bin/clang++

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage install-identical-cross-and-host-dependencies "$BENCH_ROOT/commands/install-identical-cross-and-host-dependencies.sh"

        '
    - name: Stage native GNU aarch64 startup renderer and portable loader headers
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/stage-native-gnu-aarch64-startup-renderer-and-portable-loader-headers.sh" <<''COMPARISON_SHELL''

        sudo dpkg --add-architecture arm64

        sudo apt-get -o Dir::Etc::sourcelist="$PWD/.github/apt/startup-ui-cross.sources" -o Dir::Etc::sourceparts=- update

        sudo apt-get -o Dir::Etc::sourcelist="$PWD/.github/apt/startup-ui-cross.sources" -o Dir::Etc::sourceparts=- install
        -y libegl-dev:arm64 libgles-dev:arm64 libdrm-dev:arm64 libgbm-dev:arm64

        raylib_root="$(mktemp -d "$RUNNER_TEMP/raylib-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")/sdk"

        cargo +1.94.0 run --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" -p openpilot-dev-tools --locked --bin stage-startup-ui-raylib
        -- --arch aarch64 --output "$raylib_root" --shared --cxx aarch64-linux-gnu-g++

        printf ''STARTUP_UI_RAYLIB_ROOT=%s\n'' "$raylib_root" >> "$GITHUB_ENV"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage stage-native-gnu-aarch64-startup-renderer-and-portable-loader-headers
        "$BENCH_ROOT/commands/stage-native-gnu-aarch64-startup-renderer-and-portable-loader-headers.sh"

        '
    - name: Build pinned external FFmpeg for generic aarch64 GNU linking
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-pinned-external-ffmpeg-for-generic-aarch64-gnu-linking.sh" <<''COMPARISON_SHELL''

        rustup toolchain install 1.94.0 --profile minimal

        cargo +1.94.0 run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-loggerd-ffmpeg -- --root
        "$RUNNER_TEMP/logger-ffmpeg-gnu" --cc aarch64-linux-gnu-gcc --ar aarch64-linux-gnu-ar --ranlib aarch64-linux-gnu-ranlib

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-pinned-external-ffmpeg-for-generic-aarch64-gnu-linking
        "$BENCH_ROOT/commands/build-pinned-external-ffmpeg-for-generic-aarch64-gnu-linking.sh"

        '
    - name: Build generic Linux aarch64 artifact (not AGNOS validation)
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-generic-linux-aarch64-artifact-not-agnos-validation.sh" <<''COMPARISON_SHELL''

        rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu

        cargo build --workspace --release --locked --features openpilot-loggerd/static-ffmpeg --target aarch64-unknown-linux-gnu

        file ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/cpu-sample

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-generic-linux-aarch64-artifact-not-agnos-validation
        "$BENCH_ROOT/commands/build-generic-linux-aarch64-artifact-not-agnos-validation.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        FFMPEG_DIR: ${{ env.CI_JOB_TEMP }}/logger-ffmpeg-gnu/install
    - name: Build and inspect native Card for generic Linux aarch64
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-and-inspect-native-card-for-generic-linux-aarch64.sh" <<''COMPARISON_SHELL''

        mkdir -p "$RUNNER_TEMP/card-arm"

        printf ''%s\n'' ''cargo build -p openpilot-card --features native --bins --examples --release --locked --target aarch64-unknown-linux-gnu''
        > "$RUNNER_TEMP/card-arm/command.txt"

        git rev-parse HEAD > "$RUNNER_TEMP/card-arm/SOURCE_COMMIT"

        set -o pipefail

        cargo build -p openpilot-card --features native --bins --examples --release --locked --target aarch64-unknown-linux-gnu
        2>&1 | tee "$RUNNER_TEMP/card-arm/build.log"

        file ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-card > "$RUNNER_TEMP/card-arm/file.txt"

        aarch64-linux-gnu-readelf -h ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-card > "$RUNNER_TEMP/card-arm/elf-header.txt"

        test "$(aarch64-linux-gnu-readelf -h ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-card | sed -n
        ''s/.*Machine: *//p'')" = AArch64

        sha256sum ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-card ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/examples/*_trace
        > "$RUNNER_TEMP/card-arm/SHA256SUMS"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-and-inspect-native-card-for-generic-linux-aarch64
        "$BENCH_ROOT/commands/build-and-inspect-native-card-for-generic-linux-aarch64.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Stage native GNU aarch64 torque dependency (not AGNOS validation)
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/stage-native-gnu-aarch64-torque-dependency-not-agnos-validation.sh" <<''COMPARISON_SHELL''

        python -m pip download --only-binary=:all: --no-deps --platform manylinux_2_27_aarch64 --python-version 312 --abi
        cp312 numpy==2.5.3 --dest "$RUNNER_TEMP/torque-arm-wheels"

        cargo run --locked -p openpilot-dev-tools --bin stage-torque-numerics -- --wheel "$RUNNER_TEMP"/torque-arm-wheels/numpy-2.5.3-*.whl
        --output "$RUNNER_TEMP/torque-arm-numerics"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage stage-native-gnu-aarch64-torque-dependency-not-agnos-validation
        "$BENCH_ROOT/commands/stage-native-gnu-aarch64-torque-dependency-not-agnos-validation.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
    - name: Build and inspect native selfdrived for generic Linux aarch64
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-and-inspect-native-selfdrived-for-generic-linux-aarch64.sh" <<''COMPARISON_SHELL''

        mkdir -p "$RUNNER_TEMP/selfdrived-arm"

        git rev-parse HEAD > "$RUNNER_TEMP/selfdrived-arm/SOURCE_COMMIT"

        printf ''%s\n'' ''cargo build -p openpilot-selfdrived --bins --example controller --example ratekeeper --release --locked
        --target aarch64-unknown-linux-gnu'' > "$RUNNER_TEMP/selfdrived-arm/command.txt"

        set -o pipefail

        cargo build -p openpilot-selfdrived --bins --example controller --example ratekeeper --release --locked --target aarch64-unknown-linux-gnu
        2>&1 | tee "$RUNNER_TEMP/selfdrived-arm/build.log"

        file ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-selfdrived > "$RUNNER_TEMP/selfdrived-arm/file.txt"

        sha256sum ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-selfdrived ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/examples/controller
        ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/examples/ratekeeper > "$RUNNER_TEMP/selfdrived-arm/SHA256SUMS"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-and-inspect-native-selfdrived-for-generic-linux-aarch64
        "$BENCH_ROOT/commands/build-and-inspect-native-selfdrived-for-generic-linux-aarch64.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Build and inspect native navigation for generic Linux aarch64
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-and-inspect-native-navigation-for-generic-linux-aarch64.sh" <<''COMPARISON_SHELL''

        mkdir -p "$RUNNER_TEMP/navd-arm"

        git rev-parse HEAD > "$RUNNER_TEMP/navd-arm/SOURCE_COMMIT"

        printf ''%s\n'' ''cargo build -p openpilot-navd --features native --bins --examples --release --locked --target aarch64-unknown-linux-gnu''
        > "$RUNNER_TEMP/navd-arm/command.txt"

        set -o pipefail

        cargo build -p openpilot-navd --features native --bins --examples --release --locked --target aarch64-unknown-linux-gnu
        2>&1 | tee "$RUNNER_TEMP/navd-arm/build.log"

        file ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-navd ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-set-destination
        > "$RUNNER_TEMP/navd-arm/file.txt"

        sha256sum ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-navd ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-set-destination
        ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/examples/navd_* > "$RUNNER_TEMP/navd-arm/SHA256SUMS"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-and-inspect-native-navigation-for-generic-linux-aarch64
        "$BENCH_ROOT/commands/build-and-inspect-native-navigation-for-generic-linux-aarch64.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Cross-build the original VisionIPC ION boundary (not device execution)
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/cross-build-the-original-visionipc-ion-boundary-not-device-execution.sh" <<''COMPARISON_SHELL''

        cargo build -p openpilot-dmonitoringmodeld --features visionipc-ion --locked --target aarch64-unknown-linux-gnu

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage cross-build-the-original-visionipc-ion-boundary-not-device-execution
        "$BENCH_ROOT/commands/cross-build-the-original-visionipc-ion-boundary-not-device-execution.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Build and inspect the static C3X probe candidate
      run: "mkdir -p \"$BENCH_ROOT/commands\"\ncat > \"$BENCH_ROOT/commands/build-and-inspect-the-static-c3x-probe-candidate.sh\"\
        \ <<'COMPARISON_SHELL'\npython -m pip install cargo-zigbuild==0.23.4 ziglang==0.16.0 pycapnp==2.1.0 Cython==3.2.4\
        \ setuptools==82.0.1 zstandard==0.25.0\nrustup target add --toolchain 1.94.0 aarch64-unknown-linux-musl\ncargo run\
        \ --locked -p openpilot-dev-tools --bin build-loggerd-ffmpeg -- --root \"$RUNNER_TEMP/logger-ffmpeg-musl\" --cc 'python-zig\
        \ cc -target aarch64-linux-musl' --ar 'python-zig ar' --ranlib 'python-zig ranlib'\nFFMPEG_DIR=\"$RUNNER_TEMP/logger-ffmpeg-musl/install\"\
        \ cargo zigbuild --workspace --release --locked --features openpilot-loggerd/static-ffmpeg --target aarch64-unknown-linux-musl\n\
        python tools/build_msgq_python.py --output \"$RUNNER_TEMP/rust-msgq-python\"\nPYTHONPATH=\"$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE\"\
        \ python tools/check_aarch64.py \\\n  --binary ${CARGO_TARGET_DIR}/aarch64-unknown-linux-musl/release/openpilot-proclogd\
        \ \\\n  --runner /usr/bin/qemu-aarch64-static --report \"$RUNNER_TEMP/aarch64-probe.json\"\nmkdir -p ${CARGO_TARGET_DIR}/c3x-probe\n\
        cp ${CARGO_TARGET_DIR}/aarch64-unknown-linux-musl/release/openpilot-proclogd ${CARGO_TARGET_DIR}/c3x-probe/\ngit rev-parse\
        \ HEAD > ${CARGO_TARGET_DIR}/c3x-probe/SOURCE_COMMIT\ncp \"$RUNNER_TEMP/aarch64-probe.json\" ${CARGO_TARGET_DIR}/c3x-probe/\n\
        cd ${CARGO_TARGET_DIR}/c3x-probe\nsha256sum openpilot-proclogd SOURCE_COMMIT aarch64-probe.json > SHA256SUMS\nCOMPARISON_SHELL\n\
        python3 \"$SOURCE_ROOT/tools/ci/runner_comparison_498.py\" stage build-and-inspect-the-static-c3x-probe-candidate\
        \ \"$BENCH_ROOT/commands/build-and-inspect-the-static-c3x-probe-candidate.sh\"\n"
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
    - name: Build native Panda for generic Linux aarch64
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-native-panda-for-generic-linux-aarch64.sh" <<''COMPARISON_SHELL''

        mkdir -p "$RUNNER_TEMP/panda-arm"

        git rev-parse HEAD > "$RUNNER_TEMP/panda-arm/SOURCE_COMMIT"

        set -o pipefail

        cargo build -p openpilot-pandad -p openpilot-panda-usb -p openpilot-panda-spi -p openpilot-panda-spi-linux --bins
        --examples --release --locked --target aarch64-unknown-linux-gnu 2>&1 | tee "$RUNNER_TEMP/panda-arm/build.log"

        file ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-pandad ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-pandad-supervisor
        > "$RUNNER_TEMP/panda-arm/file.txt"

        sha256sum ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-pandad ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-pandad-supervisor
        > "$RUNNER_TEMP/panda-arm/SHA256SUMS"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-native-panda-for-generic-linux-aarch64 "$BENCH_ROOT/commands/build-native-panda-for-generic-linux-aarch64.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Build generic and ION camera aarch64 artifacts
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/build-generic-and-ion-camera-aarch64-artifacts.sh" <<''COMPARISON_SHELL''

        mkdir -p "$RUNNER_TEMP/camera-arm/generic" "$RUNNER_TEMP/camera-arm/ion"

        git rev-parse HEAD > "$RUNNER_TEMP/camera-arm/SOURCE_COMMIT"

        set -o pipefail

        cargo build -p openpilot-camerad-runtime --features native-skip-miri --bin openpilot-camerad --release --locked --target
        aarch64-unknown-linux-gnu 2>&1 | tee "$RUNNER_TEMP/camera-arm/generic/build.log"

        cp ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-camerad "$RUNNER_TEMP/camera-arm/generic/"

        cargo build -p openpilot-camerad-runtime --features visionipc-ion --bin openpilot-camerad --release --locked --target
        aarch64-unknown-linux-gnu 2>&1 | tee "$RUNNER_TEMP/camera-arm/ion/build.log"

        cp ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-camerad "$RUNNER_TEMP/camera-arm/ion/"

        file "$RUNNER_TEMP"/camera-arm/{generic,ion}/openpilot-camerad > "$RUNNER_TEMP/camera-arm/file.txt"

        sha256sum "$RUNNER_TEMP"/camera-arm/{generic,ion}/openpilot-camerad > "$RUNNER_TEMP/camera-arm/SHA256SUMS"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage build-generic-and-ion-camera-aarch64-artifacts "$BENCH_ROOT/commands/build-generic-and-ion-camera-aarch64-artifacts.sh"

        '
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Stage exact source-pinned native ARM codec packages
      run: 'mkdir -p "$BENCH_ROOT/commands"

        cat > "$BENCH_ROOT/commands/stage-exact-source-pinned-native-arm-codec-packages.sh" <<''COMPARISON_SHELL''

        cargo run --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --bin stage-encoder-target -- --root "$GITHUB_WORKSPACE"
        --output "$RUNNER_TEMP/encoder-arm/dependencies"

        printf ''ENCODER_ARM_FFMPEG=%s/encoder-arm/dependencies/ffmpeg/install\nENCODER_ARM_LIBYUV=%s/encoder-arm/dependencies/libyuv/install/lib\n''
        "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        COMPARISON_SHELL

        python3 "$SOURCE_ROOT/tools/ci/runner_comparison_498.py" stage stage-exact-source-pinned-native-arm-codec-packages
        "$BENCH_ROOT/commands/stage-exact-source-pinned-native-arm-codec-packages.sh"

        '
    - name: Build encoder daemon and probes with pinned ARM codecs and ION
      run: "mkdir -p \"$BENCH_ROOT/commands\"\ncat > \"$BENCH_ROOT/commands/build-encoder-daemon-and-probes-with-pinned-arm-codecs-and-ion.sh\"\
        \ <<'COMPARISON_SHELL'\ngit rev-parse HEAD > \"$RUNNER_TEMP/encoder-arm/SOURCE_COMMIT\"\nset -o pipefail\ncargo build\
        \ -p openpilot-encoderd --features static-ffmpeg,visionipc-ion --bins --examples --release --locked --target aarch64-unknown-linux-gnu\
        \ --message-format=json 2> \"$RUNNER_TEMP/encoder-arm/build.log\" | tee \"$RUNNER_TEMP/encoder-arm/build.jsonl\"\n\
        for encoder_binary in ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-encoderd ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/examples/encoder_codec_trace\
        \ ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/examples/encoder_v4l_trace; do\n  aarch64-linux-gnu-readelf\
        \ -h -d -V \"$encoder_binary\" > \"$RUNNER_TEMP/encoder-arm/$(basename \"$encoder_binary\").readelf.txt\"\n  sha256sum\
        \ \"$encoder_binary\" >> \"$RUNNER_TEMP/encoder-arm/SHA256SUMS\"\ndone\nCOMPARISON_SHELL\npython3 \"$SOURCE_ROOT/tools/ci/runner_comparison_498.py\"\
        \ stage build-encoder-daemon-and-probes-with-pinned-arm-codecs-and-ion \"$BENCH_ROOT/commands/build-encoder-daemon-and-probes-with-pinned-arm-codecs-and-ion.sh\"\
        \n"
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        BINDGEN_EXTRA_CLANG_ARGS: --target=aarch64-linux-gnu -I/usr/aarch64-linux-gnu/include
        FFMPEG_DIR: ${{ env.ENCODER_ARM_FFMPEG }}
        ENCODER_LIBYUV_LIB: ${{ env.ENCODER_ARM_LIBYUV }}
        ENCODER_FFMPEG_EXTRA_LIBS: swresample,x264,z,va,va-drm,drm,gcc
    - name: Build generic and ION UI aarch64 artifacts
      run: "mkdir -p \"$BENCH_ROOT/commands\"\ncat > \"$BENCH_ROOT/commands/build-generic-and-ion-ui-aarch64-artifacts.sh\"\
        \ <<'COMPARISON_SHELL'\nmkdir -p \"$RUNNER_TEMP/ui-arm/generic\" \"$RUNNER_TEMP/ui-arm/ion\"\ngit rev-parse HEAD >\
        \ \"$RUNNER_TEMP/ui-arm/SOURCE_COMMIT\"\nset -o pipefail\ncargo build -p openpilot-ui-application --bin openpilot-ui\
        \ --release --locked --target aarch64-unknown-linux-gnu 2>&1 | tee \"$RUNNER_TEMP/ui-arm/generic/build.log\"\ncp ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-ui\
        \ \"$RUNNER_TEMP/ui-arm/generic/\"\ncargo build -p openpilot-ui-application --features openpilot-msgq/visionipc-ion\
        \ --bin openpilot-ui --release --locked --target aarch64-unknown-linux-gnu 2>&1 | tee \"$RUNNER_TEMP/ui-arm/ion/build.log\"\
        \ncp ${CARGO_TARGET_DIR}/aarch64-unknown-linux-gnu/release/openpilot-ui \"$RUNNER_TEMP/ui-arm/ion/\"\ncp \"$STARTUP_UI_RAYLIB_ROOT/lib/libopenpilot-raylib.so\"\
        \ \"$STARTUP_UI_RAYLIB_ROOT/plugin-build.json\" \"$RUNNER_TEMP/ui-arm/\"\nfor ui_artifact in \"$RUNNER_TEMP\"/ui-arm/{generic,ion}/openpilot-ui\
        \ \"$RUNNER_TEMP/ui-arm/libopenpilot-raylib.so\"; do\n  aarch64-linux-gnu-readelf -h -d -V \"$ui_artifact\" > \"$ui_artifact.readelf.txt\"\
        \n  test \"$(aarch64-linux-gnu-readelf -h \"$ui_artifact\" | sed -n 's/.*Machine: *//p')\" = AArch64\ndone\nsha256sum\
        \ \"$RUNNER_TEMP\"/ui-arm/{generic,ion}/openpilot-ui \"$RUNNER_TEMP/ui-arm/libopenpilot-raylib.so\" > \"$RUNNER_TEMP/ui-arm/SHA256SUMS\"\
        \nCOMPARISON_SHELL\npython3 \"$SOURCE_ROOT/tools/ci/runner_comparison_498.py\" stage build-generic-and-ion-ui-aarch64-artifacts\
        \ \"$BENCH_ROOT/commands/build-generic-and-ion-ui-aarch64-artifacts.sh\"\n"
      working-directory: ${{ github.workspace }}/runner-comparison-498/rust
      env:
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    - name: Write stage summary and preserve resource evidence
      if: always()
      run: "if [ -z \"${BENCH_ROOT:-}\" ]; then exit 0; fi\nfree -b > \"$BENCH_ROOT/comparison/memory-after.txt\"\ndf -h >\
        \ \"$BENCH_ROOT/comparison/disk-after.txt\"\nif [ -r /sys/fs/cgroup/memory.events ]; then cp /sys/fs/cgroup/memory.events\
        \ \"$BENCH_ROOT/comparison/memory-events-after.txt\"; fi\nif [ -f \"$BENCH_ROOT/comparison/timing.jsonl\" ]; then\n\
        \  python3 - <<'SUMMARY'\nimport json, os\nfrom pathlib import Path\nroot=Path(os.environ['BENCH_ROOT'])/'comparison'\n\
        rows=[json.loads(line) for line in (root/'timing.jsonl').read_text().splitlines()]\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as f:\n f.write('| Stage | Seconds | Exit |\\n|---|---:|---:|\\n')\n for r in rows:f.write(f\"| {r['stage']} | {r['seconds']}\
        \ | {r['exit_code']} |\\n\")\nSUMMARY\nfi\n"
    - uses: actions/upload-artifact@v4
      if: always() && env.BENCH_ROOT != ''
      with:
        name: comparison498-generic-arm-${{ matrix.kind }}
        path: '${{ env.BENCH_ROOT }}/comparison/

          ${{ env.BENCH_ROOT }}/agnos-runtime/elf.json

          ${{ env.BENCH_ROOT }}/agnos-runtime/installer-build.json

          ${{ env.BENCH_ROOT }}/agnos-runtime/offline-install.json

          ${{ env.BENCH_ROOT }}/agnos-runtime/source-policy.json

          ${{ env.BENCH_ROOT }}/agnos-runtime/opencv/*.json

          ${{ env.BENCH_ROOT }}/agnos-runtime/opencv/*.log

          ${{ env.BENCH_ROOT }}/agnos-runtime/release/runtime-release.json

          ${{ env.BENCH_ROOT }}/logger-ffmpeg-gnu/*.log

          ${{ env.BENCH_ROOT }}/logger-ffmpeg-gnu/**/config.log

          ${{ env.BENCH_ROOT }}/logger-ffmpeg-musl/*.log

          ${{ env.BENCH_ROOT }}/logger-ffmpeg-musl/**/config.log

          ${{ env.BENCH_ROOT }}/encoder-arm/*.log

          ${{ env.BENCH_ROOT }}/agnos-runtime/opencv-smoke/*.log

          ${{ env.BENCH_ROOT }}/agnos-runtime/sysroot-extract.log

          '
        retention-days: 7
    - uses: ./runner-comparison-498/.github/actions/job-temp
      if: always()
      with:
        cleanup: 'true'
