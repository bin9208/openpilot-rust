name: Runner comparison disk recovery 496
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Remove diagnosed inactive ignored Rust target only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$GITHUB_WORKSPACE" = /home/actions/actions-runner/_work/openpilot-rust/openpilot-rust
          test ! -L rust/target
          test -z "$(git ls-files -- rust/target)"
          git check-ignore -q rust/target/
          if pgrep -u "$(id -u)" -x 'cargo|rustc|cc1|cc1plus'; then
            echo 'Compiler is active; refusing to remove shared target.' >&2
            exit 1
          fi
          git status --short
          du -sh rust/target
          rm -rf --one-file-system -- rust/target
          git status --short
          df -h / "$RUNNER_TEMP"
          available=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)
          test "$available" -ge $((35 * 1024 * 1024 * 1024))
