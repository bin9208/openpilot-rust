name: 296 route upload lifecycle and fresh two-root proof R7
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/route-upload-lifecycle-r7-296-once.yml
  workflow_dispatch:
    inputs:
      two_root:
        description: Run fresh same-source two-root original/native and temporary source-absence proof after focused gates
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  route-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: 3f60fdc355b6b34fda13cb28b796ec3d18bed5db
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Initialize external recipe and evidence paths
      shell: bash
      run: 'set -euo pipefail

        umask 077

        focused="$RUNNER_TEMP/route-upload-r7-focused"

        recipe="$RUNNER_TEMP/route-upload-r7-recipe"

        artifacts="$RUNNER_TEMP/route-upload-r7-artifacts"

        mkdir -p "$focused" "$recipe" "$artifacts"

        printf ''ROUTE_UPLOAD_RECIPE=%s

        ROUTE_UPLOAD_EVIDENCE=%s

        ROUTE_UPLOAD_ARTIFACTS=%s

        CARGO_TARGET_DIR=%s

        '' "$recipe" "$focused" "$artifacts" "$GITHUB_WORKSPACE/rust/target" >> "$GITHUB_ENV"

        '
    - uses: actions/checkout@v7
      with:
        ref: 3f60fdc355b6b34fda13cb28b796ec3d18bed5db
        persist-credentials: false
        fetch-depth: 1
    - name: Pin source, preserve original pins and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''source=%s

        workflow_commit=%s

        workflow_source=%s

        workflow_ref=%s

        run=%s

        attempt=%s

        '' "$EXPECTED_SOURCE" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > "$ROUTE_UPLOAD_EVIDENCE/exact-source.txt"

        cat > "$ROUTE_UPLOAD_EVIDENCE/original-source-sha256.txt" <<''PINS''

        f6fed39ccc8c4d478e6ccf36653533399c487025fa481a1bd63215d35f62de8f  rust/tools/check_manager_log_upload.py

        78286f012b2ec953345acfc59352412922cecc3c70ae642d15e41b70031d1b0d  rust/tools/check_runtime_log_upload.py

        b90a41b13ed1a9a99e23c771feaea3ad97ff9999c394e309e9d714f69f10a291  rust/tools/check_uploader.py

        PINS

        sha256sum --check --strict "$ROUTE_UPLOAD_EVIDENCE/original-source-sha256.txt"

        git diff --exit-code HEAD -- > "$ROUTE_UPLOAD_EVIDENCE/source-before.diff"

        # Disposable hosted preinstalled SDKs only; no source/cache/artifact reuse.

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        lscpu --json > "$ROUTE_UPLOAD_EVIDENCE/lscpu.json"

        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$ROUTE_UPLOAD_EVIDENCE/disk-before.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Install pinned R2 build and independent ordinary-oracle prerequisites
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev pkg-config capnproto libcapnp-dev libavcodec-dev
        libavformat-dev libavutil-dev libzstd-dev libzmq3-dev strace

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        python -m pip install --no-cache-dir pycapnp==2.1.0 zstandard==0.25.0 requests==2.34.2 PyJWT==2.14.0 cryptography==50.0.1

        selected_python="$(command -v python3)"

        printf ''ROUTE_UPLOAD_PYTHON=%s

        '' "$selected_python" >> "$GITHUB_ENV"

        "$selected_python" --version > "$ROUTE_UPLOAD_EVIDENCE/python.txt"

        "$selected_python" -m pip freeze > "$ROUTE_UPLOAD_EVIDENCE/pip.txt"

        rustc +1.94.0 -Vv > "$ROUTE_UPLOAD_EVIDENCE/rustc.txt"

        "$selected_python" - <<''IMPORTS''

        import capnp,zstandard,requests,jwt,cryptography

        IMPORTS

        '
    - name: 'Stage exact R7 payload: focused-hosted.sh'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/focused-hosted.sh"

        printf ''148b12c3af6eb8f5ccf9937b3a76ead3d7416d653ec8c6701f3b7c9e81435896  %s/focused-hosted.sh\n'' "$ROUTE_UPLOAD_RECIPE"
        | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: route-upload-compare.py'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/route-upload-compare.py"

        printf ''e52480dcde6cb9d75cfc916d24d8d0d363399b381d7767b8a138ef81f8ca84a8  %s/route-upload-compare.py\n'' "$ROUTE_UPLOAD_RECIPE"
        | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: route-upload-exec-audit-v2.py'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/route-upload-exec-audit-v2.py"

        printf ''1ef589925ba191ee31ea9774c351789eb26c00081ddd09d4a15aab800c515e60  %s/route-upload-exec-audit-v2.py\n'' "$ROUTE_UPLOAD_RECIPE"
        | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: route-upload-held.py'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/route-upload-held.py"

        printf ''eab17f34cde8dd9f2c5dcfa044edd0c480d5883909f18f1008b4fd3f729d468e  %s/route-upload-held.py\n'' "$ROUTE_UPLOAD_RECIPE"
        | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: route-upload-negative-cli.py'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/route-upload-negative-cli.py"

        printf ''7a35a417f5a794b6e0dbc414df0d25453362c884ad4723ef5f2fce6f278d5458  %s/route-upload-negative-cli.py\n'' "$ROUTE_UPLOAD_RECIPE"
        | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: route-upload-original-capture.py'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/route-upload-original-capture.py"

        printf ''cb9dde3f84eadc19abfce185c8e60a0601f9d82b95c2563d9019fbd0c1c7cec6  %s/route-upload-original-capture.py\n''
        "$ROUTE_UPLOAD_RECIPE" | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: route-upload-two-root-absence.py'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/route-upload-two-root-absence.py"

        printf ''deb706def5cd16f513534fd6132969515acce4892dc0d0ea948e9d13eb1ae10b  %s/route-upload-two-root-absence.py\n''
        "$ROUTE_UPLOAD_RECIPE" | sha256sum --check --strict

        '
    - name: 'Stage exact R7 payload: two-root-hosted.sh'
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode > "$ROUTE_UPLOAD_RECIPE/two-root-hosted.sh"

        printf ''0ee0b1c57fbb892d5a9b94b8de5dcb5d50f0b6e0cf323d0d230c5048c823e929  %s/two-root-hosted.sh\n'' "$ROUTE_UPLOAD_RECIPE"
        | sha256sum --check --strict

        '
    - name: Verify complete staged recipe closure
      shell: bash
      run: "set -euo pipefail\nprintf '%s' ''\
        \ | base64 --decode > \"$ROUTE_UPLOAD_RECIPE/payload-sha256.json\"\n\"$ROUTE_UPLOAD_PYTHON\" - \"$ROUTE_UPLOAD_RECIPE\"\
        \ <<'PAYLOADS'\nimport ast,hashlib,json,sys\nfrom pathlib import Path\nroot=Path(sys.argv[1]); manifest=json.loads((root/'payload-sha256.json').read_text())\n\
        assert len(manifest)==8\nfor name, expected in manifest.items():\n data=(root/name).read_bytes()\n assert len(data)==expected['bytes']\
        \ and hashlib.sha256(data).hexdigest()==expected['sha256'], name\n if name.endswith('.py'): ast.parse(data,filename=name)\n\
        print('All eight external R7 payloads match the embedded manifest')\nPAYLOADS\nbash -n \"$ROUTE_UPLOAD_RECIPE/focused-hosted.sh\"\
        \nbash -n \"$ROUTE_UPLOAD_RECIPE/two-root-hosted.sh\"\n"
    - name: Focused route and affected-provider strict Clippy, units and actual lifecycle gates
      id: focused
      timeout-minutes: 35
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        set +e

        bash "$ROUTE_UPLOAD_RECIPE/focused-hosted.sh" 2>&1 | tee "$ROUTE_UPLOAD_EVIDENCE/focused.log"

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s

        '' "$status" > "$ROUTE_UPLOAD_EVIDENCE/focused.status"

        test "$status" -eq 0

        '
    - name: Fresh original and native two-root traffic, then temporary source absence
      id: two_root
      if: ${{ success() && steps.focused.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.two_root)
        }}
      timeout-minutes: 20
      shell: bash
      run: 'set -euo pipefail

        # Includes native build outputs already present: no duplicated target/cache tree.

        # Reserve eight GiB for tracked private checkout + all independent traffic data.

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 8192

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        set +e

        bash "$ROUTE_UPLOAD_RECIPE/two-root-hosted.sh" 2>&1 | tee "$ROUTE_UPLOAD_EVIDENCE/two-root.log"

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s

        '' "$status" > "$ROUTE_UPLOAD_EVIDENCE/two-root.status"

        test "$status" -eq 0

        '
    - name: Always verify ordinary sources restored and record source cleanliness
      id: restored
      if: ${{ always() }}
      shell: bash
      run: "set -euo pipefail\nif test -f \"$ROUTE_UPLOAD_EVIDENCE/original-source-sha256.txt\"; then\n  sha256sum --check\
        \ --strict \"$ROUTE_UPLOAD_EVIDENCE/original-source-sha256.txt\" > \"$ROUTE_UPLOAD_EVIDENCE/original-source-after.txt\"\
        \n  git diff --exit-code HEAD -- > \"$ROUTE_UPLOAD_EVIDENCE/source-after.diff\"\nfi\ndf -B1 \"$GITHUB_WORKSPACE\"\
        \ \"$RUNNER_TEMP\" > \"$ROUTE_UPLOAD_EVIDENCE/disk-after.txt\"\n"
    - name: Always stage bounded evidence without private checkouts or caches
      id: bundle
      if: ${{ always() }}
      env:
        FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
        TWO_ROOT_OUTCOME: ${{ steps.two_root.outcome }}
        RESTORE_OUTCOME: ${{ steps.restored.outcome }}
      shell: bash
      run: "set -euo pipefail\n# Copy proof data only. No target/cache trees, private checkout, copied manager\n# ELFs or\
        \ synthetic signing-key homes are uploaded. Every omission is recorded.\nif test -f \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        ; then\n  \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 512\nfi\n\"${ROUTE_UPLOAD_PYTHON:-/usr/bin/python3}\"\
        \ - <<'BUNDLE'\nimport hashlib,json,os,shutil,stat\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']);\
        \ destination=Path(os.environ['ROUTE_UPLOAD_ARTIFACTS'])\nroots=[base/'route-upload-r7-focused',base/'route-upload-r7-two-root',base/'route-upload-r7-recipe']\n\
        maximum=256*1024*1024; per_file=32*1024*1024; used=0; rows=[]; failures=[]\nexcluded={'bin','home','.git','target','__pycache__'}\n\
        for root in roots:\n if not root.exists(): continue\n for directory,children,files in os.walk(root,followlinks=False):\n\
        \  here=Path(directory)\n  for name in list(children):\n   path=here/name\n   if name in excluded or path.is_symlink():\n\
        \    children.remove(name)\n    rows.append({'path':str(path.relative_to(base)),'excluded_directory_or_symlink':True})\n\
        \  for name in files:\n   source=here/name; relative=source.relative_to(base); metadata=source.lstat()\n   if not\
        \ stat.S_ISREG(metadata.st_mode):\n    rows.append({'path':str(relative),'excluded_nonregular':True}); continue\n\
        \   if metadata.st_size>per_file or used+metadata.st_size>maximum:\n    failures.append({'path':str(relative),'bytes':metadata.st_size,'error':'bounded\
        \ evidence budget exceeded'})\n    continue\n   target=destination/relative; target.parent.mkdir(parents=True,exist_ok=True)\n\
        \   shutil.copyfile(source,target)\n   after=source.stat(); copied=target.stat()\n   if (metadata.st_dev,metadata.st_ino,metadata.st_size,metadata.st_mtime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns)\
        \ or copied.st_size!=metadata.st_size:\n    failures.append({'path':str(relative),'error':'proof file changed during\
        \ bounded copy'})\n   with target.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()\n\
        \   used+=copied.st_size; rows.append({'path':str(relative),'bytes':copied.st_size,'sha256':digest})\nreport={'source':os.environ['EXPECTED_SOURCE'],'workflow':os.environ.get('GITHUB_WORKFLOW_SHA'),'run':os.environ.get('GITHUB_RUN_ID'),'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'focused_outcome':os.environ.get('FOCUSED_OUTCOME'),'two_root_outcome':os.environ.get('TWO_ROOT_OUTCOME'),'restore_outcome':os.environ.get('RESTORE_OUTCOME'),'copied_bytes':used,'max_bytes':maximum,'per_file_max_bytes':per_file,'files':rows,'failures':failures,'scope':'candidate\
        \ hosted evidence; originals retained; no device or retirement acceptance'}\n(destination/'bounded-artifact-manifest.json').write_text(json.dumps(report,indent=2)+'\\\
        n')\nif failures: raise SystemExit('Evidence packaging incomplete; inspect bounded-artifact-manifest.json')\nBUNDLE\n"
    - name: Always upload bounded diagnostic and proof artifacts
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: 296-route-upload-lifecycle-r7-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 14
        if-no-files-found: warn
        compression-level: 6
        include-hidden-files: true
        path: ${{ env.ROUTE_UPLOAD_ARTIFACTS }}/
