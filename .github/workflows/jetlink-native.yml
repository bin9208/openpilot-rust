name: Jetlink native fast checks
on:
  push:
    branches: ['codex/fix-402-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jetlink-native-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Jetlink power policy fast checks
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: jetlink-power-policy
      - name: Focused policy and CPU-bound regressions
        run: |
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-core --test jetlink_power
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-jetlink --bin jetlinkd-rs
          cargo +1.94.0 check --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-launcher
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib publish::policy_tests
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-jetlink --example usb_policy_probe
          python3 tools/check_jetlink_usb_policy.py rust/target/debug/examples/usb_policy_probe "$RUNNER_TEMP/jetlink-upstream"
