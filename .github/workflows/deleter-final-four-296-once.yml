name: 296 final four deleter helper absence and native caller proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/deleter-final-four-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 1d570b3459dae783da8bf021bb7bde87368e607a
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 1d570b3459dae783da8bf021bb7bde87368e607a
        persist-credentials: false
    - name: Reserve capacity and record exact source
      shell: bash
      run: 'set -euo pipefail

        export DELETER_BASE="$RUNNER_TEMP/deleter-final-four-296"

        printf ''DELETER_BASE=%s\n'' "$DELETER_BASE" >> "$GITHUB_ENV"

        mkdir "$DELETER_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$DELETER_BASE/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5 strace

        rustc +1.94.0 -Vv > "$DELETER_BASE/rust-provider.txt"

        git status --porcelain=v1 > "$DELETER_BASE/source-status.before.txt"

        '
    - name: Authenticate accepted native baseline and closed four-source absence
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 64

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12437510258 > "$DELETER_BASE/accepted-artifact-metadata.json"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12437510258/zip > "$DELETER_BASE/accepted-native.zip"

        base64 --decode <<''ABSENCE'' > "$DELETER_BASE/four-source-absence.py"

        

        ABSENCE

        printf ''5b03fc50faee81d5a6354e9112621c072c05ff312ab5bdb3be6450509c25db8e  %s/four-source-absence.py\n'' "$DELETER_BASE"
        | sha256sum --check --strict

        python3 "$DELETER_BASE/four-source-absence.py" --root "$GITHUB_WORKSPACE" --native-proof "$DELETER_BASE/accepted-native.zip"
        --native-artifact-metadata "$DELETER_BASE/accepted-artifact-metadata.json" --output "$DELETER_BASE/absence.before.json"

        python3 - <<''INERT''

        from pathlib import Path

        import os,zipfile

        base=Path(os.environ[''DELETER_BASE''])

        with zipfile.ZipFile(base/''accepted-native.zip'') as z:(base/''original.zip'').write_bytes(z.read(''original.zip''))

        INERT

        base64 --decode <<''INERT'' > "$DELETER_BASE/hosted_final_four_deleter.py"

        

        INERT

        printf ''665dcc8a8a59ba318185610206d583f369158d40a752c573142f7ff1bfddac3a  %s/hosted_final_four_deleter.py\n'' "$DELETER_BASE"
        | sha256sum --check --strict

        python3 "$DELETER_BASE/hosted_final_four_deleter.py" admit

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build native providers and strict controller checks
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-deleter --bin openpilot-deleter --example
        deleter_trace > "$DELETER_BASE/providers-build.stdout" 2> "$DELETER_BASE/providers-build.stderr"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        deleter-check-native --bin check-deleter > "$DELETER_BASE/controller-build.stdout" 2> "$DELETER_BASE/controller-build.stderr"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        deleter-check-native --lib --bin check-deleter --test deleter_check --test ci_rust_isolation --test ci_disk_bootstrap
        --test timed_ci -- -D warnings > "$DELETER_BASE/clippy.stdout" 2> "$DELETER_BASE/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        deleter-check-native --test deleter_check --no-run --message-format=json > "$DELETER_BASE/tests-build.jsonl" 2> "$DELETER_BASE/tests-build.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        deleter-check-native --lib --no-run --message-format=json > "$DELETER_BASE/lib-build.jsonl" 2> "$DELETER_BASE/lib-build.stderr"

        cargo +1.94.0 check --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --lib >
        "$DELETER_BASE/no-default.stdout" 2> "$DELETER_BASE/no-default.stderr"

        python3 "$DELETER_BASE/hosted_final_four_deleter.py" discover

        '
    - name: Run current native scopes, ownership and complete caller policies after source deletion
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        mkdir "$DELETER_BASE/native-path"

        ln -s /usr/bin/git "$DELETER_BASE/native-path/git"

        export OPENPILOT_RUST_ROOT="$GITHUB_WORKSPACE"

        export DELETER_CHECKER="$GITHUB_WORKSPACE/rust/target/debug/check-deleter"

        export DELETER_BINARY="$GITHUB_WORKSPACE/rust/target/debug/openpilot-deleter"

        export DELETER_TRACE="$GITHUB_WORKSPACE/rust/target/debug/examples/deleter_trace"

        export DELETER_ORIGINAL_FIXTURE="$DELETER_BASE/source-observations.json"

        export DELETER_ORIGINAL_SHA256=b4e652323459d74d54acbd3cf05eb8ae0a1f543033686d039928f63c530f6a64

        export DELETER_PROOF="$DELETER_BASE/runtime"

        # The root tracer retains the runner uid for permission cases and can trace the

        # explicitly elevated mount child without suppressing sudo''s setuid transition.

        sudo -n /usr/bin/timeout --signal=TERM --kill-after=20s 150s /usr/bin/strace -f -u "$(id -un)" -e trace=execve,execveat
        -s 4096 -o "$DELETER_BASE/native.execve" /usr/bin/env OPENPILOT_RUST_ROOT="$OPENPILOT_RUST_ROOT" DELETER_CHECKER="$DELETER_CHECKER"
        DELETER_BINARY="$DELETER_BINARY" DELETER_TRACE="$DELETER_TRACE" DELETER_ORIGINAL_FIXTURE="$DELETER_ORIGINAL_FIXTURE"
        DELETER_ORIGINAL_SHA256="$DELETER_ORIGINAL_SHA256" DELETER_PROOF="$DELETER_PROOF" PATH="$DELETER_BASE/native-path"
        "$DELETER_TEST_EXE" --test-threads=1 --nocapture > "$DELETER_BASE/native.stdout" 2> "$DELETER_BASE/native.stderr"

        sudo -n /usr/bin/timeout --signal=TERM --kill-after=10s 30s /usr/bin/strace -f -u "$(id -un)" -e trace=execve,execveat
        -s 4096 -o "$DELETER_BASE/ownership.execve" "$DELETER_LIB_EXE" deleter_check:: --test-threads=1 --nocapture > "$DELETER_BASE/ownership.stdout"
        2> "$DELETER_BASE/ownership.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        deleter-check-native --test ci_rust_isolation --test ci_disk_bootstrap --test timed_ci -- --test-threads=1 > "$DELETER_BASE/policy.stdout"
        2> "$DELETER_BASE/policy.stderr"

        python3 "$DELETER_BASE/four-source-absence.py" --root "$GITHUB_WORKSPACE" --native-proof "$DELETER_BASE/accepted-native.zip"
        --native-artifact-metadata "$DELETER_BASE/accepted-artifact-metadata.json" --output "$DELETER_BASE/absence.after.json"

        git status --porcelain=v1 > "$DELETER_BASE/source-status.after.txt"

        cmp "$DELETER_BASE/source-status.before.txt" "$DELETER_BASE/source-status.after.txt"

        python3 "$DELETER_BASE/hosted_final_four_deleter.py" finish

        du -sm "$DELETER_BASE" > "$DELETER_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$DELETER_BASE/artifact-size-mib.txt")" -le 64

        '
    - name: Preserve current source retirement and actual native evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: deleter-final-four-296
        path: ${{ runner.temp }}/deleter-final-four-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
