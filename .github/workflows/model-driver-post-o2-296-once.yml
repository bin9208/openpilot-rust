name: 296 unchanged actual-target LLVM post-O2 capture diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-post-o2-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  post-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
      DIAGNOSTIC_ATTEMPT: 20261022-driver-post-o2-01
      DEV: CPU:LLVM
      LLVMOPT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
        persist-credentials: false
    - name: Record natural host and skip non-recorded CPU before dependencies
      id: cpu
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-post-o2\"\nmkdir \"$proof\"\ntest \"$(git rev-parse HEAD)\" = \"\
        $EXPECTED_SOURCE\"\nlscpu --json > \"$proof/lscpu.json\"\ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nuname -a\
        \ > \"$proof/uname.txt\"\ngit rev-parse HEAD > \"$proof/source.txt\"\nrun=false\nstatus=SKIPPED_NOT_RECORDED_9V45_HOST\n\
        if grep -Eq '^model name[[:space:]]*: AMD EPYC 9V45([[:space:]]|$)' /proc/cpuinfo; then\n run=true\n status=ELIGIBLE_9V45_CANDIDATE_NOT_YET_LLVM_TARGET_ADMITTED\n\
        fi\nprintf 'run=%s\\n' \"$run\" >> \"$GITHUB_OUTPUT\"\nprintf '{\"status\":\"%s\",\"diagnostic_only\":true,\"compilation_executed\"\
        :false,\"interpretation_allowed\":false,\"retirement_acceptance\":false}\\n' \"$status\" > \"$proof/preflight-result.json\"\
        \n"
    - uses: actions/setup-python@v6
      if: success() && steps.cpu.outputs.run == 'true'
      with:
        python-version: 3.12.15
    - name: Prepare pinned LLVM provider and immutable paired evidence
      id: prepare
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-post-o2"

        avail=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1)

        test "$avail" -ge 28991029248

        mkdir "$proof/downloads"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang binutils jq

        python -m pip install numpy==2.5.3 zstandard==0.25.0

        python -m pip freeze > "$proof/providers.before.txt"

        curl --fail --location --retry 3 --max-time 180 -o "$proof/downloads/llvm18.deb" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb

        printf ''af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/downloads/llvm18.deb\n'' "$proof" |
        sha256sum --check --strict

        dpkg-deb --extract "$proof/downloads/llvm18.deb" "$proof/downloads/llvm"

        printf ''5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\n''
        "$proof" | sha256sum --check --strict

        printf ''LLVM_PATH=%s/downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\n'' "$proof" >> "$GITHUB_ENV"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12398000737 --jq ''{id,size_in_bytes,digest,workflow_run}''
        > "$proof/input-artifact-api.json"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12398000737/zip > "$proof/downloads/12398000737.zip"

        printf ''b347a0972c7a34ff1e8c08d287208771f196b1260424a40b946c7100ecb9fd26  %s/downloads/12398000737.zip\n'' "$proof"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$proof/capture.py"

        printf ''f854a82583d20f58bd62f5d283a1831642bfdf350a209418a99e4f8c42b5fa46  %s/capture.py\n'' "$proof" | sha256sum
        --check --strict

        '
    - name: Capture unchanged native-target post-O2 module and require complete object identity
      if: success() && steps.cpu.outputs.run == 'true'
      shell: bash
      env:
        POST_O2_OUTPUT: ${{ runner.temp }}/driver-post-o2/output
        POST_O2_ARCHIVE: ${{ runner.temp }}/driver-post-o2/downloads/12398000737.zip
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-post-o2\"\nprintf '%s\\n' \"$(command -v python)\" \"$(command\
        \ -v objdump)\" \"$(command -v gh)\" \"$(command -v git)\" \"$(command -v sha256sum)\" \"$LLVM_PATH\" \"$proof/capture.py\"\
        \ \"$proof/downloads/12398000737.zip\" > \"$proof/guard-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/dmonitoringmodeld.py\"\
        \ \"$GITHUB_WORKSPACE/openpilot/common/transformations/model.py\" \"$GITHUB_WORKSPACE/openpilot/common/transformations/camera.py\"\
        \ \"$GITHUB_WORKSPACE/openpilot/system/camerad/cameras/nv12_info.py\" \"$GITHUB_WORKSPACE/rust/tools/check_pipeline_reference.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/original.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/pipeline.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/capture.py\" \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/engine/realize.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/runtime/support/compiler_cpu.py\" \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/renderer/llvmir.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/runtime/autogen/llvm.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/native.py\"\
        \ >> \"$proof/guard-paths.txt\"\nwhile IFS= read -r path; do\n sha256sum \"$path\"\ndone < \"$proof/guard-paths.txt\"\
        \ > \"$proof/shell-guards.before.sha256\"\nwhile IFS= read -r path; do\n stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"\
        $path\"\ndone < \"$proof/guard-paths.txt\" > \"$proof/shell-identities.before.txt\"\nstatus=0\nPOST_O2_OBJDUMP=\"\
        $(command -v objdump)\" timeout --signal=TERM --kill-after=10s 150s python \"$proof/capture.py\" > \"$proof/capture.stdout\"\
        \ 2> \"$proof/capture.stderr\" || status=$?\nprintf '%s\\n' \"$status\" > \"$proof/capture.status\"\ntest \"$status\"\
        \ -eq 0\n"
    - name: Verify independent source/provider/tool/input guards after success or failure
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-post-o2\"\n# Runs even after helper failure/timeout; independent\
        \ of Python finally blocks.\nstatus=0\npython -m pip freeze > \"$proof/providers.after.txt\" || status=1\ncmp \"$proof/providers.before.txt\"\
        \ \"$proof/providers.after.txt\" || status=1\nif test -f \"$proof/shell-guards.before.sha256\"; then\n sha256sum --check\
        \ --strict \"$proof/shell-guards.before.sha256\" > \"$proof/shell-guards.after.log\" 2>&1 || status=$?\n while IFS=\
        \ read -r path; do\n  stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\" || status=1\n done < \"$proof/guard-paths.txt\"\
        \ > \"$proof/shell-identities.after.txt\"\n cmp \"$proof/shell-identities.before.txt\" \"$proof/shell-identities.after.txt\"\
        \ || status=1\nfi\nprintf '%s\\n' \"$status\" > \"$proof/shell-final-guards.status\"\ntest \"$status\" -eq 0\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-post-o2-${{ env.DIAGNOSTIC_ATTEMPT }}
        if-no-files-found: warn
        retention-days: 14
        path: '${{ runner.temp }}/driver-post-o2/output/

          ${{ runner.temp }}/driver-post-o2/*.json

          ${{ runner.temp }}/driver-post-o2/*.txt

          ${{ runner.temp }}/driver-post-o2/*.log

          ${{ runner.temp }}/driver-post-o2/*.sha256

          ${{ runner.temp }}/driver-post-o2/*.status

          ${{ runner.temp }}/driver-post-o2/capture.py

          ${{ runner.temp }}/driver-post-o2/capture.stdout

          ${{ runner.temp }}/driver-post-o2/capture.stderr'
