name: Paramsd startup family 296 once
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/paramsd-startup-family-296-once.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  startup-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 69bbee211a5bfde590ab9d85fb071d967892b580
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CXX: clang++
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 69bbee211a5bfde590ab9d85fb071d967892b580
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Prepare hosted prerequisites
      run: 'set -euo pipefail

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 2048

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 zstandard==0.25.0 pyzmq==27.2.0

        '
    - name: Freeze hosted observers
      run: "set -euo pipefail\npayload=\"$RUNNER_TEMP/paramsd-startup-payload\"\nmkdir \"$payload\"\ncat > \"$payload/capture-original.py\"\
        \ <<'PARAMSD_ORIGINAL_OBSERVER'\n\"\"\"Hosted only: observe unchanged check_paramsd_startup.main and its temp tree.\n\
        No seed, expected packet, or success value is generated by this observer.\n\"\"\"\nimport hashlib\nimport json\nimport\
        \ os\nfrom pathlib import Path\nimport shutil\nimport sys\nimport tempfile\n\nimport check_paramsd_startup as original\n\
        \noutput = Path(sys.argv[1]).resolve()\nbinary = Path(sys.argv[2]).resolve()\nassert not output.exists()\noutput.mkdir()\n\
        assert hashlib.sha256(Path(original.__file__).read_bytes()).hexdigest() == '99d5d76b292d841c9d0e8b78a29e8750679aa297ed0dfea473d829e3877c22eb'\n\
        def providers():\n    maps = Path('/proc/self/maps').read_text()\n    result = {}\n    for line in maps.splitlines():\n\
        \        fields = line.split(None, 5)\n        if len(fields) == 6 and 'x' in fields[1] and fields[5].startswith('/'):\n\
        \            assert not fields[5].endswith(' (deleted)')\n            path = Path(fields[5]).resolve()\n         \
        \   result[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()\n    return maps, result\n\nmaps_before, providers_before\
        \ = providers()\n(output / 'python-maps-before.txt').write_text(maps_before)\n(output / 'python-providers-before.json').write_text(json.dumps(providers_before,\
        \ indent=2) + '\\n')\ninputs, active = [], None\nreal_run = original.run\nreal_temporary = tempfile.TemporaryDirectory\n\
        \n\nclass ObservedTemporary(real_temporary):\n    def __exit__(self, *args):\n        # Called after original finally\
        \ has terminated/reaped its daemon, and\n        # before original TemporaryDirectory removes the private Params tree.\n\
        \        if active is not None and args[0] is None:\n            private = Path(self.name)\n            params = [path\
        \ for path in (private / 'params').iterdir() if path.is_dir()]\n            assert len(params) == 1 and params[0].name.startswith('rust-probe-params-')\n\
        \            destination = output / active / 'params'\n            destination.mkdir()\n            for path in params[0].iterdir():\n\
        \                assert path.is_file() and not path.is_symlink()\n                shutil.copyfile(path, destination\
        \ / path.name)\n            memory = private / 'memory' / params[0].name / 'LastGPSPosition'\n            if memory.exists():\n\
        \                shutil.copyfile(memory, output / active / 'LastGPSPosition.bin')\n        return super().__exit__(*args)\n\
        \n\ndef observe(binary_arg, evidence, name, seed):\n    global active\n    assert active is None and Path(binary_arg)\
        \ == binary\n    inputs.append({'name': name, 'seed': seed})\n    active = name\n    try:\n        return real_run(binary_arg,\
        \ evidence, name, seed)\n    finally:\n        active = None\n\n\noriginal.run = observe\noriginal.tempfile.TemporaryDirectory\
        \ = ObservedTemporary\ntry:\n    sys.argv = [original.__file__, '--binary', str(binary), '--evidence', str(output)]\n\
        \    original.main()\nfinally:\n    original.run = real_run\n    original.tempfile.TemporaryDirectory = real_temporary\n\
        (output / 'inputs.json').write_text(json.dumps(inputs) + '\\n')\n(output / 'capture.json').write_text(json.dumps({\n\
        \    'source': original.__file__, 'binary': str(binary),\n    'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),\n\
        \    'cases': len(inputs), 'observation': 'original main/run and pre-cleanup directory',\n    'source_sha256': hashlib.sha256(Path(original.__file__).read_bytes()).hexdigest(),\n\
        }) + '\\n')\nassert len(inputs) == 7\nmaps_after, providers_after = providers()\nassert providers_before == providers_after\n\
        (output / 'python-maps-after.txt').write_text(maps_after)\n(output / 'python-providers-after.json').write_text(json.dumps(providers_after,\
        \ indent=2) + '\\n')\nPARAMSD_ORIGINAL_OBSERVER\ncat > \"$payload/audit.py\" <<'PARAMSD_NATIVE_AUDITOR'\n\"\"\"Hosted\
        \ only: independent current original/native raw evidence audit.\"\"\"\nimport hashlib\nimport json\nimport math\n\
        import os\nfrom pathlib import Path\nimport re\nimport signal\nimport subprocess\nimport sys\nimport time\n\nfrom\
        \ openpilot.cereal import log\n\nproof, checker, daemon, root, absent_root = map(lambda p: Path(p).resolve(), sys.argv[1:])\n\
        roster = ['blocked-car', 'malformed-car', 'migration', 'invalid-json', 'wrong-fields',\n          'malformed-cache',\
        \ 'wrong-covariance-dimensions']\noriginal = proof / 'original'\n\n\ndef value(path):\n    return json.loads(path.read_bytes())\n\
        \n\ndef sha(path):\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\n\ndef packet(path):\n    with log.Event.from_bytes(path.read_bytes())\
        \ as message:\n        assert message.which() == 'liveParameters'\n        result = message.to_dict()\n        assert\
        \ result['logMonoTime'] > 0\n        del result['logMonoTime']\n        return result\n\n\ndef exact(left, right):\n\
        \    # Preserve signed zero and float bits in every decoded field. No tolerance.\n    assert type(left) is type(right),\
        \ (type(left), type(right))\n    if isinstance(left, dict):\n        assert left.keys() == right.keys()\n        for\
        \ key in left:\n            exact(left[key], right[key])\n    elif isinstance(left, list):\n        assert len(left)\
        \ == len(right)\n        for a, b in zip(left, right, strict=True):\n            exact(a, b)\n    elif isinstance(left,\
        \ float):\n        assert math.isfinite(left) and math.isfinite(right)\n        assert left.hex() == right.hex(),\
        \ (left, right)\n    else:\n        assert left == right, (left, right)\n\n\ndef execs(path):\n    text = path.read_text()\n\
        \    # Never ignore a failed/unrecognized execve or unfinished/resumed event.\n    openings = re.findall(r'\\bexecve(?:at)?\\\
        (', text)\n    records = []\n    for line in text.splitlines():\n        if not re.search(r'\\bexecve(?:at)?\\(',\
        \ line):\n            continue\n        match = re.fullmatch(r'\\d+\\s+execve\\((\"(?:[^\"\\\\]|\\\\.)*\"), (\\[.*\\\
        ]), .*\\) = 0', line)\n        assert match, line\n        records.append((json.loads(match[1]), json.loads(match[2])))\n\
        \    assert len(openings) == len(records)\n    return records\n\n\nexpected_input = value(original / 'inputs.json')\n\
        assert [case['name'] for case in expected_input] == roster\nassert value(original / 'results.json')['pass'] is True\n\
        assert value(original / 'capture.json')['binary_sha256'] == sha(daemon)\nproviders = {}\nfor line in (proof / 'providers.sha256').read_text().splitlines():\n\
        \    digest, path = line.split('  ', 1)\n    providers[str(Path(path).resolve())] = digest\nproviders[str(daemon)]\
        \ = sha(daemon)\nreceipts = []\nfor index, source_root in enumerate([root, absent_root]):\n    lane = proof / f'native-{index}'\n\
        \    exact(expected_input, value(lane / 'inputs.json'))\n    top = value(lane / 'results.json')\n    assert top['pass']\
        \ is True and top['startup_original_absent'] is bool(index)\n    assert top['startup_seconds'] == 10 and top['shutdown_seconds']\
        \ == 5\n    exact(value(original / 'results.json')['scenarios'], top['scenarios'])\n    expected_exec = [(str(checker),\
        \ [str(checker), '--root', str(source_root),\n                     '--binary', str(daemon), '--evidence', str(lane)])]\n\
        \    for case in roster:\n        old, new = original / case, lane / case\n        exact(value(old / 'results.json'),\
        \ value(new / 'results.json'))\n        old_files = sorted(path.name for path in (old / 'params').iterdir())\n   \
        \     new_files = sorted(path.name for path in (new / 'params').iterdir())\n        assert old_files == new_files\
        \ == value(new / 'results.json')['files']\n        for name in old_files:\n            if case == 'migration' and\
        \ name == 'LiveParametersV2':\n                exact(packet(old / 'params' / name), packet(new / 'params' / name))\n\
        \                assert (new / 'params' / name).read_bytes() == (new / 'migrated.bin').read_bytes()\n            else:\n\
        \                assert (old / 'params' / name).read_bytes() == (new / 'params' / name).read_bytes(), (case, name)\n\
        \        assert (old / 'LastGPSPosition.bin').exists() == (new / 'LastGPSPosition.bin').exists()\n        if (old\
        \ / 'LastGPSPosition.bin').exists():\n            assert (old / 'LastGPSPosition.bin').read_bytes() == (new / 'LastGPSPosition.bin').read_bytes()\n\
        \        if case == 'migration':\n            exact(packet(old / 'migrated.bin'), packet(new / 'migrated.bin'))\n\
        \        lifecycle = value(new / 'lifecycle.json')\n        if case in ('malformed-car', 'wrong-covariance-dimensions'):\n\
        \            assert lifecycle == {'exit': 1, 'signal': None, 'shutdown_seconds': None}\n        else:\n          \
        \  assert lifecycle['exit'] == 0 and lifecycle['signal'] == 'SIGTERM'\n            assert 0 <= lifecycle['shutdown_seconds']\
        \ < 5\n            maps = (new / 'maps.txt').read_text()\n            assert str(daemon) in maps\n            for\
        \ line in maps.splitlines():\n                fields = line.split(None, 5)\n                if len(fields) == 6 and\
        \ 'x' in fields[1] and fields[5].startswith('/'):\n                    assert not fields[5].endswith(' (deleted)'),\
        \ line\n                    mapped = Path(fields[5]).resolve()\n                    assert str(mapped) in providers,\
        \ ('unsealed executable mapping', mapped)\n                    assert sha(mapped) == providers[str(mapped)]\n    \
        \        assert not any(item in maps for item in ('libpython', 'ekf_sym_pyx', 'libcar.so'))\n        process = value(new\
        \ / 'process.json')\n        assert process['startup_seconds'] == 10 and process['shutdown_seconds'] == 5\n      \
        \  assert process['argv'][0] == str(daemon)\n        expected_exec.append((str(daemon), process['argv']))\n      \
        \  assert not Path(f\"/proc/{process['pid']}\").exists(), 'daemon not reaped'\n        assert not Path('/dev/shm',\
        \ 'msgq_' + process['prefix']).exists(), 'namespace leaked'\n        assert not list(new.glob('private-*')), 'private\
        \ Params root leaked'\n    assert execs(proof / f'native-{index}.exec') == expected_exec\n    assert len(expected_exec)\
        \ == 8\n    for binding in top['bindings']:\n        assert sha(Path(binding['path'])) == binding['sha256']\n    assert\
        \ (source_root / 'rust/tools/check_paramsd_startup.py').exists() is (index == 0)\n    receipts.append({'lane': index,\
        \ 'cases': 7, 'execs': 8, 'python_execs': 0,\n                     'report_sha256': sha(lane / 'results.json')})\n\
        \n# CLI argument/output ownership controls use actual held current ELFs.\nforeign = proof / 'foreign'\nforeign.mkdir()\n\
        (foreign / 'sentinel').write_bytes(b'foreign')\nnegative = subprocess.run([checker, '--root', root, '--binary', daemon,\
        \ '--evidence', foreign], capture_output=True, timeout=20)\nassert negative.returncode != 0 and (foreign / 'sentinel').read_bytes()\
        \ == b'foreign'\nassert sorted(p.name for p in foreign.iterdir()) == ['sentinel']\n(proof / 'foreign.stdout').write_bytes(negative.stdout)\n\
        (proof / 'foreign.stderr').write_bytes(negative.stderr)\n\n# Refuse changed historical source before evidence admission.\
        \ Mutate only the\n# disposable source copy, then restore it before final source/provider seals.\noriginal_path =\
        \ absent_root / 'rust/tools/check_paramsd_startup.py'\noriginal_path.write_bytes(b'changed original source\\n')\n\
        try:\n    output = proof / 'changed-original'\n    negative = subprocess.run([checker, '--root', absent_root, '--binary',\
        \ daemon, '--evidence', output], capture_output=True, timeout=20)\n    assert negative.returncode != 0 and not output.exists()\n\
        \    (proof / 'changed-original.stderr').write_bytes(negative.stderr)\nfinally:\n    original_path.unlink()\n\n# Actual\
        \ CLI INT/TERM cleanup. Stop the first owned child before requesting\n# cancellation, preserving the unchanged runtime\
        \ startup/shutdown limits.\nfor sig in [signal.SIGINT, signal.SIGTERM]:\n    output = proof / f'cancel-{sig.name}'\n\
        \    with (proof / f'cancel-{sig.name}.stdout').open('wb') as out, (proof / f'cancel-{sig.name}.stderr').open('wb')\
        \ as err:\n        process = subprocess.Popen([checker, '--root', root, '--binary', daemon, '--evidence', output],\
        \ stdout=out, stderr=err)\n        child_pid = None\n        try:\n            deadline = time.monotonic() + 10\n\
        \            while time.monotonic() < deadline:\n                assert process.poll() is None, 'controller ended\
        \ before cancellation injection'\n                path = output / 'blocked-car/process.json'\n                if path.exists():\n\
        \                    try:\n                        child_pid = value(path)['pid']\n                    except json.JSONDecodeError:\n\
        \                        continue\n                    os.kill(child_pid, signal.SIGSTOP)\n                    process.send_signal(sig)\n\
        \                    break\n                time.sleep(.0005)\n            assert child_pid is not None, 'missing\
        \ live child for cancellation'\n            assert process.wait(timeout=5) != 0\n            assert not (output /\
        \ 'results.json').exists(), 'cancelled run published success'\n            assert not Path(f'/proc/{child_pid}').exists(),\
        \ 'cancelled child not reaped'\n            metadata = value(output / 'blocked-car/process.json')\n            assert\
        \ not Path('/dev/shm', 'msgq_' + metadata['prefix']).exists()\n            assert not list((output / 'blocked-car').glob('private-*'))\n\
        \        finally:\n            if process.poll() is None:\n                process.send_signal(signal.SIGTERM)\n \
        \               process.wait(timeout=5)\n\n(proof / 'audit.json').write_text(json.dumps({'pass': True, 'lanes': receipts,\n\
        \    'comparison': 'all seven original seeds, results, final Params bytes, GPS effects, migration fields exact except\
        \ independent Event.logMonoTime',\n    'controls': ['foreign evidence', 'changed original', 'actual SIGINT cancellation',\
        \ 'actual SIGTERM cancellation'],\n    'retired_sources': [], 'device_acceptance': False}, indent=2) + '\\n')\nPARAMSD_NATIVE_AUDITOR\n\
        sha256sum \"$payload/capture-original.py\" \"$payload/audit.py\" > \"$payload/observers.sha256\"\n"
    - name: Exact current original and two native startup roots
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/paramsd-startup-proof\"\ntarget=\"$RUNNER_TEMP/paramsd-startup-fresh-target\"\
        \ntest ! -e \"$proof\"\ntest ! -e \"$target\"\nmkdir \"$proof\"\ncp \"$RUNNER_TEMP/paramsd-startup-payload/capture-original.py\"\
        \ \"$RUNNER_TEMP/paramsd-startup-payload/audit.py\" \"$proof/\"\nexport CARGO_TARGET_DIR=\"$target\"\nexport CARGO_INCREMENTAL=0\
        \ CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CXX=clang++\nexport PYTHONDONTWRITEBYTECODE=1\n\
        unset MANAGER_DAEMON ZMQ CEREAL_FAKE LD_PRELOAD LD_LIBRARY_PATH RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER\n\
        unset PARAMSD_SANITIZER_LIBS\nexport RUSTUP_TOOLCHAIN=1.94.0\n# No cache restore: the complete target starts absent\
        \ in this hosted job.\ngit rev-parse HEAD > \"$proof/SOURCE_COMMIT\"\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\
        \ngit diff --exit-code\ngit ls-files -z | xargs -0 sha256sum > \"$proof/source.sha256\"\nmkdir \"$proof/source-inputs\"\
        \ngit ls-files -z 'rust/Cargo.toml' 'rust/Cargo.lock' 'rust/crates/dev-tools/Cargo.toml' 'rust/crates/paramsd/*' 'rust/crates/dev-tools/*paramsd*'\
        \ 'rust/tools/*paramsd*' 'openpilot/cereal/*.capnp' 'opendbc_repo/opendbc/car/car.capnp' | xargs -0 cp --parents -t\
        \ \"$proof/source-inputs\"\nsha256sum rust/Cargo.toml rust/Cargo.lock rust/crates/dev-tools/Cargo.toml > \"$proof/manifests.sha256\"\
        \nrustc -vV > \"$proof/rustc.txt\"\ncargo -V > \"$proof/cargo.txt\"\nclang++ --version > \"$proof/clang.txt\"\ncapnp\
        \ --version > \"$proof/capnp.txt\"\npython -m pip freeze > \"$proof/python-packages.txt\"\nuname -a > \"$proof/kernel.txt\"\
        \nlscpu > \"$proof/cpu.txt\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib\
        \ 8192\ncargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features eigen-tools-native\
        \ --bin stage-eigen-headers > \"$proof/eigen-build.log\" 2>&1\ncurl --fail --location --retry 3 --output \"$proof/eigen.whl\"\
        \ https://github.com/commaai/dependencies/releases/download/eigen/v3.4.0/eigen-3.4.0-py3-none-linux_x86_64.whl\n\"\
        $target/debug/stage-eigen-headers\" --wheel \"$proof/eigen.whl\" --output \"$proof/eigen-native\" --architecture x86_64\
        \ > \"$proof/eigen-stage.json\"\nexport PARAMSD_EIGEN_INCLUDE=\"$proof/eigen-native/install\"\nfind \"$proof/eigen-native\"\
        \ -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/eigen.sha256\"\n# The startup family has no source-oracle/Cython/model\
        \ build dependency.\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 8192\n\
        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-paramsd --bin openpilot-paramsd > \"$proof/daemon-build.log\"\
        \ 2>&1\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 2048\ncargo build --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-startup-check-native --bin check-paramsd-startup-native\
        \ > \"$proof/checker-build.log\" 2>&1\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib\
        \ 1024\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-startup-check-native\
        \ --lib paramsd_startup_check:: > \"$proof/controller-unit.log\" 2>&1\ncargo test --manifest-path rust/Cargo.toml\
        \ --locked -p openpilot-dev-tools --features paramsd-startup-check-native --test paramsd_startup_check > \"$proof/fixture-cli-unit.log\"\
        \ 2>&1\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 1024\ncargo clippy\
        \ --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-startup-check-native --lib --bin\
        \ check-paramsd-startup-native --test paramsd_startup_check -- -D warnings > \"$proof/clippy.log\" 2>&1\nchecker=\"\
        $target/debug/check-paramsd-startup-native\"\ndaemon=\"$target/debug/openpilot-paramsd\"\nsha256sum \"$checker\" \"\
        $daemon\" \"$target/debug/stage-eigen-headers\" > \"$proof/elf.sha256\"\n# Seal resolved loader/provider files, and\
        \ retain ldd output. No old ELF runs.\nldd \"$checker\" > \"$proof/checker.ldd\"\nldd \"$daemon\" > \"$proof/daemon.ldd\"\
        \nawk '/=> \\/|^[[:space:]]*\\// {for(i=1;i<=NF;i++) if($i ~ /^\\//) print $i}' \"$proof/checker.ldd\" \"$proof/daemon.ldd\"\
        \ | sort -u > \"$proof/providers.paths\"\ntest -s \"$proof/providers.paths\"\nwhile IFS= read -r library; do sha256sum\
        \ \"$(readlink -f \"$library\")\"; done < \"$proof/providers.paths\" > \"$proof/providers.sha256\"\nrust/tools/check-disk-space\
        \ --path \"$RUNNER_TEMP\" --growth-mib 8192\nmkdir \"$proof/original-root\" \"$proof/absent-root\"\ngit archive \"\
        $SOURCE_SHA\" | tar -x -C \"$proof/original-root\"\ngit archive \"$SOURCE_SHA\" | tar -x -C \"$proof/absent-root\"\
        \ --exclude=rust/tools/check_paramsd_startup.py\ntest ! -e \"$proof/absent-root/rust/tools/check_paramsd_startup.py\"\
        \ntest ! -L \"$proof/absent-root/rust/tools/check_paramsd_startup.py\"\n# Snapshot each isolated root before functional\
        \ execution. The private absent\n# copy is never built; both native lanes use the same current ELF and providers.\n\
        find \"$proof/original-root\" -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/original-root.sha256\"\nfind\
        \ \"$proof/absent-root\" -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/absent-root.sha256\"\nexport PYTHONPATH=\"\
        $proof/original-root:$proof/original-root/rust/tools\"\npython \"$proof/capture-original.py\" \"$proof/original\"\
        \ \"$daemon\" > \"$proof/original.stdout\" 2> \"$proof/original.stderr\"\nsha256sum \"$proof/original\"/inputs.json\
        \ \"$proof/original\"/results.json \"$proof/original\"/capture.json > \"$proof/original.sha256\"\nfind \"$proof/original\"\
        \ -type f -print0 | sort -z | xargs -0 sha256sum >> \"$proof/original.sha256\"\nexport PARAMSD_STARTUP_ORIGINAL_INPUT=\"\
        $proof/original/inputs.json\"\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features\
        \ paramsd-startup-check-native --test paramsd_startup_check -- --ignored --exact all_seed_bytes_match_fresh_original_controller_calls\
        \ --nocapture > \"$proof/fresh-fixture-reference.log\" 2>&1\nfor lane in 0 1; do\n  source_root=\"$GITHUB_WORKSPACE\"\
        \n  if [ \"$lane\" = 1 ]; then source_root=\"$proof/absent-root\"; fi\n  /usr/bin/timeout --signal=TERM --kill-after=5s\
        \ 180s /usr/bin/env PATH=\"$proof/no-programs\" /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o \"$proof/native-$lane.exec\"\
        \ \"$checker\" --root \"$source_root\" --binary \"$daemon\" --evidence \"$proof/native-$lane\" > \"$proof/native-$lane.stdout\"\
        \ 2> \"$proof/native-$lane.stderr\"\ndone\npython \"$proof/audit.py\" \"$proof\" \"$checker\" \"$daemon\" \"$GITHUB_WORKSPACE\"\
        \ \"$proof/absent-root\" > \"$proof/audit.stdout\" 2> \"$proof/audit.stderr\"\nsha256sum -c \"$proof/source.sha256\"\
        \ > \"$proof/source-after.txt\"\nsha256sum -c \"$proof/manifests.sha256\" > \"$proof/manifests-after.txt\"\nsha256sum\
        \ -c \"$proof/elf.sha256\" > \"$proof/elf-after.txt\"\nsha256sum -c \"$proof/providers.sha256\" > \"$proof/providers-after.txt\"\
        \nsha256sum -c \"$proof/eigen.sha256\" > \"$proof/eigen-after.txt\"\nsha256sum -c \"$proof/original.sha256\" > \"\
        $proof/original-after.txt\"\nsha256sum -c \"$proof/original-root.sha256\" > \"$proof/original-root-after.txt\"\nsha256sum\
        \ -c \"$proof/absent-root.sha256\" > \"$proof/absent-root-after.txt\"\ntest ! -e \"$proof/absent-root/rust/tools/check_paramsd_startup.py\"\
        \ntest ! -L \"$proof/absent-root/rust/tools/check_paramsd_startup.py\"\ngit diff --exit-code\nprintf '%s\\n' 'Exact\
        \ original/native startup family complete; no source retirement or device acceptance claimed.' > \"$proof/complete.txt\"\
        \n"
