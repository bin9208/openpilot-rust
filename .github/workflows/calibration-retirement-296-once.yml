name: One-time calibration getFloat same-ELF absence proof 296
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/calibration-retirement-296-once.yml
permissions:
  contents: read
jobs:
  calibration-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CALIBRATION_RETIREMENT_EXPECTED_SOURCE: 5769ebb185cdad4bba58d8dc3c267882df3dacba
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5769ebb185cdad4bba58d8dc3c267882df3dacba
        persist-credentials: false
    - name: Verify exact checkout and reserve disk
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$CALIBRATION_RETIREMENT_EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/calibration-retirement-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/source-commit.txt"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned host prerequisites and fresh ELFs
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/calibration-retirement-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 1024\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev\
        \ pkg-config strace\nrustup toolchain install 1.94.0 --profile minimal --component clippy\nrust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\ncargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-calibrationd\
        \ --example calibration_float --locked 2>&1 | tee \"$proof/candidate-build.log\"\nrust/tools/check-disk-space --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features calibration-float-native --bin check-calibration-float --locked 2>&1 | tee \"$proof/checker-build.log\"\
        \ntest -s rust/target/debug/examples/calibration_float\ntest -s rust/target/debug/check-calibration-float\nprintf\
        \ 'CALIBRATION_RETIREMENT_CHECKOUT_ROOT=%s\\n' \"$GITHUB_WORKSPACE\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_CHECKER=%s\\\
        n' \"$GITHUB_WORKSPACE/rust/target/debug/check-calibration-float\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_CANDIDATE=%s\\\
        n' \"$GITHUB_WORKSPACE/rust/target/debug/examples/calibration_float\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_FLOAT_BINARY=%s\\\
        n' \"$GITHUB_WORKSPACE/rust/target/debug/examples/calibration_float\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_FLOAT_PYTHON=%s\\\
        n' \"$(command -v python)\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_COMPILER=%s\\n' \"$(command -v g++)\"\
        \ >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_SOURCE_COMMIT=%s\\n' \"$proof/source-commit.txt\" >> \"$GITHUB_ENV\"\
        \nprintf 'CALIBRATION_RETIREMENT_ORIGINAL_OUTPUT=%s\\n' \"$proof/original\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_PRESENT_OUTPUT=%s\\\
        n' \"$proof/present\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_ABSENT_OUTPUT=%s\\n' \"$proof/absent\" >>\
        \ \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_ABSENT_ROOT=%s\\n' \"$proof/absent-root\" >> \"$GITHUB_ENV\"\nprintf\
        \ 'CALIBRATION_RETIREMENT_CLI_CAPTURE=%s\\n' \"$proof/cli\" >> \"$GITHUB_ENV\"\nfor lane in ORIGINAL PRESENT ABSENT;\
        \ do\n  printf 'CALIBRATION_RETIREMENT_%s_STDOUT=%s\\n' \"$lane\" \"$proof/${lane,,}.stdout\" >> \"$GITHUB_ENV\"\n\
        \  printf 'CALIBRATION_RETIREMENT_%s_STDERR=%s\\n' \"$lane\" \"$proof/${lane,,}.stderr\" >> \"$GITHUB_ENV\"\ndone\n\
        printf 'CALIBRATION_RETIREMENT_PRESENT_EXEC=%s\\n' \"$proof/present.exec\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_ABSENT_EXEC=%s\\\
        n' \"$proof/absent.exec\" >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_ARTIFACTS_BEFORE=%s\\n' \"$proof/before.json\"\
        \ >> \"$GITHUB_ENV\"\nprintf 'CALIBRATION_RETIREMENT_ARTIFACTS_AFTER=%s\\n' \"$proof/after.json\" >> \"$GITHUB_ENV\"\
        \n"
    - name: Capture unchanged original and same-ELF native roots
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/calibration-retirement-296\"\npython_bin=\"$(command -v python)\"\nscript=\"\
        $GITHUB_WORKSPACE/rust/tools/check_calibration_float.py\"\nprintf '922e055f3e9b8fda4e732e83b5332105b5203bd9f56964bf5515e3557c9ff304\
        \  %s\\n' \"$script\" | sha256sum --check --strict\nprintf '47d08fa1987c9150e55d09a2a533a0a115851aadb34bd1a0c82325e0be8726b3\
        \  %s\\n' \"$GITHUB_WORKSPACE/openpilot/common/params.h\" | sha256sum --check --strict\nmkdir -p \"$CALIBRATION_RETIREMENT_ABSENT_ROOT/openpilot/common\"\
        \ \"$CALIBRATION_RETIREMENT_ABSENT_ROOT/rust/tools\"\ncp openpilot/common/params.h \"$CALIBRATION_RETIREMENT_ABSENT_ROOT/openpilot/common/params.h\"\
        \ntest ! -e \"$CALIBRATION_RETIREMENT_ABSENT_ROOT/rust/tools/check_calibration_float.py\"\ntest ! -L \"$CALIBRATION_RETIREMENT_ABSENT_ROOT/rust/tools/check_calibration_float.py\"\
        \nexport CALIBRATION_RETIREMENT_PYTHON=\"$python_bin\"\nexport CALIBRATION_RETIREMENT_SCRIPT=\"$script\"\npython -\
        \ <<'PY'\nimport hashlib,json,os,pathlib\nfiles=[os.environ[k] for k in ('CALIBRATION_RETIREMENT_CHECKER','CALIBRATION_RETIREMENT_CANDIDATE','CALIBRATION_RETIREMENT_COMPILER')]\n\
        files += [str(pathlib.Path(os.environ['GITHUB_WORKSPACE']) / p) for p in ('openpilot/common/params.h','rust/tools/check_calibration_float.py')]\n\
        seal={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}\npathlib.Path(os.environ['CALIBRATION_RETIREMENT_ARTIFACTS_BEFORE']).write_text(json.dumps(seal,sort_keys=True)+'\\\
        n')\nPY\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 128\n/usr/bin/timeout --kill-after=5s\
        \ 180s \"$python_bin\" \"$script\" --binary \"$CALIBRATION_RETIREMENT_CANDIDATE\" --output \"$CALIBRATION_RETIREMENT_ORIGINAL_OUTPUT\"\
        \ > \"$CALIBRATION_RETIREMENT_ORIGINAL_STDOUT\" 2> \"$CALIBRATION_RETIREMENT_ORIGINAL_STDERR\"\nfor lane in present\
        \ absent; do\n  if [[ \"$lane\" = present ]]; then root=\"$GITHUB_WORKSPACE\"; else root=\"$CALIBRATION_RETIREMENT_ABSENT_ROOT\"\
        ; fi\n  output=\"$proof/$lane\"\n  rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 128\n  OPENPILOT_RUST_ROOT=\"\
        $root\" PATH=/usr/bin:/bin /usr/bin/timeout --signal=TERM --kill-after=5s 180s /usr/bin/strace -f -qq -s 65535 -e\
        \ trace=execve,execveat -o \"$proof/$lane.exec\" \"$CALIBRATION_RETIREMENT_CHECKER\" --binary \"$CALIBRATION_RETIREMENT_CANDIDATE\"\
        \ --output \"$output\" > \"$proof/$lane.stdout\" 2> \"$proof/$lane.stderr\"\ndone\npython - <<'PY'\nimport hashlib,json,os,pathlib\n\
        before=json.loads(pathlib.Path(os.environ['CALIBRATION_RETIREMENT_ARTIFACTS_BEFORE']).read_text())\nafter={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()\
        \ for p in before}\npathlib.Path(os.environ['CALIBRATION_RETIREMENT_ARTIFACTS_AFTER']).write_text(json.dumps(after,sort_keys=True)+'\\\
        n')\nassert before==after\nPY\n"
    - name: Capture original and native CLI admission including PATH failures
      shell: bash
      run: "set -euo pipefail\nroot=\"$CALIBRATION_RETIREMENT_CLI_CAPTURE\"\nmkdir -p \"$root/private\"\npython_bin=\"$(command\
        \ -v python)\"\nscript=\"$GITHUB_WORKSPACE/rust/tools/check_calibration_float.py\"\ncapture() {\n  local name=\"$1\"\
        ; shift\n  local dir=\"$root/$name\"\n  mkdir -p \"$dir\"\n  for lane in original native; do\n    local -a cmd\n \
        \   if [[ \"$lane\" = original ]]; then cmd=(\"$python_bin\" \"$script\"); else cmd=(\"$CALIBRATION_RETIREMENT_CHECKER\"\
        ); fi\n    set +e\n    \"${cmd[@]}\" \"$@\" > \"$dir/$lane.stdout\" 2> \"$dir/$lane.stderr\"\n    local code=$?\n\
        \    set -e\n    printf '%s\\n' \"$code\" > \"$dir/$lane.code\"\n  done\n}\ncapture help --help\ncapture hfoo -hfoo\n\
        capture hh -hh\ncapture hhh -hhh\ncapture h-h -h-h\ncapture hh-eq -hh=foo\ncapture h-eq -h=foo\ncapture long-help-eq\
        \ --help=foo\ncapture missing-binary --binary\ncapture unknown --unknown\nfor mode in unset empty; do\n  dir=\"$root/path-$mode\"\
        \n  mkdir -p \"$dir\"\n  for lane in original native; do\n    if [[ \"$lane\" = original ]]; then cmd=(\"$python_bin\"\
        \ \"$script\"); else cmd=(\"$CALIBRATION_RETIREMENT_CHECKER\"); fi\n    set +e\n    if [[ \"$mode\" = unset ]]; then\n\
        \      (cd \"$root/private\" && OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\" /usr/bin/env -u PATH \"${cmd[@]}\" --binary\
        \ \"$CALIBRATION_RETIREMENT_CANDIDATE\" --output \"$dir/$lane-output\") > \"$dir/$lane.stdout\" 2> \"$dir/$lane.stderr\"\
        \n    else\n      (cd \"$root/private\" && OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\" PATH='' \"${cmd[@]}\" --binary\
        \ \"$CALIBRATION_RETIREMENT_CANDIDATE\" --output \"$dir/$lane-output\") > \"$dir/$lane.stdout\" 2> \"$dir/$lane.stderr\"\
        \n    fi\n    code=$?\n    set -e\n    printf '%s\\n' \"$code\" > \"$dir/$lane.code\"\n  done\ndone\n"
    - name: 'Require #437 old source behavioral RED without changing old runtime'
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/calibration-retirement-296\"\nold_sha=60e3711e09d6b45b66a3f5ac30d79d6521f86e0c\n\
        old_source=\"$RUNNER_TEMP/calibration-437-old-source\"\nold_target=\"$RUNNER_TEMP/calibration-437-old-target\"\nrust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\ngit fetch --no-tags --depth=1 origin \"$old_sha\"\ngit worktree\
        \ add --detach \"$old_source\" \"$old_sha\"\ntest \"$(git -C \"$old_source\" rev-parse HEAD)\" = \"$old_sha\"\nold_file=\"\
        $old_source/rust/crates/dev-tools/src/calibration_float_check.rs\"\nsha256sum \"$old_file\" > \"$proof/old-source-before.sha256\"\
        \ncat >> \"$old_file\" <<'RS'\n// #437 test-only graft: old production controller is unchanged.\n#[cfg(test)]\nmod\
        \ finalization_437_old_red {\n    use super::*;\n    struct ProbeRunner;\n    impl Runner for ProbeRunner {\n    \
        \    fn run(&mut self, command: &CommandSpec) -> Result<Captured> {\n            if command.timeout == Duration::from_secs(60)\
        \ {\n                let reference = PathBuf::from(command.effective_argv().last().unwrap().clone());\n          \
        \      fs::write(reference, b\"private lifecycle fixture\")?;\n            }\n            Ok(Captured { code: 0, stdout:\
        \ b\"0\".to_vec(), stderr: Vec::new() })\n        }\n    }\n    #[test]\n    fn historical_reappearance_at_finalization_old_red()\
        \ {\n        let directory = PathBuf::from(std::env::var_os(\"CALIBRATION_437_OLD_EVIDENCE\").unwrap());\n       \
        \ fs::create_dir_all(&directory).unwrap();\n        let repository = Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"\
        ../../..\");\n        let header = directory.join(HEADER);\n        fs::create_dir_all(header.parent().unwrap()).unwrap();\n\
        \        fs::copy(repository.join(HEADER), &header).unwrap();\n        let historical = directory.join(CHECKER);\n\
        \        fs::create_dir_all(historical.parent().unwrap()).unwrap();\n        let binary = std::env::current_exe().unwrap();\n\
        \        let options = Options { root: directory.clone(), binary, output: directory.join(\"evidence\") };\n      \
        \  let cancel = AtomicBool::new(false);\n        // Inferred return type works with the old tuple and new Pending.\n\
        \        let pending = execute(&options, &mut ProbeRunner, &mut Vec::new(), &cancel).unwrap();\n        let result\
        \ = finish_cli(Ok(pending), &cancel, || fs::write(&historical, b\"reappeared\").unwrap());\n        assert!(result.is_err(),\
        \ \"accepted historical checker reappearance at finalization\");\n        assert!(!options.output.join(\"report.json\"\
        ).exists());\n        assert!(!options.output.join(\"provenance.json\").exists());\n    }\n    #[test]\n    fn historical_parent_replacement_at_finalization_old_red()\
        \ {\n        let directory = PathBuf::from(std::env::var_os(\"CALIBRATION_437_OLD_EVIDENCE\").unwrap()).join(\"parent-case\"\
        );\n        fs::create_dir_all(&directory).unwrap();\n        let repository = Path::new(env!(\"CARGO_MANIFEST_DIR\"\
        )).join(\"../../..\");\n        let header = directory.join(HEADER);\n        fs::create_dir_all(header.parent().unwrap()).unwrap();\n\
        \        fs::copy(repository.join(HEADER), &header).unwrap();\n        let historical = directory.join(CHECKER);\n\
        \        fs::create_dir_all(historical.parent().unwrap()).unwrap();\n        let options = Options { root: directory.clone(),\
        \ binary: std::env::current_exe().unwrap(), output: directory.join(\"evidence\") };\n        let cancel = AtomicBool::new(false);\n\
        \        let pending = execute(&options, &mut ProbeRunner, &mut Vec::new(), &cancel).unwrap();\n        let parent\
        \ = historical.parent().unwrap().to_path_buf();\n        let held = directory.join(\"rust/old-tools\");\n        let\
        \ result = finish_cli(Ok(pending), &cancel, || {\n            fs::rename(&parent, &held).unwrap();\n            fs::create_dir(&parent).unwrap();\n\
        \        });\n        assert!(result.is_err(), \"accepted historical parent replacement at finalization\");\n    \
        \    assert!(!options.output.join(\"report.json\").exists());\n        assert!(!options.output.join(\"provenance.json\"\
        ).exists());\n    }\n}\nRS\nsha256sum \"$old_file\" > \"$proof/old-source-with-test.sha256\"\ngit -C \"$old_source\"\
        \ diff -- rust/crates/dev-tools/src/calibration_float_check.rs > \"$proof/old-test-only.diff\"\nrust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nset +e\nCALIBRATION_437_OLD_EVIDENCE=\"$proof/old-case\" CARGO_TARGET_DIR=\"\
        $old_target\" cargo +1.94.0 test --manifest-path \"$old_source/rust/Cargo.toml\" -p openpilot-dev-tools --features\
        \ calibration-float-native --lib --locked 'calibration_float_check::finalization_437_old_red::' -- --nocapture > \"\
        $proof/old-red.log\" 2>&1\ncode=$?\nset -e\ntest \"$code\" -eq 101\ngrep -F 'accepted historical checker reappearance\
        \ at finalization' \"$proof/old-red.log\"\ngrep -F 'accepted historical parent replacement at finalization' \"$proof/old-red.log\"\
        \n! grep -F 'error: could not compile' \"$proof/old-red.log\"\nprintf '%s\\n' \"$code\" > \"$proof/old-red.exit\"\n\
        git worktree remove --force \"$old_source\"\nrm -rf -- \"$old_target\"\n"
    - name: Require same-ELF retirement audit and strict Clippy
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/calibration-retirement-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --lib
        --locked ''calibration_float_check::tests::historical_reappearance_during_handler_teardown_cannot_commit_receipts''
        -- --exact --nocapture 2>&1 | tee "$proof/437-fixed-green.log"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --lib
        --locked ''calibration_float_check::tests::historical_parent_replacement_during_teardown_cannot_commit_receipts''
        -- --exact --nocapture 2>&1 | tee "$proof/437-parent-green.log"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --lib
        --test calibration_float_check --test qa_process --test argparse_scan --locked -- --nocapture 2>&1 | tee "$proof/controller-process-cli-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --test
        calibration_float_retirement --locked -- --nocapture 2>&1 | tee "$proof/retirement-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --lib
        --bin check-calibration-float --test calibration_float_check --test calibration_float_retirement --test qa_process
        --test argparse_scan --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        test ! -e "$CALIBRATION_RETIREMENT_ABSENT_ROOT/rust/tools/check_calibration_float.py"

        test ! -L "$CALIBRATION_RETIREMENT_ABSENT_ROOT/rust/tools/check_calibration_float.py"

        '
    - name: Retain original, present, absent, raw CLI and executable evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: calibration-getfloat-retirement-predelete-296
        path: ${{ runner.temp }}/calibration-retirement-296/
        if-no-files-found: warn
env:
  RUSTUP_TOOLCHAIN: 1.94.0
