name: Desire probe stable JSON ordering regression
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/desire-json-order-296-once.yml
permissions:
  contents: read
jobs:
  desire-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      EXPECTED_SOURCE: 95d124cd3ae342459c30f56f4334621507e2be07
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 95d124cd3ae342459c30f56f4334621507e2be07
        persist-credentials: false
    - name: Prepare focused hosted Desire family prerequisites
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nmkdir -p \"$RUNNER_TEMP/desire-json-order\"\
        \nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nsudo apt-get update\nsudo apt-get install\
        \ -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev pkg-config libzmq3-dev\nrustup toolchain\
        \ install 1.94.0 --profile minimal --component clippy\npython3 - <<'PY_DATA'\nimport gzip,hashlib,os\nfrom pathlib\
        \ import Path\npacked=Path('rust/crates/dev-tools/tests/fixtures/desire-original-6e34f78a/request.jsonl.gz')\nassert\
        \ hashlib.sha256(packed.read_bytes()).hexdigest()=='76e4113c7df8cd7b96284c3bfa2b6a22ab112e745e743c70648baa9585097f58'\n\
        with gzip.open(packed,'rb') as source:\n    first=source.readline(1_000_000)\nassert first.endswith(b'\\n')\n(Path(os.environ['RUNNER_TEMP'])/'desire-json-order/first-request.jsonl').write_bytes(first)\n\
        PY_DATA\n"
    - name: Verify exact pre-fix probe order regression using only one accepted frame
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/desire-json-order"

        leaf=rust/crates/desire/examples/desire_probe.rs

        cp "$leaf" "$proof/fixed-desire-probe.rs"

        trap ''cp "$proof/fixed-desire-probe.rs" "$leaf"'' EXIT

        git fetch --no-tags --depth=1 origin f5c8ee8de76c038883f65668a45c49ad559ca83b

        git show f5c8ee8de76c038883f65668a45c49ad559ca83b:rust/crates/desire/examples/desire_probe.rs > "$leaf"

        sha256sum "$leaf" > "$proof/pre-fix-source.sha256"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-desire --example desire_probe --features serde_json/preserve_order
        --locked 2>&1 | tee "$proof/pre-fix-build.log"

        rust/target/debug/examples/desire_probe "$proof/first-request.jsonl" "$proof/pre-fix-actual.jsonl"

        python3 - <<''PY_RED''

        import hashlib,json,os

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''desire-json-order''

        raw=(p/''pre-fix-actual.jsonl'').read_bytes()

        expected=''053b0e2fccfc194f2b1adb17be3223d2993d72e2ebdde8cfad47f48df24f32ba''

        assert hashlib.sha256(raw).hexdigest()!=expected

        assert list(json.loads(raw))==[''state'',''remote_allowed'',''params_refreshed'']

        (p/''pre-fix-controlled-comparison.json'').write_text(json.dumps({''baseline_source'':''f5c8ee8de76c038883f65668a45c49ad559ca83b'',''shared_dependency_feature'':''serde_json/preserve_order'',''frames'':1,''accepted_sorted_first_row_sha256'':expected,''actual_sha256'':hashlib.sha256(raw).hexdigest(),''accepted_wire_comparison_rejected'':True},indent=2)+''\n'')

        PY_RED

        cp "$proof/fixed-desire-probe.rs" "$leaf"

        trap - EXIT

        cmp "$leaf" "$proof/fixed-desire-probe.rs"

        git diff --exit-code -- "$leaf"

        '
    - name: Require canonical probe bytes and unchanged full original CLI corpus once
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/desire-json-order"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-desire --example desire_probe --features serde_json/preserve_order
        --locked 2>&1 | tee "$proof/fixed-build.log"

        rust/target/debug/examples/desire_probe "$proof/first-request.jsonl" "$proof/fixed-actual.jsonl"

        printf ''%s  %s\n'' 053b0e2fccfc194f2b1adb17be3223d2993d72e2ebdde8cfad47f48df24f32ba "$proof/fixed-actual.jsonl" |
        sha256sum -c -

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --bin check-desire-reference-native
        --locked 2>&1 | tee "$proof/controller-build.log"

        export DESIRE_REFERENCE_CHECKER="$GITHUB_WORKSPACE/rust/target/debug/check-desire-reference-native"

        export DESIRE_REFERENCE_PROBE="$GITHUB_WORKSPACE/rust/target/debug/examples/desire_probe"

        export DESIRE_REFERENCE_CLI_OUTPUT="$proof/cli"

        sha256sum "$DESIRE_REFERENCE_PROBE" "$DESIRE_REFERENCE_CHECKER" rust/tools/check_desire_reference.py > "$proof/held-inputs.sha256"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --test desire_reference_cli
        --locked -- --nocapture 2>&1 | tee "$proof/fixed-cli.log"

        sha256sum -c "$proof/held-inputs.sha256"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-desire --example desire_probe --features serde_json/preserve_order
        --locked -- -D warnings 2>&1 | tee "$proof/probe-clippy.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --bin check-desire-reference-native
        --test desire_reference_cli --locked -- -D warnings 2>&1 | tee "$proof/cli-clippy.log"

        '
    - name: Archive actual raw-path output only after comparisons finish
      if: always()
      run: "set -euo pipefail\npython3 - <<'PY_ARCHIVE'\nimport json,os\nfrom pathlib import Path\nproof=os.fsencode(Path(os.environ['RUNNER_TEMP'])/'desire-json-order')\n\
        moved=[]\nfor root,dirs,files in os.walk(proof,topdown=False):\n    for name in dirs:\n        if any(b>=128 for b\
        \ in name):\n            old=os.path.join(root,name);new=os.path.join(root,b'raw-output-bytes')\n            assert\
        \ not os.path.lexists(new)\n            before=os.lstat(old)\n            os.rename(old,new)\n            after=os.lstat(new)\n\
        \            assert (before.st_dev,before.st_ino)==(after.st_dev,after.st_ino)\n            moved.append({'invoked_path_hex':old.hex(),'archived_path_hex':new.hex(),'directory_inode_unchanged':True})\n\
        (Path(os.fsdecode(proof))/'raw-output-archive.json').write_text(json.dumps(moved,indent=2)+'\\n')\nPY_ARCHIVE\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: desire-json-order-regression
        path: ${{ runner.temp }}/desire-json-order/
        if-no-files-found: error
