name: 296 native full original codec and name domains
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-codec-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: f2b7729ff372471a518f42a3bb5ab20396a2f9ee
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f2b7729ff372471a518f42a3bb5ab20396a2f9ee
        persist-credentials: false
    - name: Reserve capacity and authenticate source and native providers
      shell: bash
      run: 'set -euo pipefail

        export AST_CODEC_BASE="$RUNNER_TEMP/changed-files-codec-native-296"

        printf ''AST_CODEC_BASE=%s\n'' "$AST_CODEC_BASE" >> "$GITHUB_ENV"

        mkdir "$AST_CODEC_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$AST_CODEC_BASE/source.txt"

        git status --porcelain=v1 > "$AST_CODEC_BASE/source-status.before.txt"

        test ! -s "$AST_CODEC_BASE/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$AST_CODEC_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin > "$AST_CODEC_BASE/native-codec-packages.txt"

        '
    - name: Reuse immutable original codec and source syntax observations
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        base64 --decode <<''PAYLOAD'' > "$AST_CODEC_BASE/hosted_codec_domains.py"

        

        PAYLOAD

        printf ''bf649c3cd70f876e0c160585ef8e97d29f03ee44cf87e5e3c3f4c54389d48591  %s/hosted_codec_domains.py\n'' "$AST_CODEC_BASE"
        | sha256sum --check --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12441816204/zip > "$AST_CODEC_BASE/codec-original.zip"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12434037946/zip > "$AST_CODEC_BASE/syntax-original.zip"

        python3 "$AST_CODEC_BASE/hosted_codec_domains.py" admit

        '
    - name: Strictly compile affected native codec and original-domain targets
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --bin check-changed-files --test changed_files_check --test changed_files_codec_domains
        -- -D warnings > "$AST_CODEC_BASE/clippy.stdout" 2> "$AST_CODEC_BASE/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --test changed_files_check --test changed_files_codec_domains --no-run --message-format=json
        > "$AST_CODEC_BASE/tests-build.jsonl" 2> "$AST_CODEC_BASE/tests-build.stderr"

        python3 "$AST_CODEC_BASE/hosted_codec_domains.py" discover

        '
    - name: Run full new native domains and affected72source rows only
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        mkdir "$AST_CODEC_BASE/actual" "$AST_CODEC_BASE/syntax-actual" "$AST_CODEC_BASE/no-executables"

        export AST_CODEC_ORIGINAL_DIR="$AST_CODEC_BASE/codec-original" AST_CODEC_PROOF="$AST_CODEC_BASE/actual"

        export AST_ORIGINAL_DIR="$AST_CODEC_BASE/syntax-original" AST_PROOF="$AST_CODEC_BASE/syntax-actual"

        export PATH="$AST_CODEC_BASE/no-executables"

        set +e

        /usr/bin/timeout --signal=TERM --kill-after=10s 240s /usr/bin/strace -f -qq -s 4096 -e trace=execve,execveat -o "$AST_CODEC_BASE/domain.execve"
        "$AST_DOMAIN_EXE" --test-threads=1 --nocapture > "$AST_CODEC_BASE/domain.stdout" 2> "$AST_CODEC_BASE/domain.stderr"

        printf ''%s\n'' "$?" > "$AST_CODEC_BASE/domain.status"

        /usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/strace -f -qq -s 4096 -e trace=execve,execveat -o "$AST_CODEC_BASE/syntax.execve"
        "$AST_SYNTAX_EXE" all_72_original_raw_byte_admissions_use_actual_python312_syntax --exact --test-threads=1 --nocapture
        > "$AST_CODEC_BASE/syntax.stdout" 2> "$AST_CODEC_BASE/syntax.stderr"

        printf ''%s\n'' "$?" > "$AST_CODEC_BASE/syntax.status"

        set -e

        export PATH=/usr/bin:/bin

        /usr/bin/git status --porcelain=v1 > "$AST_CODEC_BASE/source-status.after.txt"

        python3 "$AST_CODEC_BASE/hosted_codec_domains.py" finish

        '
    - name: Preserve every native result and failure without oracle changes
      if: always()
      shell: bash
      run: "set -euo pipefail\nif test -d \"$AST_CODEC_BASE\"; then\n du -sm \"$AST_CODEC_BASE\" > \"$AST_CODEC_BASE/artifact-size-mib.txt\"\
        \n test \"$(cut -f1 \"$AST_CODEC_BASE/artifact-size-mib.txt\")\" -le 128\nfi\n"
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-codec-native-296
        path: ${{ runner.temp }}/changed-files-codec-native-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
