        uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      - name: Prepare native alert validation
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Check complete native alert corpora and failure behavior
        run: |
          cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked \
            --test selfdrive_events_check --test alert_callbacks_check --test selfdrive_helpers_check
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Seal Fast source and index after all maintained checks
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
          cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
