  fast:
    name: fast checks
    if: ${{ always() }}
    needs: [native, native-corpus, native-timing, native-alerts, native-alert-manager, python-android]
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 2
    steps:
      - name: Require every fast worker to succeed
        env:
          NATIVE: ${{ needs.native.result }}
          NATIVE_CORPUS: ${{ needs.native-corpus.result }}
          NATIVE_TIMING: ${{ needs.native-timing.result }}
          NATIVE_ALERTS: ${{ needs.native-alerts.result }}
          NATIVE_ALERT_MANAGER: ${{ needs.native-alert-manager.result }}
          PYTHON_ANDROID: ${{ needs.python-android.result }}
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          test "$NATIVE" = success
          test "$NATIVE_CORPUS" = success
          test "$NATIVE_TIMING" = success
          test "$NATIVE_ALERTS" = success
          test "$NATIVE_ALERT_MANAGER" = success
          test "$PYTHON_ANDROID" = success
