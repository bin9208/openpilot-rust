  python-android:
    name: fast Python and Android checks
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 7
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Deny fork source and require registered local runner
        shell: bash
        working-directory: ${{ github.workspace }}
