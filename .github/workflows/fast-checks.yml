name: Fast checks
'on':
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  native:
    name: fast native routing checks
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_HOSTED: '1'
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Deny fork source and require registered local runner
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$GH_HOSTED" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          df -PB1 "$GITHUB_WORKSPACE" /tmp
      - name: Common owned Fast job temporary paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      - name: Allocate private Fast source cache and target before checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          job=$CI_JOB_TEMP
          owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$(cat "$job/owner")" = "$owner"
          umask 077
          mkdir "$job/proof" "$job/home" "$job/cache"
          # Source capacity is checked on the actual source filesystem BEFORE checkout.
          available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          required=$((2 * 1024 * 1024 * 1024))
          printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
          cat "$job/proof/source-growth-before-checkout.json"
          ((available >= required))
          source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
          mkdir "$source_owner/source"
          source="$source_owner/source"
          # Preserve Actions' real workspace separately. Only Bash consumers see the
          # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
          printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
          printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
          printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
          df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
          cat /proc/meminfo > "$job/proof/memory-before.txt"
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
          printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ${{ env.DIAG_CHECKOUT_PATH }}
          set-safe-directory: false
          clean: false
          lfs: false
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Admit exact private Fast source and Git history
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          test "$PWD" = "$DIAG_SOURCE"
          test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
      - name: Admit provisioned Rust without installing a second toolchain
        id: prepared_rust
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: '"$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Isolate original Python package installation
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          ((available >= 512 * 1024 * 1024))
          python -m venv "$CI_JOB_TEMP/venv"
          printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Remove shared write permission from the owned provisioned SDK
        id: sdk_permissions
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sdk=$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu
          test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
          test "$CI_PREPARED_RUST_ROOT" = "$sdk"
          test -d "$sdk" && test ! -L "$sdk"
          test "$(readlink -e "$sdk")" = "$sdk"
          # SDK 소유권/type/device/content 검사를 유지하고 공유 쓰기 권한은 거부한다.
          find "$sdk" -xdev ! -uid "$(id -u)" -print0 > "$CI_JOB_TEMP/proof/sdk-foreign-owners.bin"
          test ! -s "$CI_JOB_TEMP/proof/sdk-foreign-owners.bin"
          find "$sdk" -xdev ! -type d ! -type f -print0 > "$CI_JOB_TEMP/proof/sdk-unapproved-kinds.bin"
          test ! -s "$CI_JOB_TEMP/proof/sdk-unapproved-kinds.bin"
          sdk_device=$(stat -c '%d' -- "$sdk")
          find "$sdk" -xdev -printf '%D\n' > "$CI_JOB_TEMP/proof/sdk-devices.before.txt"
          while IFS= read -r device; do test "$device" = "$sdk_device"; done < "$CI_JOB_TEMP/proof/sdk-devices.before.txt"
          printf '%s  %s\n' 103b60e1b1339968c1d74202ea1d45686037e82c4ea3e0569de24b18a1e6836a "$sdk/bin/rustc" > "$CI_JOB_TEMP/proof/sdk-permission-program-pins.sha256"
          printf '%s  %s\n' 77f14b761b02b47e6747473f556b3bc9f98f7e4525b7c3b8d74898ff816e4636 "$sdk/bin/cargo" >> "$CI_JOB_TEMP/proof/sdk-permission-program-pins.sha256"
          printf '%s  %s\n' d1c6d8c0e2fae4fbb686d421415d2f471e409ade6babb3e491d9ac5d9c70c602 "$sdk/bin/rustfmt" >> "$CI_JOB_TEMP/proof/sdk-permission-program-pins.sha256"
          printf '%s  %s\n' 2ff45d07196eec4f57a631103a877631d3579e86db2770bcfaa3b9d92a0b9d15 "$sdk/bin/clippy-driver" >> "$CI_JOB_TEMP/proof/sdk-permission-program-pins.sha256"
          sha256sum --check --quiet "$CI_JOB_TEMP/proof/sdk-permission-program-pins.sha256"
          LC_ALL=C find "$sdk" -xdev -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/sdk-permission-content.before.sha256"
          LC_ALL=C find "$sdk" -xdev -printf '%D:%i\t%m:%U:%G\t%T@\t%C@\t%y\t%p\t%l\0' | LC_ALL=C sort -z > "$CI_JOB_TEMP/proof/sdk-permission-roster.before.bin"
          find "$sdk" -xdev \( -type d -o -type f \) -perm /0022 -print0 > "$CI_JOB_TEMP/proof/sdk-permission-candidates.bin"
          : > "$CI_JOB_TEMP/proof/sdk-permission-journal.tsv"
          # hosted SDK는 처음부터 private다. 권한을 고치지 않고 기존 0022 거부를 검증한다.
          test ! -s "$CI_JOB_TEMP/proof/sdk-permission-candidates.bin"
      - name: Verify SDK contents after permission preparation even on failure
        id: sdk_permissions_final
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.sdk_permissions.outcome != 'skipped' && env.DIAG_SOURCE != '') }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          sdk=$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu
          test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
          test "$CI_PREPARED_RUST_ROOT" = "$sdk"
          LC_ALL=C find "$sdk" -xdev -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/sdk-permission-content.after.sha256"
          LC_ALL=C find "$sdk" -xdev -printf '%D:%i\t%m:%U:%G\t%T@\t%C@\t%y\t%p\t%l\0' | LC_ALL=C sort -z > "$CI_JOB_TEMP/proof/sdk-permission-roster.after.bin"
          cmp "$CI_JOB_TEMP/proof/sdk-permission-content.before.sha256" "$CI_JOB_TEMP/proof/sdk-permission-content.after.sha256"
          cmp "$CI_JOB_TEMP/proof/sdk-permission-roster.before.bin" "$CI_JOB_TEMP/proof/sdk-permission-roster.after.bin"
          # 권한 변경도 허용하지 않는다. 기존 나머지 field 불변식 검사도 유지한다.
          for phase in before after; do
            while IFS=$'\t' read -r -d '' identity permissions mtime ctime kind entry link; do
              test -z "$link"
              [[ $kind == d || $kind == f ]]
              [[ $entry == "$sdk" || $entry == "$sdk/"* ]]
              [[ $entry != *$'\n'* && $entry != *$'\t'* ]]
              mode=${permissions%%:*}
              printf '%s\t%o:%s\t%s\t%s\t%s\0' "$identity" "$((8#$mode & ~0022))" "${permissions#*:}" "$mtime" "$kind" "$entry"
            done < "$CI_JOB_TEMP/proof/sdk-permission-roster.$phase.bin" > "$CI_JOB_TEMP/proof/sdk-permission-invariants.$phase.bin"
          done
          cmp "$CI_JOB_TEMP/proof/sdk-permission-invariants.before.bin" "$CI_JOB_TEMP/proof/sdk-permission-invariants.after.bin"
          find "$sdk" -xdev \( -type d -o -type f \) -perm /0022 -print0 > "$CI_JOB_TEMP/proof/sdk-remaining-shared-writes.bin"
          test ! -s "$CI_JOB_TEMP/proof/sdk-remaining-shared-writes.bin"
      - name: Prepare native CI validation
        run: |
          set -euo pipefail
          umask 077
          set -C
          test ! -e "$RUNNER_TEMP/openpilot-disk-guard"
          test "$(cat "$CI_JOB_TEMP/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          cold_proof=$CI_JOB_TEMP/proof
          [[ -d "$cold_proof" && ! -L "$cold_proof" ]]
          test "$(readlink -e -- "$cold_proof")" = "$cold_proof"
          test "$(stat -c '%u:%a' -- "$cold_proof")" = "$(id -u):700"
          cold_strace=$(readlink -e -- /usr/bin/strace)
          test "$cold_strace" = /usr/bin/strace
          cold_provider() {
            local cold_phase=$1 cold_metadata
            [[ -f "$cold_strace" && ! -L "$cold_strace" && -x "$cold_strace" ]] || return 1
            test "$(readlink -e -- /usr/bin/strace)" = "$cold_strace" || return 1
            test "$(head -c 4 -- "$cold_strace" | od -An -tx1 | tr -d ' \n')" = 7f454c46 || return 1
            cold_metadata=$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$cold_strace") || return 1
            printf 'path=%s\nmetadata=%s\n' "$cold_strace" "$cold_metadata" > "$cold_proof/cold-strace.$cold_phase.metadata" || return 1
            sha256sum -- "$cold_strace" > "$cold_proof/cold-strace.$cold_phase.sha256" || return 1
            # 버전 출력만 64KiB/file로 제한한다. cold build에는 file-size 제한을 전파하지 않는다.
            (ulimit -f 64; "$cold_strace" --version) > "$cold_proof/cold-strace.$cold_phase.version" 2> "$cold_proof/cold-strace.$cold_phase.version.stderr" || return 1
            # OS 배포판/image 표기로 실제 kernel 또는 dpkg revision을 추측하지 않는다.
            (ulimit -f 64; /usr/bin/uname -rvm) > "$cold_proof/cold-strace.$cold_phase.kernel" 2> "$cold_proof/cold-strace.$cold_phase.kernel.stderr" || return 1
            (ulimit -f 64; /usr/bin/cat /proc/version) > "$cold_proof/cold-strace.$cold_phase.proc-version" 2> "$cold_proof/cold-strace.$cold_phase.proc-version.stderr" || return 1
            (ulimit -f 64; /usr/bin/dpkg-query -W -f='binary=${binary:Package}\nversion=${Version}\narchitecture=${Architecture}\nsource=${source:Package}\nsource_version=${source:Version}\n' strace) > "$cold_proof/cold-strace.$cold_phase.package" 2> "$cold_proof/cold-strace.$cold_phase.package.stderr" || return 1
            (ulimit -f 64; /usr/bin/stat -c '%n %d:%i:%f:%u:%g:%h:%s:%y:%z' /usr/bin/dpkg-query && /usr/bin/sha256sum /usr/bin/dpkg-query) > "$cold_proof/cold-strace.$cold_phase.package-provider" || return 1
            test "$cold_metadata" = "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$cold_strace")"
          }
          # 수집기만 현재 PID/start ticks/PPID로 확인한다. tracer/과거 PGID에는 신호를 보내지 않는다.
          cold_collector_current() {
            local cold_row cold_tail cold_fields
            cold_stderr_state=unknown
            [[ -d "/proc/$cold_parent" && -r "/proc/$cold_parent/stat" ]] || return 1
            if [[ ! -d "/proc/$cold_stderr_pid" ]]; then cold_stderr_state=gone; return 0; fi
            if ! IFS= read -r cold_row < "/proc/$cold_stderr_pid/stat"; then
              [[ ! -d "/proc/$cold_stderr_pid" ]] || return 1
              cold_stderr_state=gone; return 0
            fi
            [[ $cold_row == "$cold_stderr_pid "* && ${#cold_row} -le 4096 ]] || return 1
            cold_tail=${cold_row##*) }
            IFS=' ' read -r -a cold_fields <<< "$cold_tail" || return 1
            [[ ${#cold_fields[@]} -ge 20 && ${cold_fields[1]} == "$cold_parent" && ${cold_fields[19]} == "$cold_stderr_ticks" ]] || return 1
            case ${cold_fields[0]} in
              Z|X) cold_stderr_state=terminal;;
              R|S|D|T|t|I|W|P) cold_stderr_state=live;;
              *) return 1;;
            esac
          }
          cold_collect_stderr() {
            local cold_drain_polls=$1 cold_reap_polls=$2 cold_poll cold_row cold_tail cold_fields
            [[ $cold_drain_polls =~ ^[1-9][0-9]*$ && $cold_reap_polls =~ ^[1-9][0-9]*$ ]] || return 125
            ((cold_drain_polls <= 100 && cold_reap_polls <= 20)) || return 125
            for ((cold_poll=0; cold_poll<cold_drain_polls; cold_poll++)); do
              [[ ! -s "$cold_proof/cold-stderr.start.stat" ]] || break
              /usr/bin/sleep 0.1 || return 125
            done
            IFS= read -r cold_row < "$cold_proof/cold-stderr.start.stat" || return 125
            [[ $cold_row == "$cold_stderr_pid "* && ${#cold_row} -le 4096 ]] || return 125
            cold_tail=${cold_row##*) }
            IFS=' ' read -r -a cold_fields <<< "$cold_tail" || return 125
            [[ ${#cold_fields[@]} -ge 20 && ${cold_fields[1]} == "$cold_parent" && ${cold_fields[19]} =~ ^[1-9][0-9]*$ ]] || return 125
            cold_stderr_ticks=${cold_fields[19]}
            for ((; cold_poll<cold_drain_polls; cold_poll++)); do
              cold_collector_current || return 125
              [[ $cold_stderr_state == live ]] || break
              /usr/bin/sleep 0.1 || return 125
            done
            if [[ $cold_stderr_state == live ]]; then
              cold_stderr_timed_out=true
              # 신호 직전에 소유성을 다시 확인하며 단일 수집기 PID만 대상으로 한다.
              cold_collector_current || return 125
              if [[ $cold_stderr_state == live ]]; then
                kill -KILL -- "$cold_stderr_pid" || return 125
              fi
              for ((cold_poll=0; cold_poll<cold_reap_polls; cold_poll++)); do
                cold_collector_current || return 125
                [[ $cold_stderr_state == live ]] || break
                /usr/bin/sleep 0.1 || return 125
              done
            fi
            # 살아 있거나 소유성이 불확실하면 wait로 진입하지 않는다.
            [[ $cold_stderr_state == terminal || $cold_stderr_state == gone ]] || return 125
            cold_stderr_wait_status=0
            wait "$cold_stderr_pid" || cold_stderr_wait_status=$?
            cold_stderr_reaped=true
            [[ $cold_stderr_timed_out == false ]] || return 124
            return "$cold_stderr_wait_status"
          }
          cold_provider before
          [[ ! -e "$cold_proof/prepared-cold-bootstrap.exec" && ! -L "$cold_proof/prepared-cold-bootstrap.exec" ]]
          [[ ! -e "$cold_proof/prepared-cold-bootstrap.stderr" && ! -L "$cold_proof/prepared-cold-bootstrap.stderr" ]]
          [[ ! -e "$cold_proof/cold-stderr.start.stat" && ! -L "$cold_proof/cold-stderr.start.stat" ]]
          cold_started=$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')
          cold_parent=$BASHPID
          # 이 background PID는 stderr 수집기뿐이다. tracer는 기존 foreground/PGID를 유지한다.
          # tee에만 512MiB/file 상한을 적용하며 overflow/수집기 실패도 단계 실패다.
          # --debug 증가량은 미실측이다. 같은 상한으로 관측하며 unknown 거부는 유지한다.
          exec {cold_stderr_fd}> >(
            ulimit -f 524288 || exit 1
            IFS= read -r cold_row < "/proc/$BASHPID/stat" || exit 1
            printf '%s\n' "$cold_row" > "$cold_proof/cold-stderr.start.stat" || exit 1
            exec /usr/bin/tee "$cold_proof/prepared-cold-bootstrap.stderr" >&2
          )
          cold_stderr_pid=$!
          cold_status=0
          (
            exec {cold_stderr_fd}>&- || exit 1
            # exec 직전 PID/start ticks를 기록하고 같은 PID로 strace를 실행한다. 별도 PGID/kill은 없다.
            cold_pid=$BASHPID
            IFS= read -r cold_stat < "/proc/$cold_pid/stat" || exit 1
            [[ $cold_stat == "$cold_pid "* && ${#cold_stat} -le 4096 ]] || exit 1
            cold_tail=${cold_stat##*) }
            read -r -a cold_fields <<< "$cold_tail" || exit 1
            [[ ${#cold_fields[@]} -ge 20 && ${cold_fields[19]} =~ ^[0-9]+$ ]] || exit 1
            printf '%s\n' "$cold_stat" > "$cold_proof/cold-tracer.start.stat" || exit 1
            printf 'pid=%s\nstart_ticks=%s\nppid=%s\npgrp=%s\nsession=%s\nuid=%s\neuid=%s\nidentity_phase=before_exec_same_pid\n' "$cold_pid" "${cold_fields[19]}" "${cold_fields[1]}" "${cold_fields[2]}" "${cold_fields[3]}" "$UID" "$EUID" > "$cold_proof/cold-tracer.identity" || exit 1
            OPENPILOT_CI_PREPARED_RUST_ROOT="$CI_PREPARED_RUST_ROOT" OPENPILOT_CI_PREPARED_RUST_MANIFEST="$CI_PREPARED_RUST_MANIFEST" exec \
              /usr/bin/strace --debug --seccomp-bpf -f -qq -s 65535 -e trace=execve,execveat -o "$CI_JOB_TEMP/proof/prepared-cold-bootstrap.exec" \
              "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          ) 2>&"$cold_stderr_fd" || cold_status=$?
          cold_records_status=0
          # noclobber로 tracer 종료 상태를 먼저 보존한다. 수집기 회수가 실패해도 이 값은 남는다.
          printf 'shell_wait_status=%s\n' "$cold_status" > "$cold_proof/cold-tracer.status" || cold_records_status=1
          exec {cold_stderr_fd}>&- || cold_records_status=1
          cold_stderr_status=0
          cold_stderr_wait_status=not_waited
          cold_stderr_state=unknown
          cold_stderr_timed_out=false
          cold_stderr_reaped=false
          cold_collect_stderr 100 20 || cold_stderr_status=$?
          cold_ended=$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ') || cold_records_status=1
          if ! cold_stderr_bytes=$(stat -c '%s' -- "$cold_proof/prepared-cold-bootstrap.stderr"); then
            cold_stderr_bytes=unavailable
            cold_records_status=1
          fi
