name: Fast checks
on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, dev-md, main]
  workflow_dispatch:
    inputs:
      onnx_only:
        description: Run only focused ONNX regressions on a hosted runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    if: github.event_name != 'workflow_dispatch' || !inputs.onnx_only
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Keep dev-md changes out of dev
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" = dev ]; then
            echo 'dev-md upstream ports must not be integrated into dev (issue #338).' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
      - name: Check changed Python syntax and whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/check_changed_files.py
      - name: Check CI routing and upstream synchronization guards
        run: |
          python -m unittest discover -s tools/ci/tests -v
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/ci/tests -q tools/ci/tests/test_native_disk_guard.py
          python -m unittest discover -s tools/naver_ci/tests -v
      - name: Fast navigation regressions
        run: |
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_naver_input_smoke.py \
            openpilot/selfdrive/carrot/tests/test_naver_navigation_protocol.py \
            openpilot/selfdrive/carrot/tests/test_navigation_sources.py
      - name: Wiki documentation regressions
        run: python -m unittest discover -s tools/docs/wiki_settings/tests -p 'test_*.py' -v
      - name: Jetlink package and protocol regressions
        run: |
          python -m pip install -r tools/jetlink_model/requirements.lock
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink_model/tests -q tools/jetlink_model/tests
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/modeld/tests -q openpilot/selfdrive/modeld/tests/test_jetlink*.py
          bash -n openpilot/selfdrive/modeld/jetlink/setup_gadget.sh
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Android Jetlink core regressions
        run: bash tools/jetlink_android/gradlew -p tools/jetlink_android :core:test :runtime:test
  cadence:
    if: github.event_name == 'workflow_dispatch' && inputs.onnx_only
    name: ONNX cadence regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reserve space before dependencies and builds
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h "$RUNNER_TEMP"
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev
          rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: onnx-cadence-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: onnx-cadence-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Mixed-remote LFS checkout regression
        run: python3 -m unittest discover -s tools/ci/tests -p test_lfs_endpoint.py -v
      - run: cargo test --manifest-path rust/Cargo.toml -p openpilot-xiaoge --test cadence --locked
