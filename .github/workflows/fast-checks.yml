name: Fast checks
on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, dev-md, main]
  workflow_dispatch:
    inputs:
      onnx_only:
        description: Run only focused ONNX regressions on a hosted runner
        type: boolean
        default: false
      gpu_native_only:
        description: Build OpenCL-capable providers and run focused native contracts on host and ARM
        type: boolean
        default: false
      gpu_only:
        description: Run focused GPU policy and telemetry contracts on a hosted runner
        type: boolean
        default: false
      compute_only:
        description: Compare unchanged model results and compute costs on hosted ARM
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fast-${{ github.event_name }}-${{ github.ref }}-${{ inputs.gpu_native_only && 'gpu-native' || inputs.gpu_only && 'gpu-policy' || 'standard' }}
  cancel-in-progress: true
jobs:
  fast:
    if: github.event_name != 'workflow_dispatch' || (!inputs.onnx_only && !inputs.compute_only && !inputs.gpu_only && !inputs.gpu_native_only)
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Keep dev-md changes out of dev
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" = dev ]; then
            echo 'dev-md upstream ports must not be integrated into dev (issue #338).' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
      - name: Check changed Python syntax and whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/check_changed_files.py
      - name: Check CI routing and upstream synchronization guards
        run: |
          python -m unittest discover -s tools/ci/tests -v
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/ci/tests -q tools/ci/tests/test_native_disk_guard.py
          python -m unittest discover -s tools/naver_ci/tests -v
      - name: Fast navigation regressions
        run: |
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_naver_input_smoke.py \
            openpilot/selfdrive/carrot/tests/test_naver_navigation_protocol.py \
            openpilot/selfdrive/carrot/tests/test_navigation_sources.py
      - name: Wiki documentation regressions
        run: python -m unittest discover -s tools/docs/wiki_settings/tests -p 'test_*.py' -v
      - name: Jetlink package and protocol regressions
        run: |
          python -m pip install -r tools/jetlink_model/requirements.lock
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink_model/tests -q tools/jetlink_model/tests
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/modeld/tests -q openpilot/selfdrive/modeld/tests/test_jetlink*.py
          bash -n openpilot/selfdrive/modeld/jetlink/setup_gadget.sh
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Android Jetlink core regressions
        run: bash tools/jetlink_android/gradlew -p tools/jetlink_android :core:test :runtime:test
  cadence:
    if: github.event_name == 'workflow_dispatch' && inputs.onnx_only
    name: ONNX focused regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reserve space before dependencies and builds
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h "$RUNNER_TEMP"
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev
          rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: onnx-cadence-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: onnx-cadence-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Mixed-remote LFS checkout regression
        run: python3 -m unittest discover -s tools/ci/tests -p test_lfs_endpoint.py -v
      - run: cargo test --manifest-path rust/Cargo.toml -p openpilot-xiaoge --lib --tests --locked
  compute:
    if: github.event_name == 'workflow_dispatch' && inputs.compute_only
    name: ONNX exact compute comparison (hosted ARM)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
      XIAOGE_BENCH_MODELS: ${{ github.workspace }}/openpilot/selfdrive/carrot/xiaoge/assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the frozen production oracle against its exact source
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          receipts = list(Path('rust/crates/xiaoge/tests/support').glob('*_0682e933.json'))
          assert len(receipts) == 3
          paths = set()
          for receipt in receipts:
            data = json.loads(receipt.read_text())
            assert data['source_commit'] == '0682e933d3fea06e8953ace63fc521a29ee02b6e'
            paths.add(data['path'])
            expected = subprocess.check_output(['git', 'show', data['source_commit'] + ':' + data['path']])
            actual = receipt.with_suffix('.rs').read_bytes()
            assert actual == expected and hashlib.sha256(actual).hexdigest() == data['sha256'], receipt
          assert paths == {'rust/crates/xiaoge/src/lane/head.rs', 'rust/crates/xiaoge/src/inference/lane.rs', 'rust/crates/xiaoge/src/inference/geometry.rs'}
          PY
      - name: Reserve space and install native benchmark dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 12288
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev cmake ninja-build g++ libzmq3-dev git-lfs nasm
          rustup toolchain install 1.94.0 --profile minimal
          echo "OPENPILOT_OPENCV_ROOT=$RUNNER_TEMP/xiaoge-compute-opencv" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/xiaoge-compute-opencv/install/lib" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            ${{ runner.temp }}/xiaoge-compute-opencv
          key: xiaoge-compute-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/crates/dev-tools/src/opencv_build.rs', 'rust/crates/opencv-runtime/native/opencv-defined-access.patch') }}-${{ github.sha }}
          restore-keys: xiaoge-compute-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/crates/dev-tools/src/opencv_build.rs', 'rust/crates/opencv-runtime/native/opencv-defined-access.patch') }}-
      - name: Build or verify the unchanged pinned OpenCV provider
        run: |
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 8192
          if [ -f "$OPENPILOT_OPENCV_ROOT/native-libraries.sha256" ]; then
            (cd "$OPENPILOT_OPENCV_ROOT" && sha256sum --check native-libraries.sha256)
          else
            cargo run --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --bin build-xiaoge-opencv -- --output "$OPENPILOT_OPENCV_ROOT"
          fi
          git lfs pull --include='openpilot/selfdrive/carrot/xiaoge/assets/*.onnx' --exclude=''
      - name: Require exact contracts before measuring release code
        run: cargo test --manifest-path rust/Cargo.toml -p openpilot-xiaoge --features native-skip-miri --lib --tests --locked
      - name: Compare the same inputs on the same ARM runner
        run: |
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096
          cargo run --quiet --release --manifest-path rust/Cargo.toml -p openpilot-xiaoge --features native-skip-miri --example xiaoge_compute_bench --locked > "$RUNNER_TEMP/xiaoge-compute.json"
      - name: Probe active-wait CPU cost without changing the shipped policy
        env:
          XIAOGE_BENCH_POLICY: no-active-wait-experiment
          OPENCV_THREAD_POOL_ACTIVE_WAIT_WORKER: '0'
          OPENCV_THREAD_POOL_ACTIVE_WAIT_MAIN: '0'
        run: rust/target/release/examples/xiaoge_compute_bench > "$RUNNER_TEMP/xiaoge-compute-no-active-wait.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xiaoge-compute-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xiaoge-compute.json
            ${{ runner.temp }}/xiaoge-compute-no-active-wait.json
            ${{ runner.temp }}/xiaoge-compute-opencv/receipt.json
            ${{ runner.temp }}/xiaoge-compute-opencv/native-libraries.sha256

  gpu-contracts:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_only
    name: Xiaoge GPU focused contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Reserve capacity before hosted dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev
          rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: xiaoge-gpu-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: xiaoge-gpu-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
      - name: GPU selection, fallback, bounded comparison and numeric contracts
        run: |
          cargo test --manifest-path rust/Cargo.toml -p openpilot-xiaoge --locked --lib --tests
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-xiaoge --locked --all-targets -- -D warnings
          python3 rust/ci/runtime/test_package_policy.py

  gpu-native:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_native_only
    name: Xiaoge OpenCL native (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 75
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
      OPENCV_TEST_GPU: reject
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Reserve capacity before dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 8192
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev cmake g++ libzmq3-dev git-lfs
          rustup toolchain install 1.94.0 --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: xiaoge-gpu-native-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: xiaoge-gpu-native-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Retrieve unchanged models and build fresh OpenCL provider
        run: |
          git lfs pull --include='openpilot/selfdrive/carrot/xiaoge/assets/*.onnx' --exclude=''
          cargo run --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --bin build-xiaoge-opencv -- --opencl --output "$RUNNER_TEMP/xiaoge-gpu-opencv"
          printf 'OPENPILOT_OPENCV_ROOT=%s/xiaoge-gpu-opencv\nLD_LIBRARY_PATH=%s/xiaoge-gpu-opencv/install/lib\nOPENCV_TEST_LANE_MODEL=%s/openpilot/selfdrive/carrot/xiaoge/assets/lane.onnx\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: CPU math, ownership, GPU rejection, priority mocks and log analysis
        run: |
          rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096
          cargo test --manifest-path rust/Cargo.toml -p openpilot-xiaoge -p openpilot-opencv-runtime --locked --features native-skip-miri --all-targets
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-xiaoge -p openpilot-opencv-runtime --locked --features native-skip-miri --all-targets -- -D warnings
          XIAOGE_BENCH_MODELS="$GITHUB_WORKSPACE/openpilot/selfdrive/carrot/xiaoge/assets" cargo run --manifest-path rust/Cargo.toml -p openpilot-xiaoge --locked --features native-skip-miri --example xiaoge_compute_bench -- --assert > "$RUNNER_TEMP/xiaoge-gpu-cpu-equivalence.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xiaoge-gpu-native-${{ matrix.runner }}-evidence
          path: |
            ${{ runner.temp }}/xiaoge-gpu-opencv/*.json
            ${{ runner.temp }}/xiaoge-gpu-opencv/*.log
            ${{ runner.temp }}/xiaoge-gpu-opencv/native-libraries.sha256
            ${{ runner.temp }}/xiaoge-gpu-cpu-equivalence.json
          retention-days: 7
