        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Admit exact private Fast source and Git history
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          test "$PWD" = "$DIAG_SOURCE"
          test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
      - name: Admit provisioned Rust without installing a second toolchain
        id: prepared_rust
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: '"$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Isolate original Python package installation
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          ((available >= 512 * 1024 * 1024))
          python -m venv "$CI_JOB_TEMP/venv"
          printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Check changed Python syntax and whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          OPENPILOT_CI_PREPARED_RUST_ROOT="$CI_PREPARED_RUST_ROOT" OPENPILOT_CI_PREPARED_RUST_MANIFEST="$CI_PREPARED_RUST_MANIFEST" \
            "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144
          cargo run --quiet --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --no-default-features --features changed-files-native --bin check-changed-files --
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Fast navigation regressions
        run: |
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_naver_input_smoke.py \
            openpilot/selfdrive/carrot/tests/test_naver_navigation_protocol.py \
            openpilot/selfdrive/carrot/tests/test_navigation_sources.py
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Jetlink package and protocol regressions
        run: |
          python -m pip install -r tools/jetlink_model/requirements.lock
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink_model/tests -q tools/jetlink_model/tests
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/modeld/tests -q openpilot/selfdrive/modeld/tests/test_jetlink*.py
          bash -n openpilot/selfdrive/modeld/jetlink/setup_gadget.sh
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Android Jetlink core regressions
        run: bash tools/jetlink_android/gradlew -p tools/jetlink_android :core:test :runtime:test
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Verify read-only Rust SDK contents and identities after maintained checks
        id: prepared_rust_final
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.prepared_rust.outcome == 'success') }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: '"$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" after'
      - name: Seal Fast source and index after all maintained checks
        id: source_final
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
          cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
          cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
          git diff --exit-code
          git diff --cached --exit-code
          df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
          cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
      - name: Retain Fast job ownership evidence
        id: fast_evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-fast-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_JOB_TEMP }}/proof
          if-no-files-found: error
          retention-days: 14
      - name: Clean only uploaded private Fast source
        id: fast_source_cleanup
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && env.DIAG_SOURCE_OWNER != '' && steps.source_final.outcome == 'success' && steps.prepared_rust_final.outcome == 'success') }}
        working-directory: ${{ github.workspace }}
        env:
          UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
          [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
          workspace=$DIAG_ACTIONS_WORKSPACE
          p=$DIAG_SOURCE_OWNER
          case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
          test -d "$p" && test ! -L "$p"
          test "$(realpath -e -- "$p")" = "$p"
          test "$(stat -c '%u' -- "$p")" = "$(id -u)"
          test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
          test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
          test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$DIAG_SOURCE" = "$p/source"
          test -d "$p/source" && test ! -L "$p/source"
          test "$(realpath -e -- "$p/source")" = "$p/source"
          rm -rf --one-file-system -- "$p"
      - name: Clean common owned Fast job temporary paths
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id != '' && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success') }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        with:
          cleanup: 'true'
  fast:
    name: fast checks
    if: ${{ always() }}
    needs: [native, native-tools, native-corpus, native-timing, native-alerts, native-alert-manager, python-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every fast worker to succeed
        env:
          NATIVE: ${{ needs.native.result }}
          NATIVE_TOOLS: ${{ needs.native-tools.result }}
          NATIVE_CORPUS: ${{ needs.native-corpus.result }}
          NATIVE_TIMING: ${{ needs.native-timing.result }}
          NATIVE_ALERTS: ${{ needs.native-alerts.result }}
          NATIVE_ALERT_MANAGER: ${{ needs.native-alert-manager.result }}
          PYTHON_ANDROID: ${{ needs.python-android.result }}
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          test "$NATIVE" = success
          test "$NATIVE_TOOLS" = success
          test "$NATIVE_CORPUS" = success
          test "$NATIVE_TIMING" = success
          test "$NATIVE_ALERTS" = success
          test "$NATIVE_ALERT_MANAGER" = success
          test "$PYTHON_ANDROID" = success
