name: 296 diagnostic-only guarded-copy IEEE boundaries (boundary-only)
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-road-general-boundaries-only-296-once.yml
permissions:
  contents: read
jobs:
  boundaries:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample:
        - 0
        - 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: c8e195c5950259f9fea70c9876045814f07e6445
      SAMPLE: ${{ matrix.sample }}
      LLVM_PATH: /usr/lib/llvm-18/lib/libLLVM.so.1
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/tinygrad_repo
    steps:
    - uses: actions/checkout@v7
      with:
        ref: c8e195c5950259f9fea70c9876045814f07e6445
        persist-credentials: false
    - name: Observe natural host eligibility (never force an ISA target)
      id: host
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/guarded-boundaries\"\nmkdir -p \"$proof\"\ntest \"$(git rev-parse HEAD)\"\
        \ = \"$EXPECTED_SOURCE\"\nuname -a > \"$proof/uname.txt\"\nlscpu --json > \"$proof/lscpu.json\"\ncat /proc/cpuinfo\
        \ > \"$proof/proc-cpuinfo.txt\"\nif [[ \"$(uname -m)\" == x86_64 ]] && awk '/^flags/{n++; if ($0 !~ / avx512f / ||\
        \ $0 !~ / avx512vl / || $0 !~ / avx512bw / || $0 !~ / avx512dq /) bad=1} END{exit(n==0 || bad)}' /proc/cpuinfo; then\n\
        \  echo eligible=true >> \"$GITHUB_OUTPUT\"\nelse\n  echo eligible=false >> \"$GITHUB_OUTPUT\"\n  printf '%s\\n' '{\"\
        result\":\"SKIPPED_NATURAL_HOST_LACKS_REQUIRED_AVX512\",\"numerical_checks_executed\":false,\"diagnostic_only\":true,\"\
        retirement_acceptance\":false}' > \"$proof/skip.json\"\nfi\n"
    - name: Check space and install only LLVM boundary prerequisites
      if: steps.host.outputs.eligible == 'true'
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang libllvm18 binutils gcc

        '
    - uses: actions/setup-python@v6
      if: steps.host.outputs.eligible == 'true'
      with:
        python-version: '3.12'
    - name: Verify accepted full-graph receipt and function binding; run 152 boundary rows only
      if: steps.host.outputs.eligible == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/guarded-boundaries\"\nmkdir -p \"$proof\"\npython -VV > \"$proof/python-version.txt\"\
        \ 2>&1\nclang --version > \"$proof/clang-version.txt\"\nobjdump --version > \"$proof/objdump-version.txt\"\ndpkg-query\
        \ -W llvm-18 clang-18 binutils > \"$proof/apt-tool-versions.txt\"\npython -m pip freeze > \"$proof/providers.before.txt\"\
        \ngh api repos/bin9208/openpilot-rust/actions/artifacts/12404776700/zip > \"$proof/accepted-full-evidence.zip\"\n\
        test \"$(stat -c %s \"$proof/accepted-full-evidence.zip\")\" -eq 4391525\nprintf '%s  %s/accepted-full-evidence.zip\\\
        n' ba28ae07b5becc3afe4346db3e86437f9a93aaaf02031c19f83e070ad9c7d93b \"$proof\" | sha256sum --check --strict\nprintf\
        \ '%s' ''\
        \ | base64 --decode > \"$proof/road_guarded_copy.py\"\nprintf '%s  %s/road_guarded_copy.py\\n' fc4cf00ee664940d225ea1101d0c5e0bfc31892b870e636d0a1a4e5e479f609d\
        \ \"$proof\" | sha256sum --check --strict\npython - <<'VERIFY'\nimport ast, hashlib, json, os, zipfile\nfrom pathlib\
        \ import Path\nproof=Path(os.environ['RUNNER_TEMP'])/'guarded-boundaries'\nexpected={'rewrite':'18ca6de339c413b063f5efd10f65f8156a76367488d926bb8258f4b963a72b05','compile_observed':'cdfb2cfd4cf17a1ca9d8dbe56466db13f7d855a46082e9e28b1b428edfa15abc'}\n\
        def functions(source):\n  tree=ast.parse(source); found={}\n  for node in tree.body:\n    if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))\
        \ and node.name in expected:\n      found[node.name]=hashlib.sha256(ast.dump(node,include_attributes=False).encode()).hexdigest()\n\
        \  assert found==expected, found\n  return found\nwith zipfile.ZipFile(proof/'accepted-full-evidence.zip') as z:\n\
        \  assert len(z.infolist())==133 and z.testzip() is None\n  names={'road_guarded_copy.py','first-kernel/guarded-copy-result.json'}\n\
        \  assert names.issubset(set(z.namelist()))\n  accepted=z.read('road_guarded_copy.py').decode()\n  old=json.loads(z.read('first-kernel/guarded-copy-result.json'))\n\
        \  \ncurrent=(proof/'road_guarded_copy.py').read_text()\nfunctions(accepted); functions(current)\nassert old['diagnostic_only']\
        \ and old['retirement_acceptance'] is False\nassert old['complete_output_bytes']==10304 and old['complete_output_sha256']=='9afb2defff4ff29e5bf70e54db32d0d531d5e2b44507c8de652ee2c0dfcb67fe'\n\
        assert old['matches_frozen_original'] is True and old['input_only_bases_unchanged'] is True\nassert old['emitted_copy_proved']\
        \ is False\nreport={'accepted_run_id':39729562958,'accepted_artifact_id':12404776700,'artifact_zip_bytes':4391525,'artifact_zip_sha256':'ba28ae07b5becc3afe4346db3e86437f9a93aaaf02031c19f83e070ad9c7d93b','all_zip_crc_members_verified':133,'reused_full_output_bytes':10304,'reused_full_output_sha256':old['complete_output_sha256'],'reused_full_match':True,'reused_poststate_base_ids':[9,16,328,329,330,331,332,333],'full_graph_rerun':False,'emitted_copy_proved':False,'rewrite_and_compile_observed_ast_sha256':expected,'expanded_boundary_helper_sha256':'fc4cf00ee664940d225ea1101d0c5e0bfc31892b870e636d0a1a4e5e479f609d','diagnostic_only':True,'retirement_acceptance':False}\n\
        (proof/'reused-full-graph-evidence.json').write_text(json.dumps(report,indent=2)+'\\n')\nVERIFY\nLLVM_PATH=/usr/lib/llvm-18/lib/libLLVM.so.1\n\
        test -f \"$LLVM_PATH\"\ntest \"$(sha256sum \"$LLVM_PATH\" | cut -d' ' -f1)\" = 5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0\n\
        test \"$(sha256sum \"$(command -v clang)\" | cut -d' ' -f1)\" = 8ef402d453d1ba4902e4ee0f0f847f6cfa01400c95aa43c24e97818b9c0e3f45\n\
        test \"$(sha256sum \"$(command -v objdump)\" | cut -d' ' -f1)\" = 325c4205a4c658a9d1e1ebc469ae55975a2b897a3d3c1e79d9b158612d37f745\n\
        cat > \"$proof/fp-observe.c\" <<'C'\n#include <fenv.h>\n#include <stdint.h>\n\n/* Hosted x86-64 observation only.\
        \ Never changes the floating-point environment. */\nuint32_t diagnostic_mxcsr(void) {\n  uint32_t value;\n  __asm__\
        \ volatile(\"stmxcsr %0\" : \"=m\"(value));\n  return value;\n}\n\nint diagnostic_round(void) { return fegetround();\
        \ }\nC\nprintf '%s  %s/fp-observe.c\\n' ee273173c5a3c0c26739aa70a382b51b182d6b13937622ab2177cfae84f964d4 \"$proof\"\
        \ | sha256sum --check --strict\npython - <<'SRC'\nimport hashlib, json\nfrom pathlib import Path\nroot=Path('tinygrad_repo')\n\
        expected={\n  'tinygrad/runtime/support/compiler_cpu.py':'db106591197315ecf28f0e15de99d2841c9892e6e58290213c62c598e7014139',\n\
        \  'tinygrad/runtime/autogen/llvm.py':'b9bca21686da3f55612f128d8f8170b7544cee72a23352049c526d3694488a0d',\n  'tinygrad/runtime/support/c.py':'0899ca9748d7150e55afd05e0de9443cbba2ac3bbf5b80807723b17b79fbc684',\n\
        \  'tinygrad/device.py':'7c28ae3854a3f009fc6eddfb52f03b3d382a23b581d94a3c4741a12bdc79f008',\n  'tinygrad/helpers.py':'24c347d2137c92e1dc35d78cd9df45b38d31cc4d34729a35215f8822b3f2f6fb',\n\
        \  'tinygrad/runtime/support/elf.py':'ed0340b507c8fb23f1fa1ae1b3ca1297006d70c289a016233d9f1d5291801aa8'}\nactual={name:hashlib.sha256((root/name).read_bytes()).hexdigest()\
        \ for name in expected}\nassert actual==expected, actual\nPath(__import__('os').environ['RUNNER_TEMP'],'guarded-boundaries','tinygrad-source-pins.json').write_text(json.dumps(actual,indent=2)+'\\\
        n')\nSRC\nclang -shared -fPIC -O0 -o \"$proof/fp-observe.so\" \"$proof/fp-observe.c\" -lm\ncat > \"$proof/run-boundaries.py\"\
        \ <<'PY'\nimport ctypes, hashlib, json, os, shutil, subprocess, sys\nfrom pathlib import Path\nproof=Path(os.environ['RUNNER_TEMP'])/'guarded-boundaries'\n\
        sys.path.insert(0,str(proof))\nimport road_guarded_copy as helper\nfrom tinygrad.runtime.support.compiler_cpu import\
        \ CPULLVMCompiler, llvm\nfenv=ctypes.CDLL(str(proof/'fp-observe.so'))\nfenv.diagnostic_mxcsr.restype=ctypes.c_uint32\n\
        fenv.diagnostic_round.restype=ctypes.c_int\ndef fp(): return {'mxcsr':int(fenv.diagnostic_mxcsr()),'fegetround':int(fenv.diagnostic_round())}\n\
        def controls(v): return (v['mxcsr'] & 0xffc0,v['fegetround'])\ndef identity(path):\n  st=path.stat()\n  with path.open('rb')\
        \ as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()\n  return {'bytes':st.st_size,'sha256':digest,'dev':st.st_dev,'ino':st.st_ino,'mode':st.st_mode,'mtime_ns':st.st_mtime_ns,'ctime_ns':st.st_ctime_ns}\n\
        library=Path(os.environ['LLVM_PATH']).resolve(strict=True)\ntool_paths=[library,*[Path(shutil.which(n)).resolve(strict=True)\
        \ for n in ('clang','objdump')]]\nprovider_before={str(p):identity(p) for p in tool_paths}\nwanted={'/usr/lib/llvm-18/lib/libLLVM.so.1':'5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0','/usr/lib/llvm-18/bin/clang':'8ef402d453d1ba4902e4ee0f0f847f6cfa01400c95aa43c24e97818b9c0e3f45','/usr/bin/x86_64-linux-gnu-objdump':'325c4205a4c658a9d1e1ebc469ae55975a2b897a3d3c1e79d9b158612d37f745'}\n\
        if {name:value['sha256'] for name,value in provider_before.items()}!=wanted: raise RuntimeError('hosted LLVM/compiler/objdump\
        \ provider differs from pinned accepted toolchain')\nbefore_fp=fp()\nif before_fp['fegetround']!=0 or before_fp['mxcsr']&0x6000\
        \ or before_fp['mxcsr']&0x8000:\n  raise RuntimeError('host FP controls are not RNE with FTZ disabled; no boundary\
        \ rows accepted')\ncompiler=CPULLVMCompiler(['x86_64','native'])\ncpu=ctypes.string_at(llvm.LLVMGetHostCPUName()).decode()\n\
        features=ctypes.string_at(llvm.LLVMGetHostCPUFeatures()).decode()\nout=proof/'boundary-output';out.mkdir()\nrows=helper.boundary(compiler,out,fp,controls)\n\
        if len(rows)!=152: raise RuntimeError(f'expected 152 rows, got {len(rows)}')\nif any(controls(r['fp_before'])!=controls(before_fp)\
        \ or controls(r['fp_after'])!=controls(before_fp) for r in rows):\n  raise RuntimeError('FP control state drifted\
        \ from initial RNE/no-FTZ controls')\nloaded={Path(x.split()[-1]).resolve() for x in Path('/proc/self/maps').read_text().splitlines()\
        \ if len(x.split())>=6 and x.split()[-1].startswith('/') and 'libLLVM' in x.split()[-1]}\ntools=[Path(shutil.which(n)).resolve(strict=True)\
        \ for n in ('clang','objdump')]\npaths=sorted(loaded|set(tools))\npins={str(p):identity(p) for p in paths}\nif pins!=provider_before\
        \ or {name:value['sha256'] for name,value in pins.items()}!=wanted: raise RuntimeError('compiler/provider identity\
        \ changed during boundary compile')\nif str(library) not in {str(p.resolve()) for p in loaded}: raise RuntimeError('CPULLVMCompiler\
        \ did not load pinned LLVM library')\nif len(rows)!=152: raise RuntimeError('boundary row count changed')\ninfo={'result':'BOUNDARY_ONLY_PASS','comparison_executed':True,'diagnostic_only':True,'retirement_acceptance':False,'matrix_sample':int(os.environ['SAMPLE']),'natural_host_cpu_name':cpu,'natural_host_features':features,'native_target_requested':['x86_64','native'],'fp_initial':before_fp,'fp_controls':'RNE,\
        \ FTZ disabled; DAZ observed and retained as-is','sticky_flags_recorded_per_row':True,'boundary_rows':len(rows),'boundary_functions':4,'llvm_passes':compiler.passes.decode(),'provider_tool_pins_before':provider_before,'provider_tool_pins_after':pins,'providers_freeze_before':(proof/'providers.before.txt').read_text().splitlines()}\n\
        (proof/'boundary-run.json').write_text(json.dumps(info,indent=2)+'\\n')\nafter=subprocess.check_output([sys.executable,'-m','pip','freeze'],text=True)\n\
        (proof/'providers.after.txt').write_text(after)\nif after!=(proof/'providers.before.txt').read_text(): raise RuntimeError('Python\
        \ provider set changed')\nPY\npython \"$proof/run-boundaries.py\"\n"
    - name: Upload boundary-only evidence (never graph/model inputs)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: road-ieee-boundaries-${{ matrix.sample }}
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
        path: ${{ runner.temp }}/guarded-boundaries/
