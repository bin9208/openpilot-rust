name: driver first convolution natural-host diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driver-first-convolution-296-once.yml
permissions:
  contents: read
jobs:
  driver-first-convolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_SOURCE: 69bbee211a5bfde590ab9d85fb071d967892b580
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      CPU_COUNT: '2'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 69bbee211a5bfde590ab9d85fb071d967892b580
        persist-credentials: false
    - name: Bind source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/driver-first-convolution-296"

        mkdir "$proof"

        printf ''DRIVER_FRESH_PROOF=%s\n'' "$proof" >> "$GITHUB_ENV"

        printf ''CARGO_TARGET_DIR=%s\n'' "$RUNNER_TEMP/driver-first-convolution-target" >> "$GITHUB_ENV"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 12288

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev
        libzmq3-dev jq binutils

        rustup toolchain install 1.94.0 --profile minimal

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned original model providers
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        python -m pip freeze > "$DRIVER_FRESH_PROOF/providers.before.txt"

        '
    - name: Build current native fixture, catalog, guarded helper and CPU runner once
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 6144

        test ! -e "$CARGO_TARGET_DIR"

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime -p openpilot-dev-tools --features
        openpilot-dev-tools/driver-daemon-native --bin model-run --bin offline-llvm-guarded-add --bin stage-driver-daemon-fixture
        --bin prepare-model-family-catalog > "$DRIVER_FRESH_PROOF/build.log" 2>&1 || { tail -n 100 "$DRIVER_FRESH_PROOF/build.log";
        exit 1; }

        helper=$(realpath "$CARGO_TARGET_DIR/debug/offline-llvm-guarded-add")

        printf ''MODEL_LLVM_GUARDED_ADD_BINARY=%s\n'' "$helper" >> "$GITHUB_ENV"

        printf ''MODEL_LLVM_GUARDED_ADD_SHA256=%s\n'' "$(sha256sum "$helper" | cut -d'' '' -f1)" >> "$GITHUB_ENV"

        printf ''DRIVER_MODEL_RUN=%s\n'' "$(realpath "$CARGO_TARGET_DIR/debug/model-run")" >> "$GITHUB_ENV"

        '
    - name: Record natural CPU, provider and toolchain
      shell: bash
      run: "set -euo pipefail\nproof=\"$DRIVER_FRESH_PROOF\"\ntest \"$(uname -m)\" = x86_64\nlscpu --json > \"$proof/cpu-profile.json\"\
        \ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nrustc -vV > \"$proof/rustc-version.txt\"\nuname -a > \"$proof/uname.txt\"\
        \nclang --version > \"$proof/clang-version.txt\"\nobjdump --version > \"$proof/objdump-version.txt\"\nsha256sum \"\
        $(readlink -f \"$(command -v objdump)\")\" \"$(readlink -f \"$(command -v clang)\")\" > \"$proof/tool-images.sha256\"\
        \n# Refuse unrequested native cached admission or externally overridden compile policy.\nfor key in MODEL_CACHED_CODE_HELPER\
        \ MODEL_CACHED_CODE_HELPER_SHA256 MODEL_CACHED_ORIGINAL MODEL_CACHED_NATIVE LLVMOPT CC CFLAGS CXXFLAGS RUSTFLAGS;\
        \ do\n  test -z \"${!key-}\"\ndone\n"
    - name: Stage original inputs and compile fresh native driver catalog
      shell: bash
      run: "set -euo pipefail\nproof=\"$DRIVER_FRESH_PROOF\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"\
        $RUNNER_TEMP\" --growth-mib 6144\n\"$CARGO_TARGET_DIR/debug/stage-driver-daemon-fixture\" --root \"$GITHUB_WORKSPACE\"\
        \ --output \"$proof/driver-fixture\" > \"$proof/fixture-stage.json\"\nmodels=\"$proof/driver-fixture/no-collector/models\"\
        \nmanifest=\"$proof/driver-fixture/no-collector/observations/reference-manifest.json\"\ntimeout --signal=TERM --kill-after=15s\
        \ 900s \"$CARGO_TARGET_DIR/debug/prepare-model-family-catalog\" --root \"$GITHUB_WORKSPACE\" --models \"$models\"\
        \ --expected-model-manifest \"$manifest\" --expected-model-manifest-sha256 1b8e6cea511e9f212cd7737688b3e2ec0a165b9ff985b492f0e98c4639f18380\
        \ --kind driver --python \"$(command -v python)\" --llvm \"$LLVM_PATH\" --output \"$proof/driver-catalog\" > \"$proof/catalog.stdout\"\
        \ 2> \"$proof/catalog.stderr\" || { tail -n 100 \"$proof/catalog.stderr\"; exit 1; }\n\"$DRIVER_MODEL_RUN\" --check-catalog\
        \ \"$proof/driver-catalog/catalog\" > \"$proof/catalog-check.json\"\ngeneration=$(jq -er .generation \"$proof/driver-catalog/catalog/current.json\"\
        )\nindex=\"$proof/driver-catalog/catalog/$generation/index.json\"\ntest \"$(jq '[.bundles[] | select(.kind == \"driver\"\
        \ and .camera == [1344,760])] | length' \"$index\")\" = 1\ndirectory=$(jq -er '.bundles[] | select(.kind == \"driver\"\
        \ and .camera == [1344,760]) | .directory' \"$index\")\nbundle=\"$proof/driver-catalog/catalog/$generation/$directory\"\
        \njq -e '.backend == \"cpu-llvm\" and .cached_code == null' \"$bundle/graph.json\"\nprintf '%s\\n' \"$bundle\" > \"\
        $proof/driver-bundle-path.txt\"\nfor expected in expected-0.bin expected-1.bin; do\n  cp \"$proof/driver-fixture/collector-current/observations/1344-raw-1/reference/$expected\"\
        \ \"$proof/$expected\"\ndone\n"
    - name: Materialize sealed observer and snapshot provenance
      shell: bash
      run: 'set -euo pipefail

        proof="$DRIVER_FRESH_PROOF"

        base64 --decode > "$proof/capture.py" <<''PAYLOAD''

        

        PAYLOAD

        printf ''%s  %s\n'' ''d2781af8bcf0ee87fb89f5ccc917d90f7d99953076cb45cce305b7557ff52d61'' "$proof/capture.py" | sha256sum
        -c -

        base64 --decode > "$proof/seal.py" <<''PAYLOAD''

        

        PAYLOAD

        printf ''%s  %s\n'' ''d4ae7b77dc450b718303334f322ae8bb5ab345a9894edb68e86a32331658b172'' "$proof/seal.py" | sha256sum
        -c -

        base64 --decode > "$proof/fp-observe.c" <<''PAYLOAD''

        

        PAYLOAD

        printf ''%s  %s\n'' ''d21e41ab0a3ca8028e54fcf534929f2799fa2f43a0bbac9c67665e03d5f5d5ca'' "$proof/fp-observe.c" | sha256sum
        -c -

        cc -shared -fPIC -O0 -o "$proof/fp-observe.so" "$proof/fp-observe.c" -lm

        timeout --signal=TERM --kill-after=15s 180s python "$proof/seal.py" before

        '
    - name: Capture actual original JIT and native same-call arithmetic once
      shell: bash
      id: capture
      run: 'set -euo pipefail

        proof="$DRIVER_FRESH_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        status=0

        timeout --signal=TERM --kill-after=15s 1200s python "$proof/capture.py" > "$proof/capture.stdout" 2> "$proof/capture.stderr"
        || status=$?

        printf ''%s\n'' "$status" > "$proof/capture.exit"

        if [ "$status" -ne 0 ]; then tail -n 100 "$proof/capture.stderr"; fi

        exit "$status"

        '
    - name: Verify immutable inputs and newly compiled pair after capture
      shell: bash
      if: ${{ always() && steps.capture.outcome != 'skipped' }}
      run: 'set -euo pipefail

        proof="$DRIVER_FRESH_PROOF"

        test -f "$proof/seal.before.json"

        timeout --signal=TERM --kill-after=15s 180s python "$proof/seal.py" after

        python -m pip freeze > "$proof/providers.after.txt"

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt"

        sha256sum -c "$proof/tool-images.sha256" > "$proof/tool-images.after.txt"

        "$DRIVER_MODEL_RUN" --check-catalog "$proof/driver-catalog/catalog" > "$proof/catalog-check.after.json"

        test -f "$proof/capture/result.json"

        jq -e ''.diagnostic_only == true and .retirement_acceptance == false and .actual_contraction_pairing_proved == false''
        "$proof/capture/result.json"

        printf ''%s\n'' ''SEALED_DIAGNOSTIC_ONLY'' > "$proof/seal.status"

        '
    - name: Disassemble only this capture and bound artifact size
      shell: bash
      id: package
      if: ${{ always() }}
      run: "set -euo pipefail\nproof=\"$DRIVER_FRESH_PROOF\"\ntest -d \"$proof\"\nif [ -d \"$proof/capture\" ]; then\n  for\
        \ file in \"$proof\"/capture/*-original-image.bin \"$proof\"/capture/*-op_impl_*.bin \"$proof\"/capture/*-op_kernel_*.bin;\
        \ do\n    [ -f \"$file\" ] || continue\n    timeout 30s objdump -D -b binary -m i386:x86-64 -M intel \"$file\" > \"\
        $file.asm\"\n  done\nfi\n# Do not upload Cargo targets or reuse them in a later job.\nsize=$(du -sb \"$proof\" | cut\
        \ -f1)\nprintf '%s\\n' \"$size\" > \"$proof/artifact-bytes.txt\"\nif [ \"$size\" -gt 536870912 ]; then\n  printf '%s\\\
        n' 'diagnostic artifact exceeds 512 MiB; incomplete capture' > \"$proof/artifact-bound-failure.txt\"\n  exit 1\nfi\n\
        find \"$proof\" -type f ! -name ARTIFACT.SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > \"$proof/ARTIFACT.SHA256SUMS\"\
        \n"
    - name: Retain bounded diagnostic or failure
      if: ${{ always() && steps.package.outcome == 'success' }}
      uses: actions/upload-artifact@v6
      with:
        name: driver-first-convolution-${{ github.run_id }}
        path: ${{ runner.temp }}/driver-first-convolution-296/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
    - name: Retain small failure receipts when artifact bound fails
      if: ${{ always() && steps.package.outcome != 'success' }}
      uses: actions/upload-artifact@v6
      with:
        name: driver-first-convolution-failure-${{ github.run_id }}
        path: '${{ runner.temp }}/driver-first-convolution-296/*.txt

          ${{ runner.temp }}/driver-first-convolution-296/capture/failure.json

          ${{ runner.temp }}/driver-first-convolution-296/capture.exit'
        if-no-files-found: warn
        retention-days: 7
