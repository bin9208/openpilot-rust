name: 296 guarded-add actual R4 operands and prior12half eight-buffer gates
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-zero-r4-operands-296-once.yml
permissions:
  contents: read
  actions: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  road-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRIDGE_CATALOG_ROOTS: native-catalog:road-pipeline-1928:road-pipeline-1344:dm-pipeline-1928:dm-pipeline-1344:model-input-pipelines:driving-four-source
      EXPECTED_SOURCE: 1d5570e158bb7a799c4a816f78bc7f63f201d2a4
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 1d5570e158bb7a799c4a816f78bc7f63f201d2a4
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Reserve hosted capacity and separate fresh targets
      id: setup
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang libllvm18 liblzma-dev git-lfs capnproto libcapnp-dev jq

        rustup toolchain install 1.94.0 --profile minimal

        proof="$RUNNER_TEMP/road-runtime-provenance-296"

        mkdir "$proof" "$RUNNER_TEMP/road-provenance-artifact"

        printf ''ROAD_PROVENANCE_PROOF=%s\n'' "$proof" >> "$GITHUB_ENV"

        test ! -e "$RUNNER_TEMP/model-zero-current-target-296"

        test ! -e "$RUNNER_TEMP/model-zero-old-target-296"

        printf ''CARGO_TARGET_DIR=%s\n'' "$RUNNER_TEMP/model-zero-current-target-296" >> "$GITHUB_ENV"

        '
    - name: Admit frozen diagnostic payloads
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''PAYLOAD_ADMIT_HISTORY'' | gzip --decompress > "$ROAD_PROVENANCE_PROOF/admit_history.py"

        

        PAYLOAD_ADMIT_HISTORY

        printf ''%s  %s\n'' aa50f9fb2e84044f413691a424efefcf76c42f25b420811431eaff914b58c554 "$ROAD_PROVENANCE_PROOF/admit_history.py"
        | sha256sum --check --strict -

        base64 --decode <<''PAYLOAD_REPLAY_OPERANDS'' | gzip --decompress > "$ROAD_PROVENANCE_PROOF/replay_operands.py"

        

        PAYLOAD_REPLAY_OPERANDS

        printf ''%s  %s\n'' fa90a6242b5dc0a98051002b09908406ab9bb7c3e2b5f18727f154162aef4b2d "$ROAD_PROVENANCE_PROOF/replay_operands.py"
        | sha256sum --check --strict -

        base64 --decode <<''PAYLOAD_TRACE_ROAD_RUNTIME_IMAGES'' | gzip --decompress > "$ROAD_PROVENANCE_PROOF/trace_road_runtime_images.py"

        

        PAYLOAD_TRACE_ROAD_RUNTIME_IMAGES

        printf ''%s  %s\n'' 5f4e380f0634e4eb719158a76ee1e6ae84cff56b5c486bec21012b0c8c72285d "$ROAD_PROVENANCE_PROOF/trace_road_runtime_images.py"
        | sha256sum --check --strict -

        '
    - name: Validate held-seal data contract
      shell: bash
      run: "set -euo pipefail\npython - <<'SEAL_PREFLIGHT'\nimport ast,hashlib,json,os,stat,tempfile\nfrom pathlib import\
        \ Path\nproof=Path(os.environ['ROAD_PROVENANCE_PROOF'])\nsource=(proof/'trace_road_runtime_images.py').read_text()\n\
        tree=ast.parse(source)\nnodes=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name in ('identity','held')]\n\
        assert len(nodes)==2\nnamespace={'os':os,'stat':stat,'Path':Path,'sha':lambda raw:hashlib.sha256(raw).hexdigest()}\n\
        exec(compile(ast.Module(body=nodes,type_ignores=[]),'<stdlib-only-identity-preflight>','exec'),namespace)\nwith tempfile.TemporaryDirectory(prefix='seal-preflight-',dir=proof)\
        \ as directory:\n path=Path(directory)/'input';path.write_bytes(b'authentic bounded seal fixture')\n raw,seal=namespace['held'](path,4096)\n\
        \ expected=json.loads(json.dumps(seal));assert seal==expected\n historical=dict(seal,identity=tuple(seal['identity']));assert\
        \ historical!=json.loads(json.dumps(historical))\n rejected=[]\n for field in ('path','bytes','sha256'):\n  stale=json.loads(json.dumps(expected))\n\
        \  stale[field]=stale[field]+1 if field=='bytes' else stale[field]+'-stale'\n  assert seal!=stale;rejected.append(field)\n\
        \ for index in range(6):\n  stale=json.loads(json.dumps(expected));stale['identity'][index]+=1\n  assert seal!=stale;rejected.append('identity['+str(index)+']')\n\
        \ path.write_bytes(b'changed!! bounded seal fixture')\n _,changed=namespace['held'](path,4096);assert changed!=expected\n\
        \ rejected.append('actual-file-bytes')\n(proof/'seal-preflight.json').write_text(json.dumps({'R2_roundtrip_rejected':True,'R3_roundtrip_admitted':True,'stale_seals_rejected':rejected,'identity_fields_preserved':6,'provider_or_generated_code_executed':False},indent=2)+'\\\
        n')\nSEAL_PREFLIGHT\n"
    - name: Admit historical383CRC twelve-pattern eight-buffer evidence as data only
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 256

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12410064619/zip > "$proof/historical.zip"

        python "$proof/admit_history.py"

        '
    - name: Build exact old helper in its separate fresh target
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        git fetch --no-tags --depth=1 origin 1031884ccad7fa39957fb640aff70a03afade189

        GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$RUNNER_TEMP/old-guarded-source-296" 1031884ccad7fa39957fb640aff70a03afade189

        test "$(git -C "$RUNNER_TEMP/old-guarded-source-296" rev-parse HEAD)" = "1031884ccad7fa39957fb640aff70a03afade189"

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096

        CARGO_TARGET_DIR="$RUNNER_TEMP/model-zero-old-target-296" cargo build --manifest-path "$RUNNER_TEMP/old-guarded-source-296/rust/Cargo.toml"
        --locked -p openpilot-model-runtime --bin offline-llvm-guarded-add > "$proof/old-helper-build.log" 2>&1 || { cat "$proof/old-helper-build.log";
        exit 1; }

        cp "$RUNNER_TEMP/model-zero-old-target-296/debug/offline-llvm-guarded-add" "$proof/old-guarded-add"

        chmod 500 "$proof/old-guarded-add"

        git -C "$RUNNER_TEMP/old-guarded-source-296" ls-files -z -- rust/crates/model-runtime rust/Cargo.toml rust/Cargo.lock
        > "$proof/old-source-roster.nul"

        (cd "$RUNNER_TEMP/old-guarded-source-296"; xargs -0 -r sha256sum < "$proof/old-source-roster.nul") > "$proof/old-source-files.sha256"

        printf ''GUARDED_ADD_OLD_HELPER=%s\nGUARDED_ADD_OLD_SHA256=%s\n'' "$proof/old-guarded-add" "$(sha256sum "$proof/old-guarded-add"
        | cut -d'' '' -f1)" >> "$GITHUB_ENV"

        '
    - name: Build current source and exact maintained model providers
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run --bin offline-llvm-guarded-add
        --bin offline-llvm-compile > "$proof/runtime-build.log" 2>&1 || { cat "$proof/runtime-build.log"; exit 1; }

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''''

        cat > "$proof/fp-observe.c" <<''FP_OBSERVER''

        #include <stdint.h>

        #include <fenv.h>

        #include <xmmintrin.h>

        uint32_t diagnostic_mxcsr(void) { return _mm_getcsr(); }

        int diagnostic_round(void) { return fegetround(); }

        FP_OBSERVER

        clang -shared -fPIC -O2 -Wl,-z,defs "$proof/fp-observe.c" -lm -o "$proof/fp-observe.so"

        '
    - name: Record unmodified executing CPU with the exact R4 LLVM library
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        llvm=$(readlink -f /usr/lib/x86_64-linux-gnu/libLLVM-18.so)

        test -f "$llvm" && test ! -L "$llvm"

        # Exact provider used in actual R4; a changed package rejects without a retry.

        printf ''%s  %s\n'' 5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0 "$llvm" | sha256sum --check --strict
        - > "$proof/LLVM-R4-provider.after.log"

        printf ''LLVM_PATH=%s\nGUARDED_ADD_PROBE_CONFIG=%s\nGUARDED_ADD_PROBE_OUTPUT=%s\n'' "$llvm" "$proof/natural-host-config.json"
        "$proof/controls" >> "$GITHUB_ENV"

        export LLVM_PATH="$llvm"

        python - <<''NATURAL_HOST_CONFIG''

        import ctypes,hashlib,json,os,platform

        from pathlib import Path

        assert platform.machine()==''x86_64''

        proof=Path(os.environ[''ROAD_PROVENANCE_PROOF'']);path=Path(os.environ[''LLVM_PATH'']);raw=path.read_bytes()

        assert hashlib.sha256(raw).hexdigest()==''5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0''

        lib=ctypes.CDLL(str(path))

        for name in (''LLVMGetHostCPUName'',''LLVMGetHostCPUFeatures''):getattr(lib,name).restype=ctypes.c_char_p

        cpu=lib.LLVMGetHostCPUName().decode();features=lib.LLVMGetHostCPUFeatures().decode();assert cpu and features

        config=dict(library=str(path),library_sha256=hashlib.sha256(raw).hexdigest(),triple=''x86_64-none-unknown-elf'',cpu=cpu,features=features,passes=''default<O2>'',loop_unrolling=True,loop_vectorization=True,slp_vectorization=True,verify_each=True)

        (proof/''natural-host-config.json'').write_text(json.dumps(config,indent=2)+''\n'')

        (proof/''host-policy.json'').write_text(json.dumps(dict(actual_cpu=cpu,actual_features=features,requested_policy=''LLVM
        actual executing host, unchanged'',historical_recorded_target_forcing=False,ISA_execution_admission=''only fresh model/kernel
        code compiled for this actual host'',model_or_recorded_image_execution=True,archived_code_executed=False),indent=2)+''\n'')

        NATURAL_HOST_CONFIG

        printf ''%s\n'' ''Fresh model compile on this natural CPU; archived executable images never run. Recorded target strings
        are provenance only.'' > "$proof/operand-execution-policy.txt"

        '
    - name: Hold entire source/provider/old-current helper closure
      id: bind
      shell: bash
      run: "set -euo pipefail\nproof=\"$ROAD_PROVENANCE_PROOF\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nhelper=$(readlink\
        \ -f \"$CARGO_TARGET_DIR/debug/offline-llvm-guarded-add\")\ntest -x \"$helper\" && test ! -L \"$helper\"\nprintf 'MODEL_LLVM_GUARDED_ADD_BINARY=%s\\\
        nMODEL_LLVM_GUARDED_ADD_SHA256=%s\\n' \"$helper\" \"$(sha256sum \"$helper\" | cut -d' ' -f1)\" >> \"$GITHUB_ENV\"\n\
        # This is a separate provenance probe, never a source-absence acceptance run.\n# Hold all tracked source users, compiler\
        \ inputs, provider manifests and actual\n# ONNX bytes after LFS admission. No historical/source hash replacements.\n\
        git ls-files -z -- tinygrad_repo openpilot/selfdrive/modeld openpilot/common openpilot/system/camerad rust/tools/model_export\
        \ rust/tools/check_pipeline_reference.py rust/tools/build_model_pipelines.py rust/crates/model-runtime rust/Cargo.toml\
        \ rust/Cargo.lock rust/rust-toolchain.toml uv.lock > \"$proof/tracked-candidates.nul\"\n: > \"$proof/source-paths.nul\"\
        \nwhile IFS= read -r -d '' path; do\n case \"$path\" in *.py|*.rs|*.toml|*.lock|*.json|*.onnx) ;; *) continue ;; esac\n\
        \ test -f \"$path\" && test ! -L \"$path\"\n printf '%s\\0' \"$path\" >> \"$proof/source-paths.nul\"\ndone < \"$proof/tracked-candidates.nul\"\
        \nprintf '%s\\0' \"$helper\" \"$CARGO_TARGET_DIR/debug/model-run\" \"$(readlink -f \"$LLVM_PATH\")\" \"$(readlink\
        \ -f \"$(command -v python)\")\" \"$proof/trace_road_runtime_images.py\" >> \"$proof/source-paths.nul\"\n# Reject\
        \ stale helpers before original model/provider execution.\ncurrent_pin=$(sha256sum \"$helper\" | cut -d' ' -f1)\n\
        test \"$current_pin\" != \"$GUARDED_ADD_OLD_SHA256\"\nprintf 'old=%s\\ncurrent=%s\\n' \"$GUARDED_ADD_OLD_SHA256\"\
        \ \"$current_pin\" > \"$proof/distinct-source-helper-pins.txt\"\nprintf '%s\\0' \"$GUARDED_ADD_OLD_HELPER\" \"$CARGO_TARGET_DIR/debug/offline-llvm-compile\"\
        \ \"$proof/fp-observe.c\" \"$proof/fp-observe.so\" \"$proof/replay_operands.py\" \"$proof/admit_history.py\" \"$proof/natural-host-config.json\"\
        \ \"$(readlink -f \"$(command -v clang)\")\" >> \"$proof/source-paths.nul\"\nwhile IFS= read -r -d '' relative; do\
        \ printf '%s\\0' \"$RUNNER_TEMP/old-guarded-source-296/$relative\"; done < \"$proof/old-source-roster.nul\" >> \"\
        $proof/source-paths.nul\"\nxargs -0 -r sha256sum < \"$proof/source-paths.nul\" > \"$proof/sources.before.sha256\"\n\
        while IFS= read -r -d '' path; do stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\"; done < \"$proof/source-paths.nul\"\
        \ > \"$proof/sources.before.identities\"\npython -m pip freeze > \"$proof/providers.before.txt\"\nlscpu --json > \"\
        $proof/lscpu.json\"\ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nrustc -Vv > \"$proof/rustc.txt\"\nprintf '%s\\\
        n' \"$EXPECTED_SOURCE\" \"$GITHUB_WORKFLOW_SHA\" > \"$proof/source-workflow.txt\"\n"
    - name: Fresh original compile for the natural executing CPU
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        timeout --signal=KILL 1800 python "$proof/trace_road_runtime_images.py" compile > "$proof/compile.stdout" 2> "$proof/compile.stderr"
        || { tail -n 100 "$proof/compile.stdout" "$proof/compile.stderr"; exit 1; }

        test -s "$proof/fresh-driving.pkl" && test -s "$proof/fresh-driving.seal.json"

        '
    - name: Capture actual final-kernel operands and require unchanged strict two-frame comparison
      id: compare
      shell: bash
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        # Two-frame prefix reaches the observed model-1 failure boundary. Actual stock

        # original/native comparison still requires byte equality; never a relaxed gate.

        status=0

        timeout --signal=KILL 600 python "$proof/trace_road_runtime_images.py" compare > "$proof/compare.stdout" 2> "$proof/compare.stderr"
        || status=$?

        printf ''%s\n'' "$status" > "$proof/strict-prefix.status"

        tail -n 100 "$proof/compare.stdout" "$proof/compare.stderr"

        exit "$status"

        '
    - name: Require actual operands and prior12half complete eight-buffer poststates
      shell: bash
      if: always() && steps.bind.outcome == 'success'
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        status=0

        timeout --signal=KILL 600 python "$proof/replay_operands.py" > "$proof/operand-replay.stdout" 2> "$proof/operand-replay.stderr"
        || status=$?

        printf ''%s\n'' "$status" > "$proof/operand-replay.status"

        tail -n 80 "$proof/operand-replay.stdout" "$proof/operand-replay.stderr"

        exit "$status"

        '
    - name: Always hold provenance and require every new numerical gate
      shell: bash
      if: always() && steps.bind.outcome == 'success'
      run: 'set -euo pipefail

        proof="$ROAD_PROVENANCE_PROOF"

        status=0

        sha256sum --check --strict "$proof/sources.before.sha256" > "$proof/sources.after.log" 2>&1 || status=1

        while IFS= read -r -d '''' path; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$path" || status=1; done < "$proof/source-paths.nul"
        > "$proof/sources.after.identities"

        cmp "$proof/sources.before.identities" "$proof/sources.after.identities" || status=1

        python -m pip freeze > "$proof/providers.after.txt" || status=1

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt" || status=1

        test -s "$proof/compile/status.json" && test -s "$proof/compare/status.json" || status=1

        jq -e ''.exit==0 and .events>0 and .wrappers_delegated_unchanged==true'' "$proof/compile/status.json" > /dev/null
        || status=1

        jq -e ''.events>0 and .wrappers_delegated_unchanged==true'' "$proof/compare/status.json" > /dev/null || status=1

        test -s "$proof/original-output/files.json" && test -s "$proof/strict-prefix.status" || status=1

        jq -e ''length == 12 and has("model-0.bin") and has("model-1.bin")'' "$proof/original-output/files.json" > /dev/null
        || status=1

        # Archive only this bounded owned root, including real raw outputs on failure.

        find "$proof" -type l -print -quit > "$proof/unexpected-symlinks.txt"

        test ! -s "$proof/unexpected-symlinks.txt" || status=1

        size=$(du --bytes --summarize "$proof" | cut -f1)

        test "$size" -le 1073741824 || status=1

        test "$(cat "$proof/strict-prefix.status")" = 0 || status=1

        test "$(cat "$proof/operand-replay.status")" = 0 || status=1

        jq -e ''.actual_R4_operands==2 and .historical_exceptional_half_patterns==12 and .historical_baseline==1 and .poststate_buffers_per_case==8
        and .all_candidate_poststates_byte_exact==true and .provider_and_inputs_unchanged==true and .archived_code_executed==false
        and .full_model_or_compiler_acceptance==false'' "$proof/operand-replay/complete.json" >/dev/null || status=1

        printf ''%s\n'' "$status" > "$proof/final-guards.status"

        exit "$status"

        '
    - name: Freeze bounded raw diagnostics even on numerical failure
      shell: bash
      if: always() && steps.setup.outcome == 'success'
      run: "set -euo pipefail\nproof=\"$ROAD_PROVENANCE_PROOF\"\narchive=\"$RUNNER_TEMP/road-provenance-artifact\"\ntest -d\
        \ \"$proof\" && test ! -L \"$proof\"\nfind \"$proof\" -type l -print -quit > \"$archive/unexpected-symlinks.txt\"\n\
        test ! -s \"$archive/unexpected-symlinks.txt\"\nfind \"$proof\" -type f ! -name historical.zip -print0 > \"$archive/absolute-roster.nul\"\
        \n: > \"$archive/relative-roster.nul\"\n: > \"$archive/source-files.sha256\"\nfiles=0; bytes=0\nwhile IFS= read -r\
        \ -d '' file; do\n test -f \"$file\" && test ! -L \"$file\"\n size=$(stat -c '%s' \"$file\");test \"$size\" -le 134217728\n\
        \ files=$((files+1));bytes=$((bytes+size))\n test \"$files\" -le 20000 && test \"$bytes\" -le 1073741824\n case \"\
        $file\" in \"$proof\"/*) ;; *) exit 1 ;; esac\n printf '%s\\0' \"${file#\"$proof\"/}\" >> \"$archive/relative-roster.nul\"\
        \n sha256sum \"$file\" >> \"$archive/source-files.sha256\"\ndone < \"$archive/absolute-roster.nul\"\ntest \"$files\"\
        \ -gt 0\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 1024\ntar --create\
        \ --gzip --null --verbatim-files-from --no-recursion --directory=\"$proof\" --files-from=\"$archive/relative-roster.nul\"\
        \ --file=\"$archive/provenance.tar.gz\"\nsha256sum --check --strict \"$archive/source-files.sha256\" > \"$archive/source-files.after.log\"\
        \nsha256sum \"$archive/provenance.tar.gz\" > \"$archive/provenance.sha256\"\nprintf 'files=%s\\nbytes=%s\\n' \"$files\"\
        \ \"$bytes\" > \"$archive/counts.txt\"\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-zero-r4-operands-3b997279f0a
        path: ${{ runner.temp }}/road-provenance-artifact/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
