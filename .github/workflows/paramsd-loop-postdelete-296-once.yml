name: 296 paramsd loop two Python tools actual deletion proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/paramsd-loop-postdelete-296-once.yml
permissions:
  contents: read
jobs:
  paramsd-loop-postdelete:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CXX: clang++
      EXPECTED_SOURCE: e6ccc8c1c285bc237048b7a4451465ab2aefea75
    steps:
    - uses: actions/checkout@v7
      with:
        ref: e6ccc8c1c285bc237048b7a4451465ab2aefea75
        persist-credentials: false
    - name: Admit exact deleted source and native dependencies
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        for path in rust/tools/check_paramsd_loop.py rust/tools/paramsd_loop_fixture.py; do test ! -e "$path"; test ! -L "$path";
        done

        proof="$RUNNER_TEMP/paramsd-loop-postdelete-296"

        mkdir -p "$proof/retirement"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace bzip2

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        printf ''OPENPILOT_RUST_ROOT=%s\nPARAMSD_LOOP_ROOT=%s\nPARAMSD_LOOP_NATIVE_CHECKER=%s/rust/target/debug/check-paramsd-loop-native\nPARAMSD_LOOP_NATIVE_CANDIDATE=%s/rust/target/debug/examples/paramsd_loop\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''PARAMSD_LOOP_NATIVE_RAW=%s/current/native-raw.json\nPARAMSD_LOOP_NATIVE_EXEC=%s/native.exec\nPARAMSD_LOOP_RETIREMENT_OUTPUT=%s/retirement\nPARAMSD_LOOP_ORIGINAL_INPUT=%s/original-input.json\nPARAMSD_LOOP_NATIVE_OUTPUT=%s/generated\nPARAMSD_LOOP_NATIVE_EXEC=%s/native.exec\nPARAMSD_LOOP_NATIVE_BINARY=%s/rust/target/debug/generate-paramsd-loop-fixture\n''
        "$proof" "$proof" "$proof" "$proof" "$proof" "$proof" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        '
    - uses: ./.github/actions/native-eigen
      with:
        architecture: x86_64
    - name: Build fresh loop, checker and generator without Python
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/paramsd-loop-postdelete-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-paramsd --example paramsd_loop --locked 2>&1 | tee
        "$proof/example-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --bin check-paramsd-loop-native
        --bin generate-paramsd-loop-fixture --locked 2>&1 | tee "$proof/checker-build.log"

        '
    - name: Require full original comparison and both actual-absent roots
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/paramsd-loop-postdelete-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        PATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=5s 200s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat
        -o "$proof/native.exec" "$PARAMSD_LOOP_NATIVE_CHECKER" --binary "$PARAMSD_LOOP_NATIVE_CANDIDATE" --evidence "$proof/current"
        > "$proof/native.stdout" 2> "$proof/native.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --lib --test
        paramsd_loop_check --test paramsd_loop_reference --test paramsd_loop_retirement --locked -- --nocapture 2>&1 | tee
        "$proof/checker-tests.log"

        '
    - name: Require independent request bytes, native generator and exact CLI audit
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/paramsd-loop-postdelete-296"

        printf ''%s  %s\n'' 6a5641f18914cbf452f027ed33daf64a372a966ebc89ae2a2e859a4de384f818 rust/crates/dev-tools/tests/fixtures/paramsd-loop-retired-original/input.json.bz2
        | sha256sum --check --strict

        bzip2 -dc rust/crates/dev-tools/tests/fixtures/paramsd-loop-retired-original/input.json.bz2 > "$PARAMSD_LOOP_ORIGINAL_INPUT"

        printf ''%s  %s\n'' 4f446bc98c9d303d292f487c9ebe36bc8721436a30627dfca55baabae4c6811d "$PARAMSD_LOOP_ORIGINAL_INPUT"
        | sha256sum --check --strict

        export PARAMSD_LOOP_NATIVE_EXEC="$proof/generator.exec"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 128

        PATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=5s 30s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat
        -o "$PARAMSD_LOOP_NATIVE_EXEC" "$PARAMSD_LOOP_NATIVE_BINARY" --root "$PARAMSD_LOOP_ROOT" --output "$PARAMSD_LOOP_NATIVE_OUTPUT"
        > "$proof/generator.stdout" 2> "$proof/generator.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --test paramsd_loop_fixture_generate
        --locked -- --nocapture 2>&1 | tee "$proof/generator-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features paramsd-loop-native --lib --bin
        check-paramsd-loop-native --bin generate-paramsd-loop-fixture --test paramsd_loop_check --test paramsd_loop_reference
        --test paramsd_loop_retirement --test paramsd_loop_fixture_generate --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        for path in rust/tools/check_paramsd_loop.py rust/tools/paramsd_loop_fixture.py; do test ! -e "$path"; test ! -L "$path";
        done

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: paramsd-loop-actual-postdelete
        path: ${{ runner.temp }}/paramsd-loop-postdelete-296/
