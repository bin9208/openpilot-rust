name: Jetlink contract and inference
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    name: model contract and CPU inference
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, openpilot-rust]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, lfs: false}
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -r tools/jetlink_model/requirements.lock
      - name: Verify package, upstream fixtures and real tiny ONNX execution
        run: python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink_model/tests tools/jetlink_model/tests -q
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}

  android-core:
    name: Android protocol and Java inference
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, lfs: false}
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Admit the job-owned Android SDK
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          owned = Path(os.environ['CI_JOB_TEMP'])
          # Command-line tools, platform 35 and build-tools 35.0.0, including unpacking.
          growth = 1536 * 1024**2
          free = shutil.disk_usage(owned).free
          print(f'free_bytes={free} estimated_android_sdk_growth_bytes={growth}')
          if free < growth:
              raise SystemExit('insufficient space for this Android SDK preparation')
          sdk = owned / 'android-sdk'
          sdk.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_HOME={sdk}\nANDROID_SDK_ROOT={sdk}\n')
          PY
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: bash tools/jetlink_android/gradlew -p tools/jetlink_android :core:test :runtime:test :app:lintDebug :app:assembleDebug
      - run: python tools/jetlink_android/check_apk.py tools/jetlink_android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: jetlink-android-arm64-debug
          path: |
            tools/jetlink_android/app/build/outputs/apk/debug/app-debug.apk
            tools/jetlink_android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
