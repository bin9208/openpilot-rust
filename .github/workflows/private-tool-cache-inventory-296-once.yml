{
  "name": "#296 FIVE old private RustupHome READONLY metadata once",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/private-tool-cache-inventory-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "inventory": {
      "if": "${{ github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/codex/feat-296-local-validation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 25,
      "concurrency": {
        "group": "private-tool-cache-inventory-296-${{ github.repository }}-${{ github.ref }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "LC_ALL": "C.UTF-8",
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONOPTIMIZE": "0",
        "PYTHONNOUSERSITE": "1"
      },
      "steps": [
        {
          "name": "FIRST require trusted repo ref event and bin-actions before any metadata",
          "run": "set -euo pipefail\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONHOME:-} && -z ${PYTHONPATH:-} ]]\n[[ ${GITHUB_WORKFLOW_SHA:-} == \"$GITHUB_SHA\" && ${GITHUB_ACTIONS:-} == true ]]\n"
        },
        {
          "name": "Common fresh audit temp only; never cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "false"
          }
        },
        {
          "name": "Bind fresh output and admit bounded metadata growth",
          "run": "set -euo pipefail\numask 077\njob=$CI_JOB_TEMP\n[[ $job == /tmp/openpilot-ci.?????? && ! -L $job && -d $job ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\n[[ $(id -u) == 1000 && $(stat -c %u \"$job\") == 1000 ]]\nmkdir \"$job/private-tool-cache-inventory\" \"$job/inventory-tools\" \"$job/inventory-home\"\nout=\"$job/private-tool-cache-inventory\"\nprintf 'INVENTORY_OUT=%s\nINVENTORY_JOB_ID=%s\nHOME=%s/inventory-home\n' \"$out\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$job\" >> \"$GITHUB_ENV\"\nprintf 'phase=read-only-inventory\nworkflow=%s\nrun=%s\nattempt=%s\njob=%s\nrunner=%s\njob_identity=%s\ndelete=false\n' \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$RUNNER_NAME\" \"$(stat -c '%d:%i:%u' \"$job\")\" > \"$out/binding.txt\"\nprintf '%s\\n' '{\"phase\":\"ALLOCATION_ONLY_NOT_CURRENT_INVENTORY\",\"deletion_allowed\":false,\"deletion_executed\":false,\"approved_deletion_targets\":[],\"recovered_bytes\":0,\"current_metadata_complete\":false,\"build_capacity_released\":false,\"current_build_capacity_released\":false,\"toolchain_removal_authorized\":false}' > \"$out/DECISION.json\"\ndf -PB1 \"$job\" > \"$out/disk.before.txt\"\n# Metadata128MiB + possible upload staging128MiB +8MiB script/seal/overhead.\n# This is not the unrelated unchanged16,642,998,272-byte bundle estimate.\navailable=$(df -PB1 \"$job\" | awk 'NR==2{print $4}')\n[[ $available =~ ^[0-9]+$ ]]\ngrowth=$((264*1024*1024))\nprintf '{\"available_bytes\":%s,\"planned_metadata_growth_bytes\":%s,\"fixed_reserve_bytes\":0}\n' \"$available\" \"$growth\" > \"$out/growth.json\"\nif ((available < growth)); then printf 'Metadata growth admission rejected: available=%s required=%s bytes\n' \"$available\" \"$growth\" >&2; exit 1; fi\n[[ -x /usr/bin/python3 ]]\n"
        },
        {
          "name": "Stage inert sealed metadata payload 1/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-00\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert sealed metadata payload 2/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-01\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert sealed metadata payload 3/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-02\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert sealed metadata payload 4/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-03\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert sealed metadata payload 5/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-04\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert sealed metadata payload 6/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-05\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert sealed metadata payload 7/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-06\" <<'FROZEN'\nwJ7BGu/R1nmyeoxszW0w098Pz8s7wp6zvvCC77t0MNOGg9B9H5i7Sd4ek9wTcufO//u//+t//he8rbvgkDYCAA==\nFROZEN\n"
        },
        {
          "name": "Decode and authenticate BOTH sealed source payloads",
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B - <<'PY'\nimport base64,gzip,hashlib,io,json,os\nfrom pathlib import Path\nroot=Path(os.environ['CI_JOB_TEMP'])/'inventory-tools'\nparts=[(root/('fragment-%02d'%i)).read_bytes().strip() for i in range(7)]\npacked=base64.b64decode(b''.join(parts),validate=True)\nif hashlib.sha256(packed).hexdigest()!='381362b1d9fc4b9d03643cfc1482070c393c6ab49d0a4f5c8f7424532ef3a25d': raise ValueError('compressed metadata payload hash')\nwith gzip.GzipFile(fileobj=io.BytesIO(packed)) as f: raw=f.read(1024*1024+1)\nif len(raw)>1024*1024 or hashlib.sha256(raw).hexdigest()!='578664090d875011a705794ebc65675dd110cb60cd8e90ff605229079be43305': raise ValueError('bounded metadata payload hash')\nbundle=json.loads(raw);pins={'inventory.py': {'bytes': 49453, 'sha256': '7287c408a3b2e942b3f520f2ce89220a9f4deb23f7f2fafcb286342bc03977c9'}, 'inputs.json': {'bytes': 59298, 'sha256': '3e951ec3ee3dcca4a03d4ba55c7aa98a459702905eb1c5c68c62c885316ff04b'}}\nif set(bundle)!=set(pins): raise ValueError('payload roster')\ndecoded={n:base64.b64decode(bundle[n],validate=True) for n in pins}\nfor name,data in decoded.items():\n if len(data)!=pins[name]['bytes'] or hashlib.sha256(data).hexdigest()!=pins[name]['sha256']: raise ValueError('payload source hash')\n# Every member authenticated before any file is written or observer imported/executed.\nfor name,data in decoded.items():\n with (root/name).open('xb') as f: f.write(data)\nout=Path(os.environ['INVENTORY_OUT'])\nwith (out/'PAYLOAD-PINS.json').open('x') as f: json.dump(pins,f,sort_keys=True,indent=2);f.write('\\n')\nPY\n"
        },
        {
          "name": "Authenticate FIVE old contexts independently; filename stat symlink text ONLY",
          "id": "metadata",
          "env": {
            "INVENTORY_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nprintf '%s  %s\\n' '7287c408a3b2e942b3f520f2ce89220a9f4deb23f7f2fafcb286342bc03977c9' \"$CI_JOB_TEMP/inventory-tools/inventory.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '3e951ec3ee3dcca4a03d4ba55c7aa98a459702905eb1c5c68c62c885316ff04b' \"$CI_JOB_TEMP/inventory-tools/inputs.json\" | sha256sum --check --strict -\n/usr/bin/python3 -I -B \"$CI_JOB_TEMP/inventory-tools/inventory.py\" inventory > \"$INVENTORY_OUT/metadata.stdout\" 2> \"$INVENTORY_OUT/metadata.stderr\"\n"
        },
        {
          "name": "Always retain raw status capacity and member seals",
          "id": "seal",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "env": {
            "METADATA_OUTCOME": "${{ steps.metadata.outcome }}"
          },
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ ! -L $job && -d $job && $(stat -c '%d:%i:%u' \"$job\") == \"$INVENTORY_JOB_ID\" ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nprintf 'metadata_step=%s\nphase=five-private-rustup-home-metadata-only\ndelete=false\nno_cleanup_step=true\n' \"$METADATA_OUTCOME\" > \"$INVENTORY_OUT/RAW-STATUS.txt\"\ndf -PB1 \"$job\" > \"$INVENTORY_OUT/disk.after.txt\"\nprintf '%s  %s\\n' '7287c408a3b2e942b3f520f2ce89220a9f4deb23f7f2fafcb286342bc03977c9' \"$CI_JOB_TEMP/inventory-tools/inventory.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '3e951ec3ee3dcca4a03d4ba55c7aa98a459702905eb1c5c68c62c885316ff04b' \"$CI_JOB_TEMP/inventory-tools/inputs.json\" | sha256sum --check --strict -\n/usr/bin/python3 -I -B \"$CI_JOB_TEMP/inventory-tools/inventory.py\" seal\n"
        },
        {
          "name": "Always upload complete available metadata even when denied",
          "id": "evidence",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "private-tool-cache-inventory-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.INVENTORY_OUT }}",
            "if-no-files-found": "error",
            "retention-days": 14,
            "include-hidden-files": true,
            "overwrite": false,
            "compression-level": 6
          }
        },
        {
          "name": "Record upload receipt and permanent no-delete decision",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "env": {
            "UPLOAD_ID": "${{ steps.evidence.outputs.artifact-id }}",
            "UPLOAD_DIGEST": "${{ steps.evidence.outputs.artifact-digest }}",
            "UPLOAD_OUTCOME": "${{ steps.evidence.outcome }}"
          },
          "run": "set -euo pipefail\nprintf 'Read-only metadata upload: outcome=%s id=%s digest=%s; deletion_allowed=false recovered_bytes=0; current_build_capacity_released=false; toolchain removal still requires provider/current-validation need review; roots and raw output retained.\\n' \"$UPLOAD_OUTCOME\" \"$UPLOAD_ID\" \"$UPLOAD_DIGEST\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ]
    }
  }
}
