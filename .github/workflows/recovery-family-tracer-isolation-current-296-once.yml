name: 296 recovery current-source tracer isolation diagnostic
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/recovery-family-tracer-isolation-current-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  recovery-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: defb9011df3fca924dca41a703b48ce5ff0c51e0
        persist-credentials: false
    - name: Bind exact current source and reserve disk
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = defb9011df3fca924dca41a703b48ce5ff0c51e0

        proof="$RUNNER_TEMP/recovery-current"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        '
    - name: Install recovery prerequisites and pinned Rust toolchain
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y tmux util-linux strace binutils capnproto libcapnp-dev g++ pkg-config cmake jq

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        '
    - name: Record hosted tracer, kernel and signal environment
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current\"\n{\n  printf '%s\\n' '--- uname -a ---'\n  uname -a\n\
        \  printf '%s\\n' '--- /proc/version ---'\n  cat /proc/version\n  printf '%s\\n' '--- /proc/sys/kernel/yama/ptrace_scope\
        \ ---'\n  cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || true\n  printf '%s\\n' '--- strace --version ---'\n\
        \  strace --version\n  printf '%s\\n' '--- strace binary identity ---'\n  command -v strace\n  sha256sum \"$(command\
        \ -v strace)\"\n  printf '%s\\n' '--- supervisor shell signal status (not tracee) ---'\n  grep -E '^(Name|Pid|PPid|TracerPid|SigBlk|SigIgn|SigCgt):'\
        \ /proc/$$/status\n} > \"$proof/host-tracer-metadata.txt\"\n"
    - name: Compile all recovery components, harness and audit tools
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery -p openpilot-process-supervision --bins --examples
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --bin list-cargo-tests
        --bin audit-recovery-exec --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery --lib --no-run --locked --message-format=json
        > "$proof/cwp-tests.jsonl"

        mapfile -t cwp < <(rust/target/debug/list-cargo-tests "$proof/cwp-tests.jsonl")

        test "${#cwp[@]}" -eq 1 && test -f "${cwp[0]}"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --test recovery_family_frozen
        --no-run --locked --message-format=json > "$proof/harness-tests.jsonl"

        mapfile -t harness < <(rust/target/debug/list-cargo-tests "$proof/harness-tests.jsonl")

        test "${#harness[@]}" -eq 1 && test -f "${harness[0]}"

        printf ''%s\n'' "${cwp[0]}" > "$proof/cwp-test-elf.path"

        printf ''%s\n'' "${harness[0]}" > "$proof/harness-test-elf.path"

        '
    - name: Run recovery units and strict Clippy before controller traffic
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib recovery_
        --locked > "$proof/family-unit.stdout" 2> "$proof/family-unit.stderr"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib --bin
        audit-recovery-exec --test recovery_family_frozen --locked -- -D warnings > "$proof/clippy.stdout" 2> "$proof/clippy.stderr"

        '
    - name: Prepare private retained-source root and source-absence guards
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current\"\nprivate=\"$RUNNER_TEMP/recovery-private-current\"\n\
        test ! -e \"$private\"\nmkdir -p \"$private/openpilot/selfdrive/carrot/recovery\" \"$private/openpilot/common\" \"\
        $private/rust/tools\"\ncp -a openpilot/selfdrive/carrot/recovery/server.py \"$private/openpilot/selfdrive/carrot/recovery/server.py\"\
        \ncp -a openpilot/common/repo_update.py \"$private/openpilot/common/repo_update.py\"\ncp -a openpilot/selfdrive/carrot/web\
        \ \"$private/openpilot/selfdrive/carrot/web\"\ngit rev-parse HEAD > \"$proof/source-before-traffic.txt\"\ntest \"\
        $(cat \"$proof/source-before-traffic.txt\")\" = defb9011df3fca924dca41a703b48ce5ff0c51e0\nfor root in \"$GITHUB_WORKSPACE\"\
        \ \"$private\"; do\n  for relative in \\\n    rust/tools/carrot_recovery_http_control.py \\\n    rust/tools/carrot_recovery_terminal_control.py\
        \ \\\n    rust/tools/carrot_recovery_terminal_lifecycle.py \\\n    rust/tools/carrot_recovery_support_control.py \\\
        \n    rust/tools/carrot_recovery_support_shutdown.py \\\n    rust/tools/carrot_recovery_actions_control.py \\\n  \
        \  rust/tools/check_carrot_recovery_upload.py \\\n    rust/tools/carrot_recovery_cwp_check.py \\\n    rust/tools/carrot_recovery_source.py\
        \ \\\n    rust/tools/carrot_recovery_support_source.py \\\n    rust/tools/carrot_recovery_cwp_source.py \\\n    rust/tools/carrot_recovery_actions_fixtures.py\
        \ \\\n    rust/tools/carrot_recovery_actions_tools.py; do\n    test ! -e \"$root/$relative\" && test ! -L \"$root/$relative\"\
        \n  done\ndone\ntest -d \"$GITHUB_WORKSPACE/rust/tools\" && test -d \"$private/rust/tools\"\nprintf '%s\\n' \"$private\"\
        \ > \"$proof/private-root.path\"\n"
    - name: Seal same native providers before both complete lanes
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current\"\n{\n printf '%s\\n' \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-carrot-recovery\"\
        \ \"$GITHUB_WORKSPACE/rust/target/debug/examples/recovery_actions\" \"$GITHUB_WORKSPACE/rust/target/debug/examples/upload\"\
        \ \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child\" \"$GITHUB_WORKSPACE/rust/target/debug/audit-recovery-exec\"\
        \ /usr/bin/tmux /usr/bin/strace\n cat \"$proof/cwp-test-elf.path\" \"$proof/harness-test-elf.path\"\n} > \"$proof/full-traffic-held-elfs.list\"\
        \nwhile IFS= read -r held; do\n test -f \"$held\" && test ! -L \"$held\"\n stat -c '%d %i %s %f %y %z' \"$held\"\n\
        \ sha256sum \"$held\"\ndone < \"$proof/full-traffic-held-elfs.list\" > \"$proof/full-traffic-elfs.before\"\n"
    - name: Run complete eight-controller functional gate without ptrace
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current"

        export RECOVERY_FAMILY_PRIVATE_ROOT="$(cat "$proof/private-root.path")"

        export RECOVERY_FAMILY_CWP_TEST_BINARY="$(cat "$proof/cwp-test-elf.path")"

        export RECOVERY_FAMILY_FROZEN_EVIDENCE="$proof/functional-native"

        harness="$(cat "$proof/harness-test-elf.path")"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        "$harness" --exact eight_native_recovery_controllers_same_elf_present_and_absent --test-threads=1 --nocapture > "$proof/functional-harness.stdout"
        2> "$proof/functional-harness.stderr"

        grep -F ''1 passed; 0 failed'' "$proof/functional-harness.stdout"

        test -f "$proof/functional-native/admission.json"

        '
    - name: Capture executable preflight for the unchanged full trace
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-current"

        harness="$(cat "$proof/harness-test-elf.path")"

        cwp="$(cat "$proof/cwp-test-elf.path")"

        sha=$(rust/target/debug/audit-recovery-exec pre --receipt "$proof/exec-preflight.json" --native-root "$proof/traced-native"
        --server "$RECOVERY_FAMILY_BINARY" --actions "$RECOVERY_FAMILY_ACTIONS_EXAMPLE" --upload "$RECOVERY_FAMILY_UPLOAD_EXAMPLE"
        --child "$RECOVERY_FAMILY_PROCESS_CHILD" --cwp "$cwp" --tmux /usr/bin/tmux --harness "$harness" --host-path "$PATH")

        [[ "$sha" =~ ^[0-9a-f]{64}$ ]]

        printf ''%s\n'' "$sha" > "$proof/exec-preflight.sha256"

        '
    - name: Run full eight-controller exec trace with identical ELF and argv
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current\"\nexport RECOVERY_FAMILY_PRIVATE_ROOT=\"$(cat \"$proof/private-root.path\"\
        )\"\nexport RECOVERY_FAMILY_CWP_TEST_BINARY=\"$(cat \"$proof/cwp-test-elf.path\")\"\nexport RECOVERY_FAMILY_FROZEN_EVIDENCE=\"\
        $proof/traced-native\"\nharness=\"$(cat \"$proof/harness-test-elf.path\")\"\nsha=\"$(cat \"$proof/exec-preflight.sha256\"\
        )\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 4096\nstatus=0\nstrace\
        \ -ff -qq -s 32768 -xx -e trace=execve,execveat -o \"$proof/exec\" \"$harness\" --exact eight_native_recovery_controllers_same_elf_present_and_absent\
        \ --test-threads=1 --nocapture > \"$proof/traced-harness.stdout\" 2> \"$proof/traced-harness.stderr\" || status=$?\n\
        audit_status=0\nrust/target/debug/audit-recovery-exec post --receipt \"$proof/exec-preflight.json\" --receipt-sha256\
        \ \"$sha\" --trace-dir \"$proof\" --output \"$proof/exec-audit.json\" --harness-exit \"$status\" > \"$proof/exec-audit.stdout\"\
        \ 2> \"$proof/exec-audit.stderr\" || audit_status=$?\ntest \"$(sha256sum \"$proof/exec-preflight.json\" | cut -d '\
        \ ' -f 1)\" = \"$sha\"\ntest \"$status\" -eq 0 || { tail -n 100 \"$proof/traced-harness.stdout\" \"$proof/traced-harness.stderr\"\
        ; exit \"$status\"; }\ntest \"$audit_status\" -eq 0 || { cat \"$proof/exec-audit.stderr\"; exit \"$audit_status\"\
        ; }\ngrep -F '1 passed; 0 failed' \"$proof/traced-harness.stdout\"\ntest -f \"$proof/traced-native/admission.json\"\
        \ngit rev-parse HEAD > \"$proof/source-after-traffic.txt\"\ntest \"$(cat \"$proof/source-after-traffic.txt\")\" =\
        \ defb9011df3fca924dca41a703b48ce5ff0c51e0\nprivate=\"$(cat \"$proof/private-root.path\")\"\nfor relative in \\\n\
        \  rust/tools/carrot_recovery_http_control.py \\\n  rust/tools/carrot_recovery_terminal_control.py \\\n  rust/tools/carrot_recovery_terminal_lifecycle.py\
        \ \\\n  rust/tools/carrot_recovery_support_control.py \\\n  rust/tools/carrot_recovery_support_shutdown.py \\\n  rust/tools/carrot_recovery_actions_control.py\
        \ \\\n  rust/tools/check_carrot_recovery_upload.py \\\n  rust/tools/carrot_recovery_cwp_check.py \\\n  rust/tools/carrot_recovery_source.py\
        \ \\\n  rust/tools/carrot_recovery_support_source.py \\\n  rust/tools/carrot_recovery_cwp_source.py \\\n  rust/tools/carrot_recovery_actions_fixtures.py\
        \ \\\n  rust/tools/carrot_recovery_actions_tools.py; do\n  test ! -e \"$GITHUB_WORKSPACE/$relative\" && test ! -L\
        \ \"$GITHUB_WORKSPACE/$relative\"\n  test ! -e \"$private/$relative\" && test ! -L \"$private/$relative\"\ndone\n\
        du -sm \"$proof\" > \"$proof/artifact-size-mib.txt\"\ntest \"$(cut -f1 \"$proof/artifact-size-mib.txt\")\" -le 400\n"
    - name: Verify unchanged native provider identities even after failed traffic
      if: always()
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/recovery-current\"\nwhile IFS= read -r held; do\n test -f \"$held\" &&\
        \ test ! -L \"$held\"\n stat -c '%d %i %s %f %y %z' \"$held\"\n sha256sum \"$held\"\ndone < \"$proof/full-traffic-held-elfs.list\"\
        \ > \"$proof/full-traffic-elfs.after\"\ncmp \"$proof/full-traffic-elfs.before\" \"$proof/full-traffic-elfs.after\"\
        \n"
    - name: Preserve all recovery diagnostic and controller evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-recovery-tracer-isolation-current-296
        path: ${{ runner.temp }}/recovery-current/
        if-no-files-found: error
        retention-days: 5
