{
  "name": "controlsd selected signal-readiness diagnosis #296",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/controlsd-signal-readiness-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "concurrency": {
    "group": "controlsd-signal-readiness-296-${{ github.ref }}",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "controlsd-signal-readiness": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 75,
      "env": {
        "CONTROLSD_CONTROLLER_SOURCE_SHA": "55084e65ab94b71ba884ec11e2ce91eb8127bd71",
        "CONTROLSD_SIGNAL_PAYLOAD_SHA256": "5f73512168c4820869972387e2c46d6be34c1921c18e879efbb9f8e7500d96a7",
        "CONTROLSD_SIGNAL_RECIPE_SHA256": "e404ecb565d7904ab4829f4632b7ed4888908f847141edd892a0137cab7a824f",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "RUSTUP_TOOLCHAIN": "1.94.0",
        "RUSTC_WRAPPER": "",
        "RUSTC_WORKSPACE_WRAPPER": "",
        "PYTHONOPTIMIZE": "0",
        "PYTHONNOUSERSITE": "1",
        "PYTHONDONTWRITEBYTECODE": "1",
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "name": "Bootstrap uniquely owned paths and admit actual source growth",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_BOOTSTRAP_PY'\n\"\"\"Actions bootstrap only: admit source growth before allocating private roots.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport tempfile\n\nif os.environ['RUNNER_NAME'] != 'bin-actions':\n    raise SystemExit('registered bin-actions runner required')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\nprefix = 'controlsd-controller-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\ngrowth = 2 * 1024 * 1024 * 1024\nfree = shutil.disk_usage(workspace).free\nadmission = {'path': str(workspace), 'operation': 'source-checkout', 'available_bytes': free, 'planned_growth_bytes': growth}\nprint(json.dumps(admission), flush=True)\nif growth > free:\n    raise SystemExit('source operation growth exceeds available space')\nos.umask(0o077)\njob = Path(tempfile.mkdtemp(prefix=prefix, dir=runner_temp))\nsource = Path(tempfile.mkdtemp(prefix=prefix, dir=workspace))\nfor name in ['tmp', 'proof', 'payload']:\n    (job / name).mkdir(mode=0o700)\ndef identity(path):\n    value = path.lstat()\n    return {'dev': value.st_dev, 'ino': value.st_ino, 'uid': value.st_uid}\nowner = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n         'workspace': str(workspace), 'runner_temp': str(runner_temp),\n         'job': str(job), 'source': str(source),\n         'job_identity': identity(job), 'source_identity': identity(source)}\nreceipt = json.dumps(owner, sort_keys=True) + '\\n'\n(job / '.controlsd-owner.json').write_text(receipt)\n(job / 'proof/ownership.json').write_text(receipt)\n(job / 'proof/growth-source.json').write_text(json.dumps(admission) + '\\n')\nvalues = {'CONTROLSD_CONTROLLER_JOB': str(job), 'CONTROLSD_CONTROLLER_PAYLOAD': str(job / 'payload'),\n          'CONTROLSD_CONTROLLER_PROOF': str(job / 'proof'), 'CONTROLSD_CONTROLLER_ROOT': str(source),\n          'CONTROLSD_CONTROLLER_CHECKOUT_REL': str(source.relative_to(workspace)),\n          'CARGO_HOME': str(job / 'cargo'), 'RUSTUP_HOME': str(job / 'rustup'),\n          'CARGO_TARGET_DIR': str(job / 'target'), 'PIP_CACHE_DIR': str(job / 'pip'),\n          'XDG_CACHE_HOME': str(job / 'xdg'), 'TMPDIR': str(job / 'tmp')}\nwith open(os.environ['GITHUB_ENV'], 'a') as output:\n    for key, value in values.items():\n        if '\\n' in value or '\\r' in value:\n            raise SystemExit('invalid private path')\n        output.write(key + '=' + value + '\\n')\nprint(json.dumps({'ownership': owner, 'growth_admitted': True}), flush=True)\nCONTROLSD_BOOTSTRAP_PY\n"
        },
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "${{ env.CONTROLSD_CONTROLLER_SOURCE_SHA }}",
            "path": "${{ env.CONTROLSD_CONTROLLER_CHECKOUT_REL }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          }
        },
        {
          "name": "Stage sealed signal payload bootstrap.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/bootstrap.py\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' 'f0e9f01826766ce70fed4e9f0c768b9a2685d12d8175ff188af2c4608f04c5d2' \"$CONTROLSD_CONTROLLER_PAYLOAD/bootstrap.py\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/bootstrap.py\" \"$CONTROLSD_CONTROLLER_PROOF/staged/bootstrap.py\"\n"
        },
        {
          "name": "Stage sealed signal payload cleanup.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/cleanup.py\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' '9e0176a9a849fba2cbb6778927821a7118093c2ed9a5cb2f35db51f0d086d9a5' \"$CONTROLSD_CONTROLLER_PAYLOAD/cleanup.py\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/cleanup.py\" \"$CONTROLSD_CONTROLLER_PROOF/staged/cleanup.py\"\n"
        },
        {
          "name": "Stage sealed signal payload finalize.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/finalize.py\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' '7d83ded182fe0ae4c86a006b626340d0ae2d52e9dc75a843ff8c4e918abc1441' \"$CONTROLSD_CONTROLLER_PAYLOAD/finalize.py\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/finalize.py\" \"$CONTROLSD_CONTROLLER_PROOF/staged/finalize.py\"\n"
        },
        {
          "name": "Stage sealed signal payload growth.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/growth.py\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' 'ff6ce48e19d180d6c76c2a97cf6284ab733ad76ee05c35968686afa3e507ae60' \"$CONTROLSD_CONTROLLER_PAYLOAD/growth.py\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/growth.py\" \"$CONTROLSD_CONTROLLER_PROOF/staged/growth.py\"\n"
        },
        {
          "name": "Stage sealed signal payload ownership.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/ownership.py\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' '01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9' \"$CONTROLSD_CONTROLLER_PAYLOAD/ownership.py\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/ownership.py\" \"$CONTROLSD_CONTROLLER_PROOF/staged/ownership.py\"\n"
        },
        {
          "name": "Stage sealed signal payload payload-manifest.json",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/payload-manifest.json\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' '5f73512168c4820869972387e2c46d6be34c1921c18e879efbb9f8e7500d96a7' \"$CONTROLSD_CONTROLLER_PAYLOAD/payload-manifest.json\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/payload-manifest.json\" \"$CONTROLSD_CONTROLLER_PROOF/staged/payload-manifest.json\"\n"
        },
        {
          "name": "Stage sealed signal payload qualify.py",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/qualify.py\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' 'dbe9a4be91b30f57e7f61d4480f1338b77beaa3b18ace5211b51c6a89c3c895a' \"$CONTROLSD_CONTROLLER_PAYLOAD/qualify.py\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/qualify.py\" \"$CONTROLSD_CONTROLLER_PROOF/staged/qualify.py\"\n"
        },
        {
          "name": "Stage sealed signal payload source-contract.json",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/source-contract.json\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' '383b5b9953626ab14ebf8cf9bda1b069668cf2c4505dccc7bbc2fc03755b90b7' \"$CONTROLSD_CONTROLLER_PAYLOAD/source-contract.json\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/source-contract.json\" \"$CONTROLSD_CONTROLLER_PROOF/staged/source-contract.json\"\n"
        },
        {
          "name": "Stage sealed signal payload support-pins.json",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'CONTROLSD_SIGNAL_B64_EOF' | gzip --decompress > \"$CONTROLSD_CONTROLLER_PAYLOAD/support-pins.json\"\\nCONTROLSD_SIGNAL_B64_EOF\nprintf '%s  %s\\n' 'f41c4421d1b181ef3bc86eadb2d6c2e4632501667f0ce5c5f55fff98f19b0dcc' \"$CONTROLSD_CONTROLLER_PAYLOAD/support-pins.json\" | sha256sum --check --strict\nmkdir -p \"$CONTROLSD_CONTROLLER_PROOF/staged\"\ncp \"$CONTROLSD_CONTROLLER_PAYLOAD/support-pins.json\" \"$CONTROLSD_CONTROLLER_PROOF/staged/support-pins.json\"\n"
        },
        {
          "name": "Expose exact common Rust helper in private job context",
          "uses": "bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Fresh no-run build and selected signal-readiness observer",
          "id": "signal_qualification",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nulimit -n 32768\ncd \"$CONTROLSD_CONTROLLER_ROOT\"\npython3 \"$CONTROLSD_CONTROLLER_PAYLOAD/qualify.py\"\n"
        },
        {
          "name": "Always recover ownership and seal bounded signal evidence",
          "id": "seal_proof",
          "if": "${{ always() && env.CONTROLSD_CONTROLLER_PROOF != '' }}",
          "shell": "bash",
          "env": {
            "SIGNAL_VALIDATION_OUTCOME": "${{ steps.signal_qualification.outcome }}"
          },
          "run": "set -euo pipefail\npython3 \"$CONTROLSD_CONTROLLER_PAYLOAD/finalize.py\"\n"
        },
        {
          "name": "Always upload bounded selected-test failure evidence",
          "id": "proof_upload",
          "if": "${{ always() && env.CONTROLSD_CONTROLLER_JOB != '' }}",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "controlsd-signal-readiness-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CONTROLSD_CONTROLLER_JOB }}/artifact/",
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "retention-days": 30
          }
        },
        {
          "name": "Remove only qualified uploaded and identity-verified private roots",
          "if": "${{ always() && steps.signal_qualification.outcome == 'success' && steps.seal_proof.outcome == 'success' && steps.seal_proof.outputs.complete == 'true' && steps.seal_proof.outputs.ownership_all_clear == 'true' && steps.proof_upload.outcome == 'success' && steps.proof_upload.outputs.artifact-id != '' && steps.proof_upload.outputs.artifact-digest != '' }}",
          "shell": "bash",
          "env": {
            "CONTROLSD_CONTROLLER_UPLOAD_OUTCOME": "${{ steps.proof_upload.outcome }}",
            "CONTROLSD_CONTROLLER_UPLOAD_ID": "${{ steps.proof_upload.outputs.artifact-id }}",
            "CONTROLSD_CONTROLLER_UPLOAD_DIGEST": "${{ steps.proof_upload.outputs.artifact-digest }}"
          },
          "run": "set -euo pipefail\npython3 \"$CONTROLSD_CONTROLLER_PAYLOAD/cleanup.py\"\n"
        }
      ]
    }
  }
}
