name: FFmpeg host compatibility
on:
  push:
    branches: ['codex/feat-404-*']
    paths:
      - '.github/workflows/ffmpeg-host.yml'
      - 'tools/ci/install_host_ffmpeg.sh'
      - 'rust/crates/loggerd/**'
      - 'rust/crates/encoderd/**'
      - 'rust/crates/webrtc/**'
      - 'rust/crates/webcam/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ffmpeg-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.94.0'
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ENCODER_LIBYUV_LIB: /usr/lib/x86_64-linux-gnu
      CARGO_TARGET_DIR: ${{ github.workspace }}/.analysis/scratch/ffmpeg-host-405
      OPENPILOT_WEBCAM_OPENCV_ROOT: ${{ github.workspace }}/.analysis/scratch/ffmpeg-webcam-405
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check capacity and install the host's exact FFmpeg provider
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge $(((25 + 10) * 1024 * 1024))
          sudo -n apt-get update
          bash tools/ci/install_host_ffmpeg.sh
          sudo -n apt-get install -y g++ clang-18 libclang-18-dev cmake ninja-build pkg-config capnproto libcapnp-dev libzmq3-dev libyuv-dev nasm libssl-dev
          rustup toolchain install 1.94.0 --profile minimal
      - name: Build and test actual logger and encoder consumers
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-loggerd --tests
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-encoderd --features native --tests
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-loggerd --bins --examples
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-encoderd --features native --bins --examples
      - name: Build and test WebRTC native codecs
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge $(((25 + 4) * 1024 * 1024))
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-webrtc --features native --lib
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-webrtc --features native --bins --examples
      - name: Build pinned webcam OpenCV against the host FFmpeg
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge $(((25 + 4) * 1024 * 1024))
          cargo run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-xiaoge-opencv -- --prepare-only --output "$RUNNER_TEMP/ffmpeg-opencv-source-405"
          cargo run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-webcam-opencv -- --source "$RUNNER_TEMP/ffmpeg-opencv-source-405/opencv-fe38fc608f6acb8b68953438a62305d8318f4fcd" --output "$OPENPILOT_WEBCAM_OPENCV_ROOT" --growth-mib 4096
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-webcam --features native --lib
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-webcam --features native --bins --examples
      - name: Preserve FFmpeg provider and build evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-host-evidence-405"
          git rev-parse HEAD > "$RUNNER_TEMP/ffmpeg-host-evidence-405/SOURCE_COMMIT"
          dpkg-query -W ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev > "$RUNNER_TEMP/ffmpeg-host-evidence-405/packages.txt" || true
          pkg-config --modversion libavcodec libavformat libavutil libswscale > "$RUNNER_TEMP/ffmpeg-host-evidence-405/abi.txt" || true
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/ffmpeg-host-evidence-405/disk.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ffmpeg-host-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ffmpeg-host-evidence-405/
            ${{ github.workspace }}/.analysis/scratch/ffmpeg-webcam-405/*.log
            ${{ github.workspace }}/.analysis/scratch/ffmpeg-webcam-405/*.json
          retention-days: 7
      - name: Remove probe-specific compiled output
        if: always()
        run: |
          rm -rf -- "$CARGO_TARGET_DIR" "$OPENPILOT_WEBCAM_OPENCV_ROOT" "$RUNNER_TEMP/ffmpeg-opencv-source-405"
