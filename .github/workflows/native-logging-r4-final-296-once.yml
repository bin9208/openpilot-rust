      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - name: Bind exact source, external diagnostics and fresh build namespace
      run: "set -euo pipefail\n[[ \"$SOURCE_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\n\
        test -z \"$(git status --porcelain --untracked-files=normal)\"\n[[ \"$LOGGING_GATE_SHA256\" =~ ^[0-9a-f]{64}$ ]]\n\
        test \"$LOGGING_PHASE\" = admission\n# Pure bootstrap reserve, before install/build/copy; no local runner.\nlogging_free=$(df\
        \ -B1 --output=avail \"$RUNNER_TEMP\" | tail -n 1)\nif test \"$logging_free\" -lt $((25*1024*1024*1024+8*1024*1024*1024));\
        \ then\n  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup\n  logging_free=$(df -B1\
        \ --output=avail \"$RUNNER_TEMP\" | tail -n 1)\n  test \"$logging_free\" -ge $((35*1024*1024*1024))\nfi\nlogging_job=$(mktemp\
        \ -d \"$RUNNER_TEMP/logging-final-296.XXXXXXXX\")\nmkdir \"$logging_job/evidence\"\nprintf 'LOGGING_JOB=%s\\nLOGGING_PROOF_OUTPUT=%s/evidence\\\
        nCARGO_TARGET_DIR=%s/target\\n' \"$logging_job\" \"$logging_job\" \"$logging_job\" >> \"$GITHUB_ENV\"\nprintf '%s'\
        \ \"$LOGGING_GATE_B64\" | base64 --decode > \"$logging_job/gates.py\"\nprintf '%s  %s\\n' \"$LOGGING_GATE_SHA256\"\
        \ \"$logging_job/gates.py\" | sha256sum --check --strict\nprintf 'workflow_head=%s\\nsource_commit=%s\\nphase=%s\\\
        n' \"$GITHUB_SHA\" \"$SOURCE_SHA\" \"$LOGGING_PHASE\" > \"$logging_job/evidence/source.txt\"\n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install ordinary hosted prerequisites with reserve
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 2048

        sudo apt-get update

