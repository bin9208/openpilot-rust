        # Uses explicit --zmq-include from this fresh CARGO_TARGET_DIR (builder''s

        # implicit rust/target search would select the wrong or nonexistent cache).

        # Native child env has no GH_TOKEN/project-Python/PYTHONPATH and exact PATH.

        "$LOGGING_SELECTED_PYTHON" -I -B "$LOGGING_JOB/gates.py" run-all

