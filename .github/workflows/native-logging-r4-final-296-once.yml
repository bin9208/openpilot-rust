name: Native logging R4 admission
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/native-logging-r4-final-296-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: native-logging-296-serialized-publication
  cancel-in-progress: false
jobs:
  logging-final:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: 300f77e423750804b2a781d734128945a4b56765
      LOGGING_PHASE: admission
      LOGGING_GATE_SHA256: 3f6923ad992c437ee065c165c70ff27c11ec77be40757a7dafbcc5c812a15c45
      LOGGING_GATE_B64: 
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTFLAGS: ''
      RUSTDOCFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
      CARGO_ENCODED_RUSTDOCFLAGS: ''
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - name: Bind exact source, external diagnostics and fresh build namespace
      run: "set -euo pipefail\n[[ \"$SOURCE_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\n\
        test -z \"$(git status --porcelain --untracked-files=normal)\"\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$RUNNER_OS\"\
        \ = Linux\ntest \"$RUNNER_ARCH\" = X64\nlogging_job=$(mktemp -d \"/tmp/lg4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX\"\
        )\nmkdir \"$logging_job/evidence\" \"$logging_job/tmp\" \"$logging_job/cache\" \"$logging_job/cargo-home\"\nprintf\
        \ 'LOGGING_JOB=%s\\nLOGGING_PROOF_OUTPUT=%s/evidence\\nLOGGING_PUBLIC_OUTPUT=%s/public\\nCARGO_TARGET_DIR=%s/target\\\
        nCARGO_HOME=%s/cargo-home\\nXDG_CACHE_HOME=%s/cache\\nTMPDIR=%s/tmp\\n' \"$logging_job\" \"$logging_job\" \"$logging_job\"\
        \ \"$logging_job\" \"$logging_job\" \"$logging_job\" \"$logging_job\" >> \"$GITHUB_ENV\"\nprintf '%s' \"$LOGGING_GATE_B64\"\
        \ | base64 --decode > \"$logging_job/gates.py\"\nprintf '%s  %s\\n' \"$LOGGING_GATE_SHA256\" \"$logging_job/gates.py\"\
        \ | sha256sum --check --strict\nprintf 'workflow_head=%s\\nsource_commit=%s\\nphase=%s\\n' \"$GITHUB_SHA\" \"$SOURCE_SHA\"\
        \ \"$LOGGING_PHASE\" > \"$logging_job/evidence/source.txt\"\ngh api -H 'Cache-Control: no-cache' \"repos/bin9208/openpilot-rust/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100\"\
        \ > \"$logging_job/evidence/runner-jobs.json\"\npython3 -I -B - \"$logging_job\" <<'PY'\nimport json,os,platform,sys\n\
        from pathlib import Path\nassert sys.version_info[:2]==(3,12),'selected stdlib Python3.12 must be preinstalled'\n\
        job=Path(sys.argv[1]);assert job.resolve()==job and job.stat().st_uid==os.geteuid() and job.stat().st_mode&0o777==0o700\n\
        assert len(os.fsencode(str(job/'lifecycle-fixtures/logging-lifecycle-XXXXXX/output/s')))<=107,'actual short live socket\
        \ path budget'\njobs=json.loads((job/'evidence/runner-jobs.json').read_bytes())['jobs']\nassigned=[r for r in jobs\
        \ if r['name']=='logging-final' and r['status']=='in_progress']\nassert len(assigned)==1 and assigned[0]['runner_name']=='bin-actions'\n\
        assert set(assigned[0]['labels'])>={'self-hosted','Linux','X64','dev-md-local'}\naffinity=sorted(os.sched_getaffinity(0));assert\
        \ affinity\nmemory={line.split(':',1)[0]:line.split(':',1)[1].strip() for line in Path('/proc/meminfo').read_text().splitlines()}\n\
        available=int(memory['MemAvailable'].split()[0])*1024\ncgroup={name:(Path('/sys/fs/cgroup')/name).read_text().strip()\
        \ for name in ['cpu.max','memory.max'] if (Path('/sys/fs/cgroup')/name).exists()}\nif cgroup.get('memory.max','max')!='max':available=min(available,int(cgroup['memory.max']))\n\
        slots=len(affinity)\nif cgroup.get('cpu.max','max').split()[0]!='max':\n    quota,period=map(int,cgroup['cpu.max'].split());slots=min(slots,max(1,(quota+period-1)//period))\n\
        parallel=max(1,min(slots,8,available//(2<<30)))\ngrowth=8<<30;space=os.statvfs(job);free=space.f_bavail*space.f_frsize\n\
        assert free>=growth,('insufficient measured free space for estimated fresh target/cache growth',free,growth)\nrow={'runner_name':os.environ['RUNNER_NAME'],'job':assigned[0],'uname':list(platform.uname()),'cpu_count':os.cpu_count(),'cpu_affinity':affinity,'effective_cpu_slots':slots,'cgroup':cgroup,'memory':memory,'effective_memory_bytes':available,'cargo_build_jobs':parallel,'job_root':str(job),'workspace':os.environ['GITHUB_WORKSPACE'],'free_bytes':free,'estimated_growth_bytes':growth,'python':sys.executable,'global_cleanup_or_install':False}\n\
        (job/'evidence/runner-resources.json').write_text(json.dumps(row,indent=2)+'\\n')\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as output:output.write('CARGO_BUILD_JOBS='+str(parallel)+'\\nLOGGING_SELECTED_PYTHON='+sys.executable+'\\n')\nPY\n"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Record installed trusted runner toolchain; no global changes
      run: 'set -euo pipefail

        for tool in git gh c++ as ld ar curl ldd strace capnp cargo rustup; do command -v "$tool"; done > "$LOGGING_PROOF_OUTPUT/tool-paths.txt"

        rustup run 1.94.0 rustc -vV > "$LOGGING_PROOF_OUTPUT/rustc-version.txt"

        rustup run 1.94.0 cargo clippy --version > "$LOGGING_PROOF_OUTPUT/clippy-version.txt"

        c++ --version > "$LOGGING_PROOF_OUTPUT/compiler-version.txt"

        "$LOGGING_SELECTED_PYTHON" -I -B - <<''PY''

        import os

        from pathlib import Path

        space=os.statvfs(os.environ[''LOGGING_JOB''])

        assert space.f_bavail*space.f_frsize>=8<<30,''fresh native target/cache expected growth8GiB''

        assert ''host: x86_64-unknown-linux-gnu'' in (Path(os.environ[''LOGGING_PROOF_OUTPUT''])/''rustc-version.txt'').read_text()

        PY

        '
    - name: Fetch exact independent observations and workflow receipts
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > "$LOGGING_JOB/original.zip"

        printf ''%s  %s\n'' 3655dfbe1524303c7927bcdd0ede43599e75094fe787f0ec80d84a82cba3a516 "$LOGGING_JOB/original.zip" |
        sha256sum --check --strict

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12442250376/zip > "$LOGGING_JOB/r3.zip"

        printf ''%s  %s\n'' 6eddbcdae19c54cd6c19ad740ae1b881b59cb16261e9f9d7bd3878382dc1b6a5 "$LOGGING_JOB/r3.zip" | sha256sum
        --check --strict

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942 > "$LOGGING_JOB/original-metadata.json"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12442250376 > "$LOGGING_JOB/r3-metadata.json"

        # Reuse ONLY sealed passing subscopes of the failed39830442536 run.

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12449315453/zip > "$LOGGING_JOB/reuse.zip"

        printf ''%s  %s\n'' 1c1bbffd60895ee6ab2e6e93319b8b4315796ec953b8845fc8d693dd73740bd4 "$LOGGING_JOB/reuse.zip" | sha256sum
        --check --strict

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12449315453 > "$LOGGING_JOB/reuse-metadata.json"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/runs/39830442536 > "$LOGGING_JOB/reuse-run.json"

        gh api -H ''Cache-Control: no-cache'' ''repos/bin9208/openpilot-rust/contents/.github/workflows/native-logging-r4-final-296-once.yml?ref=19009790e9dedd6a85c714cda63784bae1dbbe33''
        --jq .content | base64 --decode > "$LOGGING_JOB/reuse-workflow.yml"

        gh api -H ''Cache-Control: no-cache'' "repos/bin9208/openpilot-rust/contents/.github/workflows/native-logging-r4-final-296-once.yml?ref=$GITHUB_SHA"
        --jq .content | base64 --decode > "$LOGGING_JOB/workflow.yml"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12451410669/zip > "$LOGGING_JOB/third.zip"

        printf ''%s  %s\n'' 26911d3911ad1f596ce8e433a4c8721f639ea3b9874138d168724cd513aa0343 "$LOGGING_JOB/third.zip" | sha256sum
        --check --strict

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12451410669 > "$LOGGING_JOB/third-metadata.json"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/runs/39833849895 > "$LOGGING_JOB/third-run.json"

        gh api -H ''Cache-Control: no-cache'' ''repos/bin9208/openpilot-rust/contents/.github/workflows/native-logging-r4-final-296-once.yml?ref=564276896cd312749d99eeb4e3a6c152ccf16b89''
        --jq .content | base64 --decode > "$LOGGING_JOB/third-workflow.yml"

        '
    - name: Authenticate corpora and source roles before native execution
      run: 'set -euo pipefail

        # Fetch the historical object for inert Git-blob authentication only.

        git fetch --no-tags --depth=1 origin cdc7f7c822736e913a672d15227a8e8f0cd0199d

        git fetch --no-tags --depth=1 origin bcf7b88ef40072adbaead10e980a84d018f00390

        git fetch --no-tags --depth=1 origin 40eb0429013cd853c1e74dc9530cdb5f484aa32c

        "$LOGGING_SELECTED_PYTHON" -I -B "$LOGGING_JOB/gates.py" preflight

        '
    - name: Build exact current providers and lint changed test; reuse unchanged source checks
      working-directory: rust
      run: "set -euo pipefail\nunset CARGO_BUILD_TARGET\ncargo +1.94.0 build --locked -p openpilot-dev-tools --features native-logging-check-native\
        \ --bin check-native-logging --bin build-native-logging-reference 2>&1 | tee \"$LOGGING_PROOF_OUTPUT/build-cli.log\"\
        \ncargo +1.94.0 build --locked -p openpilot-logging --example native_logging_probe 2>&1 | tee \"$LOGGING_PROOF_OUTPUT/build-probe.log\"\
        \ncargo +1.94.0 clippy --locked -p openpilot-dev-tools --features native-logging-check-native --test native_logging_lifecycle\
        \ -- -D warnings 2>&1 | tee \"$LOGGING_PROOF_OUTPUT/changed-test-clippy.log\"\nlogging_guard_changed=$(\"$LOGGING_SELECTED_PYTHON\"\
        \ -I -B -c 'import json,os;from pathlib import Path;print(int(json.loads((Path(os.environ[\"LOGGING_PROOF_OUTPUT\"\
        ])/\"source-checks-reuse.json\").read_bytes())[\"growth_policy_inputs_changed\"]))')\nif test \"$logging_guard_changed\"\
        \ = 1; then\n  cargo +1.94.0 clippy --locked -p openpilot-dev-tools --features native-logging-check-native --lib --bin\
        \ check-native-logging -- -D warnings 2>&1 | tee \"$LOGGING_PROOF_OUTPUT/clippy.log\"\n  cargo +1.94.0 check --locked\
        \ -p openpilot-dev-tools --no-default-features --lib 2>&1 | tee \"$LOGGING_PROOF_OUTPUT/no-default.log\"\nfi\ncargo\
        \ +1.94.0 test --locked -p openpilot-dev-tools --features native-logging-check-native --test native_logging_lifecycle\
        \ --no-run --message-format=json > \"$LOGGING_PROOF_OUTPUT/lifecycle-executable.jsonl\" 2> \"$LOGGING_PROOF_OUTPUT/lifecycle-executable.stderr\"\
        \n\"$LOGGING_SELECTED_PYTHON\" -I -B - <<'PY'\nimport json,os\nfrom pathlib import Path\nout=Path(os.environ['LOGGING_PROOF_OUTPUT']);changed=json.loads((out/'source-checks-reuse.json').read_bytes())['growth_policy_inputs_changed']\n\
        row={'build-cli':0,'build-probe':0,'unit':'reused:39830442536','cli-grammar':'reused:39830442536','changed-test-clippy':0,'lib-bin-clippy':0\
        \ if changed else 'reused:39833849895','no-default':0 if changed else 'reused:39833849895','lifecycle-executable':0}\n\
        (out/'build-stages.json').write_text(json.dumps(row,indent=2)+'\\n')\nPY\n"
    - name: Build original C++ outside protocol, then hold providers across all gates
      run: 'set -euo pipefail

        # One long-lived payload owns all source/provider FDs across admission,

        # lifecycle, admission checkout and finally snapshots. No Cargo inside that span.

        # Uses explicit --zmq-include from this fresh CARGO_TARGET_DIR (builder''s

        # implicit rust/target search would select the wrong or nonexistent cache).

        # Native child env has no GH_TOKEN/project-Python/PYTHONPATH and exact PATH.

        "$LOGGING_SELECTED_PYTHON" -I -B "$LOGGING_JOB/gates.py" run-all

        '
    - name: Require closed completion manifest and inspect unchanged source state
      run: 'set -euo pipefail

        "$LOGGING_SELECTED_PYTHON" -I -B "$LOGGING_JOB/gates.py" verify-completion

        # Independent envelope check: an empty/no-op substituted payload fails.

        "$LOGGING_SELECTED_PYTHON" -I -B - <<''PY''

        import json, os

        from pathlib import Path

        row = json.loads((Path(os.environ[''LOGGING_PROOF_OUTPUT'']) / ''completion.json'').read_bytes())

        assert row[''result''] == ''pass''

        assert row[''source_commit''] == os.environ[''SOURCE_SHA'']

        assert row[''phase''] == os.environ[''LOGGING_PHASE'']

        assert row[''gate_payload_sha256''] == os.environ[''LOGGING_GATE_SHA256'']

        required = {''historical_integrity'', ''source_roles'', ''held_providers'', ''cli_admission'', ''lifecycle_actual'',
        ''raw_replay'', ''closed_exec'', ''root_provenance'', ''source_state_after'', ''evidence_complete''}

        assert set(row[''checks'']) == required and all(value is True for value in row[''checks''].values())

        assert row[''phase''] == ''admission'' and row[''root_runs''] == [''checkout'']

        assert row[''two_source_absence''] is None

        PY

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        test -z "$(git status --porcelain --untracked-files=normal)"

        '
    - name: Always seal bounded diagnostics without executable or source copies
      if: always()
      run: "set -euo pipefail\nlogging_archive_python=${LOGGING_SELECTED_PYTHON:-$(command -v python3)}\nif test -n \"${LOGGING_JOB:-}\"\
        \ && test -f \"$LOGGING_JOB/gates.py\"; then\n  \"$logging_archive_python\" -I -B \"$LOGGING_JOB/gates.py\" pack-traces\n\
        fi\n\"$logging_archive_python\" -I -B - <<'PY'\nimport hashlib, json, os, stat\nfrom pathlib import Path\noutput =\
        \ Path(os.environ['LOGGING_PUBLIC_OUTPUT'])\noutput.mkdir(exist_ok=False)\nsource = Path(os.environ['LOGGING_PROOF_OUTPUT'])\
        \ if 'LOGGING_PROOF_OUTPUT' in os.environ else None\nmanifest = {}; excluded = []; size = 0\nif source is not None\
        \ and source.exists():\n    for path in sorted(source.rglob('*')):\n        status = path.lstat()\n        if stat.S_ISDIR(status.st_mode):\
        \ continue\n        relative = str(path.relative_to(source))\n        if not stat.S_ISREG(status.st_mode):\n     \
        \       raise AssertionError(('non-regular required evidence', relative))\n        size += status.st_size\n      \
        \  assert size <= 32 << 20, 'evidence exceeds immutable 32MiB bound'\n        data = path.read_bytes()\n        assert\
        \ not data.startswith(b'\\x7fELF'), relative\n        destination = output / relative\n        destination.parent.mkdir(parents=True,\
        \ exist_ok=True)\n        destination.write_bytes(data)\n        manifest[relative] = {'size': len(data), 'sha256':\
        \ hashlib.sha256(data).hexdigest()}\nseals = json.dumps(manifest, indent=2) + '\\n'\nomissions = json.dumps(excluded,\
        \ indent=2) + '\\n'\nassert size + len(seals.encode()) + len(omissions.encode()) <= 32 << 20, 'complete sealed evidence\
        \ exceeds32MiB'\n(output / 'content-seals.json').write_text(seals)\n(output / 'excluded.json').write_text(omissions)\n\
        PY\n"
      id: seal
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: native-logging-final-296-admission
        if-no-files-found: error
        include-hidden-files: true
        path: ${{ env.LOGGING_PUBLIC_OUTPUT }}/
      id: evidence
    - name: Clean only the owned per-job cache namespace
      if: always()
      env:
        LOGGING_EVIDENCE_UPLOADED: ${{ steps.evidence.outcome }}
        LOGGING_EVIDENCE_SEALED: ${{ steps.seal.outcome }}
      run: "set -euo pipefail\npython3 -I -B - <<'PY'\nimport os,re,shutil,stat\nfrom pathlib import Path\nname=os.environ.get('LOGGING_JOB')\n\
        if name:\n    job=Path(name)\n    assert job.parent==Path('/tmp') and job.resolve()==job and re.fullmatch('lg4-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+r'\\\
        .[A-Za-z0-9]{8}',job.name)\n    assert job.stat().st_uid==os.geteuid() and stat.S_IMODE(job.stat().st_mode)==0o700\n\
        \    assert not Path(os.environ['GITHUB_WORKSPACE']).resolve().is_relative_to(job)\n    for leaf in ['target','cargo-home','cache','tmp']:\n\
        \        path=job/leaf\n        if path.exists():\n            assert not path.is_symlink() and path.is_dir()\n  \
        \          shutil.rmtree(path)\n    if os.environ.get('LOGGING_EVIDENCE_UPLOADED')=='success' and os.environ.get('LOGGING_EVIDENCE_SEALED')=='success':\n\
        \        shutil.rmtree(job)\nPY\n"
