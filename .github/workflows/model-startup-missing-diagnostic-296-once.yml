        "LLVM_PATH": "/usr/lib/x86_64-linux-gnu/libLLVM-18.so",
        "PYTHONDONTWRITEBYTECODE": "1",
        "MODEL_FAMILY_STARTUP_MANIFEST_SHA256": "4c54c0d6fb375cec2d64c6ecfeb5ce709f223bbe0aeb0114b68c5a4e184c7416",
        "MODEL_FAMILY_USBGPU_MANIFEST_SHA256": "8774d6752cabaeba96bacd4bab009a9432f12e5231e8da608285ff5115b21ad8",
        "MODEL_FAMILY_CAPTURE_SOURCE": "0ec6cbae2d85fd98f2e0894697de7869f6159f51",
        "STARTUP_PAYLOAD_PARTS": "2",
        "STARTUP_PAYLOAD_SHA256": "ca8a1c91b0a2b0d12307130cdf1b382419a7d7b22c43fbc9f2448a12b4b57710",
        "STARTUP_PAYLOAD_0": "",
        "STARTUP_PAYLOAD_1": ""
      },
      "steps": [
        {
          "name": "Create private owned job and export shell-computed paths",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU MODEL_CATALOG_PUBLISH_BINARY MODEL_CATALOG_PUBLISH_SHA256\numask 077\nexport STARTUP_JOB=\"$RUNNER_TEMP/startup-missing-diagnostic-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\nexport STARTUP_SOURCE_ROOT=\"$STARTUP_JOB/work/source\" STARTUP_WORK_TEMP=\"$STARTUP_JOB/work/tmp\"\nexport HOME=\"$STARTUP_JOB/work/home\" CARGO_HOME=\"$STARTUP_JOB/work/cargo\" RUSTUP_HOME=\"$STARTUP_JOB/work/rustup\"\nexport TMPDIR=\"$STARTUP_WORK_TEMP\" XDG_CACHE_HOME=\"$STARTUP_JOB/work/xdg\" PIP_CACHE_DIR=\"$STARTUP_JOB/work/pip\"\nexport GH_CONFIG_DIR=\"$STARTUP_JOB/work/gh\" GIT_CONFIG_GLOBAL=\"$STARTUP_JOB/work/gitconfig\"\nexport CCACHE_DIR=\"$STARTUP_JOB/work/ccache\" SCCACHE_DIR=\"$STARTUP_JOB/work/sccache\"\nexport PYTHONPYCACHEPREFIX=\"$STARTUP_JOB/work/pycache\" PIP_CONFIG_FILE=/dev/null\nexport EXPECTED_SOURCE=\"$SOURCE_SHA\" CARGO_TARGET_DIR=\"$STARTUP_SOURCE_ROOT/rust/target\"\nexport MODEL_FAMILY_GATE_ROOT=\"$STARTUP_SOURCE_ROOT\" MODEL_FAMILY_GATE_PREPARATION=\"$STARTUP_JOB/work/preparation\"\nexport MODEL_FAMILY_GATE_ORIGINAL=\"$STARTUP_SOURCE_ROOT/rust/crates/dev-tools/tests/fixtures/model-family-original\"\nexport MODEL_STARTUP_CONTINUATION_HISTORY=\"$STARTUP_JOB/history\"\nexport PYTHONPATH=\"$STARTUP_SOURCE_ROOT:$STARTUP_SOURCE_ROOT/tinygrad_repo:$STARTUP_SOURCE_ROOT/rust/tools\"\n[[ $GITHUB_ACTIONS == true && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_NAME == bin-actions && $RUNNER_ARCH == X64 ]]\n[[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ && ! -e $STARTUP_JOB && ! -L $STARTUP_JOB ]]\n/usr/bin/python3 -I -B - <<'PY'\nimport base64,gzip,hashlib,json,os,pathlib\njob=pathlib.Path(os.environ['STARTUP_JOB']);assert job.parent.resolve()==pathlib.Path(os.environ['RUNNER_TEMP']).resolve()\njob.mkdir(mode=0o700);work=job/'work';work.mkdir(mode=0o700)\nfor name in ['home','cargo','rustup','tmp','xdg','pip','gh','ccache','sccache','pycache','preparation']:(work/name).mkdir(mode=0o700)\n(job/'evidence').mkdir()\nst=work.stat();(job/'ownership.json').write_text(json.dumps({'job':str(job.resolve()),'work':str(work.resolve()),'dev':st.st_dev,'ino':st.st_ino,'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']})+'\\n')\nblob=base64.b64decode(''.join(os.environ['STARTUP_PAYLOAD_'+str(i)] for i in range(int(os.environ['STARTUP_PAYLOAD_PARTS']))),validate=True)\nassert hashlib.sha256(blob).hexdigest()==os.environ['STARTUP_PAYLOAD_SHA256']\nraw=gzip.decompress(blob);assert len(raw)<=2<<20\npayload=json.loads(raw);manifest={}\nfor name,encoded in payload.items():\n assert pathlib.Path(name).name==name\n body=base64.b64decode(encoded,validate=True);(job/name).write_bytes(body);manifest[name]={'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}\n(job/'payload-manifest.json').write_text(json.dumps(manifest,indent=2)+'\\n')\n(job/'context.json').write_text(json.dumps({k:os.environ.get(k) for k in ['SOURCE_SHA','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_NAME','RUNNER_ARCH','ImageOS','ImageVersion']},indent=2)+'\\n')\nkeys=['STARTUP_JOB','STARTUP_SOURCE_ROOT','STARTUP_WORK_TEMP','HOME','CARGO_HOME','RUSTUP_HOME','TMPDIR','XDG_CACHE_HOME','PIP_CACHE_DIR','GH_CONFIG_DIR','GIT_CONFIG_GLOBAL','CCACHE_DIR','SCCACHE_DIR','PYTHONPYCACHEPREFIX','PIP_CONFIG_FILE','EXPECTED_SOURCE','CARGO_TARGET_DIR','MODEL_FAMILY_GATE_ROOT','MODEL_FAMILY_GATE_PREPARATION','MODEL_FAMILY_GATE_ORIGINAL','MODEL_STARTUP_CONTINUATION_HISTORY','PYTHONPATH']\nwith open(os.environ['GITHUB_ENV'],'a') as out:\n for key in keys:\n  value=os.environ[key];assert '\\n' not in value and '\\r' not in value;out.write(key+'='+value+'\\n')\nPY\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources bootstrap 0\n"
        },
        {
          "name": "Fetch current source and historical source objects without old checkout",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources source-fetch 8192\nunset GIT_TRACE GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE_PACKET GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES\ngit init --quiet \"$STARTUP_SOURCE_ROOT\"\nauth_header=$(printf 'x-access-token:%s' \"$GH_TOKEN\" | base64 -w0)\nfor commit in \"$SOURCE_SHA\" 52310bf93d687c8470afdf4699a8739779bc9eb4; do\n GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0=\"AUTHORIZATION: basic $auth_header\" git -C \"$STARTUP_SOURCE_ROOT\" fetch --no-tags --depth=1 https://github.com/bin9208/openpilot-rust.git \"$commit\"\ndone\nunset auth_header\ngit -C \"$STARTUP_SOURCE_ROOT\" checkout --quiet --detach \"$SOURCE_SHA\"\n[[ $(git -C \"$STARTUP_SOURCE_ROOT\" rev-parse HEAD) == \"$SOURCE_SHA\" && -z $(git -C \"$STARTUP_SOURCE_ROOT\" status --porcelain --untracked-files=normal) ]]\n[[ ! -e $STARTUP_SOURCE_ROOT/rust/target && ! -L $STARTUP_SOURCE_ROOT/rust/target ]]\n"
        },
        {
          "name": "Authenticate cancelled producer and exact42 historical observations",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources historical-download 1024\nrepo=repos/bin9208/openpilot-rust\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs\" > \"$STARTUP_JOB/runner-jobs-api.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/commits/$SOURCE_SHA\" > \"$STARTUP_JOB/source-api.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/contents/.github/workflows/model-startup-missing-diagnostic-296-once.yml?ref=$GITHUB_SHA\" > \"$STARTUP_JOB/workflow-api.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/runs/39819735679\" > \"$STARTUP_JOB/run.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/runs/39819735679/artifacts\" > \"$STARTUP_JOB/artifacts.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/runs/39819735679/jobs\" > \"$STARTUP_JOB/jobs.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/check-runs/119967521802/annotations\" > \"$STARTUP_JOB/annotations.json\"\nfor pair in '12448589411 main startup-39819735679.zip' '12449701764 sidecar sidecars-39819735679.zip'; do\n read -r id key file <<< \"$pair\"\n gh api -H 'Cache-Control: no-cache' \"$repo/actions/artifacts/$id\" > \"$STARTUP_JOB/$key-metadata.json\"\n gh api -H 'Cache-Control: no-cache' \"$repo/actions/artifacts/$id/zip\" > \"$STARTUP_JOB/$file\"\ndone\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/runs/39835797062\" > \"$STARTUP_JOB/saved-audit-run.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/artifacts/12453401046\" > \"$STARTUP_JOB/saved-audit-metadata.json\"\ngh api -H 'Cache-Control: no-cache' \"$repo/actions/artifacts/12453401046/zip\" > \"$STARTUP_JOB/saved-audit-39835797062.zip\"\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" authenticate\n"
        },
        {
          "name": "Record historical source and actual natural provider differences without transferring old42",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources before-boundary 0\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" boundary\n"
        },
        {
          "name": "Provision fresh private toolchain after exact current source authentication",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n# Reached after exact current source authentication. Never mutate OS packages.\nfor tool in g++ clang capnp pkg-config rustup cargo; do command -v \"$tool\"; done > \"$STARTUP_JOB/evidence/native-tool-paths.txt\"\ndpkg-query -W -f='${binary:Package}\\t${Version}\\t${Status}\\n' > \"$STARTUP_JOB/evidence/os-packages.tsv\"\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources toolchain 4096\nrustup toolchain install 1.94.0 --profile minimal --component clippy\nrustc +1.94.0 -Vv > \"$STARTUP_JOB/evidence/rustc-version.txt\"\n/usr/bin/python3 -m venv --copies \"$STARTUP_JOB/work/venv\"\n# The native preparer canonicalizes this path before launch; keep the private venv.\ntest -f \"$STARTUP_JOB/work/venv/bin/python\" && test -x \"$STARTUP_JOB/work/venv/bin/python\" && test ! -L \"$STARTUP_JOB/work/venv/bin/python\"\n\"$STARTUP_JOB/work/venv/bin/python\" -m pip install --disable-pip-version-check -r \"$STARTUP_JOB/history/providers.txt\" > \"$STARTUP_JOB/evidence/pip-install.log\" 2>&1\nprintf 'VIRTUAL_ENV=%s\\n' \"$STARTUP_JOB/work/venv\" >> \"$GITHUB_ENV\"\nprintf '%s\\n' \"$STARTUP_JOB/work/venv/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Compile current additive adapter and current native prerequisites only",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\nbash \"$STARTUP_JOB/build-current.sh\"\n"
        },
        {
          "name": "Stage exact model data and bind freshly built guarded/cached/publisher helpers",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\nbash \"$STARTUP_JOB/stage-current-data.sh\"\n"
        },
        {
          "name": "Authenticate44 original code images and static ABI as inert data",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\nbash \"$STARTUP_JOB/prepare-cached-data.sh\"\n"
        },
        {
          "name": "Admit actual configured publisher plus guarded/cached modes; retain current comparisons",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\nbash \"$STARTUP_JOB/export-current-catalogs.sh\"\n"
        },
        {
          "name": "Stage immutable USB assets without rerunning accepted staging controls",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\nbash \"$STARTUP_JOB/stage-usb-data.sh\"\n",
          "id": "prerequisites"
        },
        {
          "name": "Execute missing phase controls",
          "timeout-minutes": 41,
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources phase-controls 1024\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" phase controls\n",
          "if": "${{ !cancelled() && steps.prerequisites.outcome == 'success' }}",
          "continue-on-error": true
        },
        {
          "name": "Preserve phase controls raw outputs before later scopes",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "startup-missing-diagnostic-controls-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.STARTUP_JOB }}/evidence/phase-controls\n${{ env.MODEL_FAMILY_GATE_PREPARATION }}/startup-missing-diagnostic",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        },
        {
          "name": "Execute missing phase startup",
          "timeout-minutes": 26,
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources phase-startup 1024\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" phase startup\n",
          "if": "${{ !cancelled() && steps.prerequisites.outcome == 'success' }}",
          "continue-on-error": true
        },
        {
          "name": "Preserve phase startup raw outputs before later scopes",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "startup-missing-diagnostic-startup-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.STARTUP_JOB }}/evidence/phase-startup\n${{ env.MODEL_FAMILY_GATE_PREPARATION }}/startup-missing-diagnostic",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        },
        {
          "name": "Execute missing phase usb",
          "timeout-minutes": 26,
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources phase-usb 1024\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" phase usb\n",
          "if": "${{ !cancelled() && steps.prerequisites.outcome == 'success' }}",
          "continue-on-error": true
        },
        {
          "name": "Preserve phase usb raw outputs before later scopes",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "startup-missing-diagnostic-usb-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.STARTUP_JOB }}/evidence/phase-usb\n${{ env.MODEL_FAMILY_GATE_PREPARATION }}/startup-missing-diagnostic",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        },
        {
          "name": "Execute missing phase driver",
          "timeout-minutes": 26,
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources phase-driver 1024\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" phase driver\n",
          "if": "${{ !cancelled() && steps.prerequisites.outcome == 'success' }}",
          "continue-on-error": true
        },
        {
          "name": "Preserve phase driver raw outputs before later scopes",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "startup-missing-diagnostic-driver-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.STARTUP_JOB }}/evidence/phase-driver\n${{ env.MODEL_FAMILY_GATE_PREPARATION }}/startup-missing-diagnostic",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        },
        {
          "name": "Execute missing phase final",
          "timeout-minutes": 26,
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources phase-final 1024\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" phase final\n",
          "if": "${{ !cancelled() && steps.prerequisites.outcome == 'success' }}",
          "continue-on-error": true
        },
        {
          "name": "Preserve phase final raw outputs before later scopes",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "startup-missing-diagnostic-final-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.STARTUP_JOB }}/evidence/phase-final\n${{ env.MODEL_FAMILY_GATE_PREPARATION }}/startup-missing-diagnostic",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        },
        {
          "name": "Require every strict diagnostic scope; always keep full acceptance and historical transfer closed",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" finish\n",
          "if": "${{ !cancelled() && steps.prerequisites.outcome == 'success' }}"
        },
        {
          "name": "Always seal bounded complete failure/admission/native evidence",
          "if": "${{ always() }}",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" resources before-pack 0\n/usr/bin/python3 -I -B \"$STARTUP_JOB/gate.py\" pack\n",
          "id": "proof-pack"
        },
        {
          "id": "final-upload",
          "name": "Always preserve exact source and failure receipt before own-temp cleanup",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ always() }}",
          "with": {
            "name": "startup-missing-diagnostic-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.STARTUP_JOB }}/public",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Clean only authenticated owned work after successful evidence upload",
          "if": "${{ always() && steps.final-upload.outcome == 'success' && steps.proof-pack.outcome == 'success' }}",
          "run": "set -euo pipefail\nunset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET LD_PRELOAD LD_LIBRARY_PATH PYTHONHOME LLVM_CPU LLVM_TARGET_CPU\n/usr/bin/python3 -I -B - <<'PY'\nimport json,os,pathlib,shutil,stat\njob=pathlib.Path(os.environ['STARTUP_JOB']);meta=json.loads((job/'ownership.json').read_bytes());work=job/'work'\nassert job.parent.resolve()==pathlib.Path(os.environ['RUNNER_TEMP']).resolve() and meta['job']==str(job.resolve())\nassert meta['run']==os.environ['GITHUB_RUN_ID'] and meta['attempt']==os.environ['GITHUB_RUN_ATTEMPT']\nif work.exists():\n st=work.lstat();assert stat.S_ISDIR(st.st_mode) and not work.is_symlink() and str(work.resolve())==meta['work'] and (st.st_dev,st.st_ino)==(meta['dev'],meta['ino'])\n shutil.rmtree(work)\n(job/'owned-cleanup.json').write_text(json.dumps({'owned_work_removed':not work.exists(),'evidence_retained':True})+'\\n')\nPY\n"
        }
      ]
    }
  }
