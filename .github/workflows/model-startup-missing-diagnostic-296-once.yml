        "RUSTUP_TOOLCHAIN": "1.94.0",
        "GIT_CONFIG_NOSYSTEM": "1",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "CPU_COUNT": "2",
        "DEV": "CPU:LLVM",
        "JIT": "1",
        "JIT_BATCH_SIZE": "0",
