name: 296 native workflow metadata original comparison
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/ci-receipt-native-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f7c006fecadd781aa6b642534200e5a98c17f8da
        persist-credentials: false
    - name: Reserve disk and install hosted native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = f7c006fecadd781aa6b642534200e5a98c17f8da

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        mkdir "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y g++ capnproto libcapnp-dev pkg-config liblzma-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Compile, compare retained originals and lint native metadata CLI
      env:
        CI_RECEIPT_ORIGINAL: ${{ github.workspace }}/rust/crates/dev-tools/tests/fixtures/ci-receipt-original/original
        CI_RECEIPT_BINARY: ${{ github.workspace }}/rust/target/debug/ci-receipt-metadata
        CI_RECEIPT_EVIDENCE: ${{ runner.temp }}/driver-fixture-preflight/native-comparison
        CI_RECEIPT_MANIFEST_SHA256: 71d33e6e25f62c7a51240ecb4eb908acd35351a911b482869181fbfdffd130c1
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features ci-receipt-metadata-native --bin ci-receipt-metadata
        --locked > "$proof/build.stdout" 2> "$proof/build.stderr" || { tail -n 100 "$proof/build.stderr"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features ci-receipt-metadata-native --test ci_receipt_metadata
        --locked -- --nocapture > "$proof/unit.stdout" 2> "$proof/unit.stderr" || { tail -n 100 "$proof/unit.stderr" "$proof/unit.stdout";
        exit 1; }

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features ci-receipt-metadata-native --test ci_receipt_metadata
        --locked -- --ignored --nocapture > "$proof/original.stdout" 2> "$proof/original.stderr" || { tail -n 100 "$proof/original.stderr"
        "$proof/original.stdout"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features ci-receipt-metadata-native --lib --bin
        ci-receipt-metadata --test ci_receipt_metadata --locked -- -D warnings > "$proof/clippy.stdout" 2> "$proof/clippy.stderr"
        || { tail -n 100 "$proof/clippy.stderr"; exit 1; }

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-ci-receipt-metadata-native-296
        path: ${{ runner.temp }}/driver-fixture-preflight/
        if-no-files-found: error
        retention-days: 5
