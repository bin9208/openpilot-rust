{
  "name": "#296 R12 pristine disposable source checkout read-only assessment once",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/policy-r12-pristine-source-inventory-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "inventory": {
      "if": "${{ github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/codex/feat-296-local-validation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 25,
      "concurrency": {
        "group": "policy-r12-pristine-source-inventory-296-${{ github.repository }}-${{ github.ref }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "defaults": {
        "run": {
          "shell": "bash --noprofile --norc -euo pipefail {0}",
          "working-directory": "/tmp"
        }
      },
      "env": {
        "PYTHONOPTIMIZE": "0",
        "PYTHONNOUSERSITE": "1",
        "BASH_ENV": "/dev/null",
        "ENV": "/dev/null"
      },
      "steps": [
        {
          "name": "FIRST require trusted repo ref event and bin-actions before any metadata",
          "run": "set -euo pipefail\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONHOME:-} && -z ${PYTHONPATH:-} ]]\n[[ ${GITHUB_WORKFLOW_SHA:-} == \"$GITHUB_SHA\" && ${GITHUB_ACTIONS:-} == true ]]\n"
        },
        {
          "name": "Common fresh audit temp only; never cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "false"
          }
        },
        {
          "name": "Bind fresh output and admit bounded metadata growth",
          "run": "set -euo pipefail\numask 077\njob=$CI_JOB_TEMP\n[[ $job == /tmp/openpilot-ci.?????? && ! -L $job && -d $job ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\n[[ $(id -u) == 1000 && $(stat -c %u \"$job\") == 1000 ]]\nmkdir \"$job/policy-r12-pristine-source-inventory\" \"$job/inventory-tools\" \"$job/inventory-home\"\nout=\"$job/policy-r12-pristine-source-inventory\"\nprintf 'INVENTORY_OUT=%s\nINVENTORY_JOB_ID=%s\nHOME=%s/inventory-home\n' \"$out\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$job\" >> \"$GITHUB_ENV\"\nprintf 'phase=read-only-inventory\nworkflow=%s\nrun=%s\nattempt=%s\njob=%s\nrunner=%s\njob_identity=%s\ndelete=false\n' \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$RUNNER_NAME\" \"$(stat -c '%d:%i:%u' \"$job\")\" > \"$out/binding.txt\"\nprintf '%s\\n' '{\"phase\":\"ALLOCATION_ONLY_NOT_CURRENT_INVENTORY\",\"deletion_allowed\":false,\"deletion_executed\":false,\"approved_deletion_targets\":[],\"recovered_bytes\":0,\"current_metadata_complete\":false,\"build_capacity_released\":false,\"status\":\"HOLD\",\"historical_common_root_identity\":null,\"historical_marker_identity\":null,\"historical_marker_bytes\":null}' > \"$out/DECISION.json\"\ndf -PB1 \"$job\" > \"$out/disk.before.txt\"\n# Audit128MiB + upload staging128MiB +8MiB payload/seal/private metadata.\n# Private binary index cap4MiB; no source/object bodies copied to disk. Logical metadata cap512MiB.\n# This is not the unrelated unchanged16,642,998,272-byte bundle estimate.\navailable=$(df -PB1 \"$job\" | awk 'NR==2{print $4}')\n[[ $available =~ ^[0-9]+$ ]]\ngrowth=$((264*1024*1024))\nprintf '{\"available_bytes\":%s,\"planned_metadata_growth_bytes\":%s,\"fixed_reserve_bytes\":0}\n' \"$available\" \"$growth\" > \"$out/growth.json\"\nif ((available < growth)); then printf 'Metadata growth admission rejected: available=%s required=%s bytes\n' \"$available\" \"$growth\" >&2; exit 1; fi\n[[ -x /usr/bin/python3 && -x /usr/bin/timeout && -x /usr/bin/git ]]\n"
        },
        {
          "name": "Stage inert source inventory payload 1/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-00\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert source inventory payload 2/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-01\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert source inventory payload 3/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-02\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert source inventory payload 4/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-03\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert source inventory payload 5/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-04\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert source inventory payload 6/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-05\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Stage inert source inventory payload 7/7",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/inventory-tools/fragment-06\" <<'FROZEN'\\nFROZEN\n"
        },
        {
          "name": "Authenticate complete inert source payload",
          "id": "materialize",
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B -S - <<'PY'\nimport base64,gzip,hashlib,io,json,os\nfrom pathlib import Path\nroot=Path(os.environ['CI_JOB_TEMP'])/'inventory-tools'\nparts=[(root/('fragment-%02d'%i)).read_bytes().strip() for i in range(7)]\npacked=base64.b64decode(b''.join(parts),validate=True)\nif hashlib.sha256(packed).hexdigest()!='fc04df3e77f8b80349432224b4fd9cc8cb2d80d9cb91eb986f9de01db073fbc2':raise ValueError('compressed source hash')\nwith gzip.GzipFile(fileobj=io.BytesIO(packed)) as f:raw=f.read(1024*1024+1)\nif len(raw)>1024*1024 or hashlib.sha256(raw).hexdigest()!='7bea3d518fab7c64e0342d5fb5fe365729cc0d62a741b35ffc1fbe4b1c73e79d':raise ValueError('bounded source hash')\nbundle=json.loads(raw);pins={'inventory.py': {'bytes': 65550, 'sha256': '6b8771d164696b32478c8875b36f0767d6cc8eeace5235c33b26e1e4ddef1f8b'}, 'inputs.json': {'bytes': 11351, 'sha256': '71958f377b8dd07eaf839ee971d56fde34de836e8b9bd6797065abe273683b9f'}, 'dependencies.json': {'bytes': 9033, 'sha256': '929cbe4d8dba157a0e9c79e372272a714791f59a8840f791a8e54687233dd3f9'}}\nif set(bundle)!=set(pins):raise ValueError('source roster')\ndecoded={n:base64.b64decode(bundle[n],validate=True) for n in pins}\nfor n,d in decoded.items():\n if len(d)!=pins[n]['bytes'] or hashlib.sha256(d).hexdigest()!=pins[n]['sha256']:raise ValueError('source member hash')\nfor n,d in decoded.items():\n with (root/n).open('xb') as f:f.write(d)\nwith (Path(os.environ['INVENTORY_OUT'])/'PAYLOAD-PINS.json').open('x') as f:json.dump(pins,f,sort_keys=True,indent=2)\nwith (Path(os.environ['INVENTORY_OUT'])/'STATIC-DEPENDENCIES.json').open('xb') as f:f.write(decoded['dependencies.json'])\nPY\n"
        },
        {
          "name": "Read-only exact historical checkout source assessment",
          "id": "metadata",
          "env": {
            "INVENTORY_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nprintf '%s  %s\\n' '6b8771d164696b32478c8875b36f0767d6cc8eeace5235c33b26e1e4ddef1f8b' \"$CI_JOB_TEMP/inventory-tools/inventory.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '71958f377b8dd07eaf839ee971d56fde34de836e8b9bd6797065abe273683b9f' \"$CI_JOB_TEMP/inventory-tools/inputs.json\" | sha256sum --check --strict -\nprintf '%s  %s\\n' '929cbe4d8dba157a0e9c79e372272a714791f59a8840f791a8e54687233dd3f9' \"$CI_JOB_TEMP/inventory-tools/dependencies.json\" | sha256sum --check --strict -\n# Own bounded stdlib metadata observer only. Old source/programs never executed.\n/usr/bin/timeout --signal=TERM --kill-after=10s 850s /usr/bin/python3 -I -B -S \"$CI_JOB_TEMP/inventory-tools/inventory.py\" inventory > \"$INVENTORY_OUT/metadata.stdout\" 2> \"$INVENTORY_OUT/metadata.stderr\"\n"
        },
        {
          "name": "Always seal available own raw evidence independently",
          "id": "seal",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "env": {
            "METADATA_OUTCOME": "${{ steps.metadata.outcome }}"
          },
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ ! -L $job && -d $job && $(stat -c '%d:%i:%u' \"$job\") == \"$INVENTORY_JOB_ID\" ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nprintf 'metadata_step=%s\nphase=R12-pristine-source-readonly\ndeletion_allowed=false\nrecovered_bytes=0\nbuild_capacity_released=false\nfunctional_checks=UNRUN\n' \"$METADATA_OUTCOME\" > \"$INVENTORY_OUT/RAW-STATUS.txt\"\ndf -PB1 \"$job\" > \"$INVENTORY_OUT/disk.after.txt\"\n# This sealer is independent of materializer/observer/API admission failure.\n/usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/python3 -I -B -S - <<'PY'\nimport hashlib,json,os,stat,time\nfrom pathlib import Path\nCAP=128*1024*1024\nDEADLINE=time.monotonic()+50\n\ndef check_time():\n    if time.monotonic() > DEADLINE:\n        raise TimeoutError('inventory deadline')\n\n\ndef ident(s):\n    # Current directory identity never includes mutable directory mtime.\n    return dict(dev=s.st_dev, ino=s.st_ino, uid=s.st_uid, mode=s.st_mode)\n\n\ndef file_stat(s):\n    return dict(ident(s), size=s.st_size, mtime_ns=s.st_mtime_ns, ctime_ns=s.st_ctime_ns)\n\n\ndef hash_fd(fd):\n    h = hashlib.sha256(); offset = 0\n    while True:\n        check_time()\n        data = os.pread(fd, 1024 * 1024, offset)\n        if not data:\n            return h.hexdigest()\n        h.update(data); offset += len(data)\n\n\ndef bounded_fd(fd, limit):\n    data = os.pread(fd, limit + 1, 0)\n    if len(data) > limit:\n        raise ValueError('metadata read cap')\n    return data\n\n\ndef own_output():\n    job = os.environ['CI_JOB_TEMP']; out = Path(os.environ['INVENTORY_OUT'])\n    if str(out) != job + '/policy-r12-pristine-source-inventory' or out.is_symlink() or not out.is_dir():\n        raise ValueError('own output binding')\n    # The common helper provides the fresh root. Recheck its nofollow components and marker.\n    fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\n    try:\n        for part in Path(job).parts[1:]:\n            child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=fd)\n            os.close(fd); fd = child\n        s = os.fstat(fd)\n        if f'{s.st_dev}:{s.st_ino}:{s.st_uid}' != os.environ['INVENTORY_JOB_ID'] or s.st_uid != 1000:\n            raise ValueError('fresh output root identity')\n        marker = os.open('owner', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)\n        try:\n            ms = os.fstat(marker)\n            if not stat.S_ISREG(ms.st_mode) or ms.st_uid != 1000 or ms.st_nlink != 1:\n                raise ValueError('fresh output marker type')\n            expected = ':'.join(os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB')).encode()\n            if bounded_fd(marker, 256) != expected:\n                raise ValueError('fresh output marker')\n        finally:\n            os.close(marker)\n    finally:\n        os.close(fd)\n    return out, s\n\n\ndef seal_output(out):\n    \"\"\"Own flat audit only; same policy1054 member seal discipline, independent of admission outcome.\"\"\"\n    rows = []; total = 0\n    with os.scandir(out) as entries:\n        for entry in entries:\n            s = entry.stat(follow_symlinks=False)\n            if not stat.S_ISREG(s.st_mode) or s.st_uid != os.getuid() or s.st_nlink != 1 or len(rows) >= 10000:\n                raise ValueError('foreign/nonregular audit output')\n            total += s.st_size\n            if total > CAP:\n                raise ValueError('audit byte cap')\n            fd = os.open(entry.path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n            try:\n                before = file_stat(os.fstat(fd)); digest = hash_fd(fd)\n                if file_stat(os.fstat(fd)) != before:\n                    raise ValueError('audit file changed during sealing')\n            finally:\n                os.close(fd)\n            rows.append(dict(path=entry.name, bytes=s.st_size, sha256=digest))\n    with (out / 'MEMBER-SEALS.json').open('x') as stream:\n        json.dump(dict(bytes=total, members=rows, summary_present=(out/'SUMMARY.json').is_file(),\n                       deletion_executed=False, deletion_allowed=False, recovered_bytes=0, build_capacity_released=False), stream, indent=2, sort_keys=True)\n        stream.write('\\n')\n\n\nout,_=own_output()\nseal_output(out)\nPY\n"
        },
        {
          "name": "Always upload complete available raw evidence independently of seal",
          "id": "evidence",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "policy-r12-pristine-source-inventory-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.INVENTORY_OUT }}",
            "retention-days": 14,
            "if-no-files-found": "error",
            "compression-level": 0
          }
        },
        {
          "name": "Record permanent no-delete and artifact receipt",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "env": {
            "UPLOAD_ID": "${{ steps.evidence.outputs.artifact-id }}",
            "UPLOAD_DIGEST": "${{ steps.evidence.outputs.artifact-digest }}",
            "UPLOAD_OUTCOME": "${{ steps.evidence.outcome }}",
            "SEAL_OUTCOME": "${{ steps.seal.outcome }}"
          },
          "run": "set -euo pipefail\nprintf 'Read-only R12 source: seal=%s upload=%s id=%s digest=%s; deletion_allowed=false recovered_bytes=0 build_capacity_released=false; functional checks UNRUN.\\n' \"$SEAL_OUTCOME\" \"$UPLOAD_OUTCOME\" \"$UPLOAD_ID\" \"$UPLOAD_DIGEST\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ]
    }
  }
}
