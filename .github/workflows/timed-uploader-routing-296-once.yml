name: 296 preserved native uploader routing and capacity proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/timed-uploader-routing-296-once.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: 9adb3fdf2c4107ed72d284d62fb7712ac16036ea
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 9adb3fdf2c4107ed72d284d62fb7712ac16036ea
        persist-credentials: false
    - name: Admit exact source and reserve bounded build capacity
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/timed-uploader-routing-296"

        mkdir "$proof"

        printf ''ROUTING_PROOF=%s\n'' "$proof" >> "$GITHUB_ENV"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$proof/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sha256sum .github/workflows/rust.yml rust/crates/dev-tools/tests/timed_ci.rs rust/crates/dev-tools/tests/ci_disk_bootstrap.rs
        rust/crates/dev-tools/tests/fixtures/timed-tools/support-ci-original.json > "$proof/inputs.before.sha256"

        '
    - name: Run exact routing mutation and capacity policy regressions
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test timed_ci --test ci_disk_bootstrap
        2>&1 | tee "$ROUTING_PROOF/tests.txt"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test timed_ci --test ci_disk_bootstrap
        -- -D warnings 2>&1 | tee "$ROUTING_PROOF/clippy.txt"

        sha256sum --check --strict "$ROUTING_PROOF/inputs.before.sha256" | tee "$ROUTING_PROOF/input-guards.txt"

        git diff --exit-code

        printf ''All selected functional and mutation regressions passed; source unchanged.\n'' > "$ROUTING_PROOF/accepted.txt"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: 296-timed-uploader-routing-${{ github.run_id }}
        path: ${{ runner.temp }}/timed-uploader-routing-296/
        retention-days: 4
        if-no-files-found: error
