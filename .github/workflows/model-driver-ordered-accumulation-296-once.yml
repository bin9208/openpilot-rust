name: 296 source-derived ordered FP32 convolution trace diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-ordered-accumulation-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  source-ordered-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
      DIAGNOSTIC_ATTEMPT: 20261022-driver-ordered-trace-01
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
        persist-credentials: false
    - name: Trace fixed source recurrence using exact rational FP32, no provider/model execution
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-ordered-trace"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        avail=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1)

        test "$avail" -ge 28991029248

        printf ''%s'' ''''
        | base64 --decode > "$proof/trace.py"

        printf ''b28f735150a501372880f2e34f2e911c0038442caf41678a19b0639d0c6b6cb7  %s/trace.py\n'' "$proof" | sha256sum --check
        --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12406095454/zip > "$proof/input.zip"

        printf ''837f89f4f48e9c4e0325efa79147ea81e6151066b44b2f6d974e37c981361353  %s/input.zip\n'' "$proof" | sha256sum --check
        --strict

        set +e

        TRACE_ARCHIVE="$proof/input.zip" TRACE_OUTPUT="$proof/output" timeout --signal=TERM --kill-after=5s 150s python3 "$proof/trace.py"
        > "$proof/stdout" 2> "$proof/stderr"

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$proof/status"

        printf ''b28f735150a501372880f2e34f2e911c0038442caf41678a19b0639d0c6b6cb7  %s/trace.py\n'' "$proof" | sha256sum --check
        --strict

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-ordered-accumulation-${{ env.DIAGNOSTIC_ATTEMPT }}
        path: '${{ runner.temp }}/driver-ordered-trace/output/

          ${{ runner.temp }}/driver-ordered-trace/stdout

          ${{ runner.temp }}/driver-ordered-trace/stderr

          ${{ runner.temp }}/driver-ordered-trace/status

          ${{ runner.temp }}/driver-ordered-trace/trace.py'
        if-no-files-found: warn
        retention-days: 7
