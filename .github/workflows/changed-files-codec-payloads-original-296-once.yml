name: 296 original UTF16 UTF32 Punycode payload observations
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-codec-payloads-original-296-once.yml
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 0e38b0ea419ac059a2e0628ca6422eac45af81e4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 0e38b0ea419ac059a2e0628ca6422eac45af81e4
        persist-credentials: false
    - name: Retain exact source and bound capacity
      shell: bash
      run: 'set -euo pipefail

        export CODEC_PAYLOAD_BASE="$RUNNER_TEMP/changed-files-codec-payloads-original-296"

        printf ''CODEC_PAYLOAD_BASE=%s\n'' "$CODEC_PAYLOAD_BASE" >> "$GITHUB_ENV"

        mkdir "$CODEC_PAYLOAD_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$CODEC_PAYLOAD_BASE/source.txt"

        git status --porcelain=v1 > "$CODEC_PAYLOAD_BASE/source.before"

        test ! -s "$CODEC_PAYLOAD_BASE/source.before"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Capture new original payloads without native execution
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''PAYLOAD'' > "$CODEC_PAYLOAD_BASE/capture-original.py"

        

        PAYLOAD

        printf ''e0f634bd6dede42e33e6218d18989523d3c0464bc65990096ae178dae87d5655  %s/capture-original.py\n'' "$CODEC_PAYLOAD_BASE"
        | sha256sum --check --strict

        python -I -B -VV > "$CODEC_PAYLOAD_BASE/python-provider.txt"

        /usr/bin/timeout --signal=TERM --kill-after=10s 60s python -I -B "$CODEC_PAYLOAD_BASE/capture-original.py" > "$CODEC_PAYLOAD_BASE/capture.stdout"
        2> "$CODEC_PAYLOAD_BASE/capture.stderr"

        git status --porcelain=v1 > "$CODEC_PAYLOAD_BASE/source.after"

        cmp "$CODEC_PAYLOAD_BASE/source.before" "$CODEC_PAYLOAD_BASE/source.after"

        '
    - if: always()
      name: Bound evidence
      shell: bash
      run: "set -euo pipefail\nif test -d \"$CODEC_PAYLOAD_BASE\"; then\n du -sm \"$CODEC_PAYLOAD_BASE\" > \"$CODEC_PAYLOAD_BASE/artifact-size-mib.txt\"\
        \n test \"$(cut -f1 \"$CODEC_PAYLOAD_BASE/artifact-size-mib.txt\")\" -le 4\nfi\n"
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-codec-payloads-original-296
        path: ${{ runner.temp }}/changed-files-codec-payloads-original-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
