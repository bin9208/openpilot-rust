name: 296 captured-target nonexecuting LLVM post-O2 diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-recorded-post-o2-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  post-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
      DIAGNOSTIC_ATTEMPT: 20261022-driver-recorded-post-o2-01
      DEV: CPU:LLVM
      LLVMOPT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
        persist-credentials: false
    - name: Record actual host separately; require x86_64 for captured-target codegen
      id: cpu
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-recorded-post-o2"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        lscpu --json > "$proof/lscpu.json"

        cat /proc/cpuinfo > "$proof/proc-cpuinfo.txt"

        uname -a > "$proof/uname.txt"

        git rev-parse HEAD > "$proof/source.txt"

        test "$(uname -m)" = x86_64

        printf ''{"status":"CAPTURED_TARGET_NONEXECUTING_RECOMPILATION","diagnostic_only":true,"compilation_executed":false,"interpretation_allowed":false,"retirement_acceptance":false,"actual_native_host_match_required":false}

        '' > "$proof/preflight-result.json"

        '
    - uses: actions/setup-python@v6
      if: success()
      with:
        python-version: 3.12.15
    - name: Prepare pinned LLVM provider and immutable paired evidence
      id: prepare
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-recorded-post-o2\"\ndf -B1 --output=avail \"$RUNNER_TEMP\" > \"\
        $proof/disk.before.txt\"\navail=$(df -B1 --output=avail \"$RUNNER_TEMP\" | tail -n1)\nif test \"$avail\" -lt 28991029248;\
        \ then\n # Only unused preinstalled SDKs on this disposable GitHub-hosted runner.\n # No local checkout, source, Python\
        \ setup, or current LLVM provider is removed.\n sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup\
        \ /opt/hostedtoolcache/CodeQL\n avail=$(df -B1 --output=avail \"$RUNNER_TEMP\" | tail -n1)\n test \"$avail\" -ge 37580963840\n\
        fi\ndf -B1 --output=avail \"$RUNNER_TEMP\" > \"$proof/disk.admitted.txt\"\ntest \"$avail\" -ge 28991029248\nmkdir\
        \ \"$proof/downloads\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends clang binutils jq\npython\
        \ -m pip install numpy==2.5.3 zstandard==0.25.0\npython -m pip freeze > \"$proof/providers.before.txt\"\ncurl --fail\
        \ --location --retry 3 --max-time 180 -o \"$proof/downloads/llvm18.deb\" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb\n\
        printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/downloads/llvm18.deb\\n' \"$proof\" |\
        \ sha256sum --check --strict\ndpkg-deb --extract \"$proof/downloads/llvm18.deb\" \"$proof/downloads/llvm\"\nprintf\
        \ '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\\
        n' \"$proof\" | sha256sum --check --strict\nprintf 'LLVM_PATH=%s/downloads/llvm/usr/lib/llvm-18/lib/libLLVM.so.1\\\
        n' \"$proof\" >> \"$GITHUB_ENV\"\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12398000737 --jq '{id,size_in_bytes,digest,workflow_run}'\
        \ > \"$proof/input-artifact-api.json\"\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12398000737/zip > \"\
        $proof/downloads/12398000737.zip\"\nprintf 'b347a0972c7a34ff1e8c08d287208771f196b1260424a40b946c7100ecb9fd26  %s/downloads/12398000737.zip\\\
        n' \"$proof\" | sha256sum --check --strict\nprintf '%s' ''\
        \ | base64 --decode > \"$proof/capture.py\"\nprintf 'c36c17b10469f873bebb5e12be1864ed2098f97c9d7da5285017fd80310fd69e\
        \  %s/capture.py\\n' \"$proof\" | sha256sum --check --strict\n"
    - name: Capture held target post-O2 IR without execution; require complete object identity
      if: success()
      shell: bash
      env:
        POST_O2_OUTPUT: ${{ runner.temp }}/driver-recorded-post-o2/output
        POST_O2_ARCHIVE: ${{ runner.temp }}/driver-recorded-post-o2/downloads/12398000737.zip
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-recorded-post-o2\"\nprintf '%s\\n' \"$(command -v python)\" \"\
        $(command -v objdump)\" \"$(command -v gh)\" \"$(command -v git)\" \"$(command -v sha256sum)\" \"$LLVM_PATH\" \"$proof/capture.py\"\
        \ \"$proof/downloads/12398000737.zip\" > \"$proof/guard-paths.txt\"\nprintf '%s\\n' \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/dmonitoringmodeld.py\"\
        \ \"$GITHUB_WORKSPACE/openpilot/common/transformations/model.py\" \"$GITHUB_WORKSPACE/openpilot/common/transformations/camera.py\"\
        \ \"$GITHUB_WORKSPACE/openpilot/system/camerad/cameras/nv12_info.py\" \"$GITHUB_WORKSPACE/rust/tools/check_pipeline_reference.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/original.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/pipeline.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/capture.py\" \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/engine/realize.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/runtime/support/compiler_cpu.py\" \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/renderer/llvmir.py\"\
        \ \"$GITHUB_WORKSPACE/tinygrad_repo/tinygrad/runtime/autogen/llvm.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/native.py\"\
        \ >> \"$proof/guard-paths.txt\"\nwhile IFS= read -r path; do\n sha256sum \"$path\"\ndone < \"$proof/guard-paths.txt\"\
        \ > \"$proof/shell-guards.before.sha256\"\nwhile IFS= read -r path; do\n stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"\
        $path\"\ndone < \"$proof/guard-paths.txt\" > \"$proof/shell-identities.before.txt\"\nstatus=0\nPOST_O2_OBJDUMP=\"\
        $(command -v objdump)\" timeout --signal=TERM --kill-after=10s 150s python \"$proof/capture.py\" > \"$proof/capture.stdout\"\
        \ 2> \"$proof/capture.stderr\" || status=$?\nprintf '%s\\n' \"$status\" > \"$proof/capture.status\"\ntest \"$status\"\
        \ -eq 0\n"
    - name: Verify independent source/provider/tool/input guards after success or failure
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-recorded-post-o2\"\n# Runs even after helper failure/timeout; independent\
        \ of Python finally blocks.\nstatus=0\npython -m pip freeze > \"$proof/providers.after.txt\" || status=1\ncmp \"$proof/providers.before.txt\"\
        \ \"$proof/providers.after.txt\" || status=1\nif test -f \"$proof/shell-guards.before.sha256\"; then\n sha256sum --check\
        \ --strict \"$proof/shell-guards.before.sha256\" > \"$proof/shell-guards.after.log\" 2>&1 || status=$?\n while IFS=\
        \ read -r path; do\n  stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\" || status=1\n done < \"$proof/guard-paths.txt\"\
        \ > \"$proof/shell-identities.after.txt\"\n cmp \"$proof/shell-identities.before.txt\" \"$proof/shell-identities.after.txt\"\
        \ || status=1\nelse\n status=1\nfi\nprintf '%s\\n' \"$status\" > \"$proof/shell-final-guards.status\"\ntest \"$status\"\
        \ -eq 0\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-recorded-post-o2-${{ env.DIAGNOSTIC_ATTEMPT }}
        if-no-files-found: warn
        retention-days: 14
        path: '${{ runner.temp }}/driver-recorded-post-o2/output/

          ${{ runner.temp }}/driver-recorded-post-o2/*.json

          ${{ runner.temp }}/driver-recorded-post-o2/*.txt

          ${{ runner.temp }}/driver-recorded-post-o2/*.log

          ${{ runner.temp }}/driver-recorded-post-o2/*.sha256

          ${{ runner.temp }}/driver-recorded-post-o2/*.status

          ${{ runner.temp }}/driver-recorded-post-o2/capture.py

          ${{ runner.temp }}/driver-recorded-post-o2/capture.stdout

          ${{ runner.temp }}/driver-recorded-post-o2/capture.stderr'
