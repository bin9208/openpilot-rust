{
  "name": "Logger peer source repair987 new contracts once R4",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/loggerd-peer-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "loggerd-peer": {
      "if": "${{ github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/codex/feat-296-local-validation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 75,
      "concurrency": {
        "group": "loggerd-peer-296-${{ github.repository }}-${{ github.ref }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "env": {
        "SOURCE_SHA": "987ac79eae17805a528f8c19231c6fc2cec55a7a",
        "CARGO_BUILD_JOBS": "1",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "CARGO_TERM_COLOR": "never"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Deny fork source and require registered local runner",
          "shell": "bash",
          "env": {
            "SOURCE_ALLOWED": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
          },
          "run": "test \"${SOURCE_ALLOWED:-}\" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }\nset -euo pipefail\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$RUNNER_ENVIRONMENT\" = self-hosted\ntest \"$RUNNER_OS\" = Linux\ntest \"$RUNNER_ARCH\" = X64\n"
        },
        {
          "name": "Common owned shell output",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Allocate private source and tools before checkout",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "working-directory": "${{ github.workspace }}",
          "run": "set -euo pipefail\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\njob=$CI_JOB_TEMP\nowner=\"${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}\"\ntest \"$(cat \"$job/owner\")\" = \"$owner\"\numask 077\nmkdir \"$job/proof\" \"$job/cache\" \"$job/home\"\nprintf '%s\n' \"ROUTING_PROOF=$job/proof\" \"HOME=$job/home\" \"CARGO_HOME=$job/cargo-home\" \"RUSTUP_HOME=$job/rustup-home\" \"CARGO_TARGET_DIR=$job/target\" \"PIP_CACHE_DIR=$job/cache/pip\" \"XDG_CACHE_HOME=$job/cache\" >> \"$GITHUB_ENV\"\navailable=$(df -PB1 \"$workspace\" | awk 'NR == 2 {print $4}')\n[[ $available =~ ^[0-9]+$ ]]\nrequired=$((2 * 1024 * 1024 * 1024))\nprintf '{\"available_bytes\":%s,\"planned_source_growth_bytes\":%s}\n' \"$available\" \"$required\" > \"$job/proof/source-growth-before-checkout.json\"\n((available >= required))\nsource_owner=$(mktemp -d \"$workspace/.routing-296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX\")\nprintf '%s\n' \"$owner\" > \"$source_owner/.routing-owner\"\nmkdir \"$source_owner/source\"\nsource=\"$source_owner/source\"\nprintf '%s\n' \"ROUTING_SOURCE_OWNER=$source_owner\" \"ROUTING_SOURCE_IDENTITY=$(stat -c '%d:%i' -- \"$source_owner\")\" \"ROUTING_SOURCE=$source\" \"ROUTING_CHECKOUT_PATH=${source#\"$workspace/\"}\" >> \"$GITHUB_ENV\"\nprintf 'job=%s\nsource_owner=%s\nsource_identity=%s\nowner=%s\n' \"$job\" \"$source_owner\" \"$(stat -c '%d:%i' -- \"$source_owner\")\" \"$owner\" > \"$job/proof/owned-paths.txt\"\n\n# Private recipe bootstrap receipts exist even if checkout/provider setup fails.\nprintf '%s\\n' \"$SOURCE_SHA\" > \"$job/proof/SOURCE_COMMIT\"\nprintf '%s\\n' \"$GITHUB_SHA\" > \"$job/proof/WORKFLOW_COMMIT\"\nprintf '%s\\n' \"$RUNNER_NAME\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" > \"$job/proof/runner.txt\"\n# No inherited foreign target, linker/compiler wrapper or user package cache.\nfor key in RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CC CXX AR CAPNP PKG_CONFIG_PATH PKG_CONFIG_SYSROOT_DIR PKG_CONFIG_LIBDIR CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER; do\n  printf '%s=\\n' \"$key\" >> \"$GITHUB_ENV\"\ndone\n"
        },
        {
          "uses": "actions/checkout@v7",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "with": {
            "ref": "${{ env.SOURCE_SHA }}",
            "path": "${{ env.ROUTING_CHECKOUT_PATH }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          }
        },
        {
          "name": "Expose provisioned Rust shims",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Initialize bounded payload assembly",
          "run": "set -euo pipefail\nmkdir \"$CI_JOB_TEMP/peer-gate\"\n: > \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\"\n: > \"$CI_JOB_TEMP/peer-gate/observe.py.b64\"\n: > \"$CI_JOB_TEMP/peer-gate/finalize.py.b64\"\ncat > \"$ROUTING_PROOF/payload-seals.json\" <<'SEALS'\n[\n  {\n    \"path\": \"ownership.py\",\n    \"bytes\": 17303,\n    \"sha256\": \"01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9\",\n    \"base64_bytes\": 23072\n  },\n  {\n    \"path\": \"observe.py\",\n    \"bytes\": 31404,\n    \"sha256\": \"3658d00dd1ff93a28fe5bf1756e88c4fee1d29e5e9aad40f9c3d29ee1a6a42b4\",\n    \"base64_bytes\": 41872\n  },\n  {\n    \"path\": \"finalize.py\",\n    \"bytes\": 4877,\n    \"sha256\": \"38293b9bc1d8035231cd7a7475aecd7cef35588101662e3209d9e6a616dc0538\",\n    \"base64_bytes\": 6504\n  }\n]\nSEALS\n"
        },
        {
          "name": "Stage bounded ownership.py fragment 1",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\")\" -eq 0\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\")\" -eq 12000\n"
        },
        {
          "name": "Stage bounded ownership.py fragment 2",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\")\" -eq 12000\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\")\" -eq 23072\n"
        },
        {
          "name": "Stage bounded observe.py fragment 1",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 0\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/observe.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 12000\n"
        },
        {
          "name": "Stage bounded observe.py fragment 2",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 12000\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/observe.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 24000\n"
        },
        {
          "name": "Stage bounded observe.py fragment 3",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 24000\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/observe.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 36000\n"
        },
        {
          "name": "Stage bounded observe.py fragment 4",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 36000\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/observe.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/observe.py.b64\")\" -eq 41872\n"
        },
        {
          "name": "Stage bounded finalize.py fragment 1",
          "env": {
            "PEER_PAYLOAD_PART": ""
          },
          "run": "set -euo pipefail\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/finalize.py.b64\")\" -eq 0\nprintf '%s' \"$PEER_PAYLOAD_PART\" >> \"$CI_JOB_TEMP/peer-gate/finalize.py.b64\"\ntest \"$(wc -c < \"$CI_JOB_TEMP/peer-gate/finalize.py.b64\")\" -eq 6504\n"
        },
        {
          "name": "Decode and authenticate ALL sealed payloads before imports",
          "id": "peer_materialize",
          "run": "set -euo pipefail\nbase64 --decode \"$CI_JOB_TEMP/peer-gate/ownership.py.b64\" > \"$CI_JOB_TEMP/peer-gate/ownership.py\"\nbase64 --decode \"$CI_JOB_TEMP/peer-gate/observe.py.b64\" > \"$CI_JOB_TEMP/peer-gate/observe.py\"\nbase64 --decode \"$CI_JOB_TEMP/peer-gate/finalize.py.b64\" > \"$CI_JOB_TEMP/peer-gate/finalize.py\"\nprintf '%s  %s\\n' '01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9' \"$CI_JOB_TEMP/peer-gate/ownership.py\" '3658d00dd1ff93a28fe5bf1756e88c4fee1d29e5e9aad40f9c3d29ee1a6a42b4' \"$CI_JOB_TEMP/peer-gate/observe.py\" '38293b9bc1d8035231cd7a7475aecd7cef35588101662e3209d9e6a616dc0538' \"$CI_JOB_TEMP/peer-gate/finalize.py\" | sha256sum --check -\nprintf '%s\\n' 'All three combined decoded payloads authenticated before import.' > \"$ROUTING_PROOF/payload-authenticated.txt\"\n"
        },
        {
          "name": "Compile first, then new untraced peer/kernel/barrier and real INT/TERM controls",
          "id": "peer_qualification",
          "working-directory": "${{ env.ROUTING_SOURCE }}",
          "run": "set -euo pipefail\n# Empty inherited overrides must be absent for cc/pkg-config's normal discovery.\nunset RUSTC RUSTDOC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET CARGO_BUILD_RUSTC CARGO_BUILD_RUSTC_WRAPPER CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_RUSTFLAGS CC CXX AR CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CAPNP PKG_CONFIG_PATH PKG_CONFIG_SYSROOT_DIR PKG_CONFIG_LIBDIR CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER ZSTD_SYS_USE_PKG_CONFIG ZSTD_LIB_DIR ZSTD_INCLUDE_DIR ZSTD_STATIC ZMQ_LIB_DIR ZMQ_INCLUDE_DIR ZMQ_LIBS ZMQ_STATIC LD_PRELOAD LD_AUDIT\nprintf '%s  %s\\n' '01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9' \"$CI_JOB_TEMP/peer-gate/ownership.py\" '3658d00dd1ff93a28fe5bf1756e88c4fee1d29e5e9aad40f9c3d29ee1a6a42b4' \"$CI_JOB_TEMP/peer-gate/observe.py\" '38293b9bc1d8035231cd7a7475aecd7cef35588101662e3209d9e6a616dc0538' \"$CI_JOB_TEMP/peer-gate/finalize.py\" | sha256sum --check -\npython3 -E -s \"$CI_JOB_TEMP/peer-gate/observe.py\" > \"$ROUTING_PROOF/observer.stdout\" 2> \"$ROUTING_PROOF/observer.stderr\"\n"
        },
        {
          "name": "Always recover owned children and retain bounded raw failure evidence",
          "id": "peer_seal",
          "if": "${{ always() && env.ROUTING_PROOF != '' }}",
          "run": "set -euo pipefail\nverify_payloads() {\nprintf '%s  %s\\n' '01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9' \"$CI_JOB_TEMP/peer-gate/ownership.py\" '3658d00dd1ff93a28fe5bf1756e88c4fee1d29e5e9aad40f9c3d29ee1a6a42b4' \"$CI_JOB_TEMP/peer-gate/observe.py\" '38293b9bc1d8035231cd7a7475aecd7cef35588101662e3209d9e6a616dc0538' \"$CI_JOB_TEMP/peer-gate/finalize.py\" | sha256sum --check -\n}\nif verify_payloads; then\n  python3 -E -s \"$CI_JOB_TEMP/peer-gate/finalize.py\"\nelse\n  # Never import even a partially staged or changed ownership/finalize module.\n  # If a child had run, ownership is unresolved: preserve all private raw data.\n  mkdir \"$CI_JOB_TEMP/upload\"\n  printf '%s\\n' '{\"complete\":false,\"reason\":\"combined payload authentication failed; ownership unresolved; raw originals retained in private job\"}' > \"$CI_JOB_TEMP/upload/manifest.json\"\n  exit 1\nfi\n"
        },
        {
          "name": "Retain exact-source new peer evidence even on failure",
          "id": "evidence",
          "if": "${{ always() && env.CI_JOB_TEMP != '' }}",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "loggerd-peer-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CI_JOB_TEMP }}/upload",
            "retention-days": 14,
            "include-hidden-files": true,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Clean only uploaded, sealed, successful private peer source",
          "id": "owned_source_cleanup",
          "if": "${{ always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' && steps.peer_qualification.outcome == 'success' && steps.peer_seal.outcome == 'success' && env.ROUTING_SOURCE_OWNER != '' }}",
          "working-directory": "${{ github.workspace }}",
          "env": {
            "UPLOAD_ID": "${{ steps.evidence.outputs.artifact-id }}",
            "UPLOAD_DIGEST": "${{ steps.evidence.outputs.artifact-digest }}"
          },
          "run": "set -euo pipefail\n[[ $UPLOAD_ID =~ ^[0-9]+$ ]]\n[[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\np=$ROUTING_SOURCE_OWNER\ncase \"$p\" in \"$workspace/.routing-296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"??????) ;; *) exit 1 ;; esac\ntest -d \"$p\" && test ! -L \"$p\"\ntest \"$(realpath -e -- \"$p\")\" = \"$p\"\ntest \"$(stat -c '%u' -- \"$p\")\" = \"$(id -u)\"\ntest \"$(stat -c '%d:%i' -- \"$p\")\" = \"$ROUTING_SOURCE_IDENTITY\"\ntest -f \"$p/.routing-owner\" && test ! -L \"$p/.routing-owner\"\ntest \"$(cat \"$p/.routing-owner\")\" = \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\ntest \"$ROUTING_SOURCE\" = \"$p/source\"\ntest -d \"$p/source\" && test ! -L \"$p/source\"\ntest \"$(realpath -e -- \"$p/source\")\" = \"$p/source\"\nrm -rf --one-file-system -- \"$p\"\n# Common action, still byte-identical to #502, checks/deletes only CI_JOB_TEMP.\n"
        },
        {
          "name": "Clean common owned shell output",
          "if": "${{ always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' && steps.owned_source_cleanup.outcome == 'success' }}",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  }
}
