name: Python Rust 523 native units
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-native-units.yml
  workflow_dispatch:
    inputs:
      crate:
        description: 필요한 집중 검사만 선택한다. 필수 PR 게이트는 별도로 유지한다.
        type: choice
        default: all
        options:
        - all
        - control
        - model
        - tools
        - buffers
        - planner
        - compiler-export
permissions:
  contents: read
concurrency:
  group: python-rust-523-native-units-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  native-units:
    name: Native ${{ matrix.crate }} units on registered local runner
    if: ${{ github.repository == 'bin9208/openpilot-rust' }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
        github.repository }}
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
      NATIVE_UNITS_CRATE: ${{ matrix.crate }}
    steps:
    - name: Deny fork source and require registered local runner
      id: trust
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
        test "$GITHUB_REF" = refs/heads/codex/feat-523-python-rust
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -s)" = Linux
        test "$(uname -m)" = x86_64
        printf 'TRUSTED=true\n' >> "$GITHUB_OUTPUT"
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
    - name: Common owned job temporary paths
      id: job_temp
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Admit source growth and allocate private DIAG_SOURCE before checkout
      id: allocation
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        umask 077
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        [[ $job == /tmp/openpilot-ci.?????? && ${job%/*} == /tmp && ! -L $job ]]
        test "$(realpath -e -- "$job")" = "$job"
        test "$(stat -c '%u' -- "$job")" = "$(id -u)"
        test -f "$job/owner" && test ! -L "$job/owner"
        test "$(cat "$job/owner")" = "$owner"
        mkdir "$job/proof"
        printf 'DIAG_JOB_IDENTITY=%s\n' "$(stat -c '%d:%i' -- "$job")" >> "$GITHUB_ENV"
        trap 'rc=$?; printf "exit_code=%s\n" "$rc" > "$job/proof/source-preflight.status"' EXIT
        printf 'owner=%s\nsource=%s\nrunner=%s\nenvironment=%s\nos=%s\narch=%s\n' \
          "$owner" "$GITHUB_SHA" "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner-and-owner.txt"
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before-checkout.txt"
        cat /proc/meminfo > "$job/proof/memory-before-checkout.txt"
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        mkdir "$job/home" "$job/cache" "$job/cargo-home" "$job/rustup-home"
        # Mark the allocation attempt before mktemp; an incomplete binding is
        # retained for inspection rather than guessed at during cleanup.
        printf 'DIAG_ALLOCATION_STARTED=true\n' >> "$GITHUB_ENV"
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        source="$source_owner/source"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" \
          "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" \
          "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" >> "$GITHUB_ENV"
        mkdir "$source"
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' \
          "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" \
          "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" \
          "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'source_owner=%s\nsource_identity=%s\nsource=%s\n' \
          "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" > "$job/proof/source-ownership.txt"
    - name: Checkout into the owned private source
      id: checkout
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
        submodules: false
    - name: Seal exact source and tracked index before native checks
      id: source_before
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        git ls-files --stage -z > "$CI_JOB_TEMP/proof/index-stage-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" \
          -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
        sha256sum rust/Cargo.toml rust/Cargo.lock rust/rust-toolchain.toml \
          rust/crates/control-policy/Cargo.toml rust/crates/control-policy/src/drive.rs \
          rust/crates/control-policy/tests/drive.rs rust/crates/control-policy/tests/math.rs \
          rust/crates/model-runtime/Cargo.toml rust/crates/model-runtime/src/compiler_launch.rs \
          rust/crates/model-runtime/src/compiler_schedule.rs rust/crates/model-runtime/tests/compiler_launch.rs \
          rust/crates/model-runtime/tests/compiler_schedule.rs rust/tools/model_export/offline_schedule.py \
          rust/tools/model_export/schema.py rust/tools/prepare-readonly-ci-rust > "$CI_JOB_TEMP/proof/focused-source.sha256"
        allocated=$(du -sx --block-size=1 "$DIAG_SOURCE_OWNER" | cut -f1)
        [[ $allocated =~ ^[0-9]+$ ]]
        printf '{"allocated_private_source_bytes":%s,"planned_source_growth_bytes":2147483648}\n' \
          "$allocated" > "$CI_JOB_TEMP/proof/source-growth-after-checkout.json"
        ((allocated <= 2 * 1024 * 1024 * 1024))
    - name: Admit measured memory cgroup headroom and per-filesystem growth budgets
      id: resources
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        cat > "$CI_JOB_TEMP/admit-native-units.py" <<'ADMISSION'
        import json, os, pathlib, re, subprocess, sys
        P = pathlib.Path
        gib = 1024**3
        proof = P(os.environ['CI_JOB_TEMP'])/'proof'
        result = {'phase': sys.argv[1], 'pass': False, 'measured_peak_guarantee': False,
                  'planned_memory_bytes': 2*gib, 'filesystems': [], 'cgroup_limits': []}
        failures = []
        try:
            mem = dict(line.split(':', 1) for line in P('/proc/meminfo').read_text().splitlines())
            available = int(mem['MemAvailable'].split()[0])*1024
            result['mem_available_bytes'] = available
            effective = available
            members = [line.split(':', 2) for line in P('/proc/self/cgroup').read_text().splitlines()]
            result['cgroup_membership'] = members
            mounts = P('/proc/self/mountinfo').read_text().splitlines()
            def unescape(value):
                return re.sub(r'\\([0-7]{3})', lambda m: chr(int(m[1], 8)), value)
            for mount in mounts:
                fields = mount.split(); sep = fields.index('-')
                fs = fields[sep+1]
                if fs == 'cgroup2':
                    matching = [v[2] for v in members if v[0] == '0' and v[1] == '']
                    limit_name, usage_name = 'memory.max', 'memory.current'
                elif fs == 'cgroup' and 'memory' in fields[sep+3].split(','):
                    matching = [v[2] for v in members if 'memory' in v[1].split(',')]
                    limit_name, usage_name = 'memory.limit_in_bytes', 'memory.usage_in_bytes'
                else:
                    continue
                mount_root, mountpoint = P(unescape(fields[3])), P(unescape(fields[4]))
                for member in matching:
                    relative = P(member).relative_to(mount_root)
                    if '..' in relative.parts:
                        raise ValueError('unresolved cgroup namespace membership')
                    current = (mountpoint/relative).resolve(strict=True)
                    current.relative_to(mountpoint)
                    while True:
                        limit_file, usage_file = current/limit_name, current/usage_name
                        if limit_file.exists():
                            text = limit_file.read_text().strip()
                            if text != 'max' and int(text) < 2**60:
                                limit, usage = int(text), int(usage_file.read_text())
                                remaining = max(0, limit-usage)
                                result['cgroup_limits'].append({'path': str(current), 'limit_bytes': limit,
                                    'usage_bytes': usage, 'remaining_bytes': remaining})
                                effective = min(effective, remaining)
                        if current == mountpoint:
                            break
                        current = current.parent
            result['effective_memory_available_bytes'] = effective
            if effective < 2*gib:
                failures.append('insufficient actual memory/cgroup headroom for the 2 GiB operation')
            budgets = [(P(os.environ['CARGO_TARGET_DIR']), 4*gib, True),
                       (P(os.environ['CARGO_HOME']), gib, True),
                       (proof, gib//2, True), (P(os.environ['DIAG_SOURCE']), 2*gib, False)]
            groups = {}
            for path, budget, subtract_used in budgets:
                anchor = path
                while not anchor.exists():
                    anchor = anchor.parent
                used = int(subprocess.check_output(['du', '-sx', '--block-size=1', '--', str(path)],
                           text=True).split()[0]) if subtract_used and path.exists() else 0
                if used > budget:
                    failures.append(f'operation budget exceeded: {path}')
                remaining = max(0, budget-used) if subtract_used else budget
                device = anchor.stat().st_dev
                if device not in groups:
                    stat = os.statvfs(anchor)
                    groups[device] = {'device': device, 'available_bytes': stat.f_bavail*stat.f_frsize,
                                      'required_remaining_bytes': 0, 'operations': []}
                group = groups[device]
                group['required_remaining_bytes'] += remaining
                group['operations'].append({'path': str(path), 'budget_bytes': budget,
                    'allocated_bytes': used, 'remaining_bytes': remaining,
                    'source_growth_reserve': not subtract_used})
            result['filesystems'] = list(groups.values())
            for group in result['filesystems']:
                if group['available_bytes'] < group['required_remaining_bytes']:
                    failures.append(f'insufficient summed operation growth on device {group["device"]}')
        except Exception as error:
            failures.append(f'{type(error).__name__}: {error}')
        result['failures'] = failures
        result['pass'] = not failures
        (proof/f'admission-{sys.argv[1]}.json').write_text(json.dumps(result, indent=2)+'\n')
        print(json.dumps(result))
        sys.exit(0 if result['pass'] else 1)
        ADMISSION
        /usr/bin/python3 -I -B -S "$CI_JOB_TEMP/admit-native-units.py" before-sdk
    - name: Verify and seal the existing global official Rust SDK without installation
      id: sdk_before
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_NAME" = bin-actions
        test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
        test "$CARGO_HOME" = "$CI_JOB_TEMP/cargo-home"
        "$DIAG_SOURCE/rust/tools/prepare-readonly-ci-rust" before
    - name: Run the bounded no-default-feature unit and affected Clippy targets once
      id: native_checks
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      timeout-minutes: 25
      run: |
        set -euo pipefail
        umask 077
        sdk=$CI_PREPARED_RUST_ROOT
        test "$sdk" = /home/actions/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu
        test "$RUSTC" = "$sdk/bin/rustc"
        test "$RUSTDOC" = "$sdk/bin/rustdoc"
        export PATH="$sdk/bin:/usr/bin:/bin"
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS LD_PRELOAD LD_LIBRARY_PATH
        printf 'jobs=%s\nincremental=%s\ndev_debug=%s\ntest_debug=%s\nrustc=%s\ncargo=%s\nfeatures=no-default-features\n' \
          "$CARGO_BUILD_JOBS" "$CARGO_INCREMENTAL" "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG" \
          "$RUSTC" "$sdk/bin/cargo" > "$CI_JOB_TEMP/proof/compile-profile.txt"
        if [[ $NATIVE_UNITS_CRATE == buffers || $NATIVE_UNITS_CRATE == compiler-export ]]; then
          printf 'additional_features=native-skip-miri\n' >> "$CI_JOB_TEMP/proof/compile-profile.txt"
        fi
        failed=0
        run_once() {
          local label=$1 rc
          shift
          # Same shared target/registry budget, reduced by already allocated bytes;
          # Clippy does not receive a second 4 GiB target reservation.
          /usr/bin/python3 -I -B -S "$CI_JOB_TEMP/admit-native-units.py" "$label"
          if /usr/bin/timeout --signal=TERM --kill-after=30s 8m "$@" 2>&1 \
              | head -c 67108864 > "$CI_JOB_TEMP/proof/$label.log"; then
            rc=0
          else
            rc=$?
            failed=1
          fi
          printf '%s=%s\n' "$label" "$rc" >> "$CI_JOB_TEMP/proof/native-exit-codes.txt"
          tail -n 35 "$CI_JOB_TEMP/proof/$label.log"
        }
        case "$NATIVE_UNITS_CRATE" in
          control)
        run_once control-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-control-policy --test drive --test math
        run_once control-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-control-policy --lib --test drive --test math -- -D warnings
            ;;
          model)
        run_once model-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-model-runtime --test compiler_launch --test compiler_schedule
        run_once original-boundaries "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-model-runtime --test compiler_schedule \
          original_python_pipeline_boundaries_match_native -- --ignored --exact --nocapture
        # Prevent a renamed/missing ignored test from silently accepting zero tests.
        grep -F 'test result: ok. 1 passed; 0 failed;' "$CI_JOB_TEMP/proof/original-boundaries.log" || failed=1
        run_once model-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-model-runtime --lib --test compiler_launch --test compiler_schedule -- -D warnings
            ;;
          buffers)
        run_once compiler-buffer-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features --features native-skip-miri -p openpilot-model-runtime --test compiler_buffers
        grep -F 'test result: ok. 6 passed; 0 failed; 1 ignored;' "$CI_JOB_TEMP/proof/compiler-buffer-units.log" || failed=1
        buffer_python=$(readlink -e -- /usr/bin/python3)
        test -f "$buffer_python" && test -x "$buffer_python" && test ! -L "$buffer_python"
        sha256sum "$buffer_python" > "$CI_JOB_TEMP/proof/buffer-oracle-python.sha256"
        "$buffer_python" -I -B -S --version > "$CI_JOB_TEMP/proof/buffer-oracle-python.version"
        run_once original-buffers /usr/bin/env BUFFER_REFERENCE_PYTHON="$buffer_python" "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features --features native-skip-miri -p openpilot-model-runtime --test compiler_buffers \
          original_python_buffer_tables_match_native -- --ignored --exact --nocapture
        grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/original-buffers.log" || failed=1
        sha256sum --check --strict "$CI_JOB_TEMP/proof/buffer-oracle-python.sha256" || failed=1
        run_once compiler-buffer-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features --features native-skip-miri -p openpilot-model-runtime --lib --test compiler_buffers -- -D warnings
            ;;
          compiler-export)
        run_once compiler-export-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features --features native-skip-miri -p openpilot-model-runtime --test compiler_export_caller
        grep -F 'test result: ok. 4 passed; 0 failed; 1 ignored;' "$CI_JOB_TEMP/proof/compiler-export-units.log" || failed=1
        run_once maintained-compiler-export "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features --features native-skip-miri -p openpilot-model-runtime --test compiler_export_caller \
          maintained_python_export_calls_native_plan_without_fallback -- --ignored --exact --nocapture
        grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/maintained-compiler-export.log" || failed=1
        run_once compiler-export-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features --features native-skip-miri -p openpilot-model-runtime --lib \
          --bin offline-qcom-compile --test compiler_export_caller -- -D warnings
            ;;
          planner)
        run_once planner-controller-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test planner_ci_controller
        grep -F 'test result: ok. 14 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/planner-controller-units.log" || failed=1
        run_once planner-controller-retirement "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test planner_controller_retirement
        grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/planner-controller-retirement.log" || failed=1
        run_once planner-scheduler-adapter /usr/bin/env \
          PLANNER_NATIVE_SCHEDULER_TEST_BIN="$CARGO_TARGET_DIR/debug/check-plannerd-ci" \
          /usr/bin/python3 -I -B -m unittest discover -s rust/tools/tests -p test_plannerd_native_scheduler.py -v
        grep -E '^Ran 13 tests in ' "$CI_JOB_TEMP/proof/planner-scheduler-adapter.log" || failed=1
        grep -Fx 'OK' "$CI_JOB_TEMP/proof/planner-scheduler-adapter.log" || failed=1
        grep -E '^test_real_native_binary_receives_all_160_calls_with_matching_targets .* \.\.\. ok$' \
          "$CI_JOB_TEMP/proof/planner-scheduler-adapter.log" || failed=1
        run_once planner-controller-frozen "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test planner_controller_frozen -- --nocapture
        grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/planner-controller-frozen.log" || failed=1
        run_once planner-native-memory-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test planner_memory_controller
        grep -F 'test result: ok. 15 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/planner-native-memory-units.log" || failed=1
        run_once planner-controller-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --lib --bin check-plannerd-ci --test planner_ci_controller --test planner_controller_frozen --test planner_controller_retirement --test planner_memory_controller -- -D warnings
            ;;
          tools)
        run_once planner-policy "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test planner_ci_policy --test release_files
        grep -F 'test result: ok. 21 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/planner-policy.log" || failed=1
        grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/planner-policy.log" || failed=1
        run_once carrot-sdk-policy "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test ci_rust_isolation \
          carrot_x64_cold_bootstrap_rejects_partial_sdk_proxy_and_cleanup_escapes -- --exact
        grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/carrot-sdk-policy.log" || failed=1
        run_once registered-sdk-policy "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --test ci_disk_bootstrap \
          prepared_audit:: -- --nocapture --test-threads=1
        grep -F 'test result: ok. 11 passed; 0 failed; 1 ignored;' "$CI_JOB_TEMP/proof/registered-sdk-policy.log" || failed=1
        run_once minimal-prepared-audit-units "$sdk/bin/cargo" test --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-prepared-cold-audit --lib prepared_audit:: -- --nocapture --test-threads=1
        grep -F 'test result: ok. 11 passed; 0 failed; 1 ignored;' "$CI_JOB_TEMP/proof/minimal-prepared-audit-units.log" || failed=1
        run_once minimal-prepared-audit-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-prepared-cold-audit --all-targets -- -D warnings
        run_once planner-policy-clippy "$sdk/bin/cargo" clippy --manifest-path rust/Cargo.toml --locked \
          --no-default-features -p openpilot-dev-tools --lib --test planner_ci_policy --test release_files --test ci_disk_bootstrap --test ci_rust_isolation -- -D warnings
            ;;
          *) echo "unknown native crate" >&2; exit 1 ;;
        esac
        /usr/bin/python3 -I -B -S "$CI_JOB_TEMP/admit-native-units.py" after-native
        test "$failed" = 0
    - name: Seal source and tracked index after every attempted native check
      id: source_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && steps.source_before.outcome
        == 'success') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        git ls-files --stage -z > "$CI_JOB_TEMP/proof/index-stage-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" \
          -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/index-stage-before.bin" "$CI_JOB_TEMP/proof/index-stage-after.bin"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        sha256sum --check --strict "$CI_JOB_TEMP/proof/focused-source.sha256"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Verify and preserve whole global SDK files and roster after attempted checks
      id: sdk_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && steps.sdk_before.outcome
        == 'success') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        "$DIAG_SOURCE/rust/tools/prepare-readonly-ci-rust" after
    - name: Record all outcomes including initial source preflight failure
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && env.CI_JOB_TEMP
        != '' && env.DIAG_JOB_IDENTITY != '') }}
      working-directory: ${{ github.workspace }}
      env:
        ALLOCATION: ${{ steps.allocation.outcome }}
        CHECKOUT: ${{ steps.checkout.outcome }}
        SOURCE_BEFORE: ${{ steps.source_before.outcome }}
        RESOURCES: ${{ steps.resources.outcome }}
        SDK_BEFORE: ${{ steps.sdk_before.outcome }}
        NATIVE_CHECKS: ${{ steps.native_checks.outcome }}
        SOURCE_FINAL: ${{ steps.source_final.outcome }}
        SDK_FINAL: ${{ steps.sdk_final.outcome }}
      run: |
        set -euo pipefail
        test "$(stat -c '%d:%i' -- "$CI_JOB_TEMP")" = "$DIAG_JOB_IDENTITY"
        test "$(cat "$CI_JOB_TEMP/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        printf 'source=%s\nallocation=%s\ncheckout=%s\nsource_before=%s\nresources=%s\nsdk_before=%s\nnative_checks=%s\nsource_final=%s\nsdk_final=%s\nsdk_installations=0\nmodel_execution=false\nexternal_numerics_provider_execution=false\n' \
          "$GITHUB_SHA" "$ALLOCATION" "$CHECKOUT" "$SOURCE_BEFORE" "$RESOURCES" "$SDK_BEFORE" \
          "$NATIVE_CHECKS" "$SOURCE_FINAL" "$SDK_FINAL" > "$CI_JOB_TEMP/proof/outcomes.txt"
    - name: Retain owned proof even when initial source admission failed
      id: evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && env.CI_JOB_TEMP
        != '' && env.DIAG_JOB_IDENTITY != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: native-units-${{ matrix.crate }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        if-no-files-found: error
        retention-days: 14
    - name: Clean only uploaded owned source with successful source and SDK seals
      id: source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && steps.evidence.outcome
        == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '')
        }}
      working-directory: ${{ github.workspace }}
      env:
        UPLOAD_ID: ${{ steps.evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        SOURCE_SEAL: ${{ steps.source_final.outcome }}
        SDK_SEAL: ${{ steps.sdk_final.outcome }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ && $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        # The 2 GiB preflight can fail before any source allocation was attempted.
        if [[ ${DIAG_ALLOCATION_STARTED:-} != true ]]; then
          test -z "${DIAG_SOURCE_OWNER:-}"
          exit 0
        fi
        test "$SOURCE_SEAL" = success && test "$SDK_SEAL" = success
        workspace=${DIAG_ACTIONS_WORKSPACE:?owned workspace required}
        p=${DIAG_SOURCE_OWNER:?refuse incomplete allocation binding}
        case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
        test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
        test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$DIAG_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        rm -rf --one-file-system -- "$p"
    - name: Validate common temporary ownership before invoking shared cleanup
      id: temp_cleanup_admission
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && steps.source_cleanup.outcome
        == 'success' && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest
        != '') }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        [[ $CI_JOB_TEMP == /tmp/openpilot-ci.?????? && ${CI_JOB_TEMP%/*} == /tmp ]]
        test ! -L "$CI_JOB_TEMP"
        test "$(realpath -e -- "$CI_JOB_TEMP")" = "$CI_JOB_TEMP"
        test "$(stat -c '%u' -- "$CI_JOB_TEMP")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$CI_JOB_TEMP")" = "$DIAG_JOB_IDENTITY"
        test -f "$CI_JOB_TEMP/owner" && test ! -L "$CI_JOB_TEMP/owner"
        test "$(cat "$CI_JOB_TEMP/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
    - name: Reclaim only this uploaded common owned job temporary directory
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.SOURCE_ALLOWED == 'true' && steps.trust.outputs.TRUSTED == 'true' && steps.temp_cleanup_admission.outcome
        == 'success' && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest
        != '') }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
    strategy:
      fail-fast: false
      matrix:
        crate: "${{ fromJSON(github.event_name == 'push' && '[\"buffers\",\"planner\"]' || inputs.crate == 'all' && '[\"control\",\"model\",\"tools\",\"buffers\",\"planner\",\"compiler-export\"]' || inputs.crate == 'compiler-export' && '[\"compiler-export\"]' || inputs.crate == 'control' && '[\"control\"]' || inputs.crate == 'model' && '[\"model\"]' || inputs.crate == 'buffers' && '[\"buffers\"]' || inputs.crate == 'planner' && '[\"planner\"]' || '[\"tools\"]') }}"
