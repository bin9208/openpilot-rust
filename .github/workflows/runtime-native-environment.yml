name: Genuine AGNOS native compiler feasibility
on:
  push:
    branches: ['codex/feat-599-*', 'codex/feat-600-*']
    paths:
      - 'tools/ci/probe_native_agnos.py'
      - 'tools/ci/fixtures/native-agnos-assets-599.json'
      - 'rust/native-rust-toolchain.json'
      - 'rust/crates/runtime-build/src/toolchain.rs'
      - 'rust/crates/runtime-build/src/archive_tree.rs'
      - 'rust/crates/runtime-build/src/capnp.rs'
      - 'rust/crates/runtime-build/src/cargo_inputs.rs'
      - 'rust/crates/runtime-build/src/system_sdk.rs'
      - 'rust/crates/runtime-build/src/inputs.rs'
      - 'rust/native-system-sdk.json'
      - 'rust/native-cargo-inputs.json'
      - 'rust/Cargo.lock'
      - 'rust/crates/runtime-build/src/inputs_main.rs'
      - 'rust/crates/cereal/**'
      - 'rust/native-capnp-assets.json'
      - 'tools/ci/prepare_native_capnp.py'
      - 'tools/ci/native_cereal_reference.py'
      - 'tools/native/bootstrap_seed.py'
      - '.github/workflows/runtime-native-environment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-agnos-environment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler:
    name: Native compiler in pinned AGNOS ARM userspace
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - name: Admit this host tool and extract operation
        run: |
          test "$RUNNER_NAME" = bin-actions
          test "$RUNNER_ENVIRONMENT" = self-hosted
          python3 - <<'PY'
          import os, shutil
          growth = 4 * 1024**3
          for path in (os.environ['RUNNER_TEMP'], os.environ['GITHUB_WORKSPACE']):
              free = shutil.disk_usage(path).free
              print(f'path={path} available_bytes={free} expected_host_tool_growth_bytes={growth}')
              if free < growth:
                  raise SystemExit('insufficient capacity for this operation; other data retained')
          PY
          sudo apt-get -o APT::Architectures=amd64 update
          sudo apt-get -o APT::Architectures=amd64 install -y qemu-user-static android-sdk-libsparse-utils e2fsprogs xz-utils
          rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/cache/restore@v4
        id: image-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-agnos-assets
          key: native-agnos-image-077d42186def98025ffad9723774c96f45da10c87cc6fedbc58d0cf4fa65ffd4-v1
      - name: Prepare the exact genuine image through the content cache and prove zero-transfer repeat
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --bin openpilot-runtime-assets
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          "$native_target/debug/openpilot-runtime-assets" --plan tools/ci/fixtures/native-agnos-assets-599.json --cache "$RUNNER_TEMP/native-agnos-assets" > "$RUNNER_TEMP/native-agnos-assets-first.json"
          "$native_target/debug/openpilot-runtime-assets" --plan tools/ci/fixtures/native-agnos-assets-599.json --cache "$RUNNER_TEMP/native-agnos-assets" > "$RUNNER_TEMP/native-agnos-assets-reused.json"
      - uses: actions/cache/save@v4
        if: steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-agnos-assets
          key: native-agnos-image-077d42186def98025ffad9723774c96f45da10c87cc6fedbc58d0cf4fa65ffd4-v1
      - uses: actions/cache/restore@v4
        id: rust-components-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-rust-assets
          key: native-rust-194-aarch64-aaa177def36e01d539bee6bde95295230b9ce378f81057845db8d0ebe97898ee-v1
      - name: Prepare authenticated native Rust components and verify zero-transfer reuse
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --bin openpilot-runtime-inputs
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          "$native_target/debug/openpilot-runtime-inputs" --prepare-rust --plan rust/native-rust-toolchain.json \
            --cache "$RUNNER_TEMP/native-rust-assets" --store "$RUNNER_TEMP/native-rust-toolchains" > "$RUNNER_TEMP/native-rust-first.json"
          "$native_target/debug/openpilot-runtime-inputs" --prepare-rust --plan rust/native-rust-toolchain.json \
            --cache "$RUNNER_TEMP/native-rust-assets" --store "$RUNNER_TEMP/native-rust-toolchains" > "$RUNNER_TEMP/native-rust-reused.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['CI_JOB_TEMP'])
          first = json.loads((root/'native-rust-first.json').read_text())
          repeated = json.loads((root/'native-rust-reused.json').read_text())
          assert first['copied_bytes'] > 0 and repeated['copied_bytes'] == 0
          assert first['root'] == repeated['root'] and first['tree_sha256'] == repeated['tree_sha256']
          assert not first['compiler_executed'] and not first['runtime_activated']
          assert all(row['transferred_bytes'] in (0,row['bytes']) for row in first['assets'].values())
          assert all(row['transferred_bytes'] == row['stored_bytes'] == 0 for row in repeated['assets'].values())
          print('Authenticated ARM toolchain files prepared; repeated HTTP body and copied bytes both zero; compiler execution remains the following AGNOS step.')
          PY
      - uses: actions/cache/save@v4
        if: steps.rust-components-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-rust-assets
          key: native-rust-194-aarch64-aaa177def36e01d539bee6bde95295230b9ce378f81057845db8d0ebe97898ee-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: actions/cache/restore@v4
        id: capnp-packages-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-capnp-assets
          key: native-capnp-101-4-arm64-9d693ded6a718a142063ccf0bb3250fa4e15b846980362ec6c38cff2a711a81c-v1
      - name: Prepare only pinned SDK packages and the original full-schema reference
        run: |
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['CI_JOB_TEMP']).free
          growth = 512 * 1024**2
          print(f'available_bytes={free} expected_reference_and_sdk_growth_bytes={growth}')
          if free < growth:
              raise SystemExit('insufficient capacity for reference and SDK inputs; other data retained')
          PY
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          printf '%s\n' "$native_target/debug/openpilot-runtime-inputs" > "$RUNNER_TEMP/native-capnp-inputs-cli.txt"
          "$native_target/debug/openpilot-runtime-assets" --plan rust/native-capnp-assets.json --cache "$RUNNER_TEMP/native-capnp-assets" > "$RUNNER_TEMP/native-capnp-assets-first.json"
          "$native_target/debug/openpilot-runtime-assets" --plan rust/native-capnp-assets.json --cache "$RUNNER_TEMP/native-capnp-assets" > "$RUNNER_TEMP/native-capnp-assets-reused.json"
          python3 tools/ci/prepare_native_capnp.py
          "$native_target/debug/openpilot-runtime-inputs" --root "$RUNNER_TEMP/native-capnp" --output "$RUNNER_TEMP/native-capnp-dpkg-tree.json"
          "$native_target/debug/openpilot-runtime-inputs" --prepare-capnp --plan rust/native-capnp-assets.json \
            --cache "$RUNNER_TEMP/native-capnp-assets" --store "$RUNNER_TEMP/native-capnp-toolchains" > "$RUNNER_TEMP/native-capnp-first.json"
          "$native_target/debug/openpilot-runtime-inputs" --prepare-capnp --plan rust/native-capnp-assets.json \
            --cache "$RUNNER_TEMP/native-capnp-assets" --store "$RUNNER_TEMP/native-capnp-toolchains" > "$RUNNER_TEMP/native-capnp-reused.json"
          python3 - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['CI_JOB_TEMP'])
          first = json.loads((root/'native-capnp-first.json').read_text())
          repeat = json.loads((root/'native-capnp-reused.json').read_text())
          assert first['root'] == repeat['root'] and first['tree_sha256'] == repeat['tree_sha256']
          assert first['copied_bytes'] > 0 and repeat['copied_bytes'] == 0
          assert not first['compiler_executed'] and not first['runtime_activated']
          assert all(row['transferred_bytes'] == row['stored_bytes'] == 0 for r in (first,repeat) for row in r['assets'].values())
          original = json.loads((root/'native-capnp-dpkg-tree.json').read_text())['entries']
          actual = json.loads(Path(first['tree_receipt']).read_text())['entries']
          vendor = lambda tree: {p:v for p,v in tree.items() if p == 'usr' or p.startswith('usr/')}
          assert vendor(actual) == vendor(original), 'native SDK differs from independent dpkg-deb extraction'
          shutil.copyfile(first['tree_receipt'],root/'native-capnp-tree.json')
          print('Native preparation matches the independent vendor tree exactly; repeated HTTP body and copied bytes zero.')
          PYCODE
          python -m pip install pycapnp==2.1.0
          PYTHONPATH="$GITHUB_WORKSPACE" python3 tools/ci/native_cereal_reference.py
      - uses: actions/cache/save@v4
        if: steps.capnp-packages-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-capnp-assets
          key: native-capnp-101-4-arm64-9d693ded6a718a142063ccf0bb3250fa4e15b846980362ec6c38cff2a711a81c-v1
      - uses: actions/cache/restore@v4
        id: cargo-archives-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-cargo-assets
          key: native-cargo-crates-${{ hashFiles('rust/Cargo.lock') }}-v1
          restore-keys: native-cargo-crates-
      - name: Prepare the complete locked registry sources and prove zero-transfer repeat
        run: |
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          "$native_target/debug/openpilot-runtime-inputs" --prepare-cargo --plan rust/native-cargo-inputs.json --lock rust/Cargo.lock \
            --cache "$RUNNER_TEMP/native-cargo-assets" --store "$RUNNER_TEMP/native-cargo-sources" > "$RUNNER_TEMP/native-cargo-first.json"
          "$native_target/debug/openpilot-runtime-inputs" --prepare-cargo --plan rust/native-cargo-inputs.json --lock rust/Cargo.lock \
            --cache "$RUNNER_TEMP/native-cargo-assets" --store "$RUNNER_TEMP/native-cargo-sources" > "$RUNNER_TEMP/native-cargo-reused.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['CI_JOB_TEMP'])
          first = json.loads((root/'native-cargo-first.json').read_text())
          repeat = json.loads((root/'native-cargo-reused.json').read_text())
          assert first['packages'] == repeat['packages'] == 458
          assert first['root'] == repeat['root'] and first['tree_sha256'] == repeat['tree_sha256']
          assert first['copied_bytes'] > 0 and first['linked_bytes'] > 0
          assert repeat['copied_bytes'] == repeat['linked_bytes'] == 0
          assert not first['compiler_executed'] and not first['runtime_activated']
          assert all(row['transferred_bytes'] in (0,row['bytes']) for row in first['assets'].values())
          assert all(row['transferred_bytes'] == row['stored_bytes'] == 0 for row in repeat['assets'].values())
          print('Locked Cargo registry sources authenticated; repeated archive body, copied bytes and linked bytes all zero. Cache-service traffic is separate.')
          PYCODE
      - uses: actions/cache/save@v4
        if: steps.cargo-archives-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-cargo-assets
          key: native-cargo-crates-${{ hashFiles('rust/Cargo.lock') }}-v1
      - name: Execute Rust and C++ standard ABI probes inside the original AGNOS filesystem
        run: python3 tools/ci/probe_native_agnos.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-agnos-environment-${{ github.sha }}
          path: |
            ${{ env.CI_JOB_TEMP }}/native-agnos-environment-599.json
            ${{ env.CI_JOB_TEMP }}/native-agnos-assets-first.json
            ${{ env.CI_JOB_TEMP }}/native-agnos-assets-reused.json
            ${{ env.CI_JOB_TEMP }}/native-rust-first.json
            ${{ env.CI_JOB_TEMP }}/native-rust-reused.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-assets-first.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-assets-reused.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-preparation.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-tree.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-dpkg-tree.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-first.json
            ${{ env.CI_JOB_TEMP }}/native-capnp-reused.json
            ${{ env.CI_JOB_TEMP }}/native-cargo-first.json
            ${{ env.CI_JOB_TEMP }}/native-cargo-reused.json
            ${{ env.CI_JOB_TEMP }}/native-cargo-sources/sets/**/generation/tree.json
            ${{ env.CI_JOB_TEMP }}/native-cereal-original-*.json
            ${{ env.CI_JOB_TEMP }}/native-cereal-original-*.txt
            ${{ env.CI_JOB_TEMP }}/native-rust-toolchains/**/generation/tree.json
            ${{ env.CI_JOB_TEMP }}/native-rust-toolchains/**/generation/receipt.json
            ${{ env.CI_JOB_TEMP }}/native-agnos/commands.log
            ${{ env.CI_JOB_TEMP }}/native-agnos/cargo-*.jsonl
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-project-*.jsonl
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-project-*.json
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-project-*.txt
            ${{ env.CI_JOB_TEMP }}/native-agnos/runtime-driver-*.json
            ${{ env.CI_JOB_TEMP }}/native-agnos/runtime-driver-*.stdout
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-cereal-*.jsonl
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-cereal-*.json
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-cereal-*.txt
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-bootstrap-*.json
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-bootstrap-*.jsonl
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-bootstrap-*.txt
            ${{ env.CI_JOB_TEMP }}/native-agnos/bootstrap-seed-export/*
            ${{ env.CI_JOB_TEMP }}/native-agnos/native-system-sdk*.json
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
