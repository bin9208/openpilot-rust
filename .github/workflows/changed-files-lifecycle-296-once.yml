        \ / 'git.stdout').read_text()\n    observed = load('git-actual/git-actual.json')['rows']\n    expected = load('original/git-observations.json')['rows']\n\
        \    assert len(observed) == len(expected) == 12\n    for actual, old in zip(observed, expected, strict=True):\n \
        \       assert actual['name'] == old['name']\n        assert actual['original_accepted'] == actual['native_accepted']\
        \ == old['accepted']\n        assert actual['selected_paths_hex'] == old['selected_paths_hex']\n    for name, count\
        \ in ROSTERS.items():\n        rows = load('lifecycle-actual/' + name)\n        assert len(rows) == count\n      \
        \  for row in rows:\n            assert row['bystander_state'] not in {'Z', 'X'}\n            if 'cleanup' in row['details']:\n\
        \                children = row['details']['cleanup']\n                assert len(children) == 3 and children[0]['pid']\
        \ == children[0]['group']\n                assert len({child['group'] for child in children}) == 1\n             \
        \   assert all(not child['alive'] and child['state'] in {None, 'Z', 'X'} for child in children)\n    assert load('lifecycle-actual/raw-nul-paths.json')['details']['observed']['result']['ok']\n\
        \    peer_source = (ROOT / 'rust/crates/dev-tools/tests/changed_files_lifecycle.rs').read_text()\n    peer = re.search(r'const\
