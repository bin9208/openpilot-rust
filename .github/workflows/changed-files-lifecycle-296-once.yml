name: 296 focused changed-files Git lifecycle
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-lifecycle-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 8c965aa650af6b6df88c616ad8c24b231ba8d00d
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 8c965aa650af6b6df88c616ad8c24b231ba8d00d
        persist-credentials: false
    - name: Bind exact source and fresh target with reserved capacity
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        export AST_BASE="$RUNNER_TEMP/changed-files-lifecycle-296"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/changed-files-lifecycle-target-296"

        mkdir "$AST_BASE" "$CARGO_TARGET_DIR"

        printf ''AST_BASE=%s\nCARGO_TARGET_DIR=%s\n'' "$AST_BASE" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$AST_BASE/source.txt"

        git status --porcelain=v1 > "$AST_BASE/source-status.before.txt"

        test ! -s "$AST_BASE/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5 strace

        rustc +1.94.0 -Vv > "$AST_BASE/rustc.txt"

        cargo +1.94.0 -Vv > "$AST_BASE/cargo.txt"

        git --version > "$AST_BASE/git-version.txt"

        git --exec-path > "$AST_BASE/git-exec-path.txt"

        '
    - name: Authenticate unchanged original Git observations without rerunning Python
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\" --growth-mib 32\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12434037946/zip\
        \ > \"$AST_BASE/original.zip\"\ncat > \"$AST_BASE/audit.py\" <<'PY'\n\"\"\"Hosted inert evidence admission/audit;\
        \ no project imports or expected generation.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\n\
        import re\nimport sys\nimport zipfile\n\nBASE = Path(os.environ['AST_BASE'])\nROOT = Path(os.environ['GITHUB_WORKSPACE'])\n\
        ZIP_SHA = '123620c0e4d08b9ed368867f6d2399989e167cbc66d548ffd30efecb0efce234'\nPINS = {\n    'tools/ci/check_changed_files.py':\
        \ '6bcb14f3a6d5d4e885c655e22fed23a1ecf2199b048cd3da95ef59b2795fad87',\n    'tools/ci/tests/test_changed_files.py':\
        \ 'cd9a211d076d6939b7649849212ea21c52e7e0897fa6d251e82b0b2805e08242',\n}\nROSTERS = {\n    'cli-signals.json': 6,\n\
        \    'library-control.json': 6,\n    'exited-leaders.json': 3,\n    'output-limits.json': 4,\n    'nonzero-and-inherited-io.json':\
        \ 3,\n    'cli-options-and-spawn.json': 6,\n    'pre-spawn-control.json': 2,\n}\n\n\ndef sha(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\
        \n\ndef save(name, value):\n    (BASE / name).write_text(json.dumps(value, indent=2) + '\\n')\n\n\ndef load(name):\n\
        \    return json.loads((BASE / name).read_bytes())\n\n\ndef c_path(text):\n    \"\"\"Decode one complete strace C\
        \ string to OS bytes; never normalize paths.\"\"\"\n    assert text.startswith('\"'), ('missing quoted exec path',\
        \ text)\n    raw, at = bytearray(), 1\n    escapes = {'a': 7, 'b': 8, 'f': 12, 'n': 10, 'r': 13, 't': 9, 'v': 11,\n\
        \               '\\\\': 92, '\"': 34}\n    while at < len(text):\n        char = text[at]\n        at += 1\n     \
        \   if char == '\"':\n            assert raw and 0 not in raw, ('empty/NUL exec path', text)\n            return bytes(raw),\
        \ text[at:]\n        if char != '\\\\':\n            assert 32 <= ord(char) < 127, ('unescaped non-ASCII/control exec\
        \ path', text)\n            raw.append(ord(char))\n            continue\n        assert at < len(text), ('incomplete\
        \ path escape', text)\n        char = text[at]\n        at += 1\n        if char in escapes:\n            raw.append(escapes[char])\n\
        \        elif char == 'x':\n            digits = text[at:at + 2]\n            assert len(digits) == 2 and re.fullmatch('[0-9a-fA-F]{2}',\
        \ digits), text\n            raw.append(int(digits, 16))\n            at += 2\n        elif char in '01234567':\n\
        \            digits = char\n            while len(digits) < 3 and at < len(text) and text[at] in '01234567':\n   \
        \             digits += text[at]\n                at += 1\n            assert int(digits, 8) <= 255, ('out-of-byte-range\
        \ escape', text)\n            raw.append(int(digits, 8))\n        else:\n            raise AssertionError(('unknown\
        \ path escape', text))\n    raise AssertionError(('unterminated/truncated exec path', text))\n\n\ndef exec_path(call,\
        \ kind):\n    assert call.startswith(kind + '('), call\n    arguments = call[len(kind) + 1:]\n    if kind == 'execveat':\n\
        \        # No execveat capability was admitted by this recipe. Account for and\n        # explicitly reject it even\
        \ on failure, rather than treating it as noise.\n        raise AssertionError(('unadmitted execveat attempt', call))\n\
        \    path, tail = c_path(arguments)\n    assert re.match(r',\\s+\\[', tail), ('truncated/ambiguous exec path/argv',\
        \ call)\n    return path, tail\n\n\ndef audit_exec_trace(name, successful_paths, enoent_paths, owned_pids, lines=None):\n\
        \    \"\"\"Account for every exec line, pair by PID, and classify actual returns.\"\"\"\n    pending, records = {},\
        \ []\n    starts = resumes = exec_lines = 0\n    prefix = re.compile(r'(?:\\[pid\\s+(\\d+)\\]|(\\d+))\\s+(\\d+\\.\\\
        d+)\\s+(.*)')\n    mention = re.compile(r'\\bexecve(?:at)?\\b')\n    unfinished = '<unfinished ...>'\n\n    def completed(pid,\
        \ timestamp, kind, call, first_line):\n        path, tail = exec_path(call, kind)\n        result = re.fullmatch(r',\\\
        s+\\[.*\\],\\s+.*\\)\\s+=\\s+(.*)', tail)\n        assert result, ('unparsed exec arguments/return', name, first_line,\
        \ call)\n        result = result[1].strip()\n        row = {'pid': pid, 'syscall': kind, 'path_hex': path.hex(),\n\
        \               'start_timestamp': timestamp, 'first_line': first_line}\n        if result == '0':\n            assert\
        \ path in successful_paths, ('unexpected successful provider', name, call)\n            row['outcome'] = 'success'\n\
        \        elif re.fullmatch(r'-1 ENOENT \\([^\\r\\n]*\\)', result):\n            assert path in enoent_paths, ('unexpected\
        \ ENOENT probe', name, call)\n            row['outcome'] = 'failed-ENOENT'\n        elif result == '?':\n        \
        \    # An exec can be killed during group teardown. Its outcome remains\n            # unknown until a same-PID SIGKILL\
        \ terminal record is observed.\n            assert path in successful_paths and pid in owned_pids, (name, call)\n\
        \            return {'kind': kind, 'call': call, 'timestamp': timestamp,\n                    'first_line': first_line,\
        \ 'awaiting_kill': True}\n        else:\n            raise AssertionError(('unadmitted exec return', name, call))\n\
        \        records.append(row)\n        return None\n\n    if lines is None:\n        lines = (BASE / name).read_text().splitlines()\n\
        \    for number, line in enumerate(lines, 1):\n        fields = prefix.fullmatch(line)\n        if not fields:\n \
        \           assert not mention.search(line), ('unparsed exec line/prefix', name, number, line)\n            continue\n\
        \        pid, timestamp, body = int(fields[1] or fields[2]), fields[3], fields[4]\n        begin = re.match(r'(execveat|execve)\\\
        (', body)\n        resume = re.fullmatch(r'<\\.\\.\\. (execveat|execve) resumed>(.*)', body)\n        if begin or\
        \ resume:\n            exec_lines += 1\n            if begin:\n                starts += 1\n                assert\
        \ pid not in pending, ('overlapping exec attempt', name, number, line)\n                kind, call, first_line = begin[1],\
        \ body, number\n            else:\n                resumes += 1\n                assert pid in pending, ('orphan exec\
        \ resume', name, number, line)\n                previous = pending.pop(pid)\n                assert not previous['awaiting_kill']\
        \ and previous['kind'] == resume[1], (name, line)\n                kind, call = previous['kind'], previous['call']\
        \ + resume[2]\n                timestamp, first_line = previous['timestamp'], previous['first_line']\n           \
        \ if call.endswith(unfinished):\n                # Require the full path even when a syscall never returns.\n    \
        \            call = call[:-len(unfinished)].rstrip()\n                exec_path(call, kind)\n                pending[pid]\
        \ = {'kind': kind, 'call': call, 'timestamp': timestamp,\n                                'first_line': first_line,\
        \ 'awaiting_kill': False}\n            else:\n                waiting = completed(pid, timestamp, kind, call, first_line)\n\
        \                if waiting:\n                    pending[pid] = waiting\n            continue\n        if body ==\
        \ '+++ killed by SIGKILL +++' and pid in pending:\n            previous = pending.pop(pid)\n            path, _ =\
        \ exec_path(previous['call'], previous['kind'])\n            assert pid in owned_pids and path in successful_paths,\
        \ (name, number, line)\n            records.append({'pid': pid, 'syscall': previous['kind'], 'path_hex': path.hex(),\n\
        \                            'start_timestamp': previous['timestamp'], 'terminal_timestamp': timestamp,\n        \
        \                    'first_line': previous['first_line'], 'outcome': 'aborted-SIGKILL'})\n            continue\n\
        \        assert not mention.search(body), ('unparsed exec event', name, number, line)\n    assert not pending, ('unclosed\
        \ exec attempts', name, pending)\n    assert starts == len(records), ('exec accounting mismatch', name, starts, records)\n\
        \    return {'exec_lines': exec_lines, 'attempts': starts, 'resumed_lines': resumes, 'records': records}\n\n\ndef\
        \ trace_controls():\n    \"\"\"Hosted saved-text controls only; never spawn a provider or rewrite traces.\"\"\"\n\
        \    known = {b'/bin/sh', b'/bin/quote\"slash\\\\name'}\n    probes = {b'/missing/git'}\n    positive = [\n      \
        \  '11  1.000000 execve(\"/bin/sh\", [\"sh\"], 0x1 /* 1 var */) = 0',\n        r'12  1.000001 execve(\"\\x2fbin\\\
        057sh\", [\"sh\"], 0x1 /* 1 var */ <unfinished ...>',\n        '[pid 12] 1.000002 <... execve resumed>) = 0',\n  \
        \      r'13  1.000003 execve(\"/bin/quote\\\"slash\\\\name\", [\"sh\"], 0x1 /* 1 var */) = 0',\n        '14  1.000004\
        \ execve(\"/missing/git\", [\"git\"], 0x1 /* 1 var */) = -1 ENOENT (No such file or directory)',\n        '15  1.000005\
        \ execve(\"/bin/sh\", [\"sh\"], 0x1 /* 1 var */ <unfinished ...>',\n        '16  1.000006 execve(\"/bin/sh\", [\"\
        sh\"], 0x1 /* 1 var */) = ?',\n        '15  1.000007 +++ killed by SIGKILL +++',\n        '16  1.000008 +++ killed\
        \ by SIGKILL +++',\n    ]\n    actual = audit_exec_trace('positive-controls', known, probes, {15, 16}, positive)\n\
        \    assert [row['outcome'] for row in actual['records']] == [\n        'success', 'success', 'success', 'failed-ENOENT',\
        \ 'aborted-SIGKILL', 'aborted-SIGKILL']\n    assert actual['attempts'] == 6 and actual['exec_lines'] == 7 and actual['resumed_lines']\
        \ == 1\n    rejected = [\n        ['11 1.000000 execve(\"/foreign/python\", [\"py\"], 0x1) = 0'],\n        [r'11 1.000000\
        \ execve(\"\\x2fforeign/python\", [\"py\"], 0x1) = 0'],\n        ['11 1.000000 execve(\"/bin/sh\", [\"sh\"], 0x1)\
        \ = -1 ENOENT (No such file or directory)'],\n        ['11 1.000000 execve(\"/missing/git\", [\"git\"], 0x1) = 0'],\n\
        \        ['11 1.000000 execve(\"/bin/sh\", [\"sh\"], 0x1) = -1 EACCES (Permission denied)'],\n        ['unparsed-prefix\
        \ execve(\"/bin/sh\", [\"sh\"], 0x1) = 0'],\n        ['11 1.000000 execve(\"/bin/sh\"..., [\"sh\"], 0x1) = 0'],\n\
        \        [r'11 1.000000 execve(\"/bin/\\qsh\", [\"sh\"], 0x1) = 0'],\n        [r'11 1.000000 execve(\"/bin/sh\\000\"\
        , [\"sh\"], 0x1) = 0'],\n        ['11 1.000000 <... execve resumed>) = 0'],\n        ['11 1.000000 execve(\"/bin/sh\"\
        , [\"sh\"], 0x1 <unfinished ...>'],\n        ['11 1.000000 execve(\"/bin/sh\", [\"sh\"], 0x1 <unfinished ...>',\n\
        \         '12 1.000001 <... execve resumed>) = 0'],\n        ['11 1.000000 execve(\"/bin/sh\", [\"sh\"], 0x1 <unfinished\
        \ ...>',\n         '11 1.000001 <... execveat resumed>) = 0'],\n        ['11 1.000000 execve(\"/bin/sh\", [\"sh\"\
        ], 0x1) = ?'],\n        ['11 1.000000 execve(\"/bin/sh\", [\"sh\"], 0x1 <unfinished ...>',\n         '11 1.000001\
        \ +++ killed by SIGKILL +++'],\n        ['11 1.000000 execveat(AT_FDCWD, \"/bin/sh\", [\"sh\"], 0x1, 0) = 0'],\n \
        \       ['11 1.000000 execveat(AT_FDCWD, \"/missing/git\", [\"git\"], 0x1, 0) = -1 ENOENT (No such file or directory)'],\n\
        \        ['11 1.000000 execve (\"/bin/sh\", [\"sh\"], 0x1) = 0'],\n    ]\n    for index, lines in enumerate(rejected):\n\
        \        try:\n            audit_exec_trace(f'negative-control-{index}', known, probes, {15, 16}, lines)\n       \
        \ except AssertionError:\n            continue\n        raise AssertionError(('invalid exec control was admitted',\
        \ index, lines))\n    save('trace-parser-controls.json', {'passed': True, 'positive_attempts': 6,\n              \
        \                         'negative_vectors_rejected': len(rejected)})\n\n\ndef sources():\n    paths = [ROOT / path\
        \ for path in PINS]\n    dev = ROOT / 'rust/crates/dev-tools'\n    paths += [ROOT / 'rust/Cargo.lock', dev / 'Cargo.toml',\n\
        \              dev / 'src/changed_files_check.rs', dev / 'src/qa_process.rs',\n              dev / 'src/bin/check_changed_files.rs',\n\
        \              dev / 'tests/changed_files_check.rs', dev / 'tests/changed_files_lifecycle.rs']\n    paths += sorted((dev\
        \ / 'src/changed_files_check').rglob('*'))\n    return {str(path.relative_to(ROOT)): sha(path) for path in paths if\
        \ path.is_file()}\n\n\ndef admit():\n    path = BASE / 'original.zip'\n    assert path.stat().st_size == 19720 and\
        \ sha(path) == ZIP_SHA\n    with zipfile.ZipFile(path) as archive:\n        assert len(archive.infolist()) == len(set(archive.namelist()))\
        \ == 16\n        assert archive.testzip() is None\n        assert sum(entry.file_size for entry in archive.infolist())\
        \ < 1 << 20\n        assert archive.read('source.txt') == (\n            b'workflow_head=5928aaf24b644abeb5373b1b689913c3e7e19d66\\\
        n'\n            b'source_commit=12af083b2e31bbb73cb8f73a9822e1c92d3ab8ea\\n')\n        assert archive.read('source-status.before.txt')\
        \ == archive.read('source-status.after.txt') == b''\n        assert json.loads(archive.read('source-pins.json')) ==\
        \ PINS\n        manifest = json.loads(archive.read('observations/manifest.json'))['files']\n        assert set(manifest)\
        \ == {'git-observations.json', 'syntax-observations.json',\n                                 'unicode-tables.json',\
        \ 'receipt.json'}\n        original = BASE / 'original'\n        original.mkdir()\n        for name, seal in manifest.items():\n\
        \            raw = archive.read('observations/' + name)\n            assert len(raw) == seal['bytes'] and hashlib.sha256(raw).hexdigest()\
        \ == seal['sha256']\n            (original / name).write_bytes(raw)\n        receipt = json.loads((original / 'receipt.json').read_bytes())\n\
        \        assert receipt['passed'] and not receipt['native_execution']\n        assert not receipt['expected_native_outputs_used']\
        \ and receipt['git_scenarios'] == 12\n    for path, digest in PINS.items():\n        assert sha(ROOT / path) == digest,\
        \ path\n    assert sha(BASE / 'original/git-observations.json') == 'cd5947ae3b817eeae232e6b4d1b727e24c16a24afb716c8de3bc70773032f78a'\n\
        \    save('source-inputs.before.json', sources())\n    save('original-inputs.before.json', {name: sha(BASE / 'original'\
        \ / name) for name in manifest})\n    save('original-admission.json', {'artifact': 12434037946, 'zip_sha256': ZIP_SHA,\n\
        \          'all_crc_members': 16, 'observation_seals': 4, 'reused_original_git_rows': 12,\n          'original_provider_rerun':\
        \ False, 'unchanged_syntax_unicode_rerun': False})\n\n\ndef discover():\n    artifacts = [json.loads(line) for line\
        \ in (BASE / 'build.jsonl').read_text().splitlines()]\n    tests = {}\n    cli = []\n    for row in artifacts:\n \
        \       if row.get('reason') != 'compiler-artifact' or not row.get('executable'):\n            continue\n        name,\
        \ kinds = row['target']['name'], row['target']['kind']\n        path = Path(row['executable'])\n        assert path.is_relative_to(Path(os.environ['CARGO_TARGET_DIR']))\n\
        \        assert path.is_file()\n        if name in {'changed_files_check', 'changed_files_lifecycle'} and kinds ==\
        \ ['test']:\n            assert name not in tests and row['profile']['test']\n            tests[name] = str(path)\n\
        \        if name == 'check-changed-files' and kinds == ['bin'] and not row['profile']['test']:\n            cli.append(str(path))\n\
        \    assert set(tests) == {'changed_files_check', 'changed_files_lifecycle'} and len(cli) == 1\n    with Path(os.environ['GITHUB_ENV']).open('a')\
        \ as out:\n        out.write('AST_GIT_EXE=' + tests['changed_files_check'] + '\\n')\n        out.write('AST_LIFECYCLE_EXE='\
        \ + tests['changed_files_lifecycle'] + '\\n')\n    providers = list(map(Path, list(tests.values()) + cli))\n    providers\
