        \ == 1\n    failed_case = Path(spawn_failures[0]['case_root'])\n    assert failed_case in cases and not (failed_case\
        \ / 'argv').exists()\n    assert spawn_failures[0]['details']['observed']['result']['phase'] == 'Git'\n    assert\
        \ missing_git == {str(failed_case / 'bin/git')}\n    for filename in ROSTERS:\n        owned_pids.update(row['bystander_pid']\
        \ for row in load('lifecycle-actual/' + filename))\n    owned_pids.add(load('lifecycle-actual/raw-nul-paths.json')['bystander_pid'])\n\
        \    allowed = {os.fsencode(path) for path in allowed}\n    failed_probes = {os.fsencode(path) for path in missing_git}\n\
        \    accounting = {}\n    for name in ['git.trace', 'lifecycle.trace']:\n        accounting[name] = audit_exec_trace(name,\
        \ allowed,\n                failed_probes if name == 'lifecycle.trace' else set(), owned_pids)\n    records = [row\
        \ for trace in accounting.values() for row in trace['records']]\n    successful = sum(row['outcome'] == 'success'\
        \ for row in records)\n    probes = [row for row in records if row['outcome'] == 'failed-ENOENT']\n    assert len(probes)\
        \ == 1 and probes[0]['path_hex'] == os.fsencode(failed_case / 'bin/git').hex()\n    assert successful > 12\n    built\
        \ = load('built-providers.json')\n    required = list(built['tests'].values()) + [built['cli'], str(native_git),\n\
        \                '/usr/bin/env', '/bin/sh', '/bin/sleep', '/usr/bin/head']\n    successful_issuers = {row['path_hex']\
        \ for row in records if row['outcome'] == 'success'}\n    assert {os.fsencode(path).hex() for path in required} <=\
        \ successful_issuers\n    save('native-exec-accounting.json', accounting)\n    assert 'Finished ' in (BASE / 'clippy.stderr').read_text()\n\
        \    assert 'error:' not in (BASE / 'clippy.stderr').read_text()\n    save('final-receipt.json', {'passed': True,\
        \ 'source': os.environ['EXPECTED_SOURCE'],\n          'functional_lifecycle_tests': 8, 'isolated_library_worker':\
        \ 1,\n          'lifecycle_scenarios': 31, 'affected_actual_git_comparisons': 12,\n          'unchanged_original_provider_rerun':\
        \ False, 'syntax_unicode_codec_rerun': False,\n          'native_execve_successes': successful, 'unexpected_exec_paths':\
        \ 0,\n          'accounted_exec_attempts': len(records), 'failed_ENOENT_probes': len(probes),\n          'aborted_owned_SIGKILL_attempts':\
        \ sum(row['outcome'] == 'aborted-SIGKILL' for row in records),\n          'unparsed_exec_events': 0, 'pending_exec_attempts':\
        \ 0,\n          'strict_clippy': True, 'source_deletions': 0, 'inventory_credit': 0,\n          'maintained_callers_retired':\
        \ False, 'device_acceptance': False})\n    paths = sorted(path for path in BASE.rglob('*') if path.is_file() and not\
        \ path.is_symlink())\n    save('manifest.json', {str(path.relative_to(BASE)): {'bytes': path.stat().st_size, 'sha256':\
        \ sha(path)} for path in paths})\n\n\nif __name__ == '__main__':\n    {'admit': admit, 'discover': discover, 'finish':\
        \ finish, 'trace-controls': trace_controls}[sys.argv[1]]()\nPY\nprintf '7b90fd3163ba0c97fed5dbf7f53a2af1b2857e21b7fda99771651914a24d5c5b\
        \  %s/audit.py\\n' \"$AST_BASE\" | sha256sum --check --strict\npython3 \"$AST_BASE/audit.py\" admit\npython3 \"$AST_BASE/audit.py\"\
        \ trace-controls\n"
    - name: Compile only affected native CLI and two integration targets
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --test changed_files_lifecycle --test changed_files_check --no-run --message-format=json > "$AST_BASE/build.jsonl"
        2> "$AST_BASE/build.stderr"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --bin check-changed-files --test changed_files_lifecycle --test changed_files_check --
        -D warnings > "$AST_BASE/clippy.stdout" 2> "$AST_BASE/clippy.stderr"

        python3 "$AST_BASE/audit.py" discover

        '
    - name: Run new lifecycle controls and affected 12 real-Git lanes only
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 256

        mkdir "$AST_BASE/native-path"

        ln -s /usr/bin/git "$AST_BASE/native-path/git"

        /usr/bin/timeout --signal=TERM --kill-after=10s 90s /usr/bin/strace -f -ttt -xx -s 4096 -e trace=process,kill,setpgid
        -o "$AST_BASE/lifecycle.trace" /usr/bin/env AST_LIFECYCLE_PROOF="$AST_BASE/lifecycle-actual" PATH="$AST_BASE/native-path"
        "$AST_LIFECYCLE_EXE" --test-threads=1 --nocapture > "$AST_BASE/lifecycle.stdout" 2> "$AST_BASE/lifecycle.stderr"

        /usr/bin/timeout --signal=TERM --kill-after=10s 90s /usr/bin/strace -f -ttt -xx -s 4096 -e trace=process,kill,setpgid
        -o "$AST_BASE/git.trace" /usr/bin/env AST_ORIGINAL_DIR="$AST_BASE/original" AST_PROOF="$AST_BASE/git-actual" PATH="$AST_BASE/native-path"
        "$AST_GIT_EXE" --exact all_twelve_original_git_lanes_keep_failure_order_raw_names_and_worktree_bytes --test-threads=1
        --nocapture > "$AST_BASE/git.stdout" 2> "$AST_BASE/git.stderr"

        git status --porcelain=v1 > "$AST_BASE/source-status.after.txt"

        python3 "$AST_BASE/audit.py" finish

        du -sm "$AST_BASE" > "$AST_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$AST_BASE/artifact-size-mib.txt")" -le 128

        '
    - name: Preserve actual first compile and lifecycle failures
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-lifecycle-296
        path: ${{ runner.temp }}/changed-files-lifecycle-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
