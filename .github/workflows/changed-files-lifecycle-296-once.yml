        \   assert sha(native_git) == providers['/usr/bin/git']\n    allowed.add(str(native_git))\n    missing_git, owned_pids\
        \ = set(), set()\n    for case in cases:\n        assert (case / 'peer').read_bytes() == peer\n        if (case /\
