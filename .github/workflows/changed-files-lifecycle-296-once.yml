        \ '/usr/bin/strace', '/usr/bin/timeout']))\n    exec_git = Path((BASE / 'git-exec-path.txt').read_text().strip())\
        \ / 'git'\n    if exec_git.is_file():\n        providers.append(exec_git)\n    save('provider-inputs.before.json',\
        \ {str(path): sha(path) for path in providers})\n    save('built-providers.json', {'tests': tests, 'cli': cli[0]})\n\
        \n\ndef finish():\n    assert sources() == load('source-inputs.before.json')\n    save('source-inputs.after.json',\
        \ sources())\n    original = {name: sha(BASE / 'original' / name) for name in load('original-inputs.before.json')}\n\
        \    assert original == load('original-inputs.before.json') and sha(BASE / 'original.zip') == ZIP_SHA\n    save('original-inputs.after.json',\
        \ original)\n    providers = {path: sha(path) for path in load('provider-inputs.before.json')}\n    assert providers\
        \ == load('provider-inputs.before.json')\n    save('provider-inputs.after.json', providers)\n    assert (BASE / 'source-status.before.txt').read_bytes()\
        \ == (BASE / 'source-status.after.txt').read_bytes() == b''\n    assert 'test result: ok. 8 passed; 0 failed; 1 ignored;'\
