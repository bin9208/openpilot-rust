name: 296 native updater daemon complete fresh original lifecycle pair
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-daemon-native-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  updated-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 535afad222bb9546a3eaa80de7e9bb684c719751
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TZ: UTC
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 535afad222bb9546a3eaa80de7e9bb684c719751
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Require exact source and original/native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/updated-daemon-296"

        mkdir -p "$proof"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace git-lfs
        gettext

        python -m pip install pyzmq==27.2.0

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        printf ''UPDATED_DAEMON_BINARY=%s/rust/target/debug/openpilot-updated\nUPDATED_DAEMON_LAUNCHER=%s/rust/target/debug/openpilot-process-child\nUPDATED_DAEMON_FIXTURE=%s/rust/target/debug/updated-fixture\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''UPDATED_DAEMON_ORIGINAL_OUTPUT=%s/original\nUPDATED_DAEMON_NATIVE_OUTPUT=%s/native\n'' "$proof" "$proof"
        >> "$GITHUB_ENV"

        '
    - name: Build actual production daemon, native fixture and new owned controller
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-updated --bin openpilot-updated --locked 2>&1 | tee "$proof/daemon-build.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child --locked
        2>&1 | tee "$proof/launcher-build.log"

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --bin check-updated-daemon
        --bin updated-fixture --locked 2>&1 | tee "$proof/controller-build.log"

        sha256sum rust/tools/check_updated_daemon.py rust/tools/updated_fixtures.py rust/target/debug/openpilot-updated rust/target/debug/openpilot-process-child
        rust/target/debug/updated-fixture rust/target/debug/check-updated-daemon > "$proof/sealed-inputs.sha256"

        '
    - name: Execute unchanged original first and capture its actual invocation time window
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        printf ''UPDATED_DAEMON_ORIGINAL_START_NS=%s\n'' "$(date -u +%s%N)" >> "$GITHUB_ENV"

        python rust/tools/check_updated_daemon.py --binary "$UPDATED_DAEMON_BINARY" --launcher "$UPDATED_DAEMON_LAUNCHER"
        --output "$UPDATED_DAEMON_ORIGINAL_OUTPUT" > "$proof/original.stdout" 2> "$proof/original.stderr"

        printf ''UPDATED_DAEMON_ORIGINAL_END_NS=%s\n'' "$(date -u +%s%N)" >> "$GITHUB_ENV"

        sha256sum --check "$proof/sealed-inputs.sha256"

        '
    - name: Require complete original Params, records, signal lifecycle and failure controls
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-daemon-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --lib updated_daemon_check::
        --locked -- --nocapture 2>&1 | tee "$proof/unit-tests.log"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --test updated_daemon_check
        --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-daemon-native --lib --bin check-updated-daemon
        --test updated_daemon_check --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        rust/target/debug/check-updated-daemon --binary "$UPDATED_DAEMON_BINARY" --launcher "$UPDATED_DAEMON_LAUNCHER" --output
        "$proof/native-cli" > "$proof/native-cli.stdout" 2> "$proof/native-cli.stderr"

        cmp "$proof/original.stdout" "$proof/native-cli.stdout"

        test ! -s "$proof/native-cli.stderr"

        sha256sum --check "$proof/sealed-inputs.sha256"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: updated-daemon-native-pair-296
        path: ${{ runner.temp }}/updated-daemon-296/
        if-no-files-found: error
