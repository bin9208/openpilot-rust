name: Sync Upstream
'on':
  workflow_dispatch:
    inputs:
      source_repository:
        description: Upstream repository (owner/repository)
        required: true
        type: string
      target_branch:
        description: Branch to synchronize (must also exist in the source repository)
        required: true
        type: string
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'bin9208/openpilot'
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    steps:
      - name: Deny fork source and require registered local runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          test "$RUNNER_NAME" = bin-actions
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
        working-directory: ${{ github.workspace }}
      - name: Common owned source-free API job temporary paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@77663836a95a9e2aff9aa66592d8b06ed9c87cd9
      - name: Isolate API-only home and caches without source checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$CI_JOB_TEMP/home" "$CI_JOB_TEMP/cache" "$CI_JOB_TEMP/proof"
          printf '%s\n' "HOME=$CI_JOB_TEMP/home" "XDG_CACHE_HOME=$CI_JOB_TEMP/cache" "CARGO_HOME=$CI_JOB_TEMP/cargo-home" "RUSTUP_HOME=$CI_JOB_TEMP/rustup-home" "CARGO_TARGET_DIR=$CI_JOB_TEMP/target" >> "$GITHUB_ENV"
          printf 'source_free_api=true\nsource_checkout=none\nrunner=%s\nrun=%s\nattempt=%s\njob=%s\n' "$RUNNER_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > "$CI_JOB_TEMP/proof/owner.txt"
      - name: Validate explicit synchronization target
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Specify a valid upstream owner/repository."
            exit 1
          fi
          git check-ref-format --branch "$TARGET_BRANCH"
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ github.workspace }}
      - name: Sync upstream without forcing divergent history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: gh repo sync "$GITHUB_REPOSITORY" --source "$SOURCE_REPOSITORY" --branch "$TARGET_BRANCH"
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ github.workspace }}
      - name: Retain source-free API job ownership only
        id: ci296_api_evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: private-sync-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_JOB_TEMP }}/proof
          if-no-files-found: error
      - name: Clean only uploaded common API job temporary paths
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.ci296_api_evidence.outcome == 'success' && steps.ci296_api_evidence.outputs.artifact-id != '' && steps.ci296_api_evidence.outputs.artifact-digest != '') }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@77663836a95a9e2aff9aa66592d8b06ed9c87cd9
        with:
          cleanup: 'true'
    env:
      CI296_SOURCE_FREE_API: 'true'
