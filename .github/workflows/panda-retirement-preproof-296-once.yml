name: 296 Panda current raw and two38 same-ELF private proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-retirement-preproof-296-once.yml
permissions:
  contents: read
  actions: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  current-raw-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: b1c069f872ffd8b28b6a00616c6100edca1defa3
      RUSTUP_TOOLCHAIN: 1.94.0
      PANDA_CI_EXPECT_ABSENT: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: b1c069f872ffd8b28b6a00616c6100edca1defa3
    - name: Admit exact source and Python 3.12
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Reserve disk and install original Panda prerequisites
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ clang libusb-1.0-0-dev libzmq3-dev cmake pkg-config curl

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1 libusb1==3.4.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Build original Panda IPC bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/panda-current-raw"

        mkdir -p "$proof"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$proof/msgq"

        printf ''PYTHONPATH=%s/msgq:%s\n'' "$proof" "$PYTHONPATH" >> "$GITHUB_ENV"

        '
    - name: Build same thirty Panda executables and retain Cargo build messages
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-current-raw\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\ncargo build --manifest-path rust/Cargo.toml \\\n  -p openpilot-pandad -p openpilot-panda-usb\
        \ -p openpilot-panda-spi -p openpilot-panda-spi-linux \\\n  -p openpilot-process-supervision -p openpilot-logmessaged\
        \ -p openpilot-dev-tools \\\n  --features openpilot-dev-tools/pandad-safety-padding-native,openpilot-dev-tools/panda-ci-native\
        \ \\\n  --bins --examples --locked --message-format=json 2> \"$proof/native-build.log\" | tee \"$proof/native-build.jsonl\"\
        \n"
    - name: Capture eleven unchanged original CLI admissions before native execution
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/panda-current-raw"

        printf ''%s'' ''''
        | base64 -d > "$proof/capture-original-cli.py"

        printf ''%s  %s\n'' ''fae4860b89c6bb94cdb18026f4e20ffd15d27528fe22e87ffd463b6dafdb55f3'' "$proof/capture-original-cli.py"
        | sha256sum -c -

        python3 "$proof/capture-original-cli.py" --workspace "$GITHUB_WORKSPACE" --python "$(command -v python3)" --binaries
        "$GITHUB_WORKSPACE/rust/target/debug" --build-messages "$proof/native-build.jsonl" --output "$proof/original-cli-only"

        '
    - name: Require native Panda controller unit cases and strict Clippy including absence proof compilation
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/panda-current-raw"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native --test panda_ci_check
        --locked -- --nocapture 2>&1 | tee "$proof/native-tests.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native --lib --bin check-pandad-ci
        --test panda_ci_check --test panda_ci_retirement --locked -- -D warnings 2>&1 | tee "$proof/native-clippy.log"

        '
    - name: Capture unchanged original and native raw path at one source and held ELFs
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 3072

        python -P -c ''import msgq.ipc_pyx, usb1; from openpilot.cereal import log; log.Event.new_message()''

        python - <<''STAGE_DRIVER''

        import base64, os

        from pathlib import Path

        target = Path(os.environ[''RUNNER_TEMP'']) / ''panda-current-raw/capture-current-raw-pair.py''

        target.write_bytes(base64.b64decode(''''))

        STAGE_DRIVER

        echo "46286aa0c0d6e5c8554145122f5a0b37cce122be100eca31bafd620206db5fb1  $RUNNER_TEMP/panda-current-raw/capture-current-raw-pair.py"
        | sha256sum -c -

        python "$RUNNER_TEMP/panda-current-raw/capture-current-raw-pair.py"

        '
    - name: Stage sealed private-root preparation diagnostic
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 -d > "$RUNNER_TEMP/panda-current-raw/prepare-private-root-before-retirement.py"

        printf ''%s  %s\n'' ''cb9371d8ecc786dca52465aff34b4412c53edae41a1416a62a177cffa3ba3360'' "$RUNNER_TEMP/panda-current-raw/prepare-private-root-before-retirement.py"
        | sha256sum -c -

        '
    - name: Prepare Panda checker-absent root with current source and ELF seals
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-retirement\"\nmkdir \"$proof\"\nscript=\"$RUNNER_TEMP/panda-current-raw/prepare-private-root-before-retirement.py\"\
        \ntest \"$(sha256sum \"$script\" | cut -d' ' -f1)\" = cb9371d8ecc786dca52465aff34b4412c53edae41a1416a62a177cffa3ba3360\n\
        free=$(df -B1 --output=avail \"$RUNNER_TEMP\" | tail -1 | tr -d ' ')\ntest \"$free\" -ge $((25 * 1024**3 + 512 * 1024**2))\n\
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12327083506/zip > \"$proof/historical-pair.zip\"\ntest \"$(sha256sum\
        \ \"$proof/historical-pair.zip\" | cut -d' ' -f1)\" = 1f64e4436b1af7d000610ea40ab2dff1b4c327bfc7b7287ace3698a6f7abba48\n\
        python3 \"$script\" \\\n  --repo \"$GITHUB_WORKSPACE\" \\\n  --private \"$proof/private-root\" \\\n  --historical-pair-zip\
        \ \"$proof/historical-pair.zip\" \\\n  --checker \"$GITHUB_WORKSPACE/rust/target/debug/check-pandad-ci\" \\\n  --binaries\
        \ \"$GITHUB_WORKSPACE/rust/target/debug\" \\\n  --build-messages \"$RUNNER_TEMP/panda-current-raw/native-build.jsonl\"\
        \ \\\n  --manifest \"$proof/private-root-manifest.json\" \\\n  --expect-absent \"$PANDA_CI_EXPECT_ABSENT\"\n"
    - name: Require Panda same-ELF absence and captured-original CLI admissions
      shell: bash
      env:
        PANDA_CI_PRIVATE_ROOT: ${{ runner.temp }}/panda-retirement/private-root
        PANDA_CI_CHECKER_BINARY: ${{ github.workspace }}/rust/target/debug/check-pandad-ci
        PANDA_CI_BINARIES: ${{ github.workspace }}/rust/target/debug
        PANDA_CI_BUILD_MESSAGES: ${{ runner.temp }}/panda-current-raw/native-build.jsonl
        PANDA_CI_RETIREMENT_EVIDENCE: ${{ runner.temp }}/panda-retirement/two-lane
        PANDA_CI_CLI_EVIDENCE: ${{ runner.temp }}/panda-retirement/native-cli
        PANDA_CI_ORIGINAL_CLI_RECEIPT: ${{ github.workspace }}/rust/crates/dev-tools/tests/fixtures/panda-ci-original/original-cli.json
        PANDA_CI_ORIGINAL_CLI_SHA256: 02aa67da5d511a312fe30b7ebc058da5a8ada66098e14aef7b05a8b63eef700b
      run: "set -euo pipefail\nexport PANDA_CI_PYTHON=\"$(command -v python3)\"\ncargo test --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools \\\n  --features panda-ci-native --test panda_ci_retirement --locked -- \\\n  --test-threads=1\
        \ --nocapture\n"
    - name: Preserve full two-lane Panda absence and original CLI evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-two38-private-proof
        path: '${{ runner.temp }}/panda-retirement/private-root-manifest.json

          ${{ runner.temp }}/panda-retirement/two-lane

          ${{ runner.temp }}/panda-retirement/native-cli

          ${{ runner.temp }}/panda-current-raw/original-cli-only.tar

          '
        if-no-files-found: error
        retention-days: 7
    - name: Archive original and native raw byte trees
      if: always()
      shell: bash
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 512\npython - <<'ARCHIVE_RAW'\n\
        import hashlib, os, subprocess\nfrom pathlib import Path\nproof = Path(os.environ['RUNNER_TEMP']) / 'panda-current-raw'\n\
        for source, name in [('raw-output', 'raw-pair.tar'), ('original-cli-only', 'original-cli-only.tar')]:\n    if (proof\
        \ / source).is_dir():\n        target = proof / name\n        subprocess.run(['tar', '--format=gnu', '-C', str(proof),\
        \ '-cf', str(target), '--', source], check=True, timeout=300)\n        print(name, 'sha256', hashlib.sha256(target.read_bytes()).hexdigest())\n\
        ARCHIVE_RAW\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: panda-current-raw-pair-diagnostic
        path: '${{ runner.temp }}/panda-current-raw/current-raw-pair.json

          ${{ runner.temp }}/panda-current-raw/raw-pair.tar

          ${{ runner.temp }}/panda-current-raw/original-cli-only.tar

          ${{ runner.temp }}/panda-current-raw/original-cli-only/original-cli.json

          ${{ runner.temp }}/panda-current-raw/original.stdout

          ${{ runner.temp }}/panda-current-raw/original.stderr

          ${{ runner.temp }}/panda-current-raw/native.stdout

          ${{ runner.temp }}/panda-current-raw/native.stderr

          ${{ runner.temp }}/panda-current-raw/native-build.jsonl

          ${{ runner.temp }}/panda-current-raw/native-build.log

          ${{ runner.temp }}/panda-current-raw/native-tests.log

          ${{ runner.temp }}/panda-current-raw/native-clippy.log

          ${{ runner.temp }}/panda-current-raw/capture-current-raw-pair.py

          ${{ runner.temp }}/panda-current-raw/capture-original-cli.py

          '
        if-no-files-found: error
        retention-days: 7
