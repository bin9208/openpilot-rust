name: 296 RadarCAN strict stop phase diagnosis
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/radarcan-stop-phases-495-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  radar-stop:
    name: RadarCAN strict stop phase diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: 461b0bcd073a62124da7b3e9889d332b3eb9d76a
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 461b0bcd073a62124da7b3e9889d332b3eb9d76a
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Configure original Radar IPC imports
      run: 'set -euo pipefail

        printf ''PYTHONPATH=%s/radar-native/msgq:%s\n'' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"'
    - name: Reserve runner capacity and install source binding dependencies
      run: 'set -euo pipefail

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq3-dev

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2
        pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build unchanged source Params and msgq bindings
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/radar-native/params"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/radar-native/msgq"

        "$CI_RECEIPT_METADATA" module RADAR_PARAMS_BINDING "$RUNNER_TEMP/radar-native/params/provenance.json" >> "$GITHUB_ENV"

        '
    - name: Generate native DBC assets and stage pinned numerical libraries
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features dbc-generator-native --bin
        dbc-generator --bin prepare-radarcan-assets

        printf ''OPENPILOT_DBC_GENERATOR=%s/rust/target/debug/dbc-generator\n'' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        rust/target/debug/prepare-radarcan-assets "$RUNNER_TEMP/radar-native/dbc"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        python -m pip download --only-binary=:all: --no-deps numpy==2.5.3 --dest "$RUNNER_TEMP/radar-native/wheels"

        cargo +1.94.0 run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin stage-torque-numerics -- --wheel
        "$RUNNER_TEMP"/radar-native/wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/radar-native/numerics"

        '
    - name: Build unchanged native daemon for affected IPC capture
      working-directory: rust
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build -p openpilot-radarcan --bin openpilot-radarcan --locked

        '
    - name: Capture affected Chrysler case with unchanged100ms bound
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/radar-native"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''%s\n'' "$EXPECTED_SOURCE" > "$proof/SOURCE_COMMIT"

        git status --porcelain=v1 > "$proof/source-status.before.txt"

        test ! -s "$proof/source-status.before.txt"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        python -P rust/tools/stage_radarcan_runtime.py --dbc "$proof/dbc" --binding "$RADAR_PARAMS_BINDING" --output "$proof/fixtures"

        python -P rust/tools/check_radarcan_runtime.py --binary "$GITHUB_WORKSPACE/rust/target/debug/openpilot-radarcan" --binding
        "$RADAR_PARAMS_BINDING" --dbc "$proof/dbc" --numerics "$proof/numerics" --cases "$proof/fixtures/normal.json" --name
        ipc-CHRYSLER_PACIFICA_2018-lifecycle --evidence "$proof/affected"

        '
    - name: Preserve current source identity on success and failure
      if: always()
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/radar-native\"\nif test -d \"$proof\"; then\n git rev-parse HEAD > \"\
        $proof/final-source.txt\"\n git status --porcelain=v1 > \"$proof/source-status.after.txt\"\n git diff --exit-code\n\
        fi\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: radarcan-stop-phases-495
        path: ${{ runner.temp }}/radar-native/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
