name: Tablet AGNOS native comparison
on:
  push:
    branches: ['codex/feat-643-tablet-native-build']
    paths:
      - '.github/workflows/tablet-agnos-native.yml'
      - 'tools/ci/tablet_agnos_native.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tablet-agnos-native-643
  cancel-in-progress: false
jobs:
  native:
    name: Compare genuine AGNOS compiler on native ARM tablet
    runs-on: [self-hosted, Linux, ARM64, openpilot-rust]
    timeout-minutes: 180
    steps:
      - name: Record actual ARM CPU capacity and native transport prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == bin-Arm-tablet ]]
          [[ "$(uname -m)" == aarch64 ]]
          python3 - <<'PY'
          import json, os, platform, shutil
          from pathlib import Path
          cpus = sorted(os.sched_getaffinity(0))
          assert len(cpus) > 1, 'User requires parallel execution; no one-job fallback'
          status = Path('/proc/self/status').read_text().splitlines()
          data = dict(runner=os.environ['RUNNER_NAME'], architecture=platform.machine(),
                      kernel=platform.release(), logical_cpus=os.cpu_count(), allowed_cpus=cpus,
                      cargo_build_jobs=len(cpus), qemu_requested=False,
                      baseline_source='9b8c6337b56b80b79788ebc389b6622b484fe0c7',
                      baseline_run=40904508393,
                      process_status=[s for s in status if s.startswith(('TracerPid:', 'CapEff:', 'Seccomp:'))],
                      tools={n: shutil.which(n) for n in ('proot', 'chroot', 'unshare', 'tar', 'git', 'rustup')},
                      free_bytes=shutil.disk_usage(os.environ['RUNNER_TEMP']).free)
          print(json.dumps(data, indent=2), flush=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CARGO_BUILD_JOBS={len(cpus)}\nRUST_TEST_THREADS={len(cpus)}\n')
          for path in ('/sys/fs/cgroup/cgroup.controllers', '/proc/self/cgroup', '/etc/os-release'):
              try:
                  print(path, Path(path).read_text()[:2048])
              except OSError as e:
                  print(path, type(e).__name__, str(e))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## ARM 태블릿 AGNOS 실행 전제 확인\n\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
          PY
      - name: Verify native PRoot without QEMU before downloading the AGNOS image
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v proot >/dev/null; then
            python3 - <<'PY'
          import os, shutil
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 128 * 1024**2
          PY
            if [[ $(id -u) == 0 ]]; then apt=(apt-get); else apt=(sudo -n apt-get); fi
            "${apt[@]}" update -qq
            "${apt[@]}" install -y --no-install-recommends --no-upgrade proot
          fi
          proot --version
          timeout 30 proot -r / -w "$RUNNER_TEMP" /usr/bin/python3 -c 'import os,platform; assert platform.machine()=="aarch64"; print("NATIVE_PROOT_OK", platform.machine(), sorted(os.sched_getaffinity(0)))'
          printf '\nQEMU 없는 native PRoot 실행 확인. 실제 AGNOS 이미지/빌드 검증은 별도 단계입니다.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare extraction tools and retrieve this exact comparison script
        shell: bash
        run: |
          set -euo pipefail
          if [[ $(id -u) == 0 ]]; then apt=(apt-get); else apt=(sudo -n apt-get); fi
          "${apt[@]}" update -qq
          "${apt[@]}" install -y --no-install-recommends --no-upgrade curl git android-sdk-libsparse-utils e2fsprogs xz-utils
          comparison_script=$(mktemp "$RUNNER_TEMP/tablet-agnos-script.XXXXXX.py")
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/bin9208/openpilot-rust/$GITHUB_SHA/tools/ci/tablet_agnos_native.py" \
            --output "$comparison_script"
          printf 'TABLET_AGNOS_SCRIPT=%s\n' "$comparison_script" >> "$GITHUB_ENV"
      - name: Compile the same source inside the same genuine AGNOS image without QEMU
        shell: bash
        run: python3 "$TABLET_AGNOS_SCRIPT"
