name: 456 Camera native peer generation RED GREEN full gate
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/camera-peer-456-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  camera-runtime:
    name: 456 Camera peer generation and complete regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: 2c50f2a1162b13fcf1e0be1eecf1efbbd556ddd5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 2c50f2a1162b13fcf1e0be1eecf1efbbd556ddd5
    - name: Require exact source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        '
    - name: Reserve capacity and install camera prerequisites
      run: 'set -euo pipefail

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang-18 libclang-rt-18-dev libzmq3-dev

        '
    - name: Install pinned camera Rust toolchain
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

        '
    - name: Require unjoined Vision negative control loses the one-shot image
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/camera-native"

        mkdir -p "$proof"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python3 - <<''CONTROL''

        from pathlib import Path

        p=Path(''rust/crates/dev-tools/src/bin/camera_runtime_test_peer.rs'')

        s=p.read_text()

        line=''            assert!(backend.receive_image(0)?.is_none());\n''

        assert s.count(line)==1

        p.write_text(s.replace(line,''''))

        CONTROL

        set +e

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features camera-runtime-native --test camera_runtime_native
        actual_native_collectors_preserve_msgq_vision_samples_and_logger_packet --locked -- --nocapture > "$proof/unjoined-red.log"
        2>&1

        status=$?

        set -e

        test "$status" = 101

        grep -F ''native test peer deadline: message=true image=false log=true'' "$proof/unjoined-red.log"

        grep -F ''test result: FAILED. 0 passed; 1 failed'' "$proof/unjoined-red.log"

        git show "$EXPECTED_SOURCE":rust/crates/dev-tools/src/bin/camera_runtime_test_peer.rs > rust/crates/dev-tools/src/bin/camera_runtime_test_peer.rs

        git diff --exit-code -- rust/crates/dev-tools/src/bin/camera_runtime_test_peer.rs

        '
    - name: Build and validate native camera source generators
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features camera-runtime-native --test camera_source_generate
        --test camera_data_generate --test camera_sensor_generate --test camera_sensor_check --test camera_request_check --test
        camera_exposure_check --test camera_misc_check --test camera_packet_check --test camera_kernel_check --test camera_sensor_lifecycle_check
        --test camera_isp_lifecycle_check --test camera_lifecycle_check --test camera_state_check --test camera_stress_check
        --test camera_generic_stress_check --test camera_lifecycle_generate --test camera_ci_check --test camera_runtime_check
        --test camera_runtime_controller --test camera_runtime_native --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features camera-runtime-native --bin generate-camerad-requests-reference
        --bin generate-camerad-packet-reference --bin generate-camerad-bps-data --bin generate-camerad-sensor-data --bin check-camerad-sensors
        --bin check-camerad-requests --bin check-camerad-exposure --bin check-camerad-misc --bin check-camerad-packets --bin
        check-camerad-kernel --bin check-camerad-sensor-lifecycle --bin check-camerad-isp-lifecycle --bin check-camerad-camera-lifecycle
        --bin check-camerad-state --bin check-camerad-runtime-stress --bin check-camerad-stress --bin generate-camerad-ae-reference
        --bin generate-camerad-kernel-reference --bin generate-camerad-sensor-lifecycle-reference --bin generate-camerad-isp-lifecycle-reference
        --bin generate-camerad-camera-lifecycle-reference --bin generate-camerad-state-reference --bin generate-camerad-stress-reference
        --bin generate-camerad-runtime-fixture --bin check-camerad-ci --bin check-camerad-runtime --bin camera-runtime-test-peer
        --test camera_source_generate --test camera_data_generate --test camera_sensor_generate --test camera_sensor_check
        --test camera_request_check --test camera_exposure_check --test camera_misc_check --test camera_packet_check --test
        camera_kernel_check --test camera_sensor_lifecycle_check --test camera_isp_lifecycle_check --test camera_lifecycle_check
        --test camera_state_check --test camera_stress_check --test camera_generic_stress_check --test camera_lifecycle_generate
        --test camera_ci_check --test camera_runtime_check --test camera_runtime_controller --test camera_runtime_native --locked
        -- -D warnings

        '
    - name: Build and check native camera packages
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-camerad -p openpilot-camera-kernel -p openpilot-camerad-runtime
        --features native-skip-miri --bins --examples --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-camerad -p openpilot-camera-kernel -p openpilot-camerad-runtime
        --features native-skip-miri --all-targets --locked -- -D warnings

        '
    - name: Require camera and original VisionIPC peer tests
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-camerad --all-targets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-camera-kernel -p openpilot-camerad-runtime --features native-skip-miri
        --all-targets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-msgq --features native-skip-miri --test vision --test vision_server
        --test vision_native --locked

        '
    - name: Require original camera comparisons and continuous driver fixtures
      run: 'set -euo pipefail

        rust/target/debug/check-camerad-ci --binaries rust/target/debug --output "$RUNNER_TEMP/camera-native/oracles"'
    - name: Preserve camera evidence including failed cases
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-camera-runtime-evidence
        path: ${{ runner.temp }}/camera-native/
        if-no-files-found: warn
