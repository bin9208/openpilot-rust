name: Calibration estimator original saved-error capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/calibration-estimator-saved-error-296-once.yml
permissions:
  contents: read
jobs:
  original-calibration-estimator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 6a726075571b1a30cb73cbedd75472a929575153
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 6a726075571b1a30cb73cbedd75472a929575153
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
    - name: Check exact source and install original-only dependencies
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0

        '
    - name: Capture original cached-Params failure on all resets
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/calibration-estimator-saved-error-296\"\nmkdir -p \"$proof\"\nrust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncat > \"$proof/capture_original_only.py\" <<'PYCODE'\n#!/usr/bin/env\
        \ python3\n\"\"\"One-time original-only calibration estimator capture; never runs a Rust candidate.\"\"\"\nimport\
        \ argparse\nfrom collections import Counter\nimport gzip\nimport hashlib\nfrom itertools import zip_longest\nimport\
        \ json\nimport logging\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\n\nimport numpy as np\n\
        \nROOT = Path(os.environ[\"GITHUB_WORKSPACE\"]).resolve()\nsys.path[:0] = [str(ROOT), str(ROOT / \"opendbc_repo\"\
        ), str(ROOT / \"rust/tools\")]\nfrom calibration_cases import histories  # noqa: E402\nfrom calibration_reference\
        \ import Parameters, original  # noqa: E402\nfrom openpilot.cereal import log  # noqa: E402\n\nSOURCES = [\n    \"\
        rust/tools/check_calibration_reference.py\",\n    \"rust/tools/calibration_cases.py\",\n    \"rust/tools/calibration_reference.py\"\
        ,\n    \"openpilot/selfdrive/locationd/calibrationd.py\",\n    \"openpilot/cereal/messaging/__init__.py\",\n    \"\
        openpilot/cereal/__init__.py\",\n    \"openpilot/cereal/log.capnp\",\n    \"openpilot/cereal/custom.capnp\",\n   \
        \ \"openpilot/cereal/deprecated.capnp\",\n    \"openpilot/cereal/include/c++.capnp\",\n    \"opendbc_repo/opendbc/car/car.capnp\"\
        ,\n    \"opendbc_repo/opendbc/car/include/c++.capnp\",\n    \"openpilot/common/constants.py\",\n    \"openpilot/common/transformations/orientation.py\"\
        ,\n    \"openpilot/common/transformations/transformations.py\",\n]\nBASELINE_TRACE_SHA = \"2404a796dc09886770546197417d325d53aa2f1d451722982bf7f319439ce954\"\
        \n\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef numbers(value):\n    \"\"\"Keep the\
        \ original binary64/NaN/Infinity class in a JSON-standard string.\"\"\"\n    if isinstance(value, np.ndarray):\n \
        \       return numbers(value.tolist())\n    if isinstance(value, dict):\n        return {key: numbers(item) for key,\
        \ item in value.items()}\n    if isinstance(value, (list, tuple)):\n        return [numbers(item) for item in value]\n\
        \    if isinstance(value, (float, np.floating)):\n        return repr(float(value))\n    if isinstance(value, np.integer):\n\
        \        return int(value)\n    if isinstance(value, np.bool_):\n        return bool(value)\n    return value\n\n\n\
        def state(calibrator):\n    return {\n        \"rpy\": numbers(calibrator.rpy.tolist()),\n        \"wide\": numbers(calibrator.wide_from_device_euler.tolist()),\n\
        \        \"height\": repr(float(calibrator.height[0])),\n        \"spread\": numbers(calibrator.calib_spread.tolist()),\n\
        \        \"old_rpy\": numbers(calibrator.old_rpy.tolist()),\n        \"old_weight\": repr(float(calibrator.old_rpy_weight)),\n\
        \        \"valid_indices\": numbers(calibrator.get_valid_idxs()),\n        \"idx\": int(calibrator.idx),\n       \
        \ \"block_idx\": int(calibrator.block_idx),\n        \"valid_blocks\": int(calibrator.valid_blocks),\n        \"status\"\
        : [\"uncalibrated\", \"calibrated\", \"invalid\", \"recalibrating\"][calibrator.cal_status],\n    }\n\n\nclass CachedParamsFailure(logging.Handler):\n\
        \    \"\"\"Observe the original constructor's one cached-Params exception log.\"\"\"\n\n    def __init__(self):\n\
        \        super().__init__()\n        self.failures = 0\n\n    def emit(self, record):\n        if record.getMessage()\
        \ == \"Error reading cached CalibrationParams\":\n            assert record.exc_info is not None, \"cached-Params\
        \ failure lacks exception\"\n            self.failures += 1\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
        \    parser.add_argument(\"--expected-source\", required=True)\n    parser.add_argument(\"--baseline-trace\", type=Path,\
        \ required=True)\n    parser.add_argument(\"--output\", type=Path, required=True)\n    args = parser.parse_args()\n\
        \    commit = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], cwd=ROOT, text=True).strip()\n    assert\
        \ commit == args.expected_source, (commit, args.expected_source)\n    output = args.output.resolve()\n    output.mkdir(parents=True,\
        \ exist_ok=False)\n    assert digest(args.baseline_trace.read_bytes()) == BASELINE_TRACE_SHA, \"old trace changed\"\
        \n    source_hashes = {name: digest((ROOT / name).read_bytes()) for name in SOURCES}\n    counters, statuses = Counter(),\
        \ Counter()\n    steps = failures = writes = packets = cached_failures = successful_resets = 0\n    calibrator = params\
        \ = None\n    raw = output / \"original.jsonl.gz\"\n    with gzip.open(raw, \"wt\", encoding=\"utf-8\", compresslevel=9,\
        \ newline=\"\\n\") as trace:\n        for category, command in histories():\n            steps += 1\n            counters[category]\
        \ += 1\n            assert steps <= 15128, \"original history unexpectedly expanded\"\n            before = len(params.writes)\
        \ if params is not None else 0\n            observation = {}\n            try:\n                if command[\"action\"\
        ] == \"reset\":\n                    params = Parameters(bytes(command[\"saved\"]) if command[\"saved\"] is not None\
        \ else None)\n                    before = 0\n                    source = original(command[\"mici\"], params)\n \
        \                   handler = CachedParamsFailure()\n                    logger = source.cloudlog\n              \
        \      logger.addHandler(handler)\n                    try:\n                        calibrator = source.Calibrator(param_put=True)\n\
        \                    finally:\n                        logger.removeHandler(handler)\n                        handler.close()\n\
        \                    assert handler.failures in (0, 1), \"duplicate cached-Params failure\"\n                    assert\
        \ command[\"saved\"] is not None or handler.failures == 0, \"failure without saved Params\"\n                    observation[\"\
        saved_error\"] = bool(handler.failures)\n                    cached_failures += handler.failures\n               \
        \     if command[\"seed\"] is not None:\n                        seed = command[\"seed\"]\n                      \
        \  calibrator.reset(np.array(list(map(float, seed[\"rpy\"]))), seed[\"valid_blocks\"],\n                         \
        \                np.array(list(map(float, seed[\"wide\"]))),\n                                         np.array(list(map(float,\
        \ seed[\"height\"]))))\n                        calibrator.update_status()\n                    calibrator.not_car\
        \ = command[\"not_car\"]\n                else:\n                    calibrator.handle_v_ego(float(command[\"v_ego\"\
        ]))\n                    input_values = {name: list(map(float, value)) for name, value in command[\"input\"].items()}\n\
        \                    accepted = None\n                    if not (abs(float(command[\"trim\"])) > 1e-6 and calibrator.cal_status\
        \ == log.LiveCalibrationData.Status.calibrated):\n                        accepted = calibrator.handle_cam_odom(input_values[\"\
        trans\"], input_values[\"rot\"], input_values[\"wide\"],\n                                                       \
        \       input_values[\"trans_std\"], input_values[\"road\"], input_values[\"road_std\"])\n                    observation[\"\
        accepted\"] = None if accepted is None else numbers(list(accepted))\n                wanted = calibrator.get_msg(command.get(\"\
        valid\", True))\n                wanted.logMonoTime = command.get(\"timestamp\", 0)\n                observation[\"\
        state\"] = state(calibrator)\n                observation[\"packet_hex\"] = wanted.to_bytes().hex()\n            \
        \    observation[\"packet_fields\"] = numbers(wanted.to_dict())\n                observation[\"persist\"] = len(params.writes)\
        \ != before\n                observation[\"writes_hex\"] = [packet.hex() for packet in params.writes[before:]]\n \
        \               if command[\"action\"] == \"reset\":\n                    successful_resets += 1\n               \
        \ statuses[observation[\"state\"][\"status\"]] += 1\n                writes += len(observation[\"writes_hex\"])\n\
        \                packets += 1\n            except (ValueError, IndexError, TypeError) as error:\n                observation\
        \ = {\"error_class\": type(error).__name__, \"error_message\": str(error),\n                               \"writes_hex\"\
        : [packet.hex() for packet in params.writes[before:]] if params else []}\n                failures += 1\n        \
        \    trace.write(json.dumps({\"step\": steps, \"scenario\": category, \"command\": command,\n                    \
        \                \"original\": observation}, ensure_ascii=False, allow_nan=False, separators=(\",\", \":\")) + \"\\\
        n\")\n    assert steps == 15128, steps\n    assert statuses[\"recalibrating\"] and statuses[\"invalid\"] and statuses[\"\
        calibrated\"]\n    assert writes >= 10 and failures >= 10\n    assert successful_resets == 163, successful_resets\n\
        \    compared = 0\n    with gzip.open(args.baseline_trace, \"rt\", encoding=\"utf-8\") as baseline, \\\n         gzip.open(raw,\
        \ \"rt\", encoding=\"utf-8\") as captured:\n        for old_line, new_line in zip_longest(baseline, captured):\n \
        \           assert old_line is not None and new_line is not None, \"trace row count differs\"\n            old_row,\
        \ new_row = json.loads(old_line), json.loads(new_line)\n            if old_row[\"command\"][\"action\"] == \"reset\"\
        \ and \"state\" in old_row[\"original\"]:\n                assert type(new_row[\"original\"].pop(\"saved_error\",\
        \ None)) is bool, \"reset observation missing\"\n            assert new_row == old_row, f\"old observation changed\
        \ at step {compared + 1}\"\n            compared += 1\n    assert compared == steps, (compared, steps)\n    manifest\
        \ = {\"kind\": \"original-only calibration estimator\", \"source_commit\": commit,\n                \"source_sha256\"\
        : source_hashes, \"python\": sys.version, \"numpy\": np.__version__,\n                \"capnp\": __import__(\"capnp\"\
        ).__version__, \"steps\": steps, \"scenarios\": counters,\n                \"statuses\": statuses, \"source_errors\"\
        : failures, \"persistence_packets\": writes,\n                \"packets\": packets, \"successful_resets\": successful_resets,\n\
        \                \"cached_params_failures\": cached_failures,\n                \"trace_file\": raw.name, \"trace_sha256\"\
        : digest(raw.read_bytes()),\n                \"state_tolerance\": {\"absolute\": 2e-12, \"relative\": 2e-12},\n  \
        \              \"wire_tolerance\": \"one Float32 ULP or absolute2e-12 cancellation floor; discrete and nonfinite classes\
        \ exact\"}\n    (output / \"manifest.json\").write_text(json.dumps(manifest, indent=2) + \"\\n\")\n    print(json.dumps({key:\
        \ manifest[key] for key in (\"steps\", \"scenarios\", \"statuses\", \"source_errors\", \"persistence_packets\", \"\
        packets\", \"successful_resets\", \"cached_params_failures\", \"trace_sha256\")}, indent=2))\n\n\nif __name__ == \"\
        __main__\":\n    main()\nPYCODE\nprintf 'c423c7adffd9125d3daed7a621ae7433361c5161329bf2a76e22d3eaa0e00f50  %s/capture_original_only.py\\\
        n' \"$proof\" | sha256sum --check --strict\npython -m py_compile \"$proof/capture_original_only.py\"\ntimeout 1200s\
        \ python \"$proof/capture_original_only.py\" --expected-source \"$EXPECTED_SOURCE\" --baseline-trace \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/calibration-estimator-original-04ee2c/original.jsonl.gz\"\
        \ --output \"$proof/original\" > \"$proof/capture.stdout\" 2> \"$proof/capture.stderr\"\ntest -s \"$proof/original/manifest.json\"\
        \ntest -s \"$proof/original/original.jsonl.gz\"\nsha256sum \"$proof/capture_original_only.py\" \"$proof/original/manifest.json\"\
        \ \"$proof/original/original.jsonl.gz\" > \"$proof/SHA256SUMS\"\npython -m pip freeze > \"$proof/python-packages.txt\"\
        \ngit rev-parse HEAD > \"$proof/SOURCE_COMMIT\"\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: calibration-estimator-saved-error-296
        path: ${{ runner.temp }}/calibration-estimator-saved-error-296/
        if-no-files-found: error
