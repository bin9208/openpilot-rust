name: 296 native model catalog publication original filesystem comparison
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-catalog-publisher-native-296-once.yml
permissions:
  contents: read
env:
  EXPECTED_SOURCE: 995383b2bbdd199fb925184914d8aa4f29837831
  ORIGINAL_PUBLISH_SHA256: a3918ab6f837813fc68a40f64ce2c47d13bba1ec78f449f6e028ce72c6ae085d
  ORIGINAL_SCHEMA_SHA256: 720abcc396852a395689c4d37f9487822f951166a36b5efe8586dce5f656c6a9
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 995383b2bbdd199fb925184914d8aa4f29837831
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Reserve hosted capacity and fresh target
      id: setup
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        mkdir "$RUNNER_TEMP/catalog-publisher-proof-296" "$RUNNER_TEMP/catalog-publisher-artifact-296"

        test ! -e "$RUNNER_TEMP/catalog-publisher-target-296"

        printf ''CATALOG_PUBLISH_STRACE=%s\n'' "$(readlink -f "$(command -v strace)")" >> "$GITHUB_ENV"

        printf ''CATALOG_PUBLISH_PROOF=%s\nCARGO_TARGET_DIR=%s\n'' "$RUNNER_TEMP/catalog-publisher-proof-296" "$RUNNER_TEMP/catalog-publisher-target-296"
        >> "$GITHUB_ENV"

        '
    - name: Admit exact original-slice harness
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''REFERENCE_PAYLOAD'' | gzip --decompress > "$CATALOG_PUBLISH_PROOF/catalog_publication_reference.py"

        

        REFERENCE_PAYLOAD

        printf ''%s  %s\n'' 18b0bfa0221063f69065b2b31431cb80fe19660cab34779f28ab046f09154304 "$CATALOG_PUBLISH_PROOF/catalog_publication_reference.py"
        | sha256sum --check --strict -

        '
    - name: Capture original publication effects before native execution
      shell: bash
      run: 'set -euo pipefail

        proof="$CATALOG_PUBLISH_PROOF"

        printf ''%s\n'' "$EXPECTED_SOURCE" "$GITHUB_WORKFLOW_SHA" > "$proof/source-workflow.txt"

        # Freeze independent original-only outputs before current native build/execution.

        timeout --signal=KILL 180 python "$proof/catalog_publication_reference.py" capture-original > "$proof/original.stdout"
        2> "$proof/original.stderr"

        sha256sum "$proof/original-rows.json" "$proof/original-capture.json" > "$proof/original.sha256"

        '
    - name: Build only new native publication targets and strict Clippy
      shell: bash
      run: 'set -euo pipefail

        proof="$CATALOG_PUBLISH_PROOF"

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096

        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin publish-model-catalog --test
        catalog_publish -- -D warnings > "$proof/clippy.log" 2>&1 || { cat "$proof/clippy.log"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --test catalog_publish --no-run --message-format=json
        > "$proof/artifacts.jsonl" 2> "$proof/build.stderr" || { cat "$proof/build.stderr"; exit 1; }

        # Parse compiler metadata with Python stdlib; no model/provider dependencies.

        python - <<''SELECT_ELF''

        import json,os

        from pathlib import Path

        proof=Path(os.environ[''CATALOG_PUBLISH_PROOF'']);rows=[json.loads(l) for l in (proof/''artifacts.jsonl'').read_text().splitlines()]

        paths={r[''executable''] for r in rows if r.get(''reason'')==''compiler-artifact'' and r.get(''target'',{}).get(''name'')==''catalog_publish''
        and r.get(''profile'',{}).get(''test'') and r.get(''executable'')}

        assert len(paths)==1

        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''CATALOG_PUBLISH_TEST=''+paths.pop()+''\nCATALOG_PUBLISH_BINARY=''+os.environ[''CARGO_TARGET_DIR'']+''/debug/publish-model-catalog\n'')

        SELECT_ELF

        '
    - name: Seal source, helpers and immutable original observations
      id: bind
      shell: bash
      run: 'set -euo pipefail

        proof="$CATALOG_PUBLISH_PROOF"

        git ls-files -z -- rust/crates/model-runtime rust/Cargo.toml rust/Cargo.lock rust/rust-toolchain.toml rust/tools/model_export/publish.py
        rust/tools/model_export/schema.py > "$proof/held.nul"

        printf ''%s\0'' "$CATALOG_PUBLISH_TEST" "$CATALOG_PUBLISH_BINARY" "$proof/catalog_publication_reference.py" "$CATALOG_PUBLISH_STRACE"
        "$(readlink -f "$(command -v python)")" >> "$proof/held.nul"

        xargs -0 -r sha256sum < "$proof/held.nul" > "$proof/before.sha256"

        while IFS= read -r -d '''' p; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$p"; done < "$proof/held.nul" > "$proof/identities.before"

        '
    - name: Require eight lifecycle units and ten original/native filesystem cases
      shell: bash
      run: 'set -euo pipefail

        proof="$CATALOG_PUBLISH_PROOF"

        timeout --signal=KILL 300 "$CATALOG_PUBLISH_TEST" --nocapture > "$proof/units.log" 2>&1 || { cat "$proof/units.log";
        exit 1; }

        grep -F ''test result: ok. 8 passed; 0 failed;'' "$proof/units.log"

        timeout --signal=KILL 300 python "$proof/catalog_publication_reference.py" compare-native > "$proof/native.stdout"
        2> "$proof/native.stderr" || { cat "$proof/native.stderr"; exit 1; }

        python - <<''CHECK_COMPLETE''

        import json,os

        from pathlib import Path

        v=json.loads((Path(os.environ[''CATALOG_PUBLISH_PROOF''])/''comparison.complete.json'').read_bytes())

        assert v[''original_cases'']==v[''native_cases'']==10 and v[''case_rows_equal''] is True and v[''model_or_compiler_acceptance'']
        is False

        CHECK_COMPLETE

        '
    - name: Always require unchanged source and original records
      if: always() && steps.bind.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$CATALOG_PUBLISH_PROOF";status=0

        sha256sum --check --strict "$proof/before.sha256" > "$proof/after.log" 2>&1 || status=1

        sha256sum --check --strict "$proof/original.sha256" > "$proof/original.after.log" 2>&1 || status=1

        while IFS= read -r -d '''' p; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$p" || status=1; done < "$proof/held.nul"
        > "$proof/identities.after"

        cmp "$proof/identities.before" "$proof/identities.after" || status=1

        test -s "$proof/comparison.complete.json" || status=1

        printf ''%s\n'' "$status" > "$proof/final-guards.status"

        exit "$status"

        '
    - name: Preserve bounded raw originals/native outputs on failure
      if: always() && steps.setup.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\nproof=\"$CATALOG_PUBLISH_PROOF\";out=\"$RUNNER_TEMP/catalog-publisher-artifact-296\"\n# Known\
        \ inert corpus symlinks are preserved inside tar, never followed.\nfind \"$proof\" -type f -printf '%P\\0' > \"$out/files.nul\"\
        \ncount=0;bytes=0\nwhile IFS= read -r -d '' relative; do\n path=\"$proof/$relative\";test -f \"$path\" && test ! -L\
        \ \"$path\"\n size=$(stat -c '%s' \"$path\");test \"$size\" -le 33554432\n count=$((count+1));bytes=$((bytes+size));test\
        \ \"$count\" -le 4096 && test \"$bytes\" -le 134217728\n sha256sum \"$path\" >> \"$out/files.sha256\"\ndone < \"$out/files.nul\"\
        \nfind \"$proof\" -mindepth 1 -printf '%P\\0' > \"$out/roster.nul\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 256\ntar --create --gzip --null --verbatim-files-from --no-recursion --directory=\"$proof\" --files-from=\"\
        $out/roster.nul\" --file=\"$out/proof.tar.gz\"\nsha256sum --check --strict \"$out/files.sha256\" > \"$out/files.after.log\"\
        \nsha256sum \"$out/proof.tar.gz\" > \"$out/proof.sha256\"\nprintf 'files=%s\\nbytes=%s\\n' \"$count\" \"$bytes\" >\
        \ \"$out/counts.txt\"\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-catalog-publisher-native-1d5570e158b
        path: ${{ runner.temp }}/catalog-publisher-artifact-296/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
