name: 296 logging and framing continuation with accepted ordinary evidence
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/uploader-native-group-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE: 40f37bea345009bfcadf2275916f4322af45ffba
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 40f37bea345009bfcadf2275916f4322af45ffba
        persist-credentials: false
    - name: Reserve hosted capacity and record exact candidate source
      shell: bash
      run: 'set -euo pipefail

        export UPLOADER_PROOF="$RUNNER_TEMP/uploader-native-group-296"

        printf ''UPLOADER_PROOF=%s\n'' "$UPLOADER_PROOF" >> "$GITHUB_ENV"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        mkdir "$UPLOADER_PROOF"

        printf ''workflow_head=%s

        source_commit=%s

        '' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$UPLOADER_PROOF/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5 strace

        rustc +1.94.0 --version --verbose > "$UPLOADER_PROOF/rust-provider.txt"

        git status --porcelain=v1 > "$UPLOADER_PROOF/source-status.before.txt"

        '
    - name: Admit immutable originals and accepted ordinary evidence with source/provider guards
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 128

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12417680413/zip > "$UPLOADER_PROOF/original.zip"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12421835922/zip > "$UPLOADER_PROOF/accepted-ordinary.zip"

        base64 --decode <<''INERT'' > "$UPLOADER_PROOF/hosted-group-evidence.py"

        

        INERT

        printf ''5add1bc42572f0afda94e84dd122d5bc489131cbd0eb1b082d78214f863b8bb2  %s/hosted-group-evidence.py

        '' "$UPLOADER_PROOF" | sha256sum --check --strict

        base64 --decode <<''INERT'' > "$UPLOADER_PROOF/hosted-logging-continuation.py"

        

        INERT

        printf ''eabe5b46c26f5f3c17e0b2f20d7723343c7f158bfb355f6013fa1b9876556149  %s/hosted-logging-continuation.py

        '' "$UPLOADER_PROOF" | sha256sum --check --strict

        git fetch --no-tags --depth=1 origin 67f099bffbdda2396ea2f64e1f168a76ce19d560 > "$UPLOADER_PROOF/reuse-source-fetch.stdout"
        2> "$UPLOADER_PROOF/reuse-source-fetch.stderr"

        python3 "$UPLOADER_PROOF/hosted-logging-continuation.py" admit

        '
    - name: Build actual daemon probes and both functional native controllers
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-uploader -p openpilot-logmessaged --bins
        --examples > "$UPLOADER_PROOF/daemon-build.stdout" 2> "$UPLOADER_PROOF/daemon-build.stderr"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-logging-native --bin check-uploader-logging > "$UPLOADER_PROOF/controller-build.stdout" 2> "$UPLOADER_PROOF/controller-build.stderr"

        '
    - name: Strict Clippy affected logging controller and compile only logging plus filtered framing tests
      shell: bash
      run: 'set -euo pipefail

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-logging-native --lib --bin check-uploader-logging --test uploader_logging_check -- -D warnings > "$UPLOADER_PROOF/clippy.stdout"
        2> "$UPLOADER_PROOF/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-logging-native --test uploader_logging_check --no-run --message-format=json > "$UPLOADER_PROOF/logging-build.jsonl"
        2> "$UPLOADER_PROOF/logging-build.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-logging-native --lib uploader_reference_check::http::framing_tests --no-run --message-format=json > "$UPLOADER_PROOF/framing-build.jsonl"
        2> "$UPLOADER_PROOF/framing-build.stderr"

        python3 "$UPLOADER_PROOF/hosted-logging-continuation.py" discover

        '
    - name: Run two real TCP framing tests and complete eighteen-case logging scope only
      shell: bash
      env:
        OPENPILOT_RUST_ROOT: ${{ github.workspace }}
        UPLOADER_ORIGINAL_REFERENCE: ${{ runner.temp }}/uploader-native-group-296/original/observations/reference-observations.json
        UPLOADER_ORIGINAL_REFERENCE_SHA256: b1ce58a70769ab48c7893f26da0f7186b2e7d378fd8a19fd5e495f88d68d4eb5
        UPLOADER_ORIGINAL_LOGGING: ${{ runner.temp }}/uploader-native-group-296/original/observations/logging-observations.json
        UPLOADER_ORIGINAL_LOGGING_SHA256: cdf42bbfebd0613cfc4896c419d96927cf410301155d3ce6b2141cb10313abba
        UPLOADER_TRACE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/uploader_trace
        UPLOADER_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-uploader
        UPLOADER_COLLECTOR_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-logmessaged
        UPLOADER_REFERENCE_CHECKER: ${{ github.workspace }}/rust/target/debug/check-uploader-reference
        UPLOADER_LOGGING_CHECKER: ${{ github.workspace }}/rust/target/debug/check-uploader-logging
        UPLOADER_GROUP_PROOF: ${{ runner.temp }}/uploader-native-group-296/runtime
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        mkdir "$UPLOADER_PROOF/runtime-path"

        ln -s /usr/bin/git "$UPLOADER_PROOF/runtime-path/git"

        PATH="$UPLOADER_PROOF/runtime-path" /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/strace -f -e trace=execve,execveat
        -s 4096 -o "$UPLOADER_PROOF/framing.execve" "$UPLOADER_FRAMING_EXE" uploader_reference_check::http::framing_tests
        --test-threads=1 --nocapture > "$UPLOADER_PROOF/framing.stdout" 2> "$UPLOADER_PROOF/framing.stderr"

        PATH="$UPLOADER_PROOF/runtime-path" /usr/bin/timeout --signal=TERM --kill-after=10s 600s /usr/bin/strace -f -e trace=execve,execveat
        -s 4096 -o "$UPLOADER_PROOF/logging.execve" "$UPLOADER_LOGGING_EXE" --test-threads=1 --nocapture > "$UPLOADER_PROOF/logging.stdout"
        2> "$UPLOADER_PROOF/logging.stderr"

        python3 "$UPLOADER_PROOF/hosted-logging-continuation.py" finish

        git status --porcelain=v1 > "$UPLOADER_PROOF/source-status.after.txt"

        cmp "$UPLOADER_PROOF/source-status.before.txt" "$UPLOADER_PROOF/source-status.after.txt"

        '
    - name: Retain unchanged original expectations and full actual native requests/packets
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: uploader-logging-continuation-296
        path: ${{ runner.temp }}/uploader-native-group-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
