    - name: Capture only missing original HZ inputs and source admission
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/timeout --signal=TERM --kill-after=10s 300s python -I -B "$HZ_BASE/capture-hz-additions.py" --root "$GITHUB_WORKSPACE"
        --output "$HZ_BASE/observations" --reused-inputs "$HZ_BASE/reused-hz-inputs.json" > "$HZ_BASE/capture.stdout" 2> "$HZ_BASE/capture.stderr"

        git status --porcelain=v1 > "$HZ_BASE/source-status.after.txt"

        cmp "$HZ_BASE/source-status.before.txt" "$HZ_BASE/source-status.after.txt"

        du -sm "$HZ_BASE" > "$HZ_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$HZ_BASE/artifact-size-mib.txt")" -le 9

        '
    - name: Preserve complete independent additions and provider/source receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-hz-original-296
        path: ${{ runner.temp }}/changed-files-hz-original-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
