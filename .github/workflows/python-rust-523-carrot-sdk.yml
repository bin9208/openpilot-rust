name: Python Rust 523 CarrotMan exact SDK caller
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-carrot-sdk.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: python-rust-523-carrot-sdk-${{ github.ref }}
  cancel-in-progress: false
  queue: max
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  carrot-man-runtime:
    name: rust CarrotMan owner (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.arch == 'aarch64' && 60 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: local-x64
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARROT_EXCEPTION_DISCORD_WEBHOOK_DISABLE: '1'
      LOCAL_CI_ARCH: ${{ matrix.arch }}
      CI296_ALIAS_BASENAME: .ci296-source-rust--carrot-man-runtime
    steps:
    - name: Deny fork source and require GitHub-hosted Linux X64
      shell: bash
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
          == github.repository }}
        CI296_HOST_CONTROL: '1'
      run: 'test "${SOURCE_ALLOWED:-}" = true || { echo ''Fork PR source denied on persistent bin-actions'' >&2;
        exit 1; }

        set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust

        test "$RUNNER_ENVIRONMENT" = github-hosted

        test "$RUNNER_OS" = Linux

        test "$RUNNER_ARCH" = X64

        test "$(uname -s)" = Linux

        test "$(uname -m)" = x86_64

        '
      working-directory: ${{ github.workspace }}
    - name: Common owned job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env: &id001
        CI296_HOST_CONTROL: '1'
    - name: Allocate private source cache target and local action alias before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env: *id001
      run: 'set -euo pipefail

        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")

        job=$CI_JOB_TEMP

        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"

        test "$(cat "$job/owner")" = "$owner"

        umask 077

        mkdir "$job/proof" "$job/home" "$job/cache"

        # Source capacity is checked on the actual source filesystem BEFORE checkout.

        available=$(df -PB1 "$workspace" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        required=$((2 * 1024 * 1024 * 1024))

        printf ''{"available_bytes":%s,"planned_source_growth_bytes":%s}\n'' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"

        ((available >= required))

        source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")

        printf ''%s\n'' "$owner" > "$source_owner/.ci296-owner"

        mkdir "$source_owner/source"

        source="$source_owner/source"

        # Preserve Actions'' real workspace separately. Only Bash consumers see the

        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.

        printf ''source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n'' "$BASH_ENV"
        "$workspace" "$source" > "$job/ci296-shell-env"

        printf ''%s\n'' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat
        -c ''%d:%i'' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home"
        "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache"
        "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env"
        >> "$GITHUB_ENV"

        printf ''owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n''
        "$owner" "$job" "$workspace" "$source_owner" "$(stat -c ''%d:%i'' -- "$source_owner")" "$source" "$GITHUB_SHA"
        > "$job/proof/ownership.txt"

        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"

        cat /proc/meminfo > "$job/proof/memory-before.txt"

        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt";
        fi

        printf ''%s\n'' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"


        alias_path="$workspace/$CI296_ALIAS_BASENAME"

        case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac

        [[ $CI296_ALIAS_BASENAME != */* ]]

        # -T makes this an exclusive atomic link, never traversal into a stale directory.

        ln -sT -- "$source_owner" "$alias_path"

        printf ''%s\n'' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c ''%d:%i'' -- "$alias_path")"
        "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"

        printf ''source_alias=%s\nalias_identity=%s\n'' "$alias_path" "$(stat -c ''%d:%i'' -- "$alias_path")" >>
        "$job/proof/ownership.txt"

        '
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
        path: ${{ env.CI296_CHECKOUT_PATH }}
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
    - name: Admit exact private source and index
      id: ci296_source_admission
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        test "$PWD" = "$CI296_SOURCE"

        test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git diff --exit-code

        git diff --cached --exit-code

        printf ''%s\n'' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"

        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"

        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
        1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"

        '
    - name: Require reviewed maintained CarrotMan source
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: 'set -euo pipefail

        printf ''%s  %s\n'' f6286ab88351066d3dbba626f86e509aa37e4d8bed2746fa4961f329abb43cb9 .github/workflows/rust.yml
        | sha256sum --check --strict -

        '
    - name: Configure source-dependent job environment on private paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_LATE_PYTHONPATH: ${{ env.CI296_SOURCE }}
        CI296_HOST_CONTROL: '1'
      run: 'set -euo pipefail

        printf ''%s\n'' "PYTHONPATH=$CI296_LATE_PYTHONPATH" >> "$GITHUB_ENV"

        '
    - name: Require QEMU host executable before ARM transport
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      run: "set -euo pipefail\nif [[ $LOCAL_CI_ARCH == aarch64 ]]; then\n  if [[ ! -x /usr/bin/qemu-aarch64-static\
        \ ]]; then\n    # QEMU 설치는 transport 준비 전에 별도 1 GiB 증가량을 승인한다.\n    df -PB1 /usr/bin /var/lib/apt/lists\
        \ /var/cache/apt/archives > \"$CI_JOB_TEMP/proof/qemu-host-disk-before.txt\"\n    for path in /usr/bin /var/lib/apt/lists\
        \ /var/cache/apt/archives; do\n      available=$(df -PB1 \"$path\" | awk 'NR == 2 {print $4}')\n      [[\
        \ $available =~ ^[0-9]+$ ]]\n      ((available >= 1024 * 1024 * 1024))\n    done\n    sudo -n timeout --signal=TERM\
        \ --kill-after=10s 180s apt-get -o APT::Architectures=amd64 update\n    sudo -n timeout --signal=TERM --kill-after=10s\
        \ 180s apt-get -o APT::Architectures=amd64 install -y --no-install-recommends qemu-user-static\n    df -PB1\
        \ /usr/bin /var/lib/apt/lists /var/cache/apt/archives > \"$CI_JOB_TEMP/proof/qemu-host-disk-after.txt\"\n\
        \  fi\n  test -x /usr/bin/qemu-aarch64-static\n  /usr/bin/qemu-aarch64-static --version > \"$CI_JOB_TEMP/proof/qemu-host-version.txt\"\
        \nfi\n"
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
    - name: Common explicit x64 or QEMU ARM transport
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: ./.ci296-source-rust--carrot-man-runtime/source/.github/actions/local-arm
      env: *id001
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && ((true) && env.LOCAL_CI_ARCH == 'x86_64') }}
      env: &id002
        CI296_HOST_CONTROL: '1'
        RUSTUP_HOME: ${{ env.CI_JOB_TEMP }}/python-rustup-home
        CARGO_HOME: ${{ env.CI_JOB_TEMP }}/python-cargo-home
        RUSTUP_AUTO_INSTALL: '0'
    - name: Keep original Python installations private
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && ((true) && env.LOCAL_CI_ARCH == 'x86_64') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id002
      run: 'set -euo pipefail

        available=$(df -PB1 "$CI_JOB_TEMP" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        ((available >= 512 * 1024 * 1024))

        python -m venv "$CI_JOB_TEMP/venv"

        printf ''%s\n'' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"

        '
    - name: Prepare exact fresh x64 SDK before CarrotMan cold bootstrap
      id: carrot530_sdk
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: "set -euo pipefail\ntrap 'printf \"CarrotMan SDK preflight failed at line %s\\n\" \"$LINENO\" >&2' ERR\n\
        [[ $RUNNER_ENVIRONMENT:$RUNNER_OS:$RUNNER_ARCH == github-hosted:Linux:X64 && $LOCAL_CI_ARCH == x86_64 ]]\n\
        [[ $HOME == \"$CI_JOB_TEMP/home\" && $CARGO_HOME == \"$CI_JOB_TEMP/cargo-home\" && $RUSTUP_HOME == \"$CI_JOB_TEMP/rustup-home\"\
        \ ]]\n[[ $(cat \"$CI_JOB_TEMP/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nfor path\
        \ in \"$RUSTUP_HOME\" \"$CARGO_HOME\" \"$CI_JOB_TEMP/rust-bootstrap\"; do\n  [[ ! -e $path && ! -L $path\
        \ ]]\ndone\n[[ $(stat -c %d \"$CI296_SOURCE_OWNER\") == \"$(stat -c %d \"$CI_JOB_TEMP\")\" ]]\nused=$(du\
        \ -s -B1 -- \"$CI296_SOURCE_OWNER\" | awk 'NF==2 && $1~/^[0-9]+$/ {print $1}')\nfree=$(df --output=avail\
        \ -B1 -- \"$CI_JOB_TEMP\" | awk 'NR==2 && NF==1 && $1~/^[0-9]+$/ {print $1}')\n[[ $used =~ ^[0-9]+$ && $free\
        \ =~ ^[0-9]+$ ]]\ngib=$((1024*1024*1024))\n((used<=2*gib))\nrequired=$((2*gib-used+3*gib+8*gib+gib+gib+gib/2))\n\
        printf '{\"source_used_bytes\":%s,\"available_bytes\":%s,\"remaining_growth_bytes\":%s,\"partial_prefix_adopted\"\
        :false}\n' \"$used\" \"$free\" \"$required\" > \"$CI_JOB_TEMP/proof/carrot530-admission.json\"\n((free>=required))\n\
        RUSTUP_HARDLINK_PROXIES=1 DIAG_SOURCE=\"$CI296_SOURCE\" GITHUB_PATH=\"$CI_JOB_TEMP/proof/carrot530-sdk-path.txt\"\
        \ /usr/bin/bash \"$CI296_SOURCE/rust/tools/prepare-readonly-ci-rust\" before\nsdk=$CI_JOB_TEMP/rustup-home/toolchains/1.94.0-x86_64-unknown-linux-gnu\n\
        [[ $(cat \"$CI_JOB_TEMP/proof/carrot530-sdk-path.txt\") == \"$sdk/bin\" ]]\nfor tool in rustup cargo rustc;\
        \ do\n  path=$CARGO_HOME/bin/$tool\n  [[ -f $path && ! -L $path && $(stat -c %u \"$path\") == \"$(id -u)\"\
        \ ]]\n  cmp \"$CI_JOB_TEMP/rust-bootstrap/rustup-init\" \"$path\"\ndone\nprintf '%s\n' \"OPENPILOT_CI_PREPARED_RUST_ROOT=$sdk\"\
        \ \"OPENPILOT_CI_PREPARED_RUST_MANIFEST=$CI_JOB_TEMP/proof/prepared-rust-files.before.sha256\" \"RUSTUP_AUTO_INSTALL=0\"\
        \ \"RUSTUP_TOOLCHAIN=1.94.0\" >> \"$GITHUB_ENV\"\nprintf '%s\n' \"$CARGO_HOME/bin\" >> \"$GITHUB_PATH\"\n"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env: *id001
    - name: Reserve runner capacity and install pinned dependencies
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update && sudo apt-get -o "APT::Architectures=$(dpkg
        --print-architecture)" install -y g++ clang cmake pkg-config libzmq3-dev capnproto libcapnp-dev

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 aiohttp==3.13.3 psutil==7.2.2 pytest==9.0.2

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        test "$CI_PREPARED_RUST_ROOT" = "$OPENPILOT_CI_PREPARED_RUST_ROOT"

        test "$CI_PREPARED_RUST_MANIFEST" = "$OPENPILOT_CI_PREPARED_RUST_MANIFEST"

        sha256sum --check --strict --quiet -- "$CI_PREPARED_RUST_MANIFEST"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Stage exact optional GEOS provider
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        python -m pip download --only-binary=:all: --no-deps shapely==2.1.2 --dest "$RUNNER_TEMP/carrot-man-wheels"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        python rust/tools/carrot_man_stage_geos.py --wheel "$RUNNER_TEMP"/carrot-man-wheels/shapely-2.1.2-*.whl
        --output "$RUNNER_TEMP/carrot-man-geos"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        python -m pip install --no-deps "$RUNNER_TEMP"/carrot-man-wheels/shapely-2.1.2-*.whl

        cat "$RUNNER_TEMP/carrot-man-geos/environment.txt" >> "$GITHUB_ENV"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Build current native dependency stager
      uses: ./.ci296-source-rust--carrot-man-runtime/source/.github/actions/native-json11
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      with:
        run-shell: openpilot-local-shell {0}
    - name: Build owner and unchanged source bindings
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-man --bins --examples --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/carrot-man-params"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/carrot-man-msgq"

        "$CI_RECEIPT_METADATA" first-binding CARROT_PARAMS_BINDING "$RUNNER_TEMP/carrot-man-params" >> "$GITHUB_ENV"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compare affected original policy, cereal and time boundaries
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (matrix.arch == 'x86_64') }}
      run: 'python rust/tools/carrot_man_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence
        "$RUNNER_TEMP/carrot-man-policy"

        python rust/tools/carrot_man_serv_compare.py --binary rust/target/debug/examples/carrot_man_trace --params-binding
        "$CARROT_PARAMS_BINDING" --evidence "$RUNNER_TEMP/carrot-man-policy"

        python rust/tools/carrot_man_ingress_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence
        "$RUNNER_TEMP/carrot-man-policy"

        python rust/tools/carrot_man_time_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence
        "$RUNNER_TEMP/carrot-man-policy"

        '
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compare actual owned Params, IPC, sockets and upload recipients
      run: 'export PYTHONPATH="$RUNNER_TEMP/carrot-man-msgq:$GITHUB_WORKSPACE/rust/tools:$PYTHONPATH"

        python -P -m unittest discover -s rust/tools/tests -p test_carrot_man_fixture_ports.py

        python -P -m pytest -c /dev/null --noconftest -p no:cacheprovider rust/tools/test_carrot_man_fixture_inputs.py
        -q --basetemp "$RUNNER_TEMP/carrot-man-input-tests"

        python -P rust/tools/carrot_man_owned_compare.py --binary rust/target/debug/examples/carrot_man_owned --params-binding
        "$CARROT_PARAMS_BINDING" --evidence "$RUNNER_TEMP/carrot-man-owned"

        '
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - uses: actions/upload-artifact@v6
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always()) }}
      with:
        name: carrot-man-owner-${{ matrix.arch }}-evidence
        path: '${{ env.CI_JOB_TEMP }}/carrot-man-policy/**

          ${{ env.CI_JOB_TEMP }}/carrot-man-owned/**

          ${{ env.CI_JOB_TEMP }}/carrot-man-input-tests/**

          ${{ env.CI_JOB_TEMP }}/carrot-man-geos/**

          ${{ env.LOCAL_CI_TARGET_DIR }}/debug/openpilot-carrot-man


          ${{ env.CI_JOB_TEMP }}/local-arm/execution.json

          ${{ env.CI_JOB_TEMP }}/local-arm/qemu-version.txt

          ${{ env.CI_JOB_TEMP }}/local-arm/proot-version.txt

          '
      id: local_evidence_1
    - name: Finish emulated architecture evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.ci296_source_admission.outcome == 'success') }}
      uses: ./.ci296-source-rust--carrot-man-runtime/source/.github/actions/local-arm
      with:
        cleanup: 'true'
      env: *id001
    - name: Verify whole x64 SDK after every attempted CarrotMan check
      id: carrot530_sdk_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.carrot530_sdk.outcome != 'skipped' && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: 'set -euo pipefail

        DIAG_SOURCE="$CI296_SOURCE" /usr/bin/bash "$CI296_SOURCE/rust/tools/prepare-readonly-ci-rust" after

        '
    - name: Seal private source and index after maintained checks
      id: ci296_source_seal
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env: *id001
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"

        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"

        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
        1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"

        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"

        git diff --exit-code

        git diff --cached --exit-code

        df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"

        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"

        '
    - name: Retain private job ownership and source evidence
