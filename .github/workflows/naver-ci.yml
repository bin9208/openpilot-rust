name: Naver CI
'on':
  push:
    branches: [codex/naver-support-20260924, codex/naver-*]
    paths: [.github/workflows/naver-*.yml, tools/naver_ci/**, tools/naver_map_patch/**, openpilot/selfdrive/carrot/**, openpilot/selfdrive/ui/**, openpilot/cereal/**, docs/naver/**]
  pull_request:
    branches: [codex/naver-support-20260924]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: naver-ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  navigation-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - &id001
        name: Common owned job temporary paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        env:
          CI296_HOST_CONTROL: '1'
      - &id002
        name: Allocate private source cache target and local action alias before checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          job=$CI_JOB_TEMP
          owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$(cat "$job/owner")" = "$owner"
          umask 077
          mkdir "$job/proof" "$job/home" "$job/cache"
          # Source capacity is checked on the actual source filesystem BEFORE checkout.
          available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          required=$((2 * 1024 * 1024 * 1024))
          printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
          ((available >= required))
          source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          printf '%s\n' "$owner" > "$source_owner/.ci296-owner"
          mkdir "$source_owner/source"
          source="$source_owner/source"
          # Preserve Actions' real workspace separately. Only Bash consumers see the
          # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
          printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/ci296-shell-env"
          printf '%s\n' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env" >> "$GITHUB_ENV"
          printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
          df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
          cat /proc/meminfo > "$job/proof/memory-before.txt"
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
          printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"

          alias_path="$workspace/$CI296_ALIAS_BASENAME"
          case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac
          [[ $CI296_ALIAS_BASENAME != */* ]]
          # -T makes this an exclusive atomic link, never traversal into a stale directory.
          ln -sT -- "$source_owner" "$alias_path"
          printf '%s\n' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c '%d:%i' -- "$alias_path")" "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"
          printf 'source_alias=%s\nalias_identity=%s\n' "$alias_path" "$(stat -c '%d:%i' -- "$alias_path")" >> "$job/proof/ownership.txt"
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - &id003
        name: Admit exact private source and index
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          test "$PWD" = "$CI296_SOURCE"
          test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
      - &id004
        name: Expose provisioned Rust shims
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        env:
          CI296_HOST_CONTROL: '1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Rendered web owner and reduction labels
        working-directory: ${{ env.CI296_SOURCE }}/openpilot/selfdrive/carrot/web
        run: node --test tests/hud_data_bridge.test.mjs tests/hud_render.test.mjs tests/naver_mini_hud.test.mjs
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Shipped browser bundles match source
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()) }}
        working-directory: ${{ env.CI296_SOURCE }}/openpilot/selfdrive/carrot/web
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- js/generated css/generated generated/asset-manifest.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - &id009
        name: Keep original Python installations private
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          ((available >= 512 * 1024 * 1024))
          python -m venv "$CI_JOB_TEMP/venv"
          printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pytest==9.0.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Native HUD regression
        run: python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/ui/tests -q openpilot/selfdrive/ui/tests/test_carrot_hud_renderer.py openpilot/selfdrive/ui/tests/test_navigation_status.py
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - &id005
        name: Seal private source and index after maintained checks
        id: ci296_source_seal
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI296_SOURCE != '') }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
          cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
          cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
          git diff --exit-code
          git diff --cached --exit-code
          df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
          cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
      - &id006
        name: Retain private job ownership and source evidence
        id: ci296_private_evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: private-naver-ci-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_JOB_TEMP }}/proof
          retention-days: 14
          if-no-files-found: error
      - &id007
        name: Clean only uploaded owned source alias and target
        id: ci296_source_cleanup
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_seal.outcome == 'success' && env.CI296_SOURCE_OWNER != '') }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI296_HOST_CONTROL: '1'
          UPLOAD_ID: ${{ steps.ci296_private_evidence.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.ci296_private_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
          [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
          workspace=$CI296_ACTIONS_WORKSPACE
          p=$CI296_SOURCE_OWNER
          case "$p" in "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
          test -d "$p" && test ! -L "$p"
          test "$(realpath -e -- "$p")" = "$p"
          test "$(stat -c '%u' -- "$p")" = "$(id -u)"
          test "$(stat -c '%d:%i' -- "$p")" = "$CI296_SOURCE_IDENTITY"
          test -f "$p/.ci296-owner" && test ! -L "$p/.ci296-owner"
          test "$(cat "$p/.ci296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$CI296_SOURCE" = "$p/source"
          test -d "$p/source" && test ! -L "$p/source"
          test "$(realpath -e -- "$p/source")" = "$p/source"
          alias_path="$CI296_ACTIONS_WORKSPACE/$CI296_ALIAS_BASENAME"
          test "$CI296_SOURCE_ALIAS" = "$alias_path"
          test -L "$alias_path"
          test "$(readlink -- "$alias_path")" = "$p"
          test "$(stat -c '%d:%i' -- "$alias_path")" = "$CI296_ALIAS_IDENTITY"
          rm -- "$alias_path"
          if ! rm -rf --one-file-system -- "$p"; then
            sudo -n rm -rf --one-file-system -- "$p"
          fi
      - &id008
        name: Clean common owned temporary paths after uploaded source
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_cleanup.outcome == 'success') }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        with:
          cleanup: 'true'
        env:
          CI296_HOST_CONTROL: '1'
    env:
      CI296_ALIAS_BASENAME: .ci296-source-naver-ci--navigation-ui
  phone-mapping-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - *id001
      - *id002
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id003
      - *id004
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Pure JVM mapping and runtime contract (not APK or device acceptance)
        run: mvn -B --no-transfer-progress -f tools/naver_ci/java/pom.xml test
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Java-produced bump envelope through strict C3 input
        run: python -m tools.naver_ci.check_bump_wire
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - *id005
      - *id006
      - *id007
      - *id008
    env:
      CI296_ALIAS_BASENAME: .ci296-source-naver-ci--phone-mapping-contract
  runtime-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - *id001
      - *id002
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id003
      - *id004
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id009
      - run: python -m pip install pytest==9.0.2 pycapnp==2.1.0 numpy==2.2.6 aiohttp==3.12.15 requests==2.32.5 psutil==7.0.0 pyzmq==27.0.2 setproctitle==1.3.7 zstandard==0.24.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Real controller and native wire runtime tests
        run: python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/naver_ci/controller_tests -q tools/naver_ci/controller_tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - *id005
      - *id006
      - *id007
      - *id008
    env:
      CI296_ALIAS_BASENAME: .ci296-source-naver-ci--runtime-controller
  wire-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - *id001
      - *id002
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id003
      - *id004
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id009
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: python -m pip install pytest==9.0.2 pycapnp==2.1.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - run: sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update -qq && sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" install -y capnproto libcapnp-dev
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - run: bash tools/naver_ci/build_wire_probe.sh
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Real Capnp and native/browser wire roundtrip
        run: python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/naver_ci/wire_tests -q tools/naver_ci/wire_tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - *id005
      - *id006
      - *id007
      - *id008
    env:
      CI296_ALIAS_BASENAME: .ci296-source-naver-ci--wire-schema
  naver-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - *id001
      - *id002
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id003
      - *id004
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id009
      - run: python -m pip install pytest==9.0.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Naver input regression
        run: |
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_naver_input_smoke.py \
            openpilot/selfdrive/carrot/tests/test_naver_navigation_protocol.py \
            openpilot/selfdrive/carrot/tests/test_navigation_sources.py \
            openpilot/selfdrive/carrot/tests/test_navigation_ingress.py \
            openpilot/selfdrive/carrot/tests/test_navigation_runtime.py
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - *id005
      - *id006
      - *id007
      - *id008
    env:
      CI296_ALIAS_BASENAME: .ci296-source-naver-ci--naver-input
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CI296_ALIAS_BASENAME: .ci296-source-naver-ci--infrastructure
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - *id001
      - *id002
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - *id003
      - *id004
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Test synchronization guards
        run: |
          set -euo pipefail
          test "$RUSTUP_HOME" = "$CI_JOB_TEMP/rustup-home"
          test "$CARGO_HOME" = "$CI_JOB_TEMP/cargo-home"
          test -x "$(command -v rustup)"
          # 기존 guard의 private 1.94 설치를 실제 compiler 경로/버전으로 확인한다.
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          sdk="$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu"
          test "$(rustup which --toolchain 1.94.0 rustc)" = "$sdk/bin/rustc"
          "$sdk/bin/rustc" -vV > "$CI_JOB_TEMP/proof/private-rustc.txt"
          grep -Fx 'release: 1.94.0' "$CI_JOB_TEMP/proof/private-rustc.txt"
          grep -Fx 'host: x86_64-unknown-linux-gnu' "$CI_JOB_TEMP/proof/private-rustc.txt"
          cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test upstream_sync
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Check syntax of shared navigation entry points
        run: python -m py_compile openpilot/selfdrive/carrot/carrot_man.py openpilot/selfdrive/carrot/carrot_serv.py
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Summarize scope
        run: |
          echo 'Infrastructure and standalone Naver input checks. Controller, APK and device acceptance remain separate open issues.' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - *id005
      - *id006
      - *id007
      - *id008
