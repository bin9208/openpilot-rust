{
  "name": "296 immutable helper distribution caller loading only",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/ci-helper-distribution-296-once.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-helper-distribution-loading-296-${{ github.ref }}",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "jobs": {
    "caller-loading": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 10,
      "env": {
        "HELPER_SOURCE_COMMIT": "77663836a95a9e2aff9aa66592d8b06ed9c87cd9",
        "DISTRIBUTION_COMMIT": "b2fc62472ce8183114d59dbeec4d1406df44e4c2"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Deny fork source and require registered local runner",
          "shell": "bash",
          "env": {
            "SOURCE_ALLOWED": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
          },
          "run": "test \"${SOURCE_ALLOWED:-}\" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }\nset -euo pipefail\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$RUNNER_ENVIRONMENT\" = self-hosted\ntest \"$RUNNER_OS\" = Linux\ntest \"$RUNNER_ARCH\" = X64\n"
        },
        {
          "name": "Load distributed job-temp manifest",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Record distinct identities and prepare only sparse Git guard input",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "shell": "bash",
          "env": {
            "GIT_LFS_SKIP_SMUDGE": "1",
            "GIT_TERMINAL_PROMPT": "0"
          },
          "run": "set -euo pipefail\numask 077\ntest \"$DISTRIBUTION_COMMIT\" = b2fc62472ce8183114d59dbeec4d1406df44e4c2\ntest \"$HELPER_SOURCE_COMMIT\" = 77663836a95a9e2aff9aa66592d8b06ed9c87cd9\n[[ $GITHUB_SHA =~ ^[a-f0-9]{40}$ ]]\ntest \"$(cat \"$CI_JOB_TEMP/owner\")\" = \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\nmkdir \"$CI_JOB_TEMP/proof\"\nproof=\"$CI_JOB_TEMP/proof\"\nprintf '%s\\n' \"$HELPER_SOURCE_COMMIT\" > \"$proof/HELPER_SOURCE_COMMIT\"\nprintf '%s\\n' \"$DISTRIBUTION_COMMIT\" > \"$proof/DISTRIBUTION_COMMIT\"\nprintf '%s\\n' \"$GITHUB_SHA\" > \"$proof/WORKFLOW_COMMIT\"\nprintf '%s\\n' \"$RUNNER_NAME\" \"$RUNNER_ENVIRONMENT\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" > \"$proof/runner.txt\"\n# Readiness checks only: do not run cargo/rustup or permit the restore branch.\nif command -v rustup >/dev/null 2>&1; then\n  rust_bin=$(dirname \"$(command -v rustup)\")\nelse\n  rust_bin=\"${CARGO_HOME:-$HOME/.cargo}/bin\"\nfi\ntest -x \"$rust_bin/rustup\" && test -x \"$rust_bin/cargo\"\nprintf '%s\\n' \"$rust_bin/rustup\" \"$rust_bin/cargo\" > \"$proof/provisioned-shim-paths.txt\"\n# Only a real sparse source checkout satisfies the helper's unchanged HEAD guard.\n# Source and workflow must match for this interface; neither is the bundle SHA.\navailable=$(df -PB1 \"$CI_JOB_TEMP\" | awk 'NR == 2 {print $4}')\n[[ $available =~ ^[0-9]+$ ]]\nrequired=$((2 * 1024 * 1024 * 1024))\nprintf '{\"available_bytes\":%s,\"estimated_sparse_git_growth_bytes\":%s}\\n' \"$available\" \"$required\" > \"$proof/growth.json\"\n((available >= required))\nsource_dir=\"$CI_JOB_TEMP/runtime-source\"\ngit init \"$source_dir\" > \"$proof/source-fetch.log\" 2>&1\ngit -C \"$source_dir\" config core.sparseCheckout true\nprintf '/tools/ci/local-arm\\n' > \"$source_dir/.git/info/sparse-checkout\"\ngit -C \"$source_dir\" remote add origin https://github.com/bin9208/openpilot-rust.git\ngit -C \"$source_dir\" config remote.origin.promisor true\ngit -C \"$source_dir\" config remote.origin.partialclonefilter blob:none\n/usr/bin/timeout 180s git -C \"$source_dir\" fetch --depth=1 --filter=blob:none origin \"$GITHUB_SHA\" >> \"$proof/source-fetch.log\" 2>&1\ngit -C \"$source_dir\" checkout --detach FETCH_HEAD >> \"$proof/source-fetch.log\" 2>&1\ntest \"$(git -C \"$source_dir\" rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest -f \"$source_dir/tools/ci/local-arm\" && test ! -L \"$source_dir/tools/ci/local-arm\"\ntest -x \"$source_dir/tools/ci/local-arm\"\nprintf '%s  %s\\n' 1c69c096fa890b478a5b157aba021ba412ff0106e9e31b4b0b840f30f618c090 \"$source_dir/tools/ci/local-arm\" > \"$proof/runtime-helper.sha256\"\nsha256sum --strict --check \"$proof/runtime-helper.sha256\"\nprintf '%s\\n' \"$GITHUB_SHA\" > \"$proof/RUNTIME_SOURCE_COMMIT\"\nprintf '%s\\n' \"PROBE_SOURCE=$source_dir\" >> \"$GITHUB_ENV\"\ncat > \"$proof/expected-canonical-helper-pins.json\" <<'PINS'\n{\n  \"helper_source_commit\": \"77663836a95a9e2aff9aa66592d8b06ed9c87cd9\",\n  \"distribution_commit\": \"b2fc62472ce8183114d59dbeec4d1406df44e4c2\",\n  \"basis\": \"Source/tree review and parent REMOTE-ARCHIVE-ADMISSION.json; not a repeated archive audit\",\n  \"parent_archive_sha256\": \"6c214787a74a2998283f6dfbf22895b637c40ec128001d91ee8469a517c5c72b\",\n  \"files\": {\n    \".github/actions/job-temp/action.yml\": {\n      \"sha256\": \"d03bca53cd15a4fa57bcff731798054ca4a92253c6ca0b94315bb8b6eb053a94\",\n      \"mode\": \"100644\"\n    },\n    \".github/actions/rust-path/action.yml\": {\n      \"sha256\": \"cded6237e2f0a0bb4433d78b3c83918a42cc7319bc22e79350c1a1abb0a86fba\",\n      \"mode\": \"100644\"\n    },\n    \".github/actions/local-arm/action.yml\": {\n      \"sha256\": \"70b18b56a4abe6c5dd0327edbf4c5409900e37c3840f67b5b9e763cbb20532a1\",\n      \"mode\": \"100644\"\n    },\n    \"tools/ci/local-arm\": {\n      \"sha256\": \"1c69c096fa890b478a5b157aba021ba412ff0106e9e31b4b0b840f30f618c090\",\n      \"mode\": \"100755\"\n    }\n  }\n}\nPINS\n"
        },
        {
          "name": "Load distributed rust-path with already provisioned shims",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Load distributed local-arm relative script through finish entry only",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/local-arm@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "true"
          },
          "env": {
            "LOCAL_CI_ARCH": "x86_64",
            "LOCAL_CI_SOURCE_ROOT": "${{ env.PROBE_SOURCE }}"
          }
        },
        {
          "name": "Record new caller-loading scope and final held source hash",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "shell": "bash",
          "run": "set -euo pipefail\nproof=\"$CI_JOB_TEMP/proof\"\ntest \"$(git -C \"$PROBE_SOURCE\" rev-parse HEAD)\" = \"$GITHUB_SHA\"\nsha256sum --strict --check \"$proof/runtime-helper.sha256\"\ntest ! -e \"$CI_JOB_TEMP/local-arm/execution.json\"\nprintf '{\"helper_source_commit\":\"%s\",\"distribution_commit\":\"%s\",\"workflow_commit\":\"%s\",\"runtime_source_commit\":\"%s\",\"scope\":\"new remote caller loading; provisioned-shim path only; local-arm finish entry only\",\"arm_guest_started\":false,\"physical_arm_cpu\":false,\"foundation_corpora_reexecuted\":false,\"runtime_or_fast_suites_reexecuted\":false}\\n' \"$HELPER_SOURCE_COMMIT\" \"$DISTRIBUTION_COMMIT\" \"$GITHUB_SHA\" \"$(git -C \"$PROBE_SOURCE\" rev-parse HEAD)\" > \"$proof/caller-loading.json\"\nfor path in \"$proof\"/*; do\n  [[ $path == \"$proof/content.sha256\" ]] && continue\n  test -f \"$path\" && sha256sum \"$path\"\ndone > \"$proof/content.sha256\"\n"
        },
        {
          "name": "Retain bounded caller-loading evidence",
          "id": "evidence",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "ci-helper-distribution-loading-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CI_JOB_TEMP }}/proof",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Clean only uploaded common-owned probe output",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (success() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '') }}",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  }
}
