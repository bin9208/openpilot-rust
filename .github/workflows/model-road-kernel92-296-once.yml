name: 296 road first-frame unchanged kernel92 diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-road-kernel92-296-once.yml
permissions:
  contents: read
jobs:
  driver-first-kernel-diagnostic:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample:
        - 0
        - 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: 4d599dde6ec461cc43089d6f87381631aabdee6c
      DIAGNOSTIC_SAMPLE: ${{ matrix.sample }}
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      CPU_COUNT: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DIAGNOSTIC_ATTEMPT: 20261022-road-kernel92-01
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 4d599dde6ec461cc43089d6f87381631aabdee6c
        persist-credentials: false
    - name: Record naturally allocated CPU before expensive dependencies
      id: cpu
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-kernel92-296\"\nmkdir \"$proof\"\nlscpu --json > \"$proof/early-cpu.json\"\
        \ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nif grep\
        \ -q 'AMD EPYC 7763 64-Core Processor' /proc/cpuinfo; then\n printf 'eligible=true\n' >> \"$GITHUB_OUTPUT\"\nelse\n\
        \ printf 'eligible=false\n' >> \"$GITHUB_OUTPUT\"\n printf '%s\n' '{\"result\":\"SKIPPED_NOT_RECORDED_EPYC7763\",\"\
        comparison_executed\":false,\"diagnostic_only\":true,\"retirement_acceptance\":false}' > \"$proof/skip.json\"\nfi\n"
    - name: Reserve hosted capacity and install bounded native prerequisites
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 12288

        mkdir -p "$RUNNER_TEMP/model-road-kernel92-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev
        libzmq3-dev jq

        rustup toolchain install 1.94.0 --profile minimal

        '
      if: steps.cpu.outputs.eligible == 'true'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
      if: steps.cpu.outputs.eligible == 'true'
    - name: Install original model execution dependencies
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-kernel92-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        python -m pip freeze > "$proof/providers.before.txt"

        '
      if: steps.cpu.outputs.eligible == 'true'
    - name: Build bounded fixture stager and model-run only
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-kernel92-296"

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run > "$proof/model-run-build.log"
        2>&1

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driving-daemon-native --bin
        stage-driving-daemon-fixture > "$proof/stager-build.log" 2>&1

        '
      if: steps.cpu.outputs.eligible == 'true'
    - name: Record actual hosted CPU and Rust toolchain profile
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-kernel92-296"

        lscpu --json > "$proof/cpu-profile.json"

        cat /proc/cpuinfo > "$proof/proc-cpuinfo.txt"

        rustc -vV > "$proof/rustc-version.txt"

        uname -a > "$proof/uname.txt"

        '
      if: steps.cpu.outputs.eligible == 'true'
    - name: Stage immutable independent road fixture and exact failed catalog
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-kernel92-296\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 4096\nlscpu --json > \"$proof/actual-cpu.json\"\n# This is profile matching,\
        \ not CPU/ISA forcing. Other natural hosts skip cheaply.\nif ! grep -q 'AMD EPYC 7763 64-Core Processor' /proc/cpuinfo;\
        \ then\n  printf '%s\\n' '{\"result\":\"SKIPPED_NOT_RECORDED_EPYC7763\",\"comparison_executed\":false,\"diagnostic_only\"\
        :true,\"retirement_acceptance\":false}' > \"$proof/skip.json\"\n  exit 0\nfi\nrust/target/debug/stage-driving-daemon-fixture\
        \ --archive \"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz\"\
        \ --output \"$proof/fixture\" --blob-sha256 3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe --blob-bytes\
        \ 59663776 --compact-images > \"$proof/stage.json\"\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12399112257/zip\
        \ > \"$proof/input.zip\"\ntest \"$(stat -c %s \"$proof/input.zip\")\" -eq 173294568\nprintf '37843eb3defbf2a37737769c494e8351f4c7051dc84c28cf70306f74c0939e62\
        \  %s/input.zip\\n' \"$proof\" | sha256sum --check --strict\npython - <<'EXTRACT'\nimport os,zipfile,stat\nfrom pathlib\
        \ import Path\np=Path(os.environ['RUNNER_TEMP'])/'model-road-kernel92-296';dest=p/'artifact';dest.mkdir();total=0\n\
        with zipfile.ZipFile(p/'input.zip') as z:\n assert len(z.infolist())==691\n assert z.testzip() is None\n for i in\
        \ z.infolist():\n  name=Path(i.filename)\n  assert not name.is_absolute() and '..' not in name.parts\n  if not (i.filename.endswith('/current-host-catalog-receipt.json')\
        \ or '/driving-1344x760/' in i.filename):continue\n  assert not i.is_dir() and stat.S_IFMT(i.external_attr>>16) in\
        \ (0,stat.S_IFREG)\n  assert i.file_size<=64*1024*1024\n  total+=i.file_size;assert total<=96*1024*1024\n  out=dest/name;out.parent.mkdir(parents=True,exist_ok=True)\n\
        \  with out.open('xb') as f:f.write(z.read(i))\nEXTRACT\n"
      env:
        GH_TOKEN: ${{ github.token }}
      if: steps.cpu.outputs.eligible == 'true'
    - name: Observe unchanged first road frame and final kernel92 boundary
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-kernel92-296\"\nif test -f \"$proof/skip.json\"; then exit\
        \ 0; fi\ncat > \"$proof/fp-observe.c\" <<'C'\n#include <fenv.h>\n#include <stdint.h>\n\n/* Hosted x86-64 observation\
        \ only. Never changes the floating-point environment. */\nuint32_t diagnostic_mxcsr(void) {\n  uint32_t value;\n \
        \ __asm__ volatile(\"stmxcsr %0\" : \"=m\"(value));\n  return value;\n}\n\nint diagnostic_round(void) { return fegetround();\
        \ }\nC\ncc -shared -fPIC -O0 -o \"$proof/fp-observe.so\" \"$proof/fp-observe.c\" -lm\nsha256sum \"$proof/fp-observe.c\"\
        \ \"$proof/fp-observe.so\" > \"$proof/fp-observe.sha256\"\nbase64 --decode <<'ROAD_PROBE' > \"$proof/diagnose.py\"\
        \\n\
        ROAD_PROBE\nprintf '512593b4c8623a7e662891218d59ee3cb42c8d2117d9af71ef2f97f96cc9cf08  %s/diagnose.py\\n' \"$proof\"\
        \ | sha256sum --check --strict\nexport MODEL_RUN=\"$GITHUB_WORKSPACE/rust/target/debug/model-run\"\nset +e\ntimeout\
        \ --signal=TERM --kill-after=5s 300s python \"$proof/diagnose.py\" > \"$proof/diagnose.stdout\" 2> \"$proof/diagnose.stderr\"\
        \nrc=$?\nset -e\nprintf '%s\\n' \"$rc\" > \"$proof/diagnose.status\"\npython -m pip freeze > \"$proof/providers.after.txt\"\
        \ncmp \"$proof/providers.before.txt\" \"$proof/providers.after.txt\"\ntest \"$rc\" -eq 0 || { tail -n 60 \"$proof/diagnose.stderr\"\
        ; exit \"$rc\"; }\n"
      if: steps.cpu.outputs.eligible == 'true'
    - name: Preserve bounded diagnostic and all input/output evidence
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-road-kernel92-296-${{ matrix.sample }}
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
        path: '${{ runner.temp }}/model-road-kernel92-296/

          !${{ runner.temp }}/model-road-kernel92-296/fixture/**

          !${{ runner.temp }}/model-road-kernel92-296/artifact/**

          !${{ runner.temp }}/model-road-kernel92-296/input.zip

          '
