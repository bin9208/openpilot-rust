name: 296 independent original Panda CAN-I/O native retirement candidate
permissions:
  contents: read
  actions: read
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-can-io-retirement-once.yml
jobs:
  original-can-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 08f21d4aea8b1be4c59925e2b67a302eda4db623
        persist-credentials: false
    - name: Reserve disk and prepare minimal device compiler inputs
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 08f21d4aea8b1be4c59925e2b67a302eda4db623

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ libusb-1.0-0-dev pkg-config

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Borrow and seal unchanged original C++ protocol ELF
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 3072\n\
        mkdir -p \"$RUNNER_TEMP/panda-can-io-borrowed\"\ncd \"$RUNNER_TEMP/panda-can-io-borrowed\"\ncurl -fLsS --retry 3 --retry-delay\
        \ 5 \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H 'Accept: application/vnd.github+json' \\\n  'https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12358686227/zip'\
        \ \\\n  -o original-private.zip\nprintf '%s  %s\\n' 1dffb8ea17d36f68e02b3c59736effbf9667d6225fb13e35eec833f140f321cc\
        \ original-private.zip | sha256sum -c -\nunzip -p original-private.zip retirement/checkout-output/can-io-src/pandad-protocol-source\
        \ > pandad-protocol-source\nunzip -p original-private.zip retirement/checkout-output/can-io-src/manifest.json > manifest.json\n\
        chmod 755 pandad-protocol-source\nprintf '%s  %s\\n' fadf6c458826866584eb66d5cb19794a36aede895d5bbb3f588d2368fecd9ffc\
        \ pandad-protocol-source | sha256sum -c -\n"
    - name: Build only the current native protocol example
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\ncargo build --manifest-path rust/Cargo.toml -p openpilot-pandad --example can_io --locked \\\n > \"$RUNNER_TEMP/panda-can-io-borrowed/native-build.stdout\"\
        \ \\\n 2> \"$RUNNER_TEMP/panda-can-io-borrowed/native-build.stderr\"\n"
    - name: Capture original CAN-I/O requests responses and admissions
      env:
        PANDAD_CAN_IO_CAPTURE: ${{ runner.temp }}/panda-can-io-original
        PANDAD_CAN_IO_SOURCE_BINARY: ${{ runner.temp }}/panda-can-io-borrowed/pandad-protocol-source
        PANDAD_CAN_IO_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/can_io
        PANDAD_CAN_IO_SOURCE_MANIFEST: ${{ runner.temp }}/panda-can-io-borrowed/manifest.json
        PANDAD_CAN_IO_BORROWED_ZIP: ${{ runner.temp }}/panda-can-io-borrowed/original-private.zip
      run: 'set -euo pipefail

        export PANDAD_CAN_IO_SOURCE_COMMIT="$(git rev-parse HEAD)"

        printf %s ''''
        | base64 -d > "$RUNNER_TEMP/capture-original-can-io.py"

        printf ''%s  %s\n'' 75c1c9213431dd01ca0923715c6a19387d720399f4128ac79d3663d29341f018 "$RUNNER_TEMP/capture-original-can-io.py"
        | sha256sum -c -

        PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/capture-original-can-io.py"

        '
    - name: Bind independent original capture for native protocol comparison
      run: "set -euo pipefail\ncapture=\"$RUNNER_TEMP/panda-can-io-original\"\nmanifest_sha=$(sha256sum \"$capture/capture-manifest.json\"\
        \ | cut -d ' ' -f 1)\nmkdir -p \"$RUNNER_TEMP/panda-can-io-retirement\"\n{\n echo \"PANDAD_CAN_IO_ORIGINAL_CAPTURE=$capture\"\
        \n echo \"PANDAD_CAN_IO_CAPTURE_MANIFEST_SHA256=$manifest_sha\"\n echo \"PANDAD_CAN_IO_CAPTURE_SOURCE_COMMIT=$(git\
        \ rev-parse HEAD)\"\n echo \"PANDAD_CAN_IO_TEST_OUTPUT=$RUNNER_TEMP/panda-can-io-retirement\"\n} >> \"$GITHUB_ENV\"\
        \n"
    - name: Cloud native protocol controller controls and full independent original parity
      env:
        PANDAD_CAN_IO_RETIREMENT_MODE: predelete
        PANDAD_CAN_IO_SOURCE_BINARY: ${{ runner.temp }}/panda-can-io-borrowed/pandad-protocol-source
        PANDAD_CAN_IO_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/can_io
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 8192\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-can-io-native --test pandad_can_io_check\
        \ --test pandad_can_io_reference --locked \\\n > \"$RUNNER_TEMP/panda-can-io-retirement/native-tests.stdout\" \\\n\
        \ 2> \"$RUNNER_TEMP/panda-can-io-retirement/native-tests.stderr\"\ncargo clippy --manifest-path rust/Cargo.toml -p\
        \ openpilot-dev-tools --features pandad-can-io-native --lib --bin check-pandad-can-io --test pandad_can_io_check --test\
        \ pandad_can_io_reference --locked -- -D warnings \\\n > \"$RUNNER_TEMP/panda-can-io-retirement/native-clippy.stdout\"\
        \ \\\n 2> \"$RUNNER_TEMP/panda-can-io-retirement/native-clippy.stderr\"\n"
    - name: Preserve independent original and native protocol evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-can-io-original-and-native
        path: '${{ runner.temp }}/panda-can-io-original/

          ${{ runner.temp }}/panda-can-io-retirement/

          ${{ runner.temp }}/panda-can-io-borrowed/manifest.json

          ${{ runner.temp }}/panda-can-io-borrowed/native-build.stdout

          ${{ runner.temp }}/panda-can-io-borrowed/native-build.stderr

          '
        if-no-files-found: warn
        retention-days: 7
