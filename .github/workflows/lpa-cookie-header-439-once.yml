name: 296 LPA cookie header optimization 439
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/lpa-cookie-header-439-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  lpa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f903d9765c2f13e8b5ed24a0c4fad7256bb115ac
        persist-credentials: false
    - name: Require exact LPA source
      run: 'test "$(git rev-parse HEAD)" = f903d9765c2f13e8b5ed24a0c4fad7256bb115ac

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Prepare original LPA TLS prerequisites
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update && sudo apt-get install -y g++ capnproto libcapnp-dev openssl

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 zstandard==0.25.0 requests==2.34.2 pyserial==3.5

        '
    - name: Build current LPA and process owner
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-lpa -p openpilot-process-supervision --bins --examples --locked

        '
    - name: Compare unchanged original complete LPA lifecycle
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        python rust/tools/check_lpa.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/startup-services/lpa"

        '
    - name: Require LPA cookie header byte parity and allocation reduction
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/startup-services/lpa-cookie-header"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        sha256sum rust/crates/lpa/src/http.rs rust/crates/lpa/src/http/cookies.rs rust/tools/lpa_cookie_header_allocation_probe.rs
        > "$proof/source.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-lpa --all-targets --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        rustc --edition=2021 -O -D warnings rust/tools/lpa_cookie_header_allocation_probe.rs -o "$proof/lpa-cookie-header-allocation-probe"

        sha256sum "$proof/lpa-cookie-header-allocation-probe" > "$proof/binary.sha256"

        "$proof/lpa-cookie-header-allocation-probe" --require-improvement | tee "$proof/measurement.jsonl"

        sha256sum -c "$proof/source.sha256"

        sha256sum -c "$proof/binary.sha256"

        '
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: lpa-cookie-allocation-and-original-lifecycle-evidence
        path: ${{ runner.temp }}/startup-services/
        if-no-files-found: warn
