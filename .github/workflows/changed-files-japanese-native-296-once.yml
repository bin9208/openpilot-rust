    - name: Bind current source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        export JAPANESE_BASE="$RUNNER_TEMP/changed-files-japanese-native-296"

        printf ''JAPANESE_BASE=%s\n'' "$JAPANESE_BASE" >> "$GITHUB_ENV"

        printf ''JAPANESE_ORIGINAL_DIR=%s/original\n'' "$JAPANESE_BASE" >> "$GITHUB_ENV"

        printf ''JAPANESE_NATIVE_OUTPUT=%s/actual\n'' "$JAPANESE_BASE" >> "$GITHUB_ENV"

        mkdir "$JAPANESE_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$JAPANESE_BASE/source.txt"

        git status --porcelain=v1 > "$JAPANESE_BASE/source-status.before.txt"

        test ! -s "$JAPANESE_BASE/source-status.before.txt"

        sha256sum rust/Cargo.lock > "$JAPANESE_BASE/lock.before.sha256"

        printf ''EXPECTED_LOCK_SHA256=%s\n'' "$(cut -d '' '' -f1 "$JAPANESE_BASE/lock.before.sha256")" >> "$GITHUB_ENV"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$JAPANESE_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 > "$JAPANESE_BASE/native-packages.txt"

        '
