name: 296 native Japanese original codec domains
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-japanese-native-296-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: changed-files-japanese-native-296
  cancel-in-progress: false
