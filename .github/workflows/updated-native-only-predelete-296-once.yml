name: 296 updater native-only predelete observation and trace inventory
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-check-296-once.yml
permissions:
  contents: read
jobs:
  updater-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: 4493b9a50ff42965d30b0c46d131dbc5297f0f56
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 4493b9a50ff42965d30b0c46d131dbc5297f0f56
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Pin checkout and install genuine original prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/updated-check-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/source-commit.txt"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - uses: ./.github/actions/native-json11
    - name: Build one candidate and unchanged original Params binding
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-check-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-updated --example updated_trace --locked 2>&1 | tee
        "$proof/native-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child
        --locked 2>&1 | tee "$proof/launcher-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --bin
        check-updated --bin updated-fixture --locked 2>&1 | tee "$proof/checker-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$proof/params-binding" > "$proof/binding-build.stdout"
        2> "$proof/binding-build.stderr"

        shopt -s nullglob

        binding=("$proof"/params-binding/params_pyx*.so)

        test "${#binding[@]}" -eq 1

        printf ''UPDATED_CHECK_BINARY=%s/rust/target/debug/examples/updated_trace\nUPDATED_CHECK_LAUNCHER=%s/rust/target/debug/openpilot-process-child\nUPDATED_CHECK_SHIM=%s/rust/target/debug/updated-fixture\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''UPDATED_CHECK_PYTHON=%s\nUPDATED_CHECK_BINDING=%s\n'' "$(command -v python)" "${binding[0]}" >> "$GITHUB_ENV"

        printf ''UPDATED_CHECK_OUTPUT=%s/native-test\nUPDATED_CHECK_CLI_OUTPUT=%s/cli\nUPDATED_CHECK_ABSENCE_EVIDENCE=%s/absence\n''
        "$proof" "$proof" "$proof" >> "$GITHUB_ENV"

        sha256sum rust/tools/check_updated.py rust/tools/updated_source.py rust/tools/updated_fixtures.py rust/tools/original_params_binding.py
        openpilot/system/updated/updated.py openpilot/system/updated/process.py openpilot/common/markdown.py openpilot/selfdrive/selfdrived/alerts_offroad.json
        > "$proof/source-inputs.sha256"

        sha256sum rust/target/debug/check-updated rust/target/debug/updated-fixture rust/target/debug/examples/updated_trace
        rust/target/debug/openpilot-process-child /usr/bin/strace "${binding[0]}" "$(command -v python)" > "$proof/executables.sha256"

        '
    - name: Run unchanged original first, then native-only controller
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/updated-check-296\"\ntest -f rust/tools/check_updated.py\ntest -f rust/tools/updated_source.py\n\
        rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 512\n\"$UPDATED_CHECK_PYTHON\" rust/tools/check_updated.py\
        \ --binary \"$UPDATED_CHECK_BINARY\" --launcher \"$UPDATED_CHECK_LAUNCHER\" --binding \"$UPDATED_CHECK_BINDING\" --output\
        \ \"$proof/original-controller\" > \"$proof/original-controller.stdout\" 2> \"$proof/original-controller.stderr\"\n\
        rust/target/debug/check-updated --binary \"$UPDATED_CHECK_BINARY\" --launcher \"$UPDATED_CHECK_LAUNCHER\" --output\
        \ \"$proof/native-controller\" > \"$proof/native-controller.stdout\" 2> \"$proof/native-controller.stderr\"\npython\
        \ - <<'PY'\nimport hashlib, json, os\nfrom pathlib import Path\nproof=Path(os.environ['RUNNER_TEMP'])/'updated-check-296'\n\
        fixtures=Path('rust/crates/dev-tools/tests/fixtures/updated-original-df0128aa')\noriginal=proof/'original-controller'\n\
        native=proof/'native-controller'\nsource=json.loads((original/'result.json').read_text())\nresult=json.loads((native/'result.json').read_text())\n\
        names=['check-fetch-metered','missing-branch-failure','tizi-branch-map-agnos-same-version','agnos-model-manifest-boundary','connectivity-thresholds']\n\
        digests=['051f172d2934a3f245736f48df1139f8cb108197e4b430cdf8cbc13ce251437d','2ac87b6b182010fc835b22f1a00a4114fd512ee9c05ca3cd2aa147d350b2ee42','59532593affbe4e2ffae3449164c78b36a51e4ab2273bead306f7262d0a1e85f','216cbde9a519bafab097714e7a4b8efd63f0a73a4a28ef3525508e832bfb71ce','ced55dbb2f37b9f381925466fcd0b1b169806002e81c7d43bca30a3ed5a82c40']\n\
        assert source['passed'] is result['passed'] is True\nassert result['original_observation']=='sealed_df0128aa_capture'\n\
        assert source['scenarios']==result['scenarios'] and [row['scenario'] for row in source['scenarios']]==names\nfor name,digest\
        \ in zip(names,digests,strict=True):\n    fixture=(fixtures/f'{name}.json').read_bytes()\n    assert hashlib.sha256(fixture).hexdigest()==digest,name\n\
        \    assert json.loads((original/f'{name}-source.json').read_bytes())==json.loads(fixture),name+' original source'\n\
        \    assert json.loads((original/f'{name}-native.json').read_bytes())==json.loads((native/f'{name}-native.json').read_bytes()),name+'\
        \ native'\n(proof/'independent-controller-comparison.json').write_text(json.dumps({'passed':True,'original_source_vs_sealed':names,'fresh_native_vs_original_cli_native':names,'scenario_counts':source['scenarios']},indent=2)+'\\\
        n')\nPY\nsha256sum --check \"$proof/source-inputs.sha256\"\nsha256sum --check \"$proof/executables.sha256\"\n"
    - name: Run complete leaf suite and retain unclassified first exec traces
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-check-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --test
        updated_check --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --lib
        --bin check-updated --bin updated-fixture --test updated_check --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        test -s "$proof/absence/checkout.exec"

        test -s "$proof/absence/absent.exec"

        test -f "$proof/absence/checkout-output/result.json"

        test -f "$proof/absence/absent-output/result.json"

        sha256sum --check "$proof/source-inputs.sha256"

        sha256sum --check "$proof/executables.sha256"

        '
    - name: Retain complete original/native outputs and first exec inventory
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: updated-native-only-predelete-296-${{ github.sha }}
        path: ${{ runner.temp }}/updated-check-296/
        if-no-files-found: error
