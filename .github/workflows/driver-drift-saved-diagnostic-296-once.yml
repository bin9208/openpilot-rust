name: 296 driver drift saved-output diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driver-drift-saved-diagnostic-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  saved-driver-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE: d3355349353c1b004f319c4612620ce1ca588607
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: d3355349353c1b004f319c4612620ce1ca588607
        fetch-depth: 0
        persist-credentials: false
    - name: Bind reviewed diagnostic source and reserve separate build targets
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/driver-drift-296"

        mkdir "$proof"

        printf ''%s\n'' "$EXPECTED_SOURCE" > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        file=rust/crates/dev-tools/src/model_family_retirement_diagnostic.rs

        printf ''%s  %s\n'' e37915ce438ebdc6edcf55af4deed37664f001c77c84cfa543afed1f89eee898 "$file" | sha256sum -c -

        git show "3b997279f0ae16c25db9c4d9751e51ad1e017d5d:$file" > "$proof/baseline.rs"

        printf ''%s  %s\n'' 31d3638a2aca64e077170c828ff648bfe7c127623fffa7ca2ec9dd9306dfa875 "$proof/baseline.rs" | sha256sum
        -c -

        cp "$file" "$proof/candidate.rs"

        git ls-files -z rust .cargo | xargs -0 sha256sum > "$proof/source.before.sha256"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        available=$(df -PB1 "$RUNNER_TEMP" | awk ''NR==2 {print $4}'')

        test "$available" -ge $(( (25 + 12) * 1024 * 1024 * 1024 ))

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev liblzma-dev
        unzip

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        '
    - name: Admit exact failed job archive and six inert prediction files
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-drift-296\"\navailable=$(df -PB1 \"$RUNNER_TEMP\" | awk 'NR==2\
        \ {print $4}')\ntest \"$available\" -ge $(( (25 + 1) * 1024 * 1024 * 1024 ))\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12442755663\
        \ > \"$proof/artifact.json\"\njq -e '.id == 12442755663 and .expired == false and .workflow_run.id == 39809085536\
        \ and .digest == \"sha256:253ede933b808ff3e01659d85849ca9456c9513dd6659debe4731a03d2bfcdfb\"' \"$proof/artifact.json\"\
        \ngh api repos/bin9208/openpilot-rust/actions/artifacts/12442755663/zip > \"$proof/saved.zip\"\nprintf '%s  %s\\n'\
        \ 253ede933b808ff3e01659d85849ca9456c9513dd6659debe4731a03d2bfcdfb \"$proof/saved.zip\" | sha256sum -c -\nunzip -t\
        \ \"$proof/saved.zip\" > \"$proof/zip-crc.log\"\nmkdir \"$proof/predictions\"\nfor frame in warmup frame-0; do\n \
        \ for kind in original daemon model; do\n    suffix=raw\n    if test \"$kind\" = model; then suffix=bin; fi\n    unzip\
        \ -p \"$proof/saved.zip\" \"driver-first-frame-diagnostic/$frame-$kind.$suffix\" > \"$proof/predictions/$frame-$kind.raw\"\
        \n    test \"$(stat -c '%s' \"$proof/predictions/$frame-$kind.raw\")\" -eq 2212\n  done\ndone\nsha256sum \"$proof\"\
        /predictions/*.raw > \"$proof/predictions.before.sha256\"\nunzip -p \"$proof/saved.zip\" driver-first-frame-diagnostic/diagnostic.json\
        \ > \"$proof/original-diagnostic.json\"\nprintf 'DRIVER_DRIFT_SAVED_PREDICTIONS=%s\\n' \"$proof/predictions\" >> \"\
        $GITHUB_ENV\"\n"
    - name: RED prove new diagnostics reject the previous report shape
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-drift-296"

        file=rust/crates/dev-tools/src/model_family_retirement_diagnostic.rs

        trap ''cp "$proof/candidate.rs" "$file"'' EXIT

        # Only this diagnostic module is replaced temporarily in the hosted checkout.

        # Restore it even on a failed build; no runtime/guarded-add source changes.

        cat "$proof/baseline.rs" > "$file"

        sed -n ''/^#\[cfg(test)\]/,$p'' "$proof/candidate.rs" >> "$file"

        available=$(df -PB1 "$RUNNER_TEMP" | awk ''NR==2 {print $4}'')

        test "$available" -ge $(( (25 + 5) * 1024 * 1024 * 1024 ))

        set +e

        cargo test --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/driver-drift-red-target" --locked -p openpilot-dev-tools
        --features driver-daemon-native --test model_family_retirement diagnostic::drift_tests:: -- --nocapture > "$proof/red.log"
        2>&1

        status=$?

        set -e

        cat "$proof/red.log"

        test "$status" -eq 101

        grep -F ''test result: FAILED. 0 passed; 2 failed; 1 ignored;'' "$proof/red.log"

        grep -F ''left: Null'' "$proof/red.log"

        cp "$proof/candidate.rs" "$file"

        cmp "$proof/candidate.rs" "$file"

        '
    - name: GREEN run new diagnostic controls and authenticate saved nonzero drift
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-drift-296"

        file=rust/crates/dev-tools/src/model_family_retirement_diagnostic.rs

        cmp "$proof/candidate.rs" "$file"

        rustfmt --edition 2021 --config skip_children=true --check "$file"

        available=$(df -PB1 "$RUNNER_TEMP" | awk ''NR==2 {print $4}'')

        test "$available" -ge $(( (25 + 5) * 1024 * 1024 * 1024 ))

        cargo test --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/driver-drift-green-target" --locked -p openpilot-dev-tools
        --features driver-daemon-native --test model_family_retirement diagnostic::drift_tests:: -- --nocapture > "$proof/green.log"
        2>&1 || { cat "$proof/green.log"; exit 1; }

        grep -F ''test result: ok. 2 passed; 0 failed; 1 ignored;'' "$proof/green.log"

        cargo test --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/driver-drift-green-target" --locked -p openpilot-dev-tools
        --features driver-daemon-native --test model_family_retirement diagnostic::drift_tests::saved_job119931046645_has_nonzero_driver_drift
        -- --ignored --exact --nocapture > "$proof/saved-raw.log" 2>&1 || { cat "$proof/saved-raw.log"; exit 1; }

        grep -F ''test result: ok. 1 passed; 0 failed; 0 ignored;'' "$proof/saved-raw.log"

        cargo clippy --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/driver-drift-green-target" --locked -p openpilot-dev-tools
        --features driver-daemon-native --test model_family_retirement -- -D warnings > "$proof/clippy.log" 2>&1 || { cat
        "$proof/clippy.log"; exit 1; }

        printf ''%s\n'' ''diagnostic_reporting_only=true'' ''model_execution=false'' ''runtime_fix=false'' > "$proof/completed.txt"

        '
    - name: Require unchanged final source and saved input hashes
      if: always()
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-drift-296"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sha256sum -c "$proof/source.before.sha256" > "$proof/source.after.log"

        sha256sum -c "$proof/predictions.before.sha256" > "$proof/predictions.after.log"

        git diff --exit-code

        test -s "$proof/completed.txt"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-drift-saved-diagnostic-296
        retention-days: 7
        if-no-files-found: error
        path: '${{ runner.temp }}/driver-drift-296/*.log

          ${{ runner.temp }}/driver-drift-296/*.json

          ${{ runner.temp }}/driver-drift-296/*.sha256

          ${{ runner.temp }}/driver-drift-296/*.txt

          ${{ runner.temp }}/driver-drift-296/*COMMIT

          ${{ runner.temp }}/driver-drift-296/*.rs

          ${{ runner.temp }}/driver-drift-296/predictions/

          '
