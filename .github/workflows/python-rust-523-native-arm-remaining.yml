        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/ci296-shell-env"
        printf '%s\n' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"

        alias_path="$workspace/$CI296_ALIAS_BASENAME"
        case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac
        [[ $CI296_ALIAS_BASENAME != */* ]]
        # -T makes this an exclusive atomic link, never traversal into a stale directory.
        ln -sT -- "$source_owner" "$alias_path"
        printf '%s\n' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c '%d:%i' -- "$alias_path")" "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"
        printf 'source_alias=%s\nalias_identity=%s\n' "$alias_path" "$(stat -c '%d:%i' -- "$alias_path")" >> "$job/proof/ownership.txt"
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
        path: ${{ env.CI296_CHECKOUT_PATH }}
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Admit exact private source and index
      id: ci296_source_admission
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        test "$PWD" = "$CI296_SOURCE"
        test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Configure source-dependent job environment on private paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_LATE_PYTHONPATH: ${{ env.CI296_SOURCE }}:${{ env.CI296_SOURCE }}/opendbc_repo:${{ env.CI296_SOURCE }}/rust/tools
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        printf '%s\n' "PYTHONPATH=$CI296_LATE_PYTHONPATH" >> "$GITHUB_ENV"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env:
        CI296_HOST_CONTROL: '1'
    - name: Prepare native ARM command transport
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      env:
        CI296_HOST_CONTROL: '1'
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      run: |
        /usr/bin/bash "$CI296_SOURCE/tools/ci/native-arm" prepare
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Keep original Python installations private
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        python -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
    - name: Reserve capacity and install original oracle dependencies
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/radard-native/logs"
        git rev-parse HEAD > "$RUNNER_TEMP/radard-native/SOURCE_COMMIT"
        uname -m | tee "$RUNNER_TEMP/radard-native/machine.txt"
        test "$(uname -m)" = '${{ matrix.arch }}'
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
        sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update && sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" install -y capnproto libcapnp-dev g++ binutils libzmq3-dev
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.3.0 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2 pyzmq==27.2.0 requests==2.34.2 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1
        python -m pip freeze > "$RUNNER_TEMP/radard-native/python-packages.txt"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Build current native dependency stager
      uses: ./.ci296-source-rust--radard-runtime/source/.github/actions/native-json11
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        run-shell: openpilot-local-shell {0}
    - name: Build unchanged native Params and msgq bindings
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        python -P rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/radard-native/params" 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/params-build.log"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        python -P rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/radard-native/msgq" 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/msgq-build.log"
        "$CI_RECEIPT_METADATA" module RADARD_PARAMS_BINDING "$RUNNER_TEMP/radard-native/params/provenance.json" >> "$GITHUB_ENV"
        printf 'PYTHONPATH=%s/radard-native/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
        printf 'RADARD_BINARY=%s/rust/target/debug/openpilot-radard\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Require actual native imports and declared source helper imports
      run: |
        set -euo pipefail
        python -P - <<'PY' 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/imports.log"
        import importlib
        import os
        from pathlib import Path
        from card_runtime_source import load_binding
        load_binding(Path(os.environ['RADARD_PARAMS_BINDING']))
        for name in ('msgq.ipc_pyx', 'openpilot.common.params_pyx',
                     'radard_geometry_source', 'radard_selection_source', 'radard_primary_source',
                     'radard_trajectory_source', 'radard_cutout_predictor_source',
                     'radard_controller_source', 'radard_ipc', 'radard_lifecycle'):
            module = importlib.import_module(name)
            print(name, module.__file__)
        PY
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Require Rust types, tests, complete build and Clippy
      run: |
        set -euo pipefail
        cargo +1.94.0 fmt --manifest-path rust/Cargo.toml --package openpilot-radard -- --check 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/fmt.log"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-radard --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/tests.log"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-radard --bins --examples --locked 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/build.log"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-messaging --example state_probe --locked 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/state-probe-build.log"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-radard --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/radard-native/logs/clippy.log"
        if [ '${{ matrix.arch }}' = aarch64 ]; then
          readelf -h -d -V "$RADARD_BINARY" > "$RUNNER_TEMP/radard-native/daemon.readelf.txt"
          test "$(readelf -h "$RADARD_BINARY" | sed -n 's/.*Machine: *//p')" = AArch64
        fi
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compare existing source recordings and all Rust policy snapshots
      run: |
        set -euo pipefail
        set -x
        for radard_phase in geometry selection primary trajectory cutout_predictor controller; do
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          python -P "rust/tools/radard_${radard_phase}_source.py" \
            --binary "$GITHUB_WORKSPACE/rust/target/debug/examples/radard_${radard_phase}_trace" \
            --output "$RUNNER_TEMP/radard-native/source-$radard_phase" \
            2>&1 | tee "$RUNNER_TEMP/radard-native/logs/source-$radard_phase.log"
        done
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Check radard IPC preconditioning input contract
      run: python -P -m unittest discover -s rust/tools/tests -p test_radard_ipc_preconditioning.py -v
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compare exact availability deadline with original state
      run: |
        set -euo pipefail
        python -P rust/tools/radard_availability_state.py \
          --binary "$GITHUB_WORKSPACE/rust/target/debug/examples/state_probe" \
          --output "$RUNNER_TEMP/radard-native/source-availability-state" \
          2>&1 | tee "$RUNNER_TEMP/radard-native/logs/availability-state.log"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Compare independent actual IPC and signal lifecycle
      run: |
        set -euo pipefail
        set -x
        python -P rust/tools/radard_ipc.py --python "$(command -v python)" \
          --binary "$RADARD_BINARY" --binding "$RADARD_PARAMS_BINDING" \
          --output "$RUNNER_TEMP/radard-native/ipc" \
          2>&1 | tee "$RUNNER_TEMP/radard-native/logs/ipc.log"
        python -P rust/tools/radard_lifecycle.py --python "$(command -v python)" \
          --binary "$RADARD_BINARY" --binding "$RADARD_PARAMS_BINDING" \
          --output "$RUNNER_TEMP/radard-native/lifecycle" \
          2>&1 | tee "$RUNNER_TEMP/radard-native/logs/lifecycle.log"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Preserve bounded final binaries and their identities
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always()) }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 256
        mkdir -p "$RUNNER_TEMP/radard-native/bin"
        for radard_binary in rust/target/debug/openpilot-radard rust/target/debug/examples/radard_*_trace rust/target/debug/examples/state_probe; do
          if [ -f "$radard_binary" ]; then
            cp "$radard_binary" "$RUNNER_TEMP/radard-native/bin/"
            sha256sum "$radard_binary" >> "$RUNNER_TEMP/radard-native/SHA256SUMS"
          fi
        done
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - uses: actions/upload-artifact@v6
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always()) }}
      with:
        name: rust-radard-${{ matrix.runner }}-not-device-validated
        path: |
          ${{ env.CI_JOB_TEMP }}/radard-native/logs/
          ${{ env.CI_JOB_TEMP }}/radard-native/source-*/
          ${{ env.CI_JOB_TEMP }}/radard-native/ipc/
          ${{ env.CI_JOB_TEMP }}/radard-native/lifecycle/
          ${{ env.CI_JOB_TEMP }}/radard-native/bin/
          ${{ env.CI_JOB_TEMP }}/radard-native/*.txt
          ${{ env.CI_JOB_TEMP }}/radard-native/SOURCE_COMMIT
          ${{ env.CI_JOB_TEMP }}/radard-native/SHA256SUMS
          ${{ env.CI_JOB_TEMP }}/radard-native/params/*.json
          ${{ env.CI_JOB_TEMP }}/radard-native/params/*.so
          ${{ env.CI_JOB_TEMP }}/radard-native/msgq/msgq/*.so

          ${{ env.CI_JOB_TEMP }}/local-arm/execution.json
          ${{ env.CI_JOB_TEMP }}/local-arm/kernel.txt
          ${{ env.CI_JOB_TEMP }}/local-arm/disk-before.txt
        if-no-files-found: warn
      id: local_evidence_1
    - name: Finish native ARM execution evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.ci296_source_admission.outcome == 'success') }}
      env:
        CI296_HOST_CONTROL: '1'
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      run: |
        /usr/bin/bash "$CI296_SOURCE/tools/ci/native-arm" finish
    - name: Seal private source and index after maintained checks
      id: ci296_source_seal
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
    - name: Retain private job ownership and source evidence
      id: ci296_private_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: private-rust-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        retention-days: 14
        if-no-files-found: error
    - name: Clean only uploaded owned source alias and target
      id: ci296_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.local_evidence_1.outcome == 'success' && steps.local_evidence_1.outputs.artifact-id != '' &&
        steps.local_evidence_1.outputs.artifact-digest != '' && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id
        != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_seal.outcome == 'success'
        && env.CI296_SOURCE_OWNER != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI296_HOST_CONTROL: '1'
        UPLOAD_ID: ${{ steps.ci296_private_evidence.outputs.artifact-id }}
        UPLOAD_DIGEST: ${{ steps.ci296_private_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
        [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
        workspace=$CI296_ACTIONS_WORKSPACE
        p=$CI296_SOURCE_OWNER
        case "$p" in "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
        test -d "$p" && test ! -L "$p"
        test "$(realpath -e -- "$p")" = "$p"
        test "$(stat -c '%u' -- "$p")" = "$(id -u)"
        test "$(stat -c '%d:%i' -- "$p")" = "$CI296_SOURCE_IDENTITY"
        test -f "$p/.ci296-owner" && test ! -L "$p/.ci296-owner"
        test "$(cat "$p/.ci296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$CI296_SOURCE" = "$p/source"
        test -d "$p/source" && test ! -L "$p/source"
        test "$(realpath -e -- "$p/source")" = "$p/source"
        alias_path="$CI296_ACTIONS_WORKSPACE/$CI296_ALIAS_BASENAME"
        test "$CI296_SOURCE_ALIAS" = "$alias_path"
        test -L "$alias_path"
        test "$(readlink -- "$alias_path")" = "$p"
        test "$(stat -c '%d:%i' -- "$alias_path")" = "$CI296_ALIAS_IDENTITY"
        rm -- "$alias_path"
        if ! rm -rf --one-file-system -- "$p"; then
          sudo -n rm -rf --one-file-system -- "$p"
        fi
    - name: Clean common owned temporary paths after uploaded source
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.local_evidence_1.outcome == 'success' && steps.local_evidence_1.outputs.artifact-id != '' &&
        steps.local_evidence_1.outputs.artifact-digest != '' && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id
        != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_cleanup.outcome == 'success')
        }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      with:
        cleanup: 'true'
      env:
        CI296_HOST_CONTROL: '1'
    defaults:
      run:
        shell: openpilot-local-shell {0}
