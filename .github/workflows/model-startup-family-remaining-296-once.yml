name: 296 startup fix and authenticated remaining model-family cases
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-startup-family-remaining-296-once.yml
permissions:
  contents: read
  actions: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  cached-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BRIDGE_CATALOG_ROOTS: model-family-preparation-296
      EXPECTED_SOURCE: 52310bf93d687c8470afdf4699a8739779bc9eb4
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_FAMILY_STARTUP_MANIFEST_SHA256: 4c54c0d6fb375cec2d64c6ecfeb5ce709f223bbe0aeb0114b68c5a4e184c7416
      MODEL_FAMILY_USBGPU_MANIFEST_SHA256: 8774d6752cabaeba96bacd4bab009a9432f12e5231e8da608285ff5115b21ad8
      MODEL_FAMILY_CAPTURE_SOURCE: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 52310bf93d687c8470afdf4699a8739779bc9eb4
        persist-credentials: false
    - name: Reserve hosted capacity before dependencies
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nsudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/.ghcup\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 12288\nfor name in check_driver_daemon.py model_logging_capture.py model_logging_reference.py check_model_startup.py\
        \ model_startup_reference.py check_usbgpu_daemon.py; do\n test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\
        \ndone\nmkdir \"$RUNNER_TEMP/model-family-preparation-296\"\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends\
        \ g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev libzmq3-dev jq\nrustup toolchain install 1.94.0\
        \ --profile minimal --component clippy,rustfmt\n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Admit accepted component and driver prefix only for unchanged exact model/provider source closure
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        run=39788805882

        curl --fail --location --retry 4 --max-time 90 -H "Cache-Control: no-cache" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bin9208/openpilot-rust/actions/runs/$run"
        > "$proof/component-run.json"

        jq -e ''.status == "completed" and .conclusion == "success" and .head_sha == "6a0cb99ea0a258f89f3358b5c68c0e2538ad06cc"''
        "$proof/component-run.json" > /dev/null

        curl --fail --location --retry 4 --max-time 90 -H "Cache-Control: no-cache" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bin9208/openpilot-rust/actions/runs/$run/artifacts"
        > "$proof/component-artifacts.json"

        row=$(jq -cer ''[.artifacts[] | select(.name == "native-cached-component-800e2c8f808" and .expired == false)] | if
        length == 1 then .[0] else error("one exact-source component proof required") end'' "$proof/component-artifacts.json")

        id=$(jq -r ''.id'' <<< "$row"); hash=$(jq -r ''.digest | sub("^sha256:"; "")'' <<< "$row")

        test "${#hash}" -eq 64

        curl --fail --location --retry 4 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/$id/zip"
        > "$proof/component-proof.zip"

        printf ''%s  %s\n'' "$hash" "$proof/component-proof.zip" | sha256sum --check --strict -

        test "$(unzip -p "$proof/component-proof.zip" completion.txt)" = COMPONENT_CHECKS_PASS_NO_PROGRAM_IMAGES_EXECUTED

        test "$(unzip -p "$proof/component-proof.zip" final-guards.status)" = 0

        test "$(unzip -p "$proof/component-proof.zip" source-workflow.txt | head -1)" = 800e2c8f808d0abf347787a01d4c7b9ce1fec942

        unzip -t "$proof/component-proof.zip" > "$proof/component-zip-crc.txt"

        git fetch --no-tags --depth=1 origin 800e2c8f808d0abf347787a01d4c7b9ce1fec942

        git diff --exit-code 800e2c8f808d0abf347787a01d4c7b9ce1fec942 "$EXPECTED_SOURCE" -- ''rust/crates/model-runtime''
        ''rust/crates/dmonitoringmodeld'' ''rust/vendor/iced-x86-1.21.0'' ''rust/vendor/iced-x86-1.21.0.LICENSE.txt'' ''rust/vendor/iced-x86-1.21.0.provenance.json''
        ''rust/Cargo.toml'' ''rust/rust-toolchain.toml'' ''rust/tools/model_export'' ''rust/tools/build_model_pipelines.py''
        ''rust/crates/dev-tools/src/driver_daemon_check.rs'' ''rust/crates/dev-tools/src/driver_daemon_current_catalog.rs''
        ''rust/crates/dev-tools/src/model_family_prepare'' ''rust/crates/dev-tools/src/model_family_reference.rs'' ''rust/crates/dev-tools/src/usbgpu_daemon_check.rs''
        ''rust/crates/dev-tools/src/model_family_retirement_diagnostic.rs'' ''rust/crates/dev-tools/src/model_family_process.rs''
        ''rust/crates/dev-tools/src/driver_daemon_source_policy.rs'' ''rust/crates/dev-tools/src/qa_process.rs'' ''rust/crates/dev-tools/src/qa_process''
        ''rust/crates/dev-tools/src/seal.rs'' ''rust/crates/dev-tools/src/seal'' ''rust/crates/dev-tools/src/argparse_scan.rs''
        ''rust/crates/dev-tools/src/driving_daemon_reference.rs'' ''rust/crates/dev-tools/src/driving_logging_check.rs'' ''rust/crates/drivingd''
        ''rust/crates/logmessaged'' ''rust/crates/logging'' ''rust/crates/modeld'' ''rust/crates/cereal'' ''rust/crates/msgq''
        ''rust/crates/messaging'' ''rust/crates/dev-tools/tests/fixtures/driver-daemon-original'' ''rust/crates/dev-tools/tests/fixtures/model-family-original''
        ''rust/crates/dev-tools/tests/fixtures/driving-daemon-original'' > "$proof/component-reused-source-equivalence.diff"

        printf ''%s  %s\n'' e7e05295bb6b6a8212fecff9ad65ea9f25168e9246e5e20c46fc87a37ff10034 rust/crates/dev-tools/Cargo.toml
        | sha256sum --check --strict - > "$proof/approved-deleter-registration-manifest.after.log"

        prefix_id=12430984772

        curl --fail --location --retry 4 --max-time 180 -H "Cache-Control: no-cache" -H "Authorization: Bearer $GH_TOKEN"
        "https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/$prefix_id/zip" > "$proof/accepted-prefix.zip"

        printf ''%s  %s\n'' 6883c93761adaaba3984dd8e15fbd5de04c0be7ef7d7dc90d7a85b6a14885160 "$proof/accepted-prefix.zip"
        | sha256sum --check --strict -

        unzip -t "$proof/accepted-prefix.zip" > "$proof/accepted-prefix-crc.txt"

        unzip -p "$proof/accepted-prefix.zip" cached-first-native/accepted.json > "$proof/accepted-prefix.json"

        jq -e ''.actual_model_run_and_daemon == true and .tolerance == 0.000001 and .full_retirement_acceptance == false and
        .full_family_gate_still_required == true'' "$proof/accepted-prefix.json" > /dev/null

        unzip -p "$proof/accepted-prefix.zip" cached-first-native/model-run/diagnostic.json > "$proof/accepted-prefix-diagnostic.json"

        jq -e ''.model_run_exit==0 and (.comparisons|length)==2 and all(.comparisons[]; .model_vs_original.byte_equal and
        .daemon_vs_original.byte_equal and .model_vs_daemon.byte_equal)'' "$proof/accepted-prefix-diagnostic.json" > /dev/null

        unzip -p "$proof/accepted-prefix.zip" driver-catalog/current-catalog-receipt.json | jq -e ''.source_commit=="800e2c8f808d0abf347787a01d4c7b9ce1fec942"
        and .cached_code.complete_preflight==true'' > /dev/null

        printf ''%s  %s\n'' 3ce170bfb5478bf0803560c6211758a4c1fb68f7501803e7d3b044a7f3872018 rust/crates/dev-tools/src/model_startup_check.rs
        | sha256sum --check --strict - > "$proof/startup-repair-source.after.log"

        printf ''%s  %s\n'' e96dbc9614c1bf6f9aaf78374a64807046a2deaa517b7f1f28f26d995e69348f rust/Cargo.lock | sha256sum --check
        --strict - > "$proof/approved-inactive-lock.after.log"

        cat > "$proof/approved-inactive-lock.json" <<''LOCK_REUSE_PROOF''

        {"approved_source": "52310bf93d687c8470afdf4699a8739779bc9eb4", "existing_resolved_dependency_edges_unchanged_except_three_optional_devtools_roots":
        true, "new_inactive_optional_packages": 29, "new_lock_sha256": "e96dbc9614c1bf6f9aaf78374a64807046a2deaa517b7f1f28f26d995e69348f",
        "old_packages_preserved": 593}

        LOCK_REUSE_PROOF

        cat > "$proof/prior-family-scope.json" <<''PRIOR_FAMILY_SCOPE''

        {"run":39796728026,"source":"c7c3a9c8ab6f95065e1872553b08e4efa6ecd202","artifact":12438851210,"artifact_bytes":306623184,"artifact_sha256":"fa0443ea1ba3900d2291fbe720e274fe8ed2b391f4727aeb4e9319aa12d6bc41","all_crc":2064,"prior_root0_driver_runs":16,"prior_root0_startup_runs":8,"first_failure":"root-0-startup-foreign-output:120s","full_family_accepted":false,"prior24_runs_credit_for_new_same_elf_gate":false,"new_gate_scope":"authenticated
        old24 cases plus remaining36; original complete-current same-ELF claim remains distinct"}

        PRIOR_FAMILY_SCOPE

        '
    - name: Install dependencies of the separately pending model compiler
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2 requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - name: Fail fast on genuine startup foreign-output RED/GREEN and affected strict Clippy
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        file=rust/crates/dev-tools/src/model_startup_check.rs

        cp "$file" "$proof/startup-fixed.rs"

        git fetch --no-tags --depth=1 origin c7c3a9c8ab6f95065e1872553b08e4efa6ecd202

        git show c7c3a9c8ab6f95065e1872553b08e4efa6ecd202:"$file" > "$proof/startup-before.rs"

        restore_startup() { cp "$proof/startup-fixed.rs" "$file"; }

        trap restore_startup EXIT

        python - <<''STARTUP_RED_UNIT''

        import os

        from pathlib import Path

        proof=Path(os.environ[''RUNNER_TEMP''])/''model-family-preparation-296''

        fixed=(proof/''startup-fixed.rs'').read_text()

        start=fixed.index(''    #[test]\n    fn foreign_evidence_is_rejected_before_large_or_missing_input_admission()'')

        end=fixed.index(''    #[test]'',start+len(''    #[test]''))

        unit=fixed[start:end]

        assert unit.count(''fn foreign_evidence_'')==1 and ''foreign-owned-report'' in unit

        old=(proof/''startup-before.rs'').read_text()

        Path(''rust/crates/dev-tools/src/model_startup_check.rs'').write_text(old+''\n#[cfg(test)]\nmod startup_early_guard_red
        {\n use super::*;\n''+unit+''\n}\n'')

        STARTUP_RED_UNIT

        features=driver-daemon-native,uploader-logging-native

        status=0

        CARGO_TARGET_DIR="$RUNNER_TEMP/startup-before-target" cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools
        --features "$features" --lib model_startup_check::startup_early_guard_red::foreign_evidence_is_rejected_before_large_or_missing_input_admission
        -- --exact --nocapture > "$proof/startup-red.log" 2>&1 || status=$?

        printf ''%s\n'' "$status" > "$proof/startup-red.status"

        test "$status" -eq 101

        grep -F ''running 1 test'' "$proof/startup-red.log"

        grep -F ''test result: FAILED. 0 passed; 1 failed;'' "$proof/startup-red.log"

        grep -F ''startup evidence output already exists'' "$proof/startup-red.log"

        restore_startup

        trap - EXIT

        cmp "$proof/startup-fixed.rs" "$file"

        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features "$features" --lib --bin check-model-startup
        -- -D warnings > "$proof/startup-green-clippy.log" 2>&1 || { cat "$proof/startup-green-clippy.log"; exit 1; }

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features "$features" --lib model_startup_check::tests::foreign_evidence_is_rejected_before_large_or_missing_input_admission
        -- --exact --nocapture > "$proof/startup-green.log" 2>&1 || { cat "$proof/startup-green.log"; exit 1; }

        grep -F ''running 1 test'' "$proof/startup-green.log"

        grep -F ''test result: ok. 1 passed; 0 failed;'' "$proof/startup-green.log"

        printf ''%s\n'' ''startup-red-green-complete'' > "$proof/startup-red-green.complete"

        '
    - name: Build actual native catalog/checker groups and held family test ELF once
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\nfile=rust/crates/dev-tools/tests/model_family_retirement.rs\n\
        cp \"$file\" \"$proof/retirement-test-committed.rs\"\nrestore_retirement_test() { cp \"$proof/retirement-test-committed.rs\"\
        \ \"$file\"; }\ntrap restore_retirement_test EXIT\nbase64 --decode <<'REMAINING_RUST_TEST' > \"$proof/retirement-test-augmented.rs\"\
        \\n\
        REMAINING_RUST_TEST\nprintf '%s  %s\\n' dbe6c71ca420849098e826fd58cc0e12d00b48c1ad8a172cdd893f6388ef506f \"$proof/retirement-test-augmented.rs\"\
        \ | sha256sum --check --strict -\ncp \"$proof/retirement-test-augmented.rs\" \"$file\"\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 6144\nfeatures=driver-daemon-native,uploader-logging-native\n\
        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\" --test model_family_retirement\
        \ -- -D warnings > \"$proof/changed-family-scoping-clippy.log\" 2>&1 || { cat \"$proof/changed-family-scoping-clippy.log\"\
        ; exit 1; }\ncargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\"\
        \ --bin stage-driver-daemon-fixture --bin prepare-model-family-catalog --bin stage-model-family-usb-assets --bin check-driver-daemon\
        \ --bin check-model-startup --bin check-usbgpu-daemon > \"$proof/grouped-cli-build.log\" 2>&1 || { cat \"$proof/grouped-cli-build.log\"\
        ; exit 1; }\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\" --test\
        \ model_family_retirement --no-run --message-format=json > \"$proof/family-test-artifacts.jsonl\" 2> \"$proof/family-test-compile.log\"\
        \ || { cat \"$proof/family-test-compile.log\"; exit 1; }\ntest_binary=$(jq -sr '[.[] | select(.reason == \"compiler-artifact\"\
        \ and .target.name == \"model_family_retirement\" and .profile.test == true and .executable != null) | .executable]\
        \ | unique | if length == 1 then .[0] else error(\"one complete family test ELF required\") end' \"$proof/family-test-artifacts.jsonl\"\
        )\nprintf 'MODEL_CACHED_FAMILY_TEST_BINARY=%s\\n' \"$test_binary\" >> \"$GITHUB_ENV\"\ncargo test --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features \"$features\" --test model_family_prepare --no-run --message-format=json\
        \ > \"$proof/prepare-test-artifacts.jsonl\" 2> \"$proof/prepare-test-compile.log\" || { cat \"$proof/prepare-test-compile.log\"\
        ; exit 1; }\nprepare_binary=$(jq -sr '[.[] | select(.reason == \"compiler-artifact\" and .target.name == \"model_family_prepare\"\
        \ and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error(\"\
        one USB preparation test ELF required\") end' \"$proof/prepare-test-artifacts.jsonl\")\nprintf 'MODEL_CACHED_PREPARE_TEST_BINARY=%s\\\
        n' \"$prepare_binary\" >> \"$GITHUB_ENV\"\n\"$test_binary\" --list > \"$proof/family-test-list.txt\"\n\"$prepare_binary\"\
        \ --list > \"$proof/prepare-test-list.txt\"\nfor name in cached_driver_uses_actual_model_run_and_daemon_before_full_retirement\
        \ same_elf_replays_all_three_native_clis_in_both_absent_roots diagnose_first_driver_frame_on_same_host_and_catalog;\
        \ do\n grep -Fx \"$name: test\" \"$proof/family-test-list.txt\"\ndone\ngrep -Fx 'actual_usb_stage_preserves_full_45_asset_and_three_license_rosters:\
        \ test' \"$proof/prepare-test-list.txt\"\ngrep -Fx 'remaining_cases_after_authenticated_root0: test' \"$proof/family-test-list.txt\"\
        \nrestore_retirement_test\ntrap - EXIT\ncmp \"$proof/retirement-test-committed.rs\" \"$file\"\n# The first actual\
        \ CLI negative is independent of large model/fixture admission.\nmissing=\"$proof/intentionally-missing-input\"\n\
        foreign=\"$proof/early-cli-foreign\"\nmkdir \"$foreign\"\nprintf '%s' foreign-owned-report > \"$foreign/report.json\"\
        \nfor output in \"$foreign\" \"$proof/early-cli-dangling\"; do\n if test \"$output\" != \"$foreign\"; then ln -s \"\
        $missing\" \"$output\"; fi\n status=0\n timeout --signal=KILL 15 rust/target/debug/check-model-startup --catalog \"\
        $missing\" --native-original \"$missing\" --native-original-sha256 \"$MODEL_FAMILY_STARTUP_MANIFEST_SHA256\" --native-root\
        \ \"$GITHUB_WORKSPACE\" --source-policy retired-model-family --driving \"$missing\" --driver \"$missing\" --native-driving-peer\
        \ \"$missing\" --native-driver-peer \"$missing\" --output \"$output\" --expect pre-frame > \"$proof/early-cli-$(basename\
        \ \"$output\").stdout\" 2> \"$proof/early-cli-$(basename \"$output\").stderr\" || status=$?\n test \"$status\" -eq\
        \ 1\n test ! -s \"$proof/early-cli-$(basename \"$output\").stdout\"\n grep -F 'startup evidence output already exists'\
        \ \"$proof/early-cli-$(basename \"$output\").stderr\"\ndone\ntest \"$(cat \"$foreign/report.json\")\" = foreign-owned-report\n\
        test -L \"$proof/early-cli-dangling\"\n# Preserve the owned symlink evidence as text; bounded artifact stager admits\n\
        # regular files only. Delete only this just-created owned link after verifying it.\nreadlink \"$proof/early-cli-dangling\"\
        \ > \"$proof/early-cli-dangling.target.txt\"\nrm \"$proof/early-cli-dangling\"\nprintf '%s\\n' pass > \"$proof/early-cli.complete\"\
        \n"
    - name: Build held runtime prerequisites and both C++ peers without original Python bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-driving-modeld --bin openpilot-driving-modeld --example
        usbgpu_daemon_fixture > "$proof/driving-build.log" 2>&1 || { cat "$proof/driving-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dmonitoringmodeld --bin openpilot-dmonitoringmodeld
        > "$proof/driver-build.log" 2>&1 || { cat "$proof/driver-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-usbgpu --example worker_protocol_fixture > "$proof/worker-build.log"
        2>&1 || { cat "$proof/worker-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run --bin offline-llvm-guarded-add
        > "$proof/model-run-build.log" 2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driving-daemon-native --bin
        stage-driving-daemon-fixture --bin generate-services-header > "$proof/stager-build.log" 2>&1 || { cat "$proof/stager-build.log";
        exit 1; }

        mkdir "$proof/peer"

        rust/target/debug/generate-services-header > "$proof/peer/services.h"

        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driving-daemon-peer"
        > "$proof/peer-build.log" 2>&1 || { cat "$proof/peer-build.log"; exit 1; }

        sha256sum rust/target/debug/openpilot-driving-modeld rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/examples/usbgpu_daemon_fixture
        rust/target/debug/examples/worker_protocol_fixture "$proof/peer/driving-daemon-peer" > "$proof/held-elfs.sha256"


        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driver_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driver-daemon-peer"
        > "$proof/driver-peer-build.log" 2>&1 || { cat "$proof/driver-peer-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-logmessaged --bin openpilot-logmessaged > "$proof/collector-build.log"
        2>&1 || { cat "$proof/collector-build.log"; exit 1; }


        # Last feature-unifying build before any helper/policy seal.

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --features cached-program-isa --bin
        offline-cached-code --bin offline-llvm-guarded-add --bin model-run > "$proof/cached-native-final-build.log" 2>&1 ||
        { cat "$proof/cached-native-final-build.log"; exit 1; }

        '
    - name: Bind same-source explicit helper for all affected catalog exports
      id: bridge-bind
      shell: bash
