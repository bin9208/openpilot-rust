        run: |
          set -euo pipefail
          seal_diagnostics() {
            original_status=$?
            trap - EXIT
            if ((original_status != 0)); then
              set +e
              proof="$CI_JOB_TEMP/proof"
              # 진단은 expected를 갱신하지 않으며 원래 봉인의 실패 exit를 보존한다.
              git --no-pager diff --no-ext-diff --no-textconv --raw HEAD -- > "$proof/source-failed-git-diff.txt" 2> "$proof/source-failed-git-diff.stderr"
