name: tests
'on':
  push:
    branches: [carrot-wip]
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string
concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/carrot-wip' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false
  queue: max
env:
  CI: 1
jobs:
  git_update:
    name: Git update lifecycle
    runs-on: ubuntu-24.04
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - &id001
        name: Common owned job temporary paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        env:
          CI296_HOST_CONTROL: '1'
      - &id002
        name: Allocate private source cache target and local action alias before checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          job=$CI_JOB_TEMP
          owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$(cat "$job/owner")" = "$owner"
          umask 077
          mkdir "$job/proof" "$job/home" "$job/cache"
          # Source capacity is checked on the actual source filesystem BEFORE checkout.
          available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          required=$((2 * 1024 * 1024 * 1024))
          printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
          ((available >= required))
          source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          printf '%s\n' "$owner" > "$source_owner/.ci296-owner"
          mkdir "$source_owner/source"
          source="$source_owner/source"
          # Preserve Actions' real workspace separately. Only Bash consumers see the
          # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
          printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/ci296-shell-env"
          printf '%s\n' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env" >> "$GITHUB_ENV"
          printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
          df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
          cat /proc/meminfo > "$job/proof/memory-before.txt"
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
          printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"

          alias_path="$workspace/$CI296_ALIAS_BASENAME"
          case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac
          [[ $CI296_ALIAS_BASENAME != */* ]]
          # -T makes this an exclusive atomic link, never traversal into a stale directory.
          ln -sT -- "$source_owner" "$alias_path"
          printf '%s\n' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c '%d:%i' -- "$alias_path")" "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"
          printf 'source_alias=%s\nalias_identity=%s\n' "$alias_path" "$(stat -c '%d:%i' -- "$alias_path")" >> "$job/proof/ownership.txt"
      - uses: actions/checkout@v7
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
          lfs: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
      - &id003
        name: Admit exact private source and index
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          test "$PWD" = "$CI296_SOURCE"
          test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
      - &id004
        name: Expose provisioned Rust shims
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        env:
          CI296_HOST_CONTROL: '1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Keep original Python installations private
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          ((available >= 512 * 1024 * 1024))
          python -m venv "$CI_JOB_TEMP/venv"
          printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pytest aiohttp
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Check startup, locking, recovery and subprocess cleanup
        run: |
          bash -n launch_chffrplus.sh
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/common/tests openpilot/common/tests/test_repo_update.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/server/tests openpilot/selfdrive/carrot/server/tests/test_auto_update.py openpilot/selfdrive/carrot/server/tests/test_git_config.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/system/tests openpilot/system/tests/test_launch_order.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/system/updated/tests openpilot/system/updated/tests/test_process.py
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.CI296_SOURCE }}
      - &id005
        name: Seal private source and index after maintained checks
        id: ci296_source_seal
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI296_SOURCE != '') }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
          cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
          cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
          git diff --exit-code
          git diff --cached --exit-code
          df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
          cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
      - &id006
        name: Retain private job ownership and source evidence
        id: ci296_private_evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: private-tests-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_JOB_TEMP }}/proof
          retention-days: 14
          if-no-files-found: error
      - &id007
        name: Clean only uploaded owned source alias and target
        id: ci296_source_cleanup
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_seal.outcome == 'success' && env.CI296_SOURCE_OWNER != '') }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI296_HOST_CONTROL: '1'
          UPLOAD_ID: ${{ steps.ci296_private_evidence.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.ci296_private_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
          [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
          workspace=$CI296_ACTIONS_WORKSPACE
          p=$CI296_SOURCE_OWNER
          case "$p" in "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
          test -d "$p" && test ! -L "$p"
          test "$(realpath -e -- "$p")" = "$p"
          test "$(stat -c '%u' -- "$p")" = "$(id -u)"
          test "$(stat -c '%d:%i' -- "$p")" = "$CI296_SOURCE_IDENTITY"
          test -f "$p/.ci296-owner" && test ! -L "$p/.ci296-owner"
          test "$(cat "$p/.ci296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$CI296_SOURCE" = "$p/source"
          test -d "$p/source" && test ! -L "$p/source"
          test "$(realpath -e -- "$p/source")" = "$p/source"
          alias_path="$CI296_ACTIONS_WORKSPACE/$CI296_ALIAS_BASENAME"
          test "$CI296_SOURCE_ALIAS" = "$alias_path"
          test -L "$alias_path"
          test "$(readlink -- "$alias_path")" = "$p"
          test "$(stat -c '%d:%i' -- "$alias_path")" = "$CI296_ALIAS_IDENTITY"
          rm -- "$alias_path"
          if ! rm -rf --one-file-system -- "$p"; then
            sudo -n rm -rf --one-file-system -- "$p"
          fi
      - &id008
        name: Clean common owned temporary paths after uploaded source
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_cleanup.outcome == 'success') }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        with:
          cleanup: 'true'
        env:
          CI296_HOST_CONTROL: '1'
    env:
      CI296_ALIAS_BASENAME: .ci296-source-tests--git_update
  build_release:
    name: build release
    runs-on: ubuntu-24.04
    steps:
      - name: Deny fork source and require GitHub-hosted Ubuntu X64 runner
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
        working-directory: ${{ github.workspace }}
      - *id001
      - *id002
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
          set-safe-directory: false
          clean: false
          lfs: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Admit exact source LFS objects before source baseline
        id: ci296_lfs_admission
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        timeout-minutes: 15
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: |
          set -euo pipefail
          export LC_ALL=C
          proof="$CI_JOB_TEMP/proof"
          test "$PWD" = "$CI296_SOURCE"
          test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"
          test "$(realpath -e -- "$CI296_SOURCE_OWNER")" = "$CI296_SOURCE_OWNER"
          test "$(stat -c '%d:%i' -- "$CI296_SOURCE_OWNER")" = "$CI296_SOURCE_IDENTITY"
          test "$(cat "$CI296_SOURCE_OWNER/.ci296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git ls-files --stage -z > "$proof/lfs-index-before.bin"
          git ls-files -z > "$proof/lfs-all-paths.bin"
          git rev-parse HEAD HEAD^{tree} > "$proof/lfs-source.txt"
          git version > "$proof/lfs-providers.txt"
          git lfs version >> "$proof/lfs-providers.txt"
          sha256sum "$(realpath -e -- "$(command -v git)")" "$(realpath -e -- "$(command -v git-lfs)")" > "$proof/lfs-provider-files.sha256"
          gitdir=$(git rev-parse --absolute-git-dir)
          test "$gitdir" = "$CI296_SOURCE/.git"
          test -d "$gitdir" && test ! -L "$gitdir"
          # 전역 storage가 새 private source 밖으로 다운로드를 보내지 못하게 한다.
          if storage=$(git config --get lfs.storage); then
            test "$storage" = "$gitdir/lfs"
          else
            test "$?" -eq 1
          fi
          if test -e "$gitdir/lfs" || test -L "$gitdir/lfs"; then
            test -d "$gitdir/lfs" && test ! -L "$gitdir/lfs"
            test "$(realpath -e -- "$gitdir/lfs")" = "$gitdir/lfs"
          fi
          cat > "$proof/lfs-pointers.txt" <<'POINTERS'
          docs/assets/comma-logo.png|f54dec485ad298ee17b533354ed6f1fdfd3711a163d2c19d758f2ae340a0276e|57|d1eca5f5aca07e531baa8022fc5251eaf7a06658
          openpilot/selfdrive/carrot/web/assets/alert_camera.svg|f1086279a32f49f68de1db4e89a93aa2aae779395cfb908e5f6a0cbf2bf7dae6|989|9ca3cc9cbf243c430fb395e8c2590f015732b4f5
          openpilot/selfdrive/carrot/web/assets/alert_police.svg|d0dea6745d5cd5cf8206ced256310fed587555b3309d80cad46a4c066a931401|707|96fdd53484d77fa5f99b67ef35dfc6fe4c31a0d6
          openpilot/selfdrive/carrot/xiaoge/assets/lane.onnx|d3761c185daf33897ff3ff5edf28115c5dc829c06c538033accb616d6c67528c|13194895|b1d40634a3c566ef0534924da873daddbd696785
          openpilot/selfdrive/carrot/xiaoge/assets/v_asm_model.onnx|00247ede5159dff9a0768c171095711d40f1ee109ac7b5e24adce344fe4ba6f9|9625905|55964ec7d6e00fec66facb86ba25fd40207360f8
          openpilot/selfdrive/modeld/models/driving_supercombo.onnx|f73a9e535523d5e9acb9e642c64e33d631825dc8ba74123757d107cedd047bb5|60792584|80161b3fdb7f7a96159a48fb891636f5da551389
          POINTERS
          : > "$proof/lfs-paths.bin"
          : > "$proof/lfs-attributes.bin"
          count=0
          payload=0
          includes=
          while IFS='|' read -r path oid bytes blob; do
            count=$((count + 1))
            payload=$((payload + bytes))
            includes="${includes:+$includes,}$path"
            printf '%s\0' "$path" >> "$proof/lfs-paths.bin"
            test "$(git ls-tree "$GITHUB_SHA" -- "$path")" = "100644 blob $blob"$'\t'"$path"
            git cat-file blob "$blob" > "$proof/lfs-pointer-$count.txt"
            printf 'version https://git-lfs.github.com/spec/v1\noid sha256:%s\nsize %s\n' "$oid" "$bytes" | cmp - "$proof/lfs-pointer-$count.txt"
            git check-attr --source="$GITHUB_SHA" -z filter -- "$path" > "$proof/lfs-attribute.tmp"
            printf '%s\0filter\0lfs\0' "$path" | cmp - "$proof/lfs-attribute.tmp"
            cat "$proof/lfs-attribute.tmp" >> "$proof/lfs-attributes.bin"
            test -f "$path" && test ! -L "$path"
            test "$(stat -c '%a:%u:%h' -- "$path")" = "644:$(id -u):1"
          done < "$proof/lfs-pointers.txt"
          test "$count" -eq 6 && test "$payload" -eq 83615137
          # 실제 filter=lfs인 committed pointer만 수용한다. updater의 미지정 attribute는 보존한다.
          git ls-files --cached -z --format=$'%(objectmode) %(objecttype) %(objectname) %(objectsize)\t%(path)' ':(top,attr:filter=lfs)' > "$proof/lfs-candidates.bin"
          : > "$proof/lfs-observed-paths.bin"
          while IFS= read -r -d '' row; do
            meta=${row%%$'\t'*}
            path=${row#*$'\t'}
            read -r mode kind blob bytes <<< "$meta"
            [[ $bytes =~ ^[0-9]+$ ]] && test "$kind" = blob
            if ((bytes <= 1024)); then
              git cat-file blob "$blob" > "$proof/lfs-candidate.tmp"
              header='version https://git-lfs.github.com/spec/v1'
              if cmp -s -n "$((${#header} + 1))" "$proof/lfs-candidate.tmp" <(printf '%s\n' "$header"); then
                test "$mode" = 100644
                printf '%s\0' "$path" >> "$proof/lfs-observed-paths.bin"
              else
                test "$?" -eq 1
              fi
            fi
          done < "$proof/lfs-candidates.bin"
          sort -z "$proof/lfs-paths.bin" > "$proof/lfs-paths-sorted.bin"
          sort -z "$proof/lfs-observed-paths.bin" > "$proof/lfs-observed-sorted.bin"
          cmp "$proof/lfs-paths-sorted.bin" "$proof/lfs-observed-sorted.bin"
          # 원래 2 GiB source 예산에 이미 할당된 checkout과 cache/worktree/tmp 3배를 모두 포함한다.
          allocated=$(du -s -B1 -- "$CI296_SOURCE_OWNER" | awk '{print $1}')
          available=$(df -PB1 "$CI296_SOURCE" | awk 'NR == 2 {print $4}')
          [[ $allocated =~ ^[0-9]+$ && $available =~ ^[0-9]+$ ]]
          growth=$((3 * payload + 1024 * 1024))
          cap=$((2 * 1024 * 1024 * 1024))
          printf '{"allocated_bytes":%s,"payload_bytes":%s,"planned_growth_bytes":%s,"source_cap_bytes":%s,"available_bytes":%s}\n' "$allocated" "$payload" "$growth" "$cap" "$available" > "$proof/lfs-growth-before.json"
          ((allocated + growth <= cap && available >= growth))
          source_manifest() {
            local path mode value
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/assets/comma-logo.png|openpilot/selfdrive/carrot/web/assets/alert_camera.svg|openpilot/selfdrive/carrot/web/assets/alert_police.svg|openpilot/selfdrive/carrot/xiaoge/assets/lane.onnx|openpilot/selfdrive/carrot/xiaoge/assets/v_asm_model.onnx|openpilot/selfdrive/modeld/models/driving_supercombo.onnx) continue ;;
              esac
              mode=$(stat -c '%f' -- "$path") || return
              if test -L "$path"; then
                value=$(readlink -z -- "$path" | sha256sum) || return
              elif test -f "$path"; then
                value=$(sha256sum < "$path") || return
              else
                return 1
              fi
              printf '%s %s %s\0' "$mode" "${value%% *}" "$path"
            done < "$1"
          }
          export -f source_manifest
          timeout --signal=TERM --kill-after=10s 240s bash -euo pipefail -c 'source_manifest "$1" | sort -z > "$2"' lfs-manifest "$proof/lfs-all-paths.bin" "$proof/lfs-other-before.bin"
          timeout --signal=TERM --kill-after=10s 300s git -c "lfs.storage=$gitdir/lfs" lfs pull --include "$includes" --exclude ''
          sha256sum -c "$proof/lfs-provider-files.sha256"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files --stage -z > "$proof/lfs-index-after.bin"
          cmp "$proof/lfs-index-before.bin" "$proof/lfs-index-after.bin"
          : > "$proof/lfs-hydrated-records.bin"
          : > "$proof/lfs-objects.sha256"
          while IFS='|' read -r path oid bytes blob; do
            test -f "$path" && test ! -L "$path"
            test "$(stat -c '%a:%u:%h:%s' -- "$path")" = "644:$(id -u):1:$bytes"
            printf '%s  %s\n' "$oid" "$path" >> "$proof/lfs-objects.sha256"
            printf '%s %s %s\0' "$(stat -c '%f' -- "$path")" "$oid" "$path" >> "$proof/lfs-hydrated-records.bin"
          done < "$proof/lfs-pointers.txt"
