name: 296 unchanged driver convolution static lane slice diagnostic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-driver-machine-lane-slice-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  machine-lane-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
      DIAGNOSTIC_ATTEMPT: 20261022-driver-machine-lane-slice-02
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 67c21ea2bb2209b4b5ce7ec73fe409c4712abc8c
        persist-credentials: false
    - name: Decode inert held code and record restricted actual lane dependencies
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-machine-slice"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        avail=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1)

        test "$avail" -ge 28991029248

        command -v objdump > "$proof/objdump.path"

        sha256sum "$(command -v objdump)" > "$proof/objdump.before.sha256"

        objdump --version > "$proof/objdump.version"

        printf ''%s'' ''''
        | base64 --decode > "$proof/slice.py"

        printf ''a2c186e8b3158d4070c64207ca7723be24bd67724a387b9a055ea6c0208ede1e  %s/slice.py\n'' "$proof" | sha256sum --check
        --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12406095454/zip > "$proof/input.zip"

        printf ''837f89f4f48e9c4e0325efa79147ea81e6151066b44b2f6d974e37c981361353  %s/input.zip\n'' "$proof" | sha256sum --check
        --strict

        status=0

        SLICE_ARCHIVE="$proof/input.zip" SLICE_OUTPUT="$proof/output" timeout --signal=TERM --kill-after=5s 90s python3 "$proof/slice.py"
        > "$proof/stdout" 2> "$proof/stderr" || status=$?

        printf ''%s\n'' "$status" > "$proof/status"

        sha256sum --check --strict "$proof/objdump.before.sha256"

        printf ''a2c186e8b3158d4070c64207ca7723be24bd67724a387b9a055ea6c0208ede1e  %s/slice.py\n'' "$proof" | sha256sum --check
        --strict

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driver-machine-lane-slice-${{ env.DIAGNOSTIC_ATTEMPT }}
        path: '${{ runner.temp }}/driver-machine-slice/output/

          ${{ runner.temp }}/driver-machine-slice/stdout

          ${{ runner.temp }}/driver-machine-slice/stderr

          ${{ runner.temp }}/driver-machine-slice/status

          ${{ runner.temp }}/driver-machine-slice/slice.py

          ${{ runner.temp }}/driver-machine-slice/objdump.*'
        if-no-files-found: warn
        retention-days: 7
