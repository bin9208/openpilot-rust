name: 296 saved startup evidence audit on registered x64 runner
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-startup-saved-evidence-296-once.yml
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: startup-saved-evidence-296
  cancel-in-progress: false
jobs:
  saved-data-audit:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 15
    steps:
    - name: Authenticate fixed original data and saved run artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nproof=$(mktemp -d \"$RUNNER_TEMP/startup-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.XXXXXX\"\
        )\nexport STARTUP_AUDIT_PROOF=\"$proof\"\nexport XDG_CACHE_HOME=\"$proof/cache\" CARGO_HOME=\"$proof/cargo-home\"\
        \ CARGO_TARGET_DIR=\"$proof/target\" PIP_CACHE_DIR=\"$proof/pip-cache\" PYTHONPYCACHEPREFIX=\"$proof/pycache\" GH_CONFIG_DIR=\"\
        $proof/gh-config\"\nprintf 'STARTUP_AUDIT_PROOF=%s\\nXDG_CACHE_HOME=%s/cache\\nCARGO_HOME=%s/cargo-home\\nCARGO_TARGET_DIR=%s/target\\\
        nPIP_CACHE_DIR=%s/pip-cache\\nPYTHONPYCACHEPREFIX=%s/pycache\\n' \"$proof\" \"$proof\" \"$proof\" \"$proof\" \"$proof\"\
        \ \"$proof\" >> \"$GITHUB_ENV\"\nmkdir \"$proof/gh-config\" \"$proof/cache\" \"$proof/cargo-home\" \"$proof/target\"\
        \ \"$proof/pip-cache\" \"$proof/pycache\"\nuname -a > \"$proof/uname.txt\"\nlscpu --json > \"$proof/lscpu.json\"\n\
        cat /proc/meminfo > \"$proof/meminfo.txt\"\ndf -B1 \"$proof\" > \"$proof/disk.before.txt\"\npython3 - <<'RESOURCE_RECEIPT'\n\
        import hashlib,json,os,platform,shutil,sys\nfrom pathlib import Path\nproof=Path(os.environ['STARTUP_AUDIT_PROOF'])\n\
        mem={key:int(value.split()[0])*1024 for key,value in (line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())\
        \ if value.strip().endswith('kB')}\nusage=shutil.disk_usage(proof)\ncontrol={name:Path('/sys/fs/cgroup',name).read_text().strip()\
        \ for name in ['memory.max','memory.current','cpu.max'] if Path('/sys/fs/cgroup',name).is_file()}\npython=Path(sys.executable).resolve()\n\
        # Estimate only this audit's actual archive downloads and data-reader peak.\ndisk_growth=437503663+11337507+16*1024*1024\n\
        memory_growth=2*437503663+46967145+64*1024*1024\navailable=mem['MemAvailable']\nif control.get('memory.max','max')!='max'\
        \ and 'memory.current' in control:\n available=min(available,int(control['memory.max'])-int(control['memory.current']))\n\
        receipt={'runner_name':os.environ.get('RUNNER_NAME'),'labels_requested':['self-hosted','Linux','X64','dev-md-local'],'expected_registered_runner':'bin-actions/id22','system':platform.platform(),'machine':platform.machine(),'cpu_count':os.cpu_count(),'cpu_affinity':sorted(os.sched_getaffinity(0)),'mem_available_bytes':available,'cgroup':control,'disk_free_bytes':usage.free,'estimated_disk_growth_bytes':disk_growth,'estimated_memory_growth_bytes':memory_growth,'python_executable':str(python),'python_sha256':hashlib.sha256(python.read_bytes()).hexdigest(),'python_version':sys.version,'libc':platform.libc_ver(),'native_execution':False,'original_provider_identities':'remain\
        \ the historical artifact pins; this audit host is separate'}\nreceipt['os_release']=Path('/etc/os-release').read_text()\
        \ if Path('/etc/os-release').is_file() else None\n(proof/'runner-resources.json').write_text(json.dumps(receipt,indent=2)+chr(10))\n\
        assert os.environ.get('RUNNER_NAME')=='bin-actions','unexpected runner; do not execute this recipe elsewhere'\nassert\
        \ platform.machine()=='x86_64' and len(os.sched_getaffinity(0))>=1\nassert usage.free>=disk_growth and available>=memory_growth,'insufficient\
