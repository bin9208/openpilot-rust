    - name: Audit completed scopes without native or provider execution
      shell: bash
      run: 'set -euo pipefail

        proof="$STARTUP_AUDIT_PROOF"

        python3 "$proof/audit-saved-startup.py" --evidence "$proof" --originals "$proof" --output "$proof/audit" > "$proof/audit.stdout"
        2> "$proof/audit.stderr"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: startup-saved-evidence-39819735679-audit
        retention-days: 7
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.STARTUP_AUDIT_PROOF }}/

          !${{ env.STARTUP_AUDIT_PROOF }}/*.zip'
      id: save-evidence
    - name: Remove only uploaded private job data
      if: always() && steps.save-evidence.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$STARTUP_AUDIT_PROOF"

        case "$proof" in "$RUNNER_TEMP"/startup-evidence-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"-*) ;; *) exit 1 ;; esac

        test -d "$proof" && test ! -L "$proof"

        rm -rf -- "$proof"

        '
    env:
      PYTHONDONTWRITEBYTECODE: '1'
