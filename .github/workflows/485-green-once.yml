name: 296 guarded-native GREEN and LLVM output ownership 485
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/485-green-once.yml
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 06956b79d1d3ebacfa6e8a09616e9cdc1c358ed3
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 06956b79d1d3ebacfa6e8a09616e9cdc1c358ed3
        persist-credentials: false
    - name: Pin source and reserve bounded hosted capacity
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/485-green"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$proof/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends libllvm18

        rustc +1.94.0 --version --verbose > "$proof/rustc.txt"

        '
    - name: Stage independently captured LLVM18 provider
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/485-green"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        curl --fail --location --retry 3 --max-time 180 --output "$proof/llvm18.deb" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb

        printf ''af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n'' "$proof" | sha256sum
        --check --strict

        dpkg-deb --extract "$proof/llvm18.deb" "$proof/llvm18-captured"

        printf ''5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n''
        "$proof" | sha256sum --check --strict

        printf ''LLVM_PATH=%s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n'' "$proof" >> "$GITHUB_ENV"

        sha256sum "$proof/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1" > "$proof/llvm-provider.before.sha256"

        '
    - name: Build both native workers, strict Clippy, focused GREEN tests and no-default admission
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/485-green\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 6144\ncheck() {\n  name=\"$1\"\n  shift\n  printf '%q ' \"$@\" > \"$proof/$name.command\"\
        \n  printf '\\n' >> \"$proof/$name.command\"\n  status=0\n  \"$@\" > \"$proof/$name.stdout\" 2> \"$proof/$name.stderr\"\
        \ || status=$?\n  printf '%s\\n' \"$status\" > \"$proof/$name.status\"\n  if test \"$status\" -ne 0; then cat \"$proof/$name.stderr\"\
        ; cat \"$proof/$name.stdout\"; return \"$status\"; fi\n}\nmanifest=\"$GITHUB_WORKSPACE/rust/Cargo.toml\"\ncheck build\
        \ cargo +1.94.0 build --manifest-path \"$manifest\" --locked -p openpilot-model-runtime --features native-skip-miri\
        \ --bin offline-llvm-compile --bin offline-llvm-guarded-add\ncheck clippy cargo +1.94.0 clippy --manifest-path \"\
        $manifest\" --locked -p openpilot-model-runtime --features native-skip-miri --lib --bin offline-llvm-compile --bin\
        \ offline-llvm-guarded-add --test guarded_add --test guarded_add_cli --test compiler_llvm -- -D warnings\ncheck ownership\
        \ cargo +1.94.0 test --manifest-path \"$manifest\" --locked -p openpilot-model-runtime --features native-skip-miri\
        \ --bin offline-llvm-compile output_ownership_tests -- --nocapture --test-threads=1\ncheck guarded cargo +1.94.0 test\
        \ --manifest-path \"$manifest\" --locked -p openpilot-model-runtime --features native-skip-miri --test guarded_add\
        \ --test guarded_add_cli -- --nocapture --test-threads=1\ncheck helper-bounds cargo +1.94.0 test --manifest-path \"\
        $manifest\" --locked -p openpilot-model-runtime --features native-skip-miri --lib guarded_add:: -- --nocapture --test-threads=1\n\
        check helper-ownership cargo +1.94.0 test --manifest-path \"$manifest\" --locked -p openpilot-model-runtime --features\
        \ native-skip-miri --lib owned_outputs:: -- --nocapture --test-threads=1\ncheck compiler-provider cargo +1.94.0 test\
        \ --manifest-path \"$manifest\" --locked -p openpilot-model-runtime --features native-skip-miri --test compiler_llvm\
        \ -- --nocapture --test-threads=1\ncheck no-default cargo +1.94.0 check --manifest-path \"$manifest\" --locked -p\
        \ openpilot-model-runtime --no-default-features --lib\nsha256sum --check --strict \"$proof/llvm-provider.before.sha256\"\
        \ > \"$proof/llvm-provider.after.txt\"\nsha256sum rust/target/debug/offline-llvm-compile rust/target/debug/offline-llvm-guarded-add\
        \ > \"$proof/workers.sha256\"\npython3 - <<'RESULT'\nimport json, os, re\nfrom pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'485-green'\n\
        for name in ('build','clippy','ownership','guarded','helper-bounds','helper-ownership','compiler-provider','no-default'):\n\
        \    assert (p/f'{name}.status').read_text().strip() == '0', name\ntext=(p/'ownership.stdout').read_text()\nfor name\
        \ in ('foreign_replacement_survives_late_failure','foreign_symlink_survives_late_failure','unchanged_owned_output_is_removed_on_failure','successful_output_is_retained'):\n\
        \    assert f'test output_ownership_tests::{name} ... ok' in text, name\nassert re.search(r'test result: ok\\. 4 passed;\
        \ 0 failed; 0 ignored;', text)\nassert re.search(r'test result: ok\\. 5 passed; 0 failed; 0 ignored;', (p/'compiler-provider.stdout').read_text())\n\
        assert re.search(r'test result: ok\\. 2 passed; 0 failed; 0 ignored;', (p/'helper-bounds.stdout').read_text())\nassert\
        \ re.search(r'test result: ok\\. 3 passed; 0 failed; 0 ignored;', (p/'helper-ownership.stdout').read_text())\nguarded=(p/'guarded.stdout').read_text()\n\
        assert len(re.findall(r'test result: ok\\.', guarded)) == 2\nassert re.search(r'test result: ok\\. 13 passed; 0 failed;\
        \ 0 ignored;', guarded)\nassert re.search(r'test result: ok\\. 4 passed; 0 failed; 0 ignored;', guarded)\n(p/'result.json').write_text(json.dumps({'green':True,'source_commit':os.environ['EXPECTED_SOURCE'],'workflow_head':os.environ['GITHUB_SHA'],'ownership_regressions_and_controls':4,'compiler_llvm_tests':5,'llvm18_library_sha256':'5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0','strict_clippy':True,'native_builds':2,'no_default_features_library_admission':True,'real_kernel_or_full_model_acceptance':False},indent=2)+'\\\
        n')\nRESULT\n"
    - name: Preserve exact-source GREEN evidence
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: 485-green-evidence
        path: '${{ runner.temp }}/485-green/

          !${{ runner.temp }}/485-green/llvm18.deb

          !${{ runner.temp }}/485-green/llvm18-captured/**'
        retention-days: 14
        if-no-files-found: warn
