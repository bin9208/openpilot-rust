name: 296 original uploader sibling group capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/uploader-sibling-original-296-once.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: 67f099bffbdda2396ea2f64e1f168a76ce19d560
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 67f099bffbdda2396ea2f64e1f168a76ce19d560
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Reserve hosted capacity and pin exact source
      shell: bash
      run: 'set -euo pipefail

        export UPLOADER_SIBLING_PROOF="$RUNNER_TEMP/uploader-sibling-original-296"

        printf ''UPLOADER_SIBLING_PROOF=%s

        '' "$UPLOADER_SIBLING_PROOF" >> "$GITHUB_ENV"

        mkdir "$UPLOADER_SIBLING_PROOF"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s

        source_commit=%s

        '' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$UPLOADER_SIBLING_PROOF/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 10240

        rustup toolchain install 1.94.0 --profile minimal

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0
        requests==2.34.2 PyJWT==2.15.1 cryptography==50.0.1

        python -m pip freeze > "$UPLOADER_SIBLING_PROOF/providers.before.txt"

        '
    - name: Build current native JSON11 provider stager once
      uses: ./.github/actions/native-json11
    - name: Build shared native probes and unchanged original IPC/Params providers once
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-uploader -p openpilot-logmessaged --bins
        --examples > "$UPLOADER_SIBLING_PROOF/build.stdout" 2> "$UPLOADER_SIBLING_PROOF/build.stderr"

        mkdir "$UPLOADER_SIBLING_PROOF/bin"

        cp rust/target/debug/openpilot-uploader "$UPLOADER_SIBLING_PROOF/bin/openpilot-uploader"

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/uploader-sibling-msgq" > "$UPLOADER_SIBLING_PROOF/msgq-build.stdout"
        2> "$UPLOADER_SIBLING_PROOF/msgq-build.stderr"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/uploader-sibling-params"
        > "$UPLOADER_SIBLING_PROOF/params-build.stdout" 2> "$UPLOADER_SIBLING_PROOF/params-build.stderr"

        printf ''PYTHONPATH=%s/uploader-sibling-msgq:%s:%s/rust/tools

        '' "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        gcc -Wall -Wextra -Werror -O2 -fPIC -DZMQ_LINK_WRAP -c rust/tools/zmq_send_boundary.c -o "$UPLOADER_SIBLING_PROOF/send-wrap.o"

        cargo +1.94.0 rustc --manifest-path rust/Cargo.toml --locked -p openpilot-uploader --bin openpilot-uploader -- -C
        link-arg=-Wl,--wrap=zmq_msg_send -C "link-arg=$UPLOADER_SIBLING_PROOF/send-wrap.o" > "$UPLOADER_SIBLING_PROOF/wrapped-build.stdout"
        2> "$UPLOADER_SIBLING_PROOF/wrapped-build.stderr"

        cp rust/target/debug/openpilot-uploader "$UPLOADER_SIBLING_PROOF/bin/uploader-send-interrupted"

        sha256sum "$UPLOADER_SIBLING_PROOF/bin/openpilot-uploader" "$UPLOADER_SIBLING_PROOF/bin/uploader-send-interrupted"
        rust/target/debug/examples/uploader_trace rust/target/debug/examples/uploader_log_fault rust/target/debug/openpilot-logmessaged
        > "$UPLOADER_SIBLING_PROOF/binaries.before.sha256"

        cp "$RUNNER_TEMP/uploader-sibling-params/commands.json" "$UPLOADER_SIBLING_PROOF/params-commands.json"

        cp "$RUNNER_TEMP/uploader-sibling-params/provenance.json" "$UPLOADER_SIBLING_PROOF/params-provenance.json"

        '
    - name: Run all new original controller scopes and capture Python-only expected lanes
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''CAPTURE'' > "$UPLOADER_SIBLING_PROOF/capture_original_siblings.py"

        

        CAPTURE

        base64 --decode <<''PINS'' > "$UPLOADER_SIBLING_PROOF/source-pins.json"

        

        PINS

        printf ''e2e2f0c8cb764f89afbb3769ad499e859cc0c3b8481a60148f865f7d8a62a6ca  %s/capture_original_siblings.py

        '' "$UPLOADER_SIBLING_PROOF" | sha256sum --check --strict

        printf ''375e4a2597d335422c2e0cb82de644950479c271c631d393fe0301c5083d7c06  %s/source-pins.json

        '' "$UPLOADER_SIBLING_PROOF" | sha256sum --check --strict

        bindings=("$RUNNER_TEMP"/uploader-sibling-params/params_pyx*.so)

        test "${#bindings[@]}" = 1

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        timeout --signal=TERM --kill-after=10s 1200s python "$UPLOADER_SIBLING_PROOF/capture_original_siblings.py" --root
        "$GITHUB_WORKSPACE" --binary "$UPLOADER_SIBLING_PROOF/bin/openpilot-uploader" --interrupted "$UPLOADER_SIBLING_PROOF/bin/uploader-send-interrupted"
        --trace "$GITHUB_WORKSPACE/rust/target/debug/examples/uploader_trace" --fault "$GITHUB_WORKSPACE/rust/target/debug/examples/uploader_log_fault"
        --collector "$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged" --binding "${bindings[0]}" --pins "$UPLOADER_SIBLING_PROOF/source-pins.json"
        --output "$UPLOADER_SIBLING_PROOF/observations" > "$UPLOADER_SIBLING_PROOF/capture.stdout" 2> "$UPLOADER_SIBLING_PROOF/capture.stderr"

        sha256sum --check --strict "$UPLOADER_SIBLING_PROOF/binaries.before.sha256" > "$UPLOADER_SIBLING_PROOF/binaries.after.txt"

        python -m pip freeze > "$UPLOADER_SIBLING_PROOF/providers.after.txt"

        cmp "$UPLOADER_SIBLING_PROOF/providers.before.txt" "$UPLOADER_SIBLING_PROOF/providers.after.txt"

        '
    - name: Exclude private keys and build products from bounded evidence
      if: always()
      shell: bash
      run: "set -euo pipefail\nif [ -d \"$UPLOADER_SIBLING_PROOF/observations\" ]; then\n  find \"$UPLOADER_SIBLING_PROOF/observations\"\
        \ -type f \\( -name id_rsa -o -name id_ecdsa \\) -delete\nfi\nrm -rf \"$UPLOADER_SIBLING_PROOF/bin\" \"$UPLOADER_SIBLING_PROOF/send-wrap.o\"\
        \n"
    - name: Retain original assertions, raw HTTP/log packets and Python source observations
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: uploader-sibling-original-296
        path: ${{ runner.temp }}/uploader-sibling-original-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
