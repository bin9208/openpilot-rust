name: Native input cache across private jobs
on:
  push:
    branches: ['codex/feat-599-*', dev, main]
    paths:
      - '.github/actions/native-cache/**'
      - '.github/actions/job-temp/action.yml'
      - 'tools/ci/native_cache.py'
      - 'tools/ci/runner_download_cache.py'
      - 'tools/ci/runner_action_cache.py'
      - 'tools/ci/action-archives.json'
      - 'tools/ci/native-apt-shell'
      - 'tools/ci/tests/test_native_cache.py'
      - 'tools/ci/tests/test_runner_download_cache.py'
      - '.github/workflows/native-cache-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-cache-reuse-${{ github.ref }}-parallel-v2
  queue: max
  cancel-in-progress: false
jobs:
  save:
    name: Save from the first private job
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: ./.github/actions/job-temp
      - uses: actions/setup-python@v6
        with: {python-version: '3.12.14'}
      - run: python -m pip install PyYAML==6.0.2
      - name: Exercise archive, cancellation and ownership regressions
        run: |
          /usr/bin/python3 -I -B -S -m unittest discover -s tools/ci/tests -p test_native_cache.py -v
          /usr/bin/python3 -I -B -S -m unittest discover -s tools/ci/tests -p test_runner_download_cache.py -v
          python -m unittest discover -s tools/ci/tests -p test_cargo_target_view.py -v
          python -m unittest discover -s tools/ci/tests -p test_workflow_policy.py -v
          python -m unittest discover -s tools/ci/tests -p test_local_native_workflows.py -v
      - name: Retain signed APT indices for the next independent job
        run: sudo apt-get update
      - uses: ./.github/actions/native-cache
        id: initial
        with:
          mode: restore
          name: native-cache-fixture
          key: native-cache-proof-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Create an independently known small input in this private job
        env:
          CACHE_HIT: ${{ steps.initial.outputs.cache-hit }}
        run: |
          /usr/bin/python3 -I -B -S - <<'PY'
          import json, os
          from pathlib import Path
          assert os.environ['CACHE_HIT'] != 'true'
          job = Path(os.environ['CI_JOB_TEMP'])
          target = job/'native-cache-fixture'
          target.mkdir()
          (target/'blob').write_bytes(b'native Actions cache fixture\n')
          (target/'blob').chmod(0o444)
          (target/'origin.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'], job=str(job))))
          PY
      - uses: ./.github/actions/native-cache
        with:
          mode: save
          name: native-cache-fixture
          key: native-cache-proof-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
  restore:
    name: Restore into a different private job
    needs: save
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/job-temp
      - name: Require real APT index reuse while revalidating the repository
        env:
          LC_ALL: C
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee "$CI_JOB_TEMP/apt-reuse.log"
          /usr/bin/python3 -I -B -S - <<'PY'
          import os
          from pathlib import Path
          assert 'Hit:' in (Path(os.environ['CI_JOB_TEMP'])/'apt-reuse.log').read_text()
          PY
      - uses: ./.github/actions/native-cache
        id: repeated
        with:
          mode: restore
          name: native-cache-fixture
          key: native-cache-proof-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require a real cache hit and exact body at the new private path
        env:
          CACHE_HIT: ${{ steps.repeated.outputs.cache-hit }}
        run: |
          /usr/bin/python3 -I -B -S - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          assert os.environ['CACHE_HIT'] == 'true'
          job = Path(os.environ['CI_JOB_TEMP'])
          target = job/'native-cache-fixture'
          origin = json.loads((target/'origin.json').read_text())
          assert origin['job'] != str(job) and origin['source'] == os.environ['GITHUB_SHA']
          assert (target/'blob').read_bytes() == b'native Actions cache fixture\n'
          assert not (Path(os.environ['GITHUB_WORKSPACE'])/'.analysis/native-ci-cache/native-cache-fixture').exists()
          report = dict(schema=1, source_commit=os.environ['GITHUB_SHA'], exact_cache_hit=True,
              first_job=origin['job'], second_job=str(job), asset_origin_transferred_bytes=0,
              body_sha256=hashlib.sha256((target/'blob').read_bytes()).hexdigest(),
              cache_backend='runner-local', cache_service_transferred_bytes=0,
              private_outputs_preserved=True, source_pin_validation_unchanged=True)
          (job/'cache-reuse.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: native-cache-reuse-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_JOB_TEMP }}/cache-reuse.json
            ${{ env.CI_JOB_TEMP }}/apt-reuse.log
            ${{ env.CI_JOB_TEMP }}/native-apt-sources.json
          if-no-files-found: error
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
