name: 296 bounded native fault-builder restoration diagnosis
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driving-fault-builder-diagnostic-296-once.yml
permissions:
  contents: read
jobs:
  fault-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ce59159439648dddbe59904205bff97520904731
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ce59159439648dddbe59904205bff97520904731
        persist-credentials: false
    - name: Diagnose only native private-target plain-fault-plain builds
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-fault-builder-diagnostic"

        mkdir -p "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 24576

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        sudo apt-get update

        sudo apt-get install -y clang g++ libllvm18 liblzma-dev capnproto libcapnp-dev binutils

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --bin build-driving-logging-fault
        --locked > "$proof/controller-build.log" 2>&1

        base64 --decode <<''CARGO_OBSERVER_BASE64'' > "$proof/cargo-observer"

        

        CARGO_OBSERVER_BASE64

        printf ''%s  %s\n'' 462f7e1382e101b20bd189968c20b31086c0ec678efaafd36a2de08b74927c5d "$proof/cargo-observer" | sha256sum
        -c -

        chmod 755 "$proof/cargo-observer"

        export DIAGNOSTIC_REAL_CARGO="$(command -v cargo)"

        export DIAGNOSTIC_OUTPUT="$proof"

        # Only diagnostic logging is added; exact Cargo argv and original status are forwarded.

        export CARGO_LOG=cargo::core::compiler::fingerprint=info

        export CARGO_TERM_VERBOSE=true

        sha256sum rust/Cargo.toml rust/Cargo.lock rust/crates/dev-tools/src/driving_logging_fault_build.rs rust/crates/logging/build.rs
        rust/tools/model_logging_fault.cc > "$proof/source-inputs.sha256"

        set +e

        rust/target/debug/build-driving-logging-fault --root "$GITHUB_WORKSPACE" --output "$proof/native-builder" --cargo
        "$proof/cargo-observer" --compiler "$(command -v c++)" 2>&1 | tee "$proof/native-builder.log"

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > "$proof/native-builder-status.txt"

        sha256sum -c "$proof/source-inputs.sha256"

        exit "$status"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driving-fault-builder-diagnostic-296
        if-no-files-found: error
        path: '${{ runner.temp }}/driving-fault-builder-diagnostic/

          !${{ runner.temp }}/driving-fault-builder-diagnostic/native-builder/target/**

          '
