    steps:
    - uses: actions/checkout@v7
      with:
        ref: 40eb0429013cd853c1e74dc9530cdb5f484aa32c
        persist-credentials: false
    - name: Admit native source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        export JP2_BASE="$RUNNER_TEMP/changed-files-jp2-native-296"

        printf ''JP2_BASE=%s\n'' "$JP2_BASE" >> "$GITHUB_ENV"

        printf ''JP2_ORIGINAL_DIR=%s/original\n'' "$JP2_BASE" >> "$GITHUB_ENV"

        printf ''JP2_PRIOR_ORIGINAL_DIR=%s/prior-original\n'' "$JP2_BASE" >> "$GITHUB_ENV"

        printf ''JP2_NATIVE_OUTPUT=%s/actual\n'' "$JP2_BASE" >> "$GITHUB_ENV"

        mkdir "$JP2_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$JP2_BASE/source.txt"

        git status --porcelain=v1 > "$JP2_BASE/source-status.before.txt"

        test ! -s "$JP2_BASE/source-status.before.txt"

        sha256sum rust/Cargo.lock > "$JP2_BASE/lock.input.sha256"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$JP2_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 > "$JP2_BASE/native-packages.txt"

        '
