name: 296 native Python312 AST and changed-path differential
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 1cc88538d7190501f442e42b30bf0e47fb4ac72b
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 1cc88538d7190501f442e42b30bf0e47fb4ac72b
        persist-credentials: false
    - name: Reserve capacity and record exact native providers
      shell: bash
      run: 'set -euo pipefail

        export AST_BASE="$RUNNER_TEMP/changed-files-native-296"

        printf ''AST_BASE=%s\n'' "$AST_BASE" >> "$GITHUB_ENV"

        mkdir "$AST_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$AST_BASE/source.txt"

        git status --porcelain=v1 > "$AST_BASE/source-status.before.txt"

        test ! -s "$AST_BASE/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5 strace

        rustc +1.94.0 -Vv > "$AST_BASE/rustc.txt"

        cargo +1.94.0 -Vv > "$AST_BASE/cargo.txt"

        git --version > "$AST_BASE/git-provider.txt"

        git --exec-path > "$AST_BASE/git-exec-path.txt"

        dpkg-query -W libc6 libc-bin > "$AST_BASE/native-codec-packages.txt"

        '
    - name: Reuse accepted original72rows and12Git observations
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 32

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12434037946/zip > "$AST_BASE/original.zip"

        base64 --decode <<''INERT'' > "$AST_BASE/hosted_native_AST_default.py"

        

        INERT

        printf ''5ba3ddf625fcb3a11a905edd4f6688b11b3f0b9ca3bd0a5201243f91ad286f52  %s/hosted_native_AST_default.py\n'' "$AST_BASE"
        | sha256sum --check --strict

        python3 "$AST_BASE/hosted_native_AST_default.py" admit

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build and strictly check the native opt-in AST adapter
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --bin check-changed-files > "$AST_BASE/build.stdout" 2> "$AST_BASE/build.stderr"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --bin check-changed-files --test changed_files_check -- -D warnings > "$AST_BASE/clippy.stdout"
        2> "$AST_BASE/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --test changed_files_check --no-run --message-format=json > "$AST_BASE/tests-build.jsonl" 2>
        "$AST_BASE/tests-build.stderr"

        cargo +1.94.0 check --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --lib >
        "$AST_BASE/no-default.stdout" 2> "$AST_BASE/no-default.stderr"

        ldd rust/target/debug/check-changed-files > "$AST_BASE/native-libraries.txt"

        cargo +1.94.0 check --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib --message-format=json >
        "$AST_BASE/default.jsonl" 2> "$AST_BASE/default.stderr"

        python3 "$AST_BASE/hosted_native_AST_default.py" discover

        '
    - name: Run actual native byte AST Git and all-scalar differential
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 128

        mkdir "$AST_BASE/native-path"

        ln -s /usr/bin/git "$AST_BASE/native-path/git"

        /usr/bin/timeout --signal=TERM --kill-after=10s 240s /usr/bin/strace -f -e trace=execve,execveat -s 4096 -o "$AST_BASE/native.execve"
        /usr/bin/env AST_ORIGINAL_DIR="$AST_BASE/original" AST_PROOF="$AST_BASE/actual" PATH="$AST_BASE/native-path" "$AST_TEST_EXE"
        --test-threads=1 --nocapture > "$AST_BASE/native.stdout" 2> "$AST_BASE/native.stderr"

        git status --porcelain=v1 > "$AST_BASE/source-status.after.txt"

        python3 "$AST_BASE/hosted_native_AST_default.py" finish

        du -sm "$AST_BASE" > "$AST_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$AST_BASE/artifact-size-mib.txt")" -le 64

        '
    - name: Preserve actual native failures and independent comparisons
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-native-296
        path: ${{ runner.temp }}/changed-files-native-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
