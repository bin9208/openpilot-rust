name: One-time original updated overlay fixture capture 296
permissions:
  contents: read
jobs:
  original-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ce145d062ad24f71da3e49e9b8b4fc676b35ef41
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Capture unchanged original shim outcomes
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = ce145d062ad24f71da3e49e9b8b4fc676b35ef41

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        git show "$GITHUB_SHA:.github/workflows/capture_updated_overlay_original.py" > "$RUNNER_TEMP/capture_updated_overlay_original.py"

        UPDATED_ORIGINAL_SOURCE_COMMIT=ce145d062ad24f71da3e49e9b8b4fc676b35ef41 python -P "$RUNNER_TEMP/capture_updated_overlay_original.py"
        "$RUNNER_TEMP/updated-overlay-original"

        cd "$RUNNER_TEMP/updated-overlay-original"

        sha256sum -c original-overlay.sha256

        '
    - name: Preserve full original command, raw JSONL and filesystem receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: updated-overlay-original-${{ github.sha }}
        path: ${{ runner.temp }}/updated-overlay-original/
        if-no-files-found: error
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-overlay-original-once.yml
