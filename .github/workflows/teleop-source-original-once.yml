name: Teleop source-only version observations once
permissions:
  contents: read
jobs:
  source-observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONINTMAXSTRDIGITS: '4300'
      PYTHONIOENCODING: utf-8:surrogateescape
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: c810f7159ccecde0826e51c1ccc6364d0081cd8e
        fetch-depth: 1
        persist-credentials: false
    - name: Capture original computations and isolated script effects
      shell: bash
      run: 'set -euo pipefail

        df -h .

        test "$(df -B1 --output=avail . | tail -1 | tr -d '' '')" -ge 26843545600

        echo ''''
        | base64 -d > "$RUNNER_TEMP/capture-original-teleop.py"

        echo ''8c4b4a8c3077ca82c5f52ad65b0df9f40a0abc6da36053d56ec8bc06294f5fbf  ''"$RUNNER_TEMP/capture-original-teleop.py"
        | sha256sum -c -

        python3 -m py_compile "$RUNNER_TEMP/capture-original-teleop.py"

        python3 "$RUNNER_TEMP/capture-original-teleop.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/teleop-original"

        sha256sum "$RUNNER_TEMP/teleop-original/manifest.json" | tee "$RUNNER_TEMP/teleop-original-manifest.sha256"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: teleop-original-source-only
        path: '${{ runner.temp }}/teleop-original/

          ${{ runner.temp }}/teleop-original-manifest.sha256

          '
        if-no-files-found: error
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/teleop-source-original-once.yml
