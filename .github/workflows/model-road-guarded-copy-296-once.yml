name: 296 diagnostic-only general guarded-copy kernel92 experiment
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-road-guarded-copy-296-once.yml
permissions:
  contents: read
jobs:
  driver-first-kernel-diagnostic:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample:
        - 0
        - 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: defb9011df3fca924dca41a703b48ce5ff0c51e0
      DIAGNOSTIC_SAMPLE: ${{ matrix.sample }}
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      CPU_COUNT: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DIAGNOSTIC_ATTEMPT: 20261022-road-general-guarded-copy-01
    steps:
    - uses: actions/checkout@v7
      with:
        ref: defb9011df3fca924dca41a703b48ce5ff0c51e0
        persist-credentials: false
    - name: Record natural host and observed AVX512 eligibility only
      id: cpu
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-kernel92-296\"\nmkdir \"$proof\"\nlscpu --json > \"$proof/early-cpu.json\"\
        \ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nif awk '/^flags/{n++;\
        \ if ($0 !~ / avx512f / || $0 !~ / avx512vl / || $0 !~ / avx512bw / || $0 !~ / avx512dq /) bad=1} END{exit(n==0 ||\
        \ bad)}' /proc/cpuinfo; then\n printf 'eligible=true\n' >> \"$GITHUB_OUTPUT\"\nelse\n printf 'eligible=false\n' >>\
        \ \"$GITHUB_OUTPUT\"\n printf '%s\n' '{\"result\":\"SKIPPED_OBSERVED_AVX512_REQUIREMENTS_UNAVAILABLE\",\"comparison_executed\"\
        :false,\"diagnostic_only\":true,\"retirement_acceptance\":false}' > \"$proof/skip.json\"\nfi\n"
    - name: Reserve hosted capacity and install bounded native prerequisites
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 12288

        mkdir -p "$RUNNER_TEMP/model-road-kernel92-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends gdb g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev
        libzmq3-dev jq

        rustup toolchain install 1.94.0 --profile minimal

        '
      if: steps.cpu.outputs.eligible == 'true'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
      if: steps.cpu.outputs.eligible == 'true'
    - name: Record stdlib-only Python environment
      shell: bash
      run: 'set -euo pipefail

        python -m pip freeze > "$RUNNER_TEMP/model-road-kernel92-296/providers.before.txt"

        '
      if: steps.cpu.outputs.eligible == 'true'
    - name: Build actual native model-run only
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-kernel92-296"

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run > "$proof/model-run-build.log"
        2>&1

        '
      if: steps.cpu.outputs.eligible == 'true'
    - name: Record actual hosted CPU and Rust toolchain profile
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-kernel92-296"

        lscpu --json > "$proof/cpu-profile.json"

        cat /proc/cpuinfo > "$proof/proc-cpuinfo.txt"

        rustc -vV > "$proof/rustc-version.txt"

        uname -a > "$proof/uname.txt"

        '
      if: steps.cpu.outputs.eligible == 'true'
    - name: Extract only sealed PKL, native graph and exact first-frame data; no image regeneration
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-kernel92-296\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 4096\nlscpu --json > \"$proof/actual-cpu.json\"\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12401158574/zip\
        \ > \"$proof/input.zip\"\ntest \"$(stat -c %s \"$proof/input.zip\")\" -eq 173295774\nprintf '2ff2e33434f661e7d412751ea45be7d17bf683603cf566f5a48c319c16f6747d\
        \  %s/input.zip\\n' \"$proof\" | sha256sum --check --strict\npython - <<'EXTRACT'\nimport os,zipfile,tarfile,stat,hashlib,json\n\
        from pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'model-road-kernel92-296';dest=p/'artifact';dest.mkdir();fixture=p/'fixture';fixture.mkdir();total=0\n\
        archive=Path(os.environ['GITHUB_WORKSPACE'])/'rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz'\n\
        with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe'\n\
        assert archive.stat().st_size==59663776\nneeded={'fixture.json','models/driving_tinygrad.pkl','observations/manifest.json','observations/1344-dual/inputs/packed-warmup.bin','observations/1344-dual/inputs/packed-0.bin','observations/1344-dual/inputs/main-transform-0.bin','observations/1344-dual/inputs/extra-transform-0.bin','observations/1344-dual/outputs/raw-pred-0.bin'}\n\
        with tarfile.open(archive,mode='r|xz') as t:\n for item in t:\n  name=Path(item.name);assert not name.is_absolute()\
        \ and '..' not in name.parts\n  if item.name not in needed:continue\n  assert item.isfile() and not item.sparse and\
        \ item.size<=80*1024*1024\n  out=fixture/name;out.parent.mkdir(parents=True,exist_ok=True)\n  with t.extractfile(item)\
        \ as source,out.open('xb') as target:\n   remaining=item.size\n   while remaining:\n    b=source.read(min(1024*1024,remaining));assert\
        \ b;target.write(b);remaining-=len(b)\n  needed.remove(item.name)\nassert not needed\nmanifest=json.loads((fixture/'fixture.json').read_bytes())\n\
        assert hashlib.sha256((fixture/'fixture.json').read_bytes()).hexdigest()=='afe1c795d7f609801eb4cd5a5a7748c3c996929403a3c0fa102f232f2a8d248d'\n\
        images={'warmup.bin':'warmup.bin','main-3.bin':'images/main-0.bin','extra-3.bin':'images/extra-0.bin'}\nwith zipfile.ZipFile(p/'input.zip')\
        \ as z:\n assert len(z.infolist())==691 and z.testzip() is None\n for item in z.infolist():\n  name=Path(item.filename);assert\
        \ not name.is_absolute() and '..' not in name.parts\n  image=images.get(name.name) if item.filename.startswith('driving-four-source/retirement/checkout-model/1344-dual/')\
        \ else None\n  if not (item.filename.endswith('/current-host-catalog-receipt.json') or '/driving-1344x760/' in item.filename\
        \ or image):continue\n  assert not item.is_dir() and stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG) and item.file_size<=64*1024*1024\n\
        \  total+=item.file_size;assert total<=104*1024*1024\n  out=(fixture/'observations/1344-dual'/image) if image else\
        \ dest/name\n  out.parent.mkdir(parents=True,exist_ok=True)\n  with out.open('xb') as f:f.write(z.read(item))\nfor\
        \ file in fixture.rglob('*'):\n if file.is_file() and file!=fixture/'fixture.json':\n  pin=manifest['files'][file.relative_to(fixture).as_posix()]\n\
        \  with file.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==pin['sha256']\n  assert file.stat().st_size==pin['bytes']\n\
        EXTRACT\n"
      env:
        GH_TOKEN: ${{ github.token }}
      if: steps.cpu.outputs.eligible == 'true'
    - name: Replay sealed native full graph and identical isolated original/native final kernel
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-kernel92-296\"\ncat > \"$proof/fp-observe.c\" <<'C'\n#include\
        \ <fenv.h>\n#include <stdint.h>\n\n/* Hosted x86-64 observation only. Never changes the floating-point environment.\
        \ */\nuint32_t diagnostic_mxcsr(void) {\n  uint32_t value;\n  __asm__ volatile(\"stmxcsr %0\" : \"=m\"(value));\n\
        \  return value;\n}\n\nint diagnostic_round(void) { return fegetround(); }\nC\ncc -shared -fPIC -O0 -o \"$proof/fp-observe.so\"\
        \ \"$proof/fp-observe.c\" -lm\nsha256sum \"$proof/fp-observe.c\" \"$proof/fp-observe.so\" > \"$proof/fp-observe.sha256\"\
        \nbase64 --decode <<'PAYLOAD' > \"$proof/road_guarded_copy.py\"\\n\
        PAYLOAD\nprintf 'dca119f4ddcdc2ddf64c85347dceef1fae1f28b95b9cfef92794ed8d4e388195  %s/road_guarded_copy.py\\n' \"\
        $proof\" | sha256sum --check\nbase64 --decode <<'PAYLOAD' > \"$proof/watch.py\"\\n\
        PAYLOAD\nprintf 'bd15ac4fe06037fc2719e3224a2443bcca1f6d96987be8fb0d4885253326023c  %s/watch.py\\n' \"$proof\" | sha256sum\
        \ --check --strict\nbase64 --decode <<'PAYLOAD' > \"$proof/road_program_binding.py\"\\n\
        PAYLOAD\nprintf '103fa46fb52b3bbe2aca3caa9c6013c35ef188c993f747b995d91b3bc514b840  %s/road_program_binding.py\\n'\
        \ \"$proof\" | sha256sum --check --strict\nbase64 --decode <<'PAYLOAD' > \"$proof/watch.gdb.py\"\\n\
        PAYLOAD\nprintf '680d476de3ea3402c0361c512cdcf0ec864212dc03a14f09024ed9d97b3d92d7  %s/watch.gdb.py\\n' \"$proof\"\
        \ | sha256sum --check --strict\nbase64 --decode <<'PAYLOAD' > \"$proof/supervise.py\"\\n\
        PAYLOAD\nprintf '8aed07201a6b9b49c23c9af5f59a21f01b7f700cf976800eb4df6f21ca670286  %s/supervise.py\\n' \"$proof\"\
        \ | sha256sum --check --strict\npython \"$proof/road_program_binding.py\" --controls > \"$proof/binding-controls.json\"\
        \nexport MODEL_RUN=\"$GITHUB_WORKSPACE/rust/target/debug/model-run\"\nexport PROBE_PREFLIGHT=\"$proof\" PROBE_OUTPUT=\"\
        $proof/first-kernel\"\nset +e\npython \"$proof/supervise.py\" > \"$proof/supervise.stdout\" 2> \"$proof/supervise.stderr\"\
        \nrc=$?\nset -e\nprintf '%s\\n' \"$rc\" > \"$proof/supervisor.status\"\npython -m pip freeze > \"$proof/providers.after.txt\"\
        \ncmp \"$proof/providers.before.txt\" \"$proof/providers.after.txt\"\ntest \"$rc\" -eq 0 || { tail -n 80 \"$proof/gdb.stderr\"\
        \ \"$proof/gdb.stdout\" \"$proof/supervise.stderr\"; exit \"$rc\"; }\n"
      if: steps.cpu.outputs.eligible == 'true'
    - name: Preserve bounded diagnostic and all input/output evidence
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-road-isolated-kernel92-296-${{ matrix.sample }}
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
        path: '${{ runner.temp }}/model-road-kernel92-296/

          !${{ runner.temp }}/model-road-kernel92-296/fixture/**

          !${{ runner.temp }}/model-road-kernel92-296/artifact/**

          !${{ runner.temp }}/model-road-kernel92-296/input.zip

          '
