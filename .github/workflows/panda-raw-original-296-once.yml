name: 296 original Panda raw output path diagnostic once
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-raw-original-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  original-raw-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: 3e4011cc3b9f62445a04c608f84c0f6badd6e2d3
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 3e4011cc3b9f62445a04c608f84c0f6badd6e2d3
    - name: Admit exact source and Python 3.12
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Reserve disk and install original Panda prerequisites
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ clang libusb-1.0-0-dev libzmq3-dev cmake pkg-config curl

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1 libusb1==3.4.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - name: Build original Panda IPC bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/panda-raw-original"

        mkdir -p "$proof"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$proof/msgq"

        printf ''PYTHONPATH=%s/msgq:%s\n'' "$proof" "$PYTHONPATH" >> "$GITHUB_ENV"

        '
    - name: Build same thirty Panda executables and retain Cargo build messages
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-raw-original\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\ncargo build --manifest-path rust/Cargo.toml \\\n  -p openpilot-pandad -p openpilot-panda-usb\
        \ -p openpilot-panda-spi -p openpilot-panda-spi-linux \\\n  -p openpilot-process-supervision -p openpilot-logmessaged\
        \ -p openpilot-dev-tools \\\n  --features openpilot-dev-tools/pandad-safety-padding-native,openpilot-dev-tools/panda-ci-native\
        \ \\\n  --bins --examples --locked --message-format=json 2> \"$proof/native-build.log\" | tee \"$proof/native-build.jsonl\"\
        \n"
    - name: Run unchanged original with byte-valued non-UTF8 output root
      shell: bash
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 3072\npython -P -c 'import\
        \ msgq.ipc_pyx, usb1; from openpilot.cereal import log; log.Event.new_message()'\npython - <<'CAPTURE'\nimport base64\n\
        import hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\n\nworkspace = Path(os.environ['GITHUB_WORKSPACE'])\n\
        proof = Path(os.environ['RUNNER_TEMP']) / 'panda-raw-original'\noutput = os.fsencode(proof) + b'/oracles-\\xff'\n\
        messages = proof / 'native-build.jsonl'\nbinaries = workspace / 'rust/target/debug'\nchecker = workspace / 'rust/tools/check_pandad_ci.py'\n\
        names = ['openpilot-pandad', 'openpilot-pandad-supervisor', 'openpilot-process-child',\n         'openpilot-logmessaged',\
        \ 'stage-json11', 'build-pandad-protocol-source',\n         'build-pandad-peripheral-source', 'build-pandad-spi-source',\n\
        \         'build-pandad-usb-source', 'build-pandad-runtime-fixture',\n         'build-pandad-runtime-source', 'build-pandad-firmware-spi-fixture',\n\
        \         'check-pandad-safety-padding']\nexamples = ['panda_protocol', 'panda_safety', 'device', 'state', 'can_io',\n\
        \            'peripheral', 'firmware', 'firmware_client', 'firmware_spi',\n            'supervisor', 'supervisor_native',\
        \ 'dfu_recovery', 'usb_policy',\n            'spi_policy', 'usb_fixture', 'raw_fixture', 'spi_fixture']\npaths = [binaries\
        \ / name for name in names] + [binaries / 'examples' / name for name in examples]\nassert len(paths) == 30 and len(set(paths))\
        \ == 30\ndef sha(path):\n  h = hashlib.sha256()\n  with open(path, 'rb') as stream:\n    for chunk in iter(lambda:\
        \ stream.read(1024 * 1024), b''):\n      h.update(chunk)\n  return h.hexdigest()\nseals = {str(path.relative_to(workspace)):\
        \ sha(path) for path in paths}\nsource_sha = sha(checker)\nmessages_sha = sha(messages)\nargv = [os.fsencode(sys.executable),\
        \ os.fsencode(checker), b'--binaries',\n        os.fsencode(binaries), b'--build-messages', os.fsencode(messages),\n\
        \        b'--output', output]\nresult = subprocess.run(argv, cwd=os.fsencode(workspace), capture_output=True,\n  \
        \                      check=False, timeout=2400)\n(proof / 'original.stdout').write_bytes(result.stdout)\n(proof\
        \ / 'original.stderr').write_bytes(result.stderr)\nassert seals == {str(path.relative_to(workspace)): sha(path) for\
        \ path in paths}, 'held ELF changed'\nassert source_sha == sha(checker) and messages_sha == sha(messages), 'source\
        \ or messages changed'\ndef b64(value):\n  return base64.b64encode(value).decode('ascii')\nentries = []\nif os.path.isdir(output):\n\
        \  for directory, dirs, files in os.walk(output, followlinks=False):\n    for name in sorted(dirs + files):\n    \
        \  path = os.path.join(directory, name)\n      row = {'relative_path_b64': b64(os.path.relpath(path, output))}\n \
        \     if os.path.islink(path):\n        row['type'] = 'symlink'\n        row['target_b64'] = b64(os.readlink(path))\n\
        \      elif os.path.isfile(path):\n        row.update(type='file', size=os.stat(path).st_size, sha256=sha(path))\n\
        \      elif os.path.isdir(path):\n        row['type'] = 'directory'\n      else:\n        row['type'] = 'other'\n\
        \      entries.append(row)\ncommand_dir = output + b'/commands'\ncommands = []\nif os.path.isdir(command_dir):\n \
        \ for name in sorted(os.listdir(command_dir)):\n    if name.endswith(b'.exit.json'):\n      with open(os.path.join(command_dir,\
        \ name), 'rb') as stream:\n        receipt = json.load(stream)\n      commands.append({'name_b64': b64(name.removesuffix(b'.exit.json')),\n\
        \                       'returncode': receipt['returncode']})\nmanifest = {\n  'source_commit': os.environ['EXPECTED_SOURCE'],\
        \ 'checker_sha256': source_sha,\n  'build_messages_sha256': messages_sha, 'executable_sha256': seals,\n  'argv_b64':\
        \ [b64(arg) for arg in argv], 'output_path_b64': b64(output),\n  'exit': result.returncode, 'stdout_sha256': sha(proof\
        \ / 'original.stdout'),\n  'stderr_sha256': sha(proof / 'original.stderr'),\n  'output_exists': os.path.lexists(output),\
        \ 'entries': entries,\n  'result_exists': os.path.isfile(output + b'/result.json'),\n  'invocation_exists': os.path.isfile(output\
        \ + b'/invocation.json'),\n  'commands': commands,\n  'pass_lines': [line for line in result.stdout.decode('utf-8',\
        \ errors='replace').splitlines()\n                 if line.startswith('PASS ')],\n}\n(proof / 'raw-original.json').write_text(json.dumps(manifest,\
        \ indent=2) + '\\n')\nprint(json.dumps({'exit': result.returncode, 'output_exists': manifest['output_exists'],\n \
        \                 'result_exists': manifest['result_exists'], 'entry_count': len(entries)}))\nCAPTURE\n"
    - name: Preserve original raw-byte output tree
      if: always()
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-raw-original\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\npython - <<'ARCHIVE'\nimport hashlib, os, subprocess\nfrom pathlib import Path\nproof = Path(os.environ['RUNNER_TEMP'])\
        \ / 'panda-raw-original'\nsource = os.fsencode(proof) + b'/oracles-\\xff'\nif os.path.isdir(source):\n  target = proof\
        \ / 'raw-original.tar'\n  subprocess.run([b'tar', b'--format=gnu', b'-C', os.fsencode(proof),\n                  b'-cf',\
        \ os.fsencode(target), b'--', b'oracles-\\xff'], check=True, timeout=300)\n  print('raw-original.tar sha256', hashlib.sha256(target.read_bytes()).hexdigest())\n\
        ARCHIVE\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: panda-raw-original-diagnostic
        path: '${{ runner.temp }}/panda-raw-original/raw-original.json

          ${{ runner.temp }}/panda-raw-original/raw-original.tar

          ${{ runner.temp }}/panda-raw-original/original.stdout

          ${{ runner.temp }}/panda-raw-original/original.stderr

          ${{ runner.temp }}/panda-raw-original/native-build.jsonl

          ${{ runner.temp }}/panda-raw-original/native-build.log

          '
        if-no-files-found: error
        retention-days: 7
    - name: Require complete original result after retaining evidence
      run: 'python - <<''GATE''

        import json, os

        from pathlib import Path

        proof = Path(os.environ[''RUNNER_TEMP'']) / ''panda-raw-original''

        result = json.loads((proof / ''raw-original.json'').read_text())

        assert result[''exit''] == 0 and result[''result_exists''] and result[''invocation_exists''], result

        GATE

        '
