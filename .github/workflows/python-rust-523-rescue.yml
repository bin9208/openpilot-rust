name: Python Rust 523 exact shared target emergency rescue
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-rescue.yml
permissions:
  contents: read
concurrency:
  group: python-rust-523-exact-shared-target-rescue
  cancel-in-progress: false
  queue: max
jobs:
  rescue:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 12
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      working-directory: /
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        set -euo pipefail
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_REF" = refs/heads/codex/feat-523-python-rust
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        test "$(uname -m)" = x86_64
    - name: Refuse live or unknown references then remove only the literal shared target
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: /
      run: |
        set -uo pipefail
        # checkout/download/upload/별도 evidence 파일이 없는 응급 후보다. 로컬 실행 금지.
        # 과거 build 삭제 허가만 사용한다. 현재 private source/target/SDK는 namespace 밖이다.
        /usr/bin/sudo -n /usr/bin/timeout --signal=TERM --kill-after=10s 10m \
          /usr/bin/python3 -I -B -S - \
          "$GITHUB_REPOSITORY" "$GITHUB_EVENT_NAME" "$GITHUB_REF" \
          "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" \
          "$GITHUB_ACTIONS" "$GITHUB_SHA" "$(/usr/bin/id -u)" 2>/dev/null <<'RESCUE'
        import hashlib
        import json
        import os
        import pwd
        import re
        import resource
        import signal
        import stat
        import subprocess
        import sys
        import time

        SOURCE = '/home/actions/actions-runner/_work/openpilot-rust/openpilot-rust'
        TARGET = '/home/actions/actions-runner/_work/openpilot-rust/openpilot-rust/rust/target'
        ODIR = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
        result = {'schema': 'openpilot.exact-shared-target-rescue.v1', 'pass': False,
                  'target': TARGET, 'deletion_attempted': False, 'rm_exit': None,
                  'content_hashes_computed': 0, 'other_roots_authorized': 0}
        held = []
        child = None
        deadline = time.monotonic() + 540
        inodes = set()

        def require(ok, reason):
            if not ok:
                raise RuntimeError(reason)

        def tick():
            require(time.monotonic() < deadline, 'metadata-deadline')

        def identity(s):
            return (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid)

        def metadata(s):
            return identity(s) + (s.st_size, s.st_nlink, s.st_mtime_ns, s.st_ctime_ns)

        def capacity():
            # df와 같은 statvfs의 available bytes/inodes. 별도 프로세스/출력 파일을 만들지 않는다.
            s = os.statvfs(SOURCE)
            return {'available_bytes': s.f_bavail * s.f_frsize,
                    'available_inodes': s.f_favail, 'free_bytes': s.f_bfree * s.f_frsize,
                    'free_inodes': s.f_ffree}

        def mount_roster():
            with open('/proc/self/mountinfo', 'rb') as stream:
                raw = stream.read(4 * 1024 * 1024 + 1)
            require(len(raw) <= 4 * 1024 * 1024 and raw.endswith(b'\n'), 'mountinfo-bound')
            for line in raw.splitlines():
                fields = line.split()
                require(len(fields) >= 10 and b'-' in fields[6:], 'mountinfo-format')
                path = re.sub(rb'\\([0-7]{3})', lambda m: bytes([int(m[1], 8)]), fields[4])
                require(not (path == os.fsencode(TARGET) or path.startswith(os.fsencode(TARGET) + b'/')),
                        'mount-inside-target')
            return raw

        def verify_roots():
            for path, fd, expected in held:
                require(identity(os.fstat(fd)) == expected == identity(os.lstat(path)),
                        'held-root-identity-changed')
                require(os.path.realpath(path, strict=True) == path, 'root-became-symlink')

        def tree_snapshot():
            found = set()
            counts = {'directories': 0, 'regular_paths': 0, 'symlinks': 0,
                      'unique_inodes': 0, 'unique_allocated_bytes': 0}
            digest = hashlib.sha256()

            def walk(fd, relative, depth):
                tick()
                require(depth <= 128, 'tree-depth-bound')
                with os.scandir(fd) as entries:
                    names = sorted(entry.name for entry in entries)
                require(len(names) <= 131072, 'directory-entry-bound')
                for name in names:
                    tick()
                    s = os.stat(name, dir_fd=fd, follow_symlinks=False)
                    require(s.st_dev == device and s.st_uid == owner, 'tree-device-or-owner')
                    path = relative + b'/' + os.fsencode(name)
                    digest.update(len(path).to_bytes(8, 'little') + path + repr(metadata(s)).encode('ascii'))
                    if s.st_ino not in found:
                        found.add(s.st_ino)
                        require(len(found) <= 524288, 'inode-memory-bound')
                        counts['unique_allocated_bytes'] += s.st_blocks * 512
                    if stat.S_ISDIR(s.st_mode):
                        counts['directories'] += 1
                        sub = os.open(name, ODIR, dir_fd=fd)
                        try:
                            require(metadata(os.fstat(sub)) == metadata(s), 'directory-open-race')
                            walk(sub, path, depth + 1)
                            require(metadata(os.fstat(sub)) == metadata(s), 'directory-mutated')
                        finally:
                            os.close(sub)
                    elif stat.S_ISREG(s.st_mode):
                        counts['regular_paths'] += 1
                    elif stat.S_ISLNK(s.st_mode):
                        counts['symlinks'] += 1  # link 자체만 unlink하며 목적지를 읽지 않는다.
                    else:
                        raise RuntimeError('special-file-in-target')
                    require(sum(counts[k] for k in ('directories', 'regular_paths', 'symlinks')) <= 1048576,
                            'tree-entry-bound')
            root_stat = os.fstat(root_fd)
            found.add(root_stat.st_ino)
            counts['directories'] = 1
            counts['unique_allocated_bytes'] = root_stat.st_blocks * 512
            walk(root_fd, b'', 0)
            require(metadata(os.fstat(root_fd)) == metadata(root_stat), 'target-mutated')
            counts['unique_inodes'] = len(found)
            return found, counts, digest.digest(), metadata(root_stat)

        compiler = re.compile(r'(?:.*-)?(?:cargo(?:-zigbuild)?|cargo-clippy|clippy-driver|rustc|rustdoc|gcc|g\+\+|cc|c\+\+|cc1|cc1plus|'
                              r'clang(?:\+\+)?|ld(?:\.lld|\.gold|\.bfd)?|lld|ar|ranlib|zig|lto1|lto-wrapper|'
                              r'collect2|cmake|ninja|make)(?:-[0-9.]+)?\Z')

        def process_stat(base):
            with open(base + '/stat', 'rb') as stream:
                raw = stream.read(16385)
            require(len(raw) <= 16384, 'proc-stat-bound')
            head, tail = raw.rsplit(b') ', 1)
            fields = tail.split()
            require(len(fields) >= 20 and fields[19].isdigit(), 'proc-stat-format')
            return fields[19], fields[0], int(fields[6]), os.fsdecode(head.split(b'(', 1)[1])

        def reference(value, dev, ino):
            value = value.removesuffix(' (deleted)')
            require(not (value == TARGET or value.startswith(TARGET + '/') or
                         (dev == device and ino in inodes)), 'live-target-reference')

        def scan_processes(label):
            checked = tasks = fds = maps = exited = 0
            with os.scandir('/proc') as entries:
                pids = sorted(entry.name for entry in entries if entry.name.isdecimal())
            require(len(pids) <= 32768, 'process-count-bound')
            for pid in pids:
                tick()
                if int(pid) == os.getpid():
                    continue  # 유일한 제외. 자기 held directory FD는 target을 참조한다.
                base = '/proc/' + pid
                try:
                    first = process_stat(base)
                except FileNotFoundError:
                    require(not os.path.lexists(base), 'unknown-live-process-stat')
                    exited += 1
                    continue
                try:
                    with os.scandir(base + '/task') as entries:
                        tids = sorted(entry.name for entry in entries if entry.name.isdecimal())
                    require(tids, 'empty-live-task-roster')
                    for tid in tids:
                        tick()
                        task = base + '/task/' + tid
                        current = process_stat(task)
                        require(not compiler.fullmatch(current[3]), 'active-compiler')
                        for kind in ('cwd', 'exe'):
                            link = task + '/' + kind
                            try:
                                value = os.readlink(link)
                                s = os.stat(link)
                            except FileNotFoundError:
                                # zombie/kernel thread의 없는 user exe/cwd만 구분한다. live user는 unknown 거부.
                                require(current[1] in (b'Z', b'X') or current[2] & 0x00200000,
                                        'unknown-live-cwd-or-exe')
                                continue
                            reference(value, s.st_dev, s.st_ino)
                            if kind == 'exe':
                                require(not compiler.fullmatch(os.path.basename(value.removesuffix(' (deleted)'))),
                                        'active-compiler-exe')
                        with os.scandir(task + '/fd') as entries:
                            numbers = [entry.name for entry in entries]
                        require(all(n.isdecimal() for n in numbers), 'proc-fd-format')
                        for number in numbers:
                            link = task + '/fd/' + number
                            # 살아 있는 process의 FD 닫힘 경합도 unknown으로 삭제를 거부한다.
                            value = os.readlink(link)
                            s = os.stat(link)
                            reference(value, s.st_dev, s.st_ino)
                            fds += 1
                            require(fds <= 1048576, 'proc-fd-bound')
                        with open(task + '/maps', 'rb') as stream:
                            for line in stream:
                                require(len(line) <= 1048576 and line.endswith(b'\n'), 'proc-map-line-bound')
                                fields = line.split(None, 5)
                                require(len(fields) >= 5 and fields[4].isdigit() and
                                        re.fullmatch(rb'[0-9a-fA-F]+:[0-9a-fA-F]+', fields[3]), 'proc-map-format')
                                major, minor = (int(x, 16) for x in fields[3].split(b':'))
                                name = os.fsdecode(fields[5].rstrip(b'\n')) if len(fields) == 6 else ''
                                reference(name, os.makedev(major, minor), int(fields[4]))
                                maps += 1
                                require(maps <= 2097152, 'proc-map-bound')
                        require(process_stat(task)[:1] == current[:1], 'task-replaced-during-scan')
                        tasks += 1
                        require(tasks <= 131072, 'task-count-bound')
                    require(process_stat(base)[:1] == first[:1], 'process-replaced-during-scan')
                    checked += 1
                except (FileNotFoundError, ProcessLookupError):
                    # PID 자체의 소멸이 확인된 경우에만 종료로 센다.
                    require(not os.path.lexists(base), 'unknown-live-process-race')
                    exited += 1
            result[label] = {'processes': checked, 'tasks': tasks, 'fds': fds,
                             'map_rows': maps, 'confirmed_exited': exited, 'unknown': 0}

        def stop_child():
            if child is not None and child.poll() is None:
                # 자기 unreaped Popen leader의 PGID만 신호한다. 성공 wait 뒤에는 신호하지 않는다.
                os.killpg(child.pid, signal.SIGKILL)
                child.wait(timeout=5)

        def interrupted(number, frame):
            raise RuntimeError('signal-' + str(number))

        try:
            signal.signal(signal.SIGTERM, interrupted)
            signal.signal(signal.SIGINT, interrupted)
            resource.setrlimit(resource.RLIMIT_AS, (256 * 1024**2, 256 * 1024**2))
            require(os.geteuid() == 0 and len(sys.argv) == 11, 'sudo-root-context')
            require(sys.argv[1:9] == ['bin9208/openpilot-rust', 'push', 'refs/heads/codex/feat-523-python-rust',
                    'bin-actions', 'self-hosted', 'Linux', 'X64', 'true'], 'runner-source-context')
            require(re.fullmatch('[0-9a-f]{40}', sys.argv[9]) is not None, 'source-sha-format')
            account = pwd.getpwnam('actions')
            owner = account.pw_uid
            require(account.pw_dir == '/home/actions' and owner > 0 and str(owner) == sys.argv[10], 'source-owner')
            result['workflow_sha'] = sys.argv[9]
            result['df_before'] = capacity()
            # 부모부터 openat(O_NOFOLLOW)로 고정한다. source 전체를 삭제하는 argv는 없다.
            parent_fd = os.open('/', ODIR)
            held.append(('/', parent_fd, identity(os.fstat(parent_fd))))
            path = ''
            for part in TARGET.split('/')[1:]:
                path += '/' + part
                fd = os.open(part, ODIR, dir_fd=parent_fd)
                s = os.fstat(fd)
                require(os.path.realpath(path, strict=True) == path, 'noncanonical-root-component')
                if path.startswith('/home/actions'):
                    require(s.st_uid == owner, 'root-component-owner')
                held.append((path, fd, identity(s)))
                parent_fd = fd
            root_fd = parent_fd
            device = os.fstat(root_fd).st_dev
            require(all(info[0] == device for path, fd, info in held if path.startswith('/home/actions')),
                    'source-target-device')
            marker = os.stat('Cargo.toml', dir_fd=held[-2][1], follow_symlinks=False)
            require(stat.S_ISREG(marker.st_mode) and marker.st_uid == owner and marker.st_dev == device,
                    'literal-rust-source-marker')
            mounts = mount_roster()
            verify_roots()
            first = tree_snapshot()
            inodes = first[0]
            result['root_before'] = list(first[3])
            result['counts_before'] = first[1]
            scan_processes('scan_before')
            second = tree_snapshot()
            require(second == first, 'target-metadata-roster-changed')
            del second
            require(mount_roster() == mounts, 'mount-roster-changed')
            scan_processes('scan_immediately_before')
            verify_roots()
            require(metadata(os.fstat(root_fd)) == first[3] == metadata(os.lstat(TARGET)),
                    'last-target-identity-changed')
            tick()
            # snapshot 검사이며, 이후 새 writer의 atomic 배제를 주장하지 않는다.
            os.chdir(SOURCE)
            result['deletion_attempted'] = True
            child = subprocess.Popen(['/usr/bin/rm', '-rf', '--one-file-system', '--',
                                      '/home/actions/actions-runner/_work/openpilot-rust/openpilot-rust/rust/target'],
                                     cwd=SOURCE, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL, start_new_session=True)
            try:
                result['rm_exit'] = child.wait(timeout=180)
            except subprocess.TimeoutExpired:
                result['rm_exit'] = 124
                stop_child()
                raise RuntimeError('rm-timeout')
            require(result['rm_exit'] == 0, 'rm-failed-or-partial')
            require(not os.path.lexists(TARGET), 'target-remains')
            # 삭제한 root 외 held source/부모 directory identity는 전부 유지한다.
            for path, fd, expected in held[:-1]:
                require(identity(os.fstat(fd)) == expected == identity(os.lstat(path)), 'source-parent-changed')
            require(os.fstat(root_fd).st_nlink == 0, 'deleted-root-still-linked')
            scan_processes('scan_after')
            result['root_after'] = None
            result['counts_after'] = {'target_paths': 0}
            result['pass'] = True
        except BaseException as error:
            result['error'] = type(error).__name__ + ':' + str(error)[:180]
        finally:
            try:
                stop_child()
            except BaseException as error:
                result['pass'] = False
                result['stop_error'] = type(error).__name__
            try:
                result['df_after'] = capacity()
                if 'df_before' in result:
                    result['observed_available_bytes_delta'] = (result['df_after']['available_bytes'] -
                                                                result['df_before']['available_bytes'])
            except BaseException as error:
                result['pass'] = False
                result['df_error'] = type(error).__name__
            for path, fd, expected in reversed(held):
                os.close(fd)
            print(json.dumps(result, sort_keys=True, separators=(',', ':')), flush=True)
        sys.exit(0 if result['pass'] else 1)
        RESCUE
        status=$?
        printf '{"stage":"rescue-launcher","exit_status":%s,"recovery_claim":false}\n' "$status"
        exit "$status"
