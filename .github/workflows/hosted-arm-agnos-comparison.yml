name: GitHub ARM AGNOS comparison
on:
  push:
    branches: ['codex/feat-643-hosted-arm-build']
    paths:
      - '.github/workflows/hosted-arm-agnos-comparison.yml'
      - 'tools/ci/hosted_arm_agnos.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-arm-agnos-643
  cancel-in-progress: false
jobs:
  compiler:
    name: Compare GitHub ARM with recorded bin-actions3 AGNOS compile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/ci/hosted_arm_agnos.py
          sparse-checkout-cone-mode: false
      - name: Record hosted ARM capacity and prepare native PRoot
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(uname -m)" == aarch64 ]]
          lscpu
          free -h
          df -h "$RUNNER_TEMP"
          python3 - <<'PY'
          import os, shutil, subprocess
          # Disposable hosted VM only; release unrelated preinstalled SDKs if extraction needs room.
          for unused_sdk in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc'):
              if shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 18 * 1024**3:
                  break
              if os.path.isdir(unused_sdk):
                  subprocess.run(['sudo', 'rm', '-rf', '--', unused_sdk], check=True)
          print('allowed_cpus=', sorted(os.sched_getaffinity(0)))
          print('available_bytes=', shutil.disk_usage(os.environ['RUNNER_TEMP']).free)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl git android-sdk-libsparse-utils e2fsprogs xz-utils gcc make pkg-config libtalloc-dev
          proot_source=$(mktemp -d "$RUNNER_TEMP/proot-5.5.0.XXXXXX")
          git -C "$proot_source" init
          git -C "$proot_source" remote add origin https://github.com/proot-me/proot.git
          git -C "$proot_source" fetch --depth=1 origin 25dc6a3134891f98a79f57ce1c2c1b23ff15cad1
          git -C "$proot_source" checkout --detach FETCH_HEAD
          [[ $(git -C "$proot_source" rev-parse HEAD) == 25dc6a3134891f98a79f57ce1c2c1b23ff15cad1 ]]
          make -C "$proot_source/src" -j"$(nproc)" WITHOUT_PYTHON=1 loader.elf build.h
          make -C "$proot_source/src" -j"$(nproc)" WITHOUT_PYTHON=1 proot
          "$proot_source/src/proot" --version
          timeout 30 "$proot_source/src/proot" -r / -w "$RUNNER_TEMP" /bin/uname -m
          printf 'AGNOS_PROOT_PATH=%s\n' "$proot_source/src/proot" >> "$GITHUB_ENV"
      - name: Restore pinned image, Rust and dependency downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/agnos-inputs-643
          key: agnos-643-hosted-arm-inputs-v1-9b8c6337-rust-1.94.0
      - name: Compare the original locked AGNOS compiler command on ARM
        env:
          AGNOS_INPUT_CACHE: ${{ runner.tool_cache }}/agnos-inputs-643
        run: python3 tools/ci/hosted_arm_agnos.py
      - name: Preserve comparison timings and command evidence
        if: ${{ always() && env.AGNOS_REPORT_DIRECTORY != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: hosted-arm-agnos-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ env.AGNOS_REPORT_DIRECTORY }}/report.json
            ${{ env.AGNOS_REPORT_DIRECTORY }}/native-agnos/*.stdout
            ${{ env.AGNOS_REPORT_DIRECTORY }}/native-agnos/*.stderr
