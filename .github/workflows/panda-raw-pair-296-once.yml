name: 296 complete Panda pair and observed raw-path failure contract once
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-raw-pair-296-once.yml
permissions:
  contents: read
  actions: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  panda-runtime:
    name: rust Panda runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: cdfdb29137fe1c8df1a9181bbde178418a936f42
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: cdfdb29137fe1c8df1a9181bbde178418a936f42
    - name: Admit exact current checkout
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Configure original Panda IPC imports
      run: printf 'PYTHONPATH=%s/panda-native/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Reserve capacity and install Panda prerequisites
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang libusb-1.0-0-dev libzmq3-dev cmake
        pkg-config curl strace

        '
    - name: Install pinned Panda oracle dependencies
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1 libusb1==3.4.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7 pytest==9.0.2

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Build original Panda IPC bindings
      run: 'python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=rust/tools/tests rust/tools/tests/test_pandad_spi.py
        rust/tools/tests/test_pandad_ci.py -q

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/panda-native/msgq"

        python -P -c ''import msgq.ipc_pyx, usb1; from openpilot.cereal import log; log.Event.new_message(); print(msgq.ipc_pyx.__file__);
        print(usb1.__file__)'' > "$RUNNER_TEMP/panda-native/msgq/imports.txt"

        '
    - name: Check native Panda packages
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-pandad -p openpilot-panda-usb -p openpilot-panda-spi -p
        openpilot-panda-spi-linux --all-targets --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-pandad -p openpilot-panda-usb -p openpilot-panda-spi -p openpilot-panda-spi-linux
        --all-targets --locked

        '
    - name: Build native Panda and record resolved dependency outputs
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        set -o pipefail

        cargo build --manifest-path rust/Cargo.toml -p openpilot-pandad -p openpilot-panda-usb -p openpilot-panda-spi -p openpilot-panda-spi-linux
        -p openpilot-process-supervision -p openpilot-logmessaged -p openpilot-dev-tools --features openpilot-dev-tools/pandad-safety-padding-native,openpilot-dev-tools/panda-ci-native
        --bins --examples --locked --message-format=json 2> "$RUNNER_TEMP/panda-native/native-build.log" | tee "$RUNNER_TEMP/panda-native/native-build.jsonl"

        '
    - name: Require complete native controller regressions and strict Clippy
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native --test panda_ci_check
        --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/panda-native/controller-tests.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native --lib --bin check-pandad-ci
        --test panda_ci_check --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/panda-native/controller-clippy.log"

        '
    - name: Require Panda source, transport and continuous supervisor comparisons
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/panda-native"

        sha256sum rust/target/debug/check-pandad-ci > "$proof/controller.sha256"

        python rust/tools/check_pandad_ci.py --binaries rust/target/debug --build-messages "$proof/native-build.jsonl" --output
        "$proof/original-oracles" > "$proof/original-controller.stdout" 2> "$proof/original-controller.stderr"

        rust/target/debug/check-pandad-ci --python "$(python -c ''import sys; print(sys.executable)'')" --binaries rust/target/debug
        --build-messages "$proof/native-build.jsonl" --output "$proof/oracles" > "$proof/controller.stdout" 2> "$proof/controller.stderr"

        sha256sum --check "$proof/controller.sha256"

        '
    - name: Compare complete38phase same-source same-ELF pair and retain raw CLI admissions
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-native\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 128\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12319964928/zip > \"$proof/historical.zip\"\
        \npython - <<'STAGE'\nimport base64,os\nfrom pathlib import Path\n(Path(os.environ['RUNNER_TEMP'])/'panda-native/compare-pair.py').write_bytes(base64.b64decode(''))\n\
        STAGE\npython \"$proof/compare-pair.py\" \\\n  --historical-zip \"$proof/historical.zip\" \\\n  --original \"$proof/original-oracles\"\
        \ --native \"$proof/oracles\" \\\n  --original-stdout \"$proof/original-controller.stdout\" --native-stdout \"$proof/controller.stdout\"\
        \ \\\n  --original-stderr \"$proof/original-controller.stderr\" --native-stderr \"$proof/controller.stderr\" \\\n\
        \  --original-script \"$GITHUB_WORKSPACE/rust/tools/check_pandad_ci.py\" \\\n  --native-checker \"$GITHUB_WORKSPACE/rust/target/debug/check-pandad-ci\"\
        \ \\\n  --messages \"$proof/native-build.jsonl\" --workspace \"$GITHUB_WORKSPACE\" \\\n  --python \"$(python -c 'import\
        \ sys; print(sys.executable)')\" \\\n  --binaries \"$GITHUB_WORKSPACE/rust/target/debug\" \\\n  --cli-root \"$proof/cli-matrix\"\
        \ --report \"$proof/pair.json\" --cli-report \"$proof/cli-matrix.json\"\n"
    - name: Compare fresh original and native raw-byte path failure with sealed original capture
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-native\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 256\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12325830071/zip > \"$proof/historical-raw.zip\"\
        \npython - <<'STAGE_RAW'\nimport base64, os\nfrom pathlib import Path\n(Path(os.environ['RUNNER_TEMP']) / 'panda-native/compare-raw-pair.py').write_bytes(base64.b64decode(''))\n\
        STAGE_RAW\npython \"$proof/compare-raw-pair.py\" \\\n  --workspace \"$GITHUB_WORKSPACE\" --proof \"$proof\" \\\n \
        \ --python \"$(python -c 'import sys; print(sys.executable)')\" \\\n  --checker \"$GITHUB_WORKSPACE/rust/target/debug/check-pandad-ci\"\
        \ \\\n  --historical-zip \"$proof/historical-raw.zip\"\n"
    - name: Archive raw-byte original and native output trees
      if: always()
      shell: bash
      run: "set -euo pipefail\nraw=\"$RUNNER_TEMP/panda-raw-temp\"\nif test -d \"$raw\"; then\n  rust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 256\n  python - <<'ARCHIVE_RAW'\nimport hashlib, os, subprocess\nfrom\
        \ pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP']) / 'panda-raw-temp'\ntarget = Path(os.environ['RUNNER_TEMP'])\
        \ / 'panda-native/raw-pair.tar'\nsubprocess.run([b'tar', b'--format=gnu', b'-C', os.fsencode(root),\n            \
        \    b'-cf', os.fsencode(target), b'--',\n                b'original-raw-\\xff', b'native-raw-\\xff'], check=True,\
        \ timeout=300)\nprint('raw-pair.tar sha256', hashlib.sha256(target.read_bytes()).hexdigest())\nARCHIVE_RAW\nfi\n"
    - name: Require old Panda padding finalization drift failure
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/panda-native/padding-finalization-430"

        baseline="$RUNNER_TEMP/padding430-baseline"

        mkdir -p "$proof"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        git fetch --no-tags --depth=1 origin edb42bf095d6a3e3b38cc0a4546976dfb710363e

        GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$baseline" edb42bf095d6a3e3b38cc0a4546976dfb710363e

        cp rust/crates/dev-tools/tests/pandad_safety_padding_finalize.rs "$baseline/rust/crates/dev-tools/tests/"

        cp -a rust/crates/dev-tools/tests/fixtures/pandad-safety-padding/edb42bf0-original "$baseline/rust/crates/dev-tools/tests/fixtures/pandad-safety-padding/"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/padding430-target"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        cargo test --manifest-path "$baseline/rust/Cargo.toml" -p openpilot-dev-tools --features pandad-safety-padding-native
        --test pandad_safety_padding_finalize --no-run --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        set +e

        /usr/bin/timeout --signal=TERM --kill-after=2s 15s cargo test --manifest-path "$baseline/rust/Cargo.toml" -p openpilot-dev-tools
        --features pandad-safety-padding-native --test pandad_safety_padding_finalize --locked -- --exact post_execute_native_mutation_must_fail_finish_and_remove_owned_report
        --nocapture 2>&1 | tee "$proof/baseline.log"

        status=${PIPESTATUS[0]}

        set -e

        test "$status" -eq 101

        grep -Fq ''test result: FAILED'' "$proof/baseline.log"

        grep -Fq ''post_execute_native_mutation_must_fail_finish_and_remove_owned_report'' "$proof/baseline.log"

        grep -Fq ''successful finalization accepted a mutated private native probe after execute returned'' "$proof/baseline.log"

        '
    - name: Require native Panda padding controller with sealed original observations
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-safety-padding-native --bin check-pandad-safety-padding
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-safety-padding-native --test pandad_safety_padding_check
        --locked --test pandad_safety_padding_finalize

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-safety-padding-native --lib
        --bin check-pandad-safety-padding --test pandad_safety_padding_check --test pandad_safety_padding_reference --test
        pandad_safety_padding_absence --test pandad_safety_padding_finalize --test pandad_safety_padding_retirement --locked
        -- -D warnings

        export PANDAD_PADDING_SOURCE_BINARY="$RUNNER_TEMP/panda-native/oracles/safety-src/pandad-protocol-source"

        export PANDAD_PADDING_SOURCE_MANIFEST="$RUNNER_TEMP/panda-native/oracles/safety-src/manifest.json"

        export PANDAD_PADDING_NATIVE_BINARY="$GITHUB_WORKSPACE/rust/target/debug/examples/panda_safety"

        export PANDAD_PADDING_PYTHON="$(command -v python)"

        export PANDAD_PADDING_TEST_OUTPUT="$RUNNER_TEMP/panda-native/padding-controller"

        mkdir -p "$PANDAD_PADDING_TEST_OUTPUT"

        export PANDAD_PADDING_TRACE_SOURCE_BINARY="$PANDAD_PADDING_TEST_OUTPUT/trace-source/pandad-protocol-source"

        export PANDAD_PADDING_TRACE_SOURCE_MANIFEST="$PANDAD_PADDING_TEST_OUTPUT/trace-source/manifest.json"

        json11_prefix="$(python -c ''import json,sys; print(json.load(open(sys.argv[1]))["prefix"])'' "$RUNNER_TEMP/panda-native/oracles/commands/stage-json11.stdout")"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rust/target/debug/build-pandad-protocol-source --root "$GITHUB_WORKSPACE" --output "$PANDAD_PADDING_TEST_OUTPUT/trace-source"
        --capnp-prefix /usr --json11-prefix "$json11_prefix" --safety > "$PANDAD_PADDING_TEST_OUTPUT/trace-build.stdout" 2>
        "$PANDAD_PADDING_TEST_OUTPUT/trace-build.stderr"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-safety-padding-native --test pandad_safety_padding_reference
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-safety-padding-native --test pandad_safety_padding_absence
        --locked -- --nocapture

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-safety-padding-native --test pandad_safety_padding_retirement
        --locked -- --nocapture

        '
    - name: Compare native Panda device controller with unchanged original
      run: 'set -euo pipefail

        export OPENPILOT_RUST_ROOT="$GITHUB_WORKSPACE"

        export PANDAD_DEVICE_SOURCE_BINARY="$RUNNER_TEMP/panda-native/oracles/device-src/pandad-protocol-source"

        export PANDAD_DEVICE_SOURCE_MANIFEST="$RUNNER_TEMP/panda-native/oracles/device-src/manifest.json"

        export PANDAD_DEVICE_NATIVE_BINARY="$GITHUB_WORKSPACE/rust/target/debug/examples/device"

        export PANDAD_DEVICE_PYTHON="$(command -v python)"

        export PANDAD_DEVICE_TEST_OUTPUT="$RUNNER_TEMP/panda-native/device-controller"

        mkdir -p "$PANDAD_DEVICE_TEST_OUTPUT"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-device-native --bin check-pandad-device
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-device-native --test pandad_device_check
        --test pandad_device_reference --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-device-native --lib --bin check-pandad-device
        --test pandad_device_check --test pandad_device_reference --locked -- -D warnings

        '
    - name: Preserve Panda evidence including failed cases
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-panda-runtime-evidence
        path: ${{ runner.temp }}/panda-native/
        if-no-files-found: warn
