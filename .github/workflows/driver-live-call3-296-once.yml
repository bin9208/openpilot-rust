        {
          "name": "Authenticate and decode every complete source member before execution",
          "shell": "bash",
          "id": "materialize",
          "run": "set -euo pipefail\npython3 -I - <<'AUTHENTICATE_TRANSPORT'\nimport base64,hashlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['CI_JOB_TEMP'])\nassert not root.is_symlink()\nassert (root/'owner').read_text().strip()==':'.join(os.environ[k] for k in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB'))\nentries=json.loads('[{\"path\":\"proof/payload/fp-observe.c\",\"parts\":[\"00-00.b64\"],\"bytes\":295,\"sha256\":\"f76aeb122d3ecd4ec86bf4718a42f13f94e1a04dd5681c8bb7257b65e3438206\"},{\"path\":\"proof/payload/merged-commit.json\",\"parts\":[\"01-00.b64\"],\"bytes\":2673,\"sha256\":\"d5a317cee70bcfe5ce33241546539884fe30aa150fa74840be2b0d9d9a4330fa\"},{\"path\":\"proof/payload/observe.py\",\"parts\":[\"02-00.b64\",\"02-01.b64\",\"02-02.b64\",\"02-03.b64\"],\"bytes\":20256,\"sha256\":\"d8b1efb7007f5f855918d322ec5e72582ab1c604b64d6edd80ca1d36f476874c\"},{\"path\":\"proof/payload/proof.py\",\"parts\":[\"03-00.b64\",\"03-01.b64\",\"03-02.b64\",\"03-03.b64\"],\"bytes\":21107,\"sha256\":\"ca08f7759fb8e73e15b150aa09305bdfcbd47aef16e60ba4b225779c732166ec\"},{\"path\":\"proof/payload/raw-input-manifest.json\",\"parts\":[\"04-00.b64\"],\"bytes\":2237,\"sha256\":\"934db337cef50ab587285267102129a632a8991df31f90ae2538e80c5e30aec4\"},{\"path\":\"proof/payload/source-lineage.json\",\"parts\":[\"05-00.b64\"],\"bytes\":1364,\"sha256\":\"e45cb56a07263ccc6aeb117cdc31ac4e61b7f1659ece5c3163977cdb2238695f\"},{\"path\":\"runtime/finalize-owned.py\",\"parts\":[\"06-00.b64\"],\"bytes\":1729,\"sha256\":\"88cf3d9544a449be92c50e57c042a1323f92ac2c5bf493c2d264cf9b246558e6\"},{\"path\":\"runtime/ownership.py\",\"parts\":[\"07-00.b64\",\"07-01.b64\",\"07-02.b64\"],\"bytes\":17303,\"sha256\":\"01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9\"},{\"path\":\"runtime/pack-full.py\",\"parts\":[\"08-00.b64\"],\"bytes\":4254,\"sha256\":\"27bc87627bdc2e0a81edbcf5dac0f8bf3a4f27bfdb05765f30bbb7027dfa5e40\"},{\"path\":\"runtime/run-owned.py\",\"parts\":[\"09-00.b64\"],\"bytes\":1753,\"sha256\":\"1b903fbc2fe86a0516cf3aaf507f452f2ab8728c05d21f93ac491e2afb34aeb2\"},{\"path\":\"runtime/small-envelope.py\",\"parts\":[\"10-00.b64\"],\"bytes\":4465,\"sha256\":\"040fa195585fd6fd4052bfdb8c3ef5cdc13cb130ebd1c1bdecea425902571869\"},{\"path\":\"scripts/allocate.bash\",\"parts\":[\"11-00.b64\"],\"bytes\":3115,\"sha256\":\"67083b1ea6ac6f6caa848a34af91d9b8ae6d1d50d84e8c5076ba97130886d958\"},{\"path\":\"scripts/build.bash\",\"parts\":[\"12-00.b64\"],\"bytes\":1566,\"sha256\":\"4006acd144e606d1c3ca4d874a05ea6dd4bb48a4dfb9cd02e7ad846315bc46b9\"},{\"path\":\"scripts/catalog.bash\",\"parts\":[\"13-00.b64\"],\"bytes\":1159,\"sha256\":\"d900d079a11e61d8c738df89c6502e7475a420f96432aee856ed65ee685a12da\"},{\"path\":\"scripts/cleanup-source.bash\",\"parts\":[\"14-00.b64\"],\"bytes\":814,\"sha256\":\"46daf79aa11e95f14c50a49f5dcffb3fcd5bd134d33edaf79f3c825911f98b92\"},{\"path\":\"scripts/final.bash\",\"parts\":[\"15-00.b64\"],\"bytes\":332,\"sha256\":\"d4aa3234d41d0e4b2ce93bd653cf26945aa4d10d104436adfca19b5e454ac4d2\"},{\"path\":\"scripts/observe.bash\",\"parts\":[\"16-00.b64\"],\"bytes\":597,\"sha256\":\"6070d95a1fccb94c19d3cebd3116bc3bcbda321aad3ccb6e96164de4b77844ab\"},{\"path\":\"scripts/ordinary.bash\",\"parts\":[\"17-00.b64\"],\"bytes\":109,\"sha256\":\"4870af606564635c84f0968e97bed8c808f31743ac40eef17b78a33ed50730ec\"},{\"path\":\"scripts/pack.bash\",\"parts\":[\"18-00.b64\"],\"bytes\":70,\"sha256\":\"0bebb4c729af4678bff978c1842040d6163a2366d5f012479520492b08ac2f89\"},{\"path\":\"scripts/preflight.bash\",\"parts\":[\"19-00.b64\"],\"bytes\":1807,\"sha256\":\"4e7cbe751fd588441884dffea39d270df6cb7d6addd147b5da93af10da9a88bd\"},{\"path\":\"scripts/raw.bash\",\"parts\":[\"20-00.b64\"],\"bytes\":269,\"sha256\":\"286eef56cf19ce7cf5a4ab5e6d3f717fd7b3697a1369490f1380c53a3a752397\"}]')\nmanifest={}\nfor row in entries:\n    path=root/row['path']\n    assert not path.exists() and not path.is_symlink()\n    encoded=[]\n    for name in row['parts']:\n        part=(root/'transport'/name).read_bytes().strip()\n        assert len(part)<=8000\n        encoded.append(part)\n    raw=base64.b64decode(b''.join(encoded),validate=True)\n    assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']\n    with path.open('xb') as handle: handle.write(raw)\n    manifest[row['path']]={'bytes':len(raw),'sha256':row['sha256']}\n# All files authenticate before any member is imported, sourced or executed.\nfor name,seal in manifest.items():\n    raw=(root/name).read_bytes()\n    assert len(raw)==seal['bytes'] and hashlib.sha256(raw).hexdigest()==seal['sha256']\n(root/'transport-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\\n')\n(root/'TRANSPORT.SHA256SUMS').write_text(''.join(seal['sha256']+'  '+name+'\\n' for name,seal in manifest.items()))\n# Retain adapter sources and bindings as inert review evidence, outside the six watched members.\n(root/'proof/transport-manifest.json').write_bytes((root/'transport-manifest.json').read_bytes())\n(root/'proof/TRANSPORT.SHA256SUMS').write_bytes((root/'TRANSPORT.SHA256SUMS').read_bytes())\nfor name in manifest:\n    if name.startswith(('runtime/', 'scripts/')):\n        destination=root/'proof/envelope-source'/name\n        destination.parent.mkdir(parents=True,exist_ok=True)\n        destination.write_bytes((root/name).read_bytes())\nAUTHENTICATE_TRANSPORT\nprintf 'LIVE_READY=true\\n' >> \"$GITHUB_ENV\"\n"
