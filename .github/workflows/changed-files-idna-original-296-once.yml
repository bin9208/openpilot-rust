name: 296 original-only CPython312 IDNA Unicode32 observations
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-idna-original-296-once.yml
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 1d5570e158bb7a799c4a816f78bc7f63f201d2a4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 1d5570e158bb7a799c4a816f78bc7f63f201d2a4
        persist-credentials: false
    - name: Retain exact unchanged source and reserve capacity
      shell: bash
      run: 'set -euo pipefail

        export IDNA_BASE="$RUNNER_TEMP/changed-files-idna-original-296"

        printf ''IDNA_BASE=%s\n'' "$IDNA_BASE" >> "$GITHUB_ENV"

        mkdir "$IDNA_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$IDNA_BASE/source.txt"

        git status --porcelain=v1 > "$IDNA_BASE/source-status.before.txt"

        test ! -s "$IDNA_BASE/source-status.before.txt"

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        sha256sum tools/ci/check_changed_files.py tools/ci/tests/test_changed_files.py rust/Cargo.lock > "$IDNA_BASE/source-files.before.sha256"

        printf ''%s\n'' ''6bcb14f3a6d5d4e885c655e22fed23a1ecf2199b048cd3da95ef59b2795fad87  tools/ci/check_changed_files.py''
        ''cd9a211d076d6939b7649849212ea21c52e7e0897fa6d251e82b0b2805e08242  tools/ci/tests/test_changed_files.py'' | sha256sum
        --check --strict

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Admit source-pinned original-only capture
      shell: bash
      run: 'set -euo pipefail

        mkdir "$IDNA_BASE/original"

        base64 --decode <<''INPUT'' > "$IDNA_BASE/capture_idna_original.py"

        

        INPUT

        printf ''9399505f1498d26782b026113cb07fda8ce69f2ef6e0510ccd585be9824fe20e  %s/capture_idna_original.py\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        base64 --decode <<''INPUT'' > "$IDNA_BASE/original-source-pins.json"

        

        INPUT

        printf ''bae352dc20ac4dc8d7b5dee58c1c479fe7b063ff884b4ae00b34e6cbfa84cf07  %s/original-source-pins.json\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Lib/encodings/idna.py''
        -o "$IDNA_BASE/original/idna.py"

        printf ''9ca58e82d12b171f25d57239ad237dae5c44214a70f2f4f39358c2759b8b9013  %s/original/idna.py\n'' "$IDNA_BASE" |
        sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Lib/encodings/punycode.py''
        -o "$IDNA_BASE/original/punycode.py"

        printf ''34edc8fb1c50e4d1cbaa1e008bb491cd7c12116c316e51974f333fe7b628eb7c  %s/original/punycode.py\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Lib/stringprep.py''
        -o "$IDNA_BASE/original/stringprep.py"

        printf ''a5989150f7f74a68eb98b47966c1ed166033ba8cae07c3f376bcc162efd2ee47  %s/original/stringprep.py\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Lib/test/test_codecs.py''
        -o "$IDNA_BASE/original/test_codecs.py"

        printf ''7c8ee75d81f71877786078fd73c17d2fd9645ad8bf5700fc12e062d72b3cb97e  %s/original/test_codecs.py\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Objects/unicodectype.c''
        -o "$IDNA_BASE/original/unicodectype.c"

        printf ''9d7a35ac40018ad087c5d2d15f8214d5831456947d858e5b5c0cd9d529e4ce61  %s/original/unicodectype.c\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Modules/unicodedata.c''
        -o "$IDNA_BASE/original/unicodedata.c"

        printf ''a40b4820ef1bcc6c45899f5da1c8063610bbba2341a6129a4d5f646316ebf11e  %s/original/unicodedata.c\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Modules/unicodedata_db.h''
        -o "$IDNA_BASE/original/unicodedata_db.h"

        printf ''f029c909cbb1714dea177fe80662a35d1f8e21a2c505060e8d8674b0bbed8e57  %s/original/unicodedata_db.h\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        curl --fail --location --silent --show-error --retry 3 ''https://raw.githubusercontent.com/python/cpython/e848e4b09ca4bc67c0041c9ce7526dae471d4c36/Objects/unicodetype_db.h''
        -o "$IDNA_BASE/original/unicodetype_db.h"

        printf ''ab60f0ca6db86dc14bb19ca5bcce6b0274282172500dd1c3ef61030e4b080cc8  %s/original/unicodetype_db.h\n'' "$IDNA_BASE"
        | sha256sum --check --strict

        '
    - name: Capture only new IDNA domains without native execution
      shell: bash
      run: 'set -euo pipefail

        python -I -B -VV > "$IDNA_BASE/python-provider.txt"

        /usr/bin/timeout --signal=TERM --kill-after=10s 600s python -I -B "$IDNA_BASE/capture_idna_original.py" --pinned-sources
        "$IDNA_BASE/original" --output "$IDNA_BASE/observations" > "$IDNA_BASE/capture.stdout" 2> "$IDNA_BASE/capture.stderr"

        sha256sum tools/ci/check_changed_files.py tools/ci/tests/test_changed_files.py rust/Cargo.lock > "$IDNA_BASE/source-files.after.sha256"

        cmp "$IDNA_BASE/source-files.before.sha256" "$IDNA_BASE/source-files.after.sha256"

        git status --porcelain=v1 > "$IDNA_BASE/source-status.after.txt"

        cmp "$IDNA_BASE/source-status.before.txt" "$IDNA_BASE/source-status.after.txt"

        sha256sum "$IDNA_BASE/observations/manifest.json" > "$IDNA_BASE/original-manifest.sha256"

        du -sm "$IDNA_BASE" > "$IDNA_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$IDNA_BASE/artifact-size-mib.txt")" -le 132

        '
    - name: Retain original observations and provider/source receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-idna-original-296
        path: ${{ runner.temp }}/changed-files-idna-original-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
