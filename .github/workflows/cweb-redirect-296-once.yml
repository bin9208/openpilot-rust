name: 296 cweb redirect byte and allocation proof with full HTTP daemon controls
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/cweb-redirect-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  cweb-redirect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 3a90dc52732b9afcde31c31ae20578bf3109e532
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Admit exact source and reserve hosted build capacity
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 3a90dc52732b9afcde31c31ae20578bf3109e532

        mkdir -p "$RUNNER_TEMP/cweb-redirect"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build the complete affected cweb package and independent original Params oracle
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-cweb-push --bins --examples --locked 2>&1 | tee "$RUNNER_TEMP/cweb-redirect/build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 512

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/ui-params-binding"

        '
    - name: Require complete cweb unit and integration tests and allocation evidence
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-cweb-push --all-targets --locked -- --nocapture 2>&1 | tee
        "$RUNNER_TEMP/cweb-redirect/package-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-cweb-push --all-targets --locked -- -D warnings 2>&1 | tee
        "$RUNNER_TEMP/cweb-redirect/clippy.log"

        '
    - name: Compare discovery policy, HTTP, continuous process and address ABI
      run: 'set -euo pipefail

        python rust/tools/check_cweb_policy.py --binary "$PWD/rust/target/debug/examples/cweb_trace" --output "$RUNNER_TEMP/ui-connectivity/cweb/policy"

        python rust/tools/check_cweb_http.py --binary "$PWD/rust/target/debug/examples/cweb_http" --output "$RUNNER_TEMP/ui-connectivity/cweb/http"

        python rust/tools/check_cweb_daemon.py --binary "$PWD/rust/target/debug/openpilot-cweb-push" --binding "$RUNNER_TEMP/ui-params-binding"/params_pyx*.so
        --output "$RUNNER_TEMP/ui-connectivity/cweb/daemon"

        python rust/tools/check_cweb_address.py --binary "$PWD/rust/target/debug/examples/cweb_address" --output "$RUNNER_TEMP/ui-connectivity/cweb/address"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: cweb-redirect-allocation-evidence
        path: '${{ runner.temp }}/cweb-redirect/

          ${{ runner.temp }}/ui-connectivity/cweb/

          ${{ runner.temp }}/ui-params-binding/build.log'
        if-no-files-found: error
