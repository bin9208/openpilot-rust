    - name: Capture only missing original JP2 inputs and source admission
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/timeout --signal=TERM --kill-after=10s 300s python -I -B "$JP2_BASE/capture-jp2-original.py" --root "$GITHUB_WORKSPACE"
        --output "$JP2_BASE/observations" --reused-inputs "$JP2_BASE/reused-jp2-inputs.json" > "$JP2_BASE/capture.stdout"
        2> "$JP2_BASE/capture.stderr"

        git status --porcelain=v1 > "$JP2_BASE/source-status.after.txt"

        cmp "$JP2_BASE/source-status.before.txt" "$JP2_BASE/source-status.after.txt"

        du -sm "$JP2_BASE" > "$JP2_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$JP2_BASE/artifact-size-mib.txt")" -le 36

        '
    - name: Preserve complete independent additions and provider/source receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-jp2-original-296
        path: ${{ runner.temp }}/changed-files-jp2-original-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
