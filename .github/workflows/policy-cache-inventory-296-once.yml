{
  "name": "#296 R11 policy cache CURRENT read-only inventory once",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/policy-cache-inventory-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "inventory": {
      "if": "${{ github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/codex/feat-296-local-validation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 20,
      "concurrency": {
        "group": "policy-cache-inventory-296-${{ github.repository }}-${{ github.ref }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "LC_ALL": "C.UTF-8",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "name": "FIRST require trusted repo ref event and bin-actions before any metadata",
          "run": "set -euo pipefail\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONHOME:-} && -z ${PYTHONPATH:-} ]]\n"
        },
        {
          "name": "Common fresh audit temp only; never cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "false"
          }
        },
        {
          "name": "Bind fresh output and admit bounded metadata growth",
          "run": "set -euo pipefail\numask 077\njob=$CI_JOB_TEMP\n[[ $job == /tmp/openpilot-ci.?????? && ! -L $job && -d $job ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\n[[ $(id -u) == 1000 && $(stat -c %u \"$job\") == 1000 ]]\nmkdir \"$job/policy-cache-inventory\" \"$job/inventory-tools\" \"$job/inventory-home\"\nout=\"$job/policy-cache-inventory\"\nprintf 'INVENTORY_OUT=%s\nINVENTORY_JOB_ID=%s\nHOME=%s/inventory-home\n' \"$out\" \"$(stat -c '%d:%i:%u' \"$job\")\" \"$job\" >> \"$GITHUB_ENV\"\nprintf 'phase=read-only-inventory\nworkflow=%s\nrun=%s\nattempt=%s\njob=%s\nrunner=%s\njob_identity=%s\ndelete=false\n' \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$RUNNER_NAME\" \"$(stat -c '%d:%i:%u' \"$job\")\" > \"$out/binding.txt\"\nprintf '%s\\n' '{\"deletion_allowed\":false,\"approved_deletion_targets\":[],\"recovered_bytes\":0,\"historical_common_root_identity\":null,\"source_after\":\"ABSENT\",\"inventory_complete\":false}' > \"$out/DECISION.json\"\ndf -PB1 \"$job\" > \"$out/disk.before.txt\"\n# Metadata64MiB + possible upload staging64MiB +8MiB script/seal/overhead.\n# This is not the unrelated unchanged16,642,998,272-byte bundle estimate.\navailable=$(df -PB1 \"$job\" | awk 'NR==2{print $4}')\n[[ $available =~ ^[0-9]+$ ]]\ngrowth=$((136*1024*1024))\nprintf '{\"available_bytes\":%s,\"planned_metadata_growth_bytes\":%s,\"fixed_reserve_bytes\":0}\n' \"$available\" \"$growth\" > \"$out/growth.json\"\nif ((available < growth)); then printf 'Metadata growth admission rejected: available=%s required=%s bytes\n' \"$available\" \"$growth\" >&2; exit 1; fi\n[[ -x /usr/bin/python3 && -x /usr/bin/timeout ]]\n"
        },
        {
          "name": "Materialize sealed metadata source and literal owner inputs",
          "run": "set -euo pipefail\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/inventory-tools/inventory.py\"\\nPAYLOAD\nbase64 --decode <<'PAYLOAD' | gzip --decompress > \"$CI_JOB_TEMP/inventory-tools/inputs.json\"\\nPAYLOAD\nprintf '%s  %s\\n' '1054c20e3154e97457082c5d58410185c289756dfe65d450bcaebdd2136655ca' \"$CI_JOB_TEMP/inventory-tools/inventory.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 'b16cfe5aa97cb67395a220d5b39032f7d7f03b93bc0db3e1181610136b24b02b' \"$CI_JOB_TEMP/inventory-tools/inputs.json\" | sha256sum --check --strict -\n"
        },
        {
          "name": "Authenticate R11 plain artifact then inventory only three literal caches",
          "id": "metadata",
          "env": {
            "INVENTORY_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nprintf '%s  %s\\n' '1054c20e3154e97457082c5d58410185c289756dfe65d450bcaebdd2136655ca' \"$CI_JOB_TEMP/inventory-tools/inventory.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 'b16cfe5aa97cb67395a220d5b39032f7d7f03b93bc0db3e1181610136b24b02b' \"$CI_JOB_TEMP/inventory-tools/inputs.json\" | sha256sum --check --strict -\n# Actions-only read-only metadata. No project/provider imports or subprocesses.\n/usr/bin/timeout --signal=TERM --kill-after=10s 900s /usr/bin/python3 -I -B \"$CI_JOB_TEMP/inventory-tools/inventory.py\" inventory > \"$INVENTORY_OUT/metadata.stdout\" 2> \"$INVENTORY_OUT/metadata.stderr\"\n"
        },
        {
          "name": "Always retain raw status capacity and member seals",
          "id": "seal",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "env": {
            "METADATA_OUTCOME": "${{ steps.metadata.outcome }}"
          },
          "run": "set -euo pipefail\njob=$CI_JOB_TEMP\n[[ ! -L $job && -d $job && $(stat -c '%d:%i:%u' \"$job\") == \"$INVENTORY_JOB_ID\" ]]\n[[ -f $job/owner && ! -L $job/owner && $(cat \"$job/owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\" ]]\nprintf 'metadata_step=%s\nphase=read-only-current-inventory\ndelete=false\nno_cleanup_step=true\n' \"$METADATA_OUTCOME\" > \"$INVENTORY_OUT/RAW-STATUS.txt\"\ndf -PB1 \"$job\" > \"$INVENTORY_OUT/disk.after.txt\"\nprintf '%s  %s\\n' '1054c20e3154e97457082c5d58410185c289756dfe65d450bcaebdd2136655ca' \"$CI_JOB_TEMP/inventory-tools/inventory.py\" | sha256sum --check --strict -\nprintf '%s  %s\\n' 'b16cfe5aa97cb67395a220d5b39032f7d7f03b93bc0db3e1181610136b24b02b' \"$CI_JOB_TEMP/inventory-tools/inputs.json\" | sha256sum --check --strict -\n/usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/python3 -I -B \"$CI_JOB_TEMP/inventory-tools/inventory.py\" seal\n"
        },
        {
          "name": "Always upload complete available metadata even when denied",
          "id": "evidence",
          "if": "${{ always() && env.INVENTORY_OUT != '' }}",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "policy-cache-inventory-296-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.INVENTORY_OUT }}",
            "if-no-files-found": "error",
            "retention-days": 14,
            "include-hidden-files": true,
            "overwrite": false,
            "compression-level": 6
          }
        }
      ]
    }
  }
}
