name: 296 remaining road retirement and authenticated current family exporter proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-remaining-road-family-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  remaining-road:
    name: Remaining full-road retirement; prior pipeline comparisons remain separately recorded
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SOURCE: 3fd4e7a4f38764e8d56a1696e1d89be8080cdfc4
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      BRIDGE_CATALOG_ROOTS: driving-four-source
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 3fd4e7a4f38764e8d56a1696e1d89be8080cdfc4
        persist-credentials: false
    - name: Reserve hosted capacity before dependencies
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nsudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/.ghcup\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 12288\nfor name in check_driver_daemon.py model_logging_capture.py model_logging_reference.py check_model_startup.py\
        \ model_startup_reference.py check_usbgpu_daemon.py; do\n test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\
        \ndone\nmkdir \"$RUNNER_TEMP/model-family-preparation-296\" \"$RUNNER_TEMP/remaining-road-296\"\nsudo apt-get update\n\
        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev\
        \ libzmq3-dev jq\nrustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt\n"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies of the separately pending model compiler
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2 requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - name: Build only held road runtime, collector and native source helper
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/remaining-road-296"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run --bin offline-llvm-guarded-add
        > "$proof/model-runtime-build.log" 2>&1 || { cat "$proof/model-runtime-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-driving-modeld --bin openpilot-driving-modeld >
        "$proof/driving-runtime-build.log" 2>&1 || { cat "$proof/driving-runtime-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-logmessaged --bin openpilot-logmessaged > "$proof/collector-build.log"
        2>&1 || { cat "$proof/collector-build.log"; exit 1; }

        '
    - name: Bind same-source explicit helper for all affected catalog exports
      id: bridge-bind
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/bridge-proof-296\"\nmkdir \"$proof\"\ntest \"$(git rev-parse HEAD)\" =\
        \ \"$EXPECTED_SOURCE\"\ntest -n \"$LLVM_PATH\" && test -s \"$LLVM_PATH\"\nrustc -Vv > \"$proof/rustc-version.txt\"\
        \ncargo -V > \"$proof/cargo-version.txt\"\ncargo clippy -V > \"$proof/clippy-version.txt\"\nhelper=$(readlink -f \"\
        $GITHUB_WORKSPACE/rust/target/debug/offline-llvm-guarded-add\")\ntest -x \"$helper\"\ndigest=$(sha256sum \"$helper\"\
        \ | cut -d' ' -f1)\nprintf 'MODEL_LLVM_GUARDED_ADD_BINARY=%s\\nMODEL_LLVM_GUARDED_ADD_SHA256=%s\\n' \"$helper\" \"\
        $digest\" >> \"$GITHUB_ENV\"\nprintf '%s\\n' \"$helper\" \"$(readlink -f \"$LLVM_PATH\")\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/guarded_add.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/bin/offline-llvm-guarded-add.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/owned_outputs.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/lib.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/Cargo.toml\"\
        \ \"$GITHUB_WORKSPACE/rust/Cargo.toml\" \"$GITHUB_WORKSPACE/rust/Cargo.lock\" \"$GITHUB_WORKSPACE/rust/rust-toolchain.toml\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/build_model_pipelines.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/native.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/capture.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/compile.py\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/schema.py\" \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_current_catalog.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_prepare/catalog.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/tests/catalog.rs\"\
        \ > \"$proof/binding-paths.txt\"\nif test -n \"${MODEL_BRIDGE_CATALOG_TEST_BINARY:-}\"; then\n printf '%s\\n' \"$MODEL_BRIDGE_CATALOG_TEST_BINARY\"\
        \ >> \"$proof/binding-paths.txt\"\nfi\nprintf '%s\\n' \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_check.rs\"\
        \ \"$GITHUB_WORKSPACE/rust/tools/model_export/publish.py\" >> \"$proof/binding-paths.txt\"\nwhile IFS= read -r path;\
        \ do sha256sum \"$path\"; done < \"$proof/binding-paths.txt\" > \"$proof/bindings.before.sha256\"\nwhile IFS= read\
        \ -r path; do stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\"; done < \"$proof/binding-paths.txt\" > \"$proof/identities.before.txt\"\
        \nlscpu --json > \"$proof/lscpu.json\"\ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nuname -a > \"$proof/uname.txt\"\
        \ngit rev-parse HEAD > \"$proof/source.txt\"\npython -m pip freeze > \"$proof/providers.before.txt\"\n"
    - name: Verify native driving four-source retirement with fixed independent observations
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driving-four-source\"\nmkdir -p \"$proof\"\nexport EXPECTED_SOURCE=\"\
        ${EXPECTED_SOURCE:-$GITHUB_SHA}\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nfor name in check_driving_daemon.py\
        \ check_model_logging_faults.py driving_daemon_reference.py check_desire_reference.py; do\n  test ! -e \"rust/tools/$name\"\
        \n  test ! -L \"rust/tools/$name\"\ndone\nexport OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nexport DRIVING_DAEMON_ROOT=\"\
        $GITHUB_WORKSPACE\"\nexport DRIVING_SOURCE_POLICY=retired-driving\nexport DRIVING_RETIREMENT_EXPECT_ABSENT=1\nexport\
        \ DRIVING_FIXTURE_DIRECTORY=\"$proof/historical-complete-fixture\"\nexport DRIVING_FIXTURE_STAGE_RECEIPT=\"$proof/native-stage.json\"\
        \nexport DRIVING_FIXTURE_MANIFEST_SHA256=afe1c795d7f609801eb4cd5a5a7748c3c996929403a3c0fa102f232f2a8d248d\nexport\
        \ DRIVING_FIXTURE_ARCHIVE=\"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz\"\
        \nexport DRIVING_FIXTURE_ARCHIVE_SHA256=3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe\nexport DRIVING_FIXTURE_ARCHIVE_BYTES=59663776\n\
        export DRIVING_FIXTURE_ARCHIVE_COMPACT=true\nexport DRIVING_ORIGINAL_OBSERVATION=\"$DRIVING_FIXTURE_DIRECTORY/observations\"\
        \nexport DRIVING_ORIGINAL_MANIFEST_SHA256=ed174bb4610ee55108b3f2502d7ed284cb66abb3cd153777ca546bf8fe0d3fca\nexport\
        \ DRIVING_CURRENT_CATALOG=\"$proof/current-host-catalog\"\nexport DRIVING_CURRENT_CATALOG_RECEIPT=\"$proof/current-host-catalog-receipt.json\"\
        \nexport DRIVING_DAEMON_NATIVE_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-driving-modeld\"\nexport DRIVING_DAEMON_COLLECTOR=\"\
        $GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged\"\nexport DRIVING_DAEMON_PEER=\"$proof/peer/driving-daemon-peer\"\
        \nexport DRIVING_RETIREMENT_OUTPUT=\"$proof/retirement\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 3072\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features\
        \ driving-daemon-native --locked \\\n  --bin stage-driving-daemon-fixture --bin seal-driving-daemon-fixture --bin\
        \ check-driving-daemon \\\n  --bin check-model-logging-faults --bin build-driving-logging-fault --bin generate-services-header\n\
        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked --no-run\
        \ \\\n  --test driving_fixture_archive --test driving_daemon_reference --test driving_daemon_retirement 2>&1 | tee\
        \ \"$proof/family-compile-admission.log\"\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features\
        \ driving-daemon-native --locked \\\n  --lib --bin stage-driving-daemon-fixture --bin seal-driving-daemon-fixture\
        \ --bin check-driving-daemon \\\n  --bin check-model-logging-faults --bin build-driving-logging-fault --bin generate-services-header\
        \ \\\n  --test driving_fixture_archive --test driving_daemon_reference --test driving_daemon_retirement -- -D warnings\
        \ 2>&1 | tee \"$proof/clippy.log\"\n# All family unit/adversarial cases and host-ISA/held-receipt regressions precede\
        \ traffic.\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked\
        \ --lib driving_ -- --nocapture 2>&1 | tee \"$proof/family-unit.log\"\ncommand -v jq > /dev/null\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked --test driving_fixture_archive\
        \ -- --nocapture 2>&1 | tee \"$proof/archive-adversarial-and-regeneration.log\"\nprintf '%s  %s\\n' \"$DRIVING_FIXTURE_MANIFEST_SHA256\"\
        \ rust/crates/dev-tools/tests/fixtures/driving-daemon-original/fixture.json \\\n  810f2c0f291178314c3c5c58d83e77700fa5e40977592da24a7e154276083e12\
        \ rust/crates/dev-tools/tests/fixtures/driving-daemon-original/packaging-receipt.json | sha256sum -c -\ntest -d \"\
        $DRIVING_FIXTURE_DIRECTORY\"\ntest -s \"$DRIVING_FIXTURE_STAGE_RECEIPT\"\njq -e --arg output \"$DRIVING_FIXTURE_DIRECTORY\"\
        \ --arg manifest \"$DRIVING_FIXTURE_MANIFEST_SHA256\" \\\n  --arg blob \"$DRIVING_FIXTURE_ARCHIVE_SHA256\" --argjson\
        \ bytes \"$DRIVING_FIXTURE_ARCHIVE_BYTES\" \\\n  '.output == $output and .fixture_manifest_sha256 == $manifest and\
        \ .blob_sha256 == $blob and .blob_bytes == $bytes and .historical_programs_executed == false and .compact_images ==\
        \ true and (.generated_images | length) == 86' \\\n  \"$DRIVING_FIXTURE_STAGE_RECEIPT\" > /dev/null\nrust/target/debug/seal-driving-daemon-fixture\
        \ --output \"$DRIVING_FIXTURE_DIRECTORY\" --verify-sha \"$DRIVING_FIXTURE_MANIFEST_SHA256\" > \"$proof/historical-before.json\"\
        \ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked --test\
        \ driving_daemon_reference -- --nocapture 2>&1 | tee \"$proof/original-observation-seals.log\"\n# Parent generation\
        \ embeds the reviewed exporter bytes here and pins their SHA.\nbase64 --decode <<'CURRENT_EXPORTER_BASE64' > \"$proof/export_current_driving_catalog.py\"\
        \\n\
        CURRENT_EXPORTER_BASE64\nprintf '%s  %s\\n' 94a5f103c3831a7bbdf7f6733c5576230539ccb906f1ad3368e587ea16c4a49c \"$proof/export_current_driving_catalog.py\"\
        \ | sha256sum -c -\npython -m py_compile \"$proof/export_current_driving_catalog.py\"\nbase64 --decode <<'EXPORTER_PATH_TEST_BASE64'\
        \ > \"$proof/test_export_current_catalog_paths.py\"\\n\
        EXPORTER_PATH_TEST_BASE64\nprintf '%s  %s\\n' 0810f0cedc18ea3de07227924326b447fa5f01c766ff9aa64ab94c0fe0262366 \"\
        $proof/test_export_current_catalog_paths.py\" | sha256sum -c -\npython -P \"$proof/test_export_current_catalog_paths.py\"\
        \ > \"$proof/exporter-path-tests.log\" 2>&1\npython -P \"$proof/export_current_driving_catalog.py\" --root \"$GITHUB_WORKSPACE\"\
        \ \\\n  --fixture \"$DRIVING_FIXTURE_DIRECTORY\" --fixture-sha256 \"$DRIVING_FIXTURE_MANIFEST_SHA256\" \\\n  --catalog\
        \ \"$DRIVING_CURRENT_CATALOG\" --receipt \"$DRIVING_CURRENT_CATALOG_RECEIPT\" > \"$proof/current-export.json\"\nrust/target/debug/model-run\
        \ --check-catalog \"$DRIVING_CURRENT_CATALOG\" > \"$proof/current-catalog-admission.json\"\n# Build the same original\
        \ C++ IPC peer using a Rust-generated service header.\nmkdir \"$proof/peer\"\nrust/target/debug/generate-services-header\
        \ --script-newline --output \"$proof/peer/services.h\"\ng++ -std=c++17 -pthread -I\"$GITHUB_WORKSPACE/msgq_repo\"\
        \ -I\"$proof/peer\" \\\n  rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc\
        \ \\\n  msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc \\\n  -o \"$DRIVING_DAEMON_PEER\"\
        \ > \"$proof/peer-build.stdout\" 2> \"$proof/peer-build.stderr\"\nsha256sum \"$DRIVING_DAEMON_NATIVE_BINARY\" \"$DRIVING_DAEMON_COLLECTOR\"\
        \ \"$DRIVING_DAEMON_PEER\" > \"$proof/production-elf-seals.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 12288\nrust/target/debug/build-driving-logging-fault --root \"$GITHUB_WORKSPACE\"\
        \ --output \"$proof/fault-builder\" \\\n  --cargo \"$(command -v cargo)\" --compiler \"$(command -v c++)\" 2>&1 |\
        \ tee \"$proof/fault-builder.log\"\nexport DRIVING_LOGGING_FAULT_BINARY=\"$proof/fault-builder/openpilot-driving-modeld-fault\"\
        \nsha256sum -c \"$proof/production-elf-seals.sha256\"\n# One-time final gate provides the already audited 25 retained\
        \ reports separately.\n# Maintained runs need no ephemeral historical artifact or retired source download.\nif [[\
        \ \"${DRIVING_REPLAY_RETAINED_E25:-0}\" == 1 ]]; then\n  mkdir -p \"$proof/retained-comparison\"\n  DRIVING_RETIREMENT_OUTPUT=\"\
        $proof/retained-comparison\" cargo test --manifest-path rust/Cargo.toml \\\n    -p openpilot-dev-tools --features\
        \ driving-daemon-native --locked --test driving_daemon_retirement \\\n    retained_e25_completed_traffic_reports_match_with_accounted_wait_debug_counts\
        \ -- --ignored --exact --nocapture 2>&1 | tee \"$proof/retained-replay.log\"\nfi\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 3072\n# Exactly one full current-source run: two roots, each model6/collector6/fault2,\n\
        # then all eight regular/link reappearance controls. Ignored history is separate.\ncargo test --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features driving-daemon-native --locked \\\n  --test driving_daemon_retirement -- --nocapture\
        \ 2>&1 | tee \"$proof/current-two-root-retirement.log\"\nrust/target/debug/seal-driving-daemon-fixture --output \"\
        $DRIVING_FIXTURE_DIRECTORY\" --verify-sha \"$DRIVING_FIXTURE_MANIFEST_SHA256\" > \"$proof/historical-after.json\"\n\
        sha256sum -c \"$proof/production-elf-seals.sha256\"\n"
    - name: Seal complete original/compiled IR, receipts, objects and helper bindings
      if: always() && steps.bridge-bind.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\npython - <<'BRIDGE_SIDECAR_AUDIT'\nimport hashlib,json,os,stat\nfrom pathlib import Path\n\
        proof=Path(os.environ['RUNNER_TEMP'])/'bridge-proof-296'\nhelper=Path(os.environ['MODEL_LLVM_GUARDED_ADD_BINARY'])\n\
        sha=lambda data:hashlib.sha256(data).hexdigest()\nm=helper.stat()\nbinding=dict(enabled=True,path=str(helper),bytes=m.st_size,sha256=sha(helper.read_bytes()),identity=[m.st_dev,m.st_ino,m.st_size,m.st_mode,m.st_mtime_ns,m.st_ctime_ns])\n\
        assert binding['sha256']==os.environ['MODEL_LLVM_GUARDED_ADD_SHA256']\nroots=[Path(os.environ['RUNNER_TEMP'])/name\
        \ for name in os.environ['BRIDGE_CATALOG_ROOTS'].split(':')]\nseals={}; catalogs=[]\ndef seal(path):\n assert path.is_absolute()\
        \ and path.resolve(strict=True)==path\n before=path.lstat();assert stat.S_ISREG(before.st_mode) and before.st_size<=32*1024*1024\n\
        \ data=path.read_bytes();after=path.lstat()\n assert (before.st_dev,before.st_ino,before.st_size,before.st_mode,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mode,after.st_mtime_ns,after.st_ctime_ns)\n\
        \ seals[str(path)]={'bytes':len(data),'sha256':sha(data)}\n return data\nfor root in roots:\n if not root.exists():continue\n\
        \ for path in root.rglob('compilation-evidence.json'):\n  value=json.loads(seal(path));assert value['version']==1\
        \ and isinstance(value['kernels'],dict)\n  directory=path.parent\n  expected={p.stem.removeprefix('kernel-') for p\
        \ in directory.glob('kernel-*.txt') if not p.read_bytes().startswith(b'copy:')}\n  assert set(value['kernels'])==expected\n\
        \  for index,record in value['kernels'].items():\n   assert index.isdecimal() and record['helper']==binding\n   original=seal(directory/f'kernel-{index}.txt');compiled=seal(directory/f'kernel-{index}.compiled.ll')\n\
        \   receipt_bytes=seal(directory/f'kernel-{index}.guarded-add.json');receipt=json.loads(receipt_bytes)\n   obj=seal(directory/f'kernel-{index}.o')\n\
        \   assert record['original_source_sha256']==sha(original)\n   assert record['compiled_source_sha256']==sha(compiled)==receipt['output_source_sha256']\n\
        \   assert record['rewrite_receipt_sha256']==sha(receipt_bytes) and record['object_sha256']==sha(obj)\n   assert record['renamed_source_sha256']==receipt['original_source_sha256']\n\
        \   assert receipt['output_bytes']==len(compiled) and receipt['rewrite_count']==len(receipt['rewrites'])\n  catalogs.append(str(directory))\n\
        assert catalogs,'no actual compiled catalog sidecars retained'\n(proof/'full-sidecar-seals.json').write_text(json.dumps({'version':1,'source':os.environ['EXPECTED_SOURCE'],'helper':binding,'catalogs':catalogs,'files':seals,'numerical_acceptance':False},indent=2)+'\\\
        n')\nprint(json.dumps({'catalogs':len(catalogs),'sealed_files':len(seals),'numerical_acceptance':False}))\nBRIDGE_SIDECAR_AUDIT\n"
    - name: Independent final helper/provider/source/Python guards
      if: always() && steps.bridge-bind.outcome == 'success'
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/bridge-proof-296"

        status=0

        sha256sum --check --strict "$proof/bindings.before.sha256" > "$proof/bindings.after.log" 2>&1 || status=1

        while IFS= read -r path; do stat --printf ''%n:%d:%i:%s:%f:%y:%z\n'' "$path" || status=1; done < "$proof/binding-paths.txt"
        > "$proof/identities.after.txt"

        cmp "$proof/identities.before.txt" "$proof/identities.after.txt" || status=1

        python -m pip freeze > "$proof/providers.after.txt" || status=1

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt" || status=1

        printf ''%s\n'' "$status" > "$proof/final-guards.status"

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: remaining-road-retirement-3fd4e7a4f38
        retention-days: 7
        include-hidden-files: true
        if-no-files-found: warn
        path: '${{ runner.temp }}/remaining-road-296/

          ${{ runner.temp }}/driving-four-source/

          !${{ runner.temp }}/driving-four-source/retirement/private-root/**

          !${{ runner.temp }}/driving-four-source/fault-builder/target/**

          !${{ runner.temp }}/driving-four-source/historical-complete-fixture/**'
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: remaining-model-sidecars-${{ github.job }}-3fd4e7a4f38
        retention-days: 7
        if-no-files-found: warn
        path: '${{ runner.temp }}/bridge-proof-296/

          ${{ github.workspace }}/rust/target/debug/offline-llvm-guarded-add

          ${{ runner.temp }}/**/compilation-evidence.json

          ${{ runner.temp }}/**/kernel-*.txt

          ${{ runner.temp }}/**/kernel-*.compiled.ll

          ${{ runner.temp }}/**/kernel-*.guarded-add.json

          ${{ runner.temp }}/**/kernel-*.o'
  model-family-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: 3fd4e7a4f38764e8d56a1696e1d89be8080cdfc4
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
