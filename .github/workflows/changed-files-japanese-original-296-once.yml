    - name: Capture original decoder domains and independent GNU differences
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/timeout --signal=TERM --kill-after=10s 1200s python -I -B "$JAPANESE_BASE/capture-original-only.py" --root
        "$GITHUB_WORKSPACE" --output "$JAPANESE_BASE/observations" > "$JAPANESE_BASE/capture.stdout" 2> "$JAPANESE_BASE/capture.stderr"

        git status --porcelain=v1 > "$JAPANESE_BASE/source-status.after.txt"

        cmp "$JAPANESE_BASE/source-status.before.txt" "$JAPANESE_BASE/source-status.after.txt"

        du -sm "$JAPANESE_BASE" > "$JAPANESE_BASE/artifact-size-mib.txt"

        test "$(cut -f1 "$JAPANESE_BASE/artifact-size-mib.txt")" -le 181

        '
