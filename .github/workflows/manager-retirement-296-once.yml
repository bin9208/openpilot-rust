name: 296 manager three-tool same-ELF retirement admission
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/manager-retirement-296-once.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  manager-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 8b6b6c896a02b7cd41e3745e64ecf3c6557337ba
        persist-credentials: false
    - name: Admit exact checked source and disk
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 8b6b6c896a02b7cd41e3745e64ecf3c6557337ba

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        mkdir -p "$RUNNER_TEMP/manager-qa-original" "$RUNNER_TEMP/manager-native"

        printf ''workflow_head=%s\nchecked_out_source=%s\nrun_id=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID"
        > "$RUNNER_TEMP/manager-native/source-workflow.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Install pinned original dependencies and Rust 1.94
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y jq g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev
        libzstd-dev libzmq5 strace

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1

        '
    - name: Fail fast on all manager QA tests compiling and strict Clippy
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features manager-qa-native,recovery-family-native\
        \ --lib --test manager_qa --test manager_qa_compat --test manager_retirement --no-run --message-format=json > \"$RUNNER_TEMP/manager-native/compile.jsonl\"\
        \ 2> \"$RUNNER_TEMP/manager-native/compile.stderr\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 2048\ncargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features manager-qa-native,recovery-family-native\
        \ --lib --bin check-manager-qa --bin check-manager --bin check-manager-logging --test manager_qa --test manager_qa_compat\
        \ --test manager_retirement -- -D warnings 2>&1 | tee \"$RUNNER_TEMP/manager-native/clippy.log\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools\
        \ --features manager-qa-native,recovery-family-native --bin check-manager-qa --bin check-manager --bin check-manager-logging\
        \ 2>&1 | tee \"$RUNNER_TEMP/manager-native/bins.log\"\nfor target in manager_qa manager_qa_compat manager_retirement;\
        \ do\n  mapfile -t harness < <(jq -r --arg target \"$target\" 'select(.reason==\"compiler-artifact\" and .profile.test==true\
        \ and .target.name==$target) | .executable // empty' \"$RUNNER_TEMP/manager-native/compile.jsonl\")\n  test \"${#harness[@]}\"\
        \ -eq 1\n  test -f \"${harness[0]}\"\n  printf '%s\\n' \"${harness[0]}\" > \"$RUNNER_TEMP/manager-native/$target.elf-path\"\
        \ndone\n"
    - name: Configure original platform IPC imports
      run: printf 'PYTHONPATH=%s/platform-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Build unchanged manager trace and original IPC/Params providers
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-manager --example manager_trace --locked 2>&1 | tee "$RUNNER_TEMP/manager-native/trace-build.log"

        '
    - uses: ./.github/actions/native-json11
    - name: Build real original IPC and Params bindings
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/platform-msgq-python" 2>&1 | tee "$RUNNER_TEMP/manager-native/msgq-build.log"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/platform-params-binding"
        2>&1 | tee "$RUNNER_TEMP/manager-native/params-build.log"

        '
    - name: Capture expanded unchanged original manager corpus with full source seals
      run: "set -euo pipefail\nshopt -s nullglob\nbindings=(\"$RUNNER_TEMP\"/platform-params-binding/params_pyx*.so)\ntest\
        \ \"${#bindings[@]}\" -eq 1\nexport MANAGER_PARAMS_BINDING=\"${bindings[0]}\"\nexport MANAGER_TRACE_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/examples/manager_trace\"\
        \nexport MANAGER_PROVIDER_INVENTORY=\"$RUNNER_TEMP/manager-qa-provider-inventory.py\"\ncat > \"$MANAGER_PROVIDER_INVENTORY\"\
        \ <<'PY'\n#!/usr/bin/env python3\n\"\"\"Hosted-only, bounded identity inventory of the original Python environment.\"\
        \"\"\n\nimport hashlib\nimport importlib.metadata\nimport json\nimport os\nfrom pathlib import Path\nimport platform\n\
        import sys\nimport sysconfig\n\n\nMAX_FILES = 40_000\nMAX_TOTAL_BYTES = 4 * 1024**3\nMAX_FILE_BYTES = 512 * 1024**2\n\
        \n\ndef identity(path):\n    stat = path.stat()\n    if not path.is_file() or stat.st_size > MAX_FILE_BYTES:\n   \
        \     raise RuntimeError(f\"provider is not bounded regular file: {path}\")\n    digest = hashlib.sha256()\n    with\
        \ path.open(\"rb\") as source:\n        while chunk := source.read(1024 * 1024):\n            digest.update(chunk)\n\
        \    after = path.stat()\n    if (stat.st_dev, stat.st_ino, stat.st_size, stat.st_mtime_ns) != (\n        after.st_dev,\
        \ after.st_ino, after.st_size, after.st_mtime_ns\n    ):\n        raise RuntimeError(f\"provider changed during read:\
        \ {path}\")\n    return {\"path\": str(path), \"dev\": stat.st_dev, \"ino\": stat.st_ino,\n            \"size\": stat.st_size,\
        \ \"sha256\": digest.hexdigest()}\n\n\ndef main():\n    if len(sys.argv) != 2:\n        raise SystemExit(\"usage:\
        \ manager-qa-provider-inventory.py OUTPUT\")\n    paths = sysconfig.get_paths()\n    workspace = Path(os.environ[\"\
        GITHUB_WORKSPACE\"]).resolve(strict=True)\n    roots = {str(Path(paths[key]).resolve()) for key in (\"stdlib\", \"\
        purelib\", \"platlib\")}\n    for entry in sys.path:\n        if not entry:\n            continue\n        candidate\
        \ = Path(entry).resolve()\n        if candidate.is_dir() and not (candidate == workspace or workspace in candidate.parents):\n\
        \            roots.add(str(candidate))\n    roots = sorted(roots)\n    selected = []\n    for root_name in roots:\n\
        \        root = Path(root_name)\n        if not root.is_dir():\n            raise RuntimeError(f\"missing original\
        \ Python provider directory: {root}\")\n        for base, dirs, files in os.walk(root, followlinks=False):\n     \
        \       dirs[:] = sorted(d for d in dirs if d != \"__pycache__\" and not Path(base, d).is_symlink())\n           \
        \ for name in sorted(files):\n                path = Path(base, name)\n                if not (name.endswith(\".py\"\
        ) or \".so\" in name):\n                    continue\n                if not path.is_file():\n                   \
        \ continue\n                selected.append(path)\n                if len(selected) > MAX_FILES:\n               \
        \     raise RuntimeError(\"Python provider file count exceeded\")\n    selected = sorted(set(selected), key=str)\n\
        \    if sum(path.stat().st_size for path in selected) > MAX_TOTAL_BYTES:\n        raise RuntimeError(\"Python provider\
        \ bytes exceeded\")\n    executable = Path(sys.executable).resolve(strict=True)\n    distributions = sorted(\n   \
        \     {((dist.metadata.get(\"Name\") or \"\").lower(), dist.version)\n         for dist in importlib.metadata.distributions()}\n\
        \    )\n    data = {\n        \"executable_requested\": sys.executable,\n        \"executable\": identity(executable),\n\
        \        \"version\": sys.version,\n        \"platform_python_version\": platform.python_version(),\n        \"sys_path\"\
        : sys.path,\n        \"provider_roots\": roots,\n        \"distributions\": [{\"name\": name, \"version\": version}\
        \ for name, version in distributions],\n        \"providers\": [dict(identity(path), requested_path=str(path),\n \
        \                          symlink_target=os.readlink(path) if path.is_symlink() else None)\n                    \
        \  for path in selected],\n    }\n    output = Path(sys.argv[1])\n    output.write_text(json.dumps(data, sort_keys=True,\
        \ separators=(\",\", \":\")) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    main()\nPY\ncat > \"$RUNNER_TEMP/manager-qa-capture.sh\"\
        \ <<'SH'\n#!/usr/bin/env bash\n# Hosted-only original manager QA capture. Invoke after the maintained platform\n#\
        \ job has built manager_trace and the real original Params binding.\nset -euo pipefail\n: \"${GITHUB_WORKSPACE:?}\"\
        \n: \"${RUNNER_TEMP:?}\"\n: \"${MANAGER_TRACE_BINARY:?}\"\n: \"${MANAGER_PARAMS_BINDING:?}\"\n: \"${MANAGER_PROVIDER_INVENTORY:?}\"\
        \ncd \"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/manager-qa-original\"\nmkdir -p \"$proof\"\nfinalize() {\n  status=$?\n\
        \  trap - EXIT\n  if test -f \"$proof/providers-before.sha256\"; then\n    git ls-files -z -- '*.py' | xargs -0 sha256sum\
        \ > \"$proof/repo-python-after.sha256\" || status=1\n    find opendbc_repo/opendbc -type f -name '*.py' -print0 |\
        \ sort -z | xargs -0 sha256sum > \"$proof/opendbc-python-after.sha256\" || status=1\n    sha256sum \"$MANAGER_TRACE_BINARY\"\
        \ \"$MANAGER_PARAMS_BINDING\" > \"$proof/providers-after.sha256\" || status=1\n    python \"$MANAGER_PROVIDER_INVENTORY\"\
        \ \"$proof/python-providers-after.json\" || status=1\n    cmp \"$proof/repo-python-before.sha256\" \"$proof/repo-python-after.sha256\"\
        \ || status=1\n    cmp \"$proof/opendbc-python-before.sha256\" \"$proof/opendbc-python-after.sha256\" || status=1\n\
        \    cmp \"$proof/providers-before.sha256\" \"$proof/providers-after.sha256\" || status=1\n    cmp \"$proof/python-providers-before.json\"\
        \ \"$proof/python-providers-after.json\" || status=1\n    printf '%s\\n' \"$status\" > \"$proof/final-status.txt\"\
        \n  fi\n  exit \"$status\"\n}\ntrap finalize EXIT\ntest \"$(git rev-parse HEAD)\" = '8b6b6c896a02b7cd41e3745e64ecf3c6557337ba'\n\
        test -f \"$MANAGER_PARAMS_BINDING\"\ntest -x \"$MANAGER_TRACE_BINARY\"\ntest -f \"$RUNNER_TEMP/platform-params-binding/provenance.json\"\
        \ntest -f \"$RUNNER_TEMP/platform-params-binding/commands.json\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 1024\nprintf '%s\\n' \"$(git rev-parse HEAD)\" > \"$proof/source-commit.txt\"\
        \nprintf 'workflow_head=%s\\nchecked_out_source=%s\\nrun_id=%s\\nworkflow=%s\\n' \\\n  \"${GITHUB_SHA:?}\" \"$(git\
        \ rev-parse HEAD)\" \"${GITHUB_RUN_ID:?}\" \"${GITHUB_WORKFLOW:?}\" \\\n  > \"$proof/workflow-source-receipt.txt\"\
        \n# This intentionally over-approximates repository Python imports so no\n# dynamically imported project module can\
        \ escape source-content sealing.\ngit ls-files -z -- '*.py' | xargs -0 sha256sum > \"$proof/repo-python-before.sha256\"\
        \ntest -d opendbc_repo/opendbc/car\ngit -C opendbc_repo rev-parse HEAD > \"$proof/opendbc-source-commit.txt\"\nfind\
        \ opendbc_repo/opendbc -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > \"$proof/opendbc-python-before.sha256\"\
        \nsha256sum \"$MANAGER_TRACE_BINARY\" \"$MANAGER_PARAMS_BINDING\" > \"$proof/providers-before.sha256\"\npython \"\
        $MANAGER_PROVIDER_INVENTORY\" \"$proof/python-providers-before.json\"\ncp \"$RUNNER_TEMP/platform-params-binding/provenance.json\"\
        \ \"$proof/params-binding-provenance.json\"\ncp \"$RUNNER_TEMP/platform-params-binding/commands.json\" \"$proof/params-binding-commands.json\"\
        \nsha256sum \"$proof/params-binding-provenance.json\" \"$proof/params-binding-commands.json\" > \"$proof/params-binding-build.sha256\"\
        \npython rust/tools/check_manager.py \"$MANAGER_TRACE_BINARY\" \"$MANAGER_PARAMS_BINDING\" \"$proof/manager\" > \"\
        $proof/manager.stdout\" 2> \"$proof/manager.stderr\"\npython rust/tools/check_manager.py \"$MANAGER_TRACE_BINARY\"\
        \ \"$MANAGER_PARAMS_BINDING\" \"$proof/manager-selected\" \\\n  --scenario normal --scenario normal --scenario custom\
        \ > \"$proof/manager-selected.stdout\" 2> \"$proof/manager-selected.stderr\"\npython rust/tools/check_manager_logging.py\
        \ \"$MANAGER_TRACE_BINARY\" \"$MANAGER_PARAMS_BINDING\" \"$proof/manager-logging\" > \"$proof/manager-logging.stdout\"\
        \ 2> \"$proof/manager-logging.stderr\"\npython rust/tools/generate_manager_cars.py rust/crates/manager/data/cars --check\
        \ --binding \"$MANAGER_PARAMS_BINDING\" > \"$proof/cars.log\"\nsha256sum rust/crates/manager/data/cars/*.json > \"\
        $proof/cars.sha256\"\nfor tool in check_manager.py check_manager_logging.py generate_manager_cars.py; do\n  for case\
        \ in help missing unknown; do\n    out=\"$proof/cli-${tool}-${case}\"\n    case \"$case\" in\n      help) args=(--help)\
        \ ;;\n      missing) args=() ;;\n      unknown) args=(--unknown) ;;\n    esac\n    status=0\n    python \"rust/tools/$tool\"\
        \ \"${args[@]}\" > \"$out.stdout\" 2> \"$out.stderr\" || status=$?\n    printf '%s %s %s\\n' \"$tool\" \"$case\" \"\
        $status\" >> \"$proof/cli-status.txt\"\n  done\ndone\nSH\nsha256sum \"$MANAGER_PROVIDER_INVENTORY\" \"$RUNNER_TEMP/manager-qa-capture.sh\"\
        \ > \"$RUNNER_TEMP/manager-qa-original/capture-scripts.sha256\"\nbash \"$RUNNER_TEMP/manager-qa-capture.sh\" 2>&1\
        \ | tee \"$RUNNER_TEMP/manager-native/original-capture.log\"\ntest -f \"$RUNNER_TEMP/manager-qa-original/manager-selected/summary.json\"\
        \ntest -f \"$RUNNER_TEMP/manager-qa-original/manager-selected.stdout\"\ntest -f \"$RUNNER_TEMP/manager-qa-original/cli-status.txt\"\
        \ntest \"$(cat \"$RUNNER_TEMP/manager-qa-original/final-status.txt\")\" = 0\n"
    - name: Compare independent original logging under explicit baseline and quoted library inputs
      run: "set -euo pipefail\nshopt -s nullglob\nbindings=(\"$RUNNER_TEMP\"/platform-params-binding/params_pyx*.so)\ntest\
        \ \"${#bindings[@]}\" -eq 1\nexport MANAGER_VARIANT_BINDING=\"${bindings[0]}\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 512\npython - <<'PY_VARIANT'\nimport ast,hashlib,json,os,subprocess\nfrom pathlib\
        \ import Path\nroot=Path(os.environ['GITHUB_WORKSPACE']);proof=Path(os.environ['RUNNER_TEMP'])/'manager-native'/'library-inputs';proof.mkdir()\n\
        trace=root/'rust/target/debug/examples/manager_trace';checker=root/'rust/target/debug/check-manager-logging';binding=Path(os.environ['MANAGER_VARIANT_BINDING'])\n\
        base=os.environ.get('LD_LIBRARY_PATH');assert base is not None\nsource_pins={str(p):hashlib.sha256(p.read_bytes()).hexdigest()\
        \ for p in [root/'rust/tools/check_manager.py',root/'rust/tools/check_manager_logging.py',root/'rust/tools/manager_reference.py',trace,checker,root/'rust/target/debug/check-manager',binding]}\n\
        reports=[]\nfor label,value in [('baseline',base),('root-quote',base+':'+str(root)+\"/synthetic 'and \\\"quotes\\\"\
        /never-loaded\")]:\n env=os.environ.copy();env['LD_LIBRARY_PATH']=value\n source=proof/(label+'-source');native=proof/(label+'-native')\n\
        \ for name,argv in [('source',[os.environ['pythonLocation']+'/bin/python','rust/tools/check_manager_logging.py',str(trace),str(binding),str(source)]),('native',[str(checker),str(trace),str(binding),str(native)])]:\n\
        \  p=subprocess.run(argv,cwd=root,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)\n  (proof/(label+'-'+name+'.stdout')).write_bytes(p.stdout);(proof/(label+'-'+name+'.stderr')).write_bytes(p.stderr)\n\
        \  (proof/(label+'-'+name+'.status')).write_text(str(p.returncode)+'\\n')\n  if p.returncode:raise RuntimeError(f'{label}/{name}\
        \ failed: {p.stderr.decode(errors=\"replace\")}')\n assert (proof/(label+'-source.stdout')).read_bytes()==(proof/(label+'-native.stdout')).read_bytes()\n\
        \ original=json.loads((source/'source-records.json').read_bytes());actual=json.loads((native/'native/native-records.json').read_bytes())\n\
        \ assert len(original)==len(actual)==4\n def selected(rows):return [{'msg':r['msg'],'daemon':r['ctx'].get('daemon'),'level':r['level']}\
        \ for r in rows]\n expected=selected(original);observed=selected(actual)\n def environment(rows):\n  text=rows[2]['msg']['environ'];assert\
        \ text.startswith('environ(') and text.endswith(')');return ast.literal_eval(text[8:-1])\n old_env=environment(expected);new_env=environment(observed)\n\
        \ assert old_env['LD_LIBRARY_PATH']==new_env['LD_LIBRARY_PATH']==value\n assert old_env['PYTHONPATH']==new_env['PYTHONPATH']==str(root)\n\
        \ assert old_env['MANAGER_LOG_CAPTURE']=='ipc:///tmp/logmessage'+old_env['OPENPILOT_PREFIX']\n assert new_env['MANAGER_LOG_CAPTURE']=='ipc:///tmp/logmessage'+new_env['OPENPILOT_PREFIX']\n\
        \ for k in ['OPENPILOT_PREFIX','MANAGER_LOG_CAPTURE']:old_env[k]=new_env[k]\n assert old_env==new_env\n expected[2]['msg']=observed[2]['msg'];assert\
        \ expected==observed\n source_result=json.loads((source/'source/result.json').read_bytes());native_result=json.loads((native/'native/result.json').read_bytes());assert\
        \ source_result==native_result\n reports.append({'label':label,'LD_LIBRARY_PATH':value,'four_packets':True,'declared_input_equal_in_both_children':True,'same_full_environment_except_owned_prefix_endpoint':True,'source_result_equals_native':True})\n\
        # Exercise source argparse directly before accepting authored Rust error controls.\nadmissions=[]\nfor tool in ['check_manager.py','check_manager_logging.py']:\n\
        \ native_bin=root/'rust/target/debug'/tool.removesuffix('.py').replace('_','-')\n controls=[('missing-output',[str(trace),str(binding)]),('unknown-complete',[str(trace),str(binding),str(proof/'unused-output'),'--unknown']),('extra-positional',[str(trace),str(binding),str(proof/'unused-output'),'fourth']),('negative-integer',['-1']),('negative-decimal',['-.5'])]\n\
        \ if tool=='check_manager.py':controls.extend([('scenario-missing-value',[str(trace),str(binding),str(proof/'unused-output'),'--scenario']),('scenario-negative-value',['--scenario','-.5'])])\n\
        \ for label,args in controls:\n  outputs=[]\n  for kind,argv in [('source',[os.environ['pythonLocation']+'/bin/python','rust/tools/'+tool,*args]),('native',[str(native_bin),*args])]:\n\
        \   out=subprocess.run(argv,cwd=root,env=os.environ.copy(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)\n\
        \   (proof/(tool+'-'+label+'-'+kind+'.stdout')).write_bytes(out.stdout);(proof/(tool+'-'+label+'-'+kind+'.stderr')).write_bytes(out.stderr)\n\
        \   outputs.append((out.returncode,out.stdout,out.stderr))\n  assert outputs[0]==outputs[1] and outputs[0][0]==2,(tool,label,outputs)\n\
        \  admissions.append({'tool':tool,'case':label,'status':2,'exact_stdout_stderr_match':True})\nassert len(admissions)==12\n\
        (proof/'admissions.json').write_text(json.dumps(admissions,indent=2)+'\\n')\nassert source_pins=={p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\
        \ for p in source_pins}\n(proof/'result.json').write_text(json.dumps({'passed':True,'source_pins':source_pins,'variants':reports},indent=2)+'\\\
        n')\nPY_VARIANT\n"
    - name: Compare both positional native CLIs and full manager corpus to originals
      run: "set -euo pipefail\nshopt -s nullglob\nbindings=(\"$RUNNER_TEMP\"/platform-params-binding/params_pyx*.so)\ntest\
        \ \"${#bindings[@]}\" -eq 1\nexport MANAGER_QA_BINDING=\"${bindings[0]}\"\nexport MANAGER_QA_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/examples/manager_trace\"\
        \nexport MANAGER_QA_CHECKER_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/check-manager-qa\"\nexport MANAGER_QA_COMPAT_MANAGER_BINARY=\"\
        $GITHUB_WORKSPACE/rust/target/debug/check-manager\"\nexport MANAGER_QA_COMPAT_LOGGING_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/check-manager-logging\"\
        \nexport MANAGER_QA_FRESH_ORIGINAL_CAPTURE=\"$RUNNER_TEMP/manager-qa-original\"\nexport MANAGER_QA_OUTPUT=\"$RUNNER_TEMP/manager-native/unified\"\
        \nexport MANAGER_QA_COMPAT_OUTPUT=\"$RUNNER_TEMP/manager-native/compat\"\nmanager_qa_elf=\"$(cat \"$RUNNER_TEMP/manager-native/manager_qa.elf-path\"\
        )\"\nmanager_qa_compat_elf=\"$(cat \"$RUNNER_TEMP/manager-native/manager_qa_compat.elf-path\")\"\nfor provider in\
        \ \"$manager_qa_elf\" \"$manager_qa_compat_elf\" \"$MANAGER_QA_BINDING\" \"$MANAGER_QA_BINARY\" \"$MANAGER_QA_CHECKER_BINARY\"\
        \ \"$MANAGER_QA_COMPAT_MANAGER_BINARY\" \"$MANAGER_QA_COMPAT_LOGGING_BINARY\"; do\n  test -f \"$provider\"\ndone\n\
        sha256sum \"$manager_qa_elf\" \"$manager_qa_compat_elf\" \"$MANAGER_QA_BINDING\" \"$MANAGER_QA_BINARY\" \"$MANAGER_QA_CHECKER_BINARY\"\
        \ \"$MANAGER_QA_COMPAT_MANAGER_BINARY\" \"$MANAGER_QA_COMPAT_LOGGING_BINARY\" > \"$RUNNER_TEMP/manager-native/native-providers-before.sha256\"\
