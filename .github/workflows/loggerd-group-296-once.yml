name: 'loggerd group controller admission #296 (once)'
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/loggerd-group-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: loggerd-group-controller-296-once
  cancel-in-progress: false
jobs:
  loggerd-group:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_SHA: e8744f656444f1e8a5c49527ed15fb56e4406673
      LOGGERD_GATE_SHA256: 183e4d358d798445c7d5ac1eed21310522d58658c338e7256ea05b2ab27631ec
      LOGGERD_GATE_B64: 
      LOGGERD_SCRIPT_B64: 
      LOGGERD_PINS_B64: 
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
        fetch-depth: 1
    - name: Bind hosted exact source and frozen external gate
      run: "set -euo pipefail\n[[ $GITHUB_ACTIONS == true && $RUNNER_ENVIRONMENT == github-hosted && $RUNNER_OS == Linux ]]\n\
        [[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]\n[[ $(git rev-parse HEAD) == \"\
        $SOURCE_SHA\" && -z $(git status --porcelain --untracked-files=normal) ]]\nloggerd_free=$(df -B1 --output=avail \"\
        $RUNNER_TEMP\" | tail -n 1)\nif [[ $loggerd_free -lt $((35*1024*1024*1024)) ]]; then\n  sudo rm -rf /usr/local/lib/android\
        \ /usr/share/dotnet /opt/ghc /usr/local/.ghcup\n  loggerd_free=$(df -B1 --output=avail \"$RUNNER_TEMP\" | tail -n\
        \ 1)\nfi\n[[ $loggerd_free -ge $((35*1024*1024*1024)) ]]\nloggerd_job=$(mktemp -d \"$RUNNER_TEMP/loggerd-group-296.XXXXXXXX\"\
        )\nmkdir \"$loggerd_job/wrappers\"\nprintf 'LOGGERD_GATE_JOB=%s\\nLOGGERD_GROUP_EVIDENCE=%s/evidence\\nLOGGERD_ORIGINAL_ZIP=%s/original.zip\\\
        nLOGGERD_GATE=%s/gate.py\\n' \"$loggerd_job\" \"$loggerd_job\" \"$loggerd_job\" \"$loggerd_job\" >> \"$GITHUB_ENV\"\
        \nprintf '%s' \"$LOGGERD_GATE_B64\" | base64 --decode > \"$loggerd_job/gate.py\"\nprintf '%s' \"$LOGGERD_SCRIPT_B64\"\
        \ | base64 --decode > \"$loggerd_job/loggerd-group-hosted.sh\"\nprintf '%s' \"$LOGGERD_PINS_B64\" | base64 --decode\
        \ > \"$loggerd_job/original-source-blobs.tsv\"\nprintf '%s  %s\\n' \"$LOGGERD_GATE_SHA256\" \"$loggerd_job/gate.py\"\
        \ | sha256sum --check --strict\nprintf '%s  %s\\n' 23ea636fab57e950fd82cc8ee88238362edc5e8a15061375c5192bf732f9b675\
        \ \"$loggerd_job/loggerd-group-hosted.sh\" | sha256sum --check --strict\nprintf '%s  %s\\n' 2e5c0870ff808fda2438abac994b7ae7c0a071562f7178e27ced16645c27eaaa\
        \ \"$loggerd_job/original-source-blobs.tsv\" | sha256sum --check --strict\ncat > \"$loggerd_job/wrappers/strace\"\
        \ <<'SH'\n#!/usr/bin/env bash\nset -euo pipefail\nexec /usr/bin/python3 -I -B \"$LOGGERD_GATE\" trace \"$@\"\nSH\n\
        chmod 0700 \"$loggerd_job/wrappers/strace\"\nprintf 'source_commit=%s\\nworkflow_head=%s\\nrun_id=%s\\nrun_attempt=%s\\\
        n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > \"$loggerd_job/source.txt\"\n"
    - name: Provision normal hosted logger prerequisites and Rust1.94
      timeout-minutes: 15
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev
        libzstd-dev libyuv-dev libzmq5 ffmpeg strace binutils

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 2048

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 --version > "$LOGGERD_GATE_JOB/rustc-version.txt"

        dpkg-query -W g++ clang capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev libzstd-dev libyuv-dev
        libzmq5 ffmpeg strace binutils > "$LOGGERD_GATE_JOB/packages.tsv"

        '
    - name: Authenticate exact historical ZIP and current workflow receipts
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 128

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942 > "$LOGGERD_GATE_JOB/original-metadata.json"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > "$LOGGERD_ORIGINAL_ZIP"

        printf ''%s  %s\n'' 3655dfbe1524303c7927bcdd0ede43599e75094fe787f0ec80d84a82cba3a516 "$LOGGERD_ORIGINAL_ZIP" | sha256sum
        --check --strict

        gh api -H ''Cache-Control: no-cache'' "repos/bin9208/openpilot-rust/contents/.github/workflows/loggerd-group-296-once.yml?ref=$GITHUB_SHA"
        --jq .content | base64 --decode > "$LOGGERD_GATE_JOB/published-workflow.yml"

        /usr/bin/python3 -I -B "$LOGGERD_GATE" authenticate

        '
    - name: Execute frozen focused checks and exactly one new-controller traffic run
      timeout-minutes: 45
      run: 'set -euo pipefail

        # Frozen recipe is byte-identical. Only its strace command is intercepted;

        # wrapper adds observation and holds all current providers/DSOs around traffic.

        export PATH="$LOGGERD_GATE_JOB/wrappers:$PATH"

        bash "$LOGGERD_GATE_JOB/loggerd-group-hosted.sh" > "$LOGGERD_GATE_JOB/recipe.log" 2>&1 || { loggerd_code=$?; tail
        -n 100 "$LOGGERD_GATE_JOB/recipe.log"; exit "$loggerd_code"; }

        /usr/bin/python3 -I -B "$LOGGERD_GATE" complete

        '
    - name: Require explicit admission completion for exact integrated source
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B - <<''CHECK''

        import json, os

        from pathlib import Path

        job = Path(os.environ[''LOGGERD_GATE_JOB''])

        row = json.loads((job / ''completion.json'').read_bytes())

        assert row[''result''] == ''pass'' and row[''source_commit''] == os.environ[''SOURCE_SHA'']

        assert row[''workflow_head''] == os.environ[''GITHUB_SHA'']

        assert row[''gate_sha256''] == os.environ[''LOGGERD_GATE_SHA256'']

        assert row[''script_sha256''] == ''23ea636fab57e950fd82cc8ee88238362edc5e8a15061375c5192bf732f9b675''

        assert row[''phase''] == ''loggerd-controller-admission'' and row[''strict_workers''] == 37

        assert row[''original_controller_rerun''] is False and row[''source_retirement''] is False

        assert all((job / ''evidence'' / p).is_file() for p in row[''required''])

        CHECK

        [[ $(git rev-parse HEAD) == "$SOURCE_SHA" && -z $(git status --porcelain --untracked-files=normal) ]]

        '
    - name: Always seal bounded inert diagnostics including complete raw traces
      if: always()
      timeout-minutes: 5
      run: "set -euo pipefail\nif [[ -n ${LOGGERD_GATE_JOB:-} && -f ${LOGGERD_GATE:-/nonexistent} ]]; then\n  /usr/bin/python3\
        \ -I -B \"$LOGGERD_GATE\" pack\nelse\n  # Preserve an explicit bootstrap-failure receipt even before gate extraction.\n\
        \  mkdir -p \"$RUNNER_TEMP/loggerd-group-296-public\"\n  printf '%s\\n' '{\"result\":\"fail\",\"reason\":\"bootstrap\
        \ never materialized gate\"}' > \"$RUNNER_TEMP/loggerd-group-296-public/packaging.json\"\n  exit 1\nfi\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: loggerd-group-296-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/loggerd-group-296-public/
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 6
        retention-days: 30
