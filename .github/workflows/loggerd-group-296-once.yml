name: 'loggerd main resume #296 (bin-actions; precise original replay reuse)'
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/loggerd-group-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: loggerd-group-296-once
  cancel-in-progress: false
jobs:
  loggerd-main:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 90
    env:
      SOURCE_SHA: 77100d33ce4d1202853bd6bf3597a0fc2014c590
      RUSTUP_TOOLCHAIN: 1.94.0
      GIT_CONFIG_NOSYSTEM: '1'
      LOGGERD_GATE_B64: 
      LOGGERD_GATE_SHA256: 042cd081c3d367a26f6dd5bb2a48420c2b103a023cd15a2a345a42755988bf94
      LOGGERD_SCRIPT_B64: 
      LOGGERD_SCRIPT_SHA256: c2fbe3691d63819cbc07648c6f24c5a994b1652bf923c0ce79658ecdb89fcf04
      LOGGERD_CONFIG_B64: 
      LOGGERD_CONFIG_SHA256: ec7395ebefefd637d46937b85a9b3002bb473e2053721fdd9b53c69fd1986724
      LOGGERD_PINS_B64: 
      LOGGERD_PINS_SHA256: 2e5c0870ff808fda2438abac994b7ae7c0a071562f7178e27ced16645c27eaaa
    defaults:
      run:
        shell: bash
    steps:
    - name: Create exclusive per-run job storage and verify frozen payloads
      run: "set -euo pipefail\numask 077\nexport LOGGERD_GATE_JOB=\"$RUNNER_TEMP/loggerd-main-296-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\
        \nexport LOGGERD_MAIN_SOURCE_ROOT=\"$LOGGERD_GATE_JOB/work/source\"\nexport HOME=\"$LOGGERD_GATE_JOB/work/home\" CARGO_HOME=\"\
        $LOGGERD_GATE_JOB/work/cargo-home\" RUSTUP_HOME=\"$LOGGERD_GATE_JOB/work/rustup-home\"\nexport TMPDIR=\"$LOGGERD_GATE_JOB/work/tmp\"\
        \ XDG_CACHE_HOME=\"$LOGGERD_GATE_JOB/work/xdg-cache\"\nexport CCACHE_DIR=\"$LOGGERD_GATE_JOB/work/ccache\" SCCACHE_DIR=\"\
        $LOGGERD_GATE_JOB/work/sccache\"\nexport GIT_CONFIG_GLOBAL=\"$LOGGERD_GATE_JOB/work/gitconfig\"\nexport LOGGERD_GROUP_EVIDENCE=\"\
        $LOGGERD_GATE_JOB/evidence\" LOGGERD_ORIGINAL_ZIP=\"$LOGGERD_GATE_JOB/original.zip\"\n[[ $SOURCE_SHA =~ ^[a-f0-9]{40}$\
        \ && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_NAME == bin-actions && $RUNNER_ARCH == X64 ]]\n[[ ! -e $LOGGERD_GATE_JOB\
        \ && ! -L $LOGGERD_GATE_JOB ]]\n/usr/bin/python3 -I -B - <<'PY'\nimport base64,hashlib,json,os,pathlib,stat\njob=pathlib.Path(os.environ[\"\
        LOGGERD_GATE_JOB\"])\nassert job.parent.resolve()==pathlib.Path(os.environ[\"RUNNER_TEMP\"]).resolve()\njob.mkdir(mode=0o700);work=job/\"\
        work\";work.mkdir(mode=0o700)\nfor leaf in (\"home\",\"cargo-home\",\"rustup-home\",\"tmp\",\"xdg-cache\",\"ccache\"\
        ,\"sccache\"): (work/leaf).mkdir(mode=0o700)\n(job/\"evidence\").mkdir()\nmeta=work.stat()\n(job/\"ownership.json\"\
        ).write_text(json.dumps({\"job\":str(job.resolve()),\"work\":str(work.resolve()),\"device\":meta.st_dev,\"inode\"\
        :meta.st_ino,\"run_id\":os.environ[\"GITHUB_RUN_ID\"],\"attempt\":os.environ[\"GITHUB_RUN_ATTEMPT\"]},indent=2)+\"\
        \\n\")\nfor stem,name in ((\"GATE\",\"gate.py\"),(\"SCRIPT\",\"loggerd-group-hosted.sh\"),(\"CONFIG\",\"config.json\"\
        ),(\"PINS\",\"original-source-blobs.tsv\")):\n    data=base64.b64decode(os.environ[\"LOGGERD_\"+stem+\"_B64\"],validate=True)\n\
        \    assert hashlib.sha256(data).hexdigest()==os.environ[\"LOGGERD_\"+stem+\"_SHA256\"]\n    (job/name).write_bytes(data)\n\
        (job/\"context.json\").write_text(json.dumps({k:os.environ.get(k) for k in (\"SOURCE_SHA\",\"GITHUB_SHA\",\"GITHUB_RUN_ID\"\
        ,\"GITHUB_RUN_ATTEMPT\",\"GITHUB_REPOSITORY\",\"RUNNER_NAME\",\"RUNNER_ENVIRONMENT\",\"RUNNER_ARCH\",\"RUNNER_OS\"\
        ,\"ImageOS\",\"ImageVersion\")},indent=2)+\"\\n\")\nwith open(os.environ['GITHUB_ENV'],'a') as exported:\n    for\
        \ key in ('LOGGERD_GATE_JOB','LOGGERD_MAIN_SOURCE_ROOT','HOME','CARGO_HOME','RUSTUP_HOME','TMPDIR','XDG_CACHE_HOME','CCACHE_DIR','SCCACHE_DIR','GIT_CONFIG_GLOBAL','LOGGERD_GROUP_EVIDENCE','LOGGERD_ORIGINAL_ZIP'):\n\
        \        value=os.environ[key]; assert '\\n' not in value and '\\r' not in value\n        exported.write(key+'='+value+'\\\
        n')\nPY\n/usr/bin/python3 -I -B \"$LOGGERD_GATE_JOB/gate.py\" resources bootstrap 0"
    - name: Fetch exact combined source into owned isolated checkout
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        for tool in git gh g++ clang capnp pkg-config ffmpeg ffprobe strace ldd rustup cargo; do command -v "$tool"; done
        > "$LOGGERD_GATE_JOB/tool-paths.txt"

        unset GIT_TRACE GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE_PACKET GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_DIR GIT_WORK_TREE
        GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" resources source-fetch 8192

        [[ ! -e $LOGGERD_MAIN_SOURCE_ROOT && ! -L $LOGGERD_MAIN_SOURCE_ROOT ]]

        git init --quiet "$LOGGERD_MAIN_SOURCE_ROOT"

        auth_header=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)

        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic
        $auth_header" git -C "$LOGGERD_MAIN_SOURCE_ROOT" fetch --no-tags --depth=1 https://github.com/bin9208/openpilot-rust.git
        "$SOURCE_SHA"

        # Fetch historical source objects only; never check out/execute old source.

        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic
        $auth_header" git -C "$LOGGERD_MAIN_SOURCE_ROOT" fetch --no-tags --depth=1 https://github.com/bin9208/openpilot-rust.git
        e8744f656444f1e8a5c49527ed15fb56e4406673

        unset auth_header

        git -C "$LOGGERD_MAIN_SOURCE_ROOT" checkout --quiet --detach "$SOURCE_SHA"

        [[ $(git -C "$LOGGERD_MAIN_SOURCE_ROOT" rev-parse HEAD) == "$SOURCE_SHA" ]]

        [[ -z $(git -C "$LOGGERD_MAIN_SOURCE_ROOT" status --porcelain --untracked-files=normal) ]]

        [[ ! -e $LOGGERD_MAIN_SOURCE_ROOT/rust/target && ! -L $LOGGERD_MAIN_SOURCE_ROOT/rust/target ]]'
    - name: Authenticate actual runner, combined source, original corpus and passed replay
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" resources original-copy 1024

        gh api -H "Cache-Control: no-cache" "repos/bin9208/openpilot-rust/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
        > "$LOGGERD_GATE_JOB/runner-jobs-api.json"

        gh api -H "Cache-Control: no-cache" repos/bin9208/openpilot-rust/actions/artifacts/12432287942 > "$LOGGERD_GATE_JOB/original-metadata.json"

        gh api -H "Cache-Control: no-cache" repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > "$LOGGERD_GATE_JOB/original.zip"

        gh api -H "Cache-Control: no-cache" "repos/bin9208/openpilot-rust/commits/$SOURCE_SHA" > "$LOGGERD_GATE_JOB/source-api.json"

        gh api -H "Cache-Control: no-cache" "repos/bin9208/openpilot-rust/contents/.github/workflows/loggerd-group-296-once.yml?ref=$GITHUB_SHA"
        > "$LOGGERD_GATE_JOB/workflow-api.json"

        gh api -H "Cache-Control: no-cache" repos/bin9208/openpilot-rust/actions/artifacts/12449871629 > "$LOGGERD_GATE_JOB/checkpoint-metadata.json"

        gh api -H "Cache-Control: no-cache" repos/bin9208/openpilot-rust/actions/artifacts/12449871629/zip > "$LOGGERD_GATE_JOB/checkpoint.zip"

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" authenticate'
    - name: Record existing OS providers and install job-private Rust 1.94
      timeout-minutes: 15
      run: 'set -euo pipefail

        # Persistent host: require installed OS providers; no system package mutation.

        if dpkg-query -W g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev libzstd-dev
        libyuv-dev libzmq5 ffmpeg strace binutils > "$LOGGERD_GATE_JOB/packages.tsv" 2> "$LOGGERD_GATE_JOB/package-query.stderr";
        then package_status=0; else package_status=$?; fi

        printf "%s\n" "$package_status" > "$LOGGERD_GATE_JOB/package-query-exit.txt"

        pkg-config --modversion libavcodec libavformat libavutil capnp libzstd > "$LOGGERD_GATE_JOB/provider-versions.txt"

        uname -a > "$LOGGERD_GATE_JOB/kernel.txt"

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" resources toolchain-install 2048

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 --version > "$LOGGERD_GATE_JOB/rustc-version.txt"

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" resources after-toolchain 0'
    - name: Fresh affected5 units and3 lifecycle, strict Clippy, then unrun37-worker main
      timeout-minutes: 65
      run: 'set -euo pipefail

        bash "$LOGGERD_GATE_JOB/loggerd-group-hosted.sh" > "$LOGGERD_GATE_JOB/recipe.log" 2>&1'
    - name: Always seal bounded complete raw diagnostics
      if: ${{ always() }}
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" resources before-pack 0

        /usr/bin/python3 -I -B "$LOGGERD_GATE_JOB/gate.py" pack'
    - uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: loggerd-main-296-bin-actions-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.LOGGERD_GATE_JOB }}/public
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    - name: Remove only authenticated owned source, target and caches
      if: ${{ always() }}
      run: "set -euo pipefail\n/usr/bin/python3 -I -B - <<'PY'\nimport json,os,pathlib,shutil,stat\njob=pathlib.Path(os.environ[\"\
        LOGGERD_GATE_JOB\"])\nmarker=job/\"ownership.json\"\nif marker.is_file():\n    receipt=json.loads(marker.read_bytes());work=job/\"\
        work\"\n    assert receipt[\"run_id\"]==os.environ[\"GITHUB_RUN_ID\"] and receipt[\"attempt\"]==os.environ[\"GITHUB_RUN_ATTEMPT\"\
        ]\n    assert job.parent.resolve()==pathlib.Path(os.environ[\"RUNNER_TEMP\"]).resolve() and receipt[\"job\"]==str(job.resolve())\n\
        \    if work.exists():\n        info=work.lstat()\n        assert stat.S_ISDIR(info.st_mode) and not work.is_symlink()\
        \ and receipt[\"work\"]==str(work.resolve())\n        assert (info.st_dev,info.st_ino)==(receipt[\"device\"],receipt[\"\
        inode\"])\n        shutil.rmtree(work)\n    (job/\"owned-cleanup.json\").write_text(json.dumps({\"owned_work_removed\"\
        :not work.exists(),\"evidence_retained\":True})+\"\\n\")\nPY"
    name: loggerd-main
