name: 296 complete desire original native pair and Panda controller regressions
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/desire-native-296-once.yml
permissions:
  contents: read
jobs:
  desire-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE: a20ad0fadb24e3ac77e53d00305bec3ba34cbeed
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: a20ad0fadb24e3ac77e53d00305bec3ba34cbeed
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
    - name: Admit exact source and install full pair prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/desire-native-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Build the actual desire probe and complete native controllers
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/desire-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-desire --example desire_probe --locked 2>&1 | tee
        "$proof/probe-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native,panda-ci-native
        --bin check-desire-reference-native --bin check-pandad-ci --locked 2>&1 | tee "$proof/checker-build.log"

        sha256sum rust/target/debug/examples/desire_probe rust/target/debug/check-desire-reference-native rust/target/debug/check-pandad-ci
        > "$proof/ELFS.sha256"

        '
    - name: Run unchanged original CLI then full native CLI with identical independent corpus
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/desire-native-296\"\nprobe=\"$GITHUB_WORKSPACE/rust/target/debug/examples/desire_probe\"\
        \nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 1024\nPYTHONPATH=\"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/opendbc_repo:$GITHUB_WORKSPACE/rust/tools\"\
        \ python rust/tools/check_desire_reference.py --binary \"$probe\" --output \"$proof/fresh-original\" > \"$proof/original.stdout\"\
        \ 2> \"$proof/original.stderr\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 1024\n/usr/bin/strace\
        \ -f -qq -s65535 -e trace=execve,execveat -o \"$proof/native.exec\" rust/target/debug/check-desire-reference-native\
        \ --binary \"$probe\" --output \"$proof/native\" > \"$proof/native.stdout\" 2> \"$proof/native.stderr\"\npython -\
        \ \"$proof\" <<'COMPARE'\nfrom pathlib import Path\nimport json,sys\np=Path(sys.argv[1])\nold=json.loads((p/'fresh-original/report.json').read_bytes())\n\
        new=json.loads((p/'native/report.json').read_bytes())\nassert old==new and old['frames']==24585 and old['numeric_tolerance']==1e-10\n\
        assert json.loads((p/'original.stdout').read_bytes())==old\nassert json.loads((p/'native.stdout').read_bytes())==old\n\
        for name in ['request.jsonl','reference.jsonl','actual.jsonl']:\n assert (p/'fresh-original'/name).read_bytes()==(p/'native'/name).read_bytes(),name\n\
        assert not (p/'native.stderr').read_bytes()\n(p/'fresh-original-native.json').write_text(json.dumps({'passed':True,'frames':24585,'raw_streams':['request.jsonl','reference.jsonl','actual.jsonl'],'report':old},indent=2)+'\\\
        n')\nCOMPARE\nsha256sum --check \"$proof/ELFS.sha256\"\n"
    - name: Require both complete controller regression families and strict Clippy
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/desire-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native,panda-ci-native
        --lib --test desire_reference_check --test panda_ci_check --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native,panda-ci-native
        --lib --bin check-desire-reference-native --bin check-pandad-ci --test desire_reference_check --test panda_ci_check
        --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        sha256sum --check "$proof/ELFS.sha256"

        # Keep full original/native raw streams compressed in the evidence, never in source as a candidate oracle.

        for lane in fresh-original native; do for name in request.jsonl reference.jsonl actual.jsonl; do gzip -n "$proof/$lane/$name";
        done; done

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: desire-native-complete-296
        path: ${{ runner.temp }}/desire-native-296/
