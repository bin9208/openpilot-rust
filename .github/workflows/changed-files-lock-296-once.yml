name: 296 native changed-files parser dependency lock probe
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-lock-296-once.yml
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 6acad91831dc215e04f78ca7760da63baedec9a7
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 6acad91831dc215e04f78ca7760da63baedec9a7
        persist-credentials: false
    - name: Reserve capacity and stage immutable source shadow
      shell: bash
      run: 'set -euo pipefail

        export LOCK_PROOF="$RUNNER_TEMP/changed-files-lock-296"

        export LOCK_SHADOW="$RUNNER_TEMP/changed-files-lock-source"

        printf ''LOCK_PROOF=%s\nLOCK_SHADOW=%s\n'' "$LOCK_PROOF" "$LOCK_SHADOW" >> "$GITHUB_ENV"

        mkdir "$LOCK_PROOF" "$LOCK_SHADOW"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$LOCK_PROOF/source.txt"

        git status --porcelain=v1 > "$LOCK_PROOF/source-status.before.txt"

        test ! -s "$LOCK_PROOF/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 6144

        rustup toolchain install 1.94.0 --profile minimal

        rustc +1.94.0 -Vv > "$LOCK_PROOF/rustc.txt"

        cargo +1.94.0 -Vv > "$LOCK_PROOF/cargo.txt"

        git archive "$EXPECTED_SOURCE" rust | tar -x -C "$LOCK_SHADOW"

        cp rust/Cargo.lock "$LOCK_PROOF/Cargo.lock.before"

        '
    - name: Apply exact optional Cargo-only change in shadow
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''PATCH'' > "$LOCK_PROOF/optional-Cargo.patch"

        

        PATCH

        printf ''8bd8eaf8300b55e700f975d741ef20b8bcbb9b0354aa5792179569279b0cf185  %s/optional-Cargo.patch\n'' "$LOCK_PROOF"
        | sha256sum --check --strict

        base64 --decode <<''AUDIT'' > "$LOCK_PROOF/hosted_lock_audit.py"

        

        AUDIT

        printf ''c0e09ade1ba03bb59cdfe66091b62b052ffc89ad8deaaa26662dcb806f3e1913  %s/hosted_lock_audit.py\n'' "$LOCK_PROOF"
        | sha256sum --check --strict

        git -C "$LOCK_SHADOW" apply --check "$LOCK_PROOF/optional-Cargo.patch"

        git -C "$LOCK_SHADOW" apply "$LOCK_PROOF/optional-Cargo.patch"

        cp "$LOCK_SHADOW/rust/crates/dev-tools/Cargo.toml" "$LOCK_PROOF/Cargo.toml.after"

        '
    - name: Resolve native parser lock without project execution
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096

        cargo +1.94.0 metadata --manifest-path "$LOCK_SHADOW/rust/Cargo.toml" --format-version 1 --filter-platform x86_64-unknown-linux-gnu
        --no-default-features --features openpilot-dev-tools/changed-files-native > "$LOCK_PROOF/metadata.resolve.json" 2>
        "$LOCK_PROOF/metadata.resolve.stderr"

        cargo +1.94.0 metadata --manifest-path "$LOCK_SHADOW/rust/Cargo.toml" --format-version 1 --filter-platform x86_64-unknown-linux-gnu
        --locked --offline --no-default-features --features openpilot-dev-tools/changed-files-native > "$LOCK_PROOF/metadata.locked-offline.json"
        2> "$LOCK_PROOF/metadata.locked-offline.stderr"

        cargo +1.94.0 metadata --manifest-path "$LOCK_SHADOW/rust/Cargo.toml" --format-version 1 --filter-platform x86_64-unknown-linux-gnu
        --locked --offline --no-default-features > "$LOCK_PROOF/metadata.no-default.json" 2> "$LOCK_PROOF/metadata.no-default.stderr"

        cp "$LOCK_SHADOW/rust/Cargo.lock" "$LOCK_PROOF/Cargo.lock.after"

        cp rust/Cargo.lock "$LOCK_PROOF/Cargo.lock.original-after"

        git status --porcelain=v1 > "$LOCK_PROOF/source-status.after.txt"

        python3 "$LOCK_PROOF/hosted_lock_audit.py"

        du -sm "$LOCK_PROOF" > "$LOCK_PROOF/artifact-size-mib.txt"

        test "$(cut -f1 "$LOCK_PROOF/artifact-size-mib.txt")" -le 64

        '
    - name: Preserve proposed lock and complete dependency audit
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-parser-lock-296
        path: ${{ runner.temp }}/changed-files-lock-296/
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: warn
