name: 296 native new UTF16 UTF32 Punycode payloads
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-codec-payloads-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 0dbc9601c71fd9b31cc7a582a70abe295b1e0d2f
      ORIGINAL_SOURCE_SHA: 0e38b0ea419ac059a2e0628ca6422eac45af81e4
      ORIGINAL_WORKFLOW_SHA: 662cf5803b3a36ec725c89c591afd3e065a5188f
      ORIGINAL_ARTIFACT_ID: '12446034737'
      ORIGINAL_ARTIFACT_BYTES: '9888'
      ORIGINAL_ARTIFACT_SHA256: 2cd8e111b92ec2b674738504b75164b5ba006950ee6d9c3ad47aa62f399721d9
      ORIGINAL_MANIFEST_SHA256: 03ff78c12a96439dfac4555bf5309f006549574753db51e53930d4e24a8d6263
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 0dbc9601c71fd9b31cc7a582a70abe295b1e0d2f
        persist-credentials: false
    - name: Fresh source and isolated native target
      shell: bash
      run: 'set -euo pipefail

        export CODEC_PAYLOAD_BASE="$RUNNER_TEMP/changed-files-codec-payloads-native-296"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/changed-files-codec-payloads-native-296-target"

        printf ''CODEC_PAYLOAD_BASE=%s\nCARGO_TARGET_DIR=%s\n'' "$CODEC_PAYLOAD_BASE" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

        mkdir "$CODEC_PAYLOAD_BASE" "$CARGO_TARGET_DIR"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$CODEC_PAYLOAD_BASE/source.txt"

        git status --porcelain=v1 > "$CODEC_PAYLOAD_BASE/source.before"

        test ! -s "$CODEC_PAYLOAD_BASE/source.before"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$CODEC_PAYLOAD_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin > "$CODEC_PAYLOAD_BASE/native-codec-packages.txt"

        '
    - name: Admit new immutable original artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        base64 --decode <<''PAYLOAD'' > "$CODEC_PAYLOAD_BASE/audit-native.py"

        

        PAYLOAD

        printf ''796bf9c99f778a4ffa5a670f7aaeffedb3f2c425e4b92dffa7103beb070437e0  %s/audit-native.py\n'' "$CODEC_PAYLOAD_BASE"
        | sha256sum --check --strict

        [[ "$ORIGINAL_ARTIFACT_ID" =~ ^[0-9]+$ ]]

        gh api "repos/bin9208/openpilot-rust/actions/artifacts/$ORIGINAL_ARTIFACT_ID/zip" > "$CODEC_PAYLOAD_BASE/original.zip"

        python3 -I -B "$CODEC_PAYLOAD_BASE/audit-native.py" admit

        '
    - name: Build only the new payload integration target
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --test changed_files_codec_payloads -- -D warnings > "$CODEC_PAYLOAD_BASE/clippy.stdout"
        2> "$CODEC_PAYLOAD_BASE/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --test changed_files_codec_payloads --no-run --message-format=json > "$CODEC_PAYLOAD_BASE/tests-build.jsonl"
        2> "$CODEC_PAYLOAD_BASE/tests-build.stderr"

        python3 -I -B "$CODEC_PAYLOAD_BASE/audit-native.py" discover

        '
    - name: Run only the three new payload domains
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        mkdir "$CODEC_PAYLOAD_BASE/actual" "$CODEC_PAYLOAD_BASE/no-executables"

        export AST_CODEC_PAYLOAD_ORIGINAL_DIR="$CODEC_PAYLOAD_BASE/original" AST_CODEC_PAYLOAD_MANIFEST_SHA256="$ORIGINAL_MANIFEST_SHA256"
        AST_CODEC_PAYLOAD_PROOF="$CODEC_PAYLOAD_BASE/actual"

        export PATH="$CODEC_PAYLOAD_BASE/no-executables"

        set +e

        /usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/strace -f -qq -s 4096 -e trace=execve,execveat -o "$CODEC_PAYLOAD_BASE/native.execve"
        "$AST_PAYLOAD_EXE" --test-threads=1 --nocapture > "$CODEC_PAYLOAD_BASE/native.stdout" 2> "$CODEC_PAYLOAD_BASE/native.stderr"

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$CODEC_PAYLOAD_BASE/native.status"

        export PATH=/usr/bin:/bin

        /usr/bin/git status --porcelain=v1 > "$CODEC_PAYLOAD_BASE/source.after"

        /usr/bin/python3 -I -B "$CODEC_PAYLOAD_BASE/audit-native.py" finish

        '
    - if: always()
      name: Bound retained evidence
      shell: bash
      run: "set -euo pipefail\nif test -d \"$CODEC_PAYLOAD_BASE\"; then\n du -sm \"$CODEC_PAYLOAD_BASE\" > \"$CODEC_PAYLOAD_BASE/artifact-size-mib.txt\"\
        \n test \"$(cut -f1 \"$CODEC_PAYLOAD_BASE/artifact-size-mib.txt\")\" -le 16\nfi\n"
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-codec-payloads-native-296
        path: ${{ runner.temp }}/changed-files-codec-payloads-native-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
