name: 296 fused Mean affected compiler regression
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/fused-regression-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  candidate:
    name: Fused Mean complete affected LLVM18 compiler regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 13b3ff14befbcc13d3b9aa1e89c3adc7dc4332d5
    - name: Require exact experimental source
      run: 'test "$(git rev-parse HEAD)" = 13b3ff14befbcc13d3b9aa1e89c3adc7dc4332d5

        test -z "$(git status --porcelain)"

        '
    - name: Prepare LLVM18 original target prerequisites
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update && sudo apt-get install -y g++ libllvm18 git-lfs

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''''

        '
    - name: Require distinct ABI and mutable accumulator semantic keys
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-model-runtime --locked --lib compiler_backend_cpu::fused_mean::tests
        -- --nocapture

        '
    - name: Require cold original output and all affected compiler regression suites
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/fused-mean-candidate"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        sha256sum rust/crates/model-runtime/src/compiler_backend_cpu/fused_mean.rs rust/crates/model-runtime/tests/compiler_conditional_cpu.rs
        > "$proof/inputs.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        FUSED_MEAN_DIAGNOSTICS="$proof/data" cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-model-runtime
        --locked --config profile.test.package.sha2.opt-level=3 --config profile.dev.package.sha2.opt-level=3 --lib --test
        compiler_conditional_cpu --test compiler_gelu_layout --test compiler_conv_pointwise --test compiler_conv_depthwise
        --test compiler_storage_alias --test compiler_backend_cpu --test compiler_image_projection --test compiler_image_packed
        --test compiler_logical_half --test compiler_parallel_conv_layout --test compiler_reduction_backend --test compiler_original_node280
        --test compiler_onnx --test compiler_lower --test compiler_memory --test compiler_render --test compiler_llvm --test
        compiler_input_bindings -- --nocapture --test-threads=2 2>&1 | tee "$proof/regression.log"

        sha256sum -c "$proof/inputs.sha256"

        '
    - name: Require strict native candidate Clippy
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-model-runtime --locked --config profile.test.package.sha2.opt-level=3
        --config profile.dev.package.sha2.opt-level=3 --lib --test compiler_conditional_cpu --test compiler_gelu_layout --test
        compiler_conv_pointwise --test compiler_conv_depthwise --test compiler_storage_alias --test compiler_backend_cpu --test
        compiler_image_projection --test compiler_image_packed --test compiler_logical_half --test compiler_parallel_conv_layout
        --test compiler_reduction_backend --test compiler_original_node280 --test compiler_onnx --test compiler_lower --test
        compiler_memory --test compiler_render --test compiler_llvm --test compiler_input_bindings -- -D warnings

        '
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: fused-mean-affected-regression-evidence
        path: ${{ runner.temp }}/fused-mean-candidate/
        if-no-files-found: warn
