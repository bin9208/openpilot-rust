name: 296 manager car generator predelete source proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/manager-cars-predelete-absence-once.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  manager-cars-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 285b12a628e6f05c55d31c990dd573cc3e8037ee
        persist-credentials: false
    - name: Admit exact checked source and disk
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 285b12a628e6f05c55d31c990dd573cc3e8037ee

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        mkdir -p "$RUNNER_TEMP/manager-qa-original" "$RUNNER_TEMP/manager-native"

        printf ''workflow_head=%s\nchecked_out_source=%s\nrun_id=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID"
        > "$RUNNER_TEMP/manager-native/source-workflow.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Install pinned original dependencies and Rust 1.94
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y jq g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev
        libzstd-dev libzmq3-dev strace

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1

        '
    - name: Compile generator and manager QA leaves, strict Clippy, four plus thirteen units
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/manager-cars-native\"\nmkdir -p \"$proof\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools\
        \ \\\n  --features manager-cars-native,manager-qa-native --lib --test manager_cars_generate --test manager_qa --test\
        \ manager_qa_compat --test manager_retirement --no-run \\\n  --message-format=json > \"$proof/compile.jsonl\" 2> \"\
        $proof/compile.stderr\"\ncargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools \\\n  --features\
        \ manager-cars-native,manager-qa-native --lib --bin generate-manager-cars --bin check-manager-qa --bin check-manager\
        \ --bin check-manager-logging \\\n  --test manager_cars_generate --test manager_qa --test manager_qa_compat --test\
        \ manager_retirement -- -D warnings \\\n  > \"$proof/clippy.stdout\" 2> \"$proof/clippy.stderr\"\ncargo build --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools \\\n  --features manager-cars-native,manager-qa-native --bin generate-manager-cars\
        \ \\\n  > \"$proof/build.stdout\" 2> \"$proof/build.stderr\"\nmapfile -t harness < <(jq -r 'select(.reason==\"compiler-artifact\"\
        \ and .profile.test==true and .target.name==\"manager_cars_generate\") | .executable // empty' \"$proof/compile.jsonl\"\
        )\ntest \"${#harness[@]}\" -eq 1\ntest -f \"${harness[0]}\"\nnative=\"$GITHUB_WORKSPACE/rust/target/$CARGO_BUILD_TARGET/debug/generate-manager-cars\"\
        \ntest -x \"$native\"\nsha256sum \"$native\" \"${harness[0]}\" > \"$proof/native-before.sha256\"\n\ncargo test --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features manager-cars-native,manager-qa-native --lib manager_cars_generate::tests::\
        \ -- --nocapture 2>&1 | tee \"$proof/units.log\"\ngrep -E \"^test result: ok\\. 4 passed; 0 failed; 0 ignored;\" \"\
        $proof/units.log\"\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features manager-cars-native,manager-qa-native\
        \ --lib manager_qa:: -- --nocapture > \"$proof/manager-qa-units.stdout\" 2> \"$proof/manager-qa-units.stderr\"\ngrep\
        \ -E \"^test result: ok\\. 13 passed; 0 failed;\" \"$proof/manager-qa-units.stdout\"\n"
    - name: Configure original platform IPC imports
      run: printf 'PYTHONPATH=%s/platform-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - uses: ./.github/actions/native-json11
    - name: Build real original IPC and Params bindings
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/platform-msgq-python" 2>&1 | tee "$RUNNER_TEMP/manager-native/msgq-build.log"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/platform-params-binding"
        2>&1 | tee "$RUNNER_TEMP/manager-native/params-build.log"

        '
    - name: Compare fresh original seven-brand exports and native check/output effects
      run: "set -euo pipefail\nshopt -s nullglob\nbindings=(\"$RUNNER_TEMP\"/platform-params-binding/params_pyx*.so)\ntest\
        \ \"${#bindings[@]}\" -eq 1\nexport MANAGER_CARS_BINDING=\"${bindings[0]}\"\n#!/usr/bin/env bash\n# Hosted-only step\
        \ after the existing platform job built its real Params binding.\n# Registration of manager-cars-native belongs to\
        \ the parent integration.\nset -euo pipefail\nexport RUSTUP_TOOLCHAIN=1.94.0\n: \"${GITHUB_WORKSPACE:?}\"\n: \"${RUNNER_TEMP:?}\"\
        \n: \"${MANAGER_CARS_BINDING:?}\"\nexport MANAGER_CARS_BINDING\ncd \"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/manager-cars-native\"\
        \ntest -f \"$proof/compile.jsonl\"\npython_exe=\"$(readlink -f \"$(command -v python)\")\"\nsources=(\n  rust/tools/generate_manager_cars.py\n\
        \  rust/tools/original_params_binding.py\n  opendbc/car/__init__.py\n  opendbc/car/docs_definitions.py\n)\nfor brand\
        \ in hyundai gm toyota mazda ford volkswagen tesla; do\n  sources+=(\"opendbc/car/$brand/values.py\")\ndone\nproviders=(\"\
        ${sources[@]}\" \"$python_exe\" \"$MANAGER_CARS_BINDING\")\nfor brand in hyundai gm toyota mazda ford volkswagen tesla;\
        \ do\n  providers+=(\"rust/crates/manager/data/cars/$brand.json\")\ndone\nsha256sum \"${providers[@]}\" > \"$proof/held-before.sha256\"\
        \npython --version > \"$proof/python-version.txt\" 2>&1\n\npython rust/tools/generate_manager_cars.py \"$proof/original\"\
        \ \\\n  --binding \"$MANAGER_CARS_BINDING\" \\\n  > \"$proof/original.stdout\" 2> \"$proof/original.stderr\"\npython\
        \ rust/tools/generate_manager_cars.py \"$proof/original\" \\\n  --binding \"$MANAGER_CARS_BINDING\" --check \\\n \
        \ > \"$proof/original-check.stdout\" 2> \"$proof/original-check.stderr\"\ncmp \"$proof/original.stdout\" \"$proof/original-check.stdout\"\
        \n\nmapfile -t harness < <(jq -r 'select(.reason==\"compiler-artifact\" and .profile.test==true and .target.name==\"\
        manager_cars_generate\") | .executable // empty' \"$proof/compile.jsonl\")\ntest \"${#harness[@]}\" -eq 1\nnative=\"\
        $GITHUB_WORKSPACE/rust/target/$CARGO_BUILD_TARGET/debug/generate-manager-cars\"\nexport MANAGER_CARS_SOURCE_ROOT=\"\
        $GITHUB_WORKSPACE\"\nexport MANAGER_CARS_ORIGINAL_OUTPUT=\"$proof/original\"\nexport MANAGER_CARS_ORIGINAL_STDOUT=\"\
        $proof/original.stdout\"\nexport MANAGER_CARS_NATIVE_BINARY=\"$native\"\nexport MANAGER_CARS_EVIDENCE=\"$proof/native-evidence\"\
        \n\"${harness[0]}\" fresh_original_car_docs_match_native_generation_and_check_mode \\\n  --ignored --exact --nocapture\
        \ > \"$proof/test.stdout\" 2> \"$proof/test.stderr\"\ngrep -Fx 'test fresh_original_car_docs_match_native_generation_and_check_mode\
        \ ... ok' \"$proof/test.stdout\"\ngrep -Eq '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/test.stdout\"\
        \n\n# Capture unchanged-original admission behavior separately from the generator\n# byte proof. Error traceback text\
        \ is retained; only exit status is claimed.\nadmit() {\n  local label=\"$1\" expected=\"$2\"\n  shift 2\n  local code\n\
        \  set +e\n  \"$@\" > \"$proof/$label.stdout\" 2> \"$proof/$label.stderr\"\n  code=$?\n  set -e\n  printf '%s\\n'\
        \ \"$code\" > \"$proof/$label.status\"\n  test \"$code\" -eq \"$expected\"\n}\nadmit original-help 0 python rust/tools/generate_manager_cars.py\
        \ --help\nadmit native-help 0 \"$native\" --help\nadmit original-missing 2 python rust/tools/generate_manager_cars.py\n\
        admit native-missing 2 \"$native\"\nadmit original-unknown 2 python rust/tools/generate_manager_cars.py --unknown\n\
        admit native-unknown 2 \"$native\" --unknown\nprintf 'not an ELF\\n' > \"$proof/bad-binding.so\"\nadmit original-bad-binding\
        \ 1 python rust/tools/generate_manager_cars.py \\\n  \"$proof/original-bad-output\" --binding \"$proof/bad-binding.so\"\
        \nadmit native-reject-binding-option 2 \"$native\" \\\n  \"$proof/native-bad-output\" --binding \"$proof/bad-binding.so\"\
        \ntest ! -e \"$proof/native-bad-output\"\n\nsha256sum \"${providers[@]}\" > \"$proof/held-after.sha256\"\ncmp \"$proof/held-before.sha256\"\
        \ \"$proof/held-after.sha256\"\nsha256sum \"$native\" \"${harness[0]}\" > \"$proof/native-after.sha256\"\ncmp \"$proof/native-before.sha256\"\
        \ \"$proof/native-after.sha256\"\nprintf '%s\\n' \"$(git rev-parse HEAD)\" > \"$proof/checked-source-commit.txt\"\n\
        printf '%s\\n' \"$(git -C opendbc rev-parse HEAD)\" > \"$proof/opendbc-source-commit.txt\"\nsha256sum --check --strict\
        \ \"$proof/native-before.sha256\"\n"
    - name: Require same native ELF in checkout and source-absent private root
      run: "#!/usr/bin/env bash\n# Hosted-only same-ELF proof. Recipe replaces 0 with 0\n# before historical source deletion,\
        \ then 1 at the exact postdelete source.\nset -euo pipefail\nproof=\"$RUNNER_TEMP/manager-cars-native\"\ntest -f \"\
        $proof/compile.jsonl\"\nmapfile -t harness < <(jq -r 'select(.reason==\"compiler-artifact\" and .profile.test==true\
        \ and .target.name==\"manager_cars_generate\") | .executable // empty' \"$proof/compile.jsonl\")\ntest \"${#harness[@]}\"\
        \ -eq 1\ntest -f \"${harness[0]}\"\nexport MANAGER_CARS_RETIREMENT_ROOT=\"$GITHUB_WORKSPACE\"\nexport MANAGER_CARS_RETIREMENT_BINARY=\"\
        $GITHUB_WORKSPACE/rust/target/$CARGO_BUILD_TARGET/debug/generate-manager-cars\"\nexport MANAGER_CARS_RETIREMENT_EVIDENCE=\"\
        $proof/source-absence\"\nexport MANAGER_CARS_RETIREMENT_REQUIRE_ABSENT=0\ntest -x \"$MANAGER_CARS_RETIREMENT_BINARY\"\
        \nif test \"$MANAGER_CARS_RETIREMENT_REQUIRE_ABSENT\" = 1; then\n  test ! -e rust/tools/generate_manager_cars.py &&\
        \ test ! -L rust/tools/generate_manager_cars.py\nelse\n  test -f rust/tools/generate_manager_cars.py && test ! -L\
        \ rust/tools/generate_manager_cars.py\n  test \"$(sha256sum rust/tools/generate_manager_cars.py | cut -d' ' -f1)\"\
        \ = a090e5ba6e30856c4b072ed2d04e682971172fd096592693a0a98756ca9f4caf\nfi\ntest ! -e \"$MANAGER_CARS_RETIREMENT_EVIDENCE\"\
        \nsha256sum \"$MANAGER_CARS_RETIREMENT_BINARY\" \"${harness[0]}\" /usr/bin/strace > \"$proof/absence-providers-before.sha256\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 512\n\"${harness[0]}\" manager_car_generator_trace_parser_rejects_unknown_failed_and_incomplete_execs\
        \ \\\n  --exact > \"$proof/trace-parser.stdout\" 2> \"$proof/trace-parser.stderr\"\ngrep -Fx 'test manager_car_generator_trace_parser_rejects_unknown_failed_and_incomplete_execs\
        \ ... ok' \"$proof/trace-parser.stdout\"\ngrep -E '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/trace-parser.stdout\"\
        \n\"${harness[0]}\" native_car_generator_preserves_original_bytes_in_both_source_states \\\n  --ignored --exact --nocapture\
        \ > \"$proof/absence.stdout\" 2> \"$proof/absence.stderr\"\ngrep -Fx 'test native_car_generator_preserves_original_bytes_in_both_source_states\
        \ ... ok' \"$proof/absence.stdout\"\ngrep -E '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/absence.stdout\"\
        \ntest -f \"$MANAGER_CARS_RETIREMENT_EVIDENCE/result.json\"\njq -e '.passed == true and .original_brand_count == 7\
        \ and .positive_source_states == 2 and .closed_native_execs == 11 and (.closed_native_execs_by_invocation | length)\
        \ == 11 and ([.closed_native_execs_by_invocation[]] | all(. == 1))' \\\n  \"$MANAGER_CARS_RETIREMENT_EVIDENCE/result.json\"\
        \ >/dev/null\nsha256sum \"$MANAGER_CARS_RETIREMENT_BINARY\" \"${harness[0]}\" /usr/bin/strace > \"$proof/absence-providers-after.sha256\"\
        \ncmp \"$proof/absence-providers-before.sha256\" \"$proof/absence-providers-after.sha256\"\ntest \"$(git rev-parse\
        \ HEAD)\" = 285b12a628e6f05c55d31c990dd573cc3e8037ee\nprintf 'workflow_head=%s\\nchecked_out_source=%s\\nmode=%s\\\
        n' \"$GITHUB_SHA\" \"$(git rev-parse HEAD)\" \"$MANAGER_CARS_RETIREMENT_REQUIRE_ABSENT\" > \"$proof/absence-source-workflow.txt\"\
        \n"
    - name: Retain original and native generator evidence
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: manager-cars-predelete-absence-evidence
        retention-days: 14
        if-no-files-found: error
        include-hidden-files: true
        path: '${{ runner.temp }}/manager-cars-native/

          ${{ runner.temp }}/manager-native/

          ${{ runner.temp }}/platform-msgq-python/provenance.json

          ${{ runner.temp }}/platform-params-binding/provenance.json

          ${{ runner.temp }}/platform-params-binding/commands.json'
