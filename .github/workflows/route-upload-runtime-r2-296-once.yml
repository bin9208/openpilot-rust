name: 296 runtime upload continuation with reused manager traffic
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/route-upload-runtime-r2-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  route-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 192ff501f40116022419e470d14a3e732243960c
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 192ff501f40116022419e470d14a3e732243960c
        persist-credentials: false
    - name: Pin candidate and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/route-upload-runtime-r2-proof"

        mkdir "$proof"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''source=%s

        workflow=%s

        '' "$EXPECTED_SOURCE" "$GITHUB_SHA" > "$proof/exact-source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        lscpu --json > "$proof/lscpu.json"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Install ordinary runtime build and independent oracle dependencies
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev pkg-config capnproto libcapnp-dev libavcodec-dev
        libavformat-dev libavutil-dev libzstd-dev libzmq3-dev strace

        python -m pip install pycapnp==2.1.0 zstandard==0.25.0 requests==2.34.2 PyJWT==2.14.0 cryptography==50.0.1

        python --version > "$RUNNER_TEMP/route-upload-runtime-r2-proof/python.txt"

        python -m pip freeze > "$RUNNER_TEMP/route-upload-runtime-r2-proof/pip.txt"

        '
    - name: Verify immutable prior manager evidence without repeating its traffic
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 512\n\
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12414812843/zip > \"$RUNNER_TEMP/route-upload-prior.zip\"\n\
        python - <<'AUDIT'\nfrom pathlib import Path\nimport os,zipfile,hashlib,json\nr=Path(os.environ['RUNNER_TEMP']);p=r/'route-upload-prior.zip'\n\
        assert p.stat().st_size==52560029 and hashlib.sha256(p.read_bytes()).hexdigest()=='0d5e1d640224cd937bc7ccb5f626f92b55ea6525d55ebd4e71620e33c2143c2a'\n\
        with zipfile.ZipFile(p) as z:\n assert len(z.infolist())==741 and z.testzip() is None\n assert json.loads(z.read('route-upload-first-proof/manager-parity.json'))['result']=='PASS'\n\
        \ assert z.read('route-upload-first-proof/grouped.status').strip()==b'1'\n (r/'route-upload-previous-held.json').write_bytes(z.read('route-upload-first-proof/held-before.json'))\n\
        \ (r/'route-upload-runtime-r2-proof/prior-evidence.json').write_text(json.dumps({'run':39753960752,'artifact':12414812843,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'members':741,'manager_traffic_reused':True,'original_group_status':1,'reason':'source-authored\
        \ Git argv missing in audit; runtime never ran'},indent=2)+'\\n')\nAUDIT\n"
    - name: Stage pinned source-present proof recipes
      shell: bash
      run: 'set -euo pipefail

        recipe="$RUNNER_TEMP/route-upload-r2-recipe"

        mkdir "$recipe"

        printf ''%s'' ''''
        | base64 --decode > "$recipe/route-upload-runtime-entry.sh"

        printf ''6bbe8356e5a1863414f6e4a14e590be7335c07b49d55715f04c8b0f2e67bbfbe  %s/route-upload-runtime-entry.sh\n'' "$recipe"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/route-upload-hosted-traffic.sh"

        printf ''f9dc0d14906c4517ebcc1cf35773928a76aeb915d9cc84fccc3cd206f8b91a8a  %s/route-upload-hosted-traffic.sh\n'' "$recipe"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/route-upload-original-capture.py"

        printf ''cb9dde3f84eadc19abfce185c8e60a0601f9d82b95c2563d9019fbd0c1c7cec6  %s/route-upload-original-capture.py\n''
        "$recipe" | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/route-upload-compare.py"

        printf ''36585f580573ac55ebae95dbd8b657ad4bebc6a4470ebd314f610b5a5ef5b382  %s/route-upload-compare.py\n'' "$recipe"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/route-upload-exec-audit.py"

        printf ''f0910957969864a224ff1bb712a3eec7c36abe3863d56a7a25446b68046ca779  %s/route-upload-exec-audit.py\n'' "$recipe"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/route-upload-held.py"

        printf ''eab17f34cde8dd9f2c5dcfa044edd0c480d5883909f18f1008b4fd3f729d468e  %s/route-upload-held.py\n'' "$recipe" |
        sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/provider-preflight.py"

        printf ''65505f5f60398eac021ed53827200ee6aad3ce95afc1132618c7b4984ff3efd6  %s/provider-preflight.py\n'' "$recipe"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$recipe/manager-static-roster.json"

        printf ''54cd60f2f9f0b95b786d831304bd891f339fe5f76c5a8b0a535a18d0c2f79fa8  %s/manager-static-roster.json\n'' "$recipe"
        | sha256sum --check --strict

        printf ''ROUTE_UPLOAD_RECIPE=%s\n'' "$recipe" >> "$GITHUB_ENV"

        '
    - name: Confirm unchanged providers then execute only the previously missing runtime comparison
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 1024

        proof="$RUNNER_TEMP/route-upload-runtime-r2-proof"

        status=0

        bash "$ROUTE_UPLOAD_RECIPE/route-upload-runtime-entry.sh" > "$proof/grouped.stdout" 2> "$proof/grouped.stderr" ||
        status=$?

        printf ''%s

        '' "$status" > "$proof/grouped.status"

        if test "$status" -ne 0; then tail -n 160 "$proof/grouped.stderr" "$proof/grouped.stdout"; fi

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: 296-route-upload-runtime-r2
        retention-days: 14
        if-no-files-found: warn
        path: '${{ runner.temp }}/route-upload-runtime-r2-proof/

          ${{ runner.temp }}/route-upload-r2-recipe/'
