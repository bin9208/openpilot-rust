name: 451 full UI connectivity after complete Wi-Fi acknowledgement publication
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/wifi-acknowledgement-451-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  ui-connectivity:
    name: rust UI and connectivity
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 3a90dc52732b9afcde31c31ae20578bf3109e532
    - name: Require exact private acknowledgement repair source
      run: 'test "$(git rev-parse HEAD)" = 3a90dc52732b9afcde31c31ae20578bf3109e532

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal --component clippy
    - run: sudo apt-get update && sudo apt-get install -y g++ clang cmake make jq curl ghostscript libclang-dev capnproto
        libcapnp-dev libzmq3-dev libgl-dev libx11-dev libxrandr2 libxinerama1 libxcursor1 libxi6 libxtst6 xvfb xauth ffmpeg
        dbus-daemon strace
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 cffi==2.1.1 pillow==12.3.0
        python-xlib==0.33 jeepney==0.9.0 comma-deps-raylib==6.0.0.1.post103 setproctitle==1.3.7 psutil==7.2.2 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 pytest==9.0.2 anyio==4.12.1
    - name: Stage source-pinned native renderer
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 run --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" -p openpilot-dev-tools --locked --bin stage-startup-ui-raylib
        -- --arch x86_64 --output "$RUNNER_TEMP/ui-raylib" --shared

        printf ''STARTUP_UI_RAYLIB_ROOT=%s/ui-raylib\nSTARTUP_UI_RAYLIB_LIBRARY=%s/ui-raylib/lib/libopenpilot-raylib.so\n''
        "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Stage native image decoder SDK
      uses: ./.github/actions/native-image-sdk
    - name: Build native UI validation checkers
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --bin check-ui-translations --bin check-ui-fps
        --bin check-ui-stack --bin check-ui-widgets --bin check-ui-navigation --bin check-ui-scroll --bin check-ui-scroller
        --features egl-reference,polygon-reference,ui-application-lifecycle-native --bin check-ui-egl --bin ui-egl-reference
        --bin check-ui-polygon --bin ui-polygon-reference --bin check-ui-diagnostics --bin ui-diagnostic-reference --bin build-ui-diagnostic-reference
        --bin check-ui-emoji --bin check-ui-forms --bin ui-forms-reference --bin check-ui-render --bin ui-render-reference
        --bin check-ui-network --bin ui-network-reference --bin check-ui-framework --bin check-ui-application --bin ui-application-reference
        --bin build-ui-application-reference --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features egl-reference --test ui_egl_reference
        --test ui_egl_check --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features polygon-reference --test image_array
        --test ui_polygon_reference --test ui_polygon_check --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-image-codecs --features native-sdk --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features image-array-native --test ui_diagnostic_reference
        --test ui_diagnostic_check --test ui_emoji_check --test ui_emoji_ci --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 16

        rust/target/debug/build-ui-diagnostic-reference --output "$RUNNER_TEMP/ui-diagnostic-raw" --raylib-root "$STARTUP_UI_RAYLIB_ROOT"

        printf ''UI_DIAGNOSTIC_RAW_HELPER=%s/ui-diagnostic-raw/ui-diagnostic-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build independent application lifecycle and XTest boundary
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 16

        rust/target/debug/build-ui-application-reference --output "$RUNNER_TEMP/ui-application-raw" --raylib-root "$STARTUP_UI_RAYLIB_ROOT"

        printf ''UI_APPLICATION_RAW_HELPER=%s/ui-application-raw/ui-application-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build independent Forms drawing boundary
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 16

        mkdir -p "$RUNNER_TEMP/ui-forms-raw"

        "${CXX:-c++}" -std=c++17 -Wall -Wextra -Werror -O2 -I "$STARTUP_UI_RAYLIB_ROOT/include" rust/crates/dev-tools/tests/fixtures/ui-forms/raw-raylib.cc
        -ldl -o "$RUNNER_TEMP/ui-forms-raw/ui-forms-raw"

        printf ''UI_FORMS_RAW_HELPER=%s/ui-forms-raw/ui-forms-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        "${CXX:-c++}" -std=c++17 -Wall -Wextra -Werror -O2 -I "$STARTUP_UI_RAYLIB_ROOT/include" rust/crates/dev-tools/tests/fixtures/ui-render/raw-raylib.cc
        -ldl -o "$RUNNER_TEMP/ui-forms-raw/ui-render-raw"

        printf ''UI_RENDER_RAW_HELPER=%s/ui-forms-raw/ui-render-raw\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Build native UI and connectivity with original Params oracle
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-ui-framework -p openpilot-startup-ui -p openpilot-wifi -p
        openpilot-cweb-push -p openpilot-process-supervision -p openpilot-bluetooth --bins --examples --locked

        export WIFI_PROCESS_CHILD_BINARY="$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-bluetooth -p openpilot-wifi --all-targets --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-bluetooth -p openpilot-wifi --all-targets --locked -- -D
        warnings

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/ui-params-binding"

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/connectivity-msgq-python"

        '
    - name: Require Wi-Fi snapshot semantic and allocation regression
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-wifi --lib --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 64

        rustc --edition=2021 rust/tools/wifi_snapshot_allocation_probe.rs --extern "openpilot_wifi=$GITHUB_WORKSPACE/rust/target/debug/libopenpilot_wifi.rlib"
        -L "dependency=$GITHUB_WORKSPACE/rust/target/debug/deps" -o "$RUNNER_TEMP/wifi-snapshot-allocation-probe"

        mkdir -p "$RUNNER_TEMP/ui-connectivity"

        "$RUNNER_TEMP/wifi-snapshot-allocation-probe" --require-improvement | tee "$RUNNER_TEMP/ui-connectivity/wifi-snapshot-allocation.tsv"

        '
    - name: Compare native BlueZ policy controller against sealed original observations
      run: "set -euo pipefail\ntest ! -e rust/tools/check_bluetooth_bluez_policy.py\ntest ! -L rust/tools/check_bluetooth_bluez_policy.py\n\
        export OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/ui-connectivity/bluetooth-bluez-policy\"\n\
        candidate=\"$GITHUB_WORKSPACE/rust/target/debug/examples/bluez_policy\"\nexport BLUEZ_POLICY_NATIVE_OUTPUT=\"$proof/native\"\
        \nexport BLUEZ_POLICY_NATIVE_STDOUT=\"$proof/native.stdout\"\nexport BLUEZ_POLICY_NATIVE_STDERR=\"$proof/native.stderr\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-bluez-policy-native --bin check-bluetooth-bluez-policy\
        \ --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo\
        \ test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-bluez-policy-native --test bluetooth_bluez_policy_check\
        \ --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo\
        \ test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-bluez-policy-native --lib bluetooth_bluez_policy_check::\
        \ --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo\
        \ clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-bluez-policy-native --lib --bin\
        \ check-bluetooth-bluez-policy --test bluetooth_bluez_policy_check --test bluetooth_bluez_policy_reference --locked\
        \ -- -D warnings\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 128\n\
        mkdir -p \"$proof\"\nsha256sum \"$candidate\" rust/target/debug/check-bluetooth-bluez-policy openpilot/selfdrive/carrot/bluetooth/bluez.py\
        \ > \"$proof/artifacts.sha256\"\ntimeout --kill-after=5s 120s rust/target/debug/check-bluetooth-bluez-policy --binary\
        \ \"$candidate\" --output \"$BLUEZ_POLICY_NATIVE_OUTPUT\" > \"$BLUEZ_POLICY_NATIVE_STDOUT\" 2> \"$BLUEZ_POLICY_NATIVE_STDERR\"\
        \nsha256sum -c \"$proof/artifacts.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 128\nabsence=\"$proof/absence\"\nmkdir -p \"$absence/root/rust/tools\"\nfor source in openpilot/selfdrive/carrot/bluetooth/bluez.py\
        \ rust/crates/bluetooth/examples/bluez_policy.rs rust/crates/bluetooth/src/bluez/policy.rs; do\n  mkdir -p \"$absence/root/$(dirname\
        \ \"$source\")\"\n  cp \"$GITHUB_WORKSPACE/$source\" \"$absence/root/$source\"\ndone\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-bluetooth-bluez-policy\"\
        \nprintf '%s\\n' \"$checker\" > \"$absence/checker.path\"\nprintf '%s\\n' \"$candidate\" > \"$absence/candidate.path\"\
        \ntest ! -e \"$absence/root/rust/tools/check_bluetooth_bluez_policy.py\"\ntest ! -L \"$absence/root/rust/tools/check_bluetooth_bluez_policy.py\"\
        \nOPENPILOT_RUST_ROOT=\"$absence/root\" PATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/strace\
        \ -f -qq -s 65535 -e trace=execve,execveat -o \"$absence/native.exec\" \"$checker\" --binary \"$candidate\" --output\
        \ \"$absence/output\" > \"$absence/native.stdout\" 2> \"$absence/native.stderr\"\nfor name in cases.jsonl source.json\
        \ native.jsonl native.stderr digits.stdout digits.stderr result.json; do\n  cmp \"$BLUEZ_POLICY_NATIVE_OUTPUT/$name\"\
        \ \"$absence/output/$name\"\ndone\ncmp \"$BLUEZ_POLICY_NATIVE_STDOUT\" \"$absence/native.stdout\"\ncmp \"$BLUEZ_POLICY_NATIVE_STDERR\"\
        \ \"$absence/native.stderr\"\nsha256sum -c \"$proof/artifacts.sha256\"\nexport BLUEZ_POLICY_ABSENCE_PROOF=\"$absence\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 128\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-bluez-policy-native --test bluetooth_bluez_policy_reference\
        \ --locked -- --nocapture\n"
    - name: Compare native Bluetooth enumeration controller against sealed original observations
      run: "set -euo pipefail\ntest ! -e rust/tools/check_bluetooth_enumerate.py\ntest ! -L rust/tools/check_bluetooth_enumerate.py\n\
        export OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/ui-connectivity/bluetooth-enumerate\"\ncandidate=\"\
        $GITHUB_WORKSPACE/rust/target/debug/examples/input_fixture\"\nexport BLUETOOTH_ENUMERATE_NATIVE_OUTPUT=\"$proof/native\"\
        \nexport BLUETOOTH_ENUMERATE_NATIVE_STDOUT=\"$proof/native.stdout\"\nexport BLUETOOTH_ENUMERATE_NATIVE_STDERR=\"$proof/native.stderr\"\
        \nexport BLUETOOTH_ENUMERATE_ABSENT_ROOT=\"$proof/absent-root\"\nexport BLUETOOTH_ENUMERATE_ABSENT_OUTPUT=\"$proof/absent-native\"\
        \nexport BLUETOOTH_ENUMERATE_ABSENT_STDOUT=\"$proof/absent-native.stdout\"\nexport BLUETOOTH_ENUMERATE_ABSENT_STDERR=\"\
        $proof/absent-native.stderr\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-enumerate-native --bin\
        \ check-bluetooth-enumerate --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-enumerate-native\
        \ --lib bluetooth_enumerate_check:: --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-enumerate-native\
        \ --lib --bin check-bluetooth-enumerate --test bluetooth_enumerate_reference --locked -- -D warnings\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\nmkdir -p \"$proof\"\nsha256sum \"$candidate\" rust/target/debug/check-bluetooth-enumerate\
        \ openpilot/selfdrive/carrot/bluetooth/daemon.py > \"$proof/artifacts.sha256\"\ntimeout --kill-after=5s 30s rust/target/debug/check-bluetooth-enumerate\
        \ --binary \"$candidate\" --output \"$BLUETOOTH_ENUMERATE_NATIVE_OUTPUT\" > \"$BLUETOOTH_ENUMERATE_NATIVE_STDOUT\"\
        \ 2> \"$BLUETOOTH_ENUMERATE_NATIVE_STDERR\"\nsha256sum -c \"$proof/artifacts.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\nabsent_sources=(\n  openpilot/selfdrive/carrot/bluetooth/daemon.py\n\
        \  openpilot/selfdrive/carrot/bluetooth/model.py\n  rust/tools/bluetooth_engine_source.py\n  rust/crates/bluetooth/examples/input_fixture.rs\n\
        \  rust/crates/bluetooth/src/input.rs\n)\nmkdir -p \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\" \"$proof/empty-path\"\nsha256sum\
        \ \"${absent_sources[@]}\" > \"$proof/present-sources.sha256\"\nfor name in \"${absent_sources[@]}\"; do\n  cp --parents\
        \ -- \"$name\" \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\"\n  cmp -- \"$name\" \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/$name\"\
        \ndone\n(cd \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\" && sha256sum \"${absent_sources[@]}\") > \"$proof/absent-sources.sha256\"\
        \ntest -d \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools\"\ntest ! -e \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\
        \ntest ! -L \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-bluetooth-enumerate\"\
        \nOPENPILOT_RUST_ROOT=\"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\" PATH=\"$proof/empty-path\" /usr/bin/timeout --signal=TERM\
        \ --kill-after=5s 30s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o \"$proof/absent.exec\" \"$checker\"\
        \ --binary \"$candidate\" --output \"$BLUETOOTH_ENUMERATE_ABSENT_OUTPUT\" > \"$BLUETOOTH_ENUMERATE_ABSENT_STDOUT\"\
        \ 2> \"$BLUETOOTH_ENUMERATE_ABSENT_STDERR\"\nawk -v checker=\"$checker\" -v candidate=\"$candidate\" '\n  /execveat\\\
        (/ { unexpected++; next }\n  /execve\\(/ {\n    if (index($0, \"execve(\\\"\" checker \"\\\",\") > 0) controller++;\n\
        \    else if (index($0, \"execve(\\\"\" candidate \"\\\",\") > 0) fixture++;\n    else unexpected++;\n  }\n  END {\n\
        \    printf \"checker=%d fixture=%d unexpected=%d\\n\", controller, fixture, unexpected;\n    exit !(controller ==\
        \ 1 && fixture == 2 && unexpected == 0);\n  }\n' \"$proof/absent.exec\" | tee \"$proof/absent-exec-roster.txt\"\n\
        sha256sum -c \"$proof/artifacts.sha256\"\nsha256sum -c \"$proof/present-sources.sha256\"\n(cd \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\"\
        \ && sha256sum -c \"$proof/absent-sources.sha256\")\nfor name in \"${absent_sources[@]}\"; do cmp -- \"$name\" \"\
        $BLUETOOTH_ENUMERATE_ABSENT_ROOT/$name\"; done\ntest ! -e \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\
        \ntest ! -L \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-enumerate-native --test bluetooth_enumerate_reference --locked -- --nocapture\n"
    - name: Compare native Bluetooth sudo fixture with unchanged original
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/ui-connectivity/bluetooth-sudo-fixture"

        export BLUETOOTH_SUDO_ORIGINAL_PYTHON="$GITHUB_WORKSPACE/rust/tools/bluetooth_sudo_fixture.py"

        export BLUETOOTH_SUDO_EVIDENCE="$proof/cases"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-sudo-fixture-native --bin
        bluetooth-sudo-fixture --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-sudo-fixture-native --test
        bluetooth_sudo_fixture --locked --no-run

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        mkdir -p "$proof"

        interpreter="$(readlink -f "$(command -v python)")"

        sha256sum "$interpreter" rust/tools/bluetooth_sudo_fixture.py rust/target/debug/bluetooth-sudo-fixture > "$proof/artifacts.sha256"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-sudo-fixture-native --test
        bluetooth_sudo_fixture --locked -- --nocapture

        sha256sum -c "$proof/artifacts.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-sudo-fixture-native --lib
        --bin bluetooth-sudo-fixture --test bluetooth_sudo_fixture --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        native_sudo="$proof/bluetooth-sudo-fixture"

        cp --no-clobber rust/target/debug/bluetooth-sudo-fixture "$native_sudo"

        cmp rust/target/debug/bluetooth-sudo-fixture "$native_sudo"

        native_sha=$(sha256sum "$native_sudo" | cut -d '' '' -f1)

        printf ''BLUETOOTH_SUDO_NATIVE_BINARY=%s\nBLUETOOTH_SUDO_NATIVE_SHA256=%s\n'' "$native_sudo" "$native_sha" >> "$GITHUB_ENV"

        sha256sum "$native_sudo" rust/tools/bluetooth_sudo_fixture.py rust/tools/check_bluetooth_input.py rust/tools/bluetooth_daemon_fixture.py
        > "$proof/caller-artifacts.sha256"

        '
    - name: Compare native Bluetooth gesture corpus with unchanged original
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/ui-connectivity/bluetooth-gesture-cases"

        candidate="$GITHUB_WORKSPACE/rust/target/debug/examples/gesture_fixture"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-gesture-cases-native --bin
        generate-bluetooth-gesture-cases --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-gesture-cases-native --test
        bluetooth_gesture_cases_generate --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-gesture-cases-native --lib
        --bin generate-bluetooth-gesture-cases --test bluetooth_gesture_cases_generate --test bluetooth_gesture_cases_retirement
        --locked -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128

        mkdir -p "$proof"

        sha256sum "$candidate" rust/target/debug/generate-bluetooth-gesture-cases rust/tools/check_bluetooth_gestures.py openpilot/selfdrive/carrot/bluetooth/model.py
        openpilot/selfdrive/carrot/bluetooth/tests/yiser_j6.json > "$proof/artifacts.sha256"

        test ! -e rust/tools/bluetooth_gesture_cases.py

        test ! -L rust/tools/bluetooth_gesture_cases.py

