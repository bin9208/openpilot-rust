name: 296 calibration float actual Python deletion proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/calibration-postdelete-296-once.yml
permissions:
  contents: read
jobs:
  calibration-postdelete:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: cd51eb14c7b7ea0343fbd4c9379db6e28f2c1361
    steps:
    - uses: actions/checkout@v7
      with:
        ref: cd51eb14c7b7ea0343fbd4c9379db6e28f2c1361
        persist-credentials: false
    - name: Admit exact deleted checkout and install native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        test ! -e rust/tools/check_calibration_float.py

        test ! -L rust/tools/check_calibration_float.py

        proof="$RUNNER_TEMP/calibration-postdelete-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev pkg-config strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        printf ''OPENPILOT_RUST_ROOT=%s\nCALIBRATION_FLOAT_BINARY=%s/rust/target/debug/examples/calibration_float\nCALIBRATION_POSTDELETE_EVIDENCE=%s/postdelete\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$proof" >> "$GITHUB_ENV"

        '
    - name: Build fresh checker and candidate without Python
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/calibration-postdelete-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-calibrationd --example calibration_float --locked
        2>&1 | tee "$proof/candidate-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --bin
        check-calibration-float --locked 2>&1 | tee "$proof/checker-build.log"

        '
    - name: Require 25 cold cases, two absent roots, 56 execs each, all CLI and failure regressions
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/calibration-postdelete-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --test
        calibration_float_check --test calibration_float_postdelete --test qa_process --test argparse_scan --locked -- --nocapture
        2>&1 | tee "$proof/tests.log"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --lib
        calibration_float_check::tests --locked 2>&1 | tee "$proof/lib-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-float-native --lib
        --bin check-calibration-float --test calibration_float_check --test calibration_float_postdelete --test qa_process
        --test argparse_scan --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        rust/target/debug/check-calibration-float --binary "$CALIBRATION_FLOAT_BINARY" --output "$proof/cli-native" > "$proof/cli.stdout"
        2> "$proof/cli.stderr"

        test ! -e rust/tools/check_calibration_float.py

        test ! -L rust/tools/check_calibration_float.py

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: calibration-actual-postdelete
        path: ${{ runner.temp }}/calibration-postdelete-296/
