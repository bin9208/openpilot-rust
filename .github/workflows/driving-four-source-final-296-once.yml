name: 296 final native driving four-source retirement
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driving-four-source-final-296-once.yml
permissions:
  contents: read
jobs:
  driving-four-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE: f42c1d6b9c800b884654fc5ab470d9d94f34823a
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f42c1d6b9c800b884654fc5ab470d9d94f34823a
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install hosted compiler dependencies and build current native ELFs
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 12288

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        sudo apt-get update

        sudo apt-get install -y clang g++ libllvm18 liblzma-dev capnproto libcapnp-dev

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2

        cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bin model-run --locked

        cargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld -p openpilot-logmessaged --locked

        cargo build --manifest-path rust/Cargo.toml -p openpilot-desire --example desire_probe --locked

        '
    - name: Materialize only the 25 authenticated retained historical report data files
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-four-source"

        mkdir -p "$proof/retained-e25"

        base64 --decode <<''RETAINED_DATA_BASE64'' > "$proof/retained25-data.tar.xz"

        

        RETAINED_DATA_BASE64

        printf ''%s  %s\n'' 3e439106ddbf6fe3e3f9b665f8c8ac2298f12201aa0b9ed861b8212ac4368bb3 "$proof/retained25-data.tar.xz"
        | sha256sum -c -

        tar -xJf "$proof/retained25-data.tar.xz" -C "$proof/retained-e25"

        printf ''DRIVING_RETAINED_E25_REPORTS=%s\nDRIVING_REPLAY_RETAINED_E25=1\n'' "$proof/retained-e25" >> "$GITHUB_ENV"

        '
    - name: Run durable archive and current-host native four-source closure
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driving-four-source\"\nmkdir -p \"$proof\"\nexport EXPECTED_SOURCE=\"\
        ${EXPECTED_SOURCE:-$GITHUB_SHA}\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nfor name in check_driving_daemon.py\
        \ check_model_logging_faults.py driving_daemon_reference.py check_desire_reference.py; do\n  test ! -e \"rust/tools/$name\"\
        \n  test ! -L \"rust/tools/$name\"\ndone\nexport OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nexport DRIVING_DAEMON_ROOT=\"\
        $GITHUB_WORKSPACE\"\nexport DRIVING_SOURCE_POLICY=retired-driving\nexport DRIVING_RETIREMENT_EXPECT_ABSENT=1\nexport\
        \ DRIVING_FIXTURE_DIRECTORY=\"$proof/historical-complete-fixture\"\nexport DRIVING_FIXTURE_MANIFEST_SHA256=afe1c795d7f609801eb4cd5a5a7748c3c996929403a3c0fa102f232f2a8d248d\n\
        export DRIVING_FIXTURE_ARCHIVE=\"$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz\"\
        \nexport DRIVING_FIXTURE_ARCHIVE_SHA256=3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe\nexport DRIVING_FIXTURE_ARCHIVE_BYTES=59663776\n\
        export DRIVING_FIXTURE_ARCHIVE_COMPACT=true\nexport DRIVING_ORIGINAL_OBSERVATION=\"$DRIVING_FIXTURE_DIRECTORY/observations\"\
        \nexport DRIVING_ORIGINAL_MANIFEST_SHA256=ed174bb4610ee55108b3f2502d7ed284cb66abb3cd153777ca546bf8fe0d3fca\nexport\
        \ DRIVING_CURRENT_CATALOG=\"$proof/current-host-catalog\"\nexport DRIVING_CURRENT_CATALOG_RECEIPT=\"$proof/current-host-catalog-receipt.json\"\
        \nexport DRIVING_DAEMON_NATIVE_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-driving-modeld\"\nexport DRIVING_DAEMON_COLLECTOR=\"\
        $GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged\"\nexport DRIVING_DAEMON_PEER=\"$proof/peer/driving-daemon-peer\"\
        \nexport DRIVING_RETIREMENT_OUTPUT=\"$proof/retirement\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 3072\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native\
        \ --locked \\\n  --bin stage-driving-daemon-fixture --bin seal-driving-daemon-fixture --bin check-driving-daemon \\\
        \n  --bin check-model-logging-faults --bin build-driving-logging-fault --bin generate-services-header\ncargo test\
        \ --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked --no-run \\\n \
        \ --test driving_fixture_archive --test driving_daemon_reference --test driving_daemon_retirement 2>&1 | tee \"$proof/family-compile-admission.log\"\
        \ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked \\\
        \n  --lib --bin stage-driving-daemon-fixture --bin seal-driving-daemon-fixture --bin check-driving-daemon \\\n  --bin\
        \ check-model-logging-faults --bin build-driving-logging-fault --bin generate-services-header \\\n  --test driving_fixture_archive\
        \ --test driving_daemon_reference --test driving_daemon_retirement -- -D warnings 2>&1 | tee \"$proof/clippy.log\"\
        \n# All family unit/adversarial cases and host-ISA/held-receipt regressions precede traffic.\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked --lib driving_ -- --nocapture 2>&1\
        \ | tee \"$proof/family-unit.log\"\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native\
        \ --locked --test driving_fixture_archive -- --nocapture 2>&1 | tee \"$proof/archive-adversarial-and-regeneration.log\"\
        \nprintf '%s  %s\\n' \"$DRIVING_FIXTURE_MANIFEST_SHA256\" rust/crates/dev-tools/tests/fixtures/driving-daemon-original/fixture.json\
        \ \\\n  810f2c0f291178314c3c5c58d83e77700fa5e40977592da24a7e154276083e12 rust/crates/dev-tools/tests/fixtures/driving-daemon-original/packaging-receipt.json\
        \ | sha256sum -c -\nrust/target/debug/stage-driving-daemon-fixture --archive \"$DRIVING_FIXTURE_ARCHIVE\" \\\n  --output\
        \ \"$DRIVING_FIXTURE_DIRECTORY\" --blob-sha256 \"$DRIVING_FIXTURE_ARCHIVE_SHA256\" \\\n  --blob-bytes \"$DRIVING_FIXTURE_ARCHIVE_BYTES\"\
        \ --compact-images > \"$proof/native-stage.json\"\nrust/target/debug/seal-driving-daemon-fixture --output \"$DRIVING_FIXTURE_DIRECTORY\"\
        \ --verify-sha \"$DRIVING_FIXTURE_MANIFEST_SHA256\" > \"$proof/historical-before.json\"\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --locked --test driving_daemon_reference\
        \ -- --nocapture 2>&1 | tee \"$proof/original-observation-seals.log\"\n# Parent generation embeds the reviewed exporter\
        \ bytes here and pins their SHA.\nbase64 --decode <<'CURRENT_EXPORTER_BASE64' > \"$proof/export_current_driving_catalog.py\"\
        \\n\
        CURRENT_EXPORTER_BASE64\nprintf '%s  %s\\n' 94a5f103c3831a7bbdf7f6733c5576230539ccb906f1ad3368e587ea16c4a49c \"$proof/export_current_driving_catalog.py\"\
        \ | sha256sum -c -\npython -m py_compile \"$proof/export_current_driving_catalog.py\"\nbase64 --decode <<'EXPORTER_PATH_TEST_BASE64'\
        \ > \"$proof/test_export_current_catalog_paths.py\"\\n\
        EXPORTER_PATH_TEST_BASE64\nprintf '%s  %s\\n' 0810f0cedc18ea3de07227924326b447fa5f01c766ff9aa64ab94c0fe0262366 \"\
        $proof/test_export_current_catalog_paths.py\" | sha256sum -c -\npython -P \"$proof/test_export_current_catalog_paths.py\"\
        \ > \"$proof/exporter-path-tests.log\" 2>&1\npython -P \"$proof/export_current_driving_catalog.py\" --root \"$GITHUB_WORKSPACE\"\
        \ \\\n  --fixture \"$DRIVING_FIXTURE_DIRECTORY\" --fixture-sha256 \"$DRIVING_FIXTURE_MANIFEST_SHA256\" \\\n  --catalog\
        \ \"$DRIVING_CURRENT_CATALOG\" --receipt \"$DRIVING_CURRENT_CATALOG_RECEIPT\" > \"$proof/current-export.json\"\nrust/target/debug/model-run\
        \ --check-catalog \"$DRIVING_CURRENT_CATALOG\" > \"$proof/current-catalog-admission.json\"\n# Build the same original\
        \ C++ IPC peer using a Rust-generated service header.\nmkdir \"$proof/peer\"\nrust/target/debug/generate-services-header\
        \ --script-newline --output \"$proof/peer/services.h\"\ng++ -std=c++17 -pthread -I\"$GITHUB_WORKSPACE/msgq_repo\"\
        \ -I\"$proof/peer\" \\\n  rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc\
        \ \\\n  msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc \\\n  -o \"$DRIVING_DAEMON_PEER\"\
        \ > \"$proof/peer-build.stdout\" 2> \"$proof/peer-build.stderr\"\nsha256sum \"$DRIVING_DAEMON_NATIVE_BINARY\" \"$DRIVING_DAEMON_COLLECTOR\"\
        \ \"$DRIVING_DAEMON_PEER\" > \"$proof/production-elf-seals.sha256\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 12288\nrust/target/debug/build-driving-logging-fault --root \"$GITHUB_WORKSPACE\" --output \"$proof/fault-builder\"\
        \ \\\n  --cargo \"$(command -v cargo)\" --compiler \"$(command -v c++)\" 2>&1 | tee \"$proof/fault-builder.log\"\n\
        export DRIVING_LOGGING_FAULT_BINARY=\"$proof/fault-builder/openpilot-driving-modeld-fault\"\nsha256sum -c \"$proof/production-elf-seals.sha256\"\
        \n# One-time final gate provides the already audited 25 retained reports separately.\n# Maintained runs need no ephemeral\
        \ historical artifact or retired source download.\nif [[ \"${DRIVING_REPLAY_RETAINED_E25:-0}\" == 1 ]]; then\n  mkdir\
        \ -p \"$proof/retained-comparison\"\n  DRIVING_RETIREMENT_OUTPUT=\"$proof/retained-comparison\" cargo test --manifest-path\
        \ rust/Cargo.toml \\\n    -p openpilot-dev-tools --features driving-daemon-native --locked --test driving_daemon_retirement\
        \ \\\n    retained_e25_completed_traffic_reports_match_with_accounted_wait_debug_counts -- --ignored --exact --nocapture\
        \ 2>&1 | tee \"$proof/retained-replay.log\"\nfi\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\" --growth-mib\
        \ 3072\n# Exactly one full current-source run: two roots, each model6/collector6/fault2,\n# then all eight regular/link\
        \ reappearance controls. Ignored history is separate.\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features driving-daemon-native --locked \\\n  --test driving_daemon_retirement -- --nocapture 2>&1 | tee \"$proof/current-two-root-retirement.log\"\
        \nrust/target/debug/seal-driving-daemon-fixture --output \"$DRIVING_FIXTURE_DIRECTORY\" --verify-sha \"$DRIVING_FIXTURE_MANIFEST_SHA256\"\
        \ > \"$proof/historical-after.json\"\nsha256sum -c \"$proof/production-elf-seals.sha256\"\n"
    - name: Verify native desire controller after shared Python helper retirement
      working-directory: .
      run: 'set -euo pipefail

        test ! -e rust/tools/check_desire_reference.py

        test ! -L rust/tools/check_desire_reference.py

        proof="$RUNNER_TEMP/desire-controller-native"

        mkdir -p "$proof"

        export OPENPILOT_RUST_ROOT="$GITHUB_WORKSPACE"

        export DESIRE_REFERENCE_CHECKER="$GITHUB_WORKSPACE/rust/target/debug/check-desire-reference-native"

        export DESIRE_REFERENCE_PROBE="$GITHUB_WORKSPACE/rust/target/debug/examples/desire_probe"

        export DESIRE_REFERENCE_EXPECT_ABSENT=1

        export DESIRE_REFERENCE_RETIREMENT_OUTPUT="$proof/retirement"

        export DESIRE_REFERENCE_CLI_OUTPUT="$proof/cli"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --bin check-desire-reference-native
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --lib desire_reference_check::
        --locked -- --nocapture 2>&1 | tee "$proof/unit-tests.log"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --test desire_reference_check
        --test desire_reference_retirement --test desire_reference_cli --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --lib --bin
        check-desire-reference-native --test desire_reference_check --test desire_reference_retirement --test desire_reference_cli
        --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        rust/target/debug/check-desire-reference-native --binary "$DESIRE_REFERENCE_PROBE" --output "$proof/default-cli" >
        "$proof/default-cli.stdout" 2> "$proof/default-cli.stderr"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driving-four-source-final-296
        retention-days: 7
        if-no-files-found: error
        path: '${{ runner.temp }}/driving-four-source/

          ${{ runner.temp }}/desire-controller-native/

          !${{ runner.temp }}/driving-four-source/retirement/private-root/**

          !${{ runner.temp }}/driving-four-source/fault-builder/target/**

          !${{ runner.temp }}/driving-four-source/historical-complete-fixture/**

          '
