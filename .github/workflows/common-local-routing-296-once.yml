{
  "name": "296 native YAML parser recovery and changed policy only",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/common-local-routing-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "routing-policy": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 30,
      "concurrency": {
        "group": "common-local-routing-296-${{ github.repository }}-${{ github.ref }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "env": {
        "SOURCE_SHA": "2a372557d8958cb38127959a583fa7522b9ed991",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "ROUTING_REUSE_BASE64": "",
        "ROUTING_REUSE_SHA256": "8120ca1f03ece8e731fa9bcc0d05c604c4a99f410fbe125dba46f8ce7a79eba5"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Deny fork source and require registered local runner",
          "shell": "bash",
          "env": {
            "SOURCE_ALLOWED": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
          },
          "run": "test \"${SOURCE_ALLOWED:-}\" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }\nset -euo pipefail\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$RUNNER_ENVIRONMENT\" = self-hosted\ntest \"$RUNNER_OS\" = Linux\ntest \"$RUNNER_ARCH\" = X64\n"
        },
        {
          "name": "Common owned shell output",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Allocate private source and tools before checkout",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "working-directory": "${{ github.workspace }}",
          "run": "set -euo pipefail\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\njob=$CI_JOB_TEMP\nowner=\"${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}\"\ntest \"$(cat \"$job/owner\")\" = \"$owner\"\nmkdir \"$job/proof\" \"$job/cache\" \"$job/home\"\nprintf '%s\n' \"ROUTING_PROOF=$job/proof\" \"HOME=$job/home\" \"CARGO_HOME=$job/cargo-home\" \"RUSTUP_HOME=$job/rustup-home\" \"CARGO_TARGET_DIR=$job/target\" \"PIP_CACHE_DIR=$job/cache/pip\" \"XDG_CACHE_HOME=$job/cache\" >> \"$GITHUB_ENV\"\navailable=$(df -PB1 \"$workspace\" | awk 'NR == 2 {print $4}')\n[[ $available =~ ^[0-9]+$ ]]\nrequired=$((2 * 1024 * 1024 * 1024))\nprintf '{\"available_bytes\":%s,\"planned_source_growth_bytes\":%s}\n' \"$available\" \"$required\" > \"$job/proof/source-growth-before-checkout.json\"\n((available >= required))\nsource_owner=$(mktemp -d \"$workspace/.routing-296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX\")\nprintf '%s\n' \"$owner\" > \"$source_owner/.routing-owner\"\nmkdir \"$source_owner/source\"\nsource=\"$source_owner/source\"\nprintf '%s\n' \"ROUTING_SOURCE_OWNER=$source_owner\" \"ROUTING_SOURCE_IDENTITY=$(stat -c '%d:%i' -- \"$source_owner\")\" \"ROUTING_SOURCE=$source\" \"ROUTING_CHECKOUT_PATH=${source#\"$workspace/\"}\" >> \"$GITHUB_ENV\"\nprintf 'job=%s\nsource_owner=%s\nsource_identity=%s\nowner=%s\n' \"$job\" \"$source_owner\" \"$(stat -c '%d:%i' -- \"$source_owner\")\" \"$owner\" > \"$job/proof/owned-paths.txt\"\n"
        },
        {
          "uses": "actions/checkout@v7",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "with": {
            "ref": "${{ env.SOURCE_SHA }}",
            "path": "${{ env.ROUTING_CHECKOUT_PATH }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          }
        },
        {
          "name": "Expose provisioned Rust shims",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "uses": "bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Focused routing and policy source assertions only",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "working-directory": "${{ env.ROUTING_SOURCE }}",
          "run": "set -euo pipefail\nproof=$ROUTING_PROOF\nroot=$PWD\n[[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\ngit diff --exit-code\ngit diff --cached --exit-code\nprintf '%s\n' \"$SOURCE_SHA\" > \"$proof/SOURCE_COMMIT\"\nprintf '%s\n' \"$GITHUB_SHA\" > \"$proof/WORKFLOW_COMMIT\"\nprintf '%s\n' \"$RUNNER_NAME\" \"$RUNNER_ENVIRONMENT\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" > \"$proof/runner.txt\"\ngit ls-files -z > \"$proof/index-before.bin\"\nseal_source() {\n  tar --null --no-recursion --verbatim-files-from -T \"$proof/index-before.bin\" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum\n}\nseal_source > \"$proof/source-before.sha256\"\nrequire_growth() {\n  local mib=$1 available\n  available=$(df -PB1 \"$CI_JOB_TEMP\" | awk 'NR == 2 {print $4}')\n  [[ $available =~ ^[0-9]+$ ]]\n  printf '{\"available_bytes\":%s,\"planned_growth_mib\":%s}\n' \"$available\" \"$mib\" >> \"$proof/growth.jsonl\"\n  ((available >= mib * 1024 * 1024))\n}\nuname -a > \"$proof/kernel.txt\"\nlscpu > \"$proof/cpu.txt\"\ncat /proc/meminfo > \"$proof/memory-before.txt\"\ndf -PB1 \"$root\" \"$CI_JOB_TEMP\" > \"$proof/disk-before.txt\"\nif test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > \"$proof/cgroup-memory-before.txt\"; fi\nfor tool in rustup cargo rustc capnp c++ git bash tar; do command -v \"$tool\"; done > \"$proof/tools.txt\"\nwhile read -r tool; do readlink -f \"$tool\"; done < \"$proof/tools.txt\" | sort -u | xargs sha256sum > \"$proof/tool-paths.sha256\"\n# This is the focused changed policy/source assertion gate. It does not run\n# QEMU, macOS substitutes, accepted estimator/startup/controller corpora, or\n# unchanged old original captures. Shared transport verification stays #502's.\nrequire_growth 8192\nrustup toolchain install 1.94.0 --profile minimal --component clippy\nexport RUSTUP_TOOLCHAIN=1.94.0\nrustc -vV > \"$proof/rustc.txt\"\ncapnp --version > \"$proof/capnp.txt\"\n# Fail before compilation if the parent accidentally binds the old adff source.\npython3 - <<'SOURCE_CONTRACT'\nimport base64,hashlib,json,os,re\nfrom pathlib import Path\nr=Path.cwd()\nc=json.loads((r/'tools/ci/local-routing-296-contract.json').read_text())\nassert os.environ['SOURCE_SHA']=='2a372557d8958cb38127959a583fa7522b9ed991'\noverrides={}\nfor key in ['loggerd_peer_registration_overlay','ast_caller_registration_overlay','route_vault_bundle_registration_overlay','aggregate_negative_control_repair','yaml_key_alias_token_repair']:\n    overrides.update(c[key]['source_file_sha256'])\nfor row in c['common502_8af_capacity_reuse']['active_build_side_changes']:\n    overrides[row['path']]=row['after_sha256']\nfor name,seal in overrides.items():\n    assert hashlib.sha256((r/name).read_bytes()).hexdigest()==seal,name\nfor name,seal in c['files'].items():\n    assert name not in overrides\n    assert hashlib.sha256((r/name).read_bytes()).hexdigest()==seal['sha256'],name\nfor name,seal in c['composite_action_sha256'].items():\n    assert name not in overrides\n    assert hashlib.sha256((r/name).read_bytes()).hexdigest()==seal,name\nfor name,seal in c['maintained_model_activation_rebase']['unchanged_parent_prerequisites'].items():\n    assert hashlib.sha256((r/name).read_bytes()).hexdigest()==overrides.get(name,seal),name\nassert c['private_ownership_review_fixes']['recommendation_sha256']=='25fb712d0ed439c36d8b3096a83ea436bf96bb0a948c9e1052595e6739e60a9b'\nassert c['private_ownership_review_fixes']['base_patch_sha256']=='d9f70877b46aad7fcb346d74edd9105ad3c4983aa95be5b98459ca447eda0e3c'\nfor key,field in [('parent_retention_rebase','source_file_sha256'),('module_path_repair','parent_file_sha256'),('action_distribution','caller_file_sha256'),('guest_file_provider_repair','source_file_sha256')]:\n    for name,seal in c[key][field].items():\n        assert hashlib.sha256((r/name).read_bytes()).hexdigest()==overrides.get(name,seal),name\nassert hashlib.sha256((r/'rust/crates/dev-tools/src/paramsd_estimator_check/numeric.rs').read_bytes()).hexdigest()==c['module_path_repair']['shared_numeric_sha256']\nassert c['module_path_repair']['failed_source']!=os.environ['SOURCE_SHA']\nassert c['source_commit']=='77663836a95a9e2aff9aa66592d8b06ed9c87cd9'\nassert c['action_distribution']['commit']=='b2fc62472ce8183114d59dbeec4d1406df44e4c2'\nassert c['action_distribution']['source_commit']==c['source_commit']\nassert c['guest_file_provider_repair']['base_r5_combined_patch_sha256']=='58736194cc8ff5f35b2099a84aa8060ba8811fb5b75b5bba65ea5c47f313f43f'\nraw=base64.b64decode(os.environ['ROUTING_REUSE_BASE64'],validate=True)\nassert hashlib.sha256(raw).hexdigest()==os.environ['ROUTING_REUSE_SHA256']\nreceipt=json.loads(raw)\nassert receipt['source']==os.environ['SOURCE_SHA'] and receipt['not_full_acceptance'] is True\nassert receipt['separate_AST_admitted'] is False\ntext=(r/'rust/crates/dev-tools/tests/ci_workflow_policy.rs').read_text()\npoints=list(re.finditer(r'^fn ([A-Za-z0-9_]+)\\(',text,re.MULTILINE))\nfunctions={m.group(1):text[m.start():points[i+1].start() if i+1<len(points) else len(text)] for i,m in enumerate(points)}\nfor name,seal in receipt['reused_policy_function_sha256'].items():\n    assert hashlib.sha256(functions[name].encode()).hexdigest()==seal,name\nassert hashlib.sha256((r/'rust/crates/dev-tools/tests/ci_rust_isolation.rs').read_bytes()).hexdigest()==receipt['ci_rust_isolation_sha256']\nproof=Path(os.environ['ROUTING_PROOF'])\n(proof/'unchanged-policy-reuse.json').write_bytes(raw)\n(proof/'current-overlay-seals.json').write_text(json.dumps(overrides,sort_keys=True,indent=2)+'\\n')\nprint(json.dumps(c,sort_keys=True))\nSOURCE_CONTRACT\ncp tools/ci/local-routing-296-contract.json \"$proof/source-contract.json\"\nrequire_growth 8192\n# All 81 latest parser-dependent failures are required again, not historical successes.\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test ci_rust_isolation -- --nocapture --skip inherited_side_effects_are_source_repository_only --skip retired_bluetooth_helpers_are_absent_at_checkout > \"$proof/parser-recovery-tests.log\" 2>&1\ngrep -F 'test result: ok. 81 passed; 0 failed; 0 ignored; 0 measured; 2 filtered out' \"$proof/parser-recovery-tests.log\" > \"$proof/parser-recovery-count.txt\"\nfor case_name in yaml_raw_scalars_anchors_and_multiline_match_base_loader fast_checks_cover_all_branch_pushes_and_protected_prs integration_aggregate_cannot_pass_failed_or_skipped_workers_with_or_true; do\n  require_growth 1024\n  cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test ci_workflow_policy \"$case_name\" -- --exact --nocapture > \"$proof/changed-policy-$case_name.log\" 2>&1\n  grep -F \"test $case_name ... ok\" \"$proof/changed-policy-$case_name.log\" >> \"$proof/changed-policy-cases.txt\"\ndone\n# Eighteen unchanged case contexts are explicit reuse; AST's changed roster case is separately pending.\n# Source/metadata assertions changed by private aliases, trusted step guards,\n# private upload paths and the three optional composite shell inputs only.\n# Do not run unchanged original captures, native generators or provider corpora.\nrequire_growth 2048\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test encoder_runtime_ci --test ui_polygon_ci --test beep_integer_ci --test lagd_ci --test timed_ci --test ui_application_lifecycle_ci --test ci_model_catalog_publisher -- --nocapture > \"$proof/changed-source-policy.log\" 2>&1\nwhile read -r suite case_name; do\n  require_growth 1024\n  cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test \"$suite\" \"$case_name\" -- --exact --nocapture > \"$proof/source-$suite-$case_name.log\" 2>&1\ndone <<'SOURCE_ONLY_CASES'\nci_native_staging all_runtime_and_template_callers_select_a_prepared_current_host_stager\nci_native_staging native_composites_forward_the_optional_execution_shell\ncamera_ci_check mandatory_camera_gate_builds_native_controller_and_orchestrator_before_live_checks\ncamera_ci_check camera_gate_uses_native_visionipc_peers_without_python_setup_or_bindings\ncamera_ci_check camera_native_peer_policy_rejects_python_and_lost_or_skipped_native_coverage\ncamera_source_generate camera_ci_builds_and_uses_native_generators_before_original_comparisons\nci_artifact_list arm_workflow_uses_native_list_and_retains_execution_and_evidence\nmessage_state_ci message_state_gate_builds_native_checker_and_preserves_service_check_and_evidence\nmiri_provenance miri_workflow_hashes_actual_sysroot_before_all_original_memory_checks\ncutin_alert_ci native_cutin_preserves_host_source_comparisons_and_direct_growth_guard\ncutin_alert_ci missing_optional_softened_python_or_changed_source_routes_are_rejected\nratekeeper_ci native_ratekeeper_keeps_host_examples_and_hard_failing_selfdrive_route\nratekeeper_ci missing_softened_python_and_wrong_architecture_routes_cannot_pass\nSOURCE_ONLY_CASES\nrequire_growth 1024\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features ci-receipt-metadata-native --test ci_receipt_metadata maintained_callers_build_native_metadata_before_all_fourteen_uses -- --exact --nocapture > \"$proof/source-receipt-callers.log\" 2>&1\nrequire_growth 2048\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test ci_disk_bootstrap workflow_guards_use_absolute_native_bootstrap_and_keep_all_growths -- --exact --nocapture > \"$proof/growth-roster-test.log\" 2>&1\nrequire_growth 2048\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --lib --test ci_workflow_policy --test ci_rust_isolation --test ci_disk_bootstrap -- -D warnings > \"$proof/routing-clippy.log\" 2>&1\nsha256sum -c \"$proof/tool-paths.sha256\" > \"$proof/tool-paths-after.txt\"\nseal_source > \"$proof/source-after.sha256\"\ncmp \"$proof/source-before.sha256\" \"$proof/source-after.sha256\"\ngit ls-files -z > \"$proof/index-after.bin\"\ncmp \"$proof/index-before.bin\" \"$proof/index-after.bin\"\ngit diff --exit-code\ngit diff --cached --exit-code\ncat /proc/meminfo > \"$proof/memory-after.txt\"\ndf -PB1 \"$root\" \"$CI_JOB_TEMP\" > \"$proof/disk-after.txt\"\nif test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > \"$proof/cgroup-memory-after.txt\"; fi\nprintf '%s\n' '81 parser recoveries, three changed policy cases and previously unreached downstream checks passed; separate AST case still requires admission. No ARM/Darwin or complete family credit.' > \"$proof/passed-scope.txt\"\n",
          "id": "routing_qualification"
        },
        {
          "name": "Retain exact-source routing evidence",
          "id": "evidence",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.ROUTING_PROOF != '') }}",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "common-local-routing-296-policy-evidence",
            "path": "${{ env.ROUTING_PROOF }}",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Clean only authenticated uploaded private source",
          "id": "owned_source_cleanup",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' && steps.routing_qualification.outcome == 'success' && env.ROUTING_SOURCE_OWNER != '') }}",
          "working-directory": "${{ github.workspace }}",
          "env": {
            "UPLOAD_ID": "${{ steps.evidence.outputs.artifact-id }}",
            "UPLOAD_DIGEST": "${{ steps.evidence.outputs.artifact-digest }}"
          },
          "run": "set -euo pipefail\n[[ $UPLOAD_ID =~ ^[0-9]+$ ]]\n[[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\np=$ROUTING_SOURCE_OWNER\ncase \"$p\" in \"$workspace/.routing-296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"??????) ;; *) exit 1 ;; esac\ntest -d \"$p\" && test ! -L \"$p\"\ntest \"$(realpath -e -- \"$p\")\" = \"$p\"\ntest \"$(stat -c '%u' -- \"$p\")\" = \"$(id -u)\"\ntest \"$(stat -c '%d:%i' -- \"$p\")\" = \"$ROUTING_SOURCE_IDENTITY\"\ntest -f \"$p/.routing-owner\" && test ! -L \"$p/.routing-owner\"\ntest \"$(cat \"$p/.routing-owner\")\" = \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\ntest \"$ROUTING_SOURCE\" = \"$p/source\"\ntest -d \"$p/source\" && test ! -L \"$p/source\"\ntest \"$(realpath -e -- \"$p/source\")\" = \"$p/source\"\nrm -rf --one-file-system -- \"$p\"\n# Common action, still byte-identical to #502, checks/deletes only CI_JOB_TEMP.\n"
        },
        {
          "name": "Clean common owned shell output",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest != '' && env.ROUTING_SOURCE_OWNER != '' && steps.owned_source_cleanup.outcome == 'success') }}",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  }
}
