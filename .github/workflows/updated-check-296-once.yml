name: 296 full native updater controller fresh-original proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-check-296-once.yml
permissions:
  contents: read
jobs:
  updater-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: 7b5ebbb7243a0f74cb3b075067a5dd50506b4927
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 7b5ebbb7243a0f74cb3b075067a5dd50506b4927
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Pin checkout and install original binding prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/updated-check-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/source-commit.txt"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - uses: ./.github/actions/native-json11
    - name: Build exact native updater, launcher, checker and source Params binding
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-check-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-updated --example updated_trace --locked 2>&1 | tee
        "$proof/native-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child
        --locked 2>&1 | tee "$proof/launcher-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --bin
        check-updated --bin updated-fixture --locked 2>&1 | tee "$proof/checker-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$proof/params-binding" > "$proof/binding-build.stdout"
        2> "$proof/binding-build.stderr"

        binding=("$proof"/params-binding/params_pyx*.so)

        test "${#binding[@]}" -eq 1

        test -f "${binding[0]}"

        printf ''UPDATED_CHECK_BINARY=%s/rust/target/debug/examples/updated_trace\nUPDATED_CHECK_LAUNCHER=%s/rust/target/debug/openpilot-process-child\nUPDATED_CHECK_SHIM=%s/rust/target/debug/updated-fixture\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''UPDATED_CHECK_PYTHON=%s\nUPDATED_CHECK_BINDING=%s\n'' "$(command -v python)" "${binding[0]}" >> "$GITHUB_ENV"

        printf ''UPDATED_CHECK_OUTPUT=%s/fresh-test\nUPDATED_CHECK_CLI_OUTPUT=%s/cli\n'' "$proof" "$proof" >> "$GITHUB_ENV"

        sha256sum rust/tools/check_updated.py rust/tools/updated_source.py rust/tools/updated_fixtures.py rust/tools/original_params_binding.py
        openpilot/system/updated/updated.py openpilot/system/updated/process.py openpilot/common/markdown.py openpilot/selfdrive/selfdrived/alerts_offroad.json
        > "$proof/source-inputs.sha256"

        sha256sum rust/target/debug/check-updated rust/target/debug/updated-fixture rust/target/debug/examples/updated_trace
        rust/target/debug/openpilot-process-child "${binding[0]}" "$(command -v python)" > "$proof/executables.sha256"

        '
    - name: Run unchanged original controller before native controller
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/updated-check-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\n\"$UPDATED_CHECK_PYTHON\" rust/tools/check_updated.py --binary \"$UPDATED_CHECK_BINARY\" --launcher\
        \ \"$UPDATED_CHECK_LAUNCHER\" --binding \"$UPDATED_CHECK_BINDING\" --output \"$proof/original-controller\" > \"$proof/original-controller.stdout\"\
        \ 2> \"$proof/original-controller.stderr\"\nrust/target/debug/check-updated --binary \"$UPDATED_CHECK_BINARY\" --launcher\
        \ \"$UPDATED_CHECK_LAUNCHER\" --binding \"$UPDATED_CHECK_BINDING\" --output \"$proof/native-controller\" > \"$proof/native-controller.stdout\"\
        \ 2> \"$proof/native-controller.stderr\"\npython - <<'PY'\nimport json,os,pathlib\nproof=pathlib.Path(os.environ['RUNNER_TEMP'])/'updated-check-296'\n\
        left=proof/'original-controller';right=proof/'native-controller'\na=json.loads((left/'result.json').read_text());b=json.loads((right/'result.json').read_text())\n\
        assert a['passed'] is b['passed'] is True and b['fresh_original_python_executed'] is True\nassert a['scenarios']==b['scenarios']\
        \ and len(a['scenarios'])==5\nnames=[]\nfor row in a['scenarios']:\n  for lane in ['source','native']:\n    name=row['scenario']+'-'+lane+'.json';names.append(name)\n\
        \    assert json.loads((left/name).read_text())==json.loads((right/name).read_text()),name\n(proof/'independent-controller-comparison.json').write_text(json.dumps({'passed':True,'five_scenarios':a['scenarios'],'full_json_files':names},indent=2)+'\\\
        n')\nPY\nsha256sum --check \"$proof/source-inputs.sha256\"\nsha256sum --check \"$proof/executables.sha256\"\n"
    - name: Require full Rust controller tests and strict Clippy
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-check-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --test
        updated_check --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --lib
        --bin check-updated --bin updated-fixture --test updated_check --locked -- -D warnings 2>&1 | tee "$proof/clippy.log"

        sha256sum --check "$proof/source-inputs.sha256"

        sha256sum --check "$proof/executables.sha256"

        '
    - name: Preserve full independent source and native controller evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: updated-check-296-${{ github.sha }}
        path: ${{ runner.temp }}/updated-check-296/
        if-no-files-found: error
