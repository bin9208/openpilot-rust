name: Python Rust 523 native ARM RadarCAN and Carrot Navi candidates
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-native-arm-final-two.yml
    - tools/ci/native-arm
    - tools/ci/prepare-readonly-arm-rust-530
    - .github/actions/native-json11/**
    - rust/crates/radarcan/**
    - rust/crates/can/**
    - rust/crates/carrot-navi/**
    - rust/crates/dev-tools/**
    - rust/tools/check_radarcan_ci.py
    - rust/tools/build_params_python.py
    - rust/tools/build_msgq_python.py
    - rust/Cargo.toml
    - rust/Cargo.lock
permissions:
  contents: read
concurrency:
  group: python-rust-523-native-arm-final-two-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  radar-arm:
    name: rust RadarCAN native ARM functional validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc
      OPENBLAS_NUM_THREADS: '1'
      LOCAL_CI_ARCH: ${{ matrix.arch }}
      CI296_ALIAS_BASENAME: .ci296-source-rust--radar-arm
      CI296_NATIVE_ARM: '1'
    steps:
    - name: Deny fork source and require GitHub-hosted Linux ARM64
      shell: bash
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        CI296_HOST_CONTROL: '1'
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on hosted ARM' >&2; exit 1; }
        set -euo pipefail
        test "$GITHUB_ACTIONS" = true
        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = ARM64
        test "$(uname -s)" = Linux
        test "$(uname -m)" = aarch64
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_REF" = refs/heads/codex/feat-523-python-rust
      working-directory: ${{ github.workspace }}
    - name: Common owned job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env:
        CI296_HOST_CONTROL: '1'
    - name: Allocate private source cache target and local action alias before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        # Source capacity is checked on the actual source filesystem BEFORE checkout.
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.ci296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Preserve Actions' real workspace separately. Only Bash consumers see the
        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/ci296-shell-env"
        printf '%s\n' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/ci296-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"

        alias_path="$workspace/$CI296_ALIAS_BASENAME"
        case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac
        [[ $CI296_ALIAS_BASENAME != */* ]]
        # -T makes this an exclusive atomic link, never traversal into a stale directory.
        ln -sT -- "$source_owner" "$alias_path"
        printf '%s\n' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c '%d:%i' -- "$alias_path")" "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"
        printf 'source_alias=%s\nalias_identity=%s\n' "$alias_path" "$(stat -c '%d:%i' -- "$alias_path")" >> "$job/proof/ownership.txt"
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
        path: ${{ env.CI296_CHECKOUT_PATH }}
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Admit exact private source and index
      id: ci296_source_admission
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        test "$PWD" = "$CI296_SOURCE"
        test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Configure source-dependent job environment on private paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_LATE_PYTHONPATH: ${{ env.CI296_SOURCE }}:${{ env.CI296_SOURCE }}/opendbc_repo:${{ env.CI296_SOURCE }}/rust/tools
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        printf '%s\n' "PYTHONPATH=$CI296_LATE_PYTHONPATH" >> "$GITHUB_ENV"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      env:
        CI296_HOST_CONTROL: '1'
    - name: Prepare native ARM command transport
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      env:
        CI296_HOST_CONTROL: '1'
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      run: |
        /usr/bin/bash "$CI296_SOURCE/tools/ci/native-arm" prepare
    - name: Admit exact Python provider growth before setup
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        # tool-cache 설치와 private venv 준비는 순서대로 진행하며 실제 filesystem을 각각 확인한다.
        test -d "$RUNNER_TOOL_CACHE"
        df -PB1 "$RUNNER_TOOL_CACHE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/python-native-disk-before.txt"
        for path in "$RUNNER_TOOL_CACHE" "$CI_JOB_TEMP"; do
          available=$(df -PB1 "$path" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          ((available >= 512 * 1024 * 1024))
        done
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Keep original Python installations private
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        python -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
    - name: Prepare exact fresh ARM 1.94 SDK for all eight admitted roles
      timeout-minutes: 20
      id: arm530_sdk
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
        ARM530_HELPER_SHA256: faa58b5a058a927824870ac2df8e9aeed3f33830d62c8bb6407c6e6540277b9b
      run: |
        /usr/bin/bash "$CI296_SOURCE/tools/ci/prepare-readonly-arm-rust-530" before
    - name: Configure original Radar IPC imports
      run: printf 'PYTHONPATH=%s/radar-native/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Reserve runner capacity and install generic ARM dependencies
      run: |
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
        sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update && sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" install -y capnproto libcapnp-dev g++ binutils libzmq3-dev
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2 pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        /usr/bin/bash "$CI296_SOURCE/tools/ci/prepare-readonly-arm-rust-530" verify
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Build current native dependency stager
      uses: ./.ci296-source-rust--radar-arm/source/.github/actions/native-json11
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        run-shell: openpilot-local-shell {0}
    - name: Build unchanged native ARM bindings and generate radar assets
      run: |
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/radar-native/params"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/radar-native/msgq"
        "$CI_RECEIPT_METADATA" module RADAR_PARAMS_BINDING "$RUNNER_TEMP/radar-native/params/provenance.json" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features dbc-generator-native --bin dbc-generator --bin prepare-radarcan-assets
        printf 'OPENPILOT_DBC_GENERATOR=%s/rust/target/debug/dbc-generator\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        rust/target/debug/prepare-radarcan-assets "$RUNNER_TEMP/radar-native/dbc"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Stage pinned generic ARM numerical dependency
      run: |
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
        python -m pip download --only-binary=:all: --no-deps --platform manylinux_2_27_aarch64 --python-version 312 --abi cp312 numpy==2.5.3 --dest "$RUNNER_TEMP/radar-native/wheels"
        cargo +1.94.0 run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin stage-torque-numerics -- --wheel "$RUNNER_TEMP"/radar-native/wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/radar-native/numerics"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Build and execute generic ARM RadarCAN tests and artifacts
      working-directory: ${{ env.CI296_SOURCE }}/rust
      run: |
        mkdir -p "$RUNNER_TEMP/radar-arm/tests"
        git rev-parse HEAD > "$RUNNER_TEMP/radar-arm/SOURCE_COMMIT"
        uname -m | tee "$RUNNER_TEMP/radar-arm/machine.txt"
        test "$(cat "$RUNNER_TEMP/radar-arm/machine.txt")" = aarch64
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
        set -o pipefail
        cargo build -p openpilot-radarcan --bins --examples --release --locked --target aarch64-unknown-linux-gnu --message-format=json 2> "$RUNNER_TEMP/radar-arm/build.log" | tee "$RUNNER_TEMP/radar-arm/build.jsonl"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
        cargo test -p openpilot-radarcan -p openpilot-can --no-run --locked --target aarch64-unknown-linux-gnu --message-format=json 2> "$RUNNER_TEMP/radar-arm/tests-build.log" | tee "$RUNNER_TEMP/radar-arm/tests-build.jsonl"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
        cargo build -p openpilot-dev-tools --bin list-cargo-tests --locked
        target/debug/list-cargo-tests "$RUNNER_TEMP/radar-arm/tests-build.jsonl" > "$RUNNER_TEMP/radar-arm/tests.txt"
        test -s "$RUNNER_TEMP/radar-arm/tests.txt"
        while IFS= read -r radar_test; do
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128
          cp "$radar_test" "$RUNNER_TEMP/radar-arm/tests/"
          sha256sum "$radar_test" >> "$RUNNER_TEMP/radar-arm/tests-SHA256SUMS"
          "$radar_test" --test-threads=1 2>&1 | tee "$RUNNER_TEMP/radar-arm/tests/$(basename "$radar_test").log"
        done < "$RUNNER_TEMP/radar-arm/tests.txt"
        for radar_binary in target/aarch64-unknown-linux-gnu/release/openpilot-radarcan target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy; do
          readelf -h -d -V "$radar_binary" > "$RUNNER_TEMP/radar-arm/$(basename "$radar_binary").readelf.txt"
          test "$(readelf -h "$radar_binary" | sed -n 's/.*Machine: *//p')" = AArch64
          sha256sum "$radar_binary" >> "$RUNNER_TEMP/radar-arm/SHA256SUMS"
        done
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: openpilot-local-shell {0}
    - name: Require exact RadarCAN source comparison on native ARM
      run: python rust/tools/check_radarcan_ci.py --phase reference --probe "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy"
        --daemon "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/openpilot-radarcan" --numerics "$RUNNER_TEMP/radar-native/numerics"
        --binding "$RADAR_PARAMS_BINDING" --dbc "$RUNNER_TEMP/radar-native/dbc" --evidence "$RUNNER_TEMP/radar-native/reference"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Require actual original and native ARM IPC and signal lifecycle
      run: python rust/tools/check_radarcan_ci.py --phase ipc --probe "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy"
        --daemon "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/openpilot-radarcan" --numerics "$RUNNER_TEMP/radar-native/numerics"
        --binding "$RADAR_PARAMS_BINDING" --dbc "$RUNNER_TEMP/radar-native/dbc" --evidence "$RUNNER_TEMP/radar-native/ipc"
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.CI296_SOURCE }}
      shell: openpilot-local-shell {0}
    - name: Preserve Radar generic ARM artifacts and functional evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always()) }}
      uses: actions/upload-artifact@v6
      with:
        name: rust-radar-arm-not-device-validated
        path: |
          ${{ env.CI_JOB_TEMP }}/radar-arm/
          ${{ env.CI_JOB_TEMP }}/radar-native/
          ${{ env.LOCAL_CI_TARGET_DIR }}/aarch64-unknown-linux-gnu/release/openpilot-radarcan
          ${{ env.LOCAL_CI_TARGET_DIR }}/aarch64-unknown-linux-gnu/release/examples/radarcan-policy

          ${{ env.CI_JOB_TEMP }}/local-arm/execution.json
          ${{ env.CI_JOB_TEMP }}/local-arm/kernel.txt
          ${{ env.CI_JOB_TEMP }}/local-arm/disk-before.txt
        if-no-files-found: warn
      id: local_evidence_1
    - name: Verify ARM SDK after every attempted maintained command
      timeout-minutes: 10
      id: arm530_sdk_final
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.arm530_sdk.outcome != 'skipped' && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
        ARM530_HELPER_SHA256: faa58b5a058a927824870ac2df8e9aeed3f33830d62c8bb6407c6e6540277b9b
      run: |
        /usr/bin/bash "$CI296_SOURCE/tools/ci/prepare-readonly-arm-rust-530" after
    - name: Finish native ARM execution evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.ci296_source_admission.outcome == 'success') }}
      env:
        CI296_HOST_CONTROL: '1'
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      run: |
        /usr/bin/bash "$CI296_SOURCE/tools/ci/native-arm" finish
    - name: Seal private source and index after maintained checks
      id: ci296_source_seal
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI296_SOURCE != '') }}
      shell: bash
      working-directory: ${{ env.CI296_SOURCE }}
      env:
        CI296_HOST_CONTROL: '1'
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
        cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
        cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
        git diff --exit-code
        git diff --cached --exit-code
        df -PB1 "$CI296_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
        cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
    - name: Retain private job ownership and source evidence
      id: ci296_private_evidence
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && env.CI_JOB_TEMP != '') }}
      uses: actions/upload-artifact@v6
      with:
        name: private-rust-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.CI_JOB_TEMP }}/proof
        retention-days: 14
        if-no-files-found: error
    - name: Clean only uploaded owned source alias and target
      id: ci296_source_cleanup
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && (always() && steps.local_evidence_1.outcome == 'success' && steps.local_evidence_1.outputs.artifact-id != '' &&
        steps.local_evidence_1.outputs.artifact-digest != '' && steps.ci296_private_evidence.outcome == 'success' && steps.ci296_private_evidence.outputs.artifact-id
        != '' && steps.ci296_private_evidence.outputs.artifact-digest != '' && steps.ci296_source_seal.outcome == 'success'
        && steps.arm530_sdk_final.outcome == 'success' && env.CI296_SOURCE_OWNER != '') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI296_HOST_CONTROL: '1'
