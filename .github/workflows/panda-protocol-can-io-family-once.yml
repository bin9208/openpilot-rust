name: 296 combined protocol CAN-I/O native retirement retry
permissions:
  contents: read
  actions: read
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-protocol-can-io-family-once.yml
jobs:
  panda-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 282fc87979c16ebac8dc368d9e3b0baf87c8e8f1
        persist-credentials: false
    - name: Reserve disk and prepare minimal device compiler inputs
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 282fc87979c16ebac8dc368d9e3b0baf87c8e8f1

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ libusb-1.0-0-dev pkg-config

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Fetch immutable original captures and source ELFs once
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 4096

        mkdir -p "$RUNNER_TEMP/panda-family"

        cd "$RUNNER_TEMP/panda-family"

        curl -fLsS --retry 3 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H ''Accept: application/vnd.github+json''
        https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12362270247/zip -o protocol-original.zip

        curl -fLsS --retry 3 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H ''Accept: application/vnd.github+json''
        https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12360684794/zip -o can-io-partial.zip

        curl -fLsS --retry 3 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H ''Accept: application/vnd.github+json''
        https://api.github.com/repos/bin9208/openpilot-rust/actions/artifacts/12358686227/zip -o source-elves.zip

        printf ''%s  %s\n'' d0ef349de2beda7e939332f9b201c8d39b5649e69902cec5767083d1d02b94d0 protocol-original.zip 1d3d39bd83362dceaa2389670b575e9ef5daf8efa49017e9f7c7576b68d047f3
        can-io-partial.zip 1dffb8ea17d36f68e02b3c59736effbf9667d6225fb13e35eec833f140f321cc source-elves.zip | sha256sum -c
        -

        unzip -p source-elves.zip retirement/checkout-output/protocol-src/pandad-protocol-source > protocol-source

        unzip -p source-elves.zip retirement/checkout-output/can-io-src/pandad-protocol-source > can-io-source

        printf ''%s  %s\n'' bc4b133fad240a96212144be82f9946ee417390ad1cd4082b0c009ee680cd14d protocol-source fadf6c458826866584eb66d5cb19794a36aede895d5bbb3f588d2368fecd9ffc
        can-io-source | sha256sum -c -

        chmod 755 protocol-source can-io-source

        '
    - name: Build both small current native examples in one package invocation
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\ncargo build --manifest-path rust/Cargo.toml -p openpilot-pandad --example panda_protocol --example can_io\
        \ --locked \\\n > \"$RUNNER_TEMP/panda-family/native-examples.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/native-examples.stderr\"\
        \n"
    - name: Validate reused originals; record parser probes and resume raw CAN-I/O
      env:
        PANDA_FAMILY_OUTPUT: ${{ runner.temp }}/panda-family
      run: 'set -euo pipefail

        export PANDA_FAMILY_SOURCE_COMMIT="$(git rev-parse HEAD)"

        printf %s ''''
        | base64 -d > "$RUNNER_TEMP/bind-family-captures.py"

        printf ''%s  %s\n'' b668a4311e1f0d88b69e8bc2d7ddf21ea8ffb1200a773ee4392a1b278b572c06 "$RUNNER_TEMP/bind-family-captures.py"
        | sha256sum -c -

        PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/bind-family-captures.py"

        '
    - name: Combined focused native controls and independent protocol/CAN-I/O comparisons
      env:
        PANDAD_PROTOCOL_RETIREMENT_MODE: predelete
        PANDAD_PROTOCOL_SOURCE_BINARY: ${{ runner.temp }}/panda-family/protocol-source
        PANDAD_PROTOCOL_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/panda_protocol
        PANDAD_PROTOCOL_TEST_OUTPUT: ${{ runner.temp }}/panda-family/protocol-native
        PANDAD_CAN_IO_RETIREMENT_MODE: predelete
        PANDAD_CAN_IO_SOURCE_BINARY: ${{ runner.temp }}/panda-family/can-io-source
        PANDAD_CAN_IO_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/can_io
        PANDAD_CAN_IO_TEST_OUTPUT: ${{ runner.temp }}/panda-family/can-io-native
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 8192\nmkdir -p \"$PANDAD_PROTOCOL_TEST_OUTPUT\" \"$PANDAD_CAN_IO_TEST_OUTPUT\"\ncargo test --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native --test panda_ci_check\
        \ --test pandad_protocol_check --test pandad_protocol_reference --test pandad_can_io_check --test pandad_can_io_reference\
        \ --locked \\\n > \"$RUNNER_TEMP/panda-family/native-tests.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/native-tests.stderr\"\
        \n\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native\
        \ --lib argparse_scan::required_first_tests --locked > \"$RUNNER_TEMP/panda-family/scanner-policy.stdout\" 2> \"$RUNNER_TEMP/panda-family/scanner-policy.stderr\"\
        \n"
    - name: Require original standalone separator rejection before effects
      run: "set -euo pipefail\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-pandad-can-io\"\noutput=\"$RUNNER_TEMP/panda-family/rejected-separator-output\"\
        \nset +e\n\"$checker\" --source \"$RUNNER_TEMP/panda-family/can-io-source\" --native \"$GITHUB_WORKSPACE/rust/target/debug/examples/can_io\"\
        \ --output \"$output\" --runner /usr/bin/env -- \\\n > \"$RUNNER_TEMP/panda-family/separator.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/separator.stderr\"\
        \nstatus=$?\nset -e\nprintf '%s\\n' \"$status\" > \"$RUNNER_TEMP/panda-family/separator.exit\"\ntest \"$status\" =\
        \ 2\ntest ! -s \"$RUNNER_TEMP/panda-family/separator.stdout\"\ntest -s \"$RUNNER_TEMP/panda-family/separator.stderr\"\
        \ntest ! -e \"$output\" && test ! -L \"$output\"\n"
    - name: One strict Clippy pass for the combined family
      run: "set -euo pipefail\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native\
        \ --lib --bin check-pandad-protocol --bin check-pandad-can-io --test panda_ci_check --test pandad_protocol_check --test\
        \ pandad_protocol_reference --test pandad_can_io_check --test pandad_can_io_reference --locked -- -D warnings \\\n\
        \ > \"$RUNNER_TEMP/panda-family/native-clippy.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/native-clippy.stderr\"\n"
    - name: Preserve complete bound originals native comparisons and failure diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-protocol-can-io-family
        path: '${{ runner.temp }}/panda-family/protocol-original/

          ${{ runner.temp }}/panda-family/can-io-original/

          ${{ runner.temp }}/panda-family/protocol-native/

          ${{ runner.temp }}/panda-family/can-io-native/

          ${{ runner.temp }}/panda-family/*.json

          ${{ runner.temp }}/panda-family/*.stdout

          ${{ runner.temp }}/panda-family/*.stderr

          ${{ runner.temp }}/panda-family/*.exit

          '
        if-no-files-found: warn
        retention-days: 7
