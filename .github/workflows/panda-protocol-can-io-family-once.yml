name: 296 Panda protocol CAN-I-O actual deletion and native fixture closure
permissions:
  contents: read
  actions: read
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/panda-protocol-can-io-family-once.yml
jobs:
  panda-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 83f1da3f49ecffe9037c97476ae188ddcee9a562
        persist-credentials: false
    - name: Reserve disk and prepare minimal device compiler inputs
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 83f1da3f49ecffe9037c97476ae188ddcee9a562

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y capnproto libcapnp-dev g++ libusb-1.0-0-dev pkg-config

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Reuse only two authenticated independent C++ source members
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/panda-family"

        python3 - <<''PY_FETCH_SCRIPT''

        import base64,hashlib,os

        from pathlib import Path

        raw=base64.b64decode("",validate=True)

        assert hashlib.sha256(raw).hexdigest()=="aaee70fe57a991522885b2c0f5d99ffb881730d740690a9d0c8c033230cee08c"

        (Path(os.environ[''RUNNER_TEMP''])/''panda-family/fetch.py'').write_bytes(raw)

        PY_FETCH_SCRIPT

        python3 "$RUNNER_TEMP/panda-family/fetch.py"

        '
    - name: Build both small current native examples in one package invocation
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 4096\ncargo build --manifest-path rust/Cargo.toml -p openpilot-pandad --example panda_protocol --example can_io\
        \ --locked \\\n > \"$RUNNER_TEMP/panda-family/native-examples.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/native-examples.stderr\"\
        \n"
    - name: Build and stage both native maintained fixtures without historical programs
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/panda-family\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native\
        \ --bin stage-pandad-protocol-reference --bin stage-pandad-can-io-reference --locked >\"$proof/fixture-build.stdout\"\
        \ 2>\"$proof/fixture-build.stderr\" || { tail -n 50 \"$proof/fixture-build.stderr\"; exit 1; }\nfor family in protocol\
        \ can-io; do\n rust/target/debug/stage-pandad-$family-reference --root \"$GITHUB_WORKSPACE\" --output \"$proof/$family-reference\"\
        \ >\"$proof/$family-stage.json\"\n cat \"$proof/$family-reference/environment.env\" >>\"$GITHUB_ENV\"\ndone\nprintf\
        \ 'PANDAD_PROTOCOL_SOURCE_MANIFEST=%s/protocol-reference/builder.json\nPANDAD_PROTOCOL_SOURCE_BUILD_KIND=borrowed\n\
        PANDAD_CAN_IO_SOURCE_MANIFEST=%s/can-io-reference/historical-builder.json\nPANDAD_CAN_IO_SOURCE_BUILD_KIND=borrowed\n\
        ' \"$proof\" \"$proof\" >>\"$GITHUB_ENV\"\nfor name in check_pandad_protocol.py check_pandad_can_io.py pandad_protocol_cases.py;\
        \ do test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"; done\n"
    - name: Combined focused native controls and independent protocol/CAN-I/O comparisons
      env:
        PANDAD_PROTOCOL_RETIREMENT_MODE: postdelete
        PANDAD_PROTOCOL_SOURCE_BINARY: ${{ runner.temp }}/panda-family/protocol-source
        PANDAD_PROTOCOL_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/panda_protocol
        PANDAD_PROTOCOL_TEST_OUTPUT: ${{ runner.temp }}/panda-family/protocol-native
        PANDAD_CAN_IO_RETIREMENT_MODE: postdelete
        PANDAD_CAN_IO_SOURCE_BINARY: ${{ runner.temp }}/panda-family/can-io-source
        PANDAD_CAN_IO_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/can_io
        PANDAD_CAN_IO_TEST_OUTPUT: ${{ runner.temp }}/panda-family/can-io-native
      run: "set -euo pipefail\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 8192\nmkdir -p \"$PANDAD_PROTOCOL_TEST_OUTPUT\" \"$PANDAD_CAN_IO_TEST_OUTPUT\"\ncargo test --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native --test panda_ci_check\
        \ --test pandad_protocol_check --test pandad_protocol_reference --test pandad_protocol_fixture --test pandad_can_io_check\
        \ --test pandad_can_io_reference --test pandad_can_io_fixture --locked \\\n > \"$RUNNER_TEMP/panda-family/native-tests.stdout\"\
        \ \\\n 2> \"$RUNNER_TEMP/panda-family/native-tests.stderr\" || { tail -n 50 \"$RUNNER_TEMP/panda-family/native-tests.stderr\"\
        \ \"$RUNNER_TEMP/panda-family/native-tests.stdout\" | cut -c 1-1500; exit 1; }\n\ncargo test --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native --lib argparse_scan::required_first_tests\
        \ --locked > \"$RUNNER_TEMP/panda-family/scanner-policy.stdout\" 2> \"$RUNNER_TEMP/panda-family/scanner-policy.stderr\"\
        \n\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-protocol-native,pandad-can-io-native\
        \ --lib pandad_protocol_fixture:: --locked >\"$RUNNER_TEMP/panda-family/protocol-extractor.stdout\" 2>\"$RUNNER_TEMP/panda-family/protocol-extractor.stderr\"\
        \ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features pandad-protocol-native,pandad-can-io-native\
        \ --lib pandad_can_io_fixture:: --locked >\"$RUNNER_TEMP/panda-family/can-io-extractor.stdout\" 2>\"$RUNNER_TEMP/panda-family/can-io-extractor.stderr\"\
        \n"
    - name: Require original standalone separator rejection before effects
      run: "set -euo pipefail\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-pandad-can-io\"\noutput=\"$RUNNER_TEMP/panda-family/rejected-separator-output\"\
        \nset +e\n\"$checker\" --source \"$RUNNER_TEMP/panda-family/can-io-source\" --native \"$GITHUB_WORKSPACE/rust/target/debug/examples/can_io\"\
        \ --output \"$output\" --runner /usr/bin/env -- \\\n > \"$RUNNER_TEMP/panda-family/separator.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/separator.stderr\"\
        \nstatus=$?\nset -e\nprintf '%s\\n' \"$status\" > \"$RUNNER_TEMP/panda-family/separator.exit\"\ntest \"$status\" =\
        \ 2\ntest ! -s \"$RUNNER_TEMP/panda-family/separator.stdout\"\ntest -s \"$RUNNER_TEMP/panda-family/separator.stderr\"\
        \ntest ! -e \"$output\" && test ! -L \"$output\"\n"
    - name: One strict Clippy pass for the combined family
      run: "set -euo pipefail\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features panda-ci-native,pandad-protocol-native,pandad-can-io-native\
        \ --lib --bin check-pandad-protocol --bin check-pandad-can-io --bin stage-pandad-protocol-reference --bin stage-pandad-can-io-reference\
        \ --test panda_ci_check --test pandad_protocol_check --test pandad_protocol_reference --test pandad_protocol_fixture\
        \ --test pandad_can_io_check --test pandad_can_io_reference --test pandad_can_io_fixture --locked -- -D warnings \\\
        \n > \"$RUNNER_TEMP/panda-family/native-clippy.stdout\" \\\n 2> \"$RUNNER_TEMP/panda-family/native-clippy.stderr\"\
        \ || { tail -n 65 \"$RUNNER_TEMP/panda-family/native-clippy.stderr\" | cut -c 1-1500; exit 1; }\n"
    - name: Preserve complete bound originals native comparisons and failure diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: panda-protocol-can-io-family
        path: '${{ runner.temp }}/panda-family/protocol-native/

          ${{ runner.temp }}/panda-family/can-io-native/

          ${{ runner.temp }}/panda-family/*.json

          ${{ runner.temp }}/panda-family/*.stdout

          ${{ runner.temp }}/panda-family/*.stderr

          ${{ runner.temp }}/panda-family/*.exit

          '
        if-no-files-found: warn
        retention-days: 7
