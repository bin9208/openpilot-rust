name: dev-md AGNOS runtime package
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged dev-md commit
        required: true
        type: string
      ci_run_id:
        description: Successful unified push CI run
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: dev-md-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify completed exact-source merge CI
    if: github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/dev-md'
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/github-script@v7
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            const id = process.env.CI_RUN_ID;
            if (!/^[a-f0-9]{40}$/.test(sha) || !/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid delivery identity');
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'dev-md'});
            if (branch.data.commit.sha !== sha) throw new Error('Stale dev-md source');
            const commit = await github.rest.repos.getCommit({...context.repo, ref: sha});
            if (!commit.data.commit.message.includes('[runtime-package]')) throw new Error('Unmarked runtime delivery');
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: sha, per_page: 100
            });
            if (!prs.some(pr => pr.merged_at && pr.merge_commit_sha === sha && pr.base.ref === 'dev-md')) throw new Error('Not a dev-md PR merge');
            let run;
            for (let attempt = 0; attempt < 60; attempt++) {
              run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)})).data;
              if (run.path !== '.github/workflows/ci.yml' || run.head_sha !== sha || run.head_branch !== 'dev-md' || run.event !== 'push' || run.repository.full_name !== 'bin9208/openpilot-rust') throw new Error('Wrong validation identity');
              if (run.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Unified CI did not succeed');
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: sha, branch: 'dev-md', event: 'push', per_page: 100
            });
            const latest = runs.filter(r => r.path === '.github/workflows/ci.yml').sort((a,b) => b.id-a.id)[0];
            if (!latest || latest.id !== Number(id) || latest.run_attempt !== run.run_attempt) throw new Error('Validation was superseded');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: Number(id), filter: 'latest', per_page: 100});
            for (const name of ['check mapped user docs', 'integration gate', 'rust checks', 'rust aarch64 build']) {
              const matching = jobs.filter(j => j.name === name);
              if (matching.length !== 1 || matching[0].head_sha !== sha || matching[0].status !== 'completed' || matching[0].conclusion !== 'success') throw new Error(`Missing/failed gate: ${name}`);
            }
            core.setOutput('source_sha', sha);
  package:
    needs: verify
    name: Build and seal actual AGNOS runtime
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 210
    env:
      RUNTIME_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - name: Check focused source policy before downloads or builds
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path
          import unittest

          source = ast.parse(Path('rust/ci/runtime/package.py').read_text())
          policy = next(node for node in source.body if isinstance(node, ast.FunctionDef) and node.name == 'source_path_allowed')
          namespace = {}
          exec(compile(ast.Module(body=[policy], type_ignores=[]), 'package-policy', 'exec'), namespace)
          allowed = namespace['source_path_allowed']

          class SourcePolicyTests(unittest.TestCase):
              def test_focused_sources_and_tests(self):
                  for path in ('rust/crates/xiaoge/src/native/vision/road.rs', 'rust/crates/xiaoge/tests/cadence.rs', 'tools/ci/tests/test_lfs_endpoint.py'):
                      with self.subTest(path=path):
                          self.assertTrue(allowed(path))

              def test_exact_docs_config_and_workflow(self):
                  for path in ('.lfsconfig', '.github/workflows/fast-checks.yml', 'docs/user/en/lane-change.md', 'docs/user/ko/lane-change.md', 'docs/naver/dev-md-lfs-checkout-validation.md', 'docs/naver/dev-md-onnx-load-validation.md'):
                      with self.subTest(path=path):
                          self.assertTrue(allowed(path))

              def test_provider_model_and_unrelated_sources_rejected(self):
                  for path in ('rust/crates/opencv-runtime/native/image.cc', 'openpilot/selfdrive/carrot/xiaoge/assets/lane.onnx', 'panda/board/main.c', '.github/workflows/unrelated.yml', 'tools/ci/tests/test_other.py'):
                      with self.subTest(path=path):
                          self.assertFalse(allowed(path))

              def test_exact_path_and_directory_boundaries(self):
                  for path in ('.lfsconfig.extra', '.github/workflows/fast-checks.yml.extra', 'rust/crates/xiaoge-other/src/lib.rs', 'docs/naver/dev-md-onnx-load-validation.md.extra'):
                      with self.subTest(path=path):
                          self.assertFalse(allowed(path))

              def test_inherited_document_requires_identical_nonempty_tree_entry(self):
                  path = 'docs/naver/self-hosted-runner-404.md'
                  entry = '100644 blob original\t' + path
                  self.assertTrue(allowed(path, entry, entry))
                  self.assertFalse(allowed(path))
                  self.assertFalse(allowed(path, '', entry))
                  self.assertFalse(allowed(path, entry.replace('original', 'changed'), entry))
                  self.assertFalse(allowed(path, entry.replace('100644', '100755'), entry))
                  self.assertFalse(allowed(path, entry.replace('blob', 'commit'), entry))

              def test_matching_entries_do_not_allow_unknown_paths(self):
                  self.assertFalse(allowed('.github/workflows/unrelated.yml', 'same', 'same'))

          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(SourcePolicyTests))
          output = Path(os.environ['RUNNER_TEMP']) / 'agnos-runtime'
          output.mkdir(exist_ok=True)
          (output / 'source-policy-tests.json').write_text(json.dumps(dict(source_commit=os.environ['RUNTIME_SOURCE_SHA'], runner_environment=os.environ['RUNNER_ENVIRONMENT'], tests=result.testsRun, failures=len(result.failures), errors=len(result.errors)), indent=2) + '\n')
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python3 rust/ci/runtime/test_package_policy.py
          python3 rust/ci/runtime/package.py source-policy
      - name: Reserve disk for AGNOS and bounded builds
        run: |
          # Only GitHub-hosted images contain these disposable tool bundles.
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          fi
          df -h "$RUNNER_TEMP"
      - name: Check publication policy access before the expensive build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/bin9208/openpilot-rust/branches/dev-md > "$RUNNER_TEMP/publication-policy.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/publication-policy.json")); assert p["name"] == "dev-md" and p["protected"] and p["protection"]["enabled"] and {"fast checks","integration gate","check mapped user docs","rust checks","rust aarch64 build"} <= set(p["protection"]["required_status_checks"]["contexts"])'
      - name: Install build tools
        run: |
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 4*2**30, "estimated dependency growth (4 GiB)"'
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" update
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" install -y g++-aarch64-linux-gnu clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs nasm
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" install -y 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*'
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          python3 -m pip install --break-system-packages 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/target
          key: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-${{ needs.verify.outputs.source_sha }}
          restore-keys: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Restore verified baseline companions and genuine OS sysroot
        run: python3 rust/ci/runtime/package.py prepare
      - name: Cache the verified OS independently of the consumer build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CI_JOB_TEMP }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - name: Compile host release tools in an isolated native cache
        run: python3 rust/ci/runtime/package.py host-tools
      - name: Compile exact source, audit ABI, seal and test offline installation
        run: python3 rust/ci/runtime/package.py build
      - name: Preserve compiled dependencies for focused repair runs
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/target
          key: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-${{ needs.verify.outputs.source_sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: dev-md-runtime-${{ needs.verify.outputs.source_sha }}
          path: |
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/release/
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/delivery-tools/
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/offline-install.json
          compression-level: 0
          retention-days: 7
      - name: Preserve concise diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build-evidence-${{ needs.verify.outputs.source_sha }}
          path: |
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/elf.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/installer-build.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/offline-install.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/build.jsonl
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/sysroot-extract.log
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/source-policy.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/source-policy-tests.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/receipt.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/*.log
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/*.command.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/*.exit.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/*.space.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/opencl-capability.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/build/CMakeCache.txt
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv/build/cvconfig.h
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv-baseline.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv-smoke/*.log
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv-smoke/*.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/opencv-smoke/*.jsonl
          retention-days: 7
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
  publish:
    needs: [verify, package]
    name: Publish verified dev-md prerelease
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    timeout-minutes: 210
    permissions:
      contents: write
      actions: read
    env:
      RUNTIME_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      GIT_LFS_SKIP_SMUDGE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - name: Reserve disk and install ARM execution tools
        run: |
          # Only GitHub-hosted images contain these disposable tool bundles.
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          fi
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 2*2**30, "estimated dependency growth (2 GiB)"'
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" update
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" install -y qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs
      - uses: actions/cache@v4
        with:
          path: ${{ env.CI_JOB_TEMP }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - name: Download the successful package from this exact source
        run: |
          test "$(git rev-parse HEAD)" = "$RUNTIME_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/agnos-runtime"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "dev-md-runtime-$RUNTIME_SOURCE_SHA" --dir "$RUNNER_TEMP/agnos-runtime"
      - name: Require exact-SHA CI, publish six sealed assets, verify public online installation
        run: python3 rust/ci/runtime/package.py publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-publish-evidence-${{ needs.verify.outputs.source_sha }}
          path: |
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/online-install.json
            ${{ env.CI_JOB_TEMP }}/agnos-runtime/offline-install.json
          retention-days: 14
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
