name: dev-md AGNOS runtime package
on:
  workflow_dispatch:
    inputs:
      diagnose_restore:
        description: Inspect sealed 1f00 archive restoration without building or publishing
        type: boolean
        default: false
  push:
    branches: [dev-md]
permissions:
  contents: read
  actions: read
concurrency:
  group: dev-md-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev-md' }}
jobs:
  diagnose-restore:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_restore && github.ref == 'refs/heads/codex/feat-453-xiaoge-gpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1f00f0b7c4ccab4c23c5845aef490406058aec6c
          path: runtime-source
          persist-credentials: false
      - name: Download unchanged sealed candidate on hosted runner
        run: |
          mkdir -p "$RUNNER_TEMP/restore-diagnostic"
          gh run download 39600241810 --repo bin9208/openpilot-rust --name dev-md-runtime-1f00f0b7c4ccab4c23c5845aef490406058aec6c --dir "$RUNNER_TEMP/restore-diagnostic"
          gh api repos/bin9208/openpilot-rust/git/commits/1f00f0b7c4ccab4c23c5845aef490406058aec6c > "$RUNNER_TEMP/restore-diagnostic/source-commit.json"
      - name: Compare canonical archive with data-filter restoration
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, re, subprocess, tarfile
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP']) / 'restore-diagnostic'
          descriptor = json.loads((work / 'release/runtime-release.json').read_text())
          assert descriptor['source_commit'] == '1f00f0b7c4ccab4c23c5845aef490406058aec6c'
          archive = work / 'release' / descriptor['archive']['name']
          with archive.open('rb') as f:
              assert hashlib.file_digest(f, 'sha256').hexdigest() == descriptor['archive']['sha256']
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'runtime-source'
          source = (root / 'rust/crates/dev-tools/src/package.rs').read_text().split('const SOURCE_ASSETS:', 1)[1].split('];', 1)[0]
          assets = set(re.findall(r'"([^"\n]+)"', source))
          assert len(assets) == 19
          timestamp = int(datetime.datetime.fromisoformat(json.loads((work / 'source-commit.json').read_text())['committer']['date'].replace('Z', '+00:00')).timestamp())
          members = []
          with tarfile.open(archive) as payload:
              for member in payload:
                  assert member.name.startswith('rust/bin/') or member.name == 'rust/runtime-manifest.json' or member.name in assets
                  payload.extract(member, root, filter='data')
                  members.append(member)
          differences = []
          for member in members:
              path = root / member.name
              mode = path.stat().st_mode & 0o7777
              if mode != member.mode:
                  differences.append(dict(path=member.name, archive_mode=oct(member.mode), restored_mode=oct(mode), symlink=member.issym()))
          identity_differences = [dict(path=m.name, uid=m.uid, gid=m.gid, mtime=m.mtime, uname=m.uname, gname=m.gname) for m in members if m.uid != 0 or m.gid != 0 or m.mtime != timestamp or m.uname or m.gname]
          subprocess.run(['git', 'add', '--renormalize', '--', *sorted(assets)], cwd=root, check=True)
          identity = json.loads((work / 'delivery-tools/identity.json').read_text())
          publisher = work / 'delivery-tools/publish-runtime-release'
          assert hashlib.sha256(publisher.read_bytes()).hexdigest() == identity['publisher_sha256']
          publisher.chmod(0o755)
          (work / 'release/openpilot-runtime-install-aarch64').chmod(0o755)
          check = subprocess.run([str(publisher), '--root', str(root), '--assets', str(work / 'release'), '--branch', 'dev-md', '--check-only'], capture_output=True, text=True)
          result = dict(source_commit=descriptor['source_commit'], members=len(members), mode_differences=differences, identity_differences=identity_differences, publisher_exit=check.returncode, publisher_stdout=check.stdout, publisher_stderr=check.stderr)
          (work / 'restore-diagnostic.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, indent=2))
          assert not differences, 'sealed modes changed during restore'
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sealed-restore-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/restore-diagnostic/restore-diagnostic.json
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.diagnose_restore &&
      github.ref == 'refs/heads/codex/feat-453-xiaoge-gpu') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[runtime-package]') &&
      github.ref == 'refs/heads/dev-md')
    name: Build and seal actual AGNOS runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check focused source policy before downloads or builds
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path
          import unittest

          source = ast.parse(Path('rust/ci/runtime/package.py').read_text())
          policy = next(node for node in source.body if isinstance(node, ast.FunctionDef) and node.name == 'source_path_allowed')
          namespace = {}
          exec(compile(ast.Module(body=[policy], type_ignores=[]), 'package-policy', 'exec'), namespace)
          allowed = namespace['source_path_allowed']

          class SourcePolicyTests(unittest.TestCase):
              def test_focused_sources_and_tests(self):
                  for path in ('rust/crates/xiaoge/src/native/vision/road.rs', 'rust/crates/xiaoge/tests/cadence.rs', 'tools/ci/tests/test_lfs_endpoint.py'):
                      with self.subTest(path=path):
                          self.assertTrue(allowed(path))

              def test_exact_docs_config_and_workflow(self):
                  for path in ('.lfsconfig', '.github/workflows/fast-checks.yml', 'docs/user/en/lane-change.md', 'docs/user/ko/lane-change.md', 'docs/naver/dev-md-lfs-checkout-validation.md', 'docs/naver/dev-md-onnx-load-validation.md'):
                      with self.subTest(path=path):
                          self.assertTrue(allowed(path))

              def test_provider_model_and_unrelated_sources_rejected(self):
                  for path in ('rust/crates/opencv-runtime/native/image.cc', 'openpilot/selfdrive/carrot/xiaoge/assets/lane.onnx', 'panda/board/main.c', '.github/workflows/unrelated.yml', 'tools/ci/tests/test_other.py'):
                      with self.subTest(path=path):
                          self.assertFalse(allowed(path))

              def test_exact_path_and_directory_boundaries(self):
                  for path in ('.lfsconfig.extra', '.github/workflows/fast-checks.yml.extra', 'rust/crates/xiaoge-other/src/lib.rs', 'docs/naver/dev-md-onnx-load-validation.md.extra'):
                      with self.subTest(path=path):
                          self.assertFalse(allowed(path))

              def test_inherited_document_requires_identical_nonempty_tree_entry(self):
                  path = 'docs/naver/self-hosted-runner-404.md'
                  entry = '100644 blob original\t' + path
                  self.assertTrue(allowed(path, entry, entry))
                  self.assertFalse(allowed(path))
                  self.assertFalse(allowed(path, '', entry))
                  self.assertFalse(allowed(path, entry.replace('original', 'changed'), entry))
                  self.assertFalse(allowed(path, entry.replace('100644', '100755'), entry))
                  self.assertFalse(allowed(path, entry.replace('blob', 'commit'), entry))

              def test_matching_entries_do_not_allow_unknown_paths(self):
                  self.assertFalse(allowed('.github/workflows/unrelated.yml', 'same', 'same'))

          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(SourcePolicyTests))
          output = Path(os.environ['RUNNER_TEMP']) / 'agnos-runtime'
          output.mkdir(exist_ok=True)
          (output / 'source-policy-tests.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'], runner_environment=os.environ['RUNNER_ENVIRONMENT'], tests=result.testsRun, failures=len(result.failures), errors=len(result.errors)), indent=2) + '\n')
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python3 rust/ci/runtime/test_package_policy.py
          python3 rust/ci/runtime/package.py source-policy
      - name: Reserve disk for AGNOS and bounded builds
        run: |
          # Only GitHub-hosted images contain these disposable tool bundles.
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          fi
          df -h "$RUNNER_TEMP"
      - name: Check publication policy access before the expensive build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/bin9208/openpilot-rust/branches/dev > "$RUNNER_TEMP/publication-policy.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/publication-policy.json")); assert p["name"] == "dev" and p["protected"] and p["protection"]["enabled"] and {"fast checks","integration gate","check mapped user docs","rust checks","rust aarch64 build"} <= set(p["protection"]["required_status_checks"]["contexts"])'
      - name: Install build tools
        run: |
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= (25+4)*2**30, "disk reserve before dependency installation"'
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs nasm
          sudo apt-get install -y 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*'
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          python3 -m pip install --break-system-packages 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/agnos-runtime/target
          key: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Restore verified baseline companions and genuine OS sysroot
        run: python3 rust/ci/runtime/package.py prepare
      - name: Cache the verified OS independently of the consumer build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - name: Compile host release tools in an isolated native cache
        run: python3 rust/ci/runtime/package.py host-tools
      - name: Compile exact source, audit ABI, seal and test offline installation
        run: python3 rust/ci/runtime/package.py build
      - name: Preserve compiled dependencies for focused repair runs
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/agnos-runtime/target
          key: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: dev-md-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agnos-runtime/release/
            ${{ runner.temp }}/agnos-runtime/delivery-tools/
            ${{ runner.temp }}/agnos-runtime/offline-install.json
          compression-level: 0
          retention-days: 7
      - name: Preserve concise diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agnos-runtime/elf.json
            ${{ runner.temp }}/agnos-runtime/installer-build.json
            ${{ runner.temp }}/agnos-runtime/offline-install.json
            ${{ runner.temp }}/agnos-runtime/build.jsonl
            ${{ runner.temp }}/agnos-runtime/sysroot-extract.log
            ${{ runner.temp }}/agnos-runtime/source-policy.json
            ${{ runner.temp }}/agnos-runtime/source-policy-tests.json
            ${{ runner.temp }}/agnos-runtime/opencv/receipt.json
            ${{ runner.temp }}/agnos-runtime/opencv/*.log
            ${{ runner.temp }}/agnos-runtime/opencv/*.command.json
            ${{ runner.temp }}/agnos-runtime/opencv/*.exit.json
            ${{ runner.temp }}/agnos-runtime/opencv/*.space.json
            ${{ runner.temp }}/agnos-runtime/opencv/opencl-capability.json
            ${{ runner.temp }}/agnos-runtime/opencv/build/CMakeCache.txt
            ${{ runner.temp }}/agnos-runtime/opencv/build/cvconfig.h
            ${{ runner.temp }}/agnos-runtime/opencv-baseline.json
            ${{ runner.temp }}/agnos-runtime/opencv-smoke/*.log
            ${{ runner.temp }}/agnos-runtime/opencv-smoke/*.json
            ${{ runner.temp }}/agnos-runtime/opencv-smoke/*.jsonl
          retention-days: 7
  publish:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-md' && contains(github.event.head_commit.message, '[runtime-package]')
    name: Publish verified dev-md prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: write
      actions: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve disk and install ARM execution tools
        run: |
          # Only GitHub-hosted images contain these disposable tool bundles.
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          fi
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= (25+2)*2**30, "disk reserve before dependency installation"'
          sudo apt-get update
          sudo apt-get install -y qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - name: Download the successful package from this exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/agnos-runtime"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "dev-md-runtime-$GITHUB_SHA" --dir "$RUNNER_TEMP/agnos-runtime"
      - name: Require exact-SHA CI, publish six sealed assets, verify public online installation
        run: python3 rust/ci/runtime/package.py publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-publish-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agnos-runtime/online-install.json
            ${{ runner.temp }}/agnos-runtime/offline-install.json
          retention-days: 14
