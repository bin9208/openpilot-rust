name: dev-md AGNOS runtime package
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged dev-md commit
        required: true
        type: string
      ci_run_id:
        description: Successful unified push CI run
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: dev-md-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify completed exact-source merge CI
    if: github.repository == 'bin9208/openpilot-rust' && github.ref == 'refs/heads/dev-md'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/github-script@v7
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            const id = process.env.CI_RUN_ID;
            if (!/^[a-f0-9]{40}$/.test(sha) || !/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid delivery identity');
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'dev-md'});
            if (branch.data.commit.sha !== sha) throw new Error('Stale dev-md source');
            const commit = await github.rest.repos.getCommit({...context.repo, ref: sha});
            if (!commit.data.commit.message.includes('[runtime-package]')) throw new Error('Unmarked runtime delivery');
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: sha, per_page: 100
            });
            if (!prs.some(pr => pr.merged_at && pr.merge_commit_sha === sha && pr.base.ref === 'dev-md')) throw new Error('Not a dev-md PR merge');
            let run;
            for (let attempt = 0; attempt < 60; attempt++) {
              run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)})).data;
              if (run.path !== '.github/workflows/ci.yml' || run.head_sha !== sha || run.head_branch !== 'dev-md' || run.event !== 'push' || run.repository.full_name !== 'bin9208/openpilot-rust') throw new Error('Wrong validation identity');
              if (run.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Unified CI did not succeed');
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: sha, branch: 'dev-md', event: 'push', per_page: 100
            });
            const latest = runs.filter(r => r.path === '.github/workflows/ci.yml').sort((a,b) => b.id-a.id)[0];
            if (!latest || latest.id !== Number(id) || latest.run_attempt !== run.run_attempt) throw new Error('Validation was superseded');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: Number(id), filter: 'latest', per_page: 100});
            for (const name of ['fast checks', 'check mapped user docs', 'integration gate', 'rust checks', 'rust aarch64 build']) {
              const matching = jobs.filter(j => j.name === name);
              if (matching.length !== 1 || matching[0].head_sha !== sha || matching[0].status !== 'completed' || matching[0].conclusion !== 'success') throw new Error(`Missing/failed gate: ${name}`);
            }
            core.setOutput('source_sha', sha);
  package:
    needs: verify
    name: Build and seal actual AGNOS runtime
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 150
    env:
      RUNTIME_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve disk for AGNOS and bounded builds
        run: |
          # Only GitHub-hosted images contain these disposable tool bundles.
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          fi
          df -h "$RUNNER_TEMP"
      - name: Check publication policy access before the expensive build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/bin9208/openpilot-rust/branches/dev-md > "$RUNNER_TEMP/publication-policy.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/publication-policy.json")); assert p["name"] == "dev-md" and p["protected"] and p["protection"]["enabled"] and {"fast checks","integration gate","check mapped user docs","rust checks","rust aarch64 build"} <= set(p["protection"]["required_status_checks"]["contexts"])'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs nasm
          sudo apt-get install -y 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*'
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          python3 -m pip install --break-system-packages 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/agnos-runtime/target
          key: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-${{ needs.verify.outputs.source_sha }}
          restore-keys: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Restore verified baseline companions and genuine OS sysroot
        run: python3 rust/ci/runtime/package.py prepare
      - name: Cache the verified OS independently of the consumer build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - name: Compile host release tools in an isolated native cache
        run: python3 rust/ci/runtime/package.py host-tools
      - name: Compile exact source, audit ABI, seal and test offline installation
        run: python3 rust/ci/runtime/package.py build
      - name: Preserve compiled dependencies for focused repair runs
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/agnos-runtime/target
          key: agnos-runtime-1.94-${{ hashFiles('rust/Cargo.lock') }}-${{ needs.verify.outputs.source_sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: dev-md-runtime-${{ needs.verify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/agnos-runtime/release/
            ${{ runner.temp }}/agnos-runtime/delivery-tools/
            ${{ runner.temp }}/agnos-runtime/offline-install.json
          compression-level: 0
          retention-days: 7
      - name: Preserve concise diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build-evidence-${{ needs.verify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/agnos-runtime/elf.json
            ${{ runner.temp }}/agnos-runtime/installer-build.json
            ${{ runner.temp }}/agnos-runtime/offline-install.json
            ${{ runner.temp }}/agnos-runtime/build.jsonl
            ${{ runner.temp }}/agnos-runtime/sysroot-extract.log
          retention-days: 7
  publish:
    needs: [verify, package]
    name: Publish verified dev-md prerelease
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 210
    permissions:
      contents: write
      actions: read
    env:
      RUNTIME_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      GIT_LFS_SKIP_SMUDGE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve disk and install ARM execution tools
        run: |
          # Only GitHub-hosted images contain these disposable tool bundles.
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          fi
          sudo apt-get update
          sudo apt-get install -y qemu-user-static android-sdk-libsparse-utils e2fsprogs git-lfs
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agnos-runtime/sdk
          key: agnos-sdk-375c5d22335770ac-v1
      - name: Download the successful package from this exact source
        run: |
          test "$(git rev-parse HEAD)" = "$RUNTIME_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/agnos-runtime"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "dev-md-runtime-$RUNTIME_SOURCE_SHA" --dir "$RUNNER_TEMP/agnos-runtime"
      - name: Require exact-SHA CI, publish six sealed assets, verify public online installation
        run: python3 rust/ci/runtime/package.py publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-publish-evidence-${{ needs.verify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/agnos-runtime/online-install.json
            ${{ runner.temp }}/agnos-runtime/offline-install.json
          retention-days: 14
