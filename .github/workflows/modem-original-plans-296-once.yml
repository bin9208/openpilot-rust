name: 296 complete original modem request plans and helper references
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/modem-original-plans-296-once.yml
permissions:
  contents: read
jobs:
  original-modem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: ca0bd03a16362fdaeb69339c1268d20d92ee5b64
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ca0bd03a16362fdaeb69339c1268d20d92ee5b64
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Capture complete unchanged original requests and three retained pipe-reference modes
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev

        python -m pip install pyserial==3.5

        rustup toolchain install 1.94.0 --profile minimal

        mkdir "$RUNNER_TEMP/modem-original-296"

        proof="$RUNNER_TEMP/modem-original-296"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        python -m pip freeze > "$proof/packages.before.txt"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-modem -p openpilot-process-supervision --bins --examples
        > "$proof/build.stdout" 2> "$proof/build.stderr" || { tail -n 100 "$proof/build.stderr"; exit 1; }

        sha256sum rust/target/debug/openpilot-modem rust/target/debug/examples/modem_trace rust/target/debug/openpilot-process-child
        > "$proof/native.before.sha256"

        printf ''%s'' ''''
        | base64 --decode > "$proof/capture.py"

        printf ''%s  %s\n'' ''d1be1d6a4f0fd41b84608116ef78ce864c056766287f8520cee440dc9f1ab888'' "$proof/capture.py" | sha256sum
        --check --strict

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 256

        MODEM_CAPTURE_ROOT="$proof/plans" python "$proof/capture.py" > "$proof/plan.stdout" 2> "$proof/plan.stderr" || { tail
        -n 120 "$proof/plan.stderr"; exit 1; }

        mkdir "$proof/helper-reference"

        export MODEM_SOURCE_REFERENCE_CAPTURE="$proof/helper-reference"

        export MODEM_SOURCE_PYTHON="$(command -v python)"

        export MODEM_PROCESS_CHILD_BINARY="$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-modem --features helper-lifetime-tests --test helper_lifetime
        unchanged_original_waits_for_retained_stdout_and_stderr -- --exact --nocapture > "$proof/helper-reference.log" 2>&1
        || { tail -n 120 "$proof/helper-reference.log"; exit 1; }

        for mode in stdout stderr invaliderr; do test -f "$proof/helper-reference/$mode/observation.json"; done

        sha256sum rust/target/debug/openpilot-modem rust/target/debug/examples/modem_trace rust/target/debug/openpilot-process-child
        > "$proof/native.after.sha256"

        cmp "$proof/native.before.sha256" "$proof/native.after.sha256"

        python -m pip freeze > "$proof/packages.after.txt"

        cmp "$proof/packages.before.txt" "$proof/packages.after.txt"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: modem-original-plans-296
        path: ${{ runner.temp }}/modem-original-296/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
