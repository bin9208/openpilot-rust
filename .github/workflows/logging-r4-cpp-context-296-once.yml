{
  "name": "296 logging R4 fresh C++ context capture (no R4 admission)",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-native-tools-candidate"
      ],
      "paths": [
        ".github/workflows/logging-r4-cpp-context-296-once.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "296-logging-cpp-context-capture",
    "cancel-in-progress": false
  },
  "jobs": {
    "cpp-context": {
      "name": "cpp-context",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 35,
      "env": {
        "SOURCE_SHA": "300f77e423750804b2a781d734128945a4b56765",
        "GIT_LFS_SKIP_SMUDGE": "1",
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONNOUSERSITE": "1",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_BUILD_JOBS": "1",
        "RUSTFLAGS": "",
        "RUSTDOCFLAGS": "",
        "CARGO_ENCODED_RUSTFLAGS": "",
        "CARGO_ENCODED_RUSTDOCFLAGS": "",
        "OBSERVER_SHA256": "4ea62634b1150b0659676ba6e963e0dcf2af07a3476677be4c77e1e0c168f38c",
        "OBSERVER_B64": ""
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Own isolated paths and record actual runner resources",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\numask 077\n[[ \"$RUNNER_NAME\" == bin-actions && \"$RUNNER_OS\" == Linux && \"$RUNNER_ARCH\" == X64 ]]\n[[ \"$GITHUB_REPOSITORY\" == bin9208/openpilot-rust && \"$GITHUB_REF\" == refs/heads/codex/feat-296-native-tools-candidate ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${PYTHONPATH:-} && -z ${PYTHONHOME:-} ]]\nlogging_job=$(mktemp -d \"/tmp/lgctx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX\")\nmkdir \"$logging_job/evidence\" \"$logging_job/home\" \"$logging_job/cargo\" \"$logging_job/cache\" \"$logging_job/tmp\"\nprintf '%s/%s\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > \"$logging_job/owner.txt\"\nprintf 'LOGGING_JOB=%s\\nLOGGING_SOURCE_ROOT=%s/source\\nLOGGING_PROOF_OUTPUT=%s/evidence\\nCARGO_TARGET_DIR=%s/target\\nCARGO_HOME=%s/cargo\\nXDG_CACHE_HOME=%s/cache\\nTMPDIR=%s/tmp\\nHOME=%s/home\\nRUSTUP_HOME=%s\\n' \"$logging_job\" \"$logging_job\" \"$logging_job\" \"$logging_job\" \"$logging_job\" \"$logging_job\" \"$logging_job\" \"$logging_job\" \"${RUSTUP_HOME:-$HOME/.rustup}\" >> \"$GITHUB_ENV\"\nprintf '%s' \"$OBSERVER_B64\" | base64 --decode > \"$logging_job/observer.py\"\nprintf '%s  %s\\n' \"$OBSERVER_SHA256\" \"$logging_job/observer.py\" | sha256sum --check --strict\ncp \"$logging_job/observer.py\" \"$logging_job/evidence/observer-source.py\"\ngh api -H 'Cache-Control: no-cache' \"repos/bin9208/openpilot-rust/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100\" > \"$logging_job/evidence/runner-jobs.json\"\npython3 -I -B - \"$logging_job\" <<'PY'\nimport json,os,platform,sys\nfrom pathlib import Path\njob=Path(sys.argv[1]);assert sys.version_info[:2]==(3,12)\nrows=json.loads((job/'evidence/runner-jobs.json').read_bytes())['jobs']\nactual=[r for r in rows if r['name']=='cpp-context' and r['runner_name']=='bin-actions' and r['status']=='in_progress']\nassert len(actual)==1 and actual[0]['runner_id']==22 and set(actual[0]['labels'])>={'self-hosted','Linux','X64','dev-md-local'}\nv=os.statvfs(job);free=v.f_bavail*v.f_frsize\nassert free>=8<<30,'estimated fresh source/target/cache growth; no persistent-host reserve'\nrow={'runner_id':22,'runner_name':os.environ['RUNNER_NAME'],'job':actual[0],'uname':list(platform.uname()),'affinity':sorted(os.sched_getaffinity(0)),'meminfo':Path('/proc/meminfo').read_text(),'free_bytes':free,'estimated_disk_growth_bytes':8<<30,'cargo_build_jobs':1,'concurrency_basis':'run39842793469 built the same three helpers successfully with one Cargo job on this runner; no arbitrary memory admission floor','job_root':str(job),'source_root':str(job/'source'),'workflow_workspace_not_source':os.environ['GITHUB_WORKSPACE']}\n(job/'evidence/runner-resources.json').write_text(json.dumps(row,indent=2)+'\\n')\nPY\ncat > \"$logging_job/resources.py\" <<'PY'\nimport json,os,sys,time\nfrom pathlib import Path\nroot=Path(os.environ['LOGGING_JOB']);label=sys.argv[1];v=os.statvfs(root)\nresult={'label':label,'walltime':time.time(),'free_bytes':v.f_bavail*v.f_frsize,'affinity':sorted(os.sched_getaffinity(0)),'meminfo':Path('/proc/meminfo').read_text(),'cgroup_path':Path('/proc/self/cgroup').read_text(),'cgroups':{}}\nfor line in Path('/proc/self/mountinfo').read_text().splitlines():\n    if ' - cgroup2 ' not in line:continue\n    mount=Path(line.split()[4]);group=next((l.split(':',2)[2] for l in result['cgroup_path'].splitlines() if l.startswith('0::')),None)\n    if group is None:continue\n    point=mount/group.lstrip('/')\n    while point.is_relative_to(mount):\n        result['cgroups'][str(point)]={n:(point/n).read_text().strip() for n in ['cpu.max','cpuset.cpus.effective','memory.max','memory.current','memory.peak','memory.events'] if (point/n).is_file()}\n        if point==mount:break\n        point=point.parent\n(root/'evidence'/('resources-'+label+'.json')).write_text(json.dumps(result,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Fetch exact source into the private job clone and authenticate prior data",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\n# Private HOME/Cargo/cache; no checkout action and no mutation of shared workspace.\ngh auth setup-git\ngit init --quiet \"$LOGGING_SOURCE_ROOT\"\ngit -C \"$LOGGING_SOURCE_ROOT\" remote add origin https://github.com/bin9208/openpilot-rust.git\ngit -C \"$LOGGING_SOURCE_ROOT\" -c protocol.file.allow=never fetch --quiet --no-tags --depth=1 origin \"$SOURCE_SHA\"\ngit -C \"$LOGGING_SOURCE_ROOT\" checkout --quiet --detach FETCH_HEAD\n[[ $(git -C \"$LOGGING_SOURCE_ROOT\" rev-parse HEAD) == \"$SOURCE_SHA\" ]]\n[[ -z $(git -C \"$LOGGING_SOURCE_ROOT\" status --porcelain --untracked-files=normal) ]]\ngh api -H 'Cache-Control: no-cache' repos/bin9208/openpilot-rust/actions/artifacts/12442250376 > \"$LOGGING_JOB/r3-api.json\"\ngh api -H 'Cache-Control: no-cache' repos/bin9208/openpilot-rust/actions/artifacts/12442250376/zip > \"$LOGGING_JOB/r3.zip\"\ngh api -H 'Accept: application/vnd.github.raw+json' \"repos/bin9208/openpilot-rust/contents/.github/workflows/logging-r4-cpp-context-296-once.yml?ref=$GITHUB_SHA\" > \"$LOGGING_JOB/workflow.yml\"\ncp \"$LOGGING_JOB/r3-api.json\" \"$LOGGING_PROOF_OUTPUT/historical-api.json\"\ncp \"$LOGGING_JOB/r3.zip\" \"$LOGGING_PROOF_OUTPUT/historical-r3.zip\"\nprintf 'source=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\nroot=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$LOGGING_SOURCE_ROOT\" > \"$LOGGING_PROOF_OUTPUT/source.txt\"\n"
        },
        {
          "name": "Record installed providers and build only required fresh helpers",
          "run": "set -euo pipefail\nunset CARGO_BUILD_TARGET\nfor tool in python3 git c++ as ld ar curl ldd strace cargo rustup; do command -v \"$tool\"; done > \"$LOGGING_PROOF_OUTPUT/tool-paths.txt\"\nrustup run 1.94.0 rustc -vV > \"$LOGGING_PROOF_OUTPUT/rustc-version.txt\"\nc++ --version > \"$LOGGING_PROOF_OUTPUT/compiler-version.txt\"\ncat /etc/os-release > \"$LOGGING_PROOF_OUTPUT/os-release.txt\"\npython3 -I -B \"$LOGGING_JOB/resources.py\" before-build\ncd \"$LOGGING_SOURCE_ROOT/rust\"\nstatus=0\n/usr/bin/time -v -o \"$LOGGING_PROOF_OUTPUT/build-cli-time.txt\" cargo +1.94.0 build --locked -p openpilot-dev-tools --features native-logging-check-native --bin check-native-logging --bin build-native-logging-reference > \"$LOGGING_PROOF_OUTPUT/build-cli.log\" 2>&1 || status=$?\nprintf '%s\\n' \"$status\" > \"$LOGGING_PROOF_OUTPUT/build-cli.status\"\npython3 -I -B \"$LOGGING_JOB/resources.py\" after-cli-build\n[[ $status == 0 ]]\nstatus=0\n/usr/bin/time -v -o \"$LOGGING_PROOF_OUTPUT/build-probe-time.txt\" cargo +1.94.0 build --locked -p openpilot-logging --example native_logging_probe > \"$LOGGING_PROOF_OUTPUT/build-probe.log\" 2>&1 || status=$?\nprintf '%s\\n' \"$status\" > \"$LOGGING_PROOF_OUTPUT/build-probe.status\"\npython3 -I -B \"$LOGGING_JOB/resources.py\" after-probe-build\n[[ $status == 0 ]]\n"
        },
        {
          "name": "Execute new independent C++ context once and retain strict protocol evidence",
          "run": "set -euo pipefail\npython3 -I -B \"$LOGGING_JOB/resources.py\" before-capture\nstatus=0\n/usr/bin/python3 -I -B \"$LOGGING_JOB/observer.py\" run-context > \"$LOGGING_PROOF_OUTPUT/capture.stdout\" 2> \"$LOGGING_PROOF_OUTPUT/capture.stderr\" || status=$?\nprintf '%s\\n' \"$status\" > \"$LOGGING_PROOF_OUTPUT/capture.status\"\npython3 -I -B \"$LOGGING_JOB/resources.py\" after-capture\n[[ $status == 0 ]]\n"
        },
        {
          "name": "Always seal complete bounded inert diagnostics",
          "id": "seal",
          "if": "always() && env.LOGGING_JOB != ''",
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B \"$LOGGING_JOB/observer.py\" seal\n"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "id": "evidence",
          "if": "always() && env.LOGGING_JOB != ''",
          "with": {
            "name": "logging-r4-fresh-cpp-context-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.LOGGING_JOB }}/public/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Clean only this successfully sealed and uploaded private job",
          "if": "always()",
          "env": {
            "CAPTURE_SEAL": "${{ steps.seal.outcome }}",
            "CAPTURE_UPLOAD": "${{ steps.evidence.outcome }}"
          },
          "run": "set -euo pipefail\npython3 -I -B - <<'PY'\nimport os,re,shutil,stat\nfrom pathlib import Path\nname=os.environ.get('LOGGING_JOB')\nif name and os.environ.get('CAPTURE_SEAL')=='success' and os.environ.get('CAPTURE_UPLOAD')=='success':\n    root=Path(name)\n    assert root.parent==Path('/tmp') and root.resolve()==root\n    assert re.fullmatch('lgctx-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+r'\\.[A-Za-z0-9]{8}',root.name)\n    assert root.stat().st_uid==os.getuid() and stat.S_IMODE(root.stat().st_mode)==0o700\n    if not (root/'evidence/capture-complete.json').is_file() or not (root/'evidence/capture.status').is_file() or (root/'evidence/capture.status').read_text().strip()!='0':\n        raise SystemExit('capture failed or incomplete; retaining owned raw job')\n    assert (root/'owner.txt').read_text()==os.environ['GITHUB_RUN_ID']+'/'+os.environ['GITHUB_RUN_ATTEMPT']+'\\n'\n    assert not Path(os.environ['GITHUB_WORKSPACE']).resolve().is_relative_to(root)\n    shutil.rmtree(root)\nPY\n"
        }
      ]
    }
  }
}
