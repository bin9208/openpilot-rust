name: 296 focused two failed codec tests
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-codec-focused-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 8c965aa650af6b6df88c616ad8c24b231ba8d00d
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 8c965aa650af6b6df88c616ad8c24b231ba8d00d
        fetch-depth: 0
        persist-credentials: false
    - name: Reserve fresh hosted source and target
      shell: bash
      run: 'set -euo pipefail

        export AST_CODEC_BASE="$RUNNER_TEMP/changed-files-codec-focused-296"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/changed-files-codec-focused-296-target"

        printf ''AST_CODEC_BASE=%s\nCARGO_TARGET_DIR=%s\n'' "$AST_CODEC_BASE" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

        mkdir "$AST_CODEC_BASE" "$CARGO_TARGET_DIR"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$AST_CODEC_BASE/source.txt"

        git status --porcelain=v1 > "$AST_CODEC_BASE/source-status.before.txt"

        test ! -s "$AST_CODEC_BASE/source-status.before.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$AST_CODEC_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin > "$AST_CODEC_BASE/native-codec-packages.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Authenticate immutable observations and source-only reuse
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        base64 --decode <<''PAYLOAD'' > "$AST_CODEC_BASE/audit.py"

        

        PAYLOAD

        printf ''a1445979ff4e42f8a96fade5f9896a9835fbe3b14710c3cd5a4a75611213749a  %s/audit.py\n'' "$AST_CODEC_BASE" | sha256sum
        --check --strict

        base64 --decode <<''PAYLOAD'' > "$AST_CODEC_BASE/original-spelling.py"

        

        PAYLOAD

        printf ''5a1ca97d3a75902190c3d1dc6995947bbf89ef7a82dda6a35e23d11bd38627cd  %s/original-spelling.py\n'' "$AST_CODEC_BASE"
        | sha256sum --check --strict

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12441816204/zip > "$AST_CODEC_BASE/codec-original.zip"

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12444153381/zip > "$AST_CODEC_BASE/prior-native.zip"

        python -I -B "$AST_CODEC_BASE/audit.py" admit

        python -I -B "$AST_CODEC_BASE/original-spelling.py" > "$AST_CODEC_BASE/original-spelling.stdout" 2> "$AST_CODEC_BASE/original-spelling.stderr"

        '
    - name: Build only affected codec integration target
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --lib --bin check-changed-files --test changed_files_codec_domains -- -D warnings > "$AST_CODEC_BASE/clippy.stdout"
        2> "$AST_CODEC_BASE/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        changed-files-native --test changed_files_codec_domains --no-run --message-format=json > "$AST_CODEC_BASE/tests-build.jsonl"
        2> "$AST_CODEC_BASE/tests-build.stderr"

        python -I -B "$AST_CODEC_BASE/audit.py" discover

        '
    - name: Execute exactly the two previously failed tests
      shell: bash
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 512\nmkdir \"$AST_CODEC_BASE/actual\"\
        \ \"$AST_CODEC_BASE/no-executables\"\nexport AST_CODEC_ORIGINAL_DIR=\"$AST_CODEC_BASE/codec-original\" AST_CODEC_PROOF=\"\
        $AST_CODEC_BASE/actual\"\ncodec_audit_python=\"$(command -v python)\"\nexport PATH=\"$AST_CODEC_BASE/no-executables\"\
        \nfor name in decoded_payload_preserves_nul_line_endings_and_missing_eof every_original_standard_registry_cookie_is_closed_or_fails_explicitly;\
        \ do\n set +e\n /usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/strace -f -qq -s 4096 -e trace=execve,execveat\
        \ -o \"$AST_CODEC_BASE/$name.execve\" \"$AST_DOMAIN_EXE\" \"$name\" --exact --test-threads=1 --nocapture > \"$AST_CODEC_BASE/$name.stdout\"\
        \ 2> \"$AST_CODEC_BASE/$name.stderr\"\n status=$?\n set -e\n printf '%s\\n' \"$status\" > \"$AST_CODEC_BASE/$name.status\"\
        \ndone\nexport PATH=/usr/bin:/bin\n/usr/bin/git status --porcelain=v1 > \"$AST_CODEC_BASE/source-status.after.txt\"\
        \n\"$codec_audit_python\" -I -B \"$AST_CODEC_BASE/audit.py\" finish\n"
    - name: Bound retained evidence
      if: always()
      shell: bash
      run: "set -euo pipefail\nif test -d \"$AST_CODEC_BASE\"; then\n du -sm \"$AST_CODEC_BASE\" > \"$AST_CODEC_BASE/artifact-size-mib.txt\"\
        \n test \"$(cut -f1 \"$AST_CODEC_BASE/artifact-size-mib.txt\")\" -le 128\nfi\n"
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: changed-files-codec-focused-296
        path: ${{ runner.temp }}/changed-files-codec-focused-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
