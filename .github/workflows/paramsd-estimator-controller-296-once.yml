name: Paramsd estimator controller 296 once
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/paramsd-estimator-controller-296-once.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  estimator-controller:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 35
    env:
      SOURCE_SHA: adff0392e61608c9a576550be78dd7eefb8b9065
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    concurrency:
      group: paramsd-estimator-controller-296-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
    - name: Allocate owned job and source before checkout
      working-directory: ${{ github.workspace }}
      run: 'set -euo pipefail

        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")

        temp_root=$(realpath -e -- "$RUNNER_TEMP")

        job=$(mktemp -d "$temp_root/paramsd-estimator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")

        owner="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}"

        printf ''%s\n'' "$owner" > "$job/.paramsd-estimator-owner"

        mkdir "$job/proof" "$job/tmp" "$job/cache"

        printf ''%s\n'' "PARAMSD_ESTIMATOR_JOB=$job" "PARAMSD_ESTIMATOR_PROOF=$job/proof" "PARAMSD_ESTIMATOR_OWNER=$owner"
        "PARAMSD_ESTIMATOR_JOB_IDENTITY=$(stat -c ''%d:%i'' -- "$job")" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home"
        "CARGO_TARGET_DIR=$job/target" "PIP_CACHE_DIR=$job/cache/pip" "XDG_CACHE_HOME=$job/cache" "TMPDIR=$job/tmp" >> "$GITHUB_ENV"

        # Inspect the filesystem that will actually hold source, before checkout writes.

        available=$(df -PB1 "$workspace" | awk ''NR == 2 {print $4}'')

        [[ $available =~ ^[0-9]+$ ]]

        required=$((2 * 1024 * 1024 * 1024))

        printf ''{"available_bytes":%s,"planned_source_growth_bytes":%s}\n'' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"

        ((available >= required))

        source_owner=$(mktemp -d "$workspace/.paramsd-estimator-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")

        printf ''%s\n'' "$owner" > "$source_owner/.paramsd-estimator-owner"

        mkdir "$source_owner/source"

        source="$source_owner/source"

        printf ''%s\n'' "PARAMSD_ESTIMATOR_SOURCE_OWNER=$source_owner" "PARAMSD_ESTIMATOR_SOURCE_IDENTITY=$(stat -c ''%d:%i''
        -- "$source_owner")" "PARAMSD_ESTIMATOR_SOURCE=$source" "PARAMSD_ESTIMATOR_CHECKOUT_PATH=${source#"$workspace/"}"
        >> "$GITHUB_ENV"

        printf ''job=%s\njob_identity=%s\nsource_owner=%s\nsource_identity=%s\nowner=%s\n'' "$job" "$(stat -c ''%d:%i'' --
        "$job")" "$source_owner" "$(stat -c ''%d:%i'' -- "$source_owner")" "$owner" > "$job/proof/owned-paths.txt"

        '
    - uses: actions/checkout@v7
      with:
        ref: adff0392e61608c9a576550be78dd7eefb8b9065
        path: ${{ env.PARAMSD_ESTIMATOR_CHECKOUT_PATH }}
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
    - name: Admit parent Cargo.lock binding
      working-directory: ${{ env.PARAMSD_ESTIMATOR_SOURCE }}
      run: 'set -euo pipefail

        printf ''%s  %s\n'' 855f00e2e7751b242e5599d30708d1db8340a85675b522c7e83dac00bb24a667 rust/Cargo.lock | sha256sum -c
        - > "$PARAMSD_ESTIMATOR_PROOF/cargo-lock-admission.txt"

        '
    - name: Stage frozen observer and controls from workflow
      working-directory: ${{ env.PARAMSD_ESTIMATOR_SOURCE }}
      run: "set -euo pipefail\ncat > \"$PARAMSD_ESTIMATOR_JOB/build-original.py\" <<'FROZEN_SCRIPT'\n#!/usr/bin/env python3\n\
        \"\"\"Actions-only exact original build commands with operation growth, no floor.\nDoes not modify build_paramsd_oracle.py\
        \ or reuse an old wrapper binary.\n\"\"\"\nimport argparse\nimport json\nimport os\nfrom pathlib import Path\nimport\
        \ shutil\nimport subprocess\nimport sys\nimport sysconfig\nimport numpy as np\np=argparse.ArgumentParser()\nfor name\
        \ in ['root','output','eigen-include']:\n    p.add_argument('--'+name,type=Path,required=True)\na=p.parse_args();root=a.root.resolve();out=a.output.resolve();out.mkdir(exist_ok=False)\n\
        eigen=a.eigen_include.resolve()\ncommands=[\n [sys.executable,str(root/'openpilot/selfdrive/locationd/models/car_kf.py'),'car',str(out)],\n\
        \ ['clang++','-std=c++17','-O2','-shared','-fPIC','-I'+str(root/'rednose_repo'),'-I'+str(eigen),str(out/'car.cpp'),'-o',str(out/'libcar.so')],\n\
        \ [sys.executable,'-m','cython','--cplus','-3',str(root/'rednose_repo/rednose/helpers/ekf_sym_pyx.pyx'),'-o',str(out/'ekf_sym_pyx.cpp')],\n\
        \ ['clang++','-std=c++17','-O1','-shared','-fPIC','-I'+str(root/'rednose_repo'),'-I'+str(root/'rednose_repo/rednose'),'-I'+str(eigen),'-I'+sysconfig.get_paths()['include'],'-I'+np.get_include(),str(out/'ekf_sym_pyx.cpp'),str(root/'rednose_repo/rednose/helpers/ekf_sym.cc'),str(root/'rednose_repo/rednose/helpers/ekf_load.cc'),'-ldl','-o',str(out/('ekf_sym_pyx'+sysconfig.get_config_var('EXT_SUFFIX')))],\n\
        ]\nwith (out/'build.log').open('w') as log:\n    for command in commands:\n        available=shutil.disk_usage(out).free\n\
        \        growth=1024**3  # next model/compiler outputs, no retained-space floor\n        log.write(json.dumps({'argv':command,'available_bytes':available,'planned_growth_bytes':growth})+'\\\
        n');log.flush()\n        assert available >= growth\n        child=subprocess.run(command,cwd=root,env=os.environ|{'PYTHONPATH':str(root)+os.pathsep+os.environ.get('PYTHONPATH','')},stdout=log,stderr=subprocess.STDOUT,timeout=300)\n\
        \        log.write(f'EXIT {child.returncode}\\n');log.flush();child.check_returncode()\nFROZEN_SCRIPT\ncat > \"$PARAMSD_ESTIMATOR_JOB/capture-original.py\"\
        \ <<'FROZEN_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"Actions-only observer; calls unchanged check_paramsd.main and original\
        \ load.\nNo expected learner values are authored here or derived from a Rust trace.\n\"\"\"\nimport argparse\nimport\
        \ hashlib\nimport importlib.util\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\n\
        import sys\nimport sysconfig\n\np = argparse.ArgumentParser()\np.add_argument('--root', type=Path, required=True)\n\
        p.add_argument('--oracle', type=Path, required=True)\np.add_argument('--trace', type=Path, required=True)\np.add_argument('--evidence',\
        \ type=Path, required=True)\np.add_argument('--source-commit', required=True)\na = p.parse_args()\nroot, oracle, trace\
        \ = a.root.resolve(), a.oracle.resolve(), a.trace.resolve()\nevidence = a.evidence.resolve()\nassert re.fullmatch('[0-9a-f]{40}',\
        \ a.source_commit)\nassert subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()\
        \ == a.source_commit\nevidence.mkdir(exist_ok=False)\n\ndef digest(path):\n    h = hashlib.sha256()\n    with path.open('rb')\
        \ as stream:\n        while part := stream.read(1024 * 1024):\n            h.update(part)\n    return h.hexdigest()\n\
        \ndef identity(path):\n    st = path.stat()\n    assert path.is_file() and not path.is_symlink(), path\n    return\
        \ [st.st_dev, st.st_ino, st.st_size, st.st_mtime_ns, st.st_ctime_ns, digest(path)]\n\nheld = {}\ndef hold(path):\n\
        \    # Resolved imported/provider paths avoid final-component symlinks. Retain\n    # literal root source paths separately\
        \ where Rust mandates their spelling.\n    path = Path(path)\n    value = identity(path)\n    if str(path) in held:\n\
        \        assert held[str(path)] == value, path\n    else:\n        held[str(path)] = value\n\n# Bind this exact staged\
        \ __main__ before importing/executing the original\n# checker/learner. It is outside the source root and installed\
        \ provider pool.\nhold(Path(__file__).resolve())\n\n# Whole indexed-source stream is separately sealed by the shell\
        \ before/after.\n# Bind explicit sources plus all source/native dependencies of these crates.\nrequired = [\n    'rust/Cargo.lock',\
        \ 'rust/Cargo.toml', 'rust/crates/dev-tools/Cargo.toml',\n    'rust/tools/check_paramsd.py', 'rust/tools/paramsd_source.py',\
        \ 'rust/tools/paramsd_fixture.py',\n    'rust/crates/dev-tools/src/paramsd_fixture_generate.rs',\n    'openpilot/selfdrive/locationd/paramsd.py',\
        \ 'openpilot/selfdrive/locationd/helpers.py',\n    'openpilot/selfdrive/locationd/models/car_kf.py', 'openpilot/selfdrive/locationd/models/constants.py',\n\
        \    'openpilot/common/transformations/orientation.py', 'openpilot/common/transformations/transformations.py',\n \
        \   'openpilot/cereal/log.capnp', 'openpilot/cereal/custom.capnp', 'openpilot/cereal/deprecated.capnp',\n    'opendbc_repo/opendbc/car/car.capnp',\
        \ 'openpilot/cereal/messaging/__init__.py',\n    'rednose_repo/rednose/helpers/kalmanfilter.py', 'rednose_repo/rednose/helpers/ekf_sym_pyx.pyx',\n\
        ]\nfor name in required:\n    hold(root / name)\nfor relative in ['rust/crates/paramsd', 'rust/crates/cereal', 'rednose_repo/rednose/helpers',\n\
        \                 'rednose_repo/rednose/templates', 'rust/crates/dev-tools/src/paramsd_estimator_check']:\n    for\
        \ path in sorted((root / relative).rglob('*')):\n        if path.is_file() and not path.is_symlink() and path.suffix\
        \ in {'.rs', '.cc', '.cpp', '.h', '.hpp', '.py', '.pyx', '.pxd', '.npy', '.c', '.toml'}:\n            hold(path)\n\
        for name in ['rust/crates/dev-tools/src/paramsd_estimator_check.rs',\n             'rust/crates/dev-tools/src/bin/check_paramsd_estimator_native.rs',\n\
        \             'rust/crates/dev-tools/src/qa_process.rs', 'rust/crates/dev-tools/tests/paramsd_estimator_check.rs']:\n\
        \    hold(root / name)\nfor path in sorted(oracle.iterdir()):\n    if path.is_file() and path.name != 'build.log':\n\
        \        hold(path)\nhold(trace)\nhold(Path(sys.executable).resolve())\n\n# Inventory installed providers before use,\
        \ retaining only actually imported or\n# mapped paths as held Rust descriptors. This avoids exhausting the FD limit\
        \ by\n# holding every unrelated installed pure-Python module.\npool = {}\nvenv = Path(sys.prefix).resolve()\nfor base\
        \ in [venv / 'lib', Path(sysconfig.get_path('stdlib'))]:\n    for directory, children, names in os.walk(base):\n \
        \       children[:] = [name for name in children if name not in {'__pycache__', 'test', 'tests'}\n               \
        \        and (base == venv / 'lib' or name not in {'site-packages', 'dist-packages'})]\n        for name in names:\n\
        \            path = Path(directory) / name\n            if path.is_file() and not path.is_symlink() and (path.suffix\
        \ in {'.py', '.so', '.npy', '.capnp'} or '.so.' in path.name):\n                pool[str(path.resolve())] = identity(path.resolve())\n\
        (evidence / 'provider-pool-before.json').write_text(json.dumps(pool, indent=2) + '\\n')\n\ndef maps():\n    paths\
        \ = set()\n    for line in Path('/proc/self/maps').read_text().splitlines():\n        fields = line.split(None, 5)\n\
        \        if len(fields) == 6 and fields[5].startswith('/'):\n            assert not fields[5].endswith(' (deleted)'),\
        \ line\n            paths.add(Path(fields[5]).resolve())\n    return paths\n\ndef ldd_paths(binary):\n    result =\
        \ subprocess.check_output(['ldd', str(binary)], text=True)\n    assert 'not found' not in result, result\n    (evidence\
        \ / (binary.name + '.ldd')).write_text(result)\n    return {Path(x).resolve() for x in re.findall(r'(?:=>\\s+|^\\\
        s*)(/\\S+)', result, re.M)}\n\n# Include the two native executables and oracle DT_NEEDED closure before use.\ncontroller\
        \ = trace.parent.parent / 'check-paramsd-estimator-native'\nfor binary in [trace, controller, oracle / 'libcar.so',\
        \ *oracle.glob('ekf_sym_pyx*.so')]:\n    hold(binary)\n    for path in ldd_paths(binary):\n        hold(path)\nfor\
        \ path in maps():\n    hold(path)\n# Resolve DT_NEEDED dependencies of lazily imported Python extensions before\n\
        # execution as well (e.g. system libffi behind stdlib _ctypes).\nnative_dependencies = {}\nfor name in sorted(pool):\n\
        \    path = Path(name)\n    if path.suffix == '.so' or '.so.' in path.name:\n        result = subprocess.check_output(['ldd',\
        \ str(path)], text=True)\n        assert 'not found' not in result, (path, result)\n        native_dependencies[name]\
        \ = result\n        for item in re.findall(r'(?:=>\\s+|^\\s*)(/\\S+)', result, re.M):\n            hold(Path(item).resolve())\n\
        (evidence / 'provider-dependency-ldd.json').write_text(json.dumps(native_dependencies, indent=2) + '\\n')\npre_paths\
        \ = set(held) | set(pool)\n(evidence / 'providers-before.json').write_text(json.dumps(held, indent=2) + '\\n')\n\n\
        sys.path.insert(0, str(root / 'rust/tools'))\nsys.path.insert(0, str(root))\nspec = importlib.util.spec_from_file_location('retained_check_paramsd',\
        \ root / 'rust/tools/check_paramsd.py')\nchecker = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(checker)\n\
        assert Path(checker.load.__code__.co_filename).resolve() == root / 'rust/tools/paramsd_source.py'\nactual_load = checker.load\n\
        loader_maps = []\ndef observed_load(directory):\n    namespace, logs = actual_load(directory)  # actual independent\
        \ original\n    loader_maps.extend(sorted(str(path) for path in maps()))\n    for path in maps():\n        hold(path)\n\
        \    return namespace, logs\nchecker.load = observed_load\nsys.argv = [str(root / 'rust/tools/check_paramsd.py'),\
        \ '--oracle', str(oracle), '--trace', str(trace), '--evidence', str(evidence)]\nchecker.main()  # writes ORIGINAL\
        \ source.json and runs exact original comparator\n\nloaded = {}\nfor name, module in sorted(sys.modules.items()):\n\
        \    path = getattr(module, '__file__', None)\n    if path and Path(path).is_file():\n        resolved = Path(path).resolve()\n\
        \        # .pyc is prohibited by the recipe; do not silently bind stale bytecode.\n        assert resolved.suffix\
        \ != '.pyc', (name, resolved)\n        if str(resolved) in pool:\n            assert identity(resolved) == pool[str(resolved)],\
        \ resolved\n        else:\n            assert str(resolved).startswith(str(root) + '/') or str(resolved) in held,\
        \ resolved\n        hold(resolved)\n        loaded[name] = str(resolved)\nwrapper = sys.modules['rednose.helpers.ekf_sym_pyx']\n\
        assert Path(wrapper.__file__).resolve().parent == oracle\nactual_maps = maps()\nfor path in actual_maps:\n    if str(path)\
        \ in pool:\n        assert identity(path) == pool[str(path)], path\n    hold(path)\n# Fail if an extension mapped\
        \ lazily was not snapshotted before learner work.\nlate_native = [str(path) for path in actual_maps if str(path) not\
        \ in pre_paths]\nassert not late_native, ('uncaptured pre-execution native provider', late_native)\nfor path, value\
        \ in held.items():\n    assert identity(Path(path)) == value, path\n(evidence / 'loaded-modules.json').write_text(json.dumps(loaded,\
        \ indent=2) + '\\n')\n(evidence / 'loader-maps.json').write_text(json.dumps(loader_maps, indent=2) + '\\n')\n(evidence\
        \ / 'final-maps.json').write_text(json.dumps(sorted(str(p) for p in actual_maps), indent=2) + '\\n')\n(evidence /\
        \ 'providers-after.json').write_text(json.dumps(held, indent=2) + '\\n')\n(evidence / 'capture.json').write_text(json.dumps({\n\
        \    'schema': 1, 'source_commit': a.source_commit, 'root': str(root), 'oracle': str(oracle),\n    'binary': {'path':\
        \ str(trace), 'sha256': digest(trace)},\n    'members': {name: digest(evidence / name) for name in ['input.json',\
        \ 'results.json', 'source.json']},\n    'bindings': [{'path': path, 'sha256': value[-1]} for path, value in sorted(held.items())],\n\
        }, indent=2) + '\\n')\nFROZEN_SCRIPT\ncat > \"$PARAMSD_ESTIMATOR_JOB/numpy-controls.py\" <<'FROZEN_SCRIPT'\n#!/usr/bin/env\
        \ python3\n\"\"\"Actions-only independent NumPy observations around both production windows.\"\"\"\nimport json\n\
        import math\nfrom pathlib import Path\nimport struct\nimport sys\nimport numpy as np\n\ndef bits(value):\n    return\
        \ struct.unpack('<Q', struct.pack('<d', value))[0]\n\ncases = []\nfor tolerance in [1e-9, 2e-6, 0.1]:\n    for actual\
        \ in [0., -0., 1e-300, -1e-300, 1e-10, -1e-10, 0.5, -0.5, 1., -1., 10., -10., 1e10, -1e10, 1e300, -1e300]:\n     \
        \   # Build both sides independently, then ask actual np.isclose. This also\n        # records binary64 rounding at\
        \ each nextafter boundary.\n        delta = tolerance + tolerance * abs(actual)\n        for sign in [-1., 1.]:\n\
        \            edge = actual + sign * delta\n            expected_values = [actual, edge]\n            for direction\
        \ in [-math.inf, math.inf]:\n                value = edge\n                for _ in range(8):\n                  \
        \  value = math.nextafter(value, direction)\n                    expected_values.append(value)\n            for expected\
        \ in expected_values:\n                cases.append({'expected_bits': bits(expected), 'actual_bits': bits(actual),\n\
        \                              'tolerance': tolerance, 'close': bool(np.isclose(expected, actual, atol=tolerance,\
        \ rtol=tolerance, equal_nan=True))})\n    for expected in [math.nan, math.inf, -math.inf, 0., 1.]:\n        for actual\
        \ in [math.nan, math.inf, -math.inf, 0., 1.]:\n            cases.append({'expected_bits': bits(expected), 'actual_bits':\
        \ bits(actual),\n                          'tolerance': tolerance, 'close': bool(np.isclose(expected, actual, atol=tolerance,\
        \ rtol=tolerance, equal_nan=True))})\nPath(sys.argv[1]).write_text(json.dumps({'numpy_version': np.__version__, 'cases':\
        \ cases}, indent=2) + '\\n')\nFROZEN_SCRIPT\ncat > \"$PARAMSD_ESTIMATOR_JOB/audit-native.py\" <<'FROZEN_SCRIPT'\n\
        #!/usr/bin/env python3\n\"\"\"Actions-only audit using retained original compare, not Rust expectations.\"\"\"\nimport\
        \ argparse\nimport hashlib\nimport importlib.util\nimport json\nfrom pathlib import Path\nimport re\nimport struct\n\
        \np = argparse.ArgumentParser()\nfor name in ['root', 'original', 'native', 'trace', 'checker', 'exec-log']:\n   \
        \ p.add_argument('--' + name, type=Path, required=True)\na = p.parse_args()\nspec = importlib.util.spec_from_file_location('retained_checker_audit',\
        \ a.root / 'rust/tools/check_paramsd.py')\nmodule = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(module)\n\
        expected = json.loads((a.original / 'source.json').read_text())\nraw = json.loads((a.native / 'native-raw.json').read_text())\n\
        for case in raw:\n    for row in case['rows']:\n        row['x'] = module.values(row.pop('x_bits'))\n        row['p']\
        \ = module.values(row.pop('p_bits'))\n        row['observed'] = module.values(row.pop('observed_bits'))\n        with\
        \ module.log.Event.from_bytes(bytes(row.pop('packet'))) as event:\n            row['event'] = event.to_dict()\nerrors\
        \ = []\nmodule.compare(expected, raw, 'paramsd', errors)\nsummary = json.loads((a.native / 'results.json').read_text())\n\
        original_summary = json.loads((a.original / 'results.json').read_text())\nassert summary == original_summary\nassert\
        \ summary['numeric_comparisons'] == len(errors)\nassert summary['max_absolute_error'] == max(errors)\nassert summary['steps']\
        \ == 1196 and summary['cases'] == 7 and summary['pass'] is True\ntrace = a.exec_log.read_text()\nexecs = re.findall(r'(?m)\\\
        bexecve\\((\"(?:[^\"\\\\]|\\\\.)*\"), (\\[.*\\]), .*\\) = 0$', trace)\nassert len(re.findall(r'\\bexecve(?:at)?\\\
        (', trace)) == 2, trace\nassert len(execs) == 2, trace\nprograms = [json.loads(x[0]) for x in execs]\nargv = [json.loads(x[1])\
        \ for x in execs]\nassert programs == [str(a.checker), str(a.trace)], programs\nassert argv[1] == [str(a.trace), str(a.native\
        \ / 'native-raw.json')]\nassert argv[0] == [str(a.checker),'--root',str(a.root),'--binary',str(a.trace),'--original',str(a.original),'--oracle',str(a.original.parent\
        \ / 'oracle'),'--evidence',str(a.native),'--source-commit',json.loads((a.original/'capture.json').read_text())['source_commit']]\n\
        assert not any('python' in Path(path).name.lower() for path in programs)\n# Retained bindings remain current; this\
        \ audits paths that are actual saved\n# sources/providers, not alleged original execution from old binary artifacts.\n\
        for phase in ['before', 'after']:\n    for binding in json.loads((a.native / f'bindings-{phase}.json').read_text()):\n\
        \        assert hashlib.sha256(Path(binding['path']).read_bytes()).hexdigest() == binding['sha256'], binding\n(a.native.parent\
        \ / 'audit.json').write_text(json.dumps({'pass': True, 'fresh_original_rows':1196,\n    'full_schema_python_recompare':True,\
        \ 'execs':2, 'python_execs':0,\n    'source_commit':json.loads((a.original/'capture.json').read_text())['source_commit'],\n\
        \    'reused_unchanged':{'startup_run':39834626379,'loop_cases':39,'loop_rows':2420,'estimator_inputs':7,'daemon_rows':[1202,8]},\n\
        \    'reference_python_retired':False}, indent=2)+'\\n')\nFROZEN_SCRIPT\ncat > \"$PARAMSD_ESTIMATOR_JOB/signal-controls.py\"\
        \ <<'FROZEN_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"Actions-only SIGINT/SIGTERM injection while owned real trace is\
        \ stopped.\nMust observe the actual native trace PID before injection; no missed-race pass.\n\"\"\"\nimport argparse\n\
        import json\nimport os\nfrom pathlib import Path\nimport signal\nimport subprocess\nimport time\np=argparse.ArgumentParser()\n\
        for name in ['root','original','oracle','trace','checker','proof']:\n    p.add_argument('--'+name,type=Path,required=True)\n\
        p.add_argument('--source-commit',required=True)\na=p.parse_args()\nfor sig in [signal.SIGINT, signal.SIGTERM]:\n \
        \   evidence=a.proof/('signal-'+sig.name)\n    argv=[str(a.checker),'--root',str(a.root),'--binary',str(a.trace),'--original',str(a.original),'--oracle',str(a.oracle),'--evidence',str(evidence),'--source-commit',a.source_commit]\n\
        \    child_pid=None\n    with (a.proof/(sig.name+'.stdout')).open('wb') as stdout, (a.proof/(sig.name+'.stderr')).open('wb')\
        \ as stderr:\n        proc=subprocess.Popen(argv,env=os.environ|{'PATH':'/nonexistent'},stdout=stdout,stderr=stderr,start_new_session=True)\n\
        \        try:\n            deadline=time.monotonic()+60\n            while time.monotonic()<deadline and proc.poll()\
        \ is None:\n                children=Path(f'/proc/{proc.pid}/task/{proc.pid}/children')\n                try:\n  \
        \                  pids=children.read_text().split()\n                except FileNotFoundError:\n                \
        \    pids=[]\n                if pids:\n                    assert len(pids)==1,pids\n                    candidate=int(pids[0])\n\
        \                    try:\n                        executable=Path(f'/proc/{candidate}/exe').resolve(strict=True)\n\
        \                    except FileNotFoundError:\n                        executable=None\n                    # fork\
        \ can become visible before exec; inject only after\n                    # the exact registered trace has entered\
        \ its native image.\n                    if executable==a.trace.resolve():\n                        child_pid=candidate\n\
        \                        os.kill(child_pid,signal.SIGSTOP)\n                        assert Path(f'/proc/{child_pid}/exe').resolve(strict=True)==a.trace.resolve()\n\
        \                        break\n                time.sleep(.001)\n            assert child_pid is not None, 'injection\
        \ missed native child; gate must not claim cancellation acceptance'\n            os.kill(proc.pid,sig)\n         \
        \   code=proc.wait(timeout=10)\n            assert code != 0 and not (evidence/'results.json').exists()\n        \
        \    assert not Path(f'/proc/{child_pid}').exists(), 'direct native child not reaped'\n            (a.proof/(sig.name+'.json')).write_text(json.dumps({'signal':sig.name,'controller_pid':proc.pid,'trace_pid':child_pid,'exit':code,'direct_child_reaped':True,'no_pass_receipt':True},indent=2)+'\\\
        n')\n        finally:\n            if proc.poll() is None:\n                os.killpg(proc.pid,signal.SIGKILL)\n \
        \               proc.wait()\n            # Trace has its own group. Cleanup is scoped to observed owned PID,\n   \
        \         # never runner-wide; successful cases already prove this PID absent.\n            if child_pid is not None\
        \ and Path(f'/proc/{child_pid}').exists():\n                os.kill(child_pid,signal.SIGKILL)\n                raise\
        \ AssertionError('controller failed owned-child cleanup')\nFROZEN_SCRIPT\nsha256sum \"$PARAMSD_ESTIMATOR_JOB/\"*.py\
        \ > \"$PARAMSD_ESTIMATOR_PROOF/observer-scripts.sha256\"\n"
    - name: Exact original and native estimator controller only
      working-directory: ${{ env.PARAMSD_ESTIMATOR_SOURCE }}
      run: "set -euo pipefail\nrequire_growth() {\n  local mib=$1 available required\n  available=$(df -PB1 \"$PARAMSD_ESTIMATOR_JOB\"\
        \ | awk 'NR == 2 {print $4}')\n  [[ $available =~ ^[0-9]+$ ]]\n  required=$((mib * 1024 * 1024))\n  printf '{\"available_bytes\"\
        :%s,\"planned_growth_bytes\":%s}\\n' \"$available\" \"$required\" >> \"$PARAMSD_ESTIMATOR_PROOF/growth.jsonl\"\n \
        \ ((available >= required))\n}\nproof=$PARAMSD_ESTIMATOR_PROOF\njob=$PARAMSD_ESTIMATOR_JOB\nroot=$PWD\nprintf '%s\\\
        n' \"$RUNNER_NAME\" > \"$proof/runner.txt\"\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$(git rev-parse HEAD)\" =\
        \ \"$SOURCE_SHA\"\ngit diff --exit-code\nprintf '%s\\n' \"$SOURCE_SHA\" > \"$proof/SOURCE_COMMIT\"\n# Preserve symlink\
        \ text including directory/dangling links; do not dereference.\ngit ls-files -z > \"$proof/index-before.bin\"\nseal_source()\
        \ {\n  tar --null --no-recursion --verbatim-files-from -T \"$proof/index-before.bin\" -cf - --mtime='UTC 1970-01-01'\
        \ --owner=0 --group=0 --numeric-owner | sha256sum\n}\nseal_source > \"$proof/source-before.sha256\"\nfor tool in rustup\
        \ cargo rustc clang++ capnp strace python3 curl; do\n  command -v \"$tool\"\ndone > \"$proof/tools.txt\"\nwhile read\
        \ -r tool; do readlink -f \"$tool\"; done < \"$proof/tools.txt\" | sort -u | xargs sha256sum > \"$proof/tool-paths.sha256\"\
        \ndf -PB1 \"$job\" > \"$proof/disk-before.txt\"\ncat /proc/meminfo > \"$proof/memory-before.txt\"\nif test -r /sys/fs/cgroup/memory.events;\
        \ then cat /sys/fs/cgroup/memory.events > \"$proof/cgroup-memory-before.txt\"; fi\nulimit -a > \"$proof/limits.txt\"\
        \nuname -a > \"$proof/kernel.txt\"\nlscpu > \"$proof/cpu.txt\"\nrequire_growth 8192\nrustup toolchain install 1.94.0\
        \ --profile minimal --component clippy\nexport RUSTUP_TOOLCHAIN=1.94.0\nrustc -vV > \"$proof/rustc.txt\"\nclang++\
        \ --version > \"$proof/clang.txt\"\ncapnp --version > \"$proof/capnp.txt\"\nrequire_growth 2048\npython3 -m venv \"\
        $job/venv\"\npython=\"$job/venv/bin/python\"\n\"$python\" -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4\
        \ setuptools==82.0.1 cffi==2.1.1 sympy==1.14.0 pyzmq==27.2.0 zstandard==0.25.0 requests==2.34.2 pyserial==3.5 --report\
        \ \"$proof/pip-report.json\" > \"$proof/pip.log\" 2>&1\n\"$python\" -m pip freeze --all > \"$proof/python-distributions.txt\"\
        \nexport PYTHONDONTWRITEBYTECODE=1\nexport PYTHONPATH=\"$root:$root/rust/tools\"\nrequire_growth 8192\ncargo build\
        \ --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features eigen-tools-native --bin stage-eigen-headers\
        \ > \"$proof/eigen-build.log\" 2>&1\ncurl --fail --location --retry 3 --output \"$proof/eigen-3.4.0-py3-none-linux_x86_64.whl\"\
        \ https://github.com/commaai/dependencies/releases/download/eigen/v3.4.0/eigen-3.4.0-py3-none-linux_x86_64.whl\nprintf\
        \ '%s  %s\\n' 0680581b726b6160646d9053cc7416f68c9a38353a26a7f4e4a58222233aa1ba \"$proof/eigen-3.4.0-py3-none-linux_x86_64.whl\"\
        \ | sha256sum -c -\n\"$CARGO_TARGET_DIR/debug/stage-eigen-headers\" --wheel \"$proof/eigen-3.4.0-py3-none-linux_x86_64.whl\"\
        \ --output \"$proof/eigen-native\" --architecture x86_64 > \"$proof/eigen-stage.json\"\nexport PARAMSD_EIGEN_INCLUDE=\"\
        $proof/eigen-native/install\"\nfind \"$proof/eigen-native\" -type f -print0 | sort -z | xargs -0 sha256sum > \"$proof/eigen.sha256\"\
        \n# Original wrapper is fresh and built only for this new controller admission.\nrequire_growth 2048\n\"$python\"\
        \ \"$job/build-original.py\" --root \"$root\" --output \"$proof/oracle\" --eigen-include \"$PARAMSD_EIGEN_INCLUDE\"\
        \nrequire_growth 8192\ncargo build --manifest-path rust/Cargo.toml --locked -p openpilot-paramsd --no-default-features\
        \ --features solver --example paramsd_trace > \"$proof/trace-build.log\" 2>&1\ncargo build --manifest-path rust/Cargo.toml\
        \ --locked -p openpilot-dev-tools --features paramsd-fixture-native --bin check-paramsd-estimator-native > \"$proof/checker-build.log\"\
        \ 2>&1\nrequire_growth 2048\ncargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features\
        \ paramsd-fixture-native --test paramsd_estimator_check > \"$proof/controller-tests.log\" 2>&1\ncargo clippy --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-fixture-native --bin check-paramsd-estimator-native\
        \ --test paramsd_estimator_check -- -D warnings > \"$proof/clippy.log\" 2>&1\ntrace=\"$CARGO_TARGET_DIR/debug/examples/paramsd_trace\"\
        \nchecker=\"$CARGO_TARGET_DIR/debug/check-paramsd-estimator-native\"\nsha256sum \"$trace\" \"$checker\" > \"$proof/native-elf.sha256\"\
        \n# Independent NumPy boundary observations are new comparison-controller scope.\n\"$python\" \"$job/numpy-controls.py\"\
        \ \"$proof/numpy-controls.json\"\nexport PARAMSD_NUMPY_CONTROLS=\"$proof/numpy-controls.json\"\ncargo test --manifest-path\
        \ rust/Cargo.toml --locked -p openpilot-dev-tools --features paramsd-fixture-native --test paramsd_estimator_check\
        \ matches_fresh_numpy_comparison_boundary_observations -- --ignored --exact > \"$proof/numpy-controls-test.log\" 2>&1\n\
        # Actual unchanged checker and independent learner loader produce source.json.\nrequire_growth 1024\n/usr/bin/timeout\
        \ --kill-after=10s 300s \"$python\" \"$job/capture-original.py\" --root \"$root\" --oracle \"$proof/oracle\" --trace\
        \ \"$trace\" --evidence \"$proof/original\" --source-commit \"$SOURCE_SHA\" > \"$proof/original.log\" 2>&1\n# New\
        \ controller: exactly itself + its owned real estimator child, no Python.\nPATH=/nonexistent /usr/bin/timeout --kill-after=10s\
        \ 300s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o \"$proof/native.exec\" \"$checker\" --root \"$root\"\
        \ --binary \"$trace\" --original \"$proof/original\" --oracle \"$proof/oracle\" --evidence \"$proof/native\" --source-commit\
        \ \"$SOURCE_SHA\" > \"$proof/native.log\" 2>&1\n\"$python\" \"$job/audit-native.py\" --root \"$root\" --original \"\
        $proof/original\" --native \"$proof/native\" --trace \"$trace\" --checker \"$checker\" --exec-log \"$proof/native.exec\"\
        \n# New signal controls, never a repeated accepted estimator functional gate.\n\"$python\" \"$job/signal-controls.py\"\
        \ --root \"$root\" --original \"$proof/original\" --oracle \"$proof/oracle\" --trace \"$trace\" --checker \"$checker\"\
        \ --proof \"$proof\" --source-commit \"$SOURCE_SHA\" > \"$proof/signal-controls.log\" 2>&1\nsha256sum -c \"$proof/eigen.sha256\"\
        \ > \"$proof/eigen-after.txt\"\nsha256sum -c \"$proof/native-elf.sha256\" > \"$proof/native-elf-after.txt\"\nsha256sum\
        \ -c \"$proof/tool-paths.sha256\" > \"$proof/tool-paths-after.txt\"\nseal_source > \"$proof/source-after.sha256\"\n\
        cmp \"$proof/source-before.sha256\" \"$proof/source-after.sha256\"\ngit ls-files -z > \"$proof/index-after.bin\"\n\
        cmp \"$proof/index-before.bin\" \"$proof/index-after.bin\"\ngit diff --exit-code\ndf -PB1 \"$job\" > \"$proof/disk-after.txt\"\
        \ncat /proc/meminfo > \"$proof/memory-after.txt\"\nif test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events\
        \ > \"$proof/cgroup-memory-after.txt\"; fi\n# Owned caches/tools/source are eligible only after upload ID+digest succeeds.\n\
        sha256sum -c \"$PARAMSD_ESTIMATOR_PROOF/observer-scripts.sha256\" > \"$PARAMSD_ESTIMATOR_PROOF/observer-scripts-after.txt\"\
        \n"
    - name: Retain new estimator controller evidence
      id: evidence
      if: ${{ always() && env.PARAMSD_ESTIMATOR_PROOF != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: paramsd-estimator-controller-296-evidence
        path: ${{ env.PARAMSD_ESTIMATOR_PROOF }}
        retention-days: 14
        if-no-files-found: error
    - name: Clean only owned paths after confirmed evidence upload
      if: ${{ always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.artifact-id != '' && steps.evidence.outputs.artifact-digest
        != '' && env.PARAMSD_ESTIMATOR_SOURCE_OWNER != '' }}
      working-directory: ${{ github.workspace }}
      env:
        PARAMSD_UPLOAD_ID: ${{ steps.evidence.outputs.artifact-id }}
        PARAMSD_UPLOAD_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
      run: "set -euo pipefail\n# Upload action success plus BOTH authenticated output fields are mandatory.\n[[ $PARAMSD_UPLOAD_ID\
        \ =~ ^[0-9]+$ ]]\n[[ $PARAMSD_UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\"\
        )\ntemp_root=$(realpath -e -- \"$RUNNER_TEMP\")\njob=$PARAMSD_ESTIMATOR_JOB\nsource_owner=$PARAMSD_ESTIMATOR_SOURCE_OWNER\n\
        expected_owner=\"${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}\"\n[[ $PARAMSD_ESTIMATOR_OWNER == \"$expected_owner\"\
        \ ]]\ncase \"$job\" in \"$temp_root/paramsd-estimator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"??????) ;; *) exit\
        \ 1 ;; esac\ncase \"$source_owner\" in \"$workspace/.paramsd-estimator-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"\
        ??????) ;; *) exit 1 ;; esac\nverify_owned() {\n  local path=$1 expected_identity=$2\n  test -d \"$path\"\n  test\
        \ ! -L \"$path\"\n  test \"$(realpath -e -- \"$path\")\" = \"$path\"\n  test \"$(stat -c '%u' -- \"$path\")\" = \"\
        $(id -u)\"\n  test \"$(stat -c '%d:%i' -- \"$path\")\" = \"$expected_identity\"\n  test -f \"$path/.paramsd-estimator-owner\"\
        \n  test ! -L \"$path/.paramsd-estimator-owner\"\n  test \"$(cat \"$path/.paramsd-estimator-owner\")\" = \"$expected_owner\"\
        \n}\nverify_owned \"$job\" \"$PARAMSD_ESTIMATOR_JOB_IDENTITY\"\nverify_owned \"$source_owner\" \"$PARAMSD_ESTIMATOR_SOURCE_IDENTITY\"\
        \ntest \"$PARAMSD_ESTIMATOR_PROOF\" = \"$job/proof\"\ntest -d \"$job/proof\"\ntest ! -L \"$job/proof\"\ntest \"$PARAMSD_ESTIMATOR_SOURCE\"\
        \ = \"$source_owner/source\"\ntest -d \"$source_owner/source\"\ntest ! -L \"$source_owner/source\"\ntest \"$(realpath\
        \ -e -- \"$source_owner/source\")\" = \"$source_owner/source\"\n# Validate the entire allowlist before deleting any\
        \ of it. Never remove job root\n# or proof; no runner-global cache/tool/source path is eligible.\nfor name in cache\
        \ target cargo-home rustup-home venv tmp; do\n  path=\"$job/$name\"\n  if test -e \"$path\" || test -L \"$path\";\
        \ then\n    test -d \"$path\"\n    test ! -L \"$path\"\n    test \"$(realpath -e -- \"$path\")\" = \"$path\"\n  fi\n\
        done\nprintf 'artifact_id=%s\\nartifact_digest=%s\\n' \"$PARAMSD_UPLOAD_ID\" \"$PARAMSD_UPLOAD_DIGEST\" > \"$job/proof/cleanup-upload-receipt.txt\"\
        \nfor name in cache target cargo-home rustup-home venv tmp; do\n  path=\"$job/$name\"\n  if test -d \"$path\"; then\
        \ rm -rf --one-file-system -- \"$path\"; fi\ndone\nrm -rf --one-file-system -- \"$source_owner\"\nprintf '%s\\n' 'owned\
        \ job caches/target/tools/temp and owned source removed; proof retained' > \"$job/proof/cleanup-complete.txt\"\n"
