name: CI bottleneck validation
on:
  push:
    branches: ['codex/fix-649-*']
    paths:
      - 'rust/crates/dev-tools/src/native_provider.rs'
      - 'rust/crates/dev-tools/src/native_provider/**'
      - 'rust/crates/dev-tools/src/ffmpeg_build.rs'
      - 'tools/ci/verify_provider_batch.py'
      - '.github/workflows/provider-batch.yml'
      - '.github/workflows/rust.yml'
      - 'tools/native/publish_inputs.py'
      - 'tools/ci/tests/**'
      - 'rust/crates/logging/build.rs'
      - 'rust/crates/loggerd/build.rs'
      - 'rust/crates/logging/tests/git_source_stamp.rs'
      - 'tools/ci/agnos_phases.py'
      - 'tools/ci/probe_native_agnos.py'
      - 'rust/tools/ci_cases.py'
      - 'rust/tools/check_card_ci.py'
      - 'rust/tools/check_ui_ci.py'
      - 'rust/tools/recovery_exit_status.py'
      - 'rust/tools/carrot_recovery_source.py'
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the original pinned ARM archive equivalence and timing
        type: boolean
        default: false

env:
  RUSTUP_TOOLCHAIN: '1.94.0'

permissions:
  contents: read

jobs:
  component-contract:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - name: Admit the bounded provider test build
        run: |
          python3 - <<'PY'
          import os, shutil
          growth = 3 * 1024**3
          free = shutil.disk_usage(os.environ['CI_JOB_TEMP']).free
          assert free >= growth, (free, growth)
          PY
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev clang libclang-dev pkg-config liblzma-dev libssl-dev
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Verify unchanged provider safety and new batch equivalence
        run: |
          set -o pipefail
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib native_provider:: -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/provider-tests.log"
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-logging --test git_source_stamp
          cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib -- -D warnings
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-runtime-ffmpeg
      - name: Preserve batch validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-batch-contract-${{ github.sha }}
          path: ${{ env.CI_JOB_TEMP }}/provider-tests.log
          if-no-files-found: warn
      - uses: ./.github/actions/job-temp
        if: always()
        with:
          cleanup: 'true'
  actual-arm-batch:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    needs: component-contract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
      - name: Admit the real fixed provider comparison
        run: |
          python3 - <<'PY'
          import os, shutil
          growth = 5 * 1024**3
          free = shutil.disk_usage(os.environ['CI_JOB_TEMP']).free
          assert free >= growth, (free, growth)
          PY
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev clang libclang-dev pkg-config liblzma-dev libssl-dev
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-runtime-ffmpeg
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --bin openpilot-runtime-assets
      - name: Compare every production profile and measure real cold and warm reuse
        run: |
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          python3 tools/ci/verify_provider_batch.py --preparer "$native_target/debug/build-runtime-ffmpeg" --assets "$native_target/debug/openpilot-runtime-assets" --root "$GITHUB_WORKSPACE" --work "$CI_JOB_TEMP/provider-benchmark"
      - name: Preserve real provider comparison and timing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-batch-arm-${{ github.sha }}
          path: |
            ${{ env.CI_JOB_TEMP }}/provider-benchmark/*.json
            ${{ env.CI_JOB_TEMP }}/provider-benchmark/*.stderr
          if-no-files-found: warn
      - uses: ./.github/actions/job-temp
        if: always()
        with:
          cleanup: 'true'

  recovery-runtime:
    name: rust recovery runtime
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}/rust/tools
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/job-temp
        with: {validation-context: 'true'}
      - uses: ./.github/actions/rust-path
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Prepare recovery comparison dependencies
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev clang libclang-dev pkg-config libssl-dev
          python -m pip install anyio==4.12.1 aiohttp==3.13.3
      - name: Reproduce PTY EOF before child exit without loosening exit checks
        working-directory: .
        run: python3 -m unittest discover -s tools/ci/tests -p test_recovery_pty_exit.py -v
      - name: Build standalone recovery service
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo build -p openpilot-carrot-recovery -p openpilot-process-supervision --bins --examples --locked
          sudo apt-get install -y tmux
      - name: Compare recovery HTTP, terminal, support, actions and upload paths
        working-directory: .
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
          python -P rust/tools/carrot_recovery_http_control.py --binary rust/target/debug/openpilot-carrot-recovery --output "$RUNNER_TEMP/recovery/http" --standalone
          python -P rust/tools/carrot_recovery_terminal_control.py --binary rust/target/debug/openpilot-carrot-recovery --output "$RUNNER_TEMP/recovery/terminal"
          python -P rust/tools/carrot_recovery_terminal_lifecycle.py --binary rust/target/debug/openpilot-carrot-recovery --output "$RUNNER_TEMP/recovery/lifecycle"
          python -P rust/tools/carrot_recovery_support_control.py --binary rust/target/debug/openpilot-carrot-recovery --output "$RUNNER_TEMP/recovery/support"
          python -P rust/tools/carrot_recovery_support_shutdown.py --binary rust/target/debug/openpilot-carrot-recovery --output "$RUNNER_TEMP/recovery/shutdown"
          python -P rust/tools/carrot_recovery_actions_control.py --binary rust/target/debug/examples/recovery_actions --tmux /usr/bin/tmux --output "$RUNNER_TEMP/recovery/actions"
          python -P rust/tools/check_carrot_recovery_upload.py --binary rust/target/debug/examples/upload --http-binary rust/target/debug/examples/recovery_actions --output "$RUNNER_TEMP/recovery/upload"
          cargo test --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery --lib --no-run --locked --message-format=json > "$RUNNER_TEMP/recovery/tests.jsonl"
          recovery_test=$(python -c 'import json,sys; print(next(x["executable"] for x in map(json.loads,open(sys.argv[1])) if x.get("reason")=="compiler-artifact" and x.get("profile",{}).get("test") and x["target"]["name"]=="openpilot_carrot_recovery"))' "$RUNNER_TEMP/recovery/tests.jsonl")
          python -P rust/tools/carrot_recovery_cwp_check.py --test-binary "$recovery_test" --output "$RUNNER_TEMP/recovery/cwp"
      - name: Preserve recovery source comparisons
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-recovery-evidence
          path: ${{ env.CI_JOB_TEMP }}/recovery/
          if-no-files-found: warn
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true', validation-context: 'true'}

  execution-contracts:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 pytest==9.0.2 numpy==2.5.3 pycapnp==2.1.0 pyzmq==27.2.0
      - run: python3 -m unittest discover -s tools/ci/tests -p test_native_input_publication.py -v
      - run: python3 -m unittest discover -s tools/ci/tests -p test_local_native_workflows.py -v
      - run: python3 -m unittest discover -s tools/ci/tests -p test_parallel_cases.py -v
      - run: python3 -m unittest discover -s tools/ci/tests -p test_agnos_phases.py -v
      - run: PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/opendbc_repo:$GITHUB_WORKSPACE/rust/tools" python -m pytest -c /dev/null --noconftest -p no:cacheprovider rust/tools/tests/test_card_ci.py rust/tools/tests/test_card_phase_fence.py rust/tools/tests/test_card_admission.py rust/tools/tests/test_ui_ci.py -q
