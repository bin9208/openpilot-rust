name: 296 recovery actual thirteen-source deletion and executable provenance
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/recovery-family-native-retirement-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  recovery-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 81d4186556978fc9e8fd6a33caee4b0a6db739c4
        persist-credentials: false
    - name: Bind exact source and reserve disk before prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 81d4186556978fc9e8fd6a33caee4b0a6db739c4

        proof="$RUNNER_TEMP/recovery-frozen"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        '
    - name: Install native recovery prerequisites only
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update

        sudo apt-get install -y tmux util-linux strace binutils capnproto libcapnp-dev g++ pkg-config cmake jq

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        '
    - name: Build actual native recovery and process-child candidates
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/recovery-frozen"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery -p openpilot-process-supervision --bins --examples
        --locked > "$proof/build.stdout" 2> "$proof/build.stderr" || { tail -n 100 "$proof/build.stderr"; exit 1; }

        '
    - name: Compare native recovery HTTP, terminal, support, actions and upload paths
      working-directory: .
      env:
        RECOVERY_FAMILY_CHECKOUT_ROOT: ${{ github.workspace }}
        RECOVERY_FAMILY_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-recovery
        RECOVERY_FAMILY_ACTIONS_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/recovery_actions
        RECOVERY_FAMILY_UPLOAD_EXAMPLE: ${{ github.workspace }}/rust/target/debug/examples/upload
        RECOVERY_FAMILY_PROCESS_CHILD: ${{ github.workspace }}/rust/target/debug/openpilot-process-child
        RECOVERY_FAMILY_TMUX: /usr/bin/tmux
        RECOVERY_FAMILY_HISTORICAL_PRESENT: '0'
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        proof="$RUNNER_TEMP/recovery"

        mkdir "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        private="$RUNNER_TEMP/recovery-private-root"

        test ! -e "$private"

        mkdir -p "$private/openpilot/selfdrive/carrot/recovery" "$private/openpilot/common" "$private/rust/tools"

        cp -a openpilot/selfdrive/carrot/recovery/server.py "$private/openpilot/selfdrive/carrot/recovery/server.py"

        cp -a openpilot/common/repo_update.py "$private/openpilot/common/repo_update.py"

        cp -a openpilot/selfdrive/carrot/web "$private/openpilot/selfdrive/carrot/web"

        export RECOVERY_FAMILY_PRIVATE_ROOT="$private"

        export RECOVERY_FAMILY_FROZEN_EVIDENCE="$proof/native"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --bin list-cargo-tests
        --bin audit-recovery-exec --locked

        cargo test --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery --lib --no-run --locked --message-format=json
        > "$proof/cwp-tests.jsonl"

        mapfile -t cwp < <(rust/target/debug/list-cargo-tests "$proof/cwp-tests.jsonl")

        test "${#cwp[@]}" -eq 1

        test -f "${cwp[0]}"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --test recovery_family_frozen
        --no-run --locked --message-format=json > "$proof/harness-tests.jsonl"

        mapfile -t harness < <(rust/target/debug/list-cargo-tests "$proof/harness-tests.jsonl")

        test "${#harness[@]}" -eq 1

        test -f "${harness[0]}"

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib recovery_
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib --bin
        audit-recovery-exec --test recovery_family_frozen --locked -- -D warnings

        export RECOVERY_FAMILY_CWP_TEST_BINARY="${cwp[0]}"

        printf ''%s\n'' "${cwp[0]}" "${harness[0]}" > "$proof/test-elf-paths.txt"

        pre_sha=$(rust/target/debug/audit-recovery-exec pre --receipt "$proof/exec-preflight.json" --native-root "$proof/native"
        --server "$RECOVERY_FAMILY_BINARY" --actions "$RECOVERY_FAMILY_ACTIONS_EXAMPLE" --upload "$RECOVERY_FAMILY_UPLOAD_EXAMPLE"
        --child "$RECOVERY_FAMILY_PROCESS_CHILD" --cwp "${cwp[0]}" --tmux /usr/bin/tmux --harness "${harness[0]}" --host-path
        "$PATH")

        [[ "$pre_sha" =~ ^[0-9a-f]{64}$ ]]

        printf ''%s\n'' "$pre_sha" > "$proof/exec-preflight.sha256"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 4096

        status=0

        strace -ff -qq -s 32768 -xx -e trace=execve,execveat -o "$proof/exec" "${harness[0]}" --exact eight_native_recovery_controllers_same_elf_present_and_absent
        --test-threads=1 --nocapture > "$proof/harness.stdout" 2> "$proof/harness.stderr" || status=$?

        test "$status" -eq 0 || { tail -n 100 "$proof/harness.stdout" "$proof/harness.stderr"; exit "$status"; }

        grep -F ''1 passed; 0 failed'' "$proof/harness.stdout"

        test "$(sha256sum "$proof/exec-preflight.json" | cut -d '' '' -f 1)" = "$pre_sha"

        rust/target/debug/audit-recovery-exec post --receipt "$proof/exec-preflight.json" --receipt-sha256 "$pre_sha" --trace-dir
        "$proof" --output "$proof/exec-audit.json" --harness-exit "$status"

        du -sm "$proof" > "$proof/artifact-size-mib.txt"

        test "$(cut -f1 "$proof/artifact-size-mib.txt")" -le 200

        '
    - name: Require changed maintained disk and workflow policies
      run: 'set -euo pipefail

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --test ci_disk_bootstrap --test ci_workflow_policy
        --locked > "$RUNNER_TEMP/recovery/workflow-policy.stdout" 2> "$RUNNER_TEMP/recovery/workflow-policy.stderr" || { tail
        -n 100 "$RUNNER_TEMP/recovery/workflow-policy.stdout" "$RUNNER_TEMP/recovery/workflow-policy.stderr"; exit 1; }

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-recovery-native-retirement-296
        path: '${{ runner.temp }}/recovery/

          ${{ runner.temp }}/recovery-frozen/'
        if-no-files-found: error
        retention-days: 5
