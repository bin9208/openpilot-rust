name: 296 grouped native uploader sibling proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/uploader-siblings-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: e5dfb68a41343ac2f51c8b9f002111656cf303c5
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: e5dfb68a41343ac2f51c8b9f002111656cf303c5
        persist-credentials: false
    - name: Reserve capacity and record exact source
      shell: bash
      run: 'set -euo pipefail

        export UPLOADER_SIBLING_BASE="$RUNNER_TEMP/uploader-siblings-native-296"

        printf ''UPLOADER_SIBLING_BASE=%s\n'' "$UPLOADER_SIBLING_BASE" >> "$GITHUB_ENV"

        mkdir "$UPLOADER_SIBLING_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$UPLOADER_SIBLING_BASE/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 10240

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev g++ libzmq5 strace

        rustc +1.94.0 -Vv > "$UPLOADER_SIBLING_BASE/rust-provider.txt"

        git status --porcelain=v1 > "$UPLOADER_SIBLING_BASE/source-status.before.txt"

        '
    - name: Admit all immutable source captures without running project Python
      shell: bash
      run: 'set -euo pipefail

        gh api repos/bin9208/openpilot-rust/actions/artifacts/12422761878/zip > "$UPLOADER_SIBLING_BASE/original.zip"

        base64 --decode <<''INERT'' > "$UPLOADER_SIBLING_BASE/hosted-native-siblings.py"

        

        INERT

        printf ''ed16424565ca7e35aea0adb931a5973612659d53d660b0cdac3d6704e313897f  %s/hosted-native-siblings.py\n'' "$UPLOADER_SIBLING_BASE"
        | sha256sum --check --strict

        python3 "$UPLOADER_SIBLING_BASE/hosted-native-siblings.py" admit

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build native providers and grouped controller once
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        mkdir "$UPLOADER_SIBLING_BASE/bin"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-uploader -p openpilot-logmessaged --bins
        --examples > "$UPLOADER_SIBLING_BASE/provider-build.stdout" 2> "$UPLOADER_SIBLING_BASE/provider-build.stderr"

        cp rust/target/debug/openpilot-uploader "$UPLOADER_SIBLING_BASE/bin/openpilot-uploader"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-siblings-native --bin check-uploader-siblings --bin check-uploader-logging > "$UPLOADER_SIBLING_BASE/controller-build.stdout"
        2> "$UPLOADER_SIBLING_BASE/controller-build.stderr"

        gcc -Wall -Wextra -Werror -O2 -fPIC -DZMQ_LINK_WRAP -c rust/tools/zmq_send_boundary.c -o "$UPLOADER_SIBLING_BASE/send-wrap.o"

        cargo +1.94.0 rustc --manifest-path rust/Cargo.toml --locked -p openpilot-uploader --bin openpilot-uploader -- -C
        link-arg=-Wl,--wrap=zmq_msg_send -C "link-arg=$UPLOADER_SIBLING_BASE/send-wrap.o" > "$UPLOADER_SIBLING_BASE/wrapped-build.stdout"
        2> "$UPLOADER_SIBLING_BASE/wrapped-build.stderr"

        cp rust/target/debug/openpilot-uploader "$UPLOADER_SIBLING_BASE/bin/uploader-send-interrupted"

        cc -std=c11 -shared -fPIC -Wall -Wextra -Werror rust/tools/fixtures/http/interrupted_read.c -o "$UPLOADER_SIBLING_BASE/bin/interrupted-read.so"
        -ldl -pthread

        '
    - name: Strict Clippy and compile grouped sibling, affected logging and ownership checks
      shell: bash
      run: 'set -euo pipefail

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-siblings-native --lib --bin check-uploader-siblings --test uploader_lifecycle_check --test uploader_logging_check
        -- -D warnings > "$UPLOADER_SIBLING_BASE/clippy.stdout" 2> "$UPLOADER_SIBLING_BASE/clippy.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-siblings-native --test uploader_lifecycle_check --no-run --message-format=json > "$UPLOADER_SIBLING_BASE/tests-build.jsonl"
        2> "$UPLOADER_SIBLING_BASE/tests-build.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-siblings-native --test uploader_logging_check --no-run --message-format=json > "$UPLOADER_SIBLING_BASE/logging-build.jsonl"
        2> "$UPLOADER_SIBLING_BASE/logging-build.stderr"

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --no-default-features --features
        uploader-siblings-native --lib --no-run --message-format=json > "$UPLOADER_SIBLING_BASE/ownership-build.jsonl" 2>
        "$UPLOADER_SIBLING_BASE/ownership-build.stderr"

        python3 "$UPLOADER_SIBLING_BASE/hosted-native-siblings.py" discover

        '
    - name: Run targeted ownership, affected logging and new native sibling scopes
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 512

        mkdir "$UPLOADER_SIBLING_BASE/runtime-path"

        ln -s /usr/bin/git "$UPLOADER_SIBLING_BASE/runtime-path/git"

        PATH="$UPLOADER_SIBLING_BASE/runtime-path" /usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/strace -f
        -e trace=execve,execveat -s 4096 -o "$UPLOADER_SIBLING_BASE/namespace-ownership.execve" "$UPLOADER_OWNERSHIP_TEST_EXE"
        uploader_logging_check::ipc::ownership::tests --test-threads=1 --nocapture > "$UPLOADER_SIBLING_BASE/namespace-ownership.stdout"
        2> "$UPLOADER_SIBLING_BASE/namespace-ownership.stderr"

        PATH="$UPLOADER_SIBLING_BASE/runtime-path" /usr/bin/timeout --signal=TERM --kill-after=10s 60s /usr/bin/strace -f
        -e trace=execve,execveat -s 4096 -o "$UPLOADER_SIBLING_BASE/permission-ownership.execve" "$UPLOADER_OWNERSHIP_TEST_EXE"
        uploader_lifecycle_check::records::ownership_tests --test-threads=1 --nocapture > "$UPLOADER_SIBLING_BASE/permission-ownership.stdout"
        2> "$UPLOADER_SIBLING_BASE/permission-ownership.stderr"

        PATH="$UPLOADER_SIBLING_BASE/runtime-path" /usr/bin/timeout --signal=TERM --kill-after=10s 180s /usr/bin/strace -f
        -e trace=execve,execveat -s 4096 -o "$UPLOADER_SIBLING_BASE/logging.execve" "$UPLOADER_LOGGING_TEST_EXE" --test-threads=1
        --nocapture > "$UPLOADER_SIBLING_BASE/logging.stdout" 2> "$UPLOADER_SIBLING_BASE/logging.stderr"

        PATH="$UPLOADER_SIBLING_BASE/runtime-path" /usr/bin/timeout --signal=TERM --kill-after=10s 900s /usr/bin/strace -f
        -e trace=execve,execveat -s 4096 -o "$UPLOADER_SIBLING_BASE/native.execve" "$UPLOADER_SIBLING_TEST_EXE" --test-threads=1
        --nocapture > "$UPLOADER_SIBLING_BASE/native.stdout" 2> "$UPLOADER_SIBLING_BASE/native.stderr"

        python3 "$UPLOADER_SIBLING_BASE/hosted-native-siblings.py" finish

        git status --porcelain=v1 > "$UPLOADER_SIBLING_BASE/source-status.after.txt"

        cmp "$UPLOADER_SIBLING_BASE/source-status.before.txt" "$UPLOADER_SIBLING_BASE/source-status.after.txt"

        '
      env:
        OPENPILOT_RUST_ROOT: ${{ github.workspace }}
        UPLOADER_ORIGINAL_LOGGING: ${{ github.workspace }}/rust/crates/dev-tools/tests/fixtures/uploader-original-group/logging-observations.json
        UPLOADER_ORIGINAL_LOGGING_SHA256: cdf42bbfebd0613cfc4896c419d96927cf410301155d3ce6b2141cb10313abba
        UPLOADER_LOGGING_CHECKER: ${{ github.workspace }}/rust/target/debug/check-uploader-logging
        UPLOADER_GROUP_PROOF: ${{ runner.temp }}/uploader-siblings-native-296/runtime
        UPLOADER_SIBLING_ORIGINAL: ${{ runner.temp }}/uploader-siblings-native-296/original/source-observations.json
        UPLOADER_SIBLING_PROOF: ${{ runner.temp }}/uploader-siblings-native-296/runtime
        UPLOADER_SIBLING_CHECKER: ${{ github.workspace }}/rust/target/debug/check-uploader-siblings
        UPLOADER_BINARY: ${{ runner.temp }}/uploader-siblings-native-296/bin/openpilot-uploader
        UPLOADER_INTERRUPTED_BINARY: ${{ runner.temp }}/uploader-siblings-native-296/bin/uploader-send-interrupted
        UPLOADER_HTTP_PROVIDER: ${{ runner.temp }}/uploader-siblings-native-296/bin/interrupted-read.so
        UPLOADER_TRACE_BINARY: ${{ github.workspace }}/rust/target/debug/examples/uploader_trace
        UPLOADER_FAULT_BINARY: ${{ github.workspace }}/rust/target/debug/examples/uploader_log_fault
        UPLOADER_COLLECTOR_BINARY: ${{ github.workspace }}/rust/target/debug/openpilot-logmessaged
    - name: Drop reproducible binaries after preserving hashes and captures
      shell: bash
      run: 'set -euo pipefail

        rm -f "$UPLOADER_SIBLING_BASE/bin/openpilot-uploader" "$UPLOADER_SIBLING_BASE/bin/uploader-send-interrupted" "$UPLOADER_SIBLING_BASE/bin/interrupted-read.so"
        "$UPLOADER_SIBLING_BASE/send-wrap.o"

        '
      if: always()
    - name: Retain every original seal and actual native request and packet
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: uploader-siblings-native-296
        path: ${{ runner.temp }}/uploader-siblings-native-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
