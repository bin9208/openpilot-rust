name: 296 native modem platform policy and disk controls
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/modem-policy-296-once.yml
permissions:
  contents: read
jobs:
  native-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: da3483724ee46ff4b826c2945d731f470506693d
        persist-credentials: false
    - name: Hosted native CI contracts and formatting
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component rustfmt

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test ci_rust_isolation --test ci_disk_bootstrap
        --test ci_workflow_policy -- --nocapture

        cargo fmt --manifest-path rust/Cargo.toml --all -- --check

        '
