    - name: Retain fresh unchanged original linked-fault and ordinary ENOTSOCK outcomes
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\"\
        \ python3 \"$RUNNER_TEMP/capture-original-driving-invocation.py\" --receipt \"$RUNNER_TEMP/driving-native-296/original-fault-invocation.json\"\
        \ -- python rust/tools/check_model_logging_faults.py \\\n  --catalog \"$RUNNER_TEMP/native-catalog\" --models \"$RUNNER_TEMP/original-models\"\
        \ \\\n  --collector rust/target/debug/openpilot-logmessaged --output \"$RUNNER_TEMP/model-logging-faults\"\n\n# Record\
        \ the original finally-block output before forcing a fresh plain link.\nsha256sum rust/target/debug/openpilot-driving-modeld\
        \ \"$RUNNER_TEMP/model-logging-faults/openpilot-driving-modeld-fault\" > \"$RUNNER_TEMP/driving-native-296/original-restore-observation.sha256\"\
        \nif cmp -s rust/target/debug/openpilot-driving-modeld \"$RUNNER_TEMP/model-logging-faults/openpilot-driving-modeld-fault\"\
        ; then\n  printf 'original-finally-output-equals-fault-ELF\\n' > \"$RUNNER_TEMP/driving-native-296/original-restore-comparison.txt\"\
        \nelse\n  printf 'original-finally-output-differs-from-fault-ELF\\n' > \"$RUNNER_TEMP/driving-native-296/original-restore-comparison.txt\"\
        \nfi\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo clean --manifest-path rust/Cargo.toml\
        \ -p openpilot-driving-modeld\ncargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --bin openpilot-driving-modeld\
        \ --locked\ncp rust/target/debug/openpilot-driving-modeld \"$RUNNER_TEMP/driving-native-296/plain-restored.elf\"\n\
        git status --porcelain --untracked-files=normal > \"$RUNNER_TEMP/driving-native-296/plain-input-status-restored.txt\"\
        \nsha256sum -c \"$RUNNER_TEMP/driving-native-296/plain-before.sha256\"\n"
    - name: Retain fresh unchanged original six-scenario collector outcomes
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\"\
        \ python3 \"$RUNNER_TEMP/capture-original-driving-invocation.py\" --receipt \"$RUNNER_TEMP/driving-native-296/original-driving-invocation.json\"\
        \ -- python rust/tools/check_driving_daemon.py \\\n  --binary rust/target/debug/openpilot-driving-modeld --collector\
        \ rust/target/debug/openpilot-logmessaged \\\n  --catalog \"$RUNNER_TEMP/native-catalog\" --models \"$RUNNER_TEMP/original-models\"\
        \ --output \"$RUNNER_TEMP/driving-daemon\"\n"
    - name: Merge actual successful original invocations with captured CLI admissions
      run: "set -euo pipefail\npython3 \"$RUNNER_TEMP/driving-cli-admission.py\" --merge-success \\\n  --repo \"$GITHUB_WORKSPACE\"\
        \ \\\n  --proof \"$RUNNER_TEMP/driving-native-296/cli-original\" \\\n  --models \"$RUNNER_TEMP/original-models\" \\\
        \n  --catalog \"$RUNNER_TEMP/native-catalog\" \\\n  --driving-success \"$RUNNER_TEMP/driving-daemon\" \\\n  --fault-success\
        \ \"$RUNNER_TEMP/model-logging-faults\" \\\n  --driving-success-record \"$RUNNER_TEMP/driving-native-296/original-driving-invocation.json\"\
        \ \\\n  --fault-success-record \"$RUNNER_TEMP/driving-native-296/original-fault-invocation.json\"\n"
    - name: Require native six-scenario real IPC against complete independent original inputs
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_daemon_check
        --locked -- --nocapture 2>&1 | tee "$proof/live-tests.log"

        '
    - name: Require native live collector and all source logging assertions over six scenarios
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        export DRIVING_DAEMON_PEER="$DRIVING_DAEMON_OUTPUT/driving-daemon-peer"

        export DRIVING_DAEMON_COLLECTOR="$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged"

        export DRIVING_LOGGING_OUTPUT="$proof/logging-native"

        printf ''DRIVING_DAEMON_PEER=%s\nDRIVING_DAEMON_COLLECTOR=%s\n'' "$DRIVING_DAEMON_PEER" "$DRIVING_DAEMON_COLLECTOR"
        >> "$GITHUB_ENV"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_logging_check
        --locked -- --nocapture 2>&1 | tee "$proof/logging-tests.log"

        sha256sum -c "$proof/plain-before.sha256"

        '
    - name: Require native both linked faults with same unchanged wrapped ELF and real collector
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        export DRIVING_LOGGING_FAULT_BINARY="$RUNNER_TEMP/model-logging-faults/openpilot-driving-modeld-fault"

        export DRIVING_LOGGING_FAULT_OUTPUT="$proof/fault-native"

        sha256sum "$DRIVING_LOGGING_FAULT_BINARY" "$DRIVING_DAEMON_PEER" "$DRIVING_DAEMON_COLLECTOR" rust/tools/model_logging_fault.cc
        > "$proof/fault-inputs.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_logging_fault_check
        --locked -- --nocapture 2>&1 | tee "$proof/fault-tests.log"

        sha256sum -c "$proof/fault-inputs.sha256"

        sha256sum -c "$proof/plain-before.sha256"

        '
    - name: Require native isolated fault builder and same runtime comparisons
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 13312

        sha256sum "$DRIVING_DAEMON_NATIVE_BINARY" "$DRIVING_DAEMON_PEER" "$DRIVING_DAEMON_COLLECTOR" > "$proof/builder-production-inputs.sha256"

        rust/target/debug/build-driving-logging-fault --root "$GITHUB_WORKSPACE" --output "$proof/fault-builder" --cargo "$(command
        -v cargo)" --compiler "$(command -v c++)" 2>&1 | tee "$proof/fault-builder.log"

        sha256sum -c "$proof/builder-production-inputs.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 512

        cp "$proof/fault-builder/target/debug/openpilot-driving-modeld" "$proof/fault-builder/plain-restored.elf"

        export DRIVING_LOGGING_FAULT_BINARY="$proof/fault-builder/openpilot-driving-modeld-fault"

        export DRIVING_LOGGING_FAULT_OUTPUT="$proof/fault-native-built"

        sha256sum "$DRIVING_LOGGING_FAULT_BINARY" rust/tools/model_logging_fault.cc > "$proof/built-fault-inputs.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_logging_fault_check
        --locked -- --nocapture 2>&1 | tee "$proof/fault-native-built-tests.log"

        sha256sum -c "$proof/built-fault-inputs.sha256"

        sha256sum -c "$proof/builder-production-inputs.sha256"

        '
    - name: Require identical current native ELFs in checkout and three-source-absent private root
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        export DRIVING_RETIREMENT_OUTPUT="$proof/retirement"

        export DRIVING_RETIREMENT_EXPECT_ABSENT=0

        export DRIVING_LOGGING_FAULT_BINARY="$proof/fault-builder/openpilot-driving-modeld-fault"

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 3072

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_daemon_retirement
        --locked -- --nocapture 2>&1 | tee "$proof/retirement-tests.log"

        rust/target/debug/seal-driving-daemon-fixture --output "$DRIVING_FIXTURE_DIRECTORY" --verify-sha "$DRIVING_FIXTURE_MANIFEST_SHA256"
        > "$proof/fixture-verify-after.json"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driving-native-independent-296
        path: '${{ runner.temp }}/driving-native-296/

          ${{ runner.temp }}/native-catalog/current.json

          ${{ runner.temp }}/driving-daemon/

          ${{ runner.temp }}/model-logging-faults/

          !${{ runner.temp }}/driving-native-296/fault-builder/target/**

          '
        if-no-files-found: error
