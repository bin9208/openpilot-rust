        printf ''DRIVING_FIXTURE_DIRECTORY=%s/complete-fixture\nDRIVING_FIXTURE_MANIFEST_SHA256=%s\nDRIVING_DAEMON_CATALOG=%s/complete-fixture/catalog\nDRIVING_ORIGINAL_OBSERVATION=%s/complete-fixture/observations\n''
        "$proof" "$fixture_sha" "$proof" "$proof" >> "$GITHUB_ENV"

