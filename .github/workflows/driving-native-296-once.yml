name: 296 native driving complete collector and linked fault independent parity
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driving-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  driving-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: e25a14386582858dae25c6daca5ced3bfb4bacab
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DRIVING_ORIGINAL_MANIFEST_SHA256: 2e7d343e34e06b1a7e998c31aca7c8ec193fbe49e63b30b2739f73c0934c565b
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: e25a14386582858dae25c6daca5ced3bfb4bacab
    - name: Require exact source and hosted controller prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        mkdir -p "$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 git-lfs capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Require real SIGUSR2 EINTR regression to fail on original line wait
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driving-native-296\"\nleaf=rust/crates/dev-tools/src/driving_daemon_check.rs\n\
        cp \"$leaf\" \"$proof/eintr-fixed.rs\"\ntrap 'cp \"$proof/eintr-fixed.rs\" \"$leaf\"' EXIT\nrust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 256\ngit fetch --no-tags --depth=1 origin 41ed952f4507a7f6727529565933ce75fca241e5\n\
        python3 - <<'PY_RED'\nfrom pathlib import Path\nimport os,subprocess,hashlib\nleaf=Path('rust/crates/dev-tools/src/driving_daemon_check.rs')\n\
        proof=Path(os.environ['RUNNER_TEMP'])/'driving-native-296'\nfixed=leaf.read_text()\nold=subprocess.check_output(['git','show','41ed952f4507a7f6727529565933ce75fca241e5:rust/crates/dev-tools/src/driving_daemon_check.rs']).decode()\n\
        def method(text):\n    anchor='impl Lines {\\n'\n    signature='    fn until(&mut self, tokens: &[&str], signals:\
        \ &Signals) -> Result<String> {\\n'\n    assert text.count(anchor)==1 and text.count(signature)==1\n    start=text.index(signature,text.index(anchor)+len(anchor))\n\
        \    # Rustfmt indents this method's closing brace four spaces and the\n    # enclosing impl closing brace zero; nested\
        \ blocks are deeper.\n    boundary='\\n    }\\n}'\n    end=text.index(boundary,start)+len('\\n    }')\n    value=text[start:end]\n\
        \    assert value.count(signature)==1 and value.endswith('\\n    }')\n    return start,end,value\nstart,end,current_method=method(fixed)\n\
        _,_,old_method=method(old)\nassert 'Err(rustix::io::Errno::INTR) => continue' in current_method\nassert 'Err(rustix::io::Errno::INTR)\
        \ => continue' not in old_method\nassert 'const LINE_WAIT: Duration = Duration::from_secs(60);' in fixed\nassert 'signals.check()?;'\
        \ in old_method\nmarker='    fn msgq_notification_signals_do_not_abort_a_child_line_wait()'\nassert fixed.count(marker)==1\n\
        red=fixed[:start]+old_method+fixed[end:]\nassert red[:start]==fixed[:start] and red[start+len(old_method):]==fixed[end:]\n\
        leaf.write_text(red)\n(proof/'eintr-current-with-old-until.rs').write_text(red)\n(proof/'eintr-red-source.json').write_text(__import__('json').dumps({'baseline':'41ed952f4507a7f6727529565933ce75fca241e5','scope':'only\
        \ historical Lines::until method in current source; current regression and interfaces unchanged','baseline_method_sha256':hashlib.sha256(old_method.encode()).hexdigest(),'fixed_method_sha256':hashlib.sha256(current_method.encode()).hexdigest(),'fixed_sha256':hashlib.sha256(fixed.encode()).hexdigest(),'controlled_source_sha256':hashlib.sha256(red.encode()).hexdigest()},indent=2)+'\\\
        n')\nPY_RED\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 1024\nset +e\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_daemon_check::line_tests::msgq_notification_signals_do_not_abort_a_child_line_wait\
        \ --locked -- --exact --nocapture 2>&1 | tee \"$proof/eintr-red.log\"\nred_status=${PIPESTATUS[0]}\nset -e\nprintf\
        \ '%s\\n' \"$red_status\" > \"$proof/eintr-red.status\"\ntest \"$red_status\" = 101\ngrep -F 'Interrupted system call'\
        \ \"$proof/eintr-red.log\"\ngrep -F 'test result: FAILED. 0 passed; 1 failed;' \"$proof/eintr-red.log\"\ncp \"$proof/eintr-fixed.rs\"\
        \ \"$leaf\"\ntrap - EXIT\ncmp \"$leaf\" \"$proof/eintr-fixed.rs\"\ngit diff --exit-code -- \"$leaf\"\n"
    - name: Require controlled missing rollback to fail late reappearance regression
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        leaf=rust/crates/dev-tools/src/driving_daemon_check/finalization.rs

        cp "$leaf" "$proof/finalization-fixed.rs"

        trap ''cp "$proof/finalization-fixed.rs" "$leaf"'' EXIT

        python3 - <<''PY_ROLLBACK_RED''

        from pathlib import Path

        import hashlib,json,os

        leaf=Path(''rust/crates/dev-tools/src/driving_daemon_check/finalization.rs'')

        proof=Path(os.environ[''RUNNER_TEMP''])/''driving-native-296''

        fixed=leaf.read_bytes()

        marker=b''if self.accepted.get() {''

        assert fixed.count(marker)==1

        # Controlled pre-fix behavior, NOT an exact historical source graft:

        # only suppress the new guard''s Drop cleanup; leave publication and

        # its real source-absence checks and regression unchanged.

        red=fixed.replace(marker,b''if self.accepted.get() || std::hint::black_box(true) {'')

        leaf.write_bytes(red)

        (proof/''finalization-controlled-no-rollback.rs'').write_bytes(red)

        (proof/''finalization-controlled-red-source.json'').write_text(json.dumps({''kind'':''controlled pre-fix behavior,
        not exact historical source'',''change'':''disable only OwnedReport Drop cleanup'',''fixed_sha256'':hashlib.sha256(fixed).hexdigest(),''controlled_sha256'':hashlib.sha256(red).hexdigest()},indent=2)+''\n'')

        PY_ROLLBACK_RED

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        set +e

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_daemon_check::finalization::tests::late_retired_source_and_cancellation_leave_no_owned_pass_or_stdout
        --locked -- --exact --nocapture 2>&1 | tee "$proof/finalization-controlled-red.log"

        red_status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$red_status" > "$proof/finalization-controlled-red.status"

        test "$red_status" = 101

        grep -F ''assertion failed: !root.path().join("report.json").exists()'' "$proof/finalization-controlled-red.log"

        grep -F ''test result: FAILED. 0 passed; 1 failed;'' "$proof/finalization-controlled-red.log"

        cp "$proof/finalization-fixed.rs" "$leaf"

        trap - EXIT

        cmp "$leaf" "$proof/finalization-fixed.rs"

        git diff --exit-code -- "$leaf"

        '
    - name: Provide sealed cloud original invocation and CLI admission capture scripts
      run: 'set -euo pipefail

        python3 - <<''PY_SCRIPTS''

        import base64,hashlib,os

        from pathlib import Path

        root=Path(os.environ["RUNNER_TEMP"])

        data=base64.b64decode('''',validate=True)

        assert hashlib.sha256(data).hexdigest()==''06091fdbc2df806a39e3f3c865ff161ba7c161f774c93781004d077d21d693ab''

        (root/''capture-original-driving-invocation.py'').write_bytes(data)

        data=base64.b64decode('''',validate=True)

        assert hashlib.sha256(data).hexdigest()==''619c696e6934f6ad1493405300d1d74f00ceb056505fbb6516b2c06a0ec0a590''

        (root/''driving-cli-admission.py'').write_bytes(data)

        PY_SCRIPTS

        '
    - name: Compile and strictly check the native controller before model preparation
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --bin check-driving-daemon
        --bin check-model-logging-faults --bin build-driving-logging-fault --bin seal-driving-daemon-fixture --locked 2>&1
        | tee "$proof/controller-build.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib --bin check-driving-daemon
        --bin check-model-logging-faults --bin build-driving-logging-fault --bin seal-driving-daemon-fixture --test driving_daemon_reference
        --test driving_daemon_check --test driving_logging_check --test driving_logging_fault_check --test driving_daemon_retirement
        --locked -- -D warnings 2>&1 | tee "$proof/controller-clippy.log"


        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_daemon_check::
        --locked -- --nocapture 2>&1 | tee "$proof/line-regression.log"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_logging_check::queue_readiness_tests
        --locked -- --nocapture


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_logging_fault_build::tests
        --locked -- --nocapture 2>&1 | tee "$proof/fault-builder-unit.log"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_logging_check::driver_finish_tests
        --locked -- --nocapture 2>&1 | tee "$proof/driver-finish-unit.log"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_daemon_reference::fixture::tests
        --locked -- --nocapture 2>&1 | tee "$proof/fixture-unit.log"

        '
    - name: Fetch only independently sealed original observation data
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driving-native-296\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 1024\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12327097515/zip > \"$proof/original.zip\"\
        \nprintf '%s  %s\n' '348d7760bedf71c1ccf02b66019c5d428452d796b246ef167f525183afb59986' \"$proof/original.zip\" | sha256sum\
        \ -c -\npython3 - <<'PY_DATA'\nfrom pathlib import Path\nimport zipfile,hashlib,json,os\nproof=Path(os.environ['RUNNER_TEMP'])/'driving-native-296';out=proof/'original-observation';out.mkdir()\n\
        with zipfile.ZipFile(proof/'original.zip')as z:\n assert z.testzip()is None\n mname=next(n for n in z.namelist()if\
        \ n.endswith('/observations/manifest.json')or n=='observations/manifest.json');raw=z.read(mname)\n assert hashlib.sha256(raw).hexdigest()==os.environ['DRIVING_ORIGINAL_MANIFEST_SHA256'];m=json.loads(raw);prefix=mname[:-len('manifest.json')]\n\
        \ assert m['checked_out_commit']=='ec95aec6bd81a5f718fb2cac54a443d9a61e426c' and len(m['files'])==1069\n total=0\n\
        \ for name,pin in m['files'].items():\n  p=Path(name);assert not p.is_absolute() and p.parts and all(x not in('.','..')for\
        \ x in p.parts)\n  data=z.read(prefix+name);assert len(data)==pin['bytes'] and hashlib.sha256(data).hexdigest()==pin['sha256'];total+=len(data);assert\
        \ total<=512000000\n  dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)\n (out/'manifest.json').write_bytes(raw)\n\
        print('PASS accepted original-only data extracted; no Python source copied')\nPY_DATA\nprintf 'DRIVING_ORIGINAL_OBSERVATION=%s/original-observation\n\
        DRIVING_DAEMON_NATIVE_BINARY=%s/rust/target/debug/openpilot-driving-modeld\nDRIVING_DAEMON_CATALOG=%s/native-catalog\n\
        DRIVING_DAEMON_OUTPUT=%s/live\nDRIVING_DAEMON_ROOT=%s\n' \"$proof\" \"$GITHUB_WORKSPACE\" \"$RUNNER_TEMP\" \"$proof\"\
        \ \"$GITHUB_WORKSPACE\" >> \"$GITHUB_ENV\"\n"
    - name: Require all114 independently captured publication projections and mutation controls
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_daemon_reference
        --locked -- --nocapture 2>&1 | tee "$proof/reference-tests.log"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bins --locked'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --locked'
    - name: Build unchanged original IPC imports for live comparison
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python"'
    - name: Capture every original CLI admission before expensive model compilation
      run: "set -euo pipefail\npython3 \"$RUNNER_TEMP/driving-cli-admission.py\" --capture-only \\\n  --repo \"$GITHUB_WORKSPACE\"\
        \ --proof \"$RUNNER_TEMP/driving-native-296/cli-original\" \\\n  --models \"$RUNNER_TEMP/original-models\" --catalog\
        \ \"$RUNNER_TEMP/native-catalog\"\n"
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude='''''
    - name: Compile the original grouped driving and driver artifacts
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nmkdir -p \"$RUNNER_TEMP/original-models\"\
        \npython openpilot/selfdrive/modeld/compile_modeld.py --model-size 512x256 --camera-resolutions 1928x1208 1344x760\
        \ --frame-skip 4 --onnx openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output \"$RUNNER_TEMP/original-models/driving_tinygrad.pkl\"\
        \npython tinygrad_repo/examples/openpilot/compile3.py \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\"\
        \ \"$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl\"\npython openpilot/selfdrive/modeld/get_model_metadata.py\
        \ openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\ncp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl\
        \ \"$RUNNER_TEMP/original-models/\"\nfor resolution in 1928x1208 1344x760; do\n  python openpilot/selfdrive/modeld/compile_dm_warp.py\
        \ --camera-resolution \"$resolution\" --warp-to 1440x960 --output \"$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl\"\
        \ndone\n"
    - name: Build and validate immutable native pipeline catalog
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python rust/tools/build_model_pipelines.py --trusted-model-directory "$RUNNER_TEMP/original-models" --backend cpu
        --output "$RUNNER_TEMP/native-catalog"

        rust/target/debug/model-run --check-catalog "$RUNNER_TEMP/native-catalog"

        '
    - name: Capture exact independent original outputs for this compiled model
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driving-native-296\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 1024\npython3 - <<'PY_CAPTURE'\nimport hashlib,json,os\nfrom pathlib import Path\nimport zipfile\n\
        proof=Path(os.environ['RUNNER_TEMP'])/'driving-native-296'\nwith zipfile.ZipFile(proof/'original.zip') as z:\n  names=[n\
        \ for n in z.namelist() if n.endswith('original_only.py')]\n  assert len(names)==1\n  script=z.read(names[0])\nassert\
        \ hashlib.sha256(script).hexdigest()=='bfe55536e9bf47cda093d9986247cf338f978c3c82b0cc6e1000731008697206'\n(proof/'original_only.py').write_bytes(script)\n\
        PY_CAPTURE\npython3 \"$proof/original_only.py\" --repo \"$GITHUB_WORKSPACE\" \\\n  --models \"$RUNNER_TEMP/original-models\"\
        \ --output \"$proof/fresh-original-observation\" \\\n  > \"$proof/fresh-original.stdout\" 2> \"$proof/fresh-original.stderr\"\
        \npython3 - <<'PY_SEAL'\nimport hashlib,json,os\nfrom pathlib import Path\nproof=Path(os.environ['RUNNER_TEMP'])/'driving-native-296'\n\
        directory=proof/'fresh-original-observation';raw=(directory/'manifest.json').read_bytes();m=json.loads(raw)\nassert\
        \ m['checked_out_commit']==os.environ['EXPECTED_SOURCE']\nassert len(m['files'])==1069 and len(m['scenarios'])==6\n\
        assert m['script_sha256']=='bfe55536e9bf47cda093d9986247cf338f978c3c82b0cc6e1000731008697206'\nassert m['scope']=='original-only,\
        \ no candidate or native daemon process'\nmodel=Path(os.environ['RUNNER_TEMP'])/'original-models/driving_tinygrad.pkl'\n\
        assert hashlib.sha256(model.read_bytes()).hexdigest()==m['model']['sha256']\ncatalog=Path(os.environ['RUNNER_TEMP'])/'native-catalog'\n\
        pointer=json.loads((catalog/'current.json').read_text())\nfor camera in ('1344x760','1928x1208'):\n  descriptor=json.loads((catalog/pointer['generation']/('driving-'+camera)/'pipeline.json').read_text())\n\
        \  assert descriptor['sources']['driving']==m['model']['sha256']\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n\
        \  f.write('DRIVING_ORIGINAL_OBSERVATION='+str(directory)+'\\n')\n  f.write('DRIVING_ORIGINAL_MANIFEST_SHA256='+hashlib.sha256(raw).hexdigest()+'\\\
        n')\nPY_SEAL\n"
    - name: Require fresh original packet projections and mutation controls
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_daemon_reference
        --locked -- --nocapture

