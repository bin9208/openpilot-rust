name: 296 native driving complete collector and linked fault independent parity
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driving-native-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  driving-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: 96949ecead1b5d377f8b3302680d0191d7cdb6ea
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DRIVING_ORIGINAL_MANIFEST_SHA256: 2e7d343e34e06b1a7e998c31aca7c8ec193fbe49e63b30b2739f73c0934c565b
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 96949ecead1b5d377f8b3302680d0191d7cdb6ea
    - name: Require exact source and hosted controller prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        mkdir -p "$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 git-lfs capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Compile and strictly check the native controller before model preparation
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --bin check-driving-daemon
        --bin check-model-logging-faults --bin build-driving-logging-fault --locked 2>&1 | tee "$proof/controller-build.log"

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib --bin check-driving-daemon
        --bin check-model-logging-faults --bin build-driving-logging-fault --test driving_daemon_reference --test driving_daemon_check
        --test driving_logging_check --test driving_logging_fault_check --locked -- -D warnings 2>&1 | tee "$proof/controller-clippy.log"


        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_daemon_check::line_tests
        --locked -- --nocapture 2>&1 | tee "$proof/line-regression.log"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_logging_check::queue_readiness_tests
        --locked -- --nocapture


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 256

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --lib driving_logging_fault_build::tests
        --locked -- --nocapture 2>&1 | tee "$proof/fault-builder-unit.log"

        '
    - name: Fetch only independently sealed original observation data
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driving-native-296\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 1024\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12327097515/zip > \"$proof/original.zip\"\
        \nprintf '%s  %s\n' '348d7760bedf71c1ccf02b66019c5d428452d796b246ef167f525183afb59986' \"$proof/original.zip\" | sha256sum\
        \ -c -\npython3 - <<'PY_DATA'\nfrom pathlib import Path\nimport zipfile,hashlib,json,os\nproof=Path(os.environ['RUNNER_TEMP'])/'driving-native-296';out=proof/'original-observation';out.mkdir()\n\
        with zipfile.ZipFile(proof/'original.zip')as z:\n assert z.testzip()is None\n mname=next(n for n in z.namelist()if\
        \ n.endswith('/observations/manifest.json')or n=='observations/manifest.json');raw=z.read(mname)\n assert hashlib.sha256(raw).hexdigest()==os.environ['DRIVING_ORIGINAL_MANIFEST_SHA256'];m=json.loads(raw);prefix=mname[:-len('manifest.json')]\n\
        \ assert m['checked_out_commit']=='ec95aec6bd81a5f718fb2cac54a443d9a61e426c' and len(m['files'])==1069\n total=0\n\
        \ for name,pin in m['files'].items():\n  p=Path(name);assert not p.is_absolute() and p.parts and all(x not in('.','..')for\
        \ x in p.parts)\n  data=z.read(prefix+name);assert len(data)==pin['bytes'] and hashlib.sha256(data).hexdigest()==pin['sha256'];total+=len(data);assert\
        \ total<=512000000\n  dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)\n (out/'manifest.json').write_bytes(raw)\n\
        print('PASS accepted original-only data extracted; no Python source copied')\nPY_DATA\nprintf 'DRIVING_ORIGINAL_OBSERVATION=%s/original-observation\n\
        DRIVING_DAEMON_NATIVE_BINARY=%s/rust/target/debug/openpilot-driving-modeld\nDRIVING_DAEMON_CATALOG=%s/native-catalog\n\
        DRIVING_DAEMON_OUTPUT=%s/live\nDRIVING_DAEMON_ROOT=%s\n' \"$proof\" \"$GITHUB_WORKSPACE\" \"$RUNNER_TEMP\" \"$proof\"\
        \ \"$GITHUB_WORKSPACE\" >> \"$GITHUB_ENV\"\n"
    - name: Require all114 independently captured publication projections and mutation controls
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_daemon_reference
        --locked -- --nocapture 2>&1 | tee "$proof/reference-tests.log"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bins --locked'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --locked'
    - name: Build unchanged original IPC imports for live comparison
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python"'
    - run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude='''''
    - name: Compile the original grouped driving and driver artifacts
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nmkdir -p \"$RUNNER_TEMP/original-models\"\
        \npython openpilot/selfdrive/modeld/compile_modeld.py --model-size 512x256 --camera-resolutions 1928x1208 1344x760\
        \ --frame-skip 4 --onnx openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output \"$RUNNER_TEMP/original-models/driving_tinygrad.pkl\"\
        \npython tinygrad_repo/examples/openpilot/compile3.py \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\"\
        \ \"$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl\"\npython openpilot/selfdrive/modeld/get_model_metadata.py\
        \ openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\ncp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl\
        \ \"$RUNNER_TEMP/original-models/\"\nfor resolution in 1928x1208 1344x760; do\n  python openpilot/selfdrive/modeld/compile_dm_warp.py\
        \ --camera-resolution \"$resolution\" --warp-to 1440x960 --output \"$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl\"\
        \ndone\n"
    - name: Build and validate immutable native pipeline catalog
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python rust/tools/build_model_pipelines.py --trusted-model-directory "$RUNNER_TEMP/original-models" --backend cpu
        --output "$RUNNER_TEMP/native-catalog"

        rust/target/debug/model-run --check-catalog "$RUNNER_TEMP/native-catalog"

        '
    - name: Build actual logging collector and seal the ordinary production ELF
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-logmessaged --bins --locked 2>&1 | tee "$proof/collector-build.log"

        # Initial modeld was linked before model and Python binding preparation.

        # Bind both fresh plain links only after that source/build-metadata state is stable.

        git status --porcelain --untracked-files=normal > "$proof/plain-input-status-before.txt"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo clean --manifest-path rust/Cargo.toml -p openpilot-driving-modeld

        cargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --bin openpilot-driving-modeld --locked 2>&1
        | tee "$proof/plain-first-build.log"

        cp rust/target/debug/openpilot-driving-modeld "$proof/plain-first.elf"

        sha256sum rust/target/debug/openpilot-driving-modeld > "$proof/plain-before.sha256"

        git status --porcelain --untracked-files=normal > "$proof/plain-input-status-first.txt"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo clean --manifest-path rust/Cargo.toml -p openpilot-driving-modeld

        cargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --bin openpilot-driving-modeld --locked 2>&1
        | tee "$proof/plain-repeat-build.log"

        cp rust/target/debug/openpilot-driving-modeld "$proof/plain-repeat.elf"

        sha256sum -c "$proof/plain-before.sha256"

        git status --porcelain --untracked-files=normal > "$proof/plain-input-status-repeat.txt"

        find rust/target/debug/build -path ''*/openpilot-logging-*/output'' -exec sh -c ''for p do printf "%s\n" "$p"; cat
        "$p"; done'' sh {} + > "$proof/plain-logging-build-outputs.txt"

        '
    - name: Retain fresh unchanged original linked-fault and ordinary ENOTSOCK outcomes
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\"\
        \ python rust/tools/check_model_logging_faults.py \\\n  --catalog \"$RUNNER_TEMP/native-catalog\" --models \"$RUNNER_TEMP/original-models\"\
        \ \\\n  --collector rust/target/debug/openpilot-logmessaged --output \"$RUNNER_TEMP/model-logging-faults\"\n\n# Record\
        \ the original finally-block output before forcing a fresh plain link.\nsha256sum rust/target/debug/openpilot-driving-modeld\
        \ \"$RUNNER_TEMP/model-logging-faults/openpilot-driving-modeld-fault\" > \"$RUNNER_TEMP/driving-native-296/original-restore-observation.sha256\"\
        \nif cmp -s rust/target/debug/openpilot-driving-modeld \"$RUNNER_TEMP/model-logging-faults/openpilot-driving-modeld-fault\"\
        ; then\n  printf 'original-finally-output-equals-fault-ELF\\n' > \"$RUNNER_TEMP/driving-native-296/original-restore-comparison.txt\"\
        \nelse\n  printf 'original-finally-output-differs-from-fault-ELF\\n' > \"$RUNNER_TEMP/driving-native-296/original-restore-comparison.txt\"\
        \nfi\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo clean --manifest-path rust/Cargo.toml\
        \ -p openpilot-driving-modeld\ncargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --bin openpilot-driving-modeld\
        \ --locked\ncp rust/target/debug/openpilot-driving-modeld \"$RUNNER_TEMP/driving-native-296/plain-restored.elf\"\n\
        git status --porcelain --untracked-files=normal > \"$RUNNER_TEMP/driving-native-296/plain-input-status-restored.txt\"\
        \nsha256sum -c \"$RUNNER_TEMP/driving-native-296/plain-before.sha256\"\n"
    - name: Retain fresh unchanged original six-scenario collector outcomes
      run: "set -euo pipefail\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\"\
        \ python rust/tools/check_driving_daemon.py \\\n  --binary rust/target/debug/openpilot-driving-modeld --collector\
        \ rust/target/debug/openpilot-logmessaged \\\n  --catalog \"$RUNNER_TEMP/native-catalog\" --models \"$RUNNER_TEMP/original-models\"\
        \ --output \"$RUNNER_TEMP/driving-daemon\"\n"
    - name: Require native six-scenario real IPC against complete independent original inputs
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_daemon_check
        --locked -- --nocapture 2>&1 | tee "$proof/live-tests.log"

        '
    - name: Require native live collector and all source logging assertions over six scenarios
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        export DRIVING_DAEMON_PEER="$DRIVING_DAEMON_OUTPUT/driving-daemon-peer"

        export DRIVING_DAEMON_COLLECTOR="$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged"

        export DRIVING_LOGGING_OUTPUT="$proof/logging-native"

        printf ''DRIVING_DAEMON_PEER=%s\nDRIVING_DAEMON_COLLECTOR=%s\n'' "$DRIVING_DAEMON_PEER" "$DRIVING_DAEMON_COLLECTOR"
        >> "$GITHUB_ENV"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_logging_check
        --locked -- --nocapture 2>&1 | tee "$proof/logging-tests.log"

        sha256sum -c "$proof/plain-before.sha256"

        '
    - name: Require native both linked faults with same unchanged wrapped ELF and real collector
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        export DRIVING_LOGGING_FAULT_BINARY="$RUNNER_TEMP/model-logging-faults/openpilot-driving-modeld-fault"

        export DRIVING_LOGGING_FAULT_OUTPUT="$proof/fault-native"

        sha256sum "$DRIVING_LOGGING_FAULT_BINARY" "$DRIVING_DAEMON_PEER" "$DRIVING_DAEMON_COLLECTOR" rust/tools/model_logging_fault.cc
        > "$proof/fault-inputs.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_logging_fault_check
        --locked -- --nocapture 2>&1 | tee "$proof/fault-tests.log"

        sha256sum -c "$proof/fault-inputs.sha256"

        sha256sum -c "$proof/plain-before.sha256"

        '
    - name: Require native isolated fault builder and same runtime comparisons
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driving-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 13312

        sha256sum "$DRIVING_DAEMON_NATIVE_BINARY" "$DRIVING_DAEMON_PEER" "$DRIVING_DAEMON_COLLECTOR" > "$proof/builder-production-inputs.sha256"

        rust/target/debug/build-driving-logging-fault --root "$GITHUB_WORKSPACE" --output "$proof/fault-builder" --cargo "$(command
        -v cargo)" --compiler "$(command -v c++)" 2>&1 | tee "$proof/fault-builder.log"

        sha256sum -c "$proof/builder-production-inputs.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 512

        cp "$proof/fault-builder/target/debug/openpilot-driving-modeld" "$proof/fault-builder/plain-restored.elf"

        export DRIVING_LOGGING_FAULT_BINARY="$proof/fault-builder/openpilot-driving-modeld-fault"

        export DRIVING_LOGGING_FAULT_OUTPUT="$proof/fault-native-built"

        sha256sum "$DRIVING_LOGGING_FAULT_BINARY" rust/tools/model_logging_fault.cc > "$proof/built-fault-inputs.sha256"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driving-daemon-native --test driving_logging_fault_check
        --locked -- --nocapture 2>&1 | tee "$proof/fault-native-built-tests.log"

        sha256sum -c "$proof/built-fault-inputs.sha256"

        sha256sum -c "$proof/builder-production-inputs.sha256"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driving-native-independent-296
        path: '${{ runner.temp }}/driving-native-296/

          ${{ runner.temp }}/native-catalog/current.json

          ${{ runner.temp }}/driving-daemon/

          ${{ runner.temp }}/model-logging-faults/

          !${{ runner.temp }}/driving-native-296/fault-builder/target/**

          '
        if-no-files-found: error
