name: One-time original prefix93 pinned znver3 stages
on:
  push:
    branches: [codex/feat-296-node280-original-capture]
    paths: [.github/workflows/prefix93-znver3-stage-once.yml]
jobs:
  original-prefix93-znver3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve 25 GiB plus 3 GiB
        run: "$GITHUB_WORKSPACE/rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 3072"
      - name: Install pinned LLVM18 provider and numpy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libllvm18
          python -m pip install numpy==2.5.3
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 3072
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/llvm18.deb" 'https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb'
          printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm18.deb" "$RUNNER_TEMP/llvm18-captured"
          printf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
      - name: Fetch sealed original owners and Gelu92 receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-prefix93-znver3"
          mkdir -p "$capture_dir/fused" "$capture_dir/gelu"
          gh run download 39488465388 --repo bin9208/openpilot-rust --name prefix93-original-owners-0c2d4d0806b6c802f81dcfb52066c20451ea6ba8 --dir "$capture_dir/fused"
          gh run download 39496577925 --repo bin9208/openpilot-rust --name prefix93-original-kernel-diagnostic-b3836e6f34b2cea136d6ef8d3cc426b05822aa7a --dir "$capture_dir/gelu"
      - name: Stage transparent original-only driver
        shell: bash
        run: |
          set -euo pipefail
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-prefix93-znver3"
          cat > "$capture_dir/trace.py" <<'PINNED_PREFIX93_DRIVER'
          """Original-only prefix93/Gelu92 replay with an explicit LLVM18 znver3 target."""
          import ctypes
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          BASE = ROOT / ".analysis/scratch/2026-10-21-prefix93-znver3"
          FUSED = BASE / "fused/capture"
          GELU = BASE / "gelu/diagnostic"
          OUT = BASE / "result"
          OUT.mkdir()
          sha = lambda value: hashlib.sha256(value).hexdigest()

          def sealed(path, expected):
              raw = path.read_bytes()
              assert sha(raw) == expected, str(path)
              return raw

          assert os.environ["DEV"] == "CPU:LLVM" and os.environ["CPU_COUNT"] == "16"
          assert os.environ["CACHELEVEL"] == "0" and os.environ["CCACHE"] == "0"
          assert all(os.environ[key] == "1" for key in ("IMAGE", "FLOAT16", "NOLOCALS", "OPENPILOT_HACKS"))
          fused_receipt = json.loads(sealed(FUSED / "receipt.json",
              "e3152225d774365df1eedecc4565a5d73a0e061b589149847d70ffe27766f3cc"))
          gelu_receipt = json.loads(sealed(GELU / "pre-gelu-receipt.json",
              "b356ea7b22f613bab7e208fc7c9b36aae3fd7cf9cf0a257e653b03d74a11a352"))
          assert len(fused_receipt["source_sha256"]) == 18
          for path, value in fused_receipt["source_sha256"].items():
              sealed(ROOT / path, value)
          provider_sha = "5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0"
          sealed(Path(os.environ["LLVM_PATH"]), provider_sha)
          fused_key = "7ce852371c1860e4449e1da40e566f32f8485f6e6974ccfa9b4600bc31191020"
          gelu_key = "f2c45130cd720e831837744139a88264c8bdc174c25be8603b7e36356e559585"
          fused_ir = sealed(FUSED / f"{fused_key}.ll", fused_key)
          gelu_ir = sealed(GELU / f"prefix92-{gelu_key}.ll", gelu_key)
          fused_original_object_sha = "e93d6b49c1bd264ce9ad09d52aa2df3076bf2d347ba04ff51f11e486cd48b13a"
          gelu_original_object_sha = "180e40bedd4fe707fc668f24404452177416b0d8f9b91eaf192f571b24fdb364"
          sealed(FUSED / f"{fused_key}.objbin", fused_original_object_sha)
          sealed(GELU / f"prefix92-{gelu_key}.objbin", gelu_original_object_sha)
          fused_owners = [sealed(FUSED / fused_receipt["boundaries"]["terminal_before"][str(slot)]["file"],
                                 fused_receipt["boundaries"]["terminal_before"][str(slot)]["sha256"])
                          for slot in (1, 2, 3)]
          gelu_owners = [sealed(GELU / f"materialized-prefix271-owner{slot}.bin",
                                gelu_receipt["original_owner_sha256"][slot - 1]) for slot in (1, 2, 3)]
          fused_expected = sealed(FUSED / fused_receipt["boundaries"]["terminal_after"]["0"]["file"],
                                  "7307a9b9129f7650c5793a6098dfb30f1830699e24f7a94c3936d6d6c9b57ee5")
          gelu_expected = sealed(GELU / "materialized-prefix271.bin",
                                 "af9e1224e9f618475b0220047b9aae4727fc188d81e85bbcd93acdf4a70899d6")

          from tinygrad.device import Device
          from tinygrad.runtime.ops_cpu import CPUProgram
          from tinygrad.runtime.support.compiler_cpu import LLVMCompiler
          from tinygrad.runtime.support.elf import jit_loader

          compiler = LLVMCompiler("x86_64", "znver3", "")
          compiler.cachekey = None
          device = Device["CPU"]
          class Aligned:
              def __init__(self, size, raw=None):
                  self.allocation = ctypes.create_string_buffer(size + 31)
                  self.addr = (ctypes.addressof(self.allocation) + 31) & ~31
                  self.size = size
                  if raw is not None:
                      assert len(raw) == size
                      ctypes.memmove(self.addr, raw, size)
              def bytes(self): return ctypes.string_at(self.addr, self.size)

          def replay(label, obj, owners_raw, output_length, traced):
              owners = [Aligned(len(raw), raw) for raw in owners_raw]
              output = Aligned(output_length)
              trace = Aligned(960 * 96 * 4, b"\xaa" * (960 * 96 * 4)) if traced else None
              name = ("r_15_4_16_128_24_4" if label == "fused93" else "r_15_32_16_3_4_32_4n1")
              program = CPUProgram(device, name, jit_loader(obj))
              for tid in range(16):
                  args = [ctypes.c_uint64(output.addr), *(ctypes.c_uint64(buf.addr) for buf in owners)]
                  if trace is not None: args.append(ctypes.c_uint64(trace.addr))
                  program.fxn(*args, ctypes.c_int32(tid))
              assert [buf.bytes() for buf in owners] == owners_raw
              return output.bytes(), None if trace is None else trace.bytes()

          record = dict(kind="original-only-pinned-znver3-Gelu-stage-diagnostic",
              head_sha=os.environ["GITHUB_SHA"], workflow_sha256=sha(
                  (ROOT / ".github/workflows/prefix93-znver3-stage-once.yml").read_bytes()),
              target_processor="znver3", target_features="", provider_sha256=provider_sha,
              original_source_sha256=fused_receipt["source_sha256"],
              fused_original_ir_sha256=sha(fused_ir), materialized_original_ir_sha256=sha(gelu_ir),
              fused_owners_sha256=[sha(raw) for raw in fused_owners],
              materialized_owners_sha256=[sha(raw) for raw in gelu_owners],
              fused_historical_output_sha256=sha(fused_expected),
              materialized_historical_output_sha256=sha(gelu_expected), stages={})
          for label, raw, owners, expected, original_hash in (
                  ("fused93", fused_ir, fused_owners, fused_expected, fused_original_object_sha),
                  ("materialized92", gelu_ir, gelu_owners, gelu_expected, gelu_original_object_sha)):
              rebuilt = compiler.compile_to_obj(raw.decode())
              output, _ = replay(label, rebuilt, owners, len(expected), False)
              record[label] = dict(rebuilt_object_sha256=sha(rebuilt),
                  archived_object_sha256=original_hash, output_sha256=sha(output),
                  object_exact_match=sha(rebuilt) == original_hash,
                  historical_output_exact_match=output == expected)
              (OUT / f"{label}-pinned-original-output.bin").write_bytes(output)
              (OUT / "pre-stage-gate.json").write_text(json.dumps(record, indent=2) + "\n")
              assert output == expected, f"pin changes {label} historical output"
          assert record["fused93"]["object_exact_match"], "znver3 did not reproduce original fused object"

          stages = {
              "scaled": ((173, 189, 205, 221), tuple(854 + 16 * lane for lane in range(12))),
              "exp_residual": ((313, 338, 363, 388), tuple(1282 + 14 * lane for lane in range(12))),
              "exp_polynomial": ((325, 350, 375, 400), tuple(1294 + 14 * lane for lane in range(12))),
              "exp_product": ((327, 352, 377, 402), tuple(1450 + 9 * lane for lane in range(12))),
              "exp_final": ((333, 358, 383, 408), tuple(1456 + 9 * lane for lane in range(12))),
              "denominator": ((334, 359, 384, 409), tuple(1457 + 9 * lane for lane in range(12))),
          }
          # The exp polynomial is a 12-instruction Horner chain in both captured IRs.
          # Keep multiplication and addition steps separate to identify the first drift.
          for step in range(12):
              stages[f"horner_{step:02d}"] = (
                  tuple(314 + step + 25 * lane for lane in range(4)),
                  tuple(1283 + step + 14 * lane for lane in range(12)))
          gelu_indices = ("v825", "v830", "v836", "v842", "v826", "v832",
                          "v838", "v844", "v828", "v834", "v840", "v846")
          def instrument(raw, label, registers):
              source = raw.decode()
              signature = "i16* noalias align 32 %data3, i32 %data4) #0"
              anchor = ("  store float %v411, float* %v5\n" if label == "fused93" else
                        "  store float %v1561, float* %v827\n")
              assert source.count(signature) == source.count(anchor) == 1
              source = source.replace(signature,
                  "i16* noalias align 32 %data3, float* noalias align 32 %data5, i32 %data4) #0")
              if label == "fused93":
                  stores = "  %diag_ch = mul i32 %v14, 96\n  %diag_group = shl i32 %v34, 2\n"
                  stores += "  %diag_start = add i32 %diag_ch, %diag_group\n"
                  for lane, register in enumerate(registers):
                      index = "%diag_start" if lane == 0 else f"%diag_index_{lane}"
                      if lane: stores += f"  {index} = add i32 %diag_start, {lane}\n"
                      stores += f"  %diag_ptr_{lane} = getelementptr inbounds float, float* %data5, i32 {index}\n"
                      stores += f"  store float %v{register}, float* %diag_ptr_{lane}\n"
              else:
                  stores = "".join(
                      f"  %diag_ptr_{lane} = getelementptr inbounds float, float* %data5, i32 %{index}\n"
                      f"  store float %v{register}, float* %diag_ptr_{lane}\n"
                      for lane, (register, index) in enumerate(zip(registers, gelu_indices)))
              return source.replace(anchor, stores + anchor)

          def bits(raw): return struct.unpack("<" + "I" * (len(raw) // 4), raw)
          for stage, (fused_regs, gelu_regs) in stages.items():
              pair = record["stages"][stage] = {}
              for label, raw, owners, expected, registers in (
                      ("fused93", fused_ir, fused_owners, fused_expected, fused_regs),
                      ("materialized92", gelu_ir, gelu_owners, gelu_expected, gelu_regs)):
                  source = instrument(raw, label, registers)
                  (OUT / f"{label}-{stage}.ll").write_text(source)
                  obj = compiler.compile_to_obj(source)
                  (OUT / f"{label}-{stage}.objbin").write_bytes(obj)
                  output, trace = replay(label, obj, owners, len(expected), True)
                  assert trace is not None
                  (OUT / f"{label}-{stage}-output.bin").write_bytes(output)
                  (OUT / f"{label}-{stage}-trace.bin").write_bytes(trace)
                  pair[label] = dict(ir_sha256=sha(source.encode()), object_sha256=sha(obj),
                      output_sha256=sha(output), trace_sha256=sha(trace), admissible=output == expected)
                  (OUT / "stage-progress.json").write_text(json.dumps(record, indent=2) + "\n")
                  if output == expected:
                      assert len(bits(trace)) == 960 * 96 and all(value != 0xaaaaaaaa for value in bits(trace))
              if not all(pair[label]["admissible"] for label in ("fused93", "materialized92")): continue
              a = bits((OUT / f"fused93-{stage}-trace.bin").read_bytes())
              b = bits((OUT / f"materialized92-{stage}-trace.bin").read_bytes())
              pair["exact_matches"] = sum(x == y for x, y in zip(a, b))
              pair["targets"] = [dict(channel=channel, spatial=spatial,
                  fused_bits=f"{a[channel * 96 + spatial]:08x}",
                  materialized_bits=f"{b[channel * 96 + spatial]:08x}")
                  for channel, spatial in ((46, 54), (568, 21), (704, 78))]
              (OUT / "stage-progress.json").write_text(json.dumps(record, indent=2) + "\n")
          for path, value in fused_receipt["source_sha256"].items(): sealed(ROOT / path, value)
          sealed(Path(os.environ["LLVM_PATH"]), provider_sha)
          (OUT / "stage-receipt.json").write_text(json.dumps(record, indent=2) + "\n")
          print("pinned znver3 original replay and stages", json.dumps({
              stage: {label: item[label]["admissible"] for label in ("fused93", "materialized92")}
              for stage, item in record["stages"].items()}), flush=True)
          PINNED_PREFIX93_DRIVER
          printf 'a39166d814951679038431ca023e8c2810598e33bc197d8e862f6f0139d80896  %s/trace.py\n' "$capture_dir" | sha256sum --check --strict
      - name: Replay original kernels and compare staged traces
        shell: bash
        env:
          DEV: CPU:LLVM
          CPU_COUNT: '16'
          IMAGE: '1'
          FLOAT16: '1'
          NOLOCALS: '1'
          OPENPILOT_HACKS: '1'
          CACHELEVEL: '0'
          CCACHE: '0'
        run: |
          set -euo pipefail
          export LLVM_PATH="$RUNNER_TEMP/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/llvm18-captured/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tinygrad_repo"
          timeout 300s python .analysis/scratch/2026-10-21-prefix93-znver3/trace.py 2>&1 | tee .analysis/scratch/2026-10-21-prefix93-znver3/diagnostic.log
      - name: Preserve original-only diagnostic and failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefix93-znver3-stages-${{ github.sha }}
          path: |
            .analysis/scratch/2026-10-21-prefix93-znver3/trace.py
            .analysis/scratch/2026-10-21-prefix93-znver3/diagnostic.log
            .analysis/scratch/2026-10-21-prefix93-znver3/result/
          if-no-files-found: warn
