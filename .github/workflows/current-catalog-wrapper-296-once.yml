        },
        {
          "name": "Prepare only the private pinned Rust toolchain",
          "shell": "bash",
          "id": "prepare",
          "working-directory": "${{ env.LIVE_SOURCE }}",
          "run": "set -euo pipefail\n(cd \"$CI_JOB_TEMP\" && sha256sum --check --strict TRANSPORT.SHA256SUMS) > \"$LIVE_PROOF/transport-prepare.txt\"\nexec python3 -I -B -S \"$CI_JOB_TEMP/runtime/run-step.py\" prepare\n"
        },
        {
          "name": "One bin build eleven integration cases scoped Clippy CLI and original path controls",
