{
  "name": "Current catalog wrapper focused once",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/current-catalog-wrapper-296-once.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "current-catalog-wrapper-${{ github.repository }}-${{ github.ref }}",
    "queue": "max",
    "cancel-in-progress": false
  },
  "jobs": {
    "wrapper": {
      "name": "Exact current-catalog wrapper boundary only",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 150,
      "env": {
        "SOURCE_SHA": "da1a4490844fffc9a3800a44ccd86b76da858ed8",
        "LOGGERD_IO_JOB": "current-catalog-wrapper-once",
        "RUSTUP_TOOLCHAIN": "1.94.0",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONPATH": ""
      },
      "steps": [
        {
          "name": "Require registered bin-actions before any private setup",
          "shell": "bash",
          "env": {
            "SOURCE_ALLOWED": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
          },
          "run": "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = bin9208/openpilot-rust\n[[ \"$GITHUB_REF\" == refs/heads/codex/feat-296-local-validation ]]\n[[ \"$GITHUB_EVENT_NAME\" == push ]]\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$RUNNER_ENVIRONMENT\" = self-hosted\ntest \"$RUNNER_OS\" = Linux\ntest \"$RUNNER_ARCH\" = X64\ntest \"$SOURCE_ALLOWED\" = true\n"
        },
        {
          "name": "Existing common owned job output",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Private source homes caches temp and evidence reserve before checkout",
          "shell": "bash",
          "id": "allocate",
          "working-directory": "${{ github.workspace }}",
          "run": "set -euo pipefail\nworkspace=$(realpath -e -- \"$GITHUB_WORKSPACE\")\njob=$CI_JOB_TEMP\nowner=\"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\ntest \"$(cat \"$job/owner\")\" = \"$owner\"\numask 077\nmkdir \"$job/proof\" \"$job/home\" \"$job/cache\" \"$job/tmp\" \"$job/cargo-home\" \"$job/rustup-home\" \"$job/small\" \"$job/export\" \"$job/runtime\" \"$job/scripts\" \"$job/proof/payload\" \"$job/transport\"\nprintf '%s\\n' \"LIVE_PROOF=$job/proof\" \"LIVE_SMALL=$job/small\" \"HOME=$job/home\" \"CARGO_HOME=$job/cargo-home\" \"RUSTUP_HOME=$job/rustup-home\" \"CARGO_TARGET_DIR=$job/proof-target\" \"XDG_CACHE_HOME=$job/cache\" \"PIP_CACHE_DIR=$job/cache/pip\" \"TMPDIR=$job/tmp\" >> \"$GITHUB_ENV\"\n# Admission covers the one-MiB reserve and bounded source/receipt materialization.\navailable=$(df -PB1 \"$job\" | awk 'NR == 2 {print $4}')\n[[ $available =~ ^[0-9]+$ ]]\nprintf '{\"available_bytes\":%s,\"planned_growth_bytes\":2097152}\\n' \"$available\" > \"$job/proof/envelope-allocation-growth.json\"\n((available >= 2 * 1024 * 1024))\n# A bounded envelope reserve exists before source checkout or tool installation.\n# It is released only by the independent always-run small-envelope step.\nhead -c 1048576 /dev/zero > \"$job/small/reserve.bin\"\nmkdir \"$job/proof/ownership\"\n# Source admission is on the actual checkout filesystem, before allocation/checkout.\navailable=$(df -PB1 \"$workspace\" | awk 'NR == 2 {print $4}')\n[[ $available =~ ^[0-9]+$ ]]\nrequired=$((2 * 1024 * 1024 * 1024))\nprintf '{\"available_bytes\":%s,\"planned_source_growth_bytes\":%s}\\n' \"$available\" \"$required\" > \"$job/proof/source-growth-before-checkout.json\"\n((available >= required))\nsource_owner=$(mktemp -d \"$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX\")\nprintf '%s\\n' \"$owner\" > \"$source_owner/.ci296-owner\"\nmkdir \"$source_owner/source\"\nsource=\"$source_owner/source\"\n# Exact reviewed source/owned-temp mechanism, narrowed to this single native job.\n# Node actions keep the real workspace; only Bash consumers receive the private root.\nprintf 'source %q\\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\\n  export GITHUB_WORKSPACE=%q\\nfi\\nexport TMPDIR=%q\\n' \"$BASH_ENV\" \"$workspace\" \"$source\" \"$job/tmp\" > \"$job/live-shell-env\"\nprintf '%s\\n' \"LIVE_ACTIONS_WORKSPACE=$workspace\" \"LIVE_SOURCE_OWNER=$source_owner\" \"LIVE_SOURCE_IDENTITY=$(stat -c '%d:%i' -- \"$source_owner\")\" \"LIVE_SOURCE=$source\" \"LIVE_CHECKOUT_PATH=${source#\"$workspace/\"}\" \"BASH_ENV=$job/live-shell-env\" >> \"$GITHUB_ENV\"\nprintf 'owner=%s\\njob=%s\\nactions_workspace=%s\\nsource_owner=%s\\nsource_identity=%s\\nsource=%s\\nworkflow_sha=%s\\n' \"$owner\" \"$job\" \"$workspace\" \"$source_owner\" \"$(stat -c '%d:%i' -- \"$source_owner\")\" \"$source\" \"$GITHUB_SHA\" > \"$job/proof/owned-paths.txt\"\ndf -PB1 \"$workspace\" \"$job\" > \"$job/proof/disk-before-checkout.txt\"\ncat /proc/meminfo > \"$job/proof/memory-before-checkout.txt\"\nif test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > \"$job/proof/cgroup-memory-before-checkout.txt\"; fi\nprintf '%s\\n' \"$RUNNER_NAME\" \"$RUNNER_ENVIRONMENT\" \"$RUNNER_OS\" \"$RUNNER_ARCH\" > \"$job/proof/runner.txt\"\n"
        },
        {
          "name": "Stage inert authenticated source 00-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/00-00.b64\" <<'INERT_SOURCE'\\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 01-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/01-00.b64\" <<'INERT_SOURCE'\\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 01-01.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/01-01.b64\" <<'INERT_SOURCE'\nbHNlfSkpCgoKaWYgX19uYW1lX18gPT0gIl9fbWFpbl9fIjoKICAgIG1haW4oKQo=\nINERT_SOURCE\n"
        },
