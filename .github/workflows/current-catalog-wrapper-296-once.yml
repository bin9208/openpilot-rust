          "run": "set -euo pipefail\n(cd \"$CI_JOB_TEMP\" && sha256sum --check --strict TRANSPORT.SHA256SUMS) > \"$LIVE_PROOF/transport-final-seal.txt\"\nexec python3 -I -B -S \"$CI_JOB_TEMP/runtime/gate.py\" verify\n"
        },
        {
          "name": "Always recover authenticated owned processes before evidence packing",
          "shell": "bash",
          "id": "recover",
          "if": "${{ always() && env.LIVE_READY == 'true' }}",
          "working-directory": "${{ github.workspace }}",
          "run": "set -euo pipefail\ncd \"$CI_JOB_TEMP\"\nprintf '%s  %s\\n' 01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9 runtime/ownership.py 88cf3d9544a449be92c50e57c042a1323f92ac2c5bf493c2d264cf9b246558e6 runtime/finalize-owned.py | sha256sum --check --strict -\nexec python3 -I -B -S \"$CI_JOB_TEMP/runtime/finalize-owned.py\"\n"
        },
        {
          "name": "Capped full source raw-log and runtime evidence pack",
          "shell": "bash",
          "id": "package",
          "if": "${{ always() && env.LIVE_READY == 'true' }}",
          "working-directory": "${{ github.workspace }}",
          "run": "set -euo pipefail\n(cd \"$CI_JOB_TEMP\" && sha256sum --check --strict TRANSPORT.SHA256SUMS) > \"$LIVE_PROOF/transport-pack.txt\"\nexec python3 -I -B -S \"$CI_JOB_TEMP/runtime/pack-full.py\"\n"
        },
        {
          "name": "Upload full bounded evidence",
          "uses": "actions/upload-artifact@v6",
          "id": "full_upload",
          "if": "${{ always() && steps.package.outcome == 'success' }}",
          "with": {
            "name": "current-catalog-wrapper-full-${{ github.run_id }}",
            "path": "${{ env.CI_JOB_TEMP }}/export/evidence.tar.gz\n${{ env.CI_JOB_TEMP }}/export/full-pack-status.json",
            "if-no-files-found": "error",
            "retention-days": 14,
            "compression-level": 0
          }
        },
        {
          "name": "Always retain bounded failure envelope independently of full pack",
          "shell": "bash",
          "id": "small",
          "if": "${{ always() }}",
          "working-directory": "${{ github.workspace }}",
          "env": {
            "OUTCOME_ALLOCATE": "${{ steps.allocate.outcome }}",
            "OUTCOME_MATERIALIZE": "${{ steps.materialize.outcome }}",
            "OUTCOME_CHECKOUT": "${{ steps.checkout.outcome }}",
            "OUTCOME_PREPARE": "${{ steps.prepare.outcome }}",
            "OUTCOME_QUALIFICATION": "${{ steps.qualification.outcome }}",
            "OUTCOME_FINAL_SEAL": "${{ steps.final_seal.outcome }}",
            "OUTCOME_RECOVER": "${{ steps.recover.outcome }}",
            "OUTCOME_PACKAGE": "${{ steps.package.outcome }}",
            "OUTCOME_FULL_UPLOAD": "${{ steps.full_upload.outcome }}"
          },
          "run": "set -euo pipefail\npython3 -I -B -S - <<'SMALL_ENVELOPE'\n\"\"\"Standalone always-step: bounded failure evidence even if materialization failed.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport stat\nimport tempfile\n\nassert os.environ.get('GITHUB_ACTIONS') == 'true'\nassert os.environ.get('RUNNER_NAME') == 'bin-actions'\njob = os.environ.get('CI_JOB_TEMP')\nidentity = ':'.join(os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB'))\nif job:\n    root = Path(job)\n    assert root.parent == Path('/tmp') and root.name.startswith('openpilot-ci.')\n    assert not root.is_symlink() and root.stat().st_uid == os.getuid()\n    assert (root / 'owner').read_text().strip() == identity\n    small = root / 'small'\n    small.mkdir(exist_ok=True)\n    reserve = small / 'reserve.bin'\n    if reserve.exists():\n        assert reserve.is_file() and not reserve.is_symlink()\n        reserve.unlink()\nelse:\n    # A failed allocation/checkout still gets its own uniquely allocated envelope.\n    small = Path(tempfile.mkdtemp(prefix='catalog-wrapper-failure-', dir=os.environ['RUNNER_TEMP']))\n    (small / 'owner.txt').write_text(identity + '\\n')\nproof = Path(os.environ['LIVE_PROOF']) if os.environ.get('LIVE_PROOF') else None\nreport = {'status': 'BOUNDED_EVIDENCE_ENVELOPE_ONLY', 'qualification_credit': False,\n          'cause_proved': False, 'retirement_acceptance': False,\n          'focused_qualification': 'not granted by this envelope', 'owner': identity,\n          'source': os.environ['SOURCE_SHA'], 'run': os.environ['GITHUB_RUN_ID'],\n          'step_outcomes': {k: v for k, v in os.environ.items() if k.startswith('OUTCOME_')},\n          'full_evidence_available': (os.environ.get('OUTCOME_PACKAGE') == 'success'\n                                      and os.environ.get('OUTCOME_FULL_UPLOAD') == 'success'),\n          'file_prefix_cap_bytes': 8192, 'total_prefix_cap_bytes': 131072,\n          'omissions': ['full source/provider manifests and raw logs omitted from this small envelope',\n                       'prefixes are not complete documents unless complete=true'], 'retained': {}}\nnames = ['FAILURE.json', 'FINAL_SEAL_FAILURE.json', 'qualification.json',\n         'source-provider-final.json', 'verified-final-seal.json', 'ownership-summary.json',\n         'native-tests.json', 'original-path-result.json', 'original-native-path-controls.json',\n         'CLI-controls.json', 'held-source-before.json', 'held-tools-before.json',\n         'ELF-held-before.json', 'commands.json', 'source-growth-before-checkout.json',\n         'toolchain-growth.json', '../export/full-pack-status.json', 'owned-paths.txt']\nif proof:\n    # Receipts and capture stderr are bounded prefixes; never load model/code data.\n    names += [str(p.relative_to(proof)) for p in sorted((proof / 'ownership').glob('*.ownership.json'))][:16]\n    names += [str(p.relative_to(proof)) for p in sorted((proof / 'ownership').glob('*.capture.json'))][:16]\n    names += [str(p.relative_to(proof)) for p in sorted((proof / 'ownership').glob('*.stderr'))][:16]\nremaining = 131072\nfor number, name in enumerate(names):\n    if not proof:\n        report['omissions'].append(name + ': proof not allocated')\n        continue\n    path = proof / name\n    try:\n        info = path.lstat()\n        assert stat.S_ISREG(info.st_mode), 'not regular'\n        limit = min(8192, remaining)\n        if not limit:\n            report['omissions'].append(name + ': total prefix cap')\n            continue\n        with path.open('rb') as source:\n            raw = source.read(limit)\n        remaining -= len(raw)\n        dest = f'prefix-{number:02d}.bin'\n        (small / dest).write_bytes(raw)\n        report['retained'][name] = {'file': dest, 'retained_bytes': len(raw),\n                                  'source_bytes': info.st_size,\n                                  'complete': info.st_size <= len(raw),\n                                  'prefix_sha256': hashlib.sha256(raw).hexdigest()}\n        if info.st_size > len(raw):\n            report['omissions'].append(name + ': tail omitted')\n    except (OSError, AssertionError) as error:\n        report['omissions'].append(name + ': ' + str(error)[:200])\nreport['omissions'] = report['omissions'][:128]\nbody = (json.dumps(report, sort_keys=True, indent=2) + '\\n').encode()\nassert len(body) <= 65536\n(small / 'ENVELOPE.json').write_bytes(body)\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('path=' + str(small) + '\\n')\nprint(body.decode(), flush=True)\n\nSMALL_ENVELOPE\n"
        },
        {
          "name": "Upload small envelope even after failed qualification or packing",
          "uses": "actions/upload-artifact@v6",
          "id": "small_upload",
          "if": "${{ always() && steps.small.outputs.path != '' }}",
          "with": {
            "name": "current-catalog-wrapper-envelope-${{ github.run_id }}",
            "path": "${{ steps.small.outputs.path }}",
            "retention-days": 14,
            "if-no-files-found": "error",
            "compression-level": 0
          }
        },
        {
          "name": "Clean exact owned source only after qualification seal and both authenticated uploads",
          "shell": "bash",
          "id": "source_cleanup",
          "if": "${{ always() && steps.qualification.outcome == 'success' && steps.qualification.outputs.qualified == 'true' && steps.final_seal.outcome == 'success' && steps.final_seal.outputs.sealed == 'true' && steps.recover.outcome == 'success' && steps.recover.outputs.clear == 'true' && steps.full_upload.outcome == 'success' && steps.full_upload.outputs.artifact-id != '' && steps.full_upload.outputs.artifact-digest != '' && steps.small_upload.outcome == 'success' && steps.small_upload.outputs.artifact-id != '' && steps.small_upload.outputs.artifact-digest != '' }}",
          "working-directory": "${{ github.workspace }}",
          "env": {
            "FULL_UPLOAD_ID": "${{ steps.full_upload.outputs.artifact-id }}",
            "FULL_UPLOAD_DIGEST": "${{ steps.full_upload.outputs.artifact-digest }}",
            "SMALL_UPLOAD_ID": "${{ steps.small_upload.outputs.artifact-id }}",
            "SMALL_UPLOAD_DIGEST": "${{ steps.small_upload.outputs.artifact-digest }}"
          },
          "run": "set -euo pipefail\n[[ $FULL_UPLOAD_ID =~ ^[0-9]+$ && $SMALL_UPLOAD_ID =~ ^[0-9]+$ ]]\n[[ $FULL_UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ && $SMALL_UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]\nworkspace=$LIVE_ACTIONS_WORKSPACE\np=$LIVE_SOURCE_OWNER\ncase \"$p\" in \"$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.\"??????) ;; *) exit 1 ;; esac\ntest -d \"$p\" && test ! -L \"$p\"\ntest \"$(realpath -e -- \"$p\")\" = \"$p\"\ntest \"$(stat -c '%u' -- \"$p\")\" = \"$(id -u)\"\ntest \"$(stat -c '%d:%i' -- \"$p\")\" = \"$LIVE_SOURCE_IDENTITY\"\ntest -f \"$p/.ci296-owner\" && test ! -L \"$p/.ci296-owner\"\ntest \"$(cat \"$p/.ci296-owner\")\" = \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB\"\ntest \"$LIVE_SOURCE\" = \"$p/source\"\ntest -d \"$p/source\" && test ! -L \"$p/source\"\ntest \"$(realpath -e -- \"$p/source\")\" = \"$p/source\"\nrm -rf --one-file-system -- \"$p\"\n"
        },
        {
          "name": "Existing common cleanup only after admitted source cleanup",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "if": "${{ always() && steps.source_cleanup.outcome == 'success' }}",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  }
