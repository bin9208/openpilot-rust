          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/09-00.b64\" <<'INERT_SOURCE'\\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 10-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/10-00.b64\" <<'INERT_SOURCE'\\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 11-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/11-00.b64\" <<'INERT_SOURCE'\\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 12-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/12-00.b64\" <<'INERT_SOURCE'\\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 13-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/13-00.b64\" <<'INERT_SOURCE'\nc2V0IC1ldW8gcGlwZWZhaWwKZXhlYyBweXRob24zIC1JIC1CIC1TICIkQ0lfSk9CX1RFTVAvcnVudGltZS9nYXRlLnB5Igo=\nINERT_SOURCE\n"
        },
        {
          "name": "Stage inert authenticated source 14-00.b64",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CI_JOB_TEMP/transport/14-00.b64\" <<'INERT_SOURCE'\nc2V0IC1ldW8gcGlwZWZhaWwKZXhlYyBweXRob24zIC1JIC1CIC1TICIkQ0lfSk9CX1RFTVAvcnVudGltZS9nYXRlLnB5IiB2ZXJpZnkK\nINERT_SOURCE\n"
        },
        {
          "name": "Authenticate every complete decoded member before imports or execution",
          "shell": "bash",
          "id": "materialize",
          "run": "set -euo pipefail\npython3 -I -B -S - <<'AUTHENTICATE'\nimport base64,hashlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['CI_JOB_TEMP'])\nassert not root.is_symlink() and root.parent==Path('/tmp')\nassert (root/'owner').read_text().strip()==':'.join(os.environ[k] for k in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB'))\nentries=json.loads('[{\"path\":\"proof/payload/contract.json\",\"parts\":[\"00-00.b64\"],\"bytes\":5884,\"sha256\":\"92f33a662a6cc4f7217a171e329cfe9024dd18a69708785da0d9750e9c67a144\"},{\"path\":\"proof/payload/export_current_driving_catalog.py\",\"parts\":[\"01-00.b64\",\"01-01.b64\"],\"bytes\":6047,\"sha256\":\"94a5f103c3831a7bbdf7f6733c5576230539ccb906f1ad3368e587ea16c4a49c\"},{\"path\":\"proof/payload/test_export_current_catalog_paths.py\",\"parts\":[\"02-00.b64\"],\"bytes\":2015,\"sha256\":\"0810f0cedc18ea3de07227924326b447fa5f01c766ff9aa64ab94c0fe0262366\"},{\"path\":\"runtime/finalize-owned.py\",\"parts\":[\"03-00.b64\"],\"bytes\":1729,\"sha256\":\"88cf3d9544a449be92c50e57c042a1323f92ac2c5bf493c2d264cf9b246558e6\"},{\"path\":\"runtime/gate.py\",\"parts\":[\"04-00.b64\",\"04-01.b64\",\"04-02.b64\",\"04-03.b64\"],\"bytes\":23707,\"sha256\":\"824f7a35044c1aa07c2b8cd92f5da0c48e8948e21de5e88318ad2386afd09dff\"},{\"path\":\"runtime/original-path-controls.py\",\"parts\":[\"05-00.b64\"],\"bytes\":2763,\"sha256\":\"390dd4374e305457683fa7cda6008ab2f1c4d86613b6eb8f75e97c54a17d581c\"},{\"path\":\"runtime/ownership.py\",\"parts\":[\"06-00.b64\",\"06-01.b64\",\"06-02.b64\"],\"bytes\":17303,\"sha256\":\"01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9\"},{\"path\":\"runtime/pack-full.py\",\"parts\":[\"07-00.b64\"],\"bytes\":4158,\"sha256\":\"75de213c007eb5c12666a3b76f7f607f3d7bdfb8e9e2c7282f3b2bbc1be520e6\"},{\"path\":\"runtime/run-step.py\",\"parts\":[\"08-00.b64\"],\"bytes\":920,\"sha256\":\"caf635a203aa0509a9dc71e8ebfbab76bbccbd8f1a04798d3e4ba0f116ce2d67\"},{\"path\":\"runtime/small-envelope.py\",\"parts\":[\"09-00.b64\"],\"bytes\":4444,\"sha256\":\"d878cba11b66eb9834e09616a0013780334dfa394f61f9eff1081db7798f2a29\"},{\"path\":\"scripts/allocate.bash\",\"parts\":[\"10-00.b64\"],\"bytes\":3031,\"sha256\":\"64c31d4e3392a1419ca8d7827ff33425c4edd72998302b8faf68b7cc3bf91dd0\"},{\"path\":\"scripts/cleanup-source.bash\",\"parts\":[\"11-00.b64\"],\"bytes\":814,\"sha256\":\"46daf79aa11e95f14c50a49f5dcffb3fcd5bd134d33edaf79f3c825911f98b92\"},{\"path\":\"scripts/prepare.bash\",\"parts\":[\"12-00.b64\"],\"bytes\":949,\"sha256\":\"36ebb8a53e6e491dba95a50fafe8eda676b40770240ec57c4bcff1838a7df81e\"},{\"path\":\"scripts/run.bash\",\"parts\":[\"13-00.b64\"],\"bytes\":71,\"sha256\":\"968a41865905235a40576b653cb009a4ccc2f44aac46ffb6514601aaa21ea4cd\"},{\"path\":\"scripts/verify.bash\",\"parts\":[\"14-00.b64\"],\"bytes\":78,\"sha256\":\"e1df25cefc8337c8e633befa67491ebb07625c3d4a6801c66abb486cc040f846\"}]')\nmanifest={}\nfor row in entries:\n    path=root/row['path']\n    assert not path.exists() and not path.is_symlink()\n    encoded=[]\n    for part in row['parts']:\n        raw=(root/'transport'/part).read_bytes().strip()\n        assert len(raw)<=8000\n        encoded.append(raw)\n    body=base64.b64decode(b''.join(encoded),validate=True)\n    assert len(body)==row['bytes'] and hashlib.sha256(body).hexdigest()==row['sha256']\n    with path.open('xb') as output: output.write(body)\n    manifest[row['path']]={'bytes':len(body),'sha256':row['sha256']}\nfor name,seal in manifest.items():\n    body=(root/name).read_bytes()\n    assert len(body)==seal['bytes'] and hashlib.sha256(body).hexdigest()==seal['sha256']\n(root/'TRANSPORT.SHA256SUMS').write_text(''.join(row['sha256']+'  '+name+'\\n' for name,row in manifest.items()))\n(root/'proof/transport-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\\n')\nfor name in manifest:\n    if name.startswith(('runtime/','scripts/')):\n        destination=root/'proof/recipe-source'/name\n        destination.parent.mkdir(parents=True,exist_ok=True)\n        destination.write_bytes((root/name).read_bytes())\nAUTHENTICATE\nprintf 'LIVE_READY=true\\n' >> \"$GITHUB_ENV\"\n"
