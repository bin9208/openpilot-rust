name: 296 manager generator postdelete complete platform proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/manager-cars-full-postdelete-once.yml
permissions:
  contents: read
jobs:
  platform-runtime-postdelete:
    name: rust platform runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ac72102459752eec5936fb42b68aac2a05d6bef2
    - name: Verify exact generator-absent source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = ac72102459752eec5936fb42b68aac2a05d6bef2

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal --component clippy
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev
        libavutil-dev libzstd-dev libzmq5 strace
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0
        requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1
    - name: Configure original platform IPC imports
      run: printf 'PYTHONPATH=%s/platform-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Build native manager and serial daemon boundaries
      run: cargo build --manifest-path rust/Cargo.toml -p openpilot-manager -p openpilot-modem -p openpilot-hardwared -p openpilot-process-supervision
        --bins --examples --locked
    - name: Preserve default parameter diagnostics after helper and thread return
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-manager --test params_log_lifetime --locked

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build original platform IPC and Params bindings
      run: 'python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/platform-msgq-python"

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/platform-params-binding"

        '
    - name: Verify retired manager QA controllers against sealed original observations
      run: "set -euo pipefail\nfor name in check_manager.py check_manager_logging.py manager_reference.py; do\n  test ! -e\
        \ \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\ndone\ntest ! -e rust/tools/generate_manager_cars.py && test\
        \ ! -L rust/tools/generate_manager_cars.py\ntest -f rust/tools/original_params_binding.py\ntest -f openpilot/system/manager/manager.py\n\
        proof=\"$RUNNER_TEMP/platform-runtime/manager-retirement\"\ntest ! -e \"$proof\"\nmkdir -p \"$proof\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p\
        \ openpilot-dev-tools \\\n  --features manager-qa-native,manager-cars-native --bin check-manager-qa --bin check-manager\
        \ --bin check-manager-logging --bin generate-manager-cars \\\n  > \"$proof/build.stdout\" 2> \"$proof/build.stderr\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo +1.94.0 test\
        \ --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools \\\n  --features manager-qa-native,manager-cars-native\
        \ --lib --test manager_qa --test manager_qa_compat \\\n  --test manager_retirement --test manager_cars_generate --no-run\
        \ --message-format=json \\\n  > \"$proof/compile.jsonl\" 2> \"$proof/compile.stderr\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p\
        \ openpilot-dev-tools \\\n  --features manager-qa-native,manager-cars-native --lib --bin check-manager-qa --bin check-manager\
        \ \\\n  --bin check-manager-logging --bin generate-manager-cars --test manager_qa --test manager_qa_compat \\\n  --test\
        \ manager_retirement --test manager_cars_generate -- -D warnings \\\n  > \"$proof/clippy.stdout\" 2> \"$proof/clippy.stderr\"\
        \ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools \\\n  --features manager-qa-native,manager-cars-native\
        \ --lib manager_qa:: -- --nocapture \\\n  > \"$proof/units.stdout\" 2> \"$proof/units.stderr\"\ngrep -E '^test result:\
        \ ok\\. 13 passed; 0 failed;' \"$proof/units.stdout\"\ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked\
        \ -p openpilot-dev-tools \\\n  --features manager-qa-native,manager-cars-native --lib manager_cars_generate::tests::\
        \ \\\n  > \"$proof/cars-units.stdout\" 2> \"$proof/cars-units.stderr\"\ngrep -E '^test result: ok\\. 4 passed; 0 failed;'\
        \ \"$proof/cars-units.stdout\"\ncommand -v jq >/dev/null\nmapfile -t manager_test_elf < <(jq -r 'select(.reason==\"\
        compiler-artifact\" and .profile.test==true and .target.name==\"manager_retirement\") | .executable // empty' \"$proof/compile.jsonl\"\
        )\ntest \"${#manager_test_elf[@]}\" -eq 1\ntest -f \"${manager_test_elf[0]}\"\nmapfile -t cars_test_elf < <(jq -r\
        \ 'select(.reason==\"compiler-artifact\" and .profile.test==true and .target.name==\"manager_cars_generate\") | .executable\
        \ // empty' \"$proof/compile.jsonl\")\ntest \"${#cars_test_elf[@]}\" -eq 1\ntest -f \"${cars_test_elf[0]}\"\nprintf\
        \ '%s\\n' \"${manager_test_elf[0]}\" > \"$proof/test-elf-path.txt\"\nshopt -s nullglob\nbindings=(\"$RUNNER_TEMP\"\
        /platform-params-binding/params_pyx*.so)\ntest \"${#bindings[@]}\" -eq 1\nexport MANAGER_RETIREMENT_CHECKER=\"$GITHUB_WORKSPACE/rust/target/debug/check-manager-qa\"\
        \nexport MANAGER_RETIREMENT_MANAGER=\"$GITHUB_WORKSPACE/rust/target/debug/check-manager\"\nexport MANAGER_RETIREMENT_LOGGING=\"\
        $GITHUB_WORKSPACE/rust/target/debug/check-manager-logging\"\nexport MANAGER_RETIREMENT_TRACE=\"$GITHUB_WORKSPACE/rust/target/debug/examples/manager_trace\"\
        \nexport MANAGER_RETIREMENT_BINDING=\"${bindings[0]}\"\nexport MANAGER_RETIREMENT_EVIDENCE=\"$proof/actual\"\nexport\
        \ MANAGER_RETIREMENT_REQUIRE_ABSENT=1\nexport MANAGER_CARS_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/generate-manager-cars\"\
        \ntest -x \"$MANAGER_CARS_BINARY\"\nproviders=(\"$MANAGER_RETIREMENT_CHECKER\" \"$MANAGER_RETIREMENT_MANAGER\" \\\n\
        \  \"$MANAGER_RETIREMENT_LOGGING\" \"$MANAGER_RETIREMENT_TRACE\" \\\n  \"$MANAGER_RETIREMENT_BINDING\" /usr/bin/strace\
        \ /usr/bin/env \"${manager_test_elf[0]}\" \"$MANAGER_CARS_BINARY\" \"${cars_test_elf[0]}\")\nsha256sum \"${providers[@]}\"\
        \ > \"$proof/providers-before.sha256\"\nexport MANAGER_CARS_RETIREMENT_ROOT=\"$GITHUB_WORKSPACE\"\nexport MANAGER_CARS_RETIREMENT_BINARY=\"\
        $MANAGER_CARS_BINARY\"\nexport MANAGER_CARS_RETIREMENT_EVIDENCE=\"$proof/cars-actual\"\nexport MANAGER_CARS_RETIREMENT_REQUIRE_ABSENT=1\n\
        test ! -e \"$MANAGER_CARS_RETIREMENT_EVIDENCE\"\n\"${cars_test_elf[0]}\" manager_car_generator_trace_parser_rejects_unknown_failed_and_incomplete_execs\
        \ \\\n  --exact > \"$proof/cars-trace-parser.stdout\" 2> \"$proof/cars-trace-parser.stderr\"\ngrep -Fx 'test manager_car_generator_trace_parser_rejects_unknown_failed_and_incomplete_execs\
        \ ... ok' \"$proof/cars-trace-parser.stdout\"\ngrep -E '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/cars-trace-parser.stdout\"\
        \n\"${cars_test_elf[0]}\" native_car_generator_preserves_original_bytes_in_both_source_states \\\n  --ignored --exact\
        \ --nocapture > \"$proof/cars-absence.stdout\" 2> \"$proof/cars-absence.stderr\"\ngrep -Fx 'test native_car_generator_preserves_original_bytes_in_both_source_states\
        \ ... ok' \"$proof/cars-absence.stdout\"\ngrep -E '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/cars-absence.stdout\"\
        \njq -e '.passed == true and .checkout_generator_absent == true and .private_generator_absent == true and .closed_native_execs\
        \ == 11 and (.closed_native_execs_by_invocation | length) == 11 and ([.closed_native_execs_by_invocation[]] | all(.\
        \ == 1))' \\\n  \"$MANAGER_CARS_RETIREMENT_EVIDENCE/result.json\" >/dev/null\nstrace -ff -s 32768 -o \"$proof/cars-installed.trace\"\
        \ -e trace=execve,execveat \\\n  \"$MANAGER_CARS_BINARY\" rust/crates/manager/data/cars --check \\\n  > \"$proof/cars-installed.stdout\"\
        \ 2> \"$proof/cars-installed.stderr\"\ntest \"$(sha256sum \"$proof/cars-installed.stdout\" | cut -d' ' -f1)\" = 34742676490c2c6133eb940cff7d61721f2d7cb072978fd052c2376faeda9995\n\
        grep -h 'execve' \"$proof\"/cars-installed.trace.* > \"$proof/cars-installed.exec\"\ntest \"$(wc -l < \"$proof/cars-installed.exec\"\
        )\" -eq 1\ngrep -F \"execve(\\\"$MANAGER_CARS_BINARY\\\",\" \"$proof/cars-installed.exec\" | grep -F ' = 0' >/dev/null\n\
        ! grep -F 'execveat(' \"$proof/cars-installed.exec\"\n\"${manager_test_elf[0]}\" manager_exec_audit_accepts_empty_threads_without_losing_execution_checks\
        \ \\\n  --exact --nocapture > \"$proof/exec-audit-unit.stdout\" 2> \"$proof/exec-audit-unit.stderr\"\ngrep -Fx 'test\
        \ manager_exec_audit_accepts_empty_threads_without_losing_execution_checks ... ok' \\\n  \"$proof/exec-audit-unit.stdout\"\
        \ngrep -E '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/exec-audit-unit.stdout\"\ntest ! -e \"$MANAGER_RETIREMENT_EVIDENCE\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib 1024\n\"${manager_test_elf[0]}\"\
        \ manager_original_observations_survive_three_controller_retirement \\\n  --ignored --exact --nocapture > \"$proof/retirement.stdout\"\
        \ 2> \"$proof/retirement.stderr\"\ngrep -Fx 'test manager_original_observations_survive_three_controller_retirement\
        \ ... ok' \"$proof/retirement.stdout\"\ngrep -E '^test result: ok\\. 1 passed; 0 failed; 0 ignored;' \"$proof/retirement.stdout\"\
        \ntest -f \"$MANAGER_RETIREMENT_EVIDENCE/result.json\"\njq -e '.passed == true and .historical_source_count == 3 and\
        \ .negative_controls == 6 and .historical_generator_present == false and .total_closed_native_exec_attempts == 62\
        \ and ([.roots[] | .historical_absent] | all(. == true))' \"$MANAGER_RETIREMENT_EVIDENCE/result.json\" >/dev/null\n\
        sha256sum \"${providers[@]}\" > \"$proof/providers-after.sha256\"\ncmp \"$proof/providers-before.sha256\" \"$proof/providers-after.sha256\"\
        \nprintf 'workflow_head=%s\\nsource_commit=%s\\n' \"$GITHUB_SHA\" \"$(git rev-parse HEAD)\" > \"$proof/source-workflow.txt\"\
        \n"
    - name: Exercise native manager IPC, owned children and boot composition
      run: 'rust/target/debug/examples/manager_native "$RUNNER_TEMP/platform-runtime/manager-native" "$PWD/rust/target/debug/openpilot-process-child"

        rust/target/debug/examples/manager_adapters "$RUNNER_TEMP/platform-runtime/manager-adapters" "$PWD/rust/target/debug/openpilot-process-child"

        '
    - name: Verify retired modem tools and continuous native reconnect lifecycle
      run: "set -euo pipefail\nfor name in check_modem.py modem_source.py modem_fixture.py modem_fixture_command.py check_modem_process_boundary.py;\
        \ do\n  test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\ndone\ntest -f openpilot/system/hardware/tici/modem.py\n\
        \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo +1.94.0 build\
        \ --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --bin check-modem\n\"\
        $GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo +1.94.0 test\
        \ --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --lib --test modem_retirement\
        \ --no-run\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo\
        \ +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --lib\
        \ --bin check-modem --test modem_retirement -- -D warnings\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools\
        \ --features modem-qa-native --lib modem_ -- --nocapture\ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked\
        \ -p openpilot-dev-tools --features modem-qa-native --test modem_retirement -- --nocapture\nexport MODEM_REQUIRE_TOOLS_RETIRED=1\n\
        export MODEM_CHECKER_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/check-modem\"\nexport MODEM_DAEMON_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-modem\"\
        \nexport MODEM_TRACE_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/examples/modem_trace\"\nexport MODEM_PROCESS_CHILD_BINARY=\"\
        $GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child\"\nexport MODEM_RETIREMENT_OUTPUT=\"$RUNNER_TEMP/platform-runtime/modem-native\"\
        \nseals=\"$RUNNER_TEMP/platform-runtime/modem-seals\"\nmkdir -p \"$seals\"\nsha256sum \"$MODEM_CHECKER_BINARY\" \"\
        $MODEM_DAEMON_BINARY\" \"$MODEM_TRACE_BINARY\" \"$MODEM_PROCESS_CHILD_BINARY\" > \"$seals/before.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 1024\nstrace -ff -s 16384 -o \"$seals/retirement.trace\" -e trace=execve,execveat,clone,fork,vfork,exit,exit_group\
        \ \\\n  cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native\
        \ --test modem_retirement same_held_native_elfs_replay_modem_originals_in_checkout_and_private_absent_root -- --ignored\
        \ --exact --nocapture 2>&1 | tee \"$seals/retirement.log\"\ngrep -Fx \"test same_held_native_elfs_replay_modem_originals_in_checkout_and_private_absent_root\
        \ ... ok\" \"$seals/retirement.log\"\ngrep -E \"^test result: ok\\. 1 passed; 0 failed; 0 ignored;\" \"$seals/retirement.log\"\
        \nsha256sum \"$MODEM_CHECKER_BINARY\" \"$MODEM_DAEMON_BINARY\" \"$MODEM_TRACE_BINARY\" \"$MODEM_PROCESS_CHILD_BINARY\"\
        \ > \"$seals/after.sha256\"\ncmp -s \"$seals/before.sha256\" \"$seals/after.sha256\"\n"
    - name: Reproduce old modem EOF failure and require owned helper cleanup
      run: "set -euo pipefail\nexport MODEM_HELPER_EVIDENCE=\"$RUNNER_TEMP/platform-runtime/modem-helper-lifetime\"\nexport\
        \ CARGO_TARGET_DIR=\"$GITHUB_WORKSPACE/rust/target\"\nexport MODEM_PROCESS_CHILD_BINARY=\"$CARGO_TARGET_DIR/debug/openpilot-process-child\"\
        \nbaseline=\"$RUNNER_TEMP/modem398-baseline\"\nmkdir -p \"$MODEM_HELPER_EVIDENCE\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ngit fetch --no-tags --depth=1 origin 1364e48c96e888fa5d178c5eb2132d135cf30765\n\
        git worktree add --detach \"$baseline\" 1364e48c96e888fa5d178c5eb2132d135cf30765\nmkdir -p \"$baseline/rust/crates/modem/tests/fixtures\"\
        \ncp rust/crates/modem/tests/helper_lifetime.rs \"$baseline/rust/crates/modem/tests/\"\ncp rust/crates/modem/tests/fixtures/helper-entry.sh\
        \ \"$baseline/rust/crates/modem/tests/fixtures/\"\ncp rust/crates/modem/tests/fixtures/original-source-reference.json\
        \ \"$baseline/rust/crates/modem/tests/fixtures/\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 1024\ncargo build --manifest-path \"$baseline/rust/Cargo.toml\" -p openpilot-modem -p openpilot-process-supervision\
        \ --bins --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\n\
        if cargo test --manifest-path \"$baseline/rust/Cargo.toml\" -p openpilot-modem --test helper_lifetime --locked --\
        \ --exact interface_deadline_includes_stdout_eof_after_leader_exit --nocapture 2>&1 | tee \"$MODEM_HELPER_EVIDENCE/baseline.log\"\
        ; then\n  echo 'Expected the old modem EOF assertion to fail' >&2\n  exit 1\nfi\ngrep -F 'test result: FAILED' \"\
        $MODEM_HELPER_EVIDENCE/baseline.log\"\ngrep -F \"must time out, not accept leader's valid inet line\" \"$MODEM_HELPER_EVIDENCE/baseline.log\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path\
        \ rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-modem --features\
        \ helper-lifetime-tests --test helper_lifetime --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-modem --features\
        \ openpilot-modem/helper-lifetime-tests -p openpilot-process-supervision --all-targets --locked -- -D warnings\n"
    - name: Verify retired hardwared cases and continuous native state publication
      run: "set -euo pipefail\nfor name in check_hardwared.py hardwared_source.py check_hardwared_daemon.py; do\n  test !\
        \ -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\ndone\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p\
        \ openpilot-dev-tools --features hardwared-qa-native --bin check-hardwared --bin check-hardwared-daemon\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools\
        \ --features hardwared-qa-native --lib hardwared_ -- --nocapture\ncargo +1.94.0 test --manifest-path rust/Cargo.toml\
        \ --locked -p openpilot-dev-tools --features hardwared-qa-native --test hardwared_capture --test hardwared_qa --test\
        \ hardwared_retirement -- --nocapture\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\ncargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features\
        \ hardwared-qa-native --lib --bin check-hardwared --bin check-hardwared-daemon --test hardwared_capture --test hardwared_qa\
        \ --test hardwared_retirement -- -D warnings\nexport HARDWARED_REQUIRE_RETIRED=1\nexport HARDWARED_TRACE_BINARY=\"\
        $GITHUB_WORKSPACE/rust/target/debug/examples/hardwared_trace\"\nexport HARDWARED_DAEMON_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-hardwared\"\
        \nexport HARDWARED_PROCESS_LAUNCHER=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child\"\nexport HARDWARED_RETIREMENT_OUTPUT=\"\
        $RUNNER_TEMP/platform-runtime/hardwared-native\"\nseals=\"$RUNNER_TEMP/platform-runtime/hardwared-seals\"\nmkdir -p\
        \ \"$seals\"\nsha256sum \"$HARDWARED_TRACE_BINARY\" \"$HARDWARED_DAEMON_BINARY\" \"$HARDWARED_PROCESS_LAUNCHER\" \\\
        \n  \"$GITHUB_WORKSPACE/rust/target/debug/check-hardwared\" \"$GITHUB_WORKSPACE/rust/target/debug/check-hardwared-daemon\"\
        \ > \"$seals/before.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\" --growth-mib\
        \ 2048\nstrace -ff -s 16384 -o \"$seals/retirement.trace\" -e trace=execve,execveat,clone,fork,vfork,exit,exit_group\
        \ \\\n  cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features hardwared-qa-native\
        \ --test hardwared_retirement same_native_clis_preserve_all_original_cases_and_live_ipc_in_both_roots -- --ignored\
        \ --exact --nocapture\nsha256sum \"$HARDWARED_TRACE_BINARY\" \"$HARDWARED_DAEMON_BINARY\" \"$HARDWARED_PROCESS_LAUNCHER\"\
        \ \\\n  \"$GITHUB_WORKSPACE/rust/target/debug/check-hardwared\" \"$GITHUB_WORKSPACE/rust/target/debug/check-hardwared-daemon\"\
        \ > \"$seals/after.sha256\"\ncmp -s \"$seals/before.sha256\" \"$seals/after.sha256\"\n"
    - name: Retain platform source comparison and native runtime evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-platform-runtime-evidence
        path: '${{ runner.temp }}/platform-runtime/

          ${{ runner.temp }}/platform-params-binding/commands.json

          ${{ runner.temp }}/platform-params-binding/provenance.json

          '
  manager-policy-postdelete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ac72102459752eec5936fb42b68aac2a05d6bef2
        persist-credentials: false
    - name: Prepare pinned policy toolchain and disk
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = ac72102459752eec5936fb42b68aac2a05d6bef2

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        rustup toolchain install 1.94.0 --profile minimal

        sudo apt-get update

        sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev
        libzstd-dev libzmq5

        mkdir -p "$RUNNER_TEMP/manager-policy"

        '
    - name: Require physical absence and maintained native manager proof
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test ci_rust_isolation -- --nocapture
        > "$RUNNER_TEMP/manager-policy/isolation.stdout" 2> "$RUNNER_TEMP/manager-policy/isolation.stderr"

