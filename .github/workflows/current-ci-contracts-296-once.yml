name: 296 current-source routing and metadata integration contracts
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/current-ci-contracts-296-once.yml
permissions:
  contents: read
jobs:
  current-contracts:
    name: current-source complete fast routing and corrected metadata/Card contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: df374b0abde72e93759bc2a2168505b5615f4d7a
    - name: Bind exact reviewed source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = df374b0abde72e93759bc2a2168505b5615f4d7a

        mkdir "$RUNNER_TEMP/current-ci-contracts-296"

        git rev-parse HEAD > "$RUNNER_TEMP/current-ci-contracts-296/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$RUNNER_TEMP/current-ci-contracts-296/WORKFLOW_COMMIT"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
    - name: Prepare native CI validation
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        '
    - name: Check CI routing and upstream synchronization guards
      run: "python -m unittest discover -s tools/ci/tests -v\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --locked --lib \\\n  --test ci_workflow_policy --test ci_rust_isolation --test ci_disk_bootstrap --test ci_process_probe\
        \ \\\n  --test panda_oracle_build --test upstream_sync --test native_build_closure --test updated_process_check \\\
        \n  --test native_logging_build --test release_files --test logger_identifier_check --test qa_process \\\n  --test\
        \ logging_oracle_build --test path_resolve --test bridge_source_build --test jpeg_sanitizers_check \\\n  --test ci_native_staging\
        \ --test encoder_source_build --test ui_updater_handshake --test athena_vision_build \\\n  --test hardware_command_check\
        \ --test pandad_firmware_spi_build --test panda_cli --test msgq_sanitizers_check \\\n  --test control_tools_policy_check\
        \ --test five_cli --test registration_vendor_check --test ui_adapter_sanitizers \\\n  --test unix_argv --test python_fs\
        \ --test unix_cli_paths --test panda_raw \\\n  --test startup_adapter_sanitizers --test python_glob --test ui_fixed_corpus_check\
        \ --test ui_ci_runtime \\\n  --test ui_state_scheduler_check --test ui_translation_check --test ui_application_logic_check\
        \ --test ui_headless_check \\\n  --test ui_scroll_check --test diagnostic_check --test message_state_ci --test timed_ci\
        \ --test ci_artifact_list \\\n  --test miri_provenance --test image_array_math --test ui_egl_ci --test command_reference_check\
        \ \\\n  --test params_reference_check --test beep_integer_ci --test ui_polygon_ci --test ui_application_lifecycle_ci\
        \ --test ratekeeper_ci --test cutin_alert_ci \\\n  --test bluetooth_digits_generate --test encoder_runtime_ci\ncargo\
        \ test --manifest-path rust/Cargo.toml -p openpilot-service-tools --locked\n"
    - name: Run actual workspace metadata comparison with its built binary
      env:
        CI_RECEIPT_ORIGINAL: ${{ github.workspace }}/rust/crates/dev-tools/tests/fixtures/ci-receipt-original/original
        CI_RECEIPT_BINARY: ${{ github.workspace }}/rust/target/debug/ci-receipt-metadata
        CI_RECEIPT_EVIDENCE: ${{ runner.temp }}/current-ci-contracts-296/metadata
        CI_RECEIPT_MANIFEST_SHA256: 71d33e6e25f62c7a51240ecb4eb908acd35351a911b482869181fbfdffd130c1
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features ci-receipt-metadata-native
        --bin ci-receipt-metadata

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features ci-receipt-metadata-native --test
        ci_receipt_metadata -- --nocapture

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features ci-receipt-metadata-native --test
        ci_receipt_metadata -- --ignored --nocapture

        '
    - name: Keep the original Card policy assertion strict for the added required suite
      env:
        PYTHONPATH: ${{ github.workspace }}/rust/tools:${{ github.workspace }}
      run: python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=rust/tools/tests rust/tools/tests/test_card_ci.py::test_required_ci_generates_fixtures_before_tests_and_checks_full_schemas
        -q
    - name: Preserve source-bound metadata reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: current-ci-contracts-296
        path: ${{ runner.temp }}/current-ci-contracts-296/
        include-hidden-files: true
        if-no-files-found: warn
