{
  "name": "controlsd fixture constructors focused",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-native-tools-candidate"
      ],
      "paths": [
        ".github/workflows/controlsd-fixture-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "concurrency": {
    "group": "controlsd-fixture-296-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "controlsd-fixture": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 75,
      "env": {
        "CONTROLSD_FIXTURE_SOURCE_SHA": "c5e37a69b34d66129ad0ce7c4d79c58a1921227e",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "OPENBLAS_NUM_THREADS": "1",
        "RUSTUP_TOOLCHAIN": "1.94.0"
      },
      "steps": [
        {
          "name": "Bootstrap private registered-runner paths",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_BOOTSTRAP_PY'\n\"\"\"Actions bootstrap only: admit source growth before allocating private roots.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport tempfile\n\nif os.environ['RUNNER_NAME'] != 'bin-actions':\n    raise SystemExit('registered bin-actions runner required')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\nprefix = 'controlsd-fixture-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\ngrowth = 2 * 1024 * 1024 * 1024\nfree = shutil.disk_usage(workspace).free\nadmission = {'path': str(workspace), 'operation': 'source-checkout', 'available_bytes': free, 'planned_growth_bytes': growth}\nprint(json.dumps(admission), flush=True)\nif growth > free:\n    raise SystemExit('source operation growth exceeds available space')\nos.umask(0o077)\njob = Path(tempfile.mkdtemp(prefix=prefix, dir=runner_temp))\nsource = Path(tempfile.mkdtemp(prefix=prefix, dir=workspace))\nfor name in ['tmp', 'proof', 'payload']:\n    (job / name).mkdir(mode=0o700)\ndef identity(path):\n    value = path.lstat()\n    return {'dev': value.st_dev, 'ino': value.st_ino, 'uid': value.st_uid}\nowner = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n         'workspace': str(workspace), 'runner_temp': str(runner_temp),\n         'job': str(job), 'source': str(source),\n         'job_identity': identity(job), 'source_identity': identity(source)}\nreceipt = json.dumps(owner, sort_keys=True) + '\\n'\n(job / '.controlsd-owner.json').write_text(receipt)\n(job / 'proof/ownership.json').write_text(receipt)\n(job / 'proof/growth-source.json').write_text(json.dumps(admission) + '\\n')\nvalues = {'CONTROLSD_FIXTURE_JOB': str(job), 'CONTROLSD_FIXTURE_PAYLOAD': str(job / 'payload'),\n          'CONTROLSD_FIXTURE_PROOF': str(job / 'proof'), 'CONTROLSD_FIXTURE_ROOT': str(source),\n          'CONTROLSD_FIXTURE_CHECKOUT_REL': str(source.relative_to(workspace)),\n          'CARGO_HOME': str(job / 'cargo'), 'RUSTUP_HOME': str(job / 'rustup'),\n          'CARGO_TARGET_DIR': str(job / 'target'), 'PIP_CACHE_DIR': str(job / 'pip'),\n          'XDG_CACHE_HOME': str(job / 'xdg'), 'TMPDIR': str(job / 'tmp')}\nwith open(os.environ['GITHUB_ENV'], 'a') as output:\n    for key, value in values.items():\n        if '\\n' in value or '\\r' in value:\n            raise SystemExit('invalid private path')\n        output.write(key + '=' + value + '\\n')\nprint(json.dumps({'ownership': owner, 'growth_admitted': True}), flush=True)\nCONTROLSD_BOOTSTRAP_PY\n"
        },
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "${{ env.CONTROLSD_FIXTURE_SOURCE_SHA }}",
            "path": "${{ env.CONTROLSD_FIXTURE_CHECKOUT_REL }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          }
        },
        {
          "name": "Stage frozen fixture observers and source contract",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$CONTROLSD_FIXTURE_PAYLOAD\" \"$CONTROLSD_FIXTURE_PROOF\"\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/growth.py\" <<'CONTROLSD_PAYLOAD_EOF'\n\"\"\"Actions disk admission before each named operation; no fixed reserve floor.\"\"\"\nimport json\nfrom pathlib import Path\nimport shutil\nimport sys\npath = Path(sys.argv[1]).resolve()\nwhile not path.exists(): path = path.parent\ngrowth = int(sys.argv[2]) * 1024 * 1024\nfree = shutil.disk_usage(path).free\nprint(json.dumps({'path': str(path), 'operation': sys.argv[3], 'available_bytes': free, 'planned_growth_bytes': growth}), flush=True)\nif growth > free: raise SystemExit('operation growth exceeds available space')\nCONTROLSD_PAYLOAD_EOF\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/capture_original.py\" <<'CONTROLSD_PAYLOAD_EOF'\n\"\"\"Actions ONLY: actual original fixture helpers; never import native results.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport struct\nimport subprocess\nimport sys\n\nROOT = Path(os.environ['CONTROLSD_FIXTURE_ROOT']).resolve()\nPROOF = Path(os.environ['CONTROLSD_FIXTURE_PROOF']).resolve()\nsys.path[:0] = [str(ROOT / 'rust/tools'), str(ROOT), str(ROOT / 'opendbc_repo')]\nSOURCES = ['rust/tools/controlsd_fixture.py', 'rust/tools/controlsd_scenarios.py', 'rust/tools/paramsd_fixture.py']\nsha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()\nsources = {name: sha(ROOT / name) for name in SOURCES}\nassert sources == json.loads((PROOF / 'source-contract.json').read_text())\n\n# Bind directly imported extension files before Python loads them. Guard our\n# own reads so the audit hook does not recursively inspect itself.\nproviders = {}\nproject_modules = {}\nprovider_preload = {}\ninside_hook = False\ndef provider_hook(kind, args):\n    global inside_hook\n    if inside_hook: return\n    filename = args[1] if kind == 'import' and len(args) > 1 else args[0] if kind == 'ctypes.dlopen' and args else None\n    if not isinstance(filename, str) or not filename.startswith('/'): return\n    if not (filename.endswith('.so') or '.so.' in filename): return\n    inside_hook = True\n    try:\n        path = Path(filename).resolve()\n        if path.is_file():\n            digest = sha(path)\n            provider_preload.setdefault(str(path), digest)\n            providers.setdefault(str(path), digest)\n    finally: inside_hook = False\nsys.addaudithook(provider_hook)\nfor line in Path('/proc/self/maps').read_text().splitlines():\n    parts = line.split(None, 5)\n    if len(parts) == 6 and parts[5].startswith('/'):\n        path = Path(parts[5])\n        if path.is_file(): providers.setdefault(str(path), sha(path))\nfrom openpilot.cereal import car, log\nimport controlsd_fixture as base\nimport controlsd_scenarios as scenarios\nfrom paramsd_fixture import event\n\n# Reuse accepted helper wire corpus when there is a sealed saved artifact. This\n# job captures ONLY previously missing controlsd fixture/scenario constructions;\n# it never reruns paramsd startup, estimator, daemon or provider supplement gates.\ndef normalize(value, key=None):\n    if key == 'messages':\n        return [packet_projection(p) for p in value]\n    if key == 'CarParams':\n        with car.CarParams.from_bytes(bytes(value)) as cp:\n            return normalize(cp.to_dict())\n    if isinstance(value, float):\n        return {'$f64': struct.pack('>d', value).hex()}\n    if isinstance(value, bytes):\n        return {'$data': value.hex()}\n    if isinstance(value, dict):\n        return {k: normalize(v, k) for k, v in value.items()}\n    if isinstance(value, list):\n        return [normalize(v) for v in value]\n    return value\n\ndef packet_projection(packet):\n    with log.Event.from_bytes(bytes(packet)) as message:\n        return normalize(message.to_dict())\n\ndef run(request):\n    op = request['op']\n    if op == 'frame': return base.frame(request['index'])\n    if op == 'event': return event(request['service'], request['time'], request['data'])\n    if op == 'change':\n        import copy\n        return scenarios.change(copy.deepcopy(request['row']), request.get('updates'), request.get('omit', ()), request.get('settings'))\n    if op == 'parameters': return base.parameters(request['fingerprint'], request['mode'], request.get('settings', {}))\n    if op == 'case': return scenarios.case(request['name'], request['fingerprint'], request['mode'], request['frames'], request.get('settings'), request.get('cp_changes'))\n    if op == 'cases':\n        result = base.cases() + scenarios.cases()\n        assert len(result) == 30\n        assert sum(len(case['frames']) for case in result) == 8605\n        return result\n    raise AssertionError(op)\n\nrequests = []\nfor index in [-1, 0, 1, 2, 3, 19, 20, 39, 40, 59, 60, 79, 80, 99, 100, 119, 120, 139, 140, 159, 160, 189, 190, 199, 200, 219, 220, 339, 340, 379, 380, 389, 390, 399, 400, 419, 420, 429, 430, 439, 440, 459, 460, 499, 500, 559, 560, 619, 999]:\n    requests.append({'op': 'frame', 'index': index})\n# Each mutation input is genuine original wire, never generated by Rust.\nfor index in [0, 3, 119, 389, 999]:\n    row = base.frame(index)\n    requests += [\n        {'op': 'change', 'row': row, 'updates': {'carState': {'cruiseState': {'standstill': True}}, 'radarState': {'leadOne': {'status': False}}, 'modelV2': {'orientation': {'y': [.5]}, 'meta': {'desireState': [.1, .2], 'laneChangeState': 'laneChangeStarting'}}}, 'omit': ['carrotMan'], 'settings': {'DisableDM': 1, 'CustomSR': 0}},\n        {'op': 'change', 'row': row, 'updates': {}, 'omit': ['livePose', 'selfdriveState'], 'settings': {}},\n        {'op': 'change', 'row': row, 'updates': {'carrotMan': {'desiredSource': 'road', 'atcType': 'turn left', 'desiredSpeed': 60}}, 'settings': {'flag': True, 'negative': -2, 'nan': float('nan')}},\n    ]\n# Untouched invalid packets remain byte-identical; an updated packet becomes a\n# new valid Event at row.time as the actual event() call specifies.\nrow = base.frame(3)\nwith log.Event.from_bytes(bytes(row['messages'][1])) as reader:\n    altered = reader.as_builder()\n    altered.valid = False\n    altered.logMonoTime = 42\n    row['messages'][1] = list(altered.to_bytes())\nrequests += [{'op': 'change', 'row': row, 'updates': {}},\n             {'op': 'change', 'row': row, 'updates': {'carState': {'canValid': False}}}]\nfor fp in ['PSA_PEUGEOT_208', 'HONDA_CIVIC', 'TOYOTA_RAV4', 'VOLKSWAGEN_ID4_MK1', 'HYUNDAI_PALISADE', 'GMC_ACADIA', 'CHEVROLET_VOLT']:\n    for mode in ['pid', 'torque', 'angle']:\n        requests.append({'op': 'parameters', 'fingerprint': fp, 'mode': mode, 'settings': base.SETTINGS})\nrequests.append({'op': 'case', 'name': 'psa-torque-cp-mutation', 'fingerprint': 'PSA_PEUGEOT_208', 'mode': 'torque', 'frames': [base.frame(0), base.frame(3)], 'cp_changes': {'useSteeringAngle': False, 'flags': 8193, 'startingState': True, 'steerAtStandstill': True}})\nfor name, data in [\n    ('modelV2', {'orientation': {'x': [.1, -.2], 'y': []}, 'acceleration': {'y': [float('nan'), float('inf'), -float('inf')]}, 'meta': {'laneChangeDirection': 'left', 'desireState': [.1, .2]}, 'jetlink': {'lossLatched': True, 'source': 'jetlink'}}),\n    ('radarState', {'leadOne': {'status': True, 'dRel': 30.}, 'leadTwo': {'status': False}, 'leadCutInRisk': {'status': True}}),\n    ('longitudinalPlan', {'jTargetNow': float('nan'), 'speeds': [], 'longitudinalPlanSource': 'lead0'}),\n]:\n    requests.append({'op': 'event', 'service': name, 'time': 123.25, 'data': data})\n# Exercise decoded/rebuilt schema paths for every actual struct service,\n# including services not mutated by the built-in scenarios. onroadEvents is\n# originally constructed with init(..., 0), not paramsd_fixture.event().\nfor service in ['carState', 'liveParameters', 'liveTorqueParameters', 'liveDelay', 'modelV2', 'longitudinalPlan', 'lateralPlan', 'radarState', 'carOutput', 'carrotMan', 'driverMonitoringState', 'driverAssistance', 'livePose', 'liveCalibration', 'selfdriveState']:\n    requests.append({'op': 'change', 'row': base.frame(3), 'updates': {service: {}}})\nrow = base.frame(3)\nrow['params'] = {'sentinel': [49]}\nrow['messages'].append(row['messages'][1])\nrequests += [{'op': 'change', 'row': row, 'updates': {}, 'settings': None},\n             {'op': 'change', 'row': row, 'updates': {'unknownIgnoredService': {}}, 'omit': ['carState'], 'settings': {}}]\nrequests.append({'op': 'cases'})\n\n# Each result comes directly from the original helper calls. Full decoded\n# projections include defaults, nested/list fields and Float32->Python float bits.\ndef bind_loaded():\n    for module in list(sys.modules.values()):\n        raw = getattr(module, '__file__', None)\n        if not raw: continue\n        path = Path(raw).resolve()\n        if not path.is_file(): continue\n        if path.is_relative_to(ROOT) or path.suffix in ('.so', '.pyd'):\n            target = project_modules if path.is_relative_to(ROOT) else providers\n            target.setdefault(str(path), sha(path))\n    for line in Path('/proc/self/maps').read_text().splitlines():\n        parts = line.split(None, 5)\n        if len(parts) == 6 and parts[5].startswith('/'):\n            path = Path(parts[5])\n            if path.is_file(): providers.setdefault(str(path), sha(path))\n\nwith (PROOF / 'requests.jsonl').open('x') as inputs, (PROOF / 'original.jsonl').open('x') as outputs, (PROOF / 'original-projection.jsonl').open('x') as projections:\n    for index, request in enumerate(requests):\n        inputs.write(json.dumps(request, allow_nan=True, separators=(',', ':')) + '\\n')\n        value = run(request)\n        outputs.write(json.dumps(value, allow_nan=True, separators=(',', ':')) + '\\n')\n        if request['op'] == 'parameters':\n            with car.CarParams.from_bytes(bytes(value)) as cp: projection = normalize(cp.to_dict())\n        elif request['op'] == 'event': projection = packet_projection(value)\n        else: projection = normalize(value)\n        projections.write(json.dumps(projection, allow_nan=False, separators=(',', ':')) + '\\n')\n        bind_loaded()\n        print(json.dumps({'original_request_complete': index, 'op': request['op']}), flush=True)\nassert {name: sha(ROOT / name) for name in SOURCES} == sources\nfor path, digest in providers.items(): assert sha(path) == digest, path\nfor path, digest in project_modules.items(): assert sha(path) == digest, path\nmanifest = {'requests': len(requests), 'constructor_cases': 30, 'constructor_frames': 8605, 'preload_extension_providers': provider_preload, 'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=ROOT, text=True).strip(),\n            'sources': sources, 'providers': providers, 'loaded_project_modules': project_modules,\n            'provider_binding_limit': 'direct extensions use pre-load import/dlopen receipts; transitive mapped dependencies are bound on first observation and rechecked at completion; no independent pre-load claim for transitive mappings',\n            'files': {name: {'sha256': sha(PROOF / name), 'bytes': (PROOF / name).stat().st_size} for name in ['requests.jsonl', 'original.jsonl', 'original-projection.jsonl']},\n            'scope': 'original input constructors only; no controller/daemon/model execution', 'native_output_used_as_expected': False}\n(PROOF / 'original-manifest.json').write_text(json.dumps(manifest, indent=2) + '\\n')\nCONTROLSD_PAYLOAD_EOF\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/verify_gate.py\" <<'CONTROLSD_PAYLOAD_EOF'\n\"\"\"Actions receipt audit; no project imports or candidate-generated expectations.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\n\nroot = Path(os.environ['CONTROLSD_FIXTURE_ROOT']).resolve()\nproof = Path(os.environ['CONTROLSD_FIXTURE_PROOF']).resolve()\nbinary = Path(os.environ['CARGO_TARGET_DIR']) / 'debug/generate-controlsd-fixtures'\nsha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()\nmanifest = json.loads((proof / 'original-manifest.json').read_text())\nassert manifest['source_commit'] == os.environ['CONTROLSD_FIXTURE_SOURCE_SHA']\nfor path, expected in manifest['providers'].items(): assert sha(path) == expected, path\nfor path, expected in manifest['loaded_project_modules'].items(): assert sha(path) == expected, path\nfor path, expected in manifest['sources'].items(): assert sha(root / path) == expected, path\nfor name, expected in manifest['files'].items(): assert sha(proof / name) == expected['sha256']\nlines = (proof / 'native.exec').read_text().splitlines()\nexecs = []\nfor line in lines:\n    if re.search(r'\\bexecve(?:at)?\\(', line):\n        match = re.search(r'\\bexecve\\((\"(?:[^\"\\\\]|\\\\.)*\"), (\\[.*\\]), .*\\) = 0$', line)\n        assert match, line\n        execs.append((json.loads(match[1]), json.loads(match[2])))\n    assert 'execve resumed' not in line and 'execveat resumed' not in line, line\nexpected_argv = [str(binary), '--root', str(root), '--input', str(proof / 'requests.jsonl'), '--output', str(proof / 'native.jsonl')]\nassert execs == [(str(binary), expected_argv)], execs\ncomparison = json.loads((proof / 'comparison.json').read_text())\nassert comparison['pass'] and comparison['requests'] == manifest['requests']\nsubprocess.run(['git', 'diff', '--exit-code'], cwd=root, check=True)\n(proof / 'complete.json').write_text(json.dumps({'pass': True, 'source_commit': manifest['source_commit'], 'runner': os.environ['RUNNER_NAME'], 'requests': manifest['requests'], 'native_execs': 1, 'native_python_execs': 0, 'binary_sha256': sha(binary), 'runtime_gate_reruns': 0, 'retired_sources': [], 'device_acceptance': False}, indent=2) + '\\n')\nCONTROLSD_PAYLOAD_EOF\ncat > \"$CONTROLSD_FIXTURE_PROOF/source-contract.json\" <<'CONTROLSD_PAYLOAD_EOF'\n{\"rust/tools/controlsd_fixture.py\": \"df3fe9adc8b9ed195927700de5235fd88df58c0c80a617a5e043c5d5283fbb45\", \"rust/tools/controlsd_scenarios.py\": \"d83dfce64a13d033143fccbeb03bd4a270dd3837f759ad58a3bdca50fe472368\", \"rust/tools/paramsd_fixture.py\": \"8c0356bb780039c475def68358567489e036ab422921b8389bc7fbed20635521\"}\nCONTROLSD_PAYLOAD_EOF\n"
        },
        {
          "name": "Capture missing original fixture data and check native constructors",
          "shell": "bash",
          "run": "set -euo pipefail\nset -euo pipefail\ncd \"$CONTROLSD_FIXTURE_ROOT\"\ntest \"$(git rev-parse HEAD)\" = \"$CONTROLSD_FIXTURE_SOURCE_SHA\"\ngit diff --exit-code\nfor tool in git python3 curl clang capnp strace timeout; do command -v \"$tool\"; done\nmkdir -p \"$CONTROLSD_FIXTURE_PROOF\"\n# Fetched toolchain and Python dependencies are private to this one job.\npython3 \"$CONTROLSD_FIXTURE_PAYLOAD/growth.py\" \"$CONTROLSD_FIXTURE_JOB\" 2048 private-toolchain-and-venv | tee \"$CONTROLSD_FIXTURE_PROOF/growth-tools.json\"\ncurl --fail --location --retry 3 https://sh.rustup.rs -o \"$CONTROLSD_FIXTURE_JOB/rustup-init.sh\"\nsha256sum \"$CONTROLSD_FIXTURE_JOB/rustup-init.sh\" > \"$CONTROLSD_FIXTURE_PROOF/rustup-installer.sha256\"\nsh \"$CONTROLSD_FIXTURE_JOB/rustup-init.sh\" -y --no-modify-path --profile minimal --default-toolchain 1.94.0 --component clippy\nexport PATH=\"$CARGO_HOME/bin:$PATH\"\npython3 -m venv \"$CONTROLSD_FIXTURE_JOB/venv\"\n\"$CONTROLSD_FIXTURE_JOB/venv/bin/python\" -m pip install numpy==2.5.3 pycapnp==2.1.0 pycryptodome==3.23.0 cffi==2.1.1 zstandard==0.25.0 pyzmq==27.2.0\nexport PYTHONPATH=\"$CONTROLSD_FIXTURE_ROOT:$CONTROLSD_FIXTURE_ROOT/opendbc_repo:$CONTROLSD_FIXTURE_ROOT/rust/tools\"\npython3 \"$CONTROLSD_FIXTURE_PAYLOAD/growth.py\" \"$CARGO_TARGET_DIR\" 8192 bounded-fixture-and-dbc-compilation | tee \"$CONTROLSD_FIXTURE_PROOF/growth-build.json\"\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features dbc-generator-native --bin dbc-generator --bin stage-control-dbcs --locked\nexport OPENPILOT_DBC_GENERATOR=\"$CARGO_TARGET_DIR/debug/dbc-generator\"\n\"$CARGO_TARGET_DIR/debug/stage-control-dbcs\" > \"$CONTROLSD_FIXTURE_PROOF/dbc-stage.stdout\" 2> \"$CONTROLSD_FIXTURE_PROOF/dbc-stage.stderr\"\nrustc -vV > \"$CONTROLSD_FIXTURE_PROOF/rustc.txt\"\n\"$CONTROLSD_FIXTURE_JOB/venv/bin/python\" --version > \"$CONTROLSD_FIXTURE_PROOF/python.txt\"\n\"$CONTROLSD_FIXTURE_JOB/venv/bin/python\" -m pip freeze > \"$CONTROLSD_FIXTURE_PROOF/python-packages.txt\"\ncat /proc/meminfo > \"$CONTROLSD_FIXTURE_PROOF/memory-before.txt\"\ndf -B1 \"$CONTROLSD_FIXTURE_JOB\" \"$CONTROLSD_FIXTURE_ROOT\" > \"$CONTROLSD_FIXTURE_PROOF/disk-before.txt\"\ngit rev-parse HEAD > \"$CONTROLSD_FIXTURE_PROOF/SOURCE_COMMIT\"\ngit ls-files --stage -z > \"$CONTROLSD_FIXTURE_PROOF/source-index-before.nul\"\n# Bind every source file used by this new generator plus the complete relevant\n# schema/card/Params source and data boundary. No model artifacts are executed.\ngit ls-files -z rust/crates/dev-tools rust/crates/card rust/crates/params rust/crates/cereal rust/crates/control-policy openpilot/cereal opendbc_repo/opendbc/car rust/tools rust/Cargo.toml rust/Cargo.lock > \"$CONTROLSD_FIXTURE_PROOF/source-paths.nul\"\nxargs -0 sha256sum < \"$CONTROLSD_FIXTURE_PROOF/source-paths.nul\" > \"$CONTROLSD_FIXTURE_PROOF/source.sha256\"\nfind opendbc_repo/opendbc/dbc -name '*.dbc' -type f -print0 | sort -z | xargs -0 sha256sum > \"$CONTROLSD_FIXTURE_PROOF/dbcs.sha256\"\npython3 \"$CONTROLSD_FIXTURE_PAYLOAD/growth.py\" \"$CONTROLSD_FIXTURE_PROOF\" 2048 missing-original-and-native-fixture-data | tee \"$CONTROLSD_FIXTURE_PROOF/growth-proof.json\"\n/usr/bin/timeout --signal=TERM --kill-after=10s 1200s \"$CONTROLSD_FIXTURE_JOB/venv/bin/python\" \"$CONTROLSD_FIXTURE_PAYLOAD/capture_original.py\" > \"$CONTROLSD_FIXTURE_PROOF/original.stdout\" 2> \"$CONTROLSD_FIXTURE_PROOF/original.stderr\" || { tail -n 60 \"$CONTROLSD_FIXTURE_PROOF/original.stdout\" \"$CONTROLSD_FIXTURE_PROOF/original.stderr\"; exit 1; }\n# Original capture is NEW: failed run39844836422 retained none of it.\n# Complete source/DBC/index receipts before compiling the repaired fixture.\nsha256sum -c \"$CONTROLSD_FIXTURE_PROOF/source.sha256\" > \"$CONTROLSD_FIXTURE_PROOF/original-source-after.txt\"\nsha256sum -c \"$CONTROLSD_FIXTURE_PROOF/dbcs.sha256\" > \"$CONTROLSD_FIXTURE_PROOF/original-dbcs-after.txt\"\ngit ls-files --stage -z > \"$CONTROLSD_FIXTURE_PROOF/original-source-index-after.nul\"\ncmp \"$CONTROLSD_FIXTURE_PROOF/source-index-before.nul\" \"$CONTROLSD_FIXTURE_PROOF/original-source-index-after.nul\"\n\"$CONTROLSD_FIXTURE_JOB/venv/bin/python\" - <<'CONTROLSD_ORIGINAL_CHECKPOINT_PY'\n\"\"\"Actions data-only checkpoint after actual original capture, before native build.\nNo project imports, provider execution or native-generated expectations.\n\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\n\nproof = Path(os.environ['CONTROLSD_FIXTURE_PROOF'])\nroot = Path(os.environ['CONTROLSD_FIXTURE_ROOT'])\ndef seal(path):\n    value = hashlib.sha256()\n    size = lines = 0\n    with path.open('rb') as source:\n        while chunk := source.read(1024 * 1024):\n            value.update(chunk)\n            size += len(chunk)\n            lines += chunk.count(b'\\n')\n    return {'sha256': value.hexdigest(), 'bytes': size, 'lines': lines}\nmanifest_path = proof / 'original-manifest.json'\nmanifest = json.loads(manifest_path.read_text())\nassert manifest['source_commit'] == os.environ['CONTROLSD_FIXTURE_SOURCE_SHA']\nassert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip() == manifest['source_commit']\nassert manifest['sources'] == json.loads((proof / 'source-contract.json').read_text())\nassert manifest['constructor_cases'] == 30 and manifest['constructor_frames'] == 8605\nassert manifest['native_output_used_as_expected'] is False\nassert manifest['scope'] == 'original input constructors only; no controller/daemon/model execution'\nassert isinstance(manifest['requests'], int) and manifest['requests'] > 0\nnames = ['requests.jsonl', 'original.jsonl', 'original-projection.jsonl']\nassert set(manifest['files']) == set(names)\nobserved = {}\nfor name in names:\n    value = seal(proof / name)\n    assert value['sha256'] == manifest['files'][name]['sha256']\n    assert value['bytes'] == manifest['files'][name]['bytes']\n    assert value['lines'] == manifest['requests']\n    observed[name] = value\nfor name, expected in manifest['sources'].items():\n    assert seal(root / name)['sha256'] == expected, name\nfor key in ['providers', 'loaded_project_modules', 'preload_extension_providers']:\n    assert isinstance(manifest[key], dict) and manifest[key], key\n    for name, expected in manifest[key].items():\n        path = Path(name)\n        assert path.is_absolute() and seal(path)['sha256'] == expected, name\nreceipt = {'original_capture_completed': True, 'source_commit': manifest['source_commit'],\n           'original_manifest': seal(manifest_path), 'files': observed,\n           'sources': manifest['sources'],\n           'provider_counts': {key: len(manifest[key]) for key in ['providers', 'loaded_project_modules', 'preload_extension_providers']},\n           'provider_binding_limit': manifest['provider_binding_limit'],\n           'source_index_unchanged': True, 'source_and_dbc_seals_rechecked': True,\n           'native_fixture_comparison_completed': False, 'functional_credit': 0,\n           'reuse_requires_parent_artifact_authentication_and_original_source_provider_review': True}\nwith (proof / 'original-capture-complete.json').open('x') as output:\n    output.write(json.dumps(receipt, indent=2) + '\\n')\nprint(json.dumps(receipt))\nCONTROLSD_ORIGINAL_CHECKPOINT_PY\n# Native compile/tests were not reached successfully; retain the same gates.\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features controlsd-fixture-native --bin generate-controlsd-fixtures --locked\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features controlsd-fixture-native --test controlsd_fixture_generate --locked -- --nocapture > \"$CONTROLSD_FIXTURE_PROOF/focused-tests.log\" 2>&1 || { cat \"$CONTROLSD_FIXTURE_PROOF/focused-tests.log\"; exit 1; }\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features controlsd-fixture-native --lib --bin generate-controlsd-fixtures --test controlsd_fixture_generate --locked -- -D warnings > \"$CONTROLSD_FIXTURE_PROOF/clippy.log\" 2>&1 || { cat \"$CONTROLSD_FIXTURE_PROOF/clippy.log\"; exit 1; }\nsha256sum \"$CARGO_TARGET_DIR/debug/generate-controlsd-fixtures\" > \"$CONTROLSD_FIXTURE_PROOF/native-elf.sha256\"\nldd \"$CARGO_TARGET_DIR/debug/generate-controlsd-fixtures\" > \"$CONTROLSD_FIXTURE_PROOF/native-elf.ldd\"\nawk '$2 == \"=>\" && $3 ~ /^\\// {print $3} $1 ~ /^\\// {print $1}' \"$CONTROLSD_FIXTURE_PROOF/native-elf.ldd\" | sort -u | xargs sha256sum > \"$CONTROLSD_FIXTURE_PROOF/native-providers.sha256\"\nPATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=10s 1200s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o \"$CONTROLSD_FIXTURE_PROOF/native.exec\" \"$CARGO_TARGET_DIR/debug/generate-controlsd-fixtures\" --root \"$CONTROLSD_FIXTURE_ROOT\" --input \"$CONTROLSD_FIXTURE_PROOF/requests.jsonl\" --output \"$CONTROLSD_FIXTURE_PROOF/native.jsonl\" > \"$CONTROLSD_FIXTURE_PROOF/native.stdout\" 2> \"$CONTROLSD_FIXTURE_PROOF/native.stderr\" || { tail -n 60 \"$CONTROLSD_FIXTURE_PROOF/native.stdout\" \"$CONTROLSD_FIXTURE_PROOF/native.stderr\"; exit 1; }\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features controlsd-fixture-native --test controlsd_fixture_generate --locked -- --ignored --exact fresh_original_full_schema_and_float_bits_match_every_generated_packet --nocapture > \"$CONTROLSD_FIXTURE_PROOF/original-native.log\" 2>&1 || { cat \"$CONTROLSD_FIXTURE_PROOF/original-native.log\"; exit 1; }\nsha256sum -c \"$CONTROLSD_FIXTURE_PROOF/native-elf.sha256\" > \"$CONTROLSD_FIXTURE_PROOF/native-elf-after.txt\"\nsha256sum -c \"$CONTROLSD_FIXTURE_PROOF/native-providers.sha256\" > \"$CONTROLSD_FIXTURE_PROOF/native-providers-after.txt\"\nsha256sum -c \"$CONTROLSD_FIXTURE_PROOF/source.sha256\" > \"$CONTROLSD_FIXTURE_PROOF/source-after.txt\"\nsha256sum -c \"$CONTROLSD_FIXTURE_PROOF/dbcs.sha256\" > \"$CONTROLSD_FIXTURE_PROOF/dbcs-after.txt\"\ngit ls-files --stage -z > \"$CONTROLSD_FIXTURE_PROOF/source-index-after.nul\"\ncmp \"$CONTROLSD_FIXTURE_PROOF/source-index-before.nul\" \"$CONTROLSD_FIXTURE_PROOF/source-index-after.nul\"\n\"$CONTROLSD_FIXTURE_JOB/venv/bin/python\" \"$CONTROLSD_FIXTURE_PAYLOAD/verify_gate.py\"\ndf -B1 \"$CONTROLSD_FIXTURE_JOB\" \"$CONTROLSD_FIXTURE_ROOT\" > \"$CONTROLSD_FIXTURE_PROOF/disk-after.txt\"\n"
        },
        {
          "name": "Retain exact-source fixture proof",
          "id": "proof_upload",
          "if": "always()",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "controlsd-fixture-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CONTROLSD_FIXTURE_PROOF }}",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Remove only uploaded and identity-verified private source and cache roots",
          "if": "${{ always() && steps.proof_upload.outcome == 'success' && steps.proof_upload.outputs.artifact-id != '' && steps.proof_upload.outputs.artifact-digest != '' }}",
          "env": {
            "CONTROLSD_FIXTURE_UPLOAD_OUTCOME": "${{ steps.proof_upload.outcome }}",
            "CONTROLSD_FIXTURE_UPLOAD_ID": "${{ steps.proof_upload.outputs.artifact-id }}",
            "CONTROLSD_FIXTURE_UPLOAD_DIGEST": "${{ steps.proof_upload.outputs.artifact-digest }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_CLEANUP_PY'\n\"\"\"Actions cleanup only: never remove private roots without upload and ownership proof.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport shutil\nimport stat\n\nupload_id = os.environ.get('CONTROLSD_FIXTURE_UPLOAD_ID', '')\nupload_digest = os.environ.get('CONTROLSD_FIXTURE_UPLOAD_DIGEST', '')\nif (os.environ.get('CONTROLSD_FIXTURE_UPLOAD_OUTCOME') != 'success'\n        or not re.fullmatch(r'[1-9][0-9]*', upload_id)\n        or not re.fullmatch(r'(?:sha256:)?[0-9a-fA-F]{64}', upload_digest)):\n    raise SystemExit('upload receipt missing/invalid; preserve all private data')\nif not shutil.rmtree.avoids_symlink_attacks:\n    raise SystemExit('safe private cleanup unavailable; preserve all private data')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\njob = Path(os.environ['CONTROLSD_FIXTURE_JOB'])\nsource = Path(os.environ['CONTROLSD_FIXTURE_ROOT'])\nprefix = 'controlsd-fixture-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\n# Validate both roots and the ownership receipt before the first deletion.\nfor path, parent in [(job, runner_temp), (source, workspace)]:\n    if path.parent != parent or not path.name.startswith(prefix) or path.resolve(strict=True) != path:\n        raise SystemExit('private root escaped its owned parent; preserve all private data')\n    info = path.lstat()\n    if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid():\n        raise SystemExit('private root owner/type changed; preserve all private data')\nif source == job or source in job.parents or job in source.parents:\n    raise SystemExit('private roots overlap; preserve all private data')\nreceipt_path = job / '.controlsd-owner.json'\nfd = os.open(receipt_path, os.O_RDONLY | os.O_NOFOLLOW)\nwith os.fdopen(fd, 'r') as receipt:\n    info = os.fstat(receipt.fileno())\n    if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid():\n        raise SystemExit('ownership receipt changed; preserve all private data')\n    owner = json.load(receipt)\nexpected = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n            'workspace': str(workspace), 'runner_temp': str(runner_temp), 'job': str(job), 'source': str(source)}\nfor key, value in expected.items():\n    if owner.get(key) != value:\n        raise SystemExit('ownership receipt binding changed; preserve all private data')\nfor path, key in [(job, 'job_identity'), (source, 'source_identity')]:\n    info = path.lstat()\n    if owner.get(key) != {'dev': info.st_dev, 'ino': info.st_ino, 'uid': info.st_uid}:\n        raise SystemExit('private root identity changed; preserve all private data')\nprint(json.dumps({'artifact_id': upload_id, 'artifact_digest': upload_digest,\n                  'owned_source': str(source), 'owned_job': str(job),\n                  'cleanup_authorized_by_successful_upload': True}), flush=True)\nshutil.rmtree(source)\nshutil.rmtree(job)\nCONTROLSD_CLEANUP_PY\n"
        }
      ]
    }
  }
