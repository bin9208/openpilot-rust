          with source.open(item) as raw, (destination / item.filename).open('xb') as output:\n                shutil.copyfileobj(raw, output, length=1024 * 1024)\n            (destination / item.filename).chmod(0o444)\n    result = verify()\n    result['authenticated_zip_bytes'] = ZIP_BYTES\n    result['authenticated_zip_crc_members'] = 29\n    with (proof / 'original-reuse.json').open('x') as output:\n        output.write(json.dumps(result, indent=2) + '\\n')\n    print(json.dumps({'original_data_reused': True, 'requests': 109, 'crc_members': 29}))\n\n\nif __name__ == '__main__':\n    if len(sys.argv) == 3 and sys.argv[1] == 'import':\n        import_data(sys.argv[2])\n    elif sys.argv[1:] == ['verify']:\n        print(json.dumps(verify(), indent=2))\n    else:\n        raise SystemExit('usage: reuse_original.py import ZIP | verify')\nFIXTURE150_REUSE_ORIGINAL_PY_EOF\nprintf '%s\\n' '4e722d4bf28702d9c9a81e3da6f686a78f00e95ae3234947c5e228265f911069  reuse_original.py' | (cd \"$CONTROLSD_FIXTURE_PAYLOAD\" && sha256sum -c -)\ncp \"$CONTROLSD_FIXTURE_PAYLOAD/reuse_original.py\" \"$CONTROLSD_FIXTURE_PROOF/observer-reuse_original.py\"\n"
