            "FIXTURE_VALIDATION_OUTCOME": "${{ steps.fixture_validation.outcome }}"
          },
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_JOB/tmp/package-proof.py\" <<'FIXTURE150_ALWAYS_PACKAGE_EOF'\n\"\"\"Actions-only bounded raw evidence copy; cleanup requires complete qualification.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport stat\nimport shutil\n\ndef identity(value):\n    # Reading proof may update atime; immutable identity/content fields exclude it.\n    return tuple(getattr(value, 'st_' + name) for name in [\n        'dev', 'ino', 'mode', 'uid', 'gid', 'nlink', 'size', 'mtime_ns', 'ctime_ns'])\n\n\njob = Path(os.environ['CONTROLSD_FIXTURE_JOB']).resolve(strict=True)\nproof = Path(os.environ['CONTROLSD_FIXTURE_PROOF'])\nassert proof == job / 'proof' and proof.resolve(strict=True) == proof\nupload = job / 'upload'\nupload.mkdir(mode=0o700)\nowner = json.loads((job / '.controlsd-owner.json').read_text())\nassert owner['job'] == str(job) and owner['run_id'] == os.environ['GITHUB_RUN_ID']\nassert owner['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']\ninfo = job.lstat()\nassert owner['job_identity'] == {'dev': info.st_dev, 'ino': info.st_ino, 'uid': info.st_uid}\nassert info.st_uid == os.getuid()\nMAX_FILES, MAX_FILE, MAX_TOTAL = 1024, 512 * 1024**2, 1024 * 1024**2\nroster, selected, problems = [], [], []\ntotal = 0\nfor path in sorted(proof.rglob('*')):\n    relative = path.relative_to(proof)\n    item = path.lstat()\n    if stat.S_ISDIR(item.st_mode):\n        continue\n    row = {'path': str(relative), 'bytes': item.st_size, 'included': False}\n    roster.append(row)\n    if (not stat.S_ISREG(item.st_mode) or item.st_uid != os.getuid()\n            or path.resolve(strict=True) != path or item.st_nlink != 1):\n        row['reason'] = 'unsafe type/owner/alias/link'; problems.append(row['reason']); continue\n    if len(selected) >= MAX_FILES or item.st_size > MAX_FILE or total + item.st_size > MAX_TOTAL:\n        row['reason'] = 'raw proof bound exceeded; original retained in owned root'\n        problems.append(row['reason']); continue\n    selected.append((path, relative, item, row))\n    total += item.st_size\n# Exact copy growth plus 1 MiB for receipt/roster; no fixed disk floor.\nneeded = total + 1024**2\nfree = shutil.disk_usage(job).free\nadmission = {'operation': 'bounded-proof-copy', 'available_bytes': free,\n             'planned_growth_bytes': needed, 'selected_bytes': total}\nif needed > free:\n    problems.append('exact selected evidence growth exceeds free space')\n    selected = []\nfor path, relative, before, row in selected:\n    target = upload / 'raw' / relative\n    target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    digest = hashlib.sha256()\n    copied = 0\n    with os.fdopen(fd, 'rb') as stream, target.open('xb') as output:\n        assert identity(os.fstat(stream.fileno())) == identity(before)\n        while chunk := stream.read(1024**2):\n            copied += len(chunk)\n            assert copied <= before.st_size\n            output.write(chunk); digest.update(chunk)\n        assert copied == before.st_size\n        assert identity(os.fstat(stream.fileno())) == identity(before) and identity(path.lstat()) == identity(before)\n    row.update(included=True, sha256=digest.hexdigest())\nvalidation = os.environ.get('FIXTURE_VALIDATION_OUTCOME')\nqualified = validation == 'success' and not problems\ncomplete = proof / 'complete.json'\nif qualified:\n    value = json.loads(complete.read_text())\n    assert value['pass'] is True and value['source_commit'] == os.environ['CONTROLSD_FIXTURE_SOURCE_SHA']\n    assert value['regular_tests_reused']['mode'] == 'explicit_historical_reuse'\n    assert value['fresh_regular_tests_run'] == 0 and value['exact_corpus_audit_passed'] == 1\n    assert value['requests'] == 109 and value['strict_clippy'] is True\n    assert any(r['path'] == 'complete.json' and r['included'] for r in roster)\nreceipt = {'source': os.environ['CONTROLSD_FIXTURE_SOURCE_SHA'], 'validation_outcome': validation,\n           'qualified': qualified, 'all_raw_proof_included': not problems,\n           'problems': problems, 'files': roster, 'copy_growth': admission,\n           'bounds': {'files': MAX_FILES, 'per_file_bytes': MAX_FILE, 'total_bytes': MAX_TOTAL},\n           'retention': 'failure, missing seals, bounds or upload failure keeps both original private roots',\n           'limits': 'raw proof byte seals only; no new behavioral acceptance from packaging'}\n(upload / 'package.json').write_text(json.dumps(receipt, indent=2) + '\\n')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('qualified=' + str(qualified).lower() + '\\n')\nprint(json.dumps({'qualified': qualified, 'problems': problems, 'selected_bytes': total}))\nif validation == 'success' and not qualified:\n    raise SystemExit('successful validation lacks complete raw evidence; retain owned source/cache')\nFIXTURE150_ALWAYS_PACKAGE_EOF\nprintf '%s  %s\\n' '8cb1f6f9a532f529056e9ddefc1fcec4a97df7122b8c030bf06ccf26c0e219cf' \"$CONTROLSD_FIXTURE_JOB/tmp/package-proof.py\" | sha256sum -c -\npython3 \"$CONTROLSD_FIXTURE_JOB/tmp/package-proof.py\"\n"
        },
        {
          "name": "Always upload bounded fixture150 raw proof",
          "id": "proof_upload",
          "if": "${{ always() && env.CONTROLSD_FIXTURE_JOB != '' }}",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "controlsd-fixture-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.CONTROLSD_FIXTURE_JOB }}/upload",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Remove only uploaded and identity-verified private source and cache roots",
          "if": "${{ always() && steps.fixture_validation.outcome == 'success' && steps.package_evidence.outcome == 'success' && steps.package_evidence.outputs.qualified == 'true' && steps.proof_upload.outcome == 'success' && steps.proof_upload.outputs.artifact-id != '' && steps.proof_upload.outputs.artifact-digest != '' }}",
          "env": {
            "CONTROLSD_FIXTURE_UPLOAD_OUTCOME": "${{ steps.proof_upload.outcome }}",
            "CONTROLSD_FIXTURE_UPLOAD_ID": "${{ steps.proof_upload.outputs.artifact-id }}",
            "CONTROLSD_FIXTURE_UPLOAD_DIGEST": "${{ steps.proof_upload.outputs.artifact-digest }}",
            "CONTROLSD_FIXTURE_QUALIFIED": "${{ steps.package_evidence.outputs.qualified }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_CLEANUP_PY'\n\"\"\"Actions cleanup only: never remove private roots without upload and ownership proof.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport shutil\nimport stat\n\nif os.environ.get('CONTROLSD_FIXTURE_QUALIFIED') != 'true':\n    raise SystemExit('qualification missing; preserve all private data')\nupload_id = os.environ.get('CONTROLSD_FIXTURE_UPLOAD_ID', '')\nupload_digest = os.environ.get('CONTROLSD_FIXTURE_UPLOAD_DIGEST', '')\nif (os.environ.get('CONTROLSD_FIXTURE_UPLOAD_OUTCOME') != 'success'\n        or not re.fullmatch(r'[1-9][0-9]*', upload_id)\n        or not re.fullmatch(r'(?:sha256:)?[0-9a-fA-F]{64}', upload_digest)):\n    raise SystemExit('upload receipt missing/invalid; preserve all private data')\nif not shutil.rmtree.avoids_symlink_attacks:\n    raise SystemExit('safe private cleanup unavailable; preserve all private data')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\njob = Path(os.environ['CONTROLSD_FIXTURE_JOB'])\nsource = Path(os.environ['CONTROLSD_FIXTURE_ROOT'])\nprefix = 'controlsd-fixture-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\n# Validate both roots and the ownership receipt before the first deletion.\nfor path, parent in [(job, runner_temp), (source, workspace)]:\n    if path.parent != parent or not path.name.startswith(prefix) or path.resolve(strict=True) != path:\n        raise SystemExit('private root escaped its owned parent; preserve all private data')\n    info = path.lstat()\n    if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid():\n        raise SystemExit('private root owner/type changed; preserve all private data')\nif source == job or source in job.parents or job in source.parents:\n    raise SystemExit('private roots overlap; preserve all private data')\nreceipt_path = job / '.controlsd-owner.json'\nfd = os.open(receipt_path, os.O_RDONLY | os.O_NOFOLLOW)\nwith os.fdopen(fd, 'r') as receipt:\n    info = os.fstat(receipt.fileno())\n    if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid():\n        raise SystemExit('ownership receipt changed; preserve all private data')\n    owner = json.load(receipt)\nexpected = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n            'workspace': str(workspace), 'runner_temp': str(runner_temp), 'job': str(job), 'source': str(source)}\nfor key, value in expected.items():\n    if owner.get(key) != value:\n        raise SystemExit('ownership receipt binding changed; preserve all private data')\nfor path, key in [(job, 'job_identity'), (source, 'source_identity')]:\n    info = path.lstat()\n    if owner.get(key) != {'dev': info.st_dev, 'ino': info.st_ino, 'uid': info.st_uid}:\n        raise SystemExit('private root identity changed; preserve all private data')\nprint(json.dumps({'artifact_id': upload_id, 'artifact_digest': upload_digest,\n                  'owned_source': str(source), 'owned_job': str(job),\n                  'cleanup_authorized_by_successful_upload': True}), flush=True)\nshutil.rmtree(source)\nshutil.rmtree(job)\nCONTROLSD_CLEANUP_PY\n"
        }
      ]
    }
  }
}
