{
  "name": "controlsd fixture native retry using authenticated original data",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/controlsd-fixture-296-once.yml"
      ]
    },
    "workflow_dispatch": null
  },
  "concurrency": {
    "group": "controlsd-fixture-296-${{ github.ref }}",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "controlsd-fixture": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 75,
      "env": {
        "CONTROLSD_FIXTURE_SOURCE_SHA": "55084e65ab94b71ba884ec11e2ce91eb8127bd71",
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "OPENBLAS_NUM_THREADS": "1",
        "RUSTUP_TOOLCHAIN": "1.94.0",
        "CONTROLSD_FIXTURE_ORIGINAL_SOURCE_SHA": "c5e37a69b34d66129ad0ce7c4d79c58a1921227e"
      },
      "steps": [
        {
          "name": "Bootstrap private registered-runner paths",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'CONTROLSD_BOOTSTRAP_PY'\n\"\"\"Actions bootstrap only: admit source growth before allocating private roots.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport tempfile\n\nif os.environ['RUNNER_NAME'] != 'bin-actions':\n    raise SystemExit('registered bin-actions runner required')\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nrunner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\nprefix = 'controlsd-fixture-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.'\ngrowth = 2 * 1024 * 1024 * 1024\nfree = shutil.disk_usage(workspace).free\nadmission = {'path': str(workspace), 'operation': 'source-checkout', 'available_bytes': free, 'planned_growth_bytes': growth}\nprint(json.dumps(admission), flush=True)\nif growth > free:\n    raise SystemExit('source operation growth exceeds available space')\nos.umask(0o077)\njob = Path(tempfile.mkdtemp(prefix=prefix, dir=runner_temp))\nsource = Path(tempfile.mkdtemp(prefix=prefix, dir=workspace))\nfor name in ['tmp', 'proof', 'payload']:\n    (job / name).mkdir(mode=0o700)\ndef identity(path):\n    value = path.lstat()\n    return {'dev': value.st_dev, 'ino': value.st_ino, 'uid': value.st_uid}\nowner = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n         'workspace': str(workspace), 'runner_temp': str(runner_temp),\n         'job': str(job), 'source': str(source),\n         'job_identity': identity(job), 'source_identity': identity(source)}\nreceipt = json.dumps(owner, sort_keys=True) + '\\n'\n(job / '.controlsd-owner.json').write_text(receipt)\n(job / 'proof/ownership.json').write_text(receipt)\n(job / 'proof/growth-source.json').write_text(json.dumps(admission) + '\\n')\nvalues = {'CONTROLSD_FIXTURE_JOB': str(job), 'CONTROLSD_FIXTURE_PAYLOAD': str(job / 'payload'),\n          'CONTROLSD_FIXTURE_PROOF': str(job / 'proof'), 'CONTROLSD_FIXTURE_ROOT': str(source),\n          'CONTROLSD_FIXTURE_CHECKOUT_REL': str(source.relative_to(workspace)),\n          'CARGO_HOME': str(job / 'cargo'), 'RUSTUP_HOME': str(job / 'rustup'),\n          'CARGO_TARGET_DIR': str(job / 'target'), 'PIP_CACHE_DIR': str(job / 'pip'),\n          'XDG_CACHE_HOME': str(job / 'xdg'), 'TMPDIR': str(job / 'tmp')}\nwith open(os.environ['GITHUB_ENV'], 'a') as output:\n    for key, value in values.items():\n        if '\\n' in value or '\\r' in value:\n            raise SystemExit('invalid private path')\n        output.write(key + '=' + value + '\\n')\nprint(json.dumps({'ownership': owner, 'growth_admitted': True}), flush=True)\nCONTROLSD_BOOTSTRAP_PY\n"
        },
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "${{ env.CONTROLSD_FIXTURE_SOURCE_SHA }}",
            "path": "${{ env.CONTROLSD_FIXTURE_CHECKOUT_REL }}",
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          }
        },
        {
          "name": "Stage sealed growth.py",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/growth.py\" <<'FIXTURE_REUSE_GROWTH_PY_EOF'\n\"\"\"Actions disk admission before each named operation; no fixed reserve floor.\"\"\"\nimport json\nfrom pathlib import Path\nimport shutil\nimport sys\npath = Path(sys.argv[1]).resolve()\nwhile not path.exists(): path = path.parent\ngrowth = int(sys.argv[2]) * 1024 * 1024\nfree = shutil.disk_usage(path).free\nprint(json.dumps({'path': str(path), 'operation': sys.argv[3], 'available_bytes': free, 'planned_growth_bytes': growth}), flush=True)\nif growth > free: raise SystemExit('operation growth exceeds available space')\nFIXTURE_REUSE_GROWTH_PY_EOF\nprintf '%s\\n' 'cb62dc88c1a943e576769daee86e228b420bf914818bbfd964a954df6603d64d  growth.py' | (cd \"$CONTROLSD_FIXTURE_PAYLOAD\" && sha256sum -c -)\ncp \"$CONTROLSD_FIXTURE_PAYLOAD/growth.py\" \"$CONTROLSD_FIXTURE_PROOF/observer-growth.py\"\n"
        },
        {
          "name": "Stage sealed native-boundary.sha256",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/native-boundary.sha256\" <<'FIXTURE_REUSE_NATIVE_BOUNDARY_SHA256_EOF'\nf5e1b29a64bce5a0637335e349ab5622a3b1efa60ee1ec5dd66625b39e62f783  rust/crates/dev-tools/src/controlsd_fixture_generate.rs\n4a4f00b454090cb367c9a3023799e263a21129f9a71581fe696ab840465a096f  rust/crates/dev-tools/src/bin/generate_controlsd_fixtures.rs\na322a9b20ebfe9bd62abea5ce6511657a7f613b07258bf7baf0758146d1a9658  rust/crates/dev-tools/tests/controlsd_fixture_generate.rs\n855f00e2e7751b242e5599d30708d1db8340a85675b522c7e83dac00bb24a667  rust/Cargo.lock\n6e0c0b16b667ba577c42a71e55972e77a851a5bb47adb7b56b4942411bbe399e  rust/crates/dev-tools/src/controlsd_fixture_generate/audit.rs\nef36f1cdee47cc3ecf30f50f311b633812a3f9799ae652bcd15fcc14d6976385  rust/crates/dev-tools/src/controlsd_fixture_generate/recipes.rs\n554144bdc2f57e61ea0569130c36783ff3bb14c20a608ab61584207f99e39569  rust/crates/dev-tools/src/controlsd_fixture_generate/wire.rs\nFIXTURE_REUSE_NATIVE_BOUNDARY_SHA256_EOF\nprintf '%s\\n' '1fd5f5bb4a6ef92a08ef5a5c946a88d1bfbff8260601ef2356b911e210ec37d4  native-boundary.sha256' | (cd \"$CONTROLSD_FIXTURE_PAYLOAD\" && sha256sum -c -)\ncp \"$CONTROLSD_FIXTURE_PAYLOAD/native-boundary.sha256\" \"$CONTROLSD_FIXTURE_PROOF/observer-native-boundary.sha256\"\n"
        },
        {
          "name": "Stage sealed native_holds.py",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/native_holds.py\" <<'FIXTURE_REUSE_NATIVE_HOLDS_PY_EOF'\n\"\"\"Actions-only fresh native ELF/ldd-closure holds; no historical provider access.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nimport subprocess\nimport sys\n\n\ndef identity(info):\n    return {name: getattr(info, 'st_' + name) for name in ['dev', 'ino', 'mode', 'uid', 'gid', 'size', 'mtime_ns', 'ctime_ns']}\n\n\ndef digest_fd(fd):\n    value = hashlib.sha256()\n    os.lseek(fd, 0, os.SEEK_SET)\n    while chunk := os.read(fd, 1024 * 1024):\n        value.update(chunk)\n    return value.hexdigest()\n\n\ndef record(alias, fd):\n    canonical = Path(alias).resolve(strict=True)\n    before = os.fstat(fd)\n    assert stat.S_ISREG(before.st_mode)\n    digest = digest_fd(fd)\n    assert identity(os.fstat(fd)) == identity(before)\n    assert identity(canonical.stat()) == identity(before)\n    return {'alias': str(alias), 'canonical': str(canonical), 'identity': identity(before), 'sha256': digest}\n\n\ndef run():\n    proof = Path(os.environ['CONTROLSD_FIXTURE_PROOF']).resolve(strict=True)\n    root = Path(os.environ['CONTROLSD_FIXTURE_ROOT']).resolve(strict=True)\n    binary = Path(os.environ['CARGO_TARGET_DIR']) / 'debug/generate-controlsd-fixtures'\n    assert binary.resolve(strict=True).is_relative_to(Path(os.environ['CARGO_TARGET_DIR']).resolve(strict=True))\n    assert binary.stat().st_uid == os.getuid()\n    with binary.open('rb') as stream:\n        header = stream.read(20)\n    assert header[:6] == b'\\x7fELF\\x02\\x01' and int.from_bytes(header[18:20], 'little') == 62\n    ldd = subprocess.check_output(['/usr/bin/ldd', str(binary)], text=True)\n    (proof / 'native-elf.ldd').write_text(ldd)\n    assert 'not found' not in ldd\n    providers = []\n    for line in ldd.splitlines():\n        match = re.match(r'\\s*(?:\\S+\\s+=>\\s+)?(/\\S+)\\s+\\(0x[0-9a-fA-F]+\\)\\s*$', line)\n        if match:\n            providers.append(match[1])\n        else:\n            assert re.fullmatch(r'\\s*linux-vdso\\.so\\.\\d+\\s+\\(0x[0-9a-fA-F]+\\)\\s*', line), line\n    assert providers\n    aliases = sorted(set([str(binary), '/usr/bin/strace', '/usr/bin/timeout', *providers]))\n    opened = []\n    try:\n        for alias in aliases:\n            opened.append((alias, os.open(Path(alias).resolve(strict=True), os.O_RDONLY | os.O_NOFOLLOW)))\n        held_binary = next(fd for alias, fd in opened if alias == str(binary))\n        held_header = os.pread(held_binary, 20, 0)\n        assert held_header[:6] == b'\\x7fELF\\x02\\x01' and int.from_bytes(held_header[18:20], 'little') == 62\n        before = [record(alias, fd) for alias, fd in opened]\n        (proof / 'native-holds-before.json').write_text(json.dumps(before, indent=2) + '\\n')\n        argv = ['/usr/bin/timeout', '--signal=TERM', '--kill-after=10s', '1200s',\n                '/usr/bin/strace', '-f', '-qq', '-s', '65535', '-e', 'trace=execve,execveat',\n                '-o', str(proof / 'native.exec'), str(binary), '--root', str(root),\n                '--input', str(proof / 'requests.jsonl'), '--output', str(proof / 'native.jsonl')]\n        result = None\n        try:\n            with (proof / 'native.stdout').open('xb') as out, (proof / 'native.stderr').open('xb') as err:\n                result = subprocess.run(argv, env={**os.environ, 'PATH': '/nonexistent'}, stdout=out, stderr=err)\n        finally:\n            # Descriptor-held identities/digests bracket even a nonzero native exit.\n            hold_error = None\n            try:\n                after = [record(alias, fd) for alias, fd in opened]\n            except (OSError, AssertionError) as error:\n                after = []\n                hold_error = repr(error)\n            receipt = {'pass': before == after and result is not None and result.returncode == 0,\n                       'returncode': None if result is None else result.returncode,\n                       'before': before, 'after': after, 'providers': sorted(set(providers)),\n                       'hold_error': hold_error,\n                       'coverage': 'fresh ELF, strace, timeout and fresh ldd-resolved DSOs; FDs held across CLI',\n                       'limits': 'ldd closure, not an independent complete /proc mappings or pre-dlopen observation'}\n            (proof / 'native-holds-after.json').write_text(json.dumps(receipt, indent=2) + '\\n')\n        assert receipt['pass'], receipt\n    finally:\n        for _, fd in opened:\n            os.close(fd)\n\n\ndef verify():\n    proof = Path(os.environ['CONTROLSD_FIXTURE_PROOF']).resolve(strict=True)\n    receipt = json.loads((proof / 'native-holds-after.json').read_text())\n    assert receipt['pass'] is True and receipt['returncode'] == 0\n    assert receipt['before'] == receipt['after']\n    for expected in receipt['after']:\n        alias = expected['alias']\n        fd = os.open(Path(alias).resolve(strict=True), os.O_RDONLY | os.O_NOFOLLOW)\n        try:\n            assert record(alias, fd) == expected, alias\n        finally:\n            os.close(fd)\n    return receipt\n\n\nif __name__ == '__main__':\n    if sys.argv[1:] == ['run']:\n        run()\n    elif sys.argv[1:] == ['verify']:\n        print(json.dumps(verify(), indent=2))\n    else:\n        raise SystemExit('usage: native_holds.py run | verify')\nFIXTURE_REUSE_NATIVE_HOLDS_PY_EOF\nprintf '%s\\n' '97ae1a70c54675bf53349453b421cce8acc3b94264b2b84292caccf1d669e1f6  native_holds.py' | (cd \"$CONTROLSD_FIXTURE_PAYLOAD\" && sha256sum -c -)\ncp \"$CONTROLSD_FIXTURE_PAYLOAD/native_holds.py\" \"$CONTROLSD_FIXTURE_PROOF/observer-native_holds.py\"\n"
        },
        {
          "name": "Stage sealed repair-source.sha256",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/repair-source.sha256\" <<'FIXTURE_REUSE_REPAIR_SOURCE_SHA256_EOF'\neecf9b4061858547b6081db26c2b614018e9e71b67b64084045cb2aefbb7827d  rust/crates/dev-tools/src/controlsd_fixture_generate/parameters.rs\ncf61616d6d1677730c7f66f2cd3de8c0416177e08861bfb1a4fb5f7a8476277f  rust/crates/dev-tools/src/control_failures_check/fixtures.rs\nFIXTURE_REUSE_REPAIR_SOURCE_SHA256_EOF\nprintf '%s\\n' '1b87646f6fb23b02f70354d2f2e5cefb2e12b3a396594871d8d67b2f3c318f59  repair-source.sha256' | (cd \"$CONTROLSD_FIXTURE_PAYLOAD\" && sha256sum -c -)\ncp \"$CONTROLSD_FIXTURE_PAYLOAD/repair-source.sha256\" \"$CONTROLSD_FIXTURE_PROOF/observer-repair-source.sha256\"\n"
        },
        {
          "name": "Stage sealed resources.py",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/resources.py\" <<'FIXTURE_REUSE_RESOURCES_PY_EOF'\n\"\"\"Actions fixture receipt only; measured resources, no fixed memory/reserve floor.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport sys\n\nproof = Path(os.environ['CONTROLSD_FIXTURE_PROOF'])\nphase = sys.argv[1]\nassert phase in ['before', 'after']\ndef text(path):\n    try:\n        return Path(path).read_text()\n    except OSError as error:\n        return {'unavailable': str(error)}\ngroups = {}\nfor line in Path('/proc/self/cgroup').read_text().splitlines():\n    if line.startswith('0::'):\n        current = Path('/sys/fs/cgroup') / line[3:].lstrip('/')\n        while current.is_relative_to(Path('/sys/fs/cgroup')):\n            groups[str(current)] = {name: text(current / name) for name in [\n                'memory.current', 'memory.peak', 'memory.max', 'memory.events', 'cpu.max', 'pids.current']}\n            if current == Path('/sys/fs/cgroup'):\n                break\n            current = current.parent\nvalue = {'phase': phase, 'exit_code': None if phase == 'before' else int(sys.argv[2]),\n         'runner': os.environ['RUNNER_NAME'], 'host_arch': os.uname().machine,\n         'cpu_count': os.cpu_count(), 'cpu_affinity': sorted(os.sched_getaffinity(0)),\n         'meminfo': text('/proc/meminfo'), 'loadavg': text('/proc/loadavg'),\n         'os_release': text('/etc/os-release'), 'cgroups': groups,\n         'disks': {name: shutil.disk_usage(os.environ[name])._asdict() for name in [\n             'CONTROLSD_FIXTURE_JOB', 'CONTROLSD_FIXTURE_ROOT', 'CARGO_TARGET_DIR'] if Path(os.environ[name]).exists()},\n         'limits': 'before/after snapshots and kernel peaks; shared cgroup counters are not exclusive per-operation attribution',\n         'working_set_admission': 'no invented 2/4/8 GiB memory minimum; concurrency remains two Cargo jobs',\n         'growth_estimates': {'private_toolchain_MiB': 2048, 'fresh_native_target_MiB': 8192, 'proof_MiB': 2048}}\nif phase == 'after':\n    previous = json.loads((proof / 'resources-before.json').read_text())\n    def events(raw):\n        return {line.split()[0]: int(line.split()[1]) for line in raw.splitlines()}\n    value['memory_event_deltas'] = {}\n    for name, entry in groups.items():\n        old = previous['cgroups'].get(name, {}).get('memory.events')\n        new = entry['memory.events']\n        if isinstance(old, str) and isinstance(new, str):\n            a, b = events(old), events(new)\n            value['memory_event_deltas'][name] = {key: b[key] - a.get(key, 0) for key in b}\nwith (proof / ('resources-' + phase + '.json')).open('x') as output:\n    output.write(json.dumps(value, indent=2) + '\\n')\nFIXTURE_REUSE_RESOURCES_PY_EOF\nprintf '%s\\n' '6751e35dcf8dd756cfd39f7d8f152e131b02c91453d5142ba4353d8b0bfc9fae  resources.py' | (cd \"$CONTROLSD_FIXTURE_PAYLOAD\" && sha256sum -c -)\ncp \"$CONTROLSD_FIXTURE_PAYLOAD/resources.py\" \"$CONTROLSD_FIXTURE_PROOF/observer-resources.py\"\n"
        },
        {
          "name": "Stage sealed reuse_original.py",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$CONTROLSD_FIXTURE_PAYLOAD/reuse_original.py\" <<'FIXTURE_REUSE_REUSE_ORIGINAL_PY_EOF'\n\"\"\"Actions-only inert import/audit. Never import project code or open old providers.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path, PurePosixPath\nimport shutil\nimport stat\nimport subprocess\nimport sys\nimport zipfile\n\nORIGINAL_SOURCE = 'c5e37a69b34d66129ad0ce7c4d79c58a1921227e'\nZIP_SHA = '8a3a8f5997825fdc637db941348a24087a0763382ee4471653257e22ccb4e558'\nZIP_BYTES = 8211608\nMANIFEST_SHA = 'f8fbe6bf1b4923c7a2b15f651afc5359c4bf5eb856a1db6e19f9077a782a0abe'\nFILES = {\n    'requests.jsonl': ('eb2e7d93755b76757b6d80f78dcddfba91cf9c88e1c0175b4f0683c7c1e006a9', 310125),\n    'original.jsonl': ('82f4c68cdfc6f34b01ebbb8e555c92cc53abe4a2043f3bf0497ba0585784a9a3', 71583219),\n    'original-projection.jsonl': ('e95b1ae6c1eabb9a38a1896d6fa2dd8b5ef954f6b1a24765f234ad848bcb8b39', 154773853),\n}\nMEMBERS = set('''SOURCE_COMMIT dbc-stage.stderr dbc-stage.stdout dbcs.sha256 disk-before.txt\ngrowth-build.json growth-proof.json growth-source.json growth-tools.json memory-before.txt\noriginal-capture-complete.json original-dbcs-after.txt original-manifest.json\noriginal-projection.jsonl original-source-after.txt original-source-index-after.nul\noriginal.jsonl original.stderr original.stdout ownership.json python-packages.txt python.txt\nrequests.jsonl rustc.txt rustup-installer.sha256 source-contract.json source-index-before.nul\nsource-paths.nul source.sha256'''.split())\n\n\ndef seal(path):\n    value = hashlib.sha256()\n    size = lines = 0\n    with Path(path).open('rb') as source:\n        while chunk := source.read(1024 * 1024):\n            value.update(chunk)\n            size += len(chunk)\n            lines += chunk.count(b'\\n')\n    return {'sha256': value.hexdigest(), 'bytes': size, 'lines': lines}\n\n\ndef paths():\n    return (Path(os.environ['CONTROLSD_FIXTURE_ROOT']).resolve(strict=True),\n            Path(os.environ['CONTROLSD_FIXTURE_PROOF']).resolve(strict=True))\n\n\ndef git(root, *args):\n    return subprocess.check_output(['git', *args], cwd=root)\n\n\ndef verify():\n    root, proof = paths()\n    historical = proof / 'historical-original'\n    source = os.environ['CONTROLSD_FIXTURE_SOURCE_SHA']\n    assert os.environ['CONTROLSD_FIXTURE_ORIGINAL_SOURCE_SHA'] == ORIGINAL_SOURCE\n    assert len(source) == 40 and all(c in '0123456789abcdef' for c in source)\n    assert git(root, 'rev-parse', 'HEAD').decode().strip() == source\n    assert not git(root, 'status', '--porcelain', '--untracked-files=no')\n    manifest_path = proof / 'original-manifest.json'\n    assert seal(manifest_path)['sha256'] == MANIFEST_SHA\n    manifest = json.loads(manifest_path.read_text())\n    checkpoint = json.loads((historical / 'original-capture-complete.json').read_text())\n    assert manifest['source_commit'] == ORIGINAL_SOURCE == checkpoint['source_commit']\n    assert manifest['requests'] == 109 and type(manifest['requests']) is int\n    assert manifest['constructor_cases'] == 30 and manifest['constructor_frames'] == 8605\n    assert manifest['native_output_used_as_expected'] is False\n    assert manifest['scope'] == 'original input constructors only; no controller/daemon/model execution'\n    assert checkpoint['original_capture_completed'] is True\n    assert checkpoint['source_index_unchanged'] is True\n    assert checkpoint['source_and_dbc_seals_rechecked'] is True\n    assert checkpoint['native_fixture_comparison_completed'] is False\n    assert checkpoint['original_manifest']['sha256'] == MANIFEST_SHA\n    assert (historical / 'SOURCE_COMMIT').read_text().strip() == ORIGINAL_SOURCE\n    assert (historical / 'source-index-before.nul').read_bytes() == (historical / 'original-source-index-after.nul').read_bytes()\n    for name in ['original-source-after.txt', 'original-dbcs-after.txt']:\n        lines = (historical / name).read_text().splitlines()\n        assert lines and all(line.endswith(': OK') for line in lines), name\n    assert set(manifest['files']) == set(FILES)\n    for name, (digest, size) in FILES.items():\n        observed = seal(proof / name)\n        assert observed == {'sha256': digest, 'bytes': size, 'lines': 109}, name\n        assert manifest['files'][name] == {'sha256': digest, 'bytes': size}, name\n        assert checkpoint['files'][name] == observed, name\n    assert manifest['sources'] == json.loads((historical / 'source-contract.json').read_text())\n    old_root = PurePosixPath(json.loads((historical / 'ownership.json').read_text())['source'])\n    assert old_root.is_absolute()\n    loaded = manifest['loaded_project_modules']\n    assert len(loaded) == 177\n    remapped = {}\n    for old_path, expected in loaded.items():\n        # Pure string remapping: never stat/open/dlopen old absolute paths.\n        relative = PurePosixPath(old_path).relative_to(old_root)\n        assert relative.parts and '..' not in relative.parts\n        name = str(relative)\n        current = root / name\n        assert current.resolve(strict=True).is_relative_to(root)\n        assert name not in remapped\n        assert seal(current)['sha256'] == expected, name\n        assert hashlib.sha256(git(root, 'show', source + ':' + name)).hexdigest() == expected, name\n        remapped[name] = expected\n    for name, expected in manifest['sources'].items():\n        assert remapped[name] == expected and seal(root / name)['sha256'] == expected\n    counts = {'providers': 38, 'preload_extension_providers': 12, 'loaded_project_modules': 177}\n    assert checkpoint['provider_counts'] == counts\n    for key, count in counts.items():\n        assert len(manifest[key]) == count\n    assert checkpoint['provider_binding_limit'] == manifest['provider_binding_limit']\n    # Original provider receipts are historical strings/data, never live bindings.\n    ops = {}\n    with (proof / 'requests.jsonl').open() as stream:\n        for line in stream:\n        