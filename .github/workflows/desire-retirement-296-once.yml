name: 296 desire same-ELF full absence and independent raw CLI proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/desire-retirement-296-once.yml
permissions:
  contents: read
jobs:
  desire-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE: 1de0b0d7fbe86e6855d58c8fa9dbb038b5d44126
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 1de0b0d7fbe86e6855d58c8fa9dbb038b5d44126
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
    - name: Admit exact source and install full pair prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/desire-native-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Build one current desire checker and actual probe ELF pair
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/desire-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-desire --example desire_probe --locked 2>&1 | tee
        "$proof/probe-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --bin
        check-desire-reference-native --locked 2>&1 | tee "$proof/checker-build.log"

        sha256sum rust/target/debug/examples/desire_probe rust/target/debug/check-desire-reference-native > "$proof/ELFS.sha256"

        '
    - name: Require complete original-only same-ELF absent corpus and raw CLI admissions
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/desire-native-296"

        export DESIRE_REFERENCE_CHECKER="$GITHUB_WORKSPACE/rust/target/debug/check-desire-reference-native"

        export DESIRE_REFERENCE_PROBE="$GITHUB_WORKSPACE/rust/target/debug/examples/desire_probe"

        export DESIRE_REFERENCE_RETIREMENT_OUTPUT="$proof/retirement"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --lib
        --test desire_reference_check --test desire_reference_retirement --locked -- --nocapture 2>&1 | tee "$proof/controller-tests.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features desire-reference-native --lib
        --bin check-desire-reference-native --test desire_reference_check --test desire_reference_retirement --locked -- -D
        warnings 2>&1 | tee "$proof/clippy.log"

        python - <<''STAGE''

        import base64,os

        from pathlib import Path

        (Path(os.environ[''RUNNER_TEMP''])/''desire-native-296/cli-capture.py'').write_bytes(base64.b64decode(''''))

        STAGE

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python "$proof/cli-capture.py" --original-script "$GITHUB_WORKSPACE/rust/tools/check_desire_reference.py" --checker
        "$DESIRE_REFERENCE_CHECKER" --probe "$DESIRE_REFERENCE_PROBE" --python "$(command -v python)" --workspace "$GITHUB_WORKSPACE"
        --output "$proof/cli" --include-valid > "$proof/cli-capture.stdout" 2> "$proof/cli-capture.stderr"

        sha256sum --check "$proof/ELFS.sha256"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: desire-retirement-preproof-296
        path: ${{ runner.temp }}/desire-native-296/
        if-no-files-found: error
