name: 296 diagnostic-only original kernel92 exceptional-input comparison
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-road-kernel92-exceptional-input-296-once.yml
permissions:
  actions: read
  contents: read
jobs:
  exceptional-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: defb9011df3fca924dca41a703b48ce5ff0c51e0
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: defb9011df3fca924dca41a703b48ce5ff0c51e0
        persist-credentials: false
    - name: Record natural CPU and reserve hosted capacity
      id: cpu
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-exceptional-296\"\nmkdir \"$proof\"\ntest \"$(git rev-parse\
        \ HEAD)\" = \"$EXPECTED_SOURCE\"\nuname -a > \"$proof/uname.txt\"\nlscpu --json > \"$proof/cpu-profile.json\"\ncat\
        \ /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\nif ! awk '/^flags/{n++; if ($0 !~ / avx512f / || $0 !~ / avx512vl /\
        \ || $0 !~ / avx512bw / || $0 !~ / avx512dq /) bad=1} END{exit(n==0 || bad)}' /proc/cpuinfo; then\n  printf '%s\\\
        n' '{\"result\":\"SKIPPED_OBSERVED_AVX512_REQUIREMENTS_UNAVAILABLE\",\"execution\":false,\"diagnostic_only\":true}'\
        \ > \"$proof/skip.json\"\n  printf 'eligible=false\\n' >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$RUNNER_TEMP\" --growth-mib 12288\nprintf 'eligible=true\\n' >> \"$GITHUB_OUTPUT\"\n"
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: 3.12.15
      if: steps.cpu.outputs.eligible == 'true'
    - name: Install bounded compiler/runtime prerequisites
      if: steps.cpu.outputs.eligible == 'true'
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-exceptional-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang libclang-dev libllvm18

        python -m pip freeze > "$proof/providers.before.txt"

        command -v clang | xargs sha256sum > "$proof/clang.sha256"

        command -v objdump | xargs sha256sum > "$proof/objdump.sha256"

        '
    - name: Fetch and verify immutable accepted kernel capture
      if: steps.cpu.outputs.eligible == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-road-exceptional-296\"\ngh api repos/bin9208/openpilot-rust/actions/artifacts/12404776700/zip\
        \ > \"$proof/accepted.zip\"\ntest \"$(stat -c %s \"$proof/accepted.zip\")\" -eq 4391525\nprintf '%s  %s/accepted.zip\\\
        n' ba28ae07b5becc3afe4346db3e86437f9a93aaaf02031c19f83e070ad9c7d93b \"$proof\" | sha256sum --check --strict\ngh api\
        \ repos/bin9208/openpilot-rust/actions/artifacts/12401158574/zip > \"$proof/source.zip\"\ntest \"$(stat -c %s \"$proof/source.zip\"\
        )\" -eq 173295774\nprintf '%s  %s/source.zip\\n' 2ff2e33434f661e7d412751ea45be7d17bf683603cf566f5a48c319c16f6747d\
        \ \"$proof\" | sha256sum --check --strict\ncat > \"$proof/artifact-provenance.json\" <<'JSON'\n{\"accepted_artifact_id\"\
        :12404776700,\"accepted_zip_bytes\":4391525,\"accepted_zip_sha256\":\"ba28ae07b5becc3afe4346db3e86437f9a93aaaf02031c19f83e070ad9c7d93b\"\
        ,\"source_artifact_id\":12401158574,\"source_zip_bytes\":173295774,\"source_zip_sha256\":\"2ff2e33434f661e7d412751ea45be7d17bf683603cf566f5a48c319c16f6747d\"\
        ,\"source_commit\":\"defb9011df3fca924dca41a703b48ce5ff0c51e0\"}\nJSON\nmkdir -p \"$proof/accepted\" \"$proof/catalog/current-host-catalog\"\
        \ \"$proof/fixture/models\"\npython - <<'EXTRACT'\nimport json, os, stat, zipfile\nfrom pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'model-road-exceptional-296'\n\
        def safe(name):\n  q=Path(name)\n  if q.is_absolute() or '..' in q.parts or '\\\\' in name: raise ValueError('unsafe\
        \ archive member')\nwith zipfile.ZipFile(p/'accepted.zip') as z:\n  items=z.infolist()\n  if len(items)!=133 or z.testzip()\
        \ is not None: raise ValueError('accepted capture CRC/roster')\n  total=0\n  for i in items:\n    safe(i.filename)\n\
        \    if i.is_dir(): continue\n    if stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG) or i.file_size>64*1024*1024:\
        \ raise ValueError('accepted member type/size')\n    total+=i.file_size\n    if total>128*1024*1024: raise ValueError('accepted\
        \ expanded size bound')\n    dest=p/'accepted'/i.filename\n    dest.parent.mkdir(parents=True,exist_ok=True)\n   \
        \ with dest.open('xb') as f: f.write(z.read(i))\nwith zipfile.ZipFile(p/'source.zip') as z:\n  items=z.infolist()\n\
        \  if len(items)!=691 or z.testzip() is not None: raise ValueError('source artifact CRC/roster')\n  receipts=[]; pkls=[];\
        \ total=0\n  for i in items:\n    safe(i.filename)\n    if i.is_dir(): continue\n    if stat.S_IFMT(i.external_attr>>16)\
        \ not in (0,stat.S_IFREG) or i.file_size>80*1024*1024: raise ValueError('source member type/size')\n    total+=i.file_size\n\
        \    if total>300*1024*1024: raise ValueError('source expanded size bound')\n    if i.filename.endswith('current-host-catalog-receipt.json'):\
        \ receipts.append(i)\n    if i.filename.endswith('/models/driving_tinygrad.pkl'): pkls.append(i)\n  if len(receipts)!=1\
        \ or len(pkls)!=1 or pkls[0].file_size!=72045323: raise ValueError('source receipt/model roster')\n  receipt=json.loads(z.read(receipts[0]));\
        \ generation=receipt['catalog_generation']\n  graphs=[i for i in items if i.filename.endswith(f'current-host-catalog/{generation}/driving-1344x760/graph.json')]\n\
        \  if len(graphs)!=1: raise ValueError('catalog graph ambiguous/missing')\n  for item,rel in ((receipts[0],Path('catalog/current-host-catalog-receipt.json')),\n\
        \                   (graphs[0],Path('catalog/current-host-catalog')/generation/'driving-1344x760/graph.json'),\n \
        \                  (pkls[0],Path('fixture/models/driving_tinygrad.pkl'))):\n    dest=p/rel; dest.parent.mkdir(parents=True,exist_ok=True)\n\
        \    with dest.open('xb') as f: f.write(z.read(item))\nprint(json.dumps({'accepted_members':133,'accepted_zip_sha256':'ba28ae07b5becc3afe4346db3e86437f9a93aaaf02031c19f83e070ad9c7d93b','source_members':691,'source_zip_sha256':'2ff2e33434f661e7d412751ea45be7d17bf683603cf566f5a48c319c16f6747d','source_commit':os.environ['EXPECTED_SOURCE'],'source_pkls':1}))\n\
        EXTRACT\ncp \"$proof/accepted/road_guarded_copy.py\" \"$proof/road_guarded_copy.py\"\ncp \"$proof/accepted/fp-observe.c\"\
        \ \"$proof/fp-observe.c\"\ncp \"$proof/accepted/fp-observe.so\" \"$proof/fp-observe.so\"\nsha256sum \"$proof/road_guarded_copy.py\"\
        \ \"$proof/accepted/first-kernel/kernel92-original.ll\" \"$proof/accepted/first-kernel/original-kernel92-code.bin\"\
        \ \"$proof/fp-observe.so\" > \"$proof/accepted-pins.sha256\"\npython -m pip freeze > \"$proof/providers.after-fetch.txt\"\
        \ncmp \"$proof/providers.before.txt\" \"$proof/providers.after-fetch.txt\"\n"
    - name: Run bounded isolated original-versus-variant input mutations
      if: steps.cpu.outputs.eligible == 'true'
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-road-exceptional-296"

        mkdir "$proof/output"

        base64 --decode <<''HELPER'' > "$proof/road_exceptional_input.py"

        

        HELPER

        export PROBE_PREFLIGHT="$proof"

        export PROBE_OUTPUT="$proof/output"

        export EXPECTED_SOURCE

        python_bin="$(readlink -f "$(command -v python)")"

        python_root="$(dirname "$(dirname "$python_bin")")"

        export LD_LIBRARY_PATH="$python_root/lib"

        export LLVM_PATH=/usr/lib/x86_64-linux-gnu/libLLVM-18.so

        export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tinygrad_repo:$GITHUB_WORKSPACE/rust/tools"

        sha256sum "$proof/road_exceptional_input.py" "$proof/road_guarded_copy.py" "$proof/fp-observe.c" "$proof/fp-observe.so"
        > "$proof/helper-pins.sha256"

        timeout --signal=TERM --kill-after=5s 180s python "$proof/road_exceptional_input.py" > "$proof/helper.stdout" 2> "$proof/helper.stderr"

        python -m pip freeze > "$proof/providers.after.txt"

        cmp "$proof/providers.before.txt" "$proof/providers.after.txt"

        '
    - name: Preserve mutation outputs and complete diagnostic receipts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: model-road-kernel92-exceptional-input-296-${{ matrix.sample }}
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
        path: '${{ runner.temp }}/model-road-exceptional-296/

          !${{ runner.temp }}/model-road-exceptional-296/accepted.zip

          !${{ runner.temp }}/model-road-exceptional-296/source.zip

          !${{ runner.temp }}/model-road-exceptional-296/fixture/**

          '
    strategy:
      fail-fast: false
      matrix:
        sample:
        - 0
        - 1
