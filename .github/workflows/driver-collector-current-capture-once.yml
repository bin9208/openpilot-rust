name: 296 fresh independent driver collector capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driver-collector-current-capture-once.yml
permissions:
  contents: read
  actions: read
jobs:
  driver-daemon-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: 2ecf3f6813f601ea52e7a61ccf75219952daefa0
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 2ecf3f6813f601ea52e7a61ccf75219952daefa0
    - name: Require exact source, disk room and native prerequisites
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        mkdir -p "$RUNNER_TEMP/driver-daemon-native-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 git-lfs capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned original Python observer dependencies
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2

        '
    - name: Build only driver daemon, model runner, log collector and original IPC bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bin model-run --locked >"$proof/model-run-build.log"
        2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dmonitoringmodeld --locked >"$proof/dmonitoring-build.log"
        2>&1 || { cat "$proof/dmonitoring-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-logmessaged --bin openpilot-logmessaged --locked >"$proof/logmessaged-build.log"
        2>&1 || { cat "$proof/logmessaged-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python" >"$proof/msgq-build.log" 2>&1
        || { cat "$proof/msgq-build.log"; exit 1; }

        '
    - name: Materialize pinned admit_driver_current_pkls.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        base64 --decode <<''PAYLOAD'' > "$proof/admit_driver_current_pkls.py"

        

        PAYLOAD

        printf ''%s  %s\n'' ''9ebe863835d508d5df2dba1ad5f7a91d9a88b55d5b361cb69ebfc2fd98afda75'' "$proof/admit_driver_current_pkls.py"
        | sha256sum -c -

        python -m py_compile "$proof/admit_driver_current_pkls.py"

        '
    - name: Materialize pinned export_driver_capture_catalog.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        base64 --decode <<''PAYLOAD'' > "$proof/export_driver_capture_catalog.py"

        

        PAYLOAD

        printf ''%s  %s\n'' ''75d901c93bd9ee9917e584d11b4c44a779e76ec122e557c310a917b0b4d1f1d7'' "$proof/export_driver_capture_catalog.py"
        | sha256sum -c -

        python -m py_compile "$proof/export_driver_capture_catalog.py"

        '
    - name: Materialize pinned capture_original_driver.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        base64 --decode <<''PAYLOAD'' > "$proof/capture_original_driver.py"

        

        PAYLOAD

        printf ''%s  %s\n'' ''95128a39966819e738e76bcd63e16fe5195385b6c3f17ed1424c10200ee65e1e'' "$proof/capture_original_driver.py"
        | sha256sum -c -

        python -m py_compile "$proof/capture_original_driver.py"

        '
    - name: Admit accepted model reuse before any stored JIT execution
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 512\nif ! git cat-file -e 481ae6fec39ecc68786c4c2813b1205fb4567141^{commit} 2>/dev/null; then\n  git\
        \ fetch --no-tags --depth=1 origin 481ae6fec39ecc68786c4c2813b1205fb4567141\nfi\ngh api /repos/bin9208/openpilot-rust/actions/artifacts/12369678295/zip\
        \ > \"$proof/accepted-models.zip\"\npython -P \"$proof/admit_driver_current_pkls.py\" --archive \"$proof/accepted-models.zip\"\
        \ --root \"$GITHUB_WORKSPACE\" --models \"$RUNNER_TEMP/original-models\" --receipt \"$proof/model-admission.json\"\
        \ > \"$proof/model-admission.txt\"\n"
    - name: Compile only original driver model and warps if target differs
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nif test \"$(cat \"$proof/model-admission.txt\"\
        )\" = reuse; then exit 0; fi\ntest \"$(cat \"$proof/model-admission.txt\")\" = fresh\nrust/tools/check-disk-space\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nmkdir \"$RUNNER_TEMP/original-models\"\npython tinygrad_repo/examples/openpilot/compile3.py\
        \ \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\" \"$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl\"\
        \ > \"$proof/driver-model-compile.log\" 2>&1\npython openpilot/selfdrive/modeld/get_model_metadata.py openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\
        \ > \"$proof/metadata-compile.log\" 2>&1\ncp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl \"$RUNNER_TEMP/original-models/\"\
        \nfor resolution in 1928x1208 1344x760; do\n rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 2048\n python openpilot/selfdrive/modeld/compile_dm_warp.py --camera-resolution \"$resolution\" --warp-to 1440x960\
        \ --output \"$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl\" > \"$proof/warp-${resolution}.log\"\
        \ 2>&1\ndone\n"
    - name: Export held current target catalog
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        python -P "$proof/export_driver_capture_catalog.py" --root "$GITHUB_WORKSPACE" --models "$RUNNER_TEMP/original-models"
        --catalog "$RUNNER_TEMP/native-catalog" --receipt "$proof/current-target-catalog.json" --admission "$proof/model-admission.json"
        > "$proof/catalog-export.stdout" 2> "$proof/catalog-export.stderr"

        rust/target/debug/model-run --check-catalog "$RUNNER_TEMP/native-catalog" > "$proof/catalog-check.log" 2>&1

        sha256sum "$proof/current-target-catalog.json" "$proof/model-admission.json" rust/target/debug/openpilot-dmonitoringmodeld
        rust/target/debug/openpilot-logmessaged > "$proof/held-before.sha256"

        '
    - name: Capture independent original collector four cases once
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH" python -P "$proof/capture_original_driver.py" --root "$GITHUB_WORKSPACE"
        --source-commit "$EXPECTED_SOURCE" --expected-checker-sha256 ea1266dc395dab662319bd3637ad90440989db3d2937756dbf07fbb993520f5b
        --binary "$GITHUB_WORKSPACE/rust/target/debug/openpilot-dmonitoringmodeld" --catalog "$RUNNER_TEMP/native-catalog"
        --models "$RUNNER_TEMP/original-models" --binding "$RUNNER_TEMP/model-msgq-python" --collector "$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged"
        --output "$proof/original-collector-current" > "$proof/original.stdout" 2> "$proof/original.stderr"

        sha256sum -c "$proof/held-before.sha256"

        python -P - <<''VERIFY''

        import json,os,sys

        from pathlib import Path

        proof=Path(os.environ[''RUNNER_TEMP''])/''driver-daemon-native-296''

        sys.path.insert(0,str(proof))

        from admit_driver_current_pkls import host

        from export_driver_capture_catalog import pin

        receipt=json.loads((proof/''current-target-catalog.json'').read_bytes())

        assert host()==receipt[''host'']

        root=Path(os.environ[''GITHUB_WORKSPACE''])

        assert all(pin(root/name)==seal for name,seal in receipt[''exporter_dependency_files''].items())

        assert all(pin(Path(os.environ[''RUNNER_TEMP''])/''original-models''/name)==seal for name,seal in receipt[''models''].items())

        assert all(pin(Path(os.environ[''RUNNER_TEMP''])/''native-catalog''/name)==seal for name,seal in receipt[''catalog_files''].items())

        original=proof/''original-collector-current''

        m=json.loads((original/''reference-manifest.json'').read_bytes())

        assert m[''original_models'']==receipt[''models''] and len(m[''files''])==43

        assert all(pin(original/name)==seal for name,seal in m[''files''].items())

        assert sum(case[''reference_count''] for case in m[''cases''])==14

        report=json.loads((original/''report.json'').read_bytes())

        assert len(report[''runs''])==4 and all(run[''logging''][''result'']==''pass'' for run in report[''runs''])

        VERIFY

        '
    - name: Retain original evidence and exact model payloads
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: driver-collector-current-original-296
        retention-days: 7
        if-no-files-found: error
        path: '${{ runner.temp }}/driver-daemon-native-296/

          !${{ runner.temp }}/driver-daemon-native-296/accepted-models.zip

          ${{ runner.temp }}/original-models/

          ${{ runner.temp }}/native-catalog/

          '
