name: Python Rust 523 exact native model-family caller
'on':
  push:
    branches:
      - codex/feat-523-python-rust
    paths:
      - .github/workflows/python-rust-523-model-family-caller.yml
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
concurrency:
  group: python-rust-523-model-family-caller-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  model-family-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BRIDGE_CATALOG_ROOTS: model-family-preparation-296
      EXPECTED_SOURCE: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      MODEL_FAMILY_STARTUP_MANIFEST_SHA256: 4c54c0d6fb375cec2d64c6ecfeb5ce709f223bbe0aeb0114b68c5a4e184c7416
      MODEL_FAMILY_USBGPU_MANIFEST_SHA256: 8774d6752cabaeba96bacd4bab009a9432f12e5231e8da608285ff5115b21ad8
      MODEL_FAMILY_CAPTURE_SOURCE: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
      CI296_ALIAS_BASENAME: .ci296-source-rust--model-family-retirement
    steps:
      - name: Deny fork source and require GitHub-hosted Linux X64
        shell: bash
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
            == github.repository }}
          CI296_HOST_CONTROL: '1'
        run: 'test "${SOURCE_ALLOWED:-}" = true || { echo ''Fork PR source denied on persistent bin-actions'' >&2;
          exit 1; }

          set -euo pipefail

          test "$GITHUB_ACTIONS" = true

          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust

          test "$RUNNER_ENVIRONMENT" = github-hosted

          test "$RUNNER_OS" = Linux

          test "$RUNNER_ARCH" = X64

          test "$(uname -s)" = Linux

          test "$(uname -m)" = x86_64

          '
        working-directory: ${{ github.workspace }}
      - name: Common owned job temporary paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        env: &id001
          CI296_HOST_CONTROL: '1'
      - name: Allocate private source cache target and local action alias before checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env: *id001
        run: 'set -euo pipefail

          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")

          job=$CI_JOB_TEMP

          owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"

          test "$(cat "$job/owner")" = "$owner"

          umask 077

          mkdir "$job/proof" "$job/home" "$job/cache"

          # Source capacity is checked on the actual source filesystem BEFORE checkout.

          available=$(df -PB1 "$workspace" | awk ''NR == 2 {print $4}'')

          [[ $available =~ ^[0-9]+$ ]]

          required=$((2 * 1024 * 1024 * 1024))

          printf ''{"available_bytes":%s,"planned_source_growth_bytes":%s}\n'' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"

          ((available >= required))

          source_owner=$(mktemp -d "$workspace/.ci296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")

          printf ''%s\n'' "$owner" > "$source_owner/.ci296-owner"

          mkdir "$source_owner/source"

          source="$source_owner/source"

          # Preserve Actions'' real workspace separately. Only Bash consumers see the

          # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.

          printf ''source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n'' "$BASH_ENV"
          "$workspace" "$source" > "$job/ci296-shell-env"

          printf ''%s\n'' "CI296_ACTIONS_WORKSPACE=$workspace" "CI296_SOURCE_OWNER=$source_owner" "CI296_SOURCE_IDENTITY=$(stat
          -c ''%d:%i'' -- "$source_owner")" "CI296_SOURCE=$source" "CI296_CHECKOUT_PATH=${source#"$workspace/"}"
          "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target"
          "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm"
          "BASH_ENV=$job/ci296-shell-env" >> "$GITHUB_ENV"

          printf ''owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n''
          "$owner" "$job" "$workspace" "$source_owner" "$(stat -c ''%d:%i'' -- "$source_owner")" "$source" "$GITHUB_SHA"
          > "$job/proof/ownership.txt"

          df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"

          cat /proc/meminfo > "$job/proof/memory-before.txt"

          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt";
          fi

          printf ''%s\n'' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"


          alias_path="$workspace/$CI296_ALIAS_BASENAME"

          case "$CI296_ALIAS_BASENAME" in .ci296-source-*) ;; *) exit 1 ;; esac

          [[ $CI296_ALIAS_BASENAME != */* ]]

          # -T makes this an exclusive atomic link, never traversal into a stale directory.

          ln -sT -- "$source_owner" "$alias_path"

          printf ''%s\n'' "CI296_SOURCE_ALIAS=$alias_path" "CI296_ALIAS_IDENTITY=$(stat -c ''%d:%i'' -- "$alias_path")"
          "LOCAL_CI_SOURCE_ROOT=$source" >> "$GITHUB_ENV"

          printf ''source_alias=%s\nalias_identity=%s\n'' "$alias_path" "$(stat -c ''%d:%i'' -- "$alias_path")"
          >> "$job/proof/ownership.txt"

          '
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
          lfs: false
          path: ${{ env.CI296_CHECKOUT_PATH }}
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
      - name: Admit exact private source and index
        id: ci296_source_admission
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env: *id001
        run: 'set -euo pipefail

          test "$PWD" = "$CI296_SOURCE"

          test "$GITHUB_WORKSPACE" = "$CI296_SOURCE"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          git diff --exit-code

          git diff --cached --exit-code

          printf ''%s\n'' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"

          git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"

          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime=''UTC
          1970-01-01'' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"

          '
      - name: Require reviewed maintained model-family source
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_HOST_CONTROL: '1'
        run: 'set -euo pipefail

          printf ''%s  %s\n'' b51def7342359305c818f15ec59e9002d6b7c1ee73752dc08e91442444cfface .github/workflows/rust.yml
          | sha256sum --check --strict -

          '
      - name: Configure source-dependent job environment on private paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env:
          CI296_LATE_PYTHONPATH: ${{ env.CI296_SOURCE }}:${{ env.CI296_SOURCE }}/tinygrad_repo:${{ env.CI296_SOURCE
            }}/rust/tools
          CI296_HOST_CONTROL: '1'
        run: 'set -euo pipefail

          printf ''%s\n'' "PYTHONPATH=$CI296_LATE_PYTHONPATH" >> "$GITHUB_ENV"

          '
      - name: Expose provisioned Rust shims
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        env: *id001
      - name: Reserve hosted capacity before dependencies
        shell: bash
        run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
          \ --path \"$GITHUB_WORKSPACE\" --growth-mib 12288\nfor name in check_driver_daemon.py model_logging_capture.py\
          \ model_logging_reference.py check_model_startup.py model_startup_reference.py check_usbgpu_daemon.py;\
          \ do\n test ! -e \"rust/tools/$name\" && test ! -L \"rust/tools/$name\"\ndone\nmkdir \"$RUNNER_TEMP/model-family-preparation-296\"\
          \nsudo apt-get -o \"APT::Architectures=$(dpkg --print-architecture)\" update\nsudo apt-get -o \"APT::Architectures=$(dpkg\
          \ --print-architecture)\" install -y --no-install-recommends g++ clang libclang-dev libllvm18 liblzma-dev\
          \ capnproto libcapnp-dev libzmq3-dev jq\nrustup toolchain install 1.94.0 --profile minimal --component\
          \ clippy,rustfmt\n"
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        working-directory: ${{ env.CI296_SOURCE }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
      - name: Keep original Python installations private
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        shell: bash
        working-directory: ${{ env.CI296_SOURCE }}
        env: *id001
        run: 'set -euo pipefail

          available=$(df -PB1 "$CI_JOB_TEMP" | awk ''NR == 2 {print $4}'')

          [[ $available =~ ^[0-9]+$ ]]

          ((available >= 512 * 1024 * 1024))

          python -m venv "$CI_JOB_TEMP/venv"

          printf ''%s\n'' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"

          '
      - name: Install dependencies of the separately pending model compiler
        shell: bash
        run: 'set -euo pipefail

          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

          python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
          pytest==9.0.2 requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

          '
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Fail fast on grouped native CLI compile, changed regressions and strict Clippy
        shell: bash
        run: 'set -euo pipefail

          proof="$RUNNER_TEMP/model-family-preparation-296"

          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --bin stage-driver-daemon-fixture
          --bin prepare-model-family-catalog --bin stage-model-family-usb-assets --bin check-driver-daemon --bin
          check-model-startup --bin check-usbgpu-daemon > "$proof/grouped-cli-build.log" 2>&1 || { cat "$proof/grouped-cli-build.log";
          exit 1; }

          cargo test --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --no-run
          --test driver_daemon_retirement --test model_family_prepare --test model_family_retirement --test model_startup_check
          --test usbgpu_daemon_check > "$proof/grouped-integration-compile.log" 2>&1 || { cat "$proof/grouped-integration-compile.log";
          exit 1; }

          cargo test --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --test model_family_retirement
          -- --nocapture > "$proof/grouped-support-tests.log" 2>&1 || { cat "$proof/grouped-support-tests.log";
          exit 1; }

          cargo test --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --lib model_
          -- --nocapture > "$proof/model-family-unit.log" 2>&1 || { cat "$proof/model-family-unit.log"; exit 1;
          }

          cargo test --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --lib driver_daemon_check::
          -- --nocapture > "$proof/driver-unit.log" 2>&1 || { cat "$proof/driver-unit.log"; exit 1; }

          cargo test --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --lib usbgpu_daemon_check::
          -- --nocapture > "$proof/usb-unit.log" 2>&1 || { cat "$proof/usb-unit.log"; exit 1; }

          cargo clippy --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --lib --bin
          stage-driver-daemon-fixture --bin prepare-model-family-catalog --bin stage-model-family-usb-assets --bin
          check-driver-daemon --bin check-model-startup --bin check-usbgpu-daemon --test driver_daemon_retirement
          --test model_family_prepare --test model_family_retirement --test model_startup_check --test usbgpu_daemon_check
          -- -D warnings > "$proof/grouped-clippy.log" 2>&1 || { cat "$proof/grouped-clippy.log"; exit 1; }

          cargo test --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driver-daemon-native --test ci_disk_bootstrap
          --test ci_workflow_policy --test ci_model_catalog_publisher > "$proof/maintained-policy.stdout" 2> "$proof/maintained-policy.stderr"
          || { tail -n 100 "$proof/maintained-policy.stdout" "$proof/maintained-policy.stderr"; exit 1; }

          '
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Build held runtime prerequisites and both C++ peers without original Python bindings
        shell: bash
        run: 'set -euo pipefail

          proof="$RUNNER_TEMP/model-family-preparation-296"

          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-driving-modeld --bin openpilot-driving-modeld --example
          usbgpu_daemon_fixture > "$proof/driving-build.log" 2>&1 || { cat "$proof/driving-build.log"; exit 1; }

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dmonitoringmodeld --bin openpilot-dmonitoringmodeld
          > "$proof/driver-build.log" 2>&1 || { cat "$proof/driver-build.log"; exit 1; }

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-usbgpu --example worker_protocol_fixture > "$proof/worker-build.log"
          2>&1 || { cat "$proof/worker-build.log"; exit 1; }

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-model-runtime --bin model-run --bin offline-llvm-guarded-add
          --bin publish-model-catalog > "$proof/model-run-build.log" 2>&1 || { cat "$proof/model-run-build.log";
          exit 1; }

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-dev-tools --features driving-daemon-native --bin stage-driving-daemon-fixture
          --bin generate-services-header > "$proof/stager-build.log" 2>&1 || { cat "$proof/stager-build.log"; exit
          1; }

          mkdir "$proof/peer"

          rust/target/debug/generate-services-header > "$proof/peer/services.h"

          g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
          msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driving-daemon-peer"
          > "$proof/peer-build.log" 2>&1 || { cat "$proof/peer-build.log"; exit 1; }

          sha256sum rust/target/debug/openpilot-driving-modeld rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/examples/usbgpu_daemon_fixture
          rust/target/debug/examples/worker_protocol_fixture "$proof/peer/driving-daemon-peer" > "$proof/held-elfs.sha256"


          g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driver_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
          msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driver-daemon-peer"
          > "$proof/driver-peer-build.log" 2>&1 || { cat "$proof/driver-peer-build.log"; exit 1; }

          cargo build --manifest-path rust/Cargo.toml --locked --config profile.dev.package.sha2.opt-level=3 --config
          profile.test.package.sha2.opt-level=3 -p openpilot-logmessaged --bin openpilot-logmessaged > "$proof/collector-build.log"
          2>&1 || { cat "$proof/collector-build.log"; exit 1; }

          '
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          }}
        working-directory: ${{ env.CI296_SOURCE }}
      - name: Bind same-source explicit helper for all affected catalog exports
        id: bridge-bind
        shell: bash
        run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/bridge-proof-296\"\nmkdir \"$proof\"\ntest \"$(git rev-parse\
          \ HEAD)\" = \"$EXPECTED_SOURCE\"\ntest -n \"$LLVM_PATH\" && test -s \"$LLVM_PATH\"\nrustc -Vv > \"$proof/rustc-version.txt\"\
          \ncargo -V > \"$proof/cargo-version.txt\"\ncargo clippy -V > \"$proof/clippy-version.txt\"\nhelper=$(readlink\
          \ -f \"$GITHUB_WORKSPACE/rust/target/debug/offline-llvm-guarded-add\")\ntest -x \"$helper\"\ndigest=$(sha256sum\
          \ \"$helper\" | cut -d' ' -f1)\nprintf 'MODEL_LLVM_GUARDED_ADD_BINARY=%s\\nMODEL_LLVM_GUARDED_ADD_SHA256=%s\\\
          n' \"$helper\" \"$digest\" >> \"$GITHUB_ENV\"\n# Bind the optional publisher only through explicit step\
          \ outputs.\npublisher=$(readlink -f \"$GITHUB_WORKSPACE/rust/target/debug/publish-model-catalog\")\ntest\
          \ -x \"$publisher\" && test -f \"$publisher\" && test ! -L \"$publisher\"\npublisher_sha=$(sha256sum \"\
          $publisher\" | cut -d' ' -f1)\nprintf 'catalog-publisher-binary=%s\\ncatalog-publisher-sha256=%s\\n' \"\
          $publisher\" \"$publisher_sha\" >> \"$GITHUB_OUTPUT\"\nprintf '%s\\n' \"$helper\" \"$(readlink -f \"$LLVM_PATH\"\
          )\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/guarded_add.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/bin/offline-llvm-guarded-add.rs\"\
          \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/owned_outputs.rs\" \"$GITHUB_WORKSPACE/rust/crates/model-runtime/src/lib.rs\"\
          \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/Cargo.toml\" \"$GITHUB_WORKSPACE/rust/Cargo.toml\" \"\
          $GITHUB_WORKSPACE/rust/Cargo.lock\" \"$GITHUB_WORKSPACE/rust/rust-toolchain.toml\" \"$GITHUB_WORKSPACE/rust/tools/build_model_pipelines.py\"\
          \ \"$GITHUB_WORKSPACE/rust/tools/model_export/native.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/capture.py\"\
          \ \"$GITHUB_WORKSPACE/rust/tools/model_export/compile.py\" \"$GITHUB_WORKSPACE/rust/tools/model_export/schema.py\"\
          \ \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_current_catalog.rs\" \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/model_family_prepare/catalog.rs\"\
          \ \"$GITHUB_WORKSPACE/rust/crates/model-runtime/tests/catalog.rs\" > \"$proof/binding-paths.txt\"\nif\
          \ test -n \"${MODEL_BRIDGE_CATALOG_TEST_BINARY:-}\"; then\n printf '%s\\n' \"$MODEL_BRIDGE_CATALOG_TEST_BINARY\"\
          \ >> \"$proof/binding-paths.txt\"\nfi\nprintf '%s\\n' \"$(readlink -f \"$(command -v python)\")\" \"$GITHUB_WORKSPACE/rust/crates/dev-tools/src/driver_daemon_check.rs\"\
          \ \"$GITHUB_WORKSPACE/rust/tools/model_export/publish.py\" >> \"$proof/binding-paths.txt\"\nprintf '%s\\\
          n' \"$publisher\" >> \"$proof/binding-paths.txt\"\ngit ls-files -- rust/crates/model-runtime/src rust/crates/model-runtime/Cargo.toml\
          \ rust/Cargo.toml rust/Cargo.lock rust/rust-toolchain.toml rust/crates/dev-tools/src/model_family_prepare/catalog.rs\
          \ rust/crates/dev-tools/src/driver_daemon_current_catalog.rs | while IFS= read -r path; do\n printf '%s/%s\\\
          n' \"$GITHUB_WORKSPACE\" \"$path\"\ndone >> \"$proof/binding-paths.txt\"\nwhile IFS= read -r path; do\
          \ sha256sum \"$path\"; done < \"$proof/binding-paths.txt\" > \"$proof/bindings.before.sha256\"\nwhile\
          \ IFS= read -r path; do stat --printf '%n:%d:%i:%s:%f:%y:%z\\n' \"$path\"; done < \"$proof/binding-paths.txt\"\
          \ > \"$proof/identities.before.txt\"\nlscpu --json > \"$proof/lscpu.json\"\ncat /proc/cpuinfo > \"$proof/proc-cpuinfo.txt\"\
