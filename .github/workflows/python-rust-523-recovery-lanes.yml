name: Python Rust 523 recovery functional and exec lanes
'on':
  push:
    branches:
      - codex/feat-523-python-rust
    paths:
      - .github/workflows/python-rust-523-recovery-lanes.yml
      - tools/ci/recovery_tracer_474.sh
      - tools/ci/prepare-cold-strace-560
      - tools/ci/cold_tracer_launch_560.sh
      - tools/ci/cold_tracer_diagnostic_560.sh
      - tools/ci/fixtures/cold560_exec_inheritance.rs
      - tools/ci/fixtures/strace-6.8-560-*.patch
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: python-rust-523-recovery-lanes-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  recovery:
    name: Recovery 기능과 exec 관측을 같은 소스로 분리 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_HOSTED: '1'
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      RECOVERY474_NONPROVIDER_GROWTH_BYTES: '10200547328'
      RECOVERY474_HELPER_SHA256: 5704296015b6ac6bbf404a5b5ec94ad9421284524b0b2b7464ac7f486b63aed7
    steps:
      - name: Deny fork source and require GitHub-hosted Linux X64
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
          set -euo pipefail
          printf '%s\n' "RECOVERY474_PROVIDER_DEADLINE_EPOCH=$((EPOCHSECONDS+420))" >> "$GITHUB_ENV"
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust
          test "$GH_HOSTED" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          df -PB1 "$GITHUB_WORKSPACE" /tmp
      - name: Common owned Fast job temporary paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
      - name: Allocate private Fast source cache and target before checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          job=$CI_JOB_TEMP
          owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$(cat "$job/owner")" = "$owner"
          umask 077
          mkdir "$job/proof" "$job/home" "$job/cache"
          # Source capacity is checked on the actual source filesystem BEFORE checkout.
          available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
          [[ $available =~ ^[0-9]+$ ]]
          required=$((2 * 1024 * 1024 * 1024))
          printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
          cat "$job/proof/source-growth-before-checkout.json"
          ((available >= required))
          # 같은 filesystem의 동시 잔여 성장: source2+target6+registry2+SDK3+proof1+apt2+reserve0.5+provider0.5 GiB.
          declare -A recovery_growth=() recovery_paths=()
          for entry in "workspace:$workspace:8589934592" "job:$job:7516192768" 'apt:/:2147483648'; do
            label=${entry%%:*}; rest=${entry#*:}; growth=${rest##*:}; path=${rest%:*}
            device=$(stat -c %d -- "$path")
            recovery_growth[$device]=$(( ${recovery_growth[$device]:-0} + growth ))
            recovery_paths[$device]=$path
            printf '%s\t%s\t%s\t%s\n' "$label" "$device" "$path" "$growth" >> "$job/proof/recovery-growth-plan.tsv"
          done
          for device in "${!recovery_growth[@]}"; do
            available=$(df --output=avail -B1 -- "${recovery_paths[$device]}" | awk 'NR==2 {print $1}')
            [[ $available =~ ^[0-9]+$ ]]
            printf '%s\t%s\t%s\n' "$device" "$available" "${recovery_growth[$device]}" >> "$job/proof/recovery-growth-admitted.tsv"
            ((available >= recovery_growth[$device]))
          done
          source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
          mkdir "$source_owner/source"
          source="$source_owner/source"
          # Preserve Actions' real workspace separately. Only Bash consumers see the
          # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
          printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
          printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
          printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
          df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
          cat /proc/meminfo > "$job/proof/memory-before.txt"
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
          printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ${{ env.DIAG_CHECKOUT_PATH }}
          set-safe-directory: false
          clean: false
          lfs: false
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Admit exact private Fast source and Git history
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          test "$PWD" = "$DIAG_SOURCE"
          test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
      - name: Admit provisioned Rust without installing a second toolchain
        id: prepared_rust
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: '"$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" before'
      - name: Install only native recovery host providers
        id: recovery_hosts
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" update
          sudo apt-get -o "APT::Architectures=$(dpkg --print-architecture)" install -y --no-install-recommends build-essential pkg-config capnproto libcapnp-dev tmux util-linux strace binutils dpkg-dev perl patch xz-utils curl jq
        timeout-minutes: 10
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Admit and prepare the unchanged private recovery tracer
        id: recovery_provider
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.prepared_rust.outcome == 'success' && steps.recovery_hosts.outcome == 'success') }}
        timeout-minutes: 4
        working-directory: ${{ env.DIAG_SOURCE }}
        run: /usr/bin/bash "$GITHUB_WORKSPACE/tools/ci/recovery_tracer_474.sh" prepare
      - name: Require the original 18 closure and three STOP CONT protocol controls
        id: recovery_provider_controls
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.recovery_provider.outcome == 'success') }}
        timeout-minutes: 8
        working-directory: ${{ env.DIAG_SOURCE }}
        run: /usr/bin/bash "$GITHUB_WORKSPACE/tools/ci/recovery_tracer_474.sh" controls
      - name: Build and select one exact native recovery cohort
        id: recovery_build
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.prepared_rust.outcome == 'success' && steps.recovery_hosts.outcome == 'success') }}
        run: |
          set -euo pipefail
          export OPENPILOT_CI_PREPARED_RUST_ROOT="$CI_PREPARED_RUST_ROOT" OPENPILOT_CI_PREPARED_RUST_MANIFEST="$CI_PREPARED_RUST_MANIFEST"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 6144
          cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery -p openpilot-process-supervision --bins --examples --locked
          proof="$CI_JOB_TEMP/proof/recovery-build"
          mkdir "$proof"
          git rev-parse HEAD > "$proof/SOURCE_COMMIT"
          private="$CI_JOB_TEMP/recovery-private-root"
          test ! -e "$private"
          mkdir -p "$private/openpilot/selfdrive/carrot/recovery" "$private/openpilot/common" "$private/rust/tools"
          cp -a openpilot/selfdrive/carrot/recovery/server.py "$private/openpilot/selfdrive/carrot/recovery/server.py"
          cp -a openpilot/common/repo_update.py "$private/openpilot/common/repo_update.py"
          cp -a openpilot/selfdrive/carrot/web "$private/openpilot/selfdrive/carrot/web"
          cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --bin list-cargo-tests --bin audit-recovery-exec --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery --lib --no-run --locked --message-format=json > "$proof/cwp-tests.jsonl"
          mapfile -t cwp < <(rust/target/debug/list-cargo-tests "$proof/cwp-tests.jsonl")
          test "${#cwp[@]}" -eq 1 && test -f "${cwp[0]}"
          cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --test recovery_family_frozen --no-run --locked --message-format=json > "$proof/harness-tests.jsonl"
          mapfile -t harness < <(rust/target/debug/list-cargo-tests "$proof/harness-tests.jsonl")
          test "${#harness[@]}" -eq 1 && test -f "${harness[0]}"
          cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib recovery_ --locked
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib --bin audit-recovery-exec --test recovery_family_frozen --locked -- -D warnings
          pty_clippy_status=0
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-carrot-recovery --lib --tests --locked -- -D warnings > "$proof/pty-clippy.stdout" 2> "$proof/pty-clippy.stderr" || pty_clippy_status=$?
          printf '%s\n' "$pty_clippy_status" > "$proof/pty-clippy.status"
          tail -n 40 "$proof/pty-clippy.stdout" "$proof/pty-clippy.stderr"
          test "$pty_clippy_status" -eq 0
          printf '%s\n' "RECOVERY_FAMILY_CHECKOUT_ROOT=$DIAG_SOURCE" "RECOVERY_FAMILY_PRIVATE_ROOT=$private" "RECOVERY_FAMILY_CWP_TEST_BINARY=${cwp[0]}" "RECOVERY_HARNESS=${harness[0]}" "RECOVERY_FAMILY_BINARY=$DIAG_SOURCE/rust/target/debug/openpilot-carrot-recovery" "RECOVERY_FAMILY_ACTIONS_EXAMPLE=$DIAG_SOURCE/rust/target/debug/examples/recovery_actions" "RECOVERY_FAMILY_UPLOAD_EXAMPLE=$DIAG_SOURCE/rust/target/debug/examples/upload" "RECOVERY_FAMILY_PROCESS_CHILD=$DIAG_SOURCE/rust/target/debug/openpilot-process-child" 'RECOVERY_FAMILY_TMUX=/usr/bin/tmux' 'RECOVERY_FAMILY_HISTORICAL_PRESENT=0' >> "$GITHUB_ENV"
          printf '%s\n' "$DIAG_SOURCE/rust/target/debug/openpilot-carrot-recovery" "$DIAG_SOURCE/rust/target/debug/examples/recovery_actions" "$DIAG_SOURCE/rust/target/debug/examples/upload" "$DIAG_SOURCE/rust/target/debug/openpilot-process-child" "${cwp[0]}" /usr/bin/tmux "${harness[0]}" > "$proof/selected-paths.txt"
          while IFS= read -r path; do
            test -f "$path" && test ! -L "$path"
            sha256sum -- "$path"
            stat -c '%d:%i:%s:%a:%u:%g:%Y %n' -- "$path" >> "$proof/selected-before.stat"
            case "$path" in
              "$DIAG_SOURCE/rust/target/debug/examples/recovery_actions"|"$DIAG_SOURCE/rust/target/debug/openpilot-process-child")
                # 원래 actions_effects의 authorized hardlink는 nlink/ctime을 변경한다.
                test "$(stat -c %d -- "$path")" = "$(stat -c %d -- "$CI_JOB_TEMP")"
                stat -c '%h:%Z %n' -- "$path" >> "$proof/authorized-alias-before.stat" ;;
              *) stat -c '%h:%Z %n' -- "$path" >> "$proof/fixed-ctime-before.stat" ;;
            esac
          done < "$proof/selected-paths.txt" > "$proof/selected-before.sha256"
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Run the same selected PTY readiness unit once without ptrace
        id: recovery_pty_untraced
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.recovery_build.outcome == 'success') }}
        timeout-minutes: 1
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          proof="$CI_JOB_TEMP/proof/recovery-pty-untraced"
          mkdir "$proof"
          trap 'code=$?; printf "phase=preflight\noriginal_exit=%s\n" "$code" > "$proof/status"' EXIT
          manifest="$CI_JOB_TEMP/proof/recovery-build/selected-before.sha256"
          sha256sum --check --strict "$manifest" > "$proof/selected-before.check"
          elf=$RECOVERY_FAMILY_CWP_TEST_BINARY
          test -f "$elf" && test -x "$elf" && test ! -L "$elf"
          test "$(readlink -e -- "$elf")" = "$elf"
          before=$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$elf")
          exec {elf_fd}<"$elf"
          held="/proc/$BASHPID/fd/$elf_fd"
          test "$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$held")" = "$before"
          digest=$(sha256sum -- "$held"); digest=${digest%% *}
          printf '%s\t%s\t%s\t%s\n' "$elf" "$held" "$before" "$digest" > "$proof/held-before.tsv"
          finish() {
            local original=$? final=0 path_after= fd_after= path_sha= fd_sha=
            trap - EXIT
            set +e
            path_after=$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$elf") || final=1
            fd_after=$(stat -Lc '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$held") || final=1
            path_sha=$(sha256sum -- "$elf") || final=1; path_sha=${path_sha%% *}
            fd_sha=$(sha256sum -- "$held") || final=1; fd_sha=${fd_sha%% *}
            printf '%s\t%s\t%s\n' "$elf" "$path_after" "$path_sha" > "$proof/path-after.tsv" || final=1
            printf '%s\t%s\t%s\t%s\n' "$elf" "$held" "$fd_after" "$fd_sha" > "$proof/held-after.tsv" || final=1
            [[ $path_after == "$before" && $fd_after == "$before" && $path_sha == "$digest" && $fd_sha == "$digest" ]] || final=1
            sha256sum --check --strict "$manifest" > "$proof/selected-after.check" 2> "$proof/selected-after.stderr" || final=1
            exec {elf_fd}<&- || final=1
            printf 'original_exit=%s\nfinalizer_exit=%s\ntracer_used=false\n' "$original" "$final" > "$proof/status" || final=1
            [[ $original == 0 && $final == 0 ]] || exit 1
          }
          trap finish EXIT
          selector=terminal::pty::tests::exited_leader_remains_reserved_until_owned_descendant_cleanup
          # Execute the held inode; current_exe still identifies the selected CWP ELF.
          printf '%s\0' /usr/bin/timeout --signal=TERM --kill-after=15s 30s "$held" --exact "$selector" --test-threads=1 --nocapture > "$proof/command.nul"
          status=0
          /usr/bin/timeout --signal=TERM --kill-after=15s 30s "$held" --exact "$selector" --test-threads=1 --nocapture > "$proof/unit.stdout" 2> "$proof/unit.stderr" || status=$?
          printf '%s\n' "$status" > "$proof/unit.status"
          tail -n 40 "$proof/unit.stdout" "$proof/unit.stderr"
          test "$status" -eq 0
          test "$(grep -Ec 'PTY474_SLEEP_READY pid=[1-9][0-9]* pgid=[1-9][0-9]* start=[0-9]+ state=S syscall=(35|230) dev=[0-9]+ ino=[1-9][0-9]*$' "$proof/unit.stdout")" -eq 1
          test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof/unit.stdout")" -eq 1
      - name: Run all eight native functional controllers without ptrace
        id: recovery_functional
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.recovery_build.outcome == 'success') }}
        timeout-minutes: 16
        run: |
          set -euo pipefail
          export OPENPILOT_CI_PREPARED_RUST_ROOT="$CI_PREPARED_RUST_ROOT" OPENPILOT_CI_PREPARED_RUST_MANIFEST="$CI_PREPARED_RUST_MANIFEST"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$CI_JOB_TEMP" --growth-mib 512
          proof="$CI_JOB_TEMP/recovery-functional"
          mkdir "$proof"
          export RECOVERY_FAMILY_FROZEN_EVIDENCE="$proof/native"
          status=0
          /usr/bin/timeout --signal=TERM --kill-after=15s 15m "$RECOVERY_HARNESS" --exact eight_native_recovery_controllers_same_elf_present_and_absent --test-threads=1 --nocapture > "$proof/harness.stdout" 2> "$proof/harness.stderr" || status=$?
          printf '%s\n' "$status" > "$proof/harness.status"
          sha256sum --check --strict -- "$CI_JOB_TEMP/proof/recovery-build/selected-before.sha256"
          while IFS= read -r path; do
            stat -c '%d:%i:%s:%a:%u:%g:%Y %n' -- "$path" >> "$proof/selected-after.stat"
            case "$path" in
              "$DIAG_SOURCE/rust/target/debug/examples/recovery_actions"|"$DIAG_SOURCE/rust/target/debug/openpilot-process-child")
                stat -c '%h:%Z %n' -- "$path" >> "$proof/authorized-alias-after.stat" ;;
              *) stat -c '%h:%Z %n' -- "$path" >> "$proof/fixed-ctime-after.stat" ;;
            esac
          done < "$CI_JOB_TEMP/proof/recovery-build/selected-paths.txt"
          cmp "$CI_JOB_TEMP/proof/recovery-build/selected-before.stat" "$proof/selected-after.stat"
          cmp "$CI_JOB_TEMP/proof/recovery-build/fixed-ctime-before.stat" "$proof/fixed-ctime-after.stat"
          test "$status" -eq 0 || { tail -n 100 "$proof/harness.stdout" "$proof/harness.stderr"; exit "$status"; }
          grep -F '1 passed; 0 failed' "$proof/harness.stdout"
          du -sm "$proof" > "$proof/artifact-size-mib.txt"
          test "$(cut -f1 "$proof/artifact-size-mib.txt")" -le 200
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Require actual native PTY HUP KILL descendant cleanup under the private provider
        id: recovery_provider_pty
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.recovery_build.outcome == 'success' && steps.recovery_provider_controls.outcome == 'success') }}
        timeout-minutes: 2
        working-directory: ${{ env.DIAG_SOURCE }}
        run: /usr/bin/bash "$GITHUB_WORKSPACE/tools/ci/recovery_tracer_474.sh" pty
      - name: Run the separate complete exec trace with the same selected ELFs
        id: recovery_trace
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.recovery_build.outcome == 'success') }}
        timeout-minutes: 16
        run: |
          set -euo pipefail
          export OPENPILOT_CI_PREPARED_RUST_ROOT="$CI_PREPARED_RUST_ROOT" OPENPILOT_CI_PREPARED_RUST_MANIFEST="$CI_PREPARED_RUST_MANIFEST"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$CI_JOB_TEMP" --growth-mib 512
          proof="$CI_JOB_TEMP/recovery-trace"
          mkdir "$proof"
          export RECOVERY_FAMILY_FROZEN_EVIDENCE="$proof/native"
          pre_sha=$(rust/target/debug/audit-recovery-exec pre --receipt "$proof/exec-preflight.json" --native-root "$proof/native" --server "$RECOVERY_FAMILY_BINARY" --actions "$RECOVERY_FAMILY_ACTIONS_EXAMPLE" --upload "$RECOVERY_FAMILY_UPLOAD_EXAMPLE" --child "$RECOVERY_FAMILY_PROCESS_CHILD" --cwp "$RECOVERY_FAMILY_CWP_TEST_BINARY" --tmux /usr/bin/tmux --harness "$RECOVERY_HARNESS" --host-path "$PATH")
          [[ "$pre_sha" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$pre_sha" > "$proof/exec-preflight.sha256"
          # The adapter owns the unchanged timeout=900s/KILL-after=15s fresh-root launcher.
          # A failed/missing provider is fatal; never fall back to the stock tracer.
          : > "$proof/harness.stdout"
          : > "$proof/harness.stderr"
          driver_status=0
          /usr/bin/bash "$GITHUB_WORKSPACE/tools/ci/recovery_tracer_474.sh" trace > "$proof/provider-driver.stdout" 2> "$proof/provider-driver.stderr" || driver_status=$?
          printf '%s\n' "$driver_status" > "$proof/provider-driver.status"
          test -f "$proof/harness.status" || printf '125\n' > "$proof/harness.status"
          status=$(cat "$proof/harness.status")
          [[ $status =~ ^[0-9]+$ ]] && ((status<=255))
          sha256sum --check --strict -- "$CI_JOB_TEMP/proof/recovery-build/selected-before.sha256"
          while IFS= read -r path; do
            stat -c '%d:%i:%s:%a:%u:%g:%Y %n' -- "$path" >> "$proof/selected-after.stat"
            case "$path" in
              "$DIAG_SOURCE/rust/target/debug/examples/recovery_actions"|"$DIAG_SOURCE/rust/target/debug/openpilot-process-child")
                stat -c '%h:%Z %n' -- "$path" >> "$proof/authorized-alias-after.stat" ;;
              *) stat -c '%h:%Z %n' -- "$path" >> "$proof/fixed-ctime-after.stat" ;;
            esac
          done < "$CI_JOB_TEMP/proof/recovery-build/selected-paths.txt"
          cmp "$CI_JOB_TEMP/proof/recovery-build/selected-before.stat" "$proof/selected-after.stat"
          cmp "$CI_JOB_TEMP/proof/recovery-build/fixed-ctime-before.stat" "$proof/fixed-ctime-after.stat"
          test "$driver_status" -eq 0 && test "$status" -eq 0 || { tail -n 100 "$proof/harness.stdout" "$proof/harness.stderr" "$proof/provider-driver.stderr"; exit 1; }
          grep -F '1 passed; 0 failed' "$proof/harness.stdout"
          test "$(sha256sum "$proof/exec-preflight.json" | cut -d ' ' -f 1)" = "$pre_sha"
          rust/target/debug/audit-recovery-exec post --receipt "$proof/exec-preflight.json" --receipt-sha256 "$pre_sha" --trace-dir "$proof" --output "$proof/exec-audit.json" --harness-exit "$status"
          # Bind the provider's actual root PID to the existing auditor's parsed
          # first root exec. No trace file/line exclusion or new program rule.
          root_receipt="$CI_JOB_TEMP/proof/recovery-provider-474/trace/inheritance/recovery/inherit.log"
          root_pid=$(sed -n '2s/^COLD560_INHERIT root pid=\([0-9][0-9]*\)$/\1/p' "$root_receipt")
          [[ $root_pid =~ ^[1-9][0-9]*$ ]] && ((root_pid<=4294967295))
          jq --argjson root "$root_pid" --slurpfile pre "$proof/exec-preflight.json" '
            . as $audit |
            ([.attempts[] | select(.pid == $root)] | sort_by(.line)) as $calls |
            ($pre[0].selected.harness | explode) as $program |
            ([$pre[0].selected.harness, "--exact", "eight_native_recovery_controllers_same_elf_present_and_absent", "--test-threads=1", "--nocapture"] | map(explode)) as $argv |
            {passed: (($pre|length) == 1 and $audit.passed == true and
              ($program | all(. > 0 and . < 128)) and ($calls|length) > 0 and
              $calls[0].program == $program and $calls[0].argv == $argv and $calls[0].outcome == "Success"),
             root_pid: $root, expected_harness: $pre[0].selected.harness, first_root_attempt: $calls[0],
             trace_modified: false, extra_program_rule: false}
          ' "$proof/exec-audit.json" > "$proof/direct-root-audit.json"
          jq -e '.passed == true' "$proof/direct-root-audit.json"
          du -sm "$proof" > "$proof/artifact-size-mib.txt"
          test "$(cut -f1 "$proof/artifact-size-mib.txt")" -le 200
        working-directory: ${{ env.DIAG_SOURCE }}
      - name: Seal the complete private provider source SDK and ELF after every trace outcome
        id: recovery_provider_final
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '' && steps.prepared_rust.outcome == 'success' && steps.recovery_hosts.outcome == 'success') }}
        timeout-minutes: 5
        working-directory: ${{ env.DIAG_SOURCE }}
        run: /usr/bin/bash "$GITHUB_WORKSPACE/tools/ci/recovery_tracer_474.sh" after
      - name: Verify read-only Rust SDK contents and identities after maintained checks
        id: prepared_rust_final
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.prepared_rust.outcome == 'success') }}
        working-directory: ${{ env.DIAG_SOURCE }}
        shell: bash
        run: '"$GITHUB_WORKSPACE/rust/tools/prepare-readonly-ci-rust" after'
      - name: Seal Fast source and index after all maintained checks
        id: source_final
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.DIAG_SOURCE != '') }}
        working-directory: ${{ env.DIAG_SOURCE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files -z > "$CI_JOB_TEMP/proof/index-after.bin"
          cmp "$CI_JOB_TEMP/proof/index-before.bin" "$CI_JOB_TEMP/proof/index-after.bin"
          tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-after.sha256"
          cmp "$CI_JOB_TEMP/proof/source-before.sha256" "$CI_JOB_TEMP/proof/source-after.sha256"
          git diff --exit-code
          git diff --cached --exit-code
          df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after.txt"
          cat /proc/meminfo > "$CI_JOB_TEMP/proof/memory-after.txt"
      - name: Retain Fast job ownership evidence
        id: fast_evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && env.CI_JOB_TEMP != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: recovery-native-lanes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_JOB_TEMP }}/proof
            ${{ env.CI_JOB_TEMP }}/recovery-functional
            ${{ env.CI_JOB_TEMP }}/recovery-trace
            ${{ env.CI_JOB_TEMP }}/cold-strace-560/inputs
            ${{ env.CI_JOB_TEMP }}/cold-strace-560/bin
            ${{ env.CI_JOB_TEMP }}/recovery-provider-474
          if-no-files-found: error
          retention-days: 14
      - name: Clean only uploaded private Fast source
        id: fast_source_cleanup
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id
          != '' && steps.fast_evidence.outputs.artifact-digest != '' && env.DIAG_SOURCE_OWNER != '' && steps.source_final.outcome == 'success' && steps.prepared_rust_final.outcome == 'success' && steps.recovery_functional.outcome
          == 'success' && steps.recovery_trace.outcome == 'success' && steps.recovery_provider.outcome == 'success' && steps.recovery_provider_controls.outcome == 'success'
          && steps.recovery_provider_pty.outcome == 'success' && steps.recovery_provider_final.outcome == 'success' && steps.recovery_pty_untraced.outcome == 'success') }}
        working-directory: ${{ github.workspace }}
        env:
          UPLOAD_ID: ${{ steps.fast_evidence.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.fast_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ $UPLOAD_ID =~ ^[0-9]+$ ]]
          [[ $UPLOAD_DIGEST =~ ^[a-fA-F0-9]{64}$ ]]
          workspace=$DIAG_ACTIONS_WORKSPACE
          p=$DIAG_SOURCE_OWNER
          case "$p" in "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."??????) ;; *) exit 1 ;; esac
          test -d "$p" && test ! -L "$p"
          test "$(realpath -e -- "$p")" = "$p"
          test "$(stat -c '%u' -- "$p")" = "$(id -u)"
          test "$(stat -c '%d:%i' -- "$p")" = "$DIAG_SOURCE_IDENTITY"
          test -f "$p/.diag296-owner" && test ! -L "$p/.diag296-owner"
          test "$(cat "$p/.diag296-owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          test "$DIAG_SOURCE" = "$p/source"
          test -d "$p/source" && test ! -L "$p/source"
          test "$(realpath -e -- "$p/source")" = "$p/source"
          rm -rf --one-file-system -- "$p"
      - name: Clean common owned Fast job temporary paths
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always() && steps.fast_evidence.outcome == 'success' && steps.fast_evidence.outputs.artifact-id
          != '' && steps.fast_evidence.outputs.artifact-digest != '' && steps.fast_source_cleanup.outcome == 'success') }}
        uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
        with:
          cleanup: 'true'
    defaults:
      run:
        shell: bash
