name: AGNOS native ARM loader diagnosis
on:
  push:
    branches: ['codex/feat-643-arm-routing-draft']
    paths:
      - '.github/workflows/agnos-arm-abi-diagnostic.yml'
      - 'tools/ci/agnos_arm_abi_diagnostic.py'
      - 'tools/ci/patches/proot-arm64-faccessat2.patch'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agnos-arm-abi-${{ github.sha }}
  cancel-in-progress: false
jobs:
  loader:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      AGNOS_NATIVE_HOSTED_ARM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci/agnos_arm_abi_diagnostic.py
            tools/ci/patches/proot-arm64-faccessat2.patch
          sparse-checkout-cone-mode: false
      - name: Admit only the owned image and native source build
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(uname -m)" == aarch64 ]]
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 16*1024**3'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl git android-sdk-libsparse-utils e2fsprogs xz-utils gcc make pkg-config libtalloc-dev
          proot_source=$(mktemp -d "$RUNNER_TEMP/proot-abi.XXXXXX")
          git -C "$proot_source" init
          git -C "$proot_source" remote add origin https://github.com/proot-me/proot.git
          git -C "$proot_source" fetch --depth=1 origin 25dc6a3134891f98a79f57ce1c2c1b23ff15cad1
          git -C "$proot_source" checkout --detach FETCH_HEAD
          [[ $(git -C "$proot_source" rev-parse HEAD) == 25dc6a3134891f98a79f57ce1c2c1b23ff15cad1 ]]
          git -C "$proot_source" apply --check "$GITHUB_WORKSPACE/tools/ci/patches/proot-arm64-faccessat2.patch"
          git -C "$proot_source" apply "$GITHUB_WORKSPACE/tools/ci/patches/proot-arm64-faccessat2.patch"
          make -C "$proot_source/src" -j"$(nproc)" WITHOUT_PYTHON=1 loader.elf build.h
          make -C "$proot_source/src" -j"$(nproc)" WITHOUT_PYTHON=1 proot
          printf 'AGNOS_PROOT_PATH=%s\n' "$proot_source/src/proot" >> "$GITHUB_ENV"
          printf 'AGNOS_PROOT_PATCH_SHA256=%s\n' "$(sha256sum tools/ci/patches/proot-arm64-faccessat2.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/agnos-arm-abi-643
          key: agnos-arm-abi-643-f62-rust-194-v1
      - name: Reproduce original ldd, default loader and real chroot behavior
        env:
          AGNOS_ABI_CACHE: ${{ runner.tool_cache }}/agnos-arm-abi-643
        run: python3 tools/ci/agnos_arm_abi_diagnostic.py
      - uses: actions/upload-artifact@v6
        if: ${{ always() && env.AGNOS_ABI_REPORT != '' }}
        with:
          name: agnos-arm-loader-${{ github.run_id }}
          path: |
            ${{ env.AGNOS_ABI_REPORT }}/report.json
            ${{ env.AGNOS_ABI_REPORT }}/*.stdout
            ${{ env.AGNOS_ABI_REPORT }}/*.stderr
