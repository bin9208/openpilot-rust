name: 296 CP949 missing original domain bin-actions
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/changed-files-cp949-original-296-once.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: changed-files-cp949-original-296
  cancel-in-progress: false
jobs:
  original-only:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 77100d33ce4d1202853bd6bf3597a0fc2014c590
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
    - name: Create owned job isolation and record actual runner resources
      shell: bash
      run: "export CP949_SCOPE=original\n# ACTIONS ONLY. Run before checkout; all writes belong to this one job.\nset -euo\
        \ pipefail\n: \"${CP949_SCOPE:?original or native}\"\ncase \"$CP949_SCOPE\" in original|native) ;; *) exit 2 ;; esac\n\
        test \"$RUNNER_NAME\" = bin-actions\ntest \"$(uname -m)\" = x86_64\nexport CP949_JOB\nCP949_JOB=$(mktemp -d \"$RUNNER_TEMP/cp949-$CP949_SCOPE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX\"\
        )\nexport CP949_WORK=\"$GITHUB_WORKSPACE/cp949-$CP949_SCOPE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\ntest ! -e \"$CP949_WORK\"\
        \nmkdir \"$CP949_WORK\"\nexport CP949_SOURCE=\"$CP949_WORK/source\"\nexport CP949_BASE=\"$CP949_JOB/evidence\"\nmkdir\
        \ \"$CP949_BASE\" \"$CP949_JOB/tmp\" \"$CP949_JOB/cargo\" \"$CP949_JOB/rustup\" \"$CP949_JOB/cache\" \"$CP949_JOB/config\"\
        \ \"$CP949_JOB/pip-cache\" \"$CP949_JOB/tools\"\nprintf '%s:%s:%s\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"\
        $CP949_SCOPE\" > \"$CP949_JOB/.cp949-owner\"\ncp \"$CP949_JOB/.cp949-owner\" \"$CP949_WORK/.cp949-owner\"\n{\n  printf\
        \ 'CP949_JOB=%s\\nCP949_WORK=%s\\nCP949_SOURCE=%s\\nCP949_BASE=%s\\n' \"$CP949_JOB\" \"$CP949_WORK\" \"$CP949_SOURCE\"\
        \ \"$CP949_BASE\"\n  printf 'CARGO_HOME=%s/cargo\\nCARGO_TARGET_DIR=%s/target\\nRUSTUP_HOME=%s/rustup\\n' \"$CP949_JOB\"\
        \ \"$CP949_JOB\" \"$CP949_JOB\"\n  printf 'XDG_CACHE_HOME=%s/cache\\nXDG_CONFIG_HOME=%s/config\\nPIP_CACHE_DIR=%s/pip-cache\\\
        nTMPDIR=%s/tmp\\n' \"$CP949_JOB\" \"$CP949_JOB\" \"$CP949_JOB\" \"$CP949_JOB\"\n  printf 'GIT_CONFIG_GLOBAL=%s/gitconfig\\\
        n' \"$CP949_JOB\"\n} >> \"$GITHUB_ENV\"\n{\n  printf 'runner=%s\\nexpected_runner_id=22\\nrequired_labels=self-hosted,Linux,X64,dev-md-local\\\
        n' \"$RUNNER_NAME\"\n  uname -a\n  cat /etc/os-release\n  cat /proc/meminfo\n  cat /proc/self/status\n  df -Pk \"\
        $CP949_JOB\" \"$CP949_WORK\"\n  for item in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current;\
        \ do\n    if test -r \"$item\"; then printf '%s\\n' \"$item\"; cat \"$item\"; fi\n  done\n} > \"$CP949_BASE/runner-bootstrap.txt\"\
        \n# Estimates are operation growth, with no25/35GiB or other permanent reserve.\ntemp_mib=1024\nif test \"$CP949_SCOPE\"\
        \ = native; then temp_mib=10240; fi\nsource_mib=2048\ntemp_free=$(df -Pk \"$CP949_JOB\" | awk 'NR==2{print $4}')\n\
        source_free=$(df -Pk \"$CP949_WORK\" | awk 'NR==2{print $4}')\ntemp_device=$(stat -c %d \"$CP949_JOB\")\nsource_device=$(stat\
        \ -c %d \"$CP949_WORK\")\nif test \"$temp_device\" = \"$source_device\"; then\n  test \"$temp_free\" -ge $(((temp_mib\
        \ + source_mib) * 1024))\nelse\n  test \"$temp_free\" -ge $((temp_mib * 1024))\n  test \"$source_free\" -ge $((source_mib\
        \ * 1024))\nfi\nprintf 'temp_growth_mib=%s\\nsource_growth_mib=%s\\nfixed_reserve_mib=0\\n' \"$temp_mib\" \"$source_mib\"\
        \ > \"$CP949_BASE/operation-growth.txt\"\n"
    - uses: actions/checkout@v7
      with:
        ref: 77100d33ce4d1202853bd6bf3597a0fc2014c590
        path: cp949-original-${{ github.run_id }}-${{ github.run_attempt }}/source
        persist-credentials: false
        set-safe-directory: false
        clean: false
        lfs: false
    - uses: actions/setup-python@v6
      env:
        RUNNER_TOOL_CACHE: ${{ env.CP949_JOB }}/tools
        AGENT_TOOLSDIRECTORY: ${{ env.CP949_JOB }}/tools
      with:
        python-version: 3.12.15
    - name: Bind exact source in isolated checkout
      shell: bash
      run: 'set -euo pipefail

        cd "$CP949_SOURCE"

        test "$GITHUB_REPOSITORY" = bin9208/openpilot-rust

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        git status --porcelain=v1 > "$CP949_BASE/source-status.before.txt"

        test ! -s "$CP949_BASE/source-status.before.txt"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$CP949_BASE/source.txt"

        python -I -B -VV > "$CP949_BASE/python.txt"

        '
