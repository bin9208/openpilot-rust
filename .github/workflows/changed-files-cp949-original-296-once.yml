      if: always() && env.CP949_BASE != ''
      shell: bash
      run: "set -euo pipefail\nif test -f \"$CP949_BASE/runner-resources.py\"; then\n  python -I -B \"$CP949_BASE/runner-resources.py\"\
        \ finished 0\nfi\ndu -sm \"$CP949_BASE\" > \"$CP949_BASE/artifact-size-mib.txt\"\ntest \"$(cut -f1 \"$CP949_BASE/artifact-size-mib.txt\"\
