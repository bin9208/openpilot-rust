        set -euo pipefail\nif test \"${CP949_UPLOAD_OUTCOME:-}\" != success; then\n  printf 'Evidence upload incomplete; preserve\
        \ owned job directory: %s\\n' \"${CP949_JOB:-unset}\"\n  exit 0\nfi\n: \"${CP949_SCOPE:?}\"\nexpected_owner=\"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$CP949_SCOPE\"\
        \ncase \"$CP949_JOB\" in \"$RUNNER_TEMP\"/cp949-\"$CP949_SCOPE\"-\"$GITHUB_RUN_ID\"-\"$GITHUB_RUN_ATTEMPT\".*) ;;\
        \ *) exit 2 ;; esac\ntest \"$CP949_WORK\" = \"$GITHUB_WORKSPACE/cp949-$CP949_SCOPE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\
        \ntest ! -L \"$CP949_JOB\"\ntest ! -L \"$CP949_WORK\"\ntest \"$(cat \"$CP949_JOB/.cp949-owner\")\" = \"$expected_owner\"\
        \ntest \"$(cat \"$CP949_WORK/.cp949-owner\")\" = \"$expected_owner\"\nrm -rf -- \"$CP949_WORK\" \"$CP949_JOB\"\n"
