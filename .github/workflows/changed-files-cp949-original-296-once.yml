      shell: bash
      run: 'set -euo pipefail

        cd "$CP949_SOURCE"

        export CP949_PLAN_SHA256=7e1a2467623b6d0a65e557323f9799342b723ad3d36d750c4845db3ae5f8e4bd

        export CP949_REUSED_SHA256=9bdc06a0713139c302df8babf73c031cfe26053bbe8f42bf235ec6e9d9e40d1c

        set +e

        /usr/bin/timeout --signal=TERM --kill-after=10s 300s python -I -B "$CP949_BASE/capture-original.py" --root "$CP949_SOURCE"
        --output "$CP949_BASE/observations" --plan "$CP949_BASE/input-plan.json" --reused "$CP949_BASE/reused-cp949.json"
        --supplement "$CP949_SUPPLEMENT_DIR" > "$CP949_BASE/capture.stdout" 2> "$CP949_BASE/capture.stderr"

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$CP949_BASE/capture.status"

        git status --porcelain=v1 > "$CP949_BASE/source-status.after.txt"

        cmp "$CP949_BASE/source-status.before.txt" "$CP949_BASE/source-status.after.txt"

