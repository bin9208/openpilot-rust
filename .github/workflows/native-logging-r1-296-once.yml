name: Native logging comparator R1 diagnostic
permissions:
  contents: read
  actions: read
jobs:
  logging-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 665ab15e29a8a640acf29480d472158f2d92810d
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - name: Establish external evidence root and initial disk guard
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        printf ''LOGGING_PROOF_OUTPUT=%s/native-logging-r1\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        free=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)

        test "$free" -ge $((25*1024*1024*1024+2*1024*1024*1024))

        mkdir -p "$RUNNER_TEMP/native-logging-r1"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install normal comparator prerequisites
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y g++ capnproto libcapnp-dev libzmq5 strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        printf ''LOGGING_SELECTED_PYTHON=%s\n'' "$(command -v python)" >> "$GITHUB_ENV"

        '
    - name: Build and check candidate before native-only replay
      working-directory: rust
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --locked -p openpilot-dev-tools --features native-logging-check-native --bin check-native-logging
        --bin build-native-logging-reference

        cargo +1.94.0 build --locked -p openpilot-logging --example native_logging_probe

        cargo +1.94.0 test --locked -p openpilot-dev-tools --features native-logging-check-native --lib native_logging_check::
        -- --nocapture

        cargo +1.94.0 clippy --locked -p openpilot-dev-tools --features native-logging-check-native --lib --bin check-native-logging
        -- -D warnings


        cargo +1.94.0 check --locked -p openpilot-dev-tools --no-default-features --lib

        '
    - name: Reuse sealed independent observations and prepare actual native C++ provider
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > "$RUNNER_TEMP/native-logging-original-39791779545.zip"

        printf ''%s  %s\n'' ''3655dfbe1524303c7927bcdd0ede43599e75094fe787f0ec80d84a82cba3a516'' "$RUNNER_TEMP/native-logging-original-39791779545.zip"
        | sha256sum --check --strict

        "$GITHUB_WORKSPACE/rust/target/debug/build-native-logging-reference" --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/native-logging-reference-r1"
        > "$LOGGING_PROOF_OUTPUT/reference-builder.stdout"

        cp "$RUNNER_TEMP/native-logging-reference-r1/provenance.json" "$LOGGING_PROOF_OUTPUT/reference-provenance.json"

        printf ''LOGGING_REFERENCE_BINARY=%s/native-logging-reference-r1/native_logging_reference\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''LOGGING_ORIGINAL_ARCHIVE=%s/native-logging-original-39791779545.zip\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
