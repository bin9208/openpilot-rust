             pm_exec.rewrite(call,ctx)
             if any(owner is not None and index==owner['call_index']for owner in input_owners.values()):
              boundaries['input_owner_after_'+str(index)]=snapshot(call,index,calls[index]['globals'],'immediate after original input owner before arena reuse')
             if index==terminal['call_index']:boundaries['terminal_after']=snapshot(call,index,terminal['globals'],'immediate after original terminal before arena reuse')
            compile_calls_after_execution=compile_calls[0]
