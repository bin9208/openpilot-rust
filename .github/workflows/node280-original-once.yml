          assert hashlib.sha256(WIRE.read_bytes()).hexdigest() == "d2e405325f2312a84d22117aba411606838a6bab6bbb61c67df39a83da6fef3c"
          assert HERE.is_relative_to(ROOT / ".analysis/scratch")
