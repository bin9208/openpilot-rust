          replace_once("output_name='policy/val_13'", "output_name='policy/linear_2'")
          replace_once(
              "logical_input=runner.graph_values['policy/index'];weights=runner.graph_values['policy/val_12']",
              "",
          )
          replace_once("logical_input_shape=list(logical_input.shape),logical_weight_shape=list(weights.shape),weight_dtype=str(weights.dtype),", "")
          replace_once("  record['logical_input_uop']=str(logical_input.uop)\n", "")
          replace_once("Unmodified original final-output-only prefix through pinned node274", "Unmodified original final-output-only prefix through node280")
          replace_once("compile_calls=[0];compiled_sources={};original_compile_to_obj=compiler.compile_to_obj", "compile_calls=[0];compiled_sources={};compiled_objects={};original_compile_to_obj=compiler.compile_to_obj")
          replace_once(
              "compile_calls[0]+=1;result=original_compile_to_obj(source);compiled_sources[hashlib.sha256(source.encode()).hexdigest()]=hashlib.sha256(result).hexdigest();return result",
              "compile_calls[0]+=1;result=original_compile_to_obj(source);key=hashlib.sha256(source.encode()).hexdigest();compiled_sources[key]=hashlib.sha256(result).hexdigest();compiled_objects[key]=result;return result",
          )
          start = source.index("  started=time.monotonic();linear,variables=out.linear_with_vars();")
          source = source[:start] + '''
            from tinygrad.engine.realize import get_call_outs_ins
            started=time.monotonic()
            linear,variables=out.linear_with_vars()
            compiled=compile_linear(linear)
            base_ids={};calls=[];programs={};boundaries={}
            ir_dir=output.with_suffix('.ir');ir_dir.mkdir(exist_ok=False)
            object_dir=output.with_suffix('.objects');object_dir.mkdir(exist_ok=False)
            def sha(raw):return hashlib.sha256(raw).hexdigest()
            def region(buf):
             base=id(buf.base)
             if base not in base_ids:base_ids[base]=len(base_ids)
             return dict(base=base_ids[base],offset=buf.offset,bytes=buf.nbytes,dtype=str(buf.dtype))
            def overlaps(a,b):return a['base']==b['base'] and max(a['offset'],b['offset'])<min(a['offset']+a['bytes'],b['offset']+b['bytes'])
            for index,call in enumerate(compiled.src):
             operation=call.src[0];outs,ins=get_call_outs_ins(call)
