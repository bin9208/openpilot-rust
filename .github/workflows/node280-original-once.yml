name: One-time original prefix 93 fusion ownership capture (issue 296)
on:
  push:
    branches:
      - codex/feat-296-node280-original-capture
    paths:
      - .github/workflows/node280-original-once.yml
permissions:
  contents: read
jobs:
  original-prefix93:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve 25 GiB plus 3 GiB before dependencies or capture
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
      - name: Install minimal pinned original dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libllvm18
          python -m pip install numpy==2.5.3 onnx==1.20.1
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
          printf 'dee5a294e8afaacc9295ac5d100e00733ecac278e79264b96331e40a3ede1b04  openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\n' | sha256sum --check --strict
      - name: Fetch exact LLVM 18 provider
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 3072
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/llvm18.deb" 'https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb'
          printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm18.deb" "$RUNNER_TEMP/llvm18-captured"
          printf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
      - name: Stage source-visible immutable original diagnostic
        shell: bash
        run: |
          set -euo pipefail
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-prefix93-fusion"
          mkdir -p "$capture_dir"
          cat > "$capture_dir/capture_prefix93_owners.py" <<'PREFIX93_OWNER_DRIVER'
          """Temporary original-only prefix93 terminal ownership capture for GitHub Actions.

          This extends the existing independent dmonitoring prefix93 observation. It does
          not load or execute a Rust candidate and is not a replacement source file.
          """
          import ast
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path

          ROOT = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert Path.cwd().resolve() == ROOT
          assert os.environ["DEV"] == "CPU:LLVM"
          assert os.environ["CPU_COUNT"] == "16"
          for name in ("IMAGE", "FLOAT16", "NOLOCALS", "OPENPILOT_HACKS"):
              assert os.environ[name] == "1"
          assert os.environ["CACHELEVEL"] == "0" and os.environ["CCACHE"] == "0"
          assert os.environ.get("GRAPH_ONLY") != "1"
          HERE = Path(__file__).resolve().parent
          OUTPUT = HERE / "capture"
          OUTPUT.mkdir(exist_ok=False)
          MODEL = ROOT / "openpilot/selfdrive/modeld/models/dmonitoring_model.onnx"
          WIRE = HERE / "capture_prefix_contexts.py"
          sha = lambda raw: hashlib.sha256(raw).hexdigest()
          assert sha(MODEL.read_bytes()) == "dee5a294e8afaacc9295ac5d100e00733ecac278e79264b96331e40a3ede1b04"
          assert sha(WIRE.read_bytes()) == "d2e405325f2312a84d22117aba411606838a6bab6bbb61c67df39a83da6fef3c"
          source_pins = {'tinygrad_repo/tinygrad/codegen/late/devectorizer.py': '54fcfa351cfcd9d8e22e9e9cade7a4970f635b5cb3d0f7924a795b76af92cfa1',
           'tinygrad_repo/tinygrad/codegen/late/expander.py': '0283354382ab32a083351fce0b43af964a3f98c281bdb96d49dbca808aab7490',
           'tinygrad_repo/tinygrad/codegen/opt/heuristic.py': '91b378a78d7ced908b76db190fb978c1c92d8b07d0d2e711475f116061d91f89',
           'tinygrad_repo/tinygrad/codegen/opt/postrange.py': '17af91a317d5851637a8f6de32ac8693c35e591e52777c9bf1f44011469018a0',
           'tinygrad_repo/tinygrad/codegen/simplify.py': '97f219e1900f7998a08248821e4cf0b72b178adc6e3cfe22b90f802c2340f9fb',
           'tinygrad_repo/tinygrad/device.py': '7c28ae3854a3f009fc6eddfb52f03b3d382a23b581d94a3c4741a12bdc79f008',
           'tinygrad_repo/tinygrad/dtype.py': 'de4bb7980fac9c09f851374fc6e8c57441071fca6d98dc92c6e984170bc58008',
           'tinygrad_repo/tinygrad/engine/realize.py': '362a666b89a29df9fbd8e7cb267ef3f5b4136f5cbad9cf6e88fabc25c1b4bcda',
           'tinygrad_repo/tinygrad/helpers.py': '24c347d2137c92e1dc35d78cd9df45b38d31cc4d34729a35215f8822b3f2f6fb',
           'tinygrad_repo/tinygrad/mixin/elementwise.py': '648b15352bbad5a62fc50b1129d23c30ec5a068aab7a4c70aff8325e87b1bcd2',
           'tinygrad_repo/tinygrad/nn/onnx.py': 'db5d97311c3192960c9e2c501dbd546ed5b8dc4396e361e4211f7e8373556b96',
           'tinygrad_repo/tinygrad/renderer/llvmir.py': '34fc242484fed32a645fac6ad855064081ac0de5b01a291a071c1bbc92cdf29e',
           'tinygrad_repo/tinygrad/runtime/support/compiler_cpu.py': 'db106591197315ecf28f0e15de99d2841c9892e6e58290213c62c598e7014139',
           'tinygrad_repo/tinygrad/schedule/memory.py': '5208f60a013dc79a2dc5752fa8f41af0067583aaac93ce626fa1c47b25861ac0',
           'tinygrad_repo/tinygrad/schedule/rangeify.py': '52bad522c3660171a708769999373a5177ac60d2ecde8c3db555769b677d2035',
           'tinygrad_repo/tinygrad/tensor.py': 'c825e67e3e7d237cbbb4bf32cb30255422fb1feec6d0f769a1e7a5cb45573b99',
           'tinygrad_repo/tinygrad/uop/decompositions.py': '907e0660b37758b3dea3324c99292ad73590ea09fdefd1bbd831c4e78068c7e3',
           'tinygrad_repo/tinygrad/uop/ops.py': 'd4b454cc4577a23be8d688aed874b9911992332e21bea7d7567974c9dc7c197a'}
          for path, digest in source_pins.items():
              assert sha((ROOT / path).read_bytes()) == digest, path
          provider = Path(os.environ["LLVM_PATH"])
          provider_hash = sha(provider.read_bytes())
          assert provider_hash == "5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0"
          wire = ast.parse(WIRE.read_text())
          functions = [node for node in wire.body if isinstance(node, ast.FunctionDef) and node.name in {"vi", "f", "m", "readvi", "fields", "prefix_bytes"}]
          ns = {"MODEL": MODEL}
          exec(compile(ast.Module(body=functions, type_ignores=[]), str(WIRE), "exec"), ns)
          prefix = ns["prefix_bytes"](93, ["mean"])
          assert sha(prefix) == "d9bf497acb1c940894b6af5570c23ac24b9c69ed8774603a7221df8d895e6c17"
          (OUTPUT / "prefix93.onnx").write_bytes(prefix)

          from tinygrad import Tensor, dtypes
          from tinygrad.nn.onnx import OnnxRunner
          from tinygrad.device import Device
          from tinygrad.engine.realize import compile_linear, resolve_params, ExecContext, pm_exec, get_call_outs_ins
          from tinygrad.runtime.support.compiler_cpu import CPULLVMCompiler
          from tinygrad.uop.ops import Ops

          assert Path(__import__("tinygrad").__file__).resolve().is_relative_to(ROOT / "tinygrad_repo")
          compiler = Device["CPU"].renderer.compiler
          assert isinstance(compiler, CPULLVMCompiler)
          compiler.cachekey = None
          compiled_sources = {}
          compiled_objects = {}
          compile_count = [0]
          original_compile = compiler.compile_to_obj

          def counted(source):
              result = original_compile(source)
              key = sha(source.encode())
              compiled_sources[key] = sha(result)
              compiled_objects[key] = result
              compile_count[0] += 1
              return result

          compiler.compile_to_obj = counted
          raw_inputs = {"input_img": bytes(range(256)) * 5400, "calib": struct.pack("<3f", 1 + 2**-11, -0., .3)}
          inputs = {
              "input_img": Tensor(raw_inputs["input_img"], dtype=dtypes.uint8).reshape(1, 1382400),
              "calib": Tensor(raw_inputs["calib"], dtype=dtypes.float32).reshape(1, 3),
          }
          out = OnnxRunner(OUTPUT / "prefix93.onnx")(inputs)["mean"].cast(dtypes.float32)
          linear, variables = out.linear_with_vars()
          compiled = compile_linear(linear)
          base_ids = {}
          def region(buffer):
              identity = id(buffer.base)
              if identity not in base_ids:
                  base_ids[identity] = len(base_ids)
              return dict(base=base_ids[identity], offset=buffer.offset, bytes=buffer.nbytes, dtype=str(buffer.dtype))
          def overlaps(a, b):
              return a["base"] == b["base"] and max(a["offset"], b["offset"]) < min(a["offset"] + a["bytes"], b["offset"] + b["bytes"])

          calls = []
          for index, call in enumerate(compiled.src):
              operation = call.src[0]
              outs, ins = get_call_outs_ins(call)
              params = resolve_params(call, ())
              if operation.op is Ops.PROGRAM:
                  source = operation.src[3].arg
                  key = sha(source.encode())
                  assert key in compiled_sources
                  (OUTPUT / f"{key}.ll").write_text(source)
                  slots = operation.arg.globals
              else:
                  key = None
                  slots = tuple(range(len(params)))
              calls.append(dict(index=index, op=operation.op.name, source=key, outs=list(outs), ins=list(ins), globals=list(slots), regions={str(slot): region(params[slot].buffer) for slot in slots}))
          returned = region(out.uop.buffer)
          writers = [(call, slot) for call in calls if call["op"] != "SLICE" for slot in call["outs"] if overlaps(call["regions"][str(slot)], returned)]
          assert writers
          terminal, output_slot = writers[-1]
          assert terminal["op"] == "PROGRAM" and terminal["regions"][str(output_slot)] == returned
          assert terminal["source"] == "7ce852371c1860e4449e1da40e566f32f8485f6e6974ccfa9b4600bc31191020"
          input_owners = {}
          for slot in terminal["ins"]:
              target = terminal["regions"][str(slot)]
              prior = [(call, output) for call in calls[:terminal["index"]] if call["op"] != "SLICE" for output in call["outs"] if overlaps(call["regions"][str(output)], target)]
              input_owners[str(slot)] = None if not prior else dict(call_index=prior[-1][0]["index"], output_slot=prior[-1][1], op=prior[-1][0]["op"], source=prior[-1][0]["source"], region=prior[-1][0]["regions"][str(prior[-1][1])])

          ctx = ExecContext(variables, (), True, True, True)
          boundaries = {}
          def snapshot(index, call, slots, phase):
              params = resolve_params(call, ())
              result = {}
              for slot in slots:
                  raw = bytes(params[slot].buffer.as_memoryview())
                  assert len(raw) <= 16 * 1024 * 1024
                  name = f"{phase}-call{index}-slot{slot}.bin"
                  (OUTPUT / name).write_bytes(raw)
                  result[str(slot)] = dict(file=name, bytes=len(raw), sha256=sha(raw))
              return result
          for index, call in enumerate(compiled.src):
              if index == terminal["index"]:
                  boundaries["terminal_before"] = snapshot(index, call, terminal["ins"], "terminal-before")
              pm_exec.rewrite(call, ctx)
              if any(owner is not None and owner["call_index"] == index for owner in input_owners.values()):
                  boundaries[f"owner_after_{index}"] = snapshot(index, call, calls[index]["globals"], "owner-after")
              if index == terminal["index"]:
                  boundaries["terminal_after"] = snapshot(index, call, terminal["globals"], "terminal-after")
          post_execution_calls = compile_count[0]
          post_execution_sources = dict(compiled_sources)
          for key, obj in compiled_objects.items():
              assert sha(obj) == post_execution_sources[key]
              (OUTPUT / f"{key}.objbin").write_bytes(obj)
          raw = out.data().tobytes()
          assert compile_count[0] == post_execution_calls and compiled_sources == post_execution_sources
          assert raw == (OUTPUT / boundaries["terminal_after"][str(output_slot)]["file"]).read_bytes()
          assert sha(raw) == "7307a9b9129f7650c5793a6098dfb30f1830699e24f7a94c3936d6d6c9b57ee5"
          for slot, owner in input_owners.items():
              assert boundaries["terminal_before"][slot]["sha256"] == boundaries["terminal_after"][slot]["sha256"]
              if owner is not None:
                  assert owner["region"] == terminal["regions"][slot]
                  assert boundaries[f"owner_after_{owner['call_index']}"][str(owner["output_slot"])]["sha256"] == boundaries["terminal_before"][slot]["sha256"]
          for path, digest in source_pins.items():
              assert sha((ROOT / path).read_bytes()) == digest
          assert sha(MODEL.read_bytes()) == "dee5a294e8afaacc9295ac5d100e00733ecac278e79264b96331e40a3ede1b04"
          assert sha(provider.read_bytes()) == provider_hash
          record = dict(model_sha256=sha(MODEL.read_bytes()), prefix_sha256=sha(prefix), output_sha256=sha(raw), output_hex=raw.hex(), input_sha256={name: sha(data) for name, data in raw_inputs.items()}, source_sha256=source_pins, provider_sha256=provider_hash, driver_sha256=sha(Path(__file__).read_bytes()), terminal=terminal, returned=returned, input_owners=input_owners, boundaries=boundaries, calls=calls, program_object_sha256=compiled_sources, compile_calls_after_execution=post_execution_calls, compile_calls_after_output_read=compile_count[0])
          (OUTPUT / "receipt.json").write_text(json.dumps(record, indent=2) + "\n")
          print("captured original prefix93 owners", record["prefix_sha256"], record["output_sha256"], flush=True)
          PREFIX93_OWNER_DRIVER
          cat > "$capture_dir/capture_prefix_contexts.py" <<'PREFIX93_WIRE_HELPER'
          from pathlib import Path
          import json,hashlib,struct,sys,subprocess,os,time
          from tinygrad import Tensor,dtypes
          from tinygrad.nn.onnx import OnnxRunner
          from tinygrad.engine.realize import compile_linear,run_linear
          from tinygrad.uop.ops import Ops
          ROOT=Path('.analysis/scratch/2026-10-15-native-compiler-launch/prefix-contexts');ROOT.mkdir(exist_ok=True)
          MODEL=Path('openpilot/selfdrive/modeld/models/dmonitoring_model.onnx')
          def vi(v):
           out=bytearray()
           while v>127:out.append((v&127)|128);v>>=7
           out.append(v);return bytes(out)
          def f(n,w,v):return vi((n<<3)|w)+(vi(len(v))if w==2 else b'')+v
          def m(n,*parts):return f(n,2,b''.join(parts))
          def readvi(data,pos):
           v=shift=0
           while True:
            b=data[pos];pos+=1;v|=(b&127)<<shift
            if b<128:return v,pos
            shift+=7
          def fields(data):
           pos=0
           while pos<len(data):
            start=pos;tag,pos=readvi(data,pos);wire=tag&7
            if wire==2:n,pos=readvi(data,pos);value=data[pos:pos+n];pos+=n
            elif wire==0:value,pos=readvi(data,pos)
            else:n={1:8,5:4}[wire];value=data[pos:pos+n];pos+=n
            yield tag>>3,wire,value,data[start:pos]
          def prefix_bytes(index,output_names):
           source=MODEL.read_bytes();top=list(fields(source));gf=list(fields(next(v for n,w,v,r in top if n==7)));nodes=[raw for n,w,v,raw in gf if n==1][:index+1]
           required={value.decode()for rawnode in nodes for n,w,node,rr in fields(rawnode)for nn,ww,value,raw in fields(node)if nn==1}
           kept=[]
           for n,w,v,raw in gf:
            if n in [1,12]:continue
            if n==5 and next(value.decode()for nn,ww,value,rr in fields(v)if nn==8)not in required:continue
            kept.append(raw)
           dtype=m(2,m(1,f(1,0,vi(1))))
           outputs=[m(12,f(1,2,name.encode()),dtype)for name in output_names]
           return b''.join(raw if n!=7 else m(7,*nodes,*kept,*outputs)for n,w,v,raw in top)
          def inputs():return {'input_img':Tensor(bytes(range(256))*5400,dtype=dtypes.uint8).reshape(1,1382400),'calib':Tensor(struct.pack('<3f',1+2**-11,-0.,.3),dtype=dtypes.float32).reshape(1,3)}
          def capture(out,index,node,context):
           out=out.cast(dtypes.float32)
           linear,variables=out.linear_with_vars();compiled=compile_linear(linear)
           programs=[]
           for call in compiled.src:
            p=call.src[0]
            if p.op is Ops.PROGRAM:programs.append(dict(name=p.arg.function_name,opts=repr(p.src[0].arg.applied_opts),global_size=p.arg.global_size,local_size=p.arg.local_size,llvm_sha256=hashlib.sha256(p.src[3].arg.encode()).hexdigest(),binary_sha256=hashlib.sha256(p.src[4].arg).hexdigest()))
           run_linear(compiled,variables,jit=True,wait=True)
           raw=out.reshape(-1).bitcast(dtypes.uint8).data().tobytes();(ROOT/f'{context}-{index}.bin').write_bytes(raw)
           record=dict(index=index,name=node.outputs[0],op=node.op,shape=list(out.shape),sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),programs=programs,context=context)
           (ROOT/f'{context}-{index}.json').write_text(json.dumps(record,indent=2)+'\n');return record
          mode=sys.argv[1]
          if mode=='forced':
           r=OnnxRunner(MODEL);nodes=r.graph_nodes[:60];values=inputs()
           for index,node in enumerate(nodes):
            r.graph_nodes=(node,);r.graph_outputs=node.outputs;out=r(values)[node.outputs[0]]
            if index>=9:record=capture(out,index,node,'forced-node');print('forced',index,node.op,record['sha256'],flush=True)
            else:out.realize()
          elif mode=='prefix':
           index=int(sys.argv[2]);original=OnnxRunner(MODEL);node=original.graph_nodes[index];path=ROOT/f'prefix-{index}.onnx';data=prefix_bytes(index,node.outputs);path.write_bytes(data)
           r=OnnxRunner(path);out=r(inputs())[node.outputs[0]];record=capture(out,index,node,'true-prefix');record['onnx_sha256']=hashlib.sha256(data).hexdigest();(ROOT/f'true-prefix-{index}.json').write_text(json.dumps(record,indent=2)+'\n')
           forced=json.loads((ROOT/f'forced-node-{index}.json').read_text());print('true-prefix',index,node.op,'forced_equal',record['sha256']==forced['sha256'],'programs',len(record['programs']),record['sha256'],flush=True)
          elif mode=='batch':
           subprocess.run([sys.executable,__file__,'forced'],check=True)
           for index in range(9,60):subprocess.run([sys.executable,__file__,'prefix',str(index)],check=True)
           records=[json.loads(p.read_text())for p in sorted(ROOT.glob('*.json'))]
           report=dict(model_sha256=hashlib.sha256(MODEL.read_bytes()).hexdigest(),flags={k:os.environ[k]for k in ['DEV','IMAGE','FLOAT16','NOLOCALS','OPENPILOT_HACKS']},input_recipe='input_img=repeat0..255x5400; calibfloat32=[1+2^-11,-0,0.3]',contexts={'forced-node':'realize each original ONNX node before consuming next; diagnostic only','true-prefix':'exact original nodes0..N, original constants/inputs/opsets, only nodeN output selected and float32 realized once; prefix/export fusion acceptance context'},records=records)
           (ROOT/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          elif mode=='native-model':
           r=OnnxRunner(MODEL);names=[node.outputs[0]for node in r.graph_nodes[9:60]];(ROOT/'native-all-outputs.onnx').write_bytes(prefix_bytes(59,names));print('native diagnostic graph',len(names),'outputs')
          PREFIX93_WIRE_HELPER
          cat > "$RUNNER_TEMP/prefix93-drivers.sha256" <<EOF
          12d85bd79705de005f9805a9ac08e26acfd68058b9f587e92e7dadbac8310dfe  $capture_dir/capture_prefix93_owners.py
          d2e405325f2312a84d22117aba411606838a6bab6bbb61c67df39a83da6fef3c  $capture_dir/capture_prefix_contexts.py
          EOF
          sha256sum --check --strict "$RUNNER_TEMP/prefix93-drivers.sha256"
          cp "$RUNNER_TEMP/prefix93-drivers.sha256" "$capture_dir/driver-sha256.txt"
      - name: Execute cold original prefix 93 and retain status
        shell: bash
        env:
          DEV: CPU:LLVM
          CPU_COUNT: '16'
          IMAGE: '1'
          FLOAT16: '1'
          NOLOCALS: '1'
          OPENPILOT_HACKS: '1'
          CACHELEVEL: '0'
          CCACHE: '0'
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072 || exit 1
          export LLVM_PATH="$RUNNER_TEMP/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tinygrad_repo:$GITHUB_WORKSPACE/rust/tools"
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-prefix93-fusion"
          timeout --signal=TERM --kill-after=10s 180s python3 -P "$capture_dir/capture_prefix93_owners.py" > "$capture_dir/capture.log" 2>&1
          status=$?
          printf 'original prefix93 status %s\n' "$status" | tee "$capture_dir/status.txt"
          exit "$status"
      - name: Preserve original output, source, object and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefix93-original-owners-${{ github.sha }}
          path: .analysis/scratch/2026-10-21-prefix93-fusion/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
