      - name: Run independent original node 280 captures
        shell: bash
        env:
          CPU_COUNT: '16'
          CCACHE: '0'
          CACHELEVEL: '0'
          DEV: CPU:LLVM:x86_64,x86-64
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-model-next"
          export OPENPILOT_RUST_ROOT="$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tinygrad_repo:$GITHUB_WORKSPACE/rust/tools"
          unset GRAPH_ONLY
          failures=0
          for version in 18 20; do
            "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072 || exit 1
            case "$version" in
              18) export LLVM_PATH="$RUNNER_TEMP/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1" ;;
              20) export LLVM_PATH="$RUNNER_TEMP/llvm20-captured/usr/lib/x86_64-linux-gnu/libLLVM.so.20.1" ;;
            esac
            export PREFIX_OUTPUT="node280-original${version}.json"
            timeout --signal=TERM --kill-after=10s 120s python3 -P "$capture_dir/capture_actual_node280.py" > "$capture_dir/node280-original${version}.log" 2>&1
            status=$?
            printf 'LLVM %s status %s\n' "$version" "$status" | tee "$capture_dir/node280-original${version}.status"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          find "$capture_dir" -type f -print0 | sort -z | xargs -0 sha256sum > "$capture_dir/artifact-sha256.txt"
          exit "$failures"
      - name: Preserve both original captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node280-original-${{ github.sha }}
          path: .analysis/scratch/2026-10-21-model-next/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
