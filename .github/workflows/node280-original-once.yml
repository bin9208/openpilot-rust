              "Path('.analysis/scratch/2026-10-15-native-compiler-launch/capture_prefix_contexts.py').read_text()",
              "Path('.analysis/scratch/2026-10-21-model-next/capture_prefix_contexts.py').read_text()",
          )
          replace_once(
              "prefix=ns['prefix_bytes'](274,['policy/val_13'])",
              "prefix=ns['prefix_bytes'](280,['policy/linear_2'])",
