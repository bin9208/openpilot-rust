name: One-time original prefix 93 fused-kernel diagnostic (issue 296)
on:
  push:
    branches:
      - codex/feat-296-node280-original-capture
    paths:
      - .github/workflows/node280-original-once.yml
permissions:
  contents: read
  actions: read
jobs:
  original-prefix93-kernel-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve 25 GiB plus 3 GiB before dependencies or artifact
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
      - name: Install pinned original runtime dependency and LLVM18 provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libllvm18
          python -m pip install numpy==2.5.3 onnx==1.20.1
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 3072
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/llvm18.deb" 'https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb'
          printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm18.deb" "$RUNNER_TEMP/llvm18-captured"
          printf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
      - name: Download immutable original prefix93 input and object artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
          mkdir -p .analysis/scratch/2026-10-21-prefix93-fusion/prior
          gh run download 39488465388 --repo bin9208/openpilot-rust --name prefix93-original-owners-0c2d4d0806b6c802f81dcfb52066c20451ea6ba8 --dir .analysis/scratch/2026-10-21-prefix93-fusion/prior
      - name: Stage transparent one-off original kernel diagnostic
        shell: bash
        run: |
          set -euo pipefail
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-prefix93-fusion"
          cat > "$capture_dir/diagnose_original_terminal.py" <<'PREFIX93_KERNEL_DRIVER'
          """One-off original LLVM18 prefix93 kernel diagnostic; run only in GitHub Actions.

          It replays the captured original terminal object on its captured input buffers,
          then instruments a copy of the same LLVM IR to observe pre-mean Gelu values.
          The trace is inadmissible unless both executions retain the original output.
          """
          import ast
          import ctypes
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path


          ROOT = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert Path.cwd().resolve() == ROOT
          assert os.environ["DEV"] == "CPU:LLVM"
          assert os.environ["CPU_COUNT"] == "16"
          for key in ("IMAGE", "FLOAT16", "NOLOCALS", "OPENPILOT_HACKS"):
              assert os.environ[key] == "1"
          assert os.environ["CACHELEVEL"] == "0" and os.environ["CCACHE"] == "0"
          HERE = Path(__file__).resolve().parent
          PRIOR = HERE / "prior" / "capture"
          OUTPUT = HERE / "diagnostic"
          OUTPUT.mkdir(exist_ok=False)
          sha = lambda raw: hashlib.sha256(raw).hexdigest()
          def sealed(path, expected):
              raw = path.read_bytes()
              assert sha(raw) == expected, str(path)
              return raw


          prior_receipt_raw = sealed(PRIOR / "receipt.json", "e3152225d774365df1eedecc4565a5d73a0e061b589149847d70ffe27766f3cc")
          prior = json.loads(prior_receipt_raw)
          assert prior["model_sha256"] == "dee5a294e8afaacc9295ac5d100e00733ecac278e79264b96331e40a3ede1b04"
          assert prior["prefix_sha256"] == "d9bf497acb1c940894b6af5570c23ac24b9c69ed8774603a7221df8d895e6c17"
          assert prior["output_sha256"] == "7307a9b9129f7650c5793a6098dfb30f1830699e24f7a94c3936d6d6c9b57ee5"
          assert prior["driver_sha256"] == "12d85bd79705de005f9805a9ac08e26acfd68058b9f587e92e7dadbac8310dfe"
          sealed(HERE / "prior" / "capture_prefix93_owners.py", prior["driver_sha256"])
          sealed(HERE / "prior" / "capture_prefix_contexts.py", "d2e405325f2312a84d22117aba411606838a6bab6bbb61c67df39a83da6fef3c")
          assert prior["terminal"]["index"] == 271 and prior["terminal"]["globals"] == [0, 1, 2, 3]
          assert prior["terminal"]["outs"] == [0] and prior["terminal"]["ins"] == [1, 2, 3]
          assert prior["returned"]["bytes"] == 3840 and prior["returned"]["dtype"] == "dtypes.float"
          assert prior["terminal"]["source"] == "7ce852371c1860e4449e1da40e566f32f8485f6e6974ccfa9b4600bc31191020"
          assert [prior["terminal"]["regions"][str(i)]["bytes"] for i in range(4)] == [3840, 26112, 368640, 1920]
          source_pins = prior["source_sha256"]
          assert len(source_pins) == 18
          runtime_pins = {
              "tinygrad_repo/tinygrad/runtime/support/elf.py": "ed0340b507c8fb23f1fa1ae1b3ca1297006d70c289a016233d9f1d5291801aa8",
              "tinygrad_repo/tinygrad/runtime/ops_cpu.py": "012f3d932abba9e14f82aedefe0ca52243eba1728f847c38cae54ae05b171a16",
              "tinygrad_repo/tinygrad/runtime/support/hcq.py": "86ccce42fce7fe59f4cd2e345d9186b7241e44a00763ee51712c16a10b521bff",
          }
          def check_sources():
              for path, digest in (source_pins | runtime_pins).items():
                  assert sha((ROOT / path).read_bytes()) == digest, path
          check_sources()
          fixture_path = ROOT / "rust/crates/model-runtime/tests/fixtures/compiler/original-fusion-boundary.json"
          fixture_raw = sealed(fixture_path, "42ca6f6bc73859ce559667f166dee2c335484cba80c7633c9f62b5d82db32c2a")
          fixture = json.loads(fixture_raw)
          materialized = bytes.fromhex(fixture["materialized_positive"]["input_hex"])
          assert len(materialized) == 960 * 8 * 12 * 4
          assert sha(materialized) == fixture["materialized_positive"]["original_input_sha256"] == "af9e1224e9f618475b0220047b9aae4727fc188d81e85bbcd93acdf4a70899d6"

          provider_path = Path(os.environ["LLVM_PATH"])
          provider_sha = "5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0"
          assert sha(provider_path.read_bytes()) == provider_sha == prior["provider_sha256"]
          source_key = prior["terminal"]["source"]
          source_raw = sealed(PRIOR / f"{source_key}.ll", source_key)
          object_sha = "e93d6b49c1bd264ce9ad09d52aa2df3076bf2d347ba04ff51f11e486cd48b13a"
          assert prior["program_object_sha256"][source_key] == object_sha
          object_raw = sealed(PRIOR / f"{source_key}.objbin", object_sha)
          assert prior["boundaries"]["terminal_after"]["0"]["sha256"] == prior["output_sha256"]
          input_raw = []
          for slot, expected in ((1, "6b09792401afbb0ff5e66e27a23ff1b97ef4848336c3b56422e9b887c7a81f76"),
                                 (2, "e22b07bf7157d16b2c4200189ec552d2b909f854ee5399288d8c612411e38136"),
                                 (3, "4f5d24001ddc1ae0dc8e4e4f75a7a5800bea41cf3fda77a77ff44b36c67a0597")):
              boundary = prior["boundaries"]["terminal_before"][str(slot)]
              assert boundary["sha256"] == expected
              raw = sealed(PRIOR / boundary["file"], expected)
              assert len(raw) == prior["terminal"]["regions"][str(slot)]["bytes"]
              input_raw.append(raw)
          expected_output = sealed(PRIOR / prior["boundaries"]["terminal_after"]["0"]["file"], prior["output_sha256"])

          from tinygrad.device import Device
          from tinygrad.runtime.ops_cpu import CPUProgram
          from tinygrad.runtime.support.compiler_cpu import CPULLVMCompiler
          from tinygrad.runtime.support.elf import jit_loader
          assert Path(__import__("tinygrad").__file__).resolve().is_relative_to(ROOT / "tinygrad_repo")
          device = Device["CPU"]
          compiler = device.renderer.compiler
          assert isinstance(compiler, CPULLVMCompiler)
          compiler.cachekey = None

          def capture_original_prefix(index, output_name, prefix_hash, output_hash):
              """Cold original prefix from the pinned model, with actual terminal ownership."""
              from tinygrad import Tensor, dtypes
              from tinygrad.nn.onnx import OnnxRunner
              from tinygrad.engine.realize import compile_linear, resolve_params, ExecContext, pm_exec, get_call_outs_ins
              from tinygrad.uop.ops import Ops
              model = ROOT / "openpilot/selfdrive/modeld/models/dmonitoring_model.onnx"
              model_hash = "dee5a294e8afaacc9295ac5d100e00733ecac278e79264b96331e40a3ede1b04"
              sealed(model, model_hash)
              helper = HERE / "prior" / "capture_prefix_contexts.py"
              tree = ast.parse(helper.read_text())
              methods = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in {"vi", "f", "m", "readvi", "fields", "prefix_bytes"}]
              namespace = {"MODEL": model}
              exec(compile(ast.Module(body=methods, type_ignores=[]), str(helper), "exec"), namespace)
              prefix = namespace["prefix_bytes"](index, [output_name])
              assert sha(prefix) == prefix_hash
              prefix_path = OUTPUT / f"prefix{index}.onnx"
              prefix_path.write_bytes(prefix)
              raw_inputs = {"input_img": bytes(range(256)) * 5400,
                            "calib": struct.pack("<3f", 1 + 2**-11, -0., .3)}
              tensors = {"input_img": Tensor(raw_inputs["input_img"], dtype=dtypes.uint8).reshape(1, 1382400),
                         "calib": Tensor(raw_inputs["calib"], dtype=dtypes.float32).reshape(1, 3)}
              out = OnnxRunner(prefix_path)(tensors)[output_name].cast(dtypes.float32)
              linear, variables = out.linear_with_vars()
              original_compile = compiler.compile_to_obj
              source_objects = {}
              compile_calls = [0]
              def counted(source):
                  obj = original_compile(source)
                  key = sha(source.encode())
                  source_objects[key] = sha(obj)
                  compile_calls[0] += 1
                  (OUTPUT / f"prefix{index}-{key}.ll").write_text(source)
                  (OUTPUT / f"prefix{index}-{key}.objbin").write_bytes(obj)
                  return obj
              compiler.compile_to_obj = counted
              try:
                  compiled = compile_linear(linear)
                  bases = {}
                  def region(buffer):
                      identity = id(buffer.base)
                      if identity not in bases:
                          bases[identity] = len(bases)
                      return dict(base=bases[identity], offset=buffer.offset, bytes=buffer.nbytes, dtype=str(buffer.dtype))
                  def overlaps(a, b):
                      return a["base"] == b["base"] and max(a["offset"], b["offset"]) < min(a["offset"] + a["bytes"], b["offset"] + b["bytes"])
                  returned = region(out.uop.buffer)
                  writers = []
                  for index, call in enumerate(compiled.src):
                      operation = call.src[0]
                      outs, ins = get_call_outs_ins(call)
                      params = resolve_params(call, ())
                      if operation.op is Ops.PROGRAM:
                          key = sha(operation.src[3].arg.encode())
                          assert key in source_objects
                          slots = operation.arg.globals
                      else:
                          key = None
                          slots = tuple(range(len(params)))
                      for slot in outs:
                          if operation.op is not Ops.SLICE and overlaps(region(params[slot].buffer), returned):
                              writers.append((index, call, slot, operation.op.name, key, list(outs), list(ins), list(slots), region(params[slot].buffer)))
                  assert writers
                  index, terminal_call, output_slot, op, key, outs, ins, globals_, output_region = writers[-1]
                  assert op == "PROGRAM" and output_region == returned
                  ctx = ExecContext(variables, (), True, True, True)
                  terminal_raw = None
                  for at, call in enumerate(compiled.src):
                      pm_exec.rewrite(call, ctx)
                      if at == index:
                          terminal_raw = bytes(resolve_params(call, ())[output_slot].buffer.as_memoryview())
                  before_read_calls = compile_calls[0]
                  before_read_objects = dict(source_objects)
                  raw = out.data().tobytes()
                  assert compile_calls[0] == before_read_calls and source_objects == before_read_objects
                  assert terminal_raw == raw and len(raw) == 368640
                  assert sha(raw) == output_hash
                  (OUTPUT / f"materialized-prefix{index}.bin").write_bytes(raw)
                  receipt = dict(model_sha256=model_hash, prefix_sha256=prefix_hash,
                                 input_sha256={name: sha(value) for name, value in raw_inputs.items()},
                                 output_sha256=sha(raw), shape=[1, 960, 8, 12],
                                 returned=returned, terminal=dict(call=index, output_slot=output_slot, op=op,
                                 source=key, outs=outs, ins=ins, globals=globals_, region=output_region),
                                 program_object_sha256=source_objects,
                                 compile_calls_after_execution=before_read_calls,
                                 compile_calls_after_output_read=compile_calls[0])
                  (OUTPUT / f"materialized-prefix{index}-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
                  return raw, receipt
              finally:
                  compiler.compile_to_obj = original_compile

          materialized_conv91, conv91_receipt = capture_original_prefix(
              91, "getitem_132", "846069ff34bc5ada1a534ca96631a820cb44a0367718ae9a4512727364d2b8ce",
              "f3fbba7c06e6304d7e14a98da1f34a9aeb269cfc3e54459a2e6abc31d7dd9aed")
          materialized_gelu92, gelu92_receipt = capture_original_prefix(
              92, "gelu_28", "38c08c9019cfac8e4fd4714591978e1338c7fc84e3fab1c1d9166d93dc5067d4",
              "af9e1224e9f618475b0220047b9aae4727fc188d81e85bbcd93acdf4a70899d6")
          assert materialized_gelu92 == materialized
          assert gelu92_receipt["terminal"]["source"] == "f2c45130cd720e831837744139a88264c8bdc174c25be8603b7e36356e559585"

          class Aligned:
              def __init__(self, size, initial=None):
                  self.allocation = ctypes.create_string_buffer(size + 31)
                  self.addr = (ctypes.addressof(self.allocation) + 31) & ~31
                  self.size = size
                  if initial is not None:
                      assert len(initial) == size
                      ctypes.memmove(self.addr, initial, size)
              def bytes(self):
                  return ctypes.string_at(self.addr, self.size)

          def execute(obj, name, traced=False):
              inputs = [Aligned(len(raw), raw) for raw in input_raw]
              output = Aligned(3840)
              gelu_trace = Aligned(960 * 96 * 4, b"\xaa" * (960 * 96 * 4)) if traced else None
              conv_trace = Aligned(960 * 96 * 4, b"\xaa" * (960 * 96 * 4)) if traced else None
              program = CPUProgram(device, name, jit_loader(obj))
              for tid in range(16):
                  args = [ctypes.c_uint64(output.addr), *(ctypes.c_uint64(v.addr) for v in inputs)]
                  if gelu_trace is not None:
                      args.extend((ctypes.c_uint64(gelu_trace.addr), ctypes.c_uint64(conv_trace.addr)))
                  program.fxn(*args, ctypes.c_int32(tid))
              assert [buf.bytes() for buf in inputs] == input_raw, "kernel modified captured input"
              return output.bytes(), None if gelu_trace is None else gelu_trace.bytes(), None if conv_trace is None else conv_trace.bytes()

          original_output, _, _ = execute(object_raw, "r_15_4_16_128_24_4")
          (OUTPUT / "original-output.bin").write_bytes(original_output)
          assert sha(original_output) == prior["output_sha256"] and original_output == expected_output

          # The source's v14 is the output channel, v34 is a 24-step reduction loop,
          # and v335/v360/v385/v410 are the four Gelu values added to reg_1 in order.
          source = source_raw.decode()
          signature = "i16* noalias align 32 %data3, i32 %data4) #0"
          assert source.count(signature) == 1
          source = source.replace(signature, "i16* noalias align 32 %data3, float* noalias align 32 %data5, float* noalias align 32 %data6, i32 %data4) #0")
          anchor = "  store float %v411, float* %v5\n"
          assert source.count(anchor) == 1
          instrumentation = """  %diag_ch = mul i32 %v14, 96
            %diag_group = shl i32 %v34, 2
            %diag_index0 = add i32 %diag_ch, %diag_group
            %diag_ptr0 = getelementptr inbounds float, float* %data5, i32 %diag_index0
            store float %v335, float* %diag_ptr0
            %diag_index1 = add i32 %diag_index0, 1
            %diag_ptr1 = getelementptr inbounds float, float* %data5, i32 %diag_index1
            store float %v360, float* %diag_ptr1
            %diag_index2 = add i32 %diag_index0, 2
            %diag_ptr2 = getelementptr inbounds float, float* %data5, i32 %diag_index2
            store float %v385, float* %diag_ptr2
            %diag_index3 = add i32 %diag_index0, 3
            %diag_ptr3 = getelementptr inbounds float, float* %data5, i32 %diag_index3
            store float %v410, float* %diag_ptr3
            %diag_conv_ptr0 = getelementptr inbounds float, float* %data6, i32 %diag_index0
            store float %v168, float* %diag_conv_ptr0
            %diag_conv_ptr1 = getelementptr inbounds float, float* %data6, i32 %diag_index1
            store float %v184, float* %diag_conv_ptr1
            %diag_conv_ptr2 = getelementptr inbounds float, float* %data6, i32 %diag_index2
            store float %v200, float* %diag_conv_ptr2
            %diag_conv_ptr3 = getelementptr inbounds float, float* %data6, i32 %diag_index3
            store float %v216, float* %diag_conv_ptr3
          """
          source = source.replace(anchor, instrumentation + anchor)
          instrumented_ir = source.encode()
          (OUTPUT / "instrumented.ll").write_bytes(instrumented_ir)
          instrumented_object = compiler.compile_to_obj(source)
          (OUTPUT / "instrumented.objbin").write_bytes(instrumented_object)
          instrumented_output, trace, conv_trace = execute(instrumented_object, "r_15_4_16_128_24_4", traced=True)
          (OUTPUT / "instrumented-output.bin").write_bytes(instrumented_output)
          assert trace is not None and conv_trace is not None
          (OUTPUT / "gelu-trace.bin").write_bytes(trace)
          (OUTPUT / "conv-trace.bin").write_bytes(conv_trace)
          record = {
              "kind": "original-kernel-diagnostic-only",
              "head_sha": os.environ["GITHUB_SHA"],
              "prior_run": 39488465388,
              "prior_artifact": 12294054127,
              "prior_receipt_sha256": sha(prior_receipt_raw),
              "prior_driver_sha256": prior["driver_sha256"],
              "driver_sha256": sha(Path(__file__).read_bytes()),
              "source_sha256": source_pins,
              "runtime_source_sha256": runtime_pins,
              "fixture_sha256": sha(fixture_raw),
              "materialized_gelu92_sha256": sha(materialized),
              "original_ir_sha256": sha(source_raw),
              "original_object_sha256": sha(object_raw),
              "instrumented_ir_sha256": sha(instrumented_ir),
              "instrumented_object_sha256": sha(instrumented_object),
              "provider_sha256": provider_sha,
              "input_sha256": [sha(raw) for raw in input_raw],
              "original_output_sha256": sha(original_output),
              "instrumented_output_sha256": sha(instrumented_output),
              "trace_sha256": sha(trace),
              "conv_trace_sha256": sha(conv_trace),
              "materialized_conv91_sha256": sha(materialized_conv91),
              "materialized_conv91": conv91_receipt,
              "materialized_gelu92": gelu92_receipt,
              "trace_shape": [960, 24, 4],
              "trace_index": "channel*96 + group*4 + lane",
          }
          (OUTPUT / "receipt-before-comparison.json").write_text(json.dumps(record, indent=2) + "\n")
          assert instrumented_output == expected_output and sha(instrumented_output) == prior["output_sha256"], "instrumentation changed final output; discard trace"

          # Independently materialized Gelu92 has shape [1,960,8,12] and 96 contiguous
          # spatial values per channel. Verify the proposed 24x4 lane map empirically;
          # preserve competing lane-major counts so a bad map cannot masquerade as drift.
          def words(raw):
              return struct.unpack("<" + "I" * (len(raw) // 4), raw)
          observed = words(trace)
          baseline = words(materialized)
          assert len(observed) == len(baseline) == 960 * 96
          observed_conv = words(conv_trace)
          baseline_conv = words(materialized_conv91)
          assert len(observed_conv) == len(baseline_conv) == 960 * 96
          direct = sum(a == b for a, b in zip(observed, baseline))
          lane_major = sum(observed[ch*96 + group*4 + lane] == baseline[ch*96 + lane*24 + group]
                           for ch in range(960) for group in range(24) for lane in range(4))
          reverse_lane = sum(observed[ch*96 + group*4 + lane] == baseline[ch*96 + group*4 + (3-lane)]
                             for ch in range(960) for group in range(24) for lane in range(4))
          record["mapping_exact_matches"] = {"group_major": direct, "lane_major": lane_major, "reverse_lane": reverse_lane}
          record["total_gelu_values"] = len(observed)
          record["differing_channels"] = {str(ch): sum(observed[ch*96+i] != baseline[ch*96+i] for i in range(96)) for ch in (46, 568, 704)}
          record["first_differences"] = [{"channel": i // 96, "spatial": i % 96, "fused_bits": f"{a:08x}", "materialized_bits": f"{b:08x}"}
                                         for i, (a, b) in enumerate(zip(observed, baseline)) if a != b][:32]
          record["conv_exact_matches"] = sum(a == b for a, b in zip(observed_conv, baseline_conv))
          record["target_pairs"] = [{"channel": ch, "spatial": spatial,
                                     "fused_conv_bits": f"{observed_conv[ch*96+spatial]:08x}",
                                     "materialized_conv_bits": f"{baseline_conv[ch*96+spatial]:08x}",
                                     "fused_gelu_bits": f"{observed[ch*96+spatial]:08x}",
                                     "materialized_gelu_bits": f"{baseline[ch*96+spatial]:08x}"}
                                    for ch, spatial in ((46, 54), (568, 21), (704, 78))]
          check_sources()
          assert sha(provider_path.read_bytes()) == provider_sha
          assert sha(fixture_path.read_bytes()) == sha(fixture_raw)
          assert sha((ROOT / "openpilot/selfdrive/modeld/models/dmonitoring_model.onnx").read_bytes()) == prior["model_sha256"]
          for slot, raw in enumerate(input_raw, 1):
              assert sha((PRIOR / prior["boundaries"]["terminal_before"][str(slot)]["file"]).read_bytes()) == sha(raw)
          sealed(HERE / "prior" / "capture_prefix93_owners.py", prior["driver_sha256"])
          sealed(HERE / "prior" / "capture_prefix_contexts.py", "d2e405325f2312a84d22117aba411606838a6bab6bbb61c67df39a83da6fef3c")
          assert sha((PRIOR / f"{source_key}.ll").read_bytes()) == source_key
          assert sha((PRIOR / f"{source_key}.objbin").read_bytes()) == object_sha
          (OUTPUT / "receipt.json").write_text(json.dumps(record, indent=2) + "\n")
          assert direct >= 9 * len(observed) // 10 and direct > max(lane_major, reverse_lane) + 10000, "physical Gelu mapping unproved; no localization"
          print("verified original-only terminal diagnostic", record["mapping_exact_matches"], record["differing_channels"], flush=True)
          PREFIX93_KERNEL_DRIVER
