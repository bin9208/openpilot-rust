          assert os.environ["CPU_COUNT"] == "16"
          assert os.environ["DEV"] == "CPU:LLVM:x86_64,x86-64"
          assert os.environ["CACHELEVEL"] == "0"
          assert os.environ["CCACHE"] == "0"
          assert os.environ.get("GRAPH_ONLY") != "1"
          HERE = Path(__file__).resolve().parent
          BASE = HERE / "capture_prefix274_current.py"
          WIRE = HERE / "capture_prefix_contexts.py"
