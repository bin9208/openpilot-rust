          The two adjacent dependencies are byte-identical historical original drivers.
          This wrapper changes only their source-root/output selection and requested ONNX
          prefix, then replaces the old node-274 size-selected capture with generic
          returned-buffer ownership discovery. It never imports a Rust candidate.
