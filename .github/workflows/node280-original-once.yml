name: One-time original node 280 capture (issue 296)
on:
  push:
    branches:
      - codex/feat-296-node280-original-capture
    paths:
      - .github/workflows/node280-original-once.yml
permissions:
  contents: read
jobs:
  original-node280:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve disk before dependencies and capture
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
      - name: Install original-only dependencies and pinned model
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs libllvm18
          python -m pip install numpy==2.5.3 onnx==1.20.1
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 3072
          git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''
          printf 'f73a9e535523d5e9acb9e642c64e33d631825dc8ba74123757d107cedd047bb5  openpilot/selfdrive/modeld/models/driving_supercombo.onnx\n' | sha256sum --check --strict
      - name: Fetch exact LLVM 18 and LLVM 20 provider binaries
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 3072
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/llvm18.deb" 'https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb'
          printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm18.deb" "$RUNNER_TEMP/llvm18-captured"
          printf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/llvm20.deb" 'https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-20/libllvm20_20.1.2-0ubuntu1%7e24.04.3_amd64.deb'
          printf 'f018e71c72c7a4742fb1aff9dc98b45586f42e6ea464d4918af7e3772b7f0658  %s/llvm20.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm20.deb" "$RUNNER_TEMP/llvm20-captured"
          printf '4b93481bd1c9d42c0951275dd275d4a9d30db78c309ae2cc0405669bc6dbbf8a  %s/llvm20-captured/usr/lib/x86_64-linux-gnu/libLLVM.so.20.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
      - name: Stage immutable original capture drivers
        shell: bash
        run: |
          set -euo pipefail
          capture_dir="$GITHUB_WORKSPACE/.analysis/scratch/2026-10-21-model-next"
          mkdir -p "$capture_dir"
          cat > "$capture_dir/capture_actual_node280.py" <<'NODE280_CAPTURE_ACTUAL_NODE280_PY'
