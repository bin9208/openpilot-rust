          replace_once(
              "assert scope_root==Path('/home/fma1/.codex/worktrees/native-build-tools-296/openpilot-rust')",
              "assert scope_root==Path(os.environ['GITHUB_WORKSPACE']).resolve()",
          )
          replace_once(
              "for relative,want in source_pins.items():",
              "source_pins.update({'tinygrad_repo/tinygrad/mixin/elementwise.py':'648b15352bbad5a62fc50b1129d23c30ec5a068aab7a4c70aff8325e87b1bcd2','tinygrad_repo/tinygrad/uop/decompositions.py':'907e0660b37758b3dea3324c99292ad73590ea09fdefd1bbd831c4e78068c7e3','tinygrad_repo/tinygrad/device.py':'7c28ae3854a3f009fc6eddfb52f03b3d382a23b581d94a3c4741a12bdc79f008','tinygrad_repo/tinygrad/uop/ops.py':'d4b454cc4577a23be8d688aed874b9911992332e21bea7d7567974c9dc7c197a'})\nfor relative,want in source_pins.items():",
          )
