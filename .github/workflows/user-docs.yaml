name: user docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - carrot-wip
      - dev
      - main
  workflow_dispatch:

jobs:
  check_user_docs:
    name: check mapped user docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check code and user documentation changes
        env:
          DOCS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DOCS_EVENT_NAME: ${{ github.event_name }}
        run: |
          free_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if (( free_bytes < (25 + 2) * 1024 * 1024 * 1024 )); then
            echo 'Retain 25 GiB plus build growth; recover at least 35 GiB before retry.' >&2
            exit 1
          fi
          args=(--base "$DOCS_BASE_SHA")
          if [ "$DOCS_EVENT_NAME" = "push" ]; then
            args+=(--commit-overrides)
          fi
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 cargo +1.94.0 run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin check-user-docs -- "${args[@]}"
      - name: Test user documentation checker
        if: ${{ !cancelled() }}
        run: |
          free_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if (( free_bytes < (25 + 2) * 1024 * 1024 * 1024 )); then
            echo 'Retain 25 GiB plus build growth; recover at least 35 GiB before retry.' >&2
            exit 1
          fi
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test user_docs
