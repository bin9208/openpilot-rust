name: 296 calibration same ELF absence and fresh original CLI proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/calibration-estimator-retirement-296-once.yml
permissions:
  contents: read
jobs:
  calibration-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: 72f3ebe36f832c10659b2529d58e28496b146f7b
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 72f3ebe36f832c10659b2529d58e28496b146f7b
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.14
    - name: Admit exact checkout and native-only prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        proof="$RUNNER_TEMP/calibration-estimator-native-296"

        mkdir -p "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev pkg-config strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        printf ''CALIBRATION_REFERENCE_BINARY=%s/rust/target/debug/examples/calibration_trace\nCALIBRATION_REFERENCE_EVIDENCE=%s/test-output\n''
        "$GITHUB_WORKSPACE" "$proof" >> "$GITHUB_ENV"


        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0

        printf ''CALIBRATION_REFERENCE_CHECKER_BINARY=%s/rust/target/debug/check-calibration-reference\nCALIBRATION_REFERENCE_RETIREMENT_EVIDENCE=%s/retirement\nCALIBRATION_REFERENCE_EXPECT_ABSENT=0\n''
        "$GITHUB_WORKSPACE" "$proof" >> "$GITHUB_ENV"

        '
    - name: Build actual estimator example and complete Rust comparator CLI
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/calibration-estimator-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-calibrationd --example calibration_trace --locked
        2>&1 | tee "$proof/example-build.log"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features calibration-reference-native
        --bin check-calibration-reference --locked 2>&1 | tee "$proof/checker-build.log"

        sha256sum rust/target/debug/examples/calibration_trace rust/target/debug/check-calibration-reference > "$proof/ELFS.sha256"

        '
    - name: Require all 15128 steps, full packet and CLI contracts, negative controls and Clippy
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/calibration-estimator-native-296\"\nrust/tools/check-disk-space --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 1024\nPYTHONPATH=\"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/opendbc_repo\" python\
        \ rust/tools/check_calibration_reference.py --binary \"$CALIBRATION_REFERENCE_BINARY\" --output \"$proof/fresh-original\"\
        \ > \"$proof/fresh-original.stdout\" 2> \"$proof/fresh-original.stderr\"\ncargo +1.94.0 test --manifest-path rust/Cargo.toml\
        \ -p openpilot-dev-tools --features calibration-reference-native --lib calibration_reference_check::tests --locked\
        \ -- --nocapture 2>&1 | tee \"$proof/unit-tests.log\"\ncargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features calibration-reference-native --test calibration_reference_check --test calibration_reference_retirement\
        \ --locked -- --nocapture 2>&1 | tee \"$proof/full-parity.log\"\nrust/target/debug/check-calibration-reference --binary\
        \ \"$CALIBRATION_REFERENCE_BINARY\" --output \"$proof/cli-output\" > \"$proof/cli.stdout\" 2> \"$proof/cli.stderr\"\
        \ntest -s \"$proof/cli-output/report.json\"\ntest -s \"$proof/cli-output/trace.jsonl\"\ntest ! -s \"$proof/cli.stderr\"\
        \nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 1024\ncargo +1.94.0 clippy --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features calibration-reference-native --lib --bin check-calibration-reference\
        \ --test calibration_reference_check --test calibration_reference_retirement --locked -- -D warnings 2>&1 | tee \"\
        $proof/clippy.log\"\nsha256sum --check \"$proof/ELFS.sha256\"\n\npython - \"$proof\" <<'PYCOMPARE'\nfrom pathlib import\
        \ Path\nimport json, sys\np=Path(sys.argv[1])\noriginal=json.loads((p/'fresh-original/report.json').read_bytes())\n\
        native=json.loads((p/'cli-output/report.json').read_bytes())\nassert original == native, (original,native)\nassert\
        \ json.loads((p/'fresh-original.stdout').read_bytes()) == original\nassert json.loads((p/'cli.stdout').read_bytes())\
        \ == original\nold=(p/'fresh-original/trace.jsonl').read_bytes()\nnew=(p/'cli-output/trace.jsonl').read_bytes()\n\
        assert len(old.splitlines()) == len(new.splitlines()) == 15128\n# Both controllers drive the same current native estimator;\
        \ preserve every native state field.\nfor a,b in zip(old.splitlines(),new.splitlines(),strict=True):\n assert json.loads(a)==json.loads(b),\
        \ 'full CLI trace contract differs'\n(p/'fresh-cli-contract.json').write_text(json.dumps({'passed':True,'steps':15128,'report':original},indent=2)+'\\\
        n')\nPYCOMPARE\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: calibration-estimator-native-296
        path: ${{ runner.temp }}/calibration-estimator-native-296/
