{
  "name": "296 maintained publisher caller policy with verified common temp",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/model-publisher-ci-activation-common-296-once.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "EXPECTED_SOURCE": "9368bbf328cfd49aea0d7c888153511355592d4f",
    "RUSTUP_TOOLCHAIN": "1.94.0",
    "CARGO_INCREMENTAL": "0",
    "CARGO_BUILD_JOBS": "2",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "CPU_COUNT": "2",
    "DEV": "CPU:LLVM",
    "JIT": "1",
    "JIT_BATCH_SIZE": "0",
    "OPENPILOT_HACKS": "1",
    "LLVM_PATH": "/usr/lib/x86_64-linux-gnu/libLLVM-18.so",
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "caller": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Verified common owned shell temp",
          "id": "common-job-temp",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2"
        },
        {
          "name": "Allocate fresh owned job root and record actual resources",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_ACTIONS\" = true\ntest \"$RUNNER_NAME\" = bin-actions\ntest \"$RUNNER_OS\" = Linux && test \"$RUNNER_ARCH\" = X64\njob_root=$(mktemp -d \"$RUNNER_TEMP/296-model-publisher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXXXX\")\nmkdir \"$job_root/proof\" \"$job_root/artifact\" \"$job_root/tmp\" \"$job_root/cargo\" \"$job_root/rustup\" \"$job_root/pip-cache\" \"$job_root/xdg-cache\" \"$job_root/pycache\"\nprintf '{\"run_id\":\"%s\",\"attempt\":\"%s\",\"job\":\"%s\",\"runner\":\"%s\"}\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$GITHUB_JOB\" \"$RUNNER_NAME\" > \"$job_root/job-owner.json\"\nprintf 'PUBLISHER_JOB_ROOT=%s\\nPUBLISHER_CALLER_PROOF=%s/proof\\nCARGO_TARGET_DIR=%s/target\\nCARGO_HOME=%s/cargo\\nRUSTUP_HOME=%s/rustup\\nPIP_CACHE_DIR=%s/pip-cache\\nXDG_CACHE_HOME=%s/xdg-cache\\nPYTHONPYCACHEPREFIX=%s/pycache\\nTMPDIR=%s/tmp\\nPUBLISHER_SOURCE_ROOT=%s/source\\n' \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" \"$job_root\" >> \"$GITHUB_ENV\"\nprintf 'CACHEDB=%s/xdg-cache/tinygrad/cache.db\\nUV_CACHE_DIR=%s/uv-cache\\n' \"$job_root\" \"$job_root\" >> \"$GITHUB_ENV\"\nexport PUBLISHER_JOB_ROOT=\"$job_root\"\nbase64 --decode <<'RESOURCES' | gzip --decompress > \"$job_root/proof/runner_resources.py\"\\nRESOURCES\nprintf '%s  %s\\n' 94b1546b235131dd396c37ec0cc4c11d625c7abce05490f094f1811955c1b2b6 \"$job_root/proof/runner_resources.py\" | sha256sum --check --strict -\nbase64 --decode <<'MEASURED_PROFILE' | gzip --decompress > \"$job_root/proof/resource-evidence.json\"\\nMEASURED_PROFILE\nprintf '%s  %s\\n' 26cf93c757d3a66a0e3632e9b4015af7bc27c86942c7b5d208202e730a240884 \"$job_root/proof/resource-evidence.json\" | sha256sum --check --strict -\nbase64 --decode <<'GROWTH_SOURCE_ROSTER' | gzip --decompress > \"$job_root/proof/growth-policy-sources.json\"\\nGROWTH_SOURCE_ROSTER\nprintf '%s  %s\\n' 2dba1b00538d0371243cf0343febcc01ae00e94bf40b93b9f8940968a872ea8e \"$job_root/proof/growth-policy-sources.json\" | sha256sum --check --strict -\npython3 \"$job_root/proof/runner_resources.py\" initialize 4096 unmeasured\n"
        },
        {
          "name": "Fetch exact trusted source into fresh isolated checkout",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'OPERATION_BODY' | gzip --decompress > \"$PUBLISHER_CALLER_PROOF/step-1.sh\"\\nOPERATION_BODY\nprintf '%s  %s\\n' 04612b3cc4c66231e51dccc71191dec82c4d81455b34b7da6000a64c197c1154 \"$PUBLISHER_CALLER_PROOF/step-1.sh\" | sha256sum --check --strict -\npython3 \"$PUBLISHER_CALLER_PROOF/runner_resources.py\" run step-1 -- bash \"$PUBLISHER_CALLER_PROOF/step-1.sh\"\n"
        },
        {
          "name": "Admit existing OS providers and isolated toolchain",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'OPERATION_BODY' | gzip --decompress > \"$PUBLISHER_CALLER_PROOF/step-2.sh\"\\nOPERATION_BODY\nprintf '%s  %s\\n' 681a827420347a2901579911e5ea7d6a2ded62f020601a8edc85e085836e1959 \"$PUBLISHER_CALLER_PROOF/step-2.sh\" | sha256sum --check --strict -\npython3 \"$PUBLISHER_CALLER_PROOF/runner_resources.py\" run step-2 -- bash \"$PUBLISHER_CALLER_PROOF/step-2.sh\"\n"
        },
        {
          "name": "Install pinned compiler dependencies only inside job virtualenv",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode <<'OPERATION_BODY' | gzip --decompress > \"$PUBLISHER_CALLER_PROOF/step-3.sh\"\\nOPERATION_BODY\nprintf '%s  %s\\n' 57800e594ff84dadc08ecbed235e25258617e4ad11d67178147760d96741e24f \"$PUBLISHER_CALLER_PROOF/step-3.sh\" | sha256sum --check --strict -\npython3 \"$PUBLISHER_CALLER_PROOF/runner_resources.py\" run step-3 -- bash \"$PUBLISHER_CALLER_PROOF/step-3.sh\"\n"
        },
        {
          "name": "Focused maintained policy and combined emitter caller only",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$PUBLISHER_SOURCE_ROOT\"\nprintf '%s  %s\\n' \\\n ee51c703e3f56e292a8b51e0588d5b18083e1f6f6014396a573635dc6ea0c2a9 \".github/workflows/rust.yml\" \\\n 36c443db4b78f18df3fdf0fe757814043501eaa33ffcd9da828f39a15f05197d \"rust/crates/dev-tools/tests/ci_model_catalog_publisher.rs\" \\\n f31059ddffc8007c513f230919e671d3c87b8f441be3deac29338969ca6db22a \"rust/crates/model-runtime/tests/catalog.rs\" \\\n 0b4e9b2255f28ed432b54d6a92959e626f0ae1ae9e89f92c9f68bad18e85d5b6 \"rust/tools/build_model_pipelines.py\" \\\n a84c16387288d8f4a55002543e3773f597d0740e27c508c3028b31514b89938f \"rust/tools/model_export/publish.py\" \\\n f9aed4352ae9b41fbacc20e3887261281ef53b2cc1d912bbc06266417f8274eb \"rust/crates/dev-tools/src/model_family_prepare/catalog.rs\" \\\n 2d389e4313d24ddaa8320145218bad1d3f6068e4d35a97fe3aa9d4dde4fb8fa7 \"rust/crates/dev-tools/src/driver_daemon_current_catalog.rs\" \\\n 243524fd4e2be128f2450d91dfcb1444dc780f505e6047faaee38a8231418438 \"rust/crates/model-runtime/src/catalog_publish.rs\" \\\n cedca3d24c20a4364bd8e6decd5821c788770f82bd975a1aa68e42e8e95fbfae \"rust/crates/model-runtime/src/bin/publish-model-catalog.rs\" | sha256sum --check --strict - > \"$PUBLISHER_CALLER_PROOF/focused-reviewed-source-pins.log\"\nbase64 --decode <<'FOCUSED_LEAF' | gzip --decompress > \"$PUBLISHER_CALLER_PROOF/focused-validation.sh\"\\nFOCUSED_LEAF\nprintf '%s  %s\\n' 7e7a7bd0a47cd441dd1938150dcc4d98fb5dcb32ff05ac11a35f6bb08c64ea8f \"$PUBLISHER_CALLER_PROOF/focused-validation.sh\" | sha256sum --check --strict -\nbash \"$PUBLISHER_CALLER_PROOF/focused-validation.sh\"\n"
        },
        {
          "name": "Always package raw failure or success evidence",
          "if": "always() && env.PUBLISHER_JOB_ROOT != ''",
          "shell": "bash",
          "run": "set -euo pipefail\nproof=\"$PUBLISHER_CALLER_PROOF\"\nout=\"$PUBLISHER_JOB_ROOT/artifact\"\ntest -d \"$proof\" && test -d \"$out\"\npython3 \"$proof/runner_resources.py\" package 512 unmeasured\n# Pack bounded raw evidence even when a functional step fails. Never dereference\n# deliberate helper aliases; record the symlink itself in tar.\npython - <<'BOUND_PROOF'\nimport os,stat,json\nfrom pathlib import Path\nroot=Path(os.environ['PUBLISHER_CALLER_PROOF'])\ncount=total=0\nfor path in root.rglob('*'):\n m=path.lstat();count+=1\n assert count<=100000\n assert stat.S_ISREG(m.st_mode) or stat.S_ISDIR(m.st_mode) or stat.S_ISLNK(m.st_mode),path\n if stat.S_ISREG(m.st_mode):\n  assert m.st_size<=128*1024**2,path\n  total+=m.st_size\n assert total<=512*1024**2\n(root/'artifact-counts.json').write_text(json.dumps({'entries':count,'file_bytes':total})+'\\n')\nBOUND_PROOF\nfind \"$proof\" -type f -print0 | sort -z > \"$out/files.nul\"\nxargs -0 -r sha256sum < \"$out/files.nul\" > \"$out/files.sha256\"\nfind \"$proof\" -printf '%P\\0' | sort -z > \"$out/roster.nul\"\ntar -C \"$proof\" -czf \"$out/proof.tar.gz\" .\nsha256sum \"$out/proof.tar.gz\" > \"$out/proof.sha256\"\n",
          "id": "package_evidence"
        },
        {
          "uses": "actions/upload-artifact@v7",
          "id": "publisher-evidence",
          "if": "always() && env.PUBLISHER_JOB_ROOT != ''",
          "with": {
            "name": "296-model-publisher-ci-activation-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.PUBLISHER_JOB_ROOT }}/artifact",
            "if-no-files-found": "error",
            "retention-days": "7"
          }
        },
        {
          "name": "Clean only the marked job-owned root after artifact upload",
          "if": "${{ always() && steps.package_evidence.outcome == 'success' && steps.publisher-evidence.outcome == 'success' && steps.publisher-evidence.outputs.artifact-id != '' && steps.publisher-evidence.outputs.artifact-digest != '' }}",
          "shell": "bash",
          "run": "set -euo pipefail\nif test -n \"${PUBLISHER_JOB_ROOT:-}\" && test -f \"$PUBLISHER_JOB_ROOT/job-owner.json\"; then\n case \"$PUBLISHER_JOB_ROOT\" in \"$RUNNER_TEMP\"/296-model-publisher-\"$GITHUB_RUN_ID\"-\"$GITHUB_RUN_ATTEMPT\"-*) ;; *) exit 1;; esac\n python3 - <<'OWNER'\nimport json,os\nfrom pathlib import Path\np=Path(os.environ['PUBLISHER_JOB_ROOT'])/'job-owner.json';v=json.loads(p.read_bytes())\nassert (v['run_id'],v['attempt'],v['job'],v['runner'])==(os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'],os.environ['GITHUB_JOB'],'bin-actions')\nOWNER\n rm -rf -- \"$PUBLISHER_JOB_ROOT\"\nfi\n",
          "id": "publisher-owned-cleanup"
        },
        {
          "name": "Clean verified common owned shell temp after evidence upload",
          "uses": "bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2",
          "if": "${{ always() && steps.package_evidence.outcome == 'success' && steps.publisher-owned-cleanup.outcome == 'success' && steps.publisher-evidence.outputs.artifact-id != '' && steps.publisher-evidence.outputs.artifact-digest != '' }}",
          "with": {
            "cleanup": "true"
          }
        }
      ]
    }
  },
  "concurrency": {
    "group": "296-model-publisher-ci-activation-common-focused",
    "cancel-in-progress": false,
    "queue": "max"
  }
}
