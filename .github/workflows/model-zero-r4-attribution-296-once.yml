name: '296 road #482 five-failure context attribution (once)'
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-zero-r4-attribution-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: model-zero-r4-attribution-296
  cancel-in-progress: false
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 1d5570e158bb7a799c4a816f78bc7f63f201d2a4
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      ATTRIBUTION_SHA256: ce7ee4bd7f945c607e676efdb0c227fae01550266d3c67358937936a5f7d0cce
      ATTRIBUTION_B64: 
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - name: Prepare exact hosted source and external diagnostics
      run: "set -euo pipefail\n[[ $GITHUB_ACTIONS == true && $RUNNER_ENVIRONMENT == github-hosted && $RUNNER_OS == Linux ]]\n\
        [[ $(git rev-parse HEAD) == \"$SOURCE_SHA\" && -z $(git status --porcelain --untracked-files=normal) ]]\nzero_free=$(df\
        \ -B1 --output=avail \"$RUNNER_TEMP\" | tail -n 1)\nif [[ $zero_free -lt $((35*1024*1024*1024)) ]]; then\n sudo rm\
        \ -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup\n zero_free=$(df -B1 --output=avail \"$RUNNER_TEMP\"\
        \ | tail -n 1)\nfi\n[[ $zero_free -ge $((35*1024*1024*1024)) ]]\nzero_job=$(mktemp -d \"$RUNNER_TEMP/model-zero-attribution-296.XXXXXXXX\"\
        )\nmkdir \"$zero_job/evidence\"\nprintf 'ZERO_ATTRIBUTION_JOB=%s\\nCARGO_TARGET_DIR=%s/target\\n' \"$zero_job\" \"\
        $zero_job\" >> \"$GITHUB_ENV\"\nprintf '%s' \"$ATTRIBUTION_B64\" | base64 --decode > \"$zero_job/attribution.py\"\n\
        printf '%s  %s\\n' \"$ATTRIBUTION_SHA256\" \"$zero_job/attribution.py\" | sha256sum --check --strict\ncp \"$zero_job/attribution.py\"\
        \ \"$zero_job/evidence/attribution-source.py\"\nprintf 'source=%s\\nworkflow=%s\\nrun=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\"\
        \ \"$GITHUB_RUN_ID\" > \"$zero_job/evidence/source.txt\"\n"
    - name: Authenticate failed run as inert data before any kernel execution
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12445763659 > "$ZERO_ATTRIBUTION_JOB/input-api.json"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12445763659/zip > "$ZERO_ATTRIBUTION_JOB/input.zip"

        cp "$ZERO_ATTRIBUTION_JOB/input-api.json" "$ZERO_ATTRIBUTION_JOB/evidence/input-api.json"

        /usr/bin/python3 -I -B "$ZERO_ATTRIBUTION_JOB/attribution.py" admit

        '
    - name: Fresh narrow compiler build and observation-only FP provider
      timeout-minutes: 15
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 4096

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang libllvm18 liblzma-dev capnproto libcapnp-dev pkg-config

        rustup toolchain install 1.94.0 --profile minimal

        unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_TARGET

        [[ ! -e $CARGO_TARGET_DIR && ! -L $CARGO_TARGET_DIR ]]

        cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin offline-llvm-compile
        > "$ZERO_ATTRIBUTION_JOB/evidence/build.log" 2>&1 || { tail -n 100 "$ZERO_ATTRIBUTION_JOB/evidence/build.log"; exit
        1; }

        cat > "$ZERO_ATTRIBUTION_JOB/fp-observe.c" <<''FP''

        #include <stdint.h>

        #include <fenv.h>

        #include <xmmintrin.h>

        uint32_t diagnostic_mxcsr(void) { return _mm_getcsr(); }

        int diagnostic_round(void) { return fegetround(); }

        FP

        /usr/bin/clang -shared -fPIC -O2 -Wl,-z,defs "$ZERO_ATTRIBUTION_JOB/fp-observe.c" -lm -o "$ZERO_ATTRIBUTION_JOB/fp-observe.so"

        cp "$ZERO_ATTRIBUTION_JOB/fp-observe.c" "$ZERO_ATTRIBUTION_JOB/evidence/fp-observe.c"

        rustc +1.94.0 -Vv > "$ZERO_ATTRIBUTION_JOB/evidence/rustc.txt"

        lscpu --json > "$ZERO_ATTRIBUTION_JOB/evidence/actual-cpu.json"

        dpkg-query -W clang libllvm18 > "$ZERO_ATTRIBUTION_JOB/evidence/compiler-packages.tsv"

        '
    - name: Add missing original and old controls for only the five failed cases
      timeout-minutes: 12
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 1024

        # Observe this actual host; no historical target forcing, archive execution,

        # full-model rerun, accepted256 controls, or successful8 historical repeats.

        status=0

        timeout --signal=KILL 600 /usr/bin/python3 -I -B "$ZERO_ATTRIBUTION_JOB/attribution.py" replay > "$ZERO_ATTRIBUTION_JOB/evidence/replay.stdout"
        2> "$ZERO_ATTRIBUTION_JOB/evidence/replay.stderr" || status=$?

        printf ''%s\n'' "$status" > "$ZERO_ATTRIBUTION_JOB/evidence/replay.status"

        tail -n 60 "$ZERO_ATTRIBUTION_JOB/evidence/replay.stdout" "$ZERO_ATTRIBUTION_JOB/evidence/replay.stderr"

        exit "$status"

        '
    - name: Require unchanged exact historical and fresh-original byte gates
      run: 'set -euo pipefail

        test "$(cat "$ZERO_ATTRIBUTION_JOB/evidence/strict-frozen.status")" = 0

        test "$(cat "$ZERO_ATTRIBUTION_JOB/evidence/fresh-context.status")" = 0

        /usr/bin/python3 -I -B - <<''CHECK''

        import json, os

        from pathlib import Path

        root=Path(os.environ[''ZERO_ATTRIBUTION_JOB''])/''evidence''

        report=json.loads((root/''attribution-complete.json'').read_bytes())

        assert report[''diagnostic_completed''] is True and report[''source'']==os.environ[''SOURCE_SHA'']

        assert report[''strict_frozen_original_parity''] is True and report[''fresh_context_original_parity''] is True

        assert report[''archived_code_executed''] is False and report[''prior_run_stays_failed''] is True

        assert report[''production_fix''] is False and report[''whole_model_or_482_acceptance''] is False

        rows=json.loads((root/''attribution-rows.json'').read_bytes())

        assert len(rows)==5 and all(set(r[''implementations''])=={''original'',''old'',''candidate''} for r in rows)

        CHECK

        [[ $(git rev-parse HEAD) == "$SOURCE_SHA" && -z $(git status --porcelain --untracked-files=normal) ]]

        '
    - name: Always seal bounded inert raw diagnostics
      if: always()
      timeout-minutes: 5
      run: "set -euo pipefail\n/usr/bin/python3 -I -B - <<'PACK'\nimport hashlib, json, os, stat\nfrom pathlib import Path\n\
        output=Path(os.environ['RUNNER_TEMP'])/'model-zero-attribution-public'\noutput.mkdir(exist_ok=False)\nsource=Path(os.environ['ZERO_ATTRIBUTION_JOB'])/'evidence'\
        \ if 'ZERO_ATTRIBUTION_JOB' in os.environ else None\nseals={}; omitted=[]; total=0; cap=256<<20\nif source is not\
        \ None and source.exists():\n for path in sorted(source.rglob('*'), key=lambda p:(p.stat().st_size>(1<<20) if p.is_file()\
        \ else False, str(p))):\n  info=path.lstat()\n  if stat.S_ISDIR(info.st_mode): continue\n  name=str(path.relative_to(source))\n\
        \  if not stat.S_ISREG(info.st_mode) or total+info.st_size>cap-(8<<20):\n   omitted.append({'path':name,'size':info.st_size,'reason':'nonregular\
        \ or immutable evidence bound'});continue\n  data=path.read_bytes()\n  if data.startswith(b'\\x7fELF'):\n   omitted.append({'path':name,'size':len(data),'reason':'unexpected\
        \ executable in inert evidence'});continue\n  dest=output/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)\n\
        \  seals[name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()};total+=len(data)\nelse: omitted.append({'path':'evidence','reason':'bootstrap\
        \ did not create evidence'})\nmetadata={'content-seals.json':seals,'omissions.json':omitted,'packaging.json':{'result':'fail'\
        \ if omitted else 'pass','bytes':total,'bound':cap}}\nencoded={k:(json.dumps(v,indent=2)+'\\n').encode() for k,v in\
        \ metadata.items()}\nif sum(map(len,encoded.values()))>cap-total:\n omitted=[{'reason':'seal metadata exceeds evidence\
        \ bound'}]\n encoded={k:(json.dumps(v)+'\\n').encode() for k,v in {'content-seals.json':{},'omissions.json':omitted,'packaging.json':{'result':'fail','bytes':total,'bound':cap}}.items()}\n\
        assert total+sum(map(len,encoded.values()))<=cap\nfor name,data in encoded.items():(output/name).write_bytes(data)\n\
        assert not omitted, 'incomplete evidence fails; bounded partial diagnostics remain uploadable'\nPACK\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-zero-r4-attribution-${{ github.run_id }}
        path: ${{ runner.temp }}/model-zero-attribution-public/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
