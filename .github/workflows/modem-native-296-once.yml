name: 296 native modem original trace PTY and process-boundary candidate
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/modem-native-296-once.yml
permissions:
  contents: read
jobs:
  native-modem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 8a97671a8976425f44366da6523db449bed71b36
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 8a97671a8976425f44366da6523db449bed71b36
        persist-credentials: false
    - name: Build actual native checker and require complete original and live two-root proof
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ capnproto libcapnp-dev strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        mkdir "$RUNNER_TEMP/modem-native-296"

        proof="$RUNNER_TEMP/modem-native-296"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --bin check-modem
        > "$proof/build-checker.log" 2>&1 || { tail -n 100 "$proof/build-checker.log"; exit 1; }

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-modem -p openpilot-process-supervision --bins --examples
        > "$proof/build-runtime.log" 2>&1 || { tail -n 100 "$proof/build-runtime.log"; exit 1; }

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --lib modem_
        -- --nocapture > "$proof/units.log" 2>&1 || { tail -n 120 "$proof/units.log"; exit 1; }

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --test modem_retirement
        -- --nocapture > "$proof/outer-controls.log" 2>&1 || { tail -n 120 "$proof/outer-controls.log"; exit 1; }

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --lib --bin
        check-modem --test modem_retirement -- -D warnings > "$proof/clippy.log" 2>&1 || { tail -n 120 "$proof/clippy.log";
        exit 1; }

        cargo fmt --manifest-path rust/Cargo.toml --all -- --check

        export MODEM_CHECKER_BINARY="$GITHUB_WORKSPACE/rust/target/debug/check-modem"

        export MODEM_DAEMON_BINARY="$GITHUB_WORKSPACE/rust/target/debug/openpilot-modem"

        export MODEM_TRACE_BINARY="$GITHUB_WORKSPACE/rust/target/debug/examples/modem_trace"

        export MODEM_PROCESS_CHILD_BINARY="$GITHUB_WORKSPACE/rust/target/debug/openpilot-process-child"

        export MODEM_RETIREMENT_OUTPUT="$proof/retirement"

        export MODEM_REQUIRE_RETIRED=0

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        strace -ff -s 16384 -o "$proof/retirement.trace" -e trace=execve,execveat,clone,fork,vfork,exit,exit_group cargo test
        --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features modem-qa-native --test modem_retirement
        modem_qa_replays_original_oracle_and_owned_native_processes -- --ignored --exact --nocapture > "$proof/retirement.log"
        2>&1 || { tail -n 120 "$proof/retirement.log"; exit 1; }

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: modem-native-296
        path: ${{ runner.temp }}/modem-native-296/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
