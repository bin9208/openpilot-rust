name: Runtime source build foundation
on:
  push:
    branches: [codex/feat-598-device-native-build, 'codex/feat-598-*', 'codex/feat-599-*', 'codex/feat-600-*', 'codex/feat-605-*', dev, main]
    paths:
      - 'rust/crates/runtime-build/**'
      - 'rust/crates/dev-tools/src/native_codec_inputs.rs'
      - 'rust/crates/dev-tools/src/native_ffmpeg_headers.rs'
      - 'rust/crates/dev-tools/src/native_provider.rs'
      - 'rust/native-ffmpeg-provider.json'
      - 'rust/crates/dev-tools/src/ffmpeg_build.rs'
      - 'rust/crates/dev-tools/tests/ffmpeg_build.rs'
      - 'rust/native-ffmpeg-headers.json'
      - 'rust/crates/dev-tools/src/encoder_stage.rs'
      - 'rust/crates/dev-tools/src/bin/stage_encoder_target.rs'
      - 'rust/crates/dev-tools/tests/encoder_stage.rs'
      - 'uv.lock'
      - 'rust/crates/runtime-launcher/**'
      - 'rust/crates/updated/**'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/native-runtime-catalog.json'
      - 'rust/native-cargo-inputs.json'
      - 'rust/native-system-sdk.json'
      - 'tools/native/bootstrap_seed.py'
      - 'tools/ci/tests/test_native_bootstrap_seed.py'
      - '.github/workflows/runtime-source-build.yml'
      - '.github/actions/**'
      - 'tools/ci/local-arm'
      - 'tools/ci/tests/test_local_native_workflows.py'
      - 'tools/ci/fixtures/local-native-workflows-605.json'
      - 'rust/crates/disk-space/**'
      - 'rust/tools/check-disk-space'
  workflow_dispatch:
# Branch push checks the actual x64/ARM build driver once; the required PR Rust
# workspace gate also includes this crate. Do not duplicate this focused matrix on PR.
permissions:
  contents: read
jobs:
  offline-cargo-reuse:
    name: Actual offline Cargo reuse (${{ matrix.runner == 'ubuntu-24.04-arm' && 'ARM QEMU' || 'X64' }})
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, dev-md-local]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: ${{ matrix.runner == 'ubuntu-24.04-arm' && 90 || 15 }}
    env:
      LOCAL_CI_ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
      RUSTUP_TOOLCHAIN: '1.94.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: openpilot-local-shell {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/job-temp
      - uses: ./.github/actions/rust-path
        if: env.LOCAL_CI_ARCH != 'aarch64'
      - uses: ./.github/actions/local-arm
      - uses: actions/setup-python@v6
        if: env.LOCAL_CI_ARCH != 'aarch64'
        with:
          python-version: '3.12.14'
      - name: Inspect resources for this bounded toolchain and crate build
        run: |
          python3 - <<'PY'
          import os, shutil
          # Operation estimate: pinned minimal toolchain/components plus this small crate/fixtures.
          growth = 3 * 1024**3
          for path in (os.environ['RUNNER_TEMP'], os.environ['GITHUB_WORKSPACE']):
              free = shutil.disk_usage(path).free
              print(f'path={path} free_bytes={free} estimated_growth_bytes={growth}')
              if free < growth:
                  raise SystemExit('insufficient space for this operation; no cache or user data removed')
          PY
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
      - name: Verify local routing and retained original commands
        run: |
          python -m pip install PyYAML==6.0.2 pytest==9.0.2
          python -m unittest discover -s tools/ci/tests -p 'test_local_native_workflows.py' -v
      - name: Check syntax formatting and the locked dependency graph
        run: |
          rustfmt --edition 2021 --check rust/crates/runtime-build/src/lib.rs rust/crates/runtime-build/src/main.rs rust/crates/runtime-build/tests/cargo_reuse.rs
          cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/runtime-build-metadata.json"
      - name: Verify independently pinned bootstrap seed cache and failure preservation
        run: python -m unittest discover -s tools/ci/tests -p 'test_native_bootstrap_seed.py' -v
      - name: Check formatting of additional source and asset preparation modules
        run: rustfmt --edition 2021 --check rust/crates/runtime-build/src/*.rs rust/crates/runtime-build/tests/*.rs
      - name: Compile and exercise real offline build reuse
        run: |
          set -o pipefail
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build -- --nocapture 2>&1 | tee "$RUNNER_TEMP/runtime-build-tests.log"
          cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --all-targets -- -D warnings
      - name: Audit the full runtime roster against the actual source workspace
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked --offline -p openpilot-runtime-build --bin openpilot-runtime-plan -- \
            --root "$GITHUB_WORKSPACE" --cargo "$(rustup which cargo)" --check > "$RUNNER_TEMP/native-runtime-catalog.json"
      - name: Compile the runtime consumer configuration without archive preparation dependencies
        run: cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-build --no-default-features --all-targets -- -D warnings
      - name: Verify unchanged codec wheel admission and independent component reuse
        run: |
          python3 - <<'PY'
          import os, shutil
          free=shutil.disk_usage(os.environ['CI_JOB_TEMP']).free
          growth=1024**3
          print(f'available_bytes={free} expected_codec_tool_and_inputs_growth_bytes={growth}')
          if free<growth:
              raise SystemExit('insufficient capacity for this codec operation; other data retained')
          PY
          rustfmt --edition 2021 --check rust/crates/dev-tools/src/{native_codec_inputs,encoder_stage}.rs rust/crates/dev-tools/src/bin/stage_encoder_target.rs rust/crates/dev-tools/tests/encoder_stage.rs
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test encoder_stage
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib native_codec_inputs::tests -- --nocapture
          cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib --bin stage-encoder-target -- -D warnings
      - uses: actions/cache/restore@v4
        id: codec-wheels-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-codec-assets
          key: native-codec-wheels-ce758b64c0343574e18ab97cbcff1e29868c66ccc5e0c866b5970266451203d4-1659e55a357f732836e5ed2a17fa65e715a11bf9bfa6d305e71fd7ac00a8e475-v1
      - name: Prepare the original ARM codec wheels without pip or compiler execution
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin stage-encoder-target -- \
            --prepare-wheels --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/native-codec-assets" --store "$RUNNER_TEMP/native-codec-prefixes" > "$RUNNER_TEMP/native-codec-first.json"
          cargo run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin stage-encoder-target -- \
            --prepare-wheels --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/native-codec-assets" --store "$RUNNER_TEMP/native-codec-prefixes" > "$RUNNER_TEMP/native-codec-reused.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['CI_JOB_TEMP'])
          first=json.loads((root/'native-codec-first.json').read_text())
          repeat=json.loads((root/'native-codec-reused.json').read_text())
          assert set(first)==set(repeat)=={'ffmpeg','libyuv'}
          for name,row in first.items():
            reused=repeat[name]
            assert row['copied_bytes']>0 and reused['copied_bytes']==0
            assert row['tree_sha256']==reused['tree_sha256'] and row['root']==reused['root']
            assert reused['asset']['transferred_bytes']==reused['asset']['stored_bytes']==0
            assert not row['compiler_executed'] and not row['runtime_activated']
          print('Original codec wheels verified; repeat HTTP body, stored archive bytes and copied prefix bytes zero. This step does not execute ARM codecs.')
          PY
      - uses: actions/cache/save@v4
        if: steps.codec-wheels-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-codec-assets
          key: native-codec-wheels-ce758b64c0343574e18ab97cbcff1e29868c66ccc5e0c866b5970266451203d4-1659e55a357f732836e5ed2a17fa65e715a11bf9bfa6d305e71fd7ac00a8e475-v1
      - name: Verify released FFmpeg header reconstruction without changing existing profiles
        run: |
          rustfmt --edition 2021 --check rust/crates/dev-tools/src/{native_codec_inputs,native_ffmpeg_headers,ffmpeg_build}.rs rust/crates/dev-tools/tests/ffmpeg_build.rs
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test ffmpeg_build
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib native_ffmpeg_headers::tests -- --nocapture
          cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib --bin build-runtime-ffmpeg -- -D warnings
      - name: Verify component-only provider export and independently pinned consumption
        run: |
          rustfmt --edition 2021 --check rust/crates/dev-tools/src/native_provider.rs rust/crates/dev-tools/src/ffmpeg_build.rs rust/crates/dev-tools/tests/ffmpeg_build.rs
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --lib native_provider::tests -- --nocapture
      - uses: actions/cache/restore@v4
        id: ffmpeg-headers-cache
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-ffmpeg-source
          key: native-ffmpeg-source-8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968-v1
      - name: Prepare all original released headers and prove zero-transfer repeat
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-runtime-ffmpeg -- \
            --prepare-released-headers --plan rust/native-ffmpeg-headers.json --cache "$RUNNER_TEMP/native-ffmpeg-source" --store "$RUNNER_TEMP/native-ffmpeg-headers" > "$RUNNER_TEMP/native-ffmpeg-headers-first.json"
          cargo run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin build-runtime-ffmpeg -- \
            --prepare-released-headers --plan rust/native-ffmpeg-headers.json --cache "$RUNNER_TEMP/native-ffmpeg-source" --store "$RUNNER_TEMP/native-ffmpeg-headers" > "$RUNNER_TEMP/native-ffmpeg-headers-reused.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['CI_JOB_TEMP'])
          first=json.loads((root/'native-ffmpeg-headers-first.json').read_text())
          repeat=json.loads((root/'native-ffmpeg-headers-reused.json').read_text())
          assert first['public_headers']==repeat['public_headers']==140
          assert first['root']==repeat['root'] and first['tree_sha256']==repeat['tree_sha256']
          assert first['copied_bytes']>0 and repeat['copied_bytes']==0
          assert repeat['asset']['transferred_bytes']==repeat['asset']['stored_bytes']==0
          assert not first['compiler_executed'] and not first['provider_libraries_prepared'] and not first['actual_target_execution']
          PY
      - uses: actions/cache/save@v4
        if: steps.ffmpeg-headers-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CI_JOB_TEMP }}/native-ffmpeg-source
          key: native-ffmpeg-source-8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968-v1
      - name: Verify the real HTTPS CLI and zero-transfer reuse of a pinned public input
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked --offline -p openpilot-runtime-build --bin openpilot-runtime-assets -- \
            --plan rust/crates/runtime-build/tests/fixtures/assets-github.json --cache "$RUNNER_TEMP/runtime-https-assets" > "$RUNNER_TEMP/runtime-https-first.json"
          cargo run --manifest-path rust/Cargo.toml --locked --offline -p openpilot-runtime-build --bin openpilot-runtime-assets -- \
            --plan rust/crates/runtime-build/tests/fixtures/assets-github.json --cache "$RUNNER_TEMP/runtime-https-assets" > "$RUNNER_TEMP/runtime-https-reused.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          first = json.loads((temp / 'runtime-https-first.json').read_text())['pinned-public-input']
          reused = json.loads((temp / 'runtime-https-reused.json').read_text())['pinned-public-input']
          assert first['transferred_bytes'] == first['stored_bytes'] == first['bytes'] == 403
          assert reused['transferred_bytes'] == reused['stored_bytes'] == 0
          assert first['path'] == reused['path']
          assert hashlib.sha256(Path(reused['path']).read_bytes()).hexdigest() == reused['sha256']
          print('Actual HTTPS CLI: initial_body_bytes=403 repeated_body_bytes=0')
          PY
      - name: Verify bootstrap HTTPS transport with the independently pinned public text fixture
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('bootstrap_seed','tools/native/bootstrap_seed.py')
          seed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(seed)
          plan = json.loads(Path('rust/crates/runtime-build/tests/fixtures/assets-github.json').read_text())
          asset = plan['assets']['pinned-public-input']
          output = Path(os.environ['CI_JOB_TEMP'])/'bootstrap-http-public-text'
          transferred = seed.fetch(asset,output)
          assert transferred == asset['bytes'] == output.stat().st_size == 403
          assert hashlib.sha256(output.read_bytes()).hexdigest() == asset['sha256']
          print('Bootstrap HTTPS transport: public text body403; not a published native seed download test.')
          PY
      - name: Verify growth-only native capacity admission and bootstrap preservation
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-disk-space
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test disk_space
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/ci/tests -q tools/ci/tests/test_native_disk_guard.py
      - name: Verify shared source-build manifest checks and compile the source-aware sealer
        run: |
          rustfmt --edition 2021 --check rust/crates/runtime-installer/src/lib.rs rust/crates/runtime-installer/src/identity.rs rust/crates/runtime-installer/tests/cli.rs rust/crates/dev-tools/src/bin/seal_runtime_package.rs
          cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-installer --test cli source_build_reuses_original_manifest_checks_without_a_release_descriptor
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin seal-runtime-package
      - name: Admit and prepare native startup and updater regression prerequisites
        run: |
          python3 - <<'PY'
          import os, shutil
          growth = 4 * 1024**3
          for path in (os.environ['RUNNER_TEMP'], os.environ['GITHUB_WORKSPACE']):
              free = shutil.disk_usage(path).free
              print(f'path={path} available_bytes={free} additional_startup_test_growth_bytes={growth}')
              if free < growth:
                  raise SystemExit('insufficient space for this startup/update test operation; other data retained')
          PY
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" update
          sudo apt-get -o APT::Architectures="$(dpkg --print-architecture)" install -y capnproto libcapnp-dev g++ libzmq3-dev time
      - name: Verify the actual launcher and updater source-generation protocol and regressions
        run: |
          set -o pipefail
          rustfmt --edition 2021 --check rust/crates/runtime-launcher/src/native.rs rust/crates/runtime-launcher/src/bootstrap.rs rust/crates/runtime-launcher/tests/native_protocol.rs rust/crates/updated/src/{lib,native,main,overlay,updater,runtime,report}.rs
          cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-updated --bin openpilot-updated
          native_target=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          export NATIVE_PROTOCOL_UPDATED_BINARY="$native_target/debug/openpilot-updated"
          test -x "$NATIVE_PROTOCOL_UPDATED_BINARY"
          /usr/bin/time -v -o "$RUNNER_TEMP/native-startup-resources.txt" cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-launcher -p openpilot-updated -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-startup-tests.log"
          cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-runtime-launcher -p openpilot-updated --all-targets -- -D warnings
      - name: Preserve actual build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-source-build-${{ matrix.runner }}-${{ github.sha }}
          path: |
            ${{ env.CI_JOB_TEMP }}/runtime-build-metadata.json
            ${{ env.CI_JOB_TEMP }}/native-runtime-catalog.json
            ${{ env.CI_JOB_TEMP }}/runtime-build-tests.log
            ${{ env.CI_JOB_TEMP }}/native-codec-first.json
            ${{ env.CI_JOB_TEMP }}/native-codec-reused.json
            ${{ env.CI_JOB_TEMP }}/native-codec-prefixes/**/generation/tree.json
            ${{ env.CI_JOB_TEMP }}/native-ffmpeg-headers-first.json
            ${{ env.CI_JOB_TEMP }}/native-ffmpeg-headers-reused.json
            ${{ env.CI_JOB_TEMP }}/native-ffmpeg-headers/**/generation/tree.json
            ${{ env.CI_JOB_TEMP }}/runtime-https-first.json
            ${{ env.CI_JOB_TEMP }}/runtime-https-reused.json
            ${{ env.CI_JOB_TEMP }}/native-startup-resources.txt
            ${{ env.CI_JOB_TEMP }}/native-startup-tests.log
      - uses: ./.github/actions/local-arm
        if: always()
        with: {cleanup: 'true'}
      - uses: actions/upload-artifact@v6
        if: always() && env.LOCAL_CI_ARCH == 'aarch64'
        with:
          name: local-arm-offline-cargo-reuse-${{ github.sha }}
          path: ${{ env.CI_JOB_TEMP }}/local-arm/*.json
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
