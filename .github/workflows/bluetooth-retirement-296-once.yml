# Disposable affected-source check; never merge into dev.
name: Bluetooth 296 retirement proof
on:
  push:
    branches: [codex/feat-296-native-tools-candidate]
    paths: [.github/workflows/bluetooth-retirement-296-once.yml]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
jobs:
  retirement:
    name: BlueZ and enumeration same-ELF original-absence proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: c7005ce1dfb7aeaaec74aa7d41d780df87651c7b
    - name: Require exact Bluetooth candidate source
      run: 'test "$(git rev-parse HEAD)" = c7005ce1dfb7aeaaec74aa7d41d780df87651c7b

        test -z "$(git status --porcelain)"'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Prepare affected Bluetooth prerequisites
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        sudo apt-get update && sudo apt-get install -y g++ clang cmake make libclang-dev capnproto libcapnp-dev libzmq3-dev
        dbus-daemon strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 cffi==2.1.1 jeepney==0.9.0
        requests==2.34.2 pyserial==3.5 pytest==9.0.2 anyio==4.12.1

        '
    - uses: ./.github/actions/native-json11
    - name: Build affected Bluetooth daemons, examples and original IPC bindings
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-bluetooth -p openpilot-process-supervision --bins --examples
        --locked

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/ui-params-binding"

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/connectivity-msgq-python"

        '
    - name: Compare native BlueZ policy controller with unchanged original
      run: "set -euo pipefail\nexport OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/ui-connectivity/bluetooth-bluez-policy\"\
        \ncandidate=\"$GITHUB_WORKSPACE/rust/target/debug/examples/bluez_policy\"\nexport BLUEZ_POLICY_ORIGINAL_OUTPUT=\"\
        $proof/original\"\nexport BLUEZ_POLICY_NATIVE_OUTPUT=\"$proof/native\"\nexport BLUEZ_POLICY_ORIGINAL_STDOUT=\"$proof/original.stdout\"\
        \nexport BLUEZ_POLICY_ORIGINAL_STDERR=\"$proof/original.stderr\"\nexport BLUEZ_POLICY_ORIGINAL_DIGITS=\"$proof/original-digits.stdout\"\
        \nexport BLUEZ_POLICY_ORIGINAL_DIGITS_STDERR=\"$proof/original-digits.stderr\"\nexport BLUEZ_POLICY_NATIVE_STDOUT=\"\
        $proof/native.stdout\"\nexport BLUEZ_POLICY_NATIVE_STDERR=\"$proof/native.stderr\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-bluez-policy-native --bin check-bluetooth-bluez-policy --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-bluez-policy-native --test bluetooth_bluez_policy_check --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-bluez-policy-native --lib bluetooth_bluez_policy_check:: --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-bluez-policy-native --lib --bin check-bluetooth-bluez-policy --test bluetooth_bluez_policy_check\
        \ --test bluetooth_bluez_policy_reference --locked -- -D warnings\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\nmkdir -p \"$proof\"\nsha256sum \"$candidate\" rust/target/debug/check-bluetooth-bluez-policy\
        \ rust/tools/check_bluetooth_bluez_policy.py openpilot/selfdrive/carrot/bluetooth/bluez.py > \"$proof/artifacts.sha256\"\
        \ntimeout --kill-after=5s 120s python rust/tools/check_bluetooth_bluez_policy.py --binary \"$candidate\" --output\
        \ \"$BLUEZ_POLICY_ORIGINAL_OUTPUT\" > \"$BLUEZ_POLICY_ORIGINAL_STDOUT\" 2> \"$BLUEZ_POLICY_ORIGINAL_STDERR\"\ntimeout\
        \ --kill-after=5s 35s \"$candidate\" --digits > \"$BLUEZ_POLICY_ORIGINAL_DIGITS\" 2> \"$BLUEZ_POLICY_ORIGINAL_DIGITS_STDERR\"\
        \ntimeout --kill-after=5s 120s rust/target/debug/check-bluetooth-bluez-policy --binary \"$candidate\" --output \"\
        $BLUEZ_POLICY_NATIVE_OUTPUT\" > \"$BLUEZ_POLICY_NATIVE_STDOUT\" 2> \"$BLUEZ_POLICY_NATIVE_STDERR\"\nsha256sum -c \"\
        $proof/artifacts.sha256\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 128\nabsence=\"$proof/absence\"\nmkdir -p \"$absence/root/rust/tools\"\nfor source in openpilot/selfdrive/carrot/bluetooth/bluez.py\
        \ rust/crates/bluetooth/examples/bluez_policy.rs rust/crates/bluetooth/src/bluez/policy.rs; do\n  mkdir -p \"$absence/root/$(dirname\
        \ \"$source\")\"\n  cp \"$GITHUB_WORKSPACE/$source\" \"$absence/root/$source\"\ndone\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-bluetooth-bluez-policy\"\
        \nprintf '%s\\n' \"$checker\" > \"$absence/checker.path\"\nprintf '%s\\n' \"$candidate\" > \"$absence/candidate.path\"\
        \ntest ! -e \"$absence/root/rust/tools/check_bluetooth_bluez_policy.py\"\ntest ! -L \"$absence/root/rust/tools/check_bluetooth_bluez_policy.py\"\
        \nOPENPILOT_RUST_ROOT=\"$absence/root\" PATH=/nonexistent /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/strace\
        \ -f -qq -s 65535 -e trace=execve,execveat -o \"$absence/native.exec\" \"$checker\" --binary \"$candidate\" --output\
        \ \"$absence/output\" > \"$absence/native.stdout\" 2> \"$absence/native.stderr\"\nfor name in cases.jsonl source.json\
        \ native.jsonl native.stderr digits.stdout digits.stderr result.json; do\n  cmp \"$BLUEZ_POLICY_NATIVE_OUTPUT/$name\"\
        \ \"$absence/output/$name\"\ndone\ncmp \"$BLUEZ_POLICY_NATIVE_STDOUT\" \"$absence/native.stdout\"\ncmp \"$BLUEZ_POLICY_NATIVE_STDERR\"\
        \ \"$absence/native.stderr\"\nsha256sum -c \"$proof/artifacts.sha256\"\nexport BLUEZ_POLICY_ABSENCE_PROOF=\"$absence\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 128\ncargo test --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features bluetooth-bluez-policy-native --test bluetooth_bluez_policy_reference\
        \ --locked -- --nocapture\n"
    - name: Compare native Bluetooth enumeration controller with unchanged original
      run: "set -euo pipefail\nexport OPENPILOT_RUST_ROOT=\"$GITHUB_WORKSPACE\"\nproof=\"$RUNNER_TEMP/ui-connectivity/bluetooth-enumerate\"\
        \ncandidate=\"$GITHUB_WORKSPACE/rust/target/debug/examples/input_fixture\"\nexport BLUETOOTH_ENUMERATE_ORIGINAL_OUTPUT=\"\
        $proof/original\"\nexport BLUETOOTH_ENUMERATE_NATIVE_OUTPUT=\"$proof/native\"\nexport BLUETOOTH_ENUMERATE_ORIGINAL_STDOUT=\"\
        $proof/original.stdout\"\nexport BLUETOOTH_ENUMERATE_ORIGINAL_STDERR=\"$proof/original.stderr\"\nexport BLUETOOTH_ENUMERATE_NATIVE_STDOUT=\"\
        $proof/native.stdout\"\nexport BLUETOOTH_ENUMERATE_NATIVE_STDERR=\"$proof/native.stderr\"\nexport BLUETOOTH_ENUMERATE_ABSENT_ROOT=\"\
        $proof/absent-root\"\nexport BLUETOOTH_ENUMERATE_ABSENT_OUTPUT=\"$proof/absent-native\"\nexport BLUETOOTH_ENUMERATE_ABSENT_STDOUT=\"\
        $proof/absent-native.stdout\"\nexport BLUETOOTH_ENUMERATE_ABSENT_STDERR=\"$proof/absent-native.stderr\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-enumerate-native --bin check-bluetooth-enumerate --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-enumerate-native --lib bluetooth_enumerate_check:: --locked\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 512\ncargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-enumerate-native --lib --bin check-bluetooth-enumerate --test bluetooth_enumerate_reference\
        \ --locked -- -D warnings\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 128\nmkdir -p \"$proof\"\nsha256sum \"$candidate\" rust/target/debug/check-bluetooth-enumerate rust/tools/check_bluetooth_enumerate.py\
        \ openpilot/selfdrive/carrot/bluetooth/daemon.py > \"$proof/artifacts.sha256\"\ntimeout --kill-after=5s 30s python\
        \ rust/tools/check_bluetooth_enumerate.py --binary \"$candidate\" --output \"$BLUETOOTH_ENUMERATE_ORIGINAL_OUTPUT\"\
        \ > \"$BLUETOOTH_ENUMERATE_ORIGINAL_STDOUT\" 2> \"$BLUETOOTH_ENUMERATE_ORIGINAL_STDERR\"\ntimeout --kill-after=5s\
        \ 30s rust/target/debug/check-bluetooth-enumerate --binary \"$candidate\" --output \"$BLUETOOTH_ENUMERATE_NATIVE_OUTPUT\"\
        \ > \"$BLUETOOTH_ENUMERATE_NATIVE_STDOUT\" 2> \"$BLUETOOTH_ENUMERATE_NATIVE_STDERR\"\nsha256sum -c \"$proof/artifacts.sha256\"\
        \n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 128\nabsent_sources=(\n\
        \  openpilot/selfdrive/carrot/bluetooth/daemon.py\n  openpilot/selfdrive/carrot/bluetooth/model.py\n  rust/tools/bluetooth_engine_source.py\n\
        \  rust/crates/bluetooth/examples/input_fixture.rs\n  rust/crates/bluetooth/src/input.rs\n)\nmkdir -p \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\"\
        \ \"$proof/empty-path\"\nsha256sum \"${absent_sources[@]}\" > \"$proof/present-sources.sha256\"\nfor name in \"${absent_sources[@]}\"\
        ; do\n  cp --parents -- \"$name\" \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\"\n  cmp -- \"$name\" \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/$name\"\
        \ndone\n(cd \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\" && sha256sum \"${absent_sources[@]}\") > \"$proof/absent-sources.sha256\"\
        \ntest -d \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools\"\ntest ! -e \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\
        \ntest ! -L \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\nchecker=\"$GITHUB_WORKSPACE/rust/target/debug/check-bluetooth-enumerate\"\
        \nOPENPILOT_RUST_ROOT=\"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\" PATH=\"$proof/empty-path\" /usr/bin/timeout --signal=TERM\
        \ --kill-after=5s 30s /usr/bin/strace -f -qq -s 65535 -e trace=execve,execveat -o \"$proof/absent.exec\" \"$checker\"\
        \ --binary \"$candidate\" --output \"$BLUETOOTH_ENUMERATE_ABSENT_OUTPUT\" > \"$BLUETOOTH_ENUMERATE_ABSENT_STDOUT\"\
        \ 2> \"$BLUETOOTH_ENUMERATE_ABSENT_STDERR\"\nawk -v checker=\"$checker\" -v candidate=\"$candidate\" '\n  /execveat\\\
        (/ { unexpected++; next }\n  /execve\\(/ {\n    if (index($0, \"execve(\\\"\" checker \"\\\",\") > 0) controller++;\n\
        \    else if (index($0, \"execve(\\\"\" candidate \"\\\",\") > 0) fixture++;\n    else unexpected++;\n  }\n  END {\n\
        \    printf \"checker=%d fixture=%d unexpected=%d\\n\", controller, fixture, unexpected;\n    exit !(controller ==\
        \ 1 && fixture == 2 && unexpected == 0);\n  }\n' \"$proof/absent.exec\" | tee \"$proof/absent-exec-roster.txt\"\n\
        sha256sum -c \"$proof/artifacts.sha256\"\nsha256sum -c \"$proof/present-sources.sha256\"\n(cd \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT\"\
        \ && sha256sum -c \"$proof/absent-sources.sha256\")\nfor name in \"${absent_sources[@]}\"; do cmp -- \"$name\" \"\
        $BLUETOOTH_ENUMERATE_ABSENT_ROOT/$name\"; done\ntest ! -e \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\
        \ntest ! -L \"$BLUETOOTH_ENUMERATE_ABSENT_ROOT/rust/tools/check_bluetooth_enumerate.py\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 128\ncargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools\
        \ --features bluetooth-enumerate-native --test bluetooth_enumerate_reference --locked -- --nocapture\n"
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: bluetooth-native-absence-evidence
        path: ${{ runner.temp }}/ui-connectivity/
        if-no-files-found: warn
