    - uses: actions/checkout@v7
      with:
        ref: bcf7b88ef40072adbaead10e980a84d018f00390
        persist-credentials: false
    - name: Admit native source and reserve hosted capacity
      shell: bash
      run: 'set -euo pipefail

        export KOREAN_BASE="$RUNNER_TEMP/changed-files-korean-native-296"

        printf ''KOREAN_BASE=%s\n'' "$KOREAN_BASE" >> "$GITHUB_ENV"

        printf ''KOREAN_ORIGINAL_DIR=%s/original\n'' "$KOREAN_BASE" >> "$GITHUB_ENV"

        printf ''KOREAN_PRIOR_ORIGINAL_DIR=%s/prior-original\n'' "$KOREAN_BASE" >> "$GITHUB_ENV"

        printf ''KOREAN_NATIVE_OUTPUT=%s/actual\n'' "$KOREAN_BASE" >> "$GITHUB_ENV"

        mkdir "$KOREAN_BASE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$EXPECTED_SOURCE" > "$KOREAN_BASE/source.txt"

        git status --porcelain=v1 > "$KOREAN_BASE/source-status.before.txt"

        test ! -s "$KOREAN_BASE/source-status.before.txt"

        sha256sum rust/Cargo.lock > "$KOREAN_BASE/lock.input.sha256"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libzmq5 g++ strace

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustc +1.94.0 -Vv > "$KOREAN_BASE/rustc.txt"

        dpkg-query -W libc6 libc-bin capnproto libcapnp-dev libzmq5 > "$KOREAN_BASE/native-packages.txt"

        '
