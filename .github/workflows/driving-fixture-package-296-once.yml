name: 296 package immutable complete driving data without synthetic image duplication
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driving-fixture-package-296-once.yml
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: c6935d852a84ef0e297b76563df368298cf2f328
        persist-credentials: false
    - name: Package only authenticated data; do not run originals models or compilers
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$RUNNER_TEMP" --growth-mib 2048

        python3 - <<''PY_SCRIPT''

        import base64,hashlib,os

        from pathlib import Path

        raw=base64.b64decode("",validate=True)

        assert hashlib.sha256(raw).hexdigest()=="0e2f4bccdfea220d674ced3b2c65b72d3ee146ebd38ebf5f069b0eecccb17cc6"

        p=Path(os.environ[''RUNNER_TEMP''])/''package-driving-data.py'';p.write_bytes(raw)

        PY_SCRIPT

        python3 "$RUNNER_TEMP/package-driving-data.py"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: driving-complete-fixture-compact
        path: ${{ runner.temp }}/driving-fixture-package/
        if-no-files-found: warn
        retention-days: 14
