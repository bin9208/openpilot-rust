name: 296 RadarCAN live FD capture regression and complete native ARM proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/radar-fd-481-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  fd-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: f0d81af610f5c96d0f87f2ba58d9a69a111a0795
      PYTHONPATH: ${{ github.workspace }}/rust/tools:${{ github.workspace }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f0d81af610f5c96d0f87f2ba58d9a69a111a0795
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Require raced-FD and failure controls of the pending capture tool
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 512

        python -m pip install pytest==9.0.2

        python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=rust/tools/tests rust/tools/tests/test_radarcan_ci.py
        -q

        '
  radar-arm:
    name: rust RadarCAN native ARM functional validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
      EXPECTED_SOURCE: f0d81af610f5c96d0f87f2ba58d9a69a111a0795
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: f0d81af610f5c96d0f87f2ba58d9a69a111a0795
    - name: Require exact issue source
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Configure original Radar IPC imports
      run: printf 'PYTHONPATH=%s/radar-native/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Reserve runner capacity and install generic ARM dependencies
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ binutils libzmq3-dev

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2
        pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal

        rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build unchanged native ARM bindings and generate radar assets
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/radar-native/params"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/radar-native/msgq"

        "$CI_RECEIPT_METADATA" module RADAR_PARAMS_BINDING "$RUNNER_TEMP/radar-native/params/provenance.json" >> "$GITHUB_ENV"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features dbc-generator-native --bin
        dbc-generator --bin prepare-radarcan-assets

        printf ''OPENPILOT_DBC_GENERATOR=%s/rust/target/debug/dbc-generator\n'' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        rust/target/debug/prepare-radarcan-assets "$RUNNER_TEMP/radar-native/dbc"

        '
    - name: Stage pinned generic ARM numerical dependency
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        python -m pip download --only-binary=:all: --no-deps --platform manylinux_2_27_aarch64 --python-version 312 --abi
        cp312 numpy==2.5.3 --dest "$RUNNER_TEMP/radar-native/wheels"

        cargo +1.94.0 run --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --bin stage-torque-numerics -- --wheel
        "$RUNNER_TEMP"/radar-native/wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/radar-native/numerics"

        '
    - name: Build and execute generic ARM RadarCAN tests and artifacts
      working-directory: rust
      run: "mkdir -p \"$RUNNER_TEMP/radar-arm/tests\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/radar-arm/SOURCE_COMMIT\"\nuname\
        \ -m | tee \"$RUNNER_TEMP/radar-arm/machine.txt\"\ntest \"$(cat \"$RUNNER_TEMP/radar-arm/machine.txt\")\" = aarch64\n\
        \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 4096\nset -o pipefail\n\
        cargo build -p openpilot-radarcan --bins --examples --release --locked --target aarch64-unknown-linux-gnu --message-format=json\
        \ 2> \"$RUNNER_TEMP/radar-arm/build.log\" | tee \"$RUNNER_TEMP/radar-arm/build.jsonl\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\"\
        \ --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\ncargo test -p openpilot-radarcan -p openpilot-can --no-run --locked\
        \ --target aarch64-unknown-linux-gnu --message-format=json 2> \"$RUNNER_TEMP/radar-arm/tests-build.log\" | tee \"\
        $RUNNER_TEMP/radar-arm/tests-build.jsonl\"\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 512\ncargo build -p openpilot-dev-tools --bin list-cargo-tests --locked\ntarget/debug/list-cargo-tests\
        \ \"$RUNNER_TEMP/radar-arm/tests-build.jsonl\" > \"$RUNNER_TEMP/radar-arm/tests.txt\"\ntest -s \"$RUNNER_TEMP/radar-arm/tests.txt\"\
        \nwhile IFS= read -r radar_test; do\n  \"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 128\n  cp \"$radar_test\" \"$RUNNER_TEMP/radar-arm/tests/\"\n  sha256sum \"$radar_test\" >> \"$RUNNER_TEMP/radar-arm/tests-SHA256SUMS\"\
        \n  \"$radar_test\" --test-threads=1 2>&1 | tee \"$RUNNER_TEMP/radar-arm/tests/$(basename \"$radar_test\").log\"\n\
        done < \"$RUNNER_TEMP/radar-arm/tests.txt\"\nfor radar_binary in target/aarch64-unknown-linux-gnu/release/openpilot-radarcan\
        \ target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy; do\n  readelf -h -d -V \"$radar_binary\" > \"\
        $RUNNER_TEMP/radar-arm/$(basename \"$radar_binary\").readelf.txt\"\n  test \"$(readelf -h \"$radar_binary\" | sed\
        \ -n 's/.*Machine: *//p')\" = AArch64\n  sha256sum \"$radar_binary\" >> \"$RUNNER_TEMP/radar-arm/SHA256SUMS\"\ndone\n"
    - name: Require exact RadarCAN source comparison on native ARM
      run: python rust/tools/check_radarcan_ci.py --phase reference --probe "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy"
        --daemon "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/openpilot-radarcan" --numerics "$RUNNER_TEMP/radar-native/numerics"
        --binding "$RADAR_PARAMS_BINDING" --dbc "$RUNNER_TEMP/radar-native/dbc" --evidence "$RUNNER_TEMP/radar-native/reference"
    - name: Require actual original and native ARM IPC and signal lifecycle
      run: python rust/tools/check_radarcan_ci.py --phase ipc --probe "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy"
        --daemon "$GITHUB_WORKSPACE/rust/target/aarch64-unknown-linux-gnu/release/openpilot-radarcan" --numerics "$RUNNER_TEMP/radar-native/numerics"
        --binding "$RADAR_PARAMS_BINDING" --dbc "$RUNNER_TEMP/radar-native/dbc" --evidence "$RUNNER_TEMP/radar-native/ipc"
    - name: Preserve Radar generic ARM artifacts and functional evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-radar-arm-not-device-validated
        path: '${{ runner.temp }}/radar-arm/

          ${{ runner.temp }}/radar-native/

          rust/target/aarch64-unknown-linux-gnu/release/openpilot-radarcan

          rust/target/aarch64-unknown-linux-gnu/release/examples/radarcan-policy

          '
        if-no-files-found: warn
