name: 296 actual updater three-file retirement native-only full proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/updated-retirement-296-once.yml
permissions:
  contents: read
jobs:
  updater-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_SOURCE: 083f937a0eda7e05bd84f18bf68b0afce5a5956e
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 083f937a0eda7e05bd84f18bf68b0afce5a5956e
        persist-credentials: false
    - name: Require exact deleted checkout and native prerequisites
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SOURCE\"\nproof=\"$RUNNER_TEMP/updated-check-296\"\
        \nmkdir -p \"$proof\"\ngit rev-parse HEAD > \"$proof/source-commit.txt\"\nfor source in rust/tools/check_updated.py\
        \ rust/tools/updated_source.py rust/tools/tests/test_updated_comparison.py; do\n  test ! -e \"$source\"\n  test !\
        \ -L \"$source\"\ndone\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib 2048\nsudo apt-get update\n\
        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev strace git-lfs\
        \ gettext\nrustup toolchain install 1.94.0 --profile minimal --component clippy\n"
    - name: Build current native updater, launcher, controller and fixture
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/updated-check-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-updated --example updated_trace --locked 2>&1 | tee
        "$proof/native-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-process-supervision --bin openpilot-process-child
        --locked 2>&1 | tee "$proof/launcher-build.log"

        cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --bin
        check-updated --bin updated-fixture --locked 2>&1 | tee "$proof/checker-build.log"

        printf ''UPDATED_CHECK_BINARY=%s/rust/target/debug/examples/updated_trace\nUPDATED_CHECK_LAUNCHER=%s/rust/target/debug/openpilot-process-child\nUPDATED_CHECK_SHIM=%s/rust/target/debug/updated-fixture\n''
        "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        printf ''UPDATED_CHECK_OUTPUT=%s/native-test\nUPDATED_CHECK_CLI_OUTPUT=%s/cli\nUPDATED_CHECK_ABSENCE_EVIDENCE=%s/absence\n''
        "$proof" "$proof" "$proof" >> "$GITHUB_ENV"

        sha256sum rust/tools/updated_fixtures.py rust/tools/original_params_binding.py openpilot/system/updated/updated.py
        openpilot/system/updated/process.py openpilot/common/markdown.py openpilot/selfdrive/selfdrived/alerts_offroad.json
        > "$proof/source-inputs.sha256"

        sha256sum rust/target/debug/check-updated rust/target/debug/updated-fixture rust/target/debug/examples/updated_trace
        rust/target/debug/openpilot-process-child /usr/bin/strace > "$proof/executables.sha256"

        '
    - name: Require all original comparison regressions, CLI admissions and strict two-root executable audits
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/updated-check-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 2048\ncargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native\
        \ --test updated_check --locked -- --nocapture 2>&1 | tee \"$proof/controller-tests.log\"\ncargo +1.94.0 clippy --manifest-path\
        \ rust/Cargo.toml -p openpilot-dev-tools --features updated-fixture-native --lib --bin check-updated --bin updated-fixture\
        \ --test updated_check --locked -- -D warnings 2>&1 | tee \"$proof/clippy.log\"\nrust/target/debug/check-updated --binary\
        \ \"$UPDATED_CHECK_BINARY\" --launcher \"$UPDATED_CHECK_LAUNCHER\" --output \"$proof/default-cli\" > \"$proof/default-cli.stdout\"\
        \ 2> \"$proof/default-cli.stderr\"\ntest -s \"$proof/absence/checkout.exec\"\ntest -s \"$proof/absence/absent.exec\"\
        \nsha256sum --check \"$proof/source-inputs.sha256\"\nsha256sum --check \"$proof/executables.sha256\"\nfor source in\
        \ rust/tools/check_updated.py rust/tools/updated_source.py rust/tools/tests/test_updated_comparison.py; do\n  test\
        \ ! -e \"$source\"\n  test ! -L \"$source\"\ndone\n"
    - name: Retain complete actual-deletion native evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: updated-retirement-296
        path: ${{ runner.temp }}/updated-check-296/
        if-no-files-found: error
