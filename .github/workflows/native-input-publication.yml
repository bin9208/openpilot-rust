name: Native source input publication
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful genuine AGNOS producer run ID
        required: true
        type: string
      source_commit:
        description: Exact tested producer Git commit
        required: true
        type: string
      source_pr_number:
        description: Dev PR number whose immutable validation receipts match the producer
        required: true
        type: string
      index_sha256:
        description: Exact candidate index SHA from the small producer artifact
        required: true
        type: string
      publish:
        description: Publish verified input assets after every source gate passes
        default: false
        type: boolean
permissions:
  actions: read
  contents: write
concurrency:
  group: native-source-input-publication-preserve-v1
  queue: max
  cancel-in-progress: false
jobs:
  inputs:
    name: Validate or publish source-pinned native inputs
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository == 'bin9208/openpilot-rust' && github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Linux, X64, openpilot-rust]
    timeout-minutes: 30
    env:
      LOCAL_CI_ARCH: x86_64
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
      GH_PROMPT_DISABLED: '1'
      NATIVE_INPUT_RUN: ${{ inputs.source_run_id }}
      NATIVE_INPUT_SOURCE: ${{ inputs.source_commit }}
      NATIVE_INPUT_PR: ${{ inputs.source_pr_number }}
      NATIVE_INPUT_INDEX: ${{ inputs.index_sha256 }}
      NATIVE_INPUT_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/job-temp
      - name: Verify publication boundaries before using a write token
        run: /usr/bin/python3 -I -B -S -m unittest discover -s tools/ci/tests -p test_native_input_publication.py -v
      - name: Verify the actual source, artifact and immutable assets
        shell: bash
        run: |
          command -v gh curl python3
          arguments=(--source-run-id "$NATIVE_INPUT_RUN" --source-pr-number "$NATIVE_INPUT_PR" --source-commit "$NATIVE_INPUT_SOURCE" --index-sha256 "$NATIVE_INPUT_INDEX")
          if [[ $NATIVE_INPUT_PUBLISH == true ]]; then arguments+=(--publish); fi
          /usr/bin/python3 -I -B -S tools/native/publish_inputs.py "${arguments[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-input-publication-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_JOB_TEMP }}/native-input-publication/report.json
            ${{ env.CI_JOB_TEMP }}/native-input-publication/native-bootstrap-inputs*.json
          if-no-files-found: warn
      - uses: ./.github/actions/job-temp
        if: always()
        with: {cleanup: 'true'}
