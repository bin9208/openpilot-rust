name: Python Rust 523 committed bundle acceptance
'on':
  push:
    branches:
    - codex/feat-523-python-rust
    paths:
    - .github/workflows/python-rust-523-bundle.yml
    - rust/crates/dev-tools/tests/route_vault_bundle.rs
    - rust/crates/dev-tools/tests/route_vault_bundle/frozen.rs
    - rust/crates/dev-tools/tests/fixtures/route-vault-bundle-original/**
    - tools/carrot_route_vault/build_bundle.py
permissions:
  contents: read
  actions: read
concurrency:
  group: python-rust-523-bundle-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  bundle:
    name: Native committed bundle source and CLI acceptance
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - name: Deny fork source and require registered local runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        test "${SOURCE_ALLOWED:-}" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }
        test "$RUNNER_NAME" = bin-actions
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
    - name: Common owned Fast job temporary paths
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/job-temp@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - name: Allocate private Fast source cache and target before checkout
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        job=$CI_JOB_TEMP
        owner="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
        test "$(cat "$job/owner")" = "$owner"
        umask 077
        mkdir "$job/proof" "$job/home" "$job/cache"
        # Source capacity is checked on the actual source filesystem BEFORE checkout.
        available=$(df -PB1 "$workspace" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        required=$((2 * 1024 * 1024 * 1024))
        printf '{"available_bytes":%s,"planned_source_growth_bytes":%s}\n' "$available" "$required" > "$job/proof/source-growth-before-checkout.json"
        ((available >= required))
        source_owner=$(mktemp -d "$workspace/.diag296-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
        printf '%s\n' "$owner" > "$source_owner/.diag296-owner"
        mkdir "$source_owner/source"
        source="$source_owner/source"
        # Preserve Actions' real workspace separately. Only Bash consumers see the
        # unique source as GITHUB_WORKSPACE; GitHub/node action provenance is untouched.
        printf 'source %q\nif [[ ${GITHUB_WORKSPACE:-} == %q ]]; then\n  export GITHUB_WORKSPACE=%q\nfi\n' "$BASH_ENV" "$workspace" "$source" > "$job/diagnostic-shell-env"
        printf '%s\n' "DIAG_ACTIONS_WORKSPACE=$workspace" "DIAG_SOURCE_OWNER=$source_owner" "DIAG_SOURCE_IDENTITY=$(stat -c '%d:%i' -- "$source_owner")" "DIAG_SOURCE=$source" "DIAG_CHECKOUT_PATH=${source#"$workspace/"}" "HOME=$job/home" "CARGO_HOME=$job/cargo-home" "RUSTUP_HOME=$job/rustup-home" "CARGO_TARGET_DIR=$source/rust/target" "XDG_CACHE_HOME=$job/cache" "PIP_CACHE_DIR=$job/cache/pip" "GRADLE_USER_HOME=$job/cache/gradle" "npm_config_cache=$job/cache/npm" "BASH_ENV=$job/diagnostic-shell-env" >> "$GITHUB_ENV"
        printf 'owner=%s\njob=%s\nactions_workspace=%s\nsource_owner=%s\nsource_identity=%s\nsource=%s\nworkflow_sha=%s\n' "$owner" "$job" "$workspace" "$source_owner" "$(stat -c '%d:%i' -- "$source_owner")" "$source" "$GITHUB_SHA" > "$job/proof/ownership.txt"
        df -PB1 "$workspace" "$job" > "$job/proof/disk-before.txt"
        cat /proc/meminfo > "$job/proof/memory-before.txt"
        if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events > "$job/proof/cgroup-memory-before.txt"; fi
        printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$job/proof/runner.txt"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        path: ${{ env.DIAG_CHECKOUT_PATH }}
        set-safe-directory: false
        clean: false
        lfs: false
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Admit exact focused source HEAD and tracked index
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        test "$PWD" = "$DIAG_SOURCE"
        test "$GITHUB_WORKSPACE" = "$DIAG_SOURCE"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        printf '%s\n' "$GITHUB_SHA" > "$CI_JOB_TEMP/proof/SOURCE_COMMIT"
        git ls-files -z > "$CI_JOB_TEMP/proof/index-before.bin"
        tar --null --no-recursion --verbatim-files-from -T "$CI_JOB_TEMP/proof/index-before.bin" -cf - --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner | sha256sum > "$CI_JOB_TEMP/proof/source-before.sha256"
    - name: Expose provisioned Rust shims
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: bin9208/openpilot-rust/.github/actions/rust-path@b2fc62472ce8183114d59dbeec4d1406df44e4c2
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    - name: Isolate original Python package installation
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$CI_JOB_TEMP" | awk 'NR == 2 {print $4}')
        [[ $available =~ ^[0-9]+$ ]]
        ((available >= 512 * 1024 * 1024))
        "$pythonLocation/bin/python" -I -B -m venv "$CI_JOB_TEMP/venv"
        printf '%s\n' "$CI_JOB_TEMP/venv/bin" >> "$GITHUB_PATH"
        library=$(readlink -e "$pythonLocation/lib")
        test "$library" = "$pythonLocation/lib"
        test -f "$library/libpython3.12.so.1.0"
        printf '%s\n' "OPENPILOT_ORACLE_PYTHON_LIBRARY_PATH=$library" >> "$GITHUB_ENV"
        sha256sum "$library/libpython3.12.so.1.0" "$library/python3.12/argparse.py" "$(readlink -e "$CI_JOB_TEMP/venv/bin/python")" > "$CI_JOB_TEMP/proof/oracle-runtime.sha256"
        /usr/bin/env -i HOME="$CI_JOB_TEMP/home" LD_LIBRARY_PATH="$library" "$CI_JOB_TEMP/venv/bin/python" -I -B -X "pycache_prefix=$CI_JOB_TEMP/unused-oracle-pycache" - <<'RUNTIME' > "$CI_JOB_TEMP/proof/oracle-runtime.json"
        import argparse, hashlib, json, os, pathlib, sys
        assert sys.version_info[:3] == (3,12,15), sys.version
        base = pathlib.Path(sys.base_prefix).resolve()
        provider = (base/'lib/libpython3.12.so.1.0').resolve(strict=True)
        assert pathlib.Path(argparse.__file__).resolve() == base/'lib/python3.12/argparse.py'
        info = provider.stat()
        mappings = [line.split(maxsplit=5) for line in pathlib.Path('/proc/self/maps').read_text().splitlines() if 'libpython' in line]
        device = f'{os.major(info.st_dev):02x}:{os.minor(info.st_dev):02x}'
        assert mappings and all(len(r)==6 and r[3]==device and int(r[4])==info.st_ino and pathlib.Path(r[5]).resolve()==provider for r in mappings)
        print(json.dumps({'version':sys.version,'executable':str(pathlib.Path(sys.executable).resolve()),'base_prefix':str(base),'library':str(provider),'library_sha256':hashlib.sha256(provider.read_bytes()).hexdigest(),'argparse':str(pathlib.Path(argparse.__file__).resolve()),'argparse_sha256':hashlib.sha256(pathlib.Path(argparse.__file__).read_bytes()).hexdigest(),'cleared_environment':True},indent=2))
        RUNTIME
        printf '%s\n' "BUNDLE_ORACLE_PYTHON=$CI_JOB_TEMP/venv/bin/python" >> "$GITHUB_ENV"
    - name: Prepare native bundle toolchain and original comparison providers
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        set -euo pipefail
        available=$(df -PB1 "$DIAG_SOURCE" | awk 'NR == 2 {print $4}')
        # Initial library/contracts only; the public host bootstrap is admitted separately below.
        (( available >= 2 * 1024 * 1024 * 1024 ))
        printf '{"available_bytes":%s,"planned_preparation_and_diagnostic_growth_bytes":2147483648}\n' "$available" > "$CI_JOB_TEMP/proof/build-growth.json"
        sudo -n apt-get -o APT::Architectures=amd64 update
        sudo -n apt-get -o APT::Architectures=amd64 install -y g++ pkg-config capnproto libcapnp-dev strace gh unzip
        export RUSTUP_HOME=/home/actions/.rustup
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        test -x "$RUSTUP_HOME/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/rustc"
        sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which clippy-driver)" > "$CI_JOB_TEMP/proof/rust-tools.sha256"
        rustc -vV > "$CI_JOB_TEMP/proof/rustc.txt"
        cargo -V > "$CI_JOB_TEMP/proof/cargo.txt"
        unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        find "$CI_JOB_TEMP/venv" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$CI_JOB_TEMP/proof/oracle-venv-files.before.sha256"
        find "$CI_JOB_TEMP/venv" -type l -printf '%p\t%l\n' | sort > "$CI_JOB_TEMP/proof/oracle-venv-links.before.txt"
      id: toolchain
    - name: Admit unchanged library and twenty-three frozen original observations
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() &&
        steps.toolchain.outcome == 'success') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        prior="$CI_JOB_TEMP/proof/prior-bundle-121aa5.zip"
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12560845618/zip > "$prior"
        printf 'b6ecc542f61d83ee1bfa518d3926ccfb45e6d2f52240eb7f85fd42c8cdc3f50a  %s\n' "$prior" | sha256sum --check -
        unzip -t "$prior" > "$CI_JOB_TEMP/proof/prior-bundle-crc.txt"
        test "$(unzip -p "$prior" SOURCE_COMMIT)" = 121aa5b86ddf427697a8cabb25d2ed337d80f429
        for item in source index; do
          if test "$item" = source; then suffix=sha256; else suffix=bin; fi
          unzip -p "$prior" "$item-before.$suffix" > "$CI_JOB_TEMP/proof/prior-$item-before.$suffix"
          unzip -p "$prior" "$item-after.$suffix" > "$CI_JOB_TEMP/proof/prior-$item-after.$suffix"
          cmp "$CI_JOB_TEMP/proof/prior-$item-before.$suffix" "$CI_JOB_TEMP/proof/prior-$item-after.$suffix"
        done
        unzip -p "$prior" bundle-lib.log | grep -F 'test result: ok. 1 passed;'
        unzip -p "$prior" bundle-integration.log | grep -F 'test result: ok. 17 passed;'
        unzip -p "$prior" rust-tools.sha256 > "$CI_JOB_TEMP/proof/prior-rust-tools.sha256"
        sha256sum --check "$CI_JOB_TEMP/proof/prior-rust-tools.sha256"
        git fetch --no-tags --depth=1 origin 121aa5b86ddf427697a8cabb25d2ed337d80f429
        git diff --exit-code 121aa5b86ddf427697a8cabb25d2ed337d80f429 HEAD -- rust/Cargo.toml rust/Cargo.lock rust/rust-toolchain.toml rust/crates/dev-tools/src/lib.rs rust/crates/dev-tools/src/route_vault_bundle.rs rust/crates/dev-tools/src/bin/build_route_vault_bundle.rs rust/crates/dev-tools/src/argparse_scan.rs rust/crates/dev-tools/src/qa_process.rs rust/crates/dev-tools/src/python_fs.rs rust/tools/run-developer-tool
        printf '%s  %s\n' a1db3f1726cba01dfcb50efd8d13536de6ff9c47d5244346019010bf7be243a8 rust/crates/dev-tools/Cargo.toml | sha256sum --check -
        "$BUNDLE_ORACLE_PYTHON" -I -B -S - <<'CARGO'
        import pathlib, subprocess, tomllib
        path='rust/crates/dev-tools/Cargo.toml'
        old=tomllib.loads(subprocess.check_output(['/usr/bin/git','show','121aa5b86ddf427697a8cabb25d2ed337d80f429:'+path],text=True))
        new=tomllib.loads(pathlib.Path(path).read_text())
        entry={'name':'prepare-changed-files-context','path':'src/bin/prepare_changed_files_context.rs','required-features':['changed-files-native']}
        assert new['bin'].count(entry)==1
        new['bin'].remove(entry)
        assert new==old, 'Bundle feature/bin/test/dependency semantics changed'
        CARGO
        "$BUNDLE_ORACLE_PYTHON" -I -B -S - "$prior" <<'CAPTURES'
        import collections,hashlib,json,pathlib,sys,zipfile
        base=pathlib.Path('rust/crates/dev-tools/tests/fixtures/route-vault-bundle-original')
        manifest=json.loads((base/'manifest.json').read_bytes())
        with zipfile.ZipFile(sys.argv[1]) as archive:
         names=archive.namelist(); assert len(names)==len(set(names))
         rows={hashlib.sha256(archive.read(name)).hexdigest():archive.read(name) for name in names if name.startswith('bundle-original/') and name.endswith('.json')}
         assert len(rows)==23 and len(manifest['rows'])==23
         assert sorted(collections.Counter(json.loads(data)['test_name'] for data in rows.values()).values())==[1,3,7,12]
         consumed=set()
         for entry in manifest['rows']:
          name=entry['file']; assert pathlib.PurePosixPath(name).parts==(name,), 'Fixture filename must be one normal component'
          data=(base/name).read_bytes(); sha=hashlib.sha256(data).hexdigest()
          assert sha==entry['sha256'] and rows[sha]==data and sha not in consumed
          consumed.add(sha)
          row=json.loads(data)
          assert row['source_commit']=='121aa5b86ddf427697a8cabb25d2ed337d80f429'
          assert row['script_sha256_before']==row['script_sha256_after']=='05551fc470864a4c70758a66b1a156c2b6d9e95e8deeb1f2a74ac13fb5259aa9'
         assert consumed==set(rows)
        print('Unmodified 23 original captures bound to current frozen fixtures')
        CAPTURES
        prior_context="$CI_JOB_TEMP/proof/prior-context-d2c18.zip"
        gh api repos/bin9208/openpilot-rust/actions/artifacts/12561452899/zip > "$prior_context"
        printf '8903a728e2fe37bd807dabdb471deb8273893b3b8b4573d9e626b8322ad6fd2d  %s\n' "$prior_context" | sha256sum --check -
        unzip -t "$prior_context" > "$CI_JOB_TEMP/proof/prior-context-crc.txt"
        test "$(unzip -p "$prior_context" SOURCE_COMMIT)" = d2c18c37eb502f3d8e5a6d0314c709804df92f38
        for item in source index; do
          if test "$item" = source; then suffix=sha256; else suffix=bin; fi
          unzip -p "$prior_context" "$item-before.$suffix" > "$CI_JOB_TEMP/proof/context-$item-before.$suffix"
          unzip -p "$prior_context" "$item-after.$suffix" > "$CI_JOB_TEMP/proof/context-$item-after.$suffix"
          cmp "$CI_JOB_TEMP/proof/context-$item-before.$suffix" "$CI_JOB_TEMP/proof/context-$item-after.$suffix"
        done
        git fetch --no-tags --depth=1 origin d2c18c37eb502f3d8e5a6d0314c709804df92f38
        # Exact thirteen source roots plus seven fixed files: the bundle producer is outside this selection.
        git diff --exit-code d2c18c37eb502f3d8e5a6d0314c709804df92f38 HEAD -- openpilot/common/filter_simple.py openpilot/selfdrive/carrot/radar/lateral.py openpilot/selfdrive/carrot/radar/tools/radar_group3_replay.py openpilot/selfdrive/carrot/radar_motion openpilot/selfdrive/carrot/radar/tools/radar_validation_replay.py openpilot/selfdrive/carrot/radar/tools/radar_web_export.py openpilot/selfdrive/carrot/cluster openpilot/selfdrive/controls/lib/cutin_alert.py openpilot/selfdrive/controls/lib/cutin_helpers.py openpilot/cereal opendbc_repo/opendbc/__init__.py opendbc_repo/opendbc/car opendbc_repo/opendbc/dbc tools/carrot_route_vault/server.py tools/carrot_route_vault/viewer.py tools/carrot_route_vault/radar.py tools/carrot_route_vault/radar_view.js tools/carrot_route_vault/requirements.txt tools/carrot_route_vault/Dockerfile.vault tools/carrot_route_vault/deploy_probe.py
        test ! -e tools/carrot_route_vault/build_bundle.py && test ! -L tools/carrot_route_vault/build_bundle.py
        printf '%s\n' 'Reused unchanged library1 and the original23 raw observations; fresh native18 preserve all seventeen test bodies/assertions plus absence controls. d2 actual411 raw outputs are the unchanged selected-blob reference; SOURCE_COMMIT is verified separately for the new exact source. No original Python producer execution.' > "$CI_JOB_TEMP/proof/reused-contracts.txt"
    - name: Verify all seventeen preserved contracts and source absence without the original producer
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() &&
        steps.toolchain.outcome == 'success') }}
      shell: bash
      working-directory: ${{ env.DIAG_SOURCE }}
      run: |
        set -euo pipefail
        export EXPECTED_SOURCE="$GITHUB_SHA"
        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features route-vault-bundle-native --test route_vault_bundle -- --nocapture 2>&1 | tee "$CI_JOB_TEMP/proof/bundle-frozen.log"
        grep -F 'test result: ok. 18 passed; 0 failed; 0 ignored;' "$CI_JOB_TEMP/proof/bundle-frozen.log"
        "$BUNDLE_ORACLE_PYTHON" -I -B -S - <<'CONSUMPTION'
        import hashlib,json,os,pathlib
        proof=pathlib.Path(os.environ['CI_JOB_TEMP'])/'proof'
        base=pathlib.Path('rust/crates/dev-tools/tests/fixtures/route-vault-bundle-original')
        manifest=json.loads((base/'manifest.json').read_bytes())
        expected={entry['sha256']:json.loads((base/entry['file']).read_bytes())['test_name'] for entry in manifest['rows']}
        log=(proof/'bundle-frozen.log').read_bytes();assert len(log)<=8*1024**2
        rows=[]
        for line in log.decode('utf-8').splitlines():
         marker='BUNDLE_FROZEN_ROW '
         if marker in line:
          # libtest의 progress 접두사가 붙어도 JSON 전체를 그대로 읽는다.
          row=json.loads(line.split(marker,1)[1]);assert set(row)=={'test_name','raw_sha256','historical_source','fresh_original_executions'}
          assert row['historical_source']=='121aa5b86ddf427697a8cabb25d2ed337d80f429' and row['fresh_original_executions']==0
          assert expected[row['raw_sha256']]==row['test_name'];rows.append(row)
        assert len(rows)==len({row['raw_sha256'] for row in rows})==23
        assert {row['raw_sha256'] for row in rows}==set(expected)
        (proof/'frozen-consumption.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'native_tests':18,'unique_original_rows':23,'log_sha256':hashlib.sha256(log).hexdigest(),'fresh_original_executions':0,'rows':rows},indent=2)+'\n')
        CONSUMPTION
        sha256sum rust/crates/dev-tools/tests/fixtures/route-vault-bundle-original/*.json > "$CI_JOB_TEMP/proof/frozen-fixtures.sha256"
        test ! -e tools/carrot_route_vault/build_bundle.py && test ! -L tools/carrot_route_vault/build_bundle.py
    - name: Validate strict bundle Clippy after caller and capture changes
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() &&
        steps.toolchain.outcome == 'success') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      run: |
        set -euo pipefail
        cargo clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features route-vault-bundle-native --lib --bin build-route-vault-bundle --test route_vault_bundle -- -D warnings 2>&1 | tee "$CI_JOB_TEMP/proof/bundle-clippy.log"
        df -PB1 "$DIAG_SOURCE" "$CI_JOB_TEMP" > "$CI_JOB_TEMP/proof/disk-after-clippy.txt"
        du -sx --block-size=1 "$CARGO_HOME" "$CARGO_TARGET_DIR" "$CI_JOB_TEMP/venv" > "$CI_JOB_TEMP/proof/allocated-after-clippy.tsv"
    - name: Compare public native bootstrap with accepted unchanged committed output data
      if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() &&
        steps.toolchain.outcome == 'success') }}
      working-directory: ${{ env.DIAG_SOURCE }}
      shell: bash
      run: |
        set -euo pipefail
        proof="$CI_JOB_TEMP/proof/committed-contexts"
        mkdir "$proof" "$proof/empty-cwd"
        LD_LIBRARY_PATH="$OPENPILOT_ORACLE_PYTHON_LIBRARY_PATH" "$BUNDLE_ORACLE_PYTHON" -I -B -S -X "pycache_prefix=$proof/unused-growth-pycache" - <<'GROWTH'
        import json,os
        from pathlib import Path
        source=Path(os.environ['DIAG_SOURCE'])
        job=Path(os.environ['CI_JOB_TEMP'])
        target=Path(os.environ['CARGO_TARGET_DIR'])
        cargo=Path(os.environ['CARGO_HOME'])
        proof=job/'proof/committed-contexts'
        assert target==source/'rust/target' and cargo==job/'cargo-home', 'Unexpected private build paths'
        for path in (source,job,target,cargo,proof):
         assert path.is_absolute() and path.resolve(strict=True)==path and path.is_dir(), path
        host_growth=3*1024**3
        context_growth=128*1024**2
        filesystems={}
        # 같은 device의 target/cache는 helper의 합산 3 GiB 추정을 공유하고 context를 더한다.
        # 다른 device라면 target과 cache 양쪽에서 기존 helper 3072 MiB gate를 충족한다.
        for role,path in (('target',target),('cargo_home',cargo),('contexts',proof)):
         device=path.stat().st_dev
         space=os.statvfs(path)
         available=space.f_bavail*space.f_frsize
         row=filesystems.setdefault(device,{'device':device,'available_bytes':available,'host_build_growth_bytes':0,'context_growth_bytes':0,'paths':{}})
         row['available_bytes']=min(row['available_bytes'],available)
         row['paths'][role]=str(path)
         if role=='contexts': row['context_growth_bytes']=context_growth
         else: row['host_build_growth_bytes']=host_growth
        for row in filesystems.values():
         row['required_bytes']=row['host_build_growth_bytes']+row['context_growth_bytes']
