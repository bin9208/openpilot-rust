name: 296 focused native driver daemon original packet parity
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/driver-daemon-native-once.yml
permissions:
  contents: read
jobs:
  driver-daemon-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: 4dbe0f11b02c1c7c3bcebcd34b5f65751eca8e78
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 4dbe0f11b02c1c7c3bcebcd34b5f65751eca8e78
    - name: Require exact source, disk room and native prerequisites
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        mkdir -p "$RUNNER_TEMP/driver-daemon-native-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 git-lfs capnproto libcapnp-dev libzmq3-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Fail fast on driver leaf unit, integration compile and strict Clippy
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --lib driver_daemon_check::
        --locked -- --nocapture >"$proof/unit.log" 2>&1 || { cat "$proof/unit.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test driver_daemon_check
        --no-run --locked >"$proof/integration-compile.log" 2>&1 || { cat "$proof/integration-compile.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --lib --test driver_daemon_check
        --locked -- -D warnings >"$proof/clippy.log" 2>&1 || { cat "$proof/clippy.log"; exit 1; }

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned original Python observer dependencies
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2

        '
    - name: Build only driver daemon, model runner, log collector and original IPC bindings
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bin model-run --locked >"$proof/model-run-build.log"
        2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dmonitoringmodeld --locked >"$proof/dmonitoring-build.log"
        2>&1 || { cat "$proof/dmonitoring-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo build --manifest-path rust/Cargo.toml -p openpilot-logmessaged --bin openpilot-logmessaged --locked >"$proof/logmessaged-build.log"
        2>&1 || { cat "$proof/logmessaged-build.log"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python" >"$proof/msgq-build.log" 2>&1
        || { cat "$proof/msgq-build.log"; exit 1; }

        '
    - name: Compile only original driver model, metadata and both camera warps
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\nmkdir -p \"$RUNNER_TEMP/original-models\"\npython tinygrad_repo/examples/openpilot/compile3.py\
        \ \"$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx\" \"$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl\"\
        \ >\"$proof/driver-model-compile.log\" 2>&1 || { cat \"$proof/driver-model-compile.log\"; exit 1; }\npython openpilot/selfdrive/modeld/get_model_metadata.py\
        \ openpilot/selfdrive/modeld/models/dmonitoring_model.onnx >\"$proof/metadata-compile.log\" 2>&1 || { cat \"$proof/metadata-compile.log\"\
        ; exit 1; }\ncp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl \"$RUNNER_TEMP/original-models/\"\
        \nfor resolution in 1928x1208 1344x760; do\n  rust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\" --growth-mib\
        \ 2048\n  python openpilot/selfdrive/modeld/compile_dm_warp.py --camera-resolution \"$resolution\" --warp-to 1440x960\
        \ --output \"$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl\" >\"$proof/warp-${resolution}.log\"\
        \ 2>&1 || { cat \"$proof/warp-${resolution}.log\"; exit 1; }\ndone\n"
    - name: Publish driver-only native catalog from sealed original PKLs
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 4096\npython - <<'PY_CATALOG' >\"$proof/catalog-build.log\" 2>&1\nimport hashlib\nimport os\nfrom pathlib\
        \ import Path\nfrom model_export.original import DriverArtifacts, driver\nfrom model_export.publish import BundleSpec,\
        \ publish\nfrom openpilot.common.file_chunker import open_file_chunked\n\nroot = Path(os.environ[\"RUNNER_TEMP\"])\
        \ / \"original-models\"\noutput = Path(os.environ[\"RUNNER_TEMP\"]) / \"native-catalog\"\ndef source_hash(path):\n\
        \    with open_file_chunked(str(path)) as source:\n        return hashlib.file_digest(source, \"sha256\").hexdigest()\n\
        model = root / \"dmonitoring_model_tinygrad.pkl\"\nmetadata = root / \"dmonitoring_model_metadata.pkl\"\nbase_sources\
        \ = {\"model\": source_hash(model), \"metadata\": source_hash(metadata)}\nspecs = []\nfor resolution in ((1928, 1208),\
        \ (1344, 760)):\n    warp = root / f\"dm_warp_{resolution[0]}x{resolution[1]}_tinygrad.pkl\"\n    specs.append(BundleSpec(\"\
        driver\", resolution, driver(DriverArtifacts(model, warp, metadata)),\n                            base_sources |\
        \ {\"warp\": source_hash(warp)}))\npublish(output, specs, \"cpu\")\nprint(output / \"current.json\")\nPY_CATALOG\n\
        rust/target/debug/model-run --check-catalog \"$RUNNER_TEMP/native-catalog\" >\"$proof/catalog-check.log\" 2>&1 ||\
        \ { cat \"$proof/catalog-build.log\" \"$proof/catalog-check.log\"; exit 1; }\n"
    - name: Materialize SHA-pinned independent original-only capture wrapper
      shell: bash
      run: 'set -euo pipefail

        set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        python3 - <<''PY_CAPTURE''

        import base64

        import hashlib

        import os

        from pathlib import Path

        raw = base64.b64decode("",
        validate=True)

        assert hashlib.sha256(raw).hexdigest() == "8bfdbbbf57e93632b44ef337dd641a238de443cba81ac27a8f3c4ad57411202c"

        target = Path(os.environ["RUNNER_TEMP"]) / "driver-daemon-native-296" / "capture_original_driver.py"

        target.write_bytes(raw)

        assert hashlib.sha256(target.read_bytes()).hexdigest() == "8bfdbbbf57e93632b44ef337dd641a238de443cba81ac27a8f3c4ad57411202c"

        PY_CAPTURE

        printf ''%s\n'' ''8bfdbbbf57e93632b44ef337dd641a238de443cba81ac27a8f3c4ad57411202c'' > "$proof/capture-script.sha256"

        '
    - name: Seal original sources and three held native executables before traffic
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sha256sum rust/tools/check_driver_daemon.py rust/tools/model_export/original.py rust/tools/model_export/publish.py
        rust/crates/dev-tools/src/driver_daemon_check.rs rust/crates/dev-tools/tests/driver_daemon_check.rs rust/crates/dev-tools/Cargo.toml
        rust/crates/dev-tools/src/lib.rs "$proof/capture_original_driver.py" rust/target/debug/openpilot-dmonitoringmodeld
        rust/target/debug/openpilot-logmessaged rust/target/debug/model-run >"$proof/inputs-before.sha256"

        find "$RUNNER_TEMP/original-models" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum >"$proof/models-before.sha256"

        '
    - name: Run unchanged four-case Python checker and capture independent expected packets
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/driver-daemon-native-296\"\nrust/tools/check-disk-space --path \"$RUNNER_TEMP\"\
        \ --growth-mib 1024\nPYTHONPATH=\"$RUNNER_TEMP/model-msgq-python:$PYTHONPATH\" python \"$proof/capture_original_driver.py\"\
        \ --root \"$GITHUB_WORKSPACE\" --source-commit \"$EXPECTED_SOURCE\" --expected-checker-sha256 ea1266dc395dab662319bd3637ad90440989dbd3d2937756dbf07fbb993520f5b\
        \ --binary \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-dmonitoringmodeld\" --catalog \"$RUNNER_TEMP/native-catalog\"\
        \ --models \"$RUNNER_TEMP/original-models\" --collector \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged\"\
        \ --output \"$proof/original\" >\"$proof/original.stdout\" 2>\"$proof/original.stderr\" || { cat \"$proof/original.stderr\"\
        ; exit 1; }\npython - <<'PY_MANIFEST' >\"$proof/original-summary.json\"\nimport json, os\nfrom pathlib import Path\n\
        manifest = json.loads((Path(os.environ[\"RUNNER_TEMP\"]) / \"driver-daemon-native-296/original/reference-manifest.json\"\
        ).read_text())\ncases = manifest[\"cases\"]\nassert [(case[\"width\"], case[\"raw\"], case[\"frame_count\"], case[\"\
        reference_count\"]) for case in cases] == [\n    (1344, True, 4, 5), (1344, False, 1, 2), (1928, True, 4, 5), (1928,\
        \ False, 1, 2)]\nassert len(manifest[\"original_source_inputs\"]) == 15\nassert manifest[\"loaded_python_sources\"\
        ]\nassert set(manifest[\"original_models\"]) == {\n    \"dmonitoring_model_tinygrad.pkl\", \"dmonitoring_model_metadata.pkl\"\
        ,\n    \"dm_warp_1344x760_tinygrad.pkl\", \"dm_warp_1928x1208_tinygrad.pkl\"}\nprint(json.dumps({\"cases\":len(cases),\
        \ \"source_expected_packets\":sum(case[\"reference_count\"] for case in cases),\n                  \"input_frames\"\
        :sum(case[\"frame_count\"] for case in cases),\n                  \"imported_python_sources\":len(manifest[\"loaded_python_sources\"\
        ])},sort_keys=True))\nPY_MANIFEST\nmanifest_sha=\"$(sha256sum \"$proof/original/reference-manifest.json\" | cut -d\
        \ ' ' -f1)\"\nprintf 'DRIVER_DAEMON_ORIGINAL_MANIFEST_SHA256=%s\\n' \"$manifest_sha\" >> \"$GITHUB_ENV\"\nsha256sum\
        \ \"$proof/original/driver-daemon-peer\" rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/openpilot-logmessaged\
        \ \"$RUNNER_TEMP/native-catalog/current.json\" \"$proof/original/reference-manifest.json\" >\"$proof/native-inputs-before.sha256\"\
        \nprintf 'DRIVER_DAEMON_ORIGINAL_CAPTURE=%s\\nDRIVER_DAEMON_SOURCE_COMMIT=%s\\nDRIVER_DAEMON_BINARY=%s\\nDRIVER_DAEMON_CATALOG=%s\\\
        nDRIVER_DAEMON_COLLECTOR=%s\\nDRIVER_DAEMON_PEER=%s\\nDRIVER_DAEMON_MODELS=%s\\nDRIVER_DAEMON_NATIVE_OUTPUT=%s\\nDRIVER_DAEMON_ROOT=%s\\\
        n' \"$proof/original\" \"$EXPECTED_SOURCE\" \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-dmonitoringmodeld\" \"\
        $RUNNER_TEMP/native-catalog\" \"$GITHUB_WORKSPACE/rust/target/debug/openpilot-logmessaged\" \"$proof/original/driver-daemon-peer\"\
        \ \"$RUNNER_TEMP/original-models\" \"$proof/native\" \"$GITHUB_WORKSPACE\" >> \"$GITHUB_ENV\"\ncat \"$proof/original.stdout\"\
        \n"
    - name: Run native reference, mutation and actual four-case replay tests
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features driver-daemon-native --test driver_daemon_check
        --locked -- --nocapture >"$proof/native-tests.log" 2>&1 || { cat "$proof/native-tests.log"; exit 1; }

        test -f "$proof/native/report.json"

        '
    - name: Verify post-traffic source, executable and original model identities
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sha256sum -c "$proof/inputs-before.sha256" >"$proof/inputs-after.log"

        sha256sum -c "$proof/models-before.sha256" >"$proof/models-after.log"

        sha256sum -c "$proof/native-inputs-before.sha256" >"$proof/native-inputs-after.log"

        sha256sum "$proof/original/reference-manifest.json" "$proof/native/report.json" >"$proof/receipts.sha256"

        '
    - name: Retain identity diagnostics even when the behavioral gate fails
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-daemon-native-296"

        if test -f "$proof/inputs-before.sha256"; then sha256sum -c "$proof/inputs-before.sha256" >"$proof/inputs-final.log"
        2>&1 || true; fi

        if test -f "$proof/models-before.sha256"; then sha256sum -c "$proof/models-before.sha256" >"$proof/models-final.log"
        2>&1 || true; fi

        if test -f "$proof/native-inputs-before.sha256"; then sha256sum -c "$proof/native-inputs-before.sha256" >"$proof/native-inputs-final.log"
        2>&1 || true; fi

        git rev-parse HEAD >"$proof/source-final.txt"

        '
      if: always()
    - name: Upload all driver source, build, original and native evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: driver-daemon-native-296
        path: ${{ runner.temp }}/driver-daemon-native-296
        if-no-files-found: error
        retention-days: 14
