name: 296 V4L owned scratch full encoder proof
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/encoder-scratch-447-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  encoder-scratch:
    name: 296 V4L owned scratch full encoder regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      ENCODER_LIBYUV_LIB: /usr/lib/x86_64-linux-gnu
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: a6c3201fe9d6cc228bfa8b54abf60ef0e6d35d82
    - name: Require exact candidate source
      run: 'test "$(git rev-parse HEAD)" = a6c3201fe9d6cc228bfa8b54abf60ef0e6d35d82

        '
    - name: Reserve capacity and install native codec prerequisites
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev cmake pkg-config capnproto libcapnp-dev libavcodec-dev
        libavformat-dev libavutil-dev libswscale-dev libyuv-dev libzmq3-dev ffmpeg

        '
    - name: Install pinned native toolchain
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Require native staging and fixture failure detection
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --test encoder_stage --test encoder_runtime_ci

        '
    - name: Require actual native IPC frame and owned process boundaries
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features encoder-runtime-native --bin check-encoder-runtime
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features encoder-runtime-native --test encoder_runtime_native
        --test encoder_ci_check --locked

        '
    - name: Require encoder policy and shared VisionIPC ownership checks
      run: 'set -o pipefail

        mkdir -p "$RUNNER_TEMP/encoder-native"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo test --manifest-path rust/Cargo.toml -p openpilot-encoderd -p openpilot-msgq --features openpilot-encoderd/native
        --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/encoder-native/package-tests.log"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-encoderd --features native --all-targets --locked -- -D
        warnings

        '
    - name: Build native encoder and record current JPEG and messaging outputs
      run: 'mkdir -p "$RUNNER_TEMP/encoder-native"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024

        set -o pipefail

        cargo build --manifest-path rust/Cargo.toml -p openpilot-encoderd --features native --bins --examples --locked --message-format=json
        2> "$RUNNER_TEMP/encoder-native/build.log" | tee "$RUNNER_TEMP/encoder-native/build.jsonl"

        '
    - name: Build current native dependency stager
      uses: ./.github/actions/native-json11
    - name: Build the current native encoder source builder
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features encoder-runtime-native --test encoder_codecs_check
        --test encoder_v4l_check --test encoder_target_check --test encoder_source_build --test encoder_runtime_wire --test
        encoder_runtime_exercise --test encoder_runtime_check --test encoder_runtime_close --test encoder_runtime_shutdown
        --locked

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features encoder-runtime-native --bin check-encoder-codecs
        --bin check-encoder-v4l --bin check-encoder-target --bin check-encoder-runtime --bin check-encoder-ci --bin build-encoder-source
        --test encoder_codecs_check --test encoder_v4l_check --test encoder_target_check --test encoder_source_build --test
        encoder_runtime_wire --test encoder_runtime_exercise --test encoder_runtime_check --test encoder_runtime_close --test
        encoder_runtime_shutdown --test encoder_runtime_native --test encoder_ci_check --test encoder_runtime_ci --locked
        -- -D warnings

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features encoder-runtime-native --bin build-encoder-source
        --bin check-encoder-codecs --bin check-encoder-v4l --bin check-encoder-target --bin check-encoder-runtime --bin check-encoder-ci
        --locked

        '
    - name: Require all source codec, V4L and actual encoder runtime comparisons
      run: rust/target/debug/check-encoder-ci --json11-stager "$JSON11_STAGER" --binaries rust/target/debug --build-messages
        "$RUNNER_TEMP/encoder-native/build.jsonl" --output "$RUNNER_TEMP/encoder-native/oracles"
    - name: Preserve encoder inputs, packets, diagnostics and executable evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rust-encoder-runtime-evidence
        path: '${{ runner.temp }}/encoder-native/

          rust/target/debug/openpilot-encoderd

          rust/target/debug/examples/encoder_codec_trace

          rust/target/debug/examples/encoder_v4l_trace

          '
        if-no-files-found: warn
