{
  "name": "296 maintained AST caller and private two-source absence",
  "on": {
    "push": {
      "branches": [
        "codex/feat-296-local-validation"
      ],
      "paths": [
        ".github/workflows/changed-files-caller-296-once.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "changed-files-caller-296",
    "cancel-in-progress": false,
    "queue": "max"
  },
  "jobs": {
    "caller": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "dev-md-local"
      ],
      "timeout-minutes": 65,
      "env": {
        "EXPECTED_SOURCE": "f01ced15baba7c4d155780a7202e4634e44b8774",
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "PYTHONDONTWRITEBYTECODE": "1",
        "GIT_LFS_SKIP_SMUDGE": "1",
        "RUST_BACKTRACE": "1",
        "CALLER_AUDITOR_SHA256": "a18b1bc9f3aa64cf638e535e87077dbd93221adc92ad9ad79dfab35ac21227bf"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Deny fork source and require registered local runner",
          "env": {
            "SOURCE_ALLOWED": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
          },
          "run": "test \"${SOURCE_ALLOWED:-}\" = true || { echo 'Fork PR source denied on persistent bin-actions' >&2; exit 1; }\nset -euo pipefail\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n"
        },
        {
          "name": "Allocate owned paths and record actual runner/operation growth",
          "run": "set -euo pipefail\numask 077\n[[ $RUNNER_NAME == bin-actions && $RUNNER_ENVIRONMENT == self-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]\n[[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $GITHUB_REF == refs/heads/codex/feat-296-local-validation ]]\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${GCONV_PATH:-} && -z ${GCONV_MODULES_CACHE:-} ]]\nAST_JOB=$(mktemp -d \"$RUNNER_TEMP/ast-caller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX\")\nAST_WORK=\"$GITHUB_WORKSPACE/ast-caller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\n[[ ! -e $AST_WORK && ! -L $AST_WORK ]]\nmkdir \"$AST_WORK\"\nfor ast_dir in evidence tools tools-cache tmp cargo rustup cache home config pip-cache; do mkdir \"$AST_JOB/$ast_dir\"; done\nprintf '%s:%s\\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > \"$AST_JOB/.ast-owner\"\ncp \"$AST_JOB/.ast-owner\" \"$AST_WORK/.ast-owner\"\nAST_RUSTUP=$(command -v rustup || true)\nif [[ -z $AST_RUSTUP ]]; then AST_RUSTUP=\"$HOME/.cargo/bin/rustup\"; fi\n[[ -x $AST_RUSTUP ]]\n{\n printf 'AST_JOB=%s\\nAST_WORK=%s\\nAST_SOURCE=%s/source\\nAST_RUSTUP=%s\\nAST_PUBLIC=%s/public\\n' \"$AST_JOB\" \"$AST_WORK\" \"$AST_WORK\" \"$AST_RUSTUP\" \"$AST_JOB\"\n printf 'CARGO_HOME=%s/cargo\\nCARGO_TARGET_DIR=%s/target\\nRUSTUP_HOME=%s/rustup\\nHOME=%s/home\\n' \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\"\n printf 'TMPDIR=%s/tmp\\nXDG_CACHE_HOME=%s/cache\\nXDG_CONFIG_HOME=%s/config\\nPIP_CACHE_DIR=%s/pip-cache\\nGIT_CONFIG_GLOBAL=%s/gitconfig\\nGIT_CONFIG_NOSYSTEM=1\\n' \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\"\n printf 'AST_JOB_ID=%s\\nAST_WORK_ID=%s\\n' \"$(stat -c '%d:%i:%u' \"$AST_JOB\")\" \"$(stat -c '%d:%i:%u' \"$AST_WORK\")\"\n} >> \"$GITHUB_ENV\"\n{\n printf 'runner=%s\\nexpected_runner_id=22\\nlabels=self-hosted,Linux,X64,dev-md-local\\n' \"$RUNNER_NAME\"\n uname -a\n cat /etc/os-release /proc/meminfo /proc/self/status\n lscpu --json\n df -B1 -T \"$AST_JOB\" \"$AST_WORK\"\n for p in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do\n  if [[ -r $p ]]; then printf '%s\\n' \"$p\"; cat \"$p\"; fi\n done\n sha256sum \"$AST_RUSTUP\"\n} > \"$AST_JOB/evidence/runner-bootstrap.txt\"\n# Operation growth only: fresh toolchain/registry/target + two isolated source\n# copies and bounded diagnostics. No machine free-space reserve/resume floor.\nast_free=$(df -B1 --output=avail \"$AST_JOB\" | tail -n1)\nast_source_free=$(df -B1 --output=avail \"$AST_WORK\" | tail -n1)\nif [[ $(stat -c %d \"$AST_JOB\") == $(stat -c %d \"$AST_WORK\") ]]; then\n [[ $ast_free -ge $((14*1024*1024*1024)) ]]\nelse\n [[ $ast_free -ge $((12*1024*1024*1024)) && $ast_source_free -ge $((2*1024*1024*1024)) ]]\nfi\nprintf 'temp_growth_mib=12288\\nsource_growth_mib=2048\\nfixed_reserve_mib=0\\n' > \"$AST_JOB/evidence/operation-growth.txt\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "f01ced15baba7c4d155780a7202e4634e44b8774",
            "path": "ast-caller-${{ github.run_id }}-${{ github.run_attempt }}/source",
            "fetch-depth": 0,
            "persist-credentials": false,
            "set-safe-directory": false,
            "clean": false,
            "lfs": false
          },
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "id": "metadata_python",
          "uses": "actions/setup-python@v6",
          "env": {
            "RUNNER_TOOL_CACHE": "${{ env.AST_JOB }}/tools-cache",
            "AGENT_TOOLSDIRECTORY": "${{ env.AST_JOB }}/tools-cache"
          },
          "with": {
            "python-version": "3.12.15"
          },
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Prepare owned copy-mode metadata interpreter and close native loader environment",
          "env": {
            "AST_SETUP_PYTHON": "${{ steps.metadata_python.outputs.python-path }}"
          },
          "run": "set -euo pipefail\ncd \"$AST_SOURCE\"\n[[ $(git rev-parse HEAD) == \"$EXPECTED_SOURCE\" && -z $(git status --porcelain=v1 --untracked-files=all) ]]\n[[ -z ${LD_PRELOAD:-} && -z ${GCONV_PATH:-} && -z ${GCONV_MODULES_CACHE:-} ]]\n# setup-python output names the interpreter file, not the bin directory.\nast_base=$(dirname \"$(dirname \"$(realpath \"$AST_SETUP_PYTHON\")\")\")\ncase \"$ast_base\" in \"$AST_JOB\"/tools-cache/Python/3.12.15/*) ;; *) exit 2 ;; esac\n[[ -z ${LD_LIBRARY_PATH:-} || $LD_LIBRARY_PATH == \"$ast_base/lib\" ]]\n\"$AST_SETUP_PYTHON\" -I -B -m venv --copies \"$AST_JOB/venv\"\n\"$AST_JOB/venv/bin/python\" -I -B -m pip install --disable-pip-version-check PyYAML==6.0.2 > \"$AST_JOB/evidence/metadata-packages.log\" 2>&1\n\"$AST_JOB/venv/bin/python\" -I -B -VV > \"$AST_JOB/evidence/python.txt\"\n{\n printf 'AST_METADATA_PYTHON=%s/venv/bin/python\\nAST_METADATA_LIBRARY=%s/lib\\nAST_METADATA_LAUNCHER=%s/tools/metadata-python.sh\\n' \"$AST_JOB\" \"$ast_base\" \"$AST_JOB\"\n printf 'AST_BASE=%s/evidence\\nCALLER_TOOLS=%s/tools\\nACCEPTED_GATES=%s/tools/accepted-gates.json\\nSTRICT_EXEC_AUDIT=%s/tools/strict_exec_audit.py\\n' \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\" \"$AST_JOB\"\n printf 'LD_LIBRARY_PATH=\\n'\n} >> \"$GITHUB_ENV\"\nprintf 'setup_python=%s\\nprivate_base=%s\\nsetup_LD_LIBRARY_PATH=%s\\nsubsequent_native_LD_LIBRARY_PATH=empty\\nvenv_mode=copies\\n' \"$AST_SETUP_PYTHON\" \"$ast_base\" \"${LD_LIBRARY_PATH:-}\" > \"$AST_JOB/evidence/metadata-loader-boundary.txt\"\nprintf 'workflow_head=%s\\nsource_commit=%s\\n' \"$GITHUB_SHA\" \"$EXPECTED_SOURCE\" > \"$AST_JOB/evidence/source.txt\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Require existing native prerequisites and isolated toolchain",
          "run": "set -euo pipefail\n[[ -z ${LD_PRELOAD:-} && -z ${LD_LIBRARY_PATH:-} && -z ${GCONV_PATH:-} && -z ${GCONV_MODULES_CACHE:-} ]]\nfor tool in git gh capnp pkg-config c++ strace ldd timeout gzip; do command -v \"$tool\"; done > \"$AST_JOB/evidence/prerequisites.txt\"\npkg-config --exists capnp\npkg-config --exists libzmq\nprintf '%s\n' \"$(dirname \"$AST_RUSTUP\")\" >> \"$GITHUB_PATH\"\n\"$AST_RUSTUP\" toolchain install 1.94.0 --profile minimal --component clippy > \"$AST_JOB/evidence/rustup.stdout\" 2> \"$AST_JOB/evidence/rustup.stderr\"\n\"$AST_RUSTUP\" run 1.94.0 rustc -Vv > \"$AST_JOB/evidence/rustc.txt\"\nstrace -V > \"$AST_JOB/evidence/strace.txt\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed caller_gate.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/caller_gate.py\"\nprintf '%s  %s\\n' 'a18b1bc9f3aa64cf638e535e87077dbd93221adc92ad9ad79dfab35ac21227bf' \"$AST_JOB/tools/caller_gate.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed strict_exec_audit.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/strict_exec_audit.py\"\nprintf '%s  %s\\n' '7b90fd3163ba0c97fed5dbf7f53a2af1b2857e21b7fda99771651914a24d5c5b' \"$AST_JOB/tools/strict_exec_audit.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed runtime_audit.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/runtime_audit.py\"\nprintf '%s  %s\\n' 'bcb7c8d968428076a1d5c1f50ddaed80c8568f4224929652d621c66afe95fd2a' \"$AST_JOB/tools/runtime_audit.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed postdelete-hosted.sh",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/postdelete-hosted.sh\"\nprintf '%s  %s\\n' '0f24db59ef4326def78128895d73dd24d548b8b8b4bf4e0b25be80c5520d5b85' \"$AST_JOB/tools/postdelete-hosted.sh\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed runner-resources.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/runner-resources.py\"\nprintf '%s  %s\\n' '51e2bf798f4d7fbacdc4188183f6d6184e2fb7a8566658e849354e87361b8670' \"$AST_JOB/tools/runner-resources.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed pack_evidence.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/pack_evidence.py\"\nprintf '%s  %s\\n' '561b854713eb12751cb13e4aa19ac90528e884418235424ea8d45f3eea6429bf' \"$AST_JOB/tools/pack_evidence.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed published_absence.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/published_absence.py\"\nprintf '%s  %s\\n' '41ef4e997450897ff83d2ac50108fc07c2842ffacd56ac995a2af5a9166c00a6' \"$AST_JOB/tools/published_absence.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed metadata-python.sh",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/metadata-python.sh\"\nprintf '%s  %s\\n' '0eaf806b00f397443e3ff907c86589f11192660b6edb4b4af80b2fe2172491d6' \"$AST_JOB/tools/metadata-python.sh\" | sha256sum --check --strict\nchmod 700 \"$AST_JOB/tools/metadata-python.sh\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed metadata-entry.py",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/metadata-entry.py\"\nprintf '%s  %s\\n' 'f4317cc95ce7150fe929d17d4b6dea32e69633c4d94fcb62dcba116aa3ae8f1a' \"$AST_JOB/tools/metadata-entry.py\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed metadata-targets.json",
          "run": "set -euo pipefail\nprintf '%s' '' | base64 --decode | gzip -dc > \"$AST_JOB/tools/metadata-targets.json\"\nprintf '%s  %s\\n' '81c70b95dcab59796531cff9747d67b0018ce239c787b5b1366213079ad003bf' \"$AST_JOB/tools/metadata-targets.json\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed chunk accepted-gates.json 0",
          "run": "set -euo pipefail\nprintf '%s' '' > \"$AST_JOB/tools/accepted-gates.json.part.0\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed chunk accepted-gates.json 1",
          "run": "set -euo pipefail\nprintf '%s' '' > \"$AST_JOB/tools/accepted-gates.json.part.1\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Stage sealed chunk accepted-gates.json 2",
          "run": "set -euo pipefail\nprintf '%s' '' > \"$AST_JOB/tools/accepted-gates.json.part.2\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Assemble sealed accepted-gates.json",
          "run": "set -euo pipefail\ncat \"$AST_JOB/tools/accepted-gates.json.part.0\" \"$AST_JOB/tools/accepted-gates.json.part.1\" \"$AST_JOB/tools/accepted-gates.json.part.2\" | base64 --decode | gzip -dc > \"$AST_JOB/tools/accepted-gates.json\"\nprintf '%s  %s\\n' '52e8d27ba4edb8c23fbd73ea17c13a1f8e307214c86ba6b17d97713849571955' \"$AST_JOB/tools/accepted-gates.json\" | sha256sum --check --strict\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
        },
        {
          "name": "Record current build resources and execute only fresh caller/private-absence qualification",
          "timeout-minutes": 45,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\ncd \"$AST_SOURCE\"\ncp \"$AST_JOB/tools/accepted-gates.json\" \"$AST_JOB/evidence/accepted-gates.json\"\n\"$AST_JOB/tools/metadata-python.sh\" \"$AST_JOB/tools/runner-resources.py\" pre-build 10737418240\nexport CARGO_BUILD_JOBS\nCARGO_BUILD_JOBS=$(cat \"$AST_JOB/evidence/build-jobs.txt\")\nexport GITHUB_WORKSPACE=\"$AST_SOURCE\"\nstatus=0\nbash \"$AST_JOB/tools/postdelete-hosted.sh\" > \"$AST_JOB/evidence/gate.stdout\" 2> \"$AST_JOB/evidence/gate.stderr\" || status=$?\nprintf '%s\n' \"$status\" > \"$AST_JOB/evidence/gate.status\"\ntail -n 80 \"$AST_JOB/evidence/gate.stderr\"\n\"$AST_JOB/tools/metadata-python.sh\" \"$AST_JOB/tools/runner-resources.py\" finished 0\nexit \"$status\"\n",
          "if": "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",
          "id": "caller_qualification"
        },
        {
          "id": "pack",
          "name": "Always seal bounded inert diagnostics after confirmed native quiescence",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()) }}",
          "timeout-minutes": 5,
          "run": "set -euo pipefail\nast_pack_status=0\nif [[ -n ${AST_JOB:-} && -x $AST_JOB/tools/metadata-python.sh && -f $AST_JOB/tools/metadata-targets.json && -n ${AST_METADATA_PYTHON:-} ]]; then\n \"$AST_JOB/tools/metadata-python.sh\" \"$AST_JOB/tools/pack_evidence.py\" || ast_pack_status=$?\nelse\n ast_pack_status=1\nfi\nif (( ast_pack_status != 0 )) && [[ -z ${AST_JOB:-} || ! -d $AST_JOB/public ]]; then\n ast_fallback=$(mktemp -d \"$RUNNER_TEMP/ast-caller-fallback.XXXXXXXX\")\n printf 'AST_PUBLIC=%s\n' \"$ast_fallback\" >> \"$GITHUB_ENV\"\n printf '{\"passed\":false,\"pack_status\":%s,\"raw_owned_namespace_retained\":true,\"native_namespace_snapshot\":false}\n' \"$ast_pack_status\" > \"$ast_fallback/packaging-status.json\"\n # Only closed pre-native metadata receipts, never live traces/namespaces.\n for ast_name in runner-bootstrap.txt operation-growth.txt metadata-loader-boundary.txt source.txt; do\n  ast_receipt=${AST_JOB:-/nonexistent}/evidence/$ast_name\n  if [[ -f $ast_receipt && ! -L $ast_receipt && $(stat -c %s \"$ast_receipt\") -le 1048576 ]]; then cp -- \"$ast_receipt\" \"$ast_fallback/$ast_name\"; fi\n done\nfi\nexit \"$ast_pack_status\"\n"
        },
        {
          "id": "upload",
          "uses": "actions/upload-artifact@v6",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()) }}",
          "with": {
            "name": "changed-files-caller-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.AST_PUBLIC }}",
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "retention-days": 30
          }
        },
        {
          "name": "Clean only confirmed owned paths after sealed upload receipt",
          "if": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (always()) }}",
          "env": {
            "AST_PACK_OUTCOME": "${{ steps.pack.outcome }}",
            "AST_UPLOAD_OUTCOME": "${{ steps.upload.outcome }}",
            "AST_UPLOAD_ID": "${{ steps.upload.outputs.artifact-id }}",
            "AST_UPLOAD_DIGEST": "${{ steps.upload.outputs.artifact-digest }}",
            "AST_QUALIFICATION_OUTCOME": "${{ steps.caller_qualification.outcome }}"
          },
          "run": "set -euo pipefail\n[[ ${AST_QUALIFICATION_OUTCOME:-} == success ]] || exit 0\n# Skip destructive work unless the complete upload succeeded. All paths owned\n# by this job; active-native marker additionally blocks deletion after a failure.\n[[ ${AST_UPLOAD_OUTCOME:-} == success && ${AST_PACK_OUTCOME:-} == success ]] || exit 0\n[[ ${AST_UPLOAD_ID:-} =~ ^[0-9]+$ && ${AST_UPLOAD_DIGEST:-} =~ ^(sha256:)?[0-9a-f]{64}$ ]]\n[[ -n ${AST_JOB:-} && -n ${AST_WORK:-} ]] || exit 0\n[[ ! -e $AST_JOB/active-native.json ]]\ncase \"$AST_JOB\" in \"$RUNNER_TEMP\"/ast-caller-\"$GITHUB_RUN_ID\"-\"$GITHUB_RUN_ATTEMPT\".*) ;; *) exit 2 ;; esac\n[[ $AST_WORK == \"$GITHUB_WORKSPACE/ast-caller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" ]]\n[[ ! -L $AST_JOB && ! -L $AST_WORK ]]\n[[ $(cat \"$AST_JOB/.ast-owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT\" ]]\n[[ $(cat \"$AST_WORK/.ast-owner\") == \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT\" ]]\n[[ $(stat -c '%d:%i:%u' \"$AST_JOB\") == \"$AST_JOB_ID\" && $(stat -c '%d:%i:%u' \"$AST_WORK\") == \"$AST_WORK_ID\" ]]\n[[ $(stat -c %u \"$AST_JOB\") == \"$(id -u)\" && $(stat -c %u \"$AST_WORK\") == \"$(id -u)\" ]]\nrm -rf -- \"$AST_WORK\" \"$AST_JOB\"\n"
        }
      ]
    }
  }
}
