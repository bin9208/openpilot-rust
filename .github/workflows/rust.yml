  telemetry-runtime:
    name: rust telemetry runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq5
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 sentry-sdk==2.55.0 zstandard==0.25.0
      - name: Configure original telemetry IPC imports
        run: printf 'PYTHONPATH=%s/telemetry-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build telemetry daemons and source-comparison probes
        run: |
          rustc --version
          cargo --version
          cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools -p openpilot-runtime-version -p openpilot-beepd -p openpilot-statsd -p openpilot-tombstoned -p openpilot-logmessaged --bins --examples --locked
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build original telemetry message and Params bindings
        run: |
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/telemetry-msgq-python"
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/telemetry-params-binding"
      - name: Compare cached Git metadata and actual collector delivery
        run: |
          VERSION_EVIDENCE="$RUNNER_TEMP/telemetry-runtime/version-reference" python rust/tools/check_version_reference.py rust/target/debug/examples/version_trace
          python rust/tools/check_version_collector.py rust/target/debug/examples/version_trace rust/target/debug/openpilot-logmessaged "$RUNNER_TEMP/telemetry-runtime/version-collector"
      - name: Check source fixture worker error reporting
        run: python -m unittest discover -s rust/tools/tests -p test_beep_worker_report.py -v
      - name: Compare alert policy, Params failures and clock conversion
        run: |
          python rust/tools/check_beepd_reference.py --binary rust/target/debug/examples/beep_trace --binding "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so --output "$RUNNER_TEMP/telemetry-runtime/beep-reference"
          rust/target/debug/build-beep-integer-reference --output "$RUNNER_TEMP/telemetry-integer-reference"
          rust/target/debug/check-beep-integer --binary rust/target/debug/examples/beep_trace --reference "$RUNNER_TEMP/telemetry-integer-reference/beep-integer-reference" --output "$RUNNER_TEMP/telemetry-runtime/beep-integer"
          rust/target/debug/check-beep-clock --binary rust/target/debug/examples/beep_trace --output "$RUNNER_TEMP/telemetry-runtime/beep-clock"
          rust/target/debug/check-beep-sleep --binary rust/target/debug/examples/beep_trace --output "$RUNNER_TEMP/telemetry-runtime/beep-sleep"
      - name: Compare continuous alert IPC and owned worker shutdown
        run: python rust/tools/check_beepd_daemon.py --binary rust/target/debug/openpilot-beepd --binding "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so --output "$RUNNER_TEMP/telemetry-runtime/beep-daemon"
      - name: Compare statistics numeric, clock and producer contracts
        run: |
          rust/target/debug/check-stats-numbers --binary rust/target/debug/examples/stats_trace --output "$RUNNER_TEMP/telemetry-runtime/stats-numbers.json"
          rust/target/debug/check-stats-clock rust/target/debug/examples/stats_clock "$RUNNER_TEMP/telemetry-runtime/stats-clock.json"
          python rust/tools/check_stats_producer.py rust/target/debug/examples "$RUNNER_TEMP/telemetry-runtime/stats-producer"
      - name: Compare continuous statistics, real Params and collector failure paths
        run: |
          python rust/tools/check_stats_daemon.py rust/target/debug "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so "$RUNNER_TEMP/telemetry-runtime/stats-daemon"
          python rust/tools/check_stats_failures.py rust/target/debug "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so "$RUNNER_TEMP/telemetry-runtime/stats-failures"
          python rust/tools/check_stats_log_fault.py rust/target/debug "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so "$RUNNER_TEMP/telemetry-runtime/stats-log-fault"
      - name: Exercise statistics production startup and shutdown under sustained traffic
        run: |
          python rust/tools/check_stats_runtime.py rust/target/debug "$RUNNER_TEMP/telemetry-runtime/stats-runtime"
          python rust/tools/check_stats_flood.py rust/target/debug "$RUNNER_TEMP/telemetry-runtime/stats-flood"
      - name: Compare interrupted metric receives with the original daemon
        run: |
          fault_root="$RUNNER_TEMP/telemetry-runtime/stats-receive-boundary"
