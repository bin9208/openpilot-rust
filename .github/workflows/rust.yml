          python rust/tools/check_tombstoned_safety.py rust/target/debug/examples/tombstone_trace "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so "$RUNNER_TEMP/telemetry-runtime/tombstone-safety"
          python rust/tools/check_crash_sdk_transport.py rust/target/debug/examples/tombstone_trace "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so "$RUNNER_TEMP/telemetry-runtime/crash-sdk"
