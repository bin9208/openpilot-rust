          python rust/tools/check_tombstoned_shutdown.py rust/target/debug/openpilot-tombstoned "$RUNNER_TEMP"/telemetry-params-binding/params_pyx*.so "$RUNNER_TEMP/telemetry-runtime/tombstone-shutdown"
