          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          cargo +1.94.0 run --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" -p openpilot-dev-tools --locked --bin stage-startup-ui-raylib -- --arch x86_64 --output "$RUNNER_TEMP/ui-native/raylib" --shared
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/ui-native/raylib\nSTARTUP_UI_RAYLIB_LIBRARY=%s/ui-native/raylib/lib/libopenpilot-raylib.so\nUI_MSGQ_PYTHON=%s/ui-native/python\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/ui-native/python"
      - name: Check native application and shared UI packages
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 5120
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-ui-application -p openpilot-ui-framework -p openpilot-startup-ui --all-targets --locked -- -D warnings
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          cargo build --manifest-path rust/Cargo.toml -p openpilot-process-supervision -p openpilot-dev-tools --bin openpilot-process-child --bin check-ui-updater-handshake --bin check-ui-model-adapter --bin check-ui-training-adapter --bin check-ui-native-safety --bin check-ui-native-resources --bin check-ui-qr --bin check-ui-torque-geometry --bin check-ui-state --bin check-ui-scheduler --bin check-ui-plot-samples --bin plot-samples-reference --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --test plot_samples_source --test plot_samples_check --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-ui-application -p openpilot-ui-framework -p openpilot-startup-ui -p openpilot-params -p openpilot-hardware-info -p openpilot-msgq --lib --tests --locked --message-format=json | tee "$RUNNER_TEMP/ui-native/unit-tests.jsonl"
      - name: Require queued exec error after helper exit
