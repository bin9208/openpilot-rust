      - name: Install source-pinned Eigen headers
        run: |
          python -m pip install 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
          python -c 'import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR)' >> "$GITHUB_ENV"
      - name: Build native estimators and unchanged source oracle
        run: |
          mkdir -p "$RUNNER_TEMP/estimation/lagd"
          python rust/tools/build_locationd_oracle.py --output "$RUNNER_TEMP/locationd-oracle" --eigen-include "$LOCATIOND_EIGEN_INCLUDE"
          python rust/tools/build_paramsd_oracle.py --output "$RUNNER_TEMP/paramsd-oracle" --eigen-include "$PARAMSD_EIGEN_INCLUDE" --reuse-wrapper "$RUNNER_TEMP/locationd-oracle"/ekf_sym_pyx*.so
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/estimation-params-binding"
          cargo build --manifest-path rust/Cargo.toml -p openpilot-locationd -p openpilot-lagd -p openpilot-paramsd --bins --examples --locked
      - name: Compare location model, complete source loop, timestamps and native IPC
        run: |
          python rust/tools/check_locationd.py --oracle "$RUNNER_TEMP/locationd-oracle" --trace "$PWD/rust/target/debug/examples/location_trace" --evidence "$RUNNER_TEMP/estimation/locationd/estimator"
          python rust/tools/check_locationd_loop.py --oracle "$RUNNER_TEMP/locationd-oracle" --trace "$PWD/rust/target/debug/examples/location_loop" --evidence "$RUNNER_TEMP/estimation/locationd/loop"
          python rust/tools/check_locationd_timestamp.py --oracle "$RUNNER_TEMP/locationd-oracle" --trace "$PWD/rust/target/debug/examples/location_trace" --evidence "$RUNNER_TEMP/estimation/locationd/timestamp"
          python rust/tools/check_locationd_daemon.py --oracle "$RUNNER_TEMP/locationd-oracle" --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/estimation/locationd/daemon"
          python rust/tools/check_locationd_startup.py --oracle "$RUNNER_TEMP/locationd-oracle" --binding "$RUNNER_TEMP/estimation-params-binding"/params_pyx*.so --binary "$PWD/rust/target/debug/openpilot-locationd" --output "$RUNNER_TEMP/estimation/locationd/startup"
      - name: Compare vehicle model, source main loop, cache migration and native IPC
        run: |
          python rust/tools/check_paramsd.py --oracle "$RUNNER_TEMP/paramsd-oracle" --trace "$PWD/rust/target/debug/examples/paramsd_trace" --evidence "$RUNNER_TEMP/estimation/paramsd/estimator"
          python rust/tools/check_paramsd_loop.py --oracle "$RUNNER_TEMP/paramsd-oracle" --trace "$PWD/rust/target/debug/examples/paramsd_loop" --evidence "$RUNNER_TEMP/estimation/paramsd/loop"
          python rust/tools/check_paramsd_daemon.py --oracle "$RUNNER_TEMP/paramsd-oracle" --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/estimation/paramsd/daemon"
          python rust/tools/check_paramsd_startup.py --binary "$PWD/rust/target/debug/openpilot-paramsd" --evidence "$RUNNER_TEMP/estimation/paramsd/startup"
      - name: Compare delay numerical policy, full source loop, cache and native IPC
        run: |
          python rust/tools/check_lagd_numeric.py "$PWD/rust/target/debug/examples/lag_numeric" "$RUNNER_TEMP/estimation/lagd/numeric.json"
          python rust/tools/check_lagd_loop.py "$PWD/rust/target/debug/examples/lag_loop" "$RUNNER_TEMP/estimation/lagd/loop"
          python rust/tools/check_lagd_cache.py "$PWD/rust/target/debug/examples/lag_cache" "$RUNNER_TEMP/estimation/lagd/cache.json"
          python rust/tools/check_lagd_packet.py "$PWD/rust/target/debug/examples/lag_packet" "$RUNNER_TEMP/estimation/lagd/packet.json"
          python rust/tools/check_lagd_daemon.py "$PWD/rust/target/debug/openpilot-lagd" "$PWD/rust/target/debug/examples/lag_ipc_peer" "$RUNNER_TEMP/estimation/lagd/daemon"
          python rust/tools/check_lagd_params_io.py "$PWD/rust/target/debug/openpilot-lagd" "$RUNNER_TEMP/estimation/lagd/params-io.json"
      - name: Check production numerical ownership and native memory boundaries
        run: |
          cargo test --manifest-path rust/Cargo.toml -p openpilot-locationd -p openpilot-lagd -p openpilot-paramsd -p openpilot-pocketfft --locked
          python rust/tools/check_locationd_native.py --evidence "$RUNNER_TEMP/estimation/locationd/native"
          python rust/tools/check_paramsd_native.py --evidence "$RUNNER_TEMP/estimation/paramsd/native"
          clang++ -std=c++17 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-omit-frame-pointer rust/crates/pocketfft/native/kernel_test.cc -o "$RUNNER_TEMP/estimation/lagd/pocketfft-sanitized"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/estimation/lagd/pocketfft-sanitized" > "$RUNNER_TEMP/estimation/lagd/pocketfft-sanitizer.log" 2>&1
      - name: Retain estimator source and native evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-estimation-evidence
          path: |
            ${{ runner.temp }}/estimation/
            ${{ runner.temp }}/locationd-oracle/build.log
            ${{ runner.temp }}/paramsd-oracle/build.log
  ui-connectivity:
    name: rust UI and connectivity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev libgl-dev libx11-dev libxrandr2 libxinerama1 libxcursor1 libxi6 xvfb xauth ffmpeg dbus-daemon
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 cffi==2.1.1 pillow==12.3.0 python-xlib==0.33 jeepney==0.9.0 comma-deps-raylib==6.0.0.1.post103 setproctitle==1.3.7 psutil==7.2.2 zstandard==0.25.0 requests==2.34.2 pyserial==3.5
      - name: Stage source-pinned native renderer
        run: |
          python rust/tools/stage_startup_ui_raylib.py --arch x86_64 --output "$RUNNER_TEMP/ui-raylib" --shared
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/ui-raylib\nSTARTUP_UI_RAYLIB_LIBRARY=%s/ui-raylib/lib/libopenpilot-raylib.so\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build native UI and connectivity with original Params oracle
        run: |
          cargo build --manifest-path rust/Cargo.toml -p openpilot-ui-framework -p openpilot-startup-ui -p openpilot-wifi -p openpilot-cweb-push -p openpilot-process-supervision --bins --examples --locked
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/ui-params-binding"
      - name: Compare shared UI state, pixels, real input and native lifecycle
        run: |
          xvfb-run -a -s '-screen 0 2160x1080x24' bash -euc '
            python rust/tools/check_ui_framework.py --target "$PWD/rust/target/debug" --output "$RUNNER_TEMP/ui-connectivity/framework" --display "$DISPLAY"
            python rust/tools/check_startup_ui.py --target "$PWD/rust/target/debug" --output "$RUNNER_TEMP/ui-connectivity/startup" --display "$DISPLAY" --raylib-root "$STARTUP_UI_RAYLIB_ROOT" --raylib-library "$STARTUP_UI_RAYLIB_LIBRARY"
          '
          python rust/tools/check_ui_emoji.py --binary "$PWD/rust/target/debug/examples/emoji_raster" --output "$RUNNER_TEMP/ui-connectivity/emoji"
          python rust/tools/check_ui_translations.py --binary "$PWD/rust/target/debug/examples/translation_trace" --output "$RUNNER_TEMP/ui-connectivity/translations"
      - name: Compare Wi-Fi policy and original/native private NetworkManager protocol
        run: |
          python rust/tools/check_wifi_policy.py --binary "$PWD/rust/target/debug/examples/wifi_trace" --output "$RUNNER_TEMP/ui-connectivity/wifi-policy.json"
          python rust/tools/check_wifi_runtime.py --binary "$PWD/rust/target/debug/examples/wifi_native" --launcher "$PWD/rust/target/debug/openpilot-process-child" --binding "$RUNNER_TEMP/ui-params-binding"/params_pyx*.so --output "$RUNNER_TEMP/ui-connectivity/wifi"
      - name: Compare discovery policy, HTTP, continuous process and address ABI
        run: |
          python rust/tools/check_cweb_policy.py --binary "$PWD/rust/target/debug/examples/cweb_trace" --output "$RUNNER_TEMP/ui-connectivity/cweb/policy"
          python rust/tools/check_cweb_http.py --binary "$PWD/rust/target/debug/examples/cweb_http" --output "$RUNNER_TEMP/ui-connectivity/cweb/http"
          python rust/tools/check_cweb_daemon.py --binary "$PWD/rust/target/debug/openpilot-cweb-push" --binding "$RUNNER_TEMP/ui-params-binding"/params_pyx*.so --output "$RUNNER_TEMP/ui-connectivity/cweb/daemon"
          python rust/tools/check_cweb_address.py --binary "$PWD/rust/target/debug/examples/cweb_address" --output "$RUNNER_TEMP/ui-connectivity/cweb/address"
      - name: Retain source/native images and connectivity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-ui-connectivity-evidence
          path: |
            ${{ runner.temp }}/ui-connectivity/
            ${{ runner.temp }}/ui-params-binding/provenance.json
            ${{ runner.temp }}/ui-raylib/SOURCE_SHA256
            ${{ runner.temp }}/ui-raylib/plugin-build.json
  platform-runtime:
    name: rust platform runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev libzstd-dev libzmq5
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0 requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1
      - name: Configure original platform IPC imports
        run: printf 'PYTHONPATH=%s/platform-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build native manager and serial daemon boundaries
        run: cargo build --manifest-path rust/Cargo.toml -p openpilot-manager -p openpilot-modem -p openpilot-hardwared -p openpilot-process-supervision --bins --examples --locked
      - name: Build original platform IPC and Params bindings
        run: |
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/platform-msgq-python"
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/platform-params-binding"
      - name: Compare manager initialization, transitions and lifecycle logging
        run: |
          python rust/tools/check_manager.py rust/target/debug/examples/manager_trace "$RUNNER_TEMP"/platform-params-binding/params_pyx*.so "$RUNNER_TEMP/platform-runtime/manager"
          python rust/tools/check_manager_logging.py rust/target/debug/examples/manager_trace "$RUNNER_TEMP"/platform-params-binding/params_pyx*.so "$RUNNER_TEMP/platform-runtime/manager-logging"
          python rust/tools/generate_manager_cars.py rust/crates/manager/data/cars --check --binding "$RUNNER_TEMP"/platform-params-binding/params_pyx*.so
      - name: Exercise native manager IPC, owned children and boot composition
        run: |
          rust/target/debug/examples/manager_native "$RUNNER_TEMP/platform-runtime/manager-native" "$PWD/rust/target/debug/openpilot-process-child"
          rust/target/debug/examples/manager_adapters "$RUNNER_TEMP/platform-runtime/manager-adapters" "$PWD/rust/target/debug/openpilot-process-child"
      - name: Compare serial modem state and continuous native reconnect lifecycle
        run: |
          python rust/tools/check_modem_process_boundary.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/platform-runtime/modem-process"
          python rust/tools/check_modem.py --binary "$PWD/rust/target/debug/openpilot-modem" --trace "$PWD/rust/target/debug/examples/modem_trace" --evidence "$RUNNER_TEMP/platform-runtime/modem"
      - name: Compare hardware policy and continuous native state publication
        run: |
          python rust/tools/check_hardwared.py rust/target/debug/examples/hardwared_trace "$RUNNER_TEMP/platform-runtime/hardwared-source"
          python rust/tools/check_hardwared_daemon.py --binary "$PWD/rust/target/debug/openpilot-hardwared" --output "$RUNNER_TEMP/platform-runtime/hardwared-ipc"
      - name: Retain platform source comparison and native runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-platform-runtime-evidence
          path: |
            ${{ runner.temp }}/platform-runtime/
            ${{ runner.temp }}/platform-params-binding/commands.json
            ${{ runner.temp }}/platform-params-binding/provenance.json
  hardware-runtime:
    name: rust hardware and boot runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev libzstd-dev libzmq5
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: rustup toolchain install nightly-2026-09-29 --profile minimal
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0 requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1
      - name: Build hardware libraries and boot executables
        run: cargo build --manifest-path rust/Cargo.toml -p openpilot-bootlog -p openpilot-hardware-info -p openpilot-hardware-control -p openpilot-amplifier -p openpilot-process-supervision --bins --examples --locked
      - name: Build original Params and boot log comparisons
        run: |
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/hardware-params-binding"
          python rust/tools/build_bootlog_native.py "$RUNNER_TEMP/hardware-runtime/original-bootlog"
          python rust/tools/build_bootlog_native.py "$RUNNER_TEMP/hardware-runtime/original-identifier" --identifier
          gcc -shared -fPIC -O1 -Wall -Wextra -Werror rust/tools/bootlog_output_fault.c -ldl -o "$RUNNER_TEMP/bootlog-output-fault.so"
          gcc -shared -fPIC -O1 -Wall -Wextra -Werror rust/tools/amplifier_i2c_fixture.c -ldl -o "$RUNNER_TEMP/amplifier-i2c-fixture.so"
      - name: Compare boot artifacts, upload selection and counter I/O
        run: |
          python rust/tools/check_bootlog.py rust/target/debug/openpilot-bootlog "$RUNNER_TEMP/hardware-runtime/original-bootlog/original-bootlog" \
            "$RUNNER_TEMP/hardware-runtime/bootlog" --fault-library "$RUNNER_TEMP/bootlog-output-fault.so"
          python rust/tools/check_logger_identifier.py rust/target/debug/examples/logger_identifier \
            "$RUNNER_TEMP/hardware-runtime/original-identifier/original-identifier" "$RUNNER_TEMP/hardware-runtime/identifiers"
          python rust/tools/check_bootlog_snapshot.py rust/target/debug/examples/bootlog_snapshot \
            "$RUNNER_TEMP"/hardware-params-binding/params_pyx*.so "$RUNNER_TEMP/hardware-runtime/snapshots" --launcher rust/target/debug/openpilot-process-child
      - name: Compare hardware observations and amplifier transactions
        run: |
          python rust/tools/check_hardware_info.py rust/target/debug/examples/hardware_info \
            "$RUNNER_TEMP"/hardware-params-binding/params_pyx*.so "$RUNNER_TEMP/hardware-runtime/information"
          python rust/tools/check_amplifier.py rust/target/debug/examples/amplifier_trace "$RUNNER_TEMP/hardware-runtime/amplifier-policy"
          python rust/tools/check_amplifier_linux.py rust/target/debug/examples/amplifier_linux \
            "$RUNNER_TEMP/amplifier-i2c-fixture.so" "$RUNNER_TEMP/hardware-runtime/amplifier-io"
          python rust/tools/check_hardware_control.py rust/target/debug/examples/hardware_control_trace "$RUNNER_TEMP/hardware-runtime/control-policy"
          rust/target/debug/examples/hardware_control_command rust/target/debug/openpilot-process-child \
            > "$RUNNER_TEMP/hardware-runtime/command.json" 2> "$RUNNER_TEMP/hardware-runtime/command.stderr"
          python -c 'import json,pathlib,sys; root=pathlib.Path(sys.argv[1]); assert json.loads((root/"command.json").read_text()) == {"status":7,"stdout_bytes":131072,"stdout_zero":True,"call_status":3,"shell_status":5,"missing_is_io":True}; assert (root/"command.stderr").read_text() == "inherited-stderr"' "$RUNNER_TEMP/hardware-runtime"
      - name: Exercise boot file ownership and failure cleanup with AddressSanitizer
        run: |
          rustc +nightly-2026-09-29 --edition=2021 -Zsanitizer=address -g rust/tools/bootlog_raw_file_probe.rs -o "$RUNNER_TEMP/boot-file-asan"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 LD_PRELOAD="$RUNNER_TEMP/bootlog-output-fault.so" BOOTLOG_OUTPUT_FAULT=close \
            "$RUNNER_TEMP/boot-file-asan" "$RUNNER_TEMP/hardware-runtime/file-ownership"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-hardware-runtime-evidence
          path: |
            ${{ runner.temp }}/hardware-runtime/
            ${{ runner.temp }}/hardware-params-binding/commands.json
            ${{ runner.temp }}/hardware-params-binding/provenance.json
  logger-runtime:
    name: rust original route logger
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev libavutil-dev libzstd-dev libyuv-dev libzmq5 ffmpeg strace
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri,rust-src
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0
      - run: cargo test -p openpilot-loggerd --locked
      - run: cargo test -p openpilot-msgq --test queued --locked
      - run: cargo build -p openpilot-loggerd -p openpilot-logmessaged --locked
      - run: cargo build -p openpilot-logging --example native_logging_probe --locked
      - name: Compare shared native logging context, transport and rate-limit boundaries
        run: python tools/check_native_logging.py --binary target/debug/examples/native_logging_probe --output "$RUNNER_TEMP/native-logging"
      - name: Build original native logger and encoder producers
        run: |
          python tools/build_msgq_python.py --output "$RUNNER_TEMP/logger-msgq"
          python tools/loggerd_native_build.py --output "$RUNNER_TEMP/logger-original"
      - name: Compare complete native route logs, media, fallback and signal paths
        run: |
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_native.py \
            --binary target/debug/openpilot-loggerd --original "$RUNNER_TEMP/logger-original/original-loggerd" \
            --producer "$RUNNER_TEMP/logger-original/original-encoder-producer" --output "$RUNNER_TEMP/logger-native" --edges --hevc --fallbacks
      - name: Check diagnostic accounting, suppression and complete collector path
        run: |
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_diagnostics.py \
            --binary target/debug/openpilot-loggerd --original "$RUNNER_TEMP/logger-original/original-loggerd" \
            --fixtures "$RUNNER_TEMP/logger-native/fixtures" --output "$RUNNER_TEMP/logger-counters"
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_log_pipeline.py \
            --binary target/debug/openpilot-loggerd --original "$RUNNER_TEMP/logger-original/original-loggerd" \
            --collector target/debug/openpilot-logmessaged --fixture "$RUNNER_TEMP/logger-native/fixtures/road/0000.capnp" \
            --output "$RUNNER_TEMP/logger-pipeline"
      - name: Compare log-file flush and close syscalls with the original writer
        run: |
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_flush.py \
            --binary target/debug/openpilot-loggerd --original "$RUNNER_TEMP/logger-original/original-loggerd" --output "$RUNNER_TEMP/logger-flush"
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_io.py \
            --binary target/debug/openpilot-loggerd --original "$RUNNER_TEMP/logger-original/original-loggerd" \
            --fixtures "$RUNNER_TEMP/logger-native/fixtures" --output "$RUNNER_TEMP/logger-io"
      - name: Check pure Rust rotation boundaries with Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1
        run: cargo +nightly-2026-09-29 miri test -p openpilot-loggerd --lib rotation::tests --locked
      - name: Build Rust and msgq boundary with AddressSanitizer
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/logger-asan-target
          RUSTFLAGS: -Zsanitizer=address
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: cargo +nightly-2026-09-29 build -p openpilot-loggerd --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: Exercise native logger and media ownership with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
        run: |
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_native.py \
            --binary "$RUNNER_TEMP/logger-asan-target/x86_64-unknown-linux-gnu/debug/openpilot-loggerd" \
            --original "$RUNNER_TEMP/logger-original/original-loggerd" --producer "$RUNNER_TEMP/logger-original/original-encoder-producer" \
            --fixtures "$RUNNER_TEMP/logger-native/fixtures" --output "$RUNNER_TEMP/logger-asan" --edges --hevc
          PYTHONPATH="$RUNNER_TEMP/logger-msgq:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_loggerd_io.py \
            --binary "$RUNNER_TEMP/logger-asan-target/x86_64-unknown-linux-gnu/debug/openpilot-loggerd" \
            --original "$RUNNER_TEMP/logger-original/original-loggerd" --fixtures "$RUNNER_TEMP/logger-native/fixtures" \
            --remux-only --output "$RUNNER_TEMP/logger-asan-io"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-route-logger-evidence
          path: |
            ${{ runner.temp }}/logger-native/
            ${{ runner.temp }}/logger-asan/
            ${{ runner.temp }}/logger-asan-io/
            ${{ runner.temp }}/logger-flush/
            ${{ runner.temp }}/logger-io/
            ${{ runner.temp }}/logger-counters/
            ${{ runner.temp }}/logger-pipeline/
            ${{ runner.temp }}/native-logging/
            ${{ runner.temp }}/logger-original/*.json
            ${{ runner.temp }}/logger-original/*.log
  model-pipelines:
    name: rust original model pipelines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y clang libllvm18 git-lfs capnproto libcapnp-dev
      - run: python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1 pytest==9.0.2
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bins --locked
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-modeld --examples --locked
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-dmonitoringmodeld --locked
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-driving-modeld --locked
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-logmessaged --bins --locked
      - run: python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python"
      - run: git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''
      - name: Compile the original grouped driving and driver artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/original-models"
          python openpilot/selfdrive/modeld/compile_modeld.py --model-size 512x256 --camera-resolutions 1928x1208 1344x760 --frame-skip 4 --onnx openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output "$RUNNER_TEMP/original-models/driving_tinygrad.pkl"
          python tinygrad_repo/examples/openpilot/compile3.py "$GITHUB_WORKSPACE/openpilot/selfdrive/modeld/models/dmonitoring_model.onnx" "$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl"
          python openpilot/selfdrive/modeld/get_model_metadata.py openpilot/selfdrive/modeld/models/dmonitoring_model.onnx
          cp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl "$RUNNER_TEMP/original-models/"
          for resolution in 1928x1208 1344x760; do
            python openpilot/selfdrive/modeld/compile_dm_warp.py --camera-resolution "$resolution" --warp-to 1440x960 --output "$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl"
          done
      - name: Build and validate immutable native pipeline catalog
        run: |
          python rust/tools/build_model_pipelines.py --trusted-model-directory "$RUNNER_TEMP/original-models" --backend cpu --output "$RUNNER_TEMP/native-catalog"
          rust/target/debug/model-run --check-catalog "$RUNNER_TEMP/native-catalog"
      - name: Compare both camera resolutions including prepare-only and recurrent turnover
        run: |
          for resolution in '1928 1208' '1344 760'; do
            set -- $resolution
            python rust/tools/check_pipeline_reference.py --trusted-driving "$RUNNER_TEMP/original-models/driving_tinygrad.pkl" --resolution "$1" "$2" --output "$RUNNER_TEMP/road-pipeline-$1" --binary rust/target/debug/model-run --frames 128
            python rust/tools/check_pipeline_reference.py --trusted-driver "$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl" --trusted-warp "$RUNNER_TEMP/original-models/dm_warp_${1}x${2}_tinygrad.pkl" --trusted-metadata "$RUNNER_TEMP/original-models/dmonitoring_model_metadata.pkl" --resolution "$1" "$2" --output "$RUNNER_TEMP/dm-pipeline-$1" --binary rust/target/debug/model-run --frames 3
          done
      - name: Compare model publications with the original Python implementations
        run: |
          generation=$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/native-catalog/current.json"))["generation"])')
          for resolution in '1928 1208' '1344 760'; do
            set -- $resolution
            python rust/tools/check_model_outputs.py --binary rust/target/debug/examples/output_probe --output "$RUNNER_TEMP/model-outputs-$1" \
              --driving-pipeline "$RUNNER_TEMP/native-catalog/$generation/driving-${1}x${2}/pipeline.json" --driving-outputs "$RUNNER_TEMP/road-pipeline-$1" \
              --driver-pipeline "$RUNNER_TEMP/native-catalog/$generation/driver-${1}x${2}/pipeline.json" --driver-outputs "$RUNNER_TEMP/dm-pipeline-$1"
          done
      - name: Compare Rust input state through the original driving pipelines
        run: |
          python rust/tools/check_input_pipeline.py --inputs-binary rust/target/debug/examples/input_probe \
            --model-binary rust/target/debug/model-run --trusted-driving "$RUNNER_TEMP/original-models/driving_tinygrad.pkl" \
            --output "$RUNNER_TEMP/model-input-pipelines"
      - name: Compare model initialization before first frame and CarParams
        run: |
          PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH" python rust/tools/check_model_startup.py \
            --driving rust/target/debug/openpilot-driving-modeld --driver rust/target/debug/openpilot-dmonitoringmodeld \
            --catalog "$RUNNER_TEMP/native-catalog" --models "$RUNNER_TEMP/original-models" --output "$RUNNER_TEMP/model-startup"
      - name: Exercise the Rust driver daemon with original camera and message IPC
        run: |
          PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH" python rust/tools/check_driver_daemon.py \
            --binary rust/target/debug/openpilot-dmonitoringmodeld --collector rust/target/debug/openpilot-logmessaged \
            --catalog "$RUNNER_TEMP/native-catalog" --models "$RUNNER_TEMP/original-models" --output "$RUNNER_TEMP/driver-daemon"
      - name: Exercise the Rust driving daemon against the original model loop
        run: |
          PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH" python rust/tools/check_driving_daemon.py \
            --binary rust/target/debug/openpilot-driving-modeld --collector rust/target/debug/openpilot-logmessaged \
            --catalog "$RUNNER_TEMP/native-catalog" --models "$RUNNER_TEMP/original-models" --output "$RUNNER_TEMP/driving-daemon"
      - name: Keep native inference running after runtimeTiming transport failures
        run: |
          PYTHONPATH="$RUNNER_TEMP/model-msgq-python:$PYTHONPATH" python rust/tools/check_model_logging_faults.py \
            --catalog "$RUNNER_TEMP/native-catalog" --models "$RUNNER_TEMP/original-models" \
            --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/model-logging-faults"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-original-pipeline-comparison
          path: |
            ${{ runner.temp }}/road-pipeline-*/report.json
            ${{ runner.temp }}/dm-pipeline-*/report.json
            ${{ runner.temp }}/native-catalog/current.json
            ${{ runner.temp }}/model-outputs-*/**/report.json
            ${{ runner.temp }}/model-input-pipelines/**/report.json
            ${{ runner.temp }}/model-startup/
            ${{ runner.temp }}/driver-daemon/
            ${{ runner.temp }}/driving-daemon/
            ${{ runner.temp }}/model-logging-faults/
  model-memory:
    name: rust model memory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang capnproto libcapnp-dev g++-aarch64-linux-gnu
      - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri,rust-src
      - name: Check Rust allocation and aliasing on ARM with Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1 -Zmiri-backtrace=full
        run: cargo +nightly-2026-09-29 miri test -p openpilot-model-runtime --lib --test graph --locked --no-default-features --target aarch64-unknown-linux-gnu
      - name: Check Rust allocation and aliasing with Tree Borrows
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1 -Zmiri-backtrace=full
        run: cargo +nightly-2026-09-29 miri test -p openpilot-model-runtime --lib --test graph --locked --no-default-features --target aarch64-unknown-linux-gnu
      - name: Check driver calibration byte alignment with Miri
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/driver-alignment
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check
        run: cargo +nightly-2026-09-29 miri test -p openpilot-dmonitoringmodeld --test driver --locked
      - name: Check torque buckets, history, reset and sampling with ARM Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1
        run: cargo +nightly-2026-09-29 miri test -p openpilot-torqued --no-default-features --lib --test estimator --locked --target aarch64-unknown-linux-gnu
      - name: Check calibration history and wire handling on ARM with Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1
        run: cargo +nightly-2026-09-29 miri test -p openpilot-calibrationd --no-default-features --lib --test estimator --test wire --locked --target aarch64-unknown-linux-gnu
      - name: Check calibration float parsing and asynchronous persistence with ASan
        env:
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
        run: cargo +nightly-2026-09-29 test -p openpilot-calibrationd --test parameters --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: Check Jetlink native signal, socket and FunctionFS fixture boundaries with ASan
        env:
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
        run: cargo +nightly-2026-09-29 test -p openpilot-jetlink --lib --test socket --test runtime --test ffs --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: Check the real Rust and C kernel boundary with ASan
        env:
          MODEL_TEST_ASAN: '1'
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
        run: cargo +nightly-2026-09-29 test -p openpilot-model-runtime --test cpu --locked -Zbuild-std --target x86_64-unknown-linux-gnu
  arm64:
    name: rust aarch64 build
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu capnproto libcapnp-dev qemu-user-static clang libclang-dev make cmake
      - name: Stage native GNU aarch64 startup renderer and portable loader headers
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get -o Dir::Etc::sourcelist="$PWD/.github/apt/startup-ui-cross.sources" -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist="$PWD/.github/apt/startup-ui-cross.sources" -o Dir::Etc::sourceparts=- install -y libegl-dev:arm64 libgles-dev:arm64 libdrm-dev:arm64 libgbm-dev:arm64
          python rust/tools/stage_startup_ui_raylib.py --arch aarch64 --output "$RUNNER_TEMP/startup-raylib-arm" --shared --cxx aarch64-linux-gnu-g++
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/startup-raylib-arm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build pinned external FFmpeg for generic aarch64 GNU linking
        run: python rust/tools/build_loggerd_ffmpeg.py --root "$RUNNER_TEMP/logger-ffmpeg-gnu" --cc aarch64-linux-gnu-gcc --ar aarch64-linux-gnu-ar --ranlib aarch64-linux-gnu-ranlib
      - name: Install source-pinned Eigen headers
        run: |
          python -m pip install 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
          python -c 'import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR)' >> "$GITHUB_ENV"
      - name: Build generic Linux aarch64 artifact (not AGNOS validation)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          FFMPEG_DIR: ${{ runner.temp }}/logger-ffmpeg-gnu/install
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu
          cargo build --workspace --release --locked --features openpilot-loggerd/static-ffmpeg --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/cpu-sample
      - name: Stage native GNU aarch64 torque dependency (not AGNOS validation)
        working-directory: rust
        run: |
          python -m pip download --only-binary=:all: --no-deps --platform manylinux_2_27_aarch64 --python-version 312 --abi cp312 numpy==2.5.3 --dest "$RUNNER_TEMP/torque-arm-wheels"
          python tools/stage_torque_numerics.py --wheel "$RUNNER_TEMP"/torque-arm-wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/torque-arm-numerics"
      - name: Cross-build the original VisionIPC ION boundary (not device execution)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p openpilot-dmonitoringmodeld --features visionipc-ion --locked --target aarch64-unknown-linux-gnu
      - name: Build and inspect the static C3X probe candidate
        working-directory: rust
        run: |
          python -m pip install cargo-zigbuild==0.23.4 ziglang==0.16.0 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-musl
          python tools/build_loggerd_ffmpeg.py --root "$RUNNER_TEMP/logger-ffmpeg-musl" --cc 'python-zig cc -target aarch64-linux-musl' --ar 'python-zig ar' --ranlib 'python-zig ranlib'
          FFMPEG_DIR="$RUNNER_TEMP/logger-ffmpeg-musl/install" cargo zigbuild --workspace --release --locked --features openpilot-loggerd/static-ffmpeg --target aarch64-unknown-linux-musl
          python tools/build_msgq_python.py --output "$RUNNER_TEMP/rust-msgq-python"
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/check_aarch64.py \
            --binary target/aarch64-unknown-linux-musl/release/openpilot-proclogd \
            --runner /usr/bin/qemu-aarch64-static --report "$RUNNER_TEMP/aarch64-probe.json"
          mkdir -p target/c3x-probe
          cp target/aarch64-unknown-linux-musl/release/openpilot-proclogd target/c3x-probe/
          git rev-parse HEAD > target/c3x-probe/SOURCE_COMMIT
          cp "$RUNNER_TEMP/aarch64-probe.json" target/c3x-probe/
          cd target/c3x-probe
          sha256sum openpilot-proclogd SOURCE_COMMIT aarch64-probe.json > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: rust-c3x-static-probe-pending-device-test
          path: rust/target/c3x-probe/
      - uses: actions/upload-artifact@v6
        with:
          name: rust-linux-aarch64-not-device-validated
          path: |
            rust/target/aarch64-unknown-linux-gnu/release/cpu-sample
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-uploader
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-dashcam-upload
            rust/target/aarch64-unknown-linux-gnu/release/journald-rs
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-timed
            rust/target/aarch64-unknown-linux-musl/release/openpilot-uploader
            rust/target/aarch64-unknown-linux-musl/release/openpilot-dashcam-upload
            rust/target/aarch64-unknown-linux-musl/release/journald-rs
            rust/target/aarch64-unknown-linux-musl/release/openpilot-timed
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-calibrationd
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-loggerd
            rust/target/aarch64-unknown-linux-musl/release/openpilot-loggerd
            ${{ runner.temp }}/logger-ffmpeg-gnu/invocation.json
            ${{ runner.temp }}/logger-ffmpeg-gnu/build.log
            ${{ runner.temp }}/startup-raylib-arm/SOURCE_SHA256
            ${{ runner.temp }}/startup-raylib-arm/plugin-build.json
            ${{ runner.temp }}/startup-raylib-arm/lib/libopenpilot-raylib.so
            ${{ runner.temp }}/logger-ffmpeg-gnu/ffmpeg-6.1.1/COPYING.LGPLv2.1
            ${{ runner.temp }}/logger-ffmpeg-gnu/ffmpeg-6.1.1/LICENSE.md
            ${{ runner.temp }}/logger-ffmpeg-musl/invocation.json
            ${{ runner.temp }}/logger-ffmpeg-musl/build.log
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-torqued
            ${{ runner.temp }}/torque-arm-numerics/
            rust/target/aarch64-unknown-linux-gnu/release/jetlinkd-rs

  athena-runtime:
    name: rust Athena runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ clang cmake pkg-config libzmq3-dev capnproto libcapnp-dev strace iproute2
      - run: python -m pip install requests==2.34.2 json-rpc==1.15.0 websocket-client==1.9.2 websockets==15.0.1 PyJWT==2.14.0 cryptography==50.0.1 numpy==2.5.3 pillow==12.3.0 pycapnp==2.1.0 zstandard==0.25.0
      - name: Build native Athena and owned process child
        run: cargo build --manifest-path rust/Cargo.toml -p openpilot-athena -p openpilot-process-supervision --bins --examples --locked
      - name: Compare all source RPC, upload, IPC, camera and connection scenarios
        run: sudo -E env "PYTHONPATH=$PYTHONPATH" "$(command -v python)" rust/tools/check_athena_runtime.py --bin-dir "$PWD/rust/target/debug" --output "$RUNNER_TEMP/athena-runtime"
      - name: Instrument complete JPEG codec and ownership boundary
        run: python rust/tools/check_jpeg_sanitizers.py --target-dir "$RUNNER_TEMP/jpeg-sanitizer-target" --output "$RUNNER_TEMP/athena-jpeg-sanitizers"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-athena-evidence
          path: |
            ${{ runner.temp }}/athena-runtime/**
            ${{ runner.temp }}/athena-jpeg-sanitizers/**

  web-upload-timeouts:
    name: active upload timeout contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++
      - run: python -m pip install aiohttp==3.13.3 anyio==4.12.1 requests==2.34.2
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-web-upload --examples --locked
      - name: Verify unscaled total, socket and retry deadlines against source
        run: python rust/tools/check_web_upload_timeouts.py --binary rust/target/debug/examples/web_upload_trace --output "$RUNNER_TEMP/web-upload-timeouts"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: active-upload-timeout-evidence
          path: ${{ runner.temp }}/web-upload-timeouts/**
