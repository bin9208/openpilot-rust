            ${{ runner.temp }}/radard-native/logs/
            ${{ runner.temp }}/radard-native/source-*/
            ${{ runner.temp }}/radard-native/ipc/
            ${{ runner.temp }}/radard-native/lifecycle/
            ${{ runner.temp }}/radard-native/bin/
            ${{ runner.temp }}/radard-native/*.txt
            ${{ runner.temp }}/radard-native/SOURCE_COMMIT
            ${{ runner.temp }}/radard-native/SHA256SUMS
            ${{ runner.temp }}/radard-native/params/*.json
            ${{ runner.temp }}/radard-native/params/*.so
            ${{ runner.temp }}/radard-native/msgq/msgq/*.so
          if-no-files-found: warn
