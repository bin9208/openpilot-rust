  startup-runtime:
    name: rust startup prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq5
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 sentry-sdk==2.55.0 zstandard==0.25.0 setproctitle==1.3.7 requests==2.34.2 PyJWT==2.14.0 cryptography==50.0.1 brotli==1.2.0 charset-normalizer==3.5.1 urllib3==2.7.0 pyserial==3.5
      - name: Configure original startup IPC imports
        run: printf 'PYTHONPATH=%s/startup-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build startup libraries and actual child executables
        run: |
          rustc --version
          cargo --version
          cargo build --manifest-path rust/Cargo.toml -p openpilot-process-supervision -p openpilot-managed-entry -p openpilot-registration -p openpilot-manager-catalog -p openpilot-checkout-status -p openpilot-uploader -p openpilot-logmessaged --bins --examples --locked
      - name: Build original startup message and Params bindings
        run: |
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/startup-msgq-python"
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/startup-params-binding"
      - name: Compare process ownership, signals and persistent child lifecycle
        run: |
          python rust/tools/check_process_supervision.py --binary rust/target/debug/examples/process_trace \
            --launcher rust/target/debug/openpilot-process-child --fixture rust/target/debug/examples/process_fixture \
            --binding "$RUNNER_TEMP"/startup-params-binding/params_pyx*.so --output "$RUNNER_TEMP/startup-runtime/process-supervision"
      - name: Compare managed entry and errors through actual collectors and SDK transport
        run: |
          python rust/tools/check_sdk_receiver.py "$RUNNER_TEMP/startup-runtime/sdk-receiver.json"
          python rust/tools/check_managed_entry.py rust/target/debug/examples/managed_child rust/target/debug/openpilot-logmessaged \
            "$RUNNER_TEMP"/startup-params-binding/params_pyx*.so "$RUNNER_TEMP/startup-runtime/managed-entry"
      - name: Verify the exact native response detector source archive
        run: |
          curl --fail --location --retry 3 https://static.crates.io/crates/charset-norm/charset-norm-3.5.1.crate --output "$RUNNER_TEMP/charset-norm-3.5.1.crate"
          python rust/tools/check_registration_vendor.py "$RUNNER_TEMP/charset-norm-3.5.1.crate" "$RUNNER_TEMP/startup-runtime/detector-vendor.json"
      - name: Compare registration signatures, persistence and response decoding
        run: |
          python rust/tools/check_registration.py rust/target/debug/examples/registration_trace \
            "$RUNNER_TEMP"/startup-params-binding/params_pyx*.so "$RUNNER_TEMP/startup-runtime/registration"
          python rust/tools/check_registration_clock.py rust/target/debug/examples/registration_clock "$RUNNER_TEMP/startup-runtime/registration-clock.json"
          python rust/tools/check_registration_utf7.py rust/target/debug/examples/registration_utf7 "$RUNNER_TEMP/startup-runtime/registration-utf7.json"
      - name: Compare actual registration socket deadlines and progressing responses
        run: |
          python rust/tools/check_registration.py rust/target/debug/examples/registration_trace \
            "$RUNNER_TEMP"/startup-params-binding/params_pyx*.so "$RUNNER_TEMP/startup-runtime/registration-timeouts" --timeouts
      - name: Exercise registration collector publisher startup race
        run: |
          cc -shared -fPIC -Wall -Wextra -Werror rust/tools/registration_collector_delay.c -ldl -o "$RUNNER_TEMP/registration-collector-delay.so"
          LD_PRELOAD="$RUNNER_TEMP/registration-collector-delay.so" python rust/tools/check_registration.py rust/target/debug/examples/registration_trace \
            "$RUNNER_TEMP"/startup-params-binding/params_pyx*.so "$RUNNER_TEMP/startup-runtime/registration-ready" --case clock_year_ten_thousand
          python -c 'from pathlib import Path; import sys; files=list(Path(sys.argv[1]).glob("clock_year_ten_thousand/*/collector-*/stderr.log")); assert len(files)==2; assert all("pausing before error publisher initialization" in path.read_text() for path in files)' "$RUNNER_TEMP/startup-runtime/registration-ready"
      - name: Compare uploader signing after shared registration key support
        run: python rust/tools/check_uploader.py --binary rust/target/debug/examples/uploader_trace --output "$RUNNER_TEMP/startup-runtime/uploader-signing.json"
      - name: Compare complete manager catalog and ordered Params predicates
        run: |
          python rust/tools/check_manager_catalog.py rust/target/debug/examples/catalog_probe \
            "$RUNNER_TEMP"/startup-params-binding/params_pyx*.so "$RUNNER_TEMP/startup-runtime/catalog"
      - name: Compare checkout metadata, real Git and child exec boundaries
        run: |
          python rust/tools/check_checkout_status.py --binary rust/target/debug/examples/checkout_trace \
            --fixture rust/target/debug/examples/git_fixture --launcher rust/target/debug/openpilot-process-child \
            --captured-binary rust/target/debug/examples/captured_trace --handshake-fixture rust/target/debug/examples/handshake_fixture \
            --output "$RUNNER_TEMP/startup-runtime/checkout-status"
      - name: Retain startup source comparison and binding evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-startup-runtime-evidence
          path: |
            ${{ runner.temp }}/startup-runtime/
            ${{ runner.temp }}/startup-params-binding/commands.json
            ${{ runner.temp }}/startup-params-binding/provenance.json
  startup-services:
    name: rust startup services
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev openssl iproute2
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0 requests==2.34.2 pyserial==3.5 PyJWT==2.14.0 cryptography==50.0.1
      - name: Configure original startup service IPC imports
        run: printf 'PYTHONPATH=%s/services-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - run: python -m pip install pycryptodome==3.23.0
      - run: python -m pip install comma-deps-raylib==6.0.0.1.post103 Pillow==12.3.0 python-xlib==0.33 setproctitle==1.3.7 psutil==7.2.2
      - name: Stage pinned native startup renderer
        run: |
          sudo apt-get install -y libgl-dev libx11-dev libxrandr2 libxinerama1 libxcursor1 libxi6 xvfb xauth
          python rust/tools/stage_startup_ui_raylib.py --arch x86_64 --output "$RUNNER_TEMP/startup-raylib-host" --shared
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/startup-raylib-host\nSTARTUP_UI_RAYLIB_LIBRARY=%s/startup-raylib-host/lib/libopenpilot-raylib.so\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build native startup service boundaries
        run: cargo build --manifest-path rust/Cargo.toml -p openpilot-lpa -p openpilot-bridge -p openpilot-agnos -p openpilot-updated -p openpilot-startup-ui -p openpilot-process-supervision --bins --examples --locked
      - name: Build original IPC binding and messaging bridge
        run: |
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/services-msgq-python"
          python rust/tools/build_bridge_reference.py --output "$RUNNER_TEMP/services-bridge-source"
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/services-params-binding"
      - name: Compare LPA serial, TLS, profile and notification lifecycle
        run: python rust/tools/check_lpa.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/startup-services/lpa"
      - name: Compare source and native bridge packets and connection lifecycle
        run: sudo -E env "PYTHONPATH=$PYTHONPATH" "$(command -v python)" rust/tools/check_bridge.py --original "$RUNNER_TEMP/services-bridge-source/bridge-original" --binary "$PWD/rust/target/debug/bridge" --output "$RUNNER_TEMP/startup-services/bridge"
      - name: Compare AGNOS images, retry policy, casync and actual CLI
        run: python rust/tools/check_agnos.py --target "$PWD/rust/target" --evidence "$RUNNER_TEMP/startup-services/agnos"
      - name: Compare updater Git lifecycle, native signals and background AGNOS adapter
        run: |
          python rust/tools/check_updated.py --binary "$PWD/rust/target/debug/examples/updated_trace" --launcher "$PWD/rust/target/debug/openpilot-process-child" --binding "$RUNNER_TEMP"/services-params-binding/params_pyx*.so --output "$RUNNER_TEMP/startup-services/updated-source"
          python rust/tools/check_updated_process.py --binary "$PWD/rust/target/debug/examples/updated_command" --launcher "$PWD/rust/target/debug/openpilot-process-child" --output "$RUNNER_TEMP/startup-services/updated-process"
          python rust/tools/check_updated_daemon.py --binary "$PWD/rust/target/debug/openpilot-updated" --launcher "$PWD/rust/target/debug/openpilot-process-child" --output "$RUNNER_TEMP/startup-services/updated-daemon"
          python rust/tools/check_updated_agnos.py --target "$PWD/rust/target" --output "$RUNNER_TEMP/startup-services/updated-agnos"
      - name: Compare actual startup UI rendering, input and child lifecycle
        run: xvfb-run -a -s '-screen 0 2400x1400x24 -nolisten tcp' python rust/tools/check_startup_ui.py --target "$PWD/rust/target/debug" --output "$RUNNER_TEMP/startup-services/ui"
      - name: Retain startup service comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-startup-services-evidence
          path: ${{ runner.temp }}/startup-services/
