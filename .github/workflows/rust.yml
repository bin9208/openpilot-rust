name: Support 630 isolated validation controller
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit in bin9208/openpilot-rust
        type: string
        required: true
      phase:
        description: Focused verification phase; does not replace required PR gates
        type: choice
        options: [packages, source, host, arm, all]
        default: packages
        required: true
permissions:
  contents: read
concurrency:
  group: support-630-${{ github.event.inputs.source_sha }}-${{ github.event.inputs.phase }}
  cancel-in-progress: false
jobs:
  focused:
    name: support 630 focused ${{ inputs.phase }}
    runs-on: [self-hosted, Linux, X64, support-630]
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARROT_EXCEPTION_DISCORD_WEBHOOK_DISABLE: '1'
      CC: gcc
      CXX: g++
      REQUESTED_SOURCE: ${{ inputs.source_sha }}
      REQUESTED_PHASE: ${{ inputs.phase }}
    steps:
      - name: Validate source and runner ownership
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == bin-actions2 ]]
          [[ "$GITHUB_REPOSITORY" == bin9208/openpilot-rust ]]
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_PHASE" =~ ^(packages|source|host|arm|all)$ ]]
          python3 - <<'PYRESOURCE'
          import os, shutil
          # This job's estimate: native headers/toolchain + locked dependency and debug closure.
          growth = 10 * 1024**3
          for path in {os.environ['RUNNER_TEMP'], os.environ['GITHUB_WORKSPACE']}:
              free = shutil.disk_usage(path).free
              print(f'path={path} free_bytes={free} expected_growth_bytes={growth}')
              if free < growth:
                  raise SystemExit('insufficient operation growth; existing data and other jobs preserved')
          PYRESOURCE
          support_root=$(mktemp -d "$RUNNER_TEMP/support630.XXXXXX")
          chmod 700 "$support_root"
          printf 'SUPPORT_ROOT=%s\nCARGO_TARGET_DIR=%s/target\nEVIDENCE=%s/evidence\n' "$support_root" "$support_root" "$support_root" >> "$GITHUB_ENV"
          mkdir -p "$support_root/evidence"
          printf '%s\n' "$GITHUB_SHA" > "$support_root/evidence/CONTROLLER_COMMIT"
          printf '%s\n' "$REQUESTED_SOURCE" > "$support_root/evidence/REQUESTED_SOURCE"
          printf '%s\n' "$RUNNER_NAME" > "$support_root/evidence/RUNNER_NAME"
      - uses: actions/checkout@v7
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/candidate"
          [[ "$(git -C "$source_root" rev-parse HEAD)" == "$REQUESTED_SOURCE" ]]
          test -z "$(git -C "$source_root" status --porcelain)"
          printf 'SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          git -C "$source_root" rev-parse HEAD > "$EVIDENCE/SOURCE_COMMIT"
          git -C "$source_root" ls-files --stage > "$EVIDENCE/source-index.txt"
          sha256sum "$EVIDENCE/source-index.txt" > "$EVIDENCE/source-index.sha256"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Prepare private Python and native package prerequisites
        shell: bash
        run: |
          set -euo pipefail
          architecture=$(dpkg --print-architecture)
          sudo apt-get -o DPkg::Lock::Timeout=600 -o "APT::Architectures=$architecture" update
          sudo apt-get -o DPkg::Lock::Timeout=600 -o "APT::Architectures=$architecture" install -y --no-remove --no-upgrade g++ clang cmake pkg-config capnproto libcapnp-dev libzmq3-dev libdbus-1-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libzstd-dev libclang-dev strace time openssl libasound2-dev dbus dbus-daemon ffmpeg binutils curl
          unset FFMPEG_DIR PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR BINDGEN_EXTRA_CLANG_ARGS
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
          python -m venv "$SUPPORT_ROOT/venv"
          "$SUPPORT_ROOT/venv/bin/python" -m pip install 'numpy==2.5.3' 'pycapnp==2.1.0' 'zstandard==0.25.0' 'pyzmq==27.2.0' 'pyserial==3.5' 'requests==2.34.2' 'aiohttp==3.13.3' 'anyio==4.12.1' 'Cython==3.2.4' 'setuptools==82.0.1' 'sentry-sdk==2.55.0' 'cffi==2.1.1' 'jeepney==0.9.0' 'cryptography==50.0.1' 'PyJWT==2.15.1'
          printf 'SOURCE_PYTHON=%s/venv/bin/python\n' "$SUPPORT_ROOT" >> "$GITHUB_ENV"
          printf '%s/venv/bin\n' "$SUPPORT_ROOT" >> "$GITHUB_PATH"
          rustc --version --verbose > "$EVIDENCE/rustc.txt"
          cargo --version > "$EVIDENCE/cargo.txt"
          "$SUPPORT_ROOT/venv/bin/python" -m pip freeze > "$EVIDENCE/python.txt"
          dpkg-query -W -f='${binary:Package} ${Version}\n' > "$EVIDENCE/native-packages.txt"
      - name: Focused package build tests Clippy and allocation proof
        if: ${{ inputs.phase == 'packages' || inputs.phase == 'host' || inputs.phase == 'all' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/ci/support630-packages.sh"
      - name: Maintained unchanged-source comparisons
        if: ${{ inputs.phase == 'source' || inputs.phase == 'host' || inputs.phase == 'all' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/ci/support630-source.sh"
      - name: Affected ARM verification
        if: ${{ inputs.phase == 'arm' || inputs.phase == 'all' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/ci/support630-arm.sh"
      - name: Preserve exact controller and source evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: support-630-${{ inputs.phase }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
