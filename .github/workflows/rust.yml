          sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq3-dev
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0 requests==2.34.2 urllib3==2.7.0 charset-normalizer==3.5.1 brotli==1.2.0 PyJWT==2.14.0 cryptography==50.0.1
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
