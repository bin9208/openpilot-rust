  card-runtime:
    name: rust Card and CAN runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure original Card IPC imports
        run: printf 'PYTHONPATH=%s/card-native/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Reserve runner capacity before dependency installation
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq3-dev
      - name: Install pinned Card oracle dependencies
        run: |
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2 pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3
      - name: Install pinned Rust compiler
        run: |
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal --component clippy
      - name: Build unchanged source Params and msgq bindings
        run: |
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/card-native/params"
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/card-native/msgq"
          python -c 'import json, os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"card-native/params/provenance.json"; print("CARD_PARAMS_BINDING="+json.loads(p.read_text())["module"])' >> "$GITHUB_ENV"
      - name: Stage pinned numerical dependency
        run: |
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 512
          python -m pip download --only-binary=:all: --no-deps numpy==2.5.3 --dest "$RUNNER_TEMP/card-native/wheels"
          python rust/tools/stage_torque_numerics.py --wheel "$RUNNER_TEMP"/card-native/wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/card-native/numerics"
      - name: Generate all required Hyundai fixtures
        run: |
          python rust/tools/stage_card_fixtures.py --fixtures "$RUNNER_TEMP/card-native/fixtures" --dbc "$RUNNER_TEMP/card-native/dbc"
          printf 'HYUNDAI_FIXTURE_DIR=%s/card-native/fixtures\nHYUNDAI_DBC_DIR=%s/card-native/dbc\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build CAN and native Card executables and examples
        working-directory: rust
        run: |
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo build -p openpilot-can --examples --locked
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo build -p openpilot-card --features native --bins --examples --locked
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo clippy -p openpilot-can -p openpilot-card --features openpilot-card/native --all-targets --locked -- -D warnings
      - name: Require Card and CAN tests with complete Hyundai postchecks
        working-directory: rust
        run: |
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo test -p openpilot-can -p openpilot-card --features openpilot-card/native --locked
          python tools/check_card_hyundai_params.py "$HYUNDAI_FIXTURE_DIR"
          python tools/check_card_hyundai_state.py "$HYUNDAI_FIXTURE_DIR"
          python tools/check_card_hyundai_controller.py "$HYUNDAI_FIXTURE_DIR"
          python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=tools/tests tools/tests/test_card_ci.py tools/tests/test_card_phase_fence.py -q
      - name: Require source and native Card and CAN functional gates
        run: |
          python rust/tools/check_card_ci.py --phase reference --binaries "$GITHUB_WORKSPACE/rust/target/debug/examples" --daemon "$GITHUB_WORKSPACE/rust/target/debug/openpilot-card" --numerics "$RUNNER_TEMP/card-native/numerics" --binding "$CARD_PARAMS_BINDING" --dbc "$HYUNDAI_DBC_DIR" --corpus "$RUNNER_TEMP/card-native/corpus" --evidence "$RUNNER_TEMP/card-native/reference"
      - name: Stage declared synthetic IPC inputs
        run: |
          python rust/tools/stage_card_corpus.py --output "$RUNNER_TEMP/card-native/corpus" --fixtures "$HYUNDAI_FIXTURE_DIR" --dbc "$HYUNDAI_DBC_DIR" \
            --retained "tesla=$RUNNER_TEMP/card-native/reference/tesla/input.json" --retained "mazda=$RUNNER_TEMP/card-native/reference/mazda/input.json" \
            --retained "nissan=$RUNNER_TEMP/card-native/reference/nissan/input.json" --retained "chrysler=$RUNNER_TEMP/card-native/reference/chrysler/input.json" \
            --retained "rivian=$RUNNER_TEMP/card-native/reference/rivian/input.json" --retained "ford=$RUNNER_TEMP/card-native/reference/ford/input.json" \
            --retained "subaru=$RUNNER_TEMP/card-native/reference/subaru/input.json" --retained "toyota=$RUNNER_TEMP/card-native/reference/toyota/input.json" \
            --retained "gm=$RUNNER_TEMP/card-native/reference/gm/input.json" --retained "honda=$RUNNER_TEMP/card-native/reference/honda/input.json" \
            --retained "volkswagen=$RUNNER_TEMP/card-native/reference/volkswagen/input.json"
      - name: Require actual host Card IPC and shutdown
        run: |
          python rust/tools/check_card_ci.py --phase ipc --binaries "$GITHUB_WORKSPACE/rust/target/debug/examples" --daemon "$GITHUB_WORKSPACE/rust/target/debug/openpilot-card" --numerics "$RUNNER_TEMP/card-native/numerics" --binding "$CARD_PARAMS_BINDING" --dbc "$HYUNDAI_DBC_DIR" --corpus "$RUNNER_TEMP/card-native/corpus" --evidence "$RUNNER_TEMP/card-native/ipc"
      - name: Preserve Card and CAN invocations, source identities, failures and generated inputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-card-can-host-evidence
          path: ${{ runner.temp }}/card-native/
          if-no-files-found: warn
