name: Rust port
on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: rust checks
    needs: [workspace, model-memory, model-pipelines, logger-runtime, support-runtime, telemetry-runtime, startup-runtime, hardware-runtime, platform-runtime, startup-services, sensor-audio, gnss-runtime, estimation-runtime, ui-connectivity, athena-runtime, web-upload-timeouts]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require runtime validation
        env:
          WORKSPACE: ${{ needs.workspace.result }}
          MEMORY: ${{ needs.model-memory.result }}
          PIPELINES: ${{ needs.model-pipelines.result }}
          LOGGER: ${{ needs.logger-runtime.result }}
          SUPPORT: ${{ needs.support-runtime.result }}
          TELEMETRY: ${{ needs.telemetry-runtime.result }}
          STARTUP: ${{ needs.startup-runtime.result }}
          HARDWARE: ${{ needs.hardware-runtime.result }}
          PLATFORM: ${{ needs.platform-runtime.result }}
          STARTUP_SERVICES: ${{ needs.startup-services.result }}
          SENSOR_AUDIO: ${{ needs.sensor-audio.result }}
          GNSS: ${{ needs.gnss-runtime.result }}
          ESTIMATION: ${{ needs.estimation-runtime.result }}
          UI_CONNECTIVITY: ${{ needs.ui-connectivity.result }}
          ATHENA: ${{ needs.athena-runtime.result }}
          UPLOAD_TIMEOUTS: ${{ needs.web-upload-timeouts.result }}
        run: |
          test "$WORKSPACE" = success
          test "$MEMORY" = success
          test "$PIPELINES" = success
          test "$LOGGER" = success
          test "$SUPPORT" = success
          test "$TELEMETRY" = success
          test "$STARTUP" = success
          test "$HARDWARE" = success
          test "$PLATFORM" = success
          test "$STARTUP_SERVICES" = success
          test "$SENSOR_AUDIO" = success
          test "$GNSS" = success
          test "$ESTIMATION" = success
          test "$UI_CONNECTIVITY" = success
          test "$ATHENA" = success
          test "$UPLOAD_TIMEOUTS" = success
  workspace:
    name: rust workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '2'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_RUN_BINARY: ${{ github.workspace }}/rust/target/debug/model-run
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang libllvm18 git-lfs libclang-dev libavcodec-dev libavformat-dev libavutil-dev cmake
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2 pyzmq==27.2.0 requests==2.34.2 aiohttp==3.13.3 anyio==4.12.1 PyJWT==2.15.1 cryptography==50.0.1
      - name: Stage pinned native startup UI headers
        run: |
          python tools/stage_startup_ui_raylib.py --arch x86_64 --output "$RUNNER_TEMP/startup-raylib-host"
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/startup-raylib-host\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Install source-pinned Eigen headers
        run: |
          python -m pip install 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
          python -c 'import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR)' >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Compare QCOM fixtures with the original argument and packet encoder
        run: python tools/qcom_fixtures.py --verify crates/model-runtime/tests/fixtures/qcom
      - name: Compare captured graphs and original camera warps with Rust
        run: python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=tools/tests tools/tests -q
      - name: Fetch the pinned model from this independent repository
        run: git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''
      - name: Compare actual models and recurrent policy with Rust
        run: |
          python tools/check_model_reference.py --model ../openpilot/selfdrive/modeld/models/dmonitoring_model.onnx --output "$RUNNER_TEMP/dm-native" --binary target/debug/model-run
          python tools/check_model_reference.py --model ../openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output "$RUNNER_TEMP/driving-native" --binary target/debug/model-run
          python tools/check_policy_reference.py --model ../openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output "$RUNNER_TEMP/policy-native" --binary target/debug/model-run
      - run: python tools/check_reference.py
      - run: cargo build --workspace --examples --locked
      - name: Compare log-space retention with the original loop and actual low-space filesystem
        run: |
          cargo build -p openpilot-deleter --bins --examples --locked
          python tools/check_deleter_reference.py --binary target/debug/examples/deleter_trace --output "$RUNNER_TEMP/deleter-reference"
          python tools/check_deleter_daemon.py --binary target/debug/openpilot-deleter --output "$RUNNER_TEMP/deleter-native" --privileged-mount
      - name: Compare Jetlink policy, model adapter, descriptors and bidirectional RPC
        run: |
          python tools/check_jetlink_reference.py target/debug/examples/jetlink_probe "$RUNNER_TEMP/jetlink-reference"
          python tools/check_jetlink_rpc.py target/debug/examples/rpc_probe "$RUNNER_TEMP/jetlink-rpc"
          python tools/check_jetlink_raw.py target/debug/examples/jetlink_raw_probe "$RUNNER_TEMP/jetlink-raw"
      - name: Retain Jetlink source oracle and RPC evidence
        uses: actions/upload-artifact@v6
        with:
          name: jetlink-host-oracle-evidence
          path: |
            ${{ runner.temp }}/jetlink-reference/
            ${{ runner.temp }}/jetlink-rpc/
            ${{ runner.temp }}/jetlink-raw/
      - name: Compare message state and service catalog with original source
        run: |
          python tools/check_services.py
          python tools/check_message_state.py --binary target/debug/examples/state_probe --output "$RUNNER_TEMP/message-state"
      - name: Stage pinned native torque numerical dependency and compare original estimator
        run: |
          python -m pip download --only-binary=:all: --no-deps numpy==2.5.3 --dest "$RUNNER_TEMP/torque-wheels"
          python tools/stage_torque_numerics.py --wheel "$RUNNER_TEMP"/torque-wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/torque-numerics"
          cargo build -p openpilot-torqued --bins --examples --locked
          OPENBLAS_NUM_THREADS=1 python tools/check_torque_reference.py --binary target/debug/examples/torque_trace --numerics "$RUNNER_TEMP/torque-numerics" --output "$RUNNER_TEMP/torque-estimator"
          OPENBLAS_NUM_THREADS=1 python tools/check_torque_loop.py --binary target/debug/examples/torque_loop --numerics "$RUNNER_TEMP/torque-numerics" --output "$RUNNER_TEMP/torque-loop"
      - name: Compare calibration estimator, loop and Params floats with original source
        run: |
          cargo build -p openpilot-calibrationd --bins --examples --locked
          python tools/check_calibration_reference.py --binary target/debug/examples/calibration_trace --output "$RUNNER_TEMP/calibration-estimator"
          python tools/check_calibration_loop.py --binary target/debug/examples/calibration_loop --output "$RUNNER_TEMP/calibration-loop"
          python tools/check_calibration_float.py --binary target/debug/examples/calibration_float --output "$RUNNER_TEMP/calibration-float"
      - name: Compare model desire state and Bluetooth command consumption with original source
        run: |
          python tools/check_desire_reference.py --binary target/debug/examples/desire_probe --output "$RUNNER_TEMP/model-desire"
          python tools/check_command_reference.py --binary target/debug/examples/command_probe --output "$RUNNER_TEMP/model-commands"
      - name: Compare driver monitoring policy and complete cereal packets with original source
        run: python tools/check_monitoring_reference.py --binary target/debug/monitoring-probe --output "$RUNNER_TEMP/monitoring-policy"
      - name: Compare diagnostic log formatting and rotation with original source
        run: python tools/check_logmessaged_reference.py --binary target/debug/examples/file_probe --output "$RUNNER_TEMP/logmessaged-reference"
      - name: Compare bounded diagnostics and receiver state with original source
        run: |
          python tools/check_runtime_diagnostics.py --binary target/debug/examples/diagnostics_trace --output "$RUNNER_TEMP/runtime-diagnostics"
          python tools/check_communication_snapshot.py --binary target/debug/examples/communication_trace --output "$RUNNER_TEMP/communication-snapshot"
          cargo build -p openpilot-driving-modeld --example model_timing_trace --locked
          python tools/check_model_timing.py --binary target/debug/examples/model_timing_trace --output "$RUNNER_TEMP/model-timing"
      - name: Compare driving-model input state with the original loop
        run: python tools/check_model_inputs.py --binary target/debug/examples/input_probe --output "$RUNNER_TEMP/model-inputs"
      - run: python tools/check_proclog_reference.py
      - run: python tools/check_params_reference.py
      - run: python tools/build_msgq_python.py --output "$RUNNER_TEMP/rust-msgq-python"
      - name: Exercise structured log producers with original and Rust collectors
        run: |
          cargo build -p openpilot-logging --examples --locked
          cargo build -p openpilot-logmessaged --bins --locked
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$PYTHONPATH" python tools/check_logging_producer.py \
            --binary target/debug/examples/logging_probe --fork-binary target/debug/examples/logging_fork \
            --collector target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/logging-producer"
      - name: Compare continuous driver monitoring with the original loop and IPC
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/rust/tools" python tools/check_dmonitoring_daemon.py \
            --binary target/debug/openpilot-dmonitoringd --output "$RUNNER_TEMP/dmonitoring-daemon"
      - name: Validate continuous procLog cadence and native IPC shutdown
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/check_proclog_daemon.py \
            --binary target/debug/openpilot-proclogd-runtime --cadence-binary target/debug/examples/cadence_trace \
            --output "$RUNNER_TEMP/proclog-runtime"
      - name: Exercise torque native IPC, cache persistence and inherited DEBUG capacity failure
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$PYTHONPATH" OPENBLAS_NUM_THREADS=1 python tools/check_torque_daemon.py --binary target/debug/openpilot-torqued --numerics "$RUNNER_TEMP/torque-numerics" --output "$RUNNER_TEMP/torque-native"
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$PYTHONPATH" OPENBLAS_NUM_THREADS=1 python tools/check_torque_debug_capacity.py --binary target/debug/openpilot-torqued --numerics "$RUNNER_TEMP/torque-numerics" --output "$RUNNER_TEMP/torque-debug-capacity"
      - name: Exercise calibration daemon with original Python IPC and durable Params
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/check_calibration_daemon.py \
            --binary target/debug/openpilot-calibrationd --output "$RUNNER_TEMP/calibration-native"
      - name: Compare continuous Rust logmessaged with original native ZMQ and cereal peers
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$PYTHONPATH" python tools/check_logmessaged_native.py \
            --binary target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/logmessaged-native"
      - name: Run the actual Python consumer against the bounded Rust producer
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/device_probe.py \
            --binary target/debug/openpilot-proclogd --frames 3 --interval-ms 100 --report "$RUNNER_TEMP/host-probe.json"
      - run: python tools/check_msgq_sanitizers.py --target-dir "$RUNNER_TEMP/rust-msgq-asan"
      - run: cargo build --workspace --release --locked
      - run: target/release/cpu-sample 1000 > cpu-sample.tsv
      - uses: actions/upload-artifact@v6
        with:
          name: rust-linux-x86_64
          path: |
            rust/target/release/cpu-sample
            rust/target/release/openpilot-deleter
            rust/target/release/openpilot-uploader
            rust/target/release/openpilot-dashcam-upload
            rust/target/release/journald-rs
            rust/target/release/openpilot-timed
            ${{ runner.temp }}/deleter-reference/report.json
            ${{ runner.temp }}/deleter-native/*.json
            ${{ runner.temp }}/deleter-native/*.log
            rust/target/release/openpilot-proclogd
            rust/target/release/openpilot-proclogd-runtime
            rust/target/release/openpilot-dmonitoringd
            ${{ runner.temp }}/dmonitoring-daemon/**/report.json
            ${{ runner.temp }}/dmonitoring-daemon/**/*.log
            ${{ runner.temp }}/proclog-runtime/**/*.json
            ${{ runner.temp }}/proclog-runtime/**/*.log
            ${{ runner.temp }}/proclog-runtime/**/*.capnp
            rust/target/release/openpilot-torqued
            ${{ runner.temp }}/torque-*/report.json
            ${{ runner.temp }}/torque-native/**/*.capnp
            ${{ runner.temp }}/torque-native/**/*.log
            ${{ runner.temp }}/torque-debug-capacity/**/*.log
            ${{ runner.temp }}/torque-numerics/
            rust/target/release/openpilot-calibrationd
            ${{ runner.temp }}/calibration-*/report.json
            ${{ runner.temp }}/calibration-native/**/*.capnp
            ${{ runner.temp }}/calibration-native/**/*.log
            ${{ runner.temp }}/host-probe.json
            ${{ runner.temp }}/dm-native/report.json
            ${{ runner.temp }}/driving-native/report.json
            ${{ runner.temp }}/policy-native/report.json
            ${{ runner.temp }}/message-state/report.json
            ${{ runner.temp }}/model-timing/
            ${{ runner.temp }}/model-desire/report.json
            ${{ runner.temp }}/model-commands/report.json
            ${{ runner.temp }}/model-inputs/report.json
            ${{ runner.temp }}/monitoring-policy/report.json
            ${{ runner.temp }}/logmessaged-reference/report.json
            ${{ runner.temp }}/logmessaged-native/**/report.json
            ${{ runner.temp }}/logmessaged-native/**/*.log
            ${{ runner.temp }}/runtime-diagnostics/report.json
            ${{ runner.temp }}/communication-snapshot/report.json
            ${{ runner.temp }}/logging-producer/**/report.json
            ${{ runner.temp }}/logging-producer/**/*.log
  support-runtime:
    name: rust support runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq5
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0 requests==2.34.2 aiohttp==3.13.3 anyio==4.12.1 PyJWT==2.15.1 cryptography==50.0.1 pyserial==3.5
      - name: Configure original support IPC imports
        run: printf 'PYTHONPATH=%s/support-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build support daemons and their source-comparison probes
        run: cargo build --manifest-path rust/Cargo.toml -p openpilot-uploader -p openpilot-web-upload -p openpilot-dashcam-upload -p openpilot-params-typed -p openpilot-journald -p openpilot-timed -p openpilot-logmessaged --bins --examples --locked
      - name: Build original message and Params bindings
        run: |
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/support-msgq-python"
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/support-params-binding"
      - name: Compare uploader policy, signed local HTTP and compressed payloads with original source
        run: |
          python rust/tools/check_uploader.py --binary rust/target/debug/examples/uploader_trace --output "$RUNNER_TEMP/support-runtime/uploader-reference/report.json"
          python rust/tools/check_uploader_timeouts.py --binary rust/target/debug/examples/uploader_trace --output "$RUNNER_TEMP/support-runtime/uploader-timeouts"
      - name: Compare active Carrot upload helpers and actual loopback request bytes
        run: python rust/tools/check_web_upload.py --binary rust/target/debug/examples/web_upload_trace --output "$RUNNER_TEMP/support-runtime/web-upload-reference"
      - name: Exercise uploader with original deviceState IPC, synthetic Params and loopback uploads
        run: python rust/tools/check_uploader_daemon.py --binary rust/target/debug/openpilot-uploader --output "$RUNNER_TEMP/support-runtime/uploader-native"
      - name: Keep interrupted socket reads within one upload and its original deadline
        run: python rust/tools/check_uploader_http_interrupted.py --binary rust/target/debug/openpilot-uploader --output "$RUNNER_TEMP/support-runtime/uploader-http-interrupted"
      - name: Compare real Params getters and uploader behavior through both collectors
        run: |
          python rust/tools/check_params_string.py --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so \
            --native rust/target/debug/examples/params_string_probe --output "$RUNNER_TEMP/support-runtime/params-string"
          python rust/tools/check_params_string_uploader.py --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so \
            --binary rust/target/debug/openpilot-uploader --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/params-uploader"
      - name: Compare uploader logs and transport failures through both collectors
        run: |
          python rust/tools/check_uploader_logging.py --binary rust/target/debug/openpilot-uploader \
            --trace rust/target/debug/examples/uploader_trace --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/uploader-logging"
          python rust/tools/check_uploader_log_fault.py --native rust/target/debug/examples/uploader_log_fault \
            --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/uploader-log-fault"
      - name: Compare dashcam jobs, catalog, metadata and real Params
        run: |
          python rust/tools/check_dashcam_jobs.py --binary rust/target/debug/examples/dashcam_job_trace --output "$RUNNER_TEMP/support-runtime/dashcam-jobs"
          python rust/tools/check_dashcam_catalog.py --binary rust/target/debug/examples/dashcam_catalog_trace --output "$RUNNER_TEMP/support-runtime/dashcam-catalog"
          python rust/tools/check_dashcam_metadata.py --binary rust/target/debug/examples/dashcam_metadata_trace --output "$RUNNER_TEMP/support-runtime/dashcam-metadata"
          python rust/tools/check_dashcam_params.py --binary rust/target/debug/examples/dashcam_params_trace \
            --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so --output "$RUNNER_TEMP/support-runtime/dashcam-params"
      - name: Compare dashcam uploads and child connection ownership
        run: |
          python rust/tools/check_dashcam_runtime.py --binary rust/target/debug/openpilot-dashcam-upload --output "$RUNNER_TEMP/support-runtime/dashcam-runtime"
          python rust/tools/check_dashcam_lifecycle.py --binary rust/target/debug/openpilot-dashcam-upload --output "$RUNNER_TEMP/support-runtime/dashcam-lifecycle"
      - name: Compare journald actual IPC, fatal inputs and child lifecycle
        run: python rust/tools/check_journald.py --binary rust/target/debug/journald-rs --output "$RUNNER_TEMP/support-runtime/journald"
      - name: Compare timed policy, HTTP and logging with original source
        run: |
          python rust/tools/check_timed_reference.py --binary rust/target/debug/examples/timed_fixture --output "$RUNNER_TEMP/support-runtime/timed-reference"
          python rust/tools/check_timed_dates.py --binary rust/target/debug/examples/timed_fixture --output "$RUNNER_TEMP/support-runtime/timed-dates"
          python rust/tools/check_timed_http.py --binary rust/target/debug/examples/timed_fixture --output "$RUNNER_TEMP/support-runtime/timed-http"
          python rust/tools/check_timed_logging.py --binary rust/target/debug/examples/timed_fixture --output "$RUNNER_TEMP/support-runtime/timed-logging"
      - name: Compare timed actual IPC and production process shutdown
        run: |
          python rust/tools/check_timed_daemon.py --binary rust/target/debug/examples/timed_fixture --output "$RUNNER_TEMP/support-runtime/timed-daemon"
          python rust/tools/check_timed_date_daemon.py --binary rust/target/debug/openpilot-timed --output "$RUNNER_TEMP/support-runtime/timed-date-daemon"
          python rust/tools/check_timed_lifecycle.py --binary rust/target/debug/openpilot-timed --output "$RUNNER_TEMP/support-runtime/timed-lifecycle"
          python rust/tools/check_timed_shutdown.py --binary rust/target/debug/openpilot-timed --output "$RUNNER_TEMP/support-runtime/timed-shutdown"
      - name: Compare interrupted diagnostic sends and actual upload completion
        run: |
          fault_root="$RUNNER_TEMP/support-runtime/interrupted-send"
          mkdir -p "$fault_root/bin"
          gcc -Wall -Wextra -Werror -O2 -fPIC -DZMQ_LINK_WRAP -c rust/tools/zmq_send_boundary.c -o "$fault_root/send-wrap.o"
          gcc -Wall -Wextra -Werror -O2 -fPIC -shared rust/tools/zmq_send_boundary.c -ldl -o "$fault_root/send-preload.so"
          cargo rustc --manifest-path rust/Cargo.toml -p openpilot-logging --example logging_probe --locked -- -C link-arg=-Wl,--wrap=zmq_msg_send -C "link-arg=$fault_root/send-wrap.o"
          cp rust/target/debug/examples/logging_probe "$fault_root/bin/"
          cargo rustc --manifest-path rust/Cargo.toml -p openpilot-statsd --example stats_producer --locked -- -C link-arg=-Wl,--wrap=zmq_msg_send -C "link-arg=$fault_root/send-wrap.o"
          cp rust/target/debug/examples/stats_producer "$fault_root/bin/"
          cargo rustc --manifest-path rust/Cargo.toml -p openpilot-uploader --bin openpilot-uploader --locked -- -C link-arg=-Wl,--wrap=zmq_msg_send -C "link-arg=$fault_root/send-wrap.o"
          cp rust/target/debug/openpilot-uploader "$fault_root/bin/"
          python_zmq="$(python -c 'import pathlib, zmq; matches = list((pathlib.Path(zmq.__file__).parent.parent / "pyzmq.libs").glob("libzmq-*.so.*")); assert len(matches) == 1, matches; print(matches[0])')"
          python rust/tools/check_interrupted_send.py --logging "$fault_root/bin/logging_probe" --stats "$fault_root/bin/stats_producer" --preload "$fault_root/send-preload.so" --python-zmq "$python_zmq" --output "$fault_root/producers"
          python rust/tools/check_uploader_interrupted.py --binary "$fault_root/bin/openpilot-uploader" --output "$fault_root/uploader"
      - name: Retain raw support runtime and Params build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-support-runtime-evidence
          path: |
            ${{ runner.temp }}/support-runtime/
            ${{ runner.temp }}/support-params-binding/commands.json
            ${{ runner.temp }}/support-params-binding/provenance.json
  telemetry-runtime:
    name: rust telemetry runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq5
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 sentry-sdk==2.55.0 zstandard==0.25.0
      - name: Configure original telemetry IPC imports
