            rust/target/release/openpilot-uploader
            rust/target/release/openpilot-dashcam-upload
            rust/target/release/journald-rs
            rust/target/release/openpilot-timed
            ${{ runner.temp }}/deleter-reference/report.json
            ${{ runner.temp }}/deleter-native/*.json
            ${{ runner.temp }}/deleter-native/*.log
            rust/target/release/openpilot-proclogd
            rust/target/release/openpilot-proclogd-runtime
            rust/target/release/openpilot-dmonitoringd
            ${{ runner.temp }}/dmonitoring-daemon/**/report.json
            ${{ runner.temp }}/dmonitoring-daemon/**/*.log
            ${{ runner.temp }}/proclog-runtime/**/*.json
            ${{ runner.temp }}/proclog-runtime/**/*.log
            ${{ runner.temp }}/proclog-runtime/**/*.capnp
            rust/target/release/openpilot-torqued
            ${{ runner.temp }}/torque-*/report.json
