      - name: Check process-stat parser allocation regression
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 64
          rustc --edition=2021 tools/proc_stat_allocation_probe.rs -o "$RUNNER_TEMP/proc-stat-allocation"
          "$RUNNER_TEMP/proc-stat-allocation"
          cargo build --locked -p openpilot-log-format
          rustc --edition=2021 tools/json_view_allocation_probe.rs --extern openpilot_log_format=target/debug/libopenpilot_log_format.rlib -L dependency=target/debug/deps -o "$RUNNER_TEMP/json-view-allocation"
