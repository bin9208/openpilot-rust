          MIRIFLAGS='-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.01' cargo +nightly-2026-09-29 miri test --manifest-path rust/Cargo.toml -p openpilot-controlsd --lib --test state --locked
