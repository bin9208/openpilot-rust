name: Rust port
on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: rust checks
    needs: [model-memory, model-pipelines]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '2'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_RUN_BINARY: ${{ github.workspace }}/rust/target/debug/model-run
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require model memory and pipeline validation
        env:
          MEMORY: ${{ needs.model-memory.result }}
          PIPELINES: ${{ needs.model-pipelines.result }}
        run: |
          test "$MEMORY" = success
          test "$PIPELINES" = success
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang libllvm18 git-lfs
      - run: python -m pip install numpy==2.4.6 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Compare QCOM fixtures with the original argument and packet encoder
        run: python tools/qcom_fixtures.py --verify crates/model-runtime/tests/fixtures/qcom
      - name: Compare captured graphs and original camera warps with Rust
        run: python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=tools/tests tools/tests -q
      - name: Fetch the pinned model from this independent repository
        run: git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''
      - name: Compare actual models and recurrent policy with Rust
        run: |
          python tools/check_model_reference.py --model ../openpilot/selfdrive/modeld/models/dmonitoring_model.onnx --output "$RUNNER_TEMP/dm-native" --binary target/debug/model-run
          python tools/check_model_reference.py --model ../openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output "$RUNNER_TEMP/driving-native" --binary target/debug/model-run
          python tools/check_policy_reference.py --model ../openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output "$RUNNER_TEMP/policy-native" --binary target/debug/model-run
      - run: python tools/check_reference.py
      - run: cargo build --workspace --examples --locked
      - run: python tools/check_proclog_reference.py
      - run: python tools/check_params_reference.py
      - run: python tools/build_msgq_python.py --output "$RUNNER_TEMP/rust-msgq-python"
      - name: Run the actual Python consumer against the bounded Rust producer
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/device_probe.py \
            --binary target/debug/openpilot-proclogd --frames 3 --interval-ms 100 --report "$RUNNER_TEMP/host-probe.json"
      - run: python tools/check_msgq_sanitizers.py --target-dir "$RUNNER_TEMP/rust-msgq-asan"
      - run: cargo build --workspace --release --locked
      - run: target/release/cpu-sample 1000 > cpu-sample.tsv
      - uses: actions/upload-artifact@v6
        with:
          name: rust-linux-x86_64
          path: |
            rust/target/release/cpu-sample
            rust/target/release/openpilot-proclogd
            ${{ runner.temp }}/host-probe.json
            ${{ runner.temp }}/dm-native/report.json
            ${{ runner.temp }}/driving-native/report.json
            ${{ runner.temp }}/policy-native/report.json
  model-pipelines:
    name: rust original model pipelines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y clang libllvm18 git-lfs
      - run: python -m pip install numpy==2.4.6 zstandard==0.25.0
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-model-runtime --bins --locked
      - run: git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''
      - name: Compile the original grouped driving and driver artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/original-models"
          python openpilot/selfdrive/modeld/compile_modeld.py --model-size 512x256 --camera-resolutions 1928x1208 1344x760 --frame-skip 4 --onnx openpilot/selfdrive/modeld/models/driving_supercombo.onnx --output "$RUNNER_TEMP/original-models/driving_tinygrad.pkl"
          python tinygrad_repo/examples/openpilot/compile3.py openpilot/selfdrive/modeld/models/dmonitoring_model.onnx "$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl"
          python openpilot/selfdrive/modeld/get_model_metadata.py openpilot/selfdrive/modeld/models/dmonitoring_model.onnx
          cp openpilot/selfdrive/modeld/models/dmonitoring_model_metadata.pkl "$RUNNER_TEMP/original-models/"
          for resolution in 1928x1208 1344x760; do
            python openpilot/selfdrive/modeld/compile_dm_warp.py --camera-resolution "$resolution" --warp-to 1440x960 --output "$RUNNER_TEMP/original-models/dm_warp_${resolution}_tinygrad.pkl"
          done
      - name: Build and validate immutable native pipeline catalog
        run: |
          python rust/tools/build_model_pipelines.py --trusted-model-directory "$RUNNER_TEMP/original-models" --backend cpu --output "$RUNNER_TEMP/native-catalog"
          rust/target/debug/model-run --check-catalog "$RUNNER_TEMP/native-catalog"
      - name: Compare both camera resolutions including prepare-only and recurrent turnover
        run: |
          for resolution in '1928 1208' '1344 760'; do
            set -- $resolution
            python rust/tools/check_pipeline_reference.py --trusted-driving "$RUNNER_TEMP/original-models/driving_tinygrad.pkl" --resolution "$1" "$2" --output "$RUNNER_TEMP/road-pipeline-$1" --binary rust/target/debug/model-run --frames 128
            python rust/tools/check_pipeline_reference.py --trusted-driver "$RUNNER_TEMP/original-models/dmonitoring_model_tinygrad.pkl" --trusted-warp "$RUNNER_TEMP/original-models/dm_warp_${1}x${2}_tinygrad.pkl" --trusted-metadata "$RUNNER_TEMP/original-models/dmonitoring_model_metadata.pkl" --resolution "$1" "$2" --output "$RUNNER_TEMP/dm-pipeline-$1" --binary rust/target/debug/model-run --frames 3
          done
      - uses: actions/upload-artifact@v6
        with:
          name: rust-original-pipeline-comparison
          path: |
            ${{ runner.temp }}/road-pipeline-*/report.json
            ${{ runner.temp }}/dm-pipeline-*/report.json
            ${{ runner.temp }}/native-catalog/current.json
  model-memory:
    name: rust model memory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri,rust-src
      - name: Check Rust allocation and aliasing on ARM with Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1 -Zmiri-backtrace=full
        run: cargo +nightly-2026-09-29 miri test -p openpilot-model-runtime --lib --test graph --locked --no-default-features --target aarch64-unknown-linux-gnu
      - name: Check Rust allocation and aliasing with Tree Borrows
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1 -Zmiri-backtrace=full
        run: cargo +nightly-2026-09-29 miri test -p openpilot-model-runtime --lib --test graph --locked --no-default-features --target aarch64-unknown-linux-gnu
      - name: Check the real Rust and C kernel boundary with ASan
        env:
          MODEL_TEST_ASAN: '1'
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
        run: cargo +nightly-2026-09-29 test -p openpilot-model-runtime --test cpu --locked -Zbuild-std --target x86_64-unknown-linux-gnu
  arm64:
    name: rust aarch64 build
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu capnproto libcapnp-dev qemu-user-static
      - name: Build generic Linux aarch64 artifact (not AGNOS validation)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu
          cargo build --workspace --release --locked --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/cpu-sample
      - name: Build and inspect the static C3X probe candidate
        working-directory: rust
        run: |
          python -m pip install cargo-zigbuild==0.23.4 ziglang==0.16.0 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-musl
          cargo zigbuild --workspace --release --locked --target aarch64-unknown-linux-musl
          python tools/build_msgq_python.py --output "$RUNNER_TEMP/rust-msgq-python"
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/check_aarch64.py \
            --binary target/aarch64-unknown-linux-musl/release/openpilot-proclogd \
            --runner /usr/bin/qemu-aarch64-static --report "$RUNNER_TEMP/aarch64-probe.json"
          mkdir -p target/c3x-probe
          cp target/aarch64-unknown-linux-musl/release/openpilot-proclogd target/c3x-probe/
          git rev-parse HEAD > target/c3x-probe/SOURCE_COMMIT
          cp "$RUNNER_TEMP/aarch64-probe.json" target/c3x-probe/
          cd target/c3x-probe
          sha256sum openpilot-proclogd SOURCE_COMMIT aarch64-probe.json > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: rust-c3x-static-probe-pending-device-test
          path: rust/target/c3x-probe/
      - uses: actions/upload-artifact@v6
        with:
          name: rust-linux-aarch64-not-device-validated
          path: rust/target/aarch64-unknown-linux-gnu/release/cpu-sample
