        run: cargo +nightly-2026-09-29 test -p openpilot-calibrationd --test parameters --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: Check Jetlink native signal, socket and FunctionFS fixture boundaries with ASan
        env:
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
        run: cargo +nightly-2026-09-29 test -p openpilot-jetlink --lib --test socket --test runtime --test ffs --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: Check the real Rust and C kernel boundary with ASan
        env:
          MODEL_TEST_ASAN: '1'
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
        run: cargo +nightly-2026-09-29 test -p openpilot-model-runtime --test cpu --locked -Zbuild-std --target x86_64-unknown-linux-gnu
  arm64:
    name: rust aarch64 build
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu capnproto libcapnp-dev qemu-user-static clang libclang-dev make
      - name: Build pinned external FFmpeg for generic aarch64 GNU linking
        run: python rust/tools/build_loggerd_ffmpeg.py --root "$RUNNER_TEMP/logger-ffmpeg-gnu" --cc aarch64-linux-gnu-gcc --ar aarch64-linux-gnu-ar --ranlib aarch64-linux-gnu-ranlib
      - name: Build generic Linux aarch64 artifact (not AGNOS validation)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          FFMPEG_DIR: ${{ runner.temp }}/logger-ffmpeg-gnu/install
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu
          cargo build --workspace --release --locked --features openpilot-loggerd/static-ffmpeg --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/cpu-sample
      - name: Stage native GNU aarch64 torque dependency (not AGNOS validation)
        working-directory: rust
        run: |
          python -m pip download --only-binary=:all: --no-deps --platform manylinux_2_27_aarch64 --python-version 312 --abi cp312 numpy==2.5.3 --dest "$RUNNER_TEMP/torque-arm-wheels"
          python tools/stage_torque_numerics.py --wheel "$RUNNER_TEMP"/torque-arm-wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/torque-arm-numerics"
      - name: Cross-build the original VisionIPC ION boundary (not device execution)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p openpilot-dmonitoringmodeld --features visionipc-ion --locked --target aarch64-unknown-linux-gnu
      - name: Build and inspect the static C3X probe candidate
        working-directory: rust
        run: |
          python -m pip install cargo-zigbuild==0.23.4 ziglang==0.16.0 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-musl
          python tools/build_loggerd_ffmpeg.py --root "$RUNNER_TEMP/logger-ffmpeg-musl" --cc 'python-zig cc -target aarch64-linux-musl' --ar 'python-zig ar' --ranlib 'python-zig ranlib'
          FFMPEG_DIR="$RUNNER_TEMP/logger-ffmpeg-musl/install" cargo zigbuild --workspace --release --locked --features openpilot-loggerd/static-ffmpeg --target aarch64-unknown-linux-musl
          python tools/build_msgq_python.py --output "$RUNNER_TEMP/rust-msgq-python"
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/check_aarch64.py \
            --binary target/aarch64-unknown-linux-musl/release/openpilot-proclogd \
            --runner /usr/bin/qemu-aarch64-static --report "$RUNNER_TEMP/aarch64-probe.json"
          mkdir -p target/c3x-probe
          cp target/aarch64-unknown-linux-musl/release/openpilot-proclogd target/c3x-probe/
          git rev-parse HEAD > target/c3x-probe/SOURCE_COMMIT
          cp "$RUNNER_TEMP/aarch64-probe.json" target/c3x-probe/
          cd target/c3x-probe
          sha256sum openpilot-proclogd SOURCE_COMMIT aarch64-probe.json > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: rust-c3x-static-probe-pending-device-test
          path: rust/target/c3x-probe/
      - uses: actions/upload-artifact@v6
        with:
          name: rust-linux-aarch64-not-device-validated
          path: |
            rust/target/aarch64-unknown-linux-gnu/release/cpu-sample
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-uploader
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-dashcam-upload
            rust/target/aarch64-unknown-linux-gnu/release/journald-rs
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-timed
            rust/target/aarch64-unknown-linux-musl/release/openpilot-uploader
            rust/target/aarch64-unknown-linux-musl/release/openpilot-dashcam-upload
            rust/target/aarch64-unknown-linux-musl/release/journald-rs
            rust/target/aarch64-unknown-linux-musl/release/openpilot-timed
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-calibrationd
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-loggerd
            rust/target/aarch64-unknown-linux-musl/release/openpilot-loggerd
            ${{ runner.temp }}/logger-ffmpeg-gnu/invocation.json
            ${{ runner.temp }}/logger-ffmpeg-gnu/build.log
            ${{ runner.temp }}/logger-ffmpeg-gnu/ffmpeg-6.1.1/COPYING.LGPLv2.1
            ${{ runner.temp }}/logger-ffmpeg-gnu/ffmpeg-6.1.1/LICENSE.md
            ${{ runner.temp }}/logger-ffmpeg-musl/invocation.json
            ${{ runner.temp }}/logger-ffmpeg-musl/build.log
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-torqued
            ${{ runner.temp }}/torque-arm-numerics/
            rust/target/aarch64-unknown-linux-gnu/release/jetlinkd-rs

  web-upload-timeouts:
    name: active upload timeout contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++
      - run: python -m pip install aiohttp==3.13.3 anyio==4.12.1 requests==2.34.2
      - run: cargo build --manifest-path rust/Cargo.toml -p openpilot-web-upload --examples --locked
      - name: Verify unscaled total, socket and retry deadlines against source
        run: python rust/tools/check_web_upload_timeouts.py --binary rust/target/debug/examples/web_upload_trace --output "$RUNNER_TEMP/web-upload-timeouts"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: active-upload-timeout-evidence
          path: ${{ runner.temp }}/web-upload-timeouts/**
