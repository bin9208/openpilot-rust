  carrot-man-runtime:
    name: rust CarrotMan owner (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARROT_EXCEPTION_DISCORD_WEBHOOK_DISABLE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve runner capacity and install pinned dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y g++ clang cmake pkg-config libzmq3-dev capnproto libcapnp-dev
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0 requests==2.34.2 aiohttp==3.13.3 psutil==7.2.2 pytest==9.0.2
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal
      - name: Stage exact optional GEOS provider
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128
          python -m pip download --only-binary=:all: --no-deps shapely==2.1.2 --dest "$RUNNER_TEMP/carrot-man-wheels"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128
          python rust/tools/carrot_man_stage_geos.py --wheel "$RUNNER_TEMP"/carrot-man-wheels/shapely-2.1.2-*.whl --output "$RUNNER_TEMP/carrot-man-geos"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128
          python -m pip install --no-deps "$RUNNER_TEMP"/carrot-man-wheels/shapely-2.1.2-*.whl
          cat "$RUNNER_TEMP/carrot-man-geos/environment.txt" >> "$GITHUB_ENV"
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build owner and unchanged source bindings
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-man --bins --examples --locked
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/carrot-man-params"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/carrot-man-msgq"
          python -c 'from pathlib import Path; import os; print("CARROT_PARAMS_BINDING="+str(next((Path(os.environ["RUNNER_TEMP"])/"carrot-man-params").glob("params_pyx*.so"))))' >> "$GITHUB_ENV"
      - name: Compare affected original policy, cereal and time boundaries
        if: matrix.arch == 'x86_64'
        run: |
          python rust/tools/carrot_man_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence "$RUNNER_TEMP/carrot-man-policy"
          python rust/tools/carrot_man_serv_compare.py --binary rust/target/debug/examples/carrot_man_trace --params-binding "$CARROT_PARAMS_BINDING" --evidence "$RUNNER_TEMP/carrot-man-policy"
          python rust/tools/carrot_man_ingress_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence "$RUNNER_TEMP/carrot-man-policy"
          python rust/tools/carrot_man_time_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence "$RUNNER_TEMP/carrot-man-policy"
      - name: Compare actual owned Params, IPC, sockets and upload recipients
        run: |
          export PYTHONPATH="$RUNNER_TEMP/carrot-man-msgq:$GITHUB_WORKSPACE/rust/tools:$PYTHONPATH"
          python -P -m unittest discover -s rust/tools/tests -p test_carrot_man_fixture_ports.py
          python -P -m pytest -c /dev/null --noconftest -p no:cacheprovider rust/tools/test_carrot_man_fixture_inputs.py -q --basetemp "$RUNNER_TEMP/carrot-man-input-tests"
          python -P rust/tools/carrot_man_owned_compare.py --binary rust/target/debug/examples/carrot_man_owned --params-binding "$CARROT_PARAMS_BINDING" --evidence "$RUNNER_TEMP/carrot-man-owned"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: carrot-man-owner-${{ matrix.arch }}-evidence
          path: |
            ${{ runner.temp }}/carrot-man-policy/**
            ${{ runner.temp }}/carrot-man-owned/**
            ${{ runner.temp }}/carrot-man-input-tests/**
            ${{ runner.temp }}/carrot-man-geos/**
            rust/target/debug/openpilot-carrot-man
  webrtc-runtime:
    name: rust WebRTC source runtime (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARROT_EXCEPTION_DISCORD_WEBHOOK_DISABLE: '1'
      PYTHONPATH: ${{ github.workspace }}/rust/tools:${{ github.workspace }}:${{ github.workspace }}/teleoprtc_repo:${{ github.workspace }}/opendbc_repo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve capacity and install pinned source and native providers
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update
          sudo apt-get install -y g++ clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev ffmpeg 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*'
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install -r rust/tools/webrtc_source_requirements.txt
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          mkdir -p "$RUNNER_TEMP/webrtc"
          git rev-parse HEAD > "$RUNNER_TEMP/webrtc/SOURCE_COMMIT"
          uname -m > "$RUNNER_TEMP/webrtc/machine.txt"
          python -m pip freeze > "$RUNNER_TEMP/webrtc/python-packages.txt"
          dpkg-query -W libavcodec-dev libavformat-dev libavutil-dev libvpx9 libx264-164 > "$RUNNER_TEMP/webrtc/native-packages.txt"
          test "$(pkg-config --modversion libavcodec)" = 60.31.102
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/webrtc/encoders.txt" 2>&1
          grep -q 'libvpx ' "$RUNNER_TEMP/webrtc/encoders.txt"
          grep -q 'libx264 ' "$RUNNER_TEMP/webrtc/encoders.txt"
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build unchanged original Params and msgq bindings
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/webrtc/params"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/webrtc/msgq"
          python -P -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"webrtc/params/provenance.json"; print("WEBRTC_PARAMS_BINDING="+json.loads(p.read_text())["module"])' >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s/webrtc/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Compile and check both native service entrypoints
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo build --manifest-path rust/Cargo.toml -p openpilot-webrtc --features native --bins --example webrtc_owned_http --example webrtc_stun_checks --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-webrtc --features native --lib --locked
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-webrtc --features native --all-targets --locked -- -D warnings
          file rust/target/debug/openpilot-webrtcd rust/target/debug/openpilot-carrot-webrtcd > "$RUNNER_TEMP/webrtc/elf.txt"
          sha256sum rust/target/debug/openpilot-webrtcd rust/target/debug/openpilot-carrot-webrtcd rust/target/debug/examples/webrtc_owned_http rust/target/debug/examples/webrtc_stun_checks > "$RUNNER_TEMP/webrtc/SHA256SUMS"
      - name: Compare real ownership, media, HTTP and failure boundaries
        run: |
          rust/target/debug/examples/webrtc_stun_checks > "$RUNNER_TEMP/webrtc/stun-checks.json"
          python -P rust/tools/webrtc_identifiers_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/identifiers"
          python -P rust/tools/webrtc_multicamera_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/multicamera"
          python -P rust/tools/webrtc_fir_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/fir"
          python -P rust/tools/webrtc_debug_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/debug-h264" source-standard-h264 native-standard-h264
          python -P rust/tools/webrtc_body_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/body"
          python -P rust/tools/webrtc_params_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/params-ownership" "$WEBRTC_PARAMS_BINDING"
          python -P rust/tools/webrtc_cli_compare.py "$PWD/rust/target/debug" "$RUNNER_TEMP/webrtc/cli"
          python -P rust/tools/webrtc_srflx_compare.py "$PWD/rust/target/debug/examples/webrtc_owned_http" "$RUNNER_TEMP/webrtc/srflx"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-webrtc-${{ matrix.runner }}-evidence
          path: |
            ${{ runner.temp }}/webrtc/
            rust/target/debug/openpilot-webrtcd
            rust/target/debug/openpilot-carrot-webrtcd
            rust/target/debug/examples/webrtc_owned_http
            rust/target/debug/examples/webrtc_stun_checks
  workspace:
    name: rust workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '2'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_RUN_BINARY: ${{ github.workspace }}/rust/target/debug/model-run
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Reserve capacity for workspace validation
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 12288
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang libllvm18 git-lfs libclang-dev libavcodec-dev libavformat-dev libavutil-dev ffmpeg libsdl2-2.0-0 cmake qemu-user-static libc6-arm64-cross libstdc++6-arm64-cross strace
      - name: Stage independently captured LLVM provider
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$RUNNER_TEMP" --growth-mib 256
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm18.deb" https://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-18/libllvm18_18.1.3-1ubuntu1_amd64.deb
          printf 'af6197096ce3b89aab86de59f01c1b5feb008b2ae1514a03906c0664edb8b0b1  %s/llvm18.deb\n' "$RUNNER_TEMP" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/llvm18.deb" "$RUNNER_TEMP/llvm18-captured"
          printf '5c3a63957e28c15cdf1503892074f032d29b72e36a9824a77dfa87e48a0dafb0  %s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" | sha256sum --check --strict
          printf 'LLVM_PATH=%s/llvm18-captured/usr/lib/llvm-18/lib/libLLVM.so.1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 onnx==1.20.1 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2 pyzmq==27.2.0 requests==2.34.2 aiohttp==3.13.3 anyio==4.12.1 PyJWT==2.15.1 cryptography==50.0.1 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3
      - name: Stage pinned native startup UI headers
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          cargo +1.94.0 run --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" -p openpilot-dev-tools --locked --bin stage-startup-ui-raylib -- --arch x86_64 --output "$RUNNER_TEMP/startup-raylib-host"
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/startup-raylib-host\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Reject incomplete or invalid native runtime packages
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo test -p openpilot-dev-tools --locked --test seal_runtime --test package --test publish --test runtime_bootstrap
          python -m pytest -c /dev/null -p no:cacheprovider --confcutdir=tools/tests -q tools/tests/test_offline_qcom_publish.py
      - name: Install source-pinned Eigen headers
        run: |
          python -m pip install 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
          python -c 'import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR)' >> "$GITHUB_ENV"
      - run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          cargo clippy --workspace --all-targets --locked --config profile.test.package.sha2.opt-level=3 --config profile.dev.package.sha2.opt-level=3 -- -D warnings
      - name: Stage pinned numerical dependency before required workspace tests
        run: |
          python -m pip download --only-binary=:all: --no-deps numpy==2.5.3 --dest "$RUNNER_TEMP/torque-wheels"
          cargo run --locked -p openpilot-dev-tools --bin stage-torque-numerics -- --wheel "$RUNNER_TEMP"/torque-wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/torque-numerics"
          printf 'CONTROLS_NUMERICS=%s/torque-numerics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch the pinned model before native compiler corpus validation
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 128
          git lfs pull --include=openpilot/selfdrive/modeld/models/driving_supercombo.onnx --exclude=''
      - name: Generate runner-local Hyundai source fixtures
        run: |
          python tools/stage_card_fixtures.py --fixtures "$RUNNER_TEMP/card-workspace/fixtures" --dbc "$RUNNER_TEMP/card-workspace/dbc"
          printf 'HYUNDAI_FIXTURE_DIR=%s/card-workspace/fixtures\nHYUNDAI_DBC_DIR=%s/card-workspace/dbc\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
