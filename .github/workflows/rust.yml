      - name: Run the actual Python consumer against the bounded Rust producer
        run: |
          PYTHONPATH="$RUNNER_TEMP/rust-msgq-python:$GITHUB_WORKSPACE" python tools/device_probe.py \
            --binary target/debug/openpilot-proclogd --frames 3 --interval-ms 100 --report "$RUNNER_TEMP/host-probe.json"
      - run: python tools/check_msgq_sanitizers.py --target-dir "$RUNNER_TEMP/rust-msgq-asan"
      - run: cargo build --workspace --release --locked
      - run: target/release/cpu-sample 1000 > cpu-sample.tsv
      - uses: actions/upload-artifact@v6
        with:
