          python rust/tools/check_navd_engine.py --binary rust/target/debug/examples/navd_engine --binding "$NAVD_PARAMS_BINDING" --output "$RUNNER_TEMP/navd-native/engine"
          python rust/tools/check_navd_http.py --binary rust/target/debug/examples/navd_http --output "$RUNNER_TEMP/navd-native/http" --timeouts
          python rust/tools/check_navd_config.py --binary rust/target/debug/examples/navd_config --binding "$NAVD_PARAMS_BINDING" --output "$RUNNER_TEMP/navd-native/config"
          python rust/tools/check_navd_destination.py --binary rust/target/debug/openpilot-set-destination --binding "$NAVD_PARAMS_BINDING" --output "$RUNNER_TEMP/navd-native/destination"
      - name: Compare actual navigation IPC, restart timers and signal lifecycle
        run: python rust/tools/check_navd_ipc.py --binary rust/target/debug/openpilot-navd --binding "$NAVD_PARAMS_BINDING" --output "$RUNNER_TEMP/navd-native/ipc"
      - name: Preserve navigation source, wire and executable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-navd-host-evidence
          path: |
            ${{ runner.temp }}/navd-native/
            rust/target/debug/openpilot-navd
            rust/target/debug/openpilot-set-destination
            rust/target/debug/examples/navd_*
          if-no-files-found: warn
