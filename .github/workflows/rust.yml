name: Rust port
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: rust checks
    needs: [workspace, model-memory, model-pipelines, logger-runtime, support-runtime, telemetry-runtime, startup-runtime, hardware-runtime, platform-runtime, startup-services, sensor-audio, gnss-runtime, estimation-runtime, ui-connectivity, athena-runtime, controls-runtime, web-upload-timeouts, joystickd-runtime, planner-runtime, planner-memory, card-runtime, radar-runtime, radar-arm, radar-memory, navd-runtime, radard-runtime, carrot-navi-runtime, carrot-navi-arm, selfdrive-runtime, panda-runtime, camera-runtime, encoder-runtime, xiaoge-runtime, xiaoge-memory, ui-runtime, carrot-man-runtime, webrtc-runtime, webcam-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require runtime validation
        env:
          WORKSPACE: ${{ needs.workspace.result }}
          MEMORY: ${{ needs.model-memory.result }}
          PIPELINES: ${{ needs.model-pipelines.result }}
          LOGGER: ${{ needs.logger-runtime.result }}
          SUPPORT: ${{ needs.support-runtime.result }}
          TELEMETRY: ${{ needs.telemetry-runtime.result }}
          STARTUP: ${{ needs.startup-runtime.result }}
          HARDWARE: ${{ needs.hardware-runtime.result }}
          PLATFORM: ${{ needs.platform-runtime.result }}
          STARTUP_SERVICES: ${{ needs.startup-services.result }}
          SENSOR_AUDIO: ${{ needs.sensor-audio.result }}
          GNSS: ${{ needs.gnss-runtime.result }}
          ESTIMATION: ${{ needs.estimation-runtime.result }}
          UI_CONNECTIVITY: ${{ needs.ui-connectivity.result }}
          ATHENA: ${{ needs.athena-runtime.result }}
          CONTROLS: ${{ needs.controls-runtime.result }}
          UPLOAD_TIMEOUTS: ${{ needs.web-upload-timeouts.result }}
          JOYSTICKD: ${{ needs.joystickd-runtime.result }}
          CARROT_MAN: ${{ needs.carrot-man-runtime.result }}
          WEBRTC: ${{ needs.webrtc-runtime.result }}
          WEBCAM: ${{ needs.webcam-runtime.result }}
          PLANNER: ${{ needs.planner-runtime.result }}
          PLANNER_MEMORY: ${{ needs.planner-memory.result }}
          CARD: ${{ needs.card-runtime.result }}
          RADAR: ${{ needs.radar-runtime.result }}
          RADAR_ARM: ${{ needs.radar-arm.result }}
          RADAR_MEMORY: ${{ needs.radar-memory.result }}
          NAVD: ${{ needs.navd-runtime.result }}
          RADARD: ${{ needs.radard-runtime.result }}
          CARROT_NAVI: ${{ needs.carrot-navi-runtime.result }}
          CARROT_NAVI_ARM: ${{ needs.carrot-navi-arm.result }}
          SELFDRIVE: ${{ needs.selfdrive-runtime.result }}
          PANDA: ${{ needs.panda-runtime.result }}
          CAMERA: ${{ needs.camera-runtime.result }}
          ENCODER: ${{ needs.encoder-runtime.result }}
          XIAOGE: ${{ needs.xiaoge-runtime.result }}
          XIAOGE_MEMORY: ${{ needs.xiaoge-memory.result }}
          UI_RUNTIME: ${{ needs.ui-runtime.result }}
        run: |
          test "$WORKSPACE" = success
          test "$MEMORY" = success
          test "$PIPELINES" = success
          test "$LOGGER" = success
          test "$SUPPORT" = success
          test "$TELEMETRY" = success
          test "$STARTUP" = success
          test "$HARDWARE" = success
          test "$PLATFORM" = success
          test "$STARTUP_SERVICES" = success
          test "$SENSOR_AUDIO" = success
          test "$GNSS" = success
          test "$ESTIMATION" = success
          test "$UI_CONNECTIVITY" = success
          test "$ATHENA" = success
          test "$CONTROLS" = success
          test "$UPLOAD_TIMEOUTS" = success
          test "$JOYSTICKD" = success
          test "$CARROT_MAN" = success
          test "$WEBRTC" = success
          test "$WEBCAM" = success
          test "$PLANNER" = success
          test "$PLANNER_MEMORY" = success
          test "$CARD" = success
          test "$RADAR" = success
          test "$RADAR_ARM" = success
          test "$RADAR_MEMORY" = success
          test "$NAVD" = success
          test "$RADARD" = success
          test "$CARROT_NAVI" = success
          test "$CARROT_NAVI_ARM" = success
          test "$SELFDRIVE" = success
          test "$PANDA" = success
          test "$CAMERA" = success
          test "$ENCODER" = success
          test "$XIAOGE" = success
          test "$XIAOGE_MEMORY" = success
          test "$UI_RUNTIME" = success
  webcam-runtime:
    name: rust webcam source runtime (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARROT_EXCEPTION_DISCORD_WEBHOOK_DISABLE: '1'
      PYTHONPATH: ${{ github.workspace }}/rust/tools:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install exact source closure and native capture providers
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update
          sudo apt-get install -y g++ clang-18 libclang-18-dev cmake pkg-config capnproto libcapnp-dev libzmq3-dev 'libavcodec-dev=7:6.1.1-*' 'libavformat-dev=7:6.1.1-*' 'libavutil-dev=7:6.1.1-*' 'libswscale-dev=7:6.1.1-*'
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install -r rust/tools/webcam_source_requirements.txt
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          mkdir -p "$RUNNER_TEMP/webcam"
          git rev-parse HEAD > "$RUNNER_TEMP/webcam/SOURCE_COMMIT"
          uname -m > "$RUNNER_TEMP/webcam/machine.txt"
          python -m pip freeze > "$RUNNER_TEMP/webcam/python-packages.txt"
          dpkg-query -W libavcodec-dev libavformat-dev libavutil-dev libswscale-dev > "$RUNNER_TEMP/webcam/native-packages.txt"
          test "$(pkg-config --modversion libavcodec)" = 60.31.102
          test "$(pkg-config --modversion libswscale)" = 7.5.100
      - name: Build pinned hardened videoio and unchanged source IPC bindings
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo +1.94.0 run --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --bin build-xiaoge-opencv -- --prepare-only --output "$RUNNER_TEMP/webcam-opencv-source"
          cargo +1.94.0 run --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --bin build-webcam-opencv -- --source "$RUNNER_TEMP/webcam-opencv-source/opencv-fe38fc608f6acb8b68953438a62305d8318f4fcd" --output "$RUNNER_TEMP/webcam/provider" --growth-mib 4096
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
          python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/webcam/binding"
          printf 'OPENPILOT_WEBCAM_OPENCV_ROOT=%s/webcam/provider\nLD_LIBRARY_PATH=%s/webcam/provider/install/lib\nPYTHONPATH=%s/webcam/binding:%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build native daemon and check all webcam targets
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo build --manifest-path rust/Cargo.toml -p openpilot-webcam --features native --bins --examples --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-webcam --features native --lib --locked
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-webcam --features native --all-targets --locked -- -D warnings
          cc -shared -fPIC -std=c11 -Wall -Wextra -Werror -O2 rust/tools/webcam_owned_open.c -ldl -o "$RUNNER_TEMP/webcam/owned-open.so"
          c++ -shared -fPIC -std=c++17 -Wall -Wextra -Werror -O2 -I"$OPENPILOT_WEBCAM_OPENCV_ROOT/install/include/opencv4" rust/tools/webcam_capture_fault.cc -ldl -o "$RUNNER_TEMP/webcam/capture-fault.so"
          file rust/target/debug/openpilot-webcam > "$RUNNER_TEMP/webcam/elf.txt"
          sha256sum rust/target/debug/openpilot-webcam rust/target/debug/examples/webcam_trace rust/target/debug/examples/webcam_workers > "$RUNNER_TEMP/webcam/SHA256SUMS"
      - name: Compare actual pixels, independent workers, IPC and Linux entrypoints
        run: |
          python -P rust/tools/webcam_camera_compare.py "$PWD/rust/target/debug/examples/webcam_trace" "$RUNNER_TEMP/webcam/pixels" --reserve-mib 512
          python -P rust/tools/webcam_worker_compare.py "$RUNNER_TEMP/webcam/source-workers" --cases unequal-eof odd-worker unavailable-worker odd-height unaligned-even --reserve-mib 512
          python -P rust/tools/webcam_worker_compare.py "$RUNNER_TEMP/webcam/native-workers" --native "$PWD/rust/target/debug/examples/webcam_workers" --source "$RUNNER_TEMP/webcam/source-workers" --cases unequal-eof odd-worker unavailable-worker odd-height unaligned-even --reserve-mib 512
          python -P rust/tools/webcam_cli_compare.py "$RUNNER_TEMP/webcam/linux-cli" --native "$PWD/rust/target/debug/openpilot-webcam" --shim "$RUNNER_TEMP/webcam/owned-open.so" --reserve-mib 512
          python -P rust/tools/webcam_capture_errors.py "$RUNNER_TEMP/webcam/errors" --trace "$PWD/rust/target/debug/examples/webcam_trace" --workers "$PWD/rust/target/debug/examples/webcam_workers" --fault-shim "$RUNNER_TEMP/webcam/capture-fault.so" --source "$RUNNER_TEMP/webcam/source-workers/unequal-eof" --reserve-mib 512
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-webcam-${{ matrix.runner }}-evidence
          path: |
            ${{ runner.temp }}/webcam/**/result.json
            ${{ runner.temp }}/webcam/**/*invocation.json
            ${{ runner.temp }}/webcam/**/*.log
            ${{ runner.temp }}/webcam/**/*.stdout
            ${{ runner.temp }}/webcam/**/*.stderr
            ${{ runner.temp }}/webcam/**/*.nv12
            ${{ runner.temp }}/webcam/**/*.bin
            ${{ runner.temp }}/webcam/*.txt
            ${{ runner.temp }}/webcam/SOURCE_COMMIT
            ${{ runner.temp }}/webcam/SHA256SUMS
            ${{ runner.temp }}/webcam/provider/receipt.json
            ${{ runner.temp }}/webcam/provider/native-libraries.sha256
            ${{ runner.temp }}/webcam/provider/source-files.json
            ${{ runner.temp }}/webcam/provider/licenses/
            ${{ runner.temp }}/webcam/provider/install/lib/
            ${{ runner.temp }}/webcam-opencv-source/source.json
            ${{ runner.temp }}/webcam-opencv-source/hardening.json
            rust/target/debug/openpilot-webcam
  planner-runtime:
    name: rust planner source comparison (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve capacity and install original planner dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang-18 libzmq3-dev
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.3.0 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3 pytest==9.0.2
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
          python -m pip download --only-binary=:all: --no-deps comma-deps-acados==0.2.2.post103 --dest "$RUNNER_TEMP/planner-wheel"
          python -m pip install --no-deps "$RUNNER_TEMP"/planner-wheel/*.whl
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          python -P -c 'import acados; from pathlib import Path; print("PLANNER_GENERATOR="+str(Path(acados.__file__).parent))' >> "$GITHUB_ENV"
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build pinned solvers and unchanged original bindings
        run: |
          planner_cc=gcc
          if [ "$(uname -m)" = aarch64 ]; then planner_cc=clang-18; fi
          python rust/tools/build_plannerd_acados.py --architecture "$(uname -m)" --cc "$planner_cc" --python "$(command -v python)" --acados "$PLANNER_GENERATOR" --wheel "$RUNNER_TEMP"/planner-wheel/*.whl --output "$RUNNER_TEMP/planner-artifact"
          python rust/tools/build_plannerd_source.py --artifact "$RUNNER_TEMP/planner-artifact" --python "$(command -v python)" --acados "$PLANNER_GENERATOR" --generator-wheel "$RUNNER_TEMP"/planner-wheel/*.whl --cc "$planner_cc" --output "$RUNNER_TEMP/planner-source"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/planner-original/params"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/planner-original/ipc"
          python -P -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"planner-original/params/provenance.json"; print("PLANNER_PARAMS_BINDING="+json.loads(p.read_text())["module"])' >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s/planner-original/ipc:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Compile and check the complete native planner
        run: |
          python -m pytest -c /dev/null --rootdir . --confcutdir=rust/tools/tests -q rust/tools/tests/test_plannerd_ci.py
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --target "$NATIVE_TOOLS_HOST" --test native_build_closure
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo test --manifest-path rust/Cargo.toml -p openpilot-plannerd --all-targets --locked
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo build --manifest-path rust/Cargo.toml -p openpilot-plannerd --bins --examples --locked
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-plannerd --all-targets --locked -- -D warnings
      - name: Compare exact policies, main loops, real IPC and lifecycle
        run: |
          python -P rust/tools/check_plannerd_ci.py --bin-dir rust/target/debug --artifact "$RUNNER_TEMP/planner-artifact" --source-native "$RUNNER_TEMP/planner-source" --binding "$PLANNER_PARAMS_BINDING" --output "$RUNNER_TEMP/planner-comparison"
      - name: Check generated C with ASan, UBSan and allocator leak detection
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python rust/tools/build_plannerd_acados.py --architecture x86_64 --cc gcc --sanitize --python "$(command -v python)" --acados "$PLANNER_GENERATOR" --wheel "$RUNNER_TEMP"/planner-wheel/*.whl --output "$RUNNER_TEMP/planner-sanitized"
          python -P rust/tools/check_plannerd_native_memory.py --bin-dir rust/target/debug --artifact "$RUNNER_TEMP/planner-sanitized" --source-native "$RUNNER_TEMP/planner-source" --binding "$PLANNER_PARAMS_BINDING" --asan-library "$(gcc -print-file-name=libasan.so)" --output "$RUNNER_TEMP/planner-native-memory"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-planner-${{ matrix.runner }}-evidence
          path: |
            ${{ runner.temp }}/planner-comparison/
            ${{ runner.temp }}/planner-native-memory/
            ${{ runner.temp }}/planner-artifact/
            ${{ runner.temp }}/planner-source/
            ${{ runner.temp }}/planner-sanitized/
            ${{ runner.temp }}/planner-original/params/*.json
            rust/target/debug/openpilot-plannerd
            rust/target/debug/examples/plannerd_*
  planner-memory:
    name: rust planner pure memory contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reserve capacity and prepare Miri
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          sudo apt-get update && sudo apt-get install -y capnproto
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install nightly-2026-09-29 --component miri --profile minimal
          cargo +nightly-2026-09-29 miri setup
      - name: Verify pure planner policies with four Miri modes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/planner-memory"
          for planner_mode in default strict preemption tree; do
            planner_flags='-Zmiri-no-extra-rounding-error'
            case "$planner_mode" in
              strict) planner_flags="$planner_flags -Zmiri-strict-provenance" ;;
              preemption) planner_flags="$planner_flags -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1" ;;
              tree) planner_flags="$planner_flags -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1 -Zmiri-tree-borrows" ;;
            esac
            "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
            MIRIFLAGS="$planner_flags" cargo +nightly-2026-09-29 miri test --manifest-path rust/Cargo.toml -p openpilot-plannerd --lib --tests --no-default-features --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/planner-memory/$planner_mode.log"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-planner-memory-evidence
          path: ${{ runner.temp }}/planner-memory/
  joystickd-runtime:
    name: rust control tools source and native runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ capnproto libcapnp-dev libzmq3-dev cmake
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 pytest==9.0.2 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 setproctitle==1.3.7 zstandard==0.25.0 requests==2.34.2 pyserial==3.5 inputs==0.5
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build joystickd and unchanged source boundary bindings
        run: |
          cargo build --manifest-path rust/Cargo.toml -p openpilot-control-tools -p openpilot-dev-tools --bins --examples --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-control-tools --locked
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/joystickd/params-binding"
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/joystickd/msgq-binding"
          python -c 'from pathlib import Path; import os; print("JOYSTICKD_PARAMS_BINDING=" + str(next((Path(os.environ["RUNNER_TEMP"]) / "joystickd/params-binding").glob("params_pyx*.so"))))' >> "$GITHUB_ENV"
      - name: Compare original control states and actual IPC lifecycle
        run: |
          export PYTHONPATH="$RUNNER_TEMP/joystickd/msgq-binding:$PYTHONPATH"
          python rust/tools/joystickd_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --output "$RUNNER_TEMP/joystickd/source"
          rust/target/debug/check-control-tools-policy --binary "$PWD/rust/target/debug/examples/joystickd_policy" --source "$RUNNER_TEMP/joystickd/source" --output "$RUNNER_TEMP/joystickd/compare"
          python rust/tools/check_joystickd_runtime.py --binary "$PWD/rust/target/debug/openpilot-joystickd" --binding "$JOYSTICKD_PARAMS_BINDING" --source "$RUNNER_TEMP/joystickd/source" --output "$RUNNER_TEMP/joystickd/runtime"
          python rust/tools/control_tools_policy_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --joystick-only --output "$RUNNER_TEMP/joystickd/input-source"
          rust/target/debug/check-control-tools-policy --binary "$PWD/rust/target/debug/examples/joystick_input_policy" --source "$RUNNER_TEMP/joystickd/input-source" --output "$RUNNER_TEMP/joystickd/input-compare"
          python rust/tools/check_joystick_input_runtime.py --binding "$JOYSTICKD_PARAMS_BINDING" --binary "$PWD/rust/target/debug/openpilot-joystick-control" --fixture "$PWD/rust/target/debug/examples/joystick_input_fixture" --output "$RUNNER_TEMP/joystickd/input-runtime"
          python rust/tools/longitudinal_maneuvers_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --output "$RUNNER_TEMP/joystickd/longitudinal-source"
          python rust/tools/check_longitudinal_maneuvers.py --binding "$JOYSTICKD_PARAMS_BINDING" --trace "$PWD/rust/target/debug/examples/longitudinal_maneuvers_trace" --daemon "$PWD/rust/target/debug/openpilot-longitudinal-maneuversd" --source "$RUNNER_TEMP/joystickd/longitudinal-source" --output "$RUNNER_TEMP/joystickd/longitudinal-runtime"
          python rust/tools/lateral_maneuvers_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --output "$RUNNER_TEMP/joystickd/lateral-source"
