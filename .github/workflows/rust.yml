      - name: Verify complete original Params and receiver imports
        run: |
          python -P -c 'import os; from pathlib import Path; from card_runtime_source import load_binding; load_binding(Path(os.environ["CARROT_NAVI_PARAMS_BINDING"])); from openpilot.common.params import Params; from openpilot.selfdrive.carrot.carrot_navi import main; print("original Params and receiver imports passed")'
      - name: Require bounded native package checks and executable
        run: |
          set -o pipefail
          cargo fmt --manifest-path rust/Cargo.toml -p openpilot-carrot-navi -- --check 2>&1 | tee "$RUNNER_TEMP/carrot-navi/fmt.log"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
