            --output "$RUNNER_TEMP/radard-native/source-availability-state" \
            2>&1 | tee "$RUNNER_TEMP/radard-native/logs/availability-state.log"
      - name: Compare independent actual IPC and signal lifecycle
        run: |
          set -euo pipefail
          set -x
          python -P rust/tools/radard_ipc.py --python "$(command -v python)" \
            --binary "$RADARD_BINARY" --binding "$RADARD_PARAMS_BINDING" \
            --output "$RUNNER_TEMP/radard-native/ipc" \
            2>&1 | tee "$RUNNER_TEMP/radard-native/logs/ipc.log"
          python -P rust/tools/radard_lifecycle.py --python "$(command -v python)" \
            --binary "$RADARD_BINARY" --binding "$RADARD_PARAMS_BINDING" \
            --output "$RUNNER_TEMP/radard-native/lifecycle" \
            2>&1 | tee "$RUNNER_TEMP/radard-native/logs/lifecycle.log"
      - name: Preserve bounded final binaries and their identities
        if: always()
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 256
          mkdir -p "$RUNNER_TEMP/radard-native/bin"
          for radard_binary in rust/target/debug/openpilot-radard rust/target/debug/examples/radard_*_trace rust/target/debug/examples/state_probe; do
            if [ -f "$radard_binary" ]; then
              cp "$radard_binary" "$RUNNER_TEMP/radard-native/bin/"
              sha256sum "$radard_binary" >> "$RUNNER_TEMP/radard-native/SHA256SUMS"
            fi
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-radard-${{ matrix.runner }}-not-device-validated
