name: Tablet ARM parallel build benchmark
run-name: Tablet ARM benchmark 1 / 2 / 4 jobs
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tablet-arm-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    name: Tab S9 native ARM build parallelism
    runs-on:
    - self-hosted
    - Linux
    - ARM64
    timeout-minutes: 30
    steps:
    - name: Verify tablet ownership and prepare missing tools
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_NAME" == bin-Arm-tablet ]]
        [[ "$(uname -m)" == aarch64 || "$(uname -m)" == arm64 ]]
        echo "Runner: $RUNNER_NAME; architecture: $(uname -m)"
        getconf _NPROCESSORS_ONLN || true
        if ! command -v python3 >/dev/null || ! command -v cargo >/dev/null || ! command -v rustc >/dev/null || ! command -v cc >/dev/null; then
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          [[ "$free_kib" -ge 1048576 ]]
          if [[ $(id -u) == 0 ]]; then
            apt=(apt-get)
          else
            apt=(sudo -n apt-get)
          fi
          export DEBIAN_FRONTEND=noninteractive
          "${apt[@]}" update -qq
          "${apt[@]}" install -y --no-install-recommends --no-upgrade python3 cargo rustc gcc libc6-dev
        fi
        python3 --version
        cargo --version
        rustc -vV
        cc --version | head -1
    - name: Compare fresh builds with 1, 2 and 4 jobs
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import platform
        import resource
        import shutil
        import statistics
        import subprocess
        import tempfile
        import time

        assert os.environ.get('RUNNER_NAME') == 'bin-Arm-tablet', 'Tablet runner only'
        assert platform.machine() in ('aarch64', 'arm64'), 'Native ARM64 required'
        root = Path(tempfile.mkdtemp(prefix='tablet-rust-bench-', dir=os.environ['RUNNER_TEMP']))
        assert shutil.disk_usage(root).free >= 1024**3, 'At least 1 GiB free required'
        report = Path(os.environ['RUNNER_TEMP']) / 'tablet-benchmark-results.json'
        data = {'runner': os.environ['RUNNER_NAME'], 'machine': platform.machine(),
                'logical_cpus': os.cpu_count(),
                'allowed_cpus': sorted(os.sched_getaffinity(0)), 'measurements': []}
        for tool in ('cargo', 'rustc', 'cc'):
            data[tool] = subprocess.check_output([tool, '--version'], text=True).splitlines()[0]
        print(json.dumps(data, indent=2), flush=True)
        members = [f'unit{i}' for i in range(16)] + ['probe']
        (root / 'Cargo.toml').write_text('[workspace]\nresolver="2"\nmembers=' + json.dumps(members) +
            '\n[profile.dev]\nopt-level=2\ndebug=0\nincremental=false\n')
        for i in range(16):
            crate = root / f'unit{i}'
            (crate / 'src').mkdir(parents=True)
            (crate / 'Cargo.toml').write_text(f'[package]\nname="unit{i}"\nversion="0.1.0"\nedition="2021"\n')
            functions = []
            for j in range(64):
                seed = 6364136223846793005 + i * 1024 + j * 2
                functions.append(f'#[inline(never)] pub fn f{j}(mut x:u64)->u64 {{ '
                                 f'for k in 0..128u64 {{ x=x.wrapping_mul({seed}).wrapping_add(k); '
                                 'x=x.rotate_left((k%63+1) as u32); } x }')
            functions.append('pub fn run(mut x:u64)->u64 {' + ''.join(f'x=f{j}(x);' for j in range(64)) + 'x}')
            (crate / 'src/lib.rs').write_text('\n'.join(functions))
        probe = root / 'probe'
        (probe / 'src').mkdir(parents=True)
        (probe / 'Cargo.toml').write_text('[package]\nname="probe"\nversion="0.1.0"\nedition="2021"\n[dependencies]\n' +
            ''.join(f'unit{i}={{path="../unit{i}"}}\n' for i in range(16)))
        (probe / 'src/main.rs').write_text('fn main(){let mut x=std::env::args().nth(1).unwrap().parse::<u64>().unwrap();' +
            ''.join(f'x=unit{i}::run(x);' for i in range(16)) + 'println!("{}",x);}')
        env = os.environ.copy()
        for key in ('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'CARGO_TARGET_DIR'):
            env.pop(key, None)
        env['CARGO_INCREMENTAL'] = '0'
        env['CARGO_TERM_COLOR'] = 'never'
        subprocess.run(['cargo', 'generate-lockfile', '--offline'], cwd=root, env=env, check=True, timeout=120)
        reference = None
        try:
            for run, jobs in enumerate((1, 2, 4, 4, 2, 1), 1):
                target = root / f'target-{run}'
                before = resource.getrusage(resource.RUSAGE_CHILDREN)
                started = time.monotonic()
                subprocess.run(['cargo', 'build', '--workspace', '--locked', '--offline', '--jobs', str(jobs),
                                '--target-dir', str(target)], cwd=root, env=env, check=True, timeout=420)
                elapsed = time.monotonic() - started
                after = resource.getrusage(resource.RUSAGE_CHILDREN)
                cpu = after.ru_utime + after.ru_stime - before.ru_utime - before.ru_stime
                output = subprocess.check_output([str(target / 'debug/probe'), '42'], text=True, timeout=30).strip()
                if reference is None:
                    reference = output
                assert output == reference, 'Native ARM output differs between job counts'
                row = {'run': run, 'jobs': jobs, 'wall_seconds': round(elapsed, 3),
                       'child_cpu_seconds': round(cpu, 3), 'average_cpu_cores': round(cpu / elapsed, 3),
                       'native_output_matches': True}
                data['measurements'].append(row)
                report.write_text(json.dumps(data, indent=2) + '\n')
                print('BENCHMARK_RESULT ' + json.dumps(row), flush=True)
                shutil.rmtree(target)
                time.sleep(3)
            baseline = statistics.median(r['wall_seconds'] for r in data['measurements'] if r['jobs'] == 1)
            data['summary'] = []
            lines = ['### Tablet ARM synthetic Rust build', '', '| Jobs | Median seconds | Speedup | Mean CPU cores |',
                     '| --- | ---: | ---: | ---: |']
            for jobs in (1, 2, 4):
                selected = [r for r in data['measurements'] if r['jobs'] == jobs]
                wall = statistics.median(r['wall_seconds'] for r in selected)
                cores = statistics.mean(r['average_cpu_cores'] for r in selected)
                row = {'jobs': jobs, 'median_wall_seconds': round(wall, 3),
                       'speedup': round(baseline / wall, 3), 'mean_cpu_cores': round(cores, 3)}
                data['summary'].append(row)
                lines.append(f'| {jobs} | {wall:.3f} | {baseline / wall:.2f}x | {cores:.2f} |')
            lines.extend(['', 'Synthetic no-dependency workspace; not a full project or AGNOS benchmark.',
                          'Fresh target for each build; order 1,2,4,4,2,1. Toolchain/OS caches and thermal drift remain.',
                          'CPU cores are aggregate child CPU time / wall time, not instantaneous core occupancy.',
                          'Tablet temperature sensors are not measured by this probe.'])
            report.write_text(json.dumps(data, indent=2) + '\n')
            print('BENCHMARK_SUMMARY ' + json.dumps(data['summary']), flush=True)
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                f.write('\n'.join(lines) + '\n')
        finally:
            shutil.rmtree(root)

        PY
    - name: Keep benchmark measurements
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: tablet-arm-benchmark
        path: ${{ runner.temp }}/tablet-benchmark-results.json
        if-no-files-found: warn
        retention-days: 7
