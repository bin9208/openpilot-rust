          done
      - name: Run discovery and retry in an owned network namespace
        run: |
          sudo -E env PYTHONPATH="$PYTHONPATH" unshare --net bash -euc '
            ip link set lo up
            ip address add 10.206.0.1/24 broadcast 10.206.0.255 dev lo
            runuser -u "$CARROT_NAVI_USER" --preserve-environment -- "$CARROT_NAVI_PYTHON" -P -m carrot_navi_qa.startup --source-python "$CARROT_NAVI_PYTHON" --binding "$CARROT_NAVI_PARAMS_BINDING" --output "$RUNNER_TEMP/carrot-navi/startup-source"
            runuser -u "$CARROT_NAVI_USER" --preserve-environment -- "$CARROT_NAVI_PYTHON" -P -m carrot_navi_qa.startup --native-bin "$CARROT_NAVI_BIN" --output "$RUNNER_TEMP/carrot-navi/startup-native"
          '
          python -P -m carrot_navi_qa.startup --source-python "$CARROT_NAVI_PYTHON" --binding "$CARROT_NAVI_PARAMS_BINDING" --output "$RUNNER_TEMP/carrot-navi/exhaust-source" --exhaust
          python -P -m carrot_navi_qa.startup --native-bin "$CARROT_NAVI_BIN" --output "$RUNNER_TEMP/carrot-navi/exhaust-native" --exhaust
      - name: Require exact existing policy and normalized process comparisons
        run: |
          python -P - <<'PY'
          import json, os
          from pathlib import Path
          from radarcan_exact import assert_exact
          root = Path(os.environ['RUNNER_TEMP']) / 'carrot-navi'
          def read(path):
            return json.loads((root / path).read_text())
          def normalize(rows):
            sessions = {}
            def walk(value, key=''):
              if isinstance(value, dict):
                return {k: walk(v, k) for k, v in value.items() if k != 'cereal_publish_count'}
              if isinstance(value, list):
                return [walk(v) for v in value]
              if key == 'session_id' and isinstance(value, str):
                sessions.setdefault(value, f'<session{len(sessions)}>')
              if isinstance(value, str):
                for token, replacement in sessions.items():
                  value = value.replace(token, replacement)
              if key == 'port' and value != 7714:
                return '<bound-port>'
              if key in ('last_received_at_ms', 'received_at_ms', 'last_cereal_publish_mono_ns') and value:
                assert isinstance(value, int) and value > 0
                return '<positive-clock>'
              return value
            return walk(rows)
          assert_exact(read('policy-native.json'), read('policy-source.json'), 'policy')
          for lane, count in (('socket', 56), ('lifecycle', 21)):
            source = normalize(read(f'{lane}-source/rows.json'))
            native = normalize(read(f'{lane}-native/rows.json'))
            assert len(source) == len(native) == count
            assert_exact(native, source, lane)
            assert_exact(read(f'{lane}-native/result.json'), read(f'{lane}-source/result.json'), lane + '/result')
            for kind, rows in (('source', source), ('native', native)):
              (root / f'{lane}-{kind}-normalized.json').write_text(json.dumps(rows, indent=2))
          for lane in ('startup', 'exhaust'):
            assert_exact(read(f'{lane}-native/result.json'), read(f'{lane}-source/result.json'), lane)
          source_packets = read('startup-source/discovery.json')
          native_packets = read('startup-native/discovery.json')
          assert_exact([row['wire_hex'] for row in native_packets], [row['wire_hex'] for row in source_packets], 'discovery/wire')
          (root / 'comparison.json').write_text(json.dumps({'status': 'pass', 'policy_cases': len(read('policy-source.json')), 'socket_observations': 56, 'lifecycle_observations': 21, 'discovery_byte_equal': True}, indent=2))
          PY
      - name: Preserve original and native raw captures and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-carrot-navi-host-evidence
          path: |
            ${{ runner.temp }}/carrot-navi/
            rust/target/debug/openpilot-carrot-navi
            rust/target/debug/examples/carrot-navi-policy
            rust/target/debug/examples/carrot-navi-wire
          if-no-files-found: warn

  carrot-navi-arm:
    name: rust Carrot Navi native ARM build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve runner capacity and install native ARM build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y capnproto g++ binutils
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/carrot-navi-arm"
          git rev-parse HEAD > "$RUNNER_TEMP/carrot-navi-arm/source-commit.txt"
      - name: Build and inspect the actual native ARM executable
        run: |
          test "$(uname -m)" = aarch64
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          set -o pipefail
          cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-navi --features native --bin openpilot-carrot-navi --target aarch64-unknown-linux-gnu --release --locked 2>&1 | tee "$RUNNER_TEMP/carrot-navi-arm/build.log"
          readelf -h rust/target/aarch64-unknown-linux-gnu/release/openpilot-carrot-navi | tee "$RUNNER_TEMP/carrot-navi-arm/elf.txt"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/carrot-navi-arm/elf.txt"
          sha256sum rust/target/aarch64-unknown-linux-gnu/release/openpilot-carrot-navi > "$RUNNER_TEMP/carrot-navi-arm/binary.sha256"
      - name: Preserve native ARM build receipt and executable
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-carrot-navi-native-arm
          path: |
            ${{ runner.temp }}/carrot-navi-arm/
            rust/target/aarch64-unknown-linux-gnu/release/openpilot-carrot-navi
          if-no-files-found: warn
  support-runtime:
    name: rust support runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq5 strace
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0 requests==2.34.2 aiohttp==3.13.3 anyio==4.12.1 PyJWT==2.15.1 cryptography==50.0.1 pyserial==3.5
      - name: Configure original support IPC imports
        run: printf 'PYTHONPATH=%s/support-msgq-python:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build support daemons and their source-comparison probes
        run: cargo build --manifest-path rust/Cargo.toml -p openpilot-uploader -p openpilot-web-upload -p openpilot-dashcam-upload -p openpilot-params-typed -p openpilot-journald -p openpilot-timed -p openpilot-logmessaged --bins --examples --locked
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build original message and Params bindings
        run: |
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/support-msgq-python"
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/support-params-binding"
      - name: Compare uploader policy, signed local HTTP and compressed payloads with original source
        run: |
          python rust/tools/check_uploader.py --binary rust/target/debug/examples/uploader_trace --output "$RUNNER_TEMP/support-runtime/uploader-reference/report.json"
          python rust/tools/check_uploader_timeouts.py --binary rust/target/debug/examples/uploader_trace --output "$RUNNER_TEMP/support-runtime/uploader-timeouts"
      - name: Compare active Carrot upload helpers and actual loopback request bytes
        run: python rust/tools/check_web_upload.py --binary rust/target/debug/examples/web_upload_trace --output "$RUNNER_TEMP/support-runtime/web-upload-reference"
      - name: Exercise uploader with original deviceState IPC, synthetic Params and loopback uploads
        run: python rust/tools/check_uploader_daemon.py --binary rust/target/debug/openpilot-uploader --output "$RUNNER_TEMP/support-runtime/uploader-native"
      - name: Keep interrupted socket reads within one upload and its original deadline
        run: python rust/tools/check_uploader_http_interrupted.py --binary rust/target/debug/openpilot-uploader --output "$RUNNER_TEMP/support-runtime/uploader-http-interrupted"
      - name: Compare real Params getters and uploader behavior through both collectors
        run: |
          python rust/tools/check_params_string.py --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so \
            --native rust/target/debug/examples/params_string_probe --output "$RUNNER_TEMP/support-runtime/params-string"
          python rust/tools/check_params_string_uploader.py --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so \
            --binary rust/target/debug/openpilot-uploader --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/params-uploader"
      - name: Compare uploader logs and transport failures through both collectors
        run: |
          python rust/tools/check_logmessaged_startup.py --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/logmessaged-startup"
          python rust/tools/check_uploader_logging.py --binary rust/target/debug/openpilot-uploader \
            --trace rust/target/debug/examples/uploader_trace --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/uploader-logging"
          python rust/tools/check_uploader_log_fault.py --native rust/target/debug/examples/uploader_log_fault \
            --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so --collector rust/target/debug/openpilot-logmessaged --output "$RUNNER_TEMP/support-runtime/uploader-log-fault"
      - name: Compare dashcam jobs, catalog, metadata and real Params
        run: |
          python rust/tools/check_dashcam_jobs.py --binary rust/target/debug/examples/dashcam_job_trace --output "$RUNNER_TEMP/support-runtime/dashcam-jobs"
          python rust/tools/check_dashcam_catalog.py --binary rust/target/debug/examples/dashcam_catalog_trace --output "$RUNNER_TEMP/support-runtime/dashcam-catalog"
          python rust/tools/check_dashcam_metadata.py --binary rust/target/debug/examples/dashcam_metadata_trace --output "$RUNNER_TEMP/support-runtime/dashcam-metadata"
          python rust/tools/check_dashcam_params.py --binary rust/target/debug/examples/dashcam_params_trace \
            --binding "$RUNNER_TEMP"/support-params-binding/params_pyx*.so --output "$RUNNER_TEMP/support-runtime/dashcam-params"
      - name: Compare dashcam uploads and child connection ownership
        run: |
          python rust/tools/check_dashcam_runtime.py --binary rust/target/debug/openpilot-dashcam-upload --output "$RUNNER_TEMP/support-runtime/dashcam-runtime"
          python rust/tools/check_dashcam_lifecycle.py --binary rust/target/debug/openpilot-dashcam-upload --output "$RUNNER_TEMP/support-runtime/dashcam-lifecycle"
      - name: Compare journald actual IPC, fatal inputs and child lifecycle
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features journal-runtime-native --bin check-journald --bin journalctl-fixture --locked
          cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features journal-runtime-native --bin check-journald --test journald_check --test journald_fixture --test journald_runtime_check --locked
          rustup component add clippy --toolchain 1.94.0
          cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features journal-runtime-native --lib --bin check-journald --bin journalctl-fixture --test journald_check --test journald_fixture --test journald_runtime_check --locked -- -D warnings
          rust/target/debug/check-journald --binary rust/target/debug/journald-rs --fixture rust/target/debug/journalctl-fixture --output "$RUNNER_TEMP/support-runtime/journald"
      - name: Build and test native timed QA tools
        env:
          TIMED_NATIVE_ENTRY: ${{ github.workspace }}/rust/target/debug/openpilot-timed
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
          cargo +1.94.0 build --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features timed-live-native --bin timed-source-reference --bin timed-command-fixture --bin timed-runtime-worker --bin check-timed-reference --bin check-timed-dates --bin check-timed-http --bin check-timed-logging --bin check-timed-daemon --bin check-timed-date-daemon --bin check-timed-lifecycle --bin check-timed-shutdown --locked
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
          cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features timed-live-native --bin timed-source-reference --bin timed-command-fixture --bin timed-runtime-worker --bin check-timed-reference --bin check-timed-dates --bin check-timed-http --bin check-timed-logging --bin check-timed-daemon --bin check-timed-date-daemon --bin check-timed-lifecycle --bin check-timed-shutdown --test timed_fixtures --test timed_shutdown_phase --test timed_reference --test timed_reference_actions --test timed_http_reference --test timed_http_report --test timed_proxy_reference --test timed_native_capture --test timed_native_logging --test timed_check --test timed_check_cli --test timed_check_prefix --test timed_command_publication --test timed_live_child --test timed_live --test timed_live_cli --test timed_live_cleanup --locked
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512
          cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features timed-live-native --bin timed-source-reference --bin timed-command-fixture --bin timed-runtime-worker --bin check-timed-reference --bin check-timed-dates --bin check-timed-http --bin check-timed-logging --bin check-timed-daemon --bin check-timed-date-daemon --bin check-timed-lifecycle --bin check-timed-shutdown --test timed_fixtures --test timed_shutdown_phase --test timed_reference --test timed_reference_actions --test timed_http_reference --test timed_http_report --test timed_proxy_reference --test timed_native_capture --test timed_native_logging --test timed_check --test timed_check_cli --test timed_check_prefix --test timed_command_publication --test timed_live_child --test timed_live --test timed_live_cli --test timed_live_cleanup --locked -- -D warnings
      - name: Compare timed policy, HTTP and logging with original source
        run: |
