      - name: Run original and native owned socket and publication lifecycle lanes
        run: |
          for lane in socket lifecycle; do
            extra=()
            if [ "$lane" = lifecycle ]; then extra+=(--lifecycle); fi
            python -P rust/tools/carrot_navi_runtime.py --source-python "$CARROT_NAVI_PYTHON" --binding "$CARROT_NAVI_PARAMS_BINDING" --pythonpath "$RUNNER_TEMP/carrot-navi/bindings/msgq" --output "$RUNNER_TEMP/carrot-navi/$lane-source" --cereal "${extra[@]}"
