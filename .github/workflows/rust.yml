name: Rust port
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: rust checks
    needs: [workspace, model-memory, model-pipelines, logger-runtime, support-runtime, telemetry-runtime, startup-runtime, hardware-runtime, platform-runtime, startup-services, sensor-audio, gnss-runtime, estimation-runtime, ui-connectivity, athena-runtime, controls-runtime, web-upload-timeouts, joystickd-runtime, planner-runtime, planner-memory, card-runtime, radar-runtime, radar-arm, radar-memory, navd-runtime, radard-runtime, carrot-man-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require runtime validation
        env:
          WORKSPACE: ${{ needs.workspace.result }}
          MEMORY: ${{ needs.model-memory.result }}
          PIPELINES: ${{ needs.model-pipelines.result }}
          LOGGER: ${{ needs.logger-runtime.result }}
          SUPPORT: ${{ needs.support-runtime.result }}
          TELEMETRY: ${{ needs.telemetry-runtime.result }}
          STARTUP: ${{ needs.startup-runtime.result }}
          HARDWARE: ${{ needs.hardware-runtime.result }}
          PLATFORM: ${{ needs.platform-runtime.result }}
          STARTUP_SERVICES: ${{ needs.startup-services.result }}
          SENSOR_AUDIO: ${{ needs.sensor-audio.result }}
          GNSS: ${{ needs.gnss-runtime.result }}
          ESTIMATION: ${{ needs.estimation-runtime.result }}
          UI_CONNECTIVITY: ${{ needs.ui-connectivity.result }}
          ATHENA: ${{ needs.athena-runtime.result }}
          CONTROLS: ${{ needs.controls-runtime.result }}
          UPLOAD_TIMEOUTS: ${{ needs.web-upload-timeouts.result }}
          JOYSTICKD: ${{ needs.joystickd-runtime.result }}
          CARROT_MAN: ${{ needs.carrot-man-runtime.result }}
          PLANNER: ${{ needs.planner-runtime.result }}
          PLANNER_MEMORY: ${{ needs.planner-memory.result }}
          CARD: ${{ needs.card-runtime.result }}
          RADAR: ${{ needs.radar-runtime.result }}
          RADAR_ARM: ${{ needs.radar-arm.result }}
          RADAR_MEMORY: ${{ needs.radar-memory.result }}
          NAVD: ${{ needs.navd-runtime.result }}
          RADARD: ${{ needs.radard-runtime.result }}
        run: |
          test "$WORKSPACE" = success
          test "$MEMORY" = success
          test "$PIPELINES" = success
          test "$LOGGER" = success
          test "$SUPPORT" = success
          test "$TELEMETRY" = success
          test "$STARTUP" = success
          test "$HARDWARE" = success
          test "$PLATFORM" = success
          test "$STARTUP_SERVICES" = success
          test "$SENSOR_AUDIO" = success
          test "$GNSS" = success
          test "$ESTIMATION" = success
          test "$UI_CONNECTIVITY" = success
          test "$ATHENA" = success
          test "$CONTROLS" = success
          test "$UPLOAD_TIMEOUTS" = success
          test "$JOYSTICKD" = success
          test "$CARROT_MAN" = success
          test "$PLANNER" = success
          test "$PLANNER_MEMORY" = success
          test "$CARD" = success
          test "$RADAR" = success
          test "$RADAR_ARM" = success
          test "$RADAR_MEMORY" = success
          test "$NAVD" = success
          test "$RADARD" = success
  planner-runtime:
    name: rust planner source comparison (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve capacity and install original planner dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang-18 libzmq3-dev
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.3.0 setuptools==82.0.1 zstandard==0.25.0 pyzmq==27.2.0 requests==2.34.2 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3 pytest==9.0.2
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 512
          python -m pip download --only-binary=:all: --no-deps comma-deps-acados==0.2.2.post103 --dest "$RUNNER_TEMP/planner-wheel"
          python -m pip install --no-deps "$RUNNER_TEMP"/planner-wheel/*.whl
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          python -P -c 'import acados; from pathlib import Path; print("PLANNER_GENERATOR="+str(Path(acados.__file__).parent))' >> "$GITHUB_ENV"
      - name: Build pinned solvers and unchanged original bindings
        run: |
          planner_cc=gcc
          if [ "$(uname -m)" = aarch64 ]; then planner_cc=clang-18; fi
          python rust/tools/build_plannerd_acados.py --architecture "$(uname -m)" --cc "$planner_cc" --python "$(command -v python)" --acados "$PLANNER_GENERATOR" --wheel "$RUNNER_TEMP"/planner-wheel/*.whl --output "$RUNNER_TEMP/planner-artifact"
          python rust/tools/build_plannerd_source.py --artifact "$RUNNER_TEMP/planner-artifact" --python "$(command -v python)" --acados "$PLANNER_GENERATOR" --generator-wheel "$RUNNER_TEMP"/planner-wheel/*.whl --cc "$planner_cc" --output "$RUNNER_TEMP/planner-source"
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/planner-original/params"
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/planner-original/ipc"
          python -P -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"planner-original/params/provenance.json"; print("PLANNER_PARAMS_BINDING="+json.loads(p.read_text())["module"])' >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s/planner-original/ipc:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Compile and check the complete native planner
        run: |
          python -m pytest -c /dev/null --rootdir . --confcutdir=rust/tools/tests -q rust/tools/tests/test_plannerd_ci.py rust/tools/tests/test_native_reference_architecture.py
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo test --manifest-path rust/Cargo.toml -p openpilot-plannerd --all-targets --locked
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo build --manifest-path rust/Cargo.toml -p openpilot-plannerd --bins --examples --locked
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-plannerd --all-targets --locked -- -D warnings
      - name: Compare exact policies, main loops, real IPC and lifecycle
        run: |
          python -P rust/tools/check_plannerd_ci.py --bin-dir rust/target/debug --artifact "$RUNNER_TEMP/planner-artifact" --source-native "$RUNNER_TEMP/planner-source" --binding "$PLANNER_PARAMS_BINDING" --output "$RUNNER_TEMP/planner-comparison"
      - name: Check generated C with ASan, UBSan and allocator leak detection
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python rust/tools/build_plannerd_acados.py --architecture x86_64 --cc gcc --sanitize --python "$(command -v python)" --acados "$PLANNER_GENERATOR" --wheel "$RUNNER_TEMP"/planner-wheel/*.whl --output "$RUNNER_TEMP/planner-sanitized"
          python -P rust/tools/check_plannerd_native_memory.py --bin-dir rust/target/debug --artifact "$RUNNER_TEMP/planner-sanitized" --source-native "$RUNNER_TEMP/planner-source" --binding "$PLANNER_PARAMS_BINDING" --asan-library "$(gcc -print-file-name=libasan.so)" --output "$RUNNER_TEMP/planner-native-memory"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-planner-${{ matrix.runner }}-evidence
          path: |
            ${{ runner.temp }}/planner-comparison/
            ${{ runner.temp }}/planner-native-memory/
            ${{ runner.temp }}/planner-artifact/
            ${{ runner.temp }}/planner-source/
            ${{ runner.temp }}/planner-sanitized/
            ${{ runner.temp }}/planner-original/params/*.json
            rust/target/debug/openpilot-plannerd
            rust/target/debug/examples/plannerd_*
  planner-memory:
    name: rust planner pure memory contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reserve capacity and prepare Miri
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 4096
          sudo apt-get update && sudo apt-get install -y capnproto
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install nightly-2026-09-29 --component miri --profile minimal
          cargo +nightly-2026-09-29 miri setup
      - name: Verify pure planner policies with four Miri modes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/planner-memory"
          for planner_mode in default strict preemption tree; do
            planner_flags='-Zmiri-no-extra-rounding-error'
            case "$planner_mode" in
              strict) planner_flags="$planner_flags -Zmiri-strict-provenance" ;;
              preemption) planner_flags="$planner_flags -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1" ;;
              tree) planner_flags="$planner_flags -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-preemption-rate=0.1 -Zmiri-tree-borrows" ;;
            esac
            python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
            MIRIFLAGS="$planner_flags" cargo +nightly-2026-09-29 miri test --manifest-path rust/Cargo.toml -p openpilot-plannerd --lib --tests --no-default-features --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/planner-memory/$planner_mode.log"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-planner-memory-evidence
          path: ${{ runner.temp }}/planner-memory/
  joystickd-runtime:
    name: rust control tools source and native runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/rust/tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ capnproto libcapnp-dev libzmq3-dev cmake
      - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 pytest==9.0.2 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 setproctitle==1.3.7 zstandard==0.25.0 requests==2.34.2 pyserial==3.5 inputs==0.5
      - name: Build joystickd and unchanged source boundary bindings
        run: |
          cargo build --manifest-path rust/Cargo.toml -p openpilot-control-tools --bins --examples --locked
          cargo test --manifest-path rust/Cargo.toml -p openpilot-control-tools --locked
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/joystickd/params-binding"
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/joystickd/msgq-binding"
          python -c 'from pathlib import Path; import os; print("JOYSTICKD_PARAMS_BINDING=" + str(next((Path(os.environ["RUNNER_TEMP"]) / "joystickd/params-binding").glob("params_pyx*.so"))))' >> "$GITHUB_ENV"
      - name: Compare original control states and actual IPC lifecycle
        run: |
          export PYTHONPATH="$RUNNER_TEMP/joystickd/msgq-binding:$PYTHONPATH"
          python rust/tools/joystickd_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --output "$RUNNER_TEMP/joystickd/source"
          python rust/tools/check_control_tools_policy.py --binary "$PWD/rust/target/debug/examples/joystickd_policy" --source "$RUNNER_TEMP/joystickd/source" --output "$RUNNER_TEMP/joystickd/compare"
          python rust/tools/check_joystickd_runtime.py --binary "$PWD/rust/target/debug/openpilot-joystickd" --binding "$JOYSTICKD_PARAMS_BINDING" --source "$RUNNER_TEMP/joystickd/source" --output "$RUNNER_TEMP/joystickd/runtime"
          python rust/tools/control_tools_policy_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --joystick-only --output "$RUNNER_TEMP/joystickd/input-source"
          python rust/tools/check_control_tools_policy.py --binary "$PWD/rust/target/debug/examples/joystick_input_policy" --source "$RUNNER_TEMP/joystickd/input-source" --output "$RUNNER_TEMP/joystickd/input-compare"
          python rust/tools/check_joystick_input_runtime.py --binding "$JOYSTICKD_PARAMS_BINDING" --binary "$PWD/rust/target/debug/openpilot-joystick-control" --fixture "$PWD/rust/target/debug/examples/joystick_input_fixture" --output "$RUNNER_TEMP/joystickd/input-runtime"
          python rust/tools/longitudinal_maneuvers_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --output "$RUNNER_TEMP/joystickd/longitudinal-source"
          python rust/tools/check_longitudinal_maneuvers.py --binding "$JOYSTICKD_PARAMS_BINDING" --trace "$PWD/rust/target/debug/examples/longitudinal_maneuvers_trace" --daemon "$PWD/rust/target/debug/openpilot-longitudinal-maneuversd" --source "$RUNNER_TEMP/joystickd/longitudinal-source" --output "$RUNNER_TEMP/joystickd/longitudinal-runtime"
          python rust/tools/lateral_maneuvers_source.py --binding "$JOYSTICKD_PARAMS_BINDING" --output "$RUNNER_TEMP/joystickd/lateral-source"
          python rust/tools/check_lateral_maneuvers.py --binding "$JOYSTICKD_PARAMS_BINDING" --trace "$PWD/rust/target/debug/examples/lateral_maneuvers_trace" --daemon "$PWD/rust/target/debug/openpilot-lateral-maneuversd" --source "$RUNNER_TEMP/joystickd/lateral-source" --output "$RUNNER_TEMP/joystickd/lateral-runtime"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-joystickd-evidence
          path: |
            ${{ runner.temp }}/joystickd/source/receipt.json
            ${{ runner.temp }}/joystickd/compare/**
            ${{ runner.temp }}/joystickd/runtime/**
            ${{ runner.temp }}/joystickd/input-source/receipt.json
            ${{ runner.temp }}/joystickd/input-compare/**
            ${{ runner.temp }}/joystickd/input-runtime/**
            ${{ runner.temp }}/joystickd/longitudinal-source/receipt.json
            ${{ runner.temp }}/joystickd/longitudinal-runtime/**
            ${{ runner.temp }}/joystickd/lateral-source/receipt.json
            ${{ runner.temp }}/joystickd/lateral-runtime/**
  carrot-man-runtime:
    name: rust CarrotMan owner (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARROT_EXCEPTION_DISCORD_WEBHOOK_DISABLE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve runner capacity and install pinned dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y g++ clang cmake pkg-config libzmq3-dev capnproto libcapnp-dev
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 pyzmq==27.2.0 zstandard==0.25.0 requests==2.34.2 aiohttp==3.13.3 psutil==7.2.2
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal
      - name: Stage exact optional GEOS provider
        run: |
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 128
          python -m pip download --only-binary=:all: --no-deps shapely==2.1.2 --dest "$RUNNER_TEMP/carrot-man-wheels"
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 128
          python rust/tools/carrot_man_stage_geos.py --wheel "$RUNNER_TEMP"/carrot-man-wheels/shapely-2.1.2-*.whl --output "$RUNNER_TEMP/carrot-man-geos"
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 128
          python -m pip install --no-deps "$RUNNER_TEMP"/carrot-man-wheels/shapely-2.1.2-*.whl
          cat "$RUNNER_TEMP/carrot-man-geos/environment.txt" >> "$GITHUB_ENV"
      - name: Build owner and unchanged source bindings
        run: |
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-man --bins --examples --locked
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --output "$RUNNER_TEMP/carrot-man-params"
          python rust/tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/carrot-man-msgq"
          python -c 'from pathlib import Path; import os; print("CARROT_PARAMS_BINDING="+str(next((Path(os.environ["RUNNER_TEMP"])/"carrot-man-params").glob("params_pyx*.so"))))' >> "$GITHUB_ENV"
      - name: Compare affected original policy, cereal and time boundaries
        if: matrix.arch == 'x86_64'
        run: |
          python rust/tools/carrot_man_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence "$RUNNER_TEMP/carrot-man-policy"
          python rust/tools/carrot_man_serv_compare.py --binary rust/target/debug/examples/carrot_man_trace --params-binding "$CARROT_PARAMS_BINDING" --evidence "$RUNNER_TEMP/carrot-man-policy"
          python rust/tools/carrot_man_ingress_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence "$RUNNER_TEMP/carrot-man-policy"
          python rust/tools/carrot_man_time_compare.py --binary rust/target/debug/examples/carrot_man_trace --evidence "$RUNNER_TEMP/carrot-man-policy"
      - name: Compare actual owned Params, IPC, sockets and upload recipients
        run: |
          export PYTHONPATH="$RUNNER_TEMP/carrot-man-msgq:$PYTHONPATH"
          python -P rust/tools/carrot_man_owned_compare.py --binary rust/target/debug/examples/carrot_man_owned --params-binding "$CARROT_PARAMS_BINDING" --evidence "$RUNNER_TEMP/carrot-man-owned"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: carrot-man-owner-${{ matrix.arch }}-evidence
          path: |
            ${{ runner.temp }}/carrot-man-policy/**
            ${{ runner.temp }}/carrot-man-owned/**
            ${{ runner.temp }}/carrot-man-geos/**
            rust/target/debug/openpilot-carrot-man
  workspace:
    name: rust workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '2'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
      MODEL_RUN_BINARY: ${{ github.workspace }}/rust/target/debug/model-run
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Reserve capacity for workspace validation
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 12288
      - run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ clang libllvm18 git-lfs libclang-dev libavcodec-dev libavformat-dev libavutil-dev cmake
      - run: |
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 zstandard==0.25.0 pytest==9.0.2 pyzmq==27.2.0 requests==2.34.2 aiohttp==3.13.3 anyio==4.12.1 PyJWT==2.15.1 cryptography==50.0.1 pycryptodome==3.23.0 setproctitle==1.3.7 pyserial==3.5 tqdm==4.70.1 PyYAML==6.0.3
      - name: Stage pinned native startup UI headers
        run: |
          python tools/stage_startup_ui_raylib.py --arch x86_64 --output "$RUNNER_TEMP/startup-raylib-host"
          printf 'STARTUP_UI_RAYLIB_ROOT=%s/startup-raylib-host\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Install source-pinned Eigen headers
        run: |
          python -m pip install 'git+https://github.com/commaai/dependencies.git@40e5d76de1b33a86c5181b63db6782d8f06da1da#subdirectory=eigen'
          python -c 'import eigen; print("LOCATIOND_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR); print("PARAMSD_EIGEN_INCLUDE=" + eigen.INCLUDE_DIR)' >> "$GITHUB_ENV"
      - run: |
          python tools/card_ci_space.py --path "$GITHUB_WORKSPACE" --growth-mib 8192
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Stage pinned numerical dependency before required workspace tests
        run: |
          python -m pip download --only-binary=:all: --no-deps numpy==2.5.3 --dest "$RUNNER_TEMP/torque-wheels"
          python tools/stage_torque_numerics.py --wheel "$RUNNER_TEMP"/torque-wheels/numpy-2.5.3-*.whl --output "$RUNNER_TEMP/torque-numerics"
