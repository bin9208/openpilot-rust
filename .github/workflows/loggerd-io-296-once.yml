name: 'loggerd IO-only admission #296 (once)'
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/loggerd-io-296-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: loggerd-io-controller-296-once
  cancel-in-progress: false
jobs:
  loggerd-io:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - dev-md-local
    timeout-minutes: 90
    env:
      SOURCE_SHA: 77100d33ce4d1202853bd6bf3597a0fc2014c590
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LOGGERD_GATE_B64: 
      LOGGERD_GATE_SHA256: 6a422a754887175e66800a2f47b643bf5dfce5b3edb3b548a061ffcbcf58c31b
      LOGGERD_HELPERS_B64: 
      LOGGERD_HELPERS_SHA256: 183e4d358d798445c7d5ac1eed21310522d58658c338e7256ea05b2ab27631ec
      LOGGERD_SCRIPT_B64: 
      LOGGERD_SCRIPT_SHA256: 410f306d3673e26ca2f33c4a72ba85ee1256d812a81ce1978fb49a3d8ed36571
      LOGGERD_PINS_B64: 
      LOGGERD_PINS_SHA256: 43272e45d965a692ac9f2cfae75388f224d393c7a75a26f27b96391c943306b0
      LOGGERD_GUARDS_B64: 
      LOGGERD_GUARDS_SHA256: 85287063c6248be5b9226d44fd6d0df9d3c1dbafb43a0ad00d0dc383099e04a2
      LOGGERD_RUNNER_B64: 
      LOGGERD_RUNNER_SHA256: f5e7270cf0ff3d514107c7f7e1a157bbfe6e9d6ec5b982c756a4ffea2aa29cfe
      LOGGERD_OWNERSHIP_B64: 
      LOGGERD_OWNERSHIP_SHA256: 01fc843d1447b839cbef0d0fb2c29f4f95c727b33184e7a9c57778a1cf67eed9
      LOGGERD_OWNERSHIP_TESTS_B64: 
      LOGGERD_OWNERSHIP_TESTS_SHA256: 5eba4e6e93ed4a1f8660a4c5ea43a3d0e93efe340d2db1a348952b50b8567b90
    defaults:
      run:
        shell: bash
    steps:
    - name: Require verified trusted runner and fresh isolated checkout leaf
      run: 'set -euo pipefail

        [[ $GITHUB_ACTIONS == true && $RUNNER_ENVIRONMENT == self-hosted ]]

        [[ $RUNNER_NAME == bin-actions && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]

        [[ $GITHUB_REPOSITORY == bin9208/openpilot-rust && $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]

        [[ ! -e "$GITHUB_WORKSPACE/io-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" && ! -L "$GITHUB_WORKSPACE/io-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        ]]

        '
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        path: io-${{ github.run_id }}-${{ github.run_attempt }}
        persist-credentials: false
        fetch-depth: 1
    - name: Materialize frozen job-local payloads and private caches
      run: "set -euo pipefail\nio_source=$(cd -- \"$GITHUB_WORKSPACE/io-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" && pwd -P)\n\
        [[ $(git -C \"$io_source\" rev-parse HEAD) == \"$SOURCE_SHA\" && -z $(git -C \"$io_source\" status --porcelain --untracked-files=normal)\
        \ ]]\nio_job=$(mktemp -d \"$RUNNER_TEMP/loggerd-io-296.XXXXXXXX\")\nio_job=$(cd -- \"$io_job\" && pwd -P)\nmkdir \"\
        $io_job/wrappers\" \"$io_job/tmp\" \"$io_job/cargo-home\" \"$io_job/rustup-home\"\nprintf 'LOGGERD_IO_SOURCE_ROOT=%s\\\
        nLOGGERD_IO_RUNNER_TEMP=%s\\nLOGGERD_IO_JOB=%s\\nLOGGERD_IO_GATE=%s/gate.py\\nLOGGERD_IO_EVIDENCE=%s/evidence\\nLOGGERD_IO_ORIGINAL_ZIP=%s/original.zip\\\
        nCARGO_HOME=%s/cargo-home\\nRUSTUP_HOME=%s/rustup-home\\nTMPDIR=%s/tmp\\nXDG_CACHE_HOME=%s/cache\\n' \"$io_source\"\
        \ \"$RUNNER_TEMP\" \"$io_job\" \"$io_job\" \"$io_job\" \"$io_job\" \"$io_job\" \"$io_job\" \"$io_job\" \"$io_job\"\
        \ >> \"$GITHUB_ENV\"\nfor pair in GATE:gate.py HELPERS:reused-gate-helpers.py SCRIPT:frozen-loggerd-io-hosted.sh PINS:io-source-blobs.tsv\
        \ GUARDS:integrated-source-sha256.json RUNNER:verified-runner-registration.json OWNERSHIP:ownership.py OWNERSHIP_TESTS:ownership-tests.py;\
        \ do\n  io_key=\"LOGGERD_${pair%%:*}_B64\"\n  printf '%s' \"${!io_key}\" | base64 --decode > \"$io_job/${pair#*:}\"\
        \n  io_hash=\"LOGGERD_${pair%%:*}_SHA256\"\n  printf '%s  %s\\n' \"${!io_hash}\" \"$io_job/${pair#*:}\" | sha256sum\
        \ --check --strict\ndone\ncat > \"$io_job/wrappers/strace\" <<'SH'\n#!/usr/bin/env bash\nset -euo pipefail\nexec /usr/bin/python3\
        \ -I -B \"$LOGGERD_IO_GATE\" observe live -- /usr/bin/strace \"$@\"\nSH\nchmod 0700 \"$io_job/wrappers/strace\"\n\
        printf 'source=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\nrunner=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\"\
        \ \"$GITHUB_RUN_ATTEMPT\" \"$RUNNER_NAME\" > \"$io_job/source.txt\"\n"
    - name: Check existing image providers without modifying the persistent host
      run: "set -euo pipefail\nfor io_program in /usr/bin/python3 /usr/bin/strace /usr/bin/ldd /usr/bin/sudo /usr/sbin/auditctl\
        \ /usr/sbin/ausearch /usr/bin/df; do\n  [[ -x $io_program ]]\ndone\nfor io_program in g++ clang capnp pkg-config rustup\
        \ cargo gh; do command -v \"$io_program\"; done\npkg-config --exists libavcodec libavformat libavutil libzstd\n{\n\
        \  uname -a\n  cat /etc/os-release\n  getconf _NPROCESSORS_ONLN\n  cat /proc/meminfo\n  df -B1 \"$LOGGERD_IO_JOB\"\
        \ \"$LOGGERD_IO_SOURCE_ROOT\"\n  pkg-config --modversion libavcodec libavformat libavutil libzstd\n  g++ --version\n\
        \  clang --version\n  capnp --version\n  /usr/bin/strace --version\n  /usr/bin/timeout --version\n} > \"$LOGGERD_IO_JOB/image-provider-versions.txt\"\
        \n# No apt installation, daemon startup, audit global-policy change, hosted-image\n# deletion, fixed25/35GiB reserve\
        \ or shared cache cleanup on bin-actions.\n"
    - name: Authenticate exact historical artifact and integrated source
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942 > "$LOGGERD_IO_JOB/original-metadata.json"

        gh api -H ''Cache-Control: no-cache'' repos/bin9208/openpilot-rust/actions/artifacts/12432287942/zip > "$LOGGERD_IO_ORIGINAL_ZIP"

        gh api -H ''Cache-Control: no-cache'' "repos/bin9208/openpilot-rust/contents/.github/workflows/loggerd-io-296-once.yml?ref=$GITHUB_SHA"
        --jq .content | base64 --decode > "$LOGGERD_IO_JOB/published-workflow.yml"

        /usr/bin/python3 -I -B "$LOGGERD_IO_GATE" authenticate

        '
    - name: NEW outer receipt cancellation recovery and bounded-stream failure controls
      timeout-minutes: 8
      run: 'set -euo pipefail

        io_free=$(df -B1 --output=avail "$LOGGERD_IO_JOB" | tail -n 1)

        io_free=${io_free//[[:space:]]/}

        [[ $io_free =~ ^[0-9]+$ ]]

        # Two64MiB stdout caps + one1MiB stderr cap + bounded receipts; growth only.

        printf ''{"available_bytes":%s,"expected_growth_bytes":136314880}\n'' "$io_free" > "$LOGGERD_IO_JOB/ownership-tests-resources.json"

        [[ $io_free -ge 136314880 ]]

        /usr/bin/python3 -I -B "$LOGGERD_IO_JOB/ownership-tests.py" > "$LOGGERD_IO_JOB/ownership-tests.log" 2>&1 || { io_code=$?;
        tail -n 100 "$LOGGERD_IO_JOB/ownership-tests.log"; exit "$io_code"; }

        '
    - name: Prove new non-ptrace kernel audit backend before build cost
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B "$LOGGERD_IO_GATE" observe probe -- /usr/bin/true

        '
    - name: Install exact Rust toolchains only inside private job caches
      timeout-minutes: 20
      run: 'set -euo pipefail

        export RUNNER_TEMP="$LOGGERD_IO_JOB"

        "$LOGGERD_IO_SOURCE_ROOT/rust/tools/check-disk-space" --path "$LOGGERD_IO_JOB" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        rustup toolchain install nightly-2026-09-29 --profile minimal --component rust-src

        rustc +1.94.0 --version > "$LOGGERD_IO_JOB/rustc-version.txt"

        rustc +nightly-2026-09-29 --version > "$LOGGERD_IO_JOB/nightly-version.txt"

        '
    - name: Run only new IO8tests replay Clippy actual640+2 and full-policy ASan
      timeout-minutes: 55
      run: 'set -euo pipefail

        export GITHUB_WORKSPACE="$LOGGERD_IO_SOURCE_ROOT"

        export RUNNER_TEMP="$LOGGERD_IO_JOB"

        export PATH="$LOGGERD_IO_JOB/wrappers:$PATH"

        export CARGO_TERM_COLOR=never

        bash "$LOGGERD_IO_JOB/derived-loggerd-io-hosted.sh" > "$LOGGERD_IO_JOB/recipe.log" 2>&1 || { io_code=$?; tail -n 100
        "$LOGGERD_IO_JOB/recipe.log"; exit "$io_code"; }

        /usr/bin/python3 -I -B "$LOGGERD_IO_GATE" complete

        '
    - name: Require explicit closed IO-only completion
      run: 'set -euo pipefail

        /usr/bin/python3 -I -B - <<''CHECK''

        import json,os

        from pathlib import Path

        job=Path(os.environ[''LOGGERD_IO_JOB''])

        row=json.loads((job/''completion.json'').read_bytes())

        assert row[''result'']==''pass'' and row[''source_commit'']==os.environ[''SOURCE_SHA'']

        assert row[''workflow_head'']==os.environ[''GITHUB_SHA'']

        assert row[''gate_sha256'']==os.environ[''LOGGERD_GATE_SHA256'']

        assert row[''frozen_script_sha256'']==''410f306d3673e26ca2f33c4a72ba85ee1256d812a81ce1978fb49a3d8ed36571''

        assert row[''new_ownership_controls'']==5

        assert row[''phase'']==''loggerd-io-only'' and row[''actual_io_workers'']==8 and row[''actual_asan_workers'']==2

        assert row[''normal_output_parent_alias''] and not row[''source_retirement''] and not row[''main_scenarios_rerun'']

        assert all((job/p).is_file() for p in row[''required''])

        CHECK

        '
    - name: Always seal bounded inert evidence, including failed admission
      if: always()
      timeout-minutes: 5
      run: "set -euo pipefail\nio_public=\"$RUNNER_TEMP/loggerd-io-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\nif [[ -n ${LOGGERD_IO_GATE:-}\
        \ && -f $LOGGERD_IO_GATE && -n ${LOGGERD_IO_SOURCE_ROOT:-} && -d $LOGGERD_IO_SOURCE_ROOT ]]; then\n  io_finalize=0\n\
        \  /usr/bin/python3 -I -B \"$LOGGERD_IO_GATE\" finalize || io_finalize=$?\n  /usr/bin/python3 -I -B \"$LOGGERD_IO_GATE\"\
        \ pack\n  [[ $io_finalize == 0 ]]\nelse\n  mkdir \"$io_public\"\n  printf '%s\\n' '{\"result\":\"fail\",\"reason\"\
        :\"checkout or gate bootstrap unavailable\"}' > \"$io_public/packaging.json\"\n  exit 1\nfi\n"
    - id: io-evidence
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: loggerd-io-296-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/loggerd-io-public-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
        compression-level: 6
    - name: Remove only private job temporary data after evidence upload
      if: always() && steps.io-evidence.outcome == 'success'
      run: 'set -euo pipefail

        io_runner_temp=$(cd -- "$RUNNER_TEMP" && pwd -P)

        [[ -n ${LOGGERD_IO_JOB:-} && $LOGGERD_IO_JOB == "$io_runner_temp/"loggerd-io-296.* ]]

        [[ -d $LOGGERD_IO_JOB && ! -L $LOGGERD_IO_JOB ]]

        # Retain checkout source and public evidence. Delete only this run''s generated

        # target and unique temporary data after successful evidence upload.

        io_expected_source=$(cd -- "$GITHUB_WORKSPACE/io-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" && pwd -P)

        [[ $LOGGERD_IO_SOURCE_ROOT == "$io_expected_source" ]]

        /usr/bin/python3 -I -B - <<''CHECK''

        import json,os

        from pathlib import Path

        row=json.loads((Path(os.environ[''LOGGERD_IO_JOB''])/''audit-finalization.json'').read_bytes())

        assert row[''result'']==''pass'' and row[''shared_rules_modified''] is False and row[''ownership_all_clear''] is True

        CHECK

        [[ ! -L "$LOGGERD_IO_SOURCE_ROOT/rust/target" ]]

        [[ -z $(git -C "$LOGGERD_IO_SOURCE_ROOT" ls-files -- rust/target) ]]

        rm -rf -- "$LOGGERD_IO_SOURCE_ROOT/rust/target" "$LOGGERD_IO_JOB"

        '
