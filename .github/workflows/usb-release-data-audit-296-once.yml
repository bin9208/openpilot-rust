name: 296 inspect immutable USB release asset metadata
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/usb-release-data-audit-296-once.yml
permissions:
  contents: read
jobs:
  data-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 0501612741fe402bedf50ead847f2f85fc9f5587
        persist-credentials: false
    - name: Inspect authenticated archive without executing its contents
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 0501612741fe402bedf50ead847f2f85fc9f5587

        available=$(df -PB1 "$GITHUB_WORKSPACE" | awk ''NR==2 {print $4}'')

        test "$available" -ge 28991029248

        printf ''%s'' ''''
        | base64 --decode > "$RUNNER_TEMP/audit-usb-release.py"

        printf ''%s  %s\n'' 5c47fa775db31019427613adef52393d88c4fcb58d571d141d3e53a9c6f7c80a "$RUNNER_TEMP/audit-usb-release.py"
        | sha256sum -c -

        python3 "$RUNNER_TEMP/audit-usb-release.py"

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: usb-release-data-audit-296
        path: ${{ runner.temp }}/usb-release-data-audit/*.json
        if-no-files-found: error
