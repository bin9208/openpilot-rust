name: 296 independent original startup and USB daemon capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/model-family-original-capture-once.yml
permissions:
  contents: read
  actions: read
jobs:
  model-family-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CPU_COUNT: '2'
      DEV: CPU:LLVM
      JIT: '1'
      JIT_BATCH_SIZE: '0'
      OPENPILOT_HACKS: '1'
      LLVM_PATH: /usr/lib/x86_64-linux-gnu/libLLVM-18.so
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 0ec6cbae2d85fd98f2e0894697de7869f6159f51
    - name: Reserve hosted capacity before dependencies
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 12288

        mkdir "$RUNNER_TEMP/model-family-preparation-296"

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends g++ clang libclang-dev libllvm18 liblzma-dev capnproto libcapnp-dev
        libzmq3-dev jq

        rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install unchanged original observer dependencies
      shell: bash
      run: 'set -euo pipefail

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        python -m pip install numpy==2.5.3 zstandard==0.25.0 pycapnp==2.1.0 pyzmq==27.2.0 Cython==3.2.4 setuptools==82.0.1
        pytest==9.0.2 requests==2.34.2 pyserial==3.5 setproctitle==1.3.7

        '
    - name: Materialize authenticated admit_driver_current_pkls.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/admit_driver_current_pkls.py"

        

        DATA

        printf ''%s  %s\n'' ''9ebe863835d508d5df2dba1ad5f7a91d9a88b55d5b361cb69ebfc2fd98afda75'' "$proof/admit_driver_current_pkls.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated export_current_driving_catalog.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/export_current_driving_catalog.py"

        

        DATA

        printf ''%s  %s\n'' ''94a5f103c3831a7bbdf7f6733c5576230539ccb906f1ad3368e587ea16c4a49c'' "$proof/export_current_driving_catalog.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated test_export_current_catalog_paths.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/test_export_current_catalog_paths.py"

        

        DATA

        printf ''%s  %s\n'' ''0810f0cedc18ea3de07227924326b447fa5f01c766ff9aa64ab94c0fe0262366'' "$proof/test_export_current_catalog_paths.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated prepare_model_family_current_catalog.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/prepare_model_family_current_catalog.py"

        

        DATA

        printf ''%s  %s\n'' ''e9d0a94cb180e23c04f7bcf2e845c1f633ad62f7f6e05dda6e5f0619f14e1187'' "$proof/prepare_model_family_current_catalog.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated stage_model_family_usb_assets.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/stage_model_family_usb_assets.py"

        

        DATA

        printf ''%s  %s\n'' ''0fd22b61a254d66f6680ac998762cf712bb79454b68a160fcc437e06865b50ff'' "$proof/stage_model_family_usb_assets.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated model_family_capture_sitecustomize.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/model_family_capture_sitecustomize.py"

        

        DATA

        printf ''%s  %s\n'' ''6a6197ad21bd1e4a053b9b8b5907bf3cf5a3d65e434188dc48cd632b8b84d7be'' "$proof/model_family_capture_sitecustomize.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated capture_model_family_original.py
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/capture_model_family_original.py"

        

        DATA

        printf ''%s  %s\n'' ''9cdd351e0d13c944a5202549ab36431fc75ac72140f60be5da95f8976ba01ed8'' "$proof/capture_model_family_original.py"
        | sha256sum -c -

        '
    - name: Materialize authenticated model-family-original-capture.bash
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        base64 --decode <<''DATA'' > "$proof/model-family-original-capture.bash"

        

        DATA

        printf ''%s  %s\n'' ''22e9d990a7cda5f8209ec3518268dc0d91eb11e0b20bd507b630cd11eef4336c'' "$proof/model-family-original-capture.bash"
        | sha256sum -c -

        '
    - name: Build only existing source-capture prerequisites; no new controller ports
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-driving-modeld --bin openpilot-driving-modeld --example
        usbgpu_daemon_fixture > "$proof/driving-build.log" 2>&1 || { cat "$proof/driving-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dmonitoringmodeld --bin openpilot-dmonitoringmodeld
        > "$proof/driver-build.log" 2>&1 || { cat "$proof/driver-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-usbgpu --example worker_protocol_fixture > "$proof/worker-build.log"
        2>&1 || { cat "$proof/worker-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-model-runtime --bin model-run > "$proof/model-run-build.log"
        2>&1 || { cat "$proof/model-run-build.log"; exit 1; }

        cargo build --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features driving-daemon-native --bin
        stage-driving-daemon-fixture --bin generate-services-header > "$proof/stager-build.log" 2>&1 || { cat "$proof/stager-build.log";
        exit 1; }

        python rust/tools/build_visionipc_python.py --output "$RUNNER_TEMP/model-msgq-python" > "$proof/ipc-build.log" 2>&1
        || { cat "$proof/ipc-build.log"; exit 1; }

        mkdir "$proof/peer"

        rust/target/debug/generate-services-header > "$proof/peer/services.h"

        g++ -std=c++17 -pthread -Imsgq_repo -I"$proof/peer" rust/tools/driving_daemon_peer.cc msgq_repo/msgq/{ipc,event,impl_msgq,impl_fake,msgq}.cc
        msgq_repo/msgq/visionipc/{visionipc,visionipc_client,visionipc_server,visionbuf}.cc -o "$proof/peer/driving-daemon-peer"
        > "$proof/peer-build.log" 2>&1 || { cat "$proof/peer-build.log"; exit 1; }

        sha256sum rust/target/debug/openpilot-driving-modeld rust/target/debug/openpilot-dmonitoringmodeld rust/target/debug/examples/usbgpu_daemon_fixture
        rust/target/debug/examples/worker_protocol_fixture "$proof/peer/driving-daemon-peer" > "$proof/held-elfs.sha256"

        '
    - name: Stage authenticated five-PKL complete fixture once; export current CPU only
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        printf ''%s  %s\n'' afe1c795d7f609801eb4cd5a5a7748c3c996929403a3c0fa102f232f2a8d248d rust/crates/dev-tools/tests/fixtures/driving-daemon-original/fixture.json
        | sha256sum -c -

        rust/target/debug/stage-driving-daemon-fixture --archive "$GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/driving-daemon-original/observations.tar.xz"
        --output "$proof/driving-fixture" --blob-sha256 3ddfb1213cccbbf0d4d0ef7854b79cef5637acdfd7b59d883b13063d6968b4fe --blob-bytes
        59663776 --compact-images > "$proof/native-stage.json"

        python -P "$proof/test_export_current_catalog_paths.py" > "$proof/exporter-path-tests.log" 2>&1

        PYTHONPATH="$proof:$PYTHONPATH" python -P "$proof/prepare_model_family_current_catalog.py" > "$proof/current-export.stdout"
        2> "$proof/current-export.stderr"

        rust/target/debug/model-run --check-catalog "$proof/current-catalog" > "$proof/current-catalog-check.json"

        '
    - name: Stage genuine sealed USB assets from immutable release; never execute ARM data
      shell: bash
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/model-family-preparation-296"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 6144

        python -P "$proof/stage_model_family_usb_assets.py" > "$proof/usb-assets.stdout" 2> "$proof/usb-assets.stderr"

        '
    - name: Capture unchanged original eight startup and six USB cases exactly once
      shell: bash
      run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/model-family-preparation-296\"\nexport MODEL_FAMILY_CAPTURE_HELPER=\"\
        $proof/capture_model_family_original.py\"\nexport MODEL_FAMILY_CAPTURE_HELPER_SHA256=9cdd351e0d13c944a5202549ab36431fc75ac72140f60be5da95f8976ba01ed8\n\
        mkdir \"$proof/module-observer\"\ncp \"$proof/model_family_capture_sitecustomize.py\" \"$proof/module-observer/sitecustomize.py\"\
        \nexport MODEL_FAMILY_MODULE_OBSERVER=\"$proof/module-observer/sitecustomize.py\"\nexport MODEL_FAMILY_MODULE_OBSERVER_SHA256=6a6197ad21bd1e4a053b9b8b5907bf3cf5a3d65e434188dc48cd632b8b84d7be\n\
        export MODEL_FAMILY_MODELS=\"$proof/driving-fixture/models\"\nexport MODEL_FAMILY_CATALOG=\"$proof/current-catalog\"\
        \nexport MODEL_FAMILY_CURRENT_CATALOG_RECEIPT=\"$proof/model-family-current-receipt.json\"\nexport MODEL_FAMILY_CURRENT_CATALOG_RECEIPT_SHA256=\"\
        $(sha256sum \"$MODEL_FAMILY_CURRENT_CATALOG_RECEIPT\" | cut -d' ' -f1)\"\nexport MODEL_FAMILY_BINDING=\"$RUNNER_TEMP/model-msgq-python\"\
        \nexport MODEL_FAMILY_DRIVING=\"$GITHUB_WORKSPACE/rust/target/debug/openpilot-driving-modeld\"\nexport MODEL_FAMILY_DRIVER=\"\
        $GITHUB_WORKSPACE/rust/target/debug/openpilot-dmonitoringmodeld\"\nexport MODEL_FAMILY_USB_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/examples/usbgpu_daemon_fixture\"\
        \nexport MODEL_FAMILY_USB_WORKER=\"$GITHUB_WORKSPACE/rust/target/debug/examples/worker_protocol_fixture\"\nexport\
        \ MODEL_FAMILY_USB_PEER=\"$proof/peer/driving-daemon-peer\"\nexport MODEL_FAMILY_USB_MODEL=\"$proof/usb-assets/models/e758b96df27858ea97122d18554930d04f9f8bda417417074edfb3a72b008d0b/model.pkl\"\
        \nexport MODEL_FAMILY_USB_RUNTIME=\"$proof/usb-runtime.tar.gz\"\nexport MODEL_FAMILY_USB_INSTALLED=\"$proof/usb-installed.json\"\
        \nexport MODEL_FAMILY_USB_ASSETS=\"$proof/usb-assets\"\nfind \"$MODEL_FAMILY_BINDING\" -type f -name '*.so' -print0\
        \ | sort -z | xargs -0 sha256sum > \"$proof/held-bindings.sha256\"\nPYTHONPATH=\"$MODEL_FAMILY_BINDING:$PYTHONPATH\"\
        \ python -P - <<'BINDING'\nimport importlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['MODEL_FAMILY_BINDING']).resolve(strict=True)\n\
        modules={}\nfor name in ('msgq.ipc_pyx','msgq.visionipc.visionipc_pyx'):\n m=importlib.import_module(name)\n p=Path(m.__file__).resolve(strict=True)\n\
        \ assert p.is_relative_to(root) and p.suffix=='.so'\n modules[name]=str(p)\n(Path(os.environ['RUNNER_TEMP'])/'model-family-preparation-296/binding-imports.json').write_text(json.dumps(modules,indent=2)+'\\\
        n')\nBINDING\nbash \"$proof/model-family-original-capture.bash\"\nsha256sum -c \"$proof/held-elfs.sha256\"\nsha256sum\
        \ -c \"$proof/held-bindings.sha256\"\n"
    - name: Retain selected original observations and complete current-host provenance
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: model-family-original-296
        retention-days: 7
        if-no-files-found: error
        path: '${{ runner.temp }}/model-family-original-296/

          ${{ runner.temp }}/model-family-preparation-296/*.json

          ${{ runner.temp }}/model-family-preparation-296/*.log

          ${{ runner.temp }}/model-family-preparation-296/*.stdout

          ${{ runner.temp }}/model-family-preparation-296/*.stderr

          ${{ runner.temp }}/model-family-preparation-296/*.sha256

          ${{ runner.temp }}/model-family-preparation-296/*.py

          ${{ runner.temp }}/model-family-preparation-296/*.bash

          ${{ runner.temp }}/model-family-preparation-296/current-catalog/

          !${{ runner.temp }}/model-family-original-296/usbgpu/original/**/cache/**

          !${{ runner.temp }}/model-family-original-296/usbgpu/original/**/models/**

          !${{ runner.temp }}/model-family-original-296/usbgpu/original/**/sysfs/**

          !${{ runner.temp }}/model-family-original-296/**/params/**'
