name: 296 independent original deleter capture
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/deleter-original-296-once.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SOURCE: 5fc4e8886dde7d41840758dbdf113143b6bc0a78
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5fc4e8886dde7d41840758dbdf113143b6bc0a78
        persist-credentials: false
    - name: Reserve capacity before original capture
      shell: bash
      run: 'set -euo pipefail

        export DELETER_CAPTURE="$RUNNER_TEMP/deleter-original-296"

        printf ''DELETER_CAPTURE=%s\n'' "$DELETER_CAPTURE" >> "$GITHUB_ENV"

        mkdir "$DELETER_CAPTURE"

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        printf ''workflow_head=%s\nsource_commit=%s\n'' "$GITHUB_SHA" "$(git rev-parse HEAD)" > "$DELETER_CAPTURE/source.txt"

        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup

        available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)

        test "$available" -ge 26977763328

        git status --porcelain=v1 > "$DELETER_CAPTURE/source-status.before.txt"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Capture actual original reference rows and private low-space loop
      shell: bash
      run: 'set -euo pipefail

        base64 --decode <<''ORIGINAL'' > "$DELETER_CAPTURE/capture_original_deleter.py"

        

        ORIGINAL

        base64 --decode <<''PINS'' > "$DELETER_CAPTURE/source-pins.json"

        

        PINS

        printf ''e7f55a6d1055789bf91d3b889a800d74694c18e117cd53ad73c653b1a3b1513b  %s/capture_original_deleter.py\n'' "$DELETER_CAPTURE"
        | sha256sum --check --strict

        printf ''a5db00bc94130d01660693e260f4926fee4b0a28dc66d16023889c4dce36cd94  %s/source-pins.json\n'' "$DELETER_CAPTURE"
        | sha256sum --check --strict

        python -VV > "$DELETER_CAPTURE/python-provider.txt"

        PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=5s 120s python "$DELETER_CAPTURE/capture_original_deleter.py"
        --root "$GITHUB_WORKSPACE" --pins "$DELETER_CAPTURE/source-pins.json" --output "$DELETER_CAPTURE/observations" > "$DELETER_CAPTURE/capture.stdout"
        2> "$DELETER_CAPTURE/capture.stderr"

        git status --porcelain=v1 > "$DELETER_CAPTURE/source-status.after.txt"

        cmp "$DELETER_CAPTURE/source-status.before.txt" "$DELETER_CAPTURE/source-status.after.txt"

        '
    - name: Retain independent original-only observations
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: deleter-original-296
        path: ${{ runner.temp }}/deleter-original-296/
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn
