name: 296 maintained hardware runtime after HardwareInfo retirement
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/hardware-info-postdelete-296-once.yml
permissions:
  contents: read
jobs:
  hardware-runtime:
    name: rust hardware and boot runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
      EXPECTED_SOURCE: 97c33434c2fa686678fc7a15031a6ae9b90e0dd7
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 97c33434c2fa686678fc7a15031a6ae9b90e0dd7
    - name: Admit exact retired-source candidate
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libavcodec-dev libavformat-dev
        libavutil-dev libzstd-dev libzmq5 strace
    - run: rustup toolchain install 1.94.0 --profile minimal
    - run: rustup toolchain install nightly-2026-09-29 --profile minimal
    - name: Build hardware libraries and boot executables
      run: '"$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048

        cargo build --manifest-path rust/Cargo.toml -p openpilot-dev-tools -p openpilot-bootlog -p openpilot-hardware-info
        -p openpilot-hardware-control -p openpilot-amplifier -p openpilot-process-supervision --features openpilot-dev-tools/bootlog-artifact-native,openpilot-dev-tools/hardware-info-qa-native
        --bins --examples --locked

        cargo +1.94.0 test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bootlog-artifact-native --test
        bootlog_snapshot_check --test bootlog_artifact_check --locked

        rustup component add clippy --toolchain 1.94.0

        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features bootlog-artifact-native --lib
        --bin check-bootlog-artifacts --bin check-bootlog-snapshot --bin bootlog-snapshot-reference --bin bootlog-snapshot-child
        --bin build-bootlog-snapshot-reference --test bootlog_snapshot_check --test bootlog_artifact_check --locked -- -D
        warnings

        '
    - name: Build original native boot log comparisons
      run: 'rust/target/debug/build-bootlog-source --root "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hardware-runtime/original-bootlog"

        rust/target/debug/build-bootlog-source --root "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hardware-runtime/original-identifier"
        --identifier

        rust/target/debug/build-bootlog-snapshot-reference --output "$RUNNER_TEMP/hardware-runtime/snapshot-reference"

        gcc -shared -fPIC -O1 -Wall -Wextra -Werror rust/tools/bootlog_output_fault.c -ldl -o "$RUNNER_TEMP/bootlog-output-fault.so"

        gcc -shared -fPIC -O1 -Wall -Wextra -Werror rust/tools/amplifier_i2c_fixture.c -ldl -o "$RUNNER_TEMP/amplifier-i2c-fixture.so"

        '
    - name: Compare boot artifacts, upload selection and counter I/O
      run: "rust/target/debug/check-bootlog-artifacts rust/target/debug/openpilot-bootlog \"$RUNNER_TEMP/hardware-runtime/original-bootlog/original-bootlog\"\
        \ \\\n  \"$RUNNER_TEMP/hardware-runtime/bootlog\" --fault-library \"$RUNNER_TEMP/bootlog-output-fault.so\"\nrust/target/debug/check-logger-identifier\
        \ rust/target/debug/examples/logger_identifier \\\n  \"$RUNNER_TEMP/hardware-runtime/original-identifier/original-identifier\"\
        \ \"$RUNNER_TEMP/hardware-runtime/identifiers\"\nrust/target/debug/check-bootlog-snapshot rust/target/debug/examples/bootlog_snapshot\
        \ \\\n  rust/target/debug/bootlog-snapshot-reference \"$RUNNER_TEMP/hardware-runtime/snapshots\" \\\n  --params-reference\
        \ \"$RUNNER_TEMP/hardware-runtime/snapshot-reference/bootlog-params-path\" \\\n  --child rust/target/debug/bootlog-snapshot-child\
        \ --launcher rust/target/debug/openpilot-process-child\n"
    - name: Verify native HardwareInfo capture, CLI and source retirement
      run: "for name in check_hardware_info.py hardware_info_cases.py hardware_info_reference.py; do\n  test ! -e \"rust/tools/$name\"\
        \ && test ! -L \"rust/tools/$name\"\ndone\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\"\
        \ --growth-mib 2048\ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features\
        \ hardware-info-qa-native --lib hardware_info_ -- --nocapture\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path\
        \ \"$GITHUB_WORKSPACE\" --growth-mib 1024\ncargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools\
        \ --features hardware-info-qa-native --test hardware_info_qa --test hardware_info_capture --test hardware_info_retirement\
        \ -- --nocapture\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$GITHUB_WORKSPACE\" --growth-mib 1024\n\
        cargo +1.94.0 clippy --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features hardware-info-qa-native\
        \ --lib --bin check-hardware-info --test hardware_info_qa --test hardware_info_capture --test hardware_info_retirement\
        \ -- -D warnings\n"
    - name: Replay complete original HardwareInfo observations in both source-absent roots
      run: "export HARDWARE_INFO_BINARY=\"$GITHUB_WORKSPACE/rust/target/debug/examples/hardware_info\"\nexport HARDWARE_INFO_EVIDENCE=\"\
        $GITHUB_WORKSPACE/rust/crates/dev-tools/tests/fixtures/hardware-info-original\"\nexport HARDWARE_INFO_OUTPUT=\"$RUNNER_TEMP/hardware-runtime/information\"\
        \nexport HARDWARE_INFO_REQUIRE_RETIRED=1\n\"$GITHUB_WORKSPACE/rust/tools/check-disk-space\" --path \"$RUNNER_TEMP\"\
        \ --growth-mib 2048\nstrace -ff -s 16384 -o \"$RUNNER_TEMP/hardware-runtime/hardware-info.trace\" -e trace=execve,execveat,clone,fork,vfork,exit,exit_group\
        \ \\\n  cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --features hardware-info-qa-native\
        \ --test hardware_info_retirement same_elf_checks_all_original_cases_in_actual_and_private_roots -- --ignored --exact\
        \ --nocapture\n"
    - name: Compare hardware control and amplifier transactions
      run: "rust/target/debug/check-amplifier-policy rust/target/debug/examples/amplifier_trace \"$RUNNER_TEMP/hardware-runtime/amplifier-policy\"\
        \nrust/target/debug/check-amplifier-linux rust/target/debug/examples/amplifier_linux \\\n  \"$RUNNER_TEMP/amplifier-i2c-fixture.so\"\
        \ \"$RUNNER_TEMP/hardware-runtime/amplifier-io\"\nrust/target/debug/check-hardware-control-policy rust/target/debug/examples/hardware_control_trace\
        \ \"$RUNNER_TEMP/hardware-runtime/control-policy\"\nrust/target/debug/examples/hardware_control_command rust/target/debug/openpilot-process-child\
        \ \\\n  > \"$RUNNER_TEMP/hardware-runtime/command.json\" 2> \"$RUNNER_TEMP/hardware-runtime/command.stderr\"\nrust/target/debug/check-hardware-command\
        \ --evidence \"$RUNNER_TEMP/hardware-runtime\"\n"
    - name: Exercise boot file ownership and failure cleanup with AddressSanitizer
      run: "rustc +nightly-2026-09-29 --edition=2021 -Zsanitizer=address -g rust/tools/bootlog_raw_file_probe.rs -o \"$RUNNER_TEMP/boot-file-asan\"\
        \nASAN_OPTIONS=detect_leaks=1:halt_on_error=1 LD_PRELOAD=\"$RUNNER_TEMP/bootlog-output-fault.so\" BOOTLOG_OUTPUT_FAULT=close\
        \ \\\n  \"$RUNNER_TEMP/boot-file-asan\" \"$RUNNER_TEMP/hardware-runtime/file-ownership\"\n"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-hardware-runtime-evidence
        path: '${{ runner.temp }}/hardware-runtime/

          '
  native-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 97c33434c2fa686678fc7a15031a6ae9b90e0dd7
        persist-credentials: false
    - name: Hosted native CI contracts and formatting
      run: 'set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096

        rustup toolchain install 1.94.0 --profile minimal --component rustfmt

        cargo test --manifest-path rust/Cargo.toml --locked -p openpilot-dev-tools --test ci_rust_isolation --test ci_disk_bootstrap
        -- --nocapture

        cargo fmt --manifest-path rust/Cargo.toml --all -- --check

        '
