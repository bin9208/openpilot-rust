# Focused paramsd retry; accepted unchanged Eigen comparisons are not repeated here.
name: Native paramsd 296 candidate
on:
  push:
    branches: [codex/feat-296-native-tools-candidate]
    paths: [.github/workflows/native-eigen-296-once.yml]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
jobs:
  paramsd-atomic:
    name: native paramsd atomic foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CXX: clang++
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rust/tools
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 50cef9368b4ef11be28256ef410233793e6315de
    - name: Require exact candidate source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 50cef9368b4ef11be28256ef410233793e6315de

        test -z "$(git status --porcelain)"

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: rustup toolchain install 1.94.0 --profile minimal --component clippy
    - run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev capnproto libcapnp-dev libzmq3-dev
    - run: python -m pip install numpy==2.5.3 pycapnp==2.1.0 Cython==3.2.4 setuptools==82.0.1 cffi==2.1.1 sympy==1.14.0 pyzmq==27.2.0
        zstandard==0.25.0 requests==2.34.2 pyserial==3.5 pytest==9.0.2
    - name: Check atomic paramsd fixture input boundaries
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/estimation/paramsd-atomic"

        python -P -m pytest -c /dev/null --noconftest -p no:cacheprovider -q rust/tools/tests/test_paramsd_atomic_gate.py
        2>&1 | tee "$RUNNER_TEMP/estimation/paramsd-atomic/original.log"

        '
    - name: Check native paramsd atomic gate foundation alongside original cases
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/estimation/paramsd-atomic"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        sha256sum rust/tools/paramsd_startup_gate.py rust/tools/tests/test_paramsd_atomic_gate.py rust/crates/dev-tools/src/paramsd_startup_gate.rs
        rust/crates/dev-tools/tests/paramsd_startup_gate.rs > "$proof/source.sha256"

        set -euo pipefail

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features paramsd-startup-gate-native
        --test paramsd_startup_gate 2>&1 | tee "$proof/native.log"

        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 512

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --locked --features paramsd-startup-gate-native
        --lib --test paramsd_startup_gate -- -D warnings 2>&1 | tee "$proof/clippy.log"

        sha256sum --check "$proof/source.sha256"

        '
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: native-paramsd-296-evidence
        path: ${{ runner.temp }}/estimation/
        if-no-files-found: error
        retention-days: 7
