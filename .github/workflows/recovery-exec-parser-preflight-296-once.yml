name: 296 native recovery exec parser preflight
'on':
  push:
    branches:
    - codex/feat-296-native-tools-candidate
    paths:
    - .github/workflows/recovery-exec-parser-preflight-296-once.yml
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
jobs:
  recovery-exec-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 3005fd3a5c08de17b582d1f6800df8d9027c7266
        persist-credentials: false
    - name: Reserve disk and install hosted native prerequisites
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 3005fd3a5c08de17b582d1f6800df8d9027c7266

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        mkdir "$proof"

        git rev-parse HEAD > "$proof/SOURCE_COMMIT"

        printf ''%s\n'' "$GITHUB_SHA" > "$proof/WORKFLOW_COMMIT"

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 8192

        sudo apt-get update

        sudo apt-get install -y g++ capnproto libcapnp-dev pkg-config liblzma-dev

        rustup toolchain install 1.94.0 --profile minimal --component clippy

        '
    - name: Run changed native trace parser and seal regressions
      run: 'set -euo pipefail

        proof="$RUNNER_TEMP/driver-fixture-preflight"

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 4096

        cargo test --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib recovery_exec_audit::
        --locked -- --nocapture > "$proof/parser-unit.stdout" 2> "$proof/parser-unit.stderr" || { tail -n 100 "$proof/parser-unit.stderr"
        "$proof/parser-unit.stdout"; exit 1; }

        rust/tools/check-disk-space --path "$GITHUB_WORKSPACE" --growth-mib 1024

        cargo clippy --manifest-path rust/Cargo.toml -p openpilot-dev-tools --features recovery-family-native --lib --locked
        -- -D warnings > "$proof/clippy.stdout" 2> "$proof/clippy.stderr" || { tail -n 100 "$proof/clippy.stderr"; exit 1;
        }

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: rust-recovery-exec-parser-preflight-296
        path: ${{ runner.temp }}/driver-fixture-preflight/
        if-no-files-found: error
        retention-days: 5
