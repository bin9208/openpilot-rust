name: Native x64/ARM or pinned emulated ARM shell
description: Execute original commands on native hosted/private runners or in the pinned X64 to ARM user space.
inputs:
  cleanup:
    description: Finish execution evidence before owned job-temp cleanup
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.cleanup != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../../tools/ci/local-arm" prepare'
    - if: inputs.cleanup == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../../tools/ci/local-arm" finish'
