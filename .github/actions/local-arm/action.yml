name: Native or emulated architecture shell
description: Use the selected native Linux architecture and retain the pinned ARM guest only for an X64-to-ARM fallback.
inputs:
  cleanup:
    description: Finish execution evidence before owned job-temp cleanup
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.cleanup != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../../tools/ci/local-arm" prepare'
    - if: inputs.cleanup == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../../tools/ci/local-arm" finish'
