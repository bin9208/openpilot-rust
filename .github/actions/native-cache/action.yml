name: Cache immutable native inputs with a stable archive path
description: Move only this job's input directory through an owned stable staging path.
inputs:
  mode:
    description: Explicit restore or save
    required: true
  name:
    description: Job-private native input directory name
    required: true
  key:
    description: Existing independent content key
    required: true
  restore-keys:
    description: Existing fallback keys, if any
    default: ''
outputs:
  cache-hit:
    description: Exact content key restored by Actions
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: begin
      shell: bash
      env:
        NATIVE_CACHE_NAME: ${{ inputs.name }}
        NATIVE_CACHE_MODE: ${{ inputs.mode }}
      run: /usr/bin/python3 -I -B -S "$GITHUB_ACTION_PATH/../../../tools/ci/native_cache.py" begin "$NATIVE_CACHE_NAME" "$NATIVE_CACHE_MODE"
    - id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.begin.outputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - if: inputs.mode == 'save'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.begin.outputs.path }}
        key: ${{ inputs.key }}
    - if: always() && steps.begin.outcome == 'success'
      shell: bash
      env:
        NATIVE_CACHE_NAME: ${{ inputs.name }}
      run: /usr/bin/python3 -I -B -S "$GITHUB_ACTION_PATH/../../../tools/ci/native_cache.py" finish "$NATIVE_CACHE_NAME"
