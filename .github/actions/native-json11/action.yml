name: Build native JSON11 stager
description: Build the current source's host dependency tool before original binding comparisons
inputs:
  run-shell:
    description: Shell used to build and execute native tools
    required: false
    default: bash
runs:
  using: composite
  steps:
    - name: Reserve capacity and compile the host stager
      shell: ${{ inputs.run-shell }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
        native_host=$(rustc +1.94.0 -vV | sed -n 's/^host: //p')
        test -n "$native_host"
        env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_TARGET -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER \
          -u CC -u CXX -u CFLAGS -u CXXFLAGS -u CPPFLAGS -u LDFLAGS \
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 \
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust/target" \
          cargo +1.94.0 build --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" \
            -p openpilot-dev-tools --locked --features ci-receipt-metadata-native --bin stage-json11 --bin ci-receipt-metadata --target "$native_host"
        printf 'JSON11_STAGER=%s/rust/target/%s/debug/stage-json11\n' "$GITHUB_WORKSPACE" "$native_host" >> "$GITHUB_ENV"
        printf 'CI_RECEIPT_METADATA=%s/rust/target/%s/debug/ci-receipt-metadata\n' "$GITHUB_WORKSPACE" "$native_host" >> "$GITHUB_ENV"
        printf 'NATIVE_TOOLS_HOST=%s\n' "$native_host" >> "$GITHUB_ENV"
