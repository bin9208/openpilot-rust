name: Stage native Eigen headers
description: Stage the pinned Eigen C++ header tree without executing the Python shim
inputs:
  architecture:
    description: Pinned release header archive architecture
    required: true
runs:
  using: composite
  steps:
    - name: Build host stager and verify the pinned header archive
      shell: bash
      env:
        EIGEN_STAGE_ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        set -euo pipefail
        case "$EIGEN_STAGE_ARCHITECTURE" in
          x86_64) platform=linux_x86_64 ;;
          aarch64) platform=linux_aarch64 ;;
          macos-arm64) platform=macosx_11_0_arm64 ;;
          *) printf 'Unsupported Eigen architecture\n' >&2; exit 1 ;;
        esac
        proof="$RUNNER_TEMP/native-eigen-$EIGEN_STAGE_ARCHITECTURE"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 2048
        mkdir -p "$proof"
        native_host=$(rustc +1.94.0 -vV | sed -n 's/^host: //p')
        test -n "$native_host"
        env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_TARGET -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER \
          -u CC -u CXX -u CFLAGS -u CXXFLAGS -u CPPFLAGS -u LDFLAGS \
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 \
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust/target" \
          cargo +1.94.0 build --manifest-path "$GITHUB_WORKSPACE/rust/Cargo.toml" \
            -p openpilot-dev-tools --locked --features eigen-tools-native --bin stage-eigen-headers --target "$native_host" 2>&1 | tee "$proof/build.log"
        stager="$GITHUB_WORKSPACE/rust/target/$native_host/debug/stage-eigen-headers"
        sha256sum "$stager" > "$proof/stager.sha256"
        git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$proof/SOURCE_COMMIT"
        "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 64
        wheel="$proof/eigen-3.4.0-py3-none-$platform.whl"
        curl --fail --location --retry 3 --max-time 180 --output "$wheel" "https://github.com/commaai/dependencies/releases/download/eigen/v3.4.0/eigen-3.4.0-py3-none-$platform.whl"
        "$stager" --wheel "$wheel" --output "$proof/staged" --architecture "$EIGEN_STAGE_ARCHITECTURE" > "$proof/result.json"
        sha256sum --check "$proof/stager.sha256"
        printf 'LOCATIOND_EIGEN_INCLUDE=%s/staged/install\nPARAMSD_EIGEN_INCLUDE=%s/staged/install\n' "$proof" "$proof" >> "$GITHUB_ENV"
    - name: Retain native Eigen source and archive identities
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: native-eigen-headers-${{ inputs.architecture }}
        path: ${{ runner.temp }}/native-eigen-${{ inputs.architecture }}/
        if-no-files-found: warn
