[package]
name = "openpilot-carrot-navi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:futures-util", "dep:nix", "dep:getrandom", "dep:rustix", "dep:openpilot-params", "dep:openpilot-beepd", "dep:openpilot-messaging", "dep:openpilot-cereal", "dep:capnp", "dep:base64"]

[dependencies]
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-runtime-core = { path = "../runtime-core" }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
unicode-general-category = "=0.6.0"
thiserror = "2"
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "time", "sync", "signal", "io-util"], optional = true }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"], optional = true }
hyper = { version = "=1.11.1", features = ["http1", "server"], optional = true }
hyper-util = { version = "=0.1.21", features = ["tokio"], optional = true }
http-body-util = { version = "=0.1.5", optional = true }
bytes = { version = "=1.12.1", optional = true }
futures-util = { version = "=0.3.34", features = ["sink"], optional = true }
nix = { version = "=0.31.3", default-features = false, features = ["net", "hostname"], optional = true }
getrandom = { version = "=0.4.3", optional = true }
rustix = { version = "=1.1.5", features = ["time"], optional = true }
openpilot-params = { path = "../params", optional = true }
openpilot-beepd = { path = "../beepd", optional = true }
openpilot-messaging = { path = "../messaging", default-features = false, optional = true }
openpilot-cereal = { path = "../cereal", optional = true }
capnp = { version = "=0.27.2", optional = true }
base64 = { version = "=0.22.1", optional = true }

[lints]
workspace = true

[[bin]]
name = "openpilot-carrot-navi"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "carrot-navi-wire"
required-features = ["native"]
