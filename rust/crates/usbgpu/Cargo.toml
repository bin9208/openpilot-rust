[package]
name = "openpilot-usbgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND LGPL-2.1-or-later"
publish = false

[features]
default = ["native-skip-miri"]
native-skip-miri = ["dep:libloading", "dep:libc", "dep:openpilot-model-runtime"]
fixture-inspection = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-model-runtime = { path = "../model-runtime", optional = true }
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
rustix = { version = "1", features = ["fs", "process", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
signal-hook = "0.3"
parking_lot = "0.12"
url = "=2.5.8"
sha2 = "0.10"

[[bin]]
name = "openpilot-usbgpu-check"
path = "src/bin/check.rs"

[[bin]]
name = "openpilot-usbgpu-probe"
path = "src/bin/probe.rs"
required-features = ["native-skip-miri"]

[[bin]]
name = "openpilot-usbgpu-worker"
path = "src/bin/worker.rs"
required-features = ["native-skip-miri"]

[[example]]
name = "hcq_link_snapshot"
required-features = ["fixture-inspection"]

[[example]]
name = "usb_boundary_fixture"
required-features = ["native-skip-miri"]
