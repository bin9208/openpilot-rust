[package]
name = "openpilot-usbgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND LGPL-2.1-or-later"
publish = false

[features]
default = ["native-skip-miri"]
native-skip-miri = ["dep:libloading", "dep:libc"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
signal-hook = "0.3"
parking_lot = "0.12"
url = "=2.5.8"

[[bin]]
name = "openpilot-usbgpu-check"
path = "src/bin/check.rs"


[[example]]
name = "usb_boundary_fixture"
required-features = ["native-skip-miri"]
