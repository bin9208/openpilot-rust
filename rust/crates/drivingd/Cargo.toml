[package]
name = "openpilot-driving-modeld"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
visionipc-ion = ["openpilot-msgq/visionipc-ion"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-jetlink = { path = "../jetlink" }
openpilot-modeld = { path = "../modeld" }
openpilot-model-runtime = { path = "../model-runtime" }
openpilot-msgq = { path = "../msgq" }
openpilot-params = { path = "../params" }
openpilot-desire = { path = "../desire" }
openpilot-messaging = { path = "../messaging" }
openpilot-logging = { path = "../logging" }
openpilot-usbgpu = { path = "../usbgpu" }
capnp = "=0.27.2"
thiserror = "2"
libc = "0.2"
rustix = { version = "1", features = ["time", "thread"] }
signal-hook = "0.3"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
