[package]
name = "openpilot-tombstoned"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-process-supervision = { path = "../process-supervision" }
openpilot-web-upload = { path = "../web-upload" }
openpilot-params = { path = "../params" }
serde_json = "1"
openpilot-managed-entry = { path = "../managed-entry" }
openpilot-crash-reporting = { path = "../crash-reporting" }
openpilot-runtime-version = { path = "../runtime-version" }
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-logging = { path = "../logging" }
chrono = "0.4"
home = "0.5.12"
rustix = { version = "1", features = ["event", "pipe", "fs", "process"] }
thiserror = "2"
signal-hook = "0.3"
unicode-general-category = "=0.6.0"

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
