[package]
name = "openpilot-uploader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-http-transport = { path = "../http-transport" }
openpilot-deleter = { path = "../deleter" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-cereal = { path = "../cereal" }
openpilot-messaging = { path = "../messaging" }
openpilot-logging = { path = "../logging" }
openpilot-runtime-core = { path = "../runtime-core" }
capnp = "=0.27.2"
home = "0.5.12"
rustix = { version = "1", features = ["fs", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
signal-hook = "0.3"
ureq = { version = "=3.4.2", features = ["json", "gzip", "brotli", "rustls", "cookies"] }
url = "2"
rand = "0.9"
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
zstd = "=0.13.3"

[dev-dependencies]
tempfile = "3"
