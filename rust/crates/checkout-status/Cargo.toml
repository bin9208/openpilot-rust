[package]
name = "openpilot-checkout-status"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-logmessaged = { path = "../logmessaged" }
rustix = { version = "1", features = ["event", "fs"] }

[dev-dependencies]
rustix = { version = "1", features = ["process", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
