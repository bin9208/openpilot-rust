[package]
name = "openpilot-runtime-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-runtime-installer = { path = "../runtime-installer" }
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
thiserror = "2"
openpilot-process-supervision = { path = "../process-supervision" }
openpilot-runtime-version = { path = "../runtime-version" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "openpilot-launch"
path = "src/main.rs"

[[bin]]
name = "openpilot-carrot-web-watchdog"
path = "src/watchdog_main.rs"
