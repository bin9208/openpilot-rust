[package]
name = "openpilot-ui-framework"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native"]
native = ["openpilot-startup-ui/native"]

[dependencies]
openpilot-startup-ui = { path = "../startup-ui", default-features = false }
openpilot-runtime-core = { path = "../runtime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
num-traits = "0.2"

[lints]
workspace = true
