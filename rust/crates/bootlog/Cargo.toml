[package]
name = "openpilot-bootlog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
static-ffmpeg = ["openpilot-loggerd/static-ffmpeg"]

[dependencies]
capnp = "=0.27.2"
openpilot-cereal = { path = "../cereal" }
openpilot-loggerd = { path = "../loggerd" }
openpilot-logging = { path = "../logging" }
openpilot-params = { path = "../params" }
rustix = { version = "1", features = ["fs", "try_close"] }
tempfile = "3"
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
