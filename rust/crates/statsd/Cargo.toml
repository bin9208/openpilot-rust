[package]
name = "openpilot-statsd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Python-2.0"
publish = false

[lints.rust]
unsafe_code = "deny"

[dependencies]
home = "=0.5.12"
capnp = "=0.27.2"
openpilot-cereal = { path = "../cereal" }
indexmap = "=2.14.2"
openpilot-logging = { path = "../logging" }
openpilot-messaging = { path = "../messaging" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-runtime-version = { path = "../runtime-version" }
rustix = { version = "1", features = ["time"] }
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zmq = "=0.10.0"

[dev-dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "statsd-rs"
path = "src/main.rs"
