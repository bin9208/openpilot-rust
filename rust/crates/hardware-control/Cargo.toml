[package]
name = "openpilot-hardware-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-portaudio = { path = "../portaudio" }
openpilot-hardware-info = { path = "../hardware-info" }
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
openpilot-amplifier = { path = "../amplifier" }
openpilot-params = { path = "../params" }
openpilot-process-supervision = { path = "../process-supervision" }
rustix = { version = "1", features = ["fs", "time"] }
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "openpilot-reboot"
path = "src/bin/reboot.rs"
