  carrot-navi-runtime:
    name: rust Carrot Navi original and host runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: ${{ github.workspace }}/rust/tools:${{ github.workspace }}
      CARROT_NAVI_BIN: ${{ github.workspace }}/rust/target/debug/openpilot-carrot-navi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reserve runner capacity and install confirmed binding dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 8192
          sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev g++ libzmq3-dev iproute2 util-linux
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python -m pip install aiohttp==3.13.3 pycapnp==2.2.4 Cython==3.2.4 setuptools==82.0.1 psutil==7.2.2 zstandard==0.25.0 pyzmq==27.2.0 numpy==2.5.3 requests==2.34.2 pyserial==3.5
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
          mkdir -p "$RUNNER_TEMP/carrot-navi"
          printf 'CARROT_NAVI_PYTHON=%s\nCARROT_NAVI_USER=%s\n' "$(command -v python)" "$(id -un)" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/carrot-navi/source-commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/carrot-navi/python-pins.txt"
      - name: Configure original Carrot Navi IPC imports
        run: printf 'PYTHONPATH=%s/carrot-navi/bindings/msgq:%s\n' "$RUNNER_TEMP" "$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Build current native dependency stager
        uses: ./.github/actions/native-json11
      - name: Build and identify unchanged original Params and msgq bindings
        run: |
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_params_python.py --json11-stager "$JSON11_STAGER" --output "$RUNNER_TEMP/carrot-navi/bindings/params"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          python rust/tools/build_msgq_python.py --output "$RUNNER_TEMP/carrot-navi/bindings/msgq"
          "$CI_RECEIPT_METADATA" module CARROT_NAVI_PARAMS_BINDING "$RUNNER_TEMP/carrot-navi/bindings/params/provenance.json" >> "$GITHUB_ENV"
          python -P -c 'import msgq.ipc_pyx,capnp,aiohttp,psutil,zstandard; from openpilot.cereal import log,messaging; log.Event.new_message(); print(msgq.ipc_pyx.__file__); print(capnp.__version__,aiohttp.__version__,psutil.__version__,zstandard.__version__)' > "$RUNNER_TEMP/carrot-navi/imports.txt"
      - name: Verify complete original Params and receiver imports
        run: |
          python -P -c 'import os; from pathlib import Path; from card_runtime_source import load_binding; load_binding(Path(os.environ["CARROT_NAVI_PARAMS_BINDING"])); from openpilot.common.params import Params; from openpilot.selfdrive.carrot.carrot_navi import main; print("original Params and receiver imports passed")'
      - name: Require bounded native package checks and executable
        run: |
          set -o pipefail
          cargo fmt --manifest-path rust/Cargo.toml -p openpilot-carrot-navi -- --check 2>&1 | tee "$RUNNER_TEMP/carrot-navi/fmt.log"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 4096
          cargo test --manifest-path rust/Cargo.toml -p openpilot-carrot-navi --features native --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/carrot-navi/tests.log"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo build --manifest-path rust/Cargo.toml -p openpilot-carrot-navi --features native --bins --examples --locked 2>&1 | tee "$RUNNER_TEMP/carrot-navi/build.log"
          "$GITHUB_WORKSPACE/rust/tools/check-disk-space" --path "$GITHUB_WORKSPACE" --growth-mib 1024
          cargo clippy --manifest-path rust/Cargo.toml -p openpilot-carrot-navi --features native --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/carrot-navi/clippy.log"
      - name: Run existing source policy and state comparison inputs
        run: |
          python -P rust/tools/carrot_navi_cases.py "$RUNNER_TEMP/carrot-navi/inputs.json"
          python -P rust/tools/carrot_navi_source.py "$RUNNER_TEMP/carrot-navi/inputs.json" "$RUNNER_TEMP/carrot-navi/policy-source.json"
          rust/target/debug/examples/carrot-navi-policy "$RUNNER_TEMP/carrot-navi/inputs.json" > "$RUNNER_TEMP/carrot-navi/policy-native.json" 2> "$RUNNER_TEMP/carrot-navi/policy-native.stderr"
      - name: Run original and native owned socket and publication lifecycle lanes
        run: |
          for lane in socket lifecycle; do
            extra=()
            if [ "$lane" = lifecycle ]; then extra+=(--lifecycle); fi
            python -P rust/tools/carrot_navi_runtime.py --source-python "$CARROT_NAVI_PYTHON" --binding "$CARROT_NAVI_PARAMS_BINDING" --pythonpath "$RUNNER_TEMP/carrot-navi/bindings/msgq" --output "$RUNNER_TEMP/carrot-navi/$lane-source" --cereal "${extra[@]}"
            python -P rust/tools/carrot_navi_runtime.py --native-bin "$CARROT_NAVI_BIN" --binding "$CARROT_NAVI_PARAMS_BINDING" --pythonpath "$RUNNER_TEMP/carrot-navi/bindings/msgq" --output "$RUNNER_TEMP/carrot-navi/$lane-native" --cereal "${extra[@]}"
          done
      - name: Run discovery and retry in an owned network namespace
        run: |
          sudo -E env PYTHONPATH="$PYTHONPATH" unshare --net bash -euc '
            ip link set lo up
            ip address add 10.206.0.1/24 broadcast 10.206.0.255 dev lo
            runuser -u "$CARROT_NAVI_USER" --preserve-environment -- "$CARROT_NAVI_PYTHON" -P -m carrot_navi_qa.startup --source-python "$CARROT_NAVI_PYTHON" --binding "$CARROT_NAVI_PARAMS_BINDING" --output "$RUNNER_TEMP/carrot-navi/startup-source"
            runuser -u "$CARROT_NAVI_USER" --preserve-environment -- "$CARROT_NAVI_PYTHON" -P -m carrot_navi_qa.startup --native-bin "$CARROT_NAVI_BIN" --output "$RUNNER_TEMP/carrot-navi/startup-native"
          '
          python -P -m carrot_navi_qa.startup --source-python "$CARROT_NAVI_PYTHON" --binding "$CARROT_NAVI_PARAMS_BINDING" --output "$RUNNER_TEMP/carrot-navi/exhaust-source" --exhaust
          python -P -m carrot_navi_qa.startup --native-bin "$CARROT_NAVI_BIN" --output "$RUNNER_TEMP/carrot-navi/exhaust-native" --exhaust
      - name: Preserve original and native raw captures and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-carrot-navi-host-evidence
          path: |
            ${{ runner.temp }}/carrot-navi/
            rust/target/debug/openpilot-carrot-navi
            rust/target/debug/examples/carrot-navi-policy
            rust/target/debug/examples/carrot-navi-wire
          if-no-files-found: warn

