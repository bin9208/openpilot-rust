[package]
name = "openpilot-dev-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
toml = "0.8"

[[bin]]
name = "check-user-docs"
path = "src/bin/check_user_docs.rs"

[[test]]
name = "user_docs"
path = "tests/user_docs.rs"
