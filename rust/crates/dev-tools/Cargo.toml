[package]
name = "openpilot-dev-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rsa = "=0.9.10"
sha1 = "=0.10.7"
base64 = "=0.22.1"
openpilot-disk-space = { path = "../disk-space" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
flate2 = "1"
tar = { version = "0.4", default-features = false }
rustix = { version = "1", features = ["fs", "process", "event"] }
regex = "1"
toml = "0.8"
xz2 = "0.1.7"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
openpilot-usbgpu = { path = "../usbgpu", default-features = false }

[[bin]]
name = "stage-brotli-provider"
path = "src/bin/stage_brotli_provider.rs"

[[bin]]
name = "check-filter-reference"
path = "src/bin/check_filter_reference.rs"

[[bin]]
name = "check-disk-space"
path = "src/bin/check_disk_space.rs"

[[bin]]
name = "check-user-docs"
path = "src/bin/check_user_docs.rs"

[[bin]]
name = "seal-runtime-package"
path = "src/bin/seal_runtime_package.rs"

[[bin]]
name = "package-runtime-release"
path = "src/bin/package_runtime_release.rs"

[[bin]]
name = "publish-runtime-release"
path = "src/bin/publish_runtime_release.rs"

[[bin]]
