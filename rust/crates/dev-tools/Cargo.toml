[package]
name = "openpilot-dev-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Native tool entrypoints are registered explicitly before they enter builds.
autobins = false

[[bin]]
name = "check-cutin-alert"
path = "src/bin/check_cutin_alert.rs"

[[bin]]
name = "check-ratekeeper"
path = "src/bin/check_ratekeeper.rs"

[[bin]]
name = "check-beep-sleep"
path = "src/bin/check_beep_sleep.rs"

[[bin]]
name = "check-beep-integer"
path = "src/bin/check_beep_integer.rs"

[[bin]]
name = "build-beep-integer-reference"
path = "src/bin/build_beep_integer_reference.rs"

[[bin]]
name = "check-beep-clock"
path = "src/bin/check_beep_clock.rs"

[[bin]]
name = "check-stats-clock"
path = "src/bin/check_stats_clock.rs"

[[bin]]
name = "check-stats-numbers"
path = "src/bin/check_stats_numbers.rs"

[[bin]]
name = "check-amplifier-policy"
path = "src/bin/check_amplifier_policy.rs"

[[bin]]
name = "check-hardware-control-policy"
path = "src/bin/check_hardware_control_policy.rs"

[[bin]]
name = "check-amplifier-linux"
path = "src/bin/check_amplifier_linux.rs"

[[bin]]
name = "amplifier-linux-reference"
path = "src/bin/amplifier_linux_reference.rs"

[[bin]]
name = "check-command-reference"
path = "src/bin/check_command_reference.rs"

[[bin]]
name = "check-command-json-boundary"
path = "src/bin/check_command_json_boundary.rs"

[[bin]]
name = "check-params-reference"
path = "src/bin/check_params_reference.rs"

[[bin]]
name = "list-cargo-tests"
path = "src/bin/list_cargo_tests.rs"

[features]
egl-reference = ["dep:openpilot-startup-ui"]
image-array = ["dep:png", "dep:gif", "dep:tiff", "dep:image", "dep:openpilot-jpeg"]
image-array-native = ["image-array", "dep:openpilot-image-codecs"]
polygon-reference = ["dep:openpilot-startup-ui", "image-array-native"]

[[test]]
name = "image_array"
required-features = ["image-array"]

[[bin]]
name = "ui-polygon-reference"
path = "src/bin/ui_polygon_reference.rs"
required-features = ["polygon-reference"]

[[bin]]
name = "check-ui-polygon"
path = "src/bin/check_ui_polygon.rs"
required-features = ["polygon-reference"]

[[test]]
name = "ui_polygon_check"
required-features = ["polygon-reference"]

[[bin]]
name = "check-ui-egl"
path = "src/bin/check_ui_egl.rs"
required-features = ["egl-reference"]

[[bin]]
name = "ui-egl-reference"
path = "src/bin/ui_egl_reference.rs"
required-features = ["egl-reference"]

[[test]]
name = "ui_egl_reference"
required-features = ["egl-reference"]

[[test]]
name = "ui_egl_check"
required-features = ["egl-reference"]

[[bin]]
name = "check-ui-translations"
path = "src/bin/check_ui_translations.rs"

[[bin]]
name = "check-ui-state"
path = "src/bin/check_ui_state.rs"

[[bin]]
name = "check-ui-scheduler"
path = "src/bin/check_ui_scheduler.rs"

[[bin]]
name = "check-ui-qr"
path = "src/bin/check_ui_qr.rs"

[[bin]]
name = "check-ui-torque-geometry"
path = "src/bin/check_ui_torque_geometry.rs"

[[bin]]
name = "check-ui-native-safety"
path = "src/bin/check_ui_native_safety.rs"

[[bin]]
name = "check-ui-native-resources"
path = "src/bin/check_ui_native_resources.rs"

[[bin]]
name = "check-ui-model-adapter"
path = "src/bin/check_ui_model_adapter.rs"

[[bin]]
name = "check-ui-training-adapter"
path = "src/bin/check_ui_training_adapter.rs"

[[bin]]
name = "check-registration-vendor"
path = "src/bin/check_registration_vendor.rs"

[[bin]]
name = "check-control-tools-policy"
path = "src/bin/check_control_tools_policy.rs"

[[bin]]
name = "check-msgq-sanitizers"
path = "src/bin/check_msgq_sanitizers.rs"

[[bin]]
name = "build-encoder-source"
path = "src/bin/build_encoder_source.rs"

[[bin]]
name = "build-athena-vision-peer"
path = "src/bin/build_athena_vision_peer.rs"

[[bin]]
name = "build-pandad-firmware-spi-fixture"
path = "src/bin/build_pandad_firmware_spi_fixture.rs"

[[bin]]
name = "check-ui-updater-handshake"
path = "src/bin/check_ui_updater_handshake.rs"

[[bin]]
name = "check-hardware-command"
path = "src/bin/check_hardware_command.rs"

[lints]
workspace = true

[dependencies]
png = { version = "=0.17.16", optional = true }
gif = { version = "=0.14.2", default-features = false, features = ["std"], optional = true }
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "jpeg", "lzw"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "dds", "tga", "jpeg", "pnm", "webp", "ico"], optional = true }
openpilot-jpeg = { path = "../jpeg", optional = true }
openpilot-image-codecs = { path = "../image-codecs", optional = true, features = ["native-sdk"] }
rsa = "=0.9.10"
sha1 = "=0.10.7"
base64 = "=0.22.1"
openpilot-disk-space = { path = "../disk-space" }
openpilot-log-format = { path = "../log-format" }
openpilot-startup-ui = { path = "../startup-ui", optional = true, default-features = false, features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
flate2 = "1"
bzip2 = "=0.6.1"
command-fds = "=0.3.3"
tar = { version = "0.4", default-features = false }
rustix = { version = "1", features = ["fs", "process", "event"] }
regex = "1"
yaml-rust2 = { version = "=0.13.0", default-features = false }
signal-hook = "0.3"
toml = "0.8"
xz2 = "0.1.7"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
openpilot-usbgpu = { path = "../usbgpu", default-features = false }

