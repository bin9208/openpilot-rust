[package]
name = "openpilot-dev-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Native tool entrypoints are registered explicitly before they enter builds.
autobins = false

[[bin]]
name = "check-ui-model-adapter"
path = "src/bin/check_ui_model_adapter.rs"

[[bin]]
name = "check-ui-training-adapter"
path = "src/bin/check_ui_training_adapter.rs"

[[bin]]
name = "check-registration-vendor"
path = "src/bin/check_registration_vendor.rs"

[[bin]]
name = "check-control-tools-policy"
path = "src/bin/check_control_tools_policy.rs"

[[bin]]
name = "check-msgq-sanitizers"
path = "src/bin/check_msgq_sanitizers.rs"

[[bin]]
name = "build-encoder-source"
path = "src/bin/build_encoder_source.rs"

[[bin]]
name = "build-athena-vision-peer"
path = "src/bin/build_athena_vision_peer.rs"

[[bin]]
name = "build-pandad-firmware-spi-fixture"
path = "src/bin/build_pandad_firmware_spi_fixture.rs"

[[bin]]
name = "check-ui-updater-handshake"
path = "src/bin/check_ui_updater_handshake.rs"

[[bin]]
name = "check-hardware-command"
path = "src/bin/check_hardware_command.rs"

[lints]
workspace = true

[dependencies]
rsa = "=0.9.10"
sha1 = "=0.10.7"
base64 = "=0.22.1"
openpilot-disk-space = { path = "../disk-space" }
openpilot-log-format = { path = "../log-format" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
flate2 = "1"
bzip2 = "=0.6.1"
tar = { version = "0.4", default-features = false }
rustix = { version = "1", features = ["fs", "process", "event"] }
regex = "1"
yaml-rust2 = { version = "=0.13.0", default-features = false }
signal-hook = "0.3"
toml = "0.8"
xz2 = "0.1.7"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
openpilot-usbgpu = { path = "../usbgpu", default-features = false }

[[bin]]
name = "stage-brotli-provider"
path = "src/bin/stage_brotli_provider.rs"

[[bin]]
name = "check-filter-reference"
path = "src/bin/check_filter_reference.rs"

[[bin]]
