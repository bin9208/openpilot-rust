[dependencies]
openpilot-messaging = { path = "../messaging", default-features = false, optional = true }
brotli = { version = "=8.0.2", optional = true }
p256 = { version = "=0.13.2", features = ["ecdsa", "pem"], optional = true }
url = { version = "=2.5.8", optional = true }
charset-norm = { version = "=3.5.1", path = "../../vendor/charset-norm", optional = true }
openpilot-params = { path = "../params", optional = true }
openpilot-logging = { path = "../logging", optional = true }
brotli-decompressor = { version = "=5.0.3", optional = true }
unicode-general-category = { version = "=0.6.0", optional = true }
openpilot-runtime-core = { path = "../runtime-core", optional = true }
openpilot-pocketfft = { path = "../pocketfft", optional = true }
openpilot-process-supervision = { path = "../process-supervision", optional = true }
nix = { version = "=0.31.3", default-features = false, features = ["process"], optional = true }
zstd = { version = "=0.13.3", optional = true }
openpilot-cereal = { path = "../cereal", optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"], optional = true }
capnp = { version = "=0.27.2", optional = true }
openpilot-process-limits = { path = "../process-limits" }
rustybuzz = { version = "=0.20.1", optional = true }
zmq = { version = "=0.10.0", optional = true }
openpilot-msgq = { path = "../msgq", optional = true }
png = { version = "=0.17.16", optional = true }
gif = { version = "=0.14.2", default-features = false, features = ["std"], optional = true }
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "jpeg", "lzw"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "dds", "tga", "jpeg", "pnm", "webp", "ico"], optional = true }
openpilot-jpeg = { path = "../jpeg", optional = true }
openpilot-image-codecs = { path = "../image-codecs", optional = true, features = ["native-sdk"] }
rsa = "=0.9.10"
sha1 = "=0.10.7"
base64 = "=0.22.1"
openpilot-disk-space = { path = "../disk-space" }
openpilot-log-format = { path = "../log-format" }
openpilot-runtime-version = { path = "../runtime-version", optional = true }
openpilot-startup-ui = { path = "../startup-ui", optional = true, default-features = false, features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
flate2 = "1"
bzip2 = "=0.6.1"
command-fds = "=0.3.3"
tar = { version = "0.4", default-features = false }
rustix = { version = "1", features = ["fs", "process", "event", "time", "thread", "stdio", "system"] }
regex = "1"
num-bigint = "=0.4.8"
yaml-rust2 = { version = "=0.13.0", default-features = false }
signal-hook = "0.3"
toml = "0.8"
xz2 = "0.1.7"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
openpilot-usbgpu = { path = "../usbgpu", default-features = false }

