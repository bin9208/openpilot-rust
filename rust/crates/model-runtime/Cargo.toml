[package]
name = "openpilot-model-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "model-run"
path = "src/bin/model-run.rs"
required-features = ["native-skip-miri"]

[[bin]]
name = "qcom-model-run"
path = "src/bin/qcom-model-run.rs"
required-features = ["native-skip-miri"]

[features]
default = ["native-skip-miri"]
native-skip-miri = ["dep:libloading", "dep:sha2", "dep:libc"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = "2"
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
