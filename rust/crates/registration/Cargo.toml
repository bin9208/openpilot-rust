[package]
name = "openpilot-registration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-uploader = { path = "../uploader" }
openpilot-http-transport = { path = "../http-transport" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-logging = { path = "../logging" }
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-runtime-version = { path = "../runtime-version" }
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "=3.4.2", features = ["json", "gzip", "brotli", "rustls", "cookies"] }
url = "2"
encoding_rs = "0.8"
charset-norm = { version = "=3.5.1", path = "../../vendor/charset-norm" }
flate2 = "1"
cookie_store = { version = "=0.22.1", default-features = false, features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
