[package]
name = "openpilot-cluster"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND GPL-3.0-or-later"
publish = false

[dependencies]
des = "=0.8.1"
num-traits = "=0.2.19"
openpilot-usbgpu = { path = "../usbgpu" }
zlib-rs = "=0.6.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
openpilot-params = { path = "../params" }
openpilot-ui-application = { path = "../ui-application" }
rustix = { version = "=1.1.5", features = ["net", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
