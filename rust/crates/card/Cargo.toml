[package]
name = "openpilot-card"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[features]
default = []
native = ["openpilot-messaging/native", "openpilot-control-policy/numerics", "dep:openpilot-msgq", "dep:openpilot-logging", "dep:rustix", "dep:libc", "dep:signal-hook"]

[dependencies]
openpilot-managed-entry = { path = "../managed-entry" }
aes = "=0.8.4"
cmac = "=0.7.2"
capnp = "=0.27.2"
chrono = "=0.4.45"
num-traits = "0.2"
num-bigint = "=0.4.8"
openpilot-can = { path = "../can" }
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-cereal = { path = "../cereal" }
openpilot-control-policy = { path = "../control-policy", default-features = false }
openpilot-desire = { path = "../desire", default-features = false }
openpilot-params = { path = "../params" }
openpilot-messaging = { path = "../messaging", default-features = false }
openpilot-msgq = { path = "../msgq", optional = true }
openpilot-logging = { path = "../logging", optional = true }
rustix = { version = "1", features = ["time", "thread"], optional = true }
libc = { version = "0.2", optional = true }
signal-hook = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"

[dev-dependencies]
zstd = "0.13"
tempfile = "3"

[[bin]]
name = "openpilot-card"
path = "src/main.rs"
required-features = ["native"]
