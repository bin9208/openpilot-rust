[package]
name = "openpilot-hardware-info"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
home = "=0.5.12"
num-bigint = "=0.4.8"
num-traits = "0.2"
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-params = { path = "../params" }
openpilot-runtime-core = { path = "../runtime-core" }
rustix = { version = "1", features = ["time"] }
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
