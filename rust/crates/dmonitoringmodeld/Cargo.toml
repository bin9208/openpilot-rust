[package]
name = "openpilot-dmonitoringmodeld"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
visionipc-ion = ["openpilot-msgq/visionipc-ion"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-modeld = { path = "../modeld" }
openpilot-model-runtime = { path = "../model-runtime" }
openpilot-msgq = { path = "../msgq" }
openpilot-messaging = { path = "../messaging", default-features = false }
openpilot-logging = { path = "../logging" }
capnp = "=0.27.2"
thiserror = "2"
libc = "0.2"
rustix = { version = "1", features = ["time", "thread"] }
signal-hook = "0.3"
