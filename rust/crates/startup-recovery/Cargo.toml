[package]
name = "openpilot-startup-recovery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-carrot-navi = { path = "../carrot-navi", default-features = false }
rustix = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
unicode-general-category = "=0.6.0"

[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
