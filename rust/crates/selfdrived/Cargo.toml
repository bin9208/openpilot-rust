[package]
name = "openpilot-selfdrived"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-beepd = { path = "../beepd" }
openpilot-cereal = { path = "../cereal" }
openpilot-logging = { path = "../logging" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-ui-framework = { path = "../ui-framework", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
