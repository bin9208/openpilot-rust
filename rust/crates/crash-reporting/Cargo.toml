[package]
name = "openpilot-crash-reporting"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-runtime-version = { path = "../runtime-version" }
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-logging = { path = "../logging" }
sentry = { version = "=0.49.3", default-features = false, features = ["ureq", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
