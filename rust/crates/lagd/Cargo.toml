[package]
name = "openpilot-lagd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-messaging = { path = "../messaging" }
openpilot-params = { path = "../params" }
openpilot-calibrationd = { path = "../calibrationd" }
openpilot-torqued = { path = "../torqued" }
openpilot-logging = { path = "../logging" }
capnp = "=0.27.2"
openpilot-pocketfft = { path = "../pocketfft" }
cxx = "1.0"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
signal-hook = "0.3"
thiserror = "2"
