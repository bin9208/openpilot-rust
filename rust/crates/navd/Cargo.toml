[package]
name = "openpilot-navd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Python-2.0"
publish = false

[features]
default = []
native = ["dep:openpilot-beepd", "dep:openpilot-hardware-info", "dep:openpilot-http-transport", "dep:openpilot-logging", "dep:openpilot-messaging", "dep:openpilot-params", "dep:openpilot-params-typed", "dep:openpilot-registration", "dep:openpilot-uploader", "dep:ureq", "dep:cookie_store", "dep:flate2", "dep:brotli-decompressor", "dep:charset-norm", "dep:rustix", "dep:signal-hook", "dep:crossbeam-channel", "dep:base64"]

[lints]
workspace = true

[dependencies]
capnp = "=0.27.2"
num-traits = "=0.2.19"
openpilot-cereal = { path = "../cereal" }
openpilot-runtime-core = { path = "../runtime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
url = "=2.5.8"
openpilot-beepd = { path = "../beepd", optional = true }
openpilot-hardware-info = { path = "../hardware-info", optional = true }
openpilot-http-transport = { path = "../http-transport", optional = true }
openpilot-logging = { path = "../logging", optional = true }
openpilot-messaging = { path = "../messaging", optional = true }
openpilot-params = { path = "../params", optional = true }
openpilot-params-typed = { path = "../params-typed", optional = true }
openpilot-registration = { path = "../registration", optional = true }
openpilot-uploader = { path = "../uploader", optional = true }
ureq = { version = "=3.4.2", features = ["json", "gzip", "brotli", "rustls", "cookies"], optional = true }
cookie_store = { version = "=0.22.1", default-features = false, features = ["preserve_order"], optional = true }
flate2 = { version = "1", optional = true }
brotli-decompressor = { version = "=5.0.3", optional = true }
charset-norm = { version = "=3.5.1", path = "../../vendor/charset-norm", optional = true }
rustix = { version = "1", features = ["time"], optional = true }
signal-hook = { version = "0.3", optional = true }
crossbeam-channel = { version = "=0.5.17", optional = true }
base64 = { version = "=0.22.1", optional = true }

[[bin]]
name = "openpilot-navd"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "navd_http"
required-features = ["native"]

[[example]]
name = "navd_config"
required-features = ["native"]

[[bin]]
name = "openpilot-set-destination"
path = "src/set_destination.rs"
required-features = ["native"]
