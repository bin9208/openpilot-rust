[package]
name = "openpilot-updated"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-process-supervision = { path = "../process-supervision" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-runtime-version = { path = "../runtime-version" }
openpilot-hardware-info = { path = "../hardware-info" }
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-logging = { path = "../logging" }
openpilot-timed = { path = "../timed" }
chrono = "=0.4.45"
indexmap = { version = "=2.14.2", features = ["serde"] }
rustix = { version = "1", features = ["fs", "process", "time"] }
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
