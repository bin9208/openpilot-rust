[package]
name = "openpilot-micd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-portaudio = { path = "../portaudio" }
openpilot-cereal = { path = "../cereal" }
openpilot-messaging = { path = "../messaging" }
openpilot-logging = { path = "../logging" }
capnp = "=0.27.2"
rustix = { version = "1", features = ["time"] }
signal-hook = "0.3"
rustfft = "=6.4.1"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
