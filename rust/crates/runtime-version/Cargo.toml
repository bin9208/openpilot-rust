[package]
name = "openpilot-runtime-version"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-logging = { path = "../logging" }
thiserror = "2"
openpilot-logmessaged = { package = "openpilot-log-format", path = "../log-format" }
openpilot-runtime-core = { path = "../runtime-core" }
unicode-general-category = "=0.6.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zmq = "=0.10.0"

[[test]]
name = "error_log_lifetime"
harness = false
