[package]
name = "openpilot-jetlink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-modeld = { path = "../modeld" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
openpilot-params = { path = "../params" }
signal-hook = "0.3"
rustix = { version = "1", features = ["time", "thread", "fs", "net", "process"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jetlinkd-rs"
path = "src/main.rs"
