[package]
name = "openpilot-jetlink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-managed-entry = { path = "../managed-entry" }
openpilot-modeld = { path = "../modeld" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
libc = "0.2"
openpilot-params = { path = "../params" }
signal-hook = "0.3"
rustix = { version = "1", features = ["time", "thread", "fs", "net", "process", "event"] }

tempfile = "3"
regex = "1"
sha2 = "0.10"
ureq = { version = "=3.4.2", features = ["rustls"] }
rustls-native-certs = "=0.8.4"
openpilot-http-transport = { path = "../http-transport" }

[dev-dependencies]

[[bin]]
name = "jetlinkd-rs"
path = "src/main.rs"
