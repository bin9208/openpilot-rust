[package]
name = "openpilot-qcomgpsd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-messaging = { path = "../messaging" }
openpilot-logging = { path = "../logging" }
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-hardware-control = { path = "../hardware-control" }
openpilot-timed = { path = "../timed" }
openpilot-http-transport = { path = "../http-transport" }
capnp = "=0.27.2"
chrono = "0.4"
num-traits = "0.2"
num-bigint = "0.4"
rustix = { version = "1", features = ["fs", "termios", "event", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "=4.10.1", default-features = false }
signal-hook = "0.3"
thiserror = "2"
ureq = { version = "=3.4.2", features = ["gzip", "brotli", "rustls"] }
