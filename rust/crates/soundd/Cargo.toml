[package]
name = "openpilot-soundd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
openpilot-beepd = { path = "../beepd" }
openpilot-cereal = { path = "../cereal" }
openpilot-hardware-info = { path = "../hardware-info" }
openpilot-logging = { path = "../logging" }
openpilot-messaging = { path = "../messaging" }
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-portaudio = { path = "../portaudio" }
capnp = "=0.27.2"
num-traits = "0.2"
thiserror = "2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
