[package]
name = "openpilot-runtime-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-runtime-installer = { path = "../runtime-installer" }
rustix = { version = "1", features = ["fs", "process"] }
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
rustix = { version = "1", features = ["stdio"] }

[[bin]]
name = "openpilot-runtime-build"
path = "src/main.rs"

[[bin]]
name = "openpilot-runtime-assets"
path = "src/assets_main.rs"

[[bin]]
name = "openpilot-runtime-inputs"
path = "src/inputs_main.rs"

[[bin]]
name = "openpilot-runtime-source"
path = "src/source_main.rs"

[[bin]]
name = "openpilot-runtime-prepare"
path = "src/prepare_main.rs"

[[bin]]
name = "openpilot-runtime-native"
path = "src/native_main.rs"

[[bin]]
name = "openpilot-native-build-scope"
path = "src/scope_main.rs"
