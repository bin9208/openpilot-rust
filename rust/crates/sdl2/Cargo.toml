[package]
name = "openpilot-sdl2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
fixture-inspection = []
gui = ["dep:cxx"]

[build-dependencies]
cxx-build = "1"

[dependencies]
cxx = { version = "1", optional = true }
libloading = "0.8"
thiserror = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[[test]]
name = "virtual_devices"
required-features = ["fixture-inspection"]

[[example]]
name = "native_font"
required-features = ["gui"]

[[example]]
name = "native_provider"
required-features = ["fixture-inspection"]
