[package]
name = "openpilot-signal-numerics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND BSD-3-Clause"
publish = false

[features]
default = []
native-skip-miri = ["dep:cxx"]

[dependencies]
cxx = { version = "=1.0.202", optional = true }

[build-dependencies]
cc = "1"
cxx-build = "=1.0.202"
sha2 = "0.10"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
