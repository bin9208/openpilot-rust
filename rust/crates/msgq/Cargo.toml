[package]
name = "openpilot-msgq"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native-skip-miri"]
native-skip-miri = ["dep:libc", "dep:nix"]
visionipc-ion = ["native-skip-miri"]
webcam-inactive-stream = ["native-skip-miri"]

[dependencies]
libc = { version = "0.2", optional = true }
nix = { version = "0.31.3", optional = true, features = ["poll", "signal"] }
thiserror = "2"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
