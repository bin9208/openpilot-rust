[package]
name = "openpilot-logging"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[dependencies]
indexmap = "=2.14.2"
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-messaging = { path = "../messaging", default-features = false }
rustix = { version = "1", features = ["thread", "system", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zmq = "=0.10.0"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
