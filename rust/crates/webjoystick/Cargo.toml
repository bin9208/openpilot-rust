[package]
name = "openpilot-webjoystick"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-managed-entry = { path = "../managed-entry" }
openpilot-params = { path = "../params" }
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "sync", "signal", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = { version = "=0.1.5" }
bytes = "=1.12.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
