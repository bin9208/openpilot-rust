[package]
name = "openpilot-locationd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native"]
solver = ["dep:cxx"]
native = ["solver", "openpilot-messaging/native", "dep:openpilot-msgq", "dep:openpilot-logging", "dep:signal-hook"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-messaging = { path = "../messaging", default-features = false }
openpilot-msgq = { path = "../msgq", optional = true }
openpilot-logging = { path = "../logging", optional = true }
openpilot-params = { path = "../params" }
capnp = "=0.27.2"
cxx = { version = "1.0", optional = true }
thiserror = "2"
rustix = { version = "1", features = ["time"] }
signal-hook = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "openpilot-locationd"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "location_trace"
required-features = ["solver"]

[[example]]
name = "location_loop"
required-features = ["solver"]

[[example]]
name = "location_peer"
required-features = ["native"]
