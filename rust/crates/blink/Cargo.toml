[package]
name = "openpilot-blink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
capnp = "=0.27.2"
rustix = { version = "1", features = ["fs"] }
openpilot-cereal = { path = "../cereal" }
openpilot-desire = { path = "../desire" }
openpilot-messaging = { path = "../messaging", default-features = false }
openpilot-params = { path = "../params" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
