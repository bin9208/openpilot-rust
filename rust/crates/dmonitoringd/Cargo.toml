[package]
name = "openpilot-dmonitoringd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-monitoring = { path = "../monitoring" }
openpilot-messaging = { path = "../messaging" }
openpilot-params = { path = "../params" }
capnp = "=0.27.2"
thiserror = "2"
libc = "0.2"
rustix = { version = "1", features = ["time", "thread"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
