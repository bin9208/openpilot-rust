[package]
name = "openpilot-cweb-push"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[dependencies]
openpilot-params = { path = "../params" }
openpilot-params-typed = { path = "../params-typed" }
openpilot-logging = { path = "../logging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
url = "=2.5.8"
rustix = { version = "1", features = ["time", "system"] }
rand = "0.9"
signal-hook = "0.3"
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "openpilot-cweb-push"
path = "src/main.rs"
