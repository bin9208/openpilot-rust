[package]
name = "openpilot-managed-entry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-crash-reporting = { path = "../crash-reporting" }
openpilot-logging = { path = "../logging" }
openpilot-logmessaged = { package = "openpilot-log-format", path = "../log-format" }
rustix = { version = "1", features = ["thread"] }
signal-hook = "0.3"
thiserror = "2"

[dev-dependencies]
openpilot-msgq = { path = "../msgq" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zmq = "=0.10.0"
