[package]
name = "openpilot-xiaoge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
native-skip-miri = ["openpilot-opencv-runtime/native-skip-miri", "openpilot-messaging/native", "openpilot-msgq/native-skip-miri", "dep:rustix", "dep:signal-hook", "dep:socket2", "dep:httparse", "dep:openpilot-params", "dep:openpilot-beepd", "dep:openpilot-jpeg"]

[lints]
workspace = true

[dependencies]
num-traits = "=0.2.19"
capnp = "=0.27.2"
openpilot-cereal = { path = "../cereal" }
openpilot-can = { path = "../can" }
openpilot-logging = { path = "../logging" }
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-jpeg = { path = "../jpeg", optional = true }
openpilot-messaging = { path = "../messaging", default-features = false }
openpilot-msgq = { path = "../msgq", default-features = false }
openpilot-params = { path = "../params", optional = true }
openpilot-beepd = { path = "../beepd", optional = true }
openpilot-opencv-runtime = { path = "../opencv-runtime", default-features = false }
openpilot-runtime-core = { path = "../runtime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
rustix = { version = "1", features = ["thread", "time"], optional = true }
signal-hook = { version = "0.3", optional = true }
socket2 = { version = "0.6", optional = true }
httparse = { version = "1", optional = true }
httpdate = "1"
url = "=2.5.8"

[[example]]
name = "xiaoge_inference_trace"
required-features = ["native-skip-miri"]

[[bin]]
name = "openpilot-xiaoge"
path = "src/main.rs"
required-features = ["native-skip-miri"]
