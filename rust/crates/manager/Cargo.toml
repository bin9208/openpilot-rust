[package]
name = "openpilot-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openpilot-bootlog = { path = "../bootlog" }
openpilot-hardware-control = { path = "../hardware-control" }
openpilot-params = { path = "../params" }
openpilot-manager-catalog = { path = "../manager-catalog" }
openpilot-process-supervision = { path = "../process-supervision" }
openpilot-checkout-status = { path = "../checkout-status" }
openpilot-runtime-version = { path = "../runtime-version" }
openpilot-registration = { path = "../registration" }
openpilot-logging = { path = "../logging" }
openpilot-logmessaged = { path = "../logmessaged" }
openpilot-messaging = { path = "../messaging" }
openpilot-cereal = { path = "../cereal" }
openpilot-crash-reporting = { path = "../crash-reporting" }
openpilot-managed-entry = { path = "../managed-entry" }
capnp = "=0.27.2"
thiserror = "2"
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustix = { version = "1", features = ["time"] }
signal-hook = "0.3"

[dev-dependencies]
openpilot-hardware-info = { path = "../hardware-info" }
serde = { version = "1", features = ["derive"] }
