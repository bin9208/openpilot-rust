[package]
name = "openpilot-torqued"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native-skip-miri"]
native-skip-miri = ["openpilot-messaging/native", "dep:libc", "dep:signal-hook", "dep:libloading"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-runtime-core = { path = "../runtime-core" }
openpilot-calibrationd = { path = "../calibrationd", default-features = false }
openpilot-messaging = { path = "../messaging", default-features = false }
openpilot-params = { path = "../params" }
capnp = "=0.27.2"
thiserror = "2"
rustix = { version = "1", features = ["thread", "time"] }
libc = { version = "0.2", optional = true }
signal-hook = { version = "0.3", optional = true }
libloading = { version = "0.8", optional = true }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "openpilot-torqued"
path = "src/main.rs"
required-features = ["native-skip-miri"]

[[example]]
name = "torque_trace"
required-features = ["native-skip-miri"]

[[example]]
name = "torque_loop"
required-features = ["native-skip-miri"]
