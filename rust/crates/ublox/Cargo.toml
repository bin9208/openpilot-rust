[package]
name = "openpilot-ublox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native"]
native = ["dep:cxx", "dep:openpilot-msgq", "dep:openpilot-messaging", "dep:openpilot-logging", "dep:openpilot-hardware-control", "dep:openpilot-params", "dep:openpilot-params-typed", "dep:signal-hook", "dep:ureq", "dep:openpilot-http-transport", "dep:openpilot-timed", "dep:url"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
openpilot-cereal = { path = "../cereal" }
openpilot-msgq = { path = "../msgq", optional = true }
openpilot-messaging = { path = "../messaging", optional = true }
openpilot-logging = { path = "../logging", optional = true }
openpilot-hardware-control = { path = "../hardware-control", optional = true }
openpilot-params = { path = "../params", optional = true }
openpilot-params-typed = { path = "../params-typed", optional = true }
capnp = "=0.27.2"
chrono = "0.4"
rustix = { version = "1", features = ["time", "termios", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
signal-hook = { version = "0.3", optional = true }
openpilot-http-transport = { path = "../http-transport", optional = true }
openpilot-timed = { path = "../timed", optional = true }
cxx = { version = "1.0", optional = true }
url = { version = "=2.5.8", optional = true }
ureq = { version = "=3.4.2", features = ["gzip", "brotli", "rustls", "cookies"], optional = true }

[build-dependencies]
cxx-build = "1.0"

[[bin]]
name = "openpilot-ubloxd"
path = "src/bin/ubloxd.rs"
required-features = ["native"]

[[bin]]
name = "openpilot-pigeond"
path = "src/bin/pigeond.rs"
required-features = ["native"]
