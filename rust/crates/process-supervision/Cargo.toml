[package]
name = "openpilot-process-supervision"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
capnp = "=0.27.2"
nix = { version = "=0.31.3", default-features = false, features = ["process"] }
openpilot-cereal = { path = "../cereal" }
openpilot-logging = { path = "../logging" }
openpilot-params = { path = "../params" }
rustix = { version = "1", features = ["process", "stdio", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
signal-hook = "0.3"

[[bin]]
name = "openpilot-process-child"
path = "src/main.rs"
