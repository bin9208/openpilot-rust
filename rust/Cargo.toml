[workspace]
members = ["crates/runtime-core", "crates/cereal", "crates/proclogd", "crates/msgq", "crates/params", "crates/params-typed", "crates/model-runtime", "crates/modeld", "crates/dmonitoringmodeld", "crates/desire", "crates/messaging", "crates/monitoring", "crates/drivingd", "crates/dmonitoringd", "crates/calibrationd", "crates/logmessaged", "crates/deleter", "crates/logging", "crates/uploader"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
