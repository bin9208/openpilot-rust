[workspace]
members = ["crates/runtime-core", "crates/cereal", "crates/proclogd", "crates/msgq", "crates/params", "crates/params-typed", "crates/model-runtime", "crates/modeld", "crates/dmonitoringmodeld", "crates/desire", "crates/messaging", "crates/monitoring", "crates/drivingd", "crates/dmonitoringd", "crates/calibrationd", "crates/logmessaged", "crates/loggerd", "crates/deleter", "crates/logging", "crates/torqued", "crates/jetlink", "crates/uploader", "crates/web-upload", "crates/dashcam-upload", "crates/journald", "crates/http-transport", "crates/timed", "crates/runtime-version", "crates/beepd", "crates/statsd", "crates/crash-reporting", "crates/tombstoned", "crates/managed-entry", "crates/process-supervision"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
