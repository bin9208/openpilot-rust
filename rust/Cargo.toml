[workspace]
members = ["crates/runtime-core", "crates/cereal", "crates/proclogd", "crates/msgq", "crates/params"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
